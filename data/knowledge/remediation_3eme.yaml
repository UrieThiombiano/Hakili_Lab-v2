  - '**Conventions.** $3x = 3 \times x$ ; $x^{2} = x \times x$ ; $2x = x + x$. Ne confonds pas carré et
    double.'
  - '**Distributivité.** $k\left(a + b\right) = ka + kb$ ; $\left(a + b\right)\left(c + d\right) = ac
    + ad + bc + bd$ (**4 produits**).'
  - '**Signe moins devant une parenthèse.** Il change tous les signes : $-\left(2x - 5\right) = -2x +
    5$.'
  - '**Factoriser.** Chercher le facteur commun (nombre, lettre ou parenthèse), puis vérifier en développant.'
  - '**Produits remarquables.** $\left(a + b\right)^{2} = a^{2} + 2ab + b^{2}$ ; $\left(a - b\right)^{2}
    = a^{2} - 2ab + b^{2}$ ; $\left(a + b\right)\left(a - b\right) = a^{2} - b^{2}$.'
  - '**En cas de doute.** Teste avec un nombre : deux expressions égales donnent le même résultat.'
  trouve_erreur:
  - faux: $3x + 5x^{2} = 8x^{3}$
    correction: 'Termes non semblables : l''expression est déjà réduite. Test : $x = 2$ donne $26 \ne
      64$.'
  - faux: $-2\left(4x - 7\right) = -8x - 14$
    correction: 'Le $-2$ multiplie aussi $-7$ : $-8x + 14$.'
  - faux: $\left(x + 3\right)^{2} = x^{2} + 9$
    correction: 'Double produit oublié : $x^{2} + 6x + 9$.'
  - faux: $x^{2} + x^{2} = x^{4}$
    correction: 'On additionne les coefficients, pas les exposants : $2x^{2}$.'
  cartographie_lacunes:
  - lacune: Réduction fausse (3x + 5x² = 8x³), distributivité mal appliquée, identités remarquables inconnues,
      factorisation impossible
    bloque_en: ch. 4, 7, 9, 11, 15
  source_path: remediation\3eme\modules_c\M05.md
- niveau: 3eme
  module: 6
  module_titre: Équations et inéquations du premier degré
  pourquoi: 'Résoudre une équation revient partout en 3ème : équations produits, systèmes, droites, problèmes.
    Tu connais les règles, c''est l''ordre des étapes et les signes qui dérapent.'
  diagnostic:
  - question: 'Trouve le nombre caché : $\dots + 17 = 45$ ; puis $7 \times \dots = 91$.'
    reponse: $28$ ; $13$
  - question: Le nombre $5$ est-il solution de $3x - 4 = 11$ ? Et le nombre $4$ ?
    reponse: oui ($11$) ; non ($8$)
  - question: 'Résous : $x + 9 = 4$.'
    reponse: $x = -5$
  - question: 'Résous : $5x - 3 = 2x + 15$.'
    reponse: $3x = 18$, $x = 6$
  - question: Résous $-3x \le 12$ et dis si $-5$ est solution.
    reponse: '$x \ge -4$ (division par $-3$ : le sens change) ; $-5$ n''est pas solution'
  lecons:
  - id: 3eme_M06_L1
    numero: '6.1'
    titre: Résoudre une équation du premier degré
    retenir:
    - 'Une **équation** est une égalité contenant une inconnue : $3x - 4 = 11$. La **résoudre**, c''est
      trouver **toutes** les valeurs qui rendent l''égalité vraie.'
    - '**Tester** un nombre, c''est le remplacer partout et comparer les deux membres. Tester n''est pas
      résoudre.'
    - '**Règle 1.** Ajouter ou soustraire un même nombre aux deux membres : si $a = b$, alors $a + c =
      b + c$.'
    - '**Règle 2.** Multiplier ou diviser les deux membres par un même nombre **non nul** : si $a = b$,
      alors $a \times c = b \times c$ ($c \ne 0$).'
    - 'En pratique : un **terme** qui change de membre change de **signe** ; un **coefficient** s''élimine
      par **division**.'
    methode:
      titre: Résoudre $ax + b = cx + d$
      etapes:
      - '**Déblaye** : développe les parenthèses (un $-$ devant change le signe de **tous** les termes)
        ; s''il y a des fractions, multiplie **chaque terme des deux membres** par un dénominateur commun.'
      - '**Regroupe** les termes en $x$ dans un membre, les nombres dans l''autre.'
      - '**Réduis** ($kx = m$), puis **divise** par $k$ : $x = \frac{m}{k}$.'
      - '**Vérifie** dans l''équation **de départ**, puis conclus par une phrase.'
    exemple_resolu: 'Résous $\frac{3x - 2}{4} = \frac{x + 3}{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On multiplie les deux membres par $4$ : les dénominateurs disparaissent. | $3x - 2 = 2\left(x
      + 3\right)$ |

      | On développe la parenthèse. | $3x - 2 = 2x + 6$ |

      | On regroupe les $x$ à gauche, les nombres à droite. | $x = 8$ |

      | **Vérification :** $\frac{22}{4} = 5{,}5$ et $\frac{11}{2} = 5{,}5$ ✓ | La solution est $8$. |


      > #### 📖 CE QU''IL FAUT RETENIR

      >

      > **L''équation produit**

      >

      > $$A \times B = 0 \quad \text{équivaut à} \quad A = 0 \text{ ou } B = 0$$

      >

      > On **n''ouvre pas** les parenthèses : chaque facteur peut être nul, l''équation a **deux** solutions.
      Ainsi $\left(x - 3\right)\left(2x + 8\right) = 0$ donne $x = 3$ ou $x = -4$.'
    erreurs_frequentes:
    - erreur: de $x + 9 = 4$, conclure $x = 5$.
      correction: 'on soustrait $9$ des deux côtés : $x = -5$.'
    - erreur: de $3x = 18$, conclure $x = 15$.
      correction: 'un coefficient se retire en **divisant** : $x = 6$. De même $-x = 13$ donne $x = -13$,
        et $\frac{x}{5} = 7$ donne $x = 35$.'
    declic: 'Une égalité à trous devenue grande — Résoudre $7x = 91$, c''est répondre à « $7$ fois quel
      nombre donne $91$ ? », l''égalité à trous $7 \times \square = 91$ de la 6ème. Si les règles te semblent
      abstraites, repasse par cette question : chaque étape de la méthode ne fait que la reformuler.'
    figures:
    - figures/m06_f1.svg
  - id: 3eme_M06_L2
    numero: '6.2'
    titre: Mettre un problème en équation
    retenir:
    - '|---|---|'
    methode:
      titre: Du problème à l'équation, et retour
      etapes:
      - '**Choisis l''inconnue** : « soit $x$ le… », avec son unité.'
      - '**Traduis** chaque information en expression de $x$, puis écris l''**égalité** imposée par le
        texte.'
      - '**Résous** (méthode du 6.1).'
      - '**Reviens au problème** : contrôle le sens (âge positif, longueur raisonnable) et **réponds par
        une phrase**.'
    exemple_resolu: 'Aminata a $14$ ans, sa mère $38$ ans. Dans combien d''années l''âge de la mère sera-t-il
      le double de celui d''Aminata ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | L''inconnue n''est pas un âge mais une durée. | Soit $x$ le nombre d''années à attendre |

      | Le temps passe pour les deux. | Aminata : $14 + x$ ; sa mère : $38 + x$ |

      | « Le double de » porte sur l''âge futur entier, d''où la parenthèse. | $38 + x = 2\left(14 + x\right)$,
      donc $x = 10$ |

      | **Vérification :** $48 = 2 \times 24$ ✓ | Dans $10$ ans. |'
    erreurs_frequentes:
    - erreur: répondre « $x = 9$ » et s'arrêter.
      correction: 'la question portait sur des âges : « la sœur a $9$ ans et Fatou $18$ ans ».'
    - erreur: traduire « le double de l'âge dans $x$ ans » par $2 \times 14 + x$.
      correction: $2\left(14 + x\right)$. Un $x$ négatif pour une longueur, un prix ou un effectif signale
        une erreur de traduction.
    declic: null
    figures: []
  - id: 3eme_M06_L3
    numero: '6.3'
    titre: Les inéquations et le sens qui change
    retenir:
    - 'Une **inéquation** compare deux expressions : $2x - 3 < 7$. Ses solutions sont en général en nombre
      **infini** : on les décrit par une condition ($x < 5$) et on les représente sur une droite graduée.'
    - 'Ajouter ou soustraire un même nombre aux deux membres : **le sens ne change pas**.'
    - 'Multiplier ou diviser par un nombre **strictement positif** : le sens ne change pas.'
    - 'Multiplier ou diviser par un nombre **strictement négatif** : **le sens change**. Ainsi $-3 < 5$,
      mais $6 > -10$.'
    methode:
      titre: Résoudre une inéquation
      etapes:
      - '**Regroupe** les termes en $x$ dans un membre, les nombres dans l''autre : ces gestes ne changent
        jamais le sens.'
      - '**Réduis** : $kx < m$ (ou $\le$, $>$, $\ge$).'
      - '**Regarde le signe de $k$ avant de diviser** : $k > 0$, on garde le sens ; $k < 0$, on **retourne**
        le symbole.'
      - '**Conclus**, représente sur une droite graduée, contrôle avec deux nombres : un gardé, un exclu.'
    exemple_resolu: 'Résous $7 - 2x \le 15$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On soustrait $7$ : une soustraction ne touche pas au sens. | $-2x \le 8$ |

      | Le coefficient vaut $-2$ : en divisant, on retourne le symbole. | $x \ge -4$ |

      | On décrit les solutions. | Tous les nombres $\ge -4$ |

      | **Vérification :** $x = 0$ : $7 \le 15$ ✓ ; $x = -5$ : $17 > 15$, exclu ✓ | |


      [SVG: figures/m06_f6.svg]

      *Figure 6.2. Frontière incluse ou exclue : le même nombre $2$, deux dessins.*


      Rond plein : la frontière est solution ($x \le 2$). Rond vide : elle ne l''est pas ($x < 2$). Cela
      décide des réponses entières : $4x - 6 > 10$ donne $x > 4$, donc le plus petit entier solution est
      $5$ ; avec $x \ge 4$, ce serait $4$. Deux conditions à la fois, comme $1 < 2x - 3 < 9$, se coupent
      en deux inéquations : $x > 2$ et $x < 6$.'
    erreurs_frequentes:
    - erreur: diviser par un négatif sans retourner le symbole.
      correction: encadre le coefficient de $x$ et regarde son signe **avant** de diviser. C'est l'erreur
        la plus fréquente du chapitre.
    - erreur: répondre par un seul nombre.
      correction: 'une inéquation a presque toujours une infinité de solutions. Le signe du coefficient
        ne dit rien de celui des solutions : $-2x > -12$ donne $x < 6$.'
    declic: null
    figures:
    - figures/m06_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Parmi $-4$, $0$ et $3$, lesquels sont solutions de $x^{2} + x = 12$ ?
    correction: $-4$ ($16 - 4 = 12$) ✓ et $3$ ($9 + 3 = 12$) ✓ ; $0$ non. Une équation peut avoir plusieurs
      solutions.
  - numero: 2
    etoiles: 1
    enonce: 'Résous : a) $x + 13 = 40$ ; b) $x - 8 = -3$ ; c) $6x = 54$ ; d) $\frac{x}{5} = 7$ ; e) $-4x
      = 22$.'
    correction: a) $27$ ; b) $5$ ; c) $9$ ; d) $35$ ; e) $-\frac{11}{2}$.
  - numero: 3
    etoiles: 1
    enonce: 'Résous : a) $2x + 7 = 19$ ; b) $5x - 9 = 3x + 11$ ; c) $8 - 3x = x + 20$.'
    correction: a) $2x = 12$, $x = 6$ ; b) $2x = 20$, $x = 10$ ; c) $-4x = 12$, $x = -3$.
  - numero: 4
    etoiles: 1
    enonce: 'Résous : a) $3\left(x - 4\right) = 2x + 1$ ; b) $\frac{2x + 5}{3} = 7$.'
    correction: a) $3x - 12 = 2x + 1$, $x = 13$ ; b) $2x + 5 = 21$, $x = 8$.
  - numero: 5
    etoiles: 1
    enonce: Je pense à un nombre, je le multiplie par $4$, j'ajoute $9$ et je trouve $57$. Quel est ce
      nombre ?
    correction: $4x + 9 = 57$, $x = 12$.
  - numero: 6
    etoiles: 1
    enonce: Un cahier coûte $150$ FCFA de plus qu'un stylo. Trois stylos et deux cahiers coûtent $1\,800$
      FCFA. Quel est le prix d'un stylo ?
    correction: '$3x + 2\left(x + 150\right) = 1\,800$, $5x = 1\,500$ : le stylo coûte $300$ FCFA (cahier
      $450$).'
  - numero: 7
    etoiles: 1
    enonce: Le périmètre d'un rectangle est $54$ cm et sa longueur dépasse sa largeur de $7$ cm. Calcule
      ses dimensions.
    correction: '$2\left(x + x + 7\right) = 54$, $x = 10$ : largeur $10$ cm, longueur $17$ cm.'
  - numero: 8
    etoiles: 1
    enonce: 'Résous et représente sur une droite graduée : a) $x + 5 > 2$ ; b) $3x \le 21$ ; c) $-5x <
      30$.'
    correction: 'a) $x > -3$ (rond vide) ; b) $x \le 7$ (rond plein) ; c) division par $-5$ : $x > -6$.'
  - numero: 9
    etoiles: 1
    enonce: 'Résous : a) $4x - 7 \ge 2x + 3$ ; b) $9 - 2x > 3 - 5x$.'
    correction: a) $2x \ge 10$, $x \ge 5$ ; b) $3x > -6$, $x > -2$.
  - numero: 10
    etoiles: 1
    enonce: Une moto-taxi facture $200$ FCFA de prise en charge plus $150$ FCFA par kilomètre. Awa dispose
      de $1\,700$ FCFA. Écris l'inéquation, résous-la, donne la distance maximale en kilomètres entiers.
    correction: '$200 + 150x \le 1\,700$, $x \le 10$ : au plus $10$ km.'
  - numero: 11
    etoiles: 1
    enonce: 'Le nombre $-3$ est-il solution de : a) $2x + 7 = 1$ ? b) $x^{2} = 9$ ? c) $5 - x = 2$ ?'
    correction: a) oui ($1$) ; b) oui ($9$) ; c) non ($8$).
  - numero: 12
    etoiles: 1
    enonce: 'Résous : a) $x + 24 = 61$ ; b) $x - 15 = -6$ ; c) $9x = -63$ ; d) $\frac{x}{7} = -4$ ; e)
      $-x = 13$.'
    correction: a) $37$ ; b) $9$ ; c) $-7$ ; d) $-28$ ; e) $-13$.
  - numero: 13
    etoiles: 1
    enonce: 'Résous : a) $3x + 8 = 29$ ; b) $7x - 5 = 44$ ; c) $12 - 5x = 2$ ; d) $\frac{x}{4} + 6 = 11$.'
    correction: a) $7$ ; b) $7$ ; c) $-5x = -10$, $x = 2$ ; d) $x = 20$.
  - numero: 14
    etoiles: 1
    enonce: 'Résous les équations produits : a) $\left(x - 5\right)\left(x + 2\right) = 0$ ; b) $3x\left(2x
      - 7\right) = 0$.'
    correction: a) $x = 5$ ou $x = -2$ ; b) $x = 0$ ou $x = \frac{7}{2}$.
  - numero: 15
    etoiles: 1
    enonce: 'Complète par $<$ ou $>$ : si $a < b$, alors a) $a + 7 \dots b + 7$ ; b) $3a \dots 3b$ ; c)
      $-2a \dots -2b$ ; d) $a - 10 \dots b - 10$.'
    correction: a) $<$ ; b) $<$ ; c) $>$ (multiplication par un négatif) ; d) $<$.
  - numero: 16
    etoiles: 1
    enonce: 'Résous et représente : a) $x - 6 \ge -2$ ; b) $5x < -35$ ; c) $-4x \ge 24$ ; d) $\frac{x}{2}
      > -3$.


      ### Entraînement ★★'
    correction: a) $x \ge 4$ (rond plein) ; b) $x < -7$ ; c) $x \le -6$ (le sens change) ; d) $x > -6$.
  - numero: 17
    etoiles: 2
    enonce: 'Résous : a) $6x + 7 = 4x + 19$ ; b) $9x - 11 = 5x + 13$ ; c) $2x + 15 = 7x - 20$ ; d) $8
      - 3x = 2x - 17$.'
    correction: a) $x = 6$ ; b) $x = 6$ ; c) $x = 7$ ; d) $x = 5$.
  - numero: 18
    etoiles: 2
    enonce: 'Résous : a) $4\left(x - 3\right) = 20$ ; b) $5\left(2x + 1\right) = 3\left(x + 4\right)$
      ; c) $\frac{3x - 1}{5} = 4$ ; d) $\frac{x}{3} = \frac{x + 4}{5}$.'
    correction: a) $x = 8$ ; b) $7x = 7$, $x = 1$ ; c) $3x - 1 = 20$, $x = 7$ ; d) $5x = 3x + 12$, $x
      = 6$.
  - numero: 19
    etoiles: 2
    enonce: Je pense à un nombre, je le triple, je retire $11$ et je trouve son double augmenté de $4$.
      Quel est ce nombre ?
    correction: $3x - 11 = 2x + 4$, $x = 15$.
  - numero: 20
    etoiles: 2
    enonce: La somme de trois entiers consécutifs vaut $141$. Quels sont ces entiers ?
    correction: '$3n + 3 = 141$, $n = 46$ : $46$, $47$, $48$.'
  - numero: 21
    etoiles: 2
    enonce: Issaka a $12$ ans et son père $40$ ans. Dans combien d'années l'âge du père sera-t-il le triple
      de celui d'Issaka ?
    correction: '$40 + x = 3\left(12 + x\right)$, $2x = 4$, $x = 2$ : dans $2$ ans.'
  - numero: 22
    etoiles: 2
    enonce: 'Une coopérative partage $265\,000$ FCFA entre trois groupements : le deuxième reçoit $20\,000$
      FCFA de plus que le premier, le troisième reçoit le double du premier. Combien reçoit chacun ?'
    correction: '$4x + 20\,000 = 265\,000$, $x = 61\,250$ : $61\,250$ ; $81\,250$ ; $122\,500$ FCFA.'
  - numero: 23
    etoiles: 2
    enonce: Un triangle isocèle a un périmètre de $56$ cm ; sa base mesure $4$ cm de moins que chacun
      des deux côtés égaux. Calcule chaque côté.
    correction: '$3c - 4 = 56$, $c = 20$ : côtés égaux $20$ cm, base $16$ cm.'
  - numero: 24
    etoiles: 2
    enonce: Safiatou achète $5$ kg de riz, paie avec $10\,000$ FCFA et on lui rend $1\,250$ FCFA. Quel
      est le prix d'un kilogramme ? (Équation exigée.)
    correction: $5p = 8\,750$, $p = 1\,750$ FCFA.
  - numero: 25
    etoiles: 2
    enonce: 'Résous : a) $3x + 5 < x + 17$ ; b) $7 - 4x \le 19$ ; c) $2\left(x - 3\right) > 5x + 9$ ;
      d) $\frac{2x - 1}{3} \ge 5$.'
    correction: a) $x < 6$ ; b) $-4x \le 12$, $x \ge -3$ ; c) $-15 > 3x$, $x < -5$ ; d) $2x - 1 \ge 15$,
      $x \ge 8$.
  - numero: 26
    etoiles: 2
    enonce: Trouve le plus petit entier solution de $5x - 8 > 27$.
    correction: '$5x > 35$, $x > 7$ : le plus petit entier est $8$.'
  - numero: 27
    etoiles: 2
    enonce: Donne trois solutions, puis trois non-solutions, de $-2x + 1 \ge 7$.
    correction: '$-2x \ge 6$, $x \le -3$. Solutions : $-3$ ; $-5$ ; $-10$. Non-solutions : $0$ ; $2$ ;
      $100$.'
  - numero: 28
    etoiles: 2
    enonce: La location de la sono d'une kermesse coûte $25\,000$ FCFA et chaque ticket est vendu $500$
      FCFA. Combien faut-il vendre de tickets au minimum pour que la recette dépasse les frais ?
    correction: '$500x > 25\,000$, $x > 50$ : au moins $51$ tickets.'
  - numero: 29
    etoiles: 2
    enonce: 'Un réservoir contient $840$ L. On en tire $35$ L par jour. Après combien de jours restera-t-il
      moins de $200$ L ?


      **Entrainement intensif : équations et inéquations à étages.** *Une transformation par ligne, vérification
      finale obligatoire.*'
    correction: '$840 - 35x < 200$, $x > \frac{640}{35} \approx 18{,}3$ : à partir du $19^{\text{e}}$
      jour.'
  - numero: 30
    etoiles: 2
    enonce: 'Résous : a) $3\left[2x - \left(x - 4\right)\right] = 27$ ; b) $5 - 2\left[3 - \left(x + 1\right)\right]
      = x + 4$ ; c) $4\left(x - 3\right) - \left[2x - \left(x + 5\right)\right] = 0$.'
    correction: a) $3\left(x + 4\right) = 27$, $x = 5$ ; b) $1 + 2x = x + 4$, $x = 3$ ; c) $3x - 7 = 0$,
      $x = \frac{7}{3}$.
  - numero: 31
    etoiles: 2
    enonce: 'Résous : a) $\frac{2x - 1}{3} = \frac{x + 4}{2}$ ; b) $\frac{x}{2} - \frac{x - 3}{5} = 3$
      ; c) $\frac{3\left(x - 2\right)}{4} + \frac{x}{6} = \frac{x + 1}{2}$.'
    correction: a) $4x - 2 = 3x + 12$, $x = 14$ ; b) ($\times 10$) $3x + 6 = 30$, $x = 8$ ; c) ($\times
      12$) $11x - 18 = 6x + 6$, $x = \frac{24}{5}$.
  - numero: 32
    etoiles: 2
    enonce: 'Résous : a) $2\left[x - 3\left(2 - x\right)\right] \le 4x + 10$ ; b) $5 - 3\left[2x - \left(x
      + 4\right)\right] > -x + 1$.


      ### ★★★ Défis de maîtrise'
    correction: a) $8x - 12 \le 4x + 10$, $x \le \frac{11}{2}$ ; b) $17 - 3x > -x + 1$, $x < 8$.
  - numero: 33
    etoiles: 3
    enonce: Résous $\frac{x + 3}{4} - \frac{x - 1}{6} = 2$.
    correction: 'On cherche à faire disparaître les dénominateurs : on multiplie tout par $12$. $3\left(x
      + 3\right) - 2\left(x - 1\right) = 24$, soit $x + 11 = 24$ et $x = 13$. Vérification : $4 - 2 =
      2$ ✓.'
  - numero: 34
    etoiles: 3
    enonce: Trouve tous les entiers $n$ tels que $3n - 7 < 2n + 5 < 4n - 1$.
    correction: Un encadrement double se coupe en deux inéquations. $3n - 7 < 2n + 5$ donne $n < 12$ ;
      $2n + 5 < 4n - 1$ donne $n > 3$. Donc $n \in \{4\,;\,5\,;\,6\,;\,7\,;\,8\,;\,9\,;\,10\,;\,11\}$.
  - numero: 35
    etoiles: 3
    enonce: 'Un père dit : « J''ai le quadruple de l''âge de ma fille ; dans $10$ ans, je n''aurai plus
      que le double de son âge, augmenté de $10$ ans. » Quel est l''âge actuel de la fille ?'
    correction: 'L''inconnue la plus simple est l''âge de la fille, car celui du père s''en déduit. Soit
      $x$ cet âge : $4x + 10 = 2\left(x + 10\right) + 10$, soit $2x = 20$ et $x = 10$. La fille a $10$
      ans, le père $40$ ans.'
  - numero: 36
    etoiles: 3
    enonce: Résous $\frac{2\left[3x - \left(x + 5\right)\right]}{5} = \frac{3\left(x - 1\right)}{10} +
      1$.
    correction: 'On réduit d''abord le crochet : $3x - x - 5 = 2x - 5$, donc le membre de gauche vaut
      $\frac{4x - 10}{5}$. En multipliant par $10$ : $2\left(4x - 10\right) = 3\left(x - 1\right) + 10$,
      soit $5x = 27$ et $x = \frac{27}{5}$.'
  - numero: 37
    etoiles: 3
    enonce: 'Salif devait résoudre $-3\left(x - 4\right) + 2 \ge 5x - 6$. Voici sa copie.


      > Ligne 1 : $-3x - 12 + 2 \ge 5x - 6$

      > Ligne 2 : $-3x - 10 \ge 5x - 6$

      > Ligne 3 : $-3x - 5x \ge -6 + 10$

      > Ligne 4 : $-8x \ge 4$

      > Ligne 5 : $x \ge -\frac{1}{2}$


      Deux lignes sont fausses. Repère-les, dis la règle trahie par chacune, refais la résolution et représente
      les solutions.'
    correction: 'Lignes fausses : **1** et **5**. Ligne 1 : $-3\left(x - 4\right) = -3x + 12$, pas $-3x
      - 12$. Ligne 5 : on divise par $-8$, négatif, donc le sens change. Résolution : $-3x + 14 \ge 5x
      - 6$, $-8x \ge -20$, $x \le \frac{5}{2}$. Droite graduée : tout ce qui est à gauche de $2{,}5$,
      rond plein en $2{,}5$. Contrôle : $x = 0$ ✓, $x = 3$ exclu ✓.'
  - numero: 38
    etoiles: 3
    enonce: 'Une association de Kaya organise un voyage. Le car coûte $180\,000$ FCFA quel que soit l''effectif,
      et chaque participant paie $4\,500$ FCFA. a) Combien faut-il de participants au minimum pour couvrir
      le prix du car ? b) L''association veut un bénéfice d''au moins $50\,000$ FCFA et le car ne transporte
      pas plus de $60$ personnes : écris l''inéquation, résous-la, dis combien d''effectifs entiers conviennent.'
    correction: 'a) $4\,500n \ge 180\,000$, donc $n \ge 40$. b) Le bénéfice est paiements moins coût :
      $4\,500n - 180\,000 \ge 50\,000$, soit $n \ge \frac{230\,000}{4\,500} \approx 51{,}1$, donc $n \ge
      52$. Avec $n \le 60$ : les entiers de $52$ à $60$, soit **$9$ valeurs**.'
  - numero: 39
    etoiles: 3
    enonce: Un car quitte Ouagadougou pour Bobo-Dioulasso, à $360$ km, à $80$ km/h de moyenne. Une heure
      plus tard, une voiture part du même point sur le même trajet à $100$ km/h. La voiture rattrape-t-elle
      le car avant Bobo-Dioulasso ? Mets le problème en équation et conclus par une phrase.
    correction: 'L''inconnue doit décrire le même instant pour les deux véhicules : soit $t$ la durée
      depuis le départ du car. Le car a fait $80t$ km, la voiture $100\left(t - 1\right)$ km. Égalité
      : $80t = 100t - 100$, donc $t = 5$, à $400$ km de Ouagadougou. Bobo-Dioulasso étant à $360$ km,
      **la voiture ne rattrape pas le car avant Bobo-Dioulasso**.'
  - numero: 40
    etoiles: 3
    enonce: a) Trouve $b$ pour que $3x - b = 5x + 4$ ait pour solution $x = -3$. b) Trouve $a$ pour que
      $ax + 7 = 2x - 5$ ait pour solution $x = 4$. c) Pour quelle valeur de $m$ l'équation $2\left(x -
      m\right) = x + 6$ a-t-elle pour solution $x = 0$ ? d) Existe-t-il $k$ tel que $4x + k = 4x - 1$
      ait au moins une solution ? Explique.
    correction: 'On remplace $x$ par la solution donnée : l''équation devient une équation sur la lettre
      cherchée. a) $-9 - b = -11$, $b = 2$. b) $4a + 7 = 3$, $a = -1$. c) $-2m = 6$, $m = -3$. d) Il reste
      $k = -1$ : alors tout nombre est solution ; si $k \ne -1$, aucune solution.'
  - numero: 41
    etoiles: 3
    enonce: Vrai ou faux ? Prouve ou donne un contre-exemple. a) Une équation du premier degré a toujours
      exactement une solution. b) Si $2x > 6$, alors $x > 3$. c) Si $-x < 5$, alors $x < -5$. d) Multiplier
      les deux membres d'une équation par $x$ donne une équation ayant exactement les mêmes solutions.
    correction: 'a) **Faux** : $2x + 1 = 2x + 3$ n''a aucune solution, $2\left(x + 1\right) = 2x + 2$
      en a une infinité. b) **Vrai** : on divise par $2 > 0$, le sens ne change pas. c) **Faux** : $x
      = 0$ vérifie $-x < 5$ sans être $< -5$ ; la bonne conclusion est $x > -5$. d) **Faux** : $2x = 6$
      a pour solution $3$, mais $2x^{2} = 6x$ admet aussi $0$ ; multiplier par l''inconnue peut ajouter
      des solutions.'
  - numero: 42
    etoiles: 3
    enonce: a) Montre que pour tout $a \ne 2$, l'équation $ax + 3 = 2x + 3$ a une solution et une seule,
      toujours la même. b) Que se passe-t-il si $a = 2$ ? c) Montre que, quel que soit $n$, l'équation
      $x + n = 3n - x$ a pour solution $x = n$.
    correction: 'On regroupe pour faire apparaître le coefficient de $x$. a) $\left(a - 2\right)x = 0$
      ; si $a \ne 2$, on divise par $a - 2 \ne 0$ : $x = 0$, unique et indépendante de $a$. b) Si $a =
      2$ : $2x + 3 = 2x + 3$, tout nombre est solution. c) $2x = 2n$, donc $x = n$ quel que soit $n$.'
  fiche_revision:
  - '**Équation.** Égalité avec une inconnue ; résoudre, c''est trouver **toutes** les solutions.'
  - '**Deux règles.** Ajouter/soustraire un même nombre aux deux membres ; multiplier/diviser par un même
    nombre **non nul**.'
  - '**En pratique.** Un terme qui change de membre change de **signe** ; un coefficient s''élimine par
    **division**.'
  - '**Plan.** Déblayer (parenthèses, fractions) ; regrouper les $x$ ; réduire ($kx = m$) ; diviser ;
    **vérifier dans l''équation de départ** ; conclure par une phrase.'
  - '**Problèmes.** Choisir l''inconnue avec son unité ; traduire ; résoudre ; contrôler le sens ; répondre
    par une phrase.'
  - '**Inéquations.** Mêmes règles, une exception : multiplier ou diviser par un **négatif change le sens**.
    Infinité de solutions, droite graduée, rond plein si la frontière est incluse.'
  - '**Équation produit.** $A \times B = 0$ si et seulement si $A = 0$ ou $B = 0$.'
  trouve_erreur:
  - faux: $x + 9 = 4$ donc $x = 5$
    correction: 'On soustrait $9$ des deux côtés : $x = -5$.'
  - faux: $3x = 18$ donc $x = 15$
    correction: 'Un coefficient se retire en divisant : $x = 6$.'
  - faux: $-3x \le 12$ donc $x \le -4$
    correction: 'Division par un négatif : le sens change, $x \ge -4$.'
  - faux: $5x - 9 = 3x + 11 \Rightarrow 2x = 2$
    correction: 'À droite $11 + 9 = 20$ : $2x = 20$, $x = 10$.'
  cartographie_lacunes:
  - lacune: Transposition mécanique fausse, oubli du changement de sens d'une inéquation, mise en équation
      d'un problème
    bloque_en: ch. 7, 13, 15, 17
  source_path: remediation\3eme\modules_c\M06.md
- niveau: 3eme
  module: 7
  module_titre: Proportionnalité, pourcentages et grandeurs
  pourquoi: 'La proportionnalité est l''outil le plus utilisé du collège : prix, pourcentages, échelles,
    vitesses. Elle est aussi la clé cachée de Thalès, de la trigonométrie et des applications linéaires.'
  diagnostic:
  - question: 3 savons coûtent $750$ FCFA. Combien coûtent 7 savons ?
    reponse: $750 \div 3 = 250$, puis $7 \times 250 = 1\,750$ FCFA
  - question: 'Le tableau (cahiers : $2$ ; $5$ ; $8$ et prix : $700$ ; $1\,750$ ; $2\,800$ FCFA) est-il
      proportionnel ?'
    reponse: oui, coefficient $350$
  - question: Calcule $35\,\%$ de $1\,200$.
    reponse: $\frac{35}{100} \times 1\,200 = 420$
  - question: Sur une carte à l'échelle $\frac{1}{100\,000}$, deux villages sont distants de $7$ cm. Distance
      réelle en km ?
    reponse: $7 \times 100\,000$ cm $= 7$ km
  - question: Un car parcourt $180$ km en $2$ h $30$ min. Vitesse moyenne ?
    reponse: $2{,}5$ h ; $v = \frac{180}{2{,}5} = 72$ km/h
  lecons:
  - id: 3eme_M07_L1
    numero: '7.1'
    titre: Reconnaître et utiliser la proportionnalité
    retenir:
    - Deux grandeurs sont proportionnelles quand on passe de l'une à l'autre en multipliant **toujours
      par le même nombre**, le **coefficient de proportionnalité**.
    - Dans un tableau de proportionnalité, tous les quotients $\frac{\text{2e ligne}}{\text{1re ligne}}$
      sont égaux à ce coefficient.
    - 'Trois outils : le **coefficient** ; les **propriétés des colonnes** (additionner deux colonnes,
      multiplier une colonne) ; le **retour à l''unité**.'
    - '**Quatrième proportionnelle** : $\frac{a}{b} = \frac{c}{d}$ donne $a \times d = b \times c$, donc
      $d = \frac{b \times c}{a}$.'
    - 'Test graphique : points **alignés** et alignés **avec l''origine**. Autrement dit, zéro donne zéro.'
    methode:
      titre: Résoudre un problème de proportionnalité
      etapes:
      - '**Vérifie** que la situation est proportionnelle (ni part fixe, ni tarif dégressif, ni puissance).'
      - Range les données en **tableau**, une grandeur par ligne, unités précisées.
      - 'Choisis l''outil le plus rapide : coefficient, colonnes, retour à l''unité, produit en croix.'
      - Calcule, contrôle l'ordre de grandeur, réponds avec l'unité.
    exemple_resolu: '5 mètres de tissu coûtent $6\,000$ FCFA. Combien coûtent 8 mètres ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Situation proportionnelle : même prix au mètre. | $5$ m $\to 6\,000$ FCFA ; $8$ m $\to x$ |

      | Retour à l''unité. | $6\,000 \div 5 = 1\,200$ FCFA le mètre |

      | On multiplie par $8$. | $x = 8 \times 1\,200 = 9\,600$ FCFA |

      | **Vérification :** $5 \times 9\,600 = 8 \times 6\,000 = 48\,000$. ✓ | |'
    erreurs_frequentes:
    - erreur: poser un produit en croix sans vérifier la situation (part fixe, âge et taille).
      correction: teste « zéro donne zéro » et la constance du quotient.
    - erreur: additionner deux **lignes** du tableau.
      correction: on additionne des **colonnes** ; on n'ajoute pas des kilogrammes à des francs.
    - erreur: croire que l'aire d'un carré est proportionnelle au côté.
      correction: côté $\times 2$ donne périmètre $\times 2$ mais aire $\times 4$.
    declic: null
    figures:
    - figures/m07_f1.svg
    - figures/m07_f2.svg
  - id: 3eme_M07_L2
    numero: '7.2'
    titre: Les pourcentages
    retenir:
    - '**Appliquer** : $35\,\%$ de $1\,200 = \frac{35}{100} \times 1\,200 = 420$.'
    - '**Calculer** : ramener la proportion à $100$. $18$ élèves sur $45$ : $\frac{18}{45} = \frac{40}{100}
      = 40\,\%$.'
    - '**Hausse de $t\,\%$** : multiplier par $1 + \frac{t}{100}$. **Baisse de $t\,\%$** : multiplier
      par $1 - \frac{t}{100}$.'
    - 'Deux variations qui s''enchaînent : leurs **coefficients se multiplient**, leurs pourcentages ne
      s''additionnent pas.'
    - '**Taux d''évolution** de $V_{d}$ à $V_{a}$ : $$t = \frac{V_{a} - V_{d}}{V_{d}} \times 100$$ Le
      dénominateur est **toujours la valeur de départ**. Positif : hausse ; négatif : baisse.'
    methode:
      titre: Traiter une hausse ou une baisse
      etapes:
      - Identifie la **valeur de départ** ; dans un énoncé à deux variations, elle change à la deuxième
        étape.
      - 'Écris le coefficient : $1 + \frac{t}{100}$ ou $1 - \frac{t}{100}$.'
      - Multiplie ; pour deux variations, multiplie les deux coefficients.
      - 'Contrôle : une hausse dépasse la valeur de départ, une baisse lui est inférieure.'
    exemple_resolu: 'La production d''une coopérative de karité de Léo est de $400$ sacs. Elle augmente
      de $10\,\%$, puis diminue de $20\,\%$. Production finale et évolution globale ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Un coefficient par variation. | hausse : $\times 1{,}10$ ; baisse : $\times 0{,}80$ |

      | La baisse porte sur le résultat de la hausse. | $400 \times 1{,}10 = 440$ ; $440 \times 0{,}80
      = 352$ sacs |

      | Coefficient global : produit des deux. | $1{,}10 \times 0{,}80 = 0{,}88$, soit $-12\,\%$ |

      | **Vérification :** $400 \times 0{,}88 = 352$ sacs. ✓ | |'
    erreurs_frequentes:
    - erreur: croire que $+15\,\%$ puis $-15\,\%$ ramène au prix initial.
      correction: la baisse porte sur le **nouveau** prix ; $\times 1{,}15 \times 0{,}85 = \times 0{,}9775$.
    - erreur: additionner des pourcentages portant sur des totaux différents.
      correction: $50\,\%$ des filles $+ 50\,\%$ des garçons ne font pas $100\,\%$ de la classe.
    declic: null
    figures: []
  - id: 3eme_M07_L3
    numero: '7.3'
    titre: Échelles, vitesse et grandeurs quotients
    retenir:
    - '**Échelle** : $$e = \frac{\text{distance sur le plan}}{\text{distance réelle}} \qquad \text{(mêmes
      unités)}$$ À l''échelle $\frac{1}{100\,000}$, $1$ cm sur la carte représente $1$ km. Une échelle
      s''écrit $\frac{1}{n}$.'
    - '**Vitesse moyenne** : $v = \frac{d}{t}$, d''où $d = v \times t$ et $t = \frac{d}{v}$.'
    - '**Masse volumique** : $\rho = \frac{m}{V}$. **Débit** : volume divisé par durée.'
    - '**Durées** : $2$ h $30$ min $= 2{,}5$ h, jamais « $2{,}30$ h ». On divise les minutes par $60$
      ; dans l''autre sens, on multiplie la partie décimale par $60$.'
    - 'Une vitesse moyenne d''aller-retour n''est pas la moyenne des vitesses : c''est distance totale
      divisée par durée totale.'
    methode:
      titre: Calculer l'échelle d'un plan
      etapes:
      - Repère les **deux longueurs qui se correspondent**, celle du plan et celle du réel.
      - '**Convertis** les deux en centimètres.'
      - Écris $e = \frac{\text{plan}}{\text{réel}}$ et simplifie.
      - Présente le résultat sous la forme $\frac{1}{n}$.
    exemple_resolu: 'Un menuisier de Ziniaré dessine un atelier. Un mur réel de $12$ m est représenté
      par $6$ cm. a) Échelle ? b) Une porte de $2{,}40$ m mesure combien sur le plan ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Même unité d''abord. | $12$ m $= 1\,200$ cm |

      | Quotient plan sur réel, simplifié. | $e = \frac{6}{1\,200} = \frac{1}{200}$ |

      | Du réel vers le plan : on divise par $200$. | $240 \div 200 = 1{,}2$ cm |

      | **Vérification :** $1{,}2 \times 200 = 240$ cm $= 2{,}40$ m. ✓ | |'
    erreurs_frequentes:
    - erreur: diviser sans convertir.
      correction: une échelle exige deux longueurs de même unité ; une vitesse en km/h exige une durée
        en **heures**.
    - erreur: croire qu'une échelle $\frac{1}{200}$ agrandit.
      correction: le réel est $200$ fois plus grand que le plan.
    declic: 'Une proportionnalité est une application linéaire — « $250$ FCFA le savon » signifie : à
      chaque nombre $x$ de savons correspond la dépense $f\left(x\right) = 250x$. On note $f : x \mapsto
      250x$ et $f\left(x\right)$ est l''**image** de $x$. En 3ème, ce sera l''application linéaire $x
      \mapsto ax$ : son coefficient $a$ est le coefficient de proportionnalité.'
    figures:
    - figures/m07_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Chaque situation est-elle proportionnelle ? Justifie. a) le prix payé et le nombre de litres
      d'essence ; b) le périmètre d'un carré et son côté ; c) l'aire d'un carré et son côté ; d) la taille
      d'un enfant et son âge.
    correction: 'a) Oui. b) Oui, $P = 4c$. c) Non : côté $\times 2$ donne aire $\times 4$. d) Non.'
  - numero: 2
    etoiles: 1
    enonce: Ces tableaux sont-ils proportionnels ? a) ($3$ ; $7$ ; $10$) et ($12$ ; $28$ ; $40$) ; b)
      ($2$ ; $4$ ; $6$) et ($5$ ; $9$ ; $13$).
    correction: 'a) Oui, coefficient $4$. b) Non : $\frac{5}{2} = 2{,}5$ mais $\frac{9}{4} = 2{,}25$.'
  - numero: 3
    etoiles: 1
    enonce: 'Recopie et complète ce tableau de proportionnalité : première ligne $4$ ; $10$ ; $\dots$
      ; $22$ ; deuxième ligne $18$ ; $\dots$ ; $63$ ; $\dots$'
    correction: 'Coefficient $\frac{18}{4} = 4{,}5$ : $10 \to 45$ ; $14 \to 63$ ; $22 \to 99$.'
  - numero: 4
    etoiles: 1
    enonce: 'Calcule la quatrième proportionnelle : a) $\frac{5}{8} = \frac{x}{56}$ ; b) $\frac{9}{x}
      = \frac{15}{35}$.'
    correction: a) $x = \frac{5 \times 56}{8} = 35$. b) $x = \frac{9 \times 35}{15} = 21$.
  - numero: 5
    etoiles: 1
    enonce: 'Calcule la quatrième proportionnelle : a) $\frac{3}{7} = \frac{x}{42}$ ; b) $\frac{x}{12}
      = \frac{25}{15}$ ; c) $\frac{2{,}5}{4} = \frac{10}{x}$.'
    correction: a) $x = 18$. b) $x = 20$. c) $x = 16$.
  - numero: 6
    etoiles: 1
    enonce: 7 kg de riz coûtent $3\,850$ FCFA. a) Prix d'un kilogramme ? b) Prix de 12 kg ? c) Combien
      de kilogrammes avec $8\,250$ FCFA ?
    correction: a) $3\,850 \div 7 = 550$ FCFA. b) $6\,600$ FCFA. c) $8\,250 \div 550 = 15$ kg.
  - numero: 7
    etoiles: 1
    enonce: 'Calcule : a) $25\,\%$ de $640$ ; b) $8\,\%$ de $4\,500$ ; c) $150\,\%$ de $300$.'
    correction: a) $160$. b) $360$. c) $450$.
  - numero: 8
    etoiles: 1
    enonce: 'Calcule : a) $30\,\%$ de $1\,500$ ; b) $12\,\%$ de $250$ ; c) $75\,\%$ de $8\,400$ ; d) $5\,\%$
      de $18\,000$.'
    correction: a) $450$. b) $30$. c) $6\,300$. d) $900$.
  - numero: 9
    etoiles: 1
    enonce: Dans une classe de $45$ élèves, $27$ sont des filles. a) Quel pourcentage représentent les
      filles ? b) Et les garçons ?
    correction: a) $\frac{27}{45} = \frac{60}{100} = 60\,\%$. b) $40\,\%$.
  - numero: 10
    etoiles: 1
    enonce: Le prix du carburant passe de $750$ à $825$ FCFA le litre. Calcule le pourcentage d'augmentation.
    correction: $\frac{75}{750} = 0{,}10$, soit $10\,\%$.
  - numero: 11
    etoiles: 1
    enonce: Sur un plan à l'échelle $\frac{1}{200}$, un mur mesure $4{,}5$ cm. a) Longueur réelle ? b)
      Quelle longueur sur le plan pour un couloir réel de $12$ m ?
    correction: a) $4{,}5 \times 200 = 900$ cm $= 9$ m. b) $1\,200 \div 200 = 6$ cm.
  - numero: 12
    etoiles: 1
    enonce: Sur une carte à l'échelle $\frac{1}{250\,000}$, la distance Ouagadougou-Ziniaré est de $14$
      cm. Calcule la distance réelle en km.
    correction: $14 \times 250\,000 = 3\,500\,000$ cm $= 35$ km.
  - numero: 13
    etoiles: 1
    enonce: La distance réelle entre deux forages est $3{,}6$ km. Quelle distance les sépare sur une carte
      à l'échelle $\frac{1}{60\,000}$ ?
    correction: $360\,000 \div 60\,000 = 6$ cm.
  - numero: 14
    etoiles: 1
    enonce: 'Convertis en heures décimales : a) $3$ h $45$ min ; b) $1$ h $12$ min ; c) $2$ h $06$ min.'
    correction: a) $3{,}75$ h. b) $1{,}2$ h. c) $2{,}1$ h.
  - numero: 15
    etoiles: 1
    enonce: 'a) Un cycliste parcourt $45$ km en $1$ h $30$ min : calcule sa vitesse moyenne. b) Combien
      de temps pour $75$ km à cette vitesse ?'
    correction: a) $\frac{45}{1{,}5} = 30$ km/h. b) $\frac{75}{30} = 2{,}5$ h $= 2$ h $30$ min.
  - numero: 16
    etoiles: 1
    enonce: 'Calcule la vitesse moyenne : a) $210$ km en $3$ h ; b) $102$ km en $1$ h $30$ min ; c) $27$
      km en $45$ min.'
    correction: a) $70$ km/h. b) $68$ km/h. c) $\frac{27}{0{,}75} = 36$ km/h.
  - numero: 17
    etoiles: 1
    enonce: Un car roule à $66$ km/h de moyenne. a) Quelle distance en $2$ h $30$ min ? b) Combien de
      temps pour $165$ km ?
    correction: a) $66 \times 2{,}5 = 165$ km. b) $2$ h $30$ min.
  - numero: 18
    etoiles: 1
    enonce: 'Un bidon contient $5$ L d''huile de karité, de masse volumique $0{,}92$ g/cm³. a) Convertis
      $5$ L en cm³. b) Calcule la masse d''huile en kg.


      ### Entraînement ★★'
    correction: a) $5\,000$ cm³. b) $0{,}92 \times 5\,000 = 4\,600$ g $= 4{,}6$ kg.
  - numero: 19
    etoiles: 2
    enonce: '6 ouvriers montent $126$ parpaings en une heure. Au même rythme individuel : a) combien de
      parpaings montent 10 ouvriers en une heure ? b) combien d''ouvriers pour $315$ parpaings en une
      heure ?'
    correction: a) $126 \div 6 = 21$ par ouvrier, donc $210$ parpaings. b) $315 \div 21 = 15$ ouvriers.
  - numero: 20
    etoiles: 2
    enonce: Une recette de dèguè pour 8 personnes demande $600$ g de mil et $2$ L de lait caillé. a) Quelles
      quantités pour 12 personnes ? b) Avec $1{,}5$ kg de mil, pour combien de personnes ?
    correction: 'a) $\times 1{,}5$ : $900$ g de mil et $3$ L de lait. b) $1\,500 \div 600 = 2{,}5$, donc
      $20$ personnes.'
  - numero: 21
    etoiles: 2
    enonce: 'Sur $1\,250$ candidats, $850$ sont admis. a) Calcule le taux de réussite. b) L''année précédente,
      le taux était de $64\,\%$ pour $1\,400$ candidats : combien d''admis ?'
    correction: a) $\frac{850}{1\,250} = 68\,\%$. b) $0{,}64 \times 1\,400 = 896$ admis.
  - numero: 22
    etoiles: 2
    enonce: 'Un téléphone coûtait $60\,000$ FCFA. Son prix baisse de $20\,\%$. a) Nouveau prix ? b) Le
      vendeur applique ensuite une hausse de $20\,\%$ : retrouve-t-on $60\,000$ FCFA ? Justifie.'
    correction: 'a) $60\,000 \times 0{,}80 = 48\,000$ FCFA. b) $48\,000 \times 1{,}20 = 57\,600$ FCFA
      : non, la hausse porte sur $48\,000$, plus petit que $60\,000$.'
  - numero: 23
    etoiles: 2
    enonce: Un commerçant augmente de $10\,\%$ le prix d'un article à $4\,500$ FCFA, puis accorde une
      remise de $10\,\%$ sur le nouveau prix. a) Prix après hausse ? b) Prix final ? c) Pourquoi ne retombe-t-on
      pas sur $4\,500$ FCFA ?
    correction: 'a) $4\,950$ FCFA. b) $4\,950 \times 0{,}90 = 4\,455$ FCFA. c) $\times 1{,}10 \times 0{,}90
      = \times 0{,}99$, soit $-1\,\%$ : la remise porte sur un prix plus élevé que la hausse.'
  - numero: 24
    etoiles: 2
    enonce: Une coopérative augmente sa production de $20\,\%$ la première année, puis de $25\,\%$ la
      deuxième. a) Par quel nombre la production initiale a-t-elle été multipliée ? b) Quel pourcentage
      global d'augmentation ?
    correction: a) $1{,}20 \times 1{,}25 = 1{,}5$. b) $+50\,\%$, et non $+45\,\%$.
  - numero: 25
    etoiles: 2
    enonce: 'Un artisan dessine le plan d''une table : le plateau, réel $1{,}60$ m, mesure $8$ cm sur
      le plan. a) Calcule l''échelle. b) La hauteur réelle est $75$ cm : quelle est-elle sur le plan ?'
    correction: a) $e = \frac{8}{160} = \frac{1}{20}$. b) $75 \div 20 = 3{,}75$ cm.
  - numero: 26
    etoiles: 2
    enonce: Le débit d'une pompe est de $40$ L/min. a) Quel volume en $1$ h $15$ min ? b) Combien de temps
      pour une citerne de $6\,000$ L ?
    correction: a) $40 \times 75 = 3\,000$ L. b) $6\,000 \div 40 = 150$ min $= 2$ h $30$ min.
  - numero: 27
    etoiles: 2
    enonce: Un pavé de bronze de $250$ cm³ a une masse de $2{,}2$ kg. a) Calcule la masse volumique en
      g/cm³. b) Masse d'une statuette de $180$ cm³ du même bronze ?
    correction: a) $\rho = \frac{2\,200}{250} = 8{,}8$ g/cm³. b) $8{,}8 \times 180 = 1\,584$ g $\approx
      1{,}6$ kg.
  - numero: 28
    etoiles: 2
    enonce: 'Moussa fait l''aller Ouaga-Koudougou ($100$ km) à $50$ km/h et le retour à $100$ km/h. Montre
      que sa vitesse moyenne sur l''aller-retour n''est pas $75$ km/h, et calcule-la.


      ### ★★★ Défis de maîtrise'
    correction: 'Aller $2$ h, retour $1$ h : $200$ km en $3$ h, donc $v = \frac{200}{3} \approx 66{,}7$
      km/h. Les durées passées à chaque vitesse diffèrent, donc les vitesses ne se moyennent pas.'
  - numero: 29
    etoiles: 3
    enonce: Trois boutiques de Bobo-Dioulasso vendent le même bidon d'huile de $5$ L. Chez $A$, le bidon
      coûte $4\,500$ FCFA. Chez $B$, trois bidons coûtent $12\,600$ FCFA. Chez $C$, le bidon est affiché
      à $4\,800$ FCFA, avec une remise de $15\,\%$ sur la totalité à partir de quatre bidons. Rakieta
      veut $12$ bidons. a) Où doit-elle acheter ? b) Combien économise-t-elle par rapport à la boutique
      la plus chère ? c) La boutique la moins chère au bidon isolé est-elle la moins chère pour $12$ bidons
      ?
    correction: 'La question porte sur $12$ bidons : on compare des prix totaux, pas des prix affichés.
      $A$ : $12 \times 4\,500 = 54\,000$ FCFA. $B$ : $4 \times 12\,600 = 50\,400$ FCFA. $C$ : $12 \times
      4\,800 = 57\,600$, puis $\times 0{,}85 = 48\,960$ FCFA. a) Chez $C$. b) $54\,000 - 48\,960 = 5\,040$
      FCFA. c) Non : au bidon isolé $B$ est la moins chère ($4\,200$ FCFA), mais pour $12$ bidons $C$
      revient à $4\,080$ FCFA le bidon.'
  - numero: 30
    etoiles: 3
    enonce: 'Le prix du sac de ciment, qui était de $4\,500$ FCFA, a augmenté de $20\,\%$ en janvier,
      puis a baissé de $20\,\%$ en mars. Un maçon affirme : « on est revenu au prix de départ ». a) Qu''en
      penses-tu ? Calcule le prix après chaque variation. b) Par quel pourcentage unique pourrait-on remplacer
      les deux variations ? c) Ce pourcentage dépend-il du prix de départ ?'
    correction: 'a) $4\,500 \times 1{,}2 = 5\,400$, puis $5\,400 \times 0{,}8 = 4\,320$ FCFA : le maçon
      a tort, il manque $180$ FCFA. La hausse porte sur $4\,500$, la baisse sur $5\,400$. b) $1{,}2 \times
      0{,}8 = 0{,}96$, soit une baisse unique de $4\,\%$. c) Non : le coefficient $0{,}96$ ne dépend pas
      du prix de départ.'
  - numero: 31
    etoiles: 3
    enonce: 'a) Après une remise de $15\,\%$, Fatimata paie une bicyclette $59\,500$ FCFA : quel était
      le prix affiché ? b) Un commerçant annonce « prix soldé $18\,000$ FCFA, soit $12\,000$ FCFA d''économie
      » : quel pourcentage de remise applique-t-il ? c) Sur une carte à l''échelle $\frac{1}{250\,000}$,
      deux villages sont distants de $7{,}2$ cm : distance réelle en km ? d) Un car a parcouru $198$ km
      en $2$ h $15$ min : vitesse moyenne ?'
    correction: a) Remise $15\,\%$ donne le coefficient $0{,}85$, donc $59\,500 \div 0{,}85 = 70\,000$
      FCFA. b) Prix initial $30\,000$ FCFA, remise $\frac{12\,000}{30\,000} = 40\,\%$. c) $7{,}2 \times
      250\,000 = 1\,800\,000$ cm $= 18$ km. d) $\frac{198}{2{,}25} = 88$ km/h.
  - numero: 32
    etoiles: 3
    enonce: 'Vrai ou faux ? Tranche, puis prouve ou donne un contre-exemple. a) Si un prix augmente de
      $50\,\%$ puis diminue de $50\,\%$, il retrouve sa valeur initiale. b) Le périmètre d''un carré est
      proportionnel à son côté, et son aire aussi. c) Un véhicule parcourt la première moitié d''un trajet
      à $40$ km/h et la seconde à $60$ km/h : sa vitesse moyenne est $50$ km/h. d) Si une grandeur est
      proportionnelle à une autre, les quotients des valeurs correspondantes sont tous égaux.'
    correction: 'a) Faux : $1{,}5 \times 0{,}5 = 0{,}75$, soit $-25\,\%$. b) Faux pour l''aire : si le
      côté double, $c^{2}$ est multipliée par $4$. c) Faux : sur $120$ km, $1{,}5$ h $+ 1$ h $= 2{,}5$
      h, donc $48$ km/h. d) Vrai : c''est la définition même de la proportionnalité.'
  - numero: 33
    etoiles: 3
    enonce: a) Un prix subit une hausse de $t\,\%$ puis une baisse de $t\,\%$. Calcule le coefficient
      global pour $t = 10$, $t = 25$, $t = 50$. b) Montre que, quel que soit le prix de départ et quelle
      que soit la valeur de $t$ (avec $0 < t < 100$), le prix final est **toujours inférieur** au prix
      de départ. c) Que devient la réponse si l'on fait d'abord la baisse ?
    correction: 'a) $0{,}99$ ; $0{,}9375$ ; $0{,}75$. b) On passe au littéral pour traiter tous les $t$
      d''un coup : le coefficient vaut $\left(1 + \frac{t}{100}\right)\left(1 - \frac{t}{100}\right) =
      1 - \left(\frac{t}{100}\right)^{2}$. Comme $0 < t < 100$, ce carré est strictement positif, donc
      le coefficient est strictement inférieur à $1$. c) Rien ne change : un produit ne dépend pas de
      l''ordre des facteurs.'
  - numero: 34
    etoiles: 3
    enonce: 'Un château d''eau contient $18$ m³ d''eau. Il alimente $120$ familles qui consomment en moyenne
      $75$ L par jour et par famille. a) Combien de jours l''eau dure-t-elle sans réapprovisionnement
      ? b) Un forage débite $45$ L par minute et fonctionne $6$ h par jour : le château se remplit-il
      plus vite qu''il ne se vide ? Compare deux débits journaliers. c) Combien de temps par jour le forage
      devrait-il fonctionner pour compenser exactement la consommation ?'
    correction: 'On ramène tout à la même unité avant de comparer. a) $18$ m³ $= 18\,000$ L et $120 \times
      75 = 9\,000$ L par jour : $2$ jours. b) Forage : $45 \times 60 \times 6 = 16\,200$ L par jour $>
      9\,000$ L, donc il se remplit, avec $7\,200$ L d''excédent. c) $9\,000 \div 45 = 200$ min, soit
      $3$ h $20$ min.'
  fiche_revision:
  - '**Proportionnalité.** Un seul coefficient d''une grandeur à l''autre ; quotients tous égaux.'
  - '**Produit en croix.** $\frac{a}{b} = \frac{c}{d} \iff ad = bc$.'
  - '**Pourcentage.** $t\,\%$ de $N$ : $\frac{t}{100} \times N$. Hausse : $\times \left(1 + \frac{t}{100}\right)$
    ; baisse : $\times \left(1 - \frac{t}{100}\right)$.'
  - '**Deux variations.** Les coefficients se multiplient, les pourcentages ne s''additionnent pas.'
  - '**Taux d''évolution.** $t = \frac{V_{a} - V_{d}}{V_{d}} \times 100$, dénominateur $=$ valeur de départ.'
  - '**Échelle.** $e = \frac{\text{plan}}{\text{réel}}$, mêmes unités. $\frac{1}{100\,000}$ : $1$ cm $\leftrightarrow$
    $1$ km.'
  - '**Vitesse, masse volumique, débit.** $v = \frac{d}{t}$ ; $\rho = \frac{m}{V}$ ; débit $= \frac{V}{t}$.
    Durées en heures décimales.'
  - '**Vers la 3ème.** Proportionnalité $=$ application linéaire $x \mapsto ax$.'
  trouve_erreur:
  - faux: « $2$ h $30 = 2{,}30$ h »
    correction: '$30$ min est la moitié d''une heure : $2$ h $30 = 2{,}5$ h.'
  - faux: 'Location $5\,000$ FCFA $+ 200$ FCFA/km : « prix proportionnel »'
    correction: 'La part fixe casse la proportionnalité : $10$ km donne $7\,000$ FCFA, $20$ km donne $9\,000$
      FCFA et non $14\,000$.'
  - faux: '$+15\,\%$ puis $-15\,\%$ : « retour au prix initial »'
    correction: $\times 1{,}15 \times 0{,}85 = \times 0{,}9775$, soit $-2{,}25\,\%$.
  - faux: $\frac{18}{45} = 18\,\%$
    correction: 'Un pourcentage se rapporte à $100$ : $\frac{18}{45} = \frac{40}{100} = 40\,\%$.'
  - faux: 'Échelle $\frac{1}{200}$ : « le plan est $200$ fois plus grand »'
    correction: Le plan est $200$ fois plus **petit** que le réel.
  cartographie_lacunes:
  - lacune: Produit en croix appliqué sans sens, pourcentages et échelles mal maîtrisés, grandeurs quotients
      (vitesse) floues
    bloque_en: ch. 5, 8, 14, 17, 19
  source_path: remediation\3eme\modules_c\M07.md
- niveau: 3eme
  module: 8
  module_titre: Droites, angles et triangles
  pourquoi: 'Confondre une définition et une propriété, citer une propriété sans la connaître : voilà
    ce qui coûte le plus de points en géométrie. On remet en place le trio droites, angles, triangles,
    base de Pythagore, des angles inscrits et de la trigonométrie.'
  diagnostic:
  - question: Deux droites sont perpendiculaires à une même troisième. Que conclure ?
    reponse: elles sont parallèles entre elles
  - question: 'Deux angles complémentaires : somme ? Supplémentaires : somme ?'
    reponse: $90°$ ; $180°$
  - question: Dans un triangle, deux angles mesurent $35°$ et $80°$. Calcule le troisième.
    reponse: $180 - \left(35 + 80\right) = 65°$
  - question: Un triangle isocèle a un angle au sommet principal de $40°$. Calcule les angles à la base.
    reponse: $\frac{180 - 40}{2} = 70°$ chacun
  - question: Qu'est-ce que la médiatrice d'un segment ? Cite sa propriété caractéristique.
    reponse: perpendiculaire au segment en son milieu ; $M$ est sur la médiatrice de $\left[AB\right]$
      si et seulement si $MA = MB$
  lecons:
  - id: 3eme_M08_L1
    numero: '8.1'
    titre: Droites parallèles et perpendiculaires
    retenir:
    - 'Deux droites **sécantes** ont un seul point commun ; **perpendiculaires** : sécantes en angle droit
      ; **parallèles** : aucun point commun, ou confondues.'
    - Par un point donné passe **une seule** parallèle et **une seule** perpendiculaire à une droite donnée.
    - $\parallel$ à une même troisième $\Rightarrow$ **parallèles** entre elles.
    - $\perp$ à une même troisième $\Rightarrow$ **parallèles** entre elles.
    - Deux droites $\parallel$, une troisième $\perp$ à l'une $\Rightarrow$ elle est $\perp$ à l'autre.
    methode:
      titre: Tracer la perpendiculaire et la parallèle passant par $A$
      etapes:
      - '**Perpendiculaire** : angle droit de l''équerre le long de $\left(d\right)$, glisse jusqu''à
        $A$ ; le pied est $H$.'
      - '**Parallèle** : trace $\left(AH\right)$, puis la perpendiculaire à $\left(AH\right)$ en $A$.'
      - Ou cale une règle contre l'équerre posée sur $\left(d\right)$ et glisse l'équerre jusqu'à $A$.
      - '**Code** la figure : petit carré, chevrons identiques.'
    exemple_resolu: '$\left(d_{1}\right) \perp \left(d\right)$, $\left(d_{2}\right) \perp \left(d\right)$
      et $\left(d_{3}\right) \parallel \left(d_{1}\right)$. Que dire de $\left(d_{3}\right)$ et $\left(d_{2}\right)$
      ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux droites, une perpendiculaire commune : deuxième propriété. | $\left(d_{1}\right) \perp \left(d\right)$
      et $\left(d_{2}\right) \perp \left(d\right)$, donc $\left(d_{1}\right) \parallel \left(d_{2}\right)$
      |

      | $\left(d_{1}\right)$ est le pont entre les deux parallélismes. | $\left(d_{3}\right) \parallel
      \left(d_{1}\right)$ et $\left(d_{1}\right) \parallel \left(d_{2}\right)$, donc $\left(d_{3}\right)
      \parallel \left(d_{2}\right)$ |

      | **Vérification :** chaque ligne cite une propriété. ✓ | |'
    erreurs_frequentes:
    - erreur: « $\left(d_{1}\right) \perp \left(d\right)$ et $\left(d_{2}\right) \perp \left(d\right)$,
        donc $\left(d_{1}\right) \perp \left(d_{2}\right)$ ».
      correction: elles sont **parallèles** ; le mot de l'hypothèse ne se recopie pas dans la conclusion.
    - erreur: justifier par « on le voit sur la figure ».
      correction: seule une propriété nommée démontre ; deux droites presque parallèles se coupent hors
        de la feuille.
    declic: null
    figures: []
  - id: 3eme_M08_L2
    numero: '8.2'
    titre: Angles et angles alternes-internes
    retenir:
    - '**Adjacents** : même sommet, un côté commun, de part et d''autre de ce côté.'
    - '**Complémentaires** : somme $90°$ ; **supplémentaires** : somme $180°$.'
    - '**Opposés par le sommet** (deux droites sécantes) : **égaux**.'
    - '**Bissectrice** de $\widehat{xOy}$ : si $\left[OP\right)$ est la bissectrice, $\widehat{xOP} =
      \widehat{POy} = \frac{\widehat{xOy}}{2}$.'
    - Droites **parallèles** $\Rightarrow$ alternes-internes (et correspondants) **égaux**.
    - '**Réciproque** : alternes-internes (ou correspondants) égaux $\Rightarrow$ droites **parallèles**.'
    methode:
      titre: Prouver un parallélisme par les angles
      etapes:
      - Repère la **sécante** commune aux deux droites.
      - 'Nomme les deux angles : alternes-internes ? correspondants ?'
      - Compare leurs mesures (calcul, opposés par le sommet…).
      - 'Conclus par la **réciproque** : angles égaux $\Rightarrow$ droites parallèles.'
    exemple_resolu: '$\left(xy\right)$ et $\left(uv\right)$ sont coupées par la sécante $\left(AB\right)$
      ; $\widehat{yAB} = 68°$ et $\widehat{ABu} = 68°$ sont alternes-internes. Les droites sont-elles
      parallèles ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On identifie la position des angles. | $\widehat{yAB}$ et $\widehat{ABu}$ sont alternes-internes
      |

      | On compare les mesures. | $\widehat{yAB} = \widehat{ABu} = 68°$ |

      | On cite la réciproque. | alternes-internes égaux $\Rightarrow \left(xy\right) \parallel \left(uv\right)$
      |

      | **Vérification :** on va des angles vers les droites, c''est bien la réciproque. ✓ | |


      > #### MÉTHODE : Bissectrice au compas

      >

      > 1. Pointe en $O$, un arc coupe les côtés en $M$ et $N$.

      > 2. Même ouverture, pointe en $M$ puis en $N$ : les arcs se coupent en $P$.

      > 3. Trace $\left[OP\right)$, puis contrôle au rapporteur (angle de $76°$ $\rightarrow$ $38°$ de
      chaque côté).'
    erreurs_frequentes:
    - erreur: confondre le théorème **direct** (parallèles $\Rightarrow$ angles égaux) et sa **réciproque**.
      correction: cite celui dont tu te sers, dans le bon sens ; des alternes-internes ne sont égaux **que
        si** les droites sont parallèles.
    - erreur: confondre complémentaires et supplémentaires.
      correction: le **c** de complémentaire va avec le **c** de coin droit ($90°$).
    declic: null
    figures:
    - figures/m08_f4.svg
  - id: 3eme_M08_L3
    numero: '8.3'
    titre: Triangles et droites remarquables
    retenir:
    - Somme des angles $= 180°$. Donc **au plus un** angle droit, **au plus un** angle obtus ; deux angles
      connus donnent le troisième par soustraction.
    - '**Isocèle en $A$** : $AB = AC$ ; sommet principal $A$, base $\left[BC\right]$ ; les angles **de
      la base** ($B$ et $C$) sont égaux et valent $\frac{180° - \widehat{A}}{2}$.'
    - '**Équilatéral** : trois angles de $60°$. **Rectangle** : les deux angles aigus sont **complémentaires**.'
    - '**Inégalité triangulaire** : le triangle existe si le plus grand côté est inférieur à la somme
      des deux autres.'
    methode:
      titre: Construire un triangle
      etapes:
      - '**Trois côtés** : trace le plus grand, puis un arc de compas depuis chaque extrémité.'
      - '**Deux côtés et l''angle compris** : un côté, l''angle au rapporteur, la longueur au compas.'
      - '**Un côté et les deux angles adjacents** : le côté, puis les deux angles à ses extrémités.'
      - '**Avant** : vérifie l''inégalité triangulaire (cas 1), ou que la somme des deux angles est $<
        180°$ (cas 3).'
    exemple_resolu: '$ABC$ est isocèle en $A$, $\widehat{BAC} = 48°$. La bissectrice de $\widehat{ABC}$
      coupe $\left[AC\right]$ en $D$. Calcule $\widehat{ABD}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Angles de la base égaux, puis somme des angles. | $\widehat{ABC} = \widehat{ACB}$ et $\widehat{ABC}
      + \widehat{ACB} + 48° = 180°$ |

      | On en déduit chaque angle de la base. | $2\,\widehat{ABC} = 132°$, donc $\widehat{ABC} = 66°$
      |

      | La bissectrice partage en deux angles égaux. | $\widehat{ABD} = \frac{66°}{2} = 33°$ |

      | **Vérification :** $48 + 66 + 66 = 180$. ✓ | |


      > #### 📖 CE QU''IL FAUT RETENIR

      >

      > **Les droites remarquables**

      >

      > - **Médiatrice** d''un côté : perpendiculaire à ce côté en son milieu. $M$ est sur la médiatrice
      de $\left[AB\right]$ **si et seulement si** $MA = MB$ : c''est le sens retour qui localise un point.
      Les trois médiatrices concourent au centre du **cercle circonscrit**.

      > - **Hauteur** : d''un sommet, perpendiculaire au côté opposé.

      > - **Médiane** : d''un sommet au **milieu** du côté opposé.

      > - Elles ne se confondent que dans un triangle isocèle en $A$ : hauteur, médiane, médiatrice issues
      de $A$ et bissectrice de $\widehat{BAC}$ sont la même droite.


      [SVG: figures/m08_f11.svg]

      *Figure 8.3 : hauteur, médiane et médiatrice sur la même base $\left[BC\right]$.*


      > #### DÉCLIC : La somme des angles prépare toute la 3ème

      >

      > Angles inscrits, trigonométrie, polygones : tout finit par « somme $= 180°$ » ou par un triangle
      isocèle (deux rayons d''un cercle en forment toujours un). Si un calcul d''angle bloque, cherche
      le triangle caché et demande-toi quel angle tu y connais déjà.


      ---'
    erreurs_frequentes: []
    declic: 'La somme des angles prépare toute la 3ème — Angles inscrits, trigonométrie, polygones : tout
      finit par « somme $= 180°$ » ou par un triangle isocèle (deux rayons d''un cercle en forment toujours
      un). Si un calcul d''angle bloque, cherche le triangle caché et demande-toi quel angle tu y connais
      déjà.'
    figures:
    - figures/m08_f8.svg
    - figures/m08_f11.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Trace une droite $\left(d\right)$ et un point $A$ extérieur. Construis à l'équerre la perpendiculaire
      à $\left(d\right)$ passant par $A$, puis la parallèle à $\left(d\right)$ passant par $A$.
    correction: Équerre le long de $\left(d\right)$ pour la perpendiculaire par $A$ ; perpendiculaire
      à celle-ci en $A$ pour la parallèle.
  - numero: 2
    etoiles: 1
    enonce: $\left(d_{1}\right) \parallel \left(d_{2}\right)$ et $\left(d_{3}\right) \perp \left(d_{1}\right)$.
      Que dire de $\left(d_{3}\right)$ et $\left(d_{2}\right)$ ? Cite la propriété.
    correction: '$\left(d_{3}\right) \perp \left(d_{2}\right)$ : si deux droites sont parallèles, toute
      perpendiculaire à l''une est perpendiculaire à l''autre.'
  - numero: 3
    etoiles: 1
    enonce: 'Vrai ou faux ? Justifie : « deux droites perpendiculaires à une même droite sont perpendiculaires
      entre elles ».'
    correction: 'Faux : elles sont **parallèles** entre elles (propriété de liaison).'
  - numero: 4
    etoiles: 1
    enonce: Trace $\left[AB\right]$ de $8$ cm. Place $C$ tel que $AC = 5$ cm et $BC = 6$ cm. Construis
      la perpendiculaire à $\left(AB\right)$ passant par $C$, puis la parallèle à $\left(AB\right)$ passant
      par $C$.
    correction: $C$ à l'intersection des arcs de rayons $5$ cm et $6$ cm ; puis équerre pour la perpendiculaire,
      équerre glissée pour la parallèle.
  - numero: 5
    etoiles: 1
    enonce: $\left(d_{1}\right) \parallel \left(d_{2}\right)$ et $\left(d_{2}\right) \parallel \left(d_{3}\right)$.
      Démontre que $\left(d_{1}\right) \parallel \left(d_{3}\right)$ en citant la propriété.
    correction: Deux droites parallèles à une même troisième sont parallèles entre elles, donc $\left(d_{1}\right)
      \parallel \left(d_{3}\right)$.
  - numero: 6
    etoiles: 1
    enonce: '$\left(AB\right) \perp \left(d\right)$ et $\left(CD\right) \perp \left(d\right)$. a) Que
      dire de $\left(AB\right)$ et $\left(CD\right)$ ? b) $\left(d''\right) \perp \left(AB\right)$ : que
      dire de $\left(d''\right)$ et $\left(CD\right)$ ? Justifie.'
    correction: a) $\left(AB\right) \parallel \left(CD\right)$ (deux perpendiculaires à une même droite).
      b) $\left(d'\right) \perp \left(CD\right)$.
  - numero: 7
    etoiles: 1
    enonce: Deux angles adjacents $\widehat{xOy} = 37°$ et $\widehat{yOz}$ sont complémentaires. Calcule
      $\widehat{yOz}$, puis le supplémentaire de $\widehat{xOz}$.
    correction: $\widehat{yOz} = 90 - 37 = 53°$ ; $\widehat{xOz} = 90°$, son supplémentaire vaut $90°$.
  - numero: 8
    etoiles: 1
    enonce: Deux parallèles sont coupées par une sécante ; un angle alterne-interne mesure $115°$. Donne
      l'autre, puis l'angle correspondant associé.
    correction: $115°$ (parallèles) ; l'angle correspondant vaut aussi $115°$.
  - numero: 9
    etoiles: 1
    enonce: Construis $\widehat{xOy} = 76°$ au rapporteur, puis sa bissectrice au compas. Vérifie au rapporteur.
    correction: Construction ; chaque demi-angle mesure $38°$.
  - numero: 10
    etoiles: 1
    enonce: 'Calcule le complémentaire puis le supplémentaire de : a) $25°$ ; b) $61°$ ; c) $89°$.'
    correction: 'Complémentaires : $65°$ ; $29°$ ; $1°$. Supplémentaires : $155°$ ; $119°$ ; $91°$.'
  - numero: 11
    etoiles: 1
    enonce: Deux droites sécantes en $O$ forment quatre angles ; l'un mesure $54°$. Donne les trois autres
      en justifiant.
    correction: 'L''opposé par le sommet : $54°$ ; les deux autres, supplémentaires de $54°$ : $126°$
      chacun.'
  - numero: 12
    etoiles: 1
    enonce: $\left(d\right)$ et $\left(d'\right)$ sont coupées par une sécante en $A$ et $B$ ; deux angles
      alternes-internes mesurent $74°$ et $74°$. a) Que conclure ? b) Combien mesure un angle correspondant
      à celui de $74°$ en $A$ ?
    correction: a) $\left(d\right) \parallel \left(d'\right)$ (réciproque). b) $74°$.
  - numero: 13
    etoiles: 1
    enonce: $\left(MN\right) \parallel \left(PQ\right)$, coupées par une sécante ; un angle alterne-interne
      en $M$ mesure $112°$. Calcule l'angle alterne-interne associé, puis son supplémentaire.
    correction: '$112°$ (alternes-internes, parallèles) ; supplémentaire : $68°$.'
  - numero: 14
    etoiles: 1
    enonce: Trace un angle de $130°$, construis sa bissectrice au compas. Mesure de chacun des deux angles
      obtenus ?
    correction: $130 \div 2 = 65°$ chacun.
  - numero: 15
    etoiles: 1
    enonce: Un triangle a deux angles de $52°$ et $71°$. a) Calcule le troisième. b) Est-il isocèle ?
      Justifie.
    correction: 'a) $180 - \left(52 + 71\right) = 57°$. b) Non : trois angles différents, donc trois côtés
      différents.'
  - numero: 16
    etoiles: 1
    enonce: 'Peut-on construire un triangle de côtés : a) $7$ cm, $5$ cm, $3$ cm ? b) $9$ cm, $4$ cm,
      $4$ cm ? Justifie, puis construis celui du a).'
    correction: 'a) $7 < 5 + 3 = 8$ : oui. b) $9 > 4 + 4 = 8$ : non. Construction du a) au compas.'
  - numero: 17
    etoiles: 1
    enonce: $EFG$ est rectangle en $E$ avec $\widehat{EFG} = 27°$. Calcule $\widehat{EGF}$ en citant la
      propriété.
    correction: 'Angles aigus complémentaires : $\widehat{EGF} = 90 - 27 = 63°$.'
  - numero: 18
    etoiles: 1
    enonce: 'Calcule l''angle manquant : a) $64°$ et $71°$ ; b) $90°$ et $28°$ ; c) $23°$ et $23°$.'
    correction: a) $45°$. b) $62°$. c) $134°$.
  - numero: 19
    etoiles: 1
    enonce: Un triangle isocèle a un angle de base de $65°$. Calcule les deux autres angles.
    correction: 'Autre angle de base : $65°$ ; sommet : $180 - 130 = 50°$.'
  - numero: 20
    etoiles: 1
    enonce: 'Existe-t-il un triangle dont les angles mesurent : a) $60°$, $70°$, $50°$ ? b) $95°$, $47°$,
      $39°$ ? c) deux angles droits ? Justifie.'
    correction: 'a) Somme $180$ : oui. b) Somme $181$ : non. c) Deux angles droits font déjà $180°$ :
      le troisième serait nul, impossible.'
  - numero: 21
    etoiles: 1
    enonce: 'Construis : a) $ABC$ avec $AB = 7$ cm, $AC = 5$ cm, $BC = 6$ cm ; b) $DEF$ isocèle en $D$
      avec $EF = 4$ cm et $DE = 6$ cm ; c) un triangle équilatéral de côté $5$ cm.'
    correction: a) Arcs de $5$ et $6$ cm depuis les extrémités de $\left[AB\right]$. b) $\left[EF\right]
      = 4$ cm, arcs de $6$ cm depuis $E$ et $F$. c) Arcs de $5$ cm depuis les deux extrémités.
  - numero: 22
    etoiles: 1
    enonce: Construis $RST$ tel que $RS = 8$ cm, $\widehat{SRT} = 40°$ et $RT = 6$ cm. Mesure $ST$ au
      millimètre près.
    correction: Construction ; on mesure $ST \approx 5{,}2$ cm.
  - numero: 23
    etoiles: 1
    enonce: 'Ces longueurs sont-elles les côtés d''un triangle ? a) $12$ cm, $7$ cm, $4$ cm ; b) $9$ cm,
      $5$ cm, $5$ cm ; c) $10$ cm, $6$ cm, $4$ cm (cas limite).


      ### Entraînement ★★'
    correction: 'a) $12 > 11$ : impossible. b) $9 < 10$ : possible. c) $10 = 6 + 4$ : points alignés,
      triangle aplati, donc impossible.'
  - numero: 24
    etoiles: 2
    enonce: Construis $MNP$ tel que $MN = 6$ cm, $\widehat{NMP} = 50°$ et $\widehat{MNP} = 60°$. Construis
      le centre de son cercle circonscrit (deux médiatrices) et trace ce cercle.
    correction: 'Troisième angle : $180 - 110 = 70°$. Le centre est l''intersection de deux médiatrices
      ; rayon = distance à un sommet.'
  - numero: 25
    etoiles: 2
    enonce: Trace $\left[AB\right]$ de $7$ cm, construis sa médiatrice au compas. Place $M$ dessus, vérifie
      $MA = MB$. Énonce la propriété illustrée.
    correction: 'Arcs de même rayon depuis $A$ et $B$, de part et d''autre. Propriété : tout point de
      la médiatrice est équidistant des extrémités.'
  - numero: 26
    etoiles: 2
    enonce: $P$ vérifie $PA = PB = 5$ cm, avec $AB = 6$ cm. a) Où se trouve $P$ ? b) Combien y a-t-il
      de tels points ? Construis-les.
    correction: a) $P$ est sur la médiatrice de $\left[AB\right]$ et sur le cercle de centre $A$ et de
      rayon $5$ cm. b) Deux points, un de chaque côté de $\left[AB\right]$.
  - numero: 27
    etoiles: 2
    enonce: 'Construis $ABC$ avec $AB = 8$ cm, $BC = 6$ cm, $AC = 7$ cm, puis : a) la hauteur issue de
      $A$ ; b) la médiane issue de $A$ ; c) la différence entre les deux, en une phrase.'
    correction: 'a) Perpendiculaire à $\left(BC\right)$ par $A$. b) $A$ au milieu de $\left[BC\right]$.
      c) La hauteur fait un angle droit avec le côté opposé, la médiane passe par son milieu : droites
      différentes en général.'
  - numero: 28
    etoiles: 2
    enonce: Construis $ABC$ tel que $AB = 6$ cm, $BC = 8$ cm et $\widehat{ABC} = 90°$. Construis le centre
      $O$ du cercle circonscrit. Que remarques-tu sur la position de $O$ ?
    correction: $O$ est le **milieu de l'hypoténuse** $\left[AC\right]$.
  - numero: 29
    etoiles: 2
    enonce: $ABC$ est isocèle en $A$ et $\widehat{BAC} = 36°$. La bissectrice de $\widehat{ABC}$ coupe
      $\left[AC\right]$ en $D$. a) Calcule $\widehat{ABC}$. b) Calcule $\widehat{BDC}$. c) Montre que
      $BCD$ est isocèle.
    correction: 'a) $\widehat{ABC} = \frac{180 - 36}{2} = 72°$. b) $\widehat{ABD} = 36°$, donc $\widehat{ADB}
      = 180 - 36 - 36 = 108°$ et $\widehat{BDC} = 180 - 108 = 72°$. c) Dans $BDC$ : $\widehat{BDC} = \widehat{BCD}
      = 72°$, donc $BCD$ est isocèle en $B$.'
  - numero: 30
    etoiles: 2
    enonce: Deux parallèles $\left(d\right)$ et $\left(d'\right)$ sont coupées par deux sécantes issues
      d'un même point $S$ situé entre elles, formant deux triangles opposés par le sommet $S$. Un angle
      de l'un des triangles vaut $42°$ ; son alterne-interne dans l'autre vaut combien ? Justifie.
    correction: '$42°$ : les droites étant parallèles, les alternes-internes formés par la sécante sont
      égaux ; les angles en $S$, opposés par le sommet, font passer l''égalité d''un triangle à l''autre.'
  - numero: 31
    etoiles: 2
    enonce: 'Recopie et complète par « définition » ou « propriété », puis par le texte exact : a) « …
      de la médiatrice : tout point équidistant de $A$ et $B$ appartient à la médiatrice de $\left[AB\right]$
      » ; b) « … de la médiatrice : la médiatrice de $\left[AB\right]$ est la droite perpendiculaire à
      $\left(AB\right)$ passant par le milieu de $\left[AB\right]$ ».


      ### ★★★ Défis de maîtrise'
    correction: a) **Propriété** (caractérisation). b) **Définition**.
  - numero: 32
    etoiles: 3
    enonce: Dans un triangle $ABC$, les bissectrices de $\widehat{ABC}$ et de $\widehat{ACB}$ se coupent
      en $I$. Montre que $\widehat{BIC} = 90° + \frac{\widehat{BAC}}{2}$.
    correction: 'On part de la somme des angles pour ramener tout à $\widehat{BAC}$. Dans $ABC$ : $\widehat{ABC}
      + \widehat{ACB} = 180° - \widehat{BAC}$. Les bissectrices donnent $\widehat{IBC} + \widehat{ICB}
      = 90° - \frac{\widehat{BAC}}{2}$. Dans $BIC$ : $\widehat{BIC} = 180° - \left(90° - \frac{\widehat{BAC}}{2}\right)
      = 90° + \frac{\widehat{BAC}}{2}$.'
  - numero: 33
    etoiles: 3
    enonce: Les angles d'un triangle sont proportionnels à $2$, $3$ et $4$. Calcule-les.
    correction: 'On pose un coefficient commun. Angles $2k$, $3k$, $4k$ avec $9k = 180$, donc $k = 20$
      : $40°$, $60°$, $80°$.'
  - numero: 34
    etoiles: 3
    enonce: Un terrain est un triangle $ABC$. L'angle en $A$ est le double de celui en $B$, et l'angle
      en $C$ dépasse celui en $A$ de $15°$. Le géomètre affirme que le terrain possède un angle obtus.
      A-t-il raison ? Conclus par une phrase.
    correction: 'On prend pour inconnue l''angle le plus petit, celui en $B$, car les autres s''en déduisent.
      $\widehat{B} = x$, $\widehat{A} = 2x$, $\widehat{C} = 2x + 15$ ; $5x + 15 = 180$, donc $x = 33$
      : $33°$, $66°$, $81°$ (somme $180$ ✓). Tous les angles sont aigus : le géomètre a **tort**.'
  - numero: 35
    etoiles: 3
    enonce: 'a) Dans un triangle isocèle, l''angle au sommet principal mesure $30°$ de moins que chaque
      angle de la base : retrouve les trois angles. b) Dans un triangle rectangle, un angle aigu vaut
      le quadruple de l''autre : retrouve-les. c) La somme de deux angles d''un triangle vaut $115°$ :
      que vaut le troisième ? d) Un triangle isocèle possède un angle de $100°$ : donne les deux autres
      et explique pourquoi une seule réponse est possible.'
    correction: 'a) Base $x$, sommet $x - 30$ : $3x - 30 = 180$, $x = 70$ : $70°$, $70°$, $40°$. b) $x
      + 4x = 90$ : $18°$ et $72°$. c) $180 - 115 = 65°$. d) Si $100°$ était un angle de base, la somme
      dépasserait $200°$ : c''est donc l''angle au sommet, et la base vaut $\frac{180 - 100}{2} = 40°$
      deux fois.'
  - numero: 36
    etoiles: 3
    enonce: Vrai ou faux ? Prouve ou donne un contre-exemple. a) Deux droites perpendiculaires à une même
      droite sont parallèles. b) Deux angles de même mesure sont opposés par le sommet. c) Un triangle
      peut avoir deux angles obtus. d) Il existe un triangle de côtés $3$ cm, $4$ cm et $8$ cm.
    correction: 'a) **Vrai** (propriété de liaison). b) **Faux** : les angles de base d''un triangle isocèle
      sont égaux sans avoir le même sommet. c) **Faux** : deux angles obtus dépassent déjà $180°$ à eux
      seuls. d) **Faux** : $3 + 4 = 7 < 8$.'
  - numero: 37
    etoiles: 3
    enonce: a) Montre que dans **tout** triangle rectangle les deux angles aigus sont complémentaires.
      b) Montre que dans **tout** triangle, un angle extérieur est égal à la somme des deux angles intérieurs
      non adjacents. c) Illustre le b) avec un triangle dont deux angles mesurent $47°$ et $68°$, en vérifiant
      de deux façons.
    correction: 'a) $180° - 90° = 90°$ pour les deux angles aigus : ils sont complémentaires. b) L''angle
      extérieur en $A$ est supplémentaire de $\widehat{A}$, donc vaut $180° - \widehat{A} = \widehat{B}
      + \widehat{C}$. c) Troisième angle $65°$ ; extérieur : $180 - 65 = 115°$ et $47 + 68 = 115°$ ✓.'
  - numero: 38
    etoiles: 3
    enonce: $\left(d\right) \parallel \left(d'\right)$ sont coupées par une sécante $\left(s\right)$,
      en $A$ et en $B$. L'angle aigu en $A$ mesure $58°$. a) Donne les huit angles formés, en justifiant
      chacun par une propriété nommée. b) Une seconde sécante coupe $\left(d\right)$ en $A$ et $\left(d'\right)$
      en $C$, avec $\widehat{BAC} = 34°$ et $\widehat{ABC}$ alterne-interne de l'angle de $58°$. Calcule
      les trois angles de $ABC$.
    correction: 'On établit d''abord les angles en $A$, puis on les transporte en $B$ par les parallèles.
      a) En $A$ : $58°$, son supplémentaire $122°$, puis $58°$ et $122°$ par opposition au sommet. En
      $B$ : mêmes valeurs par alternes-internes. Total : quatre angles de $58°$, quatre de $122°$. b)
      $\widehat{ABC} = 58°$ (alterne-interne), donc $\widehat{ACB} = 180 - 34 - 58 = 88°$ : les angles
      sont $34°$, $58°$, $88°$.'
  - numero: 39
    etoiles: 3
    enonce: 'Moussa devait traiter : « $ABC$ isocèle en $A$ avec $\widehat{A} = 96°$ ; $\left(AH\right)$
      est la hauteur issue de $A$, $H \in \left[BC\right]$. Calculer $\widehat{ABH}$ et $\widehat{BAH}$.
      » Sa copie :


      > Ligne 1 : isocèle en $A$, donc $\widehat{B} = \widehat{A} = 96°$.

      > Ligne 2 : alors $\widehat{C} = 180° - 96° - 96° = -12°$.

      > Ligne 3 : un angle ne peut pas être négatif, je prends $\widehat{C} = 12°$.

      > Ligne 4 : dans $ABH$ rectangle en $H$ : $\widehat{BAH} = 90° - 12° = 78°$.


      Repère les lignes fausses, nomme la propriété mal employée, explique pourquoi la ligne $3$ est plus
      grave qu''une faute de calcul, puis rédige la solution correcte.'
    correction: 'Le point de départ est la mauvaise lecture de « isocèle en $A$ ». **Ligne 1** fausse
      : $AB = AC$, donc ce sont $\widehat{B}$ et $\widehat{C}$ qui sont égaux. **Ligne 3** : la plus grave,
      car un angle négatif signale une propriété mal employée en amont ; changer le signe efface le seul
      indicateur d''erreur au lieu de remonter à la ligne 1. **Ligne 4** utilise un angle inventé. Solution
      : $\widehat{B} = \widehat{C} = \frac{180 - 96}{2} = 42°$, donc $\widehat{ABH} = 42°$ ; $ABH$ rectangle
      en $H$, donc $\widehat{BAH} = 90 - 42 = 48°$. Contrôle : la hauteur issue du sommet principal est
      aussi bissectrice, et $96 \div 2 = 48$ ✓.'
  fiche_revision:
  - '**Liaison.** $\perp$ à une même droite $\Rightarrow \parallel$ ; $\parallel$ à une même droite $\Rightarrow
    \parallel$ ; $\parallel$ et $\perp$ à l''une $\Rightarrow \perp$ à l''autre.'
  - '**Angles.** Complémentaires $90°$ ; supplémentaires $180°$ ; opposés par le sommet égaux. Parallèles
    $\iff$ alternes-internes égaux (cite le bon sens).'
  - '**Triangle.** Somme $180°$. Isocèle : angles de la base égaux. Rectangle : angles aigus complémentaires.
    Équilatéral : $3 \times 60°$. Inégalité : plus grand côté $<$ somme des deux autres.'
  - '**Droites remarquables.** Médiatrice : $\perp$ au milieu, équidistance, centre du cercle circonscrit.
    Hauteur : $\perp$ au côté opposé. Médiane : vers le **milieu**.'
  - '**Rédaction.** Chaque affirmation s''appuie sur une donnée, une définition ou une propriété nommée.'
  trouve_erreur:
  - faux: « Les angles alternes-internes sont toujours égaux. »
    correction: Seulement si les droites sont **parallèles**.
  - faux: « $\left(d_{1}\right) \perp \left(d_{3}\right)$ et $\left(d_{2}\right) \perp \left(d_{3}\right)$,
      donc $\left(d_{1}\right) \perp \left(d_{2}\right)$. »
    correction: Elles sont **parallèles** entre elles.
  - faux: « Le triangle a des angles de $50°$, $60°$ et $80°$. »
    correction: '$50 + 60 + 80 = 190 \ne 180$ : impossible.'
  - faux: « La médiane issue de $A$ est perpendiculaire à $\left[BC\right]$. »
    correction: C'est la **hauteur** ; la médiane passe par le **milieu**.
  - faux: « $MA = MB$, donc $M$ est le milieu de $\left[AB\right]$. »
    correction: $M$ est sur la **médiatrice** ; le milieu n'en est qu'un point.
  cartographie_lacunes:
  - lacune: Propriétés des angles et des triangles non mobilisables, confusion définition/propriété, droites
      remarquables mélangées
    bloque_en: ch. 6, 12, 14, 16
