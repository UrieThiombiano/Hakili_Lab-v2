    correction: 'Une limite à ne pas dépasser : c''est une inéquation. $h$ est le nombre d''heures : $12\,000
      + 250h \le 30\,000$, donc $h \le 72$. Les $70$ heures passent : $29\,500$ FCFA dépensés, $500$ FCFA
      restants, deux heures de marge.'
  - numero: 38
    etoiles: 3
    enonce: 'Voici la copie d''un élève qui résout $5\left(x - 2\right) + 3 = 28$ :

      > ligne 1 : $5x - 2 + 3 = 28$ ;

      > ligne 2 : $5x + 1 = 28$ ;

      > ligne 3 : $5x = 27$ ;

      > ligne 4 : $x = 27 - 5 = 22$.

      >

      > Trouve la **première** ligne fausse, explique-la, dis s''il y en a d''autres, refais la résolution
