- niveau: TleD
  module: 10
  module_titre: Droites et fonctions affines
  pourquoi: L'équation de la tangente $y = f'\left(a\right)\left(x - a\right) + f\left(a\right)$ est une
    équation de droite. Coefficient directeur et équation réduite servent en calcul différentiel, en ajustement
    linéaire et pour l'asymptote oblique.
  diagnostic:
  - question: Donne le coefficient directeur et l'ordonnée à l'origine de $y = 3x - 2$.
    reponse: $3$ et $-2$
  - question: Équation réduite de la droite passant par $A\left(1\,;\,2\right)$ et $B\left(3\,;\,8\right)$.
    reponse: $a = 3$, $y = 3x - 1$
  - question: Le point $C\left(10\,;\,29\right)$ appartient-il à $y = 3x - 2$ ?
    reponse: $28 \ne 29$, non
  - question: Les droites $y = 2x + 1$ et $y = 2x - 5$ sont-elles parallèles ? sécantes ?
    reponse: parallèles
  - question: 'Résous : $\begin{cases} x + y = 7 \\ 2x - y = 5 \end{cases}$'
    reponse: $\left(4\,;\,3\right)$
  lecons:
  - id: TleD_M10_L1
    numero: '10.1'
    titre: Fonction affine, coefficient directeur, équation réduite
    retenir:
    - '$f\left(x\right) = ax + b$ : la courbe est une **droite** ;'
    - '$a$ = **coefficient directeur** : quand $x$ augmente de 1, $y$ varie de $a$ ;'
    - '$b$ = **ordonnée à l''origine** : la droite coupe l''axe des ordonnées en $\left(0\,;\,b\right)$
      ;'
    - forme réduite $y = ax + b$ obligatoire avant toute lecture ($2y = 6x - 10$ donne $y = 3x - 5$) ;
    - 'droite **verticale** : $x = c$, aucun coefficient directeur, aucune fonction ;'
    - 'si $x_{A} \ne x_{B}$ : $$a = \frac{y_{B} - y_{A}}{x_{B} - x_{A}}$$'
    - '$f$ croissante si $a > 0$, décroissante si $a < 0$, constante si $a = 0$. Signe de $ax + b$ : Module
      7.'
    methode:
      titre: Équation réduite d'une droite passant par deux points
      etapes:
      - 'Si $x_{A} = x_{B}$ : droite **verticale** $x = x_{A}$, on s''arrête.'
      - Calcule $a = \frac{y_{B} - y_{A}}{x_{B} - x_{A}}$.
      - Écris $y = ax + b$ et remplace par les coordonnées de **l'un** des points pour trouver $b$.
      - '**Vérifie** avec l''**autre** point.'
    exemple_resolu: 'Équation réduite de $\left(AB\right)$ avec $A\left(-1\,;\,5\right)$ et $B\left(2\,;\,-1\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Abscisses différentes : droite non verticale. | $x_{A} = -1 \ne 2 = x_{B}$ |

      | Ordonnées en haut, abscisses en bas, même ordre. | $a = \frac{-1 - 5}{2 - \left(-1\right)} = -2$
      |

      | J''impose que $A$ soit sur $y = -2x + b$. | $5 = 2 + b$, donc $b = 3$ : **$y = -2x + 3$** |

      | **Vérification avec $B$ :** $-2 \times 2 + 3 = -1$. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $a = \frac{x_{B} - x_{A}}{y_{B} - y_{A}}$, ou échanger les points au numérateur seulement.
      correction: ordonnées en haut, abscisses en bas, même ordre dans les deux.
    - erreur: appliquer la formule quand $x_{A} = x_{B}$.
      correction: droite verticale $x = x_{A}$, ni coefficient directeur ni équation réduite.
    declic: null
    figures:
    - figures/m10_f2.svg
  - id: TleD_M10_L2
    numero: '10.2'
    titre: Tracer, croiser des droites ; systèmes 2×2
    retenir:
    - '$a \ne a''$ : **sécantes**, une **solution unique** ; on résout $ax + b = a''x + b''$ ;'
    - '$a = a''$ et $b \ne b''$ : **strictement parallèles**, **aucune** solution ;'
    - '$a = a''$ et $b = b''$ : **confondues**, une **infinité** de solutions.'
    methode:
      titre: Tracer la droite $y = ax + b$
      etapes:
      - Place $\left(0\,;\,b\right)$.
      - Avance de 1 vers la droite et de $a$ verticalement ; si $a = \frac{p}{q}$, avance de $q$ et monte
        de $p$.
      - Prends deux points **éloignés**.
      - Trace, puis **vérifie** avec un troisième point calculé.
    exemple_resolu: 'Point d''intersection de $d_{1}$ : $y = 2x - 1$ et $d_{2}$ : $y = -x + 5$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Au point commun, une seule inconnue reste. | $2x - 1 = -x + 5$ |

      | Je rassemble et je divise. | $3x = 6$, donc $x = 2$ |

      | Je remplace pour l''ordonnée. | $y = 2 \times 2 - 1 = 3$ ; **$I\left(2\,;\,3\right)$** |

      | **Vérification dans $d_{2}$ :** $-2 + 5 = 3$. ✓ | |'
    erreurs_frequentes:
    - erreur: répondre « $x = 2$ » à un système $2 \times 2$.
      correction: la solution est un **couple**.
    - erreur: garder le sens de l'inégalité en divisant par un négatif.
      correction: $-3x > 12$ donne $x < -4$.
    declic: null
    figures:
    - figures/m10_f7.svg
    - figures/m10_f8.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Détermine l''équation réduite de la droite passant par : a) $A\left(2\,;\,3\right)$ et $B\left(5\,;\,12\right)$
      ; b) $C\left(-2\,;\,4\right)$ et $D\left(2\,;\,-4\right)$.'
    correction: 'a) $a = 3$, $b = -3$ : $y = 3x - 3$. b) $a = -2$, $b = 0$ : $y = -2x$.'
  - numero: 2
    etoiles: 1
    enonce: 'Soit $d$ : $y = -\frac{1}{2}x + 4$. a) Le point $E\left(6\,;\,1\right)$ appartient-il à $d$
      ? b) Donne l''intersection de $d$ avec l''axe des ordonnées, puis avec l''axe des abscisses.'
    correction: 'a) $-\frac{1}{2} \times 6 + 4 = 1$ : oui. b) $\left(0\,;\,4\right)$ et $\left(8\,;\,0\right)$.'
  - numero: 3
    etoiles: 1
    enonce: 'Coefficient directeur et ordonnée à l''origine : a) $y = 5x - 7$ ; b) $y = -x + 2$ ; c) $y
      = \frac{2}{3}x$ ; d) $y = 4$ ; e) $2y = 6x - 10$.'
    correction: 'a) $5$ et $-7$ ; b) $-1$ et $2$ ; c) $\frac{2}{3}$ et $0$ ; d) $0$ et $4$ ; e) $y = 3x
      - 5$ : $3$ et $-5$.'
  - numero: 4
    etoiles: 1
    enonce: 'Équation réduite de la droite passant par : a) $A\left(1\,;\,1\right)$ et $B\left(4\,;\,10\right)$
      ; b) $C\left(0\,;\,-3\right)$ et $D\left(2\,;\,1\right)$ ; c) $E\left(-3\,;\,2\right)$ et $F\left(3\,;\,-2\right)$
      ; d) $G\left(2\,;\,5\right)$ et $H\left(2\,;\,-1\right)$ (attention !).'
    correction: 'a) $y = 3x - 2$. b) $y = 2x - 3$. c) $y = -\frac{2}{3}x$. d) $x_{G} = x_{H} = 2$ : verticale
      $x = 2$, pas d''équation réduite.'
  - numero: 5
    etoiles: 1
    enonce: '[FIGURE : repère orthonormé avec trois droites : $d_{1}$ passant par $\left(0\,;\,1\right)$
      et $\left(2\,;\,5\right)$ ; $d_{2}$ passant par $\left(0\,;\,3\right)$ et $\left(3\,;\,0\right)$
      ; $d_{3}$ horizontale passant par $\left(0\,;\,-2\right)$ ; graduations unitaires.] Par lecture
      graphique, donne l''équation réduite de chacune des trois droites.'
    correction: '$d_{1}$ : $y = 2x + 1$. $d_{2}$ : $y = -x + 3$. $d_{3}$ : $y = -2$.'
  - numero: 6
    etoiles: 1
    enonce: Le point $A\left(15\,;\,43\right)$ appartient-il à $y = 3x - 2$ ? Et $B\left(-7\,;\,-23\right)$
      ? Justifie par le calcul.
    correction: '$3 \times 15 - 2 = 43$ : oui. $3 \times \left(-7\right) - 2 = -23$ : oui.'
  - numero: 7
    etoiles: 1
    enonce: Soit $f$ affine telle que $f\left(2\right) = 7$ et $f\left(5\right) = 16$. Détermine $f\left(x\right)$,
      puis $f\left(10\right)$.
    correction: '$a = 3$, $b = 1$ : $f\left(x\right) = 3x + 1$ ; $f\left(10\right) = 31$.'
  - numero: 8
    etoiles: 1
    enonce: Détermine l'équation réduite de la droite parallèle à $y = -2x + 1$ passant par $A\left(3\,;\,-1\right)$.
    correction: '$a = -2$, $b = 5$ : $y = -2x + 5$.'
  - numero: 9
    etoiles: 1
    enonce: 'Parallèles ou sécantes ? Si sécantes, calcule le point d''intersection : a) $y = 3x - 1$
      et $y = 3x + 4$ ; b) $y = 2x + 1$ et $y = -x + 7$ ; c) $y = \frac{1}{2}x - 3$ et $2y = x - 6$.'
    correction: a) Parallèles ($a = 3$, $b$ différents). b) Sécantes en $\left(2\,;\,5\right)$. c) Confondues
      ($2y = x - 6 \iff y = \frac{1}{2}x - 3$).
  - numero: 10
    etoiles: 1
    enonce: 'Résous : a) $\begin{cases} x + y = 10 \\ x - y = 4 \end{cases}$ ; b) $\begin{cases} 2x +
      3y = 13 \\ x - y = -1 \end{cases}$ ; c) $\begin{cases} 5x + 2y = 16 \\ 3x + 4y = 18 \end{cases}$'
    correction: 'a) $\left(7\,;\,3\right)$. b) $\left(2\,;\,3\right)$. c) $2 \times$ (1re) $-$ (2e) :
      $7x = 14$, $\left(2\,;\,3\right)$.'
  - numero: 11
    etoiles: 1
    enonce: 'Trace dans un même repère $d_{1}$ : $y = 2x - 3$ et $d_{2}$ : $y = -\frac{1}{2}x + 2$, puis
      détermine leur point d''intersection **par le calcul**.'
    correction: '$2x - 3 = -\frac{1}{2}x + 2$ donne $\frac{5}{2}x = 5$ : $I\left(2\,;\,1\right)$.'
  - numero: 12
    etoiles: 1
    enonce: 'Résous par combinaison : $\begin{cases} 3x + 2y = 8 \\ x - 2y = 0 \end{cases}$


      ### Entraînement ★★'
    correction: 'Addition : $4x = 8$, $x = 2$, $y = 1$ : $\left(2\,;\,1\right)$.'
  - numero: 13
    etoiles: 2
    enonce: Détermine $m$ pour que $y = mx + 2$ passe par $K\left(4\,;\,14\right)$. Pour cette valeur,
      la droite est-elle parallèle à $y = 3x - 5$ ?
    correction: $14 = 4m + 2$ donne $m = 3$. Oui, parallèles ($2 \ne -5$).
  - numero: 14
    etoiles: 2
    enonce: '(Koudougou) Une coopérative de tisseuses facture un pagne 6 500 FCFA, avec 2 000 FCFA de
