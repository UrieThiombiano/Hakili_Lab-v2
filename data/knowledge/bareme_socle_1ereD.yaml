  reponse_attendue: 3m + 2n = 34 000 et 5m + 4n = 60 000 ; m = 8 000 FCFA
  solution: 'En multipliant la première par 2 : 6m + 4n = 68 000 ; en retranchant la seconde : m = 8 000.
    Barème : 1 pt pour le système correctement écrit, inconnues nommées ; 1 pt pour la résolution donnant
    m = 8 000 FCFA. Le prix du niébé n''est pas demandé (ne rien retirer ni ajouter). Une résolution juste
    sur un système mal traduit garde le second point.'
  si_echoue: Mise en équation d'un énoncé en langue courante, puis résolution d'un système par combinaison.
    Livret de remédiation 1ère D / Tle D, module 10.
