# nginx — reverse proxy vers l'API FastAPI (hakili.service, 127.0.0.1:8000)
# et serveur statique pour le frontend React buildé (frontend/dist).
#
# `certbot --nginx -d VOTRE_DOMAINE.example` réécrit ce fichier tout seul
# pour ajouter le bloc HTTPS (443) et la redirection 80→443 — ne pas les
# écrire à la main ici, voir docs/deploiement_vps_hetzner.md Étape 4.
#
# Remplacer VOTRE_DOMAINE.example avant de déployer.

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE.example;

    root /opt/hakili/Hakili_Lab/frontend/dist;
    index index.html;

    # API FastAPI — même origine que le frontend, pas de CORS à gérer.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_SSL_REDIRECT côté FastAPI (app/security.py) lit cet en-tête
        # pour savoir si la requête d'origine était en HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le dépôt d'un lot de copies peut être long sur une connexion lente.
        proxy_read_timeout 180s;
        client_max_body_size 50m;
    }

    # SPA React : toute route inconnue de nginx retombe sur index.html,
    # le routeur côté client (react-router) prend le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets buildés par Vite : noms de fichiers hachés (cache-bust auto),
    # cache long sans risque de servir une version périmée.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
