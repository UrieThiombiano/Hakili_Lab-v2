    correction: 'a) Positif sur $\left]-\infty\,;\,0\right[ \cup \left]2\,;\,+\infty\right[$, négatif
      sur $\left]0\,;\,2\right[$. b) Racines $\frac{1}{3}$ et $\frac{1}{2}$, interdit $0$ : positif sur
