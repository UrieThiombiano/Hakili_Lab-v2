  - numero: 39
    etoiles: 3
    enonce: À Koudougou, le terrain de sport est dessiné sur un quadrillage où 1 carreau représente $5$
      m. Les piquets sont aux nœuds $A\left(2\,;\,1\right)$, $B\left(8\,;\,1\right)$, $C\left(8\,;\,5\right)$,
      $D\left(2\,;\,5\right)$. On peint une bande blanche tout le long du bord, puis on tend un fil le
      long de l'axe de symétrie horizontal du terrain. La peinture se vend par lots couvrant $40$ m, le
      fil par rouleaux de $25$ m. Combien de lots et de rouleaux acheter ?
    correction: 'On cherche d''abord les deux longueurs à couvrir. ABCD est un rectangle de $6$ et $4$
      carreaux, soit $30$ m sur $20$ m. Bande = périmètre $= 2 \times \left(30 + 20\right) = 100$ m, et
      $100 \div 40 = 2{,}5$ : **$3$ lots**. L''axe horizontal est la médiane parallèle aux grands côtés,
      longue de $30$ m, et $30 > 25$ : **$2$ rouleaux**.'
  - numero: 40
    etoiles: 3
    enonce: Le patron d'un pavé droit est formé de six rectangles. Deux mesurent $8$ cm sur $3$ cm, deux
      autres $5$ cm sur $3$ cm. a) Dimensions des deux derniers ? b) Les trois dimensions du pavé ? c)
      Combien d'arêtes de $3$ cm ?
    correction: 'Les six rectangles vont par trois paires, chacune combinant deux des trois dimensions
      ; les nombres présents sont $8$, $5$ et $3$. a) Deux rectangles de **$8$ cm sur $5$ cm**. b) $8$
      cm, $5$ cm, $3$ cm. c) Les $12$ arêtes forment trois groupes de $4$ : **$4$ arêtes** de $3$ cm.'
  - numero: 41
    etoiles: 3
    enonce: Explique pourquoi un seul nombre suffit pour dire où se trouve un car sur la route de Manga,
      alors qu'il en faut deux pour dire où se trouve un arbre dans un champ.
    correction: 'Sur la route, le car n''a qu''une liberté : avancer ou reculer. Une origine et une unité
      suffisent, chaque endroit porte un numéro et un seul. Dans un champ, deux déplacements sont indépendants
      : l''un ne renseigne pas sur l''autre, il faut donc deux nombres. C''est la différence entre une
      ligne et une surface.'
  - numero: 42
    etoiles: 3
    enonce: Explique pourquoi la symétrie axiale ne change ni les longueurs ni les angles d'une figure,
      mais la retourne. Aide-toi de ta main gauche et de ta main droite.
    correction: 'Le pliage pose chaque point sur son image, tous en même temps : deux points qui se recouvrent
      sont au même endroit, donc les distances et les ouvertures d''angles ne changent pas, et avec elles
      les périmètres et les aires. Mais pour poser la figure sur son image, il a fallu la retourner :
      le sens de lecture change. Tes deux mains ont les mêmes longueurs et les mêmes angles, et pourtant
      l''une ne se pose pas sur l''autre sans retournement.'
  fiche_revision:
  - '**Droite graduée.** Une origine, une unité, un sens ; chaque point porte une seule abscisse. L''unité
    peut représenter autre chose qu''un centimètre.'
  - '**Coordonnées.** $M\left(x\,;\,y\right)$ : abscisse d''abord, sur l''axe horizontal. Placer : partir
    de O, avancer de $x$, monter de $y$. Nombre de carreaux entre deux points alignés : différence des
    abscisses (ou des ordonnées).'
  - '**Symétrie axiale.** A et $A''$ sont symétriques lorsque $\left(D\right)$ est la médiatrice de $\left[AA''\right]$.
    Un point de l''axe est son propre symétrique. $AA''$ vaut le double de la distance à l''axe.'
  - '**Ce qui est conservé.** Longueurs, angles, alignement, parallélisme, aires, périmètres. Pas le sens
    de lecture.'
  - '**Axes usuels.** Cercle : infinité. Carré : $4$. Rectangle : $2$ médianes. Losange : $2$ diagonales.
    Équilatéral : $3$. Isocèle : $1$. Quelconque et parallélogramme : aucun.'
  - '**Pavé et cube.** $6$ faces, $12$ arêtes, $8$ sommets, $3$ arêtes par sommet. Perspective : $3$ arêtes
    en pointillés. Patron : $6$ rectangles par paires identiques.'
  trouve_erreur:
  - faux: '$M\left(2\,;\,3\right)$ : je monte de $2$ puis j''avance de $3$'
    correction: 'Le couple s''écrit (abscisse ; ordonnée) : on avance de $2$, **puis** on monte de $3$.'
  - faux: $P\left(3\,;\,1\right)$ est le même point que $Q\left(1\,;\,3\right)$
    correction: 'Échanger les deux nombres change le point : P est à droite et bas, Q est haut et près
      de l''axe vertical.'
  - faux: J'ai mesuré $AA' = 6$ cm depuis l'axe $\left(D\right)$
    correction: 'La distance se mesure du point au pied H : $AH = HA'' = 3$ cm si $AA'' = 6$ cm.'
  - faux: La diagonale du rectangle est un axe de symétrie
    correction: 'Le pliage pose un côté long sur un côté court : le rectangle n''a que ses $2$ médianes.'
  - faux: Un pavé droit a $6$ arêtes
    correction: Il a $6$ **faces**, $12$ arêtes et $8$ sommets.
