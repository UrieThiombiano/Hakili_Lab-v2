- niveau: TleD
  module: 8
  module_titre: 'Fonctions : vocabulaire et lecture graphique'
  pourquoi: 'Tout sujet d''analyse commence par « Soit $f$ la fonction définie sur $D$ par $f\left(x\right)
    = \ldots$ ». Image, antécédent, ensemble de définition, variations : c''est ta langue de travail jusqu''au
    bac.'
  diagnostic:
  - question: Soit $f\left(x\right) = \frac{x + 1}{x - 2}$. Détermine $D_{f}$.
    reponse: $D_{f} = \mathbb{R} \setminus \{2\}$
  - question: Soit $g\left(x\right) = x^{2} - 3$. Calcule l'image de $2$, puis les antécédents de $1$.
    reponse: $g\left(2\right) = 1$ ; $x^{2} = 4$ donne $x = 2$ ou $x = -2$
  - question: Une fonction $h$ vérifie $h\left(3\right) = 7$. Traduis avec « image » et « antécédent ».
    reponse: $7$ est l'image de $3$ ; $3$ est un antécédent de $7$
  - question: La fonction $x \mapsto x^{2}$ est-elle croissante ou décroissante sur $\left[0\,;\,+\infty\right[$
      ? Et sur $\left]-\infty\,;\,0\right]$ ?
    reponse: croissante, puis décroissante
  - question: 'Vrai ou faux : « un réel peut avoir deux images par une même fonction ».'
    reponse: faux, l'image est unique
  lecons:
  - id: TleD_M08_L1
    numero: '8.1'
    titre: Fonction, image, antécédent, ensemble de définition
    retenir:
    - '$f\left(x\right)$ est l''**image** de $x$ : elle est **unique**.'
    - '$x$ est **un antécédent** de $y$ si $f\left(x\right) = y$ : il peut y en avoir **zéro, un ou plusieurs**.'
    - $D_{f}$ est l'ensemble des $x$ pour lesquels $f\left(x\right)$ **existe**.
    - '$\mathcal{C}_{f}$ est l''ensemble des points $M\left(x\,;\,f\left(x\right)\right)$ : $M\left(a\,;\,b\right)
      \in \mathcal{C}_{f}$ équivaut à $b = f\left(a\right)$.'
    methode:
      titre: Déterminer un ensemble de définition
      etapes:
      - 'Repère les **opérations à risque** : dénominateur ($\ne 0$), racine carrée (contenu $\ge 0$).'
      - Écris les **conditions** et résous-les (tableau de signes si besoin, Module 7).
      - 'Plusieurs conditions valent **en même temps** : on garde l''intersection.'
      - Donne $D_{f}$ en intervalle ou en réunion d'intervalles.
    exemple_resolu: 'Détermine l''ensemble de définition de : a) $f\left(x\right) = \frac{2x + 1}{x^{2}
      - 9}$ ; b) $g\left(x\right) = \sqrt{5 - x}$ ; c) $h\left(x\right) = \frac{\sqrt{x - 1}}{x - 4}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) Barre de fraction : dénominateur non nul. | $x^{2} - 9 \ne 0$, donc $D_{f} = \mathbb{R} \setminus
      \{-3\,;\,3\}$ |

      | b) Racine carrée : contenu positif ou nul. | $5 - x \ge 0$, donc $D_{g} = \left]-\infty\,;\,5\right]$
      |

      | c) Les deux conditions tiennent ensemble : je perce le trou en $4$ sur la demi-droite $x \ge 1$.
      | $x - 1 \ge 0$ **et** $x - 4 \ne 0$, donc $D_{h} = \left[1\,;\,4\right[ \cup \left]4\,;\,+\infty\right[$
      |

      | **Vérification :** $g\left(6\right) = \sqrt{-1}$ n''existe pas ; $h\left(1\right) = \frac{0}{-3}
      = 0$ existe. ✓ | |'
    erreurs_frequentes:
    - erreur: confondre image et antécédent.
      correction: « calcule $f\left(5\right)$ » est un calcul ; « résous $f\left(x\right) = 5$ » est une
        équation.
    - erreur: appliquer $\ge 0$ à une racine placée au dénominateur.
      correction: 'dans $\frac{1}{\sqrt{x - 2}}$ les deux conditions se cumulent : $x - 2 > 0$, **strictement**.'
    declic: null
    figures: []
  - id: TleD_M08_L2
    numero: '8.2'
    titre: Sens de variation et tableau de variations
    retenir:
    - '$f$ **croissante** sur $I$ si $f\left(a\right) \le f\left(b\right)$ : elle **conserve l''ordre**
      (la courbe monte).'
    - '$f$ **décroissante** sur $I$ si $f\left(a\right) \ge f\left(b\right)$ : elle **inverse l''ordre**
      (la courbe descend).'
    - 'Le **tableau de variations** : une ligne pour $x$ avec les valeurs charnières, une ligne pour $f$
      avec les flèches et les valeurs aux virages.'
    - 'Le **maximum** est la plus grande valeur **atteinte** (Module 6 : pas un simple majorant) ; on
      le cherche aux changements de flèche et aux bornes.'
    methode:
      titre: Lire une courbe ou un tableau de variations
      etapes:
      - '**Image de $a$ :** pars de $a$ sur l''axe horizontal, va jusqu''à la courbe, lis l''ordonnée.'
      - '**Antécédents de $k$ :** trace la droite $y = k$ ; les abscisses des points d''intersection sont
        les antécédents, et leur nombre est le nombre de solutions de $f\left(x\right) = k$.'
      - '**Signe de $f$ :** $f\left(x\right) > 0$ là où la courbe est **au-dessus** de l''axe des abscisses.'
      - Dans un tableau, les **extremums** se lisent aux changements de flèche.
    exemple_resolu: 'Tableau de variations de $f$ sur $\left[-2\,;\,4\right]$ : $f$ décroît de $f\left(-2\right)
      = 3$ à $f\left(1\right) = -1$, puis croît jusqu''à $f\left(4\right) = 5$. a) Minimum de $f$ ? b)
      Nombre de solutions de $f\left(x\right) = 0$ ? c) Compare $f\left(2\right)$ et $f\left(3\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) Le minimum se lit au creux, là où la flèche change de sens. | $\min f = -1$, atteint en $x
      = 1$ |

      | b) $f$ descend de $3$ à $-1$, puis remonte de $-1$ à $5$ : une traversée de $0$ par flèche. |
      $f\left(x\right) = 0$ a **2 solutions** |

      | c) $2$ et $3$ sont dans le même intervalle $\left[1\,;\,4\right]$, où $f$ croît. | $f\left(2\right)
      < f\left(3\right)$ |

      | **Vérification :** $f\left(-2\right) > 0$, $f\left(4\right) > 0$ et $\min f < 0$ : deux passages
      par $0$, cohérent. ✓ | |'
    erreurs_frequentes:
    - erreur: comparer deux nombres situés de part et d'autre d'un virage.
      correction: un sens de variation ne compare que deux nombres du **même** intervalle ; et une fonction
        décroissante **inverse** l'ordre.
    - erreur: confondre le maximum et l'abscisse où il est atteint.
      correction: 'le maximum est une **valeur de $f$**, donc une ordonnée : « le maximum est $4$, atteint
        pour $x = 0$ ».'
    declic: null
    figures: []
  - id: TleD_M08_L3
    numero: '8.3'
    titre: Parité et fonctions de référence
    retenir:
    - '$f$ est **paire** si, pour tout $x$ de $D_{f}$, $-x \in D_{f}$ et $f\left(-x\right) = f\left(x\right)$
      : courbe **symétrique par rapport à l''axe des ordonnées**.'
    - '$f$ est **impaire** si, pour tout $x$ de $D_{f}$, $-x \in D_{f}$ et $f\left(-x\right) = -f\left(x\right)$
      : courbe **symétrique par rapport à l''origine**.'
    - 'Si $D_{f}$ n''est pas symétrique par rapport à $0$, $f$ n''est **ni paire ni impaire** : la conclusion
      tombe dès la première ligne.'
    methode:
      titre: Étudier la parité de $f$
      etapes:
      - Vérifie que $D_{f}$ est **symétrique** par rapport à $0$.
      - Calcule $f\left(-x\right)$ en mettant $-x$ **entre parenthèses**.
      - 'Compare : $f\left(-x\right) = f\left(x\right)$, paire ; $f\left(-x\right) = -f\left(x\right)$,
        impaire ; sinon ni l''une ni l''autre.'
      - 'Pour conclure « ni l''une ni l''autre », un contre-exemple numérique suffit : $a = 1$ marche
        presque toujours.'
    exemple_resolu: 'Étudie la parité de $f\left(x\right) = \frac{x}{x^{2} + 1}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le dénominateur ne s''annule jamais : domaine symétrique. | $D_{f} = \mathbb{R}$ |

      | Je remplace chaque $x$ par $-x$, parenthèses comprises. | $f\left(-x\right) = \frac{-x}{\left(-x\right)^{2}
      + 1} = \frac{-x}{x^{2} + 1}$ |

      | Numérateur changé de signe, dénominateur inchangé : c''est l''opposé. | $f\left(-x\right) = -f\left(x\right)$
      : **$f$ est impaire** |

