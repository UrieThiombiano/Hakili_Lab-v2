  - numero: 12
    etoiles: 1
    enonce: 'Étudie les variations de : a) $f\left(x\right) = x^{2} - 6x + 5$ ; b) $g\left(x\right) =
      -2x^{2} + 8x - 3$ ; c) $h\left(x\right) = x^{3} - 12x$.


      ### Entraînement ★★'
    correction: 'a) $f'' = 2x - 6$ : minimum $f\left(3\right) = -4$. b) $g'' = -4x + 8$ : maximum $g\left(2\right)
      = 5$. c) $h'' = 3\left(x - 2\right)\left(x + 2\right)$ : maximum local $h\left(-2\right) = 16$,
      minimum local $h\left(2\right) = -16$.'
  - numero: 13
    etoiles: 2
    enonce: Soit $f\left(x\right) = \frac{2x + 1}{x - 3}$. a) Limites de $f$ en $+\infty$, $-\infty$,
      $3^{+}$ et $3^{-}$. b) Déduis-en les asymptotes de $\mathcal{C}_{f}$.
    correction: a) $2$ en $\pm\infty$ ; $+\infty$ en $3^{+}$ ($\frac{7}{0^{+}}$) ; $-\infty$ en $3^{-}$.
      b) Asymptote horizontale $y = 2$, asymptote verticale $x = 3$.
  - numero: 14
    etoiles: 2
    enonce: 'Lève l''indétermination puis conclus : a) $\lim\limits_{x \to +\infty} \left(x^{2} - x\right)$
      (factorise par $x^{2}$) ; b) $\lim\limits_{x \to 2} \frac{x^{2} - 4}{x - 2}$.'
    correction: a) $x^{2}\left(1 - \frac{1}{x}\right) \to +\infty \times 1 = +\infty$. b) $\frac{\left(x
      - 2\right)\left(x + 2\right)}{x - 2} = x + 2 \to 4$.
  - numero: 15
    etoiles: 2
    enonce: Soit $f\left(x\right) = \frac{x^{2} + 3}{x - 1}$ sur $\mathbb{R} \setminus \{1\}$. a) Montre
      que $f'\left(x\right) = \frac{x^{2} - 2x - 3}{\left(x - 1\right)^{2}}$. b) Étudie le signe de $f'$.
      c) Dresse le tableau de variations (sans les limites).
    correction: 'a) $\frac{2x\left(x - 1\right) - \left(x^{2} + 3\right)}{\left(x - 1\right)^{2}} = \frac{x^{2}
      - 2x - 3}{\left(x - 1\right)^{2}}$ ✓. b) Numérateur $= \left(x - 3\right)\left(x + 1\right)$, dénominateur
      $> 0$ : $f'' > 0$ sur $\left]-\infty\,;\,-1\right[ \cup \left]3\,;\,+\infty\right[$. c) Maximum
      local $f\left(-1\right) = -2$, minimum local $f\left(3\right) = 6$.'
  - numero: 16
    etoiles: 2
    enonce: '*(Entrainement intensif, Boulsa.)* Un maraîcher dispose de 40 m de grillage pour clôturer
      un enclos rectangulaire adossé à un mur. Si $x$ est la largeur, l''aire est $A\left(x\right) = x\left(40
      - 2x\right)$ pour $x \in \left]0\,;\,20\right[$. a) Développe et calcule $A''\left(x\right)$. b)
      Signe de $A''$ et tableau de variations. c) Dimensions donnant l''aire maximale, et cette aire.'
    correction: 'a) $A = 40x - 2x^{2}$, $A'' = 40 - 4x$. b) $A'' > 0$ pour $x < 10$ : croissante puis
      décroissante. c) Largeur $10$ m, longueur $20$ m, aire maximale $\mathbf{200}$ m².'
  - numero: 17
    etoiles: 2
    enonce: '*(Trouve l''erreur.)* Pour dériver $f\left(x\right) = \left(x^{2} + 1\right)\left(3x - 2\right)$,
      Marcel écrit « $f''\left(x\right) = 2x \times 3 = 6x$ ». Explique l''erreur, calcule la dérivée
      de deux façons (produit ; puis en développant) et vérifie qu''elles coïncident.'
    correction: '$\left(uv\right)'' \ne u''v''$. Produit : $2x\left(3x - 2\right) + 3\left(x^{2} + 1\right)
      = 9x^{2} - 4x + 3$. Développé : $f = 3x^{3} - 2x^{2} + 3x - 2$, même dérivée ✓.'
  - numero: 18
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Explique en quelques lignes le lien entre le signe de $f''$
      et le sens de variation de $f$, en partant de ce que $f''\left(a\right)$ est la pente de la tangente.


      ### ★★★ Défis de maîtrise'
    correction: '$f''\left(a\right)$ est la pente de la tangente ; près de $a$ la courbe est presque confondue
      avec elle. Pente positive sur tout un intervalle : la courbe y monte, donc $f$ est croissante ;
      pente négative : décroissante.'
  - numero: 19
    etoiles: 3
    enonce: 'Soit $n$ un entier naturel non nul et $a$ un réel. a) Vérifie, en développant, l''identité

      $$x^{n} - a^{n} = \left(x - a\right)\left(x^{n-1} + a\,x^{n-2} + a^{2}x^{n-3} + \dots + a^{n-1}\right)$$

      sur les cas $n = 2$ et $n = 3$. b) Déduis-en $\lim\limits_{x \to a} \frac{x^{n} - a^{n}}{x - a}$.
      c) Conclus sur la dérivée de $x \longmapsto x^{n}$ en $a$.'
    correction: '*Le facteur $x - a$ du dénominateur doit disparaître : l''identité le met en facteur
      au numérateur.* a) $\left(x - a\right)\left(x + a\right) = x^{2} - a^{2}$ ; $\left(x - a\right)\left(x^{2}
      + ax + a^{2}\right) = x^{3} - a^{3}$ (termes intermédiaires télescopiques). b) Après simplification,
      somme de $n$ termes tendant chacun vers $a^{n-1}$ : limite $n\,a^{n-1}$. c) C''est le taux d''accroissement
      de $x \longmapsto x^{n}$ en $a$ : $f''\left(a\right) = n\,a^{n-1}$, d''où $\left(x^{n}\right)''
      = nx^{n-1}$.'
  - numero: 20
    etoiles: 3
    enonce: Soit $f\left(x\right) = \frac{\left(2x - 1\right)^{2}}{x^{2} + 1}$ sur $\mathbb{R}$. Calcule
      $f'\left(x\right)$ sous forme entièrement factorisée, étudie son signe, puis dresse le tableau de
      variations en donnant les extremums locaux.
    correction: '*Ne pas développer : garder le facteur commun $2x - 1$.* $u'' = 4\left(2x - 1\right)$,
      $v'' = 2x$, d''où $f''\left(x\right) = \frac{2\left(2x - 1\right)\left[2\left(x^{2} + 1\right) -
      x\left(2x - 1\right)\right]}{\left(x^{2} + 1\right)^{2}} = \frac{2\left(2x - 1\right)\left(x + 2\right)}{\left(x^{2}
      + 1\right)^{2}}$. Dénominateur $> 0$ : $f''$ a le signe de $\left(2x - 1\right)\left(x + 2\right)$,
      positif à l''extérieur de $-2$ et $\frac{1}{2}$. Maximum local $f\left(-2\right) = 5$ ; minimum
      (global) $f\left(\frac{1}{2}\right) = 0$.'
  - numero: 21
    etoiles: 3
    enonce: 'Voici deux extraits de la copie de Boukary. Pour chacun, dis pourquoi le raisonnement est
      faux et donne la limite correcte avec sa justification.


      | Extrait | Ce que Boukary a écrit |

      |---|---|

      | 1 | Pour $\lim\limits_{x \to 2} \frac{x^{2} - 4}{x^{2} - 3x + 2}$ : les deux étages tendent vers
      $0$, donc la limite vaut $\frac{0}{0} = 1$. |

      | 2 | Pour $\lim\limits_{x \to +\infty} \frac{3x^{2} - x}{x^{2} + 5}$ : les deux étages tendent
      vers $+\infty$, donc la limite vaut $\frac{+\infty}{+\infty} = 1$. |'
    correction: '*Les deux extraits traitent un symbole comme un nombre : $\frac{0}{0}$ et $\frac{\infty}{\infty}$
      sont des formes indéterminées, pas des valeurs.* Extrait 1 : $\frac{\left(x - 2\right)\left(x +
      2\right)}{\left(x - 2\right)\left(x - 1\right)} = \frac{x + 2}{x - 1} \to 4$. Extrait 2 : $\frac{x^{2}\left(3
      - \frac{1}{x}\right)}{x^{2}\left(1 + \frac{5}{x^{2}}\right)} \to 3$.'
  - numero: 22
    etoiles: 3
    enonce: Dans une plaque carrée de $30$ cm de côté, un artisan de Kaya découpe aux quatre coins des
      carrés de côté $x$ cm, puis relève les bords pour obtenir une boîte sans couvercle. Détermine $x$
      rendant le volume maximal, ainsi que ce volume, par une étude complète.
    correction: '*Base carrée de côté $30 - 2x$, hauteur $x$ ; le domaine est $\left]0\,;\,15\right[$.*
      $V\left(x\right) = x\left(30 - 2x\right)^{2}$ et $V''\left(x\right) = \left(30 - 2x\right)\left(30
      - 6x\right)$. Sur $\left]0\,;\,15\right[$, $30 - 2x > 0$ : $V''$ a le signe de $30 - 6x$, positif
      avant $5$, négatif après. Maximum en $x = 5$ : boîte $20 \times 20 \times 5$, volume $\mathbf{2\,000}$
      cm³.'
  - numero: 23
    etoiles: 3
    enonce: Soit $f\left(x\right) = x^{3} - 3x$ sur $\mathbb{R}$, de courbe $\mathcal{C}$. Détermine tous
      les points de $\mathcal{C}$ où la tangente est parallèle à $y = 9x - 4$, écris l'équation de chacune
      de ces tangentes, et dis combien de points de $\mathcal{C}$ admettent une tangente horizontale.
    correction: '*« Tangente parallèle » se traduit par une égalité de coefficients directeurs.* $f''\left(x\right)
      = 3x^{2} - 3 = 9$ donne $x = \pm 2$, points $M_{1}\left(2\,;\,2\right)$ et $M_{2}\left(-2\,;\,-2\right)$
      ; tangentes $y = 9x - 16$ et $y = 9x + 16$ (distinctes de la droite donnée). Tangente horizontale
      : $f'' = 0$ donne $x = \pm 1$, soit **deux points**, $\left(-1\,;\,2\right)$ et $\left(1\,;\,-2\right)$.'
  - numero: 24
    etoiles: 3
    enonce: a) $f\left(x\right) = ax^{2} + bx + c$ ; sa courbe passe par $A\left(1\,;\,4\right)$, la tangente
      en $A$ a pour coefficient directeur $5$, et $f'\left(0\right) = 1$. Retrouve $a$, $b$, $c$. b) $g\left(x\right)
      = \frac{ax + b}{x - 2}$ ; on sait que $\lim\limits_{x \to +\infty} g\left(x\right) = 3$ et $g\left(0\right)
      = -1$. Retrouve $a$ et $b$.
    correction: '*Traduire chaque phrase en une équation, commencer par celle à une seule inconnue.* a)
      $f'' = 2ax + b$ ; $f''\left(0\right) = 1$ donne $b = 1$ ; $f''\left(1\right) = 5$ donne $a = 2$
      ; $f\left(1\right) = 4$ donne $c = 1$ : $f\left(x\right) = 2x^{2} + x + 1$. b) En $+\infty$, $g
      \to a$, donc $a = 3$ ; $g\left(0\right) = \frac{b}{-2} = -1$ donne $b = 2$ : $g\left(x\right) =
      \frac{3x + 2}{x - 2}$.


      ---


      *Fin du livret de remédiation Tle D. Collection Hakili Lab, Édition 2026.*'
  fiche_revision:
  - '**Polynôme en $\pm\infty$.** Limite du terme de plus haut degré.'
  - '**Fraction rationnelle en $\pm\infty$.** Quotient des termes de plus haut degré.'
  - '**Point interdit.** Signe du dénominateur de chaque côté : $0^{+}$ donne $+\infty$, $0^{-}$ donne
    $-\infty$.'
  - '**Forme « $\frac{0}{0}$ ».** Factoriser, simplifier, remplacer.'
  - '**Asymptotes.** $\lim = \ell$ en $\pm\infty$ : $y = \ell$ ; $\lim = \pm\infty$ en $a$ : $x = a$.'
  - '**Dérivées.** $\left(x^{n}\right)'' = nx^{n-1}$ ; $\left(\frac{1}{x}\right)'' = -\frac{1}{x^{2}}$
    ; $\left(\sqrt{x}\right)'' = \frac{1}{2\sqrt{x}}$.'
  - '**Produit et quotient.** $u''v + uv''$ ; $\frac{u''v - uv''}{v^{2}}$.'
  - '**Tangente et variations.** $y = f''\left(a\right)\left(x - a\right) + f\left(a\right)$ ; $f'' >
    0$ ⟹ croissante ; extremum si $f''$ change de signe.'
  trouve_erreur:
  - faux: $\lim\limits_{x \to 2^{+}} \frac{x + 1}{x - 2} = \frac{x}{x} = 1$
    correction: 'Plus haut degré : seulement en $\pm\infty$. Ici $+\infty$.'
  - faux: $\left(uv\right)' = u'v'$
    correction: $\left(uv\right)' = u'v + uv'$
  - faux: 'Tangente : $y = f''\left(a\right)\left(x - a\right)$'
    correction: $y = f'\left(a\right)\left(x - a\right) + f\left(a\right)$
  - faux: $f'\left(0\right) = 0$ donc extremum en $0$
    correction: Il faut un **changement de signe** de $f'$.
