    correction: a) $\left(x - 1\right)\left(x^{2} + x + 1\right)$ ; b) $\left(x + 1\right)\left(x^{2}
      - x + 1\right)$ ; c) $\left(2 - y\right)\left(4 + 2y + y^{2}\right)$ ; d) $\left(3a + 4\right)\left(9a^{2}
