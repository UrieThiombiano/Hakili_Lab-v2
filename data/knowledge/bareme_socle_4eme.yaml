  objet: Nommer l'opération menant à 5 000x = 35 000, puis résoudre 5 000x - 3 000 = 32 000 dans D
  reponse_attendue: ajouter 3 000 aux deux membres (5 000x = 35 000) ; x = 7 sacs
  solution: '5 000x = 32 000 + 3 000 = 35 000 ; x = 35 000 / 5 000 = 7. Barème (2 pts) : 1 pt pour l''opération
    nommée « ajouter 3 000 aux deux membres » ; 1 pt pour la solution x = 7. L''opération simplement effectuée
    sans être nommée garde son point (sur la solution).'
