- niveau: 3eme
  module: 2
  module_titre: 'Les nombres relatifs : les quatre opérations'
  pourquoi: Le calcul relatif est le langage de toute l'algèbre de 3ème. Une règle de signes mal fixée,
    et chaque exercice de l'année devient une loterie.
  diagnostic:
  - question: 'Range dans l''ordre croissant : $-3$ ; $+5$ ; $-7$ ; $0$ ; $+2$.'
    reponse: $-7 < -3 < 0 < +2 < +5$
  - question: 'Calcule : $\left(-5\right) + \left(-9\right)$ ; $\left(-12\right) + \left(+7\right)$.'
    reponse: $-14$ ; $-5$
  - question: 'Calcule : $\left(+4\right) - \left(+9\right)$ ; $6 - \left(-3\right)$.'
    reponse: $-5$ ; $9$
  - question: 'Calcule : $\left(-7\right) \times \left(+6\right)$ ; $\left(-8\right) \times \left(-9\right)$.'
    reponse: $-42$ ; $+72$
  - question: 'Calcule : $\left(-45\right) \div \left(+9\right)$ ; $-5 + 3 \times \left(-4\right)$.'
    reponse: $-5$ ; $-17$
  lecons:
  - id: 3eme_M02_L1
    numero: '2.1'
    titre: 'Droite graduée : opposé, comparaison, distance à zéro'
    retenir:
    - 'Un **relatif** porte un signe : $+3$ (écrit aussi $3$) ou $-3$. Sur une **droite graduée**, il
      est l''**abscisse** d''un point.'
    - '**Opposé** : même distance à zéro, signe contraire. Opposé de $-7$ : $+7$ ; opposé de $0$ : $0$.'
    - '**Distance à zéro** (valeur absolue) : le nombre sans son signe. Elle n''est **jamais** négative.'
    - '**Comparer** : le plus petit est le plus **à gauche**. Négatif $< 0 <$ positif ; entre deux négatifs,
      le plus petit a la **plus grande** distance à zéro : $-7 < -3$.'
    - 'Un **écart** entre deux températures, deux altitudes, est une distance : il est toujours **positif**.'
    methode:
      titre: Ranger des relatifs dans l'ordre croissant
      etapes:
      - '**Trie** en trois paquets : négatifs, zéro, positifs.'
      - '**Range les positifs** comme d''habitude.'
      - '**Range les négatifs** : compare les distances à zéro, puis **inverse** l''ordre.'
      - '**Recolle** : négatifs, puis $0$, puis positifs.'
    exemple_resolu: 'Range dans l''ordre croissant : $-5{,}2$ ; $+1{,}8$ ; $-5{,}02$ ; $0$ ; $-0{,}9$
      ; $+7$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On trie par signe. | négatifs : $-5{,}2$ ; $-5{,}02$ ; $-0{,}9$ / positifs : $+1{,}8$ ; $+7$ |

      | On compare les distances à zéro des négatifs, puis on **inverse**. | $0{,}9 < 5{,}02 < 5{,}2$
      donc $-5{,}2 < -5{,}02 < -0{,}9$ |

      | On recolle autour de $0$. | $-5{,}2 < -5{,}02 < -0{,}9 < 0 < +1{,}8 < +7$ |

      | **Vérification :** l''ordre est celui de la lecture de gauche à droite. ✓ | |'
    erreurs_frequentes:
    - erreur: $-3{,}7 > -3{,}07$ « car $7 > 0$ ».
      correction: '$3{,}7 > 3{,}07$, on inverse : $-3{,}7 < -3{,}07$.'
    - erreur: « la distance à zéro de $-6$ est $-6$ ».
      correction: 'une distance n''a pas de signe : c''est $6$.'
    declic: null
    figures:
    - figures/m02_f1.svg
  - id: 3eme_M02_L2
    numero: '2.2'
    titre: Additionner et soustraire des relatifs
    retenir:
    - '**Même signe** : on ajoute les distances à zéro, on garde le signe : $\left(-5\right) + \left(-9\right)
      = -14$.'
    - '**Signes contraires** : on soustrait les distances à zéro, on prend le signe du plus éloigné de
      zéro : $\left(-12\right) + \left(+7\right) = -5$. De plus $a + 0 = a$, et la somme de deux opposés
      est nulle.'
    - '**Soustraire, c''est ajouter l''opposé** :'
    - '**Parenthèses** : $+\left(+a\right) = +a$ ; $+\left(-a\right) = -a$ ; $-\left(+a\right) = -a$ ;
      $-\left(-a\right) = +a$.'
    - 'Un signe $-$ devant un **bloc** change le signe de **chaque** terme : $-\left(7 - 10\right) = -7
      + 10 = +3$.'
    methode:
      titre: Calculer une somme algébrique
      etapes:
      - '**Supprime les parenthèses** avec les règles des signes.'
      - '**Regroupe** les positifs ensemble, les négatifs ensemble.'
      - Calcule chaque groupe.
      - Termine par une addition de deux relatifs de signes contraires.
    exemple_resolu: 'Calcule $S = \left(-13\right) + \left(+8\right) - \left(-5\right) - \left(+11\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On nettoie l''écriture : $-\left(-5\right) = +5$, $-\left(+11\right) = -11$. | $S = -13 + 8 +
      5 - 11$ |

      | On regroupe positifs et négatifs. | $S = \left(8 + 5\right) - \left(13 + 11\right) = 13 - 24$
      |

      | Signes contraires : on soustrait les distances, signe du plus lourd. | $S = -11$ |

      | **Vérification :** $-13 + 8 = -5$ ; $-5 + 5 = 0$ ; $0 - 11 = -11$. ✓ | |'
    erreurs_frequentes:
    - erreur: $6 - \left(-3\right) = 3$.
      correction: 'soustraire $-3$, c''est ajouter $+3$ : $6 + 3 = 9$.'
    - erreur: $-\left(7 - 10\right) = -7 - 10$.
      correction: $-\left(7 - 10\right) = -7 + 10 = +3$.
    declic: 'La soustraction cache une addition — Si les doubles signes te piègent encore, récris **toute**
      soustraction en addition de l''opposé avant de calculer : $6 - \left(-3\right) = 6 + 3$. C''est
      le réflexe qui te servira au module 5 pour réduire $3x - \left(2x - 5\right)$.'
    figures: []
  - id: 3eme_M02_L3
    numero: '2.3'
    titre: Multiplier et diviser des relatifs
    retenir:
    - '**Même signe** $\to$ **positif** : $\left(-8\right) \times \left(-9\right) = +72$ ; $\left(-45\right)
      \div \left(-9\right) = +5$.'
    - '**Signes contraires** $\to$ **négatif** : $\left(-7\right) \times \left(+6\right) = -42$ ; $\left(+45\right)
      \div \left(-9\right) = -5$.'
    - 'Plusieurs facteurs : nombre **pair** de négatifs $\to +$ ; **impair** $\to -$. Un produit est nul
      dès qu''un facteur est nul.'
    - '**Puissances** : exposant pair $\to$ positif, $\left(-3\right)^{4} = 81$ ; exposant impair $\to$
      signe de la base, $\left(-3\right)^{3} = -27$. Attention : $\left(-5\right)^{2} = +25$ mais $-5^{2}
      = -25$.'
    - '**Barre de fraction** : elle groupe. On calcule tout le numérateur, tout le dénominateur, puis
      on applique la règle des signes.'
    methode:
      titre: Trouver le signe avant de calculer
      etapes:
      - '**Compte** les facteurs négatifs.'
      - Pair $\to$ écris $+$ ; impair $\to$ écris $-$. Le signe est fixé.
      - Multiplie les **distances à zéro**, sans plus penser aux signes.
      - 'S''il y a des $+$ et des $-$ : **priorités** du module 1, les produits d''abord.'
    exemple_resolu: 'Calcule $P = \left(-2\right) \times \left(+5\right) \times \left(-3\right) \times
      \left(-1\right)$ puis $Q = -5 + 3 \times \left(-4\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $P$ : trois facteurs négatifs, nombre impair. | signe de $P$ : $-$ |

      | Le signe fixé, on multiplie les distances à zéro. | $2 \times 5 \times 3 \times 1 = 30$, donc
      $P = -30$ |

      | $Q$ : le produit est prioritaire, puis addition de même signe. | $3 \times \left(-4\right) = -12$
      ; $Q = -5 - 12 = -17$ |

      | **Vérification :** $-10$ ; $+30$ ; $-30$ pour $P$. ✓ | |'
    erreurs_frequentes:
    - erreur: 'appliquer « moins par moins » à une addition : $\left(-3\right) + \left(-4\right) = +7$.'
      correction: deux dettes s'ajoutent, $-7$.
    - erreur: $-5 + 3 \times \left(-4\right) = \left(-2\right) \times \left(-4\right) = +8$.
      correction: produit d'abord, $-5 - 12 = -17$.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Donne l''opposé de : $+8$ ; $-3{,}5$ ; $0$ ; $-\frac{2}{3}$.'
    correction: $-8$ ; $+3{,}5$ ; $0$ ; $+\frac{2}{3}$.
  - numero: 2
    etoiles: 1
    enonce: 'Remplace $\dots$ par $<$ ou $>$ : a) $-4 \dots +1$ ; b) $-9 \dots -2$ ; c) $-3{,}7 \dots
      -3{,}07$ ; d) $0 \dots -0{,}5$.'
    correction: a) $<$ ; b) $<$ ; c) $<$ (car $3{,}7 > 3{,}07$) ; d) $>$.
  - numero: 3
    etoiles: 1
    enonce: 'Range dans l''ordre décroissant : $-2{,}5$ ; $+3$ ; $-2{,}05$ ; $0$ ; $-4$ ; $+0{,}3$.'
    correction: $+3 > +0{,}3 > 0 > -2{,}05 > -2{,}5 > -4$.
  - numero: 4
    etoiles: 1
    enonce: 'Calcule : a) $\left(-8\right) + \left(-7\right)$ ; b) $\left(+9\right) + \left(-15\right)$
      ; c) $\left(-6{,}5\right) + \left(+2{,}5\right)$ ; d) $\left(-3\right) + \left(+3\right)$.'
    correction: a) $-15$ ; b) $-6$ ; c) $-4$ ; d) $0$.
  - numero: 5
    etoiles: 1
    enonce: 'Calcule : a) $\left(+5\right) - \left(+12\right)$ ; b) $\left(-4\right) - \left(-10\right)$
      ; c) $0 - \left(-7\right)$ ; d) $\left(-2{,}5\right) - \left(+1{,}5\right)$.'
    correction: a) $-7$ ; b) $-4 + 10 = +6$ ; c) $+7$ ; d) $-4$.
  - numero: 6
    etoiles: 1
    enonce: 'Simplifie puis calcule : $T = \left(-7\right) - \left(-12\right) + \left(-8\right) - \left(+3\right)
      + \left(+6\right)$.'
    correction: $T = -7 + 12 - 8 - 3 + 6 = 18 - 18 = 0$.
  - numero: 7
    etoiles: 1
    enonce: 'Calcule : a) $\left(-9\right) \times \left(+7\right)$ ; b) $\left(-12\right) \times \left(-4\right)$
      ; c) $\left(+63\right) \div \left(-9\right)$ ; d) $\left(-56\right) \div \left(-8\right)$.'
    correction: a) $-63$ ; b) $+48$ ; c) $-7$ ; d) $+7$.
  - numero: 8
    etoiles: 1
    enonce: 'Donne le signe sans calculer, puis calcule : a) $\left(-1\right) \times \left(-2\right) \times
      \left(-3\right) \times \left(-4\right)$ ; b) $\left(-5\right) \times \left(+2\right) \times \left(-3\right)
      \times \left(-2\right)$.'
    correction: 'a) Quatre négatifs (pair) : $+24$. b) Trois négatifs (impair) : $-60$.'
  - numero: 9
    etoiles: 1
    enonce: 'Calcule en respectant les priorités : a) $7 - 4 \times \left(-3\right)$ ; b) $\left(-6\right)
      \times \left(-5\right) - 8 \times \left(+4\right)$ ; c) $\left(-20\right) \div \left(-4\right) +
      \left(-9\right)$.'
    correction: a) $7 + 12 = 19$ ; b) $30 - 32 = -2$ ; c) $5 - 9 = -4$.
  - numero: 10
    etoiles: 1
    enonce: 'Trouve le nombre manquant : a) $\left(-7\right) \times \dots = +42$ ; b) $\dots \div \left(-6\right)
      = -8$ ; c) $\left(-5\right) + \dots = -1$.'
    correction: a) $-6$ ; b) $+48$ ; c) $+4$.
  - numero: 11
    etoiles: 1
    enonce: Trace une droite graduée (1 carreau pour 1 unité) et place $A\left(-4\right)$, $B\left(+2{,}5\right)$,
      $C\left(-1{,}5\right)$, $D\left(+5\right)$.
    correction: 'De gauche à droite : $A\left(-4\right)$, $C\left(-1{,}5\right)$, $B\left(+2{,}5\right)$,
      $D\left(+5\right)$.'
  - numero: 12
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $-12$ ; $+7$ ; $-3{,}4$ ; $-3{,}04$ ; $0$ ; $+6{,}9$ ; $-12{,}1$.'
    correction: $-12{,}1 < -12 < -3{,}4 < -3{,}04 < 0 < +6{,}9 < +7$.
  - numero: 13
    etoiles: 1
    enonce: Donne tous les entiers relatifs $x$ tels que $-3{,}5 < x < 2{,}1$.
    correction: $-3$ ; $-2$ ; $-1$ ; $0$ ; $1$ ; $2$.
  - numero: 14
    etoiles: 1
    enonce: À midi, la température à Ouahigouya est de $34$ °C ; dans une chambre froide, de $-6$ °C.
      Quel est l'écart ?
    correction: $34 - \left(-6\right) = 40$ °C.
  - numero: 15
    etoiles: 1
    enonce: 'Calcule : a) $\left(-15\right) + \left(-8\right)$ ; b) $\left(+24\right) + \left(-30\right)$
      ; c) $\left(-17\right) + \left(+17\right)$ ; d) $\left(-6{,}4\right) + \left(+2{,}9\right)$.'
    correction: a) $-23$ ; b) $-6$ ; c) $0$ ; d) $-3{,}5$.
  - numero: 16
    etoiles: 1
    enonce: 'Calcule : a) $\left(+8\right) - \left(+13\right)$ ; b) $\left(-9\right) - \left(-14\right)$
      ; c) $\left(-21\right) - \left(+9\right)$ ; d) $0 - \left(-4{,}5\right)$.'
    correction: a) $-5$ ; b) $+5$ ; c) $-30$ ; d) $+4{,}5$.
  - numero: 17
    etoiles: 1
    enonce: 'Simplifie puis calcule : a) $A = \left(-9\right) + \left(+15\right) - \left(+7\right)$ ;
      b) $B = -8 - \left(-12\right) + \left(-5\right) - \left(+9\right)$ ; c) $C = 14 - 20 + 6 - 11 +
      3$.'
    correction: a) $A = 15 - 16 = -1$ ; b) $B = 12 - 22 = -10$ ; c) $C = 23 - 31 = -8$.
  - numero: 18
    etoiles: 1
    enonce: 'Complète : a) $\left(-8\right) + \dots = -3$ ; b) $\dots + \left(+7\right) = -2$ ; c) $\dots
      - \left(-4\right) = 10$.'
    correction: a) $+5$ ; b) $-9$ ; c) $+6$.
  - numero: 19
    etoiles: 1
    enonce: Le solde d'un commerçant est de $-13\,500$ FCFA. Il encaisse $45\,000$ FCFA, puis paie une
      facture de $38\,000$ FCFA. Écris le nouveau solde en une somme algébrique, puis calcule-le.
    correction: '$-13\,500 + 45\,000 - 38\,000 = 45\,000 - 51\,500 = -6\,500$ FCFA : encore à découvert.'
  - numero: 20
    etoiles: 1
    enonce: Un plongeur est à $-12$ m. Il descend de $5$ m, puis remonte de $9$ m. À quelle profondeur
      est-il ?
    correction: '$-12 - 5 + 9 = -8$ : il est à $8$ m de profondeur.'
  - numero: 21
    etoiles: 1
