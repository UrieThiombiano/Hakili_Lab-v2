- niveau: 4eme
  module: 7
  module_titre: Égalités, équations et inéquations dans D
  pourquoi: 'Devant $x + 15 = 4$, beaucoup écrivent « $x = 4 + 15$ » : ils recopient l''opération au lieu
    de la contrarier. Tu connais la règle des deux membres, c''est son application qui dérape.'
  diagnostic:
  - question: Résous $x + 15 = 4$.
    reponse: $x = -11$
  - question: Résous $7x = 42$.
    reponse: $x = 6$
  - question: Résous $3x + 4 = 19$.
    reponse: $3x = 15$, $x = 5$
  - question: Le nombre $5$ est-il solution de $2x + 1 = 11$ ? Justifie.
    reponse: oui, $2 \times 5 + 1 = 11$
  - question: 'Écris en équation : « le triple d''un nombre, augmenté de $5$, vaut $26$ ».'
    reponse: $3x + 5 = 26$
  lecons:
  - id: 4eme_M07_L1
    numero: '7.1'
    titre: Une égalité se transforme des deux côtés à la fois
    retenir:
    - 'si $a = b$ : $a + c = b + c$, $a - c = b - c$, $a \times c = b \times c$, $a \div c = b \div c$
      ($c \ne 0$) ;'
    - '**les deux interdits :** opérer sur un seul membre, diviser par $0$ ;'
    - un $+$ s'enlève par un $-$, un facteur par une division, un diviseur par une multiplication ;
    - le **coefficient** ($3 \times x = 3x$) s'enlève par une **division**, jamais par une soustraction.
    methode:
      titre: Isoler l'inconnue
      etapes:
      - Repère l'opération qui gêne l'inconnue.
      - Applique son inverse **aux deux membres**, et écris cette ligne en entier.
      - Simplifie du côté de l'inconnue, puis calcule l'autre membre.
      - Vérifie dans l'égalité **de départ**.
    exemple_resolu: 'Trouve $f$ sachant que $f - 4{,}35 = 7{,}75$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La soustraction gêne $f$ : on ajoute $4{,}35$ des deux côtés. | $f - 4{,}35 + 4{,}35 = 7{,}75
      + 4{,}35$ |

      | À gauche, elles s''annulent. | $f = 7{,}75 + 4{,}35$ |

      | On calcule le second membre. | $f = 12{,}1$ |

      | **Vérification :** $12{,}1 - 4{,}35 = 7{,}75$ ✓ | |'
    erreurs_frequentes:
    - erreur: de $x - 7 = 5$, écrire « $x = 5 - 7$ ».
      correction: on ajoute $7$ des deux côtés, $x = 12$.
    - erreur: de $-2x = 10$, écrire « $x = 10 - \left(-2\right)$ ».
      correction: on divise, $x = -5$.
    declic: null
    figures:
    - figures/m07_f1.svg
  - id: 4eme_M07_L2
    numero: '7.2'
    titre: Résoudre $x + a = b$, $ax = b$ et $ax + b = c$
    retenir:
    - $x + a = b$ donne $x = b - a$ ; $x - a = b$ donne $x = b + a$ ;
    - $ax = b$ donne $x = b \div a$ ; $x \div a = b$ donne $x = b \times a$ (avec $a \ne 0$) ;
    - dans $ax + b = c$, on enlève **d'abord le terme**, ensuite le coefficient ;
    - '**dans $\mathbb{D}$**, une solution négative ou décimale est légitime : $4x = 22$ donne $x = 5{,}5$
      ;'
    - '$47 = x + 11$ se traite comme $x + 11 = 47$ ; prudence si le $-$ est **avant** l''inconnue : $6{,}7
      - x = 4{,}8$.'
    methode:
      titre: Résoudre $ax + b = c$
      etapes:
      - 'Retranche $b$ aux deux membres (ajoute-le si le signe est un moins) : il reste $ax = \dots$'
      - Divise les deux membres par $a$, règles de signes comprises.
      - Écris la solution sous forme décimale, sans arrondir.
      - Vérifie les deux membres de l'équation **de départ**.
    exemple_resolu: 'Résous $3x + 4 = 19$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux gênes : on enlève d''abord le terme. | $3x + 4 - 4 = 19 - 4$ |

      | Le terme a disparu. | $3x = 15$ |

      | On divise les deux membres par $3$. | $x = 15 \div 3 = 5$ |

      | **Vérification :** $3 \times 5 + 4 = 19$ et $19$ ✓ | |'
    erreurs_frequentes:
    - erreur: diviser d'abord dans $3x + 4 = 19$.
      correction: il faudrait diviser aussi le $4$ ; retranche $4$, puis divise par $3$.
    - erreur: de $4x = 22$, écrire « $x = 22 - 4$ ».
      correction: $x = 5{,}5$, décimal acceptable dans $\mathbb{D}$.
    declic: null
    figures: []
  - id: 4eme_M07_L3
    numero: '7.3'
    titre: Mettre un problème en équation
    retenir: []
    methode:
      titre: Mettre un problème en équation
      etapes:
      - Nomme ce qu'on cherche par une lettre, avec son unité.
      - Traduis chaque phrase en une opération sur l'inconnue.
      - Écris l'équation, puis résous-la.
      - Vérifie dans l'énoncé, puis réponds par une phrase.
    exemple_resolu: 'Un champ rectangulaire a un périmètre de $180$ m et une longueur de $55$ m. Sa largeur
      ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On nomme l''inconnue avec son unité. | $l$ est la largeur du champ, en m |

      | Le périmètre vaut deux fois la somme des dimensions. | $2 \times \left(55 + l\right) = 180$ |

      | On divise par $2$, puis on retranche $55$. | $55 + l = 90$, donc $l = 35$ |

      | **Vérification :** $\left(55 + 35\right) \times 2 = 180$ m ✓ La largeur mesure $35$ m. | |


      > #### DÉCLIC : la parenthèse qu''on oublie de distribuer

      >

      > Si $3\left(x + 5\right)$ te semble égal à $3x + 5$, le blocage n''est pas dans les équations :
      il est dans la distributivité, qui multiplie le facteur par **chacun** des deux termes. Reprends
      le module 5.'
    erreurs_frequentes:
    - erreur: calculer sans dire ce que représente la lettre.
      correction: écrire d'abord « $x$ est … , en … ».
    - erreur: traduire « le double d'un nombre, augmenté de $3$ » par $2\left(x + 3\right)$.
      correction: c'est $2x + 3$ ; la parenthèse exige le mot **somme**.
    declic: 'la parenthèse qu''on oublie de distribuer — Si $3\left(x + 5\right)$ te semble égal à $3x
      + 5$, le blocage n''est pas dans les équations : il est dans la distributivité, qui multiplie le
      facteur par **chacun** des deux termes. Reprends le module 5. #### ⚠ ATTENTION ! - **Erreur fréquente
      :** calculer sans dire ce que représente la lettre. **Correction :** écrire d''abord « $x$ est …
      , en … ». - **Erreur fréquente :** traduire « le double d''un nombre, augmenté de $3$ » par $2\left(x
      + 3\right)$. **Correction :** c''est $2x + 3$ ; la parenthèse exige le mot **somme**.'
    figures: []
  - id: 4eme_M07_L4
    numero: '7.4'
    titre: Premières inéquations et solutions sur une droite graduée
    retenir:
    - ajouter ou retrancher un même nombre **conserve** le sens ;
    - multiplier ou diviser par un **strictement positif conserve** le sens, par un **strictement négatif
      renverse** le sens ;
    - crochet **fermé** si l'inégalité est large ($\le$, $\ge$), **ouvert** si elle est stricte ($<$,
      $>$) ; on hachure la partie qui **ne convient pas** ;
    - 'retour au bon sens : si $n \le 18{,}8$ compte des sacs, la réponse est $18$ sacs.'
    methode:
      titre: Résoudre une inéquation et représenter ses solutions
      etapes:
      - Isole l'inconnue en enlevant d'abord les termes.
      - Divise par le coefficient, et **renverse le symbole** s'il est négatif.
      - 'Écris l''ensemble : $x < \dots$ , $x \le \dots$ , $x > \dots$ ou $x \ge \dots$'
      - Trace la droite graduée, place le nombre, oriente le crochet, hachure la partie exclue.
    exemple_resolu: 'Une remorque porte au plus $1\,200$ kg. Le plateau vide pèse $260$ kg, chaque sac
      de sucre $50$ kg. Combien de sacs au plus ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $n$ est le nombre de sacs, la charge limitée. | $260 + 50n \le 1\,200$ |

      | On retranche $260$, on divise par $50$, positif. | $50n \le 940$, donc $n \le 18{,}8$ |

      | Un nombre de sacs est entier. | $n = 18$ sacs au plus |

      | **Vérification :** $260 + 50 \times 18 = 1\,160 \le 1\,200$ ✓, et $19$ sacs donneraient $1\,210$
      kg | |'
    erreurs_frequentes:
    - erreur: de $-3x \ge 12$, écrire « $x \ge -4$ ».
      correction: '$-3$ est négatif, le symbole se renverse : $x \le -4$.'
    - erreur: répondre par un seul nombre.
      correction: on donne l'ensemble des solutions et on le représente.
    declic: null
    figures:
    - figures/m07_f4.svg
