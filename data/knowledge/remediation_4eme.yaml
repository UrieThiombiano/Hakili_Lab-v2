  fiche_revision:
  - '**Expression littérale.** On omet le $\times$ ; une lettre seule a pour coefficient $1$ ; $x^{2}
    = x \times x$, et non $2x$. Pour la valeur numérique, on remplace puis on calcule avec les priorités.'
  - '**Réduire.** On ne regroupe que les termes de même partie littérale : $5x + 3 - 2x = 3x + 3$ ; $3a
    + 5b$ ne se réduit pas.'
  - '**Développer.** $k\left(a + b\right) = ka + kb$ : le facteur atteint tous les termes, avec son signe.
    $\left(a + b\right)\left(c + d\right) = ac + ad + bc + bd$ : quatre produits, puis réduction.'
  - '**Signe moins.** Il retourne tous les termes : $-\left(a - b\right) = -a + b$.'
  - '**Factoriser.** $ka + kb = k\left(a + b\right)$ ; complète seulement si la parenthèse n''a plus rien
    en commun.'
  - '**Vérifier.** Remplace la lettre par $1$ dans les deux écritures : même nombre attendu.'
  trouve_erreur:
  - faux: $3a + 5b = 8ab$
    correction: 'Termes non semblables : $3a + 5b$ est déjà réduite.'
  - faux: $3\left(x + 5\right) = 3x + 5$
    correction: 'Le facteur atteint les deux termes : $3x + 15$.'
  - faux: $-\left(2a - 5\right) = -2a - 5$
    correction: 'Le moins retourne tout : $-2a + 5$.'
  - faux: $12a + 6b = 2\left(6a + 3b\right)$
    correction: 'Factorisation incomplète : $6\left(2a + b\right)$.'
