  competence_secondaire: null
  domaine: Activites geometriques
  objet: Calculer AB et AC en unités avec A(1 ; 2), B(7 ; 10), C(13 ; 2) (jardin de Ziniaré)
  reponse_attendue: AB = √(6² + 8²) = 10 unités ; AC = 12 unités
  solution: 'Vecteur AB(6 ; 8), AB = √100 = 10 ; vecteur AC(12 ; 0), AC = 12. Barème (2 pts) : 1 pt pour
    AB = 10 unités, 1 pt pour AC = 12 unités, la formule de distance ou les coordonnées du vecteur devant
    apparaître. Un résultat posé sans calcul ne prend pas son point.'
  si_echoue: Formule de la distance dans un repère orthonormal.
  probleme_parent: P1
- code: P1.2
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: N.PRIO
  competence_secondaire: G.RON
  domaine: Activites numeriques
  objet: Calculer en mètres le périmètre (AB = 10, BC = 10, AC = 12 unités, unité 10 m)
  reponse_attendue: périmètre 32 unités = 320 m
  solution: 'AB + BC + AC = 10 + 10 + 12 = 32 unités ; l''unité vaut 10 m : 320 m. Barème (3 pts) : 1
    pt pour l''addition donnant 32 unités ; 1 pt pour l''emploi de l''unité du repère comme facteur de
    conversion ; 1 pt pour 320 m. L''élève qui additionne ses propres longueurs de la question 1 garde
    les deux points de conversion.'
  si_echoue: Conversion des unités du repère en mètres, le facteur d'échelle étant appliqué au périmètre
    et non à chaque longueur séparément.
  probleme_parent: P1
- code: P1.3
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: N.PRIO
  competence_secondaire: null
  domaine: Activites numeriques
  objet: Calculer le coût de 320 m de clôture à 1 200 FCFA le mètre et conclure (budget 400 000 FCFA)
  reponse_attendue: 320 × 1 200 = 384 000 FCFA < 400 000 ; la somme suffit
  solution: 'Conclusion : « La clôture des 320 m revient à 384 000 FCFA, somme inférieure aux 400 000
    FCFA dont dispose Ousséni : cette somme suffit pour clôturer le jardin. » Barème (3 pts) : 1 pt pour
    le coût 384 000 FCFA ; 1 pt pour la comparaison explicite à 400 000 FCFA ; 1 pt pour la phrase de
    conclusion. L''élève qui compare correctement son propre coût au budget garde les deux derniers points.'
  si_echoue: Coût proportionnel à une longueur, puis comparaison à un budget.
  probleme_parent: P1
- code: P2.1
  partie: C
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: G.PYT
  competence_secondaire: G.THA
  domaine: Activites geometriques
  objet: Calculer BC (AB = 60 m, AC = 80 m, rectangle en A) puis MN (AM = 45 m) à Banfora
  reponse_attendue: BC = 100 m ; MN = (3/4) × 100 = 75 m
  solution: 'Pythagore (rectangle en A) : BC² = 60² + 80² = 10 000, BC = 100 m. Thalès ((MN)//(BC)) :
    MN/BC = AM/AB = 45/60 = 3/4. Barème (2 pts) : 1 pt pour BC = 100 m, égalité de Pythagore écrite dans
    le bon sens ; 1 pt pour MN = 75 m par le rapport de Thalès. Le rapport écrit à l''envers (60/45) ne
    prend pas le second point.'
  si_echoue: Théorème de Pythagore et rapport de Thalès.
  probleme_parent: P2
- code: P2.2
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: T.TRIR
  competence_secondaire: null
  domaine: Trigonometrie
  objet: Calculer sin ABC (AC = 80 m, BC = 100 m) puis la distance de M à (BC) avec MB = 15 m
  reponse_attendue: sin ABC = 80/100 = 0,8 ; distance de M à (BC) = MH = 15 × 0,8 = 12 m
  solution: 'Côté opposé à ABC : [AC], hypoténuse [BC]. H pied de la perpendiculaire à (BC) par M : MBH
    rectangle en H d''angle ABC en B, sin ABC = MH/MB. Barème (3 pts) : 1 pt pour le sinus identifié comme
    côté opposé / hypoténuse, 0,8 ; 1 pt pour la reconnaissance de ABC comme angle du triangle MBH rectangle
    en H ; 1 pt pour MH = 12 m. Le cosinus à la place du sinus conduit à 9 m : seul le point de reconnaissance
    de l''angle reste acquis.'
  si_echoue: Choix du côté opposé et de l'hypoténuse dans un sinus, distance d'un point à une droite confondue
    avec une longueur quelconque.
  probleme_parent: P2
- code: P2.3
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: N.RAT
  competence_secondaire: G.THA
  domaine: Activites numeriques
  objet: Comparer l'aire de MBCN (MN = 75 m, BC = 100 m, écart 12 m) au tiers du champ (Sibiri)
  reponse_attendue: aire de MBCN = (75 + 100)/2 × 12 = 1 050 m² > 800 m² (tiers de 2 400 m²) ; Sibiri
    a raison
  solution: 'Champ ABC : 60 × 80 / 2 = 2 400 m², tiers 800 m². Conclusion : « Le quadrilatère MBCN couvre
    1 050 m² sur les 2 400 m² du champ, soit plus que les 800 m² du tiers : Sibiri a raison. » Barème
    (3 pts) : 1 pt pour l''aire 1 050 m² (formule du trapèze ou différence des aires de ABC et AMN) ;
    1 pt pour l''aire 2 400 m² du champ et la comparaison explicite au tiers, 800 m² ; 1 pt pour la conclusion.
    L''élève qui conclut correctement sur sa propre aire garde les deux derniers points. « Un quart, puisque
    MN est aux trois quarts » ne prend aucun point de calcul.'
  si_echoue: Rapport de réduction de Thalès appliqué aux aires comme aux longueurs.
  probleme_parent: P2
- code: P3.1
  partie: C
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: F.LIN
  competence_secondaire: null
  domaine: Fonctions et applications
  objet: Exprimer f(x) (12 000 FCFA fixes + 300 FCFA par sac) et g(x) (500 FCFA par sac), Bobo-Dioulasso
  reponse_attendue: f(x) = 300x + 12 000 ; g(x) = 500x
  solution: 'Barème (2 pts) : 1 pt pour f(x) = 300x + 12 000, frais fixes non multipliés par x ; 1 pt
    pour g(x) = 500x. La masse de 50 kg des sacs est une donnée inutile ; la signaler n''est ni exigé
    ni pénalisé.'
  si_echoue: Modélisation d'un tarif par une application affine, frais fixes et part proportionnelle distingués.
  probleme_parent: P3
- code: P3.2
  partie: C
