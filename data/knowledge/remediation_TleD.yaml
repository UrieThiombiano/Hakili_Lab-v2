    correction: '*Démarche :* on cherche à encadrer $x + y$ par $1 + xy$, car les quatre facteurs $1 \pm
      x$, $1 \pm y$ sont strictement positifs. 1) $1 - x - y + xy$ et $1 + x + y + xy$. 2) Ces deux produits
      sont $> 0$, donc $1 + xy > x + y$ et $1 + xy > -\left(x + y\right)$, c''est-à-dire $|x + y| < 1
      + xy$. Comme $1 + xy > 0$, on divise : $\left|\frac{x + y}{1 + xy}\right| < 1$.'
  - numero: 40
    etoiles: 3
    enonce: a) Rappelle l'encadrement qui définit $E\left(x\right)$ et démontre que pour tout réel $x$
      et tout entier relatif $n$, $E\left(x + n\right) = E\left(x\right) + n$. b) L'égalité $E\left(x
      + y\right) = E\left(x\right) + E\left(y\right)$ est-elle vraie pour tous réels ? c) Démontre que
      $E\left(x\right) + E\left(y\right) \le E\left(x + y\right) \le E\left(x\right) + E\left(y\right)
      + 1$.
    correction: '*Démarche :* tout vient de l''**unicité** de l''entier $k$ tel que $k \le x < k + 1$.
      a) Avec $k = E\left(x\right)$, on ajoute $n$ : $k + n \le x + n < k + n + 1$, et $k + n$ est entier,
      donc $E\left(x + n\right) = E\left(x\right) + n$. b) Non : $x = y = 0{,}5$ donne $0$ contre $E\left(1\right)
      = 1$. c) Avec $p = E\left(x\right)$, $q = E\left(y\right)$ : $p + q \le x + y < p + q + 2$. Le membre
      de gauche donne $p + q \le E\left(x + y\right)$ ; à droite, $E\left(x + y\right)$ est un entier
      $< p + q + 2$, donc $\le p + q + 1$.'
  - numero: 41
    etoiles: 3
    enonce: On sait que $2 < a < 3$ et $-5 < b < -4$. Encadre le plus finement possible $a + b$, $a -
      b$, $ab$, $\frac{a}{b}$, $a^{2} + b^{2}$ et $\frac{1}{a + b}$. Compare l'amplitude de l'encadrement
      de $ab$ à celles des encadrements de départ et dis en une phrase ce que ce phénomène enseigne.
    correction: '*Démarche :* à chaque ligne, se demander si l''opération conserve le sens des inégalités.
      $-3 < a + b < -1$ ; $4 < -b < 5$ donc $6 < a - b < 8$ ; $-15 < ab < -8$ ; $-\frac{1}{4} < \frac{1}{b}
      < -\frac{1}{5}$ donc $-\frac{3}{4} < \frac{a}{b} < -\frac{2}{5}$ ; $4 < a^{2} < 9$ et $16 < b^{2}
      < 25$ donnent $20 < a^{2} + b^{2} < 34$ ; enfin $-1 < \frac{1}{a + b} < -\frac{1}{3}$. Les amplitudes
      de départ valent $1$, celle de $ab$ vaut $7$ : un encadrement se dégrade vite dès qu''on multiplie,
      donc il faut encadrer le plus tard possible.'
  - numero: 42
    etoiles: 3
    enonce: 'Ousmane devait encadrer $x - y$ sachant que $3 < x < 5$ et $1 < y < 2$. Trouve la ligne fausse,
      énonce la règle correcte, refais l''encadrement, puis donne un couple $\left(x\,;\,y\right)$ qui
      prouve que sa réponse est fausse.


      | Ligne | Ce qu''Ousmane a écrit |

      |---|---|

      | 1 | $3 < x < 5$ et $1 < y < 2$ |

      | 2 | En soustrayant membre à membre : $3 - 1 < x - y < 5 - 2$ |

      | 3 | Donc $2 < x - y < 3$ |'
    correction: '*Démarche :* pour démasquer une règle fausse, on pousse le résultat aux extrêmes. **La
      ligne 2 est fausse** : on n''ôte jamais deux encadrements membre à membre ; il faut d''abord encadrer
      $-y$, ce qui **inverse** le sens. De $1 < y < 2$ vient $-2 < -y < -1$, donc $1 < x - y < 4$. Contre-exemple
      : $x = 3{,}1$ et $y = 1{,}9$ donnent $x - y = 1{,}2 \notin \left]2\,;\,3\right[$.'
  - numero: 43
    etoiles: 3
    enonce: a) Combien y a-t-il d'entiers $n$ tels que $\frac{100}{7} < n < \frac{300}{7}$ ? Donne le
      plus petit et le plus grand. b) Combien y a-t-il d'entiers naturels $n$ tels que $E\left(\frac{n}{5}\right)
      = 7$ ? Lesquels ?
    correction: '*Démarche :* compter des entiers, c''est trouver le premier et le dernier, puis faire
      « dernier moins premier plus un ». a) $E\left(\frac{100}{7}\right) = 14$ donc le premier est $15$
      ; $E\left(\frac{300}{7}\right) = 42$ donc le dernier est $42$ : il y en a $42 - 15 + 1 = 28$. b)
      $E\left(\frac{n}{5}\right) = 7$ équivaut à $35 \le n < 40$ : les entiers $35$, $36$, $37$, $38$,
      $39$, soit **cinq**.'
  - numero: 44
    etoiles: 3
    enonce: 'Un maçon de Kaya mesure une dalle rectangulaire : longueur $4{,}2$ m, largeur $3{,}5$ m,
      chaque mesure à $5$ cm près. Le carrelage se vend au mètre carré entier. Encadre l''aire, indique
      le nombre de mètres carrés à commander pour être certain de ne pas manquer, et évalue la surface
      perdue dans le pire des cas.'
    correction: '*Démarche :* « à $5$ cm près » se traduit par un encadrement à $0{,}05$ m, et « être
      certain de ne pas manquer » impose de partir de la borne **supérieure**. $4{,}15 \le L \le 4{,}25$
      et $3{,}45 \le \ell \le 3{,}55$, donc $14{,}3175 \le \mathcal{A} \le 15{,}0875$ (m$^{2}$). Il faut
      commander **$16$ m$^{2}$**. Dans le pire des cas la perte vaut $16 - 14{,}3175 = 1{,}6825$ m$^{2}$,
      soit environ $1{,}7$ m$^{2}$.'
  - numero: 45
    etoiles: 3
    enonce: a) L'arrondi au centième d'un réel $x$ vaut $3{,}47$. Donne l'encadrement le plus fin de $x$,
      puis de $2x - 1$, puis de $x^{2}$ ; déduis-en l'arrondi à l'unité de $x^{2}$. b) Un réel $x$ vérifie
      $E\left(x\right) = 5$ et $E\left(2x\right) = 11$. Encadre $x$ le plus finement possible.
    correction: '*Démarche :* un arrondi ne donne pas $x$, il donne l''intervalle des $x$ possibles ;
      deux informations de partie entière se recoupent par intersection. a) $3{,}465 \le x < 3{,}475$
      ; donc $5{,}93 \le 2x - 1 < 5{,}95$ ; les bornes étant positives, $12{,}006\,225 \le x^{2} < 12{,}075\,625$.
      Tout cet intervalle est entre $11{,}5$ et $12{,}5$ : l''arrondi à l''unité de $x^{2}$ vaut **$12$**.
      b) $E\left(x\right) = 5$ donne $5 \le x < 6$ ; $E\left(2x\right) = 11$ donne $5{,}5 \le x < 6$.
      L''intersection est $\left[5{,}5\,;\,6\right[$.


      ---'
  fiche_revision:
  - '**Somme et différence.** $a + c \le x + y \le b + d$ ; $a - d \le x - y \le b - c$ : valables toujours.'
  - '**Produit et quotient.** $ac \le xy \le bd$ et $\frac{a}{d} \le \frac{x}{y} \le \frac{b}{c}$ : seulement
    pour des bornes strictement positives.'
  - '**Signe négatif.** Multiplier par un négatif ou passer à l''inverse retourne l''ordre.'
  - '**Carré.** Ordre conservé sur les positifs, retourné sur les négatifs, minimum $0$ si l''encadrement
    contient $0$.'
  - '**Valeur absolue.** $|a + b| \le |a| + |b|$ ; $|x - c| \le r$ équivaut à $c - r \le x \le c + r$.'
  - '**Approximation.** Troncature : on coupe. Arrondi : décimale suivante $\ge 5$, on monte. On ne garde
    que les décimales communes aux deux bornes.'
  - '**Partie entière.** $E\left(x\right) \le x < E\left(x\right) + 1$, et c''est le **seul** entier qui
    vérifie cela.'
  trouve_erreur:
  - faux: $-2 < x < -1$ et $2 < y < 3$ donc $-4 < xy < -3$
    correction: 'On passe à $-x$ : $-6 < xy < -2$'
  - faux: $3 < x < 5$, $1 < y < 2$ donc $2 < x - y < 3$
    correction: 'On croise : $1 < x - y < 4$'
  - faux: $E\left(-3{,}2\right) = -3$
    correction: $E\left(-3{,}2\right) = -4$
  - faux: $9{,}68 \le S \le 11{,}04$ donc $S \approx 10{,}35$
    correction: 'Aucune décimale n''est sûre : $S \approx 10$'
