    enonce: $\widehat{A}$ est aigu et $\sin \widehat{A} = \frac{2\sqrt{5}}{5}$. Calcule $\cos \widehat{A}$
      et $\tan \widehat{A}$.
    correction: $\sin^{2} \widehat{A} = \frac{4}{5}$, donc $\cos^{2} \widehat{A} = \frac{1}{5}$ et $\cos
