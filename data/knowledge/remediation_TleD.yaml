  - numero: 9
    etoiles: 1
    enonce: 'Quotients : a) $f\left(x\right) = \frac{3x - 1}{x + 2}$ ; b) $g\left(x\right) = \frac{x^{2}}{x
      - 1}$ ; c) $h\left(x\right) = \frac{1}{x^{2} + 1}$.'
    correction: a) $\frac{7}{\left(x + 2\right)^{2}}$. b) $\frac{2x\left(x - 1\right) - x^{2}}{\left(x
      - 1\right)^{2}} = \frac{x^{2} - 2x}{\left(x - 1\right)^{2}}$. c) $-\frac{2x}{\left(x^{2} + 1\right)^{2}}$.
  - numero: 10
    etoiles: 1
    enonce: 'Équation de la tangente à $\mathcal{C}_{f}$ au point d''abscisse $a$ : a) $f\left(x\right)
      = x^{2} - 3x$, $a = 2$ ; b) $f\left(x\right) = \frac{1}{x}$, $a = 1$ ; c) $f\left(x\right) = x^{3}$,
      $a = -1$.'
    correction: 'a) $f''\left(2\right) = 1$, $f\left(2\right) = -2$ : $y = x - 4$. b) $y = -x + 2$. c)
      $f''\left(-1\right) = 3$, $f\left(-1\right) = -1$ : $y = 3x + 2$.'
  - numero: 11
    etoiles: 1
    enonce: Étudie les variations de $f\left(x\right) = x^{2} - 4x + 3$ et retrouve son minimum. Donne
      la tangente au point d'abscisse $1$.
    correction: '$f'' = 2x - 4$ : décroissante puis croissante, minimum $f\left(2\right) = -1$. Tangente
