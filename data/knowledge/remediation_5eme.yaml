  - numero: 17
    etoiles: 1
    enonce: 'Calcule : a) $\left(+5\right) + \left(-5\right)$ ; b) $\left(-8\right) + \left(+8\right)$
      ; c) $\left(+12\right) + \left(-11\right)$.'
    correction: a) $0$ ; b) $0$ (opposés) ; c) $+1$.
  - numero: 18
    etoiles: 1
    enonce: 'Calcule : a) $\left(+2{,}5\right) + \left(+1{,}5\right)$ ; b) $\left(-3{,}2\right) + \left(-1{,}8\right)$
      ; c) $\left(+4\right) + \left(-2{,}5\right)$.'
    correction: a) $+4$ ; b) $-5$ ; c) $+1{,}5$.
  - numero: 19
    etoiles: 1
    enonce: Le niveau d'un barrage varie de $-35$ cm une semaine, puis de $+60$ cm la suivante. Variation
      totale ?
    correction: 'Écart $60 - 35 = 25$, signe de $+60$ : $+25$ cm, le niveau a monté.'
  - numero: 20
    etoiles: 1
    enonce: 'Le thermomètre indique $+29\,^{\circ}$C ; il baisse de $6\,^{\circ}$C l''après-midi, puis
