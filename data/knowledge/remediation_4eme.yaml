- niveau: 4eme
  module: 1
  module_titre: Décimaux, priorités et valeurs approchées
  pourquoi: 'Trois gestes dérapent : lire la partie décimale comme un entier, calculer sans regarder les
    priorités, couper au lieu d''arrondir. Tu connais ces règles, c''est leur application qui se perd.'
  diagnostic:
  - question: Compare $7{,}5$ et $7{,}48$.
    reponse: $7{,}50 > 7{,}48$ (dixièmes)
  - question: Encadre $9{,}207$ par deux dixièmes consécutifs.
    reponse: $9{,}2 < 9{,}207 < 9{,}3$
  - question: Donne l'arrondi au dixième de $3{,}86$.
    reponse: $3{,}9$
  - question: Calcule $20 - 3 \times 4$.
    reponse: $20 - 12 = 8$
  - question: Calcule $\frac{18 + 6}{4}$.
    reponse: $\frac{24}{4} = 6$
  lecons:
  - id: 4eme_M01_L1
    numero: '1.1'
    titre: Lire, comparer et ranger les décimaux
    retenir:
    - 'Rangs à droite de la virgule : dixièmes, centièmes, millièmes ; chaque pas vers la droite divise
      le rang par dix. $1$ unité $= 10$ dixièmes $= 100$ centièmes $= 1\,000$ millièmes.'
    - Le **chiffre** des centaines de $2\,845$ est $8$ ; le **nombre** de centaines est $28$, car les
      milliers en contiennent aussi.
    - 'Un zéro **final** n''ajoute rien : $2{,}75 = 2{,}750$. Un zéro **juste après la virgule** tient
      une colonne : $2{,}05 \neq 2{,}5$.'
    methode:
      titre: Comparer deux nombres décimaux
      etapes:
      - Compare les parties entières ; si elles diffèrent, conclus.
      - Sinon, complète par des zéros finaux.
      - Descends rang par rang jusqu'au premier chiffre qui diffère.
      - Écris le signe, pointe tournée vers le plus petit.
    exemple_resolu: 'Compare $2{,}8$ et $2{,}750$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Parties entières égales. | $2 = 2$, on continue |

      | Même longueur par zéros finaux. | $2{,}800$ et $2{,}750$ |

      | Premier rang qui diffère. | $8 > 7$, donc $2{,}8 > 2{,}750$ |

      | **Vérification :** $2\,800$ millièmes $> 2\,750$ millièmes. ✓ | |


      [SVG: figures/m01_f1.svg]

      *Figure 1.1 : on aligne les virgules, on complète par des zéros, puis on descend rang par rang.*'
    erreurs_frequentes:
    - erreur: écrire $2{,}750 > 2{,}8$ parce qu'il y a plus de chiffres.
      correction: compare $2{,}800$ et $2{,}750$ aux dixièmes.
    - erreur: rendre la liste décroissante quand on demandait croissant.
      correction: chaque nombre doit dépasser le précédent.
    declic: null
    figures:
    - figures/m01_f1.svg
  - id: 4eme_M01_L2
    numero: '1.2'
    titre: Encadrer, intercaler, tronquer et arrondir
    retenir:
    - '**Encadrer**, c''est écrire le nombre entre deux bornes : $3 < 3{,}649 < 4$ à l''unité, $3{,}6
      < 3{,}649 < 3{,}7$ au dixième. Bornes plus proches, encadrement plus **serré**.'
    - '**Intercaler**, c''est descendre d''un rang. Entre deux décimaux il y a une **infinité** de décimaux,
      mais parfois **aucun entier**.'
    - 'La **troncature** à un rang coupe tout ce qui suit : valeur approchée **par défaut**. La valeur
      **par excès** ajoute $1$ au dernier chiffre gardé : $15{,}8 < 15{,}847 < 15{,}9$.'
    - 'L''**arrondi** est celle des deux bornes qui est la **plus proche** : premier chiffre abandonné
      de $0$ à $4$, borne du bas ; de $5$ à $9$, borne du haut.'
    - 'Un **ordre de grandeur** remplace chaque nombre par un nombre rond voisin : $198 \times 4{,}9 \approx
      200 \times 5 = 1\,000$. Il repère les grosses erreurs.'
    methode:
      titre: Troncature, valeur par excès et arrondi à un rang donné
      etapes:
      - Repère le rang demandé et le dernier chiffre gardé.
      - 'Coupe la suite : c''est la troncature, donc la valeur par défaut.'
      - 'Ajoute $1$ au dernier chiffre gardé : c''est la valeur par excès.'
      - 'Premier chiffre abandonné $\ge 5$ : l''arrondi est la valeur par excès ; sinon c''est la troncature.'
    exemple_resolu: 'Soit $a = 3{,}4981$. Donne la troncature, la valeur par excès et l''arrondi au centième.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Dernier chiffre gardé : le $9$ des centièmes ; on coupe. | troncature : $3{,}49$ |

      | On ajoute un centième. | par excès : $3{,}50$ |

      | Premier chiffre abandonné : $8 \ge 5$. | arrondi : $3{,}50$ |

      | **Vérification :** $3{,}4981 - 3{,}49 = 0{,}0081 > 3{,}50 - 3{,}4981 = 0{,}0019$. ✓ | |'
    erreurs_frequentes:
    - erreur: donner $8{,}7$ comme valeur par excès au dixième de $8{,}74$.
      correction: $8{,}7$ est la troncature ; par excès, $8{,}8$.
    - erreur: affirmer qu'entre $5{,}12$ et $5{,}13$ il n'y a plus de place.
      correction: on descend d'un rang, $5{,}120 < 5{,}125 < 5{,}130$.
    declic: null
    figures: []
  - id: 4eme_M01_L3
    numero: '1.3'
    titre: Priorités, barre de fraction et calcul astucieux
    retenir:
    - '$\frac{a + b}{c + d}$, c''est $\left(a + b\right) \div \left(c + d\right)$ : chaque étage se calcule
      en entier avant la division. $\frac{12 + 8}{4} = \frac{20}{4} = 5$, et non $12 + 2$.'
    - Commutativité et associativité pour $+$ et $\times$ seulement, jamais pour $-$ ni $\div$.
    - 'Distributivité : $a \times \left(b + c\right) = a \times b + a \times c$ ; on **développe** dans
      un sens, on **regroupe** dans l''autre.'
    - 'On rapproche les facteurs qui donnent un nombre rond : $25 \times 4 = 100$, $8 \times 125 = 1\,000$.'
    methode:
      titre: Calculer une expression avec priorités
      etapes:
      - 'Traite les groupes : parenthèses, puis crochets, le plus profond en premier.'
      - Traite à part numérateur et dénominateur de chaque fraction.
      - Effectue les multiplications et divisions restantes, de gauche à droite.
      - Termine par les additions et soustractions, une étape par ligne.
    exemple_resolu: 'Calcule $C = 2 \times \left[50 - \left(3 \times 6 + 2\right)\right]$ et $D = \frac{45
      - 5 \times 3}{2 \times 3}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Dans $C$, le groupe le plus profond. | $3 \times 6 + 2 = 20$ |

      | Le crochet, puis le produit. | $C = 2 \times \left[50 - 20\right] = 60$ |

      | Dans $D$, chaque étage à part. | $45 - 15 = 30$ et $2 \times 3 = 6$ |

      | **Vérification :** $D = \frac{30}{6} = 5$, et $C \le 2 \times 50$. ✓ | |


      > #### DÉCLIC : un produit est un bloc, une barre de fraction est une parenthèse

      >

      > Si $20 - 3 \times 4$ te semble faire $68$, un produit forme un **bloc** insécable. Si $\frac{12
      + 8}{4}$ te fait écrire $12 + 2$, la barre vaut deux parenthèses.'
    erreurs_frequentes:
    - erreur: $7 + 3 \times 6 = 10 \times 6 = 60$.
      correction: $\times$ et $\div$ passent avant $+$ et $-$ ; $7 + 18 = 25$.
    - erreur: simplifier terme à terme, $\frac{12 + 8}{4} = 12 + 2$.
      correction: la barre groupe tout le numérateur ; $\frac{20}{4} = 5$.
    declic: 'un produit est un bloc, une barre de fraction est une parenthèse — Si $20 - 3 \times 4$ te
      semble faire $68$, un produit forme un **bloc** insécable. Si $\frac{12 + 8}{4}$ te fait écrire
      $12 + 2$, la barre vaut deux parenthèses. #### ⚠ ATTENTION ! - **Erreur fréquente :** $7 + 3 \times
      6 = 10 \times 6 = 60$. **Correction :** $\times$ et $\div$ passent avant $+$ et $-$ ; $7 + 18 =
      25$. - **Erreur fréquente :** simplifier terme à terme, $\frac{12 + 8}{4} = 12 + 2$. **Correction
      :** la barre groupe tout le numérateur ; $\frac{20}{4} = 5$.'
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Dans $47{,}309$, donne le chiffre des unités, celui des dixièmes, celui des centièmes et celui
      des millièmes.
    correction: Unités $7$ ; dixièmes $3$ ; centièmes $0$ ; millièmes $9$.
  - numero: 2
    etoiles: 1
    enonce: 'Pour $2\,845$, donne : a) le nombre de dizaines ; b) le nombre de centaines ; c) le nombre
      de milliers.'
    correction: a) $284$ ; b) $28$ ; c) $2$.
  - numero: 3
    etoiles: 1
    enonce: 'Écris sans zéro inutile : a) $6{,}40$ ; b) $15{,}200$ ; c) $8{,}0$ ; d) $0{,}50$.'
    correction: a) $6{,}4$ ; b) $15{,}2$ ; c) $8$ ; d) $0{,}5$.
  - numero: 4
    etoiles: 1
    enonce: 'Décompose par rangs, comme $274{,}6 = \left(2\times 100\right)+\left(7\times 10\right)+\left(4\times
      1\right)+\left(6\times \text{un dixième}\right)$ : a) $53{,}7$ ; b) $6{,}28$.'
    correction: a) $\left(5 \times 10\right) + \left(3 \times 1\right) + \left(7 \times \text{un dixième}\right)$
      ; b) $\left(6 \times 1\right) + \left(2 \times \text{un dixième}\right) + \left(8 \times \text{un
      centième}\right)$.
  - numero: 5
    etoiles: 1
    enonce: 'Convertis : a) $30$ dixièmes $=$ … unités ; b) $250$ centièmes $=$ … unités ; c) $7$ dixièmes
      $=$ … centièmes.'
    correction: a) $3$ unités ; b) $2{,}5$ unités ; c) $70$ centièmes.
  - numero: 6
    etoiles: 1
    enonce: 'Complète par $<$, $>$ ou $=$ : a) $12$ … $12{,}1$ ; b) $175$ … $174{,}9$ ; c) $8{,}30$ …
      $8{,}3$ ; d) $14{,}005$ … $14{,}001$ ; e) $0{,}1298$ … $0{,}367$ ; f) $1{,}7905$ … $1{,}791$ ; g)
      $2$ … $1{,}9999$.'
    correction: a) $<$ ; b) $>$ ; c) $=$ ; d) $>$ ; e) $<$ ; f) $<$ ($1{,}791 = 1{,}7910$) ; g) $>$.
  - numero: 7
    etoiles: 1
    enonce: 'Range par ordre croissant : $15{,}07$ ; $15{,}003$ ; $14{,}057$ ; $10{,}234$ ; $8{,}256$
      ; $7$ ; $15{,}16$ ; $11{,}238$.'
    correction: $7 < 8{,}256 < 10{,}234 < 11{,}238 < 14{,}057 < 15{,}003 < 15{,}07 < 15{,}16$.
  - numero: 8
    etoiles: 1
    enonce: 'Trois sacs de mangues à Bobo-Dioulasso : A $125{,}50$ kg ; B $125{,}5$ kg ; C $125{,}05$
      kg. a) Ces masses sont-elles toutes différentes ? b) Quel sac est le plus lourd ? c) Le plus léger
      ?'
    correction: 'a) Non : $125{,}50 = 125{,}5$, donc A $=$ B. b) A et B. c) C.'
  - numero: 9
    etoiles: 1
    enonce: 'Encadre entre deux entiers consécutifs : a) $45{,}8$ ; b) $0{,}73$ ; c) $129{,}04$.'
    correction: a) $45 < 45{,}8 < 46$ ; b) $0 < 0{,}73 < 1$ ; c) $129 < 129{,}04 < 130$.
  - numero: 10
    etoiles: 1
    enonce: a) Quel est le plus petit décimal à deux chiffres après la virgule plus grand que $6{,}583$
      ? b) Le plus grand qui lui soit inférieur ? c) Intercale un décimal à deux chiffres après la virgule
      entre $5{,}4$ et $5{,}5$.
    correction: a) $6{,}59$ ; b) $6{,}58$ ; c) par exemple $5{,}45$.
  - numero: 11
    etoiles: 1
    enonce: On considère $12{,}758$. a) Donne un encadrement au dixième. b) Au centième. c) Lequel est
      le plus serré ?
    correction: a) $12{,}7 < 12{,}758 < 12{,}8$ ; b) $12{,}75 < 12{,}758 < 12{,}76$ ; c) le second, dix
      fois plus serré.
  - numero: 12
    etoiles: 1
    enonce: 'Donne l''approximation par défaut au centième de : a) $32{,}4568$ ; b) $19{,}4287$ ; c) $0{,}887$.'
    correction: a) $32{,}45$ ; b) $19{,}42$ ; c) $0{,}88$.
  - numero: 13
    etoiles: 1
    enonce: 'Donne la valeur approchée au dixième par défaut, puis par excès : a) $4{,}07$ ; b) $19{,}95$
      ; c) $0{,}64$.'
    correction: a) $4{,}0$ et $4{,}1$ ; b) $19{,}9$ et $20{,}0$ ; c) $0{,}6$ et $0{,}7$.
  - numero: 14
    etoiles: 1
    enonce: 'Donne l''arrondi au centième de : a) $3{,}4981$ ; b) $7{,}2649$ ; c) $0{,}995$.'
    correction: a) $3{,}50$ ($8 \ge 5$) ; b) $7{,}26$ ($4 < 5$) ; c) $1{,}00$ (retenue propagée).
  - numero: 15
    etoiles: 1
    enonce: 'Donne un ordre de grandeur de : a) $49 \times 5{,}1$ ; b) $11 \times 9$ ; c) $548 \times
      310$.'
    correction: a) $50 \times 5 = 250$ ; b) $10 \times 9 = 90$ ; c) $500 \times 300 = 150\,000$.
  - numero: 16
    etoiles: 1
    enonce: 'Calcule : a) $6 \times 3 + 2 \times 9$ ; b) $7 + 3 \times 6$ ; c) $36 - 4 \times 5$ ; d)
      $54 \div 9 + 7$ ; e) $100 - 36 \div 4$ ; f) $9 + 18 \div 3$.'
    correction: a) $36$ ; b) $25$ ; c) $16$ ; d) $13$ ; e) $91$ ; f) $15$.
  - numero: 17
    etoiles: 1
    enonce: 'Calcule avec le crochet : a) $\left[24 - \left(5 + 3\right)\right] \times 2$ ; b) $2 \times
      \left[50 - \left(3 \times 6 + 2\right)\right]$.'
    correction: a) $\left[24 - 8\right] \times 2 = 32$ ; b) $2 \times \left[50 - 20\right] = 60$.
  - numero: 18
    etoiles: 1
    enonce: 'Calcule : a) $\frac{12 + 8}{4}$ ; b) $\frac{7 \times 6}{3 + 11}$ ; c) $\frac{30 - 6}{2 \times
      3}$.'
    correction: a) $\frac{20}{4} = 5$ ; b) $\frac{42}{14} = 3$ ; c) $\frac{24}{6} = 4$.
  - numero: 19
    etoiles: 1
    enonce: 'Place les parenthèses pour que chaque égalité soit vraie : a) $3 + 5 \times 2 = 16$ ; b)
      $12 - 4 \times 2 = 16$ ; c) $20 \div 2 + 8 = 2$.'
    correction: a) $\left(3 + 5\right) \times 2$ ; b) $\left(12 - 4\right) \times 2$ ; c) $20 \div \left(2
      + 8\right)$.
  - numero: 20
    etoiles: 1
    enonce: 'Calcule astucieusement : a) $0{,}4 \times 26 + 0{,}4 \times 24$ ; b) $23 \times 8{,}75 -
      23 \times 6{,}75$ ; c) $50 \times 17 \times 2$ ; d) $4 \times 39 \times 25$.


      ### Entraînement ★★'
    correction: a) $0{,}4 \times 50 = 20$ ; b) $23 \times 2 = 46$ ; c) $17 \times 100 = 1\,700$ ; d) $39
      \times 100 = 3\,900$.
  - numero: 21
    etoiles: 2
    enonce: À Kongoussi, un éleveur achète $3$ sacs d'aliment à $12\,500$ FCFA le sac et $2$ pierres à
      lécher à $1\,500$ FCFA pièce. Il paie avec un billet de $50\,000$ FCFA. Écris une seule expression
      de la somme qu'on lui rend, puis calcule-la.
    correction: $50\,000 - \left(3 \times 12\,500 + 2 \times 1\,500\right) = 9\,500$ FCFA.
  - numero: 22
    etoiles: 2
    enonce: Le compteur d'un taxi de Tenkodogo affiche $8\,265$ m. a) Donne cette distance approchée à
      la centaine de mètres, par défaut puis par excès. b) Écris l'encadrement obtenu. c) Exprime les
      deux valeurs en kilomètres.
    correction: a) $8\,200$ m et $8\,300$ m. b) $8\,200 < 8\,265 < 8\,300$. c) $8{,}2$ km et $8{,}3$ km.
  - numero: 23
    etoiles: 2
    enonce: 'Par un ordre de grandeur, dis si chaque résultat est plausible. a) $19{,}8 \times 4{,}9 =
      97{,}02$ ; b) $302 \times 48 = 1\,449{,}6$ ; c) $9{,}7 + 10{,}2 = 19{,}9$.


      *Entraînement intensif : recopie chaque calcul et descends d''une ligne à chaque opération effectuée,
      sans jamais en mener deux à la fois.*'
    correction: 'a) Plausible ($\approx 100$). b) Faux : $\approx 15\,000$, et un produit d''entiers n''a
      pas de décimale. c) Plausible ($\approx 20$).'
  - numero: 24
    etoiles: 2
    enonce: Calcule a) $8 + 4 \times 2$, puis b) $\left(8 + 4\right) \times 2$. Pourquoi les résultats
      diffèrent-ils ?
    correction: a) $8 + 8 = 16$ ; b) $12 \times 2 = 24$. La parenthèse force l'addition d'abord.
  - numero: 25
    etoiles: 2
    enonce: 'Nathalie écrit : « $60 - 12 \div 3 = 48 \div 3 = 16$ ». Dis où elle s''est trompée, puis
      donne le bon résultat.'
    correction: 'Elle a soustrait avant de diviser : $12 \div 3 = 4$, puis $60 - 4 = 56$.'
  - numero: 26
    etoiles: 2
    enonce: 'Calcule : a) $\left[45 - \left(7 \times 4 + 5\right)\right] \div 4$ ; b) $3 \times \left[20
      - \left(12 \div 4\right)\right]$.'
    correction: a) $45 - 33 = 12$, puis $12 \div 4 = 3$. b) $20 - 3 = 17$, puis $3 \times 17 = 51$.
  - numero: 27
    etoiles: 2
    enonce: 'Place les parenthèses (au plus deux) pour rendre vraie chaque égalité : a) $8 + 2 \times
      5 = 50$ ; b) $24 \div 4 + 2 = 4$.'
    correction: a) $\left(8 + 2\right) \times 5 = 50$ ; b) $24 \div \left(4 + 2\right) = 4$.
  - numero: 28
    etoiles: 2
    enonce: On donne $E = 5 + 2 \times \left(9 - 4\right)$. a) Quelle opération fais-tu en premier ? b)
      En deuxième ? c) Calcule $E$. d) Calcule $F = \left(5 + 2\right) \times 9 - 4$ et compare.
    correction: a) $9 - 4 = 5$ ; b) $2 \times 5 = 10$ ; c) $E = 15$ ; d) $F = 7 \times 9 - 4 = 59$.
  - numero: 29
    etoiles: 2
    enonce: 'Calcule : a) $A = \frac{18 - 3 \times 4}{2}$ ; b) $B = \frac{5 \times 8}{3 + 7}$ ; c) $C
      = \frac{\left(9 - 4\right) \times 6}{15 \div 3}$.


      ### ★★★ Défis de maîtrise'
    correction: a) $A = \frac{6}{2} = 3$ ; b) $B = \frac{40}{10} = 4$ ; c) $C = \frac{30}{5} = 6$.
  - numero: 30
    etoiles: 3
    enonce: 'Voici la copie de Boukary.

      $E = \frac{48 - 3 \times 8}{6} + 2 \times \left[10 - \left(3 + 4\right)\right]$

      Ligne 1 : $E = \frac{45 \times 8}{6} + 2 \times \left[10 - 7\right]$

      Ligne 2 : $E = \frac{360}{6} + 2 \times 3$

      Ligne 3 : $E = 60 + 6$

      Ligne 4 : $E = 66$

      Trouve la ligne qui casse, explique l''erreur, puis refais le calcul.'
    correction: 'On relit ce qui a été fait à chaque ligne. **La ligne 1 casse** : au numérateur, Boukary
      a soustrait avant de multiplier ($48 - 3 = 45$), alors que les priorités jouent aussi à l''intérieur
      de la barre. Numérateur : $48 - 24 = 24$, donc $\frac{24}{6} = 4$ ; crochet : $2 \times 3 = 6$.
      D''où $E = 10$.'
  - numero: 31
    etoiles: 3
    enonce: Un décimal $n$ a exactement deux chiffres après la virgule. Sa troncature au dixième est $6{,}2$
      et son arrondi au dixième est $6{,}3$. a) Écris l'encadrement le plus serré de $n$. b) Donne toutes
      les valeurs possibles. c) Combien y en a-t-il ?
    correction: 'On traduit chaque renseignement en encadrement, puis on croise. Troncature $6{,}2$ :
      $6{,}2 \le n < 6{,}3$ ; arrondi $6{,}3$ : $n \ge 6{,}25$. a) $6{,}25 \le n < 6{,}3$. b) $6{,}25$
      ; $6{,}26$ ; $6{,}27$ ; $6{,}28$ ; $6{,}29$. c) $5$ valeurs.'
  - numero: 32
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une preuve ou un contre-exemple. a) Si deux décimaux ont la même
      partie entière, le plus grand est celui qui a le plus de chiffres après la virgule. b) Entre $4{,}7$
      et $4{,}8$, il n'existe aucun décimal. c) L'arrondi au dixième est toujours égal à la valeur approchée
      par excès au dixième. d) Dans $a - b \times c$, sans parenthèse, on effectue toujours la multiplication
      en premier.
    correction: 'a) **Faux** : $2{,}8 > 2{,}750$. b) **Faux** : $4{,}70 < 4{,}75 < 4{,}80$, et il y en
      a une infinité. c) **Faux** : pour $4{,}72$, l''excès est $4{,}8$ mais l''arrondi $4{,}7$. d) **Vrai**
      : sans parenthèse, la multiplication est prioritaire.'
  - numero: 33
    etoiles: 3
    enonce: On dispose des chiffres $4$, $5$ et $6$, une seule fois chacun, pour écrire un décimal à deux
      chiffres avant la virgule et un après. a) Le plus grand nombre possible. b) Le plus petit. c) Tous
      les nombres possibles, rangés dans l'ordre croissant.
    correction: Le rang qui commande est celui des dizaines, puis des unités. a) $65{,}4$ ; b) $45{,}6$
      ; c) $45{,}6 < 46{,}5 < 54{,}6 < 56{,}4 < 64{,}5 < 65{,}4$, soit $6$ nombres.
  - numero: 34
    etoiles: 3
    enonce: 'a) Trouve le nombre caché, puis calcule : $37 \times 98 = 37 \times 100 - 37 \times$ … .
      b) Même travail : $46 \times 102 = 46 \times 100 + 46 \times$ … . c) Explique pourquoi le procédé
      fonctionne quel que soit le nombre multiplié par $98$ ou $102$.'
    correction: 'On décompose un nombre proche de $100$. a) $98 = 100 - 2$ : $3\,700 - 74 = 3\,626$. b)
      $102 = 100 + 2$ : $4\,600 + 92 = 4\,692$. c) Distributivité : $a \times 98 = a \times 100 - a \times
      2$, valable pour tout $a$.'
  - numero: 35
    etoiles: 3
    enonce: Au marché de Ouahigouya, une vendeuse achète $5$ cageots de tomates à $3\,000$ FCFA le cageot
      et $3$ sacs d'oignons à $4\,000$ FCFA le sac. a) Écris l'expression de la dépense totale. b) Calcule-la.
      c) Si elle revend le tout $32\,000$ FCFA, quel est son bénéfice ?
    correction: a) $5 \times 3\,000 + 3 \times 4\,000$. b) $27\,000$ FCFA. c) $32\,000 - 27\,000 = 5\,000$
      FCFA.
  - numero: 36
    etoiles: 3
    enonce: 'Calcule, en soignant chaque étage :

      $$F = \frac{\left(12 - 5\right) \times 8}{2 \times 7} + \left[45 - \left(6 \times 5 + 3\right)\right]
      \div 4 \qquad \text{et} \qquad G = 2 \times \left[\frac{36 \div 4 + 3}{6} + 5\right]$$

      Donne ensuite un ordre de grandeur pour chacun.'
    correction: 'Un bloc à la fois. $F$ : $\frac{56}{14} = 4$ ; crochet $45 - 33 = 12$ puis $12 \div 4
      = 3$ ; $F = 7$. $G$ : $36 \div 4 + 3 = 12$, $\frac{12}{6} = 2$, $2 + 5 = 7$, donc $G = 14$. Ordres
      de grandeur : $F \approx 4 + 3$, $G \approx 2 \times 7$.'
  fiche_revision:
  - '**Valeur de position.** Chaque colonne vaut dix fois la suivante ; *chiffre* des centaines de $2\,845$
    : $8$ ; *nombre* de centaines : $28$.'
  - '**Zéros.** Un zéro final ne change rien ($2{,}75 = 2{,}750$) ; un zéro après la virgule change tout
    ($2{,}05 \neq 2{,}5$).'
  - '**Comparer.** Parties entières, puis rang par rang, arrêt au premier chiffre qui diffère.'
  - '**Encadrer, intercaler.** Deux bornes ; pour intercaler, descendre d''un rang.'
  - '**Tronquer, arrondir.** La troncature coupe (par défaut) ; par excès, $+1$ au dernier chiffre gardé
    ; l''arrondi prend la borne la plus proche, le premier chiffre abandonné décide.'
  - '**Priorités.** Parenthèses, crochets, puis $\times$ et $\div$, puis $+$ et $-$, de gauche à droite.'
  - '**Barre de fraction.** Deux parenthèses : chaque étage en entier avant la division.'
  - '**Contrôle.** Tout résultat se vérifie par un ordre de grandeur.'
  trouve_erreur:
  - faux: $2{,}750 > 2{,}8$ car il y a plus de chiffres
    correction: '$2{,}800$ contre $2{,}750$ : $8 > 7$ aux dixièmes, donc $2{,}8 > 2{,}750$.'
  - faux: 'Par excès au dixième de $8{,}74$ : $8{,}7$'
    correction: '$8{,}7$ est la troncature. Par excès : $8{,}8$.'
  - faux: $7 + 3 \times 6 = 60$
    correction: 'Le produit est un bloc et passe d''abord : $7 + 18 = 25$.'
  - faux: $\frac{12 + 8}{4} = 14$
    correction: 'La barre groupe le numérateur : $\frac{20}{4} = 5$.'
  cartographie_lacunes:
  - lacune: Priorités, arrondis et comparaisons de décimaux encore fautifs
    bloque_en: décimaux et puissances de dix, nombres réels
