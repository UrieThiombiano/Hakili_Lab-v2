  objet: Comparer une perche de 5,80 m à AG = √34 m (5,80² = 33,64) et dire si elle tient dans le grenier
  reponse_attendue: 5,80² = 33,64 < 34 = AG², donc 5,80 < AG ; la perche tient dans le grenier le long
    de la diagonale AG
  solution: 'La plus grande longueur rangeable dans un pavé droit est sa grande diagonale AG. Conclusion
    : « La perche de 5,80 m est plus courte que la diagonale AG du grenier : Salif peut la ranger entièrement
    à l''intérieur, en la plaçant le long de cette diagonale. » Barème (3 pts) : 1 pt pour avoir identifié
