      + 1\right)^{2} - x^{2}$.'
    correction: a) $3x - 1$, croissante. b) $x + 2$, croissante. c) $2x + 1$, croissante. Il fallait développer
      avant de conclure.
  - numero: 21
    etoiles: 2
    enonce: Soit $f\left(x\right) = -\frac{2}{3}x + 4$. Range $f\left(-6\right)$, $f\left(0\right)$ et
      $f\left(3\right)$ dans l'ordre décroissant **sans les calculer**, puis vérifie par le calcul.
    correction: '$a = -\frac{2}{3} < 0$ : ordre inversé, donc $f\left(-6\right) > f\left(0\right) > f\left(3\right)$.
      Calcul : $8 > 4 > 2$ ✓.'
  - numero: 22
    etoiles: 2
    enonce: Trace dans un même repère $f\left(x\right) = -x + 3$ et $g\left(x\right) = \frac{1}{2}x$.
      Lis les coordonnées du point d'intersection, puis vérifie par le calcul.
    correction: 'Point $\left(2\,;\,1\right)$. Calcul : $-x + 3 = \frac{1}{2}x$ donne $3x = 6$, donc $x
      = 2$ et $y = 1$.'
  - numero: 23
    etoiles: 2
    enonce: La droite $\left(D\right)$ de la figure 5.2 représente une application affine $f$. a) Lis
      $f\left(0\right)$ et $f\left(3\right)$. b) Lis l'antécédent de $-1$. c) Donne $f\left(x\right)$,
      puis contrôle tes lectures par le calcul.
    correction: a) $f\left(0\right) = -3$ et $f\left(3\right) = 3$. b) L'antécédent de $-1$ est $1$. c)
      $b = -3$ et $a = \frac{3 - \left(-3\right)}{3} = 2$, donc $f\left(x\right) = 2x - 3$ ; $f\left(1\right)
      = -1$ ✓.
  - numero: 24
    etoiles: 2
    enonce: 'À Boromo, un transporteur propose deux tarifs pour $x$ kilomètres : $f\left(x\right) = 100x$
      et $g\left(x\right) = 60x + 1\,600$. Calcule $f\left(20\right)$, $g\left(20\right)$, $f\left(50\right)$,
      $g\left(50\right)$, puis le kilométrage où les tarifs sont égaux.'
    correction: '$f\left(20\right) = 2\,000$, $g\left(20\right) = 2\,800$ ; $f\left(50\right) = 5\,000$,
      $g\left(50\right) = 4\,600$. Égalité : $40x = 1\,600$, donc $x = 40$ km, pour $4\,000$ FCFA.'
  - numero: 25
    etoiles: 2
    enonce: 'À Pô, une association loue une salle $25\,000$ FCFA et paie $900$ FCFA par participant. Écris
      $C\left(x\right)$, puis détermine le nombre maximal de participants avec $106\,000$ FCFA.


      ### Entraînement intensif : de deux points à l''expression


      *Écris $f\left(x\right) = ax + b$, calcule $a$, puis $b$, et termine par la vérification sur le
      couple qui n''a pas servi.*'
    correction: '$C\left(x\right) = 900x + 25\,000$ ; $900x \leq 81\,000$, donc $x \leq 90$ : au plus
      $90$ participants.'
  - numero: 26
    etoiles: 1
    enonce: Une droite coupe l'axe des ordonnées en $-2$ et monte de $3$ chaque fois que $x$ augmente
      de $1$. Donne l'application affine correspondante.
    correction: '$b = -2$ et $a = 3$ : $f\left(x\right) = 3x - 2$.'
  - numero: 27
    etoiles: 1
    enonce: Une droite passe par $A\left(0\,;\,4\right)$ et $B\left(2\,;\,10\right)$. Détermine l'application
      affine dont c'est la représentation.
    correction: $A$ donne $b = 4$ ; $a = \frac{10 - 4}{2} = 3$. Donc $f\left(x\right) = 3x + 4$ ; $f\left(2\right)
      = 10$ ✓.
  - numero: 28
    etoiles: 1
    enonce: Détermine l'application affine $f$ dont la représentation est parallèle à celle de $g\left(x\right)
      = -3x + 1$ et passe par $A\left(2\,;\,1\right)$.
    correction: 'Parallèles : $a = -3$. Puis $1 = -6 + b$, donc $b = 7$ et $f\left(x\right) = -3x + 7$.'
  - numero: 29
    etoiles: 2
    enonce: 'Une droite passe par $A\left(-2\,;\,7\right)$ et $B\left(4\,;\,-5\right)$. Détermine l''application
      affine, puis l''abscisse du point où la droite coupe l''axe des abscisses.


      ### ★★★ Défis de maîtrise'
    correction: $a = \frac{-5 - 7}{4 + 2} = -2$ ; $7 = 4 + b$ donne $b = 3$, donc $f\left(x\right) = -2x
      + 3$ ; $f\left(4\right) = -5$ ✓. Puis $-2x + 3 = 0$ donne $x = 1{,}5$.
  - numero: 30
    etoiles: 3
    enonce: À Sindou, la visite d'un site coûte $1\,000$ FCFA par personne, plus $8\,000$ FCFA pour le
      guide. Compare le coût par personne pour $8$ visiteurs et pour $40$ visiteurs. Que constates-tu
      ?
    correction: 'On sépare le coût **total**, affine, du coût **par personne**, qui ne l''est pas. $C\left(n\right)
      = 1\,000n + 8\,000$. Pour $8$ : $16\,000 \div 8 = 2\,000$ FCFA. Pour $40$ : $48\,000 \div 40 = 1\,200$
      FCFA. Le coût par personne diminue, car les $8\,000$ FCFA du guide se partagent ; il ne descendra
      jamais sous $1\,000$ FCFA.'
  - numero: 31
    etoiles: 3
    enonce: 'À Diapaga, un cybercafé compte en tranches de dix minutes. Formule A : $100$ FCFA la tranche.
      Formule B : $500$ FCFA d''abonnement mensuel, puis $50$ FCFA la tranche. Écris les deux applications,
      trace-les dans un même repère, et dis à partir de quelle durée B est plus avantageuse.'
    correction: 'On traduit avant de comparer : $A\left(x\right) = 100x$, $B\left(x\right) = 50x + 500$.
      Les droites se croisent : $50x = 500$, donc $x = 10$ tranches, pour $1\,000$ FCFA. Avant $10$, la
      droite de $A$ est la plus basse ; après, celle de $B$. B est avantageuse à partir de $11$ tranches,
      soit au-delà de $100$ minutes.'
  - numero: 32
    etoiles: 3
    enonce: Une application affine $f$ vérifie $f\left(x + 1\right) - f\left(x\right) = -4$ pour tout
      $x$, et $f\left(0\right) = 9$. Détermine $f\left(x\right)$, puis $f\left(100\right)$.
    correction: 'L''énoncé donne un **écart** d''images, pas deux images : cet écart est le coefficient
      directeur. Avec $f\left(x\right) = ax + b$, $f\left(x + 1\right) - f\left(x\right) = a$, donc $a
      = -4$ ; et $b = f\left(0\right) = 9$. Donc $f\left(x\right) = -4x + 9$ et $f\left(100\right) = -391$.'
  - numero: 33
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une propriété ou un contre-exemple. a) Toute application affine
      est linéaire. b) Si la représentation passe par l'origine, l'application est linéaire. c) Si le
      coefficient directeur est négatif, toutes les images sont négatives. d) Deux applications affines
      de même coefficient directeur et de parts fixes différentes ne prennent jamais la même valeur.
    correction: 'a) **Faux** : $2x + 3$ est affine, mais $f\left(0\right) = 3 \neq 0$. b) **Vrai** : passer
      par l''origine donne $b = 0$, donc $f\left(x\right) = ax$. c) **Faux** : $f\left(x\right) = -2x
      + 9$ a $f\left(0\right) = 9 > 0$. d) **Vrai** : $ax + b = ax + b''$ imposerait $b = b''$ ; les droites
      sont parallèles distinctes.'
  - numero: 34
    etoiles: 3
    enonce: 'Rakieta devait déterminer $f$ telle que $f\left(2\right) = 7$ et $f\left(5\right) = 16$,
      puis calculer $f\left(0\right)$ et résoudre $f\left(x\right) = 25$.


      > Ligne 1 : $a = \frac{5 - 2}{16 - 7} = \frac{3}{9} = \frac{1}{3}$.

      > Ligne 2 : $7 = \frac{1}{3} \times 2 + b$, donc $b = \frac{19}{3}$.

      > Ligne 3 : $f\left(x\right) = \frac{1}{3}x + \frac{19}{3}$, donc $f\left(0\right) = \frac{19}{3}$.

      > Ligne 4 : $\frac{1}{3}x + \frac{19}{3} = 25$, donc $x = 56$.


      a) Quelle ligne casse le raisonnement ? b) Explique l''erreur en une phrase. c) Refais proprement
      les quatre lignes.'
    correction: 'On relit ligne à ligne, sans se laisser entraîner par la cohérence apparente de la suite.
      a) La **ligne 1**. b) La fraction est inversée : la différence des images va au numérateur. c) $a
      = \frac{16 - 7}{5 - 2} = 3$ ; $7 = 6 + b$ donne $b = 1$ ; $f\left(x\right) = 3x + 1$, donc $f\left(0\right)
      = 1$ ; $3x = 24$ donne $x = 8$. Contrôle : $f\left(5\right) = 16$ ✓.'
  - numero: 35
    etoiles: 3
    enonce: 'À Léo, un motocycliste part avec $15$ litres et consomme $3$ litres tous les $100$ km. Le
      litre coûte $750$ FCFA. Écris le volume restant $V\left(x\right)$ après $x$ centaines de kilomètres,
      puis la distance parcourue quand il reste $3$ litres. Une donnée est inutile : laquelle ?'
    correction: 'On adopte la variable imposée : $x$ compte des centaines de kilomètres, donc $3$ litres
      par unité. $V\left(x\right) = 15 - 3x$ ; $15 - 3x = 3$ donne $x = 4$, soit $400$ km. La donnée inutile
      est le **prix du litre** : la question ne porte que sur des volumes et une distance.'
  - numero: 36
    etoiles: 3
    enonce: Soit $f$ linéaire de coefficient $a$. a) Montre que $f\left(u + v\right) = f\left(u\right)
      + f\left(v\right)$ pour tous $u$ et $v$. b) Montre que $f\left(k u\right) = k \times f\left(u\right)$.
      c) La propriété de a) reste-t-elle vraie pour $g\left(x\right) = 2x + 3$ ? Réponds par un contre-exemple.
    correction: 'On ne suppose rien et on part de $f\left(x\right) = ax$. a) $f\left(u + v\right) = a\left(u
      + v\right) = au + av = f\left(u\right) + f\left(v\right)$. b) $f\left(k u\right) = a k u = k \times
      \left(au\right) = k \times f\left(u\right)$. c) Non : $g\left(3\right) = 9$ alors que $g\left(1\right)
      + g\left(2\right) = 12$ ; la part fixe est comptée deux fois.'
  fiche_revision:
  - '**Image et antécédent.** $f\left(x\right) = y$ : $y$ est **l''**image de $x$, $x$ est **un** antécédent
    de $y$. Image : on remplace. Antécédent : on résout.'
  - '**Linéaire.** $f\left(x\right) = ax$, avec $a = \frac{f\left(x\right)}{x}$, image divisée par départ.
    Toujours $f\left(0\right) = 0$, droite par l''origine, proportionnalité.'
  - '**Affine.** $f\left(x\right) = ax + b$ : $a$ coefficient directeur, $b$ part fixe $= f\left(0\right)
    =$ ordonnée à l''origine. Linéaire si $b = 0$, constante si $a = 0$.'
  - '**Variation.** $a > 0$ croissante, ordre conservé ; $a < 0$ décroissante, ordre inversé ; $a = 0$
    constante. $b$ n''intervient jamais.'
  - '**Deux points.** $a = \frac{f\left(x_{2}\right) - f\left(x_{1}\right)}{x_{2} - x_{1}}$, puis $b$
    par substitution, puis vérification avec l''autre couple. Même $a$, droites parallèles.'
  - '**Lecture graphique.** Image : des abscisses vers les ordonnées. Antécédent : des ordonnées vers
    les abscisses. Signe : positif au-dessus de l''axe des abscisses, négatif au-dessous.'
  - '**Réflexe.** Toute lecture graphique se termine par un contrôle par le calcul.'
  trouve_erreur:
  - faux: $f\left(4\right) = 8$, donc $4$ est l'image de $8$
    correction: 'Le nombre dans la parenthèse est le **départ** : $8$ est l''image de $4$.'
  - faux: $f$ linéaire et $f\left(3\right) = 12$, donc $a = \frac{3}{12}$
    correction: 'Fraction inversée : $a = \frac{12}{3} = 4$, image divisée par départ.'
  - faux: $f\left(x\right) = -3x + 10$ est croissante car $b = 10 > 0$
    correction: 'Seul le signe de $a$ décide : $a = -3 < 0$, donc décroissante.'
  - faux: $f\left(2\right) = 7$, $f\left(5\right) = 16$, donc $a = \frac{5 - 2}{16 - 7}$
    correction: 'La différence des **images** va au numérateur : $a = \frac{9}{3} = 3$.'
  cartographie_lacunes:
  - lacune: Image et antécédent confondus, lecture graphique approximative
    bloque_en: généralités sur les fonctions, fonctions de référence
