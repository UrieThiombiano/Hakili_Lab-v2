  domaine: Activites geometriques
  objet: Trouver les ordonnées des points d'abscisse 5 du cercle de centre I(2 ; -1), rayon 5 ; juger
    x = 8
  reponse_attendue: y = 3 ou y = -5 ; Rakieta a raison, aucun point d'abscisse 8 (36 > 25)
  solution: 'M(5 ; y) sur le cercle ⇔ (5 - 2)² + (y + 1)² = 25 ⇔ (y + 1)² = 16 ⇔ y = 3 ou y = -5. Abscisse
    8 : (8 - 2)² = 36, (y + 1)² = -11 impossible. Barème : 1 pt pour les deux ordonnées 3 et -5 (une seule
    : 0,5 pt) ; 1 pt pour « Rakieta a raison » justifié par 36 > 25 ou par la distance de I à la droite
    d''abscisse 8 (6 > rayon).'
  si_echoue: Caractérisation d'un cercle par la distance au centre et raisonnement inverse à abscisse
    imposée. Livret de remédiation 1ère D / Tle D, module 9.
