    correction: 'La **ligne 1** est déjà fausse : $5\left(x - 2\right) = 5x - 10$, non $5x - 2$ ; la suite
      en hérite. Autre erreur ligne 4 : de $5x = 27$, on divise par $5$. Résolution : $5x - 7 = 28$, $5x
      = 35$, $x = 7$ ; $5 \times \left(7 - 2\right) + 3 = 28$ ✓.'
  fiche_revision:
  - '**Propriétés de l''égalité.** Opérer sur **les deux** membres la conserve (diviseur non nul) ; sur
    un seul, elle est détruite.'
  - '**Les quatre gestes.** $x + a = b \to x = b - a$ ; $x - a = b \to x = b + a$ ; $ax = b \to x = b
    \div a$ ; $x \div a = b \to x = b \times a$.'
  - '**Deux opérations.** Dans $ax + b = c$ : le terme d''abord, le coefficient ensuite, par une division.'
  - '**Vérification.** Repartir de l''équation de départ, calculer les deux membres, comparer.'
  - '**Mise en équation.** Nommer l''inconnue avec son unité, écrire, résoudre, vérifier dans l''énoncé,
    répondre.'
  - '**Inéquations.** Mêmes gestes, mais le symbole se **renverse** avec un négatif. Réponse : un ensemble
    ; crochet fermé pour $\le$ et $\ge$, ouvert pour $<$ et $>$.'
  trouve_erreur:
  - faux: $x + 7 = 12$ donc $x = 12 + 7$
    correction: 'On recopie au lieu de contrarier : $x = 12 - 7 = 5$.'
  - faux: $-2x = 10$ donc $x = 10 - \left(-2\right) = 12$
    correction: 'Un coefficient s''enlève par une division : $x = -5$.'
  - faux: $3x + 4 = 19$ donc $x + 4 = 19 \div 3$
    correction: 'Il faudrait diviser aussi le $4$ : $3x = 15$, puis $x = 5$.'
  - faux: $-3x \ge 12$ donc $x \ge -4$
    correction: 'Division par un négatif : le symbole se renverse, $x \le -4$.'
  cartographie_lacunes:
  - lacune: Transposition mécanique, mise en équation impossible
    bloque_en: équations et inéquations
