  reponse_attendue: C(6,4) × C(4,1) + C(6,5) = 60 + 6 = 66 comités
  solution: '« Au moins 4 femmes » : exactement 4 femmes et 1 homme (15 × 4 = 60) ou exactement 5 femmes
