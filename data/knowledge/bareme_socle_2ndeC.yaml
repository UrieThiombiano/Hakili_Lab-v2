  solution: 'E = (2x + 3)² - 4x² = 4x² + 12x + 9 - 4x² = 12x + 9 = 3(4x + 3), et 4x + 3 est entier dès
    que x est entier. Barème : 1 pt pour le développement du carré et la réduction en 12x + 9 ; 1 pt pour
    la mise en facteur de 3 et la conclusion. « Oui, il a raison » sans l''écriture 3(4x + 3) ni équivalent
    ne prend pas le second point.'
  si_echoue: Carré d'une somme, le double produit 2 × 2x × 3 étant oublié ; ou reconnaissance d'un multiple
    de 3 par mise en facteur.
