- niveau: 1ereD
  module: 7
  module_titre: Second degré et tableaux de signes
  pourquoi: 'Le tableau de signes sert partout : signe d''un polynôme, signe de $f''\left(x\right)$ pour
    les variations, inéquations avec $\ln$ et $\exp$ en Tle D. Qui rate ses tableaux de signes rate ses
    études de fonctions.'
  diagnostic:
  - question: Pour quelles valeurs de $x$ l'expression $5 - 3x$ est-elle positive ? négative ?
    reponse: positive si $x < \frac{5}{3}$, négative si $x > \frac{5}{3}$
  - question: 'Résous dans $\mathbb{R}$ : $\left(x - 2\right)\left(x + 3\right) = 0$.'
    reponse: $x = 2$ ou $x = -3$
  - question: Étudie le signe de $\left(x - 2\right)\left(x + 3\right)$.
    reponse: positif sur $\left]-\infty\,;\,-3\right[ \cup \left]2\,;\,+\infty\right[$, négatif sur $\left]-3\,;\,2\right[$
  - question: 'Résous dans $\mathbb{R}$ : $x^{2} - 5x + 6 = 0$.'
    reponse: $\Delta = 1$ ; $x = 2$ ou $x = 3$
  - question: 'Résous dans $\mathbb{R}$ : $x^{2} \le 9$.'
    reponse: $\left[-3\,;\,3\right]$ (pas seulement $x \le 3$)
  lecons:
  - id: 1ereD_M07_L1
    numero: '7.1'
    titre: Le signe d'une expression affine $ax + b$
    retenir:
    - L'expression s'annule en $x_{0} = -\frac{b}{a}$.
    - Elle est **du signe de $a$ après** $x_{0}$, **du signe de $-a$ avant**.
    - '|---|---|---|---|'
    methode:
      titre: Étudier le signe de $ax + b$
      etapes:
      - 'Résous $ax + b = 0$ : racine $x_{0} = -\frac{b}{a}$.'
      - 'Lis le coefficient $a$ : signe de $a$ à droite de $x_{0}$.'
      - Dresse le tableau, avec un $0$ sous la racine.
      - '**Contrôle :** teste $x = 0$ et compare au tableau.'
    exemple_resolu: 'Étudie le signe de $5 - 3x$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Je cherche la racine. | $5 - 3x = 0 \iff x = \frac{5}{3}$ |

      | $a = -3 < 0$ : le « $-$ » est à droite. | $5 - 3x > 0$ si $x < \frac{5}{3}$ ; $5 - 3x < 0$ si
      $x > \frac{5}{3}$ |

      | **Vérification :** $x = 0$ donne $5 > 0$ ✓ ; $x = 2$ donne $-1 < 0$. ✓ | |


      [SVG: figures/m07_f1.svg]

      *Figure 7.1 — Le signe de $ax + b$ : à droite de la racine, l''expression est du signe de $a$.*'
    erreurs_frequentes:
    - erreur: lire « signe de $-a$ » comme « négatif ».
      correction: 'si $a = -3$, alors $-a = 3$ : l''expression est **positive** avant la racine.'
    - erreur: placer la racine sans regarder $a$.
      correction: c'est le signe de $a$, pas celui de $b$, qui décide de l'ordre des signes.
    declic: null
    figures:
    - figures/m07_f1.svg
  - id: 1ereD_M07_L2
    numero: '7.2'
    titre: Signe d'un produit ou d'un quotient
    retenir:
    - '$\frac{A}{B}$ et $A \times B$ ont **toujours le même signe** : un quotient se traite comme un produit.'
    - Une ligne du tableau par facteur, puis la règle des signes colonne par colonne.
    - 'Sous une racine du numérateur : $0$. Sous une valeur interdite : double barre ‖.'
    - La valeur interdite **n'est jamais solution**, même avec une inégalité large.
    methode:
      titre: Signe d'un produit ou d'un quotient
      etapes:
      - Trouve la racine de chaque facteur et les valeurs interdites du dénominateur.
      - Range toutes ces valeurs dans l'ordre croissant sur la première ligne.
      - Écris une ligne par facteur.
      - 'Dernière ligne : règle des signes colonne par colonne.'
    exemple_resolu: 'Résous dans $\mathbb{R}$ : $\frac{x + 4}{3 - x} \ge 0$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | L''expression est déjà comparée à $0$ : j''étudie son signe. | racine : $x + 4 = 0 \iff x = -4$
      ; interdit : $x = 3$ |

      | Je range $-4 < 3$ et je dresse le tableau ci-dessous. | une ligne par facteur |

      | Je lis les colonnes « $+$ » : crochet fermé sur la racine, ouvert sur la valeur interdite. | $S
      = \left[-4\,;\,3\right[$ |

      | **Vérification :** $x = 0$ : $\frac{4}{3} \ge 0$ ✓ ; $x = 4$ : $-8 < 0$. ✓ | |


      | $x$ | $-\infty$ | | $-4$ | | $3$ | | $+\infty$ |

      |---|---|---|---|---|---|---|---|

      | $x + 4$ | | $-$ | $0$ | $+$ | | $+$ | |

      | $3 - x$ | | $+$ | | $+$ | $0$ | $-$ | |

      | $\frac{x + 4}{3 - x}$ | | $-$ | $0$ | $+$ | ‖ | $-$ | |


      [SVG: figures/m07_f2.svg]

      *Figure 7.2 — Tableau de signes de $P\left(x\right) = \left(5 - 3x\right)\left(2x + 1\right)$ :
      chaque ligne donne le signe d''un facteur, la dernière les multiplie.*'
    erreurs_frequentes:
    - erreur: multiplier une inéquation par $x$ ou par $x - 2$.
      correction: on ignore le signe du facteur, donc le sens de l'inégalité ; on ramène tout d'un côté
        et on fait un tableau.
    - erreur: écrire $\frac{x + 1}{x - 2} \ge 0$ sur $\left]-\infty\,;\,-1\right] \cup \left[2\,;\,+\infty\right[$.
      correction: crochet **ouvert** en $2$.
    declic: null
    figures:
    - figures/m07_f2.svg
  - id: 1ereD_M07_L3
    numero: '7.3'
    titre: Équations et inéquations du second degré
    retenir:
    - '$\Delta > 0$ : deux racines $x_{1} = \frac{-b - \sqrt{\Delta}}{2a}$, $x_{2} = \frac{-b + \sqrt{\Delta}}{2a}$,
      et $ax^{2} + bx + c = a\left(x - x_{1}\right)\left(x - x_{2}\right)$.'
    - '$\Delta = 0$ : racine double $x_{0} = -\frac{b}{2a}$, et le trinôme vaut $a\left(x - x_{0}\right)^{2}$.'
    - '$\Delta < 0$ : aucune racine réelle, aucune factorisation dans $\mathbb{R}$.'
    methode:
      titre: Résoudre une équation puis une inéquation du second degré
      etapes:
      - 'Cherche une factorisation rapide : facteur commun, identité remarquable, racine évidente.'
      - Sinon, calcule $\Delta = b^{2} - 4ac$ et applique les formules.
      - Pour une inéquation, dresse le **tableau de signes** du trinôme.
      - Lis l'ensemble des solutions en intervalles, crochets compris.
    exemple_resolu: 'Résous dans $\mathbb{R}$ : a) $x^{2} - 5x + 6 = 0$ ; b) $x^{2} - 5x + 6 \le 0$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) $a = 1$, $b = -5$, $c = 6$ : je calcule le discriminant. | $\Delta = 25 - 24 = 1 > 0$ |

      | Deux racines, avec $\sqrt{\Delta} = 1$. | $x_{1} = \frac{5 - 1}{2} = 2$ ; $x_{2} = \frac{5 + 1}{2}
      = 3$ |

      | b) $a = 1 > 0$ : « $-$ » entre les racines. | $x^{2} - 5x + 6 \le 0 \iff x \in \left[2\,;\,3\right]$
      |

      | **Vérification :** $x = 2{,}5$ donne $-0{,}25 \le 0$ ✓ ; $2 + 3 = 5 = -\frac{b}{a}$. ✓ | |'
    erreurs_frequentes:
    - erreur: $x^{2} = 9$ donc $x = 3$.
      correction: $x = 3$ **ou** $x = -3$.
    - erreur: $x^{2} \le 9$ donc $x \le 3$.
      correction: $-3 \le x \le 3$.
    declic: '$\Delta < 0$ ne veut pas dire « pas de solution » — $\Delta < 0$ signifie seulement que l''**équation**
      n''a pas de racine réelle. Pour une **inéquation**, regarde alors le signe de $a$ : le trinôme garde
      ce signe partout. Ainsi $x^{2} + 2x + 5 < 0$ n''a aucune solution, tandis que $x^{2} + 2x + 5 >
      0$ a pour solution $\mathbb{R}$.'
    figures:
    - figures/m07_f4.svg
