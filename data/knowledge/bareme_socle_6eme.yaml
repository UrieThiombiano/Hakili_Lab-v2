  reponse_attendue: zOy = 130° - 40° = 90° ; angle droit, Kadidiatou a tort
  solution: 'zOy = 130° - 40° = 90°, un angle droit et non aigu. Barème : 1 pt pour la mesure 90° obtenue
    par soustraction ; 1 pt pour la nature de l''angle et la conclusion. Erreur propagée : une nature
    correctement déduite d''une mesure fausse garde le second point.'
  si_echoue: 'Addition et soustraction d''angles adjacents, ou nature d''un angle : un angle aigu mesure
    moins de 90°.'
