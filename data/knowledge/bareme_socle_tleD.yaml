  bareme: 0.5
  bareme_classeur: 2.0
  competence: F.TAN
  competence_secondaire: F.DER
  domaine: Fonctions et applications
  objet: Trouver la tangente à x³ - 3x² + 2 parallèle à la droite y = -3x + 1
  reponse_attendue: f'(x) = -3 ⇔ x = 1 ; tangente y = -3x + 3
  solution: 'f''(x) = 3x² - 6x = -3 ⇔ (x - 1)² = 0 ⇔ x = 1 ; f(1) = 0 ; y = -3(x - 1). Barème : 1 pt pour
    f''(x) = -3 et l''abscisse x = 1 ; 1 pt pour f(1) = 0 et l''équation réduite y = -3x + 3. Erreur propagée
    : équation correctement formée à partir de l''abscisse trouvée.'
  si_echoue: Identification du coefficient directeur d'une tangente à la dérivée, puis condition de parallélisme
    de deux droites. Livret de remédiation 1ère D / Tle D, modules 10 et 12.
