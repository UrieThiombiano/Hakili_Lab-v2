    correction: 'Il faut relier $\overrightarrow{A''B''}$ à $\overrightarrow{AB}$, et $O$ est le seul
      point commun aux deux constructions : c''est lui le relais de Chasles. $O$ milieu de $\left[AA''\right]$
      donne $\overrightarrow{A''O} = \overrightarrow{OA}$ ; $O$ milieu de $\left[BB''\right]$ donne $\overrightarrow{OB''}
      = \overrightarrow{BO}$. Alors $\overrightarrow{A''B''} = \overrightarrow{A''O} + \overrightarrow{OB''}
      = \overrightarrow{BO} + \overrightarrow{OA} = \overrightarrow{BA}$, donc $A''B'' = AB$ : Ousmane
      a raison, le ravin mesure $37$ m.'
