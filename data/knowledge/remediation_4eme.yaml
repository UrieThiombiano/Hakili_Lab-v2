- niveau: 4eme
  module: 5
  module_titre: 'Calcul littéral : réduire, développer, factoriser'
  pourquoi: 'Tu connais ces règles depuis la 5ème, c''est leur application qui dérape : terme oublié en
    distribuant, signe moins qui saute une parenthèse. Tout le programme de 4ème s''appuie dessus.'
  diagnostic:
  - question: Réduis $7x + 3x$.
    reponse: $10x$
  - question: Calcule $4a - 3b + 7$ pour $a = 2$ et $b = 1$.
    reponse: $12$
  - question: Développe $3\left(x + 5\right)$.
    reponse: $3x + 15$
  - question: Développe $-\left(2a - 5\right)$.
    reponse: $-2a + 5$
  - question: Factorise $7x + 21$.
    reponse: $7\left(x + 3\right)$
  lecons:
  - id: 4eme_M05_L1
    numero: '5.1'
    titre: Valeur numérique et réduction
    retenir:
    - 'On **omet le $\times$** : $ka$ pour $k \times a$, $k\left(a + b\right)$ pour $k \times \left(a
      + b\right)$.'
    - 'Une lettre seule a pour coefficient $1$ : $b = 1b$, et $-x = \left(-1\right)x$.'
    - $x^{2} = x \times x$. Ce n'est **pas** $2x$.
    - '**Valeur numérique :** on remplace chaque lettre par son nombre, puis on calcule avec les priorités.'
    methode:
      titre: Réduire une somme algébrique
      etapes:
      - Recopie chaque terme **avec son signe**.
      - Repère les groupes de termes semblables et celui des nombres seuls.
      - Additionne les coefficients de chaque groupe, puis écris le résultat, les lettres d'abord, le
        nombre seul à la fin.
    exemple_resolu: 'Réduis $F = 7a + 4 - 3a + 2b - 9 + b$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On classe en trois groupes, chaque terme avec son signe. | $7a$ ; $-3a$ / $2b$ ; $+b$ / $+4$ ;
      $-9$ |

      | On ajoute les coefficients ($b$ vaut $1b$), puis on rassemble. | $4a$ ; $3b$ ; $-5$, d''où $F
      = 4a + 3b - 5$ |

      | **Vérification :** pour $a = b = 1$, départ $2$, arrivée $2$. ✓ | |'
    erreurs_frequentes:
    - erreur: $7x + 3x = 10x^{2}$.
      correction: 'on additionne les coefficients seulement : $10x$.'
    - erreur: $5 + 3x = 8x$.
      correction: $3x$ est un produit non calculé ; $5 + 3x$ reste tel quel.
    declic: null
    figures: []
  - id: 4eme_M05_L2
    numero: '5.2'
    titre: 'Développer : distributivité simple et double'
    retenir:
    - '$k\left(a + b\right) = ka + kb$ et $k\left(a - b\right) = ka - kb$ : le facteur atteint **chaque**
      terme, signe compris.'
    - 'Le facteur peut être un nombre, une lettre, ou les deux : $4x\left(3a - 5\right) = 12ax - 20x$.'
    - 'Un **signe moins devant une parenthèse** multiplie par $-1$ : il retourne **tous** les signes,
      $-\left(2a - 5\right) = -2a + 5$.'
    methode:
      titre: Développer puis réduire
      etapes:
      - Multiplie le facteur de devant par **tous** les termes de sa parenthèse.
      - Applique la règle des signes ; un moins devant la parenthèse retourne tout.
      - Réécris sans parenthèses, chaque terme avec son signe.
      - Regroupe les termes semblables, puis contrôle en remplaçant la lettre par $1$.
    exemple_resolu: 'Développe et réduis $G = 4\left(2x - 3\right) - 2\left(3x - 7\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On développe la première parenthèse. | $8x - 12$ |

      | Le second facteur est $-2$, pas $2$ : $\left(-2\right) \times \left(-7\right) = +14$. | $-6x +
      14$ |

      | On réécrit sans parenthèses et on regroupe. | $G = 8x - 12 - 6x + 14 = 2x + 2$ |

      | **Vérification :** pour $x = 1$, départ $4$, arrivée $4$. ✓ | |'
    erreurs_frequentes:
    - erreur: $3\left(x + 5\right) = 3x + 5$.
      correction: 'le facteur atteint les deux termes : $3x + 15$.'
    - erreur: $\left(x + 1\right)\left(x + 3\right) = x^{2} + 3$.
      correction: 'quatre produits : $x^{2} + 4x + 3$.'
    declic: null
    figures:
    - figures/m05_f1.svg
    - figures/m05_f2.svg
  - id: 4eme_M05_L3
    numero: '5.3'
    titre: Factoriser, et mettre un programme de calcul en forme
    retenir:
    - '$ka + kb = k\left(a + b\right)$. Le facteur commun est un **nombre**, une **lettre** ou une **parenthèse
      entière** : $12a + 6b = 6\left(2a + b\right)$ ; $8x - 8x^{2} = 8x\left(1 - x\right)$ ; $5\left(a
      + b\right) + x\left(a + b\right) = \left(a + b\right)\left(5 + x\right)$.'
    - 'Sans rien de commun, pas de factorisation : $5a + 3b$ ne se factorise pas.'
    - Une factorisation n'est **complète** que si la parenthèse n'a plus aucun facteur commun.
    - 'Développer et factoriser sont **inverses** : on contrôle en redéveloppant.'
    methode:
      titre: Factoriser une somme
      etapes:
      - 'Cherche le PGCD des coefficients, puis ce qui est commun aux parties littérales : une lettre,
        une parenthèse répétée.'
      - Écris ce facteur devant une parenthèse, et à l'intérieur ce qui reste de chaque terme.
      - Redéveloppe pour vérifier, et contrôle qu'il ne reste plus rien à sortir.
    exemple_resolu: 'Talato propose : « Choisis un nombre, ajoute $4$, multiplie le résultat par $2$,
      puis retire le double du nombre choisi. »


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On nomme le nombre et on traduit la première instruction. | $x + 4$ |

      | « Multiplie le résultat » porte sur toute la somme, puis on retire le double. | $P = 2\left(x
      + 4\right) - 2x$ |

      | On développe et on réduit : la lettre disparaît. | $P = 2x + 8 - 2x = 8$ |

      | **Vérification :** avec $x = 5$ : $9$, puis $18$, puis $8$. ✓ | |


      > #### DÉCLIC : Une factorisation qui s''arrête en chemin n''est pas fausse, elle est incomplète

      >

      > $12a + 18b = 2\left(6a + 9b\right)$ est vraie, mais $6$ et $9$ ont encore $3$ en commun. Cherche
      d''emblée le **PGCD** des coefficients : ici $6$, d''où $6\left(2a + 3b\right)$.'
    erreurs_frequentes:
    - erreur: factoriser $5a + 3b$ par $5$.
