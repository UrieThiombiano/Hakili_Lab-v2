  domaine: Activites numeriques
  objet: Calculer le bénéfice sur 1 800 savons (achat 250, vente 325 FCFA), juger 150 000
  reponse_attendue: bénéfice 75 FCFA par savon, 135 000 FCFA au total < 150 000 ; Rakieta a tort
  solution: 'Bénéfice unitaire : 325 - 250 = 75 FCFA ; total : 75 × 1 800 = 135 000 FCFA < 150 000. Barème
    (3 pts) : 1 pt (N) le bénéfice unitaire 75 FCFA par différence des deux prix ; 1 pt (N) le bénéfice
    total 135 000 FCFA ; 1 pt (D) la comparaison à 150 000 FCFA et la phrase de conclusion. Le bénéfice
    total juste calculé à partir d''un bénéfice unitaire erroné garde son point. L''écart de 15 000 FCFA
    n''est pas exigé.'
