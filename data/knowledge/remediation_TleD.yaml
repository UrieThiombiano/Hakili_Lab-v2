- niveau: TleD
  module: 4
  module_titre: Intervalles, valeur absolue et distance
  pourquoi: 'Ensembles de définition, ensembles de solutions, tableaux de variations : tout se donne en
    intervalles. Et la valeur absolue vue comme distance est le langage des limites.'
  diagnostic:
  - question: Calcule $|-9|$, $|4 - 11|$ et la distance entre $-3$ et $5$.
    reponse: $9$ ; $7$ ; $8$
  - question: 'Écris sous forme d''intervalle : a) $-2 \le x < 4$ ; b) $x > 5$.'
    reponse: a) $\left[-2\,;\,4\right[$ ; b) $\left]5\,;\,+\infty\right[$
  - question: Résous $|x - 3| = 5$.
    reponse: $x = 8$ ou $x = -2$
  - question: Écris $\{x \in \mathbb{R} / |x - 1| \le 4\}$ sous forme d'intervalle.
    reponse: $\left[-3\,;\,5\right]$
  - question: Donne $\left[-3\,;\,5\right] \cap \left]1\,;\,8\right[$.
    reponse: $\left]1\,;\,5\right]$
  lecons:
  - id: TleD_M04_L1
    numero: '4.1'
    titre: Intervalles, valeur absolue, distance
    retenir:
    - $[a\,;\,b]$ **fermé** ($a$ et $b$ inclus) ; $]a\,;\,b[$ **ouvert** ($a$ et $b$ exclus) ;
    - $[a\,;\,b[$ et $]a\,;\,b]$ **semi-ouverts** ;
    - '**non bornés** : $[a\,;\,+\infty[$, $]a\,;\,+\infty[$, $]-\infty\,;\,b]$, $]-\infty\,;\,b[$, et
      $\mathbb{R} = ]-\infty\,;\,+\infty[$.'
    methode:
      titre: Traduire une condition de distance par un intervalle
      etapes:
      - Repère le **centre** $a$ et le **rayon** $r$.
      - « distance de $x$ à $a$ au plus $r$ » s'écrit $|x - a| \le r$.
      - 'Ouvre en encadrement : $a - r \le x \le a + r$, soit $\left[a - r\,;\,a + r\right]$.'
      - Réciproquement, l'intervalle de centre $a$ et de rayon $r$ se résume par $|x - a| < r$ (bornes
        exclues) ou $\le r$ (bornes incluses).
    exemple_resolu: 'Écris $\{x \in \mathbb{R} / |x - 5| \le 2\}$ sous forme d''intervalle.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Une distance : on lit centre et rayon. | centre $a = 5$, rayon $r = 2$ |

      | Type « au plus » : un encadrement. | $-2 \le x - 5 \le 2$ |

      | On ajoute 5 partout ; inégalités larges, crochets fermés. | $x \in \left[3\,;\,7\right]$ |

      | **Vérification :** milieu de $\left[3\,;\,7\right]$ = 5, et $|3 - 5| = |7 - 5| = 2$. ✓ | |


      [SVG: figures/m04_f7.svg]

      *Figure 4.2 : $|x - 5| \le 2$ décrit le segment centré en 5, de rayon 2, bornes comprises.*'
    erreurs_frequentes:
    - erreur: écrire $[3\,;\,+\infty]$ ou $[-\infty\,;\,5]$.
      correction: 'le crochet reste ouvert du côté de l''infini : $[3\,;\,+\infty[$ et $]-\infty\,;\,5]$.'
    - erreur: écrire l'intervalle dans le désordre, $[5\,;\,2]$.
      correction: la borne de gauche est la plus petite.
    declic: 'où cela sert dès la rentrée — On ne te demande plus « résous cette équation » mais « détermine
      l''ensemble de définition de $f$ » : la réponse s''écrit en intervalles. Signe d''un trinôme, tableau
      de variations, ensemble de solutions : même écriture. Ce module sert dès le premier chapitre de
      fonctions.'
    figures:
    - figures/m04_f2.svg
    - figures/m04_f7.svg
  - id: TleD_M04_L2
    numero: '4.2'
    titre: Réunion, intersection, centre et rayon
    retenir:
    - '$A \cap B$ (**intersection**) : les réels qui sont **à la fois** dans $A$ et dans $B$, le mot «
      et ».'
    - '$A \cup B$ (**réunion**) : les réels qui sont dans $A$ **ou** dans $B$, le mot « ou ».'
    - '$\complement_{\mathbb{R}}A$ ou $\mathbb{R} \setminus A$ (**complémentaire**) : on garde ce qui
      reste et on **retourne chaque crochet** ; le complémentaire de $[2\,;\,5]$ est $]-\infty\,;\,2[
      \cup ]5\,;\,+\infty[$.'
    - L'intersection est toujours un intervalle, éventuellement vide ; la réunion seulement si les morceaux
      se touchent.
    methode:
      titre: Lire une intersection ou une réunion sur la droite
      etapes:
      - Trace **une seule** droite graduée portant toutes les bornes, et deux lignes au-dessus.
      - Colorie $A$ sur la première ligne, $B$ sur la deuxième, crochets marqués.
      - 'Intersection : ce qui est colorié **sur les deux lignes** ; réunion : **sur au moins une**.'
      - Une borne n'est dans l'intersection que si elle est prise **des deux côtés** ; elle est dans la
        réunion dès qu'elle l'est **d'un seul**.
    exemple_resolu: 'Détermine $A \cap B$ puis $A \cup B$ pour $A = [-3\,;\,5]$ et $B = ]1\,;\,8[$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On range les quatre bornes. | $-3 < 1 < 5 < 8$ |

      | Chevauchement entre 1 et 5 ; 1 exclu de $B$, 5 pris dans $A$. | $A \cap B = ]1\,;\,5]$ |

      | La réunion prend tout ce qui est colorié au moins une fois. | $A \cup B = [-3\,;\,8[$ |

      | **Vérification :** 1 est dans la réunion, pas dans l''intersection. ✓ | |'
    erreurs_frequentes:
    - erreur: prendre l'amplitude pour le rayon, et écrire $]-3\,;\,5[$ sous la forme $|x - 1| < 8$, qui
        donne $]-7\,;\,9[$.
      correction: le rayon est la **moitié** de l'amplitude.
    - erreur: calculer le centre par $\frac{b - a}{2}$.
      correction: le centre est une **somme** divisée par deux ; c'est le rayon qui utilise la différence.
    declic: null
    figures:
    - figures/m04_f8.svg
  - id: TleD_M04_L3
    numero: '4.3'
    titre: 'Inéquations avec valeur absolue : les deux familles'
    retenir:
    - '**$|x - a| \le r$** : « $x$ est à au plus $r$ de $a$ », **un seul morceau** centré en $a$ : $x
      \in [a - r\,;\,a + r]$.'
    - '**$|x - a| \ge r$** : « $x$ est à au moins $r$ de $a$ », **deux morceaux** : $x \in\ ]-\infty\,;\,a
      - r] \cup [a + r\,;\,+\infty[$.'
    - 'Avec des inégalités strictes : mêmes ensembles, crochets ouverts.'
    - 'Cas limites : $|X| < -1$ n''a aucune solution ; $|X| > -1$ est vraie pour tout $x$.'
    methode:
      titre: Résoudre une inéquation avec valeur absolue
      etapes:
      - '**Isole la valeur absolue** et regarde le signe du second membre.'
      - '**Reconnais la famille** : $\le$ ou $<$ donnent un morceau, $\ge$ ou $>$ en donnent deux.'
      - '**Enlève les barres** : encadrement $-r \le X \le r$, ou bien $X \le -r$ **ou** $X \ge r$.'
      - '**Résous en $x$** (sens inversé si tu divises par un négatif), réponse en intervalles. Une double
        condition ou un système : on résout chaque inéquation, puis on prend l''intersection.'
    exemple_resolu: 'Résous dans $\mathbb{R}$ l''inéquation $|2x + 1| < 4$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Type « inférieur à » : un encadrement. | $-4 < 2x + 1 < 4$ |

      | On retranche 1, puis on divise par 2 (positif, sens conservé). | $-5 < 2x < 3$, puis $-\frac{5}{2}
      < x < \frac{3}{2}$ |

      | Inégalités strictes, crochets ouverts. | $S =\ \left]-\frac{5}{2}\,;\,\frac{3}{2}\right[$ |

      | **Vérification :** $x = 0$ donne $1 < 4$ ✓ ; $x = 2$ donne $5$, exclu. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $|x - 5| \ge 2$ sous forme d'encadrement $-2 \ge x - 5 \ge 2$.
      correction: impossible ; famille « au moins », donc deux conditions reliées par « ou ».
    - erreur: conclure que $|x + 4| > -3$ n'a pas de solution.
      correction: 'une valeur absolue est toujours supérieure à $-3$ : $S = \mathbb{R}$.'
    declic: null
    figures: []
  - id: TleD_M04_L4
    numero: '4.4'
    titre: Écrire une expression sans valeur absolue
    retenir: []
    methode:
      titre: Écrire une expression sans valeur absolue
      etapes:
      - Pour chaque $|ax + b|$, résous $ax + b = 0$.
      - '**Range ces valeurs** dans l''ordre croissant : elles découpent $\mathbb{R}$ en morceaux.'
      - '**Dresse un tableau de signes**, une ligne par expression, une colonne par morceau.'
      - '**Sur chaque morceau**, remplace $|A|$ par $A$ ou $-A$, réduis, puis contrôle sur un nombre du
        morceau.'
    exemple_resolu: 'Écris $f\left(x\right) = |x - 1| + |x + 3|$ sans valeur absolue.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les intérieurs s''annulent en $1$ et $-3$ : trois morceaux. | $x < -3$ ; $-3 \le x < 1$ ; $x \ge
      1$ |

      | Sur le premier, les deux intérieurs sont négatifs. | $f\left(x\right) = -\left(x - 1\right) -
      \left(x + 3\right) = -2x - 2$ |

      | Au milieu, $x + 3 \ge 0$ et $x - 1 < 0$ ; à droite, les deux positifs. | $f\left(x\right) = 4$,
      puis $f\left(x\right) = 2x + 2$ |

      | **Vérification :** $x = -5 \to 8$ ✓ ; $x = 0 \to 4$ ✓. | |'
    erreurs_frequentes:
    - erreur: répondre à « écris $|x - 4|$ sans valeur absolue » par une seule formule.
      correction: tant que le signe de $x - 4$ est inconnu, il faut **deux** formules, chacune avec sa
        condition.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Représente graphiquement, puis écris sous forme d''intervalle l''ensemble des réels vérifiant
      : a) $-3 \le x \le 2$ ; b) $x \ge 7$ ; c) $x > \frac{7}{2}$ ; d) $-1 \le x < 1$ ; e) $-2 < x \le
      2$.'
    correction: a) $\left[-3\,;\,2\right]$ ; b) $\left[7\,;\,+\infty\right[$ ; c) $\left]\frac{7}{2}\,;\,+\infty\right[$
      ; d) $\left[-1\,;\,1\right[$ ; e) $\left]-2\,;\,2\right]$.
  - numero: 2
    etoiles: 1
    enonce: 'Écris sous forme d''intervalle : $A = \{x \in \mathbb{R} / -7 \le x \le 11\}$ ; $B = \{x
      \in \mathbb{R} / 9 \le x < 15\}$ ; $C = \{x \in \mathbb{R} / -7 < x \le 12$ et $8 \le x \le 19\}$
      ; $D = \{x \in \mathbb{R} / -3 < x \le 12$ et $-5 \le x \le 7\}$.'
    correction: $A = \left[-7\,;\,11\right]$ ; $B = \left[9\,;\,15\right[$ ; $C = \left[8\,;\,12\right]$
      ; $D = \left]-3\,;\,7\right]$.
  - numero: 3
    etoiles: 1
    enonce: 'Schématise : $\left[1\,;\,4\right[$ ; $\left[-2\,;\,+\infty\right[$ ; $\left[-7\,;\,7\right]$
      ; $\left]-\infty\,;\,1\right[$ ; $\left[0\,;\,1\right]$. Existe-t-il un réel commun à ces cinq intervalles
      ?'
    correction: 'Pas de réel commun : $\left[1\,;\,4\right[$ impose $x \ge 1$, $\left]-\infty\,;\,1\right[$
      impose $x < 1$.'
  - numero: 4
    etoiles: 1
    enonce: 'Détermine le centre, le rayon et l''amplitude de : $A = \left]-3\,;\,7\right[$ ; $B = \left]11\,;\,16\right[$
      ; $C = \left[-\frac{5}{4}\,;\,\frac{1}{2}\right]$ ; $D = \left[-\frac{3}{2}\,;\,5\right]$.'
    correction: '$A$ : centre $2$, rayon $5$, amplitude $10$ ; $B$ : $13{,}5$ ; $2{,}5$ ; $5$ ; $C$ :
      $-\frac{3}{8}$ ; $\frac{7}{8}$ ; $\frac{7}{4}$ ; $D$ : $\frac{7}{4}$ ; $\frac{13}{4}$ ; $\frac{13}{2}$.'
  - numero: 5
    etoiles: 1
    enonce: 'Détermine l''intersection ou la réunion : a) $\left[0\,;\,7\right[ \cap \left]-\infty\,;\,1\right]$
      ; b) $\left]-5\,;\,10\right] \cup \left]-\infty\,;\,-4\right[$ ; c) $\left]-1\,;\,0\right[ \cap
      \left[-2\,;\,0\right]$ ; d) $\left[0\,;\,2\right] \cap \left[1\,;\,5\right[$ ; e) $\left]-\infty\,;\,4\right]
