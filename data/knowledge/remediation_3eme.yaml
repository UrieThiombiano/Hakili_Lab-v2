      > Ligne 1 : $I\left(\frac{2 - \left(-4\right)}{2}\,;\,\frac{-1 - 3}{2}\right)$

      > Ligne 2 : $I\left(3\,;\,-2\right)$

      > Ligne 3 : $\overrightarrow{AB} = \overrightarrow{BC}$, donc $ABCB$ est un parallélogramme.

      > Ligne 4 : $C$ a pour coordonnées $\left(-4 - 6\,;\,3 + 4\right)$, soit $C\left(-10\,;\,7\right)$.


      Deux lignes sont fausses, et pourtant l''une d''elles conduit à un résultat exact. Repère-les, explique
      chaque faute, dis pourquoi un résultat juste obtenu par un raisonnement faux ne vaut rien, puis
