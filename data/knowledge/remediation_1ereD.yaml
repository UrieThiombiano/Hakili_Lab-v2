- niveau: 1ereD
  module: 6
  module_titre: Majorant, minorant, et raisonner par l'absurde
  pourquoi: On te demandera sans cesse si une fonction ou une suite est majorée, minorée, si elle admet
    un maximum. Le raisonnement par l'absurde, lui, est exigé jusqu'au bac.
  diagnostic:
  - question: Soit $A = \{1\,;\,4\,;\,7\,;\,9\}$. Donne un majorant, le maximum et le minimum de $A$.
    reponse: majorant $9$ (ou tout réel $\ge 9$) ; $\max = 9$ ; $\min = 1$
  - question: 'Vrai ou faux : « 10 est le maximum de $\left[2\,;\,10\right[$ ». Justifie.'
    reponse: faux, $10 \notin \left[2\,;\,10\right[$
  - question: Le nombre $0{,}25$ est-il rationnel ou irrationnel ? Et $\sqrt{2}$ ?
    reponse: $0{,}25 = \frac{1}{4}$ rationnel ; $\sqrt{2}$ irrationnel
  - question: Cite un minorant de $\left]3\,;\,+\infty\right[$. Cet intervalle a-t-il un minimum ?
    reponse: $3$ (ou tout réel $\le 3$) ; pas de minimum, car $3 \notin \left]3\,;\,+\infty\right[$
  lecons:
  - id: 1ereD_M06_L1
    numero: '6.1'
    titre: Majorant, minorant, maximum, minimum
    retenir:
    - $M$ est un **majorant** de $A$ si $x \le M$ pour tout $x \in A$ ; $A$ est alors **majorée**.
    - $m$ est un **minorant** de $A$ si $x \ge m$ pour tout $x \in A$ ; $A$ est **minorée**.
    - '$A$ majorée et minorée est dite **bornée** : $m \le x \le M$ pour tout $x \in A$.'
    - Le **maximum** $\max A$ est un majorant qui **appartient** à $A$ ; le **minimum** $\min A$, un minorant
      qui appartient à $A$.
    - Une partie majorée a une **infinité** de majorants, mais **au plus un** maximum, qui **peut ne pas
      exister**.
    methode:
      titre: Reconnaître un majorant, puis un maximum
      etapes:
      - '$M$ majorant de $A$ : vérifier que **chaque** élément de $A$ est $\le M$.'
      - '$M$ maximum de $A$ : vérifier que $M$ est un majorant, **puis** que $M \in A$.'
      - 'Minorant et minimum : même démarche avec $\ge$.'
    exemple_resolu: '$A = \{38\,;\,41\,;\,39\,;\,42\,;\,40\}$. 45 est-il un majorant ? 42 est-il le maximum
      ? 38 est-il le minimum ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Tous les éléments sont $\le 45$. | **45 est un majorant** (mais $45 \notin A$) |

      | Tous les éléments sont $\le 42$ et $42 \in A$. | $42 = \max A$ |

      | Tous les éléments sont $\ge 38$ et $38 \in A$. | $38 = \min A$ |

      | **Vérification :** 45 majore sans appartenir à $A$ : majorant, pas maximum. ✓ | |


      [SVG: figures/m06_f2.svg]

      *Figure 6.2 — $B = \left[0\,;\,1\right[$ est majoré par 1, mais aucun de ses éléments n''est le
      plus grand : $B$ n''a pas de maximum.*'
    erreurs_frequentes: []
    declic: null
    figures:
    - figures/m06_f5.svg
    - figures/m06_f2.svg
  - id: 1ereD_M06_L2
    numero: '6.2'
    titre: Irrationnels et raisonnement par l'absurde
    retenir:
    - Un **rationnel** s'écrit $\frac{p}{q}$ avec $p$, $q$ entiers, $q \ne 0$ ; leur ensemble est $\mathbb{Q}$.
    - 'Un réel qui n''est pas rationnel est **irrationnel** : $\sqrt{2}$, $\sqrt{3}$, $\pi$.'
    - '$\sqrt{2}$ est **irrationnel** : aucune fraction n''a pour carré 2.'
    - '**Par l''absurde :** pour prouver une affirmation, on suppose son contraire, on calcule sans erreur,
      on aboutit à l''impossible.'
    methode:
      titre: Démontrer qu'un nombre est irrationnel (par l'absurde)
      etapes:
      - '**Suppose le contraire** : le nombre vaut $\frac{p}{q}$, fraction **irréductible** (ce mot fabrique
        la contradiction ; sans lui, rien ne marche).'
      - '**Élève au carré** et déduis une divisibilité ($p^{2}$ pair $\Rightarrow$ $p$ pair).'
      - Montre que $q$ est divisible par le même nombre.
      - '**Conclus :** $p$ et $q$ ont un facteur commun, la fraction n''était pas irréductible : contradiction.'
    exemple_resolu: 'Démontre que $\sqrt{2}$ est irrationnel.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On suppose $\sqrt{2} = \frac{p}{q}$, fraction irréductible. | $\frac{p^{2}}{q^{2}} = 2$, donc
      $p^{2} = 2q^{2}$ |

      | $p^{2}$ est pair, donc $p$ est pair. | $p = 2k$, donc $4k^{2} = 2q^{2}$, donc $q^{2} = 2k^{2}$
      |

      | $q^{2}$ pair, donc $q$ pair : $p$ et $q$ sont tous deux pairs. | La fraction n''était pas irréductible
      |

      | **Conclusion :** l''hypothèse est absurde. | **$\sqrt{2}$ est irrationnel.** ✓ |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: 1ereD_M06_L3
    numero: '6.3'
    titre: 'Prouver qu''un nombre majore : la différence'
    retenir:
    - $A \ge B$ équivaut à $A - B \ge 0$ ; $A \le B$ équivaut à $A - B \le 0$.
    - 'Deux outils : $t^{2} \ge 0$ toujours ; un quotient est du signe du produit numérateur $\times$
      dénominateur.'
    - 'Si les éléments sont les $f\left(n\right)$, $n \in \mathbb{N}$ : $M$ majore lorsque $f\left(n\right)
      - M \le 0$ pour tout $n$.'
    - 'Si cette différence ne s''annule **jamais**, $M$ majore sans être atteint : pas de maximum.'
    methode:
      titre: Majorant, puis maximum
      etapes:
      - '**Écris la différence** entre l''élément général et le candidat $M$.'
      - '**Réduis au même dénominateur**, puis factorise.'
      - '**Conclus sur le signe** : différence toujours $\le 0$ $\Rightarrow$ $M$ est un majorant.'
      - '**Cherche si $M$ est atteint** : une valeur qui annule la différence donne le maximum ; sinon,
        pas de maximum.'
    exemple_resolu: '$A$ est l''ensemble des $\frac{2m + 1}{m + 1}$, $m \in \mathbb{N}$. Montre que 2
      majore $A$, puis cherche maximum et minimum.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | J''étudie le signe de la différence avec le candidat $M = 2$. | $\frac{2m + 1}{m + 1} - 2 = \frac{2m
      + 1 - 2m - 2}{m + 1} = \frac{-1}{m + 1}$ |

      | Le dénominateur est $> 0$, donc la différence est $< 0$. | **2 est un majorant de $A$** |

      | Elle ne s''annule jamais : 2 n''est pas atteint. | $A$ **n''a pas de maximum** |

      | Pour $m = 0$ on obtient 1, plus petit élément, et $1 \in A$. | $\min A = 1$ |

      | **Vérification :** $\frac{2m+1}{m+1} = 2 - \frac{1}{m+1}$ donne les deux résultats d''un coup.
      ✓ | |'
    erreurs_frequentes: []
    declic: le mot qui coûte le plus de points — « Majorant » et « maximum » ne sont pas synonymes. Un
      majorant se choisit librement au-dessus de l'ensemble ; un maximum doit être **un élément de l'ensemble**.
      Avant d'écrire « max », vérifie l'appartenance.
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Soit $A = \{x \in \mathbb{N} / 2 \le x \le 8\}$. Donne deux majorants, deux minorants, puis
      le maximum et le minimum de $A$.
    correction: Majorants $8$ et $9$ ; minorants $2$ et $1$ ; $\max A = 8$ ; $\min A = 2$.
  - numero: 2
    etoiles: 1
    enonce: Soit $I = \left]-3\,;\,7\right]$. Donne un majorant et un minorant de $I$. $I$ admet-il un
      maximum ? un minimum ? Justifie.
    correction: Majorant $7$ ; minorant $-3$. $\max I = 7$ car $7 \in I$ ; pas de minimum, car $-3 \notin
      I$.
  - numero: 3
    etoiles: 1
    enonce: 'Recopie et complète avec $\in$ ou $\notin$, en justifiant : a) $0{,}25$ … $\mathbb{Q}$ ;
      b) $\sqrt{9}$ … $\mathbb{Q}$ ; c) $1 + \sqrt{2}$ … $\mathbb{Q}$ ; d) $2\sqrt{3} - \sqrt{12}$ … $\mathbb{Q}$.'
    correction: a) $\in$ ($= \frac{1}{4}$) ; b) $\in$ ($= 3$) ; c) $\notin$ (sinon $\sqrt{2} = \left(1
      + \sqrt{2}\right) - 1$ serait rationnel) ; d) $\in$ (car $\sqrt{12} = 2\sqrt{3}$, l'expression vaut
      $0$).
  - numero: 4
    etoiles: 1
    enonce: Soit $A = \{x \in \mathbb{N} / 2 \le x \le 8\}$. a) Donne trois majorants et trois minorants
      de $A$. b) Donne le maximum et le minimum de $A$.
    correction: a) Majorants $8$, $9$, $10$ ; minorants $2$, $1$, $0$. b) $\max A = 8$ ; $\min A = 2$.
  - numero: 5
    etoiles: 1
    enonce: Soit $E = \left\{1\,;\,\frac{1}{2}\,;\,\frac{1}{3}\,;\,\frac{1}{5}\,;\,\frac{1}{6}\right\}$.
      a) Trouve un majorant de $E$ qui soit un élément de $E$. b) Trouve un minorant de $E$ qui ne soit
      pas un élément de $E$.
    correction: 'a) $1$ : il majore $E$ et $1 \in E$. b) $0$ : il minore $E$ et $0 \notin E$.'
  - numero: 6
    etoiles: 1
    enonce: On considère $I = \left[-1\,;\,\sqrt{3}\right]$ ; $J = \left]-\infty\,;\,\frac{3}{2}\right[$
      ; $K = \left[0\,;\,+\infty\right[$. Pour chacun, donne (s'ils existent) deux majorants, deux minorants,
      le maximum et le minimum. Lesquels sont bornés ?
    correction: '$I$ : majorants $\sqrt{3}$, $2$ ; minorants $-1$, $-2$ ; $\max = \sqrt{3}$, $\min = -1$
      ; borné. $J$ : majorants $\frac{3}{2}$, $2$ ; aucun minorant ; ni max ni min ; non borné. $K$ :
      minorants $0$, $-1$ ; aucun majorant ; $\min = 0$, pas de max ; non borné. Seul $I$ est borné.'
  - numero: 7
    etoiles: 1
    enonce: Soit $B = \{x \in \mathbb{Z} / |2x - 4| \le 10\}$. a) Écris $B$ en extension. b) Donne le
      maximum et le minimum de $B$.
    correction: a) $|2x - 4| \le 10 \iff -3 \le x \le 7$, donc $B = \{-3\,;\,-2\,;\,\ldots\,;\,7\}$. b)
      $\max B = 7$ ; $\min B = -3$.
  - numero: 8
    etoiles: 1
    enonce: Soit $L = \left\{-7{,}4\,;\,-\sqrt{5}\,;\,0\,;\,\pi\,;\,\frac{19}{7}\right\}$. a) Donne deux
      majorants et deux minorants de $L$. b) Donne le maximum et le minimum de $L$. $L$ est-il borné ?
    correction: 'Ordre : $-7{,}4 < -\sqrt{5} < 0 < \frac{19}{7} < \pi$. a) Majorants $\pi$, $4$ ; minorants
      $-7{,}4$, $-8$. b) $\max L = \pi$ ; $\min L = -7{,}4$ ; $L$ est borné.'
  - numero: 9
    etoiles: 1
    enonce: 'Vrai ou faux, en justifiant : a) « Tout intervalle fermé borné $\left[a\,;\,b\right]$ admet
      un maximum et un minimum. » b) « $\left]0\,;\,1\right[$ admet un minimum. » c) « 100 est le maximum
      de $\left[0\,;\,100\right[$. »'
    correction: 'a) Vrai : les deux bornes appartiennent à $\left[a\,;\,b\right]$. b) Faux : $0 \notin
      \left]0\,;\,1\right[$, et $\frac{x}{2}$ y est encore, plus petit. c) Faux : $100 \notin \left[0\,;\,100\right[$,
      majorant seulement.'
  - numero: 10
    etoiles: 1
    enonce: 'Soit $A = \{x \in \mathbb{N} / 2 \le x \le 8\}$ et $B = \{x \in \mathbb{Z} / |2x - 4| \le
      10\}$. Trouve quatre majorants et quatre minorants de $A$, puis de $B$.


      ### Entraînement ★★'
    correction: '$A$ : majorants $8$, $9$, $10$, $11$ ; minorants $2$, $1$, $0$, $-1$. $B$ : majorants
      $7$, $8$, $9$, $10$ ; minorants $-3$, $-4$, $-5$, $-6$.'
  - numero: 11
    etoiles: 2
    enonce: En t'inspirant de la démonstration du cours, montre que $\sqrt{3}$ est irrationnel.
    correction: 'Si $\sqrt{3} = \frac{p}{q}$ irréductible, alors $p^{2} = 3q^{2}$ : 3 divise $p^{2}$ donc
      $p$ (3 premier). Avec $p = 3k$ : $q^{2} = 3k^{2}$, donc 3 divise $q$. Facteur commun 3 : contradiction.
      **$\sqrt{3}$ est irrationnel.**'
  - numero: 12
    etoiles: 2
    enonce: Soit $A$ l'ensemble des réels $\frac{m}{m + 2}$, $m \in \mathbb{N}$. a) Calcule les termes
      pour $m = 0, 1, 2, 3$. b) Montre que 0 est le minimum de $A$. c) Montre que $A$ est majoré par 1,
      mais n'admet pas de maximum.
    correction: 'a) $0$ ; $\frac{1}{3}$ ; $\frac{1}{2}$ ; $\frac{3}{5}$. b) Tous les termes sont $\ge
      0$ et $0$ est atteint pour $m = 0$ : $\min A = 0$. c) $\frac{m}{m + 2} = 1 - \frac{2}{m + 2} < 1$
      : majoré par 1 ; la différence ne s''annule jamais et le terme de rang suivant dépasse toujours
      le précédent : pas de maximum.'
  - numero: 13
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Rédige en quelques lignes la différence entre un majorant et
      un maximum d''une partie de $\mathbb{R}$, avec un exemple d''ensemble majoré sans maximum.'
    correction: 'Un majorant domine l''ensemble sans forcément lui appartenir ; un maximum est un majorant
      qui **appartient** à l''ensemble. Exemple : $\left[0\,;\,1\right[$ est majoré par 1, sans maximum.'
  - numero: 14
    etoiles: 2
    enonce: Démontre que $\sqrt{3}$ est irrationnel en rédigeant entièrement le raisonnement par l'absurde.
    correction: Même rédaction qu'à l'exercice 11, avec le lemme « 3 divise $p^{2}$ $\Rightarrow$ 3 divise
      $p$ ».
  - numero: 15
    etoiles: 2
    enonce: Le nombre $\sqrt{2} + \sqrt{3}$ est-il rationnel ? (On pourra élever au carré et utiliser
      l'irrationalité de $\sqrt{6}$.)
    correction: '$\left(\sqrt{2} + \sqrt{3}\right)^{2} = 5 + 2\sqrt{6}$. Si la somme était rationnelle,
      son carré le serait, donc $\sqrt{6} = \frac{s^{2} - 5}{2}$ aussi : contradiction. **$\sqrt{2} +
      \sqrt{3}$ est irrationnel.**'
  - numero: 16
    etoiles: 2
    enonce: 'Soient $a$ et $b$ deux réels strictement positifs, $M = \frac{a + b}{2}$ et $g = \sqrt{ab}$.
      a) Calcule $M$ et $g$ pour $a = 2$ et $b = 8$. b) Démontre que $M - g = \frac{\left(\sqrt{a} - \sqrt{b}\right)^{2}}{2}$,
      puis que $M \ge g$.


      ### ★★★ Défis de maîtrise'
    correction: a) $M = 5$ ; $g = 4$. b) $M - g = \frac{a - 2\sqrt{ab} + b}{2} = \frac{\left(\sqrt{a}
      - \sqrt{b}\right)^{2}}{2} \ge 0$, donc $M \ge g$ (égalité si $a = b$).
  - numero: 17
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Toute partie non vide et majorée de $\mathbb{R}$ admet un maximum.

      b) Si $M$ est un majorant de $A$ et si $M \in A$, alors $M = \max A$.

      c) L''ensemble $A = \left\{\frac{1}{n},\ n \in \mathbb{N}^{*}\right\}$ admet un minimum.

      d) Toute partie finie et non vide de $\mathbb{R}$ admet un maximum.'
    correction: 'On cherche les contre-exemples du côté des intervalles ouverts, où la borne n''est jamais
      atteinte.

      a) **Faux.** $\left]0\,;\,1\right[$ est majoré par 1 ; si $m$ en était le maximum, $\frac{m + 1}{2}$
      y serait encore et dépasserait $m$. (Une telle partie admet une borne supérieure, pas un maximum.)

      b) **Vrai** : c''est la définition même du maximum.

      c) **Faux.** Pour tout $n \ge 1$, $\frac{1}{n + 1} < \frac{1}{n}$ : pas de plus petit élément. $A$
      est minoré par 0 ; son maximum est 1 ($n = 1$).

      d) **Vrai** : on range la liste finie, le dernier élément appartient à l''ensemble et majore les
      autres.'
  - numero: 18
    etoiles: 3
    enonce: a) Démontre que si un entier $p$ est tel que 3 divise $p^{2}$, alors 3 divise $p$ (disjonction
      de cas sur le reste de $p$ dans la division par 3). b) Démontre par l'absurde que $\sqrt{3}$ est
      irrationnel. c) Démontre de même que $\sqrt{6}$ est irrationnel, puis déduis-en que $\sqrt{2} +
      \sqrt{3}$ est irrationnel.
    correction: 'Le lemme arithmétique doit être établi avant tout ; sans lui le raisonnement par l''absurde
      tourne à vide.

      a) Trois cas. $p = 3k$ : $p^{2} = 3\left(3k^{2}\right)$, reste 0. $p = 3k + 1$ : $p^{2} = 3\left(3k^{2}
      + 2k\right) + 1$, reste 1. $p = 3k + 2$ : $p^{2} = 3\left(3k^{2} + 4k + 1\right) + 1$, reste 1.
      Donc 3 divise $p^{2}$ seulement si $p = 3k$.

      b) Si $\sqrt{3} = \frac{p}{q}$ irréductible, $p^{2} = 3q^{2}$ : 3 divise $p$ par a), $p = 3k$ donne
      $q^{2} = 3k^{2}$, donc 3 divise $q$ : contradiction.

      c) Si $\sqrt{6} = \frac{p}{q}$ irréductible, $p^{2} = 6q^{2}$ est pair donc $p = 2k$, d''où $2k^{2}
      = 3q^{2}$ : $q^{2}$ pair, $q$ pair, contradiction. Enfin $s = \sqrt{2} + \sqrt{3}$ rationnel donnerait
      $\sqrt{6} = \frac{s^{2} - 5}{2}$ rationnel : impossible.'
  - numero: 19
    etoiles: 3
    enonce: On pose $A = \left\{\frac{2n + 1}{n + 1},\ n \in \mathbb{N}\right\}$. a) Montre que $\frac{2n
      + 1}{n + 1} = 2 - \frac{1}{n + 1}$. b) Montre que $A$ est minoré et majoré, et donne un minorant
      et un majorant. c) $A$ admet-il un minimum ? un maximum ? Justifie, la seconde réponse par l'absurde.
    correction: 'Le geste décisif : écrire le quotient comme « constante moins quelque chose de simple
      ».

      a) $2 - \frac{1}{n + 1} = \frac{2\left(n + 1\right) - 1}{n + 1} = \frac{2n + 1}{n + 1}$.

      b) $n + 1 \ge 1$ donne $0 < \frac{1}{n + 1} \le 1$, donc $1 \le 2 - \frac{1}{n + 1} < 2$ : minoré
      par 1, majoré par 2.

      c) $\min A = 1$, atteint pour $n = 0$. Pas de maximum : si $M = 2 - \frac{1}{n_{0} + 1}$ était le
      maximum, l''élément de rang $n_{0} + 1$ vaudrait $2 - \frac{1}{n_{0} + 2} > M$, contradiction.'
  - numero: 20
    etoiles: 3
    enonce: 'Voici la copie de Fatimata, qui devait étudier $B = \left]-\infty\,;\,4\right[$. Repère la
      ligne qui casse et dis ce qui manque. Démontre ensuite par l''absurde que $B$ n''a pas de maximum.


      | Ligne | Ce que Fatimata a écrit |

      |---|---|

      | 1 | Pour tout $x$ de $B$, $x < 4$, donc $x \le 4$ : $4$ est un majorant de $B$. |

      | 2 | Aucun réel plus petit que $4$ ne majore $B$. |

      | 3 | Donc $4$ est le maximum de $B$. |'
    correction: 'Il faut demander à chaque ligne quelle définition elle applique : les lignes 1 et 2 parlent
      de majorants, la ligne 3 change de mot sans changer de justification.

      **La ligne 3 est fausse.** Les lignes 1 et 2 prouvent que 4 est le plus petit des majorants, pas
      qu''il est le maximum : il manque $4 \in B$, or $B$ est ouvert en 4.

      Par l''absurde : si $m = \max B$, alors $m \in B$ donc $m < 4$ ; le nombre $c = \frac{m + 4}{2}$
      vérifie $m < c < 4$, donc $c \in B$ et $c > m$ : contradiction. $B$ n''a pas de maximum.'
  - numero: 21
    etoiles: 3
    enonce: On pose $E = \left\{n \in \mathbb{N}^{*} \ \middle|\ \frac{5n + 2}{n} \ge \frac{11}{2}\right\}$.
      Détermine $E$ en extension, dis s'il est majoré, s'il est minoré, donne son minimum et son maximum
      lorsqu'ils existent, et indique son nombre d'éléments.
    correction: 'On résout l''inéquation dans $\mathbb{R}$, puis on ne garde que les entiers ; séparer
      la fraction évite toute discussion de signe.

      Pour $n \ge 1$ : $\frac{5n + 2}{n} = 5 + \frac{2}{n}$, et $5 + \frac{2}{n} \ge \frac{11}{2} \iff
      \frac{2}{n} \ge \frac{1}{2} \iff 4 \ge n$.

      Donc $E = \{1\,;\,2\,;\,3\,;\,4\}$ : minoré (par 1), majoré (par 4), $\min E = 1$, $\max E = 4$,
      **quatre éléments**. Vérification : $n = 4$ donne $\frac{11}{2}$ ✓ ; $n = 5$ donne $5{,}4 < 5{,}5$.'
  - numero: 22
    etoiles: 3
    enonce: 'Une coopérative de karité de Banfora produit, le $n$-ième mois ($n \ge 1$), $p\left(n\right)
      = \frac{800n}{n + 4}$ kilogrammes de beurre. Le président annonce : « un jour, nous dépasserons
      les $800$ kg par mois ». Décide s''il a raison et justifie rigoureusement. Détermine ensuite à partir
      de quel mois la production dépasse $700$ kg.'
    correction: 'Face à « nous dépasserons un jour ce seuil », on teste d''abord si le seuil est un majorant
      : si oui, l''annonce est fausse.

      $p\left(n\right) = \frac{800\left(n + 4\right) - 3\,200}{n + 4} = 800 - \frac{3\,200}{n + 4} < 800$
      pour tout $n \ge 1$. **Le président a tort** : 800 majore la production, qui s''en approche sans
      jamais l''atteindre.

      Seuil de 700 : $800 - \frac{3\,200}{n + 4} > 700 \iff \frac{3\,200}{n + 4} < 100 \iff n + 4 > 32
      \iff n > 28$. La production dépasse 700 kg **à partir du 29e mois**. Vérification : $p\left(28\right)
      = 700$ exactement et $p\left(29\right) = \frac{23\,200}{33} > 700$ ✓.


      ---'
  fiche_revision:
  - '**Majorant.** $M$ tel que $x \le M$ pour tout $x$ de l''ensemble ; il y en a une infinité.'
  - '**Maximum.** Un majorant qui **appartient** à l''ensemble ; il est unique et peut ne pas exister.'
  - '**Borné.** Majoré **et** minoré.'
  - '**Crochet.** Fermé : la borne est max ou min. Ouvert : elle n''est que majorant ou minorant.'
  - '**Différence.** $A \ge B \iff A - B \ge 0$ ; un carré est toujours $\ge 0$.'
  - '**Irrationnel.** Ne s''écrit pas $\frac{p}{q}$ ; $\sqrt{2}$, $\sqrt{3}$, $\sqrt{6}$, $\pi$.'
  - '**Par l''absurde.** Supposer le contraire, calculer sans erreur, atteindre l''impossible.'
  trouve_erreur:
  - faux: « $4$ majore $\left]-\infty\,;\,4\right[$, donc $4$ en est le maximum. »
    correction: '$4 \notin$ l''intervalle : majorant seulement.'
  - faux: « $\sqrt{50}$ est irrationnel car il y a un radical. »
    correction: 'Simplifier d''abord : $\sqrt{50} = 5\sqrt{2}$, irrationnel ; mais $\sqrt{16} = 4$ est
      rationnel.'
  - faux: '« J''ai testé $x = 0, 1, 2$ : l''inégalité est vraie pour tout $x$. »'
    correction: Les essais ne démontrent rien ; étudier le signe de la différence.
  - faux: « $A$ est majoré par 1, donc $\max A = 1$. »
    correction: Vérifier qu'une valeur atteint 1 ; sinon, pas de maximum.
