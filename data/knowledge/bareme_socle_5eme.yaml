  competence: M.VOL
  competence_secondaire: N.NUM
  domaine: Mesures et grandeurs
  objet: Calculer le volume d'une dalle de 84 m² sur 0,1 m et juger si 9 m³ suffisent
  reponse_attendue: V = 84 × 0,1 = 8,4 m³ < 9 m³ ; Issouf a raison
  solution: 'La dalle est un pavé droit de base le sol : V = 84 × 0,1 = 8,4 m³ ; 8,4 < 9. Conclusion attendue
    : « Issouf a raison : la dalle demande 8,4 m³ de béton, donc 9 m³ suffisent. » Le prix du sac de ciment
    (6 500 FCFA) est une donnée inutile. Barème (3 pts) : 1 pt (M) la dalle reconnue comme un pavé droit
    dont le volume est aire du sol × épaisseur ; 1 pt (M) le volume 8,4 m³ avec son unité ; 1 pt (N) la
    comparaison de 8,4 à 9 et la phrase de conclusion. Aucune conversion n''est attendue. Signaler la
    donnée inutile n''est pas exigé.'
  si_echoue: Volume du pavé droit à partir de l'aire de sa base.
