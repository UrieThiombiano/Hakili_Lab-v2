  competence_secondaire: N.PRIO
  domaine: Fonctions et applications
  objet: Compléter le tableau des prix (Noaga 15 000 + 900 par sac, Drissa 1 500 par sac)
  reponse_attendue: 'Noaga : 24 000 ; 33 000 ; 42 000 FCFA — Drissa : 15 000 ; 30 000 ; 45 000 FCFA (pour
    10, 20, 30 sacs)'
  solution: 'Noaga : 15 000 + 900 × 10 = 24 000 ; 15 000 + 900 × 20 = 33 000 ; 15 000 + 900 × 30 = 42
    000. Drissa : 1 500 × 10 = 15 000 ; 1 500 × 20 = 30 000 ; 1 500 × 30 = 45 000. Barème (2 pts) : 1
    pt (D) la ligne de Noaga complète ; 1 pt (D) la ligne de Drissa complète. Une ligne avec deux prix
    justes sur trois vaut 0,5 pt.'
  si_echoue: Passage d'un énoncé à un tableau de prix.
