    correction: a) $5x^{4}$ ; b) $14x - 3$ ; c) $x^{2} - x + 1$ ; d) $\frac{5}{2\sqrt{x}}$ ; e) $-\frac{2}{x^{2}}$.
  - numero: 8
    etoiles: 1
    enonce: 'Produits : a) $f\left(x\right) = \left(x + 1\right)\left(x^{2} + 2\right)$ ; b) $g\left(x\right)
      = x\sqrt{x}$ ; c) $h\left(x\right) = \left(2x - 3\right)^{2}$ (écris-le comme un produit).'
    correction: a) $\left(x^{2} + 2\right) + 2x\left(x + 1\right) = 3x^{2} + 2x + 2$. b) $\sqrt{x} + \frac{x}{2\sqrt{x}}
