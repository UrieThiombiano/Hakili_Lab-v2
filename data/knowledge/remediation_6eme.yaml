- niveau: 6eme
  module: 8
  module_titre: Les figures planes usuelles
  pourquoi: 'Tu reconnais un carré, un triangle, un cercle du premier coup d''oeil, mais le vocabulaire
    dérape : cercle pour disque, diamètre pour corde, angles opposés pour angles consécutifs. Ce module
    remet en place les mots exacts, les propriétés et les gestes de construction.'
  diagnostic:
  - question: Dans un triangle, deux angles mesurent $50^{\circ}$ et $60^{\circ}$. Combien mesure le troisième
      ?
    reponse: $180^{\circ} - 110^{\circ} = 70^{\circ}$
  - question: Dans le rectangle ABCD, $AB = 7$ cm et $BC = 4$ cm. Combien mesurent CD et DA ?
    reponse: $CD = 7$ cm, $DA = 4$ cm
  - question: Un cercle a un rayon de 6 cm. Combien mesure son diamètre ?
    reponse: $12$ cm
  - question: 'Vrai ou faux : un triangle équilatéral est aussi isocèle.'
    reponse: vrai
  - question: Comment appelle-t-on un segment dont les deux extrémités sont sur un cercle ?
    reponse: une corde
  lecons:
  - id: 6eme_M08_L1
    numero: '8.1'
    titre: Carré, rectangle, parallélogramme
    retenir:
    - 4 côtés, 4 sommets, 2 diagonales (segments joignant deux sommets opposés).
    - Deux côtés qui se touchent en un sommet sont **consécutifs** ; les deux autres sont **opposés**.
    - '**Parallélogramme** : côtés opposés parallèles deux à deux. Alors côtés opposés **égaux**, angles
      opposés **égaux**, deux angles consécutifs de somme $180^{\circ}$, diagonales **se coupant en leur
      milieu**.'
    - '**Rectangle** : parallélogramme à **quatre angles droits**. Ses diagonales sont en plus **de même
      longueur**.'
    - '**Carré** : rectangle à **quatre côtés égaux**. Tout carré est un rectangle, tout rectangle est
      un parallélogramme.'
    methode:
      titre: Trouver une longueur ou un angle manquant
      etapes:
      - Repère les paires **opposées** dans le nom de la figure.
      - 'Longueur d''un côté : égale à celle de son côté opposé.'
      - 'Angle : égal à son angle opposé, supplémentaire de son angle consécutif.'
      - 'Demi-diagonale : O est le milieu, donc $OA = \frac{AC}{2}$.'
    exemple_resolu: 'Dans le parallélogramme ABCD, $AB = 6$ cm, $\widehat{A} = 65^{\circ}$, les diagonales
      se coupent en O et $AC = 10$ cm. Donne CD, $\widehat{C}$, $\widehat{B}$ et OA.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | [AB] et [CD] sont opposés. | $CD = AB = 6$ cm |

      | A et C sont opposés ; A et B sont consécutifs. | $\widehat{C} = 65^{\circ}$ ; $\widehat{B} = 180^{\circ}
      - 65^{\circ} = 115^{\circ}$ |

      | O est le milieu de [AC]. | $OA = \frac{10}{2} = 5$ cm |

      | **Vérification :** $65 + 115 + 65 + 115 = 360$ ✓ | |


      [SVG: figures/m08_f2.svg]

      *Figure 8.1 : le parallélogramme ABCD, ses diagonales et leur point de croisement O.*'
    erreurs_frequentes:
    - erreur: « dans ABCD, A et B sont opposés donc égaux ».
      correction: A et B sont **consécutifs**, donc supplémentaires. Les angles opposés sont A et C, B
        et D.
    - erreur: croire les diagonales d'un parallélogramme égales ou perpendiculaires.
      correction: elles se coupent seulement **en leur milieu** ; elles ne sont égales que dans le rectangle.
    declic: null
    figures:
    - figures/m08_f2.svg
  - id: 6eme_M08_L2
    numero: '8.2'
    titre: Les quatre natures de triangle
    retenir:
    - '**Quelconque** : trois côtés différents, aucun angle droit.'
    - '**Isocèle** : **deux côtés égaux**. Leur sommet commun est le **sommet principal** ; les deux angles
      de la base sont **égaux**.'
    - '**Équilatéral** : **trois côtés égaux**, donc trois angles de $60^{\circ}$. Il est aussi isocèle.'
    - '**Rectangle** : **un angle droit**. Le côté opposé à l''angle droit est l''**hypoténuse**, le plus
      long.'
    methode:
      titre: Reconnaître la nature d'un triangle
      etapes:
      - 'Longueurs : trois côtés égaux, équilatéral ; deux côtés égaux, isocèle.'
      - 'Angles : un angle de $90^{\circ}$, rectangle.'
      - Si tu ne connais que deux angles, calcule le troisième par $180^{\circ}$ moins leur somme.
      - 'Conclus avec la nature **la plus précise** : « rectangle isocèle » vaut mieux que « rectangle
        ».'
    exemple_resolu: 'Dans ABC, $\widehat{A} = 40^{\circ}$ et $\widehat{B} = 70^{\circ}$. Donne sa nature.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On retranche les deux angles connus de $180^{\circ}$. | $\widehat{C} = 180^{\circ} - 110^{\circ}
      = 70^{\circ}$ |

      | $\widehat{B} = \widehat{C}$, donc la base est [BC]. | Le triangle est **isocèle en A**. |

      | **Vérification :** $40 + 70 + 70 = 180$ ✓ | |'
    erreurs_frequentes:
    - erreur: « un triangle rectangle n'est jamais isocèle ».
      correction: 's''il a deux côtés de l''angle droit égaux, ses deux autres angles valent $45^{\circ}$
        : il est rectangle **et** isocèle.'
    - erreur: « isocèle, donc trois angles égaux ».
      correction: isocèle donne **deux** angles égaux, ceux de la base. Trois angles égaux, c'est l'équilatéral.
    declic: null
    figures:
    - figures/m08_f3.svg
  - id: 6eme_M08_L3
    numero: '8.3'
    titre: Le cercle et le disque
    retenir:
    - 'Le **cercle** $C\left(O, r\right)$ est l''ensemble des points M tels que $OM = r$ : **le trait**
      seul.'
    - 'Le **disque** est l''ensemble des points M tels que $OM$ soit inférieur ou égal à $r$ : **la surface**,
      trait et intérieur.'
    - '**Rayon** : du centre à un point du cercle. **Corde** : d''un point du cercle à un autre. **Diamètre**
      : corde **passant par le centre**, la plus longue de toutes.'
    - '**Arc** : portion de cercle comprise entre deux de ses points.'
    methode:
      titre: Situer un point par rapport à $C\left(O, r\right)$
      etapes:
      - Relève la distance $OM$.
      - Compare $OM$ et $r$.
      - '$OM = r$ : **sur** le cercle ; $OM < r$ : **à l''intérieur** ; $OM > r$ : **à l''extérieur**.'
      - Intérieur et trait appartiennent au **disque** ; seul le trait appartient au **cercle**.
    exemple_resolu: 'Rakieta trace $C\left(O, 4 \text{ cm}\right)$ et place P avec $OP = 4$ cm, Q avec
      $OQ = 2{,}5$ cm, R avec $OR = 6$ cm. Situe-les, puis donne le diamètre.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On compare chaque distance au rayon. | $OP = 4 = r$ : P **sur** le cercle |

      | | $2{,}5 < 4$ : Q **dedans** ; $6 > 4$ : R **dehors** |

      | Le diamètre vaut deux fois le rayon. | $d = 2 \times 4 = 8$ cm |

      | **Vérification :** P et Q sont dans le disque, R non. ✓ | |'
    erreurs_frequentes:
    - erreur: « le centre appartient au cercle ».
      correction: $OO = 0$, et $0$ n'est pas le rayon. Le centre appartient au **disque**, jamais au cercle.
    - erreur: appeler « diamètre » toute corde un peu longue.
      correction: une corde n'est un diamètre que si elle **passe par le centre**.
    declic: 'Reporter une longueur au compas — Si tes arcs ne se coupent jamais là où il faut, le blocage
      n''est pas dans le cercle : il est dans le maniement du compas. Ouvrir à la règle, pointer sans
      glisser, tracer un arc large. Reprends le module 7, partie report de longueur, puis reviens ici.'
    figures:
    - figures/m08_f4.svg
  - id: 6eme_M08_L4
    numero: '8.4'
    titre: Construire et décrire une figure
    retenir:
    - '**Trois côtés** : un côté à la règle, puis deux arcs au compas.'
    - '**Deux côtés et l''angle entre eux** : un côté, l''angle au rapporteur, la seconde longueur sur
      la demi-droite.'
    - '**Un côté et ses deux angles** : le côté, puis un angle à chaque extrémité.'
    methode:
      titre: Construire un triangle dont on connaît les trois côtés
      etapes:
      - Croquis à main levée ; repère le plus long côté.
      - Trace ce plus long côté en vraie grandeur et nomme ses extrémités.
      - Compas ouvert au deuxième côté depuis une extrémité, puis au troisième depuis l'autre.
      - Nomme l'intersection des arcs, relie, code la figure.
    exemple_resolu: 'Construis ABC tel que $AB = 6$ cm, $AC = 5$ cm, $BC = 4$ cm.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On compare le plus grand côté à la somme des deux autres. | $5 + 4 = 9 > 6$ : possible |

      | On trace le plus long côté. | $\left[AB\right]$, $AB = 6$ cm |

      | Deux arcs se coupent en C. | arc de centre A, rayon 5 cm ; arc de centre B, rayon 4 cm |

      | **Vérification :** on mesure $AC = 5$ cm et $BC = 4$ cm. ✓ | |'
    erreurs_frequentes:
    - erreur: commencer par un petit côté et se retrouver avec des arcs qui ne se coupent pas.
      correction: trace toujours le **plus grand** côté en premier.
    - erreur: reporter en B un angle donné en A.
      correction: l'angle se reporte **au sommet nommé dans l'énoncé**. Relis la lettre avant de poser
        le rapporteur.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Combien de côtés possède un quadrilatère ? Combien de sommets ? Combien de diagonales ?
    correction: 4 côtés, 4 sommets, 2 diagonales.
  - numero: 2
    etoiles: 1
    enonce: 'Recopie et complète : un parallélogramme est un … dont les … sont parallèles deux à deux.'
    correction: Un **quadrilatère** dont les **côtés opposés** sont parallèles deux à deux.
  - numero: 3
    etoiles: 1
    enonce: BOTE est un parallélogramme. a) Nomme deux côtés consécutifs. b) Nomme deux côtés opposés.
      c) Nomme les deux diagonales.
    correction: Côtés [BO], [OT], [TE], [EB]. a) [BO] et [OT] (sommet O commun). b) [BO] et [TE]. c) [BT]
      et [OE].
  - numero: 4
    etoiles: 1
    enonce: ABCD est un parallélogramme. Parmi [AC], [BD], [AB] et [CD], lesquels sont des diagonales
      ? Lesquels sont des côtés ?
    correction: 'Diagonales : [AC] et [BD]. Côtés : [AB] et [CD].'
  - numero: 5
    etoiles: 1
    enonce: Dans le parallélogramme MNPQ, $MN = 6$ cm et $NP = 9$ cm. Donne PQ et QM.
    correction: $PQ = MN = 6$ cm ; $QM = NP = 9$ cm.
  - numero: 6
    etoiles: 1
    enonce: Dans le parallélogramme ABCD, $\widehat{B} = 110^{\circ}$. Donne $\widehat{D}$, puis $\widehat{A}$.
    correction: $\widehat{D} = \widehat{B} = 110^{\circ}$ (opposés) ; $\widehat{A} = 180^{\circ} - 110^{\circ}
      = 70^{\circ}$ (consécutif).
  - numero: 7
    etoiles: 1
    enonce: Vrai ou faux ? a) Un parallélogramme a quatre côtés. b) Ses côtés opposés sont parallèles.
      c) Tous ses angles sont droits.
    correction: 'a) Vrai. b) Vrai. c) Faux : seulement pour le rectangle et le carré.'
  - numero: 8
    etoiles: 1
    enonce: 'Donne la nature du triangle : a) trois côtés de 4 cm ; b) côtés de 5 cm, 5 cm et 8 cm ; c)
      un angle de $90^{\circ}$.'
    correction: a) Équilatéral. b) Isocèle, de base 8 cm. c) Rectangle.
  - numero: 9
    etoiles: 1
    enonce: Vrai ou faux ? a) Un triangle équilatéral a trois angles de $60^{\circ}$. b) Un triangle isocèle
      possède deux angles droits. c) Un triangle rectangle peut être isocèle.
    correction: 'a) Vrai : $180^{\circ} \div 3 = 60^{\circ}$. b) Faux : deux angles droits font déjà $180^{\circ}$.
      c) Vrai : deux angles de $45^{\circ}$.'
  - numero: 10
    etoiles: 1
    enonce: Vrai ou faux ? a) Un triangle isocèle est toujours équilatéral. b) Un triangle équilatéral
      est toujours isocèle. c) Un triangle rectangle a un angle droit. d) Un triangle rectangle n'est
      jamais isocèle.
    correction: 'a) Faux. b) Vrai : trois côtés égaux, donc deux en particulier. c) Vrai. d) Faux.'
  - numero: 11
    etoiles: 1
    enonce: Dans ABC, $\widehat{A} = 40^{\circ}$ et $\widehat{B} = 75^{\circ}$. a) Calcule $\widehat{C}$.
      b) Donne la nature du triangle.
    correction: 'a) $\widehat{C} = 180^{\circ} - 115^{\circ} = 65^{\circ}$. b) Trois angles différents,
      aucun droit : **quelconque**.'
  - numero: 12
    etoiles: 1
    enonce: A Boussé, un panneau a la forme d'un triangle dont les trois côtés mesurent 60 cm. a) Quelle
      est sa nature ? b) Combien mesure chaque angle ?
    correction: a) Équilatéral. b) $180^{\circ} \div 3 = 60^{\circ}$ chacun.
  - numero: 13
    etoiles: 1
    enonce: Soit $C\left(O, 3 \text{ cm}\right)$. a) Quel est le diamètre ? b) Cite la relation entre
      diamètre et rayon.
    correction: a) $d = 2 \times 3 = 6$ cm. b) $d = 2 \times r$, soit $r = \frac{d}{2}$.
  - numero: 14
    etoiles: 1
    enonce: 'Comment appelle-t-on : a) l''ensemble des points M tels que $OM = 3$ cm ? b) l''ensemble
      des points M tels que $OM$ est inférieur ou égal à 3 cm ?'
    correction: a) Le **cercle** $C\left(O, 3 \text{ cm}\right)$. b) Le **disque** de centre O et de rayon
      3 cm.
  - numero: 15
    etoiles: 1
    enonce: 'Recopie et complète : [AO] est un … du cercle ; [BM], qui relie deux points du cercle, est
      une … ; si elle passe par O, c''est un … .'
    correction: '[AO] : un **rayon**. [BM] : une **corde**. Passant par O : un **diamètre**.'
  - numero: 16
    etoiles: 1
    enonce: Trace $C\left(O, 5 \text{ cm}\right)$ et place A, B, C, D, E tels que $OA = 5$ cm, $OB = 4$
      cm, $OC = 3{,}5$ cm, $OD = 7$ cm, $OE = 6$ cm. Pour chacun, dis s'il est sur, dans ou hors du cercle.
    correction: $r = 5$ cm. A sur ; B dans ($4 < 5$) ; C dans ($3{,}5 < 5$) ; D hors ($7 > 5$) ; E hors
      ($6 > 5$).
  - numero: 17
    etoiles: 1
    enonce: Un cercle a un diamètre de 14 cm. a) Quel est son rayon ? b) Une corde peut-elle mesurer 15
      cm ? Justifie.
    correction: 'a) $r = \frac{14}{2} = 7$ cm. b) Non : le diamètre, 14 cm, est la plus longue corde.'
  - numero: 18
    etoiles: 1
    enonce: 'Construis le triangle ABC tel que $AB = 5$ cm, $AC = 6$ cm et $BC = 4$ cm.


      ### Entraînement ★★'
    correction: '$5 + 4 = 9 > 6$ : possible. On trace [AC] de 6 cm, un arc de centre A et de rayon 5 cm,
      un arc de centre C et de rayon 4 cm ; ils se coupent en B.'
  - numero: 19
    etoiles: 2
    enonce: Construis le triangle TWO tel que $TW = WO = 7$ cm et $TO = 4$ cm. Quelle est sa nature ?
      Justifie.
    correction: '[TO] de 4 cm, puis deux arcs de 7 cm de centres T et O ; ils se coupent en W. $TW = WO$
      : triangle **isocèle en W**.'
  - numero: 20
    etoiles: 2
    enonce: Construis le triangle OUF tel que $OU = 8$ cm, $UF = 7$ cm et $FO = 6$ cm. Mesure ses trois
      angles au rapporteur et calcule leur somme.
    correction: '$7 + 6 = 13 > 8$ : possible. On trace [OU] de 8 cm, arc de 7 cm de centre U, arc de 6
      cm de centre O. Au rapporteur, environ $60^{\circ}$, $46^{\circ}$ et $74^{\circ}$ : somme $180^{\circ}$
      aux erreurs de mesure près.'
  - numero: 21
    etoiles: 2
    enonce: Construis le parallélogramme PQRS tel que $PQ = 7$ cm, $PS = 5$ cm et $\widehat{P} = 75^{\circ}$.
      Trace les diagonales et nomme leur point d'intersection.
    correction: '[PQ] de 7 cm ; en P, angle de $75^{\circ}$ et $PS = 5$ cm ; parallèle à (PQ) par S et
      parallèle à (PS) par Q se coupent en R. Les diagonales [PR] et [QS] se coupent en O, milieu de chacune.'
  - numero: 22
    etoiles: 2
    enonce: 'Peut-on construire un triangle de côtés : a) 4 cm, 5 cm, 6 cm ? b) 2 cm, 3 cm, 6 cm ? c)
      5 cm, 5 cm, 9 cm ? Justifie chaque réponse.'
    correction: 'a) $4 + 5 = 9 > 6$ : constructible. b) $2 + 3 = 5 < 6$ : impossible. c) $5 + 5 = 10 >
      9$ : constructible, très aplati.'
  - numero: 23
    etoiles: 2
    enonce: Le quadrilatère TUVW porte un simple chevron sur [TU] et [WV], un double chevron sur [UV]
      et [TW]. a) Que signifie ce codage ? b) Quelle est la nature de TUVW ? Justifie.
    correction: 'a) Les chevrons codent le parallélisme : [TU] // [WV] et [UV] // [TW]. b) Les deux paires
      de côtés opposés sont parallèles : **parallélogramme**.'
  - numero: 24
    etoiles: 2
    enonce: Vrai ou faux ? Justifie. a) Les diagonales d'un parallélogramme se coupent en leur milieu.
      b) Elles sont toujours perpendiculaires. c) Les angles opposés sont égaux. d) Deux angles consécutifs
      ont pour somme $90^{\circ}$.
    correction: 'a) Vrai, propriété du parallélogramme. b) Faux : seulement pour le losange et le carré.
      c) Vrai. d) Faux : leur somme vaut $180^{\circ}$.'
  - numero: 25
    etoiles: 2
    enonce: Vrai ou faux ? Justifie. a) Le centre d'un cercle appartient au cercle. b) Une corde passe
      seulement par le centre. c) Le centre d'un disque appartient au disque. d) Si $OM = 4$ cm et $r
      = 5$ cm, alors M est à l'extérieur.
    correction: 'a) Faux : $OO = 0$, différent de $r$. b) Faux : une corde joint deux points du cercle,
      qu''elle passe ou non par O. c) Vrai : $0$ est inférieur à $r$. d) Faux : $4 < 5$, donc M est à
      l''intérieur.'
  - numero: 26
    etoiles: 2
    enonce: 'Trouve l''erreur. Un élève affirme : « mon triangle a un angle de $100^{\circ}$ et un angle
      de $95^{\circ}$ ». Explique par un calcul pourquoi c''est impossible.'
    correction: '$100^{\circ} + 95^{\circ} = 195^{\circ} > 180^{\circ}$. Il faudrait un troisième angle
      négatif : impossible. Un triangle n''a qu''un seul angle obtus.'
  - numero: 27
    etoiles: 2
    enonce: 'Trouve l''erreur. Boukary trace $C\left(O, 3 \text{ cm}\right)$ puis place T à 3 cm de O.
      Il écrit : « T est dans le disque, donc T n''est pas sur le cercle. » Où est l''erreur ? Donne la
      bonne conclusion.'
    correction: '$OT = 3 = r$, donc T est **sur le cercle**. Le disque contient le cercle : T appartient
      aux deux. Être dans le disque n''exclut pas être sur le cercle.'
  - numero: 28
    etoiles: 2
    enonce: Trace $C\left(O, 4 \text{ cm}\right)$ et deux diamètres [AB] et [CD] perpendiculaires. Quelle
      est la nature du quadrilatère ACBD ? Rédige en trois lignes le programme de construction de cette
      figure.
    correction: '[AB] et [CD] mesurent 8 cm et se coupent en leur milieu O, à angle droit : ACBD est un
      **carré**. Programme : 1. Trace $C\left(O, 4 \text{ cm}\right)$. 2. Trace un diamètre [AB]. 3. Trace
      le diamètre [CD] perpendiculaire à [AB] en O, puis relie A, C, B, D.'
  - numero: 29
    etoiles: 2
    enonce: 'Construis le triangle SVT tel que $SV = 5$ cm, $ST = 6$ cm et $VT = 4$ cm. Place D tel que
      SVTD soit un parallélogramme. Décris ta méthode.


      ### ★★★ Défis de maîtrise'
    correction: '[ST] de 6 cm, arc de 5 cm de centre S, arc de 4 cm de centre T : V. Pour D, on trace
      la parallèle à (SV) par T et la parallèle à (VT) par S. Contrôle : $TD = SV = 5$ cm et $SD = VT
      = 4$ cm.'
  - numero: 30
    etoiles: 3
    enonce: ABC est isocèle en A et $\widehat{B} = 70^{\circ}$. a) Retrouve $\widehat{A}$. b) Pour que
      ce triangle devienne équilatéral, combien devrait mesurer l'angle de la base ? c) Awa affirme qu'un
      triangle isocèle dont l'angle au sommet principal mesure $100^{\circ}$ n'existe pas. A-t-elle raison
      ? Justifie par un calcul.
    correction: 'Isocèle en A : les angles égaux sont ceux de la base, B et C. a) $\widehat{A} = 180^{\circ}
      - 140^{\circ} = 40^{\circ}$. b) $60^{\circ}$. c) Si le sommet vaut $100^{\circ}$, il reste $80^{\circ}$
      à partager : $40^{\circ}$ et $40^{\circ}$. Somme $180^{\circ}$, angles tous positifs : le triangle
      existe, **Awa a tort**.'
  - numero: 31
    etoiles: 3
    enonce: Prouve par une propriété, ou contredis par une figure. a) Tout carré est un rectangle. b)
      Tout rectangle est un carré. c) Un triangle qui a deux angles de $60^{\circ}$ est équilatéral. d)
      Une corde qui mesure autant que le rayon est un diamètre.
    correction: 'On cherche une propriété qui garantit, ou une figure qui met en défaut. a) Vrai : quatre
      angles droits et côtés opposés parallèles, c''est la définition du rectangle. b) Faux : le rectangle
      5 cm sur 3 cm est un contre-exemple. c) Vrai : le troisième angle vaut $180^{\circ} - 120^{\circ}
      = 60^{\circ}$. d) Faux : un diamètre vaut $2 \times r$, pas $r$.'
  - numero: 32
    etoiles: 3
    enonce: Trouve l'erreur. Pour construire le parallélogramme ABCD avec $AB = 6$ cm, $AD = 4$ cm et
      $\widehat{A} = 70^{\circ}$, un élève trace [AB] puis reporte l'angle de $70^{\circ}$ **en B**. a)
      Pourquoi sa figure n'est-elle pas celle qu'on demande ? b) Décris les trois étapes correctes.
    correction: 'L''angle imposé est **en A**, entre [AB] et [AD]. a) En le reportant en B, l''élève obtient
      $\widehat{B} = 70^{\circ}$, donc $\widehat{A} = 110^{\circ}$ : ce n''est pas la figure demandée.
      b) 1. [AB] de 6 cm. 2. En A, angle de $70^{\circ}$ et $AD = 4$ cm. 3. Parallèle à (AB) par D et
      parallèle à (AD) par B : elles se coupent en C.'
  - numero: 33
    etoiles: 3
    enonce: A et B sont deux points quelconques d'un cercle de centre O. a) Montre que le triangle OAB
      est **toujours** isocèle. b) Que se passe-t-il si $AB$ vaut le rayon ? c) Que devient OAB si [AB]
      est un diamètre ?
    correction: 'On part de la définition du cercle : tout point est à la distance $r$ de O. a) $OA =
      OB = r$ : deux côtés égaux, donc **isocèle en O**, quel que soit le choix de A et B. b) Si $AB =
      r$, les trois côtés valent $r$ : **équilatéral**, trois angles de $60^{\circ}$. c) Si [AB] est un
      diamètre, O est sur [AB] : A, O, B sont alignés, il n''y a plus de triangle.'
  - numero: 34
    etoiles: 3
    enonce: Sur un cercle de centre O et de rayon 4 cm, Issouf place six points A, B, C, D, E, F régulièrement
      espacés. a) Combien de segments peut-on tracer en les joignant deux à deux ? b) Combien sont des
      diamètres ? c) Quelle est la nature du triangle OAB ? Justifie.
    correction: 'a) $5 + 4 + 3 + 2 + 1 = 15$ segments. b) Les six points s''apparient en 3 couples opposés
      : **3 diamètres**. c) $\widehat{AOB} = 360^{\circ} \div 6 = 60^{\circ}$ ; OAB est isocèle en O car
      $OA = OB = 4$ cm, donc ses angles de base valent $\left(180^{\circ} - 60^{\circ}\right) \div 2 =
      60^{\circ}$ : il est **équilatéral** et $AB = 4$ cm.'
  - numero: 35
    etoiles: 3
    enonce: 'Talato dicte : « Trace [AB] de 8 cm. Place le milieu O de [AB]. Trace le cercle de centre
      O passant par A. Place sur ce cercle un point C tel que $AC = 4$ cm. Trace le triangle ABC. » a)
      Réalise la figure. b) Quelle est la nature du triangle AOC ? Justifie. c) Son camarade dit le programme
      incomplet car C a deux positions possibles. A-t-il raison ? Corrige la phrase.'
    correction: 'On suit le programme dans l''ordre. a) [AB] de 8 cm, O milieu, cercle de rayon 4 cm,
      C sur ce cercle avec $AC = 4$ cm (arc de centre A et de rayon 4 cm). b) $OA = OC = AC = 4$ cm :
      triangle **équilatéral**, trois angles de $60^{\circ}$. c) Oui, il a raison : l''arc coupe le cercle
      des deux côtés de (AB). Il faut préciser « un point C situé au-dessus de la droite (AB) ».'
  - numero: 36
    etoiles: 3
    enonce: 'Mariam décrit un motif sans le montrer : un carré ABCD de 6 cm de côté ; à l''intérieur,
      le cercle de centre le point de croisement des diagonales et de rayon 3 cm ; sur chaque côté, un
      triangle équilatéral tracé vers l''extérieur. a) Rédige le programme de construction numéroté, avec
      toutes les mesures. b) Quelle est la longueur du côté de chaque triangle équilatéral ? c) Le cercle
      touche-t-il les côtés du carré ou les coupe-t-il ? Justifie par une comparaison de longueurs.'
    correction: 'On décrit dans l''ordre où l''on trace. a) 1. Trace le carré ABCD de 6 cm de côté. 2.
      Trace les diagonales [AC] et [BD] ; nomme O leur intersection. 3. Trace le cercle de centre O et
      de rayon 3 cm. 4. Sur [AB], à l''extérieur, trace deux arcs de 6 cm de centres A et B : leur intersection
      est le troisième sommet. 5. Recommence sur [BC], [CD] et [DA]. b) Chaque triangle a pour base un
      côté du carré : côté $6$ cm. c) O est le centre du carré, à $6 \div 2 = 3$ cm de chaque côté, soit
      exactement le rayon : le cercle **touche** chaque côté en son milieu sans le traverser.'
  fiche_revision:
  - '**Familles emboîtées.** Parallélogramme : côtés opposés parallèles et égaux, angles opposés égaux,
    diagonales se coupant en leur milieu. Rectangle : parallélogramme à quatre angles droits, diagonales
    égales. Carré : rectangle à quatre côtés égaux.'
  - '**Angles consécutifs.** Deux angles consécutifs d''un parallélogramme sont supplémentaires : somme
    $180^{\circ}$.'
  - '**Triangles.** Isocèle : deux côtés égaux, deux angles de base égaux. Équilatéral : trois côtés égaux,
    trois angles de $60^{\circ}$, donc aussi isocèle. Rectangle : un angle droit, hypoténuse opposée.
    Toujours $\widehat{A} + \widehat{B} + \widehat{C} = 180^{\circ}$.'
  - '**Cercle et disque.** Cercle : le trait, $OM = r$. Disque : la surface, $OM$ inférieur ou égal à
    $r$. Diamètre : corde passant par le centre, $d = 2 \times r$, la plus longue corde.'
  - '**Construire.** Un triangle existe si le plus grand côté est plus court que la somme des deux autres.
    On commence toujours par le plus grand côté.'
  - '**Décrire.** Un programme est numéroté, ordonné, complet en mesures, et ne laisse qu''une figure
    possible.'
  trouve_erreur:
  - faux: « Dans ABCD, $\widehat{A} = 60^{\circ}$ donc $\widehat{B} = 60^{\circ}$. »
    correction: 'A et B sont consécutifs : $\widehat{B} = 120^{\circ}$. C''est $\widehat{C}$ qui vaut
      $60^{\circ}$.'
  - faux: « Ce triangle est isocèle, donc ses trois angles sont égaux. »
    correction: Isocèle donne **deux** angles égaux. Trois angles de $60^{\circ}$, c'est l'équilatéral.
  - faux: « Le rayon vaut le double du diamètre. »
    correction: 'C''est l''inverse : $d = 2 \times r$. Pour $r = 6$ cm, $d = 12$ cm.'
  - faux: « Le centre O appartient au cercle. »
    correction: $OO = 0$, différent de $r$. Le centre appartient au **disque**.
  cartographie_lacunes:
  - lacune: Propriétés des figures usuelles non mobilisables
    bloque_en: triangle, parallélogramme, cercle
  source_path: remediation\6eme\modules_c\M08.md
- niveau: 6eme
  module: 9
  module_titre: Périmètres et aires
  pourquoi: 'Le périmètre et l''aire sont deux grandeurs différentes, et les confondre fait répondre en
    mètres quand on attend des mètres carrés. Tu connais ces formules : c''est leur application, et les
    unités, qui dérapent.'
  diagnostic:
  - question: Un carré a $7$ cm de côté. Quel est son périmètre ?
    reponse: $4 \times 7 = 28$ cm
  - question: Un rectangle mesure $9$ cm sur $4$ cm. Quelle est son aire ? Précise l'unité.
    reponse: $36$ cm$^{2}$
  - question: Combien vaut $1 m^{2}$ en cm$^{2}$ ?
    reponse: $10\,000$ cm$^{2}$
  - question: Périmètre d'un cercle de rayon $5$ cm $\left(\pi \approx 3{,}14\right)$ ?
    reponse: $2 \times 3{,}14 \times 5 = 31{,}4$ cm
  - question: Pour poser un grillage autour d'un champ, calcule-t-on le périmètre ou l'aire ?
    reponse: le périmètre
  lecons:
  - id: 6eme_M09_L1
    numero: '9.1'
    titre: 'Le périmètre : la longueur du tour'
    retenir:
    - 'Le **périmètre** est la longueur du contour. Toujours en **unité de longueur** : mm, cm, m, km.'
    - '**Polygone :** on additionne tous les côtés.'
    - 'Carré de côté $c$, rectangle de dimensions $L$ et $l$ :'
    - 'Cercle de rayon $r$, de diamètre $d$, avec $\pi \approx 3{,}14$ :'
    - 'Demi-cercle : la moitié. Quart de cercle : le quart.'
    methode:
      titre: Calculer un périmètre
      etapes:
      - Note tous les côtés, **dans la même unité**.
      - 'Choisis l''outil : addition pour un polygone, formule pour carré, rectangle ou cercle.'
      - Pose le calcul, écris l'**unité de longueur**.
      - 'Contrôle : le tour d''un cercle vaut un peu plus de trois diamètres.'
    exemple_resolu: 'Issouf clôture un enclos rectangulaire de $18$ m sur $12$ m.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le grillage suit le tour. | $P = 2 \times \left(L + l\right)$ |

      | J''additionne, puis je double. | $P = 2 \times \left(18 + 12\right) = 2 \times 30$ |

      | Je conclus en unité de longueur. | $P = 60$ m de grillage |

      | **Vérification :** $18 + 12 + 18 + 12 = 60$ ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $P = L + l$ pour un rectangle.
      correction: deux longueurs et deux largeurs, donc $P = 2 \times \left(L + l\right)$, soit $60$ m
        et non $30$ m.
    - erreur: remplacer $r$ par le diamètre dans $2 \times \pi \times r$.
      correction: si l'énoncé donne $d$, utilise $P = \pi \times d$.
    declic: null
    figures: []
  - id: 6eme_M09_L2
    numero: '9.2'
    titre: 'L''aire : la surface, comptée en carrés'
    retenir:
    - L'**aire** est la mesure de la surface occupée. Le carré de $1$ cm de côté a une aire de $1$ cm$^{2}$.
    - '**Paver**, c''est recouvrir sans trou ni chevauchement : l''aire est le nombre de carrés.'
    - 'Carré de côté $c$, rectangle de dimensions $L$ et $l$ (même unité) :'
    - 'Une aire s''écrit **toujours** en unité carrée : cm$^{2}$, $m^{2}$, km$^{2}$.'
    methode:
      titre: Calculer une aire par découpage
      etapes:
      - Trace les traits qui partagent la figure en rectangles, carrés ou triangles rectangles.
      - Note les dimensions de chaque morceau, en déduisant celles qui manquent.
      - Calcule l'aire de chaque morceau.
      - Additionne (ou soustrais la partie retirée), avec l'unité carrée.
    exemple_resolu: 'La cour a la forme d''un L : un rectangle de $9$ m sur $6$ m prolongé par un rectangle
      de $4$ m sur $3$ m.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Je découpe en deux rectangles. | $A_{1} = 9 \times 6 = 54$ $m^{2}$ |

      | Je calcule le second. | $A_{2} = 4 \times 3 = 12$ $m^{2}$ |

      | J''additionne. | $A = 54 + 12 = 66$ $m^{2}$ |

      | **Vérification :** la cour tient dans $9 \times 9 = 81 m^{2}$, et $66 < 81$ ✓ | |'
    erreurs_frequentes:
    - erreur: oublier de diviser par $2$ dans le triangle rectangle.
      correction: $6 \times 4 = 24$ cm$^{2}$ est l'aire du rectangle ; le triangle vaut $12$ cm$^{2}$.
    - erreur: multiplier $6 \text{ m} \times 80 \text{ cm}$.
      correction: convertis d'abord, $80$ cm $= 0{,}8$ m, puis $6 \times 0{,}8 = 4{,}8$ $m^{2}$.
    declic: null
    figures:
    - figures/m09_f3.svg
    - figures/m09_f4.svg
  - id: 6eme_M09_L3
    numero: '9.3'
    titre: Les unités d'aire et leurs conversions
    retenir:
    - Vers l'unité suivante plus petite, on **multiplie par $100$** ; vers la plus grande, on **divise
      par $100$**.
    - Dans le tableau, chaque unité d'aire occupe **deux colonnes**, et non une seule.
    - '|---|---|---|---|---|---|---|---|---|---|---|---|'
    - 'Ligne lue : $3{,}5$ $m^{2} = 35\,000$ cm$^{2}$.'
    - 'Terrains : $1$ a $= 100 m^{2}$ et $1$ ha $= 100$ a $= 10\,000 m^{2}$.'
    methode:
      titre: Convertir une aire
      etapes:
      - Écris le chiffre des unités dans la colonne de **droite** de son unité.
      - Place les autres chiffres, un par colonne.
      - Complète par des zéros jusqu'à la colonne de droite de l'unité demandée.
      - 'Contrôle : vers une unité plus petite, le nombre grandit.'
    exemple_resolu: 'Convertis $3{,}5$ $m^{2}$ en cm$^{2}$, puis $45\,000$ cm$^{2}$ en $m^{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Du $m^{2}$ au cm$^{2}$ : deux sauts vers le bas. | $\times 100$ puis $\times 100$, soit $\times
      10\,000$ |

      | Je multiplie. | $3{,}5 \times 10\,000 = 35\,000$ cm$^{2}$ |

      | Du cm$^{2}$ au $m^{2}$ : deux sauts vers le haut. | $45\,000 \div 10\,000 = 4{,}5$ $m^{2}$ |

      | **Vérification :** l''unité est plus grande, le nombre est plus petit ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $1 m^{2} = 100$ cm$^{2}$.
      correction: $1 m^{2} = 10\,000$ cm$^{2}$.
    - erreur: annoncer un terrain de $600$ m au lieu de $600 m^{2}$.
      correction: une surface se dit en unités carrées.
    declic: Pourquoi 100 et pas 10 ? — Écrire $1 m^{2} = 100$ cm$^{2}$, c'est appliquer aux aires la règle
      des longueurs. Une unité d'aire occupe **deux** colonnes, pas une. D'où le facteur $100$ à chaque
      saut, et $10\,000$ du $m^{2}$ au cm$^{2}$.
    figures: []
  - id: 6eme_M09_L4
    numero: '9.4'
    titre: Périmètre ou aire ? Choisir dans un problème
    retenir:
    - '**Périmètre** quand on suit le contour : clôturer, grillager, border, entourer, poser des poteaux,
      coudre un ruban. Résultat en **m**.'
    - '**Aire** quand on couvre la surface : carreler, peindre, semer, labourer, recouvrir. Résultat en
      **$m^{2}$**.'
    - Même périmètre ne veut pas dire même aire, et réciproquement. À tour égal, la figure la plus proche
      du carré contient le plus de surface.
    - Un périmètre et une aire ne s'additionnent jamais.
    methode:
      titre: Décider entre périmètre et aire
      etapes:
      - 'Souligne le mot qui dit ce que l''on fait : entourer, ou recouvrir.'
      - 'Bord : périmètre. Intérieur : aire.'
      - 'Écris l''unité attendue **avant** de calculer : m ou $m^{2}$.'
      - Vérifie que le résultat porte cette unité.
    exemple_resolu: 'À Kaya, une cour carrée de $30$ m de côté : on la grillage, puis on couvre le sol
      de sable.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le grillage suit le bord : périmètre. | $P = 4 \times 30 = 120$ m |

      | Le sable couvre le sol : aire. | $A = 30 \times 30 = 900$ $m^{2}$ |

      | Chaque résultat garde son unité. | $120$ m de grillage, $900$ $m^{2}$ à couvrir |

      | **Vérification :** une longueur et une surface ne se mélangent pas ✓ | |'
    erreurs_frequentes:
    - erreur: « la cour mesure $900$ m ».
      correction: $900$ $m^{2}$ ; $900$ m serait une longueur.
    - erreur: additionner périmètre et aire.
      correction: deux grandeurs différentes, deux réponses séparées.
    declic: null
    figures:
    - figures/m09_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Calcule le périmètre d'un trapèze dont les côtés mesurent $8$ cm, $12$ cm, $15$ cm et $15$
      cm.
    correction: $P = 8 + 12 + 15 + 15 = 50$ cm.
  - numero: 2
    etoiles: 1
    enonce: Un rectangle ABCD est tel que $BC = 4$ cm et AB est le triple de BC. Calcule son périmètre.
    correction: $AB = 3 \times 4 = 12$ cm ; $P = 2 \times \left(12 + 4\right) = 32$ cm.
  - numero: 3
    etoiles: 1
    enonce: Avec un fil de $32$ cm, Chahaf fait le contour d'un quadrilatère à quatre côtés égaux. Quelle
      est la longueur d'un côté ?
    correction: $32 \div 4 = 8$ cm par côté.
  - numero: 4
    etoiles: 1
    enonce: Un jardin triangulaire a des côtés de $12$ m, $9$ m et $15$ m. Calcule son périmètre.
    correction: $P = 12 + 9 + 15 = 36$ m.
  - numero: 5
    etoiles: 1
    enonce: Combien mesure le côté d'un carré de périmètre $430$ m ?
    correction: $430 \div 4 = 107{,}5$ m.
  - numero: 6
    etoiles: 1
    enonce: Calcule le périmètre d'un cercle de diamètre $10$ cm $\left(\pi \approx 3{,}14\right)$.
    correction: 'Diamètre donné : $P = 3{,}14 \times 10 = 31{,}4$ cm.'
  - numero: 7
    etoiles: 1
    enonce: Calcule le périmètre d'un cercle de rayon $3$ cm.
    correction: $P = 2 \times 3{,}14 \times 3 = 18{,}84$ cm.
  - numero: 8
    etoiles: 1
    enonce: Calcule la circonférence d'une roue de vélo de diamètre $60$ cm.
    correction: $P = 3{,}14 \times 60 = 188{,}4$ cm.
  - numero: 9
    etoiles: 1
    enonce: Calcule a) la longueur d'un demi-cercle de rayon $10$ cm ; b) celle d'un quart de cercle de
      rayon $8$ cm.
    correction: a) $\left(2 \times 3{,}14 \times 10\right) \div 2 = 31{,}4$ cm. b) $\left(2 \times 3{,}14
      \times 8\right) \div 4 = 12{,}56$ cm.
  - numero: 10
    etoiles: 1
    enonce: Le tour d'un tam-tam mesure $94{,}2$ cm. a) Calcule son diamètre. b) Calcule son rayon.
    correction: a) $d = 94{,}2 \div 3{,}14 = 30$ cm. b) $r = 15$ cm.
  - numero: 11
    etoiles: 1
    enonce: Calcule le périmètre et l'aire d'un rectangle de $12$ cm sur $8$ cm.
    correction: $P = 2 \times \left(12 + 8\right) = 40$ cm ; $A = 12 \times 8 = 96$ cm$^{2}$. Deux unités
      différentes.
  - numero: 12
    etoiles: 1
    enonce: Calcule a) l'aire d'un carré de $10$ cm de côté ; b) l'aire d'un rectangle de $4$ cm sur $3$
      cm ; c) l'aire d'un carré de $5$ cm de côté.
    correction: a) $100$ cm$^{2}$. b) $12$ cm$^{2}$. c) $25$ cm$^{2}$.
  - numero: 13
    etoiles: 1
    enonce: Un carré a une aire de $9 m^{2}$. Combien mesure son côté ?
    correction: $3 \times 3 = 9$, donc le côté mesure $3$ m.
  - numero: 14
    etoiles: 1
    enonce: 'a) L''aire d''un rectangle est $120 m^{2}$ et sa longueur $15$ m : quelle est sa largeur
      ? b) Un rectangle de $4$ cm de largeur a une aire de $20$ cm$^{2}$ : quelle est sa longueur ?'
    correction: a) $l = 120 \div 15 = 8$ m. b) $L = 20 \div 4 = 5$ cm.
  - numero: 15
    etoiles: 1
    enonce: 'Calcule l''aire d''un triangle rectangle dont les côtés de l''angle droit mesurent : a) $8$
      cm et $5$ cm ; b) $12$ cm et $7$ cm ; c) $6$ cm et $5$ cm.'
    correction: a) $\frac{8 \times 5}{2} = 20$ cm$^{2}$. b) $\frac{12 \times 7}{2} = 42$ cm$^{2}$. c)
      $\frac{6 \times 5}{2} = 15$ cm$^{2}$.
  - numero: 16
    etoiles: 1
    enonce: On quadrille un rectangle de $8$ cm sur $5$ cm en carrés de $1$ cm de côté. a) Combien de
      carrés obtient-on ? b) Quelle est l'aire du rectangle ?
    correction: a) $8 \times 5 = 40$ carrés. b) $A = 40$ cm$^{2}$.
  - numero: 17
    etoiles: 1
    enonce: 'Une cour en L se partage en deux rectangles : $8$ m sur $5$ m, et $3$ m sur $2$ m. a) Calcule
      l''aire de chacun. b) Déduis-en l''aire de la cour.'
    correction: a) $8 \times 5 = 40 m^{2}$ et $3 \times 2 = 6 m^{2}$. b) $40 + 6 = 46 m^{2}$.
  - numero: 18
    etoiles: 1
    enonce: Un pavé a deux faces de $12$ cm$^{2}$, deux de $8$ cm$^{2}$ et deux de $6$ cm$^{2}$. Quelle
      est son aire totale ?
    correction: $A = 2 \times 12 + 2 \times 8 + 2 \times 6 = 52$ cm$^{2}$.
  - numero: 19
    etoiles: 1
    enonce: 'Convertis : a) $4 m^{2}$ en dm$^{2}$ ; b) $2\,500$ cm$^{2}$ en dm$^{2}$ ; c) $3$ ha en $m^{2}$
      ; d) $300$ cm$^{2}$ en dm$^{2}$.'
    correction: a) $400$ dm$^{2}$. b) $25$ dm$^{2}$. c) $30\,000 m^{2}$. d) $3$ dm$^{2}$.
  - numero: 20
    etoiles: 1
    enonce: Une feuille mesure $21$ cm sur $30$ cm. Donne son aire en cm$^{2}$, puis en dm$^{2}$.
    correction: $A = 21 \times 30 = 630$ cm$^{2} = 6{,}3$ dm$^{2}$.
  - numero: 21
    etoiles: 1
    enonce: 'Périmètre ou aire ? a) Acheter du grillage pour une cour. b) Acheter du sable pour la couvrir.
      c) Coudre un ruban autour d''un napperon. d) Peindre un mur.


      ### Entraînement ★★'
    correction: a) Périmètre. b) Aire. c) Périmètre. d) Aire.
  - numero: 22
    etoiles: 2
    enonce: Une face d'un cube a pour aire $36$ cm$^{2}$. a) Quelle est la longueur de son arête ? b)
      Quelle est l'aire totale du cube ?
    correction: a) $6 \times 6 = 36$, arête $= 6$ cm. b) $6 \times 36 = 216$ cm$^{2}$.
  - numero: 23
    etoiles: 2
    enonce: 'Range du plus petit au plus grand : $3\,500$ cm$^{2}$ ; $4$ dm$^{2}$ ; $0{,}5 m^{2}$ ; $1\,200$
      cm$^{2}$.'
    correction: 'En cm$^{2}$ : $400$ ; $1\,200$ ; $3\,500$ ; $5\,000$. Ordre : $4$ dm$^{2}$ ; $1\,200$
      cm$^{2}$ ; $3\,500$ cm$^{2}$ ; $0{,}5 m^{2}$.'
  - numero: 24
    etoiles: 2
    enonce: À Ziniaré, une école clôture une cour carrée d'aire $900 m^{2}$. a) Quel est son côté ? b)
      Quelle longueur de grillage ? c) À $1\,500$ FCFA le mètre, quelle dépense ?
    correction: a) $30 \times 30 = 900$, côté $= 30$ m. b) $P = 120$ m. c) $120 \times 1\,500 = 180\,000$
      FCFA.
  - numero: 25
    etoiles: 2
    enonce: Le grenier à mil des Ouédraogo a une base circulaire de rayon $2$ m. a) Quelle longueur de
      bande de métal pour entourer la base ? b) À $1\,200$ FCFA le mètre, quel coût total ?
    correction: a) $P = 2 \times 3{,}14 \times 2 = 12{,}56$ m. b) $12{,}56 \times 1\,200 = 15\,072$ FCFA.
  - numero: 26
    etoiles: 2
    enonce: Un carreleur couvre un mur carré de $3$ m de côté avec des carreaux de $25$ cm de côté. a)
      Aire du mur ? b) Combien de carreaux par rangée ? c) Combien de rangées et de carreaux au total
      ?
    correction: a) $A = 9 m^{2}$. b) $300 \div 25 = 12$ carreaux par rangée. c) $12$ rangées, soit $144$
      carreaux.
  - numero: 27
    etoiles: 2
    enonce: Un rectangle et un carré ont le même périmètre, $36$ cm. Le rectangle mesure $12$ cm de long.
      a) Sa largeur ? b) Le côté du carré ? c) Compare les deux aires.
    correction: 'a) $L + l = 18$, donc $l = 6$ cm. b) $36 \div 4 = 9$ cm. c) $72$ cm$^{2}$ contre $81$
      cm$^{2}$ : à périmètre égal, le carré l''emporte.'
  - numero: 28
    etoiles: 2
    enonce: Un terrain carré a un périmètre de $180$ m. a) Son côté ? b) Avec un poteau tous les $3$ m,
      combien de poteaux ?
    correction: 'a) $180 \div 4 = 45$ m. b) $180 \div 3 = 60$ poteaux (ligne fermée : autant de poteaux
      que d''intervalles).'
  - numero: 29
    etoiles: 2
    enonce: Un jardinier délimite un parterre circulaire de rayon $3$ m. a) Quelle longueur de bordure
      ? b) Avec une fleur tous les $30$ cm sur le périmètre, combien de fleurs ?
    correction: a) $P = 2 \times 3{,}14 \times 3 = 18{,}84$ m. b) $18{,}84 \div 0{,}30 = 62{,}8$, donc
      $62$ fleurs.
  - numero: 30
    etoiles: 2
    enonce: La roue d'une brouette a un diamètre de $40$ cm. a) Calcule sa circonférence. b) Combien de
      tours pour parcourir $62{,}8$ m ?
    correction: a) $P = 3{,}14 \times 40 = 125{,}6$ cm $= 1{,}256$ m. b) $62{,}8 \div 1{,}256 = 50$ tours.
  - numero: 31
    etoiles: 2
    enonce: 'Deux cercles ont pour rayons $4$ cm et $8$ cm. a) Calcule leurs périmètres. b) Quand le rayon
      double, par combien le périmètre est-il multiplié ?


      ### ★★★ Défis de maîtrise'
    correction: a) $25{,}12$ cm et $50{,}24$ cm. b) Le périmètre double aussi (l'aire, elle, serait multipliée
      par $4$).
  - numero: 32
    etoiles: 3
    enonce: 'Un jardin carré de $12$ m de côté : on retire dans un coin un carré de $4$ m de côté pour
      un puits. a) Aire de départ ? b) Aire retirée ? c) Aire restante ? d) Le tour de la figure restante
      est-il plus court, égal ou plus long que celui du carré de départ ? Justifie.'
    correction: 'a) $144 m^{2}$. b) $16 m^{2}$. c) $144 - 16 = 128 m^{2}$. d) **Égal** : $4 \times 12
      = 48$ m au départ, et $12 + 12 + 8 + 4 + 4 + 8 = 48$ m ensuite. On retire $4$ m sur deux côtés,
      mais on ajoute les deux côtés de l''entaille, qui mesurent aussi $4$ m.'
  - numero: 33
    etoiles: 3
    enonce: 'Rakieta hésite entre deux parcelles au même prix : A, rectangle de $30$ m sur $20$ m ; B,
      carré de $25$ m de côté. Elle veut la plus grande surface et la clôture la moins chère. Laquelle
      prendre ? Justifie.'
    correction: 'On calcule les deux grandeurs pour chaque parcelle, car le prix est le même. A : $A =
      600 m^{2}$, $P = 100$ m. B : $A = 625 m^{2}$, $P = 100$ m. Clôture identique, mais **B** offre $25
      m^{2}$ de plus. **Rakieta prend B.**'
  - numero: 34
    etoiles: 3
    enonce: Un rectangle a un périmètre de $34$ cm et une aire de $60$ cm$^{2}$. Retrouve sa longueur
      et sa largeur, et explique ta recherche.
    correction: 'On part du périmètre pour obtenir la somme : $L + l = 34 \div 2 = 17$. On cherche deux
      nombres de somme $17$ et de produit $60$, en essayant de façon organisée : $16 \times 1 = 16$ ;
      $15 \times 2 = 30$ ; $14 \times 3 = 42$ ; $13 \times 4 = 52$ ; $12 \times 5 = 60$. **$L = 12$ cm
      et $l = 5$ cm.** Le produit grandit quand les deux dimensions se rapprochent.'
  - numero: 35
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par un calcul ou un contre-exemple. a) Deux rectangles de même périmètre
      ont la même aire. b) $1 m^{2} = 100$ cm$^{2}$. c) Si on double le côté d'un carré, on double son
      aire. d) Un carré de $4$ cm de côté et un rectangle de $8$ cm sur $2$ cm ont la même aire.
    correction: 'a) **Faux** : $8 \times 2$ et $5 \times 5$ ont le même périmètre $20$ cm, mais $16$ cm$^{2}$
      et $25$ cm$^{2}$. b) **Faux** : $10\,000$ cm$^{2}$. c) **Faux** : de $3$ à $6$ cm, l''aire passe
      de $9$ à $36$ cm$^{2}$, soit $\times 4$. d) **Vrai** : $16$ cm$^{2}$ dans les deux cas (mais les
      périmètres diffèrent).'
  - numero: 36
    etoiles: 3
    enonce: 'Boukary devait calculer l''aire et le périmètre d''une salle de $6$ m de longueur et de $450$
      cm de largeur.


      > Ligne 1 : longueur $= 6$ m, largeur $= 450$ cm.

      > Ligne 2 : aire $= 6 \times 450 = 2\,700$ $m^{2}$.

      > Ligne 3 : périmètre $= 2 \times \left(6 + 450\right) = 912$ m.

      > Ligne 4 : il faut $2\,700$ carreaux de $1 m^{2}$ et $912$ m de plinthes.


      a) Quelle est la première ligne fautive ? b) Explique l''erreur en une phrase. c) Refais les quatre
      lignes.'
    correction: 'On relit d''abord les unités, avant les calculs. a) La **ligne 2**. b) Une longueur en
      mètres a été multipliée par une largeur en centimètres. c) Ligne 1 : $6$ m et $450$ cm $= 4{,}5$
      m. Ligne 2 : $A = 6 \times 4{,}5 = 27 m^{2}$. Ligne 3 : $P = 2 \times \left(6 + 4{,}5\right) = 21$
      m. Ligne 4 : $27$ carreaux et $21$ m de plinthes.'
  - numero: 37
    etoiles: 3
    enonce: Un grenier à mil (pavé $4$ m $\times 3$ m $\times 2$ m) est crépi à l'intérieur sur ses quatre
      murs et son plafond, pas sur le sol. a) Calcule l'aire à crépir. b) À $500$ FCFA le $m^{2}$, quel
      coût ?
    correction: 'On repère d''abord les surfaces concernées : quatre murs et le plafond, sans le sol.
      a) Murs : $2 \times \left(4 \times 2\right) = 16 m^{2}$ et $2 \times \left(3 \times 2\right) = 12
      m^{2}$ ; plafond : $4 \times 3 = 12 m^{2}$. Total : $40 m^{2}$. b) $40 \times 500 = 20\,000$ FCFA.'
  - numero: 38
    etoiles: 3
    enonce: À Sapouy, un menuisier fabrique des cadres de $60$ cm sur $40$ cm en baguettes de bois. a)
      Quelle longueur par cadre ? b) Avec $11$ m de baguette, combien de cadres complets ? c) Quelle longueur
      reste-t-il ?
    correction: a) $P = 2 \times \left(60 + 40\right) = 200$ cm, soit $2$ m par cadre. b) $11$ m $= 1\,100$
      cm ; $1\,100 \div 200 = 5{,}5$, donc **$5$ cadres**. c) $1\,100 - 1\,000 = 100$ cm, soit $1$ m.
  fiche_revision:
  - '**Périmètre.** Longueur du contour, en unité de longueur. Polygone : somme des côtés. Carré : $P
    = 4 \times c$. Rectangle : $P = 2 \times \left(L + l\right)$. Cercle : $P = 2 \times \pi \times r
    = \pi \times d$.'
  - '**Aire.** Surface, en unité carrée. Carré : $A = c \times c$. Rectangle : $A = L \times l$, mêmes
    unités. Triangle rectangle : $A = \frac{a \times b}{2}$.'
  - '**Découpage.** Somme des aires des morceaux ; une partie retirée se soustrait.'
  - '**Unités d''aire.** Un saut vaut $100$ : $1 m^{2} = 100$ dm$^{2} = 10\,000$ cm$^{2}$. $1$ a $= 100
    m^{2}$, $1$ ha $= 10\,000 m^{2}$.'
  - '**Choisir.** Entourer, clôturer, border : périmètre, en m. Carreler, peindre, semer : aire, en $m^{2}$.'
  - '**Attention.** Même périmètre ne veut pas dire même aire.'
  trouve_erreur:
  - faux: $P = 18 + 12 = 30$ m pour un rectangle de $18$ m sur $12$ m
    correction: 'Le tour n''est fait qu''à moitié : $P = 2 \times \left(18 + 12\right) = 60$ m.'
  - faux: 'Aire d''un carré de $6$ cm : $4 \times 6 = 24$ cm$^{2}$'
    correction: C'est la formule du périmètre. $A = 6 \times 6 = 36$ cm$^{2}$.
  - faux: 'Aire d''un triangle rectangle de côtés $6$ cm et $4$ cm : $24$ cm$^{2}$'
    correction: 'Division par $2$ oubliée : $A = \frac{6 \times 4}{2} = 12$ cm$^{2}$.'
  - faux: $1 m^{2} = 100$ cm$^{2}$
    correction: 'Deux colonnes par unité d''aire : $1 m^{2} = 10\,000$ cm$^{2}$.'
  - faux: 'Cercle de diamètre $10$ cm : $2 \times 3{,}14 \times 10 = 62{,}8$ cm'
    correction: 'Le diamètre a été pris pour le rayon : $P = 3{,}14 \times 10 = 31{,}4$ cm.'
  - faux: La cour fait $900$ m de surface
    correction: 'Une surface se dit en $m^{2}$ : $900 m^{2}$.'
  cartographie_lacunes:
  - lacune: Périmètre et aire confondus
    bloque_en: aires, pavé droit
  source_path: remediation\6eme\modules_c\M09.md
- niveau: 6eme
  module: 10
  module_titre: Repérage, symétrie et solides
  pourquoi: 'Trois gestes reviennent faux dans toutes les copies : les deux nombres d''un point annoncés
    dans le désordre, le symétrique placé « à vue » au lieu d''être construit, les faces confondues avec
    les arêtes. Tu connais ces règles, c''est leur application qui dérape.'
  diagnostic:
  - question: Sur une droite graduée d'origine O et d'unité 1 cm, quelle est l'abscisse du point situé
      4 unités à droite de O ?
    reponse: $4$
  - question: Dans le couple $M\left(3\,;\,2\right)$, quel nombre indique le déplacement horizontal ?
    reponse: le premier, $3$, l'abscisse
  - question: Combien d'axes de symétrie possède un carré ?
    reponse: $4$ axes ($2$ médianes, $2$ diagonales)
  - question: 'Un pavé droit : combien de faces, combien de sommets ?'
    reponse: $6$ faces, $8$ sommets
  - question: Le patron d'un cube est formé de combien de carrés ?
    reponse: $6$ carrés identiques
  lecons:
  - id: 6eme_M10_L1
    numero: '10.1'
    titre: Se repérer sur une droite graduée et sur un quadrillage
    retenir:
    - 'une **origine** : le point O, d''abscisse $0$ ;'
    - 'une **unité** : la distance entre deux graduations voisines ;'
    - 'un **sens** : celui où les nombres augmentent, vers la droite.'
    - 'Le nombre qui repère un point est son **abscisse** : $A\left(4\right)$.'
    - 'L''unité peut valoir autre chose que 1 cm de réalité : « 1 cm $= 50$ km », on l''écrit à côté de
      la droite.'
    methode:
      titre: Placer et lire un nœud
      etapes:
      - 'Pour placer : pars de O, avance de $x$ vers la droite, puis monte de $y$.'
      - 'Pour lire : descends du point jusqu''à l''axe horizontal (abscisse), va jusqu''à l''axe vertical
        (ordonnée).'
      - Écris le couple dans l'ordre (abscisse ; ordonnée).
      - 'Longueur entre deux points alignés : différence des abscisses (ou des ordonnées), en carreaux.'
    exemple_resolu: 'On place $A\left(1\,;\,1\right)$, $B\left(5\,;\,1\right)$, $C\left(5\,;\,3\right)$.
      Coordonnées de D tel que ABCD soit un rectangle, et dimensions en carreaux ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | A et B ont la même ordonnée, B et C la même abscisse. | [AB] horizontal, [BC] vertical |

      | D est à la hauteur de C et sur la verticale de A. | $D\left(1\,;\,3\right)$ |

      | On soustrait les abscisses, puis les ordonnées. | $AB = 5 - 1 = 4$ ; $BC = 3 - 1 = 2$ carreaux
      |

      | **Vérification :** de D à C il y a bien $4$ carreaux. ✓ | |


      [SVG: figures/m10_f2.svg]

      *Figure 10.1. Lire les coordonnées d''un nœud : on projette sur chaque axe.*'
    erreurs_frequentes:
    - erreur: pour $M\left(2\,;\,3\right)$, monter de $2$ puis avancer de $3$.
      correction: on avance de $2$, **puis** on monte de $3$.
    - erreur: compter les traits du quadrillage.
      correction: 'on compte les **carreaux** : de $3$ à $7$, il y a $4$ carreaux et non $5$.'
    declic: null
    figures:
    - figures/m10_f2.svg
  - id: 6eme_M10_L2
    numero: '10.2'
    titre: 'La symétrie axiale : axe, point et figure'
    retenir:
    - Si A est **sur** $\left(D\right)$, alors $A' = A$.
    - Si l'on connaît A et $A'$, l'axe est la médiatrice de $\left[AA'\right]$.
    - $AA'$ vaut le **double** de la distance de A à l'axe.
    methode:
      titre: Construire un symétrique
      etapes:
      - 'Point par point : trace la perpendiculaire à $\left(D\right)$ passant par A, de pied H, et reporte
        $HA$ de l''autre côté.'
      - 'Au compas : arc centré en A coupant $\left(D\right)$ en I et J ; même écartement, arcs centrés
        en I puis en J de l''autre côté ; ils se recoupent en $A''$.'
      - 'Pour une figure : construis les symétriques des points-clés (sommets, extrémités, centre d''un
        cercle).'
      - 'Relie **dans le même ordre**, puis contrôle : les longueurs sont conservées.'
    exemple_resolu: 'Sur un plan, $\left(d\right)$ est une allée ; un manguier M est à $2{,}5$ cm de l''allée.
      Longueur $MM''$ ? Et le symétrique d''un arbre P planté sur l''allée ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | H est le pied de la perpendiculaire menée de M. | $HM = 2{,}5$ cm |

      | Le symétrique est de l''autre côté, à la même distance. | $HM'' = 2{,}5$ cm |

      | H est le milieu de $\left[MM''\right]$. | $MM'' = 2{,}5 + 2{,}5 = 5$ cm |

      | **Vérification :** P est sur l''axe, sa distance à l''axe vaut $0$. ✓ | $P'' = P$ |


      [SVG: figures/m10_f3.svg]

      *Figure 10.2. Le symétrique d''un point : même perpendiculaire, même distance, autre côté.*'
    erreurs_frequentes:
    - erreur: placer $A'$ du même côté que A.
      correction: $A'$ est de l'**autre** côté, à la même distance de l'axe.
    - erreur: reporter $AA'$ à partir de l'axe.
      correction: la distance à reporter est $HA$, du point à l'axe ; $AA'$ en est le double.
    declic: 'l''axe est une médiatrice — Si tu places $A''$ « à vue », en face de A, le déclic tient dans
      le mot **médiatrice** : l''axe doit être perpendiculaire à $\left[AA''\right]$ **et** passer par
      son milieu. Tant que l''angle droit n''est pas tracé, reporter la distance ne veut rien dire.'
    figures:
    - figures/m10_f3.svg
  - id: 6eme_M10_L3
    numero: '10.3'
    titre: Les axes de symétrie des figures usuelles
    retenir:
    - '**Cercle :** une **infinité** d''axes, toutes les droites passant par le centre.'
    - '**Carré : 4** axes ($2$ médianes, $2$ diagonales). **Rectangle : 2** axes, ses médianes seulement.
      **Losange : 2** axes, ses diagonales.'
    - '**Triangle équilatéral : 3** axes, les médiatrices des côtés. **Triangle isocèle : 1** axe, la
      médiatrice de la base.'
    - '**Triangle quelconque** et **parallélogramme** (ni rectangle ni losange) : **aucun** axe.'
    - Un polygone **régulier** à $n$ côtés possède exactement $n$ axes.
    methode:
      titre: Trouver tous les axes d'une figure
      etapes:
      - Essaie le pliage selon les **médianes** (milieux de deux côtés opposés).
      - Essaie le pliage selon les **diagonales**.
      - Pour un triangle, essaie les droites sommet - milieu du côté opposé.
      - Garde les droites dont les deux moitiés se superposent ; trace-les en pointillés.
    exemple_resolu: 'Un menuisier trace tous les axes de quatre plateaux : un carré, un rectangle, un
      losange, un octogone régulier. Combien de traits en tout ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le carré : médianes et diagonales. | $2 + 2 = 4$ axes |

      | Le rectangle : médianes seules ; le losange : diagonales seules. | $2$ axes ; $2$ axes |

      | L''octogone est régulier à $8$ côtés. | $8$ axes |

      | **Vérification :** $4 + 2 + 2 + 8 = 16$ traits. ✓ | $16$ |'
    erreurs_frequentes:
    - erreur: « le rectangle a $4$ axes comme le carré. »
      correction: il n'en a que $2$, ses médianes ; le pliage selon une diagonale pose un côté long sur
        un côté court.
    - erreur: croire qu'un axe est forcément vertical.
      correction: il peut être horizontal ou oblique.
    declic: null
    figures: []
  - id: 6eme_M10_L4
    numero: '10.4'
    titre: Le cube et le pavé droit
    retenir: []
    methode:
      titre: Dessiner un pavé en perspective cavalière
      etapes:
      - Dessine la face avant, un rectangle en vraie grandeur.
      - Dessine un rectangle identique, décalé en oblique, profondeur réduite de moitié.
      - Relie les sommets correspondants.
      - Mets en pointillés les $3$ arêtes cachées.
    exemple_resolu: 'Sur le pavé ABCDEFGH, ABCD est la face du dessous. a) Face opposée à BCGF ? b) Les
      trois arêtes issues de E ? c) Une arête égale et parallèle à [AB] ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux faces opposées n''ont aucun sommet commun : on écarte B, C, G, F. | face opposée : ADHE |

      | De chaque sommet partent $3$ arêtes. | [EA], [EF], [EH] |

      | ABFE est un rectangle : ses côtés opposés sont égaux et parallèles. | $EF = AB$, [EF] $\parallel$
      [AB] |

      | **Vérification :** $8 \times 3 \div 2 = 12$ arêtes. ✓ | |


      [SVG: figures/m10_f6.svg]

      *Figure 10.3. Le pavé ABCDEFGH en perspective cavalière : 6 faces, 12 arêtes, 8 sommets.*'
    erreurs_frequentes:
    - erreur: « un pavé a $6$ arêtes. »
      correction: $6$ **faces**, mais $12$ arêtes et $8$ sommets.
    - erreur: tout tracer en trait plein sur une perspective.
      correction: les $3$ arêtes cachées se tracent en pointillés.
    declic: null
    figures:
    - figures/m10_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Quel axe porte les abscisses ? Lequel porte les ordonnées ? Donne les coordonnées de l'origine
      O.
    correction: L'axe **horizontal** porte les abscisses, l'axe **vertical** les ordonnées ; $O\left(0\,;\,0\right)$.
  - numero: 2
    etoiles: 1
    enonce: Vrai ou faux ? a) l'abscisse se lit sur l'axe vertical ; b) on écrit l'abscisse avant l'ordonnée
      ; c) les deux axes ont la même unité.
    correction: a) Faux (axe horizontal) ; b) Vrai ; c) Vrai.
  - numero: 3
    etoiles: 1
    enonce: Sur une droite graduée où 1 cm représente $10$ km, à quelle distance du $0$, en centimètres,
      placer la borne du km $70$ ?
    correction: '$70 \div 10 = 7$ : à $7$ cm du $0$.'
  - numero: 4
    etoiles: 1
    enonce: 'Mama Fati note les températures (1 cm $= 5\ ^{\circ}\text{C}$) : lundi $35\ ^{\circ}\text{C}$,
      mardi $30\ ^{\circ}\text{C}$, mercredi $40\ ^{\circ}\text{C}$. Place ces points sur une droite graduée.'
    correction: 'On divise par $5$ : lundi à $7$ cm, mardi à $6$ cm, mercredi à $8$ cm.'
  - numero: 5
    etoiles: 1
    enonce: Place $A\left(1\,;\,1\right)$, $B\left(2\,;\,2\right)$, $C\left(3\,;\,3\right)$. Que remarques-tu
      ?
    correction: 'Les trois points sont **alignés** : l''ordonnée augmente de $1$ chaque fois que l''abscisse
      augmente de $1$.'
  - numero: 6
    etoiles: 1
    enonce: Place $\left(0\,;\,0\right)$, $\left(4\,;\,0\right)$, $\left(4\,;\,4\right)$, $\left(0\,;\,4\right)$
      et relie-les. Quelle figure obtiens-tu ?
    correction: Un **carré** de $4$ carreaux de côté, deux côtés portés par les axes.
  - numero: 7
    etoiles: 1
    enonce: Définis ce qu'est un axe de symétrie d'une figure.
    correction: Une droite $\left(D\right)$ telle que le pliage le long de $\left(D\right)$ superpose
      **exactement** les deux parties, point par point.
  - numero: 8
    etoiles: 1
    enonce: 'Parmi les chiffres $0$, $1$, $3$, $8$ : a) lesquels ont un axe horizontal ? b) lesquels ont
      un axe vertical ?'
    correction: 'a) Horizontal : $0$, $3$, $8$. b) Vertical : $0$, $1$, $8$.'
  - numero: 9
    etoiles: 1
    enonce: 'Parmi A, B, M, F, P, R : a) cite deux lettres ayant au moins un axe ; b) cite deux lettres
      n''en ayant aucun.'
    correction: a) A et M (axe vertical) ; B a un axe horizontal. b) F et P (R non plus).
  - numero: 10
    etoiles: 1
    enonce: 'Recopie et complète : A et $A''$ sont symétriques par rapport à $\left(D\right)$ lorsque
      $\left(D\right)$ est la … du segment $\left[AA''\right]$.'
    correction: … la **médiatrice** du segment $\left[AA'\right]$.
  - numero: 11
    etoiles: 1
    enonce: Trace une droite $\left(d\right)$ verticale et un point P à $5$ cm à gauche. a) Construis
      $P'$ ; donne sa distance à $\left(d\right)$ et la longueur $PP'$. b) Où se trouve le symétrique
      d'un point B situé sur $\left(d\right)$ ?
    correction: 'a) $P''$ est à $5$ cm de $\left(d\right)$, à droite ; $PP'' = 5 + 5 = 10$ cm. b) $B''
      = B$ : un point de l''axe ne bouge pas.'
  - numero: 12
    etoiles: 1
    enonce: Trace un triangle IJK et une droite $\left(D\right)$ qui ne le coupe pas. Construis le triangle
      symétrique $I'J'K'$.
    correction: On construit $I'$, $J'$, $K'$ un par un (perpendiculaire, report de la distance), puis
      on relie dans le même ordre. Les deux triangles sont superposables.
  - numero: 13
    etoiles: 1
    enonce: 'Donne le nombre d''axes de symétrie : a) du carré ; b) du rectangle ; c) du losange ; d)
      du parallélogramme quelconque. Les diagonales du rectangle en font-elles partie ?'
    correction: 'a) $4$ ; b) $2$ ; c) $2$ ; d) aucun. Non : les diagonales du rectangle ne sont pas des
      axes.'
  - numero: 14
    etoiles: 1
    enonce: Donne le nombre d'axes d'un triangle équilatéral et précise ce que sont ces axes.
    correction: '$3$ axes : chacun passe par un sommet et le milieu du côté opposé, ce sont les médiatrices
      des côtés.'
  - numero: 15
    etoiles: 1
    enonce: Trace un triangle isocèle et son unique axe. Que représente cet axe pour la base ?
    correction: Un seul axe, la droite sommet principal - milieu de la base. Pour la base, c'est sa **médiatrice**.
  - numero: 16
    etoiles: 1
    enonce: Combien d'axes de symétrie a un cercle ? Lesquels ?
    correction: 'Une **infinité** : toutes les droites passant par le centre, c''est-à-dire tous les diamètres.'
  - numero: 17
    etoiles: 1
    enonce: 'Range ces figures de celle qui a le plus d''axes à celle qui en a le moins : rectangle, carré,
      parallélogramme quelconque, cercle.'
    correction: Cercle (infinité), carré ($4$), rectangle ($2$), parallélogramme quelconque ($0$).
  - numero: 18
    etoiles: 1
    enonce: Donne le nombre de faces, d'arêtes et de sommets d'un cube.
    correction: $6$ faces carrées, $12$ arêtes égales, $8$ sommets.
  - numero: 19
    etoiles: 1
    enonce: Vrai ou faux ? a) un cube est un pavé droit ; b) toutes les faces d'un pavé sont des carrés
      ; c) un pavé a $12$ arêtes.
    correction: a) Vrai ; b) Faux (rectangles, carrés seulement pour le cube) ; c) Vrai.
  - numero: 20
    etoiles: 1
    enonce: Sur un pavé ABCDEFGH, ABCD est la face du dessous. a) Quelle face est opposée à ABFE ? b)
      Cite les trois arêtes qui partent de B.
    correction: a) DCGH (aucun sommet commun avec ABFE). b) [BA], [BC], [BF].
  - numero: 21
    etoiles: 1
    enonce: Combien de rectangles faut-il pour le patron d'un pavé droit ? Comment sont-ils deux à deux
      ?
    correction: $6$ rectangles, allant **deux à deux par paires identiques** (trois paires), car les faces
      opposées sont superposables.
  - numero: 22
    etoiles: 1
    enonce: 'Dessine un cube de $4$ cm d''arête en perspective cavalière, arêtes cachées en pointillés.


      ### Entraînement ★★'
    correction: Carré de $4$ cm (face avant), second carré identique décalé en oblique d'environ $2$ cm,
      sommets reliés, $3$ arêtes cachées en pointillés. Les $12$ arêtes réelles mesurent $4$ cm.
  - numero: 23
    etoiles: 2
    enonce: 'Les parcelles rizicoles de Mogtédo sont repérées : $A\left(1\,;\,2\right)$, $B\left(3\,;\,2\right)$,
      $C\left(3\,;\,4\right)$, $D\left(1\,;\,4\right)$. a) Place ces points et relie-les. b) Quelle figure
      obtient-on ? c) Donne ses dimensions en carreaux.'
    correction: 'b) Quatre angles droits et quatre côtés égaux : un **carré**. c) $AB = 3 - 1 = 2$ et
      $AD = 4 - 2 = 2$ carreaux.'
  - numero: 24
    etoiles: 2
    enonce: Place $C\left(1\,;\,2\right)$ et $D\left(5\,;\,2\right)$. a) Que peux-tu dire de leur ordonnée
      ? b) Quelle est la longueur de [CD], en carreaux ?
    correction: 'a) Même ordonnée $2$ : [CD] est horizontal. b) $CD = 5 - 1 = 4$ carreaux.'
  - numero: 25
    etoiles: 2
    enonce: Place $A\left(0\,;\,0\right)$, $B\left(4\,;\,0\right)$, $C\left(4\,;\,3\right)$. a) Relie-les.
      b) Quelle est la nature du triangle ABC ? c) Donne les longueurs des deux côtés de l'angle droit.
    correction: 'b) [AB] horizontal et [BC] vertical : triangle **rectangle en B**. c) $AB = 4$ et $BC
      = 3$ carreaux.'
  - numero: 26
    etoiles: 2
    enonce: 'Pour la fête, on dispose des paniers symétriquement de part et d''autre d''une allée centrale,
      qui joue le rôle d''axe. Un panier est à $3$ m à gauche : où placer son symétrique ? Quelle distance
      sépare les deux paniers ?'
    correction: À $3$ m à droite de l'allée, sur la perpendiculaire passant par le premier panier ; distance
      $3 + 3 = 6$ m.
  - numero: 27
    etoiles: 2
    enonce: Le quadrilatère ABCD a un périmètre de $24$ cm et une aire de $32$ cm$^{2}$. On construit
      son symétrique $A'B'C'D'$ par rapport à une droite $\left(D\right)$ qui ne le coupe pas. a) Périmètre
      de $A'B'C'D'$ ? b) Son aire ? c) Aire de la figure formée par les deux quadrilatères réunis ?
    correction: 'La symétrie conserve tout : a) $24$ cm ; b) $32$ cm$^{2}$ ; c) les figures ne se recouvrent
      pas, donc $32 + 32 = 64$ cm$^{2}$.'
  - numero: 28
    etoiles: 2
    enonce: 'Vrai ou faux ? Justifie. a) Un pavé droit peut avoir deux faces carrées. b) Toutes les arêtes
      d''un cube ont la même longueur. c) Un pavé droit a autant de sommets que de faces.


      #### Entrainement intensif : construire un symétrique et le contrôler'
    correction: 'a) Vrai (par exemple $4 \times 4 \times 7$). b) Vrai, c''est la définition du cube. c)
      Faux : $8$ sommets pour $6$ faces.'
  - numero: 29
    etoiles: 2
    enonce: Trace une droite $\left(d\right)$ et deux points M et N du même côté. Construis $M'$ et $N'$,
      puis contrôle que $M'N' = MN$.
    correction: 'Même geste pour chaque point : perpendiculaire à $\left(d\right)$, pied H (puis K), report
      de la distance de l''autre côté. Contrôle : $M''N'' = MN$, la symétrie conserve les longueurs.'
  - numero: 30
    etoiles: 2
    enonce: Trace une droite $\left(d\right)$ oblique et un point A. Construis $A'$ **au compas**, en
      utilisant que $\left(d\right)$ est la médiatrice de $\left[AA'\right]$.
    correction: Arc centré en A coupant $\left(d\right)$ en I et J ; même écartement, arcs centrés en
      I puis J de l'autre côté ; ils se recoupent en $A'$. I et J sont à égale distance de A et $A'$,
      donc $\left(d\right)$ est la médiatrice de $\left[AA'\right]$.
  - numero: 31
    etoiles: 2
    enonce: Trace $\left(d\right)$ et un point A à $2$ cm de $\left(d\right)$. a) Construis $A'$. b) Construis
      le symétrique de $A'$ par rapport à $\left(d\right)$. Sur quel point retombes-tu ? Explique.
    correction: 'a) $A''$ est à $2$ cm de l''axe, de l''autre côté. b) On retombe **sur A** : le symétrique
      du symétrique est le point de départ.'
  - numero: 32
    etoiles: 2
    enonce: On a placé deux points A et $A'$ sur une feuille, sans l'axe. Explique comment retrouver l'axe
      $\left(d\right)$, puis trace-le.
    correction: 'L''axe est la **médiatrice** de $\left[AA''\right]$ : on trace $\left[AA''\right]$, on
      marque son milieu H, puis la perpendiculaire en H.'
  - numero: 33
    etoiles: 2
    enonce: $\left(d\right)$ est horizontale ; R est à $4$ cm au-dessus et S à $4$ cm au-dessous. a) Peut-on
      affirmer que R et S sont symétriques par rapport à $\left(d\right)$ ? b) Quelle condition faut-il
      vérifier en plus ?
    correction: a) **Non**. b) Il faut de plus que $\left[RS\right]$ soit **perpendiculaire** à $\left(d\right)$
      ; alors $\left(d\right)$ est la médiatrice de $\left[RS\right]$.
  - numero: 34
    etoiles: 2
    enonce: Trace une droite $\left(D\right)$ et un segment [EF] de $5$ cm qui coupe $\left(D\right)$
      en K, avec $EK = 2$ cm. Construis $\left[E'F'\right]$. a) Combien mesure-t-il ? b) Où se trouve
      le symétrique de K ? Explique.
    correction: 'a) $E''F'' = EF = 5$ cm. b) K est sur l''axe, donc $K'' = K$ : le segment image passe
      encore par K, avec $E''K = 2$ cm.'
  - numero: 35
    etoiles: 2
    enonce: 'Trace un cercle $\mathcal{C}$ de centre O et une droite $\left(\Delta\right)$ qui ne le coupe
      pas. Construis $O''$, symétrique de O, puis le cercle $\mathcal{C}''$ de centre $O''$ et de même
      rayon. Que peut-on dire de $\mathcal{C}$ et $\mathcal{C}''$ ?


      ### ★★★ Défis de maîtrise'
    correction: '$\mathcal{C}''$ est exactement le symétrique de $\mathcal{C}$ : le symétrique d''un cercle
      est un cercle de même rayon, il suffit de construire le symétrique du centre. Même rayon, même périmètre,
      même aire.'
  - numero: 36
    etoiles: 3
    enonce: 'Un élève affirme : « pour construire le symétrique d''un segment, il suffit de construire
      le symétrique de son milieu ». a) Explique pourquoi c''est faux. b) Quels points faut-il construire
      ?'
    correction: 'Une infinité de segments ont le même milieu : le milieu ne détermine ni la direction
      ni la longueur. a) La construction proposée ne donne donc qu''un point, pas le segment. b) Il faut
      construire les symétriques des **deux extrémités**, $A''$ et $B''$, puis tracer $\left[A''B''\right]$
      ; le milieu s''obtient tout seul, ce qui fournit un contrôle.'
  - numero: 37
    etoiles: 3
    enonce: Une plaque décorative est un rectangle de $12$ cm sur $5$ cm. On la coupe en deux le long
      d'un de ses axes de symétrie. a) Dimensions de chaque morceau, selon l'axe choisi ? b) Dans les
      deux cas, aire d'un morceau ?
    correction: 'Un rectangle a deux axes, ses deux médianes : il y a donc deux découpes à examiner. a)
      Selon l''une : $6$ cm sur $5$ cm ; selon l''autre : $12$ cm sur $2{,}5$ cm. b) Un axe partage en
      deux parts superposables : $60 \div 2 = 30$ cm$^{2}$ dans les deux cas ($6 \times 5 = 30$ et $12
      \times 2{,}5 = 30$).'
  - numero: 38
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une phrase ou un contre-exemple. a) Les points $\left(2\,;\,5\right)$
