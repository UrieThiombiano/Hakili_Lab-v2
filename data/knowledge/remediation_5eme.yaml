      ### Entraînement ★★'
    correction: Baisse totale $\left(-6\right) + \left(-12\right) = -18$, puis $\left(+29\right) + \left(-18\right)
      = +11$, soit $+11\,^{\circ}$C.
  - numero: 21
    etoiles: 2
    enonce: Un point $M$ est à $4{,}5$ unités du $0$. a) Quelles sont les deux abscisses possibles ? b)
      Comment nomme-t-on ces deux nombres ? c) Combien vaut leur somme ?
    correction: a) $+4{,}5$ et $-4{,}5$. b) Des opposés. c) $0$.
  - numero: 22
    etoiles: 2
    enonce: 'Complète : a) l''opposé de l''opposé de $-7$ est … ; b) si l''opposé de $x$ vaut $+4{,}2$,
      alors $x = $ … ; c) le seul nombre égal à son propre opposé est ….'
    correction: a) $-7$ ; b) $-4{,}2$ ; c) $0$.
  - numero: 23
    etoiles: 2
    enonce: a) Trouve un décimal compris entre $-3{,}5$ et $-2{,}9$. b) Donne un relatif inférieur à $-8{,}9$,
      puis un relatif supérieur à $-8{,}9$ mais encore négatif.
    correction: a) Par exemple $-3{,}2$. b) Par exemple $-9{,}5$, puis $-2$.
  - numero: 24
    etoiles: 2
    enonce: 'Trouve $x$ : a) $\left(-8\right) + x = -3$ ; b) $x + \left(+4{,}5\right) = -1{,}5$ ; c) $\left(-7\right)
      + x = 0$.'
    correction: a) $x = +5$ ; b) $x = -6$ ; c) $x = +7$ (l'opposé de $-7$).
  - numero: 25
    etoiles: 2
    enonce: 'Complète : a) $\left(+9\right) + \ldots = +15$ ; b) $\left(-4\right) + \ldots = -10$ ; c)
      $\left(+7\right) + \ldots = 0$ ; d) $\left(-3\right) + \ldots = +2$.'
    correction: a) $+6$ ; b) $-6$ ; c) $-7$ ; d) $+5$.
  - numero: 26
    etoiles: 2
    enonce: À Léo, la caisse d'un restaurant contient $+12\,000$ FCFA le matin. On enregistre une recette
      de $+7\,500$ FCFA et une dépense de $-9\,000$ FCFA. Que contient-elle le soir ?
    correction: '$\left(+12\,000\right) + \left(+7\,500\right) = +19\,500$, puis écart $19\,500 - 9\,000$
      : $10\,500$ FCFA.'
  - numero: 27
    etoiles: 2
    enonce: À Nouna, un puisatier descend à $-9$ m, remonte de $4$ m, puis redescend de $6$ m. Le puits
      fait $15$ m de profondeur. a) Où est-il à la fin ? b) Quelle donnée n'a pas servi ?
    correction: 'a) $\left(-9\right) + \left(+4\right) = -5$, puis $\left(-5\right) + \left(-6\right)
      = -11$ : $11$ m sous le sol. b) Les $15$ m de profondeur, donnée parasite.'
  - numero: 28
    etoiles: 2
    enonce: 'Sur une droite graduée, $A$ a pour abscisse $-3$ et $B$ a pour abscisse $+5$. Calcule la
      distance $AB$.


      *Entrainement intensif : organise chaque calcul avant de le lancer, paires d''opposés d''abord,
      puis positifs ensemble et négatifs ensemble.*'
    correction: $\left(+5\right) - \left(-3\right) = \left(+5\right) + \left(+3\right) = 8$. $AB = 8$
      unités, toujours positif.
  - numero: 29
    etoiles: 1
    enonce: 'Calcule mentalement : $i = \left(-2\right) + \left(-2\right) + \left(-1\right)$ ; $h = \left(+6\right)
      + \left(+5\right) + \left(-1\right)$ ; $k = \left(+18\right) + \left(-1\right) + \left(-3\right)$
      ; $n = \left(-7\right) + \left(+8\right) + \left(-3\right) + 0{,}4$.'
    correction: $i = -5$ ; $h = +10$ ; $k = +14$ ; $n = -1{,}6$.
  - numero: 30
    etoiles: 1
    enonce: 'Calcule : a) $\left(+5\right) + \left(-3\right) + \left(+7\right)$ ; b) $\left(+4\right)
      + \left(-6\right) + \left(-9\right) + \left(-10\right)$ ; c) $\left(-2\right) + \left(+5\right)
      + \left(-8\right) + \left(+3\right)$.'
    correction: a) $+9$ ; b) $-21$ ; c) $-2$.
  - numero: 31
    etoiles: 1
    enonce: 'Cherche les paires d''opposés, puis calcule : a) $\left(+7\right) + \left(-2{,}4\right) +
      \left(-7\right) + \left(+2{,}4\right)$ ; b) $\left(-4{,}1\right) + \left(-13{,}7\right) + \left(+3{,}1\right)
      + \left(+4{,}5\right)$.'
    correction: 'a) Deux paires d''opposés : $0$. b) Positifs $7{,}6$, négatifs $-17{,}8$, écart $10{,}2$
      : $-10{,}2$.'
  - numero: 32
    etoiles: 2
    enonce: 'Calcule en regroupant : a) $-14 + 23 - 9 + 6 - 11$ ; b) $+2{,}5 - 8{,}4 + 6{,}9 - 1{,}5$.'
    correction: a) $+29$ et $-34$, donc $-5$. b) $+9{,}4$ et $-9{,}9$, donc $-0{,}5$.
  - numero: 33
    etoiles: 2
    enonce: 'Calcule : $a = \left(+5\right) + \left(-6\right) + \left(-5\right) + \left(+2\right) + 0
      + \left(-2\right) + \left(+4\right)$ ; $b = \left(+12{,}5\right) + \left(+13{,}8\right) + \left(-1{,}9\right)
      + \left(-0{,}2\right) + \left(+3{,}5\right)$.'
    correction: '$a$ : $+11$ et $-13$, donc $a = -2$. $b$ : $+29{,}8$ et $-2{,}1$, donc $b = +27{,}7$.'
  - numero: 34
    etoiles: 2
    enonce: 'Transforme chaque soustraction en addition de l''opposé, puis calcule : $\left(+4{,}7\right)
      - \left(+0{,}3\right)$ ; $\left(-3{,}5\right) - \left(-0{,}5\right)$ ; $\left(+12{,}01\right) -
      \left(+1\right)$.


      ### ★★★ Défis de maîtrise'
    correction: $+4{,}4$ ; $\left(-3{,}5\right) + \left(+0{,}5\right) = -3$ ; $+11{,}01$.
  - numero: 35
    etoiles: 3
    enonce: 'À Boromo, un boutiquier doit $3\,500$ FCFA lundi soir. Mardi il encaisse $8\,000$ FCFA, mercredi
      il paie $6\,200$ FCFA. a) Écris les trois montants en relatifs. b) Solde mardi soir ? c) Solde mercredi
      soir : doit-il encore de l''argent ?'
    correction: 'Une dette est négative, un encaissement positif, un paiement négatif. a) $-3\,500$ ;
      $+8\,000$ ; $-6\,200$. b) $\left(-3\,500\right) + \left(+8\,000\right) = +4\,500$ FCFA. c) $\left(+4\,500\right)
      + \left(-6\,200\right) = -1\,700$ : oui, il doit encore $1\,700$ FCFA.'
  - numero: 36
    etoiles: 3
    enonce: 'Idrissa a un score de $-7$ points, Kadiatou de $-12$ points. a) Qui mène ? Justifie. b) Idrissa
      marque $+10$ points et Kadiatou $+16$ points : donne les nouveaux scores. c) Qui mène maintenant
      ?'
    correction: 'Il ne faut pas confondre le meilleur score et le plus grand chiffre : entre deux négatifs,
      le plus proche de zéro l''emporte. a) $-7 > -12$ : Idrissa mène. b) $\left(-7\right) + \left(+10\right)
      = +3$ ; $\left(-12\right) + \left(+16\right) = +4$. c) $+4 > +3$ : Kadiatou mène.'
  - numero: 37
    etoiles: 3
    enonce: À Zorgho, le niveau d'un forage se repère par rapport au sol. En mars l'eau est à $-18$ m
      ; en juillet elle remonte de $7$ m ; en octobre, encore de $5$ m. a) Niveau en juillet, puis en
      octobre ? b) Range les trois niveaux dans l'ordre croissant.
    correction: 'Le sol est le zéro, l''eau est en dessous donc négative, une remontée s''ajoute avec
      un $+$. a) Juillet : $\left(-18\right) + \left(+7\right) = -11$ m ; octobre : $\left(-11\right)
      + \left(+5\right) = -6$ m. b) $-18 < -11 < -6$.'
  - numero: 38
    etoiles: 3
    enonce: Vrai ou faux ? Justifie. a) L'opposé d'un nombre négatif est toujours positif. b) Si un nombre
      est plus grand qu'un autre, son opposé est aussi plus grand. c) Deux nombres différents peuvent
      avoir le même opposé.
    correction: 'Une affirmation générale se prouve pour tous les cas ou tombe par un seul contre-exemple.
      a) Vrai : changer le signe d''un négatif place le nombre à droite du $0$. b) Faux : $+5 > +2$ mais
      $-5 < -2$ ; l''opposé retourne l''ordre. c) Faux : chaque nombre a un seul opposé, donc deux nombres
      de même opposé seraient égaux.'
  - numero: 39
    etoiles: 3
    enonce: Place les points d'abscisses $-4{,}5$ ; $-1{,}5$ ; $+2{,}5$ (unité $1$ cm). a) Lequel est
      le plus proche du $0$ ? b) Place les opposés de ces trois nombres. c) Que remarques-tu ?
    correction: 'On compare d''abord les distances à zéro, car c''est elle qui mesure l''éloignement.
      a) $1{,}5 < 2{,}5 < 4{,}5$ : le point $-1{,}5$. b) Opposés : $+4{,}5$ ; $+1{,}5$ ; $-2{,}5$. c)
      Les six points sont symétriques deux à deux par rapport au $0$.'
  - numero: 40
    etoiles: 3
    enonce: À Ouahigouya, la caisse d'un groupement d'épargne enregistre en trois semaines $-4\,500$ FCFA,
      $+12\,000$ FCFA puis $-3\,200$ FCFA. Le soir de la troisième semaine, elle contient $+8\,800$ FCFA.
      Que contenait-elle au départ ?
    correction: 'On raisonne à l''envers : on calcule d''abord l''effet total des trois semaines. Positifs
      $12\,000$, négatifs $-7\,700$, écart $4\,300$, signe de $+12\,000$ : la caisse a gagné $+4\,300$.
      Donc départ $= 8\,800 - 4\,300 = 4\,500$ FCFA.'
  - numero: 41
    etoiles: 3
    enonce: 'Boukary devait calculer $S = \left(-7\right) + \left(+12\right) + \left(-15\right) + \left(+4\right)
      + \left(-6\right)$. Sa copie :


      > ligne 1 : positifs : $12 + 4 = +16$

      > ligne 2 : négatifs : $7 + 15 + 6 = 28$, donc $-28$

      > ligne 3 : $S = \left(+16\right) + \left(-28\right) = +12$


      a) Quelle ligne casse le raisonnement ? b) Refais le calcul. c) Confirme de proche en proche.'
    correction: 'On recalcule chaque ligne à part et on s''arrête à la première fausse. a) La ligne 3
      : l''écart $28 - 16 = 12$ est juste, mais le signe doit être celui de $-28$, le plus éloigné de
      zéro. b) $S = -12$. c) $-7 + 12 = +5$ ; $+5 - 15 = -10$ ; $-10 + 4 = -6$ ; $-6 - 6 = -12$. ✓'
  fiche_revision:
  - '**Signe et distance à zéro.** Le signe donne le côté, la valeur donne l''éloignement ; $0$ n''est
    ni positif ni négatif.'
  - '**Abscisse.** Unité constante, négatifs à gauche, positifs à droite.'
  - '**Opposé.** Même distance au $0$, signe contraire ; un nombre plus son opposé vaut $0$ ; seul $0$
    est son propre opposé.'
  - '**Comparer.** Plus à droite, plus grand. Tout positif $>$ tout négatif. Entre deux négatifs, le plus
    grand est le plus proche de zéro.'
  - '**Additionner.** Mêmes signes : somme des distances à zéro, signe commun. Signes différents : écart
    des distances à zéro, signe du plus éloigné.'
  - '**Plusieurs termes.** Paires d''opposés, puis positifs, puis négatifs, puis une addition finale.'
  - '**Soustraire.** Ajouter l''opposé. Une distance reste toujours positive.'
  trouve_erreur:
  - faux: $-5 > -3$ car $5 > 3$
    correction: 'On compare les positions : $-5$ est à gauche, donc $-5 < -3$.'
  - faux: L'opposé de $+3{,}5$ est $3{,}5$
    correction: 'L''opposé change le signe : $-3{,}5$.'
  - faux: $\left(-6\right) + \left(-9\right) = -3$
    correction: 'Signes identiques : $6 + 9 = 15$, donc $-15$.'
  - faux: $\left(-7\right) + \left(+3\right) = -10$
    correction: 'Signes différents : écart $7 - 3 = 4$, signe de $-7$, donc $-4$.'
  - faux: $\left(-3{,}5\right) - \left(-0{,}5\right) = -4$
    correction: 'On ajoute l''opposé du nombre soustrait : $-3{,}5 + 0{,}5 = -3$.'
  cartographie_lacunes:
  - lacune: Règles de signes fausses dès l'addition
    bloque_en: addition et soustraction dans D, valeur absolue
