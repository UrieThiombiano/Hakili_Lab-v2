    etoiles: 3
    enonce: $ABCD$ est un quadrilatère non croisé quelconque ; $I$, $J$, $K$, $L$ sont les milieux de
      $\left[AB\right]$, $\left[BC\right]$, $\left[CD\right]$, $\left[DA\right]$. a) Trace la diagonale
      $\left[AC\right]$ et applique deux fois le théorème des milieux. b) Montre que $IJKL$ est un parallélogramme,
      **quel que soit** le quadrilatère de départ. c) Que devient $IJKL$ si les diagonales de $ABCD$ sont
      perpendiculaires ? Et si elles ont la même longueur ?
    correction: 'a) Dans $ABC$ : $\left(IJ\right) \parallel \left(AC\right)$ et $IJ = \frac{AC}{2}$ ;
      dans $ACD$ : $\left(LK\right) \parallel \left(AC\right)$ et $LK = \frac{AC}{2}$. b) Deux côtés opposés
      parallèles et égaux : parallélogramme, sans aucune hypothèse sur $ABCD$ ; la diagonale est la clé,
      elle ramène le quadrilatère à deux triangles. c) Diagonales perpendiculaires : $\left(JK\right)
      \parallel \left(BD\right)$ et $\left(IJ\right) \parallel \left(AC\right)$ avec $\left(AC\right)
      \perp \left(BD\right)$, donc un angle droit : **rectangle**. Diagonales de même longueur : $IJ =
      \frac{AC}{2} = \frac{BD}{2} = JK$, côtés consécutifs égaux : **losange**.'
  - numero: 28
    etoiles: 3
    enonce: Dans un triangle $ABC$, $BC = 24$ cm. $I$ est le milieu de $\left[AB\right]$, $J$ celui de
      $\left[AC\right]$, $K$ celui de $\left[AI\right]$ et $L$ celui de $\left[AJ\right]$. a) Calcule
      $IJ$, puis $KL$, en justifiant. b) Montre que $\left(KL\right)$, $\left(IJ\right)$ et $\left(BC\right)$
      sont parallèles. c) $IJCB$ est-il un trapèze ? Si oui, calcule la longueur du segment joignant les
      milieux de $\left[IB\right]$ et de $\left[JC\right]$. d) En poursuivant le procédé jusqu'à la cinquième
      étape à partir de $\left[BC\right]$, quelle longueur obtiendrait-on ?
    correction: 'a) Dans $ABC$ : $IJ = \frac{BC}{2} = 12$ cm et $\left(IJ\right) \parallel \left(BC\right)$
      ; dans $AIJ$ : $KL = \frac{IJ}{2} = 6$ cm et $\left(KL\right) \parallel \left(IJ\right)$. b) Deux
      droites parallèles à une même droite sont parallèles entre elles : $\left(KL\right) \parallel \left(BC\right)$.
      c) Oui : $\left[IJ\right] \parallel \left[BC\right]$ et les deux autres côtés se coupent en $A$.
      Segment des milieux : $\frac{12 + 24}{2} = 18$ cm. d) Chaque étape divise par $2$ : $\frac{24}{2^{5}}
      = 0{,}75$ cm.'
  - numero: 29
    etoiles: 3
    enonce: 'Ousmane devait traiter cet énoncé : « dans un triangle $ABC$, $M$ est le milieu de $\left[AB\right]$,
      $N$ appartient à $\left[AC\right]$ et $\left(MN\right) \parallel \left(BC\right)$. On donne $BC
      = 14$ cm et $AM = 5$ cm. Calculer $MN$ et $AB$. » Voici sa copie.


      > Ligne 1 : $M$ est le milieu de $\left[AB\right]$ et $\left(MN\right) \parallel \left(BC\right)$,
      donc d''après le théorème des milieux, $N$ est le milieu de $\left[AC\right]$.

      > Ligne 2 : Donc $MN = \frac{BC}{2} = 7$ cm.

      > Ligne 3 : Comme $MN$ est la moitié de $BC$, $AM$ est la moitié de $AB$, donc $AB = \frac{5}{2}
      = 2{,}5$ cm.

      > Ligne 4 : Conclusion : $MN = 7$ cm et $AB = 2{,}5$ cm.


      Une ligne contient une erreur de **nom**, une autre une erreur de **calcul renversé**. Trouve-les,
      explique, puis rédige la solution correcte.'
    correction: '**Ligne 1**, erreur de nom : un milieu $+$ une parallèle donnant un milieu, c''est la
      **réciproque**, pas le direct. **Ligne 3**, calcul renversé : $AM$ est la moitié de $AB$, donc $AB
      = 2 \times 5 = 10$ cm ; Ousmane a divisé au lieu de multiplier. Solution : réciproque $\Rightarrow$
      $N$ milieu de $\left[AC\right]$ ; direct $\Rightarrow$ $MN = 7$ cm ; $AB = 10$ cm. Contrôle : $AB$
      doit dépasser $AM$.'
  - numero: 30
    etoiles: 3
    enonce: Dans un triangle $ABC$, on trace les trois segments joignant les milieux des côtés deux à
      deux. a) Combien de petits triangles la figure comporte-t-elle ? b) Montre que ces petits triangles
      ont deux à deux des côtés de mêmes longueurs. c) Combien de parallélogrammes peut-on repérer ? Nomme-les.
      d) En recommençant l'opération dans chacun des petits triangles, combien de triangles de la plus
      petite taille obtient-on ?
    correction: 'Avec $I$, $J$, $K$ milieux de $\left[AB\right]$, $\left[AC\right]$, $\left[BC\right]$.
      a) **$4$** : les coins $AIJ$, $IBK$, $JKC$ et le central $IJK$. b) Le théorème des milieux donne
      $IJ = \frac{BC}{2}$, $JK = \frac{AB}{2}$, $IK = \frac{AC}{2}$ ; et $AI = \frac{AB}{2}$, $AJ = \frac{AC}{2}$
      : chaque coin a les mêmes longueurs de côtés que le central, les quatre triangles sont superposables.
      c) **Trois** : $AIKJ$, $IBKJ$, $IKCJ$ ; par exemple $\left(IK\right) \parallel \left(AC\right)$
      et $IK = \frac{AC}{2} = AJ$. d) $4 \times 4 = 16$.'
  - numero: 31
    etoiles: 3
    enonce: 'Le village de Talato est à $2{,}4$ km d''une route rectiligne, distance mesurée perpendiculairement.
      Deux bornes $P$ et $Q$ de la route sont à $3$ km et à $4$ km du pied de cette perpendiculaire, de
      part et d''autre de celui-ci. On installe un arrêt de car sur la route, le plus près possible du
      village. a) Où faut-il le placer, et pourquoi $2{,}4$ km est-elle la plus courte distance ? Justifie
      sans calculer aucune longueur oblique. b) Le chef de village propose le milieu de $\left[PQ\right]$
      : ce point convient-il ?'
    correction: 'a) Au **pied de la perpendiculaire** abaissée du village sur la route, c''est-à-dire
      au projeté orthogonal. Propriété : la distance d''un point à une droite est la longueur du segment
      perpendiculaire, et c''est le plus court chemin ; tout autre point donne un segment oblique plus
      long. Donc $2{,}4$ km est bien le minimum, sans aucun calcul. b) Non : en repérant la route depuis
      le pied, $P$ est à $-3$ km et $Q$ à $+4$ km, donc le milieu de $\left[PQ\right]$ est à $\frac{-3
      + 4}{2} = 0{,}5$ km, soit $500$ m trop loin. Il ne conviendrait que si $P$ et $Q$ étaient à égale
      distance du pied.'
  fiche_revision:
  - '**Théorème direct.** Deux milieux $\Rightarrow$ parallèle au troisième côté et moitié de sa longueur
    : $IJ = \frac{BC}{2}$.'
  - '**Réciproque.** Un milieu $+$ parallèle à un côté $\Rightarrow$ milieu du troisième côté.'
  - '**Trapèze.** Segment des milieux des côtés non parallèles : parallèle aux bases, longueur $\frac{b
    + B}{2}$.'
  - '**Projection parallèle.** Rabattre sur $\left(d\right)$ le long de $\left(\delta\right)$ ; conserve
    le milieu, pas les longueurs.'
  - '**Projection orthogonale.** Pied de la perpendiculaire ; donne la distance d''un point à une droite.'
  - '**Vers la 3ème.** Théorème des milieux $=$ Thalès au rapport $\frac{1}{2}$.'
  trouve_erreur:
  - faux: '« $I$ milieu de $\left[AB\right]$, $J$ sur $\left[AC\right]$ : donc $IJ = \frac{BC}{2}$. »'
    correction: 'Le direct exige **deux milieux** : si $J$ n''est pas un milieu, rien ne vaut.'
  - faux: « $\left(IJ\right) \parallel \left(BC\right)$, donc $I$ et $J$ sont les milieux. »
    correction: La réciproque exige déjà **un** milieu en hypothèse.
  - faux: « $BC = \frac{IJ}{2}$ »
    correction: 'C''est l''inverse : $IJ = \frac{BC}{2}$, donc $BC = 2\,IJ$.'
  - faux: « Le segment des milieux du trapèze vaut la moitié de la grande base. »
    correction: 'Il vaut la **demi-somme** : $\frac{b + B}{2}$.'
  - faux: « La distance de $M$ à $\left(d\right)$ est $MP$, $P$ quelconque. »
    correction: 'C''est $MH$, jusqu''au **projeté orthogonal** : $MH \le MP$.'
  cartographie_lacunes:
  - lacune: Théorème des milieux et projection non maîtrisés (prérequis direct de Thalès et du rapport
      de projection)
    bloque_en: ch. 5, 8, 20
  source_path: remediation\3eme\modules_c\M10.md
- niveau: 3eme
  module: 11
  module_titre: Périmètres, aires et volumes
  pourquoi: Les formules d'aires et de volumes servent en 3ème et en physique-chimie. Le vrai piège n'est
    pas la formule, ce sont les unités.
  diagnostic:
  - question: Périmètre et aire d'un rectangle de $8$ cm sur $5$ cm.
    reponse: $P = 26$ cm ; $A = 40$ cm²
  - question: Aire d'un triangle de base $10$ cm et de hauteur $7$ cm.
    reponse: $35$ cm²
  - question: Périmètre d'un cercle de rayon $5$ cm et aire du disque (valeurs exactes, puis arrondies
      au dixième avec $\pi \approx 3{,}14$).
    reponse: $P = 10\pi \approx 31{,}4$ cm ; $A = 25\pi \approx 78{,}5$ cm²
  - question: 'Convertis : $2{,}4$ m² en cm² ; $3\,500$ cm³ en litres.'
    reponse: $24\,000$ cm² ; $3{,}5$ L
  - question: Volume d'un pavé droit de $6$ cm $\times$ $4$ cm $\times$ $10$ cm, puis d'un cylindre de
      rayon $3$ cm et de hauteur $10$ cm (valeur exacte).
    reponse: $240$ cm³ ; $90\pi$ cm³
  lecons:
  - id: 3eme_M11_L1
    numero: '11.1'
    titre: Périmètres et aires
    retenir:
    - 'Le **périmètre** est la longueur du contour : mm, cm, m, km. L''**aire** mesure la surface : mm²,
      cm², m², km², ha.'
    - '**Rectangle** : $P = 2\left(L + l\right)$ ; $A = L \times l$. **Carré** : $P = 4c$ ; $A = c^{2}$.'
    - '**Parallélogramme** : $A = b \times h$. **Triangle** : $A = \frac{b \times h}{2}$. **Trapèze**
      : $A = \frac{\left(b + B\right) \times h}{2}$.'
    - '**Cercle** de rayon $r$ : $P = 2\pi r$ ; aire du **disque** : $A = \pi r^{2}$.'
    - Le cercle est une ligne (cm), le disque une surface (cm²). Garde la valeur exacte avec $\pi$ tant
      qu'aucun arrondi n'est demandé.
    methode:
      titre: Calculer l'aire d'une figure composée
      etapes:
      - '**Découpe** en morceaux connus (rectangles, triangles, demi-disques), ou vois une grande figure
        **moins** un morceau.'
      - Repère pour chaque morceau la base et sa **hauteur** (perpendiculaires entre elles).
      - Calcule chaque aire, dans la même unité partout.
      - Additionne ou soustrais, puis contrôle l'ordre de grandeur.
    exemple_resolu: 'Un jardin est un rectangle de $12$ m sur $8$ m surmonté d''un demi-disque de diamètre
      $8$ m. Calcule son aire au m².


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On découpe : rectangle $+$ demi-disque de rayon $4$ m. | $A = A_{\text{rect}} + \frac{1}{2} A_{\text{disque}}$
      |

      | Aire du rectangle. | $12 \times 8 = 96$ m² |

      | Aire du demi-disque. | $\frac{1}{2} \times \pi \times 4^{2} = 8\pi \approx 25{,}1$ m² |

      | **Vérification :** $96 + 25{,}1 \approx 121$ m², un peu plus que le rectangle seul. ✓ | |'
    erreurs_frequentes:
    - erreur: donner une aire en cm.
      correction: l'aire se mesure en cm², le périmètre en cm ; deux figures de même périmètre peuvent
        avoir des aires différentes.
    - erreur: calculer l'aire d'un disque avec le diamètre, ou confondre $2\pi r$ et $\pi r^{2}$.
      correction: $\pi r^{2}$ utilise le **rayon** au carré ; $2\pi r$ est le périmètre.
    declic: null
    figures:
    - figures/m11_f4.svg
  - id: 3eme_M11_L2
    numero: '11.2'
    titre: Les conversions d'unités
    retenir:
    - '**Longueurs** (km, hm, dam, m, dm, cm, mm) : $\times 10$ par rang. $1$ m $= 100$ cm.'
    - '**Aires** : $\times 100$ par rang. $1$ m² $= 10\,000$ cm² (l''unité d''aire est un carré).'
    - '**Volumes** : $\times 1\,000$ par rang. $1$ m³ $= 1\,000\,000$ cm³.'
    - '**Capacités** : $1$ L $= 1$ dm³ ; $1$ m³ $= 1\,000$ L ; $1$ mL $= 1$ cm³.'
    - 'Unité agraire : $1$ ha $= 10\,000$ m².'
    methode:
      titre: Convertir sans tableau
      etapes:
      - Écris l'unité de départ et l'unité d'arrivée, compte les **rangs** qui les séparent.
      - 'Choisis le facteur par rang : $10$ (longueur), $100$ (aire), $1\,000$ (volume).'
      - Multiplie le facteur autant de fois qu'il y a de rangs.
      - 'Relis : vers la petite unité le nombre grossit, vers la grande il diminue.'
    exemple_resolu: 'Convertis : a) $3{,}7$ m² en cm² ; b) $6{,}4$ dm² en cm² ; c) $1{,}4$ ha en m².


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Du m au cm : deux rangs, facteur $100$ par rang. | $100 \times 100 = 10\,000$ |

      | Unité d''arrivée plus petite : on multiplie. | $3{,}7 \times 10\,000 = 37\,000$ cm² |

      | Du dm au cm : un rang. | $6{,}4 \times 100 = 640$ cm² |

      | **Vérification :** $1$ ha $= 10\,000$ m², donc $1{,}4$ ha $= 14\,000$ m² ; partout le nombre a
      grossi. ✓ | |'
    erreurs_frequentes:
    - erreur: convertir une aire comme une longueur ($2{,}4$ m² $= 240$ cm²).
      correction: 'chaque rang vaut $100$ : $2{,}4$ m² $= 24\,000$ cm².'
    - erreur: écrire $1$ L $= 1$ m³.
      correction: $1$ L $= 1$ **dm³** ; ce sont $1\,000$ L qui font $1$ m³.
    declic: 'le petit $2$ n''est pas une décoration — $1$ m, c''est $100$ cm ; donc $1$ m², carré de $1$
      m de côté, c''est $100 \times 100 = 10\,000$ cm². Carré $\to$ exposant $2$, cube $\to$ exposant
      $3$ : une seule idée à retenir, valable aussi pour les agrandissements.'
    figures: []
  - id: 3eme_M11_L3
    numero: '11.3'
    titre: Les volumes des solides usuels
    retenir:
    - '**Pavé droit** : $V = L \times l \times h$ ; **cube** : $V = c^{3}$.'
    - '**Prisme droit** et **cylindre** : $V = \text{aire de la base} \times h$ ; cylindre : $V = \pi
      r^{2} h$.'
    - '**Pyramide** et **cône** : $V = \frac{1}{3} \times \text{aire de la base} \times h$ ; cône : $V
      = \frac{1}{3}\pi r^{2} h$.'
    - '**Boule** de rayon $r$ : $V = \frac{4}{3}\pi r^{3}$ ; sphère : $A = 4\pi r^{2}$.'
    - 'Solides droits : base $\times$ hauteur. Solides pointus : le tiers. L''unité est une longueur **au
      cube**.'
    methode:
      titre: Calculer un volume
      etapes:
      - Identifie le solide (droit ou pointu) et écris la formule **en toutes lettres**.
      - Mets toutes les longueurs dans la **même unité**.
      - Remplace et calcule, en gardant $\pi$ si possible.
      - Unité au cube ; convertis en litres si on le demande ($1$ L $= 1$ dm³).
    exemple_resolu: 'Volume d''une pyramide à base carrée de côté $9$ cm et de hauteur $12$ cm.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Solide pointu : formule complète, facteur $\frac{1}{3}$ compris. | $V = \frac{1}{3} \times A_{\text{base}}
      \times h$ |

      | Aire de la base, un carré. | $A_{\text{base}} = 9^{2} = 81$ cm² |

      | On remplace, produit d''abord. | $V = \frac{1}{3} \times 81 \times 12 = \frac{972}{3} = 324$ cm³
      |

      | **Vérification :** le pavé de même base et même hauteur ferait $972$ cm³, dont $324$ est le tiers.
      ✓ | |'
    erreurs_frequentes:
    - erreur: oublier le facteur $\frac{1}{3}$ pour la pyramide et le cône.
      correction: un cône occupe le tiers du cylindre de même base et même hauteur.
    - erreur: mélanger mètres et centimètres, ou élever le diamètre au carré.
      correction: une seule unité d'abord ; dans $\pi r^{2} h$, seul le **rayon** est au carré.
    declic: null
    figures:
    - figures/m11_f11.svg
    - figures/m11_f12.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Calcule le périmètre et l''aire : a) d''un carré de côté $7{,}5$ cm ; b) d''un rectangle
      de $9$ cm sur $4{,}2$ cm.'
    correction: a) $P = 30$ cm ; $A = 56{,}25$ cm². b) $P = 26{,}4$ cm ; $A = 37{,}8$ cm².
  - numero: 2
    etoiles: 1
    enonce: Un triangle a une aire de $54$ cm² et une base de $12$ cm. Calcule la hauteur associée.
    correction: $\frac{12h}{2} = 54$, donc $6h = 54$ et $h = 9$ cm.
  - numero: 3
    etoiles: 1
    enonce: Un terrain a la forme d'un trapèze de bases $30$ m et $18$ m et de hauteur $15$ m. Calcule
      son aire.
    correction: $A = \frac{\left(30 + 18\right) \times 15}{2} = 360$ m².
  - numero: 4
    etoiles: 1
    enonce: Calcule la valeur exacte, puis l'arrondi au centième, du périmètre et de l'aire d'un disque
      de rayon $6$ cm.
    correction: $P = 12\pi \approx 37{,}70$ cm ; $A = 36\pi \approx 113{,}10$ cm².
  - numero: 5
    etoiles: 1
    enonce: 'Convertis : a) $4{,}25$ km en m ; b) $360$ mm en dm ; c) $5{,}2$ m² en dm² ; d) $47\,000$
      cm² en m² ; e) $0{,}8$ ha en m².'
    correction: a) $4\,250$ m. b) $3{,}6$ dm. c) $520$ dm². d) $4{,}7$ m². e) $8\,000$ m².
  - numero: 6
    etoiles: 1
    enonce: 'Convertis : a) $3{,}4$ dm³ en cm³ ; b) $2\,500\,000$ cm³ en m³ ; c) $7{,}5$ L en cm³ ; d)
      $12\,400$ L en m³.'
    correction: a) $3\,400$ cm³. b) $2{,}5$ m³. c) $7\,500$ cm³. d) $12{,}4$ m³.
  - numero: 7
    etoiles: 1
    enonce: 'Calcule le volume : a) d''un cube d''arête $4{,}5$ cm ; b) d''un pavé droit de $12$ cm $\times$
      $8$ cm $\times$ $5$ cm ; c) d''un prisme droit de hauteur $10$ cm dont la base est un triangle d''aire
      $24$ cm².'
    correction: a) $4{,}5^{3} = 91{,}125$ cm³. b) $480$ cm³. c) $24 \times 10 = 240$ cm³.
  - numero: 8
    etoiles: 1
    enonce: 'Calcule la valeur exacte puis l''arrondi à l''unité : a) du volume d''un cylindre de rayon
      $5$ cm et de hauteur $12$ cm ; b) du volume d''un cône de même rayon et même hauteur ; c) que remarques-tu
      ?'
    correction: a) $300\pi \approx 942$ cm³. b) $100\pi \approx 314$ cm³. c) Le cône est le **tiers**
      du cylindre de même base et même hauteur.
  - numero: 9
    etoiles: 1
    enonce: Une calebasse a presque la forme d'une demi-boule de rayon $12$ cm. Calcule son volume en
      cm³ (arrondi à l'unité), puis sa contenance en litres (arrondie au dixième).
    correction: $\frac{1}{2} \times \frac{4}{3}\pi \times 12^{3} = 1\,152\pi \approx 3\,619$ cm³, soit
      $3{,}6$ L.
  - numero: 10
    etoiles: 1
    enonce: Calcule le périmètre et l'aire d'un rectangle de longueur $14{,}5$ m et de largeur $8$ m.
    correction: $P = 45$ m ; $A = 116$ m².
  - numero: 11
    etoiles: 1
    enonce: Un carré a un périmètre de $30$ cm. Calcule son côté puis son aire.
    correction: Côté $30 \div 4 = 7{,}5$ cm ; aire $56{,}25$ cm².
  - numero: 12
    etoiles: 1
    enonce: 'Calcule l''aire : a) d''un triangle de base $9$ cm et de hauteur $6$ cm ; b) d''un parallélogramme
      de base $7{,}5$ cm et de hauteur $4$ cm ; c) d''un trapèze de bases $11$ cm et $5$ cm et de hauteur
      $6$ cm.'
    correction: a) $27$ cm². b) $30$ cm². c) $\frac{16 \times 6}{2} = 48$ cm².
  - numero: 13
    etoiles: 1
    enonce: Un disque a un rayon de $9$ cm. Calcule son périmètre et son aire (valeurs exactes puis arrondies
      au dixième).
    correction: $P = 18\pi \approx 56{,}5$ cm ; $A = 81\pi \approx 254{,}5$ cm².
  - numero: 14
    etoiles: 1
    enonce: Un rectangle a une aire de $91$ cm² et une longueur de $13$ cm. Calcule sa largeur puis son
      périmètre.
    correction: Largeur $91 \div 13 = 7$ cm ; $P = 40$ cm.
  - numero: 15
    etoiles: 1
    enonce: 'Convertis : a) $7{,}03$ km en m ; b) $580$ cm en m ; c) $6{,}9$ m² en cm² ; d) $12\,500$
      m² en ha ; e) $0{,}45$ dm² en cm².'
    correction: a) $7\,030$ m. b) $5{,}8$ m. c) $69\,000$ cm². d) $1{,}25$ ha. e) $45$ cm².
  - numero: 16
    etoiles: 1
    enonce: 'Convertis : a) $5{,}7$ m³ en dm³ ; b) $840$ cm³ en dm³ ; c) $9{,}3$ L en mL ; d) $6\,300$
      dm³ en m³ ; e) $0{,}25$ m³ en litres.'
    correction: a) $5\,700$ dm³. b) $0{,}84$ dm³. c) $9\,300$ mL. d) $6{,}3$ m³. e) $250$ L.
  - numero: 17
    etoiles: 1
    enonce: 'Calcule le volume : a) d''un cube d''arête $7$ cm ; b) d''un pavé droit de $2{,}5$ m $\times$
      $1{,}2$ m $\times$ $0{,}8$ m ; c) d''un cylindre de diamètre $10$ cm et de hauteur $15$ cm (valeur
      exacte puis arrondie).'
    correction: 'a) $343$ cm³. b) $2{,}4$ m³. c) $r = 5$ : $375\pi \approx 1\,178$ cm³.'
  - numero: 18
    etoiles: 1
    enonce: 'Calcule le volume d''une pyramide à base carrée de côté $6$ cm et de hauteur $10$ cm.


      ### Entraînement ★★'
    correction: $V = \frac{1}{3} \times 36 \times 10 = 120$ cm³.
  - numero: 19
    etoiles: 2
    enonce: Une piste circulaire a un périmètre de $471$ m. Calcule son rayon (prends $\pi \approx 3{,}14$).
    correction: $2\pi r = 471$, donc $r = \frac{471}{6{,}28} = 75$ m.
  - numero: 20
    etoiles: 2
    enonce: Une cour rectangulaire de $15$ m sur $9$ m contient un bac à fleurs carré de $2$ m de côté
      et un puits circulaire de rayon $0{,}8$ m. Calcule l'aire de la surface à cimenter (arrondie au
      centième).
    correction: Cour $135$ m² ; bac $4$ m² ; puits $0{,}64\pi \approx 2{,}01$ m². Reste $135 - 4 - 2{,}01
      = 128{,}99$ m².
  - numero: 21
    etoiles: 2
    enonce: Compare, en justifiant, les aires d'un carré de côté $6$ cm et d'un rectangle de même périmètre
      dont la longueur vaut $8$ cm.
    correction: 'Carré : $A = 36$ cm². Rectangle $8 \times 4$ : $A = 32$ cm². À périmètre égal ($24$ cm),
      le carré a la plus grande aire.'
  - numero: 22
    etoiles: 2
    enonce: Un champ a une aire de $2{,}5$ ha. Exprime cette aire en m², puis calcule le côté du carré
      qui aurait la même aire (arrondi au mètre).
    correction: '$25\,000$ m². $158^{2} = 24\,964$ et $159^{2} = 25\,281$ : côté $\approx 158$ m.'
  - numero: 23
    etoiles: 2
    enonce: Un silo à grains a la forme d'un cylindre de rayon $1{,}5$ m et de hauteur $2$ m, surmonté
      d'un cône de même rayon et de hauteur $0{,}9$ m. Calcule le volume total (valeur exacte puis arrondie
      au centième de m³).
    correction: Cylindre $4{,}5\pi$ m³ ; cône $\frac{1}{3}\pi \times 2{,}25 \times 0{,}9 = 0{,}675\pi$
      m³. Total $5{,}175\pi \approx 16{,}26$ m³.
  - numero: 24
    etoiles: 2
    enonce: 'Un aquarium en forme de pavé droit mesure $60$ cm $\times$ $40$ cm $\times$ $35$ cm. a) Calcule
      son volume en cm³. b) Convertis en litres. c) On le remplit aux $\frac{4}{5}$ : combien de litres
      d''eau contient-il ?'
    correction: a) $84\,000$ cm³. b) $84$ L. c) $\frac{4}{5} \times 84 = 67{,}2$ L.
  - numero: 25
    etoiles: 2
    enonce: Une boule de pétanque a un rayon de $3{,}7$ cm ; une orange, un rayon de $4$ cm. Calcule le
      volume de chacune (arrondi au cm³).
    correction: Boule $\frac{4}{3}\pi \times 50{,}653 \approx 212$ cm³ ; orange $\frac{4}{3}\pi \times
      64 \approx 268$ cm³.
  - numero: 26
    etoiles: 2
    enonce: Un fût cylindrique de rayon $30$ cm et de hauteur $90$ cm est rempli d'eau. On le vide dans
      des bidons de $20$ L. Combien de bidons complets peut-on remplir ?
    correction: '$V = 81\,000\pi \approx 254\,469$ cm³ $\approx 254{,}5$ L ; $254{,}5 \div 20 = 12{,}7$
      : $12$ bidons complets.'
  - numero: 27
    etoiles: 2
    enonce: 'Une brique pleine mesure $22$ cm $\times$ $11$ cm $\times$ $6$ cm. a) Calcule son volume.
      b) La masse volumique de la terre cuite est $1{,}8$ g/cm³ : calcule la masse d''une brique. c) Un
      ouvrier peut-il porter d''un coup un lot de $12$ briques ? Justifie par un ordre de grandeur.'
    correction: 'a) $1\,452$ cm³. b) $1{,}8 \times 1\,452 = 2\,613{,}6$ g $\approx 2{,}6$ kg. c) $12$
      briques $\approx 31$ kg : lourd mais portable sur une courte distance.'
  - numero: 28
    etoiles: 2
    enonce: 'On double l''arête d''un cube. a) Par combien son aire totale est-elle multipliée ? b) Et
      son volume ? c) Explique le lien avec les exposants $2$ et $3$.


      ### ★★★ Défis de maîtrise'
    correction: a) $\times 4$ (aire totale $6c^{2}$). b) $\times 8$ (volume $c^{3}$). c) L'aire dépend
      du carré de la longueur, le volume de son cube.
  - numero: 29
    etoiles: 3
    enonce: 'a) Montre que si l''on double le côté d''un carré, son périmètre double mais son aire est
      multipliée par $4$. b) Montre que doubler le rayon d''un disque multiplie son aire par $4$, et que
      doubler l''arête d''un cube multiplie son volume par $8$. c) Énonce la règle générale pour un agrandissement
      de rapport $k$ : longueurs, aires, volumes ? d) Un bidon contient $5$ L : quelle est la contenance
      d''un bidon de même forme dont toutes les dimensions sont triples ?'
    correction: 'On compare les formules avant et après. a) $4c \to 8c$ ($\times 2$) ; $c^{2} \to \left(2c\right)^{2}
      = 4c^{2}$ ($\times 4$). b) $\pi r^{2} \to \pi\left(2r\right)^{2} = 4\pi r^{2}$ ; $c^{3} \to 8c^{3}$.
      c) Rapport $k$ : longueurs $\times k$, aires $\times k^{2}$, volumes $\times k^{3}$ ; l''exposant
      est le nombre de dimensions. d) $k = 3$ : $5 \times 27 = 135$ L.'
  - numero: 30
    etoiles: 3
    enonce: 'Un château d''eau est formé d''un cylindre de rayon $1{,}5$ m et de hauteur $4$ m, surmonté
      d''un cône de même rayon et de hauteur $1{,}2$ m. a) Calcule le volume du cylindre, puis celui du
      cône, en valeur exacte. b) Donne le volume total en valeur exacte, puis au dixième de m³ avec $\pi
      \approx 3{,}14$. c) Exprime ce volume en litres. d) Le forage débite $30$ L par minute : en combien
      de temps remplit-il le château vide ? Réponse en heures et minutes.'
    correction: On garde $\pi$ jusqu'au bout et on n'arrondit qu'à la fin. a) $V_{1} = \pi \times 2{,}25
      \times 4 = 9\pi$ m³ ; $V_{2} = \frac{1}{3}\pi \times 2{,}25 \times 1{,}2 = 0{,}9\pi$ m³. b) $9{,}9\pi
      \approx 31{,}1$ m³. c) $\approx 31\,086$ L. d) $31\,086 \div 30 \approx 1\,036$ min $= 17$ h $16$
      min.
  - numero: 31
    etoiles: 3
    enonce: 'Mariam devait traiter cet énoncé : « un terrain rectangulaire mesure $45$ m sur $28$ m ;
      calculer la longueur de grillage nécessaire pour le clôturer, puis son aire en hectares. » Voici
      sa copie.


      > Ligne 1 : Périmètre $= 45 \times 28 = 1\,260$ m

      > Ligne 2 : Aire $= 2 \times \left(45 + 28\right) = 146$ m²

      > Ligne 3 : $146$ m² $= 1{,}46$ ha, car $1$ ha $= 100$ m²

      > Ligne 4 : Il faut donc $1\,260$ m de grillage pour un terrain de $1{,}46$ ha.


      Trois erreurs se cachent dans cette copie. Nomme-les, puis refais tout le travail. Indique en une
      phrase le réflexe qui aurait permis à Mariam de repérer seule sa première erreur.'
    correction: 'Le réflexe est celui des **unités** : multiplier deux longueurs donne des m², jamais
      des m. Ligne 1 : $45 \times 28$ est l''aire, pas le périmètre. Ligne 2 : $2\left(L + l\right)$ est
      le périmètre. Ligne 3 : $1$ ha $= 10\,000$ m². Correction : $P = 2 \times 73 = 146$ m de grillage
      ; $A = 1\,260$ m² $= 0{,}126$ ha.'
  - numero: 32
    etoiles: 3
    enonce: Boukary dispose de $60$ m de grillage pour clôturer un enclos rectangulaire. a) Donne trois
      couples de dimensions possibles et les aires correspondantes. b) Parmi les dimensions entières,
      lesquelles donnent la plus grande aire ? c) S'il adosse l'enclos à un long mur, le grillage ne servant
      que pour trois côtés, quelles dimensions entières donnent alors la plus grande aire ? d) Compare
      les deux aires maximales et commente.
    correction: 'Le périmètre impose $L + l = 30$. a) $5 \times 25 = 125$ m² ; $10 \times 20 = 200$ m²
      ; $14 \times 16 = 224$ m². b) Maximum pour $15 \times 15$ : $225$ m² (le carré). c) Avec $x + 2y
      = 60$ : $y = 14 \to 448$ m² ; $y = 15 \to 450$ m² ; $y = 16 \to 448$ m². Maximum $450$ m² ($30$
      m sur $15$ m). d) $450$ contre $225$ : le mur fournit un côté gratuit, la surface double.'
  - numero: 33
    etoiles: 3
    enonce: 'Un maçon doit carreler une salle rectangulaire de $6{,}4$ m sur $4{,}8$ m avec des carreaux
      carrés de $40$ cm de côté. Les carreaux sont vendus par boîtes de $6$, à $7\,500$ FCFA la boîte,
      et le maçon prévoit $5\,\%$ de casse. Combien de boîtes doit-il acheter, et pour quel montant ?
      Aucune sous-question : organise ta recherche et justifie chaque arrondi.'
    correction: 'On compte par rangées plutôt que par les aires : cela vérifie que les carreaux tombent
      juste. $640 \div 40 = 16$ et $480 \div 40 = 12$, soit $16 \times 12 = 192$ carreaux (contrôle :
      $30{,}72 \div 0{,}16 = 192$ ✓). Casse : $192 \times 1{,}05 = 201{,}6 \to 202$ carreaux, arrondi
      **par excès** sous peine de pièce inachevée. $202 = 6 \times 33 + 4$, donc $34$ boîtes, soit $34
      \times 7\,500 = 255\,000$ FCFA.'
  - numero: 34
    etoiles: 3
    enonce: 'a) Un triangle a une aire de $84$ cm² et une hauteur de $12$ cm : quelle est la base correspondante
      ? b) Un cylindre de hauteur $5$ dm a un volume de $45\pi$ dm³ : quel est son rayon ? c) Un trapèze
      d''aire $126$ cm² a une hauteur de $12$ cm et une petite base de $8$ cm : quelle est sa grande base
      ? d) Le volume d''un cube est $216$ cm³ : quelle est son arête, et l''aire totale de ses six faces
      ?'
    correction: 'On écrit la formule, puis on remonte à la donnée manquante. a) $b = \frac{2 \times 84}{12}
      = 14$ cm. b) $45\pi = \pi r^{2} \times 5$, donc $r^{2} = 9$ et $r = 3$ dm. c) $126 = 6\left(8 +
      B\right)$, donc $B = 13$ cm. d) $c = 6$ cm ; aire totale $6 \times 36 = 216$ cm² (même nombre, unité
      différente : coïncidence).'
  fiche_revision:
  - '**Aires.** Rectangle $L \times l$ ; carré $c^{2}$ ; parallélogramme $b \times h$ ; triangle $\frac{b
    \times h}{2}$ ; trapèze $\frac{\left(b + B\right)h}{2}$ ; disque $\pi r^{2}$.'
  - '**Périmètres.** Rectangle $2\left(L + l\right)$ ; carré $4c$ ; cercle $2\pi r$. Périmètre en cm,
    aire en cm².'
  - '**Hauteur.** Toujours perpendiculaire à la base choisie, jamais le côté incliné.'
  - '**Volumes.** Pavé $L \times l \times h$ ; cube $c^{3}$ ; prisme et cylindre base $\times h$ ($\pi
    r^{2}h$) ; pyramide et cône $\frac{1}{3}$ base $\times h$ ; boule $\frac{4}{3}\pi r^{3}$.'
  - '**Conversions.** Longueurs $\times 10$ par rang ; aires $\times 100$ ; volumes $\times 1\,000$. $1$
    L $= 1$ dm³ ; $1$ m³ $= 1\,000$ L ; $1$ ha $= 10\,000$ m².'
  - '**Réflexes.** Formule en toutes lettres, même unité partout, valeur exacte avec $\pi$, ordre de grandeur
    pour contrôler.'
  trouve_erreur:
  - faux: '« Aire du rectangle : $2 \times \left(14 + 8\right) = 44$ cm². »'
    correction: C'est le **périmètre**. Aire $= 14 \times 8 = 112$ cm².
  - faux: « $1$ m² $= 100$ cm² »
    correction: $1$ m² $= 100 \times 100 = 10\,000$ cm².
  - faux: '« Aire du disque de diamètre $10$ : $\pi \times 10^{2}$ »'
    correction: 'La formule utilise le **rayon** : $r = 5$, $A = 25\pi$.'
  - faux: '« Volume du cône : $\pi r^{2} h$ »'
    correction: 'Solide pointu : $V = \frac{1}{3}\pi r^{2} h$.'
  cartographie_lacunes:
  - lacune: Formules de périmètre/aire/volume confondues, conversions d'unités fausses
    bloque_en: ch. 6, 20
  source_path: remediation\3eme\modules_c\M11.md
- niveau: 3eme
  module: 12
  module_titre: Repérage, translations et vecteurs
  pourquoi: 'Le repère et les vecteurs sont les outils centraux de la 3ème : colinéarité, coordonnées,
    équations de droites. Tout cela repose sur trois acquis : lire des coordonnées, comprendre la translation,
    savoir ce qu''est l''égalité de deux vecteurs.'
  diagnostic:
  - question: 'Sur une droite graduée, $A\left(-2\right)$ et $B\left(4\right)$ : abscisse du milieu de
      $\left[AB\right]$ ?'
    reponse: $\frac{-2 + 4}{2} = 1$
  - question: '$M\left(3\,;\,-2\right)$ : quelle est son abscisse ? son ordonnée ?'
    reponse: abscisse $3$ ; ordonnée $-2$
  - question: Coordonnées du milieu de $\left[AB\right]$ avec $A\left(2\,;\,1\right)$ et $B\left(6\,;\,4\right)$
      ?
    reponse: $\left(4\,;\,2{,}5\right)$
  - question: '$ABCD$ est un parallélogramme. Complète : $\overrightarrow{AB} = \overrightarrow{\dots}$'
    reponse: $\overrightarrow{DC}$
  - question: 'Simplifie : $\overrightarrow{AB} + \overrightarrow{BC}$ ; puis $\overrightarrow{MN} + \overrightarrow{NP}
      + \overrightarrow{PM}$.'
    reponse: $\overrightarrow{AC}$ ; $\vec{0}$
  lecons:
  - id: 3eme_M12_L1
    numero: '12.1'
    titre: Repérage sur une droite et dans le plan
    retenir:
    - Sur une droite graduée, chaque point a une **abscisse**, nombre relatif. La **distance** entre deux
      points est la plus grande abscisse moins la plus petite.
    - 'Abscisse du **milieu** de $\left[AB\right]$ : la demi-somme.'
    - 'Dans le plan, un **repère** est formé de deux droites graduées sécantes en $O$ : axe des **abscisses**
      (horizontal), axe des **ordonnées**. Il est **orthogonal** si les axes sont perpendiculaires.'
    - 'Chaque point a un couple $M\left(x\,;\,y\right)$ : abscisse d''abord, ordonnée ensuite. Un point
      de l''axe des abscisses s''écrit $\left(x\,;\,0\right)$, un point de l''axe des ordonnées $\left(0\,;\,y\right)$.'
    - '**Milieu dans le plan** : demi-somme coordonnée par coordonnée.'
    methode:
      titre: Placer un point et lire ses coordonnées
      etapes:
      - 'Pour placer $M\left(x\,;\,y\right)$ : de $O$, avance horizontalement de $x$ (à droite si $x >
        0$).'
      - De là, déplace-toi verticalement de $y$ (vers le haut si $y > 0$) et marque une croix.
      - 'Pour lire : la verticale passant par $M$ coupe l''axe horizontal sur l''abscisse.'
      - L'horizontale passant par $M$ donne l'ordonnée. Écris le couple dans l'ordre.
    exemple_resolu: 'Sur le plan de Ziniaré (unité : $100$ mètres), l''école est en $E\left(-3\,;\,2\right)$
      et le dispensaire en $D\left(5\,;\,6\right)$. Où placer un poste de vaccination à mi-chemin ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | « À mi-chemin » = milieu de $\left[ED\right]$ ; demi-somme des abscisses. | $x_{I} = \frac{-3
      + 5}{2} = 1$ |

      | Demi-somme des ordonnées. | $y_{I} = \frac{2 + 6}{2} = 4$ |

      | On conclut dans le contexte. | Le poste sera en $I\left(1\,;\,4\right)$ |

      | **Vérification :** $I$ est bien encadré par les deux bâtiments. ✓ | |'
    erreurs_frequentes:
    - erreur: échanger les deux coordonnées.
      correction: abscisse d'abord ; $\left(3\,;\,-2\right)$ et $\left(-2\,;\,3\right)$ sont deux points
        **différents**.
    - erreur: perdre le signe dans la demi-somme.
      correction: 'elle marche avec les relatifs : milieu de $A\left(-5\right)$ et $B\left(3\right)$ :
        $\frac{-5 + 3}{2} = -1$.'
    declic: null
    figures:
    - figures/m12_f2.svg
  - id: 3eme_M12_L2
    numero: '12.2'
    titre: La translation et le vecteur
    retenir:
    - 'La **translation** qui transforme $A$ en $B$ déplace chaque point comme $A$ va vers $B$ : même
      direction (la droite $\left(AB\right)$), même sens, même longueur $AB$. Rien ne tourne : la figure
      glisse.'
    - Elle **conserve** longueurs, angles, aires, parallélisme et alignement.
    - Ce triple renseignement (direction, sens, longueur) est le **vecteur** $\overrightarrow{AB}$.
    - '**Vecteur nul** : $\vec{0} = \overrightarrow{AA}$. **Opposé** de $\overrightarrow{AB}$ : $\overrightarrow{BA}
      = -\overrightarrow{AB}$.'
    - '**Égalité** : $\overrightarrow{AB} = \overrightarrow{CD}$ signifie même direction, même sens, même
      longueur.'
    methode:
      titre: Construire l'image d'un point par une translation
      etapes:
      - La translation est donnée par un vecteur $\overrightarrow{AB}$, la flèche modèle.
      - 'Pour l''image $M''$ de $M$ : trace la parallèle à $\left(AB\right)$ passant par $M$.'
      - Reporte au compas la longueur $AB$ à partir de $M$, **dans le sens de $A$ vers $B$**.
      - 'Contrôle : $ABM''M$ est un parallélogramme.'
    exemple_resolu: '$ABDC$ est un parallélogramme. Démontre que la translation de vecteur $\overrightarrow{AB}$
      transforme $C$ en $D$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On part de l''hypothèse. | $ABDC$ est un parallélogramme |

      | On cite la propriété, ordre des lettres compris. | $ABDC$ parallélogramme $\iff \overrightarrow{AB}
      = \overrightarrow{CD}$ |

      | Une égalité de vecteurs se relit comme une translation. | La translation de vecteur $\overrightarrow{AB}$
      envoie $C$ sur $D$ |

      | **Vérification :** $\left[AB\right]$ et $\left[CD\right]$ sont deux côtés opposés parcourus dans
      le même sens. ✓ | |'
    erreurs_frequentes:
    - erreur: « $ABCD$ parallélogramme donc $\overrightarrow{AB} = \overrightarrow{CD}$ ».
      correction: c'est $\overrightarrow{AB} = \overrightarrow{DC}$ ; $\overrightarrow{CD}$ est l'opposé.
    - erreur: conclure $\overrightarrow{AB} = \overrightarrow{CD}$ de la seule égalité $AB = CD$.
      correction: il manque la direction et le sens.
    declic: null
    figures:
    - figures/m12_f6.svg
  - id: 3eme_M12_L3
    numero: '12.3'
    titre: Somme de vecteurs et relation de Chasles
    retenir:
    - Enchaîner la translation de vecteur $\vec{u}$ puis celle de vecteur $\vec{v}$ revient à une **seule**
      translation, de vecteur $\vec{u} + \vec{v}$.
    - '**Relation de Chasles.** Pour tous points $A$, $B$, $C$ :'
    - '**Construire $\vec{u} + \vec{v}$** : flèches **bout à bout** ; la somme va du premier départ à
      la dernière pointe. Si les deux flèches partent du même point, la somme est la **diagonale du parallélogramme**.'
    - $\overrightarrow{AB} + \overrightarrow{BA} = \vec{0}$ ; et $I$ est le **milieu** de $\left[AB\right]$
      si et seulement si $\overrightarrow{AI} = \overrightarrow{IB}$, d'où $\overrightarrow{AB} = 2\,\overrightarrow{AI}$.
    methode:
      titre: Simplifier une somme de vecteurs avec Chasles
      etapes:
      - Repère les **lettres qui se suivent** (fin d'un vecteur $=$ début du suivant).
      - Remplace chaque enchaînement $\overrightarrow{XY} + \overrightarrow{YZ}$ par $\overrightarrow{XZ}$.
      - Sinon, **réordonne** la somme, ou **décompose** un vecteur ($\overrightarrow{AC} = \overrightarrow{AB}
        + \overrightarrow{BC}$) pour faire apparaître un relais.
      - Une somme qui revient à son point de départ vaut $\vec{0}$.
    exemple_resolu: 'Simplifie $\vec{w} = \overrightarrow{MN} + \overrightarrow{PQ} + \overrightarrow{NP}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Aucun relais dans l''ordre donné : on réordonne. | $\vec{w} = \overrightarrow{MN} + \overrightarrow{NP}
      + \overrightarrow{PQ}$ |

      | On efface le relais $N$. | $\overrightarrow{MN} + \overrightarrow{NP} = \overrightarrow{MP}$ |

      | Puis le relais $P$. | $\vec{w} = \overrightarrow{MP} + \overrightarrow{PQ} = \overrightarrow{MQ}$
      |

      | **Vérification :** départ $M$, arrivée $Q$. ✓ | |'
    erreurs_frequentes:
    - erreur: appliquer Chasles quand la lettre du milieu ne se répète pas, comme dans $\overrightarrow{AB}
        + \overrightarrow{CB}$.
      correction: remplace d'abord $\overrightarrow{CB}$ par $-\overrightarrow{BC}$.
    - erreur: écrire $\overrightarrow{AB} + \overrightarrow{BA} = 0$, ou confondre $AB$ et $\overrightarrow{AB}$.
      correction: une somme de vecteurs est un vecteur, donc $\vec{0}$ ; $AB$ est une longueur, un nombre
        positif.
    declic: 'Chasles, c''est le trajet du car — Ouaga $\to$ Koudougou puis Koudougou $\to$ Bobo : au total,
      Ouaga $\to$ Bobo. Quand une somme te résiste, dessine les flèches bout à bout et suis le trajet
      du doigt.'
    figures:
    - figures/m12_f10.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Sur une droite graduée (1 carreau $= 1$ unité), place $A\left(-3\right)$, $B\left(5\right)$,
      $C\left(-0{,}5\right)$. a) Calcule $AB$ et $AC$. b) Calcule l'abscisse du milieu de $\left[AB\right]$,
      puis celle du milieu de $\left[AC\right]$.
    correction: a) $AB = 5 - \left(-3\right) = 8$ ; $AC = 2{,}5$. b) $\frac{-3 + 5}{2} = 1$ ; $\frac{-3
      - 0{,}5}{2} = -1{,}75$.
  - numero: 2
    etoiles: 1
    enonce: Dans un repère orthogonal, place $A\left(2\,;\,3\right)$, $B\left(-4\,;\,1\right)$, $C\left(0\,;\,-2\right)$
      et $D\left(3\,;\,0\right)$. Quels points sont sur les axes ?
    correction: $C\left(0\,;\,-2\right)$ sur l'axe des ordonnées ; $D\left(3\,;\,0\right)$ sur l'axe des
      abscisses.
  - numero: 3
    etoiles: 1
    enonce: 'Coordonnées du milieu de $\left[MN\right]$ : a) $M\left(1\,;\,7\right)$ et $N\left(5\,;\,3\right)$
      ; b) $M\left(-3\,;\,2\right)$ et $N\left(4\,;\,-6\right)$.'
    correction: a) $\left(3\,;\,5\right)$. b) $\left(\frac{1}{2}\,;\,-2\right)$.
  - numero: 4
    etoiles: 1
    enonce: $I\left(1\,;\,2\right)$ est le milieu de $\left[AB\right]$ et $A\left(-2\,;\,5\right)$. Calcule
      les coordonnées de $B$.
    correction: '$\frac{-2 + x_{B}}{2} = 1$ et $\frac{5 + y_{B}}{2} = 2$ : $B\left(4\,;\,-1\right)$.'
  - numero: 5
    etoiles: 1
    enonce: Trace un triangle $ABC$ ($AB = 5$ cm, $BC = 4$ cm, $AC = 6$ cm) et un vecteur $\vec{u}$ quelconque
      (flèche de $3$ cm). Construis l'image $A'B'C'$ du triangle par la translation de vecteur $\vec{u}$.
