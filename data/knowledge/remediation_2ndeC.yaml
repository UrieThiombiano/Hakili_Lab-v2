      > Ligne 1 : $x_{I} = \frac{-3 - 5}{2} = -4$

      > Ligne 2 : $y_{I} = \frac{2 - 4}{2} = -1$

      > Ligne 3 : donc $I\left(-4\,;\,-1\right)$

      > Ligne 4 : $AB = \left(5 - \left(-3\right)\right)^{2} + \left(-4 - 2\right)^{2}$

      > Ligne 5 : $AB = 64 + 36 = 100$


      Repère les lignes fausses, explique en une phrase ce qui casse dans chacune, puis refais le calcul
      proprement.'
    correction: 'On relit ligne à ligne en cherchant quelle règle est appliquée. **Ligne 1 fausse** :
      demi-différence au lieu de demi-somme, il fallait $x_{I} = \frac{-3 + 5}{2} = 1$. **Ligne 2** :
      résultat juste par chance, l''ordonnée de $B$ étant déjà négative. **Ligne 3 fausse**, elle reprend
      l''abscisse erronée. **Ligne 5 fausse** : la racine a disparu, c''est $AB^{2}$ qui est calculé.
      Reprise : $I\left(1\,;\,-1\right)$ et $AB = \sqrt{64 + 36} = 10$.'
  - numero: 35
    etoiles: 3
    enonce: 'Le centre de santé de Nanoro prépare une tournée : un hameau y est inscrit s''il est à $5$
      km au plus du centre. Sur la carte, à carreaux de $1$ km de côté, le centre est l''origine. Le premier
      hameau est à $4$ km à l''est et $3$ km au nord, le deuxième à $2$ km à l''ouest et $6$ km au sud,
      le troisième à $1$ km à l''est et $4$ km au nord. Le centre dispose de $18$ lits et la campagne
      se déroule du $3$ au $7$ mars. Arrête la liste de la tournée, en justifiant chaque cas.'
    correction: 'Carreaux carrés : repère orthonormal d''unité $1$ km, origine au centre. Les hameaux
      sont en $\left(4\,;\,3\right)$, $\left(-2\,;\,-6\right)$ et $\left(1\,;\,4\right)$. Plutôt que trois
      racines, on compare les **carrés** des distances à $5^{2} = 25$. Premier : $16 + 9 = 25$, exactement
      $5$ km, il entre. Deuxième : $4 + 36 = 40 > 25$, il sort. Troisième : $1 + 16 = 17 < 25$, il entre.
      **Le major inscrit le premier et le troisième hameau**, en signalant que le premier est à la limite
      exacte. Les $18$ lits et les dates sont des données parasites.'
  - numero: 36
    etoiles: 3
    enonce: 'Sur le plan d''un lotissement de Ziniaré, la conduite suit $\left(d\right) : y = 2x - 3$,
      l''unité valant $10$ m. Trois bornes sont en $A\left(2\,;\,1\right)$, $B\left(4\,;\,5\right)$ et
      $C\left(5\,;\,8\right)$. a) Lesquelles sont sur la conduite ? b) Un regard est creusé au milieu
      des deux bornes qui y sont : donne ses coordonnées et vérifie qu''il tombe sur $\left(d\right)$.
      c) Quelle longueur réelle de tuyau sépare ces deux bornes ?'
    correction: 'a) $2 \times 2 - 3 = 1 = y_{A}$ et $2 \times 4 - 3 = 5 = y_{B}$ : $A$ et $B$ sont sur
      la conduite. Pour $C$, $2 \times 5 - 3 = 7 \neq 8$ : il est un carreau trop haut. b) Milieu de $\left[AB\right]$
      : $\left(3\,;\,3\right)$, et $2 \times 3 - 3 = 3$, il tombe bien sur $\left(d\right)$. c) $AB =
      \sqrt{4 + 16} = 2\sqrt{5}$ carreaux, soit $20\sqrt{5}$ m, un peu plus de $44$ m.'
  fiche_revision:
  - '**Coordonnées.** $M\left(x\,;\,y\right)$, abscisse en premier. Ordonnée nulle : axe des abscisses
    ; abscisse nulle : axe des ordonnées.'
  - '**Repère orthonormal.** Axes perpendiculaires **et** même unité : condition d''existence de toutes
    les formules de longueur.'
  - '**Symétriques.** Axe des abscisses : $\left(x\,;\,-y\right)$. Axe des ordonnées : $\left(-x\,;\,y\right)$.
    Origine : $\left(-x\,;\,-y\right)$.'
  - '**Milieu.** $x_{I} = \frac{x_{A} + x_{B}}{2}$, $y_{I} = \frac{y_{A} + y_{B}}{2}$. Dans l''autre sens
    : $x_{B} = 2x_{I} - x_{A}$.'
  - '**Distance.** $AB = \sqrt{\left(x_{B} - x_{A}\right)^{2} + \left(y_{B} - y_{A}\right)^{2}}$ : deux
    différences, deux carrés, une somme, une racine. Valeur exacte simplifiée.'
  - '**Nature d''un triangle.** Deux longueurs égales : isocèle. Plus grand carré égal à la somme des
    deux autres : rectangle.'
  - '**Équation de droite.** $M$ est sur $\left(d\right) : y = ax + b$ si et seulement si $y_{M} = a x_{M}
    + b$. Verticale : $x = c$ ; horizontale : $y = c$.'
  trouve_erreur:
  - faux: 'Milieu de $A\left(-4\,;\,2\right)$ et $B\left(6\,;\,-8\right)$ : $I\left(5\,;\,-5\right)$'
    correction: 'Demi-**différence** au lieu de demi-somme : $I\left(1\,;\,-3\right)$.'
  - faux: $M\left(2\,;\,-1\right)$ milieu de $\left[AB\right]$, $B\left(5\,;\,3\right)$, donc $x_{A} =
      \frac{2 + 5}{2}$
    correction: 'Double du milieu moins le point connu : $x_{A} = 2 \times 2 - 5 = -1$.'
  - faux: $A\left(1\,;\,2\right)$, $B\left(4\,;\,6\right)$, donc $AB = \left
    correction: 1 - 4\right
  - faux: '$P\left(3\,;\,4\right)$ et $\left(d\right) : y = 2x + 1$ ; $2 \times 4 + 1 = 9$'
    correction: 'On a remplacé $x$ par l''ordonnée : $2 \times 3 + 1 = 7 \neq 4$, $P$ n''est pas sur $\left(d\right)$.'
  cartographie_lacunes:
  - lacune: Repérage mal tenu, milieu et distance oubliés
    bloque_en: vecteurs, géométrie plane
  source_path: remediation\2ndeC\modules_c\M06.md
- niveau: 2ndeC
  module: 7
  module_titre: Vecteurs du plan
  pourquoi: 'Trois gestes font échouer les copies : l''ordre des lettres dans une égalité de vecteurs,
    la relation de Chasles appliquée à deux vecteurs qui ne se suivent pas, et la confusion entre alignement
    et parallélisme. Tu connais ces règles, c''est leur application qui dérape.'
  diagnostic:
  - question: 'ABCD est un parallélogramme. Complète : $\overrightarrow{AB} = \ldots$ et $\overrightarrow{AD}
      = \ldots$'
    reponse: $\overrightarrow{AB} = \overrightarrow{DC}$ et $\overrightarrow{AD} = \overrightarrow{BC}$
  - question: 'Simplifie : $\overrightarrow{AB} + \overrightarrow{BC} + \overrightarrow{CA}$.'
    reponse: $\overrightarrow{AA} = \vec{0}$
  - question: I est le milieu de $\left[AB\right]$. Écris deux égalités vectorielles qui traduisent cette
      phrase.
    reponse: $\overrightarrow{AI} = \overrightarrow{IB}$, ou $\overrightarrow{IA} + \overrightarrow{IB}
      = \vec{0}$
  - question: On donne $\overrightarrow{AC} = -3\overrightarrow{AB}$. Que dire des points A, B et C ?
    reponse: A, B, C alignés ; coefficient négatif, donc B et C de part et d'autre de A
  - question: $A\left(1\,;\,-2\right)$ et $B\left(4\,;\,3\right)$. Coordonnées de $\overrightarrow{AB}$
      ?
    reponse: $\left(3\,;\,5\right)$
  lecons:
  - id: 2ndeC_M07_L1
    numero: '7.1'
    titre: Vecteur et égalité de deux vecteurs
    retenir:
    - 'Deux bipoints sont **équipollents** s''ils ont même direction, même sens, même longueur : les trois
      à la fois. Le **vecteur** $\overrightarrow{AB}$ est ce qu''ils ont en commun ; chaque flèche est
      un **représentant**, un vecteur en a une infinité et **aucune position**.'
    - $AB$ sans flèche est un **nombre** (une longueur) ; $\overrightarrow{AB}$ est un **déplacement**.
    - $\overrightarrow{AB} = \overrightarrow{CD} \iff$ **ABDC** est un parallélogramme. ABCD parallélogramme
      $\iff \overrightarrow{AB} = \overrightarrow{DC}$ et $\overrightarrow{AD} = \overrightarrow{BC}$.
    - '**Opposé** : $\overrightarrow{BA} = -\overrightarrow{AB}$. **Vecteur nul** : $\vec{0} = \overrightarrow{AA}$.'
    - Si $\overrightarrow{AB} = \overrightarrow{AC}$, alors $B = C$.
    methode:
      titre: Reporter un vecteur à partir d'une origine M
      etapes:
      - Trace la parallèle à $\left(AB\right)$ passant par M.
      - 'Reporte la longueur $AB$ depuis M, du côté vers lequel pointe la flèche : c''est N.'
      - 'Contrôle : ABNM est un parallélogramme, donc $\overrightarrow{MN} = \overrightarrow{AB}$.'
    exemple_resolu: 'Trois piquets A, B, C avec $AB = 12$ m et $AC = 9$ m. On plante D tel que $\overrightarrow{CD}
      = \overrightarrow{AB}$. Longueur de corde pour faire le tour du quadrilatère ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux vecteurs égaux ont même longueur. | $CD = AB = 12$ m |

      | L''égalité nomme la figure : c''est ABDC, pas ABCD. | ABDC parallélogramme, donc $BD = AC = 9$
      m |

      | On additionne les côtés deux à deux. | $P = 2 \times \left(12 + 9\right) = 42$ m |

      | **Vérification :** $12 + 9 + 12 + 9 = 42$. ✓ | |


      [SVG: figures/m07_f1.svg]

      *Figure 7.1 : Deux bipoints équipollents, et le parallélogramme ABDC qu''ils forment.*'
    erreurs_frequentes:
    - erreur: « $\overrightarrow{AB} = \overrightarrow{CD}$, donc ABCD est un parallélogramme ».
      correction: c'est **ABDC** ; avec ABCD le tracé se croise.
    - erreur: conclure à l'égalité parce que les longueurs sont égales.
      correction: il faut aussi la direction et le sens ; $\overrightarrow{AB}$ et $\overrightarrow{BA}$
        ont même longueur et ne sont pas égaux.
    declic: null
    figures:
    - figures/m07_f1.svg
  - id: 2ndeC_M07_L2
    numero: '7.2'
    titre: Chasles, milieu et parallélogramme
    retenir:
    - '**Chasles :** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$. La lettre commune
      doit être à l''arrivée du premier et au départ du second ; elle s''efface. Enchaînable : $\overrightarrow{AB}
      + \overrightarrow{BC} + \overrightarrow{CD} = \overrightarrow{AD}$.'
    - '**Règle du parallélogramme** (mêmes origines) : $\overrightarrow{AB} + \overrightarrow{AC} = \overrightarrow{AD}$,
      où ABDC est un parallélogramme.'
    - 'Addition **commutative** et **associative** : on échange deux termes, jamais les deux lettres d''un
      vecteur.'
    - '**Soustraire, c''est ajouter l''opposé** : $\overrightarrow{JK} - \overrightarrow{MK} = \overrightarrow{JK}
      + \overrightarrow{KM} = \overrightarrow{JM}$.'
    methode:
      titre: Simplifier une écriture vectorielle
      etapes:
      - Remplace $-\overrightarrow{XY}$ par $+\overrightarrow{YX}$.
      - Réorganise pour que deux vecteurs se suivent (arrivée de l'un = départ de l'autre).
      - Applique Chasles à ce couple, puis recommence.
      - Reconnais $\vec{0}$ si départ et arrivée sont confondus.
    exemple_resolu: 'Simplifier $\overrightarrow{MA} + \overrightarrow{BM} + \overrightarrow{AB}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Aucun couple ne se suit : on réorganise. | $\overrightarrow{MA} + \overrightarrow{AB} + \overrightarrow{BM}$
      |

      | Chasles sur les deux premiers, grâce au A. | $\overrightarrow{MA} + \overrightarrow{AB} = \overrightarrow{MB}$
      |

      | Il reste deux vecteurs qui se suivent grâce au B. | $\overrightarrow{MB} + \overrightarrow{BM}
      = \overrightarrow{MM} = \vec{0}$ |

      | **Vérification :** circuit fermé M → A → B → M. ✓ | |


      [SVG: figures/m07_f3.svg]

      *Figure 7.3 : La somme de deux vecteurs, bout à bout puis par la règle du parallélogramme.*'
    erreurs_frequentes:
    - erreur: $\overrightarrow{AB} - \overrightarrow{AC} = \overrightarrow{BC}$.
      correction: $\overrightarrow{AB} - \overrightarrow{AC} = \overrightarrow{CA} + \overrightarrow{AB}
        = \overrightarrow{CB}$, l'opposé.
    - erreur: traduire « M milieu de $\left[AB\right]$ » par $\overrightarrow{AM} = \overrightarrow{BM}$.
      correction: c'est $\overrightarrow{AM} = \overrightarrow{MB}$ ; l'écriture fautive donnerait $A
        = B$.
    declic: 'la lettre commune, avant d''écrire quoi que ce soit — $\overrightarrow{AB} + \overrightarrow{AC}$
      ne se simplifie pas : A est le départ des deux. La **différence**, elle, se simplifie toujours :
      $\overrightarrow{AC} - \overrightarrow{AB} = \overrightarrow{BA} + \overrightarrow{AC} = \overrightarrow{BC}$.
      Avant d''effacer une lettre, vérifie qu''elle est à l''arrivée de l''un et au départ de l''autre.'
    figures:
    - figures/m07_f3.svg
  - id: 2ndeC_M07_L3
    numero: '7.3'
    titre: Produit par un réel, colinéarité, alignement
    retenir:
    - $k\vec{u}$ a la **même direction** que $\vec{u}$ ; **même sens** si $k > 0$, **sens contraire**
      si $k < 0$.
    - 'Sa **longueur** est $\left|k\right|$ fois celle de $\vec{u}$ : une longueur n''est jamais négative.'
    - $0\vec{u} = \vec{0}$ (le vecteur nul, pas le nombre $0$), $\left(-1\right)\vec{u} = -\vec{u}$.
    - 'On développe, factorise et réduit comme sur les nombres : $k\left(\vec{u} + \vec{v}\right) = k\vec{u}
      + k\vec{v}$, $k\left(k''\vec{u}\right) = \left(kk''\right)\vec{u}$.'
    methode:
      titre: Démontrer un alignement ou un parallélisme
      etapes:
      - 'Choisis les deux vecteurs : même origine pour un alignement, un par droite pour un parallélisme.'
      - Fabrique-les par Chasles, en passant par le point relié à toutes les données.
      - Factorise pour faire apparaître $k$.
      - Conclus par la caractérisation, en nommant alignement ou parallélisme.
    exemple_resolu: 'ABC est un triangle, $\overrightarrow{AM} = \frac{3}{4}\overrightarrow{AC}$ et $\overrightarrow{AN}
      = \frac{3}{4}\overrightarrow{AB}$. Montrer que $\left(MN\right) \parallel \left(BC\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On fabrique $\overrightarrow{MN}$ en passant par A. | $\overrightarrow{MN} = \overrightarrow{MA}
      + \overrightarrow{AN}$ |

      | On remplace ; $\overrightarrow{MA}$ est l''opposé de $\overrightarrow{AM}$. | $\overrightarrow{MN}
      = -\frac{3}{4}\overrightarrow{AC} + \frac{3}{4}\overrightarrow{AB}$ |

      | On factorise et on reconnaît une différence. | $\overrightarrow{MN} = \frac{3}{4}\overrightarrow{CB}
      = -\frac{3}{4}\overrightarrow{BC}$, donc $\left(MN\right) \parallel \left(BC\right)$ |

      | **Vérification :** $\left|k\right| = \frac{3}{4}$, donc $MN < BC$. ✓ | |


      [SVG: figures/m07_f6.svg]

      *Figure 7.6 : Selon la valeur de $k$, le point C occupe une position différente sur la droite $\left(AB\right)$.*'
    erreurs_frequentes:
    - erreur: annoncer que $-2\vec{u}$ a pour longueur $-2$ fois celle de $\vec{u}$.
      correction: $\left|-2\right| = 2$ fois ; le signe ne concerne que le sens.
    - erreur: conclure que A, B, C, D sont alignés parce que $\overrightarrow{AB}$ et $\overrightarrow{CD}$
        sont colinéaires.
      correction: origines différentes ; cela prouve seulement $\left(AB\right) \parallel \left(CD\right)$.
    declic: null
    figures:
    - figures/m07_f6.svg
  - id: 2ndeC_M07_L4
    numero: '7.4'
    titre: Coordonnées d'un vecteur
    retenir:
    - 'Dans $\left(O, \vec{i}, \vec{j}\right)$ : $\overrightarrow{AB}\left(x_{B} - x_{A}\,;\,y_{B} - y_{A}\right)$,
      **extrémité moins origine**.'
    - Deux vecteurs sont égaux $\iff$ ils ont les mêmes coordonnées. $\vec{0}\left(0\,;\,0\right)$.
    - 'Milieu I de $\left[AB\right]$ : $\left(\frac{x_{A} + x_{B}}{2}\,;\,\frac{y_{A} + y_{B}}{2}\right)$.'
    - '$\vec{u} + \vec{v}\left(x + x''\,;\,y + y''\right)$ ; $k\vec{u}\left(kx\,;\,ky\right)$ : les **deux**
      coordonnées sont multipliées.'
    - '**Test de colinéarité** de $\vec{u}\left(x\,;\,y\right)$ et $\vec{v}\left(x''\,;\,y''\right)$ :'
    - 'Alignement de A, B, C : test sur $\overrightarrow{AB}$ et $\overrightarrow{AC}$. Parallélisme :
      test sur $\overrightarrow{AB}$ et $\overrightarrow{CD}$.'
    methode:
      titre: Étudier la colinéarité par les coordonnées
      etapes:
      - Calcule les coordonnées des deux vecteurs (extrémité moins origine).
      - Calcule $xy' - yx'$ en surveillant les signes.
      - 'Nul : colinéaires ; non nul : non colinéaires.'
      - 'Traduis : alignement de trois points, ou parallélisme de deux droites.'
    exemple_resolu: '$A\left(-1\,;\,4\right)$, $B\left(0\,;\,2\right)$, $C\left(\frac{1}{2}\,;\,\frac{7}{2}\right)$
      sont-ils alignés ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux vecteurs issus de A. | $\overrightarrow{AB}\left(1\,;\,-2\right)$ et $\overrightarrow{AC}\left(\frac{3}{2}\,;\,-\frac{1}{2}\right)$
      |

      | On croise les coordonnées. | $1 \times \left(-\frac{1}{2}\right) - \left(-2\right) \times \frac{3}{2}
      = \frac{5}{2}$ |

      | Non nul : pas colinéaires. | A, B et C ne sont pas alignés |

      | **Vérification :** $k = \frac{3}{2}$ donnerait $-3$ en ordonnée, et non $-\frac{1}{2}$. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $\overrightarrow{AB}\left(x_{A} - x_{B}\,;\,y_{A} - y_{B}\right)$.
      correction: l'ordre inversé donne $\overrightarrow{BA}$, le vecteur opposé.
    - erreur: pour $\vec{u}\left(3\,;\,-4\right)$, écrire $2\vec{u}\left(6\,;\,-4\right)$.
      correction: $2\vec{u}\left(6\,;\,-8\right)$.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Place trois points E, F et G non alignés. Construis H tel que les bipoints $\left(E, F\right)$
      et $\left(G, H\right)$ soient équipollents. Nature du quadrilatère EFHG ?
    correction: 'Parallèle à $\left(EF\right)$ par G et parallèle à $\left(EG\right)$ par F : leur intersection
      est H. **EFHG est un parallélogramme** (attention à l''ordre : pas EFGH).'
  - numero: 2
    etoiles: 1
    enonce: ABCD est un carré. Parmi $\left(D, C\right)$, $\left(B, A\right)$, $\left(C, D\right)$ et
      $\left(A, D\right)$, lesquels sont équipollents à $\left(A, B\right)$ ? Justifie.
    correction: 'Seul $\left(D, C\right)$ : même direction, même sens, même longueur. $\left(B, A\right)$
      et $\left(C, D\right)$ sont de sens contraire ; $\left(A, D\right)$ n''a pas la bonne direction.'
  - numero: 3
    etoiles: 1
    enonce: 'Vrai ou faux, en justifiant : a) si $\overrightarrow{AB} = \overrightarrow{CD}$, alors $AB
      = CD$ ; b) si $\overrightarrow{AB} = \overrightarrow{BA}$, alors $A = B$ ; c) si $\overrightarrow{AB}
      = \overrightarrow{AC}$, alors $B = C$.'
    correction: 'a) Vrai (vecteurs égaux, longueurs égales). b) Vrai : deux vecteurs opposés égaux sont
      nuls. c) Vrai : même départ, mêmes caractéristiques, donc même arrivée.'
  - numero: 4
    etoiles: 1
    enonce: Dans un parallélogramme ABCD, cite les vecteurs de la figure égaux à $\overrightarrow{BC}$,
      puis ceux de sens contraire à $\overrightarrow{AB}$.
    correction: 'Égal à $\overrightarrow{BC}$ : $\overrightarrow{AD}$. De sens contraire à $\overrightarrow{AB}$
      : $\overrightarrow{BA}$ et $\overrightarrow{CD}$.'
  - numero: 5
    etoiles: 1
    enonce: 'Complète : a) $\overrightarrow{RS} + \ldots = \overrightarrow{RT}$ ; b) $\ldots + \overrightarrow{KL}
      = \overrightarrow{JL}$ ; c) $\overrightarrow{UV} + \overrightarrow{VU} = \ldots$'
    correction: a) $\overrightarrow{ST}$ ; b) $\overrightarrow{JK}$ ; c) $\vec{0}$.
  - numero: 6
    etoiles: 1
    enonce: 'Écris plus simplement : a) $\overrightarrow{AM} + \overrightarrow{MB}$ ; b) $\overrightarrow{AM}
      + \overrightarrow{BA}$ ; c) $\overrightarrow{AM} + \overrightarrow{AA}$ ; d) $\overrightarrow{MA}
      + \overrightarrow{BM} + \overrightarrow{BA}$.'
    correction: a) $\overrightarrow{AB}$ ; b) $\overrightarrow{BA} + \overrightarrow{AM} = \overrightarrow{BM}$
      ; c) $\overrightarrow{AM}$ ; d) $\overrightarrow{BM} + \overrightarrow{MA} = \overrightarrow{BA}$,
      d'où $2\overrightarrow{BA}$.
  - numero: 7
    etoiles: 1
    enonce: 'Calcule : a) $\overrightarrow{RS} - \overrightarrow{TS}$ ; b) $\overrightarrow{RS} - \overrightarrow{RT}$.'
    correction: a) $\overrightarrow{RS} + \overrightarrow{ST} = \overrightarrow{RT}$ ; b) $\overrightarrow{TR}
      + \overrightarrow{RS} = \overrightarrow{TS}$.
  - numero: 8
    etoiles: 1
    enonce: 'Simplifie : $\overrightarrow{EF} + \overrightarrow{GH} + \overrightarrow{FG} + \overrightarrow{HE}$.'
    correction: 'Réorganisé en $\overrightarrow{EF} + \overrightarrow{FG} + \overrightarrow{GH} + \overrightarrow{HE}
      = \overrightarrow{EE} = \vec{0}$ : circuit fermé.'
  - numero: 9
    etoiles: 1
    enonce: 'Écris plus simplement : a) $\overrightarrow{DE} + \overrightarrow{EF} + \overrightarrow{FG}$
      ; b) $\overrightarrow{ST} + \overrightarrow{RS}$ ; c) $\overrightarrow{HI} + \overrightarrow{JH}
      + \overrightarrow{IJ}$.'
    correction: a) $\overrightarrow{DG}$ ; b) $\overrightarrow{RS} + \overrightarrow{ST} = \overrightarrow{RT}$
      ; c) $\overrightarrow{JH} + \overrightarrow{HI} + \overrightarrow{IJ} = \overrightarrow{JJ} = \vec{0}$.
  - numero: 10
    etoiles: 1
    enonce: 'ABCD est un quadrilatère quelconque. Simplifie : $\overrightarrow{AB} + \overrightarrow{BC}
      - \overrightarrow{DC}$.'
    correction: $-\overrightarrow{DC} = \overrightarrow{CD}$, donc la somme est $\overrightarrow{AB} +
      \overrightarrow{BC} + \overrightarrow{CD} = \overrightarrow{AD}$.
  - numero: 11
    etoiles: 1
    enonce: 'K est le milieu de $\left[PQ\right]$. Complète : $\overrightarrow{PK} = \ldots$ et $\overrightarrow{KP}
      + \overrightarrow{KQ} = \ldots$'
    correction: $\overrightarrow{PK} = \overrightarrow{KQ}$ et $\overrightarrow{KP} + \overrightarrow{KQ}
      = \vec{0}$.
  - numero: 12
    etoiles: 1
    enonce: Laquelle de ces égalités caractérise le parallélogramme EFGH ? a) $\overrightarrow{EF} = \overrightarrow{GH}$
      ; b) $\overrightarrow{EF} = \overrightarrow{HG}$ ; c) $\overrightarrow{FE} = \overrightarrow{HG}$.
      Justifie.
    correction: 'b) $\overrightarrow{EF} = \overrightarrow{HG}$ : dans EFGH, les côtés opposés sont $\left[EF\right]$
      et $\left[HG\right]$. a) donnerait le quadrilatère croisé ; c) est b) écrite à l''envers.'
  - numero: 13
    etoiles: 1
    enonce: À Séguénéga, deux villages A et B sont reliés par une piste rectiligne. On veut creuser un
      forage F tel que $\overrightarrow{AF} = \overrightarrow{FB}$. a) Où creuser ? b) Si $AB = 12$ km,
      à quelle distance de A ?
    correction: 'a) $\overrightarrow{AF} = \overrightarrow{FB}$ est la caractérisation du milieu : au
      **milieu de $\left[AB\right]$**. b) $12 \div 2 = 6$ km.'
  - numero: 14
    etoiles: 1
    enonce: 'Complète : le vecteur $-4\vec{u}$ a $\ldots$ direction que $\vec{u}$, son sens est $\ldots$,
      sa longueur vaut $\ldots$ fois celle de $\vec{u}$.'
    correction: '**La même** direction, sens **contraire**, longueur $\left|-4\right| = \mathbf{4}$ fois
      celle de $\vec{u}$.'
  - numero: 15
    etoiles: 1
    enonce: $\vec{i}$ et $\vec{j}$ ne sont pas colinéaires. Parmi $\vec{a} = 2\vec{i} - 3\vec{j}$, $\vec{b}
      = -4\vec{i} + 6\vec{j}$ et $\vec{c} = 2\vec{i} + 3\vec{j}$, quels sont les deux vecteurs colinéaires
      ? Justifie.
    correction: '$\vec{b} = -2\left(2\vec{i} - 3\vec{j}\right) = -2\vec{a}$ : $\vec{a}$ et $\vec{b}$ sont
      **colinéaires**. Pour $\vec{c}$, $k = 1$ imposerait $-3$ et non $+3$.'
  - numero: 16
    etoiles: 1
    enonce: $\vec{i}$ et $\vec{j}$ ne sont pas colinéaires. Trouve $m$ pour que $\vec{u} = 3\vec{i} +
      m\vec{j}$ et $\vec{v} = 12\vec{i} + 20\vec{j}$ soient colinéaires.
    correction: $3k = 12$ donne $k = 4$, puis $4m = 20$, donc $m = 5$.
  - numero: 17
    etoiles: 1
    enonce: On donne $A\left(3\,;\,1\right)$ et $B\left(-2\,;\,4\right)$. Calcule les coordonnées de $\overrightarrow{AB}$,
      puis de $\overrightarrow{BA}$. Que remarques-tu ?
    correction: '$\overrightarrow{AB}\left(-5\,;\,3\right)$ et $\overrightarrow{BA}\left(5\,;\,-3\right)$
      : coordonnées opposées, car $\overrightarrow{BA} = -\overrightarrow{AB}$.'
  - numero: 18
    etoiles: 1
    enonce: 'On donne $\vec{u}\left(3\,;\,-2\right)$ et $\vec{v}\left(-1\,;\,5\right)$. Calcule a) $\vec{u}
      + \vec{v}$ ; b) $-2\vec{u}$ ; c) $\vec{u} - \vec{v}$.


      ### Entraînement ★★'
    correction: a) $\left(2\,;\,3\right)$ ; b) $\left(-6\,;\,4\right)$ ; c) $\left(4\,;\,-7\right)$.
  - numero: 19
    etoiles: 2
    enonce: 'Vrai ou faux, en justifiant : a) deux représentants d''un même vecteur ont la même longueur
      ; b) ils ont la même origine ; c) deux vecteurs de même longueur sont égaux.'
    correction: 'a) Vrai. b) Faux : c''est l''origine qui change, il y en a une par point. c) Faux : il
      faut aussi direction et sens ($\overrightarrow{AB}$ et $\overrightarrow{BA}$).'
  - numero: 20
    etoiles: 2
    enonce: 'À Ouargaye, la boutique est en B, l''école en E, le dispensaire en D. Nafissatou va de B
      à E, puis de E à D. a) Écris son déplacement total comme une somme. b) Simplifie. c) Le lendemain
      elle part de D, passe par E et rejoint B : quel est son déplacement ?'
    correction: 'a) $\overrightarrow{BE} + \overrightarrow{ED}$. b) $= \overrightarrow{BD}$. c) $\overrightarrow{DE}
      + \overrightarrow{EB} = \overrightarrow{DB}$, l''opposé : elle revient sur ses pas.'
  - numero: 21
    etoiles: 2
    enonce: Le point J vérifie $\overrightarrow{JA} = -\overrightarrow{JB}$. Démontre que J est le milieu
      de $\left[AB\right]$.
    correction: 'En ajoutant $\overrightarrow{JB}$ : $\overrightarrow{JA} + \overrightarrow{JB} = \vec{0}$,
      caractérisation du milieu. **J est le milieu de $\left[AB\right]$.**'
  - numero: 22
    etoiles: 2
    enonce: ABC est un triangle, $\overrightarrow{AM} = \frac{1}{3}\overrightarrow{AB}$ et $\overrightarrow{AN}
      = \frac{1}{3}\overrightarrow{AC}$. Démontre que $\left(MN\right)$ et $\left(BC\right)$ sont parallèles.
    correction: '$\overrightarrow{MN} = \overrightarrow{MA} + \overrightarrow{AN} = \frac{1}{3}\left(\overrightarrow{AC}
      - \overrightarrow{AB}\right) = \frac{1}{3}\overrightarrow{BC}$ : colinéaires, donc **$\left(MN\right)
      \parallel \left(BC\right)$**, avec $MN = \frac{1}{3}BC$.'
  - numero: 23
    etoiles: 2
    enonce: 'Étudie la colinéarité par le test : a) $\vec{u}\left(6\,;\,-4\right)$ et $\vec{v}\left(-9\,;\,6\right)$
      ; b) $\vec{w}\left(2\,;\,5\right)$ et $\vec{t}\left(4\,;\,9\right)$.'
    correction: 'a) $36 - 36 = 0$ : **colinéaires** ($\vec{v} = -\frac{3}{2}\vec{u}$). b) $18 - 20 = -2
      \ne 0$ : **non colinéaires**.'
  - numero: 24
    etoiles: 2
    enonce: À Bittou, un lotisseur trace deux rues, l'une suivant $\overrightarrow{AB}$, l'autre $\overrightarrow{CD}$,
      avec $\overrightarrow{CD} = \frac{3}{2}\overrightarrow{AB}$. a) Démontre qu'elles sont parallèles.
      b) Si $AB = 40$ m, quelle est la longueur $CD$ ?
    correction: a) $k = \frac{3}{2}$ existe, donc les vecteurs sont colinéaires et les rues **parallèles**.
      b) $CD = \frac{3}{2} \times 40 = 60$ m.
  - numero: 25
    etoiles: 2
    enonce: 'À Gaoua, trois poteaux E, F et G vérifient $\overrightarrow{EG} = \frac{7}{2}\overrightarrow{EF}$.
      Le technicien affirme qu''un seul câble tendu les relie tous les trois. A-t-il raison ? Si $EF =
      12$ m, quelle est la distance $EG$ ?


      #### Entraînement intensif : tout ramener à un seul vecteur'
    correction: '$\overrightarrow{EG}$ et $\overrightarrow{EF}$ partent de E et sont colinéaires : E,
      F, G **alignés**, le technicien a raison. $EG = \frac{7}{2} \times 12 = 42$ m.'
  - numero: 26
    etoiles: 2
    enonce: A, M et I vérifient $\overrightarrow{AI} = \frac{2}{5}\overrightarrow{AM}$. Exprime $\overrightarrow{MI}$
      en fonction de $\overrightarrow{AM}$.
    correction: $\overrightarrow{MI} = \overrightarrow{MA} + \overrightarrow{AI} = -\overrightarrow{AM}
      + \frac{2}{5}\overrightarrow{AM} = -\frac{3}{5}\overrightarrow{AM}$.
  - numero: 27
    etoiles: 2
    enonce: Les vecteurs $\vec{u}$, $\vec{v}$, $\vec{w}$ vérifient $-3\vec{w} = 4\vec{u}$ et $2\vec{v}
      = -5\vec{u}$. Exprime $\vec{w}$ en fonction de $\vec{v}$.
    correction: $\vec{u} = -\frac{2}{5}\vec{v}$, donc $-3\vec{w} = -\frac{8}{5}\vec{v}$ et $\vec{w} =
      \frac{8}{15}\vec{v}$.
  - numero: 28
    etoiles: 2
    enonce: 'E et F sont deux points donnés. Construis X tel que $3\overrightarrow{EX} + 5\overrightarrow{FX}
      = \vec{0}$. *(Aide : ramène tout à $\overrightarrow{EF}$.)*'
    correction: '$\overrightarrow{FX} = -\overrightarrow{EF} + \overrightarrow{EX}$, d''où $8\overrightarrow{EX}
      = 5\overrightarrow{EF}$ et $\overrightarrow{EX} = \frac{5}{8}\overrightarrow{EF}$ : X est sur $\left[EF\right]$,
      aux cinq huitièmes depuis E.'
  - numero: 29
    etoiles: 2
    enonce: 'On donne $\overrightarrow{KL} = -\frac{2}{3}\overrightarrow{EF} + \overrightarrow{IJ}$, $\overrightarrow{MN}
      = 3\overrightarrow{EF} - 2\overrightarrow{IJ}$ et $\overrightarrow{PQ} = \frac{3}{2}\overrightarrow{EF}
      + \frac{3}{2}\overrightarrow{IJ}$. Exprime $\overrightarrow{KL} + \overrightarrow{MN} + \overrightarrow{PQ}$
      en fonction de $\overrightarrow{EF}$ et $\overrightarrow{IJ}$.


      ### ★★★ Défis de maîtrise'
    correction: 'Coefficients de $\overrightarrow{EF}$ : $-\frac{2}{3} + 3 + \frac{3}{2} = \frac{23}{6}$.
      De $\overrightarrow{IJ}$ : $1 - 2 + \frac{3}{2} = \frac{1}{2}$. Somme : $\frac{23}{6}\overrightarrow{EF}
      + \frac{1}{2}\overrightarrow{IJ}$.'
  - numero: 30
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une démonstration ou un contre-exemple. a) Deux vecteurs colinéaires
      sont toujours égaux. b) Le vecteur nul est colinéaire à tout vecteur. c) Si $\overrightarrow{AB}$
      et $\overrightarrow{CD}$ sont colinéaires, alors A, B, C et D sont alignés. d) Si $k > 1$, alors
      $k\vec{u}$ est plus long que $\vec{u}$.
    correction: 'On regarde chaque fois si l''affirmation est une définition ou une confusion entre deux
      notions voisines. a) **Faux** : $\vec{u}$ et $3\vec{u}$ sont colinéaires sans être égaux. b) **Vrai**
      : $\vec{0} = 0 \times \vec{u}$. c) **Faux** : cela prouve seulement $\left(AB\right) \parallel \left(CD\right)$
      ; contre-exemple, les côtés $\left[AB\right]$ et $\left[DC\right]$ d''un parallélogramme non aplati.
      d) **Vrai** : $\left|k\right| > 1$ allonge, si $\vec{u} \ne \vec{0}$.'
  - numero: 31
    etoiles: 3
    enonce: E et F sont distants de $40$ m. Construis Y tel que $2\overrightarrow{EY} = 3\overrightarrow{YF}$,
      exprime $\overrightarrow{EY}$ en fonction de $\overrightarrow{EF}$, puis donne la distance $EY$.
    correction: 'On ramène tout au seul vecteur connu, $\overrightarrow{EF}$. $\overrightarrow{YF} = -\overrightarrow{EY}
      + \overrightarrow{EF}$, donc $2\overrightarrow{EY} = 3\left(-\overrightarrow{EY} + \overrightarrow{EF}\right)$,
      soit $5\overrightarrow{EY} = 3\overrightarrow{EF}$ et $\overrightarrow{EY} = \frac{3}{5}\overrightarrow{EF}$.
      Y est entre E et F, et $EY = \frac{3}{5} \times 40 = 24$ m ($YF = 16$ m ; contrôle : $2 \times 24
      = 3 \times 16$).'
  - numero: 32
    etoiles: 3
    enonce: ABCD est un parallélogramme de centre O. a) Démontre que $\overrightarrow{AO} = \frac{1}{2}\overrightarrow{AC}$.
      b) Démontre que $\overrightarrow{OA} + \overrightarrow{OB} + \overrightarrow{OC} + \overrightarrow{OD}
      = \vec{0}$.
    correction: La seule propriété de O est d'être le milieu des deux diagonales. a) $\overrightarrow{AC}
      = \overrightarrow{AO} + \overrightarrow{OC} = 2\overrightarrow{AO}$, donc $\overrightarrow{AO} =
      \frac{1}{2}\overrightarrow{AC}$. b) $\overrightarrow{OA} + \overrightarrow{OC} = \vec{0}$ et $\overrightarrow{OB}
      + \overrightarrow{OD} = \vec{0}$ ; en additionnant, la somme des quatre vaut $\vec{0}$.
  - numero: 33
    etoiles: 3
    enonce: 'On donne $A\left(2\,;\,-1\right)$, $B\left(5\,;\,3\right)$, $C\left(-1\,;\,-9\right)$ : A,
      B et C sont-ils alignés ? Voici la copie de Rakieta.


      *Ligne 1 :* $\overrightarrow{AB}\left(2 - 5\,;\,-1 - 3\right) = \left(-3\,;\,-4\right)$.

      *Ligne 2 :* $\overrightarrow{AC}\left(-1 - 2\,;\,-9 + 1\right) = \left(-3\,;\,-8\right)$.

      *Ligne 3 :* $\left(-3\right) \times \left(-8\right) - \left(-4\right) \times \left(-3\right) = 24
      - 12 = 12$.

      *Ligne 4 :* le produit n''est pas nul, donc les points sont alignés.


      Repère chaque ligne fausse, explique l''erreur, refais la résolution.'
    correction: 'On refait chaque ligne sans se laisser entraîner par la précédente. **Ligne 1 fausse**
      : origine moins extrémité ; il faut $\overrightarrow{AB}\left(3\,;\,4\right)$. **Ligne 2 juste.**
      **Ligne 3 fausse par contagion** : $3 \times \left(-8\right) - 4 \times \left(-3\right) = -12$.
      **Ligne 4 fausse** : un produit croisé non nul signifie **non** colinéaires. Conclusion correcte
      : A, B et C **ne sont pas alignés**.'
  - numero: 34
    etoiles: 3
    enonce: 'Le verger de Rasmata, à Orodara, est planté en rangs réguliers : on passe d''un manguier
      au suivant dans un rang toujours par le même déplacement, et d''un rang au rang voisin par un autre
      déplacement, de direction différente. Depuis le manguier A, on atteint B en avançant de quatre arbres
      dans le rang puis en franchissant trois rangs ; on atteint C en avançant de douze arbres et en franchissant
      huit rangs. Le verger couvre $2$ hectares et la récolte a atteint $12$ tonnes. Rasmata veut arroser
      les trois manguiers avec une seule rampe rectiligne. Son projet tient-il debout ?'
    correction: 'Aucune longueur n''est utilisable : on pose $\vec{i}$ le pas dans un rang et $\vec{j}$
      le passage d''un rang au voisin, non colinéaires. Alors $\overrightarrow{AB} = 4\vec{i} + 3\vec{j}$
      et $\overrightarrow{AC} = 12\vec{i} + 8\vec{j}$. Il faudrait $4k = 12$, donc $k = 3$, mais alors
      $3k = 9 \ne 8$. Aucun réel ne convient : **le projet ne tient pas debout**. La superficie et la
      récolte ne servent pas.'
  - numero: 35
    etoiles: 3
    enonce: A, B, C et D vérifient $\overrightarrow{AB} = \overrightarrow{DC}$. Démontre que $\left[AC\right]$
      et $\left[BD\right]$ ont le même milieu.
    correction: 'On introduit un seul point et on prouve qu''il est le milieu des deux segments. Soit
      I le milieu de $\left[AC\right]$ : $\overrightarrow{IA} + \overrightarrow{IC} = \vec{0}$. Alors
      $\overrightarrow{IB} + \overrightarrow{ID} = \left(\overrightarrow{IA} + \overrightarrow{IC}\right)
      + \overrightarrow{AB} + \overrightarrow{CD} = \vec{0}$, car $\overrightarrow{CD} = -\overrightarrow{AB}$.
      **I est aussi le milieu de $\left[BD\right]$** : c''est le centre du parallélogramme ABCD.'
  - numero: 36
    etoiles: 3
    enonce: On donne $A\left(-3\,;\,2\right)$, $B\left(1\,;\,4\right)$, $C\left(7\,;\,m\right)$ et $D\left(9\,;\,8\right)$.
      a) Détermine $m$ pour que A, B et C soient alignés. b) Pour cette valeur, les droites $\left(AB\right)$
      et $\left(CD\right)$ sont-elles parallèles ? distinctes ? Justifie.
    correction: 'a) $\overrightarrow{AB}\left(4\,;\,2\right)$ et $\overrightarrow{AC}\left(10\,;\,m -
      2\right)$ ; $4\left(m - 2\right) - 20 = 0$ donne $m = 7$. b) $\overrightarrow{CD}\left(2\,;\,1\right)$
      et $4 \times 1 - 2 \times 2 = 0$ : les droites sont **parallèles**. Mais a) place C sur $\left(AB\right)$
      : elles sont **confondues**, donc pas distinctes. Le parallélisme vectoriel englobe ce cas.'
  fiche_revision:
  - '**Vecteur.** Direction, sens, longueur, sans position. $\overrightarrow{AB} = \overrightarrow{CD}
    \iff$ ABDC parallélogramme ; ABCD parallélogramme $\iff \overrightarrow{AB} = \overrightarrow{DC}$.'
  - '**Chasles.** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$ : lettre commune à
    l''arrivée du premier, au départ du second. Circuit fermé $= \vec{0}$. Soustraire, c''est ajouter
    l''opposé.'
  - '**Milieu.** M milieu de $\left[AB\right] \iff \overrightarrow{AM} = \overrightarrow{MB} \iff \overrightarrow{MA}
    + \overrightarrow{MB} = \vec{0}$.'
  - '**Produit par un réel.** $k\vec{u}$ : même direction, sens de $k$, longueur $\left|k\right|$ fois.
    $0\vec{u} = \vec{0}$, jamais le nombre $0$.'
  - '**Colinéarité.** Alignement de A, B, C : $\overrightarrow{AB}$ et $\overrightarrow{AC}$ (même origine).
    Parallélisme de $\left(AB\right)$ et $\left(CD\right)$ : $\overrightarrow{AB}$ et $\overrightarrow{CD}$
    (une droite chacun).'
  - '**Coordonnées.** $\overrightarrow{AB}\left(x_{B} - x_{A}\,;\,y_{B} - y_{A}\right)$ ; $k\vec{u}\left(kx\,;\,ky\right)$
    ; test $xy'' - yx'' = 0$.'
  trouve_erreur:
  - faux: ABCD parallélogramme, donc $\overrightarrow{AB} = \overrightarrow{CD}$
    correction: 'Côtés opposés parcourus dans le même sens : $\overrightarrow{AB} = \overrightarrow{DC}$.'
  - faux: $\overrightarrow{AB} + \overrightarrow{CB} = \overrightarrow{AC}$
    correction: B est l'arrivée des deux. Il faut $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$.
  - faux: E milieu de $\left[FG\right]$, donc $\overrightarrow{EF} + \overrightarrow{EG} = \overrightarrow{FG}$
    correction: 'Les deux vecteurs partent de E et sont opposés : la somme vaut $\vec{0}$.'
  - faux: $A\left(2\,;\,5\right)$, $B\left(6\,;\,1\right)$, donc $\overrightarrow{AB}\left(2 - 6\,;\,5
      - 1\right)$
    correction: 'Extrémité moins origine : $\overrightarrow{AB}\left(4\,;\,-4\right)$.'
  cartographie_lacunes:
  - lacune: Relation de Chasles et colinéarité non acquises
    bloque_en: vecteurs du plan, transformations
  source_path: remediation\2ndeC\modules_c\M07.md
- niveau: 2ndeC
  module: 8
  module_titre: Théorème de Thalès et rapport de projection
  pourquoi: 'Thalès est le théorème que tout le monde croit connaître et que presque personne n''écrit
    proprement. Tu connais la règle : c''est l''appariement des points et la citation du parallélisme
    qui dérapent.'
  diagnostic:
  - question: Triangle ABC, I milieu de $\left[AB\right]$, J milieu de $\left[AC\right]$, $BC = 14$. Que
      dire de $\left(IJ\right)$ ? Combien vaut $IJ$ ?
    reponse: $\left(IJ\right) \,//\, \left(BC\right)$, $IJ = 7$ (droite des milieux)
  - question: 'Résous : $\frac{x}{3} = \frac{8}{6}$.'
    reponse: $6x = 24$, $x = 4$
  - question: Un rapport de projection vaut $0{,}6$. Quelle est la projection d'un segment de $25$ ?
    reponse: $15$
  - question: M sur $\left[AB\right]$, N sur $\left[AC\right]$, $\left(MN\right) \,//\, \left(BC\right)$,
      $AM = 4$, $AB = 6$, $BC = 9$. Calcule $MN$.
    reponse: $\frac{4}{6} = \frac{MN}{9}$, $MN = 6$
  - question: A, F, B et E, F, C alignés, même ordre depuis F. $FA = 12$, $FB = 8$, $FE = 9$, $FC = 6$.
      $\left(AE\right)$ et $\left(BC\right)$ sont-elles parallèles ?
    reponse: $\frac{12}{8} = \frac{9}{6} = 1{,}5$, ordre respecté, donc oui (réciproque)
  lecons:
  - id: 2ndeC_M08_L1
    numero: '8.1'
    titre: Le rapport de projection
    retenir:
    - '$\left(D\right)$ et $\left(D''\right)$ sécantes, direction $\left(\Delta\right)$ : le **projeté**
      de M est le point M'' où la parallèle à $\left(\Delta\right)$ par M coupe $\left(D''\right)$.'
    - 'Pour tous A, B de $\left(D\right)$, $\frac{A''B''}{AB}$ est **le même** : c''est le **rapport de
      projection** $k$, et $A''B'' = k \times AB$.'
    - $k$ est **sans unité** et ne dépend pas du segment choisi.
    - La projection conserve l'**alignement**, l'**ordre** et le **milieu**.
    - 'Projection **orthogonale** : $\left(\Delta\right) \perp \left(D''\right)$ ; alors $k \leq 1$.'
    methode:
      titre: Calculer un rapport, puis une longueur
      etapes:
      - Repère le **segment témoin**, connu avant et après.
      - Écris $k = \frac{\text{arrivée}}{\text{départ}}$.
      - Multiplie par $k$ pour aller vers $\left(D'\right)$ ; divise par $k$ pour revenir.
      - 'Contrôle : recalcule le quotient, tu dois retomber sur $k$.'
    exemple_resolu: '$\left(D\right)$ et $\left(D''\right)$ se coupent en O, $\left(AA''\right) \,//\,
      \left(BB''\right)$, $OA = 4$, $OA'' = 6$, $OB = 6$. Calcule $OB''$ et $A''B''$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Segment témoin $\left[OA\right]$. | $k = \frac{6}{4} = 1{,}5$ |

      | O est son propre projeté. | $OB'' = 1{,}5 \times 6 = 9$ |

      | L''ordre O, A, B est conservé. | $AB = 2$, donc $A''B'' = 1{,}5 \times 2 = 3$ |

      | **Vérification :** $6 + 3 = 9 = OB''$ ✓ | |


      [SVG: figures/m08_f1.svg]

      *Figure 8.1 : Un seul rapport pour tous les segments d''une même droite.*'
    erreurs_frequentes:
    - erreur: poutre $20$ cm, ombre $14$ cm, et écrire $k = \frac{20}{14}$.
      correction: $k = \frac{14}{20} = 0{,}7$, arrivée sur départ.
    - erreur: « $k = 0{,}7$ cm ».
      correction: $k$ est un quotient de longueurs, donc sans unité.
    declic: 'Si $\frac{9}{x} = \frac{3}{2}$ t''arrête — Le blocage est numérique, pas géométrique : $\frac{a}{b}
      = \frac{c}{d}$ équivaut à $a \times d = b \times c$. Sans ce produit en croix automatique, tout
      le module s''arrête à la dernière ligne. Reprends les modules 1 et 4.'
    figures:
    - figures/m08_f1.svg
  - id: 2ndeC_M08_L2
    numero: '8.2'
    titre: 'Droite des milieux : triangle et trapèze'
    retenir:
    - 'I milieu de $\left[AB\right]$, J milieu de $\left[AC\right]$ : $\left(IJ\right) \,//\, \left(BC\right)$
      et $IJ = \frac{BC}{2}$.'
    - '**Réciproque.** I milieu de $\left[AB\right]$ et la parallèle à $\left(BC\right)$ par I coupe $\left(AC\right)$
      en J : J est le **milieu** de $\left[AC\right]$.'
    - 'Milieu déguisé : « B symétrique de G par rapport à A » signifie A milieu de $\left[GB\right]$.'
    - 'Trapèze de bases $\left[AB\right]$ et $\left[CD\right]$ : la droite des milieux des deux côtés
      **non parallèles** est parallèle aux deux bases, et $IJ = \frac{AB + CD}{2}$.'
    methode:
      titre: Conclure avec une droite des milieux
      etapes:
      - Vérifie que les deux points sont bien les **milieux** de deux côtés.
      - Écris l'hypothèse, puis nomme le théorème.
      - 'Conclus le parallélisme, puis la longueur : moitié du troisième côté ou demi-somme des bases.'
      - 'Contrôle : elle est plus courte que la grande base.'
    exemple_resolu: 'Triangle ABC, $AB = 8$, $AC = 7$, $BC = 9$ (en cm) ; I et J milieux de $\left[AB\right]$
      et $\left[AC\right]$. Calcule $IJ$, compare les périmètres de AIJ et ABC.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux milieux dans le même triangle. | $\left(IJ\right) \,//\, \left(BC\right)$ et $IJ = \frac{9}{2}
      = 4{,}5$ cm |

      | Les deux autres sont des demi-côtés. | $AI = 4$ cm, $AJ = 3{,}5$ cm |

      | J''additionne. | $P_{AIJ} = 12$ cm ; $P_{ABC} = 24$ cm |

      | **Vérification :** $12 = \frac{24}{2}$ ✓ | |'
    erreurs_frequentes:
    - erreur: conclure $\left(MN\right) \,//\, \left(BC\right)$ parce que $MN = \frac{BC}{2}$.
      correction: la longueur ne prouve rien, le théorème part des **milieux**.
    - erreur: dans un trapèze, joindre les milieux de $\left[AB\right]$ et $\left[CD\right]$.
      correction: ce sont les côtés **non parallèles**.
    declic: null
    figures: []
  - id: 2ndeC_M08_L3
    numero: '8.3'
    titre: Le théorème de Thalès dans les deux configurations
    retenir:
    - Il donne une longueur quand un parallélisme est connu.
    - '**Emboîtée** : petit triangle dans le grand. **Papillon** : triangles face à face autour du sommet
      commun. Même énoncé.'
    - '**Points homologues.** Les deux triangles l''un sous l''autre, sommet en tête : chaque colonne
      donne une paire.'
    - '**Trapèze.** Bases $\left(AB\right)$, $\left(CD\right)$, diagonales sécantes en O : $\frac{OA}{OC}
      = \frac{OB}{OD} = \frac{AB}{CD}$.'
    methode:
      titre: Calculer une longueur avec Thalès
      etapes:
      - Écris l'**hypothèse de parallélisme**.
      - Identifie le sommet commun, écris les trois rapports par points homologues.
      - Garde les **deux** rapports utiles, puis produit en croix.
      - 'Contrôle : les deux quotients redonnent la même valeur.'
    exemple_resolu: 'Trapèze ABCD de bases $\left[AB\right]$ et $\left[CD\right]$, diagonales sécantes
      en O. $AB = 12$, $CD = 8$, $OA = 9$. Calcule $OC$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Papillon de sommet O. | $\frac{OA}{OC} = \frac{OB}{OD} = \frac{AB}{CD}$ |

      | Je garde le rapport utile et celui des bases. | $\frac{9}{OC} = \frac{12}{8} = \frac{3}{2}$ |

      | Produit en croix, puis division. | $3 \times OC = 18$, donc $OC = 6$ |

      | **Vérification :** $\frac{9}{6} = 1{,}5 = \frac{12}{8}$ ✓ | |


      [SVG: figures/m08_f4.svg]

      *Figure 8.2 : Emboîtée à gauche, papillon à droite : les mêmes rapports.*'
    erreurs_frequentes:
    - erreur: écrire $\frac{AM}{AC} = \frac{AN}{AB}$.
      correction: un rapport ne croise jamais les deux sécantes ; écrire $\frac{AM}{AB} = \frac{AN}{AC}$.
    - erreur: appliquer le théorème sans citer le parallélisme.
      correction: c'est l'hypothèse ; sans elle la copie ne vaut rien.
    declic: null
    figures:
    - figures/m08_f4.svg
  - id: 2ndeC_M08_L4
    numero: '8.4'
    titre: Réciproque, partage, agrandissement
    retenir:
    - Elle seule démontre un parallélisme à partir de longueurs. La **condition d'ordre** est une hypothèse,
      pas un ornement.
    - '$\frac{AM}{AB} = \frac{MN}{BC}$ ne conclut pas : il faut les deux rapports portés par les **sécantes**.'
    - '**Partage en $n$ parts** : reporter $n$ longueurs égales sur une demi-droite d''origine A jusqu''à
      $A_{n}$, joindre $A_{n}$ à B, puis tracer les parallèles à $\left(A_{n}B\right)$. $\frac{AM}{AB}
      = \frac{p}{q}$ : partager en $q$ parts, en compter $p$.'
    - '**Agrandissement, réduction** : longueurs et périmètre multipliés par le même $k$. $k > 1$ agrandit,
      $k < 1$ réduit.'
    methode:
      titre: Démontrer un parallélisme
      etapes:
      - Repère le point commun et l'appariement des points.
      - 'Vérifie l''**ordre** : les deux points du même côté du point commun.'
      - Calcule les deux rapports **séparément** et compare par produit en croix.
      - Conclus en nommant la **réciproque** ; s'ils diffèrent, pas de parallélisme.
    exemple_resolu: 'Alizèta place M sur $\left[AB\right]$ avec $AM = 15$ et $AB = 45$, N sur $\left[AC\right]$
      avec $AN = 12$ et $AC = 36$ ; $BC = 27$ (en m). Le tuyau MN sera-t-il parallèle à $\left[BC\right]$,
      et de quelle longueur ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Ordre respecté ; premier rapport seul. | $\frac{AM}{AB} = \frac{15}{45} = \frac{1}{3}$ |

      | Second rapport calculé séparément. | $\frac{AN}{AC} = \frac{12}{36} = \frac{1}{3}$ |

      | Égaux : réciproque, puis direct. | $\left(MN\right) \,//\, \left(BC\right)$, $MN = \frac{27}{3}
      = 9$ m |

      | **Vérification :** $9$ est le tiers de $27$ ✓ | |'
    erreurs_frequentes:
    - erreur: conclure au parallélisme après un seul rapport.
      correction: 'il en faut **deux**, et l''égalité doit être exacte : $20 \times 10 = 200$ mais $12
        \times 17 = 204$.'
    - erreur: pour partager $\left[AB\right]$ en trois, joindre B au **deuxième** point reporté.
      correction: c'est le **dernier**, $A_{3}$.
    declic: null
    figures: []
