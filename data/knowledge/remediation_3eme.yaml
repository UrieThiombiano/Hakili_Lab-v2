  fiche_revision:
  - '**Droite graduée.** Distance $=$ grande abscisse moins petite ; milieu $= \frac{x_{A} + x_{B}}{2}$.'
  - '**Repère du plan.** $\left(x\,;\,y\right)$ : abscisse **puis** ordonnée. Milieu : demi-somme coordonnée
    par coordonnée.'
  - '**Translation.** Glissement défini par direction, sens, longueur : le **vecteur**. Conserve longueurs,
    angles, aires, parallélisme.'
  - '**Égalité.** $\overrightarrow{AB} = \overrightarrow{CD} \iff ABDC$ parallélogramme. $\overrightarrow{BA}
    = -\overrightarrow{AB}$ ; $\overrightarrow{AA} = \vec{0}$.'
  - '**Chasles.** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$ : réduire, ou insérer
    un relais. Somme en boucle $= \vec{0}$.'
  - '**Milieu en vecteurs.** $I$ milieu de $\left[AB\right] \iff \overrightarrow{AI} = \overrightarrow{IB}$,
    et $\overrightarrow{AB} = 2\,\overrightarrow{AI}$.'
  - '**Longueur $\ne$ vecteur.** $AB$ est un nombre ; $\overrightarrow{AB}$ un déplacement.'
  trouve_erreur:
  - faux: '« Milieu de $A\left(-5\right)$ et $B\left(3\right)$ : $\frac{5 + 3}{2} = 4$. »'
    correction: 'Signe perdu : $\frac{-5 + 3}{2} = -1$.'
  - faux: '« $M\left(3\,;\,-2\right)$ : ordonnée $3$, abscisse $-2$. »'
    correction: 'C''est l''inverse : abscisse d''abord, $x_{M} = 3$ et $y_{M} = -2$.'
  - faux: « $ABCD$ parallélogramme, donc $\overrightarrow{AB} = \overrightarrow{CD}$. »
    correction: 'Non : $\overrightarrow{AB} = \overrightarrow{DC}$ ; $\overrightarrow{CD}$ est l''opposé.'
  - faux: « $\overrightarrow{AB} + \overrightarrow{CB} = \overrightarrow{AC}$ »
    correction: 'La lettre du milieu doit se répéter : écrire d''abord $\overrightarrow{CB} = -\overrightarrow{BC}$.'
