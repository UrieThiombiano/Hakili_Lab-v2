  reponse_attendue: 5 000x - 3 000 = 32 000
  solution: 'Recette des ventes 5 000x FCFA, transport de 3 000 FCFA retiré. Barème (2 pts) : 1 pt pour
    l''expression 5 000x - 3 000 ; 1 pt pour l''égalité à 32 000. Une équation équivalente (5 000x = 32
    000 + 3 000) vaut les 2 pts.'
