  reponse_attendue: F = (4x + 5)(3x - 2) ; F s'annule pour x = -5/4 et x = 2/3 seulement, Salif a tort
  solution: '16x² - 25 = (4x - 5)(4x + 5), donc F = (4x + 5)[(4x - 5) - (x - 3)] = (4x + 5)(3x - 2). F
