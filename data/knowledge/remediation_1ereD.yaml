  - numero: 12
    etoiles: 1
    enonce: 'On demande les antécédents de $4$ par $f\left(x\right) = x^{2}$. Chantal répond : « $f\left(4\right)
      = 16$, donc l''antécédent est 16 ». Explique la confusion, puis donne la bonne réponse.


      ### Entraînement ★★'
    correction: 'Chantal a calculé l''**image** de 4. On demande les antécédents : $x^{2} = 4$, donc $x
      = 2$ ou $x = -2$.'
  - numero: 13
    etoiles: 2
    enonce: 'Détermine l''ensemble de définition de : a) $f\left(x\right) = \sqrt{9 - x^{2}}$ (Module
      7) ; b) $g\left(x\right) = \frac{1}{\sqrt{x - 2}}$ ; c) $h\left(x\right) = \frac{x}{|x| - 3}$.'
    correction: 'a) $x^{2} \le 9$ : $\left[-3\,;\,3\right]$. b) $\left]2\,;\,+\infty\right[$. c) $\mathbb{R}
