  reponse_attendue: C(15,3) = 455 ; 488 < 500, Rasmané a tort
  solution: 'C(15,3) = (15 × 14 × 13)/(3 × 2 × 1) = 455. La cinquième année : 488 ruches < 500. Barème
    (3 pts) : 1 pt pour la reconnaissance d''une combinaison et la pose de C(15,3), 1 pt pour 455, 1 pt
    pour la conclusion appuyée sur 488 vs 500. Erreur propagée : valeur cohérente avec une écriture erronée
    de C(15,3) ; la conclusion garde son point si elle compare 488 à 500 et tranche.'
