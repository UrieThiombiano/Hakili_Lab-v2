- niveau: 4eme
  module: 2
  module_titre: Multiples, diviseurs, PGCD et PPCM
  pourquoi: 'Fraction non simplifiée, PGCD calculé comme un PPCM, « 91 est premier car

    impair » : une seule cause, la divisibilité mal installée.'
  diagnostic:
  - question: Le nombre 522 est-il divisible par 2 ? par 3 ? par 9 ?
    reponse: oui aux trois ($5 + 2 + 2 = 9$)
  - question: Écris en extension $D_{20}$.
    reponse: '{1 ; 2 ; 4 ; 5 ; 10 ; 20}'
  - question: Décompose 420 en produit de facteurs premiers.
    reponse: ''
  - question: Calcule PGCD$\left(24\,;\,36\right)$, puis PPCM$\left(6\,;\,8\right)$.
    reponse: ''
  - question: Rends $\frac{45}{60}$ irréductible.
    reponse: ''
  lecons:
  - id: 4eme_M02_L1
    numero: '2.1'
    titre: Multiples, diviseurs et critères
    retenir:
    - '$a = b \times q$ : $a$ est **multiple** de $b$, $b$ est **diviseur** de $a$. **Le multiple est'
    - '$M_{b}$ infini, $D_{a}$ fini : $M_{7} =$ {0 ; 7 ; 14 ; 21 ; …},'
    - '**Les diviseurs vont par paires :** si $b$ divise $a$, alors $q = a \div b$ divise aussi $a$.'
    - '**Critères :** par **2**, **5** et **4**, on regarde la fin du nombre ; par **3** et **9**, la'
    - '**Combiné :** par **6** = par 2 et par 3 ; par **15** = par 3 et par 5, seulement si les deux'
    methode:
      titre: Dresser la liste des diviseurs de $a$
      etapes:
      - Commence par la paire $\left(1\,;\,a\right)$.
      - Essaie 2, puis 3, puis 4… en montant, à l'aide des critères.
      - 'Chaque division juste donne **deux** diviseurs : le diviseur et le quotient.'
      - Arrête-toi quand les deux membres se rejoignent, puis range dans l'ordre.
    exemple_resolu: 'Écris en extension $D_{24}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Paire de départ, valable toujours. | $24 = 1 \times 24$ |

      | 24 est pair ; somme des chiffres 6, donc 3 convient. | $24 = 2 \times 12$ ; $24 = 3 \times 8$
      |

      | 4 convient ; 5 échoue ; 6 redonne 4 : on s''arrête. | $D_{24} =$ {1 ; 2 ; 3 ; 4 ; 6 ; 8 ; 12 ;
      24} |

      | **Vérification :** $1 \times 24 = 2 \times 12 = 3 \times 8 = 4 \times 6$. ✓ | |'
    erreurs_frequentes:
    - erreur: « 12 est un diviseur de 3 ».
      correction: '$12 = 3 \times 4$, le grand

        est le multiple : 12 est multiple de 3, et 3 diviseur de 12.'
    - erreur: « $3\,254$ est divisible par 3 car il finit par 4 ».
      correction: 'le

        critère de 3 ne regarde que la somme, $3 + 2 + 5 + 4 = 14$.'
    declic: null
    figures: []
  - id: 4eme_M02_L2
    numero: '2.2'
    titre: Nombres premiers et décomposition
    retenir:
    - 'Un **nombre premier** a **exactement deux diviseurs**, 1 et lui-même : 2, 3, 5, 7, 11, 13, 17,'
    - '**Test.** On divise par 2, 3, 5, 7, 11… et l''on s''arrête dès que le premier testé, **multiplié'
    - Tout entier supérieur à 1 s'écrit de façon **unique**, à l'ordre près, comme **produit de
    - '**La décomposition se lit :** $360 = 2^{3} \times 3^{2} \times 5$ est divisible par 8 et par 9,'
    methode:
      titre: Décomposer un entier en facteurs premiers
      etapes:
      - Divise par 2 tant que le nombre reste pair.
      - Passe à 3, puis 5, puis 7, puis 11…
      - Continue jusqu'au quotient 1.
      - Regroupe en exposants, puis contrôle par le produit.
    exemple_resolu: 'On donne $588 = 2^{2} \times 3 \times 7^{2}$. Sans division, 588 est-il divisible

      par 4, par 9, par 14 ? Calcule $588 \div 49$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $4 = 2 \times 2$ : les deux briques sont là. $9 = 3 \times 3$ : il manque un 3. | divisible par
      4, pas par 9 |

      | $14 = 2 \times 7$ : les deux briques sont là. | divisible par 14 |

      | Diviser par 49, c''est retirer $7 \times 7$ de la décomposition. | $588 \div 49 = 2^{2} \times
      3 = 12$ |

      | **Vérification :** $12 \times 49 = 588$. ✓ | |'
    erreurs_frequentes:
    - erreur: « 91 est premier car il est impair ».
      correction: 'impair ne suffit

        pas ; $91 = 7 \times 13$.'
    - erreur: écrire $60 = 4 \times 15$ et appeler cela une décomposition.
      correction: ni 4 ni 15 n'est premier ; on casse encore, $60 = 2^{2} \times 3 \times 5$.
    declic: null
    figures:
    - figures/m02_f2.svg
  - id: 4eme_M02_L3
    numero: '2.3'
    titre: PGCD, PPCM et fractions irréductibles
    retenir:
    - Le **PGCD** de $a$ et $b$ est le **plus grand** de leurs diviseurs communs ; le **PPCM** est le
    - '**Par décomposition :** PGCD, les facteurs **communs** à leur **plus petite** puissance ; PPCM,'
    - '**Par soustractions successives (PGCD) :** remplacer le plus grand par la différence, jusqu''à'
    - '**Premiers entre eux :** PGCD $= 1$, ainsi 8 et 15 ; le PPCM est alors le produit. Si l''un divise'
    - Les diviseurs communs de $a$ et $b$ sont **les diviseurs de leur PGCD**.
    methode:
      titre: PGCD ou PPCM ? Lire l'énoncé
      etapes:
      - '**PGCD :** « le plus grand », « parts identiques », « sans reste », « rendre irréductible ».'
      - '**PPCM :** « en même temps », « de nouveau ensemble », « au même dénominateur ».'
      - Décompose, puis applique la règle correspondante.
      - Contrôle avec PGCD $\times$ PPCM $= a \times b$.
    exemple_resolu: 'Calcule PGCD$\left(60\,;\,84\right)$ et PPCM$\left(60\,;\,84\right)$, puis rends

      $\frac{60}{84}$ irréductible.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On décompose les deux nombres. | $60 = 2^{2} \times 3 \times 5$ ; $84 = 2^{2} \times 3 \times
      7$ |

      | PGCD : les facteurs présents des deux côtés. | PGCD $= 2^{2} \times 3 = 12$ |

      | PPCM : tous les facteurs, plus grande puissance. | PPCM $= 2^{2} \times 3 \times 5 \times 7 =
      420$ |

      | **Vérification :** $12 \times 420 = 5\,040 = 60 \times 84$, et $\frac{60}{84} = \frac{5}{7}$.
      ✓ | |


      > #### DÉCLIC : Ce n''est pas le PGCD qui bloque, c''est la décomposition

      >

      > Tant que $48 = 2^{4} \times 3$ et $132 = 2^{2} \times 3 \times 11$ ne sortent pas tout seuls,

      > aucune comparaison n''est possible. Reprends la leçon 2.2, décompose dix nombres, puis reviens.'
    erreurs_frequentes:
    - erreur: garder **tous** les facteurs pour un PGCD, PGCD$\left(60\,;\,90\right) = 180$.
      correction: c'est le PPCM ; le PGCD garde les communs à la plus petite puissance, 30.
    - erreur: PPCM$\left(4\,;\,6\right) = 24$.
      correction: 'le produit ne convient

        que si les nombres sont premiers entre eux ; ici PPCM $= 12$.'
    declic: 'Ce n''est pas le PGCD qui bloque, c''est la décomposition — Tant que $48 = 2^{4} \times 3$
      et $132 = 2^{2} \times 3 \times 11$ ne sortent pas tout seuls, aucune comparaison n''est possible.
      Reprends la leçon 2.2, décompose dix nombres, puis reviens. #### ⚠ ATTENTION ! - **Erreur fréquente
      :** garder **tous** les facteurs pour un PGCD, PGCD$\left(60\,;\,90\right) = 180$. **Correction
      :** c''est le PPCM ; le PGCD garde les communs à la plus petite puissance, 30. - **Erreur fréquente
      :** PPCM$\left(4\,;\,6\right) = 24$. **Correction :** le produit ne convient que si les nombres
      sont premiers entre eux ; ici PPCM $= 12$.'
    figures:
    - figures/m02_f3.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Écris les six premiers multiples de 8, puis $D_{36}$ en extension.
    correction: 0 ; 8 ; 16 ; 24 ; 32 ; 40. $D_{36} =$ {1 ; 2 ; 3 ; 4 ; 6 ; 9 ; 12 ; 18 ; 36}.
  - numero: 2
    etoiles: 1
    enonce: 'Complète par $\in$ ou $\notin$ : $24$ … $M_{3}\,;\,11$ … $M_{1}\,;\,15$ … $M_{6}\,;\,111$
      … $M_{3}\,;\,0$ … $M_{4}\,;\,57$ … $M_{7}\,;\,8$ … $D_{36}\,;\,9$ … $D_{36}\,;\,5$ … $D_{36}$.'
    correction: '$24 \in$ ; $11 \in$ ; $15 \notin$ ; $111 \in$ ; $0 \in$ ; $57 \notin$ ;

      $8 \notin D_{36}$ ; $9 \in D_{36}$ ; $5 \notin D_{36}$.'
  - numero: 3
    etoiles: 1
    enonce: 'a) Écris les multiples de 7 compris entre 50 et 80. b) Ceux de 6 compris entre

      104 et 140.'
    correction: a) 56 ; 63 ; 70 ; 77. b) 108 ; 114 ; 120 ; 126 ; 132 ; 138.
  - numero: 4
    etoiles: 1
    enonce: 'a) Parmi $5\,015$ ; $918$ ; $21$ ; $2\,010$ ; $842\,517$ ; $7$, cite ceux qui sont

      divisibles par 9. b) Le nombre $11\,451$ est-il multiple de 3 ?'
    correction: a) 918 (somme 18) et $842\,517$ (somme 27). b) Oui, somme $= 12$.
  - numero: 5
    etoiles: 1
    enonce: '$U$ est le chiffre des unités de $137U$. Par quels chiffres remplacer $U$ pour

      que $137U$ soit divisible par 2 ? par 3 ? par 5 ?'
    correction: 'Par 2 : {0 ; 2 ; 4 ; 6 ; 8}. Par 3 : {1 ; 4 ; 7}. Par 5 : {0 ; 5}.'
  - numero: 6
    etoiles: 1
    enonce: Écris en extension $D_{81}$, puis $D_{64}$.
    correction: $D_{81} =$ {1 ; 3 ; 9 ; 27 ; 81} ; $D_{64} =$ {1 ; 2 ; 4 ; 8 ; 16 ; 32 ; 64}.
  - numero: 7
    etoiles: 1
    enonce: Écris en extension $D_{40}$ et $D_{84}$.
    correction: '$D_{40} =$ {1 ; 2 ; 4 ; 5 ; 8 ; 10 ; 20 ; 40} ;

      $D_{84} =$ {1 ; 2 ; 3 ; 4 ; 6 ; 7 ; 12 ; 14 ; 21 ; 28 ; 42 ; 84}.'
  - numero: 8
    etoiles: 1
    enonce: Écris en extension $D_{32}$, $D_{150}$, puis $D_{32} \cap D_{150}$.
    correction: '$D_{32} =$ {1 ; 2 ; 4 ; 8 ; 16 ; 32} ;

      $D_{150} =$ {1 ; 2 ; 3 ; 5 ; 6 ; 10 ; 15 ; 25 ; 30 ; 50 ; 75 ; 150} ; intersection {1 ; 2}.'
  - numero: 9
    etoiles: 1
    enonce: 'Les nombres 23 et 113 sont-ils premiers ? Précise à chaque fois ce qui te permet

      d''arrêter les essais.'
    correction: '23 : premier, $5 \times 5 = 25 > 23$. 113 : premier, ni 2, ni 3, ni 5, ni 7, et

      $11 \times 11 = 121 > 113$.'
  - numero: 10
    etoiles: 1
    enonce: Parmi 51 ; 57 ; 61 ; 149 ; 169, lesquels sont premiers ?
    correction: 61 et 149 sont premiers ; $51 = 3 \times 17$, $57 = 3 \times 19$, $169 = 13^{2}$.
  - numero: 11
    etoiles: 1
    enonce: Parmi 107 ; 203 ; 301 ; 507 ; 323 ; 311, lesquels sont premiers ?
    correction: 'Seuls 107 et 311 sont premiers. $203 = 7 \times 29$ ; $301 = 7 \times 43$ ;

      $507 = 3 \times 169$ ; $323 = 17 \times 19$.'
  - numero: 12
    etoiles: 1
    enonce: 'Décompose en produit de facteurs premiers : $1\,320$ ; 250 ; 120.'
    correction: '$1\,320 = 2^{3} \times 3 \times 5 \times 11$ ; $250 = 2 \times 5^{3}$ ;

      $120 = 2^{3} \times 3 \times 5$.'
  - numero: 13
    etoiles: 1
    enonce: 'Décompose : $2\,940$ ; $2\,730$ ; $1\,575$.'
    correction: '$2\,940 = 2^{2} \times 3 \times 5 \times 7^{2}$ ;

      $2\,730 = 2 \times 3 \times 5 \times 7 \times 13$ ; $1\,575 = 3^{2} \times 5^{2} \times 7$.'
  - numero: 14
    etoiles: 1
    enonce: 'Décompose 225 ; $1\,512$ ; $16\,384$ ; 196, puis déduis de la dernière le nombre

      $x$ tel que $x \times x = 196$.'
    correction: '$225 = 3^{2} \times 5^{2}$ ; $1\,512 = 2^{3} \times 3^{3} \times 7$ ;

      $16\,384 = 2^{14}$ ; $196 = 2^{2} \times 7^{2}$, donc $x = 14$.'
  - numero: 15
    etoiles: 1
    enonce: 'Écris sous forme de produit de facteurs premiers : $a = 14 \times 18$ et

      $b = 21 \times 22 \times 23$.'
    correction: $a = 2^{2} \times 3^{2} \times 7$ ; $b = 2 \times 3 \times 7 \times 11 \times 23$.
  - numero: 16
    etoiles: 1
    enonce: 'Calcule le PGCD de : a) 90 et 75 ; b) 120 et 168 ; c) 24 et 36.'
    correction: a) 15. b) $2^{3} \times 3 = 24$. c) 12.
  - numero: 17
    etoiles: 1
    enonce: 'Calcule le PGCD de : a) 180 et 150 ; b) 48 et 132 ; c) 16 et 90.'
    correction: a) 30. b) 12. c) 2.
  - numero: 18
    etoiles: 1
    enonce: 'Calcule le PPCM de : a) 48 et 30 ; b) 32 et 60 ; c) 13 et 17 ; d) 6 et 8.


      ### Entraînement ★★'
    correction: a) 240. b) 480. c) 221 (premiers entre eux). d) 24.
  - numero: 19
    etoiles: 2
    enonce: 'Vrai ou faux, en justifiant : a) 35 est multiple de 7 ; b) 70 est divisible par

      14 ; c) 4 est diviseur de 26 ; d) 0 est divisible par 9.'
    correction: 'a) Vrai, $35 = 7 \times 5$. b) Vrai, $70 = 14 \times 5$. c) Faux,

      $26 = 4 \times 6 + 2$. d) Vrai, $0 = 9 \times 0$.'
  - numero: 20
    etoiles: 2
    enonce: 'Un nombre s''écrit $a = 2^{2} \times 3^{2} \times 7$. a) Calcule $a$. b) Sans

      poser de division, dis si $a$ est divisible par 4, par 9, par 8 et par 21.'
    correction: 'a) $a = 252$. b) Divisible par 4, par 9 et par 21 ; pas par 8, qui exige trois

      facteurs 2.'
  - numero: 21
    etoiles: 2
    enonce: 'Dresse le tableau des soustractions successives pour 56 et 42, puis donne

      PGCD$\left(56\,;\,42\right)$.'
    correction: '$\left(56\,;\,42\right) \rightarrow \left(42\,;\,14\right) \rightarrow \left(28\,;\,14\right)
      \rightarrow \left(14\,;\,14\right)$ : PGCD $= 14$.'
  - numero: 22
    etoiles: 2
    enonce: Les nombres 375 et 100 sont-ils premiers entre eux ? Et 42 et 55 ?
    correction: 'Non pour 375 et 100 : PGCD $= 25$. Oui pour 42 et 55 : PGCD $= 1$.'
  - numero: 23
    etoiles: 2
    enonce: 'Simplifie à l''aide du PGCD : a) $\frac{72}{48}$ ; b) $\frac{144}{132}$ ;

      c) $\frac{18}{84}$.'
    correction: 'a) PGCD $= 24$, d''où $\frac{3}{2}$. b) PGCD $= 12$, d''où $\frac{12}{11}$.

      c) PGCD $= 6$, d''où $\frac{3}{14}$.'
  - numero: 24
    etoiles: 2
    enonce: 'Une commerçante de Ouahigouya a 90 oignons et 60 tomates. Elle veut des paquets

      identiques, oignons d''un côté, tomates de l''autre, avec le même nombre d''articles par paquet.

      Quelles tailles de paquet permettent de tout ranger sans reste ?'
    correction: 'PGCD$\left(90\,;\,60\right) = 30$ : les diviseurs de 30, soit

      1 ; 2 ; 3 ; 5 ; 6 ; 10 ; 15 ; 30.'
  - numero: 25
    etoiles: 2
    enonce: 'À Diébougou, la sirène de l''atelier sonne toutes les 45 minutes et la cloche de

      l''école toutes les 60 minutes. Elles ont sonné ensemble à 7 h 00. a) À quelle heure sonneront-elles

      de nouveau ensemble ? b) Combien de fois la sirène aura-t-elle sonné entre les deux ?


      ### Entraînement intensif : de la décomposition au PGCD, au PPCM et à la fraction'
    correction: 'a) PPCM$\left(45\,;\,60\right) = 180$ min $= 3$ h, donc 10 h 00. b) $180 \div 45 = 4$,

      donc 3 sonneries entre les deux.'
  - numero: 26
    etoiles: 2
    enonce: 'Calcule le PGCD **et** le PPCM de : a) 18 et 30 ; b) 60 et 84 ; c) 48 et 132.'
    correction: a) 6 et 90. b) 12 et 420. c) 12 et 528.
  - numero: 27
    etoiles: 2
    enonce: 'Calcule le PGCD et le PPCM de 270 et 252, puis contrôle avec la relation du

      cours.'
    correction: '$270 = 2 \times 3^{3} \times 5$ et $252 = 2^{2} \times 3^{2} \times 7$ :

      PGCD $= 18$, PPCM $= 3\,780$. Contrôle : $18 \times 3\,780 = 68\,040 = 270 \times 252$. ✓'
  - numero: 28
    etoiles: 2
    enonce: 'On donne PGCD$\left(72\,;\,120\right) = 24$ et PGCD$\left(8\,;\,12\right) = 4$.

      Calcule les deux PPCM sans écrire la moindre liste de multiples.'
    correction: $\frac{72 \times 120}{24} = 360$ ; $\frac{96}{4} = 24$.
  - numero: 29
    etoiles: 2
    enonce: 'Rends irréductibles : a) $\frac{540}{675}$ ; b) $\frac{294}{270}$.'
    correction: a) PGCD $= 135$, d'où $\frac{4}{5}$. b) PGCD $= 6$, d'où $\frac{49}{45}$.
  - numero: 30
    etoiles: 2
    enonce: 'Réduis au même dénominateur à l''aide du PPCM : a) $\frac{3}{4}$ et

      $\frac{5}{9}$ ; b) $\frac{7}{6}$ et $\frac{5}{3}$.'
    correction: 'a) PPCM $= 36$ : $\frac{27}{36}$ et $\frac{20}{36}$. b) PPCM $= 6$ : $\frac{7}{6}$

      et $\frac{10}{6}$.'
  - numero: 31
    etoiles: 2
    enonce: 'À l''aide du PGCD et du PPCM de 42 et 70, calcule

      $\frac{5}{42} + \frac{9}{70}$ et rends le résultat irréductible.'
    correction: 'PGCD $= 14$, PPCM $= 210$ ;

      $\frac{25}{210} + \frac{27}{210} = \frac{52}{210} = \frac{26}{105}$.'
  - numero: 32
    etoiles: 2
    enonce: 'Le PGCD de 18 et d''un entier $n$ vaut 6, et $n$ est compris entre 20 et 30.

      Quelles sont les valeurs possibles de $n$ ?


      ### ★★★ Défis de maîtrise'
    correction: '$n$ est multiple de 6 : 24 et 30, qui conviennent toutes deux.'
  - numero: 33
    etoiles: 3
    enonce: 'Un couturier de Solenzo dispose de 108 boutons blancs et 144 boutons noirs. Il

      veut composer des sachets identiques en utilisant tous les boutons. a) Quel est le plus grand nombre

      de sachets ? b) Que contient alors un sachet ? c) Pourrait-il faire exactement 18 sachets ?'
    correction: 'Le nombre de sachets divise 108 **et** 144, et on le veut maximal : c''est un PGCD.

      $108 = 2^{2} \times 3^{3}$, $144 = 2^{4} \times 3^{2}$. a) $2^{2} \times 3^{2} = 36$ sachets.

      b) 3 blancs et 4 noirs. c) Oui, 18 divise 36 : 6 blancs et 8 noirs par sachet.'
  - numero: 34
    etoiles: 3
    enonce: 'De la gare de Zorgho partent trois cars : toutes les 20 minutes, toutes les

      30 minutes, toutes les 45 minutes. Ils sont partis ensemble à 6 h 00. a) À quelle heure les trois

      repartiront-ils ensemble ? b) Combien de départs le premier car aura-t-il effectués d''ici là ?'
    correction: '« Repartir ensemble » : PPCM, règle inchangée à trois nombres. $20 = 2^{2} \times 5$,

      $30 = 2 \times 3 \times 5$, $45 = 3^{2} \times 5$ : PPCM $= 180$ min $= 3$ h. a) 9 h 00.

      b) $180 \div 20 = 9$ départs.'
  - numero: 35
    etoiles: 3
    enonce: 'À Nouna, un menuisier coupe deux planches en morceaux identiques, les plus

      longs possibles, sans perte : il obtient des morceaux de 18 cm. La première planche mesurait 54
      cm,

      la seconde mesure entre 60 cm et 80 cm. Quelle est la longueur de la seconde planche ?'
    correction: 'Le PGCD est donné, on cherche une donnée : $L$ multiple de 18 avec

      PGCD$\left(54\,;\,L\right) = 18$. Entre 60 et 80, seul 72 convient. La planche mesure 72 cm.'
  - numero: 36
    etoiles: 3
    enonce: 'Trouve deux entiers dont le PGCD vaut 6 et le PPCM vaut 36. Y a-t-il plusieurs

      réponses ? Explique comment tu les as cherchées.'
    correction: 'La relation donne $a \times b = 216$. Avec $a = 6a''$ et $b = 6b''$, $a''$ et $b''$

      premiers entre eux : $36a''b'' = 216$, donc $a''b'' = 6 = 1 \times 6 = 2 \times 3$.

      Deux réponses : $\left(6\,;\,36\right)$ et $\left(12\,;\,18\right)$.'
  - numero: 37
    etoiles: 3
    enonce: 'Vrai ou faux ? Justifie par un argument général ou un contre-exemple.

      a) Deux nombres pairs ne sont jamais premiers entre eux. b) Deux nombres impairs sont toujours

      premiers entre eux. c) Deux nombres premiers différents sont toujours premiers entre eux. d) Si

      deux nombres sont premiers entre eux, alors ils sont tous les deux premiers.'
    correction: 'a) Vrai : 2 est diviseur commun. b) Faux : PGCD$\left(15\,;\,25\right) = 5$.

      c) Vrai : $p$ ne divise pas $q$, donc le seul diviseur commun est 1. d) Faux : 8 et 15.'
  - numero: 38
    etoiles: 3
    enonce: 'Énoncé : « à Kaya, une commerçante a 84 savons et 126 sachets de thé ; elle

      veut des lots tous identiques, sans rien laisser ; quel est le plus grand nombre de lots, et que

      contient un lot ? » Voici la copie d''un élève.


      > Ligne 1 : $84 = 2^{2} \times 3 \times 7$

      > Ligne 2 : $126 = 2 \times 3^{2} \times 7$

      > Ligne 3 : je garde tous les facteurs à la plus grande puissance, $2^{2} \times 3^{2} \times 7
      = 252$

      > Ligne 4 : donc elle peut faire 252 lots

      > Ligne 5 : chaque lot contient $84 \div 252$ savons


      a) Repère la ligne qui casse le raisonnement. b) Montre, sans refaire le calcul, que la ligne 4

      était impossible. c) Refais la résolution proprement.'
    correction: '« Lots identiques », « le plus grand » : c''est un PGCD. a) Ligne 3 : la plus grande

      puissance, c''est la règle du **PPCM**. b) 252 lots pour 84 savons, impossible : il faut au moins
      un

      savon par lot. c) Communs à la plus petite puissance : $2 \times 3 \times 7 = 42$ lots, de 2 savons

      et 3 sachets.'
  - numero: 39
    etoiles: 3
    enonce: 'Un élève affirme : « si un nombre est divisible par 3 et par 2, alors il est

      divisible par 6 ». a) Donne trois exemples qui semblent le confirmer. b) Explique pourquoi des

      exemples ne suffisent pas à le prouver. c) Prouve-le pour **tout** entier, en raisonnant sur la

      décomposition. d) Le même raisonnement donnerait-il « divisible par 2 et par 4, donc par 8 » ?'
    correction: 'a) 12, 18 et 24. b) Des exemples ne disent rien des entiers non essayés ; un

      contre-exemple, lui, suffirait. c) La décomposition de $n$ contient un facteur 2 et un facteur 3

      **distincts**, donc le produit 6 : $n = 6k$. d) Non : 2 et 4 ne sont pas premiers entre eux, le

      facteur 2 serait compté deux fois. Contre-exemple : 20.'
  fiche_revision:
  - '**Multiple et diviseur.** $a = b \times q$ : le multiple est le grand, le diviseur est le petit.'
  - '**Critères.** Fin du nombre pour 2, 5 et 4 ; somme des chiffres pour 3 et 9 ; par 6 : 2 et 3.'
  - '**Nombre premier.** Exactement deux diviseurs ; 1 n''est pas premier ; on s''arrête quand le premier

    testé, multiplié par lui-même, dépasse le nombre.'
  - '**Décomposer.** Diviser par 2, puis 3, puis 5… jusqu''à 1 : $360 = 2^{3} \times 3^{2} \times 5$.'
  - '**PGCD.** Facteurs **communs**, **plus petite** puissance. Parts identiques, fraction irréductible.'
  - '**PPCM.** **Tous** les facteurs, **plus grande** puissance. Rendez-vous, même dénominateur.'
  - '**Relation.** PGCD $\times$ PPCM $= a \times b$. **Premiers entre eux** : PGCD $= 1$.'
  trouve_erreur:
  - faux: 12 est un diviseur de 3
    correction: '$12 = 3 \times 4$ : 12 est multiple de 3, et 3 est diviseur de 12.'
  - faux: 91 est premier, car il est impair
    correction: 'Impair ne suffit pas : $91 = 7 \times 13$.'
  - faux: $60 = 4 \times 15$, voilà la décomposition
    correction: 'Ni 4 ni 15 n''est premier : $60 = 2^{2} \times 3 \times 5$.'
  - faux: PGCD$\left(60\,;\,90\right) = 2^{2} \times 3^{2} \times 5 = 180$
    correction: En gardant tout, on calcule le PPCM. PGCD $= 30$.
  cartographie_lacunes:
  - lacune: Divisibilité et PGCD non maîtrisés, fractions non simplifiées
    bloque_en: nombres rationnels
  source_path: remediation\4eme\modules_c\M02.md
- niveau: 4eme
  module: 3
  module_titre: 'Les fractions : les quatre opérations'
  pourquoi: 'Quatre erreurs reviennent : additionner les dénominateurs, chercher un dénominateur commun
    pour multiplier, retourner la mauvaise fraction, ne pas simplifier. Tu connais ces règles, c''est
    leur application qui dérape.'
  diagnostic:
  - question: Rends $\frac{90}{120}$ irréductible.
    reponse: PGCD $= 30$, donc $\frac{3}{4}$
  - question: Calcule $\frac{3}{8} + \frac{5}{12}$.
    reponse: $\frac{9}{24} + \frac{10}{24} = \frac{19}{24}$
  - question: Calcule $\frac{5}{6} - \frac{2}{3}$.
    reponse: $\frac{5}{6} - \frac{4}{6} = \frac{1}{6}$
  - question: Calcule $\frac{4}{9} \times \frac{3}{8}$ en simplifiant avant d'effectuer.
    reponse: $\frac{1}{6}$
  - question: Calcule $6 \div \frac{3}{4}$.
    reponse: $6 \times \frac{4}{3} = 8$
  lecons:
  - id: 4eme_M03_L1
    numero: '3.1'
    titre: Fractions égales et simplification
    retenir:
    - Multiplier, ou diviser, numérateur **et** dénominateur par un même nombre non nul ne change pas
      la fraction.
    - 'Les fractions ainsi obtenues sont **égales** : $\frac{2}{3} = \frac{4}{6} = \frac{8}{12}$.'
    - 'Une fraction est **irréductible** quand numérateur et dénominateur sont premiers entre eux : divise
      les deux par leur **PGCD**.'
    - '**Fraction d''une quantité** : les $\frac{a}{b}$ de $N$, c''est $\left(N \div b\right) \times a$.
      « De » se traduit par une multiplication.'
    methode:
      titre: Rendre une fraction irréductible
      etapes:
      - Cherche le PGCD, ou à défaut un diviseur commun visible.
      - Divise le numérateur par ce nombre.
      - Divise le dénominateur par le même nombre.
      - Recommence tant qu'un diviseur commun subsiste.
    exemple_resolu: 'Rends $\frac{126}{84}$ irréductible.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On décompose. | $126 = 2 \times 3^{2} \times 7$ et $84 = 2^{2} \times 3 \times 7$ |

      | Facteurs communs, plus petite puissance. | PGCD $= 42$ |

      | On divise haut et bas par $42$. | $\frac{126}{84} = \frac{3}{2}$ |

      | **Vérification :** $3$ et $2$ premiers entre eux, et $126 \div 84 = 1{,}5$ ✓ | |'
    erreurs_frequentes:
    - erreur: simplifier en soustrayant, $\frac{8}{12} = \frac{8 - 2}{12 - 2}$.
      correction: 'simplifier, c''est **diviser** : $\frac{2}{3}$.'
    - erreur: n'agir que sur une ligne, $\frac{8}{12} = \frac{2}{12}$.
      correction: en haut comme en bas.
    declic: null
    figures: []
  - id: 4eme_M03_L2
    numero: '3.2'
    titre: 'Réduire au même dénominateur : comparer, additionner, soustraire'
    retenir:
    - 'Réduire, c''est réécrire deux fractions avec un **dénominateur commun** : chaque numérateur est
      multiplié par le même nombre que son dénominateur.'
    - 'Un dénominateur multiple de l''autre : il est le dénominateur commun. Deux dénominateurs premiers
      entre eux : leur produit. Sinon : le PPCM.'
    - 'Un entier s''écrit en fraction : $1 = \frac{8}{8}$, $2 = \frac{8}{4}$.'
    - '**Comparer** : même dénominateur, le plus grand numérateur gagne ($\frac{4}{9} < \frac{7}{9}$)
      ; même numérateur, le **plus petit** dénominateur ($\frac{3}{5} > \frac{3}{8}$) ; sinon on réduit.'
    - 'Deux repères qui évitent le calcul : $1$ ($\frac{7}{9} < 1 < \frac{5}{4}$) et $\frac{1}{2}$ ($\frac{4}{9}
      < \frac{1}{2} < \frac{5}{8}$).'
    methode:
      titre: Additionner ou soustraire deux fractions
      etapes:
      - Simplifie chaque fraction, et écris en fraction l'entier éventuel.
      - Prends le PPCM des dénominateurs.
      - Réécris chaque fraction avec ce dénominateur, numérateur compris.
      - Opère sur les numérateurs seuls, puis simplifie.
    exemple_resolu: 'Calcule $\frac{2}{9} + \frac{5}{6}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Aucun dénominateur multiple de l''autre : PPCM. | $9 = 3^{2}$, $6 = 2 \times 3$, PPCM $= 18$ |

      | On réécrit les deux fractions. | $\frac{2}{9} = \frac{4}{18}$ et $\frac{5}{6} = \frac{15}{18}$
      |

      | Parts de même taille : on ajoute les numérateurs. | $\frac{4}{18} + \frac{15}{18} = \frac{19}{18}$
      |

      | **Vérification :** $\frac{19}{18} > 1$ : cohérent, $\frac{5}{6}$ en manquait déjà de peu ✓ | |'
    erreurs_frequentes:
    - erreur: ne changer que le dénominateur, $\frac{2}{3} = \frac{2}{12}$.
      correction: 'les parts sont coupées, il faut en prendre plus : $\frac{8}{12}$.'
    - erreur: soustraire les dénominateurs entre eux, $\frac{3}{4} - \frac{1}{3} = \frac{2}{1}$.
      correction: $\frac{9}{12} - \frac{4}{12} = \frac{5}{12}$.
    declic: 'Si tu écris encore $\frac{1}{3} + \frac{1}{4} = \frac{2}{7}$ — « Un tiers plus un quart »,
      c''est « un mouton plus une chèvre » : tant que les objets n''ont pas le même nom, on ne totalise
      rien. Le dénominateur est ce nom, il ne s''additionne pas. Et $\frac{2}{7} < \frac{1}{3}$ : on a
      ajouté, le résultat aurait diminué. #### MÉTHODE : Additionner ou soustraire deux fractions 1. Simplifie
      chaque fraction, et écris en fraction l''entier éventuel. 2. Prends le PPCM des dénominateurs. 3.
      Réécris chaque fraction avec ce dénominateur, numérateur compris. 4. Opère sur les numérateurs seuls,
      puis simplifie.'
    figures:
    - figures/m03_f2.svg
  - id: 4eme_M03_L3
    numero: '3.3'
    titre: Multiplier, inverser, diviser
    retenir:
    - 'Par un entier : $k \times \frac{a}{b} = \frac{k \times a}{b}$ ; les parts gardent leur taille.'
    - '**Aucun dénominateur commun** pour un produit. On simplifie **avant** d''effectuer, un facteur
      du haut avec un facteur du bas, même venus de fractions différentes.'
    - 'L''**inverse** de $\frac{a}{b}$ ($a$ non nul) est $\frac{b}{a}$ : leur produit vaut $1$. Celui
      de $5$ est $\frac{1}{5}$ ; $0$ n''a pas d''inverse.'
    - Diviser, c'est multiplier par l'inverse du **diviseur**, écrit **après** le signe.
    methode:
      titre: Multiplier, et diviser
      etapes:
      - 'Division : retourne le **diviseur** et remplace $\div$ par $\times$.'
      - Écris le produit des numérateurs sur le produit des dénominateurs, sans effectuer.
      - Simplifie tout facteur commun au haut et au bas, tant qu'il en reste.
      - Effectue les multiplications restantes.
    exemple_resolu: 'Calcule $\frac{7}{25} \times \frac{5}{7}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On écrit en ligne, sans dénominateur commun. | $\frac{7}{25} \times \frac{5}{7} = \frac{7 \times
      5}{25 \times 7}$ |

      | Le facteur $7$ est en haut et en bas. | $= \frac{5}{25}$ |

      | Il reste le facteur commun $5$. | $= \frac{1}{5}$ |

      | **Vérification :** sans simplifier, $\frac{35}{175}$, et $175 = 35 \times 5$ ✓ | |'
    erreurs_frequentes:
    - erreur: réduire au même dénominateur pour multiplier.
      correction: inutile ; le dénominateur commun ne sert qu'à l'addition, la soustraction et la comparaison.
    - erreur: retourner le mauvais terme, $\frac{3}{5} \div \frac{2}{7} = \frac{5}{3} \times \frac{2}{7}$.
      correction: 'on retourne le **diviseur** : $\frac{3}{5} \times \frac{7}{2} = \frac{21}{10}$.'
    declic: null
    figures: []
  - id: 4eme_M03_L4
    numero: '3.4'
    titre: Fractions en étages et fraction d'un reste
    retenir:
    - On calcule entièrement le numérateur, entièrement le dénominateur, puis on divise.
    - '**Fraction d''une fraction** : les $\frac{a}{b}$ des $\frac{c}{d}$ d''une quantité, c''est $\frac{a}{b}
      \times \frac{c}{d}$. Deux prélèvements successifs se combinent par un **produit**.'
    - '**Fraction d''un reste** : « le tiers du reste » n''est pas « le tiers du départ ». Relis de quoi
      on prend la fraction.'
    - '**Remonter au tout** : si $\frac{a}{b}$ du tout vaut $N$, le tout vaut $\left(N \div a\right) \times
      b$.'
    methode:
      titre: Calculer une expression en étages
      etapes:
      - Repère la grande barre et écris les deux blocs entre parenthèses.
      - Calcule le numérateur seul, jusqu'à une fraction unique.
      - Calcule le dénominateur seul, de même.
      - Remplace la barre par un produit par l'inverse, puis simplifie.
    exemple_resolu: 'Calcule $\left(\frac{3}{4} + \frac{1}{2}\right) \div \left(\frac{5}{6} - \frac{1}{3}\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Premier bloc seul. | $\frac{3}{4} + \frac{2}{4} = \frac{5}{4}$ |

      | Second bloc seul. | $\frac{5}{6} - \frac{2}{6} = \frac{1}{2}$ |

      | On multiplie par l''inverse du diviseur. | $\frac{5}{4} \times \frac{2}{1} = \frac{5}{2}$ |

      | **Vérification :** diviseur plus petit que $1$, le résultat dépasse $\frac{5}{4}$ ✓ | |'
    erreurs_frequentes:
    - erreur: appliquer la seconde fraction au départ au lieu du reste.
      correction: « de ce qui lui reste » signifie que le tout a changé.
    - erreur: attaquer le calcul le plus visible sans finir les deux blocs.
      correction: le haut, le bas, la division en dernier.
    declic: null
    figures:
    - figures/m03_f4.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Simplifie : a) $\frac{2}{4}\,;\,$ b) $\frac{3}{9}\,;\,$ c) $\frac{4}{10}$.'
    correction: a) $\frac{1}{2}$ ; b) $\frac{1}{3}$ ; c) $\frac{2}{5}$.
  - numero: 2
    etoiles: 1
    enonce: 'Complète : a) $\frac{1}{2} = \frac{5}{\dots}\,;\,$ b) $\frac{2}{3} = \frac{8}{\dots}\,;\,$
      c) $\frac{3}{5} = \frac{\dots}{15}$.'
    correction: a) $10$ (on multiplie par $5$) ; b) $12$ (par $4$) ; c) $9$ (par $3$).
  - numero: 3
    etoiles: 1
    enonce: 'Simplifie jusqu''à l''irréductible : a) $\frac{8}{12}\,;\,$ b) $\frac{9}{12}\,;\,$ c) $\frac{15}{20}$.'
    correction: a) $\frac{2}{3}$ ; b) $\frac{3}{4}$ ; c) $\frac{3}{4}$.
  - numero: 4
    etoiles: 1
    enonce: 'Simplifie : a) $\frac{250}{65}\,;\,$ b) $\frac{25}{40}\,;\,$ c) $\frac{11}{44}$.'
    correction: a) $\frac{50}{13}$ (par $5$), irréductible ; b) $\frac{5}{8}$ ; c) $\frac{1}{4}$.
  - numero: 5
    etoiles: 1
    enonce: 'Simplifie : a) $\frac{15}{25}\,;\,$ b) $\frac{90}{120}$.'
    correction: a) $\frac{3}{5}$ (par $5$) ; b) $\frac{3}{4}$ (PGCD $= 30$).
  - numero: 6
    etoiles: 1
    enonce: Écris trois fractions égales à $\frac{2}{5}$.
    correction: $\frac{2}{5} = \frac{4}{10} = \frac{6}{15} = \frac{8}{20}$.
  - numero: 7
    etoiles: 1
    enonce: 'Recopie et complète : $\frac{3}{7} = \frac{\dots}{21} = \frac{15}{\dots} = \frac{\dots}{56}$.'
    correction: $\frac{3}{7} = \frac{9}{21} = \frac{15}{35} = \frac{24}{56}$.
  - numero: 8
    etoiles: 1
    enonce: 'Simplifie après factorisation : a) $\frac{5 \times 7 \times 10}{10 \times 6}\,;\,$ b) $\frac{15
      \times 7}{4 \times 7 \times 6}\,;\,$ c) $\frac{11 \times 3 \times 8 \times 4}{25 \times 3 \times
      4}$.'
    correction: a) $\frac{35}{6}$ (on ôte $10$) ; b) $\frac{15}{24} = \frac{5}{8}$ ; c) $\frac{88}{25}$.
  - numero: 9
    etoiles: 1
    enonce: 'Calcule : a) les $\frac{3}{8}$ de $24\,;\,$ b) les $\frac{2}{3}$ de $24\,;\,$ c) les $\frac{3}{5}$
      de $40$.'
    correction: a) $24 \div 8 \times 3 = 9$ ; b) $16$ ; c) $24$.
  - numero: 10
    etoiles: 1
    enonce: 'Réduis au même dénominateur : a) $\frac{13}{12}$ et $\frac{7}{12}\,;\,$ b) $\frac{3}{8}$
      et $\frac{5}{6}\,;\,$ c) $\frac{5}{2}$ et $\frac{7}{4}$.'
    correction: a) déjà au dénominateur $12$ ; b) $\frac{9}{24}$ et $\frac{20}{24}$ ; c) $\frac{10}{4}$
      et $\frac{7}{4}$.
  - numero: 11
    etoiles: 1
    enonce: 'Réduis au même dénominateur : a) $\frac{1}{3}$ et $\frac{5}{6}\,;\,$ b) $\frac{2}{5}$ et
      $\frac{3}{4}\,;\,$ c) $\frac{7}{10}$ et $\frac{1}{15}$.'
    correction: a) $\frac{2}{6}$ et $\frac{5}{6}$ ; b) $\frac{8}{20}$ et $\frac{15}{20}$ ; c) $\frac{21}{30}$
      et $\frac{2}{30}$.
  - numero: 12
    etoiles: 1
    enonce: 'Réduis au même dénominateur : a) $\frac{5}{6}$ et $\frac{7}{9}\,;\,$ b) $\frac{1}{2}$, $\frac{2}{3}$
      et $\frac{3}{4}$.'
    correction: a) $\frac{15}{18}$ et $\frac{14}{18}$ ; b) $\frac{6}{12}$, $\frac{8}{12}$, $\frac{9}{12}$.
  - numero: 13
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $\frac{1}{2}\,;\,\frac{2}{3}\,;\,\frac{5}{6}\,;\,\frac{3}{4}$.'
    correction: 'Au dénominateur $12$ : $6 < 8 < 9 < 10$, donc $\frac{1}{2} < \frac{2}{3} < \frac{3}{4}
      < \frac{5}{6}$.'
  - numero: 14
    etoiles: 1
    enonce: 'Range dans l''ordre décroissant : $\frac{7}{10}\,;\,\frac{2}{3}\,;\,\frac{3}{5}$.'
    correction: 'Au dénominateur $30$ : $21 > 20 > 18$, donc $\frac{7}{10} > \frac{2}{3} > \frac{3}{5}$.'
  - numero: 15
    etoiles: 1
    enonce: 'Compare sans réduire, règle à l''appui : a) $\frac{4}{9}$ et $\frac{7}{9}\,;\,$ b) $\frac{3}{5}$
      et $\frac{3}{8}\,;\,$ c) $\frac{5}{4}$ et $1$.'
    correction: 'a) Même dénominateur : $\frac{4}{9} < \frac{7}{9}$. b) Même numérateur : $\frac{3}{5}
      > \frac{3}{8}$. c) Numérateur plus grand : $\frac{5}{4} > 1$.'
  - numero: 16
    etoiles: 1
    enonce: 'Compare, en simplifiant d''abord : a) $\frac{3}{12}$ et $\frac{1}{4}\,;\,$ b) $\frac{5}{40}$
      et $\frac{1}{8}$.'
    correction: 'a) et b) : égales, $\frac{3}{12} = \frac{1}{4}$ et $\frac{5}{40} = \frac{1}{8}$.'
  - numero: 17
    etoiles: 1
    enonce: 'Calcule : a) $\frac{2}{3} + \frac{1}{6}\,;\,$ b) $\frac{1}{2} + \frac{1}{4} + \frac{1}{8}$.'
    correction: a) $\frac{4}{6} + \frac{1}{6} = \frac{5}{6}$ ; b) $\frac{4}{8} + \frac{2}{8} + \frac{1}{8}
      = \frac{7}{8}$.
  - numero: 18
    etoiles: 1
    enonce: 'Calcule : a) $\frac{5}{6} - \frac{2}{3}\,;\,$ b) $\frac{3}{4} - \frac{1}{2}\,;\,$ c) $\frac{7}{10}
      - \frac{1}{5}$.'
    correction: a) $\frac{1}{6}$ ; b) $\frac{1}{4}$ ; c) $\frac{5}{10} = \frac{1}{2}$.
  - numero: 19
    etoiles: 1
    enonce: 'Calcule : a) $1 - \frac{2}{3}\,;\,$ b) $2 - \frac{5}{4}\,;\,$ c) $\frac{3}{2} - \frac{5}{6}$.'
    correction: a) $\frac{3}{3} - \frac{2}{3} = \frac{1}{3}$ ; b) $\frac{8}{4} - \frac{5}{4} = \frac{3}{4}$
      ; c) $\frac{9}{6} - \frac{5}{6} = \frac{2}{3}$.
  - numero: 20
    etoiles: 1
    enonce: 'Quelle fraction ajouter : a) à $\frac{3}{8}$ pour obtenir $1$ ? b) à $\frac{2}{5}$ pour obtenir
      $\frac{9}{10}$ ?'
    correction: a) $\frac{8}{8} - \frac{3}{8} = \frac{5}{8}$ ; b) $\frac{9}{10} - \frac{4}{10} = \frac{1}{2}$.
  - numero: 21
    etoiles: 1
    enonce: Quelle fraction faut-il retirer à $\frac{5}{6}$ pour obtenir $\frac{1}{3}$ ?
    correction: $\frac{5}{6} - \frac{2}{6} = \frac{3}{6} = \frac{1}{2}$.
  - numero: 22
    etoiles: 1
    enonce: 'Calcule : a) $5 \times \frac{2}{3}\,;\,$ b) $\frac{3}{7} \times 4\,;\,$ c) $6 \times \frac{5}{12}$.'
    correction: Seul le numérateur est multiplié. a) $\frac{10}{3}$ ; b) $\frac{12}{7}$ ; c) $\frac{5}{2}$.
  - numero: 23
    etoiles: 1
    enonce: 'Écris l''inverse de $\frac{3}{7}$, de $5$ et de $\frac{1}{8}$.


      ### Entraînement ★★


      *Entraînement intensif : dénominateur commun, calcul sur les numérateurs, simplification.*'
    correction: $\frac{7}{3}$ ; $\frac{1}{5}$ (car $5 = \frac{5}{1}$) ; $8$.
  - numero: 24
    etoiles: 2
    enonce: 'Calcule, résultat irréductible : a) $\frac{3}{8} + \frac{5}{12}\,;\,$ b) $\frac{2}{9} + \frac{1}{6}\,;\,$
      c) $\frac{4}{15} + \frac{3}{10}$.'
    correction: a) $\frac{9}{24} + \frac{10}{24} = \frac{19}{24}$ ; b) $\frac{4}{18} + \frac{3}{18} =
      \frac{7}{18}$ ; c) $\frac{8}{30} + \frac{9}{30} = \frac{17}{30}$.
  - numero: 25
    etoiles: 2
    enonce: 'Calcule et simplifie : a) $\frac{5}{8} - \frac{1}{6}\,;\,$ b) $\frac{7}{12} - \frac{1}{18}\,;\,$
      c) $\frac{7}{10} - \frac{2}{15}$.'
    correction: a) $\frac{15}{24} - \frac{4}{24} = \frac{11}{24}$ ; b) $\frac{21}{36} - \frac{2}{36} =
      \frac{19}{36}$ ; c) $\frac{21}{30} - \frac{4}{30} = \frac{17}{30}$.
  - numero: 26
    etoiles: 2
    enonce: 'Complète : a) $\frac{67}{10} = \dots + \frac{7}{10}\,;\,$ b) $\frac{62}{7} = \dots + \frac{6}{7}\,;\,$
      c) $\frac{79}{8} = \dots + \frac{7}{8}$.'
    correction: On divise numérateur par dénominateur. a) $6$ ; b) $8$ ; c) $9$.
  - numero: 27
    etoiles: 2
    enonce: 'Calcule en simplifiant : a) $\frac{4}{9} \times \frac{3}{8}\,;\,$ b) $\frac{5}{6} \times
      \frac{9}{10}\,;\,$ c) $\frac{14}{15} \times \frac{25}{21}$.'
    correction: a) $\frac{1}{6}$ (on simplifie $3$ avec $9$, $4$ avec $8$) ; b) $\frac{3}{4}$ ; c) $\frac{10}{9}$.
  - numero: 28
    etoiles: 2
    enonce: 'Simplifie avant de multiplier : a) $\frac{24}{231} \times \frac{21}{32}\,;\,$ b) $\frac{35}{48}
      \times \frac{16}{21}\,;\,$ c) $\frac{6}{11} \times \frac{10}{33}$.'
    correction: a) $\frac{3}{44}$ (par $8$ et par $21$) ; b) $\frac{5}{9}$ (par $7$ et par $16$) ; c)
      $\frac{60}{363} = \frac{20}{121}$.
  - numero: 29
    etoiles: 2
    enonce: 'Trouve $x$ : a) $\frac{1}{25} \times x = 1\,;\,$ b) $\frac{4}{7} \times x = 1\,;\,$ c) $\frac{7}{17}
      \times x = 1$.'
    correction: $x$ est l'inverse. a) $25$ ; b) $\frac{7}{4}$ ; c) $\frac{17}{7}$.
  - numero: 30
    etoiles: 2
    enonce: 'Calcule : a) $\frac{3}{5} \div \frac{2}{7}\,;\,$ b) $\frac{4}{9} \div \frac{8}{3}\,;\,$ c)
      $6 \div \frac{3}{4}$.'
    correction: a) $\frac{3}{5} \times \frac{7}{2} = \frac{21}{10}$ ; b) $\frac{4}{9} \times \frac{3}{8}
      = \frac{1}{6}$ ; c) $6 \times \frac{4}{3} = 8$.
  - numero: 31
    etoiles: 2
    enonce: a) Compare $\frac{5}{6}$ et $\frac{7}{9}$. b) Parmi $\frac{16}{24}$, $\frac{10}{15}$ et $\frac{6}{9}$,
      lesquelles sont égales ?
    correction: a) $\frac{15}{18} > \frac{14}{18}$, donc $\frac{5}{6} > \frac{7}{9}$. b) Les trois valent
      $\frac{2}{3}$.
  - numero: 32
    etoiles: 2
    enonce: À Ziniaré, une couturière utilise $\frac{3}{4}$ de mètre de tissu par chemise. Combien en
      taille-t-elle dans $9$ mètres ?
    correction: $9 \div \frac{3}{4} = 9 \times \frac{4}{3} = 12$ chemises.
  - numero: 33
    etoiles: 2
    enonce: À Dano, un maçon a monté $\frac{1}{4}$ d'un mur lundi et $\frac{2}{5}$ mardi. a) Quelle fraction
      en deux jours ? b) Quelle fraction reste-t-il ?
    correction: a) $\frac{5}{20} + \frac{8}{20} = \frac{13}{20}$ ; b) $\frac{20}{20} - \frac{13}{20} =
      \frac{7}{20}$.
  - numero: 34
    etoiles: 2
    enonce: Dans un collège de Koudougou, $\frac{3}{5}$ des élèves sont des filles, et les $\frac{2}{3}$
      des filles portent un pagne. Quelle fraction des élèves porte un pagne ?
    correction: '« Des » vaut $\times$ : $\frac{2}{3} \times \frac{3}{5} = \frac{2}{5}$ des élèves.'
  - numero: 35
    etoiles: 2
    enonce: Calcule les $\frac{2}{3}$ des $\frac{3}{4}$ d'une heure, en minutes.
    correction: $\frac{2}{3} \times \frac{3}{4} = \frac{1}{2}$ h, soit $30$ min.
  - numero: 36
    etoiles: 2
    enonce: 'Salif écrit : « pour réduire $\frac{2}{3}$ et $\frac{3}{5}$, je prends $15$ et j''obtiens
      $\frac{2}{15}$ et $\frac{3}{15}$ ». Explique l''erreur, puis corrige.


      ### ★★★ Défis de maîtrise'
    correction: 'Il n''a changé que les dénominateurs. Le numérateur suit : $\frac{2}{3} = \frac{10}{15}$
      et $\frac{3}{5} = \frac{9}{15}$.'
  - numero: 37
    etoiles: 3
    enonce: 'Calcule, résultat irréductible : a) $\left(\frac{5}{3} + \frac{1}{2}\right) \div \left(\frac{4}{5}
      - \frac{2}{3}\right)\,;\,$ b) $\left(\frac{3}{5} + \frac{2}{5}\right) \times \left(\frac{1}{4} +
      \frac{1}{2}\right)$.'
    correction: 'Chaque bloc en entier avant le signe qui les sépare. a) $\frac{13}{6} \div \frac{2}{15}
      = \frac{13}{6} \times \frac{15}{2} = \frac{65}{4}$ ; grand résultat, le diviseur est petit. b) Le
      premier bloc vaut $1$ : le produit égale le second, $\frac{3}{4}$.'
  - numero: 38
    etoiles: 3
    enonce: Safi a $1\,200$ FCFA. Elle dépense le $\frac{1}{5}$ de cette somme, puis la $\frac{1}{2}$
      du reste. a) Combien lui reste-t-il ? b) Quelle fraction du départ ce reste représente-t-il ?
    correction: 'La seconde fraction porte sur le reste. a) $240$ dépensés, reste $960$ ; moitié $480$
      : il reste $480$ FCFA. b) $\frac{480}{1\,200} = \frac{2}{5}$, soit $\frac{1}{2} \times \frac{4}{5}$.'
  - numero: 39
    etoiles: 3
    enonce: À Pouytenga, un commerçant vend les $\frac{3}{7}$ de son stock de savons le matin, le $\frac{1}{3}$
      du même stock l'après-midi, et il lui reste $55$ savons. Combien en avait-il ?
    correction: 'On exprime le reste en fraction du stock. Vendu $\frac{9}{21} + \frac{7}{21} = \frac{16}{21}$,
      reste $\frac{5}{21}$. Si $\frac{5}{21}$ font $55$, alors $\frac{1}{21}$ fait $11$ : stock $= 231$
      savons.'
  - numero: 40
    etoiles: 3
    enonce: 'Quatre héritiers se partagent une somme : $\frac{1}{6}$, $\frac{2}{5}$, $\frac{7}{20}$, et
      le reste, soit $50\,000$ FCFA, pour le quatrième. Quelle est la somme totale ?'
    correction: 'On cherche d''abord la part du quatrième. Au dénominateur $60$ : $\frac{10 + 24 + 21}{60}
      = \frac{11}{12}$, il reçoit donc $\frac{1}{12}$. Ce douzième vaut $50\,000$ : total $600\,000$ FCFA.'
  - numero: 41
    etoiles: 3
    enonce: 'a) Choisis trois fractions plus petites que $1$ et multiplie-les deux à deux : que constates-tu
      ? b) Explique, par la règle du produit, pourquoi le produit de deux fractions plus petites que $1$
      est plus petit que chacune. c) Et si un facteur dépasse $1$ ?'
    correction: 'a) $\frac{1}{2} \times \frac{2}{3} = \frac{1}{3}$, $\frac{2}{3} \times \frac{3}{4} =
      \frac{1}{2}$ : le produit est plus petit que les deux facteurs. b) Multiplier par $\frac{c}{d}$,
      c''est prendre les $\frac{c}{d}$ **de** l''autre ; si $\frac{c}{d} < 1$, on n''en prend qu''une
      partie. c) La conclusion tombe : $\frac{1}{2} \times \frac{3}{2} = \frac{3}{4} > \frac{1}{2}$.'
  - numero: 42
    etoiles: 3
    enonce: Trouve deux fractions dont la somme vaut $\frac{5}{6}$ et dont l'une est le double de l'autre.
    correction: 'Les deux réunies valent trois fois la plus petite : $\frac{5}{6} \div 3 = \frac{5}{18}$,
      et l''autre $\frac{10}{18} = \frac{5}{9}$.'
  - numero: 43
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une règle ou un contre-exemple. a) Le produit de deux fractions
      est toujours plus petit que chacune. b) Diviser par une fraction plus petite que $1$ donne un résultat
      plus grand. c) Tout nombre a un inverse. d) Multiplier deux fractions exige un dénominateur commun.
    correction: 'a) Faux : $\frac{3}{2} \times \frac{3}{2} = \frac{9}{4}$. b) Vrai : plus le diviseur
      est petit, plus il tient de fois, $6 \div \frac{1}{2} = 12$. c) Faux : $0$. d) Faux : on multiplie
      en ligne.'
  - numero: 44
    etoiles: 3
    enonce: '**Énoncé :** « Un éleveur a encaissé $180\,000$ FCFA. L''aliment du bétail lui prend le $\frac{1}{4}$
      de cette somme. Sur ce qui lui reste, il consacre les $\frac{2}{3}$ aux soins vétérinaires. Combien
      lui reste-t-il ? » **Copie :** *l.1* aliment $= 45\,000$ ; *l.2* soins $= 180\,000 \times \frac{2}{3}
      = 120\,000$ ; *l.3* dépensé $= 165\,000$ ; *l.4* reste $= 15\,000$ FCFA. a) Repère la ligne qui
      casse. b) Refais la résolution. c) Quelle fraction de la recette reste-t-il ?'
    correction: 'On vérifie de quel tout parle chaque fraction. a) La ligne 2 casse : les $\frac{2}{3}$
      portent sur le reste, $135\,000$, pas sur $180\,000$. b) Aliment $45\,000$ ; reste $135\,000$ ;
      soins $90\,000$ ; reste final $45\,000$ FCFA. c) $\frac{1}{3} \times \frac{3}{4} = \frac{1}{4}$
      de la recette.'
  fiche_revision:
  - '**Propriété fondamentale.** $\frac{a}{b} = \frac{a \times k}{b \times k}$ : en haut comme en bas,
    jamais par addition.'
  - '**Simplifier.** Divise haut et bas par leur PGCD ; on rend l''irréductible.'
  - '**Additionner, soustraire.** PPCM d''abord, puis on opère sur les numérateurs seuls.'
  - '**Multiplier.** Numérateurs entre eux, dénominateurs entre eux, en simplifiant avant. Aucun dénominateur
    commun.'
  - '**Inverse et division.** $\frac{a}{b} \div \frac{c}{d} = \frac{a}{b} \times \frac{d}{c}$ : on retourne
    le diviseur. $0$ n''a pas d''inverse.'
  - '**Comparer.** Même dénominateur, le plus grand numérateur ; même numérateur, le plus petit dénominateur
    ; sinon on réduit.'
  - '**Étages et reste.** La grande barre est une double parenthèse ; deux prélèvements successifs se
    combinent par un **produit**.'
  trouve_erreur:
  - faux: $\frac{2}{3} + \frac{1}{4} = \frac{3}{7}$
    correction: 'On n''additionne jamais les dénominateurs : $\frac{8}{12} + \frac{3}{12} = \frac{11}{12}$.'
  - faux: $\frac{8}{12} = \frac{8 - 4}{12 - 4} = \frac{4}{8}$
    correction: 'Simplifier, c''est diviser : $\frac{8 \div 4}{12 \div 4} = \frac{2}{3}$.'
  - faux: $\frac{3}{5} \div \frac{2}{7} = \frac{5}{3} \times \frac{2}{7}$
    correction: 'On retourne le diviseur : $\frac{3}{5} \times \frac{7}{2} = \frac{21}{10}$.'
  - faux: $\frac{3}{5}$ de $40 = 40 \div 5 = 8$
    correction: $8$ n'est qu'un cinquième ; pour trois, $8 \times 3 = 24$.
  cartographie_lacunes:
  - lacune: Addition de fractions sans dénominateur commun, division par une fraction
    bloque_en: nombres rationnels, quotients de relatifs
  source_path: remediation\4eme\modules_c\M03.md
- niveau: 4eme
  module: 4
  module_titre: 'Les nombres relatifs : opérations et valeur absolue'
  pourquoi: 'Trois gestes fautifs reviennent chaque année : $-8$ annoncé plus grand que

    $-3$, une parenthèse précédée d''un $-$ supprimée sans changer les signes, une valeur absolue

    négative. Tout le reste de la 4ème repose dessus.'
  diagnostic:
  - question: 'Range dans l''ordre croissant : $-3$ ; $+2$ ; $-7$ ; $0$ ; $-0{,}5$.'
    reponse: $-7 < -3 < -0{,}5 < 0 < +2$
  - question: Calcule $\left|-9\right|$ puis $\left|4 - 7\right|$.
    reponse: $9$ ; $3$
  - question: Calcule $\left(-12\right) + \left(+5\right)$ puis $\left(-6\right) - \left(-9\right)$.
    reponse: $-7$ ; $+3$
  - question: 'Supprime les parenthèses, puis calcule : $10 - \left(4 - 7\right)$.'
    reponse: ''
  - question: 'Donne le signe de $\left(-2\right) \times \left(+3\right) \times \left(-5\right)$ sans

      effectuer le produit.'
    reponse: ''
  lecons:
  - id: 4eme_M04_L1
    numero: '4.1'
    titre: Repérer, opposer, comparer
    retenir:
    - '**Abscisse** : positifs à droite du $0$, négatifs à gauche.'
    - Deux **opposés** ont la même distance à zéro et des signes contraires ; l'opposé de $0$ est $0$.
    - Le plus grand est le **plus à droite** ; tout négatif est plus petit que tout positif.
    - 'Entre deux **négatifs**, l''ordre se retourne : le plus grand est le **plus proche de $0$**,'
    - $-8 < -3$.
    - $\le$ et $\ge$ autorisent l'égalité.
    methode:
      titre: Comparer deux nombres relatifs
      etapes:
      - 'Signes différents : le positif est le plus grand, c''est fini.'
      - 'Deux positifs : compare comme des décimaux.'
      - 'Deux négatifs : le plus grand a la **plus petite distance à zéro**.'
      - Écris l'inégalité, contrôle sur la droite.
    exemple_resolu: 'Soldes en milliers de FCFA : Awa $-9$, Boukary $+4$, Salif $-13$,

      Rasmata $-2$. Range dans l''ordre croissant.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On isole le seul positif. | $+4$ ; négatifs : $-9$ ; $-13$ ; $-2$ |

      | On compare les distances à zéro et on renverse. | $13 > 9 > 2$ donc $-13 < -9 < -2$ |

      | On place le positif à la fin. | $-13 < -9 < -2 < +4$ |

      | **Vérification :** $-13$ est le point le plus à gauche. ✓ | |'
    erreurs_frequentes:
    - erreur: $-5 > -3$ « car $5 > 3$ ».
      correction: '$-5$ est à gauche de $-3$,

        donc $-5 < -3$.'
    - erreur: $-6{,}04 < -6{,}4$.
      correction: '$6{,}04 < 6{,}4$, donc $-6{,}04$

        est le plus proche de $0$ : $-6{,}04 > -6{,}4$.'
    declic: null
    figures:
    - figures/m04_f2.svg
  - id: 4eme_M04_L2
    numero: '4.2'
    titre: La valeur absolue et la distance
    retenir:
    - 'Une valeur absolue est une longueur : **jamais négative**.'
    - $\left|a\right| = \left|-a\right|$ ; sauf pour $0$, **deux** nombres ont une valeur absolue
    - '$A$ d''abscisse $a$, $B$ d''abscisse $b$ : $$AB = \left|b - a\right|$$ plus grande abscisse'
    - 'Elle ne se distribue pas : on termine d''abord le calcul intérieur.'
    methode:
      titre: Calculer une distance sur un axe gradué
      etapes:
      - Repère les deux abscisses.
      - Écris « plus grande abscisse moins plus petite ».
      - Effectue en ajoutant l'opposé si la plus petite est négative.
      - 'Contrôle : le résultat est positif.'
    exemple_resolu: 'Le fond d''un puits est à $-24$ m, le sommet du château d''eau à $+16$ m.

      Distance verticale ? Lequel est le plus éloigné du sol ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Plus grande abscisse $+16$, plus petite $-24$. | $d = \left|\left(+16\right) - \left(-24\right)\right|$
      |

      | Soustraire $-24$, c''est ajouter $+24$. | $d = 16 + 24 = 40$ m |

      | On compare les valeurs absolues. | $24 > 16$ : le puits |

      | **Vérification :** repères de part et d''autre du $0$, $24 + 16 = 40$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\left|-2 - 5\right| = \left|-2\right| - \left|5\right| = -3$.
      correction: on calcule l'intérieur, $-2 - 5 = -7$, donc $7$.
    - erreur: répondre $x = 3$ seul à $\left|x\right| = 3$.
      correction: '$+3$ et

        $-3$.'
    declic: null
    figures:
    - figures/m04_f3.svg
  - id: 4eme_M04_L3
    numero: '4.3'
    titre: Additionner, soustraire, supprimer les parenthèses
    retenir:
    - '**Mêmes signes :** on ajoute les distances, on garde le signe :'
    - '**Signes contraires :** on retranche la plus petite distance de la plus grande, signe du plus'
    - '**Soustraire, c''est ajouter l''opposé** : $$a - b = a + \left(-b\right)$$'
    - 'Parenthèse précédée d''un $+$ : on l''efface. Précédée d''un $-$ : on **change tous les signes**,'
    methode:
      titre: Calculer une somme algébrique
      etapes:
      - Supprime parenthèses et crochets, du plus intérieur vers l'extérieur, en changeant les signes
      - Supprime les paires d'opposés.
      - Additionne les positifs, puis les négatifs.
      - Combine les deux totaux.
    exemple_resolu: 'Calcule $H = \left(-18{,}5\right) - \left(-4{,}9\right) + \left(+5{,}6\right) - \left(-12\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Chaque parenthèse précédée d''un $-$ change de signe. | $H = -18{,}5 + 4{,}9 + 5{,}6 + 12$ |

      | On regroupe les positifs. | $4{,}9 + 5{,}6 + 12 = 22{,}5$ |

      | On combine les deux totaux. | $H = -18{,}5 + 22{,}5 = +4$ |

      | **Vérification :** $22{,}5 - 18{,}5 = 4$. ✓ | |'
    erreurs_frequentes:
    - erreur: $10 - \left(4 - 7\right) = 10 - 4 - 7 = -1$.
      correction: 'tous les

        signes changent, $10 - 4 + 7 = 13$.'
    - erreur: $\left(-7\right) - \left(-4\right) = -11$.
      correction: 'soustraire

        $-4$, c''est ajouter $+4$ : $-3$.'
    declic: 'Ce n''est pas la règle qui manque, c''est la distance à zéro — Si tu écris encore $\left(-6\right)
      + \left(-9\right) = -3$, tu soustrais au lieu d''ajouter : reprends 4.2. Si ce sont les parenthèses
      qui résistent, la soustraction n''est pas encore lue comme une addition d''opposé.'
    figures: []
  - id: 4eme_M04_L4
    numero: '4.4'
    titre: Multiplier, diviser, signe d'un produit
    retenir:
    - '**Même signe** : résultat **positif** ; **signes contraires** : résultat **négatif**. Même'
    - 'Produit de facteurs non nuls : on **compte les négatifs**. Nombre **pair**, produit'
    - Un produit dont un facteur vaut $0$ est nul.
    methode:
      titre: Calculer un produit de plusieurs facteurs
      etapes:
      - 'Un facteur nul : le produit vaut $0$, c''est fini.'
      - Compte les facteurs négatifs et décide du signe.
      - Multiplie les distances à zéro.
      - Écris le résultat avec le signe trouvé.
    exemple_resolu: 'Calcule $P = \left(-2\right) \times \left(+5\right) \times \left(-4\right) \times
      \left(-1{,}5\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Trois facteurs négatifs, nombre impair. | signe de $P$ : négatif |

      | On multiplie les distances à zéro. | $2 \times 5 \times 4 \times 1{,}5 = 60$ |

      | On applique le signe trouvé. | $P = -60$ |

      | **Vérification :** nombre impair de négatifs, produit négatif. ✓ | |'
    erreurs_frequentes:
    - erreur: $\left(-3\right) + \left(-4\right) = +7$.
      correction: 'la règle des

        signes ne vaut que pour le produit et le quotient ; ici on ajoute : $-7$.'
    - erreur: $\left(-5\right) \times \left(+3\right) + \left(-4\right) \times \left(-6\right) = \left(-15
        - 4\right) \times \left(-6\right)$.
      correction: 'la multiplication passe avant l''addition : $-15 + 24 = +9$.'
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Donne l''opposé de : $\left(+9\right)$ ; $\left(-2{,}5\right)$ ;

      $\left(+100\right)$ ; $\left(-63\right)$ ; $0$ ; $\left(+1{,}75\right)$ ; $\left(-8\right)$ ;

      $\left(+250\right)$.'
    correction: $-9$ ; $+2{,}5$ ; $-100$ ; $+63$ ; $0$ ; $-1{,}75$ ; $+8$ ; $-250$.
  - numero: 2
    etoiles: 1
    enonce: 'Sur une droite graduée d''unité $1$ cm : $A$ à $3$ cm à droite du $0$, $B$ à

      $1{,}5$ cm à gauche, $C$ sur le $0$, $D$ à $4$ cm à gauche. Donne l''abscisse de chacun.'
    correction: '$A\left(+3\right)$ ; $B\left(-1{,}5\right)$ ; $C\left(0\right)$ ;

      $D\left(-4\right)$.'
  - numero: 3
    etoiles: 1
    enonce: 'Complète avec $<$ ou $>$ : a) $-7$ … $-2$ ; b) $-0{,}9$ … $0$ ;

      c) $+3{,}5$ … $-12$ ; d) $-6{,}04$ … $-6{,}4$ ; e) $-11$ … $-15$.'
    correction: a) $<$ ; b) $<$ ; c) $>$ ; d) $>$ (car $6{,}04 < 6{,}4$) ; e) $>$.
  - numero: 4
    etoiles: 1
    enonce: 'Range par ordre croissant : $-7$ ; $+0{,}5$ ; $-0{,}7$ ; $+5$ ; $-5$ ; $0$ ;

      $+7$.'
    correction: $-7 < -5 < -0{,}7 < 0 < +0{,}5 < +5 < +7$.
  - numero: 5
    etoiles: 1
    enonce: 'Combien y a-t-il d''entiers relatifs $a$ vérifiant $-8 < a \le 3$ ? Écris-les

      tous.'
    correction: $11$ entiers, de $-7$ à $+3$ ($-8$ exclu, $3$ inclus).
  - numero: 6
    etoiles: 1
    enonce: 'Calcule, puis groupe les écritures de même résultat :

      $\left|-8\right|$ ; $\left|+0{,}8\right|$ ; $\left|8\right|$ ; $\left|-0{,}8\right|$ ;

      $\left|+8\right|$ ; $\left|0\right|$ ; $\left|-80\right|$ ; $\left|-\left(-8\right)\right|$.'
    correction: '$8$ ; $0{,}8$ ; $8$ ; $0{,}8$ ; $8$ ; $0$ ; $80$ ; $8$ : quatre valent $8$.'
  - numero: 7
    etoiles: 1
    enonce: 'Calcule : $A = \left|-5\right|$ ; $B = \left|15 - 3\right|$ ;

      $C = 15 - \left|3\right|$ ; $D = 15 - \left|-3\right|$ ; $E = \left|-15\right| - \left|-5\right|$.'
    correction: $A = 5$ ; $B = 12$ ; $C = 12$ ; $D = 12$ ; $E = 10$.
  - numero: 8
    etoiles: 1
