- niveau: 1ereD
  module: 3
  module_titre: Comparer et ordonner des réels
  pourquoi: 'Comparer deux réels par le signe de la différence est le geste de base de l''analyse. Sens
    de variation, position relative de deux courbes, monotonie d''une suite : tout en dépend.'
  diagnostic:
  - question: À quels ensembles parmi $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$ appartient
      $-7$ ? Et $\sqrt{3}$ ?
    reponse: $-7 \in \mathbb{Z}, \mathbb{Q}, \mathbb{R}$ ; $\sqrt{3} \in \mathbb{R}$ seulement
  - question: 'Range dans l''ordre croissant : $-2$ ; $\frac{3}{2}$ ; $-\frac{5}{3}$ ; $0$ ; $1$.'
    reponse: $-2 < -\frac{5}{3} < 0 < 1 < \frac{3}{2}$
  - question: Compare $\frac{9}{7}$ et $\frac{13}{10}$ par la différence.
    reponse: $\frac{9}{7} - \frac{13}{10} = -\frac{1}{70} < 0$, donc $\frac{9}{7} < \frac{13}{10}$
  - question: Pour $0 < x < 1$, range $x$, $x^{2}$, $\sqrt{x}$ et $\frac{1}{x}$ dans l'ordre croissant.
    reponse: $x^{2} < x < \sqrt{x} < \frac{1}{x}$
  - question: Si $a \le b$ et $c < 0$, que devient le sens de l'inégalité entre $ac$ et $bc$ ?
    reponse: le sens change, $ac \ge bc$
  lecons:
  - id: 1ereD_M03_L1
    numero: '3.1'
    titre: Le signe de la différence
    retenir:
    - $a < b$ signifie $b - a > 0$ ; $a > b$ signifie $b - a < 0$ ; $a = b$ signifie $b - a = 0$.
    - Comparer $a$ et $b$, c'est étudier le **signe de la différence $a - b$**.
    - Si $a$ et $b$ sont strictement positifs, on peut aussi comparer le **quotient $\frac{a}{b}$ à $1$**.
    - 'Écris toujours la différence dans l''ordre de l''énoncé : différence positive, donc le premier
      est le plus grand.'
    methode:
      titre: Comparer deux réels par la différence
      etapes:
      - Forme la différence $a - b$.
      - Transforme-la (même dénominateur, factorisation, développement) pour en connaître le signe.
      - 'Conclus : $a - b > 0$ donne $a > b$ ; $a - b < 0$ donne $a < b$ ; $a - b = 0$ donne $a = b$.'
    exemple_resolu: 'Compare $A = \frac{7}{4}$ et $B = \frac{12}{7}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On forme la différence, au dénominateur commun $28$. | $A - B = \frac{7}{4} - \frac{12}{7} = \frac{49}{28}
      - \frac{48}{28}$ |

      | On lit le signe du résultat. | $A - B = \frac{1}{28} > 0$ |

      | Différence positive : le premier dépasse le second. | **Donc $\frac{7}{4} > \frac{12}{7}$.** |

      | **Vérification :** $1{,}75 > 1{,}714$ ✓ | |'
    erreurs_frequentes:
    - erreur: élever au carré une inégalité entre négatifs. « $-5 < 2$ donc $25 < 4$ » est faux.
      correction: le passage au carré ne conserve l'ordre que si $0 \le a \le b$.
    - erreur: conclure d'une valeur approchée trop grossière.
      correction: pour $\frac{11}{7}$ et $\frac{14}{9}$, seule la différence exacte tranche.
    declic: un réflexe, quatre chapitres — Position relative de deux courbes ? Signe de $f\left(x\right)
      - g\left(x\right)$. Fonction croissante ? Signe de $f\left(b\right) - f\left(a\right)$ pour $a <
      b$. Suite croissante ? Signe de $u_{n+1} - u_{n}$. Inéquation $f\left(x\right) \le g\left(x\right)$
      ? Signe de $f\left(x\right) - g\left(x\right)$.
    figures:
    - figures/m03_f2.svg
  - id: 1ereD_M03_L2
    numero: '3.2'
    titre: Ce que les opérations font à une inégalité
    retenir:
    - si $a \le b$, alors $a + c \le b + c$ ;
    - si $a \le b$ et $c > 0$, alors $ac \le bc$ (sens conservé) ;
    - 'si $a \le b$ et $c < 0$, alors $ac \ge bc$ (**sens changé**). Diviser par $c$, c''est multiplier
      par $\frac{1}{c}$, de même signe : même règle.'
    - 'Si $0 \le a \le b$ : $a^{2} \le b^{2}$ et $\sqrt{a} \le \sqrt{b}$ (ordre conservé).'
    - 'Si $a$ et $b$ non nuls et **de même signe** : $a \le b$ donne $\frac{1}{a} \ge \frac{1}{b}$ (ordre
      inversé).'
    - 'Si $a \le b \le 0$ : $a^{2} \ge b^{2}$ ; de deux négatifs, le plus grand est le plus proche de
      $0$.'
    methode: null
    exemple_resolu: 'Compare $A = -\frac{3}{8}$ et $B = -\frac{2}{5}$ en passant aux inverses.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les inverses sont plus simples à comparer. | $\frac{1}{A} = -\frac{8}{3}$ et $\frac{1}{B} = -\frac{5}{2}$
      |

      | On compare les inverses par la différence. | $-\frac{8}{3} + \frac{5}{2} = -\frac{1}{6} < 0$,
      donc $\frac{1}{A} < \frac{1}{B}$ |

      | $A$ et $B$ sont de même signe : le retour aux nombres inverse le sens. | **Donc $-\frac{3}{8}
      > -\frac{2}{5}$.** |

      | **Vérification :** $-0{,}375 > -0{,}4$ ✓ | |'
    erreurs_frequentes:
    - erreur: oublier de retourner l'inégalité en multipliant par un négatif.
      correction: $-2x \le 6$ donne $x \ge -3$, pas $x \le -3$.
    - erreur: inverser une inégalité entre nombres de signes contraires.
      correction: la règle sur les inverses exige $a$ et $b$ de même signe.
    declic: null
    figures: []
  - id: 1ereD_M03_L3
    numero: '3.3'
    titre: 'Les quatre visages d''un nombre : $x$, $x^{2}$, $\sqrt{x}$, $\frac{1}{x}$'
    retenir:
    - 'Si $0 < x < 1$ : $\quad x^{2} < x < \sqrt{x} < 1 < \frac{1}{x}$.'
    - 'Si $x = 1$ : $\quad x^{2} = x = \sqrt{x} = \frac{1}{x} = 1$.'
    - 'Si $x > 1$ : $\quad \frac{1}{x} < 1 < \sqrt{x} < x < x^{2}$.'
    methode: null
    exemple_resolu: 'Range dans l''ordre croissant $x$, $x^{2}$, $\sqrt{x}$, $\frac{1}{x}$ pour $x = \frac{1}{9}$,
      sans valeurs approchées.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On situe $x$ par rapport à la charnière $1$. | $0 < \frac{1}{9} < 1$ |

      | On calcule les trois compagnons ($9$ est un carré parfait). | $x^{2} = \frac{1}{81}$, $\sqrt{x}
      = \frac{1}{3}$, $\frac{1}{x} = 9$ |

      | Même numérateur $1$ : plus le dénominateur est petit, plus le nombre est grand ; et $9 > 1$. |
      $\frac{1}{81} < \frac{1}{9} < \frac{1}{3} < 9$ |

      | **Conclusion :** $x^{2} < x < \sqrt{x} < \frac{1}{x}$, conforme au cas $0 < x < 1$. ✓ | |'
    erreurs_frequentes:
    - erreur: croire que le carré est toujours le plus grand.
      correction: faux pour $x = 0{,}5$, où $x^{2} = 0{,}25$.
    - erreur: écrire $\sqrt{x} < x$ pour tout $x$.
      correction: faux sur $]0\,;\,1[$, où $\sqrt{0{,}25} = 0{,}5 > 0{,}25$.
    declic: null
    figures:
    - figures/m03_f5.svg
  - id: 1ereD_M03_L4
    numero: '3.4'
    titre: Trois techniques qui dépannent
    retenir: []
    methode:
      titre: Choisir la bonne technique
      etapes:
      - '**Fractions ou expressions littérales ?** La différence, réduite au même dénominateur puis factorisée
        : technique par défaut.'
      - '**Produits, puissances, nombres tous strictement positifs ?** Le quotient $\frac{a}{b}$ comparé
        à $1$.'
      - '**Racines carrées de nombres positifs ?** Les carrés : pour $a \ge 0$ et $b \ge 0$, comparer
        $a$ et $b$ revient à comparer $a^{2}$ et $b^{2}$. Pour des négatifs, on compare les opposés puis
        on retourne la conclusion.'
      - '**Une liste à ranger ?** Un repère intermédiaire ($0$, $1$, un entier) coupe la liste en deux
        paquets.'
    exemple_resolu: 'Range dans l''ordre croissant : $\sqrt{5}$ ; $\frac{9}{4}$ ; $2{,}3$ ; $\sqrt{6}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les quatre nombres sont positifs : on range leurs carrés, les racines disparaissent. | on compare
      $5$ ; $\left(\frac{9}{4}\right)^{2}$ ; $2{,}3^{2}$ ; $6$ |

      | On calcule les deux carrés qui ne sont pas immédiats. | $\frac{81}{16} = 5{,}0625$ et $2{,}3^{2}
      = 5{,}29$ |

      | On range les quatre carrés. | $5 < 5{,}0625 < 5{,}29 < 6$ |

      | Nombres positifs : même ordre. **Vérification :** $2{,}236 < 2{,}25 < 2{,}3 < 2{,}449$ ✓ | **$\sqrt{5}
      < \frac{9}{4} < 2{,}3 < \sqrt{6}$** |'
    erreurs_frequentes:
    - erreur: le produit en croix sur des dénominateurs négatifs.
      correction: rends les dénominateurs positifs, ou reviens à la différence.
    - erreur: comparer par le quotient des nombres négatifs.
      correction: le quotient n'est valable que pour des nombres strictement positifs.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Recopie et complète avec $\in$ ou $\notin$ : a) $5$ … $\mathbb{N}$ ; b) $-7$ … $\mathbb{N}$
      ; c) $\frac{3}{4}$ … $\mathbb{Z}$ ; d) $\sqrt{5}$ … $\mathbb{Q}$ ; e) $\sqrt{5}$ … $\mathbb{R}$
      ; f) $-\frac{2}{4}$ … $\mathbb{Z}$.'
    correction: a) $\in$ ; b) $\notin$ ; c) $\notin$ ; d) $\notin$ ; e) $\in$ ; f) $\notin$ ($-\frac{2}{4}
      = -\frac{1}{2}$).
  - numero: 2
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $-3$ ; $0$ ; $-\frac{1}{2}$ ; $2$ ; $-\frac{5}{4}$ ; $\frac{3}{2}$.'
    correction: $-3 < -\frac{5}{4} < -\frac{1}{2} < 0 < \frac{3}{2} < 2$.
  - numero: 3
    etoiles: 1
    enonce: 'Compare par la différence : a) $\frac{5}{3}$ et $\frac{8}{5}$ ; b) $\frac{2}{7}$ et $\frac{3}{11}$
      ; c) $\frac{9}{4}$ et $\frac{11}{5}$.'
    correction: a) $\frac{1}{15} > 0$ → $\frac{5}{3} > \frac{8}{5}$ ; b) $\frac{1}{77} > 0$ → $\frac{2}{7}
      > \frac{3}{11}$ ; c) $\frac{1}{20} > 0$ → $\frac{9}{4} > \frac{11}{5}$.
  - numero: 4
    etoiles: 1
    enonce: 'Compare par la différence : a) $\frac{7}{4}$ et $\frac{12}{7}$ ; b) $\frac{9}{7}$ et $\frac{13}{10}$
      ; c) $\frac{8}{5}$ et $\frac{13}{8}$.'
    correction: a) $\frac{1}{28} > 0$ → $\frac{7}{4} > \frac{12}{7}$ ; b) $-\frac{1}{70} < 0$ → $\frac{9}{7}
      < \frac{13}{10}$ ; c) $-\frac{1}{40} < 0$ → $\frac{8}{5} < \frac{13}{8}$.
  - numero: 5
    etoiles: 1
    enonce: 'Compare par la différence : a) $\frac{5}{3}$ et $\frac{8}{5}$ ; b) $-\frac{5}{7}$ et $-\frac{7}{9}$
      ; c) $-\frac{7}{4}$ et $-\frac{9}{5}$.'
    correction: a) $\frac{1}{15} > 0$ → $\frac{5}{3} > \frac{8}{5}$ ; b) $-\frac{5}{7} + \frac{7}{9} =
      \frac{4}{63} > 0$ → $-\frac{5}{7} > -\frac{7}{9}$ ; c) $-\frac{7}{4} + \frac{9}{5} = \frac{1}{20}
      > 0$ → $-\frac{7}{4} > -\frac{9}{5}$.
  - numero: 6
    etoiles: 1
    enonce: 'Pour chaque cas, indique si $x^{2} < x$ ou $x^{2} > x$ : a) $x = 0{,}3$ ; b) $x = 1$ ; c)
      $x = 4$ ; d) $x = \frac{5}{2}$.'
    correction: 'a) $x^{2} < x$ ; b) $x^{2} = x$ ; c) et d) $x^{2} > x$. Règle : $x^{2} < x$ si $0 < x
      < 1$, $x^{2} > x$ si $x > 1$.'
  - numero: 7
    etoiles: 1
    enonce: On donne $x = 0{,}2$. Range dans l'ordre croissant $x$, $x^{2}$, $\sqrt{x}$ et $\frac{1}{x}$.
    correction: '$x^{2} = 0{,}04$ ; $\sqrt{x} \approx 0{,}447$ ; $\frac{1}{x} = 5$. Ordre : $x^{2} < x
      < \sqrt{x} < \frac{1}{x}$.'
  - numero: 8
    etoiles: 1
    enonce: 'Deux enfants se disputent un gâteau : l''un veut les $\frac{3}{5}$, l''autre les $\frac{5}{7}$
      du gâteau. Est-ce possible ? Justifie.'
    correction: '$\frac{3}{5} + \frac{5}{7} = \frac{46}{35} > 1$ : impossible, cela dépasserait le gâteau
      entier.'
  - numero: 9
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $\sqrt{2}$ ; $1{,}5$ ; $\frac{7}{5}$ ; $\sqrt{3}$.'
    correction: '$\frac{7}{5} = 1{,}4$ ; $\sqrt{2} \approx 1{,}414$ ; $\sqrt{3} \approx 1{,}732$. Ordre
      : $\frac{7}{5} < \sqrt{2} < 1{,}5 < \sqrt{3}$.'
  - numero: 10
    etoiles: 1
    enonce: 'Compare par la différence : a) $-\frac{15}{7}$ et $-\frac{13}{6}$ ; b) $-\frac{5}{4}$ et
      $-\frac{7}{5}$ ; c) $-\frac{2}{3}$ et $-\frac{3}{4}$.'
    correction: a) $\frac{1}{42} > 0$ → $-\frac{15}{7} > -\frac{13}{6}$ ; b) $\frac{3}{20} > 0$ → $-\frac{5}{4}
      > -\frac{7}{5}$ ; c) $\frac{1}{12} > 0$ → $-\frac{2}{3} > -\frac{3}{4}$.
  - numero: 11
    etoiles: 1
    enonce: 'Compare en passant aux inverses : a) $\frac{1}{-3}$ et $\frac{1}{-5}$ ; b) $-\frac{2}{7}$
      et $-\frac{3}{10}$.'
    correction: 'a) $-3 > -5$, même signe donc l''inverse retourne : $\frac{1}{-3} < \frac{1}{-5}$. b)
      Inverses : $-\frac{7}{2} < -\frac{10}{3}$, donc $-\frac{2}{7} > -\frac{3}{10}$.'
  - numero: 12
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $-\sqrt{3}$ ; $-1{,}7$ ; $-\frac{5}{3}$ ; $-1{,}8$.


      ### Entraînement ★★'
    correction: $-1{,}8 < -\sqrt{3} < -1{,}7 < -\frac{5}{3}$.
  - numero: 13
    etoiles: 2
    enonce: 'Compare en passant aux carrés (attention aux signes) : a) $-3$ et $-\pi$ ; b) $-\sqrt{5}$
      et $-2$ ; c) $\sqrt{7}$ et $\frac{8}{3}$.'
    correction: a) $\pi^{2} > 9$ donc $\pi > 3$ et $-\pi < -3$ ; b) $5 > 4$ donc $\sqrt{5} > 2$ et $-\sqrt{5}
      < -2$ ; c) $\left(\frac{8}{3}\right)^{2} = \frac{64}{9} > 7$ donc $\sqrt{7} < \frac{8}{3}$.
  - numero: 14
    etoiles: 2
    enonce: Soient $a$ et $b$ deux réels tels que $0 < a < b$. Compare $\frac{1}{a}$ et $\frac{1}{b}$.
      Que devient le résultat si $a$ et $b$ sont tous deux strictement négatifs ?
    correction: '$\frac{1}{a} - \frac{1}{b} = \frac{b-a}{ab} > 0$ car $b - a > 0$ et $ab > 0$ : $\frac{1}{a}
      > \frac{1}{b}$. Si $a < b < 0$, on a encore $ab > 0$ : même conclusion ($a = -3$, $b = -2$ : $-\frac{1}{3}
      > -\frac{1}{2}$).'
  - numero: 15
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Ton camarade écrit : « comme $-5 < 2$, alors $\left(-5\right)^{2}
      < 2^{2}$, donc $25 < 4$ ». Repère l''erreur, explique-la en une ou deux phrases, et énonce correctement
      la règle du passage au carré.'
    correction: 'Le passage au carré ne conserve l''ordre que pour des nombres positifs ; ici $-5 < 0$,
      et l''ordre s''inverse ($25 > 4$). Règle : si $0 \le a \le b$, alors $a^{2} \le b^{2}$.'
  - numero: 16
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Explique pourquoi, pour deux nombres **négatifs**, le plus grand
      en valeur absolue est le plus petit. Illustre par un exemple sur la droite graduée.


      ### ★★★ Défis de maîtrise'
    correction: 'Deux négatifs sont à gauche de $0$ ; celui de plus grande valeur absolue est le plus
      loin de $0$, donc le plus à gauche, donc le plus petit. Exemple : $-5 < -2$ alors que $\left|-5\right|
      > \left|-2\right|$.'
  - numero: 17
    etoiles: 3
    enonce: 'Voici la copie de Mariam, qui devait comparer $A = \frac{2x + 1}{x + 3}$ et $2$ pour tout
      réel $x > -3$. Trouve la ligne qui casse, dis quelle règle a été oubliée, refais la comparaison
      et conclus par une phrase avec le bon quantificateur.


      | Ligne | Ce que Mariam a écrit |

      |---|---|

      | 1 | $A - 2 = \frac{2x + 1}{x + 3} - 2 = \frac{2x + 1 - 2}{x + 3} = \frac{2x - 1}{x + 3}$ |

      | 2 | Comme $x > -3$, le dénominateur est positif. |

      | 3 | Le signe de $A - 2$ est donc celui de $2x - 1$ : il change en $x = \frac{1}{2}$. |

      | 4 | Conclusion : $A$ est tantôt plus petit, tantôt plus grand que $2$. |'
    correction: '*La ligne 1 est fausse :* Mariam a soustrait $2$ au seul numérateur. Il faut écrire $2
      = \frac{2\left(x+3\right)}{x+3}$, d''où $A - 2 = \frac{2x + 1 - 2x - 6}{x + 3} = \frac{-5}{x + 3}$.
      Comme $x > -3$, on a $x + 3 > 0$, donc $A - 2 < 0$. Conclusion : pour tout réel $x > -3$, $\frac{2x+1}{x+3}
      < 2$ ; il n''y a aucun changement de signe.'
  - numero: 18
    etoiles: 3
    enonce: On pose $A = \sqrt{2} + \sqrt{7}$, $B = \sqrt{3} + \sqrt{6}$ et $C = 2 + \sqrt{5}$. Range
      ces trois nombres dans l'ordre croissant, en valeurs exactes et sans approximation. Explique ensuite,
      en une phrase, ce qui fait varier ces sommes alors que les nombres sous les racines ont toujours
      la même somme.
    correction: 'Les trois nombres sont positifs : on les range par leurs carrés, en écrivant $2 = \sqrt{4}$.
      $A^{2} = 9 + 2\sqrt{14}$, $B^{2} = 9 + 2\sqrt{18}$, $C^{2} = 9 + 2\sqrt{20}$. Comme $14 < 18 < 20$,
      on a $A^{2} < B^{2} < C^{2}$, donc **$A < B < C$**. La somme sous les racines vaut toujours $9$
      ; c''est le produit $uv$, présent dans $2\sqrt{uv}$, qui varie : plus les deux nombres sont proches,
      plus la somme des racines est grande.'
  - numero: 19
    etoiles: 3
    enonce: Un cultivateur de niébé de Léo a récolté $a$ sacs l'an dernier et $b$ sacs cette année, avec
      $0 < a < b$. La coopérative hésite entre la moyenne arithmétique $m = \frac{a + b}{2}$ et la moyenne
      géométrique $g = \sqrt{ab}$. Décide lequel des deux est le plus grand, prouve-le, et précise dans
      quel cas ils seraient égaux.
    correction: 'On étudie le signe de $m - g$ en reconnaissant un carré : $m - g = \frac{a + b - 2\sqrt{a}\sqrt{b}}{2}
      = \frac{\left(\sqrt{a} - \sqrt{b}\right)^{2}}{2} \ge 0$. Donc $m \ge g$ toujours. Égalité si et
      seulement si $\sqrt{a} = \sqrt{b}$, c''est-à-dire $a = b$ ; ici $a < b$, donc **$m > g$** strictement.'
  - numero: 20
    etoiles: 3
    enonce: Un réel $x$ vérifie $x + \frac{1}{x} = \frac{10}{3}$ et $0 < x < 1$. Retrouve $x$. Que devient
      la réponse si l'on remplace la condition $0 < x < 1$ par $x > 1$ ?
    correction: 'L''énoncé donne une somme : on résout d''abord, on trie ensuite avec la contrainte. $x
      \neq 0$, on multiplie par $3x$ : $3x^{2} - 10x + 3 = 0$, $\Delta = 64$, d''où $x = \frac{1}{3}$
      ou $x = 3$. Avec $0 < x < 1$ : $x = \frac{1}{3}$. Avec $x > 1$ : $x = 3$. Les deux solutions sont
      inverses l''une de l''autre, car l''équation est inchangée quand on échange $x$ et $\frac{1}{x}$.'
  - numero: 21
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple, et corrige l''énoncé quand il est faux.

      a) Pour tous réels $a$ et $b$, si $a < b$ alors $a^{2} < b^{2}$.

      b) Pour tous réels $a$ et $b$, si $0 < a < b$ alors $\frac{1}{a} > \frac{1}{b}$.

      c) Pour tous réels $a$ et $b$, si $a < b$ alors $a^{3} < b^{3}$.

      d) Pour tous réels $a$, $b$, $c$, $d$, si $a < b$ et $c < d$ alors $ac < bd$.'
    correction: 'Le réflexe : chercher les contre-exemples du côté des négatifs, puis démontrer ce qui
      résiste. a) **Faux** : $a = -3$, $b = 1$ donnent $9 > 1$ ; corrigé : si $0 \le a < b$, alors $a^{2}
      < b^{2}$. b) **Vrai** : $\frac{1}{a} - \frac{1}{b} = \frac{b-a}{ab} > 0$. c) **Vrai** sans condition
      de signe : $b^{3} - a^{3} = \left(b-a\right)\left(b^{2} + ab + a^{2}\right)$ et $b^{2} + ab + a^{2}
      = \left(b + \frac{a}{2}\right)^{2} + \frac{3a^{2}}{4} > 0$ dès que $a < b$. d) **Faux** : $a = -2$,
      $b = 1$, $c = -3$, $d = 1$ donnent $ac = 6 > bd = 1$ ; vrai si de plus $a \ge 0$ et $c \ge 0$.'
  - numero: 22
    etoiles: 3
    enonce: a) Démontre que pour tous réels $a$ et $b$ strictement positifs, $\frac{a}{b} + \frac{b}{a}
      \geq 2$, et précise le cas d'égalité. b) Déduis-en que pour tout réel $x > 0$, $x + \frac{1}{x}
      \geq 2$. c) L'inégalité de b) reste-t-elle vraie pour $x < 0$ ? Justifie.
    correction: 'On ramène au même dénominateur et on étudie le signe : le numérateur est un carré parfait.
      a) Pour $a > 0$ et $b > 0$ : $\frac{a}{b} + \frac{b}{a} - 2 = \frac{\left(a-b\right)^{2}}{ab} \ge
      0$, donc $\frac{a}{b} + \frac{b}{a} \ge 2$, avec égalité si et seulement si $a = b$. b) On prend
      $a = x$ et $b = 1$ : $x + \frac{1}{x} \ge 2$ pour $x > 0$, égalité en $x = 1$. c) **Non** : pour
      $x = -1$, $x + \frac{1}{x} = -2$. Si $x < 0$, alors $-x > 0$ et b) donne $x + \frac{1}{x} \le -2$.
      Énoncé correct : $\left|x + \frac{1}{x}\right| \ge 2$ pour tout réel $x$ non nul.


      ---'
  fiche_revision:
  - '**Comparer.** $a < b$ équivaut à $b - a > 0$ : tout part du signe de la différence.'
  - '**Différence.** Même dénominateur, puis factorisation ; c''est la technique qui marche toujours.'
  - '**Quotient.** Réservé aux nombres strictement positifs : $\frac{a}{b} > 1$ équivaut à $a > b$.'
  - '**Carrés.** Pour $a \ge 0$ et $b \ge 0$ : $a < b$ équivaut à $a^{2} < b^{2}$. Pour des négatifs,
    on passe aux opposés.'
  - '**Opérations.** Ajouter conserve ; multiplier par un positif conserve ; multiplier par un négatif
    **change le sens**.'
  - '**Inverses.** Pour $a$ et $b$ de même signe, $a < b$ donne $\frac{1}{a} > \frac{1}{b}$.'
  - '**Charnière $1$.** $0 < x < 1$ : $x^{2} < x < \sqrt{x} < 1 < \frac{1}{x}$. $x > 1$ : $\frac{1}{x}
    < 1 < \sqrt{x} < x < x^{2}$.'
  - '**Négatifs.** Le plus grand est le plus proche de $0$.'
  trouve_erreur:
  - faux: $-5 < 2$ donc $\left(-5\right)^{2} < 2^{2}$
    correction: 'Le carré ne conserve l''ordre que si $0 \le a \le b$ : ici $25 > 4$.'
  - faux: $\frac{2x+1}{x+3} - 2 = \frac{2x+1-2}{x+3}$
    correction: 'On écrit $2 = \frac{2\left(x+3\right)}{x+3}$ : le résultat est $\frac{-5}{x+3}$.'
  - faux: $-3x \le 9$ donc $x \le -3$
    correction: 'Le facteur est négatif, le sens change : $x \ge -3$.'
  - faux: $-\frac{2}{5} > -\frac{3}{8}$ car $\frac{2}{5} > \frac{3}{8}$
    correction: 'Chez les négatifs l''ordre s''inverse : $-\frac{2}{5} < -\frac{3}{8}$.'
  cartographie_lacunes: []
  source_path: remediation\1ereD\modules_c\M03.md
- niveau: 1ereD
  module: 4
  module_titre: Intervalles, valeur absolue et distance
  pourquoi: 'Ensembles de définition, ensembles de solutions, tableaux de variations : en 1ère D, tout
    se dit en intervalles. Et la valeur absolue lue comme une **distance** est le langage des limites.'
  diagnostic:
  - question: Calcule $|-9|$, $|4 - 11|$ et la distance entre $-3$ et $5$.
    reponse: $9$ ; $7$ ; $8$
  - question: 'Écris sous forme d''intervalle : a) $-2 \le x < 4$ ; b) $x > 5$.'
    reponse: a) $\left[-2\,;\,4\right[$ ; b) $\left]5\,;\,+\infty\right[$
  - question: Résous $|x - 3| = 5$.
    reponse: $x = 8$ ou $x = -2$
  - question: Écris $\{x \in \mathbb{R} \ / \ |x - 1| \le 4\}$ sous forme d'intervalle.
    reponse: $\left[-3\,;\,5\right]$
  - question: Donne le centre et le rayon de $\left]1\,;\,9\right[$.
    reponse: centre $5$, rayon $4$
  lecons:
  - id: 1ereD_M04_L1
    numero: '4.1'
    titre: Intervalles, valeur absolue, distance
    retenir:
    - $[a\,;\,b]$ **fermé** (bornes prises) ; $]a\,;\,b[$ **ouvert** (bornes exclues) ; $[a\,;\,b[$ et
      $]a\,;\,b]$ **semi-ouverts** ;
    - '**non bornés** : $[a\,;\,+\infty[$, $]a\,;\,+\infty[$, $]-\infty\,;\,b]$, $]-\infty\,;\,b[$ ; et
      $\mathbb{R} = ]-\infty\,;\,+\infty[$.'
    - 'Crochet **tourné vers l''intérieur** si la borne est incluse, vers l''extérieur sinon : $\le$ donne
      un crochet fermé, $<$ un crochet ouvert.'
    methode:
      titre: Traduire une distance en intervalle (et réciproquement)
      etapes:
      - Repère le **centre** $a$ et le **rayon** $r$.
      - « distance de $x$ à $a$ inférieure à $r$ » s'écrit $|x - a| < r$.
      - 'Ouvre en encadrement : $a - r < x < a + r$, soit $]a - r\,;\,a + r[$.'
      - Réciproquement, l'intervalle de centre $a$ et de rayon $r$ se résume par $|x - a| < r$.
    exemple_resolu: 'Écris $\{x \in \mathbb{R} \ / \ |x - 5| \le 2\}$ sous forme d''intervalle.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Une distance : on lit centre et rayon. | centre $a = 5$, rayon $r = 2$ |

      | Une valeur absolue majorée s''ouvre en encadrement. | $-2 \le x - 5 \le 2$ |

      | On ajoute 5 aux trois membres ; inégalités larges, crochets fermés. | $x \in [3\,;\,7]$ |

      | **Vérification :** le milieu de $[3\,;\,7]$ est 5, et $|3 - 5| = |7 - 5| = 2$. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $[3\,;\,+\infty]$ ou $[-\infty\,;\,5]$.
      correction: 'le crochet reste ouvert du côté de l''infini : $[3\,;\,+\infty[$ et $]-\infty\,;\,5]$.'
    - erreur: croire que $|a + b| = |a| + |b|$.
      correction: 'faux si $a$ et $b$ sont de signes contraires : $|5 + \left(-3\right)| = 2$, et non
        8.'
    - erreur: écrire « $|x| \le 3$ donc $x \le 3$ ».
      correction: '$|x| \le 3$ signifie $-3 \le x \le 3$ : la valeur absolue encadre des **deux côtés**
        de 0.'
    declic: null
    figures:
    - figures/m04_f2.svg
  - id: 1ereD_M04_L2
    numero: '4.2'
    titre: Réunion, intersection, centre et rayon
    retenir:
    - '$A \cap B$ : les réels qui sont **à la fois** dans $A$ et dans $B$, le mot « et ».'
    - '$A \cup B$ : les réels qui sont dans $A$ **ou** dans $B$, le mot « ou ».'
    - '$\complement_{\mathbb{R}}A$ ou $\mathbb{R} \setminus A$ : ce qui n''est **pas** dans $A$ ; on **retourne
      chaque crochet** : le complémentaire de $[2\,;\,5]$ est $]-\infty\,;\,2[ \cup ]5\,;\,+\infty[$.'
    - L'intersection est toujours un intervalle, éventuellement vide ; la réunion, seulement si les morceaux
      se touchent.
    methode:
      titre: Lire une intersection ou une réunion
      etapes:
      - Une seule droite graduée portant **toutes** les bornes, deux lignes au-dessus.
      - Colorie $A$ sur la première ligne, $B$ sur la deuxième, crochets marqués.
      - 'Intersection : colorié **sur les deux lignes** ; réunion : **sur au moins une**.'
      - Une borne n'est dans l'intersection que si elle est prise **des deux côtés**.
    exemple_resolu: 'Détermine $A \cap B$ puis $A \cup B$ pour $A = [-3\,;\,5]$ et $B = ]1\,;\,8[$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On range les quatre bornes. | $-3 < 1 < 5 < 8$ |

      | Chevauchement entre 1 et 5 ; 1 exclu de $B$, 5 pris dans $A$. | $A \cap B = ]1\,;\,5]$ |

      | La réunion prend tout ce qui est colorié au moins une fois. | $A \cup B = [-3\,;\,8[$ |

      | **Vérification :** 1 est dans la réunion, pas dans l''intersection. ✓ | |'
    erreurs_frequentes:
    - erreur: prendre l'amplitude pour le rayon et écrire $]-3\,;\,5[$ sous la forme $|x - 1| < 8$, ce
        qui donne $]-7\,;\,9[$.
      correction: le rayon est la **moitié** de l'amplitude.
    - erreur: calculer le centre par $\frac{b - a}{2}$.
      correction: le centre est une **somme** divisée par deux ; la différence, c'est le rayon.
    declic: null
    figures:
    - figures/m04_f8.svg
  - id: 1ereD_M04_L3
    numero: '4.3'
    titre: Équations et inéquations avec valeur absolue
    retenir:
    - '$|x - a| = r$ : deux solutions, $x = a + r$ et $x = a - r$. Si $r < 0$, aucune solution.'
    - '$|x - a| \le r$ : « à au plus $r$ de $a$ », **un seul morceau** : $x \in [a - r\,;\,a + r]$.'
    - '$|x - a| \ge r$ : « à au moins $r$ de $a$ », **deux morceaux** : $x \in \ ]-\infty\,;\,a - r] \cup
      [a + r\,;\,+\infty[$.'
    - Avec des inégalités strictes, mêmes ensembles, crochets ouverts.
    methode:
      titre: Résoudre une inéquation avec valeur absolue
      etapes:
      - '**Isole la valeur absolue** : $|X| < -1$ n''a aucune solution, $|X| > -1$ est vraie partout.'
      - '**Reconnais la famille** : $\le$ ou $<$ donnent un morceau, $\ge$ ou $>$ en donnent deux.'
      - '**Enlève les barres** : encadrement $-r \le X \le r$, ou bien $X \le -r$ ou $X \ge r$.'
      - '**Résous en $x$** (sens inversé si tu divises par un négatif), réponse en intervalles.'
    exemple_resolu: 'Résous dans $\mathbb{R}$ l''inéquation $|2x + 1| < 4$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Famille « inférieur à » : un seul morceau, en encadrement. | $-4 < 2x + 1 < 4$ |

      | On retranche 1, puis on divise par 2, qui est positif. | $-\frac{5}{2} < x < \frac{3}{2}$ |

      | Inégalités strictes, donc crochets ouverts. | $S = \ ]-\frac{5}{2}\,;\,\frac{3}{2}[$ |

      | **Vérification :** $x = 0$ donne $1 < 4$ ✓ ; $x = 2$ donne $5$, exclu. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $|x - 5| \ge 2$ sous forme d'encadrement $-2 \ge x - 5 \ge 2$.
      correction: impossible ; famille « au moins », donc deux conditions reliées par « ou ».
    - erreur: conclure que $|x + 4| > -3$ n'a pas de solution.
      correction: 'une valeur absolue est positive ou nulle : $S = \mathbb{R}$.'
    declic: 'compte tes morceaux avant de calculer — Cherches-tu les points **proches** de $a$ ou les
      points **loin** de $a$ ? Proches, $|x - a| < r$ : un seul morceau, et il contient $a$. Loin, $|x
      - a| > r$ : deux morceaux, et $a$ n''y est jamais. Tu as résolu $|x - 3| > 1$ et trouvé $]2\,;\,4[$
      ? Le nombre 3 est dans ta réponse : c''est faux sans même relire le calcul.'
    figures:
    - figures/m04_f6.svg
  - id: 1ereD_M04_L4
    numero: '4.4'
    titre: Écrire une expression sans valeur absolue
    retenir:
    - 'Pour toute expression $A$ : si $A \ge 0$, alors $|A| = A$ ; si $A < 0$, alors $|A| = -A$.'
    - Les valeurs qui annulent chaque intérieur découpent la droite en morceaux ; l'expression s'écrit
      **sur chaque morceau**, avec sa condition.
    methode:
      titre: Écrire une expression sans valeur absolue
      etapes:
      - Pour chaque $|ax + b|$, résous $ax + b = 0$.
      - '**Range** ces valeurs dans l''ordre croissant : elles découpent $\mathbb{R}$.'
      - '**Dresse un tableau de signes**, une ligne par expression, une colonne par morceau.'
      - '**Sur chaque morceau**, remplace $|A|$ par $A$ ou $-A$, réduis, contrôle sur un nombre du morceau.'
    exemple_resolu: 'Écris $f\left(x\right) = |x - 1| + |x + 3|$ sans valeur absolue.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les intérieurs s''annulent en $1$ et $-3$ : trois morceaux. | $x < -3$ ; $-3 \le x < 1$ ; $x \ge
      1$ |

      | Sur le premier, les deux intérieurs sont négatifs. | $f\left(x\right) = -\left(x - 1\right) -
      \left(x + 3\right) = -2x - 2$ |

      | Au milieu, $x + 3 \ge 0$ et $x - 1 < 0$ ; à droite, les deux sont positifs. | $f\left(x\right)
      = 4$ ; puis $f\left(x\right) = 2x + 2$ |

      | **Vérification :** $x = -5$ donne $8$ ✓ ; $x = 0$ donne $4$ ✓. | |'
    erreurs_frequentes:
    - erreur: répondre à « écris $|x - 4|$ sans valeur absolue » par une seule formule.
      correction: tant que le signe de $x - 4$ est inconnu, il faut **deux** formules, chacune avec sa
        condition.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Écris sous forme d''intervalle, puis représente sur une droite graduée : a) $|x - 2| < 3$
      ; b) $|x + 1| \le 5$.'
    correction: a) $-1 < x < 5$, soit $\left]-1\,;\,5\right[$ ; b) $-6 \le x \le 4$, soit $\left[-6\,;\,4\right]$.
  - numero: 2
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : a) $|x - 4| = 6$ ; b) $|2x - 1| = 9$.'
    correction: 'a) $x = 10$ ou $x = -2$ ; b) $2x - 1 = \pm 9$ : $x = 5$ ou $x = -4$.'
  - numero: 3
    etoiles: 1
    enonce: 'Représente graphiquement, puis écris sous forme d''intervalle : a) $-3 \le x \le 2$ ; b)
      $x \ge 7$ ; c) $x > \frac{7}{2}$ ; d) $-1 \le x < 1$ ; e) $-2 < x \le 2$.'
    correction: a) $\left[-3\,;\,2\right]$ ; b) $\left[7\,;\,+\infty\right[$ ; c) $\left]\frac{7}{2}\,;\,+\infty\right[$
      ; d) $\left[-1\,;\,1\right[$ ; e) $\left]-2\,;\,2\right]$.
  - numero: 4
    etoiles: 1
    enonce: 'Écris sous forme d''intervalle : $A = \{x \in \mathbb{R} / -7 \le x \le 11\}$ ; $B = \{x
      \in \mathbb{R} / 9 \le x < 15\}$ ; $C = \{x \in \mathbb{R} / -7 < x \le 12$ et $8 \le x \le 19\}$
      ; $D = \{x \in \mathbb{R} / -3 < x \le 12$ et $-5 \le x \le 7\}$.'
    correction: $A = \left[-7\,;\,11\right]$ ; $B = \left[9\,;\,15\right[$ ; $C = \left[8\,;\,12\right]$
      ; $D = \left]-3\,;\,7\right]$.
  - numero: 5
    etoiles: 1
    enonce: 'Schématise : $\left[1\,;\,4\right[$ ; $\left[-2\,;\,+\infty\right[$ ; $\left[-7\,;\,7\right]$
      ; $\left]-\infty\,;\,1\right[$ ; $\left[0\,;\,1\right]$. Existe-t-il un réel commun à ces cinq intervalles
      ?'
    correction: 'Pas de réel commun : $\left[1\,;\,4\right[$ impose $x \ge 1$, mais $\left]-\infty\,;\,1\right[$
      impose $x < 1$.'
  - numero: 6
    etoiles: 1
    enonce: 'Détermine le centre, le rayon et l''amplitude de : $A = \left]-3\,;\,7\right[$ ; $B = \left]11\,;\,16\right[$
      ; $C = \left[-\frac{5}{4}\,;\,\frac{1}{2}\right]$ ; $D = \left[-\frac{3}{2}\,;\,5\right]$.'
    correction: '$A$ : $2$ ; $5$ ; $10$. $B$ : $13{,}5$ ; $2{,}5$ ; $5$. $C$ : $-\frac{3}{8}$ ; $\frac{7}{8}$
      ; $\frac{7}{4}$. $D$ : $\frac{7}{4}$ ; $\frac{13}{4}$ ; $\frac{13}{2}$.'
  - numero: 7
    etoiles: 1
    enonce: 'Détermine l''intersection ou la réunion : a) $\left[0\,;\,7\right[ \cap \left]-\infty\,;\,1\right]$
      ; b) $\left]-5\,;\,10\right] \cup \left]-\infty\,;\,-4\right[$ ; c) $\left]-1\,;\,0\right[ \cap
      \left[-2\,;\,0\right]$ ; d) $\left[0\,;\,2\right] \cap \left[1\,;\,5\right[$ ; e) $\left]-\infty\,;\,4\right]
      \cup \left]3\,;\,+\infty\right[$ ; f) $\left]-2\,;\,4\right] \cup \left[-5\,;\,8\right]$.'
    correction: a) $\left[0\,;\,1\right]$ ; b) $\left]-\infty\,;\,10\right]$ (les morceaux se recollent)
      ; c) $\left]-1\,;\,0\right[$ ; d) $\left[1\,;\,2\right]$ ; e) $\mathbb{R}$ ; f) $\left[-5\,;\,8\right]$.
  - numero: 8
    etoiles: 1
    enonce: 'Dans $\mathbb{R}$, détermine le complémentaire de : a) $\left[2\,;\,5\right]$ ; b) $\left]-\infty\,;\,3\right[$
      ; c) $\left[-1\,;\,+\infty\right[$.'
    correction: a) $\left]-\infty\,;\,2\right[ \cup \left]5\,;\,+\infty\right[$ ; b) $\left[3\,;\,+\infty\right[$
      ; c) $\left]-\infty\,;\,-1\right[$.
  - numero: 9
    etoiles: 1
    enonce: 'Calcule : a) $|15|$ ; b) $|-25|$ ; c) $|0|$ ; d) $|-12 + 5|$ ; e) $|3 - 8| - |8 - 3|$.'
    correction: a) $15$ ; b) $25$ ; c) $0$ ; d) $7$ ; e) $5 - 5 = 0$.
  - numero: 10
    etoiles: 1
    enonce: Sur une route, Ouagadougou est au kilomètre 0 et Ziniaré au kilomètre 30. a) Quelle est la
      distance entre les deux villes ? b) Au kilomètre 18, à quelle distance es-tu de chacune ?
    correction: a) $|30 - 0| = 30$ km. b) $18$ km et $12$ km.
  - numero: 11
    etoiles: 1
    enonce: 'Écris sans valeur absolue, après avoir déterminé le signe de l''expression : a) $|3 - \sqrt{2}|$
      ; b) $|\sqrt{7} - 3|$ ; c) $|2 - \sqrt{5}|$ ; d) $|\sqrt{5} - \sqrt{3}|$.'
