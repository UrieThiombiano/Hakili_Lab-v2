      un parallélogramme.'
  fiche_revision:
  - '**Rapport de projection.** $k = \frac{\text{arrivée}}{\text{départ}}$, sans unité, le même pour tous
    les segments d''une droite. Multiplier pour aller, diviser pour revenir.'
  - '**Ce qu''elle conserve.** Alignement, ordre, milieu. Une projection orthogonale a $k \leq 1$.'
  - '**Droite des milieux.** Triangle : $IJ = \frac{BC}{2}$. Trapèze : côtés **non parallèles**, $IJ =
    \frac{AB + CD}{2}$.'
  - '**Thalès.** Hypothèse : le parallélisme. Conclusion : $\frac{AM}{AB} = \frac{AN}{AC} = \frac{MN}{BC}$,
    les triangles l''un sous l''autre, sommet en tête.'
  - '**Configurations.** Emboîtée : petit triangle dans le grand. Papillon : triangles face à face ; les
    diagonales d''un trapèze en donnent un.'
  - '**Réciproque.** Deux rapports égaux **et** ordre respecté : parallélisme.'
  - '**Agrandissement.** Longueurs et périmètre multipliés par $k$.'
  - '**Réflexe.** Quel sommet commun, quel point pour quel point, parallélisme donné ou à démontrer ?'
  trouve_erreur:
  - faux: Poutre $40$ cm, ombre $24$ cm, donc $k = \frac{40}{24}$
    correction: 'Arrivée sur départ : $k = \frac{24}{40} = 0{,}6$.'
  - faux: $\frac{AM}{AB} = \frac{AN}{BC}$
    correction: Ce quotient croise les sécantes. Écrire $\frac{AM}{AB} = \frac{AN}{AC} = \frac{MN}{BC}$.
  - faux: $\frac{FA}{FB} = 2$, donc parallèles
    correction: 'Un seul rapport ne prouve rien : calculer $\frac{FE}{FC}$, vérifier l''ordre, citer la
      réciproque.'
  - faux: $\frac{20}{12}$ et $\frac{17}{10}$ presque égaux, donc parallèles
    correction: '$200 \neq 204$ : non parallèles.'
