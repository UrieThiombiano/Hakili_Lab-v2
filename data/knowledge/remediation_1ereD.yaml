      ### Entraînement ★★'
    correction: $\dfrac{\left(x - 2\right)\left(x^{2} + 2x + 4\right)}{x - 2} = x^{2} + 2x + 4$.
  - numero: 15
    etoiles: 2
    enonce: 'Wendlassida écrit : « $\left(x - 2\right)^{3} = x^{3} - 6x^{2} + 12x - 8$, donc $x^{3} -
      8 = \left(x - 2\right)^{3} + 6x^{2} - 12x$… c''est trop compliqué, je conclus que $x^{3} - 8$ ne
      se factorise pas. » Repère ce qui est juste et ce qui est faux, puis factorise $x^{3} - 8$.'
    correction: 'Le développement est juste ; la conclusion est fausse. $x^{3} - 8$ est une différence
      de deux cubes : $x^{3} - 8 = \left(x - 2\right)\left(x^{2} + 2x + 4\right)$. Ne pas confondre $\left(x
      - 2\right)^{3}$ et $x^{3} - 2^{3}$.'
  - numero: 16
    etoiles: 2
