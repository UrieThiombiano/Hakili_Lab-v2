  - numero: 12
    etoiles: 1
    enonce: 'Range par ordre croissant : $+13{,}52$ ; $-5{,}75$ ; $-5{,}07$ ; $+7{,}38$.'
    correction: $-5{,}75 < -5{,}07 < +7{,}38 < +13{,}52$.
  - numero: 13
    etoiles: 1
    enonce: 'Un matin : $-3\,^{\circ}$C à Kaya, $-5\,^{\circ}$C à Dori, $0\,^{\circ}$C à Bobo-Dioulasso,
