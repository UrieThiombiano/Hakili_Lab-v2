- niveau: 1ereD
  module: 9
  module_titre: Vecteurs et repérage dans le plan
  pourquoi: 'Les transformations du plan de 1ère D se définissent par des vecteurs, et en Tle D chaque
    point devient l''affixe d''un nombre complexe. Sans réflexes de calcul vectoriel, ces deux chapitres
    sont illisibles.


    *Dans tout ce module, le plan est muni d''un repère orthonormé $\left(O\,;\,\vec{i}\,,\,\vec{j}\right)$.*'
  diagnostic:
  - question: '$A\left(1\,;\,2\right)$ et $B\left(4\,;\,8\right)$ : coordonnées de $\overrightarrow{AB}$.'
    reponse: $\left(3\,;\,6\right)$
  - question: Coordonnées du milieu de $\left[AB\right]$.
    reponse: $\left(\frac{5}{2}\,;\,5\right)$
  - question: $\vec{u}\left(2\,;\,3\right)$ et $\vec{v}\left(4\,;\,6\right)$ sont-ils colinéaires ?
    reponse: oui, $\vec{v} = 2\vec{u}$ (déterminant nul)
  - question: Calcule la distance $AB$.
    reponse: $AB = \sqrt{45} = 3\sqrt{5}$
  - question: '$\vec{u}\left(2\,;\,-1\right)$, $\vec{v}\left(-3\,;\,4\right)$ : coordonnées de $\vec{u}
      + \vec{v}$ et de $2\vec{u} - \vec{v}$.'
    reponse: $\left(-1\,;\,3\right)$ ; $\left(7\,;\,-6\right)$
  lecons:
  - id: 1ereD_M09_L1
    numero: '9.1'
    titre: Coordonnées d'un vecteur, somme, produit par un réel
    retenir:
    - '$\overrightarrow{AB}\left(x_{B} - x_{A}\,;\,y_{B} - y_{A}\right)$ : **arrivée moins départ**.'
    - 'Deux vecteurs sont **égaux** si et seulement s''ils ont les **mêmes coordonnées**. $\overrightarrow{AB}
      = \overrightarrow{DC}$ équivaut à : $ABCD$ est un **parallélogramme**.'
    - '$\vec{u}\left(x\,;\,y\right)$, $\vec{v}\left(x''\,;\,y''\right)$ : $\vec{u} + \vec{v}\left(x +
      x''\,;\,y + y''\right)$ et $k\vec{u}\left(kx\,;\,ky\right)$.'
    - '**Chasles :** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$ ; le point intermédiaire
      s''efface.'
    methode:
      titre: Calculer avec les coordonnées
      etapes:
      - Écris chaque vecteur avec la règle **« arrivée moins départ »**.
      - Additionne coordonnée par coordonnée ; multiplie par $k$ chaque coordonnée, signes compris.
      - Pour un **point inconnu** (le $D$ d'un parallélogramme $ABCD$), pose $D\left(x\,;\,y\right)$ et
        traduis l'égalité de vecteurs en égalité de coordonnées.
      - 'Une égalité de vecteurs donne **deux** équations : résous-les séparément.'
    exemple_resolu: '$A\left(1\,;\,1\right)$, $B\left(7\,;\,2\right)$, $C\left(8\,;\,6\right)$. Détermine
      $D$ tel que $ABCD$ soit un parallélogramme.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Je traduis par une égalité de vecteurs. | $ABCD$ parallélogramme $\iff$ $\overrightarrow{AB} =
      \overrightarrow{DC}$ |

      | Je calcule le vecteur connu, puis j''écris l''autre avec $D\left(x\,;\,y\right)$. | $\overrightarrow{AB}\left(6\,;\,1\right)$
      ; $\overrightarrow{DC}\left(8 - x\,;\,6 - y\right)$ |

      | Une équation par coordonnée. | $8 - x = 6$ et $6 - y = 1$, donc **$D\left(2\,;\,5\right)$** |

      | **Vérification :** $\overrightarrow{AD}\left(1\,;\,4\right) = \overrightarrow{BC}\left(1\,;\,4\right)$
      ✓ | |'
