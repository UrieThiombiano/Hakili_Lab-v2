      $f\left(x\right) = 3$ ; d) le tableau de variations de $f$ ; e) le signe de $f\left(x\right)$ selon
      $x$.'
    correction: a) $4$ ; $-2$ ; $3$. b) Deux antécédents, $x_{1} \in \left]-2\,;\,1\right[$ et $x_{2}
      \in \left]1\,;\,5\right[$ (lecture approchée). c) **3 solutions** (montée, descente, et $x = 5$).
      d) Croît de 1 à 4 sur $\left[-4\,;\,-2\right]$, décroît jusqu'à $-2$ en 1, croît jusqu'à 3 en 5.
      e) $f > 0$ sur $\left[-4\,;\,x_{1}\right[ \cup \left]x_{2}\,;\,5\right]$, $f < 0$ sur $\left]x_{1}\,;\,x_{2}\right[$.
  - numero: 15
    etoiles: 2
    enonce: 'Tableau de variations de $g$ sur $\left[0\,;\,10\right]$ : $g$ croît de $g\left(0\right)
      = -3$ à $g\left(4\right) = 6$, puis décroît jusqu''à $g\left(10\right) = 2$. a) Donne le maximum
      de $g$ et où il est atteint. b) Combien de solutions a $g\left(x\right) = 0$ ? Et $g\left(x\right)
      = 4$ ? Et $g\left(x\right) = 7$ ? c) Compare $g\left(5\right)$ et $g\left(8\right)$.'
    correction: 'a) $6$, en $x = 4$. b) $g\left(x\right) = 0$ : une (la descente reste au-dessus de 2)
      ; $g\left(x\right) = 4$ : deux ; $g\left(x\right) = 7$ : aucune. c) $g$ décroissante sur $\left[4\,;\,10\right]$
      : $g\left(5\right) > g\left(8\right)$.'
  - numero: 16
    etoiles: 2
    enonce: 'Vrai ou faux, en justifiant : a) « Si $f$ est croissante sur $\left[0\,;\,5\right]$ et $f\left(2\right)
      = 3$, alors $f\left(4\right) \ge 3$. » b) « Si $f\left(1\right) = f\left(3\right) = 0$, alors $f$
      est constante sur $\left[1\,;\,3\right]$. » c) « Le maximum d''une fonction sur un intervalle est
      toujours atteint à une borne. »'
    correction: 'a) **Vrai** : $f\left(4\right) \ge f\left(2\right) = 3$. b) **Faux** : $f$ peut descendre
      puis remonter entre 1 et 3. c) **Faux** : $f\left(x\right) = -x^{2}$ sur $\left[-1\,;\,1\right]$,
      maximum 0 atteint en 0.'
  - numero: 17
    etoiles: 2
    enonce: Une fonction $f$ est impaire et définie sur $\mathbb{R}$. a) Que vaut nécessairement $f\left(0\right)$
      ? Justifie. b) Sachant que $f\left(2\right) = 5$ et que $f$ est croissante sur $\left[0\,;\,+\infty\right[$,
      que dire de $f\left(-2\right)$ et des variations de $f$ sur $\left]-\infty\,;\,0\right]$ ?
    correction: 'a) $f\left(0\right) = -f\left(0\right)$, donc $f\left(0\right) = 0$. b) $f\left(-2\right)
      = -5$ ; une fonction impaire garde le **même sens de variation** de part et d''autre de 0 : $f$
      est croissante sur $\left]-\infty\,;\,0\right]$.'
  - numero: 18
    etoiles: 2
    enonce: '(Ouahigouya) Une productrice vend l''oignon 350 FCFA le kilogramme, le sac vide coûte 200
      FCFA. $C\left(x\right)$ est le prix payé pour $x$ kg avec un sac. a) Exprime $C\left(x\right)$.
      b) Calcule l''image de $12$. c) Un client paie 4 750 FCFA : quelle masse a-t-il achetée ? d) Quel
      est l''ensemble de définition raisonnable de $C$ si un sac contient au plus 50 kg ?'
    correction: 'a) $C\left(x\right) = 350x + 200$. b) $4\,400$ FCFA. c) $350x = 4\,550$ : $x = 13$ kg.
      d) $\left[0\,;\,50\right]$.'
  - numero: 19
    etoiles: 2
    enonce: '(Bobo-Dioulasso) Dans un verger, la masse de mangues récoltées, en tonnes, après $t$ semaines
      est $M\left(t\right) = -t^{2} + 10t$ pour $t \in \left[0\,;\,10\right]$. a) Calcule $M\left(2\right)$
      et $M\left(8\right)$ : que remarques-tu ? b) Résous $M\left(t\right) = 0$ et interprète. c) En utilisant
      $M\left(t\right) = 25 - \left(t - 5\right)^{2}$ (vérifie-la), montre que le maximum de $M$ est 25
      et donne la semaine où il est atteint.'
    correction: 'a) $M\left(2\right) = M\left(8\right) = 16$ (symétrie autour de $t = 5$). b) $t\left(10
      - t\right) = 0$ : $t = 0$ ou $t = 10$, début et fin de saison. c) $25 - \left(t - 5\right)^{2} =
      -t^{2} + 10t$ ✓ ; comme $\left(t - 5\right)^{2} \ge 0$, $M\left(t\right) \le 25$, égalité en $t
      = 5$ : **25 tonnes** à la 5ᵉ semaine.'
  - numero: 20
    etoiles: 2
    enonce: '(J''écris et j''explique) Explique à un camarade la différence entre « l''image de $a$ par
      $f$ » et « un antécédent de $a$ par $f$ », en illustrant avec $f\left(x\right) = x^{2}$ et $a =
      9$.


      ### ★★★ Défis de maîtrise'
    correction: 'L''**image** de 9 est $f\left(9\right) = 81$, unique. Les **antécédents** de 9 sont les
      $x$ tels que $x^{2} = 9$, soit $3$ et $-3$ : il peut y en avoir plusieurs, ou aucun.'
  - numero: 21
    etoiles: 3
    enonce: Une savonnerie de Bobo-Dioulasso produit $x$ centaines de savons par jour, avec $0 < x \leq
      25$. Le coût total, en milliers de FCFA, est $C\left(x\right) = x^{2} + 16x + 80$, la recette est
      $R\left(x\right) = 40x$. Détermine pour quelles productions l'atelier est bénéficiaire, puis la
      production qui rend le bénéfice maximal, et donne ce bénéfice en FCFA ainsi que le nombre de savons
      correspondant.
    correction: '*Démarche.* « Bénéficiaire » n''est pas donné : on pose $B = R - C$ et on traduit par
      $B\left(x\right) > 0$ ; le signe du trinôme donne l''intervalle, son sommet le maximum, et il faut
      revenir aux unités.

      $B\left(x\right) = -x^{2} + 24x - 80$, $\Delta = 256$, racines $4$ et $20$ ; coefficient dominant
      négatif, donc $B\left(x\right) > 0 \iff 4 < x < 20$ : entre $400$ et $2\,000$ savons par jour.

      Sommet en $x = 12$, $B\left(12\right) = 64$ : bénéfice maximal de $64\,000$ FCFA pour $1\,200$ savons
      par jour.'
  - numero: 22
    etoiles: 3
    enonce: Une fonction $f$ est définie sur $\left[-4\,;\,6\right]$, strictement décroissante sur $\left[-4\,;\,1\right]$
      où elle passe de $7$ à $-2$, puis strictement croissante sur $\left[1\,;\,6\right]$ où elle passe
      de $-2$ à $5$. Sans connaître son expression, détermine le nombre exact de solutions de $f\left(x\right)
      = 0$, $f\left(x\right) = 5$, $f\left(x\right) = -3$, $f\left(x\right) = 7$ et $f\left(x\right) =
      -2$, en justifiant. Donne enfin le maximum et le minimum de $f$, avec les valeurs où ils sont atteints.
    correction: '*Démarche.* On n''a pas $f$, mais sa monotonie stricte sur deux intervalles : sur chacun,
      $f\left(x\right) = k$ a une solution et une seule si $k$ est entre les valeurs extrêmes, aucune
      sinon. On situe donc $k$ par rapport à $\left[-2\,;\,7\right]$ puis à $\left[-2\,;\,5\right]$.

      $f\left(x\right) = 0$ : **2** (une par branche). $f\left(x\right) = 5$ : **2** (dont $x = 6$). $f\left(x\right)
      = -3$ : **aucune** ($-3 < -2$). $f\left(x\right) = 7$ : **1**, en $x = -4$. $f\left(x\right) = -2$
      : **1**, en $x = 1$, point commun aux deux branches.

      $\max f = 7$ en $x = -4$ ; $\min f = -2$ en $x = 1$.'
  - numero: 23
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Si $f$ est paire, alors $f\left(0\right) = 0$.

      b) Une fonction paire définie sur $\mathbb{R}$ ne peut pas être strictement croissante sur $\mathbb{R}$.

      c) Si $f$ est impaire et définie en $0$, alors $f\left(0\right) = 0$.

      d) La fonction $x \longmapsto \frac{1}{x}$ est décroissante sur $\mathbb{R}^{*}$.'
    correction: '*Démarche.* On revient chaque fois à la définition et on cherche un couple de valeurs
      opposées qui fasse apparaître la contradiction ; en d), le contre-exemple doit enjamber 0.

      a) **Faux** : $x \mapsto x^{2} + 1$ est paire et $f\left(0\right) = 1$. b) **Vrai** : sinon $f\left(-1\right)
      < f\left(1\right)$ et $f\left(-1\right) = f\left(1\right)$, contradiction. c) **Vrai** : $f\left(0\right)
      = -f\left(0\right)$, donc $f\left(0\right) = 0$. d) **Faux** : $-1 < 1$ mais $\frac{1}{-1} = -1
      < 1 = \frac{1}{1}$ ; la fonction inverse décroît **sur** chacun des deux intervalles, pas sur leur
      réunion, qui n''est pas un intervalle.'
  - numero: 24
    etoiles: 3
    enonce: Soit $f\left(x\right) = \frac{2x - 1}{x + 3}$. a) Détermine son ensemble de définition. b)
      Démontre que $f\left(x\right) = 2 - \frac{7}{x + 3}$ sur cet ensemble. c) Déduis-en le sens de variation
      de $f$ sur chacun des deux intervalles. d) Démontre qu'aucun réel n'a pour image $2$.
    correction: '*Démarche.* L''écriture de b) isole la variable en un seul endroit, ce qui rend c) immédiate
      ; on l''obtient en faisant apparaître le dénominateur au numérateur.

      a) $D_{f} = \mathbb{R} \setminus \{-3\} = \left]-\infty\,;\,-3\right[ \cup \left]-3\,;\,+\infty\right[$.
      b) $2 - \frac{7}{x + 3} = \frac{2x + 6 - 7}{x + 3} = f\left(x\right)$.

      c) Si $u < v$ sont du même côté de $-3$, alors $u + 3 < v + 3$ et ces deux nombres sont de même
      signe, donc $\frac{1}{u + 3} > \frac{1}{v + 3}$, puis $-\frac{7}{u + 3} < -\frac{7}{v + 3}$, soit
      $f\left(u\right) < f\left(v\right)$ : $f$ est **strictement croissante sur chacun des deux intervalles**,
      pas sur leur réunion.

      d) $f\left(x\right) = 2$ donnerait $\frac{7}{x + 3} = 0$, impossible ($7 \ne 0$) : aucun antécédent
      de 2.'
  - numero: 25
    etoiles: 3
    enonce: On pose $f\left(x\right) = \sqrt{x + 2}$ et $g\left(x\right) = \frac{1}{x - 1}$. Détermine,
      en justifiant chaque condition, les ensembles de définition de $f$, de $g$, de $f + g$, de $g \circ
      f$ et de $f \circ g$.
    correction: '*Démarche.* Pour une composée, deux conditions : $x \in D_{f}$ **et** $f\left(x\right)
      \in D_{g}$. C''est la clé du défi, et le dernier cas donne une inéquation quotient.

      $D_{f} = \left[-2\,;\,+\infty\right[$ ; $D_{g} = \mathbb{R} \setminus \{1\}$ ; $D_{f + g} = \left[-2\,;\,1\right[
      \cup \left]1\,;\,+\infty\right[$.

      $D_{g \circ f}$ : $x \ge -2$ et $\sqrt{x + 2} \ne 1$, soit $x \ne -1$ : $\left[-2\,;\,-1\right[
      \cup \left]-1\,;\,+\infty\right[$.

      $D_{f \circ g}$ : $x \ne 1$ et $\frac{1}{x - 1} \ge -2$, soit $\frac{2x - 1}{x - 1} \ge 0$ : $\left]-\infty\,;\,\frac{1}{2}\right]
      \cup \left]1\,;\,+\infty\right[$.'
  - numero: 26
    etoiles: 3
    enonce: 'Voici la copie de Awa, qui devait déterminer l''ensemble de définition de $h\left(x\right)
      = \frac{\sqrt{x - 1}}{x - 4}$ puis calculer $h\left(1\right)$. Repère l''erreur, corrige l''ensemble
      de définition, et calcule $h\left(1\right)$.


      | Ligne | Ce que Awa a écrit |

      |---|---|

      | 1 | Il y a une racine carrée : il faut $x - 1 > 0$, donc $x > 1$. |

      | 2 | Il y a un dénominateur : il faut $x - 4 \neq 0$, donc $x \neq 4$. |

      | 3 | $D_{h} = \left]1\,;\,4\right[ \cup \left]4\,;\,+\infty\right[$ |

      | 4 | $h\left(1\right)$ n''existe pas, car $1$ n''appartient pas à $D_{h}$. |'
    correction: '*Démarche.* Chaque condition a sa raison : la racine impose une inégalité **large**,
      le dénominateur une valeur interdite. Awa a transposé la règle du dénominateur sur le radicande.

      **La ligne 1 est fausse** : il faut $x - 1 \ge 0$, car $\sqrt{0} = 0$ existe. Les lignes 3 et 4
      en héritent.

      $D_{h} = \left[1\,;\,4\right[ \cup \left]4\,;\,+\infty\right[$, et $h\left(1\right) = \frac{0}{-3}
      = 0$ : $1$ est un antécédent de $0$.


      ---'
  fiche_revision:
  - '**Image.** $f\left(a\right)$ se calcule, et elle est unique.'
  - '**Antécédent.** Se cherche en résolvant $f\left(x\right) = k$ ; il peut y en avoir zéro, un ou plusieurs.'
  - '**Ensemble de définition.** Dénominateur $\ne 0$, radicande $\ge 0$, conditions cumulées.'
  - '**Point et courbe.** $M\left(a\,;\,b\right) \in \mathcal{C}_{f}$ équivaut à $b = f\left(a\right)$.'
  - '**Variations.** Croissante : conserve l''ordre. Décroissante : inverse l''ordre. Sur un **même**
    intervalle.'
  - '**Extremums.** Ce sont des ordonnées, lues aux virages et aux bornes.'
  - '**Nombre de solutions.** Une par flèche traversant la hauteur $k$, aucune si $k$ est hors de la flèche.'
  - '**Parité.** $D_{f}$ symétrique d''abord, puis $f\left(-x\right)$ ; le cas courant est « ni l''une
    ni l''autre ».'
  trouve_erreur:
  - faux: $\frac{1}{\sqrt{x - 2}}$ existe pour $x - 2 \ge 0$
    correction: 'Racine au dénominateur : $x - 2 > 0$, strictement'
  - faux: $f\left(x\right) = x^{2} + 3$ donne $f\left(-x\right) = -x^{2} + 3$
    correction: $\left(-x\right)^{2} = x^{2}$, donc $f\left(-x\right) = x^{2} + 3$
  - faux: « Le maximum est atteint en $x = 4$, il vaut 4 »
    correction: Le maximum est l'ordonnée $f\left(4\right)$, pas l'abscisse
  - faux: « $f$ n'est pas paire, donc $f$ est impaire »
    correction: Les deux tests sont indépendants ; le plus souvent, ni l'un ni l'autre
