  objet: Ecrire en notation scientifique la consommation de 800 habitants à 25 L par jour (Diapaga)
  reponse_attendue: 800 × 25 = 20 000 L = 2 × 10⁴ L
  solution: 'Barème (2 pts) : 1 pt pour le produit 800 × 25 = 20 000 litres ; 1 pt pour l''écriture scientifique
    2 × 10⁴ (forme a × 10ⁿ avec 1 ≤ a < 10 exigée ; 20 × 10³ ne prend pas ce point). La hauteur de 12
    m de la tour est une donnée inutile ; la signaler n''est ni exigé ni pénalisé.'
  si_echoue: Ecriture d'un nombre en notation scientifique.
  probleme_parent: P4
- code: P4.2
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: N.PUI
  competence_secondaire: L.EQ1
  domaine: Activites numeriques
  objet: Mettre en équation la vidange (1,2 × 10⁵ L, -1 × 10⁴ L par jour) et calculer n
  reponse_attendue: 1,2 × 10⁵ - 1 × 10⁴ × n = 0 ; n = 12 jours
  solution: 'Au bout de n jours le château a perdu 1 × 10⁴ × n litres : 1 × 10⁴ × n = 1,2 × 10⁵, n = 1,2
    × 10¹ = 12. Barème (3 pts) : 1 pt pour l''équation posée, la variation quotidienne multipliée par
    n ; 1 pt pour le quotient de deux puissances de 10 mené correctement ; 1 pt pour n = 12 jours, l''unité
    étant attendue.'
  si_echoue: Quotient de deux puissances de 10, ou mise en équation d'une diminution régulière jour après
    jour.
  probleme_parent: P4
- code: P4.3
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: N.PRIO
  competence_secondaire: L.EQ1
  domaine: Activites numeriques
  objet: Comparer 12 jours à deux semaines et juger « la réserve tiendra plus de deux semaines » (Yacouba)
  reponse_attendue: deux semaines = 14 jours ; 12 < 14, la réserve ne tiendra pas plus de deux semaines,
    Yacouba a tort
  solution: 'Conclusion : « La réserve ne tient que 12 jours, alors que deux semaines en comptent 14 :
    Yacouba a tort, cette réserve ne tiendra pas plus de deux semaines. » Barème (3 pts) : 1 pt pour la
    conversion des deux semaines en 14 jours ; 1 pt pour la comparaison explicite de 12 à 14 ; 1 pt pour
    la conclusion tranchant sur l''affirmation. L''élève qui conclut correctement à partir d''un n erroné
    garde les trois points.'
  si_echoue: Conversion d'une durée et comparaison pour décider.
  probleme_parent: P4
