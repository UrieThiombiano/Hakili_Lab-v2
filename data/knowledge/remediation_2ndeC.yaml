    correction: 'On cherche $N$ d''abord : la modalité A donne effectif et fréquence, ce qui suffit. a)
      $28$ % $\rightarrow 84$, donc $2$ % $\rightarrow 6$ et $N = 300$. b) $n_B = 0{,}15 \times 300 =
      45$. Contrôle : $\frac{45}{300} = 15$ %. ✓'
  - numero: 40
    etoiles: 3
    enonce: Une série de cinq nombres a pour moyenne $12$. On lui ajoute un sixième nombre, et la moyenne
      devient $13$. Quel est ce nombre ?
    correction: 'Seules les sommes s''additionnent : on passe donc des moyennes aux sommes. $5 \times
      12 = 60$ et $6 \times 13 = 78$, donc le nombre ajouté vaut $18$. Il dépasse l''ancienne moyenne,
      ce qui est nécessaire puisque la moyenne a monté.'
  - numero: 41
    etoiles: 3
    enonce: 'Cumuls croissants de notes : $5 \rightarrow 4$ ; $8 \rightarrow 10$ ; $11 \rightarrow 18$
      ; $15 \rightarrow 24$. a) Retrouve les quatre effectifs. b) Médiane. c) Étendue.'
    correction: 'On redescend des cumuls aux effectifs, seule information réelle. a) $4$ ; $6$ ; $8$ ;
      $6$, donc $N = 24$. b) $N$ pair : rangs $12$ et $13$ ; le cumul passe de $10$ à $18$ à la note $11$,
      donc médiane $= 11$. c) Étendue $10$.'
  - numero: 42
    etoiles: 3
    enonce: 'Série groupée : $\left[0\,;\,20\right[$ : $6$ ; $\left[20\,;\,40\right[$ : $n$ ; $\left[40\,;\,60\right[$
      : $4$. La moyenne, calculée avec les centres, vaut $28$. Détermine $n$.'
    correction: 'L''inconnue est un effectif, la donnée une moyenne : on écrit la formule, puis on la
      traduit en équation. Centres $10$, $30$, $50$ : $\frac{260 + 30n}{10 + n} = 28$, donc $2n = 20$
      et $n = 10$. Contrôle : $\frac{560}{20} = 28$. ✓'
  - numero: 43
    etoiles: 3
    enonce: Vrai ou faux ? Prouve chaque réponse par un calcul, une justification générale ou un contre-exemple.
      a) La somme des fréquences est égale à l'effectif total. b) La moyenne est toujours l'une des valeurs
      de la série. c) Si l'on ajoute une valeur égale à la moyenne, la moyenne ne change pas. d) La médiane
      est toujours égale à la moyenne.
    correction: 'a) **Faux** : elle vaut $100$ % ; c''est celle des effectifs qui vaut $N$. b) **Faux**
      : valeurs $13$ à $17$ d''effectifs $5$, $8$, $15$, $10$, $2$ donnent $\overline{x} = 14{,}9$, absente
      de la série. c) **Vrai** : la nouvelle somme vaut $\left(N + 1\right)\overline{x}$ pour $N + 1$
      valeurs. d) **Faux** : $3\,;\,3\,;\,4\,;\,4\,;\,36$ a pour médiane $4$ et pour moyenne $10$.'
  - numero: 44
    etoiles: 3
    enonce: 'À Kaya, $240$ personnes : radio $96$, télévision $60$, journal $24$, bouche à oreille $60$.
      Talato a rendu ceci.


      > Ligne 1 : $N = 96 + 60 + 24 + 60 = 240$.

      > Ligne 2 : fréquence de la radio $= \frac{96}{240} = 0{,}4$, soit $4$ %.

      > Ligne 3 : angle de la radio $= 96 \times 360 = 34\,560^{\circ}$.

      > Ligne 4 : moyenne des effectifs $= \frac{240}{4} = 60$, donc le moyen d''information moyen est
      la télévision.

      > Ligne 5 : le mode de cette série est $96$.


      Trouve la première ligne qui casse le raisonnement, explique toutes les fautes, puis refais le travail
      proprement.'
    correction: 'On relit ligne à ligne en vérifiant que chaque quantité porte son nom. **La ligne 2 casse
      le raisonnement** : $0{,}4 = 40$ %. Ligne 3 : un angle s''obtient après division par $N$, et ne
      dépasse pas $360^{\circ}$. Ligne 4 : caractère **qualitatif**, pas de moyenne. Ligne 5 : le mode
      est la **valeur** la plus fréquente, la radio, pas $96$. Correct : fréquences $40$ %, $25$ %, $10$
      %, $25$ % ; angles $144^{\circ}$, $90^{\circ}$, $36^{\circ}$, $90^{\circ}$ ; mode : la radio.'
  - numero: 45
    etoiles: 3
    enonce: 'À Piéla, les livraisons des productrices : $8$ sacs pour $6$ d''entre elles, $10$ sacs pour
      $9$, $12$ sacs pour $11$, $15$ sacs pour $4$. Une centrale propose deux contrats fermes, l''un de
      $300$ sacs, l''autre de $360$. Un membre du bureau soutient que le second est à portée, puisque
      la livraison la plus courante est de $12$ sacs. La cotisation annuelle est de $2\,000$ FCFA et le
      magasin date de $2019$. Conseille la présidente.'
    correction: 'Le contrat se compare au **total livré**, ni au mode ni à la moyenne. $N = 30$ productrices,
      total $= 48 + 90 + 132 + 60 = 330$ sacs, soit $11$ sacs en moyenne. Le bureau confond mode et moyenne
      : $30 \times 12 = 360$ suppose que toutes livrent $12$ sacs, et surestime de $30$ sacs. **Signer
      le contrat de $300$ sacs, qui laisse $30$ sacs de marge ; refuser celui de $360$.** Cotisation et
      année du magasin : données parasites.'
  fiche_revision:
  - '**Vocabulaire.** Population, individu, caractère (quantitatif ou qualitatif), $x_i$, $n_i$, $N$.'
  - '**Fréquence.** $f_i = \frac{n_i}{N}$, en % après $\times 100$ ; somme $= 100$ %. Inverse : $n_i =
    f_i \times N$, $N = \frac{n_i}{f_i}$.'
  - '**Classes.** $\left[a\,;\,b\right[$ : borne droite exclue. Amplitude $b - a$, centre $\frac{a + b}{2}$.'
  - '**Cumuls croissants.** Additions de proche en proche ; le dernier cumul vaut $N$.'
  - '**Moyenne.** $\overline{x} = \frac{n_1 x_1 + \dots + n_p x_p}{N}$, centres si série groupée. Toujours
    entre les extrêmes, sensible aux valeurs extrêmes.'
  - '**Mode, étendue, médiane.** Mode : plus grand effectif. Étendue : max moins min. Médiane : série
    **ordonnée**, rang $\frac{N + 1}{2}$ si $N$ impair, demi-somme des rangs $\frac{N}{2}$ et $\frac{N}{2}
    + 1$ si $N$ pair.'
  - '**Diagrammes.** Bâtons et barres séparés ; histogramme accolé ; circulaire : angle $= f_i \times
    360^{\circ}$.'
  trouve_erreur:
  - faux: La somme des fréquences vaut $250$
    correction: Elle vaut $100$ % ; c'est la somme des **effectifs** qui vaut $N = 250$.
  - faux: $\frac{96}{240} = 0{,}4$, soit $4$ %
    correction: $0{,}4 = 40$ %.
  - faux: Angle $= 30 \times 360 = 10\,800^{\circ}$
    correction: '$\frac{30}{120} \times 360^{\circ} = 90^{\circ}$ : un angle ne dépasse jamais $360^{\circ}$.'
  - faux: 'Moyennes $11$ et $14$ : ensemble $= 12{,}5$'
    correction: 'On n''additionne pas des moyennes. Avec $20$ et $30$ élèves : $\frac{220 + 420}{50} =
      12{,}8$.'
