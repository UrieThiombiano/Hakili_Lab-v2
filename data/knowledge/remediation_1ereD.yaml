    correction: a) $1{,}03 \times 10^{-8}$ ; b) $5 \times 10^{15}$ ; c) $1{,}2 \times 10^{-8}$.
  - numero: 11
    etoiles: 1
    enonce: 'Écris plus simplement : a) $\sqrt{18}$ ; b) $\sqrt{48}$ ; c) $\sqrt{75}$ ; d) $\sqrt{16 \times
