  - numero: 15
    etoiles: 1
    enonce: 'Écris sous forme d''intervalle, puis représente sur une droite graduée :

      **a)** $x > 4$ ; **b)** $x \le -1$ ; **c)** $x \ge 0$.'
    correction: 'a) $\left]4\,;+\infty\right[$, ouvert ; b) $\left]-\infty\,;-1\right]$, fermé ;

      c) $\left[0\,;+\infty\right[$, fermé.'
  - numero: 16
    etoiles: 1
    enonce: 'Résous et représente : **a)** $-3x < 0$ ; **b)** $2x + 1 \ge x - 3$.'
    correction: 'a) Division par $-3$, le sens change : $S = \left]0\,;+\infty\right[$ ;

      b) $S = \left[-4\,;+\infty\right[$.'
  - numero: 17
    etoiles: 1
    enonce: 'Résous : **a)** par substitution, $y = 2x$ et $x + y = 9$ ; **b)** par

