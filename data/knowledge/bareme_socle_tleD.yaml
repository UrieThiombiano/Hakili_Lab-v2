  reponse_attendue: hérédité uₙ₊₁ = 3(2 × 3ⁿ + 2) - 4 = 2 × 3ⁿ⁺¹ + 2 ; pour tout n ≥ 1, uₙ = 2 × 3ⁿ +
    2
  solution: 'Initialisation donnée : 2 × 3¹ + 2 = 8 = u₁. Conclusion attendue : « P(1) est vraie et la
    propriété est héréditaire, donc, d''après le principe de récurrence, pour tout entier n ≥ 1, uₙ =
    2 × 3ⁿ + 2. » Barème (3 pts) : 1 pt pour l''hypothèse de récurrence écrite au rang n, 1 pt pour le
    calcul d''hérédité par substitution jusqu''à 2 × 3ⁿ⁺¹ + 2, 1 pt pour la phrase de conclusion invoquant
    l''initialisation et l''hérédité. L''initialisation fournie n''est pas payée ; une hérédité juste
    sans hypothèse écrite ne vaut pas le premier point.'
