- niveau: 3eme
  module: 3
  module_titre: 'Fractions et quotients : les gestes qui sauvent'
  pourquoi: 'Les fractions reviennent partout en 3ème : Thalès, trigonométrie, probabilités, valeurs exactes.
    Cinq gestes seulement : simplifier, comparer, additionner, multiplier, diviser.'
  diagnostic:
  - question: 'Rends irréductible : $\frac{45}{60}$.'
    reponse: $\frac{3}{4}$
  - question: Compare $\frac{5}{6}$ et $\frac{7}{9}$.
    reponse: $\frac{15}{18} > \frac{14}{18}$, donc $\frac{5}{6} > \frac{7}{9}$
  - question: 'Calcule : $\frac{2}{3} + \frac{1}{6}$ ; $\frac{5}{4} - \frac{2}{3}$.'
    reponse: $\frac{5}{6}$ ; $\frac{7}{12}$
  - question: 'Calcule : $\frac{3}{7} \times \frac{14}{9}$ ; $\frac{3}{4} \div \frac{9}{8}$.'
    reponse: $\frac{2}{3}$ ; $\frac{2}{3}$
  - question: 'Calcule : $\frac{-5}{8} + \frac{3}{4}$.'
    reponse: $\frac{-5}{8} + \frac{6}{8} = \frac{1}{8}$
  lecons:
  - id: 3eme_M03_L1
    numero: '3.1'
    titre: Simplifier
    retenir:
    - 'Un quotient ne change pas si l''on multiplie ou divise haut **et** bas par un même nombre non nul
      :'
    - '**Simplifier** : diviser haut et bas par un diviseur commun.'
    - '**Irréductible** : plus aucun diviseur commun autre que $1$.'
    - '**Critères** : par $2$ (pair) ; par $3$ ou $9$ (somme des chiffres) ; par $5$ (finit par $0$ ou
      $5$) ; par $10$ (finit par $0$).'
    methode:
      titre: Rendre une fraction irréductible
      etapes:
      - Cherche un diviseur commun évident ($2$, $3$, $5$…).
      - Divise haut et bas, puis recommence tant que c'est possible.
      - 'Plus rapide : décompose haut et bas en produits de facteurs, barre les facteurs communs.'
      - 'Vérifie : plus aucun diviseur commun.'
    exemple_resolu: 'Rends $\frac{45}{60}$ irréductible.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $45$ et $60$ divisibles par $5$. | $\frac{45}{60} = \frac{9}{12}$ |

      | $9$ et $12$ divisibles par $3$. | $\frac{9}{12} = \frac{3}{4}$ |

      | Plus de diviseur commun. | $\frac{45}{60} = \frac{3}{4}$ |

      | **Vérification :** $3 \times 15 = 45$ et $4 \times 15 = 60$. ✓ | |'
    erreurs_frequentes:
    - erreur: simplifier en soustrayant, $\frac{45}{60} = \frac{40}{55}$.
      correction: 'on **divise** par un diviseur commun : $\frac{45}{60} = \frac{3}{4}$.'
    - erreur: barrer les $9$ dans $\frac{9 + 4}{9}$.
      correction: 'on simplifie des **facteurs**, jamais des termes d''une somme : $\frac{13}{9}$.'
    declic: null
    figures: []
  - id: 3eme_M03_L2
    numero: '3.2'
    titre: Comparer, additionner, soustraire
    retenir:
    - On ne compare, n'additionne et ne soustrait que des fractions de **même dénominateur**.
    - Sinon on y **réduit**, avec un multiple commun, le plus petit possible.
    - 'Un entier se met en fraction : $4 = \frac{12}{3}$.'
    methode:
      titre: Additionner deux fractions de dénominateurs différents
      etapes:
      - Cherche le plus petit dénominateur commun ($3$ et $6 \to 6$ ; $4$ et $6 \to 12$).
      - Transforme chaque fraction (haut et bas par le même nombre).
      - Additionne les **numérateurs** ; le dénominateur ne change plus.
      - Simplifie le résultat.
    exemple_resolu: 'Calcule $A = \frac{5}{4} - \frac{2}{3}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Dénominateurs $4$ et $3$ : commun $12$. | $\frac{5}{4} = \frac{15}{12}$ ; $\frac{2}{3} = \frac{8}{12}$
      |

      | On soustrait les numérateurs. | $A = \frac{15 - 8}{12} = \frac{7}{12}$ |

      | $7$ et $12$ : irréductible. | $A = \frac{7}{12}$ |

      | **Vérification :** $1{,}25 - 0{,}67 \approx 0{,}58 \approx \frac{7}{12}$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\frac{2}{3} + \frac{1}{4} = \frac{3}{7}$.
      correction: 'dénominateur commun $12$ : $\frac{8}{12} + \frac{3}{12} = \frac{11}{12}$.'
    - erreur: bloquer devant un entier.
      correction: $4 - \frac{2}{3} = \frac{12}{3} - \frac{2}{3} = \frac{10}{3}$. Le mot « reste » cache
        une soustraction à partir de $1$.
    declic: null
    figures:
    - figures/m03_f3.svg
  - id: 3eme_M03_L3
    numero: '3.3'
    titre: Multiplier et diviser
    retenir:
    - '**Multiplier** : numérateurs entre eux, dénominateurs entre eux ; aucun dénominateur commun.'
    - '« Les $\frac{3}{4}$ de $60$ » : $\frac{3}{4} \times 60 = 45$.'
    - '**Inverse** de $\frac{a}{b}$ ($a \ne 0$) : $\frac{b}{a}$ ; inverse de $5$ : $\frac{1}{5}$.'
    - '**Diviser, c''est multiplier par l''inverse** : $\frac{a}{b} \div \frac{c}{d} = \frac{a}{b} \times
      \frac{d}{c}$. Une fraction en étages est une division déguisée.'
    methode:
      titre: Multiplier malin
      etapes:
      - Écris le produit sous **une seule barre**, sans effectuer.
      - Décompose en facteurs et barre les facteurs communs haut/bas.
      - Multiplie ce qui reste.
      - 'Division : passe à l''inverse, puis reprends 1 à 3.'
    exemple_resolu: 'Calcule $B = \frac{3}{4} \div \frac{9}{8}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Multiplier par l''inverse de $\frac{9}{8}$. | $B = \frac{3}{4} \times \frac{8}{9} = \frac{3 \times
      8}{4 \times 9}$ |

      | $8 = 4 \times 2$, $9 = 3 \times 3$ : on barre $3$ et $4$. | $B = \frac{3 \times 4 \times 2}{4
      \times 3 \times 3}$ |

      | Produit des facteurs restants. | $B = \frac{2}{3}$ |

      | **Vérification :** $\frac{2}{3} \times \frac{9}{8} = \frac{3}{4}$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\frac{3}{4} \div \frac{9}{8} = \frac{3 \div 9}{4 \div 8}$.
      correction: 'on retourne le **second** nombre : $\frac{3}{4} \times \frac{8}{9} = \frac{2}{3}$.'
    - erreur: réduire au même dénominateur avant de multiplier.
      correction: cette étape n'appartient qu'à l'addition et à la soustraction.
    declic: null
    figures: []
  - id: 3eme_M03_L4
    numero: '3.4'
    titre: Quotients relatifs et familles de nombres
    retenir:
    - 'Signe d''un quotient : règle des signes du produit ; le signe se déplace :'
    - Détermine le signe **d'abord**, puis calcule avec les distances à zéro.
    - $\mathbb{N}$ entiers naturels ; $\mathbb{Z}$ entiers relatifs ; $\mathbb{D}$ décimaux (virgule qui
      s'arrête) ; $\mathbb{Q}$ rationnels (quotients d'entiers) ; $\mathbb{R}$ réels. $\mathbb{N} \subset
      \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$.
    - '**Test décimal :** fraction irréductible dont le dénominateur ne contient que des facteurs $2$
      et $5$ $\Rightarrow$ écriture décimale finie ($\frac{3}{40} = 0{,}075$) ; sinon illimitée ($\frac{7}{12}$).'
    methode:
      titre: Calculer avec des fractions relatives
      etapes:
      - 'Écris chaque fraction avec son signe devant : $\frac{5}{-6} = -\frac{5}{6}$.'
      - 'Addition/soustraction : dénominateur commun, puis somme des numérateurs relatifs.'
      - 'Produit/quotient : signe par la règle des signes, puis calcul sur les valeurs positives.'
      - Simplifie.
    exemple_resolu: 'Calcule $C = \frac{-5}{8} + \frac{3}{4}$ et $D = \frac{-2}{3} \times \frac{9}{-4}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $C$ : dénominateur commun $8$, puis $-5 + 6 = 1$. | $C = \frac{-5}{8} + \frac{6}{8} = \frac{1}{8}$
      |

      | $D$ : deux facteurs négatifs, produit positif. | $D = +\frac{2 \times 9}{3 \times 4} = \frac{18}{12}$
      |

      | On simplifie par $6$. | $D = \frac{3}{2}$ |

      | **Vérification :** $-0{,}625 + 0{,}75 = 0{,}125 = \frac{1}{8}$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\frac{-3}{-4} = -\frac{3}{4}$.
      correction: 'deux moins donnent un quotient positif : $\frac{3}{4}$. Le moins devant une fraction
        porte sur **toute** la fraction.'
    - erreur: croire que tout rationnel est décimal.
      correction: $\frac{2}{7} \in \mathbb{Q}$ mais $\notin \mathbb{D}$ ; on donne la valeur exacte, en
        fraction.
    declic: ce que les fractions portent en 3ème — Thalès est une égalité de fractions ; la trigonométrie
      donne des rapports ; une probabilité est une fraction ; une valeur exacte s'écrit $\frac{\sqrt{2}}{2}$.
      Aucun chapitre de l'année n'échappe à ces cinq gestes.
    figures: []
