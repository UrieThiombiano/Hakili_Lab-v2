      -1$ ; $4 < -b < 5$ donne $6 < a - b < 8$ ; $-15 < ab < -8$ ; $-\frac{1}{4} < \frac{1}{b} < -\frac{1}{5}$
      donne $-\frac{3}{4} < \frac{a}{b} < -\frac{2}{5}$ ; $4 < a^{2} < 9$ et $16 < b^{2} < 25$ donnent
      $20 < a^{2} + b^{2} < 34$ ; enfin $-1 < \frac{1}{a+b} < -\frac{1}{3}$. Les amplitudes de départ
      valent 1, celle de $ab$ vaut 7 : un encadrement se dégrade vite quand on multiplie, donc on encadre
      le plus tard possible.'
  - numero: 45
    etoiles: 3
    enonce: 'Ousmane devait encadrer $x - y$ sachant $3 < x < 5$ et $1 < y < 2$. Trouve la ligne fausse,
      énonce la règle correcte, refais l''encadrement, puis donne un couple $\left(x\,;\,y\right)$ qui
      prouve que sa réponse est fausse.


      | Ligne | Ce qu''Ousmane a écrit |

      |---|---|

      | 1 | $3 < x < 5$ et $1 < y < 2$ |

      | 2 | En soustrayant membre à membre : $3 - 1 < x - y < 5 - 2$ |

      | 3 | Donc $2 < x - y < 3$ |'
    correction: '*Idée :* pour démasquer une règle fausse, pousser le résultat aux extrêmes. **Ligne 2
      fausse** : on ne soustrait pas deux encadrements membre à membre ; il faut encadrer $-y$, ce qui
      inverse le sens. De $-2 < -y < -1$ et $3 < x < 5$ : $1 < x - y < 4$. Contre-exemple : $x = 3{,}1$,
      $y = 1{,}9$ donnent $x - y = 1{,}2 \notin \left]2\,;\,3\right[$.'
  - numero: 46
    etoiles: 3
    enonce: a) Combien y a-t-il d'entiers $n$ tels que $\frac{100}{7} < n < \frac{300}{7}$ ? Donne le
      plus petit et le plus grand. b) Combien y a-t-il d'entiers naturels $n$ tels que $E\left(\frac{n}{5}\right)
      = 7$ ? Lesquels ?
    correction: '*Idée :* la partie entière donne le plus grand entier sous un nombre ; on compte ensuite
      par « dernier $-$ premier $+ 1$ ». a) $E\left(\frac{100}{7}\right) = 14$ donc le plus petit est
      15 ; $E\left(\frac{300}{7}\right) = 42$ donc le plus grand est 42 : $42 - 15 + 1 = 28$ entiers.
      b) $E\left(\frac{n}{5}\right) = 7$ équivaut à $35 \le n < 40$ : cinq entiers, 35 à 39.'
  - numero: 47
    etoiles: 3
    enonce: 'Un maçon de Kaya mesure une dalle : longueur $4{,}2$ m, largeur $3{,}5$ m, chaque mesure
      à $5$ cm près. Le carrelage se vend au mètre carré entier. Encadre l''aire, indique le nombre de
      m$^{2}$ à commander pour être certain, et évalue la surface perdue dans le pire des cas.'
    correction: '*Idée :* « à 5 cm près » se traduit par un encadrement ; « être certain » impose de partir
      de la borne supérieure. $4{,}15 \le L \le 4{,}25$ et $3{,}45 \le \ell \le 3{,}55$, donc $14{,}3175
      \le \mathcal{A} \le 15{,}0875$ m$^{2}$. Il faut commander **16 m$^{2}$**. Perte maximale : $16 -
      14{,}3175 = 1{,}6825$ m$^{2}$, soit environ $1{,}7$ m$^{2}$.'
  - numero: 48
    etoiles: 3
    enonce: a) L'arrondi au centième de $x$ vaut $3{,}47$. Encadre $x$ le plus finement possible, puis
      $2x - 1$, puis $x^{2}$ ; déduis-en l'arrondi à l'unité de $x^{2}$. b) Un réel $x$ vérifie $E\left(x\right)
      = 5$ et $E\left(2x\right) = 11$. Encadre $x$ le plus finement possible.
    correction: '*Idée :* un arrondi ne donne pas $x$, il donne l''intervalle des $x$ possibles ; deux
      parties entières donnent deux intervalles à intersecter. a) $3{,}465 \le x < 3{,}475$ ; donc $5{,}93
      \le 2x - 1 < 5{,}95$ ; et $12{,}006\,225 \le x^{2} < 12{,}075\,625$, tout entre $11{,}5$ et $12{,}5$
      : l''arrondi à l''unité de $x^{2}$ vaut **12**. b) $E\left(x\right) = 5$ donne $5 \le x < 6$, $E\left(2x\right)
      = 11$ donne $5{,}5 \le x < 6$ : l''intersection est $5{,}5 \le x < 6$.


      ---'
  fiche_revision:
  - '**Somme.** On additionne les bornes de même rang ; toujours valable.'
  - '**Différence.** On croise : $a - d \le x - y \le b - c$ ; toujours valable.'
  - '**Produit, quotient.** On multiplie ou divise les bornes **seulement si tout est positif**.'
  - '**Facteur négatif.** Passer à l''opposé, multiplier, revenir en inversant le sens.'
  - '**Carré.** Si l''encadrement contient 0, le minimum du carré vaut 0.'
  - '**Valeur absolue.** $|a + b| \le |a| + |b|$ ; $|x - c| \le r$ signifie $c - r \le x \le c + r$.'
  - '**Arrondi $\ne$ troncature.** L''arrondi regarde la décimale suivante.'
  - '**Partie entière.** $E\left(x\right) \le x < E\left(x\right) + 1$ ; pour un négatif, l''entier juste
    en dessous.'
  trouve_erreur:
  - faux: $3 < x < 5$, $1 < y < 2$ donc $2 < x - y < 3$
    correction: 'Encadrer $-y$ d''abord : $1 < x - y < 4$'
  - faux: $-2 < x < 3$ donc $4 < x^{2} < 9$
    correction: 'L''intervalle contient 0 : $0 \le x^{2} < 9$'
  - faux: $E\left(-3{,}2\right) = -3$
    correction: $E\left(-3{,}2\right) = -4$
  - faux: 'Arrondi de $3{,}148$ à $10^{-2}$ : $3{,}14$'
    correction: $3{,}15$ (la décimale suivante est 8)
