  domaine: Calcul litteral et algebre
  objet: Resoudre une inequation quotient en ramenant a un seul membre
  reponse_attendue: 'S = ]-∞ ; 2['
  solution: L'inequation est definie pour x≠2. On ecrit (x+1)/(x-2)-1≤0, soit 3/(x-2)≤0. Le numerateur
    3 est positif, donc le quotient est negatif si et seulement si x-2<0, soit x<2.
  si_echoue: 'Resolution d''une inequation quotient : tout ramener au meme membre au lieu de multiplier
    par le denominateur.'
