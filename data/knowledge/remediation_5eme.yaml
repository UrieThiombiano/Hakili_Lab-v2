  - numero: 8
    etoiles: 1
    enonce: 'Donne l''opposé de : $+15$ ; $-19{,}5$ ; $+48{,}2$ ; $-0{,}1$ ; $+8$.'
    correction: $-15$ ; $+19{,}5$ ; $-48{,}2$ ; $+0{,}1$ ; $-8$.
  - numero: 9
    etoiles: 1
    enonce: 'Compare avec $<$ ou $>$ : a) $+22$ … $+2$ ; b) $+70$ … $+38$ ; c) $-11$ … $-15$.'
    correction: a) $>$ ; b) $>$ ; c) $>$ (le plus proche de zéro est le plus grand).
  - numero: 10
    etoiles: 1
    enonce: 'Compare : a) $+5$ … $-3$ ; b) $-13$ … $-2$ ; c) $-14$ … $-8$.'
    correction: a) $>$ ; b) $<$ ; c) $<$.
  - numero: 11
    etoiles: 1
    enonce: 'Range par ordre croissant : $-8$ ; $+12$ ; $-25$ ; $0$ ; $+3$.'
