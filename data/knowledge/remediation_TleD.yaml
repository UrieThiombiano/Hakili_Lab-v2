- niveau: TleD
  module: 5
  module_titre: Encadrer, approcher, partie entière
  pourquoi: 'Encadrer, majorer, minorer : ce sont les gestes sur lesquels reposent les limites, le théorème
    des gendarmes et les suites bornées. Tu connais ces règles, c''est leur application aux facteurs négatifs
    et aux quotients qui dérape.'
  diagnostic:
  - question: On a $3{,}2 \le x \le 3{,}4$ et $1{,}5 \le y \le 1{,}7$ (positifs). Encadre $x + y$ et $x
      \times y$.
    reponse: $4{,}7 \le x + y \le 5{,}1$ ; $4{,}8 \le xy \le 5{,}78$
  - question: Donne l'arrondi et la troncature à $10^{-2}$ de $5{,}2718$.
    reponse: arrondi $5{,}27$ ; troncature $5{,}27$
  - question: On sait que $|a| \le 4$ et $|b| \le 3$. Majore $|a + b|$.
    reponse: $|a + b| \le 7$
  - question: Donne un ordre de grandeur de $297 \times 4{,}1$.
    reponse: $\approx 300 \times 4 = 1\,200$
  - question: Détermine $E\left(5{,}8\right)$ et $E\left(-2{,}3\right)$.
    reponse: $E\left(5{,}8\right) = 5$ ; $E\left(-2{,}3\right) = -3$
  lecons:
  - id: TleD_M05_L1
    numero: '5.1'
    titre: 'Encadrer : somme, différence, produit, quotient'
    retenir:
    - '**Somme :** $a + c \le x + y \le b + d$ (bornes de même rang), valable pour **tous** les réels.'
    - '**Différence :** $a - d \le x - y \le b - c$ (on croise), valable pour **tous** les réels.'
    - '**Produit :** $ac \le xy \le bd$, **seulement si $a > 0$ et $c > 0$**.'
    - '**Quotient :** $\frac{a}{d} \le \frac{x}{y} \le \frac{b}{c}$, même condition, on croise.'
    - '**Facteur négatif :** ne multiplie jamais directement. Passe à l''opposé (l''encadrement s''inverse),
      multiplie, puis reviens en $-1$ en **inversant** le sens.'
    methode:
      titre: Encadrer une expression étape par étape
      etapes:
      - '**Décompose** l''expression en opérations élémentaires et applique-les une par une à l''encadrement
        de départ.'
      - 'Ajouter un nombre, multiplier par un nombre **positif** : ordre **conservé**.'
      - 'Multiplier par un nombre **négatif**, ou passer à l''inverse $\frac{1}{x}$ ($x > 0$) : ordre
        **retourné**, les bornes échangent leur place.'
      - 'Carré : ordre conservé si tout est positif, retourné si tout est négatif ; si l''encadrement
        contient $0$, le minimum vaut $0$. **Contrôle** avec une valeur autorisée.'
    exemple_resolu: 'On sait que $-2 < x < -1$ et $2 < y < 3$. Encadre $xy$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $x < 0$ : on passe à $-x$, positif ; l''encadrement s''inverse. | $1 < -x < 2$ |

      | Les deux facteurs sont positifs : on multiplie membre à membre. | $2 < -xy < 6$ |

      | On multiplie par $-1$ : le sens s''inverse. | $-6 < xy < -2$ |

      | **Vérification :** $x = -1{,}5$, $y = 2{,}5$ donnent $xy = -3{,}75 \in \left]-6\,;\,-2\right[$.
      ✓ | |'
    erreurs_frequentes:
    - erreur: « $2 < x < 3$ donc $2 - 1 < x - x < 3 - 1$ ».
      correction: $x - x = 0$ ; la règle de la différence suppose deux quantités **indépendantes**.
    - erreur: « $-2 < x < 3$ donne $4 < x^{2} < 9$ ».
      correction: l'encadrement contient $0$, donc $0 \le x^{2} < 9$.
    - erreur: annoncer $S \approx 10{,}35$ quand $9{,}68 \le S \le 11{,}04$.
      correction: on ne garde que les décimales communes aux deux bornes ; ici, seul « $S \approx 10$
        » est sûr.
    declic: null
    figures: []
  - id: TleD_M05_L2
    numero: '5.2'
    titre: Valeur absolue, valeur approchée, arrondi
    retenir:
    - $|ab| = |a| \times |b|$ ; $\left|\frac{a}{b}\right| = \frac{|a|}{|b|}$ ($b \ne 0$) ; **$|a + b|
      \le |a| + |b|$** (inégalité triangulaire).
    - 'Pour $r > 0$ : $|x| \le r$ équivaut à $-r \le x \le r$ ; $|x - c| \le r$ équivaut à $c - r \le
      x \le c + r$ ($c$ **centre**, $r$ **rayon**).'
    - Une **valeur approchée** de $x$ à $10^{-n}$ près est un décimal $v$ tel que $|x - v| \le 10^{-n}$.
    - '**Troncature** d''ordre $n$ : on coupe après la $n$ᵉ décimale. **Arrondi** d''ordre $n$ : décimale
      suivante $\ge 5$, on monte ; sinon on descend.'
    - '**Ordre de grandeur :** valeur approchée grossière, pour **contrôler** un résultat.'
    methode:
      titre: Majorer une expression avec la valeur absolue
      etapes:
      - Découpe l'expression en somme ou en produit de morceaux dont tu connais une borne.
      - Applique $|a + b| \le |a| + |b|$ et $|ab| = |a||b|$.
      - 'Remplace chaque $|\cdot|$ par sa borne : le résultat est une majoration sûre.'
    exemple_resolu: '$|a| \le 3$ et $|b| \le 2$. Majore $|a + b|$ et $|2a - b|$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Inégalité triangulaire. | $|a + b| \le |a| + |b| \le 3 + 2 = 5$ |

      | Même outil, avec $|2a| = 2|a|$ et $|-b| = |b|$. | $|2a - b| \le 2|a| + |b| \le 6 + 2 = 8$ |

      | **Vérification :** $a = 3$, $b = -2$ donnent $|2a - b| = 8$ : la borne est atteinte. ✓ | |'
    erreurs_frequentes:
    - erreur: $\sqrt{a + b} = \sqrt{a} + \sqrt{b}$.
      correction: $\sqrt{9 + 16} = 5$ mais $3 + 4 = 7$.
    - erreur: arrondir $3{,}148$ à $10^{-2}$ en coupant, ce qui donne $3{,}14$.
      correction: l'arrondi est $3{,}15$ ; troncature $\ne$ arrondi.
    declic: null
    figures:
    - figures/m05_f8.svg
  - id: TleD_M05_L3
    numero: '5.3'
    titre: La partie entière
    retenir:
    - '$E\left(x\right)$ est le **plus grand entier inférieur ou égal à $x$** : $E\left(x\right) \le x
      < E\left(x\right) + 1$.'
    - '$x - E\left(x\right)$ est la **partie fractionnaire** : $0 \le x - E\left(x\right) < 1$, **jamais
      négative** (pour $x = -4{,}3$ elle vaut $0{,}7$).'
    - '$E\left(x\right)$ est le **seul** entier $n$ tel que $n \le x < n + 1$ : c''est ce qui permet de
      la démontrer par encadrement, sans valeur décimale ($2 \le \sqrt{7} < 3$ car $4 \le 7 < 9$, donc
      $E\left(\sqrt{7}\right) = 2$).'
    - 'Pour $k$ **entier** : $E\left(x + k\right) = E\left(x\right) + k$.'
    methode:
      titre: Déterminer $E\left(x\right)$
      etapes:
      - 'Place $x$ entre **deux entiers consécutifs** : $n \le x < n + 1$.'
      - $E\left(x\right) = n$, l'entier **de gauche**.
      - Pour un négatif non entier, prends l'entier **juste en dessous**.
    exemple_resolu: 'Un transporteur de Kaya met $437$ kg de mil en sacs de $50$ kg, puis charge des bidons
      de $18$ kg dans une charrette qui supporte $265$ kg.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Nombre de sacs pleins : partie entière du quotient. | $\frac{437}{50} = 8{,}74$, donc $8$ sacs
      |

      | Le reste existe quand même. | $437 - 8 \times 50 = 37$ kg |

      | Même geste, sans dépasser la charge utile. | $\frac{265}{18} \approx 14{,}72$, donc $14$ bidons
      |

      | **Vérification :** $14 \times 18 = 252 \le 265$, mais $15 \times 18 = 270 > 265$. ✓ | |'
    erreurs_frequentes:
    - erreur: $E\left(-3{,}2\right) = -3$ (on coupe la virgule).
      correction: $E\left(-3{,}2\right) = -4$ ; pour les négatifs, la partie entière descend d'un cran.
    - erreur: $E\left(x + y\right) = E\left(x\right) + E\left(y\right)$.
      correction: 'faux dès que les parties fractionnaires se cumulent ($x = y = 1{,}6$ : $1 + 1 = 2$
        contre $E\left(3{,}2\right) = 3$). Seule $E\left(x + k\right) = E\left(x\right) + k$, $k$ entier,
        est vraie.'
    declic: 'Encadrer, c''est déjà faire de l''Analyse — Les questions difficiles ne demandent pas de
      **calculer** un nombre, mais de le **contrôler** : montrer qu''une expression reste positive, qu''une
      erreur est inférieure à $10^{-3}$, qu''une suite ne dépasse jamais $3$. Tout se traite avec les
      gestes de ce module : encadrer, majorer, minorer, passer à l''opposé, passer à l''inverse.'
    figures:
    - figures/m05_f6.svg
