    correction: 'Remplacer $b$ par $-b$ : les termes de puissance **impaire** en $b$ changent de signe,
      les autres non. D''où $\left(a - b\right)^{3} = a^{3} - 3a^{2}b + 3ab^{2} - b^{3}$ : mêmes coefficients,
