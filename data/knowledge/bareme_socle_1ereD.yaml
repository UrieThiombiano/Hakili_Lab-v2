  reponse_attendue: Q(x) = -2(x+2)(x-3) ; positif sur ]-2 ; 3[, negatif ailleurs
  solution: Q(x)=-2x²+2x+12=-2(x²-x-6)=-2(x+2)(x-3). Le coefficient de x² est negatif, donc Q est negatif
