    correction: 'On ne moyenne pas les vitesses : les durées diffèrent.

      a) $7{,}5 + 7{,}5 = 15$ km.

      b) $15 \div 0{,}75 = 20$ km/h, et non $22{,}5$ : l''allure lente dure deux fois plus.'
  - numero: 40
    etoiles: 3
    enonce: Une citerne de $1\,200$ L est remplie à $30$ L/min, mais une fuite lui fait perdre $5$ L/min.
      a) Remplissage réel par minute ? b) En combien de temps est-elle pleine ?
    correction: 'Le débit effectif d''abord.

      a) $30 - 5 = 25$ L par minute.

      b) $t = 1\,200 \div 25 = 48$ min, contre $40$ min sans la fuite.'
  - numero: 41
    etoiles: 3
    enonce: 'Un car quitte Ouagadougou à $7$ h $40$ et arrive à Bobo-Dioulasso, à $360$ km, à $13$ h $10$
      ; il s''est arrêté $30$ min à Boromo. Copie de Rakieta :


      *Ligne 1 :* durée totale $= 13$ h $10 - 7$ h $40 = 6$ h $30$ min.

      *Ligne 2 :* durée de roulage $= 6$ h $30$ min $- 30$ min $= 6$ h.

      *Ligne 3 :* $v = 360 \div 6 = 60$ km/h.

      *Ligne 4 :* en mètres par seconde, $v = 60 \times 3{,}6 = 216$ m/s.


      Repère chaque ligne fausse, explique l''erreur, puis refais la résolution proprement.'
    correction: '*Ligne 1 fausse* : $13$ h $10 = 12$ h $70$, d''où $5$ h $30$ min.

      *Ligne 2* : geste juste, donnée fausse ; $5$ h $30$ min $- 30$ min $= 5$ h.

      *Ligne 3* : $v = 360 \div 5 = 72$ km/h.

      *Ligne 4 fausse* : on **divise** par $3{,}6$ ; $72 \div 3{,}6 = 20$ m/s.'
  - numero: 42
    etoiles: 3
    enonce: À Banzon, un riziculteur choisit entre deux motopompes pour remplir son bassin de $6\,000$
      litres. La première verse $250$ litres par minute. La seconde porte la mention $12$ m$^{3}$ par
      heure. Le champ mesure $1{,}5$ hectare et le canal a été creusé en 2021. Dis quelle pompe emporter
      et combien de temps durera un remplissage.
    correction: 'Comparaison possible seulement à la même unité ; surface et année ne servent à rien.

      Première pompe : $6\,000 \div 250 = 24$ min.

      Seconde : $12$ m$^{3}$/h $= 200$ L/min, d''où $30$ min.

      On emporte la **première**.'
  fiche_revision:
  - '**Coefficient.** Une grandeur divisée par l''autre, dans le même sens ; quotients égaux, tableau
    proportionnel.'
  - '**Quatrième proportionnelle.** $8 \to 600$ et $12 \to$ ? : $\left(12 \times 600\right) \div 8 = 900$.'
  - '**Pourcentage.** $p$ % de $A$ $= \frac{A \times p}{100}$ : une **part**, à soustraire ou à ajouter
    ensuite.'
  - '**Échelle.** $\frac{\text{plan}}{\text{réel}}$, même unité. Au $\frac{1}{n}$ : réel $=$ plan $\times
    n$. $1$ km $= 100\,000$ cm.'
  - '**Grandeurs quotients.** $\rho = \frac{m}{V}$, $v = \frac{d}{t}$, $Q = \frac{V}{t}$. Vitesse moyenne
    : distance **totale** sur durée **totale**. Eau : $1$ kg/L.'
  - '**Conversions.** $1$ h $= 3\,600$ s ; $1$ m/s $= 3{,}6$ km/h ; $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$
    ; $1$ m$^{3} = 1\,000$ L.'
  trouve_erreur:
  - faux: $8 \to 600$ FCFA, donc $12 \to \left(8 \times 600\right) \div 12 = 400$ FCFA
    correction: 'En diagonale : $\left(12 \times 600\right) \div 8 = 900$ FCFA.'
  - faux: 'Remise de $25$ % sur $2\,000$ FCFA : je paie $500$ FCFA'
    correction: $500$ FCFA est la remise ; on paie $1\,500$ FCFA.
  - faux: $5$ cm sur une carte au $\frac{1}{50\,000}$, je réponds $250\,000$
    correction: 'Unité et conversion : $250\,000$ cm $= 2{,}5$ km.'
  - faux: $150$ km en $2$ h $30$ min, donc $v = 150 \div 2{,}30$
    correction: $2$ h $30$ min $= 2{,}5$ h ; $v = 60$ km/h.
  cartographie_lacunes:
  - lacune: Produit en croix sans sens ; vitesse, débit et masse volumique confondus
    bloque_en: applications, statistique
  source_path: remediation\4eme\modules_c\M08.md
- niveau: 4eme
  module: 9
  module_titre: 'Angles et triangles : propriétés et constructions'
  pourquoi: 'En géométrie, l''erreur coûteuse est d''affirmer une égalité d''angles sans la condition
    qui la rend vraie. Un seul geste : nommer la propriété avant d''écrire la mesure.'
  diagnostic:
  - question: Deux droites se coupent en O ; un angle mesure $130^{\circ}$. Combien mesure son opposé
      par le sommet ?
    reponse: $130^{\circ}$ (opposés par le sommet)
  - question: Donne le complémentaire de $35^{\circ}$, puis le supplémentaire de $35^{\circ}$.
    reponse: $55^{\circ}$ ; $145^{\circ}$
  - question: Deux droites **parallèles** coupées par une sécante ; un angle alterne-interne mesure $65^{\circ}$.
      Et l'autre ?
    reponse: $65^{\circ}$
  - question: Dans un triangle, deux angles mesurent $90^{\circ}$ et $35^{\circ}$. Et le troisième ?
    reponse: $55^{\circ}$
  - question: Peut-on construire un triangle de côtés $2$ cm, $3$ cm et $6$ cm ?
    reponse: non, $2 + 3 = 5 < 6$
  lecons:
  - id: 4eme_M09_L1
    numero: '9.1'
    titre: Angles autour d'un point
    retenir:
    - '**Adjacents** : même sommet, un côté commun, de part et d''autre ; les mesures s''additionnent.'
    - '**Complémentaires** : somme $90^{\circ}$. **Supplémentaires** : somme $180^{\circ}$.'
    - '**Bissectrice** : la demi-droite issue du sommet qui partage l''angle en deux angles égaux.'
    - 'Deux droites sécantes : les angles qui se font face sont **opposés par le sommet** ; deux **voisins**
      forment un angle plat.'
    methode:
      titre: Donner les quatre angles d'un croisement
      etapes:
      - Marque l'angle connu.
      - 'L''angle qui lui fait face : même mesure.'
      - 'Chacun des deux voisins : $180^{\circ}$ moins la mesure connue.'
      - 'Contrôle : la somme des quatre vaut $360^{\circ}$.'
    exemple_resolu: 'Deux droites se coupent en O ; un angle mesure $52^{\circ}$. Donne les trois autres.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Opposé par le sommet. | $\widehat{2} = 52^{\circ}$ |

      | Voisin : angle plat. | $\widehat{3} = 180^{\circ} - 52^{\circ} = 128^{\circ}$ |

      | Opposé au précédent. | $\widehat{4} = 128^{\circ}$ |

      | **Vérification :** $52 + 128 + 52 + 128 = 360$ ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: 4eme_M09_L2
    numero: '9.2'
    titre: Deux droites et une sécante
    retenir:
    - 'Angles **entre** les deux droites : **internes** ; les autres : **externes**.'
    - '**Alternes-internes** : internes, de part et d''autre de la sécante, aux deux croisements. **Alternes-externes**
      : de même, mais externes. **Correspondants** : même position aux deux croisements.'
    - '**Réciproque, qui sert à démontrer :** deux alternes-internes, alternes-externes ou correspondants
      égaux $\Rightarrow$ droites **parallèles**.'
    - Deux angles **internes du même côté** de la sécante sont **supplémentaires** entre deux parallèles.
    methode:
      titre: Justifier une mesure d'angle
      etapes:
      - Repère les deux droites et la sécante ; le parallélisme est-il donné ?
      - 'Nomme la paire : opposés par le sommet, alternes-internes, alternes-externes, correspondants.'
      - 'Rédige : « On sait que… Or… Donc… ».'
      - 'Paire indirecte : passe par un angle intermédiaire.'
    exemple_resolu: 'Sur la figure 9.1, $\left(D\right) \,//\, \left(\Delta\right)$ et $a_{1} = 63^{\circ}$.
      Détermine $b_{3}$, puis $b_{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Je nomme la paire. | $a_{1}$ et $b_{3}$ : alternes-internes |

      | J''invoque le parallélisme. | $\left(D\right) \,//\, \left(\Delta\right)$, donc $b_{3} = a_{1}
      = 63^{\circ}$ |

      | $b_{2}$ est voisin de $b_{3}$. | $b_{2} = 180^{\circ} - 63^{\circ} = 117^{\circ}$ |

      | **Vérification :** $63 + 117 = 180$ ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures:
    - figures/m09_f3.svg
  - id: 4eme_M09_L3
    numero: '9.3'
    titre: 'Le triangle : angles et inégalité triangulaire'
    retenir:
    - 'Dans **tout** triangle : $$\widehat{A} + \widehat{B} + \widehat{C} = 180^{\circ}$$'
    - '**Isocèle** : angles à la base égaux. **Équilatéral** : trois angles de $60^{\circ}$. **Rectangle**
      : angles aigus complémentaires.'
    - '**Angle extérieur** en un sommet : supplémentaire de l''angle du triangle en ce sommet, et égal
      à la **somme des deux autres**.'
    - '**Inégalité triangulaire** : le triangle existe si et seulement si la plus grande longueur est
      **strictement inférieure** à la somme des deux autres (égalité : points alignés).'
    - Le plus grand côté fait face au plus grand angle.
    methode:
      titre: Décider si un triangle existe, puis le construire
      etapes:
      - 'Trois **angles** donnés : leur somme doit valoir exactement $180^{\circ}$.'
      - 'Trois **longueurs** : compare la plus grande à la somme des deux autres.'
      - 'Un côté et ses deux angles : trace le côté, reporte un angle à chaque extrémité.'
      - 'Trois côtés : trace le plus long, croise deux arcs des deux autres longueurs.'
    exemple_resolu: 'Dans le triangle ILE, $\widehat{I} = 35^{\circ}$ et $\widehat{L} = 85^{\circ}$. Détermine
      $\widehat{E}$ et la nature du triangle.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La propriété avant le calcul. | $\widehat{I} + \widehat{L} + \widehat{E} = 180^{\circ}$ |

      | Je retranche les deux connus. | $\widehat{E} = 180^{\circ} - 120^{\circ} = 60^{\circ}$ |

      | Je compare les trois mesures. | $35^{\circ}$, $85^{\circ}$, $60^{\circ}$ : toutes différentes
      |

      | **Conclusion :** quelconque, à angles aigus ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: 4eme_M09_L4
    numero: '9.4'
    titre: Médiatrices, hauteurs et médianes
    retenir:
    - '**Médiatrice** de $\left[BC\right]$ : perpendiculaire **passant par le milieu** ; un point y appartient
      si et seulement s''il est à égale distance de B et de C. Concours : centre du **cercle circonscrit**.'
    - '**Hauteur** issue de A : passe par A, **perpendiculaire** à $\left(BC\right)$. Concours : **orthocentre**.'
    - '**Médiane** issue de A : passe par A et par le **milieu** de $\left[BC\right]$. Concours : **centre
      de gravité**.'
    - Dans un équilatéral, et pour le côté opposé au sommet d'un isocèle, les trois droites sont confondues.
    methode:
      titre: Tracer les trois droites relatives à $\left[BC\right]$
      etapes:
      - '**Médiatrice** : deux arcs de même rayon centrés en B et en C ; la droite joignant leurs intersections.'
      - '**Médiane issue de A** : place le milieu M de $\left[BC\right]$, trace $\left(AM\right)$.'
      - '**Hauteur issue de A** : équerre sur $\left(BC\right)$, glisse jusqu''à A ; le pied peut tomber
        hors de $\left[BC\right]$.'
      - 'Code la figure : carré pour l''angle droit, doubles marques pour les milieux.'
    exemple_resolu: 'ABC est isocèle en A, $AB = AC = 5$ cm et $BC = 6$ cm. On trace la hauteur issue
      de A. Que dire de son pied H ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | L''égalité qui définit l''isocèle. | $AB = AC$ |

      | A est sur la médiatrice de $\left[BC\right]$. | $\left(AH\right)$ est cette médiatrice |

      | Elle passe par le milieu. | $HB = HC = 3$ cm |

      | **Vérification :** arcs de $3$ cm centrés en B et C ✓ | |


      > #### DÉCLIC : Hauteur ou médiatrice ?

      >

      > La hauteur **part d''un sommet** et ignore le milieu ; la médiatrice **passe par le milieu** et
      ignore le sommet. Toutes deux sont perpendiculaires au côté : c''est ce point commun qui brouille
      tout.'
    erreurs_frequentes: []
    declic: 'Hauteur ou médiatrice ? — La hauteur **part d''un sommet** et ignore le milieu ; la médiatrice
      **passe par le milieu** et ignore le sommet. Toutes deux sont perpendiculaires au côté : c''est
      ce point commun qui brouille tout. #### ⚠ ATTENTION ! - **Erreur :** croire l''orthocentre toujours
      intérieur. **Correction :** il est au sommet de l''angle droit dans un rectangle, à l''extérieur
      si un angle est obtus. - **Erreur :** tracer la hauteur issue de A « en visant le milieu de $\left[BC\right]$
      ». **Correction :** c''est la médiane ; la hauteur se trace à l''équerre.'
    figures:
    - figures/m09_f7.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Donne le complémentaire de : a) $15^{\circ}$ ; b) $40^{\circ}$ ; c) $65^{\circ}$ ; d) $72^{\circ}$.'
    correction: a) $75^{\circ}$ ; b) $50^{\circ}$ ; c) $25^{\circ}$ ; d) $18^{\circ}$.
  - numero: 2
    etoiles: 1
    enonce: 'Donne le supplémentaire de : a) $50^{\circ}$ ; b) $130^{\circ}$ ; c) $95^{\circ}$ ; d) $110^{\circ}$.'
    correction: a) $130^{\circ}$ ; b) $50^{\circ}$ ; c) $85^{\circ}$ ; d) $70^{\circ}$.
  - numero: 3
    etoiles: 1
    enonce: Vrai ou faux ? a) $35^{\circ}$ et $55^{\circ}$ sont complémentaires. b) $120^{\circ}$ et $50^{\circ}$
      sont supplémentaires. c) $89^{\circ}$ et $1^{\circ}$ sont complémentaires.
    correction: a) Vrai ($35 + 55 = 90$). b) Faux ($170$) ; c'est $60^{\circ}$. c) Vrai.
  - numero: 4
    etoiles: 1
    enonce: 'a) Deux angles adjacents $\widehat{AOC}$ et $\widehat{COB}$ mesurent $42^{\circ}$ et $38^{\circ}$
      : calcule $\widehat{AOB}$. b) $\widehat{AOB} = 80^{\circ}$ et $\left[OC\right)$ le partage avec
      $\widehat{AOC} = 35^{\circ}$ : calcule $\widehat{COB}$. c) $\widehat{AOB} = 86^{\circ}$ et $\left[OP\right)$
      est sa bissectrice : calcule $\widehat{AOP}$.'
    correction: a) $80^{\circ}$ (adjacents). b) $45^{\circ}$. c) $43^{\circ}$.
  - numero: 5
    etoiles: 1
    enonce: Deux droites se coupent en O ; un angle mesure $35^{\circ}$. Donne les trois autres, en nommant
      la propriété utilisée.
    correction: 'Opposé par le sommet : $35^{\circ}$ ; les deux voisins (supplémentaires) : $145^{\circ}$.'
  - numero: 6
    etoiles: 1
    enonce: Deux droites se coupent en O ; un angle est droit. a) Que valent les trois autres ? b) Comment
      appelle-t-on ces droites ?
    correction: a) Droits. b) **Perpendiculaires**.
  - numero: 7
    etoiles: 1
    enonce: Deux droites se coupent en O ; la somme de deux angles opposés par le sommet vaut $130^{\circ}$.
      Que vaut chacun des quatre angles ?
    correction: 'Opposés égaux : $130 \div 2 = 65^{\circ}$ chacun ; voisins : $115^{\circ}$.'
  - numero: 8
    etoiles: 1
    enonce: $\left(d_{1}\right) \,//\, \left(d_{2}\right)$ sont coupées par une sécante ; un angle mesure
      $47^{\circ}$. a) Donne son correspondant. b) Donne l'alterne-interne de ce correspondant. c) Donne
      le supplémentaire de $47^{\circ}$.
    correction: a) $47^{\circ}$ (correspondants, droites parallèles). b) $47^{\circ}$. c) $133^{\circ}$.
  - numero: 9
    etoiles: 1
    enonce: 'Sur la figure 9.1, $\left(D\right) \,//\, \left(\Delta\right)$ et $a_{1} = 70^{\circ}$. Détermine,
      en justifiant : a) $b_{1}$ ; b) $a_{3}$ ; c) $b_{2}$.'
    correction: a) $70^{\circ}$ (correspondants, $\left(D\right) \,//\, \left(\Delta\right)$). b) $70^{\circ}$
      (opposés par le sommet, sans le parallélisme). c) $110^{\circ}$ (voisin de $b_{1}$).
  - numero: 10
    etoiles: 1
    enonce: Deux droites sont coupées par une sécante ; deux angles alternes-internes mesurent $64^{\circ}$
      et $68^{\circ}$. Les droites sont-elles parallèles ? Justifie.
    correction: 'Non : parallèles $\Rightarrow$ alternes-internes égaux, or $64 \ne 68$.'
  - numero: 11
    etoiles: 1
    enonce: 'Deux droites coupées par une sécante forment deux correspondants de $63^{\circ}$. Rédige
      la conclusion : « On sait que… Or… Donc… ».'
    correction: « On sait que ces correspondants valent $63^{\circ}$. Or deux correspondants égaux entraînent
      le parallélisme. Donc les droites sont parallèles. »
  - numero: 12
    etoiles: 1
    enonce: Un triangle a deux angles de $46^{\circ}$. a) Calcule le troisième. b) Quelle est sa nature
      ? c) Peut-il être équilatéral ?
    correction: 'a) $88^{\circ}$. b) Isocèle. c) Non : l''équilatéral a trois angles de $60^{\circ}$.'
  - numero: 13
    etoiles: 1
    enonce: EFG est rectangle isocèle en E. Détermine ses trois angles.
    correction: $\widehat{E} = 90^{\circ}$ ; $\widehat{F} = \widehat{G} = 45^{\circ}$.
  - numero: 14
    etoiles: 1
    enonce: ABC est isocèle et $\widehat{A} = 40^{\circ}$. Donne les mesures possibles des deux autres
      angles.
    correction: 'Deux cas. Sommet : les bases valent $\left(180 - 40\right) \div 2 = 70^{\circ}$. Base
      : l''autre base $40^{\circ}$, sommet $100^{\circ}$.'
  - numero: 15
    etoiles: 1
    enonce: 'Peut-on construire un triangle de côtés : a) $4$ cm, $5$ cm, $6$ cm ? b) $2$ cm, $3$ cm,
      $6$ cm ? c) $5$ cm, $5$ cm, $9$ cm ? Justifie.'
    correction: 'a) $4 + 5 = 9 > 6$ : existe. b) $2 + 3 = 5 < 6$ : non. c) $5 + 5 = 10 > 9$ : existe,
      isocèle.'
  - numero: 16
    etoiles: 1
    enonce: ABC tel que $BC = 6$ cm, $\widehat{B} = 50^{\circ}$, $\widehat{C} = 70^{\circ}$. a) Calcule
      $\widehat{A}$. b) Construis le triangle. c) Quelle est sa nature ?
    correction: a) $60^{\circ}$. b) $\left[BC\right]$, puis $50^{\circ}$ en B et $70^{\circ}$ en C. c)
      Quelconque, à angles aigus.
  - numero: 17
    etoiles: 1
    enonce: Trace $\left[BC\right]$ de $7$ cm. a) Construis sa médiatrice au compas. b) Place M et N dessus,
      mesure MB, MC, NB, NC. c) Rédige la propriété vérifiée.
    correction: a) Deux arcs de même rayon en B et C ; la droite de leurs intersections. b) $MB = MC$,
      $NB = NC$. c) Tout point de la médiatrice est à égale distance des extrémités.
  - numero: 18
    etoiles: 1
    enonce: 'Construis ABC tel que $AB = 8$ cm, $BC = 7$ cm, $AC = 6$ cm. a) Trace la médiane, puis la
      hauteur issues de A. b) En une phrase, ce qui les distingue.


      ### Entraînement ★★'
    correction: a) Médiane $\left(AM\right)$, M milieu ; hauteur $\perp \left(BC\right)$ par A, pied $H
      \ne M$. b) La médiane vise le **milieu**, la hauteur est **perpendiculaire** ; confondues seulement
      si $AB = AC$.
  - numero: 19
    etoiles: 2
    enonce: Deux droites se coupent en O ; un angle mesure $x$ et son voisin $3x$. a) Calcule $x$. b)
      Donne les quatre angles.
    correction: 'a) Voisins : $x + 3x = 180^{\circ}$, $x = 45^{\circ}$. b) $45^{\circ}$, $135^{\circ}$,
      $45^{\circ}$, $135^{\circ}$.'
  - numero: 20
    etoiles: 2
    enonce: Sur la figure 9.1, $\left(D\right) \,//\, \left(\Delta\right)$ et $a_{1} = 118^{\circ}$. Détermine,
      en justifiant, les sept autres angles.
    correction: '$a_{3} = 118^{\circ}$ (opposés par le sommet) ; $a_{2} = a_{4} = 62^{\circ}$ (voisins).
      Par le parallélisme : $b_{1} = b_{3} = 118^{\circ}$, $b_{2} = b_{4} = 62^{\circ}$.'
  - numero: 21
    etoiles: 2
    enonce: 'Deux droites coupées par une sécante : entre elles et du même côté, deux angles mesurent
      $105^{\circ}$ et $75^{\circ}$. Montre qu''elles sont parallèles.'
    correction: 'Le voisin de $105^{\circ}$ vaut $75^{\circ}$, alterne-interne avec l''autre $75^{\circ}$
      : deux alternes-internes égaux, donc parallèles.'
  - numero: 22
    etoiles: 2
    enonce: 'Soit ILE un triangle. Détermine le troisième angle et la nature : a) $\widehat{I} = 35^{\circ}$,
      $\widehat{L} = 85^{\circ}$ ; b) $\widehat{I} = 48^{\circ}$, $\widehat{L} = 42^{\circ}$ ; c) $\widehat{I}
      = 80^{\circ}$, $\widehat{L} = 20^{\circ}$ ; d) $\widehat{I} = 60^{\circ}$, $\widehat{L} = 60^{\circ}$.'
    correction: 'a) $60^{\circ}$ : quelconque. b) $90^{\circ}$ : rectangle en E. c) $80^{\circ}$ : isocèle.
      d) $60^{\circ}$ : équilatéral.'
  - numero: 23
    etoiles: 2
    enonce: Dans ABC, l'angle extérieur en C mesure $130^{\circ}$. a) Que vaut $\widehat{ACB}$ ? b) Si
      $\widehat{A} = 45^{\circ}$, que vaut $\widehat{B}$ ? c) Compare $\widehat{A} + \widehat{B}$ avec
      l'angle extérieur en C.
    correction: 'a) $50^{\circ}$. b) $\widehat{B} = 85^{\circ}$. c) $45 + 85 = 130$ : exactement l''angle
      extérieur en C.'
  - numero: 24
    etoiles: 2
    enonce: 'Deux côtés d''un triangle mesurent $5$ cm et $9$ cm. Le troisième peut-il mesurer : a) $3$
      cm ? b) $6$ cm ? Justifie.'
    correction: 'a) Non : $5 + 3 = 8 < 9$. b) Oui : $5 + 6 = 11 > 9$.'
  - numero: 25
    etoiles: 2
    enonce: Construis un équilatéral ABC de côté $5$ cm. a) Trace les trois médianes. b) Puis les trois
      hauteurs. c) Que remarques-tu ?
    correction: a) et b) Constructions. c) Médianes, hauteurs et médiatrices confondues, un seul point
      de concours.
  - numero: 26
    etoiles: 2
    enonce: 'Vrai ou faux ? Justifie. a) Une médiane partage un côté en deux parts égales. b) Une hauteur
      passe toujours par le milieu d''un côté. c) Dans un équilatéral, une hauteur est aussi une médiane.


      ### Entraînement intensif : nommer la propriété avant d''écrire la mesure


      *Écris la justification avant le résultat, du type « On sait que… Or… Donc… ».*'
    correction: 'a) Vrai (définition). b) Faux : seulement si isocèle ou équilatéral. c) Vrai.'
  - numero: 27
    etoiles: 2
    enonce: Une sécante $\left(xy\right)$ coupe $\left(d_{1}\right)$ en A et $\left(d_{2}\right)$ en B
      ; D est sur $\left(d_{1}\right)$, E sur $\left(d_{2}\right)$, Y sur $\left(xy\right)$. $\widehat{BAD}
      = 82^{\circ}$ et $\widehat{EBY} = 98^{\circ}$. a) Calcule $\widehat{ABE}$. b) Déduis-en que $\left(d_{1}\right)
      \,//\, \left(d_{2}\right)$.
    correction: 'a) Voisins : $\widehat{ABE} = 180^{\circ} - 98^{\circ} = 82^{\circ}$. b) Alternes-internes
      égaux, donc $\left(d_{1}\right) \,//\, \left(d_{2}\right)$.'
  - numero: 28
    etoiles: 2
    enonce: Construis ABC tel que $\widehat{A} = 60^{\circ}$, $\widehat{B} = 40^{\circ}$, $AB = 5$ cm.
      D est tel que C appartienne à $\left[BD\right]$. Calcule $\widehat{ACD}$.
    correction: '$\widehat{C} = 80^{\circ}$, donc $\widehat{ACD} = 100^{\circ}$. Contrôle : $60 + 40 =
      100$.'
  - numero: 29
    etoiles: 2
    enonce: Cercle de centre O, rayon $3{,}5$ cm ; A et B sur le cercle avec $\widehat{AOB} = 60^{\circ}$.
      a) Pourquoi OAB est-il isocèle ? b) Calcule $\widehat{A}$ et $\widehat{B}$. c) Déduis-en qu'il est
      équilatéral.
    correction: 'a) $OA = OB$ (rayons). b) $\widehat{A} = \widehat{B} = \left(180 - 60\right) \div 2 =
      60^{\circ}$. c) Trois angles de $60^{\circ}$ : équilatéral, $AB = 3{,}5$ cm.'
  - numero: 30
    etoiles: 2
    enonce: 'ABC un triangle, E sur $\left[AB\right]$, F sur $\left[AC\right]$, avec $\left(EF\right)
      \,//\, \left(BC\right)$. Démontre que ABC et AEF ont leurs angles égaux deux à deux.


      ### ★★★ Défis de maîtrise'
    correction: 'Sécante $\left(AB\right)$ : $\widehat{AEF} = \widehat{ABC}$ (correspondants) ; sécante
      $\left(AC\right)$ : $\widehat{AFE} = \widehat{ACB}$ ; angle en A commun.'
  - numero: 31
    etoiles: 3
    enonce: À Bogandé, un géomètre vérifie si deux limites de champ sont parallèles. Avec une corde tendue
      en travers, il mesure $74^{\circ}$ d'un côté et $76^{\circ}$ pour l'alterne-interne. a) Que conclut-il
      ? b) De combien de degrés corriger une limite ?
    correction: 'L''égalité des alternes-internes caractérise le parallélisme : on part des angles pour
      conclure sur les droites. a) $74 \ne 76$ : limites **non** parallèles. b) Corriger de $2^{\circ}$.'
  - numero: 32
    etoiles: 3
    enonce: 'À Ouahigouya, un tailleur coupe une pièce triangulaire dont deux angles mesurent $28^{\circ}$
      et $112^{\circ}$. a) Calcule le troisième. b) Il la dit isocèle : a-t-il raison ? c) Quel est le
      plus grand angle, et que dire du côté qui lui fait face ?'
    correction: 'On calcule le seul angle accessible avant de juger la nature. a) $180 - 140 = 40^{\circ}$.
      b) Non : trois angles différents, triangle quelconque. c) Le plus grand, $112^{\circ}$ : le côté
      qui lui fait face est le plus long.'
  - numero: 33
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une propriété ou un contre-exemple. a) Deux angles opposés par
      le sommet sont supplémentaires. b) Deux angles alternes-internes sont toujours égaux. c) Un triangle
      peut avoir deux angles obtus. d) On peut construire un triangle de côtés $5$ cm, $5$ cm et $11$
      cm.
    correction: 'a) Faux : ils sont **égaux**. b) Faux : l''égalité exige le parallélisme (contre-exemple
      $64^{\circ}$ et $68^{\circ}$). c) Faux : deux obtus dépassent déjà $180^{\circ}$. d) Faux : $5 +
      5 = 10 < 11$.'
  - numero: 34
    etoiles: 3
    enonce: ABC quelconque ; $\left(D\right)$ passe par A et est parallèle à $\left(BC\right)$. Démontre,
      par les alternes-internes, que $\widehat{A} + \widehat{B} + \widehat{C} = 180^{\circ}$.
    correction: 'L''idée : rassembler les trois angles en A pour former un angle plat. Sécante $\left(AB\right)$
      : l''angle en A d''un côté est alterne-interne avec $\widehat{B}$ ; sécante $\left(AC\right)$ :
      l''autre avec $\widehat{C}$. Ces deux angles et $\widehat{A}$ reconstituent $\left(D\right)$ : somme
      $180^{\circ}$.'
  - numero: 35
    etoiles: 3
    enonce: 'Boukary devait calculer les angles de ABC isocèle en A avec $\widehat{B} = 50^{\circ}$, puis
      l''extérieur en C. Sa copie :


      > Ligne 1 : isocèle en A, donc $\widehat{B} = \widehat{C} = 50^{\circ}$.

      > Ligne 2 : donc $\widehat{A} = \left(180^{\circ} - 50^{\circ}\right) \div 2 = 65^{\circ}$.

      > Ligne 3 : l''angle extérieur en C vaut $180^{\circ} - 65^{\circ} = 115^{\circ}$.

      > Ligne 4 : les trois angles sont $65^{\circ}$, $50^{\circ}$ et $50^{\circ}$.


      a) Quelle est la première ligne fausse ? b) Explique l''erreur en une phrase. c) Refais proprement
      les quatre lignes.'
    correction: On contrôle chaque ligne sans se laisser entraîner par la suivante. a) La **ligne 2**.
      b) $\left(180^{\circ} - \text{angle}\right) \div 2$ donne les angles **à la base** à partir du sommet
      ; ici les bases sont connues, il fallait retrancher. c) $\widehat{B} = \widehat{C} = 50^{\circ}$
      ; $\widehat{A} = 80^{\circ}$ ; extérieur en C $= 130^{\circ}$ ; angles $80^{\circ}$, $50^{\circ}$,
      $50^{\circ}$.
  - numero: 36
    etoiles: 3
    enonce: ABC est un triangle avec $\widehat{A} = 70^{\circ}$. Les bissectrices de $\widehat{B}$ et
      de $\widehat{C}$ se coupent en I. a) Calcule $\widehat{B} + \widehat{C}$. b) Calcule $\widehat{IBC}
      + \widehat{ICB}$. c) Déduis-en $\widehat{BIC}$.
    correction: 'Les bissectrices ne prennent que la moitié de $\widehat{B}$ et $\widehat{C}$ : leur somme
      suffit. a) $110^{\circ}$. b) $55^{\circ}$. c) Dans IBC : $\widehat{BIC} = 125^{\circ}$.'
  - numero: 37
    etoiles: 3
    enonce: Les côtés d'un triangle sont des entiers de centimètres ; deux valent $7$ cm et $4$ cm. a)
      Toutes les valeurs possibles du troisième ? b) Combien y en a-t-il ? c) Le plus grand périmètre
      possible, et la nature du triangle dans ce cas ?
    correction: 'On traduit l''existence en un encadrement, puis on compte les entiers : $3 < c < 11$.
      a) $c \in \{4 ; 5 ; 6 ; 7 ; 8 ; 9 ; 10\}$. b) Sept valeurs. c) $c = 10$ : $P = 21$ cm, quelconque.'
  fiche_revision:
  - '**Autour d''un point.** Complémentaires : $90^{\circ}$. Supplémentaires : $180^{\circ}$. Bissectrice
    : deux parts égales.'
  - '**Croisement.** Opposés par le sommet : **toujours** égaux. Voisins : supplémentaires. Les quatre
    : $360^{\circ}$.'
  - '**Sécante.** Alternes-internes, alternes-externes, correspondants égaux **si et seulement si** les
    droites sont parallèles ; internes du même côté : supplémentaires. La réciproque **prouve** le parallélisme.'
  - '**Triangle.** Somme : $180^{\circ}$. Équilatéral : trois fois $60^{\circ}$. Rectangle : aigus complémentaires.
    Isocèle : bases égales ; position non précisée, deux cas.'
  - '**Angle extérieur.** $180^{\circ}$ moins l''angle en ce sommet, ou somme des deux autres.'
  - '**Inégalité triangulaire.** Plus grand côté **strictement** inférieur à la somme des deux autres.'
  - '**Trois droites.** Médiatrice : perpendiculaire par le **milieu**, cercle circonscrit. Hauteur :
    d''un **sommet**, perpendiculaire au côté opposé, orthocentre. Médiane : **sommet** au **milieu**
    opposé, centre de gravité.'
  - '**Réflexe.** Nomme la propriété avant d''écrire la mesure.'
  trouve_erreur:
  - faux: Ces angles sont opposés par le sommet, donc leur somme vaut $180^{\circ}$
    correction: Opposés par le sommet signifie **égaux** ; ce sont les **voisins** qui sont supplémentaires.
  - faux: Les angles alternes-internes sont toujours égaux
    correction: Seulement si les droites sont **parallèles**.
  - faux: Les deux angles internes du même côté valent tous deux $72^{\circ}$
    correction: 'Ils sont **supplémentaires** : le second vaut $108^{\circ}$.'
  - faux: La hauteur issue de A passe par le milieu de $\left[BC\right]$
    correction: C'est la **médiane** ; le pied ne tombe au milieu que si ABC est isocèle en A.
  cartographie_lacunes:
  - lacune: Propriétés des angles et des triangles non mobilisables
    bloque_en: droites du plan, polygones, projection
  source_path: remediation\4eme\modules_c\M09.md
- niveau: 4eme
  module: 10
  module_titre: Symétrie orthogonale, symétrie centrale et figures
  pourquoi: 'Deux symétries voisines, une confusion permanente : on reporte une longueur sans avoir tracé
    la perpendiculaire, on place l''image du mauvais côté du centre.'
  diagnostic:
  - question: $A'$ est le symétrique de A par rapport à (D). Que représente (D) pour $\left[AA'\right]$
      ?
    reponse: sa médiatrice
  - question: $B'$ est le symétrique de B par rapport à O et $OB = 3{,}5$ cm. Combien mesure $BB'$ ?
    reponse: $7$ cm
  - question: Combien d'axes de symétrie possède un rectangle non carré ?
    reponse: $2$ axes, les médiatrices des côtés
  - question: Par la symétrie de centre O, une droite (d) ne passant pas par O a pour image $\left(d'\right)$.
      Position relative de (d) et $\left(d'\right)$ ?
    reponse: parallèle à (d)
  - question: Les diagonales de ABCD se coupent en leur milieu. Nature de ABCD ?
    reponse: un parallélogramme
  lecons:
  - id: 4eme_M10_L1
    numero: '10.1'
    titre: 'Symétrie orthogonale : construire une image'
    retenir:
    - 'A et $A''$ sont symétriques par rapport à (D) lorsque (D) est la **médiatrice** de $\left[AA''\right]$
      : perpendiculaire à $\left[AA''\right]$ **et** passant par son milieu H. Donc $AA'' = 2 \times HA$.'
    - Si A appartient à (D), alors $A' = A$.
    - 'Image : segment $\to$ segment de même longueur, droite $\to$ droite, cercle $\to$ cercle de même
      rayon (seul le centre se construit).'
    methode:
      titre: Construire le symétrique d'un point par rapport à une droite
      etapes:
      - À l'équerre, trace la perpendiculaire à (D) par A ; elle coupe (D) en H.
      - 'Reporte HA depuis H, **de l''autre côté** de (D) : tu obtiens $A''$.'
      - 'Contrôle : H est le milieu de $\left[AA''\right]$.'
      - 'Figure : symétrique de chaque point clé, puis on relie **dans le même ordre**.'
    exemple_resolu: 'A est à $3$ cm de (d). Construis $A''$ et donne $AA''$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Perpendiculaire à (d) issue de A. | Elle coupe (d) en H, $HA = 3$ cm. |

      | Report de l''autre côté. | $HA'' = 3$ cm. |

      | Somme des deux moitiés. | $AA'' = 3 + 3 = 6$ cm. |

      | **Vérification :** le pliage selon (d) amène A sur $A''$. ✓ | |


      > #### DÉCLIC : Si la perpendiculaire te résiste, ce n''est pas la symétrie qui bloque

      >

      > Perpendiculaire mal posée, médiatrice approximative : l''erreur vient d''avant. Si tracer une
      perpendiculaire te fait hésiter, reprends le module 9.'
    erreurs_frequentes:
    - erreur: reporter le point « tout droit en face ».
      correction: $A'$ est sur la perpendiculaire à (D) issue de A.
    - erreur: reporter $AA'$ depuis l'axe.
      correction: on reporte HA ; $AA'$ en est le double.
    declic: 'Si la perpendiculaire te résiste, ce n''est pas la symétrie qui bloque — Perpendiculaire
      mal posée, médiatrice approximative : l''erreur vient d''avant. Si tracer une perpendiculaire te
      fait hésiter, reprends le module 9. #### ⚠ ATTENTION ! - **Erreur fréquente :** reporter le point
      « tout droit en face ». **Correction :** $A''$ est sur la perpendiculaire à (D) issue de A. - **Erreur
      fréquente :** reporter $AA''$ depuis l''axe. **Correction :** on reporte HA ; $AA''$ en est le double.'
    figures:
    - figures/m10_f1.svg
  - id: 4eme_M10_L2
    numero: '10.2'
    titre: 'Symétrie centrale : construire une image'
    retenir:
    - 'A et $A''$ sont symétriques par rapport à O lorsque O est le **milieu** de $\left[AA''\right]$
      : A, O, $A''$ alignés, O **entre** les deux, $OA = OA''$. Donc $AA'' = 2 \times OA$.'
    - Seul O ne bouge pas.
    - 'Image d''une droite ne passant pas par O : une **parallèle** ; d''une droite passant par O : elle-même
      ; d''un cercle : un cercle de même rayon.'
    methode:
      titre: Construire le symétrique d'un point par rapport à un point O
      etapes:
      - Trace (AO) et prolonge au-delà de O.
      - Prends au compas l'écartement OA.
      - Pique **en O** et reporte de l'autre côté.
      - 'Contrôle : O est le milieu de $\left[AA''\right]$.'
    exemple_resolu: '$OA = 4$ cm. Construis $A''$, symétrique de A par rapport à O, puis donne $AA''$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On prolonge (AO) au-delà de O. | $A''$ est sur (AO). |

      | O est le milieu. | $OA'' = OA = 4$ cm. |

      | Somme des deux moitiés. | $AA'' = 2 \times 4 = 8$ cm. |

      | **Vérification :** l''écartement OA reporté depuis O retombe sur $A''$. ✓ | |'
    erreurs_frequentes:
    - erreur: piquer le compas en A et reporter vers O.
      correction: on retombe sur O ; le compas se pique **en O**.
    - erreur: changer de centre d'un sommet à l'autre.
      correction: O est le **même** pour tous les points.
    declic: null
    figures: []
  - id: 4eme_M10_L3
    numero: '10.3'
    titre: Ce que les deux symétries conservent
    retenir:
    - les **longueurs** ($A'B' = AB$) et les **mesures d'angles** ;
    - l'**alignement**, l'ordre des points, les **milieux**, le **parallélisme** ;
    - les **périmètres**, les **aires**, la **nature** de la figure.
    - l'orthogonale **retourne** la figure (miroir), la centrale lui fait faire un **demi-tour** ;
    - par une symétrie centrale, une droite et son image sont parallèles. Faux pour l'orthogonale.
    methode:
      titre: Justifier une longueur ou un angle sans rien mesurer
      etapes:
      - Nomme la symétrie et son axe ou son centre.
      - Écris que l'objet cherché est l'image de l'objet connu.
      - 'Cite la propriété : « la symétrie conserve les longueurs ».'
      - Conclus avec l'unité ou les degrés.
    exemple_resolu: '$A''B''C''$ est l''image de ABC par la symétrie de centre O : $AB = 5$ cm, $BC =
      6{,}5$ cm, $CA = 4$ cm, $\widehat{ABC} = 72^{\circ}$. Périmètre de $A''B''C''$ et $\widehat{A''B''C''}$
      ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Conservation des longueurs. | $A''B'' = 5$ ; $B''C'' = 6{,}5$ ; $C''A'' = 4$ cm. |

      | Somme des trois côtés. | Périmètre $= 15{,}5$ cm. |

      | Conservation des angles. | $\widehat{A''B''C''} = 72^{\circ}$. |

      | **Vérification :** seule la position a changé. ✓ | |'
    erreurs_frequentes:
    - erreur: croire qu'une symétrie change un angle aigu en obtus « puisqu'elle retourne la figure ».
      correction: la mesure est conservée.
    - erreur: appliquer « image d'une droite = parallèle » à la symétrie orthogonale.
      correction: c'est une propriété de la symétrie **centrale**.
    declic: null
    figures: []
  - id: 4eme_M10_L4
    numero: '10.4'
    titre: Axes, centre de symétrie et parallélogramme
    retenir:
    - '|---|---|---|'
    methode:
      titre: Montrer qu'un quadrilatère est un parallélogramme
      etapes:
      - Repère les diagonales (elles joignent les sommets opposés).
      - Montre qu'un **même** point O est le milieu des deux.
      - 'Cite la propriété caractéristique et conclus : O est le centre de symétrie.'
    exemple_resolu: 'O est le milieu commun de $\left[EG\right]$ et de $\left[FH\right]$. Nature de EFGH
      ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Identifier les diagonales. | $\left[EG\right]$ et $\left[FH\right]$ joignent les sommets opposés.
      |

      | Traduire l''hypothèse. | Elles se coupent en leur milieu O. |

      | Citer la propriété. | Un tel quadrilatère est un parallélogramme. |

      | **Conclusion :** EFGH est un parallélogramme de centre O. ✓ | |'
    erreurs_frequentes:
    - erreur: « le rectangle a $4$ axes comme le carré ».
      correction: il en a $2$ ; le pliage selon une diagonale ne superpose rien.
    - erreur: « diagonales se coupant en leur milieu, donc rectangle ».
      correction: 'cela donne un parallélogramme. Rectangle : diagonales de même longueur en plus ; losange
        : perpendiculaires.'
    declic: null
    figures:
    - figures/m10_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Recopie et complète : A et $A''$ sont symétriques par rapport à (D) lorsque (D) est la …
      de $\left[AA''\right]$.'
    correction: La **médiatrice**.
  - numero: 2
    etoiles: 1
    enonce: B est sur (d). Où se trouve $B'$, symétrique de B par rapport à (d) ? Justifie.
    correction: '$B'' = B$ : un point de l''axe est son propre symétrique.'
  - numero: 3
    etoiles: 1
    enonce: M est à $4$ cm d'une droite (d). Construis $M'$, symétrique de M par rapport à (d).
    correction: Perpendiculaire à (d) par M, coupant (d) en H ; report de $4$ cm de l'autre côté. $MM'
      = 8$ cm.
  - numero: 4
    etoiles: 1
    enonce: (d) est verticale et P est à $5$ cm à sa gauche. Construis $P'$. À quelle distance de (d)
      est-il ? Combien vaut $PP'$ ?
    correction: $P'$ est à $5$ cm de (d), à droite ; $PP' = 10$ cm.
  - numero: 5
    etoiles: 1
    enonce: A et B sont symétriques par rapport à (d) et $AB = 9$ cm. a) À quelle distance de (d) se trouve
      A ? b) Et B ?
    correction: '(d) coupe [AB] en son milieu : a) $4{,}5$ cm ; b) $4{,}5$ cm.'
  - numero: 6
    etoiles: 1
    enonce: A est hors d'une droite (d) oblique. Construis $A'$ **au compas**, en utilisant que (d) est
      la médiatrice de $\left[AA'\right]$.
    correction: 'Arc centré en A coupant (d) en M et N ; même écartement piqué en M puis N : les arcs
      se recoupent en $A''$.'
  - numero: 7
    etoiles: 1
    enonce: (d) ne coupe pas [AB]. Construis $\left[A'B'\right]$, symétrique de [AB] par rapport à (d).
    correction: On construit $A'$ puis $B'$, on relie. $A'B' = AB$.
  - numero: 8
    etoiles: 1
    enonce: (D) ne coupe pas le triangle IJK. Construis son symétrique $I'J'K'$.
    correction: On construit $I'$, $J'$, $K'$, puis on relie dans le même ordre.
  - numero: 9
    etoiles: 1
    enonce: $A'$ est le symétrique de A par rapport à O et $AA' = 12$ cm. Combien mesure OA ?
    correction: $OA = 12 \div 2 = 6$ cm.
  - numero: 10
    etoiles: 1
    enonce: Place O et A tels que $OA = 3{,}5$ cm. Construis $A'$, symétrique de A par rapport à O, puis
      donne $AA'$.
    correction: $OA' = 3{,}5$ cm au-delà de O ; $AA' = 7$ cm.
  - numero: 11
    etoiles: 1
    enonce: Sur une droite graduée, A a pour abscisse $2$ et O pour abscisse $5$. Abscisse du symétrique
      de A par rapport à O ?
    correction: $5 - 2 = 3$, donc abscisse $8$.
  - numero: 12
    etoiles: 1
    enonce: Marque deux points A et B, puis construis C tel que B soit le symétrique de C par rapport
      à A.
    correction: 'A est le milieu de [CB] : on prolonge (BA) au-delà de A et on reporte $AC = AB$.'
  - numero: 13
    etoiles: 1
    enonce: Marque deux points D et E, puis construis I tel que D soit le symétrique de E par rapport
      à I.
    correction: I est le milieu de $\left[ED\right]$.
  - numero: 14
    etoiles: 1
    enonce: $\left[M'N'\right]$ est le symétrique de [MN] par rapport à O, avec $MN = 6$ cm et $OM = 2{,}5$
      cm. Donne, sans construire, $OM'$, $M'N'$ et $MM'$.
    correction: $OM' = 2{,}5$ cm ; $M'N' = 6$ cm ; $MM' = 5$ cm.
  - numero: 15
    etoiles: 1
    enonce: A est sur le cercle de centre O, de rayon $3$ cm. Construis $A'$, symétrique de A par rapport
      à O. Est-il sur le cercle ? Explique.
    correction: 'Oui : $OA'' = OA = 3$ cm. $\left[AA''\right]$ est un diamètre de $6$ cm.'
  - numero: 16
    etoiles: 1
    enonce: $\left[U'V'\right]$ est le symétrique de [UV] par rapport à O et $U'V' = 8{,}5$ cm. Que vaut
      UV ? Quelle propriété permet de répondre sans construire ?
    correction: $UV = 8{,}5$ cm, par conservation des longueurs.
  - numero: 17
    etoiles: 1
    enonce: $A'B'C'$ est le symétrique de ABC par rapport à O, avec $AB = 5$ cm, $BC = 7$ cm, $CA = 4$
      cm. Calcule le périmètre de $A'B'C'$ et cite la propriété utilisée.
    correction: $5 + 7 + 4 = 16$ cm, par conservation des longueurs.
  - numero: 18
    etoiles: 1
    enonce: Les angles de DEF mesurent $70^{\circ}$, $60^{\circ}$ et $50^{\circ}$. $D'E'F'$ est son symétrique
      par rapport à O. Donne les angles de $D'E'F'$ et vérifie que leur somme vaut $180^{\circ}$.
    correction: $70^{\circ}$, $60^{\circ}$, $50^{\circ}$ (conservation des angles) ; somme $180^{\circ}$.
      ✓
  - numero: 19
    etoiles: 1
    enonce: 'Donne le nombre d''axes de symétrie : a) du carré ; b) du rectangle non carré ; c) du losange
      non carré ; d) du parallélogramme quelconque.


      ### Entraînement ★★'
    correction: a) $4$ ; b) $2$ (médiatrices des côtés) ; c) $2$ (les diagonales) ; d) aucun, mais un
      centre.
  - numero: 20
    etoiles: 2
    enonce: A et $A'$ sont symétriques par rapport à une droite effacée. Comment retrouver cet axe, et
      avec quel instrument ?
    correction: 'L''axe est la médiatrice de $\left[AA''\right]$ : au compas, deux arcs de même écartement
      centrés en A et $A''$, puis on joint leurs intersections.'
  - numero: 21
    etoiles: 2
    enonce: '[EF] mesure $5$ cm et coupe (D) en K, avec $EK = 2$ cm. Construis $\left[E''F''\right]$.
      a) Sa longueur ? b) Où est le symétrique de K ? Explique.'
    correction: a) $E'F' = 5$ cm. b) $K' = K$, car K est sur (D) ; $\left[E'F'\right]$ passe par K, avec
      $KE' = 2$ cm.
  - numero: 22
    etoiles: 2
    enonce: 'Construis RST : $RS = 4$ cm, $ST = 3$ cm, $RT = 5$ cm. O est le milieu de [RS] ; construis
      le symétrique de RST par rapport à O.'
    correction: $R \to S$, $S \to R$, $T \to T'$ avec O milieu de $\left[TT'\right]$. Le triangle image
      est $S\,R\,T'$.
  - numero: 23
    etoiles: 2
    enonce: $RS = 9$ cm. T est le symétrique de R par rapport à S, U celui de S par rapport à R. Fais
      la figure et calcule TU.
    correction: '$ST = RU = 9$ cm. Ordre U, R, S, T : $TU = 27$ cm.'
  - numero: 24
    etoiles: 2
    enonce: ABCD a pour périmètre $24$ cm et pour aire $32$ cm$^{2}$. $A'B'C'D'$ est son symétrique par
      rapport à (D), qui ne le coupe pas. a) Son périmètre ? b) Son aire ? c) L'aire des deux réunis ?
    correction: a) $24$ cm ; b) $32$ cm$^{2}$ ; c) $64$ cm$^{2}$ (pas de recouvrement).
  - numero: 25
    etoiles: 2
    enonce: Parmi les majuscules d'imprimerie E, I, S, Z, T, lesquelles ont un centre de symétrie ?
    correction: I, S et Z. E et T ont un axe, pas de centre.
  - numero: 26
    etoiles: 2
    enonce: Trace un rectangle et tous ses axes de symétrie. Ses diagonales en font-elles partie ? Justifie
      par le pliage.
    correction: '$2$ axes : les médiatrices des côtés. Le pliage selon une diagonale donne deux triangles
      non superposables.'
  - numero: 27
    etoiles: 2
    enonce: Dans EFGH, les diagonales [EG] et [FH] se coupent en O, avec $OE = OG = 3$ cm et $OF = OH
      = 4$ cm. Nature de EFGH ? Est-ce un rectangle ? Justifie.
    correction: 'O est le milieu des deux diagonales : parallélogramme de centre O. Pas un rectangle,
      car $EG = 6$ cm et $FH = 8$ cm.'
  - numero: 28
    etoiles: 2
    enonce: 'Construis un parallélogramme ABCD : $AB = 5$ cm, $AD = 3$ cm, $\widehat{A} = 60^{\circ}$.
      O est l''intersection des diagonales. Sans mesurer, donne CD, CB et $\widehat{C}$, en justifiant
      par la symétrie de centre O.


      #### Entraînement intensif : nommer la symétrie, puis la propriété qui conclut'
    correction: 'C est l''image de A, D celle de B par la symétrie de centre O : $CD = AB = 5$ cm, $CB
      = AD = 3$ cm, $\widehat{C} = \widehat{A} = 60^{\circ}$.'
  - numero: 29
    etoiles: 2
    enonce: Une menuisière de Ouahigouya perce deux trous A et B symétriques par rapport au centre O d'une
      planche, avec $AB = 36$ cm. À quelle distance de O est chaque trou ?
    correction: 'Symétrie de centre O : O est le milieu de [AB]. Chaque trou est à $18$ cm du centre.'
  - numero: 30
    etoiles: 2
    enonce: $\left(d_{1}\right)$ et $\left(d_{2}\right)$ se coupent en A en formant $35^{\circ}$. On construit
      leurs symétriques par rapport à O. Où les images se coupent-elles ? Quel angle forment-elles ?
    correction: 'Symétrie de centre O : les images se coupent en $A''$. Conservation des angles : $35^{\circ}$.'
  - numero: 31
    etoiles: 2
    enonce: Sur (d), A, B, C sont dans cet ordre avec $AB = 3$ cm et $BC = 5$ cm. On construit $A'$, $B'$,
      $C'$ par rapport à O extérieur à (d). Donne $A'B'$, $B'C'$, $A'C'$, puis dis quelle image est entre
      les deux autres.
    correction: 'Conservation des longueurs et de l''alignement : $A''B'' = 3$ cm, $B''C'' = 5$ cm, $A''C''
      = 8$ cm, $B''$ entre $A''$ et $C''$.'
  - numero: 32
    etoiles: 2
    enonce: 'Construis un rectangle MATH de $6$ cm sur $4$ cm. Ses diagonales se coupent en I. a) Quel
      est le symétrique de M par rapport à I ? b) Que représente I pour MATH ? c) Construis le symétrique
      $M''A''T''H''$ de MATH par rapport au point H.


      ### ★★★ Défis de maîtrise'
    correction: 'a) T (I milieu de [MT]). b) le centre de symétrie de MATH. c) $H'' = H$ ; on prolonge
      (MH), (AH), (TH) au-delà de H et on relie : rectangle $6$ cm sur $4$ cm.'
  - numero: 33
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une propriété ou un contre-exemple. a) Le symétrique d'une droite
      (d) par rapport à un point O est une droite parallèle à (d). b) Si trois points ne sont pas alignés,
      leurs symétriques par rapport à un point ne le sont pas non plus. c) Une symétrie centrale peut
      transformer un segment de $6$ cm en un segment de $3$ cm. d) Par une symétrie orthogonale d'axe
      (D), l'image d'une droite (d) est toujours parallèle à (d).
    correction: 'On trie selon la symétrie en jeu : trois affirmations sur quatre portent sur cette distinction.

      a) **Vrai** si (d) ne passe pas par O. b) **Vrai** : la symétrie conserve l''alignement, donc des
      images alignées viendraient de points alignés. c) **Faux** : les longueurs sont conservées. d) **Faux**
      : si (d) coupe (D) en K, l''image passe encore par K.'
  - numero: 34
    etoiles: 3
    enonce: Trouve l'erreur. Pour le symétrique du rectangle ABCD par rapport à O, Awa construit correctement
      $A'$, $B'$, $C'$, $D'$, puis les relie dans l'ordre $A'$, $C'$, $B'$, $D'$. Sa figure n'est pas
      un rectangle. Pourquoi, et que fallait-il faire ?
    correction: 'Les quatre images sont bonnes ; c''est l''ordre du tracé qui est faux.

      A et C sont des sommets **opposés** : en reliant $A''$ à $C''$, Awa trace une diagonale au lieu
      d''un côté, d''où un quadrilatère croisé. Il fallait relier $A''B''$, $B''C''$, $C''D''$, $D''A''$.'
  - numero: 35
    etoiles: 3
    enonce: ABC est un triangle quelconque, I le milieu de [BC] et $A'$ le symétrique de A par rapport
      à I. Quelle est la nature du quadrilatère $ABA'C$ ? Rédige sous la forme « On sait que… Or… Donc…
      ».
    correction: 'On sait que I est le milieu de [BC] et de $\left[AA''\right]$. Or ces segments joignent
      les sommets opposés de $ABA''C$ : ce sont ses diagonales, et elles se coupent en leur milieu. Donc
      $ABA''C$ est un parallélogramme de centre I.'
  - numero: 36
    etoiles: 3
    enonce: $AB = 7$ cm. a) Combien de points O tels que le symétrique de A par rapport à O soit B ? b)
      Combien de droites (D) telles que le symétrique de A par rapport à (D) soit B ? Justifie et construis
      l'objet trouvé.
    correction: 'a) O est le milieu de [AB] : **un seul** point, à $3{,}5$ cm de A et de B. b) (D) est
      la médiatrice de [AB] : **une seule** droite, construite au compas et passant par O.'
  - numero: 37
    etoiles: 3
    enonce: Sur le plan d'un verger de Dédougou, $1$ cm représente $5$ m. Le puits est en O, un manguier
      en M à $4$ cm de O. On en plante un second au symétrique de M par rapport au puits. Construis-le,
      puis calcule la distance réelle entre les deux manguiers.
    correction: 'Le plan d''abord, la conversion ensuite.

      Sur le plan, $OM'' = 4$ cm, donc $MM'' = 8$ cm. Avec l''échelle, $8 \times 5 = 40$ m. Vérification
      : $20 + 20 = 40$ m.'
  - numero: 38
    etoiles: 3
    enonce: 'Fatimata affirme : « les diagonales d''un quadrilatère se coupent en leur milieu et sont
      perpendiculaires, donc c''est un carré ». a) Explique par un dessin pourquoi elle se trompe. b)
      Quelle figure a-t-elle décrite ? c) Quelle condition faut-il ajouter pour obtenir un carré ?'
    correction: 'Il suffit d''un contre-exemple : deux diagonales perpendiculaires inégales se coupant
      en leur milieu.

      a) Avec $8$ cm et $4$ cm, la figure est allongée, pas carrée. b) Un **losange**. c) Ajouter que
      les diagonales ont la **même longueur**.'
  fiche_revision:
  - '**Symétrie orthogonale.** (D) est la médiatrice de $\left[AA''\right]$ : perpendiculaire **et** milieu
    ; $AA'' = 2 \times HA$.'
  - '**Symétrie centrale.** O est le milieu de $\left[AA''\right]$ : alignés, O entre les deux ; $AA''
    = 2 \times OA$.'
  - '**Images.** Segment $\to$ segment de même longueur ; droite $\to$ droite ; cercle $\to$ cercle de
    même rayon. On relie **dans le même ordre**.'
  - '**Conservé par les deux.** Longueurs, angles, alignement, milieux, parallélisme, périmètres, aires,
    nature.'
  - '**La différence.** La symétrie centrale envoie une droite sur une parallèle ; l''orthogonale, non.'
  - '**Axes et centre.** Carré $4$ ; rectangle non carré $2$ (médiatrices des côtés) ; losange non carré
    $2$ (diagonales) ; parallélogramme $0$ axe mais un centre ; triangle isocèle $1$ axe, pas de centre
    ; cercle une infinité.'
  - '**Parallélogramme.** Diagonales se coupant en leur milieu, qui est le centre de symétrie. Ajoute
    « même longueur » pour un rectangle, « perpendiculaires » pour un losange.'
  trouve_erreur:
  - faux: « $HA = 4$ cm, donc $AA' = 4$ cm. »
    correction: 'H est le milieu : $AA'' = 8$ cm.'
  - faux: « O milieu de $\left[AA'\right]$ et $OA = 5$ cm, donc $AA' = 5$ cm. »
    correction: $AA' = 2 \times 5 = 10$ cm.
  - faux: « Le rectangle a $4$ axes, comme le carré. »
    correction: 'Ses diagonales n''en sont pas : il a $2$ axes.'
  - faux: « Diagonales se coupant en leur milieu, donc rectangle. »
    correction: Cela donne un parallélogramme ; il faut de plus $AC = BD$.
  cartographie_lacunes:
  - lacune: Symétries confondues, images mal construites
    bloque_en: translations, compositions d'applications
  source_path: remediation\4eme\modules_c\M10.md
- niveau: 4eme
  module: 11
  module_titre: Aires, volumes et solides usuels
  pourquoi: 'Les formules de mesure ne s''oublient pas, elles se mélangent : hauteur et côté oblique,
    diamètre et rayon, aire et volume. Une erreur d''unité ici se paie toute l''année.'
  diagnostic:
  - question: Aire d'un triangle de base $10$ cm et de hauteur $6$ cm.
    reponse: $\frac{10 \times 6}{2} = 30$ cm$^{2}$
  - question: Aire d'un disque de rayon $5$ cm $\left(\pi \approx 3{,}14\right)$.
    reponse: $3{,}14 \times 25 = 78{,}5$ cm$^{2}$
  - question: Volume d'un pavé droit de $5$ cm $\times 3$ cm $\times 2$ cm.
    reponse: $30$ cm$^{3}$
  - question: Combien de litres dans $1$ m$^{3}$ ? Combien de cm$^{3}$ dans $1$ litre ?
    reponse: $1$ m$^{3} = 1\,000$ L ; $1$ L $= 1\,000$ cm$^{3}$
  - question: Volume d'une pyramide de base $12$ cm$^{2}$ et de hauteur $5$ cm.
    reponse: $\frac{12 \times 5}{3} = 20$ cm$^{3}$
  lecons:
  - id: 4eme_M11_L1
    numero: '11.1'
    titre: Périmètres et aires des figures planes
    retenir:
    - 'Triangle : $\frac{b \times h}{2}$. Parallélogramme : $b \times h$. Losange : $\frac{D \times d}{2}$.'
    - 'Trapèze de bases $B$ et $b$ : $\frac{\left(B + b\right) \times h}{2}$.'
    - 'Disque de rayon $r$ : $\pi \times r \times r$, avec $\pi \approx 3{,}14$. Cercle : $\mathcal{P}
      = 2 \times \pi \times r$, jamais en cm$^{2}$.'
    - La hauteur est **toujours perpendiculaire** à la base, jamais le côté oblique.
    - 'Unités d''aire : de cent en cent. $1$ m$^{2} = 10\,000$ cm$^{2}$.'
    methode:
      titre: Calculer une aire plane
      etapes:
      - Identifie la figure, écris la formule avant tout calcul.
      - 'Repère la base, puis la hauteur perpendiculaire à cette base (disque : diamètre donné, divise-le
        par deux).'
      - Toutes les longueurs dans la même unité, puis remplace.
      - Résultat avec une unité **carrée**.
    exemple_resolu: 'Jardin en trapèze de bases $12$ m et $8$ m, hauteur $5$ m ; bassin circulaire de
      $2$ m de rayon. Surface cultivable ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Trapèze. | $\frac{\left(12 + 8\right) \times 5}{2} = 50$ m$^{2}$ |

      | Disque, avec le rayon. | $3{,}14 \times 2 \times 2 = 12{,}56$ m$^{2}$ |

      | On retire le bassin. | $50 - 12{,}56 = 37{,}44$ m$^{2}$ |

      | **Vérification :** le bassin fait environ un quart du jardin. ✓ | |'
    erreurs_frequentes:
    - erreur: prendre le côté oblique pour hauteur.
      correction: la hauteur est perpendiculaire à la base, donc plus courte.
    - erreur: $1$ m$^{2} = 100$ cm$^{2}$.
      correction: $1$ m$^{2} = 10\,000$ cm$^{2}$.
    declic: null
    figures:
    - figures/m11_f1.svg
  - id: 4eme_M11_L2
    numero: '11.2'
    titre: 'Empiler une base : pavé, cube, prisme droit, cylindre'
    retenir:
    - 'Pavé droit : $L \times l \times h$ ; cube d''arête $c$ : $c \times c \times c$ ; cylindre : $\pi
      \times r \times r \times h$.'
    - 'Aire latérale $=$ **périmètre** de la base $\times$ hauteur ; cylindre : $2 \times \pi \times r
      \times h$.'
    - 'Aire totale $=$ aire latérale $+\ 2 \times$ aire d''une base. Cube : $6 \times \left(c \times c\right)$.'
    - 'Patron d''un prisme : les deux bases $+$ une bande de longueur le périmètre, de largeur $h$. Cylindre
      : deux disques $+$ un rectangle $2 \times \pi \times r$ sur $h$. Formule oubliée : dessine le patron
      et additionne.'
    methode:
      titre: Calculer le volume d'un solide droit
      etapes:
      - 'Repère la base : les deux faces identiques et parallèles.'
      - Calcule son aire avec la formule plane qui convient.
      - Multiplie par la hauteur, distance entre les deux bases.
      - Unité **cube**, puis litres si l'énoncé parle de contenance.
    exemple_resolu: 'Bac d''arrosage, prisme droit de base $2\,500$ cm$^{2}$ et de longueur $80$ cm. Combien
      de litres ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Base donnée : règle du volume. | $V = 2\,500 \times 80 = 200\,000$ cm$^{3}$ |

      | Un litre vaut mille cm$^{3}$. | $200\,000 \div 1\,000 = 200$ litres |

      | **Vérification :** $200$ L, un grand fût. ✓ | |'
    erreurs_frequentes:
    - erreur: « aire latérale $=$ aire de la base $\times$ hauteur ».
      correction: c'est le volume ; l'aire latérale utilise le **périmètre**.
    - erreur: remplacer $r$ par le diamètre.
      correction: divise par deux avant tout calcul.
    declic: null
    figures: []
  - id: 4eme_M11_L3
    numero: '11.3'
    titre: 'Le tiers : pyramide et cône'
    retenir:
    - 'Cône : $V = \frac{\pi \times r \times r \times h}{3}$. Seule la **hauteur** intervient.'
    - 'Pyramide régulière : $\mathcal{A}_{\text{lat}} = \frac{\text{périmètre} \times a}{2}$, $a$ étant
      l''**apothème** (hauteur d''une face latérale). Cône : $\mathcal{A}_{\text{lat}} = \pi \times r
      \times g$, $g$ étant la **génératrice**.'
    - Aire totale $=$ aire latérale $+$ aire de la base.
    - hauteur $<$ apothème $<$ arête latérale. La hauteur sert au **volume**, l'apothème et la génératrice
      à l'**aire latérale**.
    methode:
      titre: Choisir la bonne longueur
      etapes:
      - « Combien contient-il ? » $\rightarrow$ volume. « Combien de tôle ? » $\rightarrow$ aire.
      - 'Volume : **hauteur** et aire de la base, puis diviser par $3$.'
      - 'Aire latérale : l''**apothème** (pyramide) ou la **génératrice** (cône).'
      - Ajoute l'aire de la base seulement si le solide est fermé en bas.
    exemple_resolu: 'Entonnoir conique, $10$ cm de diamètre ; du sommet au bord de la base, $15$ cm. Aire
      de tôle ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Diamètre $\rightarrow$ rayon ; les $15$ cm, c''est $g$. | $r = 5$ cm, $g = 15$ cm |

      | Entonnoir ouvert : que la surface courbe. | $\mathcal{A}_{\text{lat}} = 3{,}14 \times 5 \times
      15 = 235{,}5$ cm$^{2}$ |

      | **Vérification :** en cm$^{2}$, c''est une surface. ✓ | |'
    erreurs_frequentes:
    - erreur: génératrice ou apothème dans un volume.
      correction: le volume ne connaît que la hauteur.
    - erreur: oublier de diviser par $3$.
      correction: un solide pointu vaut le tiers du solide droit de même base et même hauteur.
    declic: null
    figures:
    - figures/m11_f5.svg
  - id: 4eme_M11_L4
    numero: '11.4'
    titre: Sphère, boule et unités de volume
    retenir:
    - 'Sphère : $\mathcal{A} = 4 \times \pi \times r \times r$. Boule : $V = \frac{4 \times \pi \times
      r \times r \times r}{3}$.'
    - '**Compte les $r$ :** deux fois dans une aire, trois fois dans un volume.'
    - 'Demi-boule : la boule entière, puis la moitié.'
    - $1$ m$^{3} = 1\,000$ dm$^{3} = 1\,000\,000$ cm$^{3}$.
    - $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$ et $1$ m$^{3} = 1\,000$ L.
    methode:
      titre: Convertir un volume en capacité
      etapes:
      - Écris le volume en unité cube, longueurs dans une seule unité.
      - 'Unité pivot : $1$ dm$^{3} = 1$ L.'
      - 'cm$^{3} \rightarrow$ dm$^{3}$ : $\div\ 1\,000$ ; m$^{3} \rightarrow$ dm$^{3}$ : $\times\ 1\,000$.'
      - Remplace dm$^{3}$ par L.
    exemple_resolu: 'Château d''eau sphérique de rayon $3$ m. Aire à repeindre, puis contenance.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Peindre $\rightarrow$ aire, deux $r$. | $\mathcal{A} = 4 \times 3{,}14 \times 3 \times 3 = 113{,}04$
      m$^{2}$ |

      | Contenir $\rightarrow$ volume, trois $r$. | $V = \frac{4 \times 3{,}14 \times 27}{3} = 113{,}04$
      m$^{3}$ |

      | $1$ m$^{3} = 1\,000$ litres. | $113\,040$ litres |

      | **Vérification :** m$^{2}$ pour l''aire, m$^{3}$ pour le volume. ✓ | |'
    erreurs_frequentes:
    - erreur: le volume de la boule pour acheter la peinture.
      correction: on peint une surface, donc l'aire de la sphère.
    - erreur: convertir un volume de dix en dix.
      correction: de mille en mille.
    declic: 'quand la conversion des volumes résiste — Si tu écris $1$ L $= 100$ cm$^{3}$, le blocage
      est dans le nombre de dimensions : un mètre vaut dix décimètres, donc un mètre cube vaut $10 \times
      10 \times 10 = 1\,000$ décimètres cubes. Longueur de dix en dix, aire de cent en cent, volume de
      mille en mille. #### MÉTHODE : Convertir un volume en capacité 1. Écris le volume en unité cube,
      longueurs dans une seule unité. 2. Unité pivot : $1$ dm$^{3} = 1$ L. 3. cm$^{3} \rightarrow$ dm$^{3}$
      : $\div\ 1\,000$ ; m$^{3} \rightarrow$ dm$^{3}$ : $\times\ 1\,000$. 4. Remplace dm$^{3}$ par L.'
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Aire d''un triangle : a) $b = 7$ cm, $h = 4$ cm ; b) $b = 8$ cm, $h = 5$ cm ; c) $b = 12$
      cm, $h = 3{,}5$ cm.'
    correction: a) $\frac{7 \times 4}{2} = 14$ cm$^{2}$ ; b) $20$ cm$^{2}$ ; c) $\frac{42}{2} = 21$ cm$^{2}$.
  - numero: 2
    etoiles: 1
    enonce: a) Aire d'un parallélogramme de base $12$ cm et de hauteur $4{,}5$ cm. b) Aire d'un losange
      de diagonales $14$ cm et $8$ cm.
    correction: a) $54$ cm$^{2}$ (pas de division par deux) ; b) $56$ cm$^{2}$.
  - numero: 3
    etoiles: 1
    enonce: 'Aire d''un trapèze : a) bases $9$ cm et $5$ cm, hauteur $4$ cm ; b) bases $10$ cm et $6$
      cm, hauteur $5$ cm.'
    correction: a) $28$ cm$^{2}$ ; b) $40$ cm$^{2}$.
  - numero: 4
    etoiles: 1
    enonce: $\left(\pi \approx 3{,}14\right)$ a) Aire d'un disque de rayon $10$ cm. b) Périmètre puis
      aire d'un disque de rayon $3$ cm.
    correction: a) $314$ cm$^{2}$ ; b) $\mathcal{P} = 18{,}84$ cm et $\mathcal{A} = 28{,}26$ cm$^{2}$.
  - numero: 5
    etoiles: 1
    enonce: La place du marché de Bobo-Dioulasso est un disque de rayon $25$ m. Superficie ?
    correction: $3{,}14 \times 25 \times 25 = 1\,962{,}5$ m$^{2}$.
  - numero: 6
    etoiles: 1
    enonce: a) Aire totale d'un cube de $10$ cm d'arête. b) Aire totale d'un pavé de $8$ cm $\times 5$
      cm $\times 3$ cm.
    correction: a) $600$ cm$^{2}$ ; b) $2 \times 40 + 2 \times 24 + 2 \times 15 = 158$ cm$^{2}$.
  - numero: 7
    etoiles: 1
    enonce: Le patron d'un pavé est formé de deux rectangles $7 \times 4$, deux $7 \times 3$ et deux $4
      \times 3$ (en cm). Ses trois dimensions ?
    correction: $7$ cm, $4$ cm et $3$ cm.
  - numero: 8
    etoiles: 1
    enonce: Un prisme droit a $18$ arêtes. a) Combien sont latérales ? b) Combien de côtés a sa base ?
      c) Quelle est la nature de ses bases ?
    correction: $3n$ arêtes, donc $n = 6$. a) $6$ ; b) $6$ ; c) hexagones.
  - numero: 9
    etoiles: 1
    enonce: 'Volume : a) d''un pavé de $5$ cm $\times 4$ cm $\times 2$ cm ; b) d''un cube de $3$ cm d''arête
      ; c) d''un prisme droit de base $15$ cm$^{2}$ et de hauteur $8$ cm.'
    correction: a) $40$ cm$^{3}$ ; b) $27$ cm$^{3}$ ; c) $120$ cm$^{3}$.
  - numero: 10
    etoiles: 1
    enonce: Prisme droit de base rectangulaire $6$ cm sur $4$ cm, hauteur $10$ cm. a) Aire latérale ;
      b) aire totale ; c) volume.
    correction: a) périmètre $20$ cm, donc $200$ cm$^{2}$ ; b) $200 + 48 = 248$ cm$^{2}$ ; c) $240$ cm$^{3}$.
  - numero: 11
    etoiles: 1
    enonce: $\left(\pi \approx 3{,}14\right)$ a) Aire latérale et volume d'un cylindre de rayon $3$ cm
      et de hauteur $10$ cm. b) Volume d'un fût cylindrique de rayon $4{,}5$ cm et de hauteur $20$ cm.
    correction: a) $\mathcal{A}_{\text{lat}} = 188{,}4$ cm$^{2}$ et $V = 282{,}6$ cm$^{3}$ ; b) $1\,271{,}7$
