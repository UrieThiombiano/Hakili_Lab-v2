    correction: 'a) $3x = 9$ : $\left(3\,;6\right)$ ; b) somme, $2x = 6$ : $\left(3\,;2\right)$.'
  - numero: 18
    etoiles: 1
    enonce: 'Un rectangle a un périmètre de $62$ m et sa longueur dépasse sa largeur de $7$ m.

      Quelles sont ses dimensions ?


      ### Entraînement ★★'
    correction: '$4\ell + 14 = 62$, $\ell = 12$ : $19$ m sur $12$ m.'
  - numero: 19
    etoiles: 2
    enonce: 'Résous : $1{,}8x - 2{,}6 \ge 2{,}2x + 1{,}8$.'
    correction: '$-0{,}4x \ge 4{,}4$ ; le sens se retourne : $S = \left]-\infty\,;-11\right]$.'
  - numero: 20
    etoiles: 2
    enonce: 'Résous : $\frac{x - 1}{3} - \frac{3}{2} = \frac{x}{2}$.'
    correction: 'Chaque terme par $6$ : $2\left(x - 1\right) - 9 = 3x$, $S = \left\{-11\right\}$.'
  - numero: 21
    etoiles: 2
    enonce: 'Résous :

      $3\left(x + 5\right) - 2\left(x + 4\right) = 5\left(x + 3\right) - 4\left(2x - 3\right)$.'
    correction: '$x + 7 = -3x + 27$ (moins devant la seconde parenthèse) : $S = \left\{5\right\}$.'
  - numero: 22
    etoiles: 2
    enonce: 'Résous : $\left|2x + 5\right| = 10$.'
    correction: '$2x + 5 = 10$ ou $2x + 5 = -10$ : $S = \left\{\frac{-15}{2}\,;\frac{5}{2}\right\}$.'
  - numero: 23
    etoiles: 2
    enonce: 'Résous : $-5\left(x - 7\right) < 3$.'
    correction: '$-5x < -32$ ; le sens se retourne : $S = \left]6{,}4\,;+\infty\right[$.'
  - numero: 24
    etoiles: 2
    enonce: 'Parmi $-2$ ; $0$ ; $-1$ et $\frac{-4}{3}$, lesquels sont solutions de

      $-2\left(x + 3\right) \le x - 3$ ? Justifie sans résoudre.'
    correction: '$-2$ : $-2 \le -5$ faux ; $0$ : $-6 \le -3$ vrai ; $-1$ : $-4 \le -4$ vrai ($\le$

      autorise l''égalité) ; $\frac{-4}{3}$ : faux. Seuls $0$ et $-1$.'
  - numero: 25
    etoiles: 2
    enonce: 'Résous par combinaison : $4x - 3y = 6$ et $2x + 5y = 16$.'
    correction: 'Seconde par $-2$ : $-13y = -26$, $y = 2$, $x = 3$ : $\left(3\,;2\right)$.'
  - numero: 26
    etoiles: 2
    enonce: Résous le système formé de $x - y = 3$ et $2x - 2y = 10$. Que constates-tu ?
    correction: 'La seconde donne $x - y = 5$, incompatible avec $x - y = 3$ : $S = \varnothing$

      (droites parallèles distinctes).'
  - numero: 27
    etoiles: 2
    enonce: 'À Pama, un éleveur vend $3$ moutons et $2$ chèvres pour $195\,000$ FCFA. Un

      mouton coûte $15\,000$ FCFA de plus qu''une chèvre. Quel est le prix de chaque animal ?'
    correction: 'Chèvre $x$ : $5x = 150\,000$, $x = 30\,000$. Chèvre $30\,000$ FCFA, mouton

      $45\,000$ FCFA.'
  - numero: 28
    etoiles: 2
    enonce: 'Fatimata économise $4\,000$ FCFA par semaine pour une machine à coudre à

      $85\,000$ FCFA. Elle a déjà $37\,000$ FCFA. Combien de semaines au minimum ?'
    correction: '$4\,000x + 37\,000 \ge 85\,000$ : $x \ge 12$, soit $12$ semaines.'
  - numero: 29
    etoiles: 2
    enonce: 'À Garango, un éleveur a des poules et des chèvres : $40$ têtes et $116$ pattes.

      Combien de poules et de chèvres ?


      ### Entraînement intensif : choisir sa méthode et résoudre un système


      *Un seul geste, répété : ranger, choisir entre substitution et combinaison, éliminer une inconnue,

      vérifier le couple dans les deux équations.*'
    correction: '$p + c = 40$ et $2p + 4c = 116$ : $22$ poules et $18$ chèvres.'
  - numero: 30
    etoiles: 1
    enonce: 'Résous : $x = 3y$ et $2x - y = 10$.'
    correction: 'Report : $5y = 10$, $\left(6\,;2\right)$.'
  - numero: 31
    etoiles: 1
    enonce: 'Résous : $2x + 3y = 12$ et $2x - y = 4$.'
    correction: 'Différence : $4y = 8$, $\left(3\,;2\right)$.'
  - numero: 32
    etoiles: 1
    enonce: 'Résous : $3x + 2y = 8$ et $5x - 2y = 24$.'
    correction: 'Coefficients de $y$ opposés ; somme : $8x = 32$, $\left(4\,;-2\right)$.'
  - numero: 33
    etoiles: 1
    enonce: 'Résous : $x + 4y = 14$ et $3x - 2y = 0$.'
    correction: 'Seconde par $2$, puis somme : $7x = 14$, $\left(2\,;3\right)$.'
  - numero: 34
    etoiles: 2
    enonce: 'Résous : $6x - 15y - 54 = 0$ et $2x + y + 6 = 0$.'
    correction: 'Rangé : $6x - 15y = 54$ et $2x + y = -6$. Seconde par $15$, somme : $36x = -36$,

      $\left(-1\,;-4\right)$.'
  - numero: 35
    etoiles: 2
    enonce: 'Résous : $\frac{x}{2} + \frac{y}{3} = 4$ et $x - y = 3$.


      ### ★★★ Défis de maîtrise'
    correction: 'Première par $6$ : $3x + 2y = 24$ ; avec $x = y + 3$, $5y = 15$ :

      $\left(6\,;3\right)$.'
  - numero: 36
    etoiles: 3
    enonce: 'Résous séparément $2x + 1 \le 9$ et $3x - 2 > 1$, représente les deux ensembles

      sur une même droite graduée, puis donne tous les **entiers** qui vérifient les deux à la fois.

      Combien y en a-t-il ?'
    correction: 'On résout chaque inéquation, puis on cherche la partie commune.

      $\left]-\infty\,;4\right]$ et $\left]1\,;+\infty\right[$ donnent $1 < x \le 4$. Entiers : $2$, $3$,

      $4$, soit **trois** ($1$ est rejeté, $4$ est retenu).'
  - numero: 37
    etoiles: 3
    enonce: 'Détermine $a$ et $b$ pour que le couple $\left(1\,;2\right)$ soit solution du

      système formé de $ax + by = 8$ et $bx - ay = -1$.'
    correction: 'Le couple est donné : ce sont $a$ et $b$ qui sont inconnus. En remplaçant :

      $a + 2b = 8$ et $-2a + b = -1$. D''où $b = 2a - 1$, puis $5a = 10$ : $a = 2$ et $b = 3$.

      Vérification : $2 + 6 = 8$ et $3 - 4 = -1$.'
  - numero: 38
    etoiles: 3
    enonce: 'Résous le système formé de $3\left(x - 1\right) + 2\left(y + 2\right) = 13$ et

      $2\left(x + y\right) - \left(x - y\right) = 11$.'
    correction: 'Tant qu''il reste des parenthèses, aucun coefficient n''est lisible : on développe

      d''abord, ce qui donne $3x + 2y = 12$ et $x + 3y = 11$. Substitution $x = 11 - 3y$ : $-7y = -21$,

      $y = 3$, $x = 2$. Solution $\left(2\,;3\right)$, vérifiée dans les deux équations de départ.'
  - numero: 39
    etoiles: 3
    enonce: 'À Nouna, un centre de photocopies propose deux formules : A, $2\,000$ FCFA

      d''abonnement puis $15$ FCFA la copie ; B, $3\,500$ FCFA d''abonnement puis $10$ FCFA la copie.
      Un

      lycée doit choisir pour l''année. Conseille-le.'
    correction: 'On exprime chaque prix, puis on compare par une inéquation. A : $2\,000 + 15x$ ;

      B : $3\,500 + 10x$. B est plus avantageuse si $1\,500 < 5x$, soit $x > 300$. **Conseil :** en dessous

      de $300$ copies, formule A ; au-delà, formule B ; à $300$ copies, les deux coûtent $6\,500$ FCFA.'
  - numero: 40
    etoiles: 3
    enonce: 'Rakieta devait résoudre $\frac{2x - 1}{3} - \frac{x + 4}{2} \ge 1$. Sa copie :


      *Ligne 1 :* $2\left(2x - 1\right) - 3\left(x + 4\right) \ge 1$ ; *Ligne 2 :* $4x - 2 - 3x + 12 \ge
      1$ ;

      *Ligne 3 :* $x + 10 \ge 1$ ; *Ligne 4 :* $x \ge -9$


      **a)** Repère les deux lignes fausses et explique chaque erreur. **b)** Refais la résolution et

      donne $S$ sous forme d''intervalle.'
    correction: 'On relit ligne à ligne en cherchant l''opération faite entre deux lignes.

      **a)** Ligne 1 : seul le membre de gauche a été multiplié par $6$, il fallait $\ge 6$. Ligne 2 :

      $-3\left(x + 4\right) = -3x - 12$, et non $-3x + 12$. **b)** $x - 14 \ge 6$, donc

      $S = \left[20\,;+\infty\right[$.'
  - numero: 41
    etoiles: 3
    enonce: 'Vrai ou faux ? Justifie par une preuve ou un contre-exemple. **a)** Si $x > 5$,

      alors $-x > -5$. **b)** « Plus de $5$ » se traduit par $x \ge 5$. **c)** $x^{2} = -9$ admet deux

      solutions, $3$ et $-3$. **d)** Un couple qui vérifie la première équation d''un système est solution

      de ce système.'
    correction: '**a) Faux :** multiplier par $-1$ retourne le sens, $-x < -5$ (contre-exemple

      $x = 6$). **b) Faux :** « plus de $5$ » exclut $5$, c''est $x > 5$. **c) Faux :** un carré n''est

      jamais négatif, $S = \varnothing$. **d) Faux :** dans $x + y = 5$ et $x - y = 1$, le couple

      $\left(4\,;1\right)$ ne vérifie que la première.'
  - numero: 42
    etoiles: 3
    enonce: 'On donne le système formé de $x + y = s$ et $x - y = d$. **a)** Exprime $x$ et

      $y$ en fonction de $s$ et $d$. **b)** Applique avec $s = 74$ et $d = 18$, puis vérifie. **c)** À

      quelle condition sur $s$ et $d$ les nombres $x$ et $y$ sont-ils entiers ?'
    correction: 'Les lettres $s$ et $d$ se traitent comme des nombres connus. **a)** Somme :

      $x = \frac{s + d}{2}$ ; différence : $y = \frac{s - d}{2}$. **b)** $x = 46$, $y = 28$ ; vérification
      :

      $46 + 28 = 74$ et $46 - 28 = 18$. **c)** Entiers lorsque $s$ et $d$ sont **de même parité**.'
  fiche_revision:
  - '**Transposer.** Un terme qui change de membre change de signe ; un facteur devient diviseur.'
  - '**Parenthèses et dénominateurs.** On développe avant de transposer ; un moins change **tous** les
    signes ; on multiplie **chaque terme des deux membres**.'
  - '**Produit nul.** $A \times B = 0$ équivaut à $A = 0$ **ou** $B = 0$ ; on factorise, on ne divise
    jamais par $x$.'
  - '**Carré et valeur absolue.** $x^{2} = a$ : deux solutions si $a > 0$, aucune si $a < 0$. Pour $k
    > 0$, $\left|X\right| = k$ donne $X = k$ ou $X = -k$ ; pour $k < 0$, $S = \varnothing$.'
  - '**Inéquation.** Mêmes gestes qu''une équation, sauf un : diviser par un **négatif** retourne le sens.'
  - '**Intervalles.** $x < a$ : $\left]-\infty\,;a\right[$ ; $x \le a$ : $\left]-\infty\,;a\right]$ ;
    $x > a$ : $\left]a\,;+\infty\right[$ ; $x \ge a$ : $\left[a\,;+\infty\right[$. Crochet de l''infini
    toujours ouvert.'
  - '**Système $2 \times 2$.** Le couple vérifie les **deux** équations. Substitution si un coefficient
    vaut $1$ ou $-1$ ; combinaison sinon.'
  - '**Mise en équation.** Nommer avec l''unité, traduire, résoudre, contrôler, conclure. « Au moins »
    s''arrondit vers le haut, « au plus » vers le bas.'
  trouve_erreur:
  - faux: $5x = 20$, donc $x = 20 \times 5 = 100$
    correction: 'Le facteur devient un **diviseur** : $x = \frac{20}{5} = 4$.'
  - faux: $5 - 3\left(2x + 1\right) = 5 - 6x + 3$
    correction: 'Le moins porte sur toute la parenthèse : $5 - 6x - 3$.'
  - faux: $x^{2} = 5x$, je divise par $x$, donc $x = 5$
    correction: 'On perd $x = 0$. On factorise : $x\left(x - 5\right) = 0$.'
  - faux: $-2x < 6$, donc $x < -3$
    correction: 'Division par un négatif : le sens se retourne, $x > -3$.'
  cartographie_lacunes:
  - lacune: Transposition mécanique, sens d'une inéquation, systèmes
    bloque_en: équations, systèmes linéaires
  source_path: remediation\2ndeC\modules_c\M04.md
- niveau: 2ndeC
  module: 5
  module_titre: Applications linéaires et affines, lecture graphique
  pourquoi: 'Deux mots sont constamment échangés : l''**image**, qui sort du calcul, et l''**antécédent**,
    qui y entre. Sur un graphique, l''échange se répète : on lit une ordonnée quand on demandait une abscisse.'
  diagnostic:
  - question: Soit $f\left(x\right) = 3x - 5$. Calcule $f\left(2\right)$.
    reponse: $1$
  - question: Soit $f\left(x\right) = 2x$. Quel nombre a pour image $10$ ?
    reponse: $5$
  - question: $f$ est linéaire et $f\left(4\right) = 12$. Quel est son coefficient ?
    reponse: $a = \frac{12}{4} = 3$
  - question: Soit $f\left(x\right) = -3x + 7$. Croissante ou décroissante ? Que vaut $f\left(0\right)$
      ?
    reponse: décroissante car $-3 < 0$ ; $f\left(0\right) = 7$
  - question: Une droite coupe l'axe des ordonnées en $2$ et monte de $3$ quand $x$ augmente de $1$. Donne
      l'application affine correspondante.
    reponse: $f\left(x\right) = 3x + 2$
  lecons:
  - id: 2ndeC_M05_L1
    numero: '5.1'
    titre: Image et antécédent
    retenir:
    - '$f\left(x\right)$ se lit « $f$ de $x$ » : c''est l''**image** de $x$. Ce n''est pas un produit.'
    - 'Si $f\left(x\right) = y$ : $y$ est **l''**image de $x$, $x$ est **un** antécédent de $y$.'
    - 'Image : on **remplace** et on effectue. Antécédent de $y$ : on **résout** $f\left(x\right) = y$.'
    - Un nombre a **une seule** image ; il peut avoir plusieurs antécédents, ou aucun.
    - 'Tableau de valeurs : première ligne les départs, seconde ligne les images.'
    methode:
      titre: Savoir ce qu'on cherche
      etapes:
      - Repère où est le nombre donné dans l'écriture $f\left(\ldots\right) = \ldots$
      - '**Dans la parenthèse** : c''est un départ, on calcule son image en remplaçant.'
      - '**Après le signe égal** : c''est une arrivée, on cherche un antécédent en résolvant.'
      - Contrôle tout antécédent trouvé en recalculant son image.
    exemple_resolu: 'Soit $f\left(x\right) = 4x - 1$. Image de $-3$, puis antécédent de $11$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $-3$ est au départ : on remplace, entre parenthèses. | $f\left(-3\right) = 4 \times \left(-3\right)
      - 1 = -13$ |

      | $11$ est à l''arrivée : on pose l''équation. | $4x - 1 = 11$ |

      | On transpose, puis on divise. | $4x = 12$, donc $x = 3$ |

      | **Vérification :** $f\left(3\right) = 11$ ✓ | |


      [SVG: figures/m05_f1.svg]

      *Figure 5.1 : Le sens de circulation, et pourquoi une image peut avoir deux antécédents.*'
    erreurs_frequentes:
    - erreur: « $4$ est l'image de $8$ » alors que $f\left(4\right) = 8$.
      correction: le nombre dans la parenthèse est celui du départ ; $8$ est l'image de $4$.
    - erreur: lire $f\left(3\right)$ comme un produit $f \times 3$.
      correction: la lettre $f$ n'est pas un nombre ; $f\left(3\right)$ est le résultat de la règle appliquée
        à $3$.
    declic: 'Un antécédent, c''est une équation — Si « quel nombre a pour image $20$ ? » te laisse sans
      geste avec $f\left(x\right) = 3x + 5$, le blocage n''est pas dans les fonctions : il est dans la
      résolution de $3x + 5 = 20$. Reprends le module 4, la transposition des termes, puis reviens ici.'
    figures:
    - figures/m05_f1.svg
  - id: 2ndeC_M05_L2
    numero: '5.2'
    titre: L'application linéaire
    retenir:
    - Une **application linéaire** s'écrit $f\left(x\right) = ax$, sans terme constant.
    - Elle traduit une **proportionnalité** ; $a$ est le coefficient de proportionnalité.
    - 'Toujours $f\left(0\right) = 0$ : la droite **passe par l''origine**.'
    - 'À partir d''un couple connu, avec $x \neq 0$ :'
    - 'Croissante si $a > 0$, décroissante si $a < 0$. Propriétés : $f\left(u + v\right) = f\left(u\right)
      + f\left(v\right)$ et $f\left(k u\right) = k \times f\left(u\right)$.'
    methode:
      titre: Déterminer une application linéaire
      etapes:
      - Vérifie qu'il n'y a qu'un terme de la forme $ax$, sans constante ajoutée.
      - 'Repère le couple connu : un départ et son image.'
      - Calcule $a$ en divisant **l'image par le départ**, jamais l'inverse.
      - Écris $f\left(x\right) = ax$ et contrôle sur le couple de départ.
    exemple_resolu: 'À Toma, $15$ kg de sésame rapportent $12\,000$ FCFA, à prix proportionnel. Détermine
      $f$, puis la recette pour $65$ kg.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Proportionnalité : l''application est linéaire. | $f\left(x\right) = ax$, $x$ en kilogrammes |

      | Coefficient = image divisée par départ. | $a = \frac{12\,000}{15} = 800$ FCFA le kilo |

      | On calcule l''image de $65$. | $f\left(65\right) = 800 \times 65 = 52\,000$ |

      | **Vérification :** $f\left(15\right) = 12\,000$ ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $a = \frac{7}{21}$ pour $f\left(7\right) = 21$.
      correction: '$a = \frac{21}{7} = 3$. Contrôle par le sens : si $7$ sacs coûtent $21\,000$ FCFA,
        le sac coûte $3\,000$ FCFA, pas une fraction de franc.'
    - erreur: appliquer $f\left(u + v\right) = f\left(u\right) + f\left(v\right)$ à $f\left(x\right) =
        2x + 3$.
      correction: propriété réservée aux applications **linéaires**. Ici $f\left(3\right) = 9$ mais $f\left(1\right)
        + f\left(2\right) = 12$.
    declic: null
    figures: []
  - id: 2ndeC_M05_L3
    numero: '5.3'
    titre: 'L''application affine : $a$ et $b$'
    retenir:
    - Une **application affine** s'écrit $f\left(x\right) = ax + b$.
    - $a$ est le **coefficient directeur** ; $b$ est la **part fixe**, égale à $f\left(0\right)$.
    - 'La droite coupe l''axe des ordonnées en $\left(0\,;\,b\right)$ : $b$ est l''**ordonnée à l''origine**.'
    - 'Pente : quand $x$ augmente de $1$, $f\left(x\right)$ varie de $a$.'
    - Linéaire est le cas $b = 0$ ; constante est le cas $a = 0$.
    methode:
      titre: Étudier une application affine
      etapes:
      - Développe et réduis pour obtenir la forme $ax + b$.
      - 'Identifie $a$ et $b$ ; précise la nature : affine, linéaire si $b = 0$, constante si $a = 0$.'
      - Lis le **signe de $a$** et énonce le sens de variation.
      - Pour ranger des images, range les départs, puis conserve ou inverse l'ordre.
    exemple_resolu: 'Mets $h\left(x\right) = \left(x + 1\right)^{2} - x^{2}$ sous la forme $ax + b$, donne
      sa nature, puis range $h\left(-3\right)$, $h\left(0\right)$, $h\left(4\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On développe et on réduit : les $x^{2}$ disparaissent. | $h\left(x\right) = x^{2} + 2x + 1 - x^{2}
      = 2x + 1$ |

      | On identifie ; $a > 0$ donc croissante. | $a = 2$, $b = 1$ : affine croissante |

      | On range les départs, l''ordre est conservé. | $-3 < 0 < 4$ donc $h\left(-3\right) < h\left(0\right)
      < h\left(4\right)$ |

      | **Vérification :** $-5 < 1 < 9$ ✓ | |'
    erreurs_frequentes:
    - erreur: « $f\left(x\right) = -3x + 10$ est croissante car $b = 10 > 0$. »
      correction: $a = -3 < 0$, donc décroissante.
    - erreur: déclarer $f\left(x\right) = 2x + 3$ linéaire parce qu'elle contient $2x$.
      correction: '$f\left(0\right) = 3 \neq 0$, la droite ne passe pas par l''origine : $f$ est affine,
        non linéaire.'
    declic: null
    figures: []
  - id: 2ndeC_M05_L4
    numero: '5.4'
    titre: Lire un graphique
    retenir:
    - '**Image de $x_{0}$** : verticale depuis $x_{0}$ jusqu''à la droite, puis horizontale jusqu''à l''axe
      des ordonnées.'
    - '**Antécédent de $y_{0}$** : horizontale depuis $y_{0}$ jusqu''à la droite, puis verticale jusqu''à
      l''axe des abscisses.'
    - '**Signe** : $f\left(x\right) > 0$ là où la droite est **au-dessus** de l''axe des abscisses, $f\left(x\right)
      < 0$ là où elle est **au-dessous** ; le changement se fait à l''abscisse $x_{0}$ où elle coupe cet
      axe.'
    - 'Résoudre $f\left(x\right) = m$ : horizontale d''ordonnée $m$, on lit l''abscisse du point d''intersection.'
    - 'Comparer deux tarifs : la droite la plus **basse** est la plus avantageuse.'
    methode:
      titre: Deux points, puis l'expression
      etapes:
      - 'Écris $f\left(x\right) = ax + b$ : deux inconnues, deux renseignements.'
      - Calcule $a = \frac{f\left(x_{2}\right) - f\left(x_{1}\right)}{x_{2} - x_{1}}$, différence des
        **images** au numérateur.
      - Remplace $a$ dans **un** des deux couples pour obtenir $b$.
      - Vérifie avec **l'autre** couple, celui qui n'a pas servi.
    exemple_resolu: 'La droite d''une application affine $f$ passe par $A\left(2\,;\,1\right)$ et $B\left(6\,;\,9\right)$.
      Détermine $f\left(x\right)$, puis dis si $C\left(4\,;\,6\right)$ lui appartient.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Différence des images sur différence des abscisses. | $a = \frac{9 - 1}{6 - 2} = 2$ |

      | On utilise $A$ pour la part fixe. | $1 = 2 \times 2 + b$, donc $b = -3$, et $f\left(x\right) =
      2x - 3$ |

      | On teste $C$ par l''image de son abscisse. | $f\left(4\right) = 5 \neq 6$ : $C$ n''appartient
      pas à la droite |

      | **Vérification** avec $B$ : $f\left(6\right) = 9$ ✓ | |


      [SVG: figures/m05_f5.svg]

      *Figure 5.2 : Lire une image, puis un antécédent : deux trajets, deux sens de parcours.*


      [SVG: figures/m05_f6.svg]

      *Figure 5.3 : Le signe se lit de part et d''autre du point où la droite traverse l''axe des abscisses.*'
    erreurs_frequentes:
    - erreur: annoncer $f\left(x\right) > 0$ « quand la droite monte ».
      correction: monter concerne la variation. Le signe se lit par rapport à l'axe des abscisses.
    - erreur: écrire $a = \frac{x_{2} - x_{1}}{f\left(x_{2}\right) - f\left(x_{1}\right)}$.
      correction: 'la différence des images va au numérateur. Contrôle par le sens : des francs divisés
        par des kilos.'
    declic: null
    figures:
    - figures/m05_f5.svg
    - figures/m05_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: $f$ associe à tout nombre son double. Quelle est l'image de $7$ ?
    correction: $f\left(x\right) = 2x$, donc l'image de $7$ est $14$.
  - numero: 2
    etoiles: 1
    enonce: Soit $f\left(x\right) = 3x$. Calcule $f\left(5\right)$, puis trouve un antécédent de $12$.
    correction: $f\left(5\right) = 15$ ; $3x = 12$ donne $x = 4$.
  - numero: 3
    etoiles: 1
    enonce: Soit $f\left(x\right) = x + 5$. Complète le tableau des images pour $x = -3$, $-1$, $0$, $2$
      et $4$.
    correction: $2$ ; $4$ ; $5$ ; $7$ ; $9$.
  - numero: 4
    etoiles: 1
    enonce: 'Soit $f\left(x\right) = 2x$. Complète : $f\left(\ldots\right) = 10$ ; $f\left(6\right) =
      \ldots$ ; $f\left(\ldots\right) = 0$.'
    correction: $f\left(5\right) = 10$ ; $f\left(6\right) = 12$ ; $f\left(0\right) = 0$.
  - numero: 5
    etoiles: 1
    enonce: Soit $f\left(x\right) = 4x - 1$. a) Calcule $f\left(0\right)$, $f\left(2\right)$ et $f\left(-3\right)$.
      b) Trouve l'antécédent de $11$.
    correction: a) $-1$ ; $7$ ; $-13$. b) $4x = 12$, donc $x = 3$.
  - numero: 6
    etoiles: 1
    enonce: Une application linéaire $f$ vérifie $f\left(7\right) = 21$. a) Détermine son coefficient.
      b) Calcule $f\left(5\right)$. c) Quel nombre a pour image $-6$ ?
    correction: a) $a = \frac{21}{7} = 3$, donc $f\left(x\right) = 3x$. b) $f\left(5\right) = 15$. c)
      $3x = -6$, donc $x = -2$.
  - numero: 7
    etoiles: 1
    enonce: Une application linéaire $g$ vérifie $g\left(-4\right) = 10$. Détermine $g\left(x\right)$.
    correction: $a = \frac{10}{-4} = -\frac{5}{2}$, donc $g\left(x\right) = -\frac{5}{2}x$.
  - numero: 8
    etoiles: 1
    enonce: Soit $f\left(x\right) = \frac{3}{4}x$. Trouve le nombre dont l'image est $9$.
    correction: $\frac{3}{4}x = 9$, donc $x = 9 \times \frac{4}{3} = 12$.
