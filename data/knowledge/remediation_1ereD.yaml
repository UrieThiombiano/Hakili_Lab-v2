      ni la puissance de $2$ ni le signe. La somme des coefficients est la valeur en $x = 1$, ce qui donne
      la vérification.

      Ligne 5 : $1, 5, 10, 10, 5, 1$, d''où $\left(2x - 3\right)^{5} = 32x^{5} - 240x^{4} + 720x^{3} -
      1\,080x^{2} + 810x - 243$.

      a) **Six termes** ($n + 1$). b) Le plus grand en valeur absolue est $-1\,080x^{2}$ : les coefficients
      de Pascal (maximaux au milieu) et les puissances de $3$ (maximales à droite) tirent en sens contraires.

      c) Valeur en $1$ : $\left(-1\right)^{5} = -1$ ; addition directe : $32 - 240 + 720 - 1\,080 + 810
      - 243 = -1$ ✓.'
  - numero: 26
    etoiles: 3
    enonce: Un réservoir cubique de Ouahigouya a une arête de $a$ centimètres. Le maçon augmente chaque
      arête de $2$ cm ; le réservoir gagne alors $2\,402$ cm³ de contenance. Retrouve l'arête initiale
      et donne la contenance finale.
    correction: '*Démarche.* Un gain de volume est une différence de deux cubes ; le terme $a^{3}$ disparaît
      et il reste une équation du second degré.

      $\left(a + 2\right)^{3} - a^{3} = 6a^{2} + 12a + 8 = 2\,402$, soit $a^{2} + 2a - 399 = 0$.

      $\Delta = 1\,600$, $\sqrt{\Delta} = 40$, donc $a = 19$ (la racine $-21$ est exclue).

      Arête initiale $19$ cm, contenance finale $21^{3} = 9\,261$ cm³. Vérification : $9\,261 - 6\,859
      = 2\,402$ ✓.'
  - numero: 27
    etoiles: 3
    enonce: Deux réels $a$ et $b$ vérifient $a + b = 5$ et $ab = 3$. Sans chercher $a$ ni $b$, calcule
      $a^{2} + b^{2}$, puis $a^{3} + b^{3}$, puis $\frac{1}{a} + \frac{1}{b}$ et $a^{3}b^{3}$. Déduis-en
      une équation du second degré dont $a^{3}$ et $b^{3}$ sont les solutions.
    correction: '*Démarche.* Tout doit s''exprimer avec $s = a + b = 5$ et $p = ab = 3$, par degré croissant.

      $a^{2} + b^{2} = s^{2} - 2p = 19$ ; $a^{3} + b^{3} = s^{3} - 3ps = 125 - 45 = 80$ ; $\frac{1}{a}
      + \frac{1}{b} = \frac{s}{p} = \frac{5}{3}$ ; $a^{3}b^{3} = p^{3} = 27$.

      Somme $80$, produit $27$ : $a^{3}$ et $b^{3}$ sont solutions de $X^{2} - 80X + 27 = 0$ (de discriminant
      $6\,292 > 0$ ✓).'
  - numero: 28
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Pour tous réels $a$ et $b$, $\left(a + b\right)^{3} = a^{3} + b^{3}$.

      b) Pour tous réels $a$ et $b$, $a^{3} - b^{3} = \left(a - b\right)\left(a^{2} + ab + b^{2}\right)$.

      c) Pour tout réel $a$, $a^{3} + 1 \geq 0$.

      d) Dans le développement de $\left(x + 1\right)^{5}$, le coefficient de $x^{3}$ vaut $10$.'
    correction: '*Démarche.* On teste avant de démontrer, avec des valeurs non neutres, négatifs compris.

      a) **Faux** : $a = b = 1$ donne $8 \ne 2$. b) **Vrai** : le développement de $\left(a - b\right)\left(a^{2}
      + ab + b^{2}\right)$ élimine les quatre termes intermédiaires deux à deux.

      c) **Faux** : $a = -2$ donne $-7$. On a $a^{3} + 1 \geq 0$ si et seulement si $a \geq -1$, car $a^{2}
      - a + 1 > 0$.

      d) **Vrai** : ligne 5, $\left(x + 1\right)^{5} = x^{5} + 5x^{4} + 10x^{3} + 10x^{2} + 5x + 1$.'
  - numero: 29
    etoiles: 3
    enonce: a) Démontre que pour tout entier naturel $n$, le nombre $\left(n + 1\right)^{3} - n^{3} -
      1$ est divisible par $3$. b) Démontre que $n^{3} + \left(n + 1\right)^{3} + \left(n + 2\right)^{3}$
      est divisible par $9$ pour tout entier naturel $n$. (Tu pourras utiliser que $n\left(n - 1\right)\left(n
      + 1\right)$ est toujours divisible par $3$.)
    correction: '*Démarche.* Pour une divisibilité, on ne teste pas : on met le facteur en évidence.

      a) $\left(n + 1\right)^{3} - n^{3} - 1 = 3n^{2} + 3n = 3n\left(n + 1\right)$, divisible par $3$.

      b) La somme vaut $3n^{3} + 9n^{2} + 15n + 9 = 3N$ avec $N = n^{3} + 3n^{2} + 5n + 3$. Or $N = n\left(n
      - 1\right)\left(n + 1\right) + 3\left(n + 1\right)^{2}$ : le premier terme est un produit de trois
      entiers consécutifs, donc divisible par $3$, le second aussi. Donc $3$ divise $N$ et $9$ divise
      $3N$. Contrôle : $n = 2$ donne $99 = 9 \times 11$ ✓.'
  - numero: 30
    etoiles: 3
    enonce: 'On pose $P\left(x\right) = x^{6} - 64$. a) Factorise $P$ en voyant d''abord une différence
      de deux carrés, aussi loin que possible. b) Recommence en voyant d''abord une différence de deux
      cubes. c) Les deux écritures doivent coïncider : établis l''égalité qui le prouve et vérifie-la.'
    correction: '*Démarche.* $6$ est le double de $3$ et le triple de $2$ : $x^{6} - 64$ est à la fois
      une différence de carrés et de cubes.

      a) $\left(x^{3} - 8\right)\left(x^{3} + 8\right) = \left(x - 2\right)\left(x + 2\right)\left(x^{2}
      + 2x + 4\right)\left(x^{2} - 2x + 4\right)$ ; les trinômes ont $\Delta = -12 < 0$, on s''arrête.

      b) $\left(x^{2} - 4\right)\left(x^{4} + 4x^{2} + 16\right) = \left(x - 2\right)\left(x + 2\right)\left(x^{4}
      + 4x^{2} + 16\right)$.

      c) Il faut $x^{4} + 4x^{2} + 16 = \left(x^{2} + 2x + 4\right)\left(x^{2} - 2x + 4\right)$ : en complétant
      le carré, $x^{4} + 4x^{2} + 16 = \left(x^{2} + 4\right)^{2} - \left(2x\right)^{2}$, différence de
      deux carrés qui donne exactement ce produit ✓.


      ---'
  fiche_revision:
  - '**Cube d''une somme.** $\left(a + b\right)^{3} = a^{3} + 3a^{2}b + 3ab^{2} + b^{3}$ : quatre termes,
    jamais deux.'
  - '**Cube d''une différence.** Mêmes coefficients, signes alternés à partir de $+$.'
  - '**Différence de cubes.** $a^{3} - b^{3} = \left(a - b\right)\left(a^{2} + ab + b^{2}\right)$.'
  - '**Somme de cubes.** $a^{3} + b^{3} = \left(a + b\right)\left(a^{2} - ab + b^{2}\right)$.'
  - '**Règle des signes.** Petit facteur : signe de départ. Grand facteur : carrés en $+$, milieu au signe
    contraire.'
  - '**Triangle de Pascal.** Ligne $n$ : $n + 1$ coefficients, somme $2^{n}$, chaque nombre somme des
    deux du dessus.'
  - '**Reconnaître un cube.** Coefficient dans $1, 8, 27, 64, 125, 216, 343, 512, 729, 1\,000$ ; exposant
    multiple de $3$.'
  - '**Fin de factorisation.** $a^{2} + ab + b^{2}$ a un discriminant négatif : on s''arrête là.'
  trouve_erreur:
  - faux: $\left(x + 3\right)^{3} = x^{3} + 27$
    correction: $x^{3} + 9x^{2} + 27x + 27$
  - faux: $x^{3} - 8 = \left(x - 2\right)\left(x^{2} - 2x + 4\right)$
    correction: $\left(x - 2\right)\left(x^{2} + 2x + 4\right)$
  - faux: $8x^{3} + 1 = \left(2x + 1\right)\left(2x^{2} - 2x + 1\right)$
    correction: $\left(2x + 1\right)\left(4x^{2} - 2x + 1\right)$
  - faux: $\left(2x - 3\right)^{5}$ commence par $2x^{5}$
    correction: il commence par $\left(2x\right)^{5} = 32x^{5}$
