  reponse_attendue: h(0) = 3 m, h(3) = 5 m ; hauteur maximale 5 m atteinte à t = 3 h
  solution: 'sin(πt/6) ≤ 1 donc h(t) ≤ 5, égalité pour πt/6 = π/2, t = 3. Barème (2 pts) : 1 pt pour h(0)
    = 3 m et h(3) = 5 m tous deux justes, 1 pt pour la hauteur maximale 5 m établie à partir de sin ≤
    1 et l''heure t = 3 (un seul point si la hauteur est donnée sans l''heure — règle jugée ambiguë, anomalie
    n° 8 du référentiel v1).'
