  competence_secondaire: null
  domaine: Donnees, proportionnalite, statistique
  objet: Juger si 6 sacs vendus 20 % plus cher que 5 000 FCFA donnent 32 000 FCFA, transport payé
  reponse_attendue: nouveau prix 6 000 FCFA ; recette transport payé 33 000 FCFA > 32 000 ; Zenabou a
    raison
  solution: '20 % de 5 000 = 1 000 FCFA, nouveau prix 6 000 FCFA ; 6 × 6 000 = 36 000 ; 36 000 - 3 000
    = 33 000 > 32 000. Conclusion : « Zenabou a raison : sa recette transport payé est de 33 000 FCFA,
    soit 1 000 FCFA de plus que l''objectif. » Barème (3 pts) : 1 pt pour le nouveau prix 6 000 FCFA ;
    1 pt pour la recette transport payé 33 000 FCFA ; 1 pt pour « elle a raison » et la conclusion appuyée
    sur 33 000 vs 32 000. Erreur propagée : un nouveau prix faux exploité correctement garde les deux
    derniers points. Le coefficient 1,2 vaut le premier point.'
  si_echoue: Augmentation d'un prix d'un pourcentage donné suivie d'un retour au contexte pour décider.
  probleme_parent: P2
