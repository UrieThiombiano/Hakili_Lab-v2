      ### ★★★ Défis de maîtrise'
    correction: 'Diagonale $\left[AC\right]$, coupant le segment des milieux en $P$. Dans $ACD$ : $P$
      milieu de $\left[AC\right]$ (réciproque) et $MP = \frac{DC}{2}$ (direct). Dans $ABC$ : $PN = \frac{AB}{2}$.
