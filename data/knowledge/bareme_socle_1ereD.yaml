  reponse_attendue: AB→(4 ; 2), AC→(-1 ; 5), AB→ · AC→ = 6 ≠ 0 ; ABC n'est pas rectangle en A
  solution: 'AB · AC = 4 × (-1) + 2 × 5 = 6. Barème : 1 pt pour les coordonnées des deux vecteurs et le
