  objet: Résoudre f(x) ≥ 0 (f décroît de (-4 ; 3) à (0 ; -5), croît à (6 ; 7)), juger le signe de f(1)
  reponse_attendue: S = [-4 ; -2] ∪ [4 ; 6] ; f(1) < 0 car f croît strictement sur [0 ; 4] et 1 < 4, f(1)
    < f(4) = 0
  solution: 'Sur [-4 ; 0], f décroît de 3 à -5 et s''annule en -2 ; sur [0 ; 6], f croît de -5 à 7 et
    s''annule en 4. Barème : 1 pt pour [-4 ; -2] ∪ [4 ; 6], bornes -2 et 4 incluses, ensemble restant
    dans [-4 ; 6] (un morceau oublié : 0,5 pt) ; 1 pt pour f(1) négatif en invoquant la croissance stricte
    sur [0 ; 4] et 1 < 4. « Négatif » sans argument de variation ne vaut rien.'
  si_echoue: Passage du sens de variation et des zéros au signe de la fonction, et prise en compte de
    l'ensemble de définition. Livret de remédiation 1ère D / Tle D, module 8.
