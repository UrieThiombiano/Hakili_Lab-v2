- niveau: TleD
  module: 1
  module_titre: 'Calculer juste : relatifs, fractions, puissances, racines carrées, identités remarquables'
  pourquoi: Une étude de fonction juste est ruinée par une fraction mal réduite ou un signe perdu. On
    remet en place les cinq gestes de calcul dont dépend tout le programme de Terminale.
  diagnostic:
  - question: $\left(-3\right) \times \left(+5\right)$ ; $7 - 2 \times \left(-4\right)$.
    reponse: $-15$ ; $15$
  - question: $\frac{2}{3} + \frac{1}{4}$ ; $\frac{5}{6} \times \frac{3}{10}$ (formes irréductibles).
    reponse: $\frac{11}{12}$ ; $\frac{1}{4}$
  - question: $\left(-3\right)^{2}$ ; $\left(-3\right)^{3}$ ; $2^{-3}$ ; $\left(2x^{3}\right)^{4}$.
    reponse: $9$ ; $-27$ ; $\frac{1}{8}$ ; $16x^{12}$
  - question: $\sqrt{49}$ ; $\sqrt{16 \times 25}$ ; $\sqrt{18}$ plus simplement.
    reponse: $7$ ; $20$ ; $3\sqrt{2}$
  - question: $10^{5} \times 10^{3}$ en puissance de $10$ ; écriture scientifique de $32\,000$.
    reponse: $10^{8}$ ; $3{,}2 \times 10^{4}$
  lecons:
  - id: TleD_M01_L1
    numero: '1.1'
    titre: Relatifs et fractions
    retenir:
    - Même signe $\to$ produit positif ; signes contraires $\to$ produit négatif.
    - Un signe moins devant une parenthèse change le signe de **chaque** terme.
    - 'Priorités : parenthèses, puissances, $\times$ et $\div$, puis $+$ et $-$ ; à rang égal, de gauche
      à droite.'
    - On ne simplifie que des **facteurs**, jamais des termes d'une somme.
    methode:
      titre: Calculer une fraction « en étages »
      etapes:
      - 'Repère la **grande barre** : elle sépare un numérateur et un dénominateur.'
      - Réduis séparément le haut et le bas à une seule fraction.
      - Remplace la division par la multiplication par l'inverse.
      - Décompose en facteurs, barre les facteurs communs, puis multiplie.
    exemple_resolu: 'Calcule $A = \left(1 + \frac{2}{3}\right) \div \left(\frac{3}{2} - \frac{4}{3}\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Réduire chaque parenthèse. | $1 + \frac{2}{3} = \frac{5}{3}$ ; $\frac{3}{2} - \frac{4}{3} = \frac{9
      - 8}{6} = \frac{1}{6}$ |

      | Diviser par $\frac{1}{6}$, c''est multiplier par $6$. | $A = \frac{5}{3} \times 6 = 10$ |

      | **Vérification :** $1{,}67 \div 0{,}17 \approx 10$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\frac{2}{3} + \frac{1}{4} = \frac{3}{7}$.
      correction: 'même dénominateur d''abord : $\frac{8}{12} + \frac{3}{12} = \frac{11}{12}$.'
    - erreur: $7 - 2 \times \left(-4\right) = -20$.
      correction: 'le produit passe avant : $7 + 8 = 15$.'
    declic: null
    figures: []
  - id: TleD_M01_L2
    numero: '1.2'
    titre: Puissances et écriture scientifique
    retenir:
    - $a^{0} = 1$ et $a^{-n} = \frac{1}{a^{n}}$ pour $a \ne 0$.
    - $a^{m} \times a^{n} = a^{m+n}$ ; $a^{m} \div a^{n} = a^{m-n}$ ; $\left(a^{m}\right)^{n} = a^{mn}$
      ; $\left(ab\right)^{n} = a^{n}b^{n}$ ; $\left(\frac{a}{b}\right)^{n} = \frac{a^{n}}{b^{n}}$. Aucune
      règle ne porte sur une **somme**.
    - 'Signe : $n$ pair, $\left(-a\right)^{n} = a^{n}$ ; $n$ impair, $\left(-a\right)^{n} = -a^{n}$.'
    - 'Écriture scientifique : $a \times 10^{n}$ avec $1 \le a < 10$ et $n$ entier relatif.'
    methode:
      titre: Réduire une expression avec puissances
      etapes:
      - Décompose les nombres en facteurs premiers ($30 = 2 \times 3 \times 5$, $12 = 2^{2} \times 3$).
      - Regroupe les puissances de **même base**.
      - Produit $\to$ ajoute les exposants ; quotient $\to$ soustrais ; puissance de puissance $\to$ multiplie.
      - Contrôle le signe avec la parité de l'exposant.
    exemple_resolu: 'Écris $A = \left(2^{10} \times 3^{7} \times 5^{4}\right) \div 30^{8}$ sous la forme
      $2^{a} \times 3^{b} \times 5^{c}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Décomposer $30$ ; l''exposant se distribue sur un produit. | $30^{8} = 2^{8} \times 3^{8} \times
      5^{8}$ |

      | Quotient de mêmes bases : soustraire base par base. | $A = 2^{2} \times 3^{-1} \times 5^{-4}$
      |

      | **Vérification :** $10 - 8 = 2$ ; $7 - 8 = -1$ ; $4 - 8 = -4$. ✓ | |'
    erreurs_frequentes:
    - erreur: $2^{3} \times 2^{5} = 2^{15}$.
      correction: 'même base, on **ajoute** : $2^{8}$. On multiplie les exposants seulement pour $\left(2^{3}\right)^{5}
        = 2^{15}$.'
    - erreur: confondre $\left(-2\right)^{4}$ et $-2^{4}$.
      correction: $\left(-2\right)^{4} = 16$ ; $-2^{4} = -16$, car seul $2$ est élevé.
    declic: null
    figures: []
  - id: TleD_M01_L3
    numero: '1.3'
    titre: Racines carrées
    retenir:
    - Pour $a \ge 0$, $\sqrt{a}$ est le nombre **positif** de carré $a$.
    - 'Pour $a \ge 0$ et $b \ge 0$ : $\sqrt{ab} = \sqrt{a}\sqrt{b}$ et $\sqrt{\frac{a}{b}} = \frac{\sqrt{a}}{\sqrt{b}}$
      si $b > 0$.'
    - 'Pour $u$ quelconque : $\sqrt{u^{2}} = |u|$.'
    - 'Simplifier, c''est sortir le plus grand carré parfait : $\sqrt{18} = \sqrt{9 \times 2} = 3\sqrt{2}$.'
    - ⚠ En général $\sqrt{a + b} \ne \sqrt{a} + \sqrt{b}$.
    methode:
      titre: Simplifier une racine, rendre un dénominateur rationnel
      etapes:
      - 'Sous le radical, cherche le plus grand carré parfait diviseur ($4$, $9$, $16$, $25$, $36$, $49$,
        $64$, $81$) : $\sqrt{k^{2}m} = k\sqrt{m}$.'
      - 'Dénominateur $\sqrt{b}$ : multiplie haut et bas par $\sqrt{b}$.'
      - 'Dénominateur $a + \sqrt{b}$ : multiplie haut et bas par le **conjugué** $a - \sqrt{b}$.'
      - Utilise $\left(a + \sqrt{b}\right)\left(a - \sqrt{b}\right) = a^{2} - b$, puis simplifie.
    exemple_resolu: 'Rends rationnel le dénominateur de $\frac{2}{1 + \sqrt{3}}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le conjugué de $1 + \sqrt{3}$ est $1 - \sqrt{3}$. | $\frac{2}{1 + \sqrt{3}} = \frac{2\left(1 -
      \sqrt{3}\right)}{\left(1 + \sqrt{3}\right)\left(1 - \sqrt{3}\right)}$ |

      | Au dénominateur, $1 - 3 = -2$ : le signe remonte. | $= \frac{2\left(1 - \sqrt{3}\right)}{-2} =
      \sqrt{3} - 1$ |

      | **Vérification :** $\sqrt{3} - 1 \approx 0{,}73$ et $\frac{2}{2{,}73} \approx 0{,}73$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\sqrt{9 + 16} = 3 + 4 = 7$.
      correction: $\sqrt{9 + 16} = \sqrt{25} = 5$.
    - erreur: $\sqrt{\left(1 - \sqrt{2}\right)^{2}} = 1 - \sqrt{2}$.
      correction: $\sqrt{u^{2}} = |u|$ ; ici $1 - \sqrt{2} < 0$, donc le résultat est $\sqrt{2} - 1$.
    declic: null
    figures: []
  - id: TleD_M01_L4
    numero: '1.4'
    titre: Identités remarquables (degré 2)
    retenir: []
    methode:
      titre: Développer ou factoriser avec une identité
      etapes:
      - 'Repère la structure : carré d''une somme, carré d''une différence, deux conjugués.'
      - 'Pour développer, écris qui est $a$ et qui est $b$ (dans $\left(3x - 2\right)^{2}$ : $a = 3x$,
        $b = 2$), puis calcule $a^{2}$, $2ab$, $b^{2}$.'
      - Pour factoriser, sors d'abord un facteur commun ; puis $A^{2} - B^{2} = \left(A - B\right)\left(A
        + B\right)$ et $A^{2} \pm 2AB + B^{2} = \left(A \pm B\right)^{2}$.
      - 'Contrôle avec $x = 1$ ou $x = 0$ : les deux formes donnent le même nombre.'
    exemple_resolu: 'Factorise $f\left(x\right) = \left(2x - 1\right)^{2} - \left(x + 3\right)^{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Différence de carrés avec $A = 2x - 1$, $B = x + 3$. | $f\left(x\right) = \left[\left(2x - 1\right)
      - \left(x + 3\right)\right]\left[\left(2x - 1\right) + \left(x + 3\right)\right]$ |

      | Réduire chaque crochet, en surveillant le signe moins. | $f\left(x\right) = \left(x - 4\right)\left(3x
      + 2\right)$ |

      | **Vérification :** $x = 0$ donne $1 - 9 = -8$ et $\left(-4\right) \times 2 = -8$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\left(a + b\right)^{2} = a^{2} + b^{2}$.
      correction: le double produit ne disparaît jamais ; $\left(3 + 4\right)^{2} = 49$ et non $25$.
    - erreur: $\left(3x\right)^{2} = 3x^{2}$.
      correction: 'l''exposant porte sur tout le produit : $9x^{2}$.'
    declic: 'factoriser, c''est préparer toute la Terminale — Un produit est nul quand l''un de ses facteurs
      est nul : $\left(x - 4\right)\left(3x + 2\right) = 0$ donne $x = 4$ ou $x = -\frac{2}{3}$. Tableaux
      de signes, forme canonique $x^{2} + 6x + 5 = \left(x + 3\right)^{2} - 4$, levée d''indéterminations
      : tout part de là.'
    figures:
    - figures/m01_f5.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Calcule : a) $\left(-8\right) \times \left(-3\right)$ ; b) $\frac{1}{2} + \frac{1}{3}$ ;
      c) $\frac{4}{5} \div \frac{2}{3}$.'
    correction: a) $+24$ ; b) $\frac{5}{6}$ ; c) $\frac{4}{5} \times \frac{3}{2} = \frac{6}{5}$.
  - numero: 2
    etoiles: 1
    enonce: 'Donne sous forme irréductible : $B = \left(\frac{3}{2} + \frac{2}{3} + 4 \times \frac{1}{3}
      + \frac{5}{4}\right) \div \left(\frac{3}{4} - \frac{1}{8}\right)$.'
    correction: 'Haut : $\frac{18 + 8 + 16 + 15}{12} = \frac{19}{4}$ ; bas : $\frac{5}{8}$ ; $B = \frac{19}{4}
      \times \frac{8}{5} = \frac{38}{5}$.'
  - numero: 3
    etoiles: 1
    enonce: 'Calcule et donne le résultat sous forme de fraction irréductible : a) $A = \frac{1}{3} +
      \frac{1}{4} - \frac{1}{8}$ ; b) $B = \frac{2}{3} - 4 + \frac{1}{5}$ ; c) $C = \frac{1}{7} + \frac{2}{7}
      - \frac{1}{3}$ ; d) $D = \frac{1}{5} + \left(\frac{1}{3} + \frac{4}{5}\right) - \frac{5}{15} + \frac{33}{165}$
      ; e) $E = \frac{1}{3} + \frac{1}{2}\left(\frac{1}{4} + \frac{2}{3}\right) - \frac{1}{8}$.'
    correction: a) $\frac{11}{24}$ ; b) $-\frac{47}{15}$ ; c) $\frac{3}{7} - \frac{1}{3} = \frac{2}{21}$
      ; d) $\frac{5}{15} = \frac{1}{3}$ et $\frac{33}{165} = \frac{1}{5}$, donc $D = \frac{6}{5}$ ; e)
      $\frac{1}{4} + \frac{2}{3} = \frac{11}{12}$, donc $E = \frac{2}{3}$.
  - numero: 4
    etoiles: 1
    enonce: 'Calcule et donne le résultat sous forme de fraction irréductible : $C = \left(1 + \frac{2}{3}\right)
      \div \left[\left(1 - \frac{1}{2}\right)\left(1 + \frac{2}{5}\right)\right] + \frac{7}{8}$.'
    correction: $\frac{1}{2} \times \frac{7}{5} = \frac{7}{10}$ ; $\frac{5}{3} \div \frac{7}{10} = \frac{50}{21}$
      ; $C = \frac{50}{21} + \frac{7}{8} = \frac{547}{168}$.
  - numero: 5
    etoiles: 1
    enonce: 'Écris sous la forme d''une seule puissance : a) $2^{3} \times 2^{5}$ ; b) $\left(10^{4} \times
      10^{2}\right) \div 10^{3}$ ; c) $\left(3^{2}\right)^{3}$ ; d) $5^{-2} \times 5^{4}$.'
    correction: a) $2^{8}$ ; b) $10^{3}$ ; c) $3^{6}$ ; d) $5^{2}$.
  - numero: 6
    etoiles: 1
    enonce: 'Écris en notation scientifique : a) $0{,}0000000103$ ; b) cinq millions de milliards ; c)
      douze milliardièmes.'
    correction: a) $1{,}03 \times 10^{-8}$ ; b) $5 \times 10^{15}$ ; c) $1{,}2 \times 10^{-8}$.
  - numero: 7
    etoiles: 1
    enonce: 'Calcule : a) $5^{1}$ ; b) $2^{-5}$ ; c) $\left(-1\right)^{12}$ ; d) $\left(-1\right)^{15}$.'
    correction: a) $5$ ; b) $\frac{1}{32}$ ; c) $1$ ; d) $-1$.
  - numero: 8
    etoiles: 1
    enonce: 'Écris sous la forme $2^{m} \times 3^{n}$ ($m$, $n$ entiers relatifs) : a) $27^{2}$ ; b) $\left(3^{3}\right)^{2}
      \times 2^{4}$ ; c) $\left(\frac{1}{4}\right)^{2} \times \left(\frac{2}{3}\right)^{3}$ ; d) $\frac{81
      \times 2^{2}}{2^{3} \times 3^{-4}}$.'
    correction: a) $3^{6}$ ; b) $2^{4} \times 3^{6}$ ; c) $2^{-1} \times 3^{-3}$ ; d) $2^{-1} \times 3^{8}$.
  - numero: 9
    etoiles: 1
    enonce: 'Donne l''écriture scientifique de : a) $\left(3 \times 10^{4}\right) \times \left(2 \times
      10^{-7}\right)$ ; b) $\left(6 \times 10^{5}\right) \div \left(2 \times 10^{2}\right)$.'
    correction: a) $6 \times 10^{-3}$ ; b) $3 \times 10^{3}$.
  - numero: 10
    etoiles: 1
    enonce: 'Donne la notation scientifique de : a) $167{,}15 \times 10^{-15}$ ; b) la distance Terre–Soleil,
      égale à 150 millions de km, exprimée en mètres.'
    correction: a) $1{,}6715 \times 10^{-13}$ ; b) $1{,}5 \times 10^{11}$ m.
  - numero: 11
    etoiles: 1
    enonce: 'Écris plus simplement : a) $\sqrt{18}$ ; b) $\sqrt{48}$ ; c) $\sqrt{75}$ ; d) $\sqrt{16 \times
      9}$.'
    correction: a) $3\sqrt{2}$ ; b) $4\sqrt{3}$ ; c) $5\sqrt{3}$ ; d) $12$.
  - numero: 12
    etoiles: 1
    enonce: 'Écris sous la forme $a\sqrt{b}$ ($a$ entier, $b$ sans carré) : $\sqrt{32} + \sqrt{98} - 5\sqrt{72}$.'
    correction: $4\sqrt{2} + 7\sqrt{2} - 30\sqrt{2} = -19\sqrt{2}$.
  - numero: 13
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : a) $x^{2} = 5$ ; b) $x^{2} = -3$.'
    correction: a) $x = \sqrt{5}$ ou $x = -\sqrt{5}$ ; b) pas de solution réelle.
  - numero: 14
    etoiles: 1
    enonce: 'Écris sans radical au dénominateur : a) $\frac{\sqrt{3}}{\sqrt{7} + \sqrt{3}}$ ; b) $\frac{2}{3
      - \sqrt{5}}$.'
    correction: a) $\frac{\sqrt{21} - 3}{4}$ ; b) $\frac{3 + \sqrt{5}}{2}$.
  - numero: 15
    etoiles: 1
    enonce: 'Rends rationnel le dénominateur : a) $\frac{1}{\sqrt{3} - 1}$ ; b) $\frac{\sqrt{5} + 1}{\sqrt{5}
      - 1}$ ; c) $\frac{1}{\sqrt{7} - \sqrt{5}}$.'
    correction: a) $\frac{\sqrt{3} + 1}{2}$ ; b) $\frac{3 + \sqrt{5}}{2}$ ; c) $\frac{\sqrt{7} + \sqrt{5}}{2}$.
  - numero: 16
    etoiles: 1
    enonce: 'Rends rationnel le dénominateur et simplifie : a) $\frac{1}{\sqrt{3} - \sqrt{2}}$ ; b) $\frac{\sqrt{5}
      + \sqrt{2}}{\sqrt{5} - \sqrt{2}}$.'
    correction: a) $\sqrt{3} + \sqrt{2}$ ; b) $\frac{7 + 2\sqrt{10}}{3}$.
  - numero: 17
    etoiles: 1
    enonce: 'Écris sous la forme $a + b\sqrt{n}$ ($a$, $b$ rationnels, $n$ entier naturel) : a) $\frac{1}{\sqrt{7}
      - 1}$ ; b) $\frac{\sqrt{2}}{\sqrt{2} - 1}$.'
    correction: a) $\frac{1}{6} + \frac{1}{6}\sqrt{7}$ ; b) $2 + \sqrt{2}$.
  - numero: 18
    etoiles: 1
    enonce: 'Développe : a) $\left(x + 5\right)^{2}$ ; b) $\left(3x - 2\right)^{2}$ ; c) $\left(2x + 1\right)\left(2x
      - 1\right)$.'
    correction: a) $x^{2} + 10x + 25$ ; b) $9x^{2} - 12x + 4$ ; c) $4x^{2} - 1$.
  - numero: 19
    etoiles: 1
    enonce: 'Factorise : a) $k\left(x\right) = 81 - \left(2x + 1\right)^{2}$ ; b) $l\left(x\right) = 2x^{2}
      - 8x + 8 - \left(x^{2} - 2x\right)$.


      ### Entraînement ★★'
    correction: a) $\left[9 - \left(2x + 1\right)\right]\left[9 + \left(2x + 1\right)\right] = 4\left(4
      - x\right)\left(5 + x\right)$ ; b) $x^{2} - 6x + 8 = \left(x - 2\right)\left(x - 4\right)$.
  - numero: 20
    etoiles: 2
    enonce: 'Calcule : a) $A = \frac{1 + \frac{1}{3}}{1 + \frac{1}{4}} + \frac{1 - \frac{1}{4}}{1 - \frac{1}{3}}$
      ; b) $B = \frac{1 + \frac{1}{2} + \frac{1}{3}}{\frac{3}{4} + \frac{1}{7} - \frac{1}{3}}$ ; c) $C
      = \frac{\frac{50}{7}}{\frac{11}{20}} \times \frac{\frac{9}{40}}{\frac{15}{7}}$ ; d) $D = \frac{\frac{4}{7}
      \times \frac{15}{8}}{\frac{11}{7} \times \frac{8}{45}}$.'
    correction: a) $\frac{16}{15} + \frac{9}{8} = \frac{263}{120}$ ; b) $\frac{11}{6} \times \frac{84}{47}
      = \frac{154}{47}$ ; c) $\frac{5}{3} \times \frac{9}{11} = \frac{15}{11}$ ; d) $\frac{15}{14} \times
      \frac{315}{88} = \frac{675}{176}$.
  - numero: 21
    etoiles: 2
    enonce: 'Calcule : a) $A = \cfrac{1}{1 + \cfrac{1}{1 + \cfrac{1}{1 + \frac{1}{2}}}}$ ; b) $B = \cfrac{1}{1
      + \cfrac{1}{1 + \cfrac{1}{1 + \frac{1}{3}}}}$.'
    correction: On remonte de l'intérieur. a) $\frac{3}{2} \to \frac{5}{3} \to \frac{8}{5}$, donc $A =
      \frac{5}{8}$ ; b) $\frac{4}{3} \to \frac{7}{4} \to \frac{11}{7}$, donc $B = \frac{7}{11}$.
  - numero: 22
    etoiles: 2
    enonce: 'Calcule : a) $A = \left(1 + \frac{1}{2} + \frac{1}{4} + \frac{1}{48} + \frac{1}{96}\right)
      \times \left(\frac{1}{2} - \frac{1}{48} - \frac{1}{96}\right)$ ; b) $B = \left(2 - \frac{11}{4}
      + \frac{7}{8} + \frac{1}{4}\right) \times \left(1 + \frac{7}{8} + \frac{11}{4} - \frac{5}{12}\right)$.'
    correction: a) $\frac{57}{32} \times \frac{15}{32} = \frac{855}{1024}$ ; b) $\frac{3}{8} \times \frac{101}{24}
      = \frac{101}{64}$.
  - numero: 23
    etoiles: 2
    enonce: 'Calcule : a) $A = \frac{1 + \frac{1}{2}}{\frac{1}{4} - \frac{1}{3}} : \frac{\frac{1}{6} -
      \frac{1}{5}}{\frac{1}{7} + \frac{1}{8}}$ ; b) $B = \frac{\frac{1}{3} + \frac{1}{4} + \frac{1}{5}}{\frac{1}{3}
      - \frac{1}{5} + \frac{1}{6}} : \frac{1 - \frac{1}{2}}{1 + \frac{1}{3}}$.'
    correction: a) $-18 \div \left(-\frac{28}{225}\right) = \frac{2025}{14}$ ; b) $\frac{47}{18} \times
      \frac{8}{3} = \frac{188}{27}$.
  - numero: 24
    etoiles: 2
    enonce: 'Calcule : a) $A = \frac{\frac{7}{3} + \frac{1}{4}}{5} + \frac{5}{\frac{7}{3} + \frac{1}{4}}
      - \frac{31}{60}$ ; b) $B = \frac{1 + \frac{1}{2}}{1 + \frac{1}{3}} + \frac{1 + \frac{1}{3}}{1 +
      \frac{1}{2}}$.'
    correction: a) $\frac{7}{3} + \frac{1}{4} = \frac{31}{12}$, donc $A = \frac{31}{60} + \frac{60}{31}
      - \frac{31}{60} = \frac{60}{31}$ ; b) $\frac{9}{8} + \frac{8}{9} = \frac{145}{72}$.
  - numero: 25
    etoiles: 2
    enonce: 'Calcule : a) $A = \left(\frac{1 + \frac{1}{2}}{1 + \frac{1}{3}}\right) \times \left(1 - \frac{1}{2}
      + \frac{1}{3}\right) \times \left(\frac{2}{3} - \frac{1}{4}\right)$ ; b) $B = \left(\frac{1}{3}
      - \frac{1}{4}\right) \times \left(\frac{1}{2} + \frac{1}{6}\right) \times \left(\frac{1 + \frac{1}{2}}{1
      - \frac{1}{3}}\right)$.'
    correction: a) $\frac{9}{8} \times \frac{5}{6} \times \frac{5}{12} = \frac{25}{64}$ ; b) $\frac{1}{12}
      \times \frac{2}{3} \times \frac{9}{4} = \frac{1}{8}$.
  - numero: 26
    etoiles: 2
    enonce: 'Écris sous la forme $2^{p} \times 3^{q}$ ($p$, $q$ entiers relatifs) : a) $A = \frac{4^{2}
      \times 9^{3}}{64}$ ; b) $B = \frac{6^{3} \times 36}{2^{5} \times 3^{2}}$ ; c) $C = \frac{\left(3^{2}\right)^{3}
      \times 2^{5}}{32 \times 3^{4}}$ ; d) $D = \frac{128}{\left(2^{5}\right)^{4} \times 9}$ ; e) $E =
      \frac{\left(2^{5}\right)^{3} \times 3^{2}}{2^{-4} \times 3^{7}}$ ; f) $F = \frac{\left(2^{-3}\right)^{2}
