    correction: '$\mathbb{N}$ : $0$ ; $+7$. $\mathbb{Z}$ : $-4$ ; $0$ ; $+7$. 𝔻 : les cinq nombres.'
  - numero: 5
    etoiles: 1
    enonce: Un ascenseur part du niveau $0$, descend au sous-sol $3$, puis monte à l'étage $5$. Note les
