    correction: 'a) $\Delta = 49$ : $5$ ou $-2$. b) $\Delta = 49$ : $\frac{3}{2}$ ou $-2$. c) $\Delta
      = -3 < 0$ : aucune solution. d) $\Delta = 0$ : racine double $\frac{3}{2}$.'
  - numero: 13
    etoiles: 1
    enonce: 'Factorise dans $\mathbb{R}$ si possible : a) $x^{2} - x - 12$ ; b) $2x^{2} - 8x + 6$ ; c)
      $x^{2} + 4$.


      ### Entraînement ★★'
    correction: 'a) $\left(x - 4\right)\left(x + 3\right)$. b) $2\left(x - 1\right)\left(x - 3\right)$.
