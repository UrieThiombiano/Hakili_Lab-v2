  reponse_attendue: 45 000 FCFA < 60 000 FCFA ; il manque 15 000 FCFA
  solution: '37 500 + 7 500 = 45 000 FCFA, et 45 000 < 60 000 ; il manque 60 000 - 45 000 = 15 000 FCFA.
    Conclusion attendue : « L''association ne peut pas payer le forage : il lui manque 15 000 FCFA. »
    Barème (3 pts) : 1 pt pour le total disponible 45 000 FCFA, 1 pt pour la comparaison avec 60 000 FCFA,
    1 pt pour la phrase de conclusion donnant la somme manquante 15 000 FCFA.'
