    correction: 'a) Racines $1$ et $3$, $a > 0$ : $\left]-\infty\,;\,1\right[ \cup \left]3\,;\,+\infty\right[$.
      b) $\Delta = 9$, racines $\frac{1}{2}$ et $2$, $a < 0$ : $\left[\frac{1}{2}\,;\,2\right]$. c) $\Delta
      = -16 < 0$, $a > 0$ : aucune solution.'
  - numero: 17
    etoiles: 2
    enonce: 'Résous dans $\mathbb{R}$ : a) $x^{2} \ge 16$ ; b) $\left(x - 1\right)^{2} \le 4$ ; c) $\frac{x^{2}
      - 9}{x} \ge 0$.'
    correction: 'a) $\left]-\infty\,;\,-4\right] \cup \left[4\,;\,+\infty\right[$. b) $|x - 1| \le 2$
      : $\left[-1\,;\,3\right]$. c) Racines $\pm 3$, interdit $0$ : $\left[-3\,;\,0\right[ \cup \left[3\,;\,+\infty\right[$.'
  - numero: 18
    etoiles: 2
    enonce: '*(Koudougou.)* Un tisserand vend $x$ pagnes de Faso Dan Fani par jour ($0 \le x \le 40$).
      Son bénéfice quotidien, en milliers de FCFA, est $B\left(x\right) = -x^{2} + 36x - 155$. a) Résous
      $B\left(x\right) = 0$. b) Pour quelles quantités le bénéfice est-il strictement positif ? c) Vérifie
      que $B\left(18\right) = 169$ et interprète.'
    correction: 'a) $\Delta = 676 = 26^{2}$ : $x = 5$ ou $x = 31$. b) $a < 0$ : $B\left(x\right) > 0$
      pour $5 < x < 31$. c) $B\left(18\right) = -324 + 648 - 155 = 169$ : $18$ est le sommet, le bénéfice
      maximal vaut $169\,000$ FCFA par jour.'
  - numero: 19
    etoiles: 2
    enonce: '*(Trouve l''erreur.)* Pour résoudre $\frac{6}{x} \ge 2$, Didier multiplie par $x$ et écrit
      : « $6 \ge 2x$, donc $x \le 3$ ; $S = \left]-\infty\,;\,3\right]$ ». Or $x = -1$ donne $-6$, qui
      n''est pas $\ge 2$. Explique l''erreur, puis résous avec un tableau de signes (étudier $\frac{6
      - 2x}{x}$).'
    correction: 'Didier multiplie par $x$ sans en connaître le signe. $\frac{6}{x} \ge 2 \iff \frac{6
      - 2x}{x} \ge 0$ ; racine $3$, interdit $0$ : $S = \left]0\,;\,3\right]$.'
  - numero: 20
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Explique en quelques lignes, avec un exemple, pourquoi un trinôme
      de discriminant strictement positif est « du signe de $a$ à l''extérieur des racines », en t''appuyant
      sur $a\left(x - x_{1}\right)\left(x - x_{2}\right)$.


      ### ★★★ Défis de maîtrise'
    correction: 'Avec $\Delta > 0$, $ax^{2} + bx + c = a\left(x - x_{1}\right)\left(x - x_{2}\right)$.
      À l''extérieur, les deux facteurs ont le même signe : produit positif, donc signe de $a$. Entre
      les racines, signes contraires : signe de $-a$. Exemple : $\left(x - 2\right)\left(x - 3\right)$
      vaut $6 > 0$ en $0$ et $-0{,}25 < 0$ en $2{,}5$.'
  - numero: 21
    etoiles: 3
    enonce: a) Un trinôme $f\left(x\right) = ax^{2} + bx + c$ a pour racines $-2$ et $5$, et $f\left(0\right)
      = -20$. Retrouve $a$, $b$, $c$, puis le sommet de sa parabole. b) Un trinôme $g$ est strictement
      négatif sur $\left]-\infty\,;\,1\right[$, strictement positif sur $\left]1\,;\,4\right[$, strictement
      négatif sur $\left]4\,;\,+\infty\right[$. Que dire du signe de son coefficient dominant et de son
      discriminant ? Justifie.
    correction: '*Démarche :* connaissant les racines, on part de la forme factorisée, où une seule inconnue
      subsiste ; $f\left(0\right)$ la fixe.

      a) $f\left(x\right) = a\left(x + 2\right)\left(x - 5\right)$ ; $f\left(0\right) = -10a = -20$ donc
      $a = 2$, d''où $f\left(x\right) = 2x^{2} - 6x - 20$ : $a = 2$, $b = -6$, $c = -20$. Sommet : $x
      = \frac{3}{2}$ (demi-somme des racines), $f\left(\frac{3}{2}\right) = -\frac{49}{2}$, soit $\left(\frac{3}{2}\,;\,-\frac{49}{2}\right)$,
      un minimum car $a > 0$.

      b) Deux changements de signe, donc deux racines : $\Delta > 0$. $g$ est négatif à l''extérieur des
      racines, donc son coefficient dominant est **strictement négatif** : $g\left(x\right) = a\left(x
      - 1\right)\left(x - 4\right)$ avec $a < 0$.'
  - numero: 22
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Si le discriminant d''un trinôme est strictement positif, ce trinôme change deux fois de signe
      sur $\mathbb{R}$.

      b) Un trinôme de discriminant strictement négatif n''a pas de signe constant sur $\mathbb{R}$.

      c) L''ensemble des solutions de $\frac{x - 1}{x - 3} \geq 0$ est $\left]-\infty\,;\,1\right] \cup
      \left[3\,;\,+\infty\right[$.

      d) Pour tout réel $x$, $x^{2} + x + 1 > 0$.'
    correction: '*Démarche :* trois questions de cours sur le signe, une sur les valeurs interdites d''un
      quotient.

      a) **Vrai** : $a\left(x - x_{1}\right)\left(x - x_{2}\right)$ est du signe de $a$, puis de $-a$,
      puis de $a$.

      b) **Faux** : si $\Delta < 0$, le trinôme garde le signe de $a$. Contre-exemple : $x^{2} + x + 1
      > 0$ partout.

      c) **Faux** : $3$ est valeur interdite, donc $S = \left]-\infty\,;\,1\right] \cup \left]3\,;\,+\infty\right[$.

      d) **Vrai** : $\Delta = -3 < 0$ et $a = 1 > 0$ ; ou $\left(x + \frac{1}{2}\right)^{2} + \frac{3}{4}
      > 0$.'
  - numero: 23
    etoiles: 3
    enonce: On considère l'équation $x^{2} - 2mx + m - 1 = 0$, d'inconnue $x$, où $m$ est un réel. a)
      Démontre qu'elle admet toujours deux solutions distinctes. b) Pour quelle valeur de $m$ les solutions
      sont-elles opposées ? Donne-les. c) Existe-t-il une valeur de $m$ pour laquelle elles sont inverses
      l'une de l'autre ?
    correction: '*Démarche :* « quel que soit $m$ » impose d''étudier $\Delta$ comme un trinôme en $m$,
      avec son propre discriminant ; en b) et c), les relations somme-produit suffisent.

      a) $\Delta = 4m^{2} - 4m + 4 = 4\left(m^{2} - m + 1\right)$ ; le trinôme $m^{2} - m + 1$ a pour
      discriminant $-3 < 0$ et coefficient $1 > 0$ : il est toujours positif. Donc $\Delta > 0$ pour tout
      $m$ : deux solutions distinctes.

      b) Opposées $\iff x_{1} + x_{2} = 2m = 0 \iff m = 0$. L''équation devient $x^{2} - 1 = 0$ : solutions
      $-1$ et $1$.

      c) Inverses $\iff x_{1}x_{2} = m - 1 = 1 \iff m = 2$. L''équation $x^{2} - 4x + 1 = 0$ a pour solutions
      $2 \pm \sqrt{3}$, de produit $1$ ✓. Oui, pour $m = 2$.'
  - numero: 24
    etoiles: 3
    enonce: 'Résous dans $\mathbb{R}$ : $\frac{x^{2} - 4}{x^{2} - 5x + 6} \leq 0$. Le corrigé devra comporter
      l''ensemble de définition, un tableau de signes complet et un ensemble de solutions en réunion d''intervalles.'
    correction: '*Démarche :* on écrit l''ensemble de définition **avant** de simplifier, sinon la valeur
      interdite $2$ disparaît.

      $x^{2} - 5x + 6 = \left(x - 2\right)\left(x - 3\right)$ : il faut $x \ne 2$ et $x \ne 3$. Alors
      $\frac{x^{2} - 4}{x^{2} - 5x + 6} = \frac{x + 2}{x - 3}$.


      | $x$ | $-\infty$ | | $-2$ | | $3$ | | $+\infty$ |

      |---|---|---|---|---|---|---|---|

      | $x + 2$ | | $-$ | $0$ | $+$ | | $+$ | |

      | $x - 3$ | | $-$ | | $-$ | $0$ | $+$ | |

      | quotient | | $+$ | $0$ | $-$ | ‖ | $+$ | |


      Négatif ou nul sur $\left[-2\,;\,3\right[$, dont on retire $2$ : $S = \left[-2\,;\,2\right[ \cup
      \left]2\,;\,3\right[$.'
  - numero: 25
    etoiles: 3
    enonce: 'Voici la copie de Moussa, qui devait résoudre $\frac{2}{x - 1} \leq 3$. Trouve la ligne fausse,
      explique le geste interdit, puis rédige la résolution correcte avec un tableau de signes. Vérifie
      que $x = 0$ est solution, alors que la copie l''exclut.


      | Ligne | Ce que Moussa a écrit |

      |---|---|

      | 1 | $\frac{2}{x - 1} \leq 3$ |

      | 2 | donc $2 \leq 3\left(x - 1\right)$ |

      | 3 | $2 \leq 3x - 3$, donc $x \geq \frac{5}{3}$ |

      | 4 | $S = \left[\frac{5}{3}\,;\,+\infty\right[$ |'
    correction: '*Démarche :* le geste interdit est la multiplication par $x - 1$, de signe inconnu ;
      on ramène tout d''un côté.

      **La ligne 2 est fausse** : si $x < 1$, le facteur $x - 1$ est négatif et l''inégalité doit changer
      de sens ; toute la branche $x < 1$ est perdue.

      $\frac{2}{x - 1} \leq 3 \iff \frac{2 - 3\left(x - 1\right)}{x - 1} \leq 0 \iff \frac{5 - 3x}{x -
      1} \leq 0$, avec $x \ne 1$.


      | $x$ | $-\infty$ | | $1$ | | $\frac{5}{3}$ | | $+\infty$ |

      |---|---|---|---|---|---|---|---|

      | $5 - 3x$ | | $+$ | | $+$ | $0$ | $-$ | |

      | $x - 1$ | | $-$ | $0$ | $+$ | | $+$ | |

      | quotient | | $-$ | ‖ | $+$ | $0$ | $-$ | |


      $S = \left]-\infty\,;\,1\right[ \cup \left[\frac{5}{3}\,;\,+\infty\right[$. Pour $x = 0$ : $\frac{2}{-1}
      = -2 \leq 3$ ✓, donc $0$ est bien solution.'
  - numero: 26
    etoiles: 3
    enonce: Un maraîcher de Loumbila dispose de $60$ m de grillage pour clôturer un enclos rectangulaire
      adossé au mur de son hangar, le mur remplaçant un côté. Détermine les dimensions rendant l'aire
      maximale, et cette aire. Peut-il atteindre $500$ m² ? Justifie sans essais numériques.
    correction: '*Démarche :* le mur remplace un côté, donc le grillage n''en couvre que trois ; on ramène
      l''aire à une fonction d''une variable.

      Avec $x$ la longueur des deux côtés perpendiculaires au mur : $2x + y = 60$, donc $y = 60 - 2x$
      et $0 < x < 30$. L''aire vaut $\mathcal{A}\left(x\right) = -2x^{2} + 60x$, maximale en $x = -\frac{60}{-4}
      = 15$, d''où $y = 30$ et $\mathcal{A}\left(15\right) = 450$.

      L''enclos optimal mesure $15$ m sur $30$ m, pour $450$ m². Les $500$ m² sont impossibles : $-2x^{2}
      + 60x = 500$ donne $x^{2} - 30x + 250 = 0$, de discriminant $-100 < 0$, donc aucune solution réelle.


      ---'
  fiche_revision:
  - '**Affine.** $ax + b$ s''annule en $-\frac{b}{a}$, signe de $a$ après.'
  - '**Produit, quotient.** Une ligne par facteur, règle des signes colonne par colonne.'
  - '**Valeur interdite.** Double barre ‖, jamais solution.'
  - '**Discriminant.** $\Delta = b^{2} - 4ac$ ; racines $\frac{-b \pm \sqrt{\Delta}}{2a}$ si $\Delta >
    0$.'
  - '**Signe du trinôme.** Signe de $a$ à l''extérieur des racines, de $-a$ entre.'
  - '**$\Delta < 0$.** Signe constant, égal à celui de $a$.'
  - '**Somme, produit.** $-\frac{b}{a}$ et $\frac{c}{a}$ ; racine évidente $1$ si $a + b + c = 0$.'
  - '**Inéquation.** Jamais sans tableau de signes.'
  trouve_erreur:
  - faux: $x^{2} \le 9 \iff x \le 3$
    correction: $x^{2} \le 9 \iff -3 \le x \le 3$
  - faux: $\frac{x + 1}{x - 2} \ge 0$ donc $2$ est solution
    correction: '$2$ est valeur interdite : crochet ouvert'
  - faux: $\frac{6}{x} \ge 2$ donc $6 \ge 2x$
    correction: 'On ne multiplie pas par $x$ : tableau de signes'
  - faux: $\Delta < 0$ donc l'inéquation n'a pas de solution
    correction: '$\Delta < 0$ : le trinôme garde le signe de $a$'
  cartographie_lacunes: []
  source_path: remediation\1ereD\modules_c\M07.md
- niveau: 1ereD
  module: 8
  module_titre: 'Fonctions : vocabulaire et lecture graphique'
  pourquoi: 'Tout sujet d''analyse commence par « Soit $f$ la fonction définie sur… ». Image, antécédent,
    ensemble de définition, variations, parité : c''est ta langue de travail jusqu''au bac.'
  diagnostic:
  - question: Soit $f\left(x\right) = \frac{x + 1}{x - 2}$. Détermine $D_{f}$.
    reponse: $D_{f} = \mathbb{R} \setminus \{2\}$
  - question: Soit $g\left(x\right) = x^{2} - 3$. Calcule l'image de $2$, puis trouve les antécédents
      de $1$.
    reponse: $g\left(2\right) = 1$ ; $x^{2} = 4$, donc $x = 2$ ou $x = -2$
  - question: Une fonction $h$ vérifie $h\left(3\right) = 7$. Traduis avec les mots « image » et « antécédent
      ».
    reponse: 7 est l'**image** de 3 ; 3 est un **antécédent** de 7
  - question: La fonction $x \mapsto x^{2}$ est-elle croissante ou décroissante sur $\left[0\,;\,+\infty\right[$
      ? Et sur $\left]-\infty\,;\,0\right]$ ?
    reponse: croissante puis décroissante
  - question: 'Vrai ou faux : « un réel peut avoir deux images par une même fonction ».'
    reponse: faux, l'image est **unique**
  lecons:
  - id: 1ereD_M08_L1
    numero: '8.1'
    titre: Fonction, image, antécédent, ensemble de définition
    retenir:
    - '$f\left(x\right)$ est l''**image** de $x$ : elle est **unique**.'
    - '$x$ est **un antécédent** de $y$ si $f\left(x\right) = y$ : un réel a **zéro, un ou plusieurs**
      antécédents.'
    - $D_{f}$ est l'ensemble des réels $x$ pour lesquels $f\left(x\right)$ **existe**.
    - 'Courbe : $M\left(a\,;\,b\right) \in \mathcal{C}_{f}$ équivaut à $b = f\left(a\right)$.'
    methode:
      titre: Déterminer un ensemble de définition
      etapes:
      - 'Repère les **opérations à risque** : dénominateur ($\ne 0$), racine carrée (contenu $\ge 0$).'
      - Écris les **conditions** et résous-les (tableau de signes si besoin, Module 7).
      - 'Plusieurs conditions valent **en même temps** : on garde l''intersection.'
      - Donne $D_{f}$ en intervalle ou en réunion d'intervalles.
    exemple_resolu: 'Détermine l''ensemble de définition de : a) $f\left(x\right) = \frac{2x + 1}{x^{2}
      - 9}$ ; b) $g\left(x\right) = \sqrt{5 - x}$ ; c) $h\left(x\right) = \frac{\sqrt{x - 1}}{x - 4}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) Seule opération à risque : le dénominateur, non nul. | $x^{2} - 9 \ne 0$, donc $D_{f} = \mathbb{R}
      \setminus \{-3\,;\,3\}$ |

      | b) Racine carrée : le contenu est positif ou nul. | $5 - x \ge 0$, donc $D_{g} = ]-\infty\,;\,5]$
      |

      | c) Deux conditions simultanées : demi-droite $x \ge 1$, trou en 4. | $x - 1 \ge 0$ **et** $x -
      4 \ne 0$, donc $D_{h} = [1\,;\,4[ \cup ]4\,;\,+\infty[$ |

      | **Vérification :** $h\left(1\right) = \frac{0}{-3} = 0$ existe ; $g\left(6\right) = \sqrt{-1}$
      n''existe pas. ✓ | |'
    erreurs_frequentes:
    - erreur: confondre image et antécédent.
      correction: « calcule $f\left(5\right)$ » est un calcul ; « résous $f\left(x\right) = 5$ » est une
        équation.
    - erreur: écrire $\ge 0$ pour une racine placée au dénominateur.
      correction: 'dans $\frac{1}{\sqrt{x - 2}}$, les deux conditions se cumulent : $x - 2 > 0$, **strictement**.'
    declic: ce vocabulaire rapporte des points dès la première ligne — Une image se calcule, un antécédent
      se résout. Et les valeurs interdites de $D_{f}$ donneront, en Tle D, les **asymptotes verticales**.
    figures: []
  - id: 1ereD_M08_L2
    numero: '8.2'
    titre: Sens de variation et tableau de variations
    retenir:
    - '$f$ **croissante** : $f\left(a\right) \le f\left(b\right)$, elle **conserve l''ordre** (la courbe
      monte).'
    - '$f$ **décroissante** : $f\left(a\right) \ge f\left(b\right)$, elle **inverse l''ordre** (la courbe
      descend).'
    - 'Le **tableau de variations** : une ligne pour $x$ avec les valeurs charnières, une ligne pour $f$
      avec les flèches et les valeurs aux virages.'
    - '**Maximum** et **minimum** : les valeurs **atteintes** les plus grande et plus petite, cherchées
      aux changements de flèche et aux bornes.'
    methode:
      titre: Lire une courbe ou un tableau de variations
      etapes:
      - '**Image de $a$ :** de $a$ sur l''axe horizontal jusqu''à la courbe, lis l''ordonnée.'
      - '**Antécédents de $k$ :** trace $y = k$ à la règle ; les abscisses des intersections sont les
        antécédents, leur nombre est le nombre de solutions de $f\left(x\right) = k$.'
      - '**Signe :** $f\left(x\right) > 0$ là où la courbe est **au-dessus** de l''axe des abscisses.'
      - Les **extremums** se lisent aux changements de flèche.
    exemple_resolu: 'Sur la courbe de la figure 8.1, définie sur $[-3\,;\,5]$ : a) l''image de 1 ; b)
      les antécédents de 0 et le signe de $f\left(x\right)$ ; c) le nombre de solutions de $f\left(x\right)
      = 3$, puis de $f\left(x\right) = 5$ ; d) les extremums.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) Je monte depuis l''abscisse 1 jusqu''à la courbe. | $f\left(1\right) = 3$ |

      | b) Abscisses des points de rencontre avec l''axe ; le signe change à chaque traversée. | $-2$
      ; $2$ ; $4$ ; $f\left(x\right) > 0$ sur $]-2\,;\,2[ \cup ]4\,;\,5]$, $f\left(x\right) < 0$ sur $[-3\,;\,-2[
      \cup ]2\,;\,4[$ |

      | c) et d) Je trace les horizontales $y = 3$ et $y = 5$, puis je compare les virages et les bornes.
      | $f\left(x\right) = 3$ : **2 solutions** ; $f\left(x\right) = 5$ : **aucune** ; $\max f = 4$ en
      $x = 0$, $\min f = -2$ en $x = 3$ |

      | **Vérification :** aucune horizontale au-dessus de 4 ne coupe la courbe. ✓ | |'
    erreurs_frequentes:
    - erreur: comparer deux nombres situés de part et d'autre d'un virage.
      correction: un sens de variation ne compare que deux nombres du **même** intervalle ; et une fonction
        décroissante **inverse** l'ordre.
    - erreur: confondre le maximum et l'abscisse où il est atteint.
      correction: 'le maximum est une **ordonnée** : « le maximum est 4, atteint pour $x = 0$ », deux
        nombres, deux rôles.'
    declic: null
    figures:
    - figures/m08_f6.svg
  - id: 1ereD_M08_L3
    numero: '8.3'
    titre: Parité et fonctions de référence
    retenir:
    - '$f$ est **paire** si, pour tout $x$ de $D_{f}$, $-x \in D_{f}$ et $f\left(-x\right) = f\left(x\right)$
      : courbe **symétrique par rapport à l''axe des ordonnées**.'
    - '$f$ est **impaire** si, pour tout $x$ de $D_{f}$, $-x \in D_{f}$ et $f\left(-x\right) = -f\left(x\right)$
      : courbe **symétrique par rapport à l''origine**.'
    - 'Si $D_{f}$ n''est pas symétrique par rapport à 0, $f$ n''est **ni paire ni impaire** : conclusion
      dès la première ligne.'
    methode:
      titre: Étudier la parité de $f$
      etapes:
      - Vérifie que $D_{f}$ est **symétrique** par rapport à 0.
      - Calcule $f\left(-x\right)$ en mettant $-x$ **entre parenthèses**.
      - 'Compare : $f\left(-x\right) = f\left(x\right)$, paire ; $f\left(-x\right) = -f\left(x\right)$,
        impaire ; sinon ni l''une ni l''autre.'
      - 'Pour « ni l''une ni l''autre », un contre-exemple numérique suffit : $a = 1$ marche presque toujours.'
    exemple_resolu: 'Étudie la parité de $f\left(x\right) = \frac{x}{x^{2} + 1}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le dénominateur ne s''annule jamais. | $D_{f} = \mathbb{R}$ : symétrique |

      | Je remplace chaque $x$ par $-x$, parenthèses comprises. | $f\left(-x\right) = \frac{-x}{\left(-x\right)^{2}
      + 1} = \frac{-x}{x^{2} + 1}$ |

      | Numérateur changé de signe, dénominateur inchangé. | $f\left(-x\right) = -f\left(x\right)$ : **$f$
      est impaire** |

      | **Vérification :** $f\left(1\right) = \frac{1}{2}$ et $f\left(-1\right) = -\frac{1}{2}$. ✓ | |'
    erreurs_frequentes:
    - erreur: conclure « $f$ n'est pas paire, donc elle est impaire ».
      correction: les deux propriétés sont indépendantes ; le cas le plus fréquent est de n'être ni l'une
        ni l'autre.
    - erreur: écrire $f\left(-x\right) = -x^{2} + 3$ pour $f\left(x\right) = x^{2} + 3$.
      correction: $\left(-x\right)^{2} = x^{2}$. Le signe moins ne traverse pas le carré.
    declic: null
    figures:
    - figures/m08_f11.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Détermine l''ensemble de définition de : a) $f\left(x\right) = \frac{3x}{2x - 8}$ ; b) $g\left(x\right)
      = \sqrt{x + 7}$ ; c) $h\left(x\right) = \frac{1}{\sqrt{x + 7}}$.'
    correction: 'a) $D_{f} = \mathbb{R} \setminus \{4\}$. b) $D_{g} = \left[-7\,;\,+\infty\right[$. c)
      racine au dénominateur : $D_{h} = \left]-7\,;\,+\infty\right[$.'
  - numero: 2
    etoiles: 1
    enonce: Soit $f\left(x\right) = 2x^{2} - 5x$. a) Calcule l'image de $-1$. b) Détermine les antécédents
      de $0$, puis de $-2$.
    correction: 'a) $f\left(-1\right) = 7$. b) $x\left(2x - 5\right) = 0$ : $0$ et $\frac{5}{2}$ ; $2x^{2}
      - 5x + 2 = 0$, $\Delta = 9$ : $2$ et $\frac{1}{2}$.'
  - numero: 3
    etoiles: 1
    enonce: 'On donne le tableau de variations de $f$ sur $\left[-2\,;\,4\right]$ : $f$ décroît de $f\left(-2\right)
      = 3$ à $f\left(1\right) = -1$, puis croît de $f\left(1\right) = -1$ à $f\left(4\right) = 5$. a)
      Donne le maximum de $f$. b) Combien de solutions a $f\left(x\right) = 4$ ? c) Compare $f\left(-1\right)$
      et $f\left(0\right)$.


      [SVG: figures/m08_f8.svg]

      *Figure 8.3 : la courbe de la fonction $g$ de l''exercice 4, graduations unitaires.*'
    correction: 'a) $\max f = 5$ en $x = 4$. b) La descente va de 3 à $-1$ (pas de 4), la montée de $-1$
      à 5 (une fois) : **une** solution. c) $f$ décroissante sur $\left[-2\,;\,1\right]$ : $f\left(-1\right)
      > f\left(0\right)$.'
  - numero: 4
    etoiles: 1
    enonce: 'Par lecture graphique sur la figure 8.3 : a) $g\left(-1\right)$ et $g\left(2\right)$ ; b)
      le nombre de solutions de $g\left(x\right) = 0$ ; c) le tableau de variations de $g$.'
    correction: 'a) $g\left(-1\right) = 3$ ; $g\left(2\right) = -1$. b) Trois traversées de l''axe : **3
      solutions**. c) Croissante sur $\left[-3\,;\,-1\right]$, décroissante sur $\left[-1\,;\,2\right]$,
      croissante sur $\left[2\,;\,3\right]$.'
  - numero: 5
    etoiles: 1
    enonce: 'Étudie la parité de : a) $f\left(x\right) = 3x^{2} - 5$ ; b) $g\left(x\right) = x^{3} + x$
      ; c) $h\left(x\right) = x^{2} + x$.'
    correction: 'a) $f\left(-x\right) = f\left(x\right)$ : **paire**. b) $g\left(-x\right) = -g\left(x\right)$
      : **impaire**. c) $h\left(1\right) = 2$, $h\left(-1\right) = 0$ : **ni paire ni impaire**.'
  - numero: 6
    etoiles: 1
    enonce: 'Sans calcul, à l''aide des variations de $x \mapsto x^{2}$ : range $\left(2{,}1\right)^{2}$,
      $\left(2{,}4\right)^{2}$ et $\left(2{,}3\right)^{2}$ dans l''ordre croissant, puis $\left(-2{,}1\right)^{2}$,
      $\left(-2{,}4\right)^{2}$ et $\left(-2{,}3\right)^{2}$.'
    correction: 'Croissante sur $\left[0\,;\,+\infty\right[$ : $\left(2{,}1\right)^{2} < \left(2{,}3\right)^{2}
      < \left(2{,}4\right)^{2}$. Décroissante sur $\left]-\infty\,;\,0\right]$ : $\left(-2{,}1\right)^{2}
      < \left(-2{,}3\right)^{2} < \left(-2{,}4\right)^{2}$.'
  - numero: 7
    etoiles: 1
    enonce: Soit $f\left(x\right) = 3x - 7$. a) Calcule $f\left(0\right)$, $f\left(4\right)$ et $f\left(-\frac{2}{3}\right)$.
      b) Détermine l'antécédent de $8$, puis de $0$.
    correction: a) $-7$ ; $5$ ; $-9$. b) $x = 5$ ; $x = \frac{7}{3}$.
  - numero: 8
    etoiles: 1
    enonce: Soit $g\left(x\right) = x^{2} + 2x$. a) Calcule les images de $1$, $-1$ et $-3$. b) Détermine
      les antécédents de $0$, puis de $3$, puis de $-2$.
    correction: a) $3$ ; $-1$ ; $3$. b) $0$ et $-2$ ; $1$ et $-3$ ; aucun ($\Delta = -4 < 0$).
  - numero: 9
    etoiles: 1
    enonce: 'Détermine l''ensemble de définition de : a) $f\left(x\right) = \frac{5}{x + 4}$ ; b) $g\left(x\right)
      = \frac{x - 1}{x^{2} - 5x + 6}$ ; c) $h\left(x\right) = \sqrt{2x - 10}$ ; d) $k\left(x\right) =
      \frac{\sqrt{x + 3}}{x - 1}$.'
    correction: a) $\mathbb{R} \setminus \{-4\}$. b) $\mathbb{R} \setminus \{2\,;\,3\}$. c) $\left[5\,;\,+\infty\right[$.
      d) $\left[-3\,;\,1\right[ \cup \left]1\,;\,+\infty\right[$.
  - numero: 10
    etoiles: 1
    enonce: La courbe $\mathcal{C}_{f}$ de $f\left(x\right) = x^{2} - 4x + 1$ passe-t-elle par $A\left(3\,;\,-2\right)$
      ? par $B\left(-1\,;\,4\right)$ ? Justifie par le calcul.
    correction: '$f\left(3\right) = -2$ : $A \in \mathcal{C}_{f}$. $f\left(-1\right) = 6 \ne 4$ : $B \notin
