  fiche_revision:
  - '**Comparer.** Le plus grand est le plus à droite ; entre deux négatifs, le plus proche de zéro.'
  - '**Opposé.** Même distance à zéro, signe contraire ; $a + \left(-a\right) = 0$.'
  - '**Valeur absolue.** Distance de $a$ à zéro : jamais négative, $\left|a\right| = \left|-a\right|$
    ;

    deux nombres pour une valeur donnée, sauf $0$.'
  - '**Distance sur un axe.** $AB = \left|b - a\right|$ : plus grande abscisse moins plus petite.'
  - '**Additionner.** Mêmes signes : on ajoute les distances et on garde le signe. Signes contraires :

    on retranche la plus petite et on garde le signe du plus éloigné.'
  - '**Soustraire.** $a - b = a + \left(-b\right)$ : retrancher un négatif fait augmenter.'
  - '**Parenthèses.** Précédée d''un $-$ : on change tous les signes.'
  - '**Multiplier, diviser.** Même signe : positif ; signes contraires : négatif. Plusieurs facteurs :

    négatifs en nombre pair, positif ; impair, négatif.'
