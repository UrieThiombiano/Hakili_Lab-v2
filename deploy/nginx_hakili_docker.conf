# Reverse proxy nginx — Hakili Lab, variante déploiement Docker
#
# Différence avec deploy/nginx_hakili.conf (variante systemd) : celle-ci
# proxifie vers le port publié par `docker run -p 8010:8010`
# (127.0.0.1:8010, jamais exposé publiquement autrement que par nginx),
# pas vers un socket Unix. Pas d'alias /static/ : WhiteNoise (déjà activé
# dans hakili/settings.py) sert les fichiers statiques depuis le
# conteneur — plus simple qu'un volume staticfiles supplémentaire pour un
# déploiement de cette taille.
#
# Installation :
#   sudo cp deploy/nginx_hakili_docker.conf /etc/nginx/sites-available/hakili
#   # remplacer VOTRE_DOMAINE.example ci-dessous (ex. 167-233-234-219.nip.io)
#   sudo ln -s /etc/nginx/sites-available/hakili /etc/nginx/sites-enabled/hakili
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d VOTRE_DOMAINE.example
#
# Ne pas préconfigurer le bloc SSL à la main : `certbot --nginx` s'en
# charge, ainsi que du renouvellement automatique.

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE.example;

    # Dépôt de lots de copies scannées : peut représenter plusieurs dizaines
    # de mégaoctets (voir docs/deploiement.md, "Pourquoi --timeout 180").
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Indispensable : SECURE_PROXY_SSL_HEADER (hakili/settings.py) s'appuie
        # dessus pour savoir que la requête est en HTTPS. Sans cet en-tête,
        # SECURE_SSL_REDIRECT provoque une boucle de redirection infinie.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Une correction (appel IA) peut prendre du temps — aligné sur le
        # --timeout 180 de gunicorn (Procfile, entrypoint.sh).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
