  - id: 1ereD_M09_L2
    numero: '9.2'
    titre: 'Colinéarité : alignement et parallélisme'
    retenir:
    - $\vec{u}$ et $\vec{v}$ sont **colinéaires** s'il existe un réel $k$ tel que $\vec{v} = k\vec{u}$
      (même direction).
    - '**Critère :** $\vec{u}\left(x\,;\,y\right)$ et $\vec{v}\left(x''\,;\,y''\right)$ colinéaires $\iff$
      **$xy'' - x''y = 0$** (déterminant nul).'
    - $A$, $B$, $C$ **alignés** $\iff$ $\overrightarrow{AB}$ et $\overrightarrow{AC}$ colinéaires.
    - $\left(AB\right) \parallel \left(CD\right)$ $\iff$ $\overrightarrow{AB}$ et $\overrightarrow{CD}$
      colinéaires.
    methode:
      titre: Tester un alignement ou un parallélisme
      etapes:
      - Calcule les deux vecteurs ; pour un alignement, fais-les **partir du même point**.
      - Calcule le **déterminant** $xy' - x'y$.
      - 'S''il vaut **0** : colinéaires (points alignés, droites parallèles) ; sinon : non.'
      - Rédige la conclusion en français, pas seulement un $0$ entouré.
    exemple_resolu: '$P\left(2\,;\,1\right)$ et $Q\left(5\,;\,3\right)$ étant donnés, trouve $m$ pour
      que $R\left(11\,;\,m\right)$ soit aligné avec eux.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Point de départ commun : $P$. | $\overrightarrow{PQ}\left(3\,;\,2\right)$ ; $\overrightarrow{PR}\left(9\,;\,m
      - 1\right)$ |

      | J''écris le déterminant, l''inconnue ne gêne pas. | $3\left(m - 1\right) - 2 \times 9 = 3m - 21$
      |

      | L''alignement impose qu''il soit nul. | $3m - 21 = 0$, donc $m = 7$ et $R\left(11\,;\,7\right)$
      |

      | **Vérification :** $\overrightarrow{PR}\left(9\,;\,6\right) = 3\,\overrightarrow{PQ}$ ✓ | |'
    erreurs_frequentes:
    - erreur: confondre colinéaires et égaux.
      correction: '$\vec{u}\left(2\,;\,3\right)$ et $\vec{v}\left(-4\,;\,-6\right)$ sont colinéaires ($\vec{v}
        = -2\vec{u}$) mais de sens contraire : la colinéarité ne parle que de la **direction**.'
    - erreur: tester l'alignement avec $\overrightarrow{AB}$ et $\overrightarrow{CA}$.
      correction: 'les deux vecteurs doivent partir du même point : $\overrightarrow{AB}$ et $\overrightarrow{AC}$.'
    declic: null
