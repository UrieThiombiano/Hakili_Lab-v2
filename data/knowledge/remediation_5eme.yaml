- niveau: 5eme
  module: 6
  module_titre: Proportionnalité, relations et fonctions
  pourquoi: Le produit en croix est posé avant qu'on ait vérifié que la situation est proportionnelle,
    et croisé dans le mauvais sens. S'y ajoute la confusion entre image et antécédent.
  diagnostic:
  - question: 4 sacs de mil coûtent $2\,000$ FCFA. Prix d'un sac ?
    reponse: $500$ FCFA
  - question: Ce tableau est-il proportionnel ? $2 \to 300$ ; $3 \to 450$ ; $5 \to 700$.
    reponse: non, $300 \div 2 = 150$ mais $700 \div 5 = 140$
  - question: Calcule 25 % de $4\,000$ FCFA.
    reponse: $1\,000$ FCFA
  - question: Échelle « 1 cm pour 20 km ». Distance réelle pour 4 cm ?
    reponse: $80$ km
  - question: Dans $1 \to 50$ ; $2 \to 100$ ; $3 \to 150$, donne l'image de 3, puis l'antécédent de 100.
    reponse: 'image de 3 : 150 ; antécédent de 100 : 2'
  lecons:
  - id: 5eme_M06_L1
    numero: '6.1'
    titre: Reconnaître une situation de proportionnalité
    retenir:
    - 'On passe de l''une à l''autre en multipliant **toujours** par le même nombre : le **coefficient
      de proportionnalité**.'
    - '**Test des rapports :** diviser colonne par colonne, toujours dans le même sens. Tous les quotients
      égaux : proportionnel, et ce quotient est le coefficient, avec son unité ($500$ FCFA par sac).'
    - Deux rapports différents prouvent que ce n'est **pas** proportionnel.
    - À 0 correspond 0.
    - '**Graphique :** points **alignés** *et* alignement passant **par l''origine**.'
    methode:
      titre: Tester un tableau
      etapes:
      - Divise, colonne par colonne, une grandeur par l'autre, sans changer de sens.
      - Compare les résultats.
      - 'Tous égaux : proportionnel, coefficient égal à ce nombre, avec son unité.'
      - 'Sinon, cite deux rapports différents : la preuve est faite.'
    exemple_resolu: 'Un tailleur affiche : 1 tenue $\to 2\,000$ FCFA ; 2 $\to 3\,500$ ; 3 $\to 5\,000$.
      Proportionnel ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Test des rapports, colonne 1. | $2\,000 \div 1 = 2\,000$ |

      | Même sens, colonne suivante. | $3\,500 \div 2 = 1\,750$ |

      | Deux rapports différents : on conclut. | ce n''est pas proportionnel |

      | **Vérification :** 2 tenues devraient coûter $4\,000$ FCFA, on paie $3\,500$. ✓ | |'
    erreurs_frequentes:
    - erreur: conclure « proportionnel » parce que le prix augmente avec la quantité.
      correction: il faut tous les rapports égaux.
    - erreur: « les points sont alignés, donc c'est proportionnel ».
      correction: l'alignement doit passer par l'origine.
    declic: null
    figures:
    - figures/m06_f1.svg
  - id: 5eme_M06_L2
    numero: '6.2'
    titre: 'Le nombre manquant : passage à l''unité et règle de trois'
    retenir:
    - '**Passage à l''unité :** valeur pour 1, puis on multiplie. Pour 8 cahiers à $600$ FCFA : $600 \div
      8 = 75$, puis $75 \times 12 = 900$ FCFA.'
    - '**Coefficient :** $12 \times 75 = 900$.'
    - '**Produit en croix :** pour $8 \to 600$ et $12 \to$ ?,'
    - '**Bon sens :** un prix plus petit pour une quantité plus grande est faux d''avance.'
    methode:
      titre: Trouver le nombre manquant
      etapes:
      - Vérifie que la situation est proportionnelle.
      - Calcule la valeur pour une unité, en divisant.
      - Multiplie par la quantité cherchée, et écris l'unité.
      - Contrôle par le produit en croix ou par le sens de variation.
    exemple_resolu: '5 kg de riz coûtent $3\,000$ FCFA. a) Prix de 1 kg ? b) Combien de kilogrammes avec
      $9\,000$ FCFA ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Unité : on divise le prix par la masse. | $3\,000 \div 5 = 600$ FCFA par kg |

      | On cherche une masse : combien de $600$ dans $9\,000$. | $9\,000 \div 600 = 15$ |

      | On écrit la bonne grandeur. | 15 kg |

      | **Vérification :** $15 \times 600 = 9\,000$ FCFA. ✓ | |


      > #### DÉCLIC : Le produit en croix n''est pas le problème

      >

      > S''il te trahit une fois sur deux, ce n''est pas la proportionnalité : c''est la division qui
      coince. $9\,000 \div 600$ suppose une division posée sûre. Reprends le module 2, puis reviens.'
    erreurs_frequentes:
    - erreur: croiser à l'envers, $\left(8 \times 600\right) \div 12 = 400$.
      correction: 'on multiplie **en diagonale** du nombre cherché : $\left(12 \times 600\right) \div
        8 = 900$ FCFA.'
    - erreur: « 4 cahiers de plus, donc $4$ FCFA de plus ».
      correction: 'on multiplie : $4 \times 75 = 300$ FCFA de plus.'
    declic: 'Le produit en croix n''est pas le problème — S''il te trahit une fois sur deux, ce n''est
      pas la proportionnalité : c''est la division qui coince. $9\,000 \div 600$ suppose une division
      posée sûre. Reprends le module 2, puis reviens. #### ⚠ ATTENTION ! - **Erreur fréquente :** croiser
      à l''envers, $\left(8 \times 600\right) \div 12 = 400$. **Correction :** on multiplie **en diagonale**
      du nombre cherché : $\left(12 \times 600\right) \div 8 = 900$ FCFA. - **Erreur fréquente :** « 4
      cahiers de plus, donc $4$ FCFA de plus ». **Correction :** on multiplie : $4 \times 75 = 300$ FCFA
      de plus.'
    figures: []
  - id: 5eme_M06_L3
    numero: '6.3'
    titre: Pourcentages usuels et échelles
    retenir:
    - '$p$ % d''une quantité : multiplier par $p$, diviser par 100.'
    - $50\ \% = \frac{1}{2}$, $25\ \% = \frac{1}{4}$, $20\ \% = \frac{1}{5}$, $10\ \% = \frac{1}{10}$.
    - 'Remise ou hausse **en deux temps** : la part, puis le nouveau prix.'
    - 'Dans l''autre sens, on divise. Plan en centimètres, terrain en mètres ou kilomètres : écrire l''unité
      empêche de les confondre.'
    methode:
      titre: Prix après remise ou après hausse
      etapes:
      - 'Calcule la part : $p$ % de la quantité, par la fraction usuelle quand elle existe.'
      - 'Réduction : soustrais cette part du prix de départ.'
      - 'Hausse : ajoute-la au prix de départ.'
      - 'Relis : une remise donne un prix un peu plus petit, pas quatre fois plus petit.'
    exemple_resolu: 'Un article coûte $2\,000$ FCFA ; son prix augmente de 15 %. a) Nouveau prix ? b)
      Prix de 4 articles ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Pas de fraction usuelle : règle générale. | $2\,000 \div 100 \times 15 = 300$ FCFA |

      | Hausse : on ajoute la part. | $2\,000 + 300 = 2\,300$ FCFA |

      | Quatre articles : proportionnalité. | $2\,300 \times 4 = 9\,200$ FCFA |

      | **Vérification :** $9\,200 - 4 \times 300 = 8\,000$ FCFA avant la hausse. ✓ | |'
    erreurs_frequentes:
    - erreur: annoncer la remise comme le prix à payer.
      correction: sur $2\,000$ FCFA, une remise de 25 % vaut $500$ FCFA ; on paie $1\,500$ FCFA.
    - erreur: « 4 cm sur la carte font 4 km ».
      correction: au « 1 cm pour 50 km », 4 cm valent $200$ km ; l'unité fait partie de la réponse.
    declic: null
    figures: []
  - id: 5eme_M06_L4
    numero: '6.4'
    titre: Relation, image, antécédent, fonction
    retenir:
    - 'À une valeur de départ, on associe une valeur d''arrivée : tableau, diagramme sagittal ou graphique.'
    - 'Dans un couple, le départ s''écrit en premier : $\left(3\,;\,150\right)$, « 3 mangues coûtent $150$
      FCFA ».'
    - L'**image** d'un départ est au bout de la flèche ; l'**antécédent** d'une arrivée est au départ
      de la flèche.
    - Une arrivée peut avoir **plusieurs** antécédents ; on dit « les antécédents », jamais « les images
      ».
    - 'Chaque départ a **une seule** image : une flèche, et une seule, part de chaque départ.'
    - 'Deux départs différents peuvent viser la **même** arrivée : cela reste une fonction.'
    methode:
      titre: Image, antécédent, fonction
      etapes:
      - Repère la grandeur de départ et la grandeur d'arrivée, dans cet ordre.
      - 'Image : pars du départ, suis la flèche. Antécédent : pars de l''arrivée, remonte.'
      - 'Réponds par une phrase avec l''unité : « l''image de 4 ans est $85$ cm ».'
      - 'Fonction : une seule flèche part de chaque départ.'
    exemple_resolu: 'Clients servis : lundi $\to 18$ ; mardi $\to 25$ ; mercredi $\to 18$ ; jeudi $\to
      31$. a) Image de mercredi ? b) Antécédents de 18 ? c) Est-ce une fonction ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On part du jour et on lit le nombre de clients. | image de mercredi $= 18$ clients |

      | On part de 18 et on cherche **tous** les jours. | antécédents : lundi et mercredi |

      | Chaque jour n''a qu''un seul nombre de clients. | c''est une fonction |

      | **Vérification :** aucun départ n''a deux arrivées. ✓ | |'
    erreurs_frequentes:
    - erreur: « l'antécédent de 4 ans est $85$ cm ».
      correction: on part d'un départ, c'est une **image**.
    - erreur: « deux départs ont la même image, donc ce n'est pas une fonction ».
      correction: 'c''est permis. Interdit : deux images pour un même départ.'
    declic: null
    figures:
    - figures/m06_f4.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Proportionnel ? Masses : 1, 2, 3 kg ; prix : $400$, $800$, $1\,200$ FCFA. Donne le coefficient.'
    correction: '$400 \div 1 = 800 \div 2 = 1\,200 \div 3 = 400$ : **proportionnel**, coefficient $400$
      FCFA par kg.'
  - numero: 2
    etoiles: 1
    enonce: 'Proportionnel ? Sacs : 2, 4, 6 ; prix : $1\,000$, $2\,000$, $3\,000$ FCFA. Donne le coefficient.'
    correction: 'Tous les rapports valent $500$ : **proportionnel**, coefficient $500$ FCFA par sac.'
  - numero: 3
    etoiles: 1
    enonce: 'Proportionnel ? Heures : 1, 2, 4 ; distance en km : 12, 24, 48.'
    correction: 'Tous les rapports valent 12 : **proportionnel**, coefficient 12 km par heure.'
  - numero: 4
    etoiles: 1
    enonce: 'Proportionnel ? Nombres : 1, 2, 3 ; carrés : 1, 4, 9. Justifie.'
    correction: '$1 \div 1 = 1$ mais $4 \div 2 = 2$ : **non proportionnel**.'
  - numero: 5
    etoiles: 1
    enonce: 'Proportionnel ? Âges : 10, 15, 20 ans ; âges dans 5 ans : 15, 20, 25 ans. Justifie.'
    correction: '$15 \div 10 = 1{,}5$ mais $20 \div 15 \neq 1{,}5$ : **non proportionnel** (on ajoute
      5, on ne multiplie pas).'
  - numero: 6
    etoiles: 1
    enonce: 8 cahiers coûtent $600$ FCFA. Prix de 12 cahiers ?
    correction: $600 \div 8 = 75$ FCFA par cahier ; $75 \times 12 = 900$ FCFA.
  - numero: 7
    etoiles: 1
    enonce: 5 mètres de tissu coûtent $6\,000$ FCFA. Prix de 8 mètres ?
    correction: $6\,000 \div 5 = 1\,200$ FCFA le mètre ; $1\,200 \times 8 = 9\,600$ FCFA.
  - numero: 8
    etoiles: 1
    enonce: 3 poulets coûtent $4\,500$ FCFA. Combien de poulets avec $12\,000$ FCFA ?
    correction: $4\,500 \div 3 = 1\,500$ FCFA le poulet ; $12\,000 \div 1\,500 = 8$ poulets.
  - numero: 9
    etoiles: 1
    enonce: Une recette pour 4 personnes demande $600$ g de riz. Combien pour 6 personnes ?
    correction: $600 \div 4 = 150$ g par personne ; $150 \times 6 = 900$ g.
  - numero: 10
    etoiles: 1
    enonce: 3 sacs coûtent $1\,500$ FCFA. Combien de sacs avec $4\,000$ FCFA ?
    correction: $1\,500 \div 3 = 500$ FCFA le sac ; $4\,000 \div 500 = 8$ sacs.
  - numero: 11
    etoiles: 1
    enonce: 'Calcule : a) 50 % de 80 ; b) 25 % de 200 ; c) 10 % de 350.'
    correction: a) 40 ; b) 50 ; c) 35.
  - numero: 12
    etoiles: 1
    enonce: Remise de 25 % sur un pagne à $3\,000$ FCFA. Nouveau prix ?
    correction: Remise $750$ FCFA ; nouveau prix $2\,250$ FCFA.
  - numero: 13
    etoiles: 1
    enonce: Dans une classe de 40 élèves, 60 % réussissent. Combien d'élèves ?
    correction: $40 \div 100 \times 60 = 24$ élèves.
  - numero: 14
    etoiles: 1
    enonce: Réduction de 20 % sur un article à $2\,500$ FCFA. Calcule la réduction, puis le nouveau prix.
    correction: Réduction $500$ FCFA ; nouveau prix $2\,000$ FCFA.
  - numero: 15
    etoiles: 1
    enonce: Échelle « 1 cm pour 10 m ». Une pièce mesure 4 cm sur le plan. Longueur réelle ?
    correction: $4 \times 10 = 40$ m.
  - numero: 16
    etoiles: 1
    enonce: 'Plan « 1 cm pour 4 m » : une salle fait 5 cm sur 3 cm. Dimensions réelles ?'
    correction: $20$ m sur $12$ m.
  - numero: 17
    etoiles: 1
    enonce: 'a) Échelle « 1 cm pour 50 km » : 6 cm mesurés, distance réelle ? b) Échelle « 1 cm pour 20
      km » : la distance réelle est $100$ km, combien sur la carte ?'
    correction: a) $300$ km. b) $100 \div 20 = 5$ cm (on divise).
  - numero: 18
    etoiles: 1
    enonce: 'Âge et taille : $3 \to 80$ ; $4 \to 85$ ; $5 \to 100$ ; $6 \to 110$ (ans, cm). Donne a) l''image
      de 3 ans ; b) l''image de 6 ans ; c) l''antécédent de $85$ cm ; d) l''antécédent de $100$ cm.


      ### Entraînement ★★'
    correction: a) $80$ cm ; b) $110$ cm ; c) 4 ans ; d) 5 ans.
  - numero: 19
    etoiles: 2
    enonce: Vrai ou faux ? Justifie. a) Dans un tableau de proportionnalité, tous les quotients d'une
      ligne par l'autre sont égaux. b) La taille d'un enfant est proportionnelle à son âge. c) En proportionnalité,
      à la valeur 0 correspond toujours 0.
    correction: 'a) **Vrai** (test des rapports). b) **Faux** : les quotients taille par âge diffèrent.
      c) **Vrai**.'
  - numero: 20
    etoiles: 2
    enonce: Trouve l'erreur. 8 cahiers coûtent $600$ FCFA ; pour 12, Zalissa écrit $\left(8 \times 600\right)
      \div 12 = 400$ FCFA. a) Pourquoi est-ce impossible ? b) Écris le bon produit en croix.
    correction: 'a) $400 < 600$ : 12 cahiers coûtent plus cher. b) $\left(12 \times 600\right) \div 8
      = 900$ FCFA.'
  - numero: 21
    etoiles: 2
    enonce: Remise de $500$ FCFA sur un article affiché $2\,000$ FCFA. a) Quelle fraction du prix ? b)
      Quel pourcentage ?
    correction: a) $\frac{500}{2\,000} = \frac{1}{4}$ ; b) **25 %**.
  - numero: 22
    etoiles: 2
    enonce: Trouve l'erreur. Sur une carte au « 1 cm pour 25 km », Habibou mesure 6 cm et annonce « $150$
      cm ». a) Quelle unité a-t-il confondue ? b) Donne la bonne réponse.
    correction: a) Centimètres du plan au lieu de kilomètres. b) $150$ km.
  - numero: 23
    etoiles: 2
    enonce: 'Diagramme sagittal : $10 \to 1$ ; $20 \to 2$ ; $30 \to 3$. Donne l''image de 20 et l''antécédent
      de 3.'
    correction: 'Image de 20 : **2**. Antécédent de 3 : **30**.'
  - numero: 24
    etoiles: 2
    enonce: 'À Garango, briques fabriquées : lundi $\to 120$ ; mardi $\to 150$ ; mercredi $\to 150$ ;
      jeudi $\to 90$. a) Image de mercredi ? b) Tous les antécédents de 150 ? c) Total sur quatre jours
      ?'
    correction: a) 150 briques. b) mardi et mercredi. c) $510$ briques.
  - numero: 25
    etoiles: 2
    enonce: 'À Nouna, 4 bidons d''huile coûtent $10\,000$ FCFA. a) Prix d''un bidon ? b) De 7 bidons ?
      c) Un client paie 7 bidons avec $20\,000$ FCFA : combien lui rend-on ?'
    correction: a) $2\,500$ FCFA. b) $17\,500$ FCFA. c) $2\,500$ FCFA rendus.
  - numero: 26
    etoiles: 2
    enonce: 'À Kaya, 15 sacs de ciment coûtent $90\,000$ FCFA. a) Prix d''un sac ? b) Prix de 22 sacs
      ? c) Combien de sacs avec $48\,000$ FCFA ?


      #### Entraînement intensif : passer à l''unité, puis revenir'
    correction: a) $6\,000$ FCFA. b) $132\,000$ FCFA. c) 8 sacs.
  - numero: 27
    etoiles: 2
    enonce: À Bittou, 6 mètres de tissu coûtent $4\,800$ FCFA. a) Prix d'un mètre ? b) Construis le tableau
      de proportionnalité pour 1 m, 3 m et 6 m.
    correction: a) $4\,800 \div 6 = 800$ FCFA le mètre. b) 1 m $\to 800$ ; 3 m $\to 2\,400$ ; 6 m $\to
      4\,800$ FCFA.
  - numero: 28
    etoiles: 2
    enonce: Un robinet donne 15 litres en 3 minutes. a) Combien en 1 minute ? b) En 8 minutes ?
    correction: a) 5 litres par minute. b) $40$ litres.
  - numero: 29
    etoiles: 2
    enonce: Une recette pour 4 personnes demande $600$ g de riz et $200$ g de viande. Donne les quantités
      pour 10 personnes.
    correction: 'Riz : $150$ g par personne, soit $1\,500$ g. Viande : $50 \times 10 = 500$ g.'
  - numero: 30
    etoiles: 2
    enonce: 'À Gourcy, une meunière fait payer $125$ FCFA par plat de mil moulu. a) Écris la relation
      avec des mots. b) Image de 6 plats ? c) Une cliente a payé $1\,000$ FCFA : combien de plats ?


      ### ★★★ Défis de maîtrise'
    correction: a) Prix $= 125 \times$ nombre de plats. b) $750$ FCFA. c) 8 plats.
  - numero: 31
    etoiles: 3
    enonce: Le groupement maraîcher de Poa a vendu ses oignons pour $42\,000$ FCFA. Rasmata a travaillé
      3 jours, Salam 4 jours. Le groupement compte 12 membres. Le partage se fait proportionnellement
      aux jours de travail. Donne le montant de chaque enveloppe.
    correction: 'L''unité du partage est la **journée**, pas le membre : $3 + 4 = 7$ jours, $42\,000 \div
      7 = 6\,000$ FCFA la journée. Rasmata $18\,000$ FCFA, Salam $24\,000$ FCFA (total $42\,000$). Les
      12 membres ne servent pas.'
  - numero: 32
    etoiles: 3
    enonce: Après une remise de 25 %, un client paie un article $4\,500$ FCFA. a) Prix affiché ? b) Avec
      une remise de 20 % pour la même somme payée, quel aurait été le prix affiché ?
    correction: 'On cherche le départ : quelle part du prix affiché est payée ? a) Trois quarts payés
      : $4\,500 \div 3 = 1\,500$, affiché $6\,000$ FCFA. b) Quatre cinquièmes : $4\,500 \div 4 = 1\,125$,
      affiché $5\,625$ FCFA.'
  - numero: 33
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par un calcul ou un contre-exemple. a) Dans un tableau de proportionnalité,
      si une valeur du haut est multipliée par 3, celle du bas aussi. b) Une hausse de 10 % suivie d'une
      baisse de 10 % ramène au prix de départ. c) Il suffit que les points soient alignés pour que la
      situation soit proportionnelle. d) Une relation où deux départs ont la même image n'est pas une
      fonction.
    correction: 'a) **Vrai** : le coefficient vaut pour chaque colonne. b) **Faux** : pas la même somme
      de base ; $2\,000 \to 2\,200 \to 1\,980$ FCFA. c) **Faux** : il faut passer par l''origine. d) **Faux**
      : seules deux images pour un même départ sont interdites.'
  - numero: 34
    etoiles: 3
    enonce: 'Trouve l''erreur. Pour un mortier, il faut 3 mesures de sable pour 1 de ciment. Ousséni dit
      : « pour 12 mesures de sable, il faut $12 - 3 + 1 = 10$ mesures de ciment ». a) Pourquoi est-ce
      faux ? b) Combien de mesures de ciment ? c) Combien de sable pour 5 mesures de ciment ?'
    correction: Le lien est une multiplication, pas une différence. a) 10 mesures de ciment pour 12 de
      sable est absurde. b) $12 \div 3 = 4$ mesures. c) $5 \times 3 = 15$ mesures de sable.
  - numero: 35
    etoiles: 3
    enonce: 'À Fada N''Gourma, un plan est à l''échelle « 1 cm pour 20 m ». Un terrain rectangulaire mesure
      3 cm sur 2 cm sur le plan. a) Dimensions réelles ? b) Aire réelle ? c) Le propriétaire vend $1\,500$
      FCFA le mètre carré : prix total ?'
    correction: 'a) $60$ m sur $40$ m. b) Aire sur les dimensions réelles : $2\,400$ m$^{2}$. c) $3\,600\,000$
      FCFA.'
  - numero: 36
    etoiles: 3
    enonce: À Tenkodogo, une couturière facture $1\,500$ FCFA par tenue, plus $500$ FCFA de fournitures
      pour la commande entière. a) Complète le tableau pour 1, 2, 3 et 4 tenues. b) Image de 4 tenues
      ? c) Le prix de 2 tenues est-il le double de celui d'une tenue ? Que conclus-tu sur cette relation
      ?
    correction: 'a) 1 $\to 2\,000$ ; 2 $\to 3\,500$ ; 3 $\to 5\,000$ ; 4 $\to 6\,500$ FCFA. b) $6\,500$
      FCFA. c) Non : $2 \times 2\,000 \neq 3\,500$. Fonction, mais **non proportionnelle** : les $500$
      FCFA ne sont payés qu''une fois.'
  - numero: 37
    etoiles: 3
    enonce: 'À Padéma, un transporteur inscrit les sacs de coton portés et le prix payé : 4 sacs $\to
      1\,000$ FCFA ; 6 sacs $\to 1\,500$ FCFA ; 6 sacs $\to 1\,800$ FCFA ; 10 sacs $\to 2\,500$ FCFA.
      Le hangar est à 3 km du magasin. Le président veut afficher un tableau où chaque nombre de sacs
      aurait son prix. Est-ce possible ? Justifie.'
    correction: 'Un même nombre de sacs peut-il recevoir deux prix ? 6 sacs reçoivent $1\,500$ puis $1\,800$
      FCFA : deux flèches partent de 6, ce n''est **pas une fonction**, le tableau est impossible. Sans
      cette ligne, coefficient $250$ FCFA par sac. Les 3 km ne servent pas.'
  fiche_revision:
  - '**Proportionnalité.** Même coefficient d''une grandeur à l''autre ; on le prouve par le test des
    rapports.'
  - '**Graphique.** Points alignés **et** alignement passant par l''origine.'
  - '**Quatrième proportionnelle.** $8 \to 600$, $12 \to$ ? donne $\left(12 \times 600\right) \div 8 =
    900$. On croise en diagonale.'
  - '**Pourcentages.** $p$ % : diviser par 100, multiplier par $p$. $50\ \% = \frac{1}{2}$, $25\ \% =
    \frac{1}{4}$, $20\ \% = \frac{1}{5}$, $10\ \% = \frac{1}{10}$.'
  - '**Échelle.** Réelle $=$ plan $\times$ échelle ; on divise dans l''autre sens. Toujours l''unité.'
  - '**Image et antécédent.** L''image est au bout de la flèche, l''antécédent à son départ ; plusieurs
    antécédents possibles.'
  - '**Fonction.** Chaque départ a une seule image ; deux départs peuvent viser la même arrivée.'
  trouve_erreur:
  - faux: 2 sacs $\to 1\,000$ FCFA, donc 5 sacs $\to 1\,003$ FCFA
    correction: 'On multiplie : $1\,000 \div 2 = 500$, puis $5 \times 500 = 2\,500$ FCFA.'
  - faux: '$8 \to 600$, $12 \to$ ? : $\left(8 \times 600\right) \div 12 = 400$'
    correction: 'En diagonale : $\left(12 \times 600\right) \div 8 = 900$ FCFA.'
  - faux: 20 % de $350 = 350 - 20 = 330$
    correction: 'Un pourcentage est une part : $350 \div 100 \times 20 = 70$.'
  - faux: 'Carte « 1 cm pour 50 km » : 3 cm donnent $150$ cm'
    correction: 'Le terrain se compte en kilomètres : $150$ km.'
  cartographie_lacunes:
  - lacune: Produit en croix appliqué sans sens ; image et antécédent confondus
    bloque_en: échelle, masse volumique, vitesse, débit
  source_path: remediation\5eme\modules_c\M06.md
- niveau: 5eme
  module: 7
  module_titre: 'Droites, segments, angles : vocabulaire et instruments'
  pourquoi: En géométrie, la faute vient presque toujours d'un mot ou d'un crochet, pas d'un calcul. On
    remet ici en place les quatre écritures, les deux propriétés qui font démontrer, la médiatrice et
    les angles.
  diagnostic:
  - question: Que désigne $AB$, sans crochet ni parenthèse ? Et $\left[AB\right]$ ?
    reponse: $AB$ est un nombre, la longueur ; $\left[AB\right]$ est un dessin, le segment
  - question: I est le milieu de $\left[AB\right]$ et $AB = 9$ cm. Combien mesure $IA$ ?
    reponse: $IA = 4{,}5$ cm
  - question: On sait que $\left(d_1\right) \perp \left(d\right)$ et $\left(d_2\right) \perp \left(d\right)$.
      Que dire de $\left(d_1\right)$ et $\left(d_2\right)$ ?
    reponse: elles sont parallèles
  - question: Nature d'un angle de $89^{\circ}$ ? D'un angle de $91^{\circ}$ ?
    reponse: aigu ; obtus
  - question: Complémentaire de $30^{\circ}$ ? Supplémentaire de $30^{\circ}$ ?
    reponse: $60^{\circ}$ ; $150^{\circ}$
  lecons:
  - id: 5eme_M07_L1
    numero: '7.1'
    titre: Les quatre écritures
    retenir:
    - 'Un **point** : une lettre majuscule, A, B, O.'
    - 'La **droite** $\left(AB\right)$ : illimitée **des deux côtés**, sans longueur. $\left(AB\right)
      = \left(BA\right)$.'
    - 'La **demi-droite** $\left[AB\right)$ : origine A, illimitée d''un seul côté. $\left[AB\right) \neq
      \left[BA\right)$.'
    - 'Le **segment** $\left[AB\right]$ : deux extrémités. $\left[AB\right] = \left[BA\right]$.'
    - '$AB$ : un **nombre**, la longueur du segment.'
    - $A \in \left(d\right)$ ; $E \notin \left(d\right)$ ; $\left[AB\right] \subset \left(AB\right)$ mais
      $\left(AB\right) \not\subset \left[AB\right]$.
    - Des points sont **alignés** si une même droite passe par tous.
    - 'Par un point : une infinité de droites. Par **deux points distincts** : **une seule**.'
    - 'I milieu de $\left[AB\right]$ : I est sur $\left[AB\right]$ et $IA = IB = AB \div 2$.'
    methode:
      titre: Choisir la bonne écriture
      etapes:
      - 'Compte les bouts : deux bouts $\left[\;\right]$ ; un seul $\left[\;\right)$ ; aucun $\left(\;\right)$.'
      - 'Si tu parles de centimètres, enlève tout : $AB$.'
      - 'Vérifie le verbe : on **trace** $\left[AB\right]$, on **mesure** $AB$.'
      - 'Demi-droite : **l''origine en premier**, $\left[SM\right)$ part de S.'
    exemple_resolu: 'M, N, P alignés dans cet ordre, $MN = 3{,}5$ cm et $NP = 2{,}5$ cm. a) Calcule $MP$.
      b) N est-il le milieu de $\left[MP\right]$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Alignés dans l''ordre : les morceaux s''ajoutent. | $MP = 3{,}5 + 2{,}5 = 6$ cm |

      | Milieu : les deux morceaux devraient être égaux. | $3{,}5 \neq 2{,}5$, donc non |

      | **Vérification :** le vrai milieu I vérifie $MI = 3$ cm, il tombe dans $\left[MN\right]$. ✓ |
      |'
    erreurs_frequentes:
    - erreur: « $\left[AB\right] = 7$ cm », « la droite $\left(AB\right)$ mesure 8 cm ».
      correction: 'seul le nombre $AB$ porte une mesure : $AB = 7$ cm.'
    - erreur: $\left[AB\right) = \left[BA\right)$.
      correction: deux demi-droites de sens contraires. Seuls le segment et la droite ignorent l'ordre
        des lettres.
    declic: null
    figures:
    - figures/m07_f1.svg
  - id: 5eme_M07_L2
    numero: '7.2'
    titre: Perpendiculaires et parallèles
    retenir:
    - '$\left(d_1\right) \parallel \left(d_2\right)$ : aucun point commun, écart constant. Codage : chevrons.'
    - '$\left(d_1\right) \cap \left(d_2\right) = \left\lbrace I \right\rbrace$ : sécantes en I, accolades
      obligatoires.'
    - '$\left(d_1\right) \perp \left(d_2\right)$ : quatre angles droits. Codage : petit carré.'
    - Par un point extérieur à $\left(d\right)$ passe **une seule** parallèle à $\left(d\right)$.
    - Par un point passe **une seule** perpendiculaire à $\left(d\right)$.
    - Si $\left(d_1\right) \parallel \left(d\right)$ et $\left(d_2\right) \parallel \left(d\right)$, alors
      $\left(d_1\right) \parallel \left(d_2\right)$.
    - Si $\left(d_1\right) \perp \left(d\right)$ et $\left(d_2\right) \perp \left(d\right)$, alors $\left(d_1\right)
      \parallel \left(d_2\right)$.
    methode:
      titre: Tracer la parallèle à $\left(d\right)$ passant par A
      etapes:
      - Pose un côté de l'angle droit de l'équerre sur $\left(d\right)$.
      - Plaque la règle contre l'autre côté et appuie fort.
      - Fais glisser l'équerre le long de la règle jusqu'à A, puis trace.
      - 'Contrôle : même écart mesuré à deux endroits éloignés.'
    exemple_resolu: 'À Boulsa, un maçon monte deux murs $\left(m_1\right)$ et $\left(m_2\right)$ d''équerre
      sur le mur de fond $\left(f\right)$, long de 9 m. Quel écart entre eux à 20 m du fond ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux perpendiculaires à une même droite. | $\left(m_1\right) \perp \left(f\right)$ et $\left(m_2\right)
      \perp \left(f\right)$ |

      | On applique la quatrième propriété. | donc $\left(m_1\right) \parallel \left(m_2\right)$ |

      | Deux parallèles gardent le même écart. | écart $= 9$ m, même à 20 m |

      | **Vérification :** un écart qui diminue signifierait des droites sécantes. ✓ | |'
    erreurs_frequentes:
    - erreur: $\left(d_1\right) \cap \left(d_2\right) = I$.
      correction: 'l''intersection est un ensemble : $\left\lbrace I \right\rbrace$.'
    - erreur: « cette droite est perpendiculaire », « perpendiculaire, c'est debout ».
      correction: on l'est toujours **à** une droite précise, et la figure peut tourner.
    declic: null
    figures: []
  - id: 5eme_M07_L3
    numero: '7.3'
    titre: La médiatrice d'un segment
    retenir:
    - Si M est sur la médiatrice de $\left[AB\right]$, alors $MA = MB$.
    - Réciproquement, si $MA = MB$, alors M est sur la médiatrice.
    - Si $PA = PB$ et $QA = QB$, alors $\left(PQ\right)$ est la médiatrice de $\left[AB\right]$.
    - Si M est sur la médiatrice, le triangle MAB est isocèle en M.
    methode:
      titre: Construire la médiatrice au compas
      etapes:
      - Ouvre le compas à un rayon **plus grand que la moitié** de $AB$.
      - 'Pointe en A : un arc au-dessus, un arc en dessous.'
      - 'Sans changer l''écartement, pointe en B : deux arcs, qui coupent les premiers en P et Q.'
      - Trace $\left(PQ\right)$ à la règle, laisse les arcs visibles.
    exemple_resolu: '$\left[MN\right]$ mesure 7 cm. Quel écartement de compas choisir, et où la médiatrice
      coupe-t-elle $\left[MN\right]$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On calcule la moitié : elle commande l''écartement. | $7 \div 2 = 3{,}5$ cm |

      | On prend un rayon qui la dépasse. | rayon $= 5$ cm, et $5 > 3{,}5$ |

      | Arcs de centre M, puis de centre N ; on relie P et Q. | $\left(PQ\right)$ est la médiatrice |

      | **Vérification :** elle coupe $\left[MN\right]$ en I avec $MI = IN = 3{,}5$ cm, et $3{,}5 + 3{,}5
      = 7$. ✓ | |


      > #### DÉCLIC : Tes deux arcs ne se coupent jamais

      >

      > Le blocage n''est pas dans la médiatrice, il est dans le compas. Trois causes, trois secondes
      : ouverture inférieure à la moitié de $AB$ ; écartement modifié entre les arcs de A et ceux de B
      ; pointe sèche qui glisse. Appuie sur la pointe, jamais sur la mine, et trace des arcs larges.'
    erreurs_frequentes:
    - erreur: « elle passe par le milieu, donc c'est la médiatrice ».
      correction: il faut **en plus** l'angle droit ; une infinité de droites passent par le milieu.
    - erreur: « M est sur la médiatrice, donc $MA = 5$ cm et $MB = 7$ cm ».
      correction: impossible, sur la médiatrice $MA = MB$.
    declic: 'Tes deux arcs ne se coupent jamais — Le blocage n''est pas dans la médiatrice, il est dans
      le compas. Trois causes, trois secondes : ouverture inférieure à la moitié de $AB$ ; écartement
      modifié entre les arcs de A et ceux de B ; pointe sèche qui glisse. Appuie sur la pointe, jamais
      sur la mine, et trace des arcs larges. #### ⚠ ATTENTION ! - **Erreur fréquente :** « elle passe
      par le milieu, donc c''est la médiatrice ». **Correction :** il faut **en plus** l''angle droit
      ; une infinité de droites passent par le milieu. - **Erreur fréquente :** « M est sur la médiatrice,
      donc $MA = 5$ cm et $MB = 7$ cm ». **Correction :** impossible, sur la médiatrice $MA = MB$.'
    figures:
    - figures/m07_f4.svg
  - id: 5eme_M07_L4
    numero: '7.4'
    titre: 'Les angles : nommer, classer, mesurer'
    retenir:
    - '**Adjacents** : même sommet, un côté commun, de part et d''autre de ce côté. Leurs mesures s''ajoutent
      : $\widehat{AOC} + \widehat{COB} = \widehat{AOB}$.'
    - '**Complémentaires** : somme $90^{\circ}$. Le complémentaire de $a$ vaut $90^{\circ} - a$.'
    - '**Supplémentaires** : somme $180^{\circ}$. Le supplémentaire de $a$ vaut $180^{\circ} - a$.'
    - Adjacent, c'est une position ; complémentaire et supplémentaire, c'est un calcul.
    methode:
      titre: Mesurer un angle au rapporteur
      etapes:
      - Centre du rapporteur exactement sur le **sommet**.
      - Ligne du 0 posée sur l'un des deux côtés.
      - Suis le second côté, prolongé à la règle s'il est trop court, et lis **sur l'échelle qui part
        de ce 0**.
      - 'Contrôle : aigu $< 90$, obtus $> 90$. Sinon, retranche ta lecture de $180$.'
    exemple_resolu: 'À Boromo, A, O et B sont alignés, et une piste $\left[OC\right)$ part de O avec $\widehat{AOC}
      = 124^{\circ}$. Calcule $\widehat{BOC}$ et donne sa nature.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | A, O, B alignés : l''angle est plat. | $\widehat{AOB} = 180^{\circ}$ |

      | Les deux angles sont adjacents, ils s''ajoutent. | $\widehat{AOC} + \widehat{BOC} = 180^{\circ}$
      |

      | On retranche, puis on compare à $90^{\circ}$. | $\widehat{BOC} = 56^{\circ}$, **aigu** |

      | **Vérification :** $124^{\circ} + 56^{\circ} = 180^{\circ}$. ✓ | |'
    erreurs_frequentes:
    - erreur: « le complémentaire de $50^{\circ}$ est $130^{\circ}$ ».
      correction: le **c**omplémentaire va au **c**oin droit, $90^{\circ} - 50^{\circ} = 40^{\circ}$ ;
        le supplémentaire va à $180^{\circ}$. Un angle obtus n'a pas de complémentaire.
    - erreur: lire $120^{\circ}$ pour un angle visiblement aigu.
      correction: mauvaise échelle ; la valeur est $180 - 120 = 60^{\circ}$.
    declic: null
    figures:
    - figures/m07_f7.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Complète par « segment », « droite » ou « demi-droite » : a) $\left[AB\right]$ ; b) $\left(AB\right)$
      ; c) $\left[AB\right)$.'
    correction: a) segment ; b) droite ; c) demi-droite (origine A).
  - numero: 2
    etoiles: 1
    enonce: 'Complète : a) un point se nomme par une lettre … ; b) une droite se prolonge sans fin des
      … côtés ; c) par deux points distincts il passe … droite.'
    correction: a) majuscule ; b) deux ; c) une seule.
  - numero: 3
    etoiles: 1
    enonce: 'Complète avec $\subset$ ou $\not\subset$ : a) $\left[AB\right]$ … $\left(AB\right)$ ; b)
      $\left(AB\right)$ … $\left[AB\right]$ ; c) $\left[AB\right]$ … $\left[AB\right)$.'
    correction: a) $\subset$ ; b) $\not\subset$ ; c) $\subset$.
  - numero: 4
    etoiles: 1
    enonce: Écris de trois façons le nom de la droite passant par R, S et T alignés.
    correction: '$\left(RS\right)$, $\left(RT\right)$, $\left(ST\right)$ : une seule droite porte trois
      points alignés.'
  - numero: 5
    etoiles: 1
    enonce: Trace $\left[MN\right]$ de 6 cm et place son milieu J. Combien mesurent $MJ$ et $JN$ ?
    correction: $MJ = JN = 6 \div 2 = 3$ cm.
  - numero: 6
    etoiles: 1
    enonce: A, B, C alignés dans cet ordre, $AB = 5$ cm et $BC = 3$ cm. Calcule $AC$.
    correction: 'Ordre A, B, C : $AC = 5 + 3 = 8$ cm.'
  - numero: 7
    etoiles: 1
    enonce: R, S, T alignés dans cet ordre, $RT = 11$ cm et $RS = 4{,}5$ cm. Calcule $ST$.
    correction: 'Le tout moins un morceau : $ST = 11 - 4{,}5 = 6{,}5$ cm.'
  - numero: 8
    etoiles: 1
    enonce: I est le milieu de $\left[AB\right]$ et $AI = 3{,}6$ cm. a) Calcule $AB$. b) Calcule $IB$.
    correction: a) $AB = 3{,}6 \times 2 = 7{,}2$ cm. b) $IB = 3{,}6$ cm.
  - numero: 9
    etoiles: 1
    enonce: R, S, T alignés dans cet ordre, $RS = 4{,}2$ cm et $ST = 4{,}2$ cm. a) Calcule $RT$. b) Que
      dire de S ?
    correction: 'a) $RT = 4{,}2 + 4{,}2 = 8{,}4$ cm. b) S est sur $\left[RT\right]$ avec $RS = ST$ : c''est
      le **milieu**.'
  - numero: 10
    etoiles: 1
    enonce: 'Complète : a) deux droites parallèles ne se coupent … ; b) elles gardent partout le même
      … ; c) le symbole du parallélisme s''écrit … .'
    correction: a) jamais ; b) écart ; c) $\parallel$.
  - numero: 11
    etoiles: 1
    enonce: 'Complète : a) deux droites perpendiculaires forment … angles droits ; b) le symbole s''écrit
      … ; c) on code l''angle droit par un … .'
    correction: a) quatre ; b) $\perp$ ; c) petit carré.
  - numero: 12
    etoiles: 1
    enonce: Trace $\left(d\right)$ et un point A hors de $\left(d\right)$. Construis la parallèle à $\left(d\right)$
      passant par A, à la règle et à l'équerre.
    correction: 'Équerre sur $\left(d\right)$, règle contre l''autre côté, glissement jusqu''à A, tracé.
      Contrôle : même écart aux deux bouts.'
  - numero: 13
    etoiles: 1
    enonce: On donne $\left(a\right) \perp \left(c\right)$ et $\left(b\right) \perp \left(c\right)$. a)
      Que dire de $\left(a\right)$ et $\left(b\right)$ ? b) Fais une figure codée.
    correction: 'a) $\left(a\right) \parallel \left(b\right)$ : deux perpendiculaires à une même droite.
      b) Deux petits carrés sur $\left(c\right)$, chevrons identiques sur $\left(a\right)$ et $\left(b\right)$.'
  - numero: 14
    etoiles: 1
    enonce: 'Complète : la médiatrice d''un segment est la droite … à ce segment et qui passe par son
      … .'
    correction: … **perpendiculaire** … **milieu**.
  - numero: 15
    etoiles: 1
    enonce: Trace $\left[AB\right]$ de 6 cm et construis sa médiatrice à l'équerre et à la règle.
    correction: Milieu I à 3 cm de A, puis perpendiculaire à l'équerre en I.
  - numero: 16
    etoiles: 1
    enonce: Trace $\left[AB\right]$ de 8 cm et construis sa médiatrice **au compas**.
    correction: 'Moitié $= 4$ cm, donc rayon $> 4$ cm (par exemple 6 cm) : deux arcs de centre A, deux
      de centre B, on relie P et Q. Contrôle : $AI = IB = 4$ cm, angle droit en I.'
  - numero: 17
    etoiles: 1
    enonce: La médiatrice de $\left[AB\right]$ coupe $\left[AB\right]$ en I, avec $AI = 4{,}5$ cm. a)
      Combien vaut $IB$ ? b) Et $AB$ ? c) Quel angle fait-elle avec $\left[AB\right]$ ?
    correction: a) $IB = 4{,}5$ cm. b) $AB = 9$ cm. c) $90^{\circ}$.
  - numero: 18
    etoiles: 1
    enonce: 'a) M est sur la médiatrice de $\left[AB\right]$ et $MA = 4{,}2$ cm : combien vaut $MB$ ?
      b) Complète : $NA = NB$ donc N est sur la … de $\left[AB\right]$ ; P est sur la médiatrice de $\left[HK\right]$
      donc $PH$ … $PK$.'
    correction: a) $MB = 4{,}2$ cm (équidistance). b) médiatrice ; $PH = PK$.
  - numero: 19
    etoiles: 1
    enonce: L'angle a pour sommet B et ses côtés passent par A et C. Écris-le de deux façons.
    correction: '$\widehat{ABC}$ ou $\widehat{CBA}$ : B, le sommet, est la lettre du milieu.'
  - numero: 20
    etoiles: 1
    enonce: 'Classe en aigus, droits, obtus : $40^{\circ}\,;\,90^{\circ}\,;\,110^{\circ}\,;\,88^{\circ}\,;\,145^{\circ}\,;\,12^{\circ}$.'
    correction: 'Aigus : $40^{\circ}$, $88^{\circ}$, $12^{\circ}$. Droit : $90^{\circ}$. Obtus : $110^{\circ}$,
      $145^{\circ}$.'
  - numero: 21
    etoiles: 1
    enonce: 'Construis au rapporteur : a) $45^{\circ}$ ; b) $60^{\circ}$ ; c) $100^{\circ}$.'
    correction: Centre du rapporteur sur O, 0 sur $\left[OA\right)$, lecture sur l'échelle qui part de
      ce 0. a) et b) aigus ; c) obtus, lecture supérieure à 90.
  - numero: 22
    etoiles: 1
    enonce: 'a) Complémentaire de $15^{\circ}$, de $40^{\circ}$, de $65^{\circ}$. b) Supplémentaire de
      $50^{\circ}$, de $130^{\circ}$, de $95^{\circ}$. c) $\widehat{AOC} = 42^{\circ}$ et $\widehat{COB}
      = 38^{\circ}$ sont adjacents : calcule $\widehat{AOB}$.


      ### Entraînement ★★


      *Entraînement intensif : trancher une affirmation et la justifier. Une réponse sans justification
      ne compte pas.*'
    correction: a) $75^{\circ}$ ; $50^{\circ}$ ; $25^{\circ}$. b) $130^{\circ}$ ; $50^{\circ}$ ; $85^{\circ}$.
      c) $\widehat{AOB} = 42^{\circ} + 38^{\circ} = 80^{\circ}$.
  - numero: 23
    etoiles: 2
    enonce: On lit $\left(AB\right) \parallel \left(CD\right)$ et $\left(AB\right) \perp \left(EF\right)$.
      Position de $\left(CD\right)$ par rapport à $\left(EF\right)$ ? Figure et justification.
    correction: '$\left(CD\right) \parallel \left(AB\right)$ garde la direction de $\left(AB\right)$,
      que $\left(EF\right)$ coupe à angle droit : donc $\left(CD\right) \perp \left(EF\right)$.'
  - numero: 24
    etoiles: 2
    enonce: 'À Zorgho, une couturière ouvre ses ciseaux : les lames font $20^{\circ}$, puis elle les ouvre
      de $50^{\circ}$ de plus. a) Nouvelle mesure ? b) Nature ?'
    correction: 'a) $20^{\circ} + 50^{\circ} = 70^{\circ}$. b) $70^{\circ} < 90^{\circ}$ : aigu.'
  - numero: 25
    etoiles: 2
    enonce: Vrai ou faux, avec justification ? a) Une droite a une longueur. b) Par un point il passe
      une seule droite. c) $\left(MN\right)$ et $\left(NM\right)$ sont la même droite.
    correction: 'a) Faux : une droite est illimitée. b) Faux : il en passe une infinité ; c''est par deux
      points distincts qu''il n''en passe qu''une. c) Vrai : l''ordre des lettres ne change rien.'
  - numero: 26
    etoiles: 2
    enonce: Vrai ou faux ? a) $\left[AB\right] = \left[BA\right]$ ; b) $\left[AB\right) = \left[BA\right)$
      ; c) $\left(AB\right) = \left(BA\right)$.
    correction: 'a) Vrai. b) Faux : origines différentes, sens contraires. c) Vrai.'
  - numero: 27
    etoiles: 2
    enonce: Vrai ou faux ? a) Deux droites qui ne se coupent pas sur ma feuille sont parallèles. b) Si
      $\left(a\right) \parallel \left(b\right)$ et $\left(b\right) \parallel \left(c\right)$, alors $\left(a\right)
      \parallel \left(c\right)$. c) Par un point extérieur à $\left(d\right)$ passent deux parallèles
      à $\left(d\right)$.
    correction: 'a) Faux : la feuille est trop petite, elles peuvent se couper plus loin. b) Vrai (propriété
      des parallèles à une même droite). c) Faux : une seule.'
  - numero: 28
    etoiles: 2
    enonce: Vrai ou faux ? a) Deux droites perpendiculaires sont sécantes. b) Deux droites sécantes sont
      perpendiculaires. c) Deux droites distinctes peuvent se couper en deux points.
    correction: 'a) Vrai : elles se coupent en formant quatre angles droits. b) Faux : deux routes qui
      se croisent de biais. c) Faux : elles seraient confondues.'
  - numero: 29
    etoiles: 2
    enonce: Vrai ou faux ? a) La médiatrice de $\left[CD\right]$ est celle de $\left[DC\right]$. b) Un
      segment a deux médiatrices, une de chaque côté. c) La médiatrice de $\left[CD\right]$ coupe $\left[CD\right]$
      en un seul point.
    correction: 'a) Vrai : même segment. b) Faux : une seule droite, qui traverse le segment. c) Vrai
      : elle le coupe en son milieu, en un point unique.'
  - numero: 30
    etoiles: 2
    enonce: Trouve l'erreur. Pour construire la médiatrice de $\left[AB\right]$ avec $AB = 8$ cm, un élève
      ouvre son compas à 3 cm. a) Que se passe-t-il ? b) Quelle ouverture choisir ?
    correction: a) La moitié vaut 4 cm ; avec 3 cm les arcs restent trop courts et **ne se coupent pas**.
      b) Une ouverture supérieure à 4 cm, la même pour les deux centres.
  - numero: 31
    etoiles: 2
    enonce: 'Trouve l''erreur. Un élève écrit : « le supplémentaire de $60^{\circ}$ est $30^{\circ}$,
      car $60 + 30 = 90$. » Corrige et donne la bonne réponse.


      ### ★★★ Défis de maîtrise'
    correction: Somme $90$ = complémentaire, pas supplémentaire. Le supplémentaire de $60^{\circ}$ est
      $180^{\circ} - 60^{\circ} = 120^{\circ}$ ; $30^{\circ}$ était son complémentaire.
  - numero: 32
    etoiles: 3
    enonce: $\left[AB\right]$ mesure 10 cm. I est le milieu de $\left[AB\right]$, J celui de $\left[AI\right]$,
      K celui de $\left[IB\right]$. a) Calcule $AJ$, $AI$, $AK$. b) Calcule $JK$. c) Compare $JK$ et $AB$.
      Cela resterait-il vrai avec $AB = 14$ cm ?
    correction: 'On repère chaque point depuis A, puis on soustrait. a) $AI = 5$ cm, $AJ = 2{,}5$ cm,
      $AK = 5 + 2{,}5 = 7{,}5$ cm. b) $JK = 7{,}5 - 2{,}5 = 5$ cm. c) $JK$ est la **moitié** de $AB$.
      Avec 14 cm : $AJ = 3{,}5$, $AK = 10{,}5$, $JK = 7$ cm, encore la moitié. Vrai pour toute longueur,
      car J et K sont chacun au quart d''un bord.'
  - numero: 33
    etoiles: 3
    enonce: A, B, C, D alignés dans cet ordre, $AB = 2{,}5$ cm, $BC = 3$ cm, $CD = 2{,}5$ cm. a) Calcule
      $AD$. b) Le milieu de $\left[AD\right]$ est-il celui de $\left[BC\right]$ ? Justifie par un calcul.
    correction: 'On ramène tout à des distances depuis A, puis on compare. a) $AD = 2{,}5 + 3 + 2{,}5
      = 8$ cm. b) Milieu de $\left[AD\right]$ : 4 cm de A. Milieu de $\left[BC\right]$ : $2{,}5 + 1{,}5
      = 4$ cm de A. Même point : ils sont **confondus**, parce que les deux morceaux extérieurs ont la
      même longueur.'
  - numero: 34
    etoiles: 3
    enonce: Trace $\left(d\right)$ et A hors de $\left(d\right)$. a) Construis la perpendiculaire à $\left(d\right)$
      passant par A ; elle coupe $\left(d\right)$ en H. b) Construis la perpendiculaire à $\left(AH\right)$
      passant par A. c) Position de cette droite par rapport à $\left(d\right)$ ? Justifie sans mesurer.
    correction: 'On cherche la propriété qui conclut sans mesurer. a) et b) Deux tracés à l''équerre ;
      on note $\left(\delta\right)$ la seconde droite. c) $\left(\delta\right) \perp \left(AH\right)$
      et $\left(d\right) \perp \left(AH\right)$ : deux perpendiculaires à une même droite, donc $\left(\delta\right)
      \parallel \left(d\right)$. On a tracé la parallèle à $\left(d\right)$ passant par A à la seule équerre.'
  - numero: 35
    etoiles: 3
    enonce: A, O, B alignés. Du même côté de $\left(AB\right)$, deux demi-droites $\left[OC\right)$ et
      $\left[OD\right)$ vérifient $\widehat{AOC} = 40^{\circ}$ et $\widehat{BOD} = 60^{\circ}$, $\left[OC\right)$
      étant la plus proche de $\left[OA\right)$. a) Calcule $\widehat{COD}$. b) Aigu ou obtus ?
    correction: 'Le mot « alignés » donne l''angle plat : $180^{\circ}$ à répartir entre trois angles
      adjacents. a) $40^{\circ} + \widehat{COD} + 60^{\circ} = 180^{\circ}$, donc $\widehat{COD} = 80^{\circ}$.
      b) $80^{\circ} < 90^{\circ}$ : aigu. Contrôle : $40 + 80 + 60 = 180$. ✓'
  - numero: 36
    etoiles: 3
    enonce: Vrai ou faux ? Prouve par une propriété ou donne un contre-exemple. a) Deux angles adjacents
      sont supplémentaires. b) Deux angles complémentaires sont tous deux aigus. c) Deux angles peuvent
      être supplémentaires sans être adjacents. d) Deux angles de même sommet sont adjacents.
    correction: 'Pour chaque item : soit la définition, soit un seul contre-exemple. a) Faux : $30^{\circ}$
      et $40^{\circ}$ adjacents donnent $70^{\circ}$. b) Vrai : chacun est inférieur à $90^{\circ}$ puisque
      leur somme vaut $90^{\circ}$. c) Vrai : $130^{\circ}$ et $50^{\circ}$ dessinés n''importe où. d)
      Faux : il faut aussi un côté commun et être de part et d''autre.'
  - numero: 37
    etoiles: 3
    enonce: 'Deux villages A et B sont distants de 8 km. Une piste rectiligne perpendiculaire à $\left[AB\right]$
      passe par son milieu ; un poste de santé est sur cette piste, à 3 km du milieu. a) À quelle distance
      de A est le milieu ? b) Le poste est-il aussi loin de A que de B ? Justifie sans calcul. c) Un habitant
      dit : « le poste est à 5 km de A et à 4 km de B ». Qu''en penses-tu ?'
    correction: 'Perpendiculaire à $\left[AB\right]$ **et** passant par son milieu : la piste est la médiatrice
      de $\left[AB\right]$. a) $8 \div 2 = 4$ km. b) Le poste est sur la médiatrice, donc **à égale distance**
      de A et de B, par équidistance : aucun calcul. c) Impossible : deux distances différentes pour un
      point de la médiatrice. Ou le poste n''est pas sur la piste, ou une mesure est fausse.'
  - numero: 38
    etoiles: 3
    enonce: 'À Koudougou, le mur de fond $\left(f\right)$ d''un magasin mesure 9 m. Le maçon monte les
      deux murs latéraux de 12 m à partir de ses extrémités et les dit montés d''équerre. a) Position
      de $\left(m_1\right)$ et $\left(m_2\right)$ ? Cite la propriété. b) Quel écart au bout libre ? c)
      On mesure $8{,}60$ m : le charpentier peut-il poser le toit ?'
    correction: 'On dit d''abord ce qu''on **devrait** mesurer, puis on compare au relevé. a) Deux perpendiculaires
      à $\left(f\right)$, donc $\left(m_1\right) \parallel \left(m_2\right)$. b) Écart constant : encore
      **9 m**. c) $9 - 8{,}60 = 0{,}40$ m d''écart en moins sur 12 m : les murs se rapprochent, ils ne
      sont pas parallèles. **Le toit ne doit pas être posé** avant reprise du tracé.'
  fiche_revision:
  - '**Écritures.** $\left(AB\right)$ droite illimitée ; $\left[AB\right)$ demi-droite d''origine A ;
    $\left[AB\right]$ segment ; $AB$ nombre. On trace $\left[AB\right]$, on mesure $AB$.'
  - '**Notations.** $A \in \left(d\right)$, $E \notin \left(d\right)$, $\left[AB\right] \subset \left(AB\right)$,
    $\left(d_1\right) \cap \left(d_2\right) = \left\lbrace I \right\rbrace$.'
  - '**Milieu.** I sur $\left[AB\right]$ et $IA = IB = AB \div 2$.'
  - '**Droites.** Deux droites parallèles à une même troisième sont parallèles ; deux droites **perpendiculaires**
    à une même troisième sont **parallèles**.'
  - '**Médiatrice.** Milieu **et** angle droit. $M \in$ médiatrice $\iff MA = MB$. Au compas : rayon supérieur
    à la moitié de $AB$.'
  - '**Angles.** $\widehat{AOB}$ : sommet au milieu. Aigu $< 90^{\circ}$, droit $90^{\circ}$, obtus entre
    $90^{\circ}$ et $180^{\circ}$, plat $180^{\circ}$.'
  - '**Sommes.** Adjacents : mesures qui s''ajoutent. Complémentaires : $90^{\circ}$. Supplémentaires
    : $180^{\circ}$.'
  trouve_erreur:
  - faux: « La droite $\left(AB\right)$ mesure 8 cm. »
    correction: 'Une droite n''a pas de longueur : $AB = 8$ cm.'
  - faux: « $\left(d_1\right) \cap \left(d_2\right) = I$ »
    correction: 'L''intersection est un ensemble : $\left\lbrace I \right\rbrace$.'
  - faux: « Elle passe par le milieu de $\left[AB\right]$, donc c'est la médiatrice. »
    correction: Il manque l'angle droit ; une infinité de droites passent par le milieu.
  - faux: « L'angle $M\widehat{S}N$ a pour sommet M. »
    correction: 'Le sommet est la lettre du milieu : S. Côtés $\left[SM\right)$ et $\left[SN\right)$.'
  cartographie_lacunes:
  - lacune: Vocabulaire de géométrie flou, constructions imprécises
    bloque_en: symétrie centrale, angles et triangles
  source_path: remediation\5eme\modules_c\M07.md
- niveau: 5eme
  module: 8
  module_titre: Le triangle, le cercle et le disque
  pourquoi: 'Le vocabulaire du triangle et du cercle décroche vite : hauteur confondue avec médiane, «
    cercle » mis pour la surface. Tu connais ces mots ; leur emploi dérape.'
  diagnostic:
  - question: Dans ABC, $\widehat{A} = 55^{\circ}$ et $\widehat{B} = 65^{\circ}$. Combien mesure $\widehat{C}$
      ?
    reponse: $180^{\circ} - 120^{\circ} = 60^{\circ}$
  - question: Peut-on construire un triangle de côtés $3$, $4$ et $8$ cm ?
    reponse: non, $3 + 4 = 7 < 8$
  - question: 'Complète : du sommet au **milieu** du côté opposé, c''est une … ; **perpendiculairement**
      au côté opposé, c''est une … .'
    reponse: médiane ; hauteur
  - question: Un cercle a un diamètre de $9$ cm. Quel est son rayon ?
    reponse: $4{,}5$ cm
  - question: Soit $C\left(O, 4 \text{ cm}\right)$ et $OM = 4{,}5$ cm. Où est M ?
    reponse: $4{,}5 > 4$, dehors
  lecons:
  - id: 5eme_M08_L1
    numero: '8.1'
    titre: Nature d'un triangle, somme des angles
    retenir:
    - Trois points **non alignés**, les **sommets** ; [BC] est le côté **opposé** à A.
    - Dans $\widehat{ABC}$, **la lettre du milieu est le sommet**.
    - '**Codage :** traits identiques = même longueur ; petit carré = angle droit.'
    - '**équilatéral** : trois côtés égaux, trois angles de $60^{\circ}$ ;'
    - '**isocèle** : deux côtés égaux, deux angles de base égaux ;'
    - '**rectangle** : un angle de $90^{\circ}$ ; **quelconque** : aucune égalité ;'
    - 'elles ne s''excluent pas : un équilatéral est isocèle.'
    methode:
      titre: Donner la nature d'un triangle
      etapes:
      - 'Compare les **côtés** : trois égaux, équilatéral ; deux égaux, isocèle.'
      - 'Regarde les **angles** : si l''un vaut $90^{\circ}$, ajoute « rectangle ».'
      - 'S''il manque un angle : $180^{\circ}$ moins les deux autres, puis retour à l''étape 2.'
      - 'Aucune égalité, aucun angle droit : quelconque.'
    exemple_resolu: 'Dans DEF, $\widehat{D} = 40^{\circ}$, $\widehat{E} = 100^{\circ}$. Calcule $\widehat{F}$
      et donne la nature.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Somme des angles connus. | $40^{\circ} + 100^{\circ} = 140^{\circ}$ |

      | Le troisième complète à $180^{\circ}$. | $\widehat{F} = 180^{\circ} - 140^{\circ} = 40^{\circ}$
      |

      | Deux angles égaux : isocèle. | $\widehat{D} = \widehat{F}$, donc DEF **isocèle en E** |

      | **Vérification :** $40 + 100 + 40 = 180$ ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: 5eme_M08_L2
    numero: '8.2'
    titre: 'Construire un triangle : vérifier avant de tracer'
    retenir:
    - 'On compare le **plus grand** côté à la somme des deux autres :'
    - '**Cas limite :** somme **exactement** égale au grand côté ($3$, $4$, $7$) : points alignés, un
      trait.'
    - 'trois **côtés** : règle et **compas** ;'
    - 'un **côté et les deux angles** adjacents : règle et **rapporteur** ;'
    - 'deux **côtés et l''angle compris** : règle et **rapporteur**.'
    methode:
      titre: Construire un triangle dont on connaît les trois côtés
      etapes:
      - '**Vérifie** l''inégalité triangulaire avant de sortir les instruments.'
      - Trace [BC] à la règle.
      - Compas ouvert à AB, pique en B, un arc ; ouvert à AC, pique en C, second arc.
      - 'Les arcs se coupent en A : relie et contrôle les longueurs.'
    exemple_resolu: 'Rakieta construit ABC de périmètre $12$ cm, $AB = 5$ cm, $AC = 4$ cm.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Somme des côtés connus. | $5 + 4 = 9$ cm |

      | Le côté manquant complète le périmètre. | $BC = 12 - 9 = 3$ cm |

      | Test d''existence, grand côté $5$ cm. | $4 + 3 = 7 > 5$ : possible |

      | **Vérification :** $5 + 4 + 3 = 12$ cm ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: 5eme_M08_L3
    numero: '8.3'
    titre: 'Hauteurs et médianes : deux mots, deux consignes'
    retenir:
    - '**Hauteur :** du sommet, **perpendiculaire** au côté opposé ; elle arrive au **pied**. Consigne
      de **direction**.'
    - '**Médiane :** du sommet au **milieu** du côté opposé. Consigne de **position**.'
    - Une par sommet. Les hauteurs se coupent en H, l'**orthocentre** ; les médianes en G, le **centre
      de gravité**.
    - '**Obtus** : le pied tombe **hors** du côté (à prolonger en pointillés) et H sort du triangle.'
    - '**Rectangle** : H est le **sommet de l''angle droit**.'
    - '**Isocèle** : depuis le sommet principal, hauteur et médiane sont **confondues** ; dans un équilatéral,
      $H = G$.'
    methode:
      titre: Tracer la hauteur puis la médiane issues de A
      etapes:
      - '**Hauteur :** équerre le long de [BC], glisse jusqu''à A, trace, petit carré au pied H.'
      - Si le pied tombe hors de [BC], prolonge [BC] en pointillés.
      - '**Médiane :** mesure BC, divise par $2$, place M, code les moitiés.'
      - 'Trace [AM], puis relis l''énoncé : est-ce bien ce qui était demandé ?'
    exemple_resolu: 'ABC isocèle en A, $BC = 6$ cm, [AH] la hauteur issue de A. Combien vaut BH ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Isocèle en A : hauteur = médiane. | [AH] est la médiane issue de A |

      | La médiane arrive au milieu du côté. | $BH = HC = 6 \div 2 = 3$ cm |

      | On ajoute la direction. | $\left(AH\right) \perp \left(BC\right)$ |

      | **Vérification :** $3 + 3 = 6$ cm ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures:
    - figures/m08_f4.svg
  - id: 5eme_M08_L4
    numero: '8.4'
    titre: Cercle et disque
    retenir:
    - 'Le **cercle** $C\left(O, r\right)$ : les points à la distance r de O, une **ligne**. Le **disque**
      : la surface, cercle **et** intérieur.'
    - '**rayon** : du centre à un point du cercle ;'
    - '**diamètre** : deux points du cercle **par le centre**, $d = 2 \times r$ ;'
    - '**corde** : deux points quelconques du cercle ; le diamètre est **la plus longue** ;'
    - '**arc** : portion de la ligne entre deux points du cercle.'
    - '$OM < r$ : **dedans** ; $OM = r$ : **sur** le cercle ; $OM > r$ : **dehors**.'
    - Le centre O est dans le disque, **jamais** sur le cercle.
    methode:
      titre: Situer un point par rapport à un cercle
      etapes:
      - Repère le rayon r ; si l'énoncé donne le diamètre, divise par $2$.
      - Lis ou mesure OM.
      - 'Compare OM et r : écris $<$, $=$ ou $>$.'
      - 'Traduis : plus petit, dedans ; égal, sur le cercle ; plus grand, dehors.'
    exemple_resolu: 'Un cercle a un diamètre de $14$ cm. a) Rayon ? b) M sur le cercle : $OM$ ? c) Une
      corde de $15$ cm ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le diamètre vaut deux rayons. | $r = 14 \div 2 = 7$ cm |

      | Un point du cercle est à la distance r. | $OM = 7$ cm |

      | La plus longue corde est le diamètre. | $15 > 14$ : **impossible** |

      | **Vérification :** $7 + 7 = 14$ cm ✓ | |


      > #### DÉCLIC : le mot manquant est presque toujours « distance »

      >

      > Si corde, diamètre et arc se mélangent, le blocage n''est pas le vocabulaire : c''est la **distance
      entre deux points**.

      > Chaque définition ne parle que des extrémités et de la distance au centre. Le compas, lui, garde
      une distance constante.'
    erreurs_frequentes: []
    declic: 'le mot manquant est presque toujours « distance » — Si corde, diamètre et arc se mélangent,
      le blocage n''est pas le vocabulaire : c''est la **distance entre deux points**. Chaque définition
      ne parle que des extrémités et de la distance au centre. Le compas, lui, garde une distance constante.
      #### ⚠ ATTENTION ! - **Erreur :** appeler « cercle » la surface ronde. **Correction :** le cercle
      est la **ligne**, la surface est le **disque**. - **Erreur :** ne retenir que dedans et dehors.
      **Correction :** il y a **trois** positions ; à la distance exacte r, le point est **sur** le cercle.'
    figures:
    - figures/m08_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Donne la nature : a) trois côtés de $4$ cm ; b) $5$ cm, $5$ cm et $8$ cm ; c) un angle de
      $90^{\circ}$.'
    correction: a) équilatéral ; b) isocèle ; c) rectangle.
  - numero: 2
    etoiles: 1
    enonce: Vrai ou faux ? a) un équilatéral a trois angles de $60^{\circ}$ ; b) un isocèle a deux angles
      droits ; c) un rectangle peut être isocèle.
    correction: a) Vrai ($180^{\circ} \div 3$) ; b) faux, deux angles droits font $180^{\circ}$ ; c) vrai,
      deux angles de $45^{\circ}$.
  - numero: 3
    etoiles: 1
    enonce: Dans ABC, $\widehat{A} = 40^{\circ}$ et $\widehat{B} = 75^{\circ}$. a) Calcule $\widehat{C}$.
      b) Sa nature ?
    correction: a) $180^{\circ} - 115^{\circ} = 65^{\circ}$. b) Quelconque.
  - numero: 4
    etoiles: 1
    enonce: Un triangle isocèle a un angle de $40^{\circ}$ au sommet principal. Calcule les deux angles
      de la base.
    correction: $180^{\circ} - 40^{\circ} = 140^{\circ}$, puis $140^{\circ} \div 2 = 70^{\circ}$.
  - numero: 5
    etoiles: 1
    enonce: Dans RST, $\widehat{R} = 35^{\circ}$ et $\widehat{S} = 55^{\circ}$. Calcule $\widehat{T}$
      et donne la nature.
    correction: '$180^{\circ} - 90^{\circ} = 90^{\circ}$ : rectangle en T.'
  - numero: 6
    etoiles: 1
    enonce: Un panneau triangulaire a trois côtés de $60$ cm. a) Nature ? b) Angles ?
    correction: a) Équilatéral. b) $60^{\circ}$ chacun.
  - numero: 7
    etoiles: 1
    enonce: Construis ABC avec $AB = 5$ cm, $AC = 6$ cm, $BC = 4$ cm.
    correction: '$5 + 4 = 9 > 6$ : possible. [BC] de $4$ cm, arcs de $5$ cm en B et $6$ cm en C.'
  - numero: 8
    etoiles: 1
    enonce: Construis SKE équilatéral de côté $5$ cm.
    correction: '[SK] de $5$ cm, deux arcs de $5$ cm en S et K : E. Angles $60^{\circ}$.'
  - numero: 9
    etoiles: 1
    enonce: Construis MNP avec $\widehat{MNP} = 125^{\circ}$, $MN = 4$ cm, $NP = 5$ cm.
    correction: Le sommet est N. [NM] de $4$ cm, $125^{\circ}$ en N, $NP = 5$ cm, relier M et P.
  - numero: 10
    etoiles: 1
    enonce: Construis ABC de périmètre $8{,}5$ cm, $AB = 2{,}5$ cm, $AC = 3{,}5$ cm. Calcule d'abord BC.
    correction: '$BC = 8{,}5 - 6 = 2{,}5$ cm ; $2{,}5 + 2{,}5 > 3{,}5$ : possible.'
  - numero: 11
    etoiles: 1
    enonce: Un isocèle a un périmètre de $22$ cm et deux côtés égaux de $8$ cm. a) Sa base ? b) Construis-le.
    correction: a) $22 - 16 = 6$ cm. b) Base $6$ cm, deux arcs de $8$ cm.
  - numero: 12
    etoiles: 1
    enonce: Construis ABC avec $BC = 6$ cm, $\widehat{B} = 50^{\circ}$, $\widehat{C} = 70^{\circ}$. Calcule
      d'abord $\widehat{A}$.
    correction: $\widehat{A} = 180^{\circ} - 120^{\circ} = 60^{\circ}$. [BC] de $6$ cm, $50^{\circ}$ et
      $70^{\circ}$ du même côté.
  - numero: 13
    etoiles: 1
    enonce: Définis la médiane. Construis un triangle ABC quelconque, puis trace la médiane issue de A.
    correction: Segment du sommet au **milieu** du côté opposé. M milieu de [BC], puis [AM].
  - numero: 14
    etoiles: 1
    enonce: Trace ABC avec $BC = 8$ cm. a) Place M milieu de [BC] et trace la médiane issue de A. b) BM
      et MC ? c) [AM] est-elle forcément perpendiculaire à $\left(BC\right)$ ?
    correction: 'a) M à $4$ cm de B. b) $BM = MC = 4$ cm. c) Non : seulement si isocèle en A.'
  - numero: 15
    etoiles: 1
    enonce: Construis AIE rectangle en I et trace ses trois hauteurs. Où se coupent-elles ? Nom de ce
      point ?
    correction: '[IA] et [IE] sont deux hauteurs : les trois se coupent en **I**, l''orthocentre.'
  - numero: 16
    etoiles: 1
    enonce: Soit $C\left(O, 3 \text{ cm}\right)$. a) Son diamètre ? b) La relation entre diamètre et rayon
      ?
    correction: a) $6$ cm. b) $d = 2 \times r$, soit $r = d \div 2$.
  - numero: 17
    etoiles: 1
    enonce: 'Trace un cercle de centre O et place : un rayon [OA], une corde [BC], un diamètre [DE], un
      arc.'
    correction: '[OA] rayon ; [BC] corde ; [DE] par O, diamètre ; la portion BC, arc.'
  - numero: 18
    etoiles: 1
    enonce: 'Soit $C\left(O, 5 \text{ cm}\right)$. Où est le point si sa distance à O vaut : a) $5$ cm
      ; b) $2$ cm ; c) $6$ cm ?'
    correction: a) sur ; b) dedans ; c) dehors.
  - numero: 19
    etoiles: 1
    enonce: Trace $C\left(O, 5 \text{ cm}\right)$ et situe A, B, C, D, E tels que $OA = 5$ cm, $OB = 4$
      cm, $OC = 3{,}5$ cm, $OD = 7$ cm, $OE = 6$ cm.
    correction: A sur le cercle ; B et C dedans ; D et E dehors.
  - numero: 20
    etoiles: 1
    enonce: 'Place O et A tels que $OA = 4{,}5$ cm. a) Trace au compas le cercle de centre O passant par
      A. b) Son rayon ? c) Son diamètre ?


      ### Entraînement ★★'
    correction: a) Pointe en O, mine sur A. b) $4{,}5$ cm. c) $9$ cm.
  - numero: 21
    etoiles: 2
    enonce: « Mon triangle a un angle de $100^{\circ}$ et un de $95^{\circ}$. » Explique par un calcul
      pourquoi c'est impossible.
    correction: '$100^{\circ} + 95^{\circ} = 195^{\circ} > 180^{\circ}$, sans le troisième : impossible.'
  - numero: 22
    etoiles: 2
    enonce: Peut-on construire un triangle de côtés a) $4$, $5$, $6$ cm ? b) $2$, $3$, $6$ cm ? c) $5$,
      $5$, $9$ cm ? Justifie.
    correction: 'a) $4 + 5 = 9 > 6$ : oui. b) $2 + 3 = 5 < 6$ : non. c) $5 + 5 = 10 > 9$ : oui.'
  - numero: 23
    etoiles: 2
    enonce: Vrai ou faux, avec justification ? a) Une médiane partage un côté en deux parts égales. b)
      Une hauteur passe toujours par le milieu d'un côté. c) Dans un équilatéral, une hauteur est aussi
      une médiane.
    correction: 'a) Vrai, définition. b) Faux : la hauteur est définie par un angle droit ($AB = 3$, $AC
      = 7$, $BC = 8$ cm). c) Vrai : chaque sommet est sommet principal.'
  - numero: 24
    etoiles: 2
    enonce: Construis ABC avec $AB = 8$ cm, $BC = 7$ cm, $AC = 6$ cm, puis place G et H.
    correction: '$7 + 6 = 13 > 8$. Médianes vers les milieux : G ; hauteurs : H. Ici $G \neq H$.'
  - numero: 25
    etoiles: 2
    enonce: Un cercle a un diamètre de $14$ cm. a) Son rayon ? b) Une corde peut-elle mesurer $15$ cm
      ? Justifie.
    correction: 'a) $r = 7$ cm. b) Non : corde maximale $14$ cm, et $15 > 14$.'
  - numero: 26
    etoiles: 2
    enonce: 'Deux côtés mesurent $5$ cm et $9$ cm. Le troisième peut-il mesurer a) $3$ cm ? b) $6$ cm
      ? Justifie.


      ### Entrainement intensif : décider sans dessiner


      *Chaque question se règle par une comparaison. Écris le calcul, sans figure.*'
    correction: 'a) Non : $5 + 3 = 8 < 9$. b) Oui : $5 + 6 = 11 > 9$. Il est entre $4$ et $14$ cm.'
  - numero: 27
    etoiles: 2
    enonce: Le triangle existe-t-il ? a) $10$, $6$, $3$ cm ; b) $7{,}5$, $4$, $4$ cm ; c) $2{,}5$, $2{,}5$,
      $5$ cm ; d) $12$, $9$, $8$ cm.
    correction: 'a) $6 + 3 = 9 < 10$ : non. b) $4 + 4 = 8 > 7{,}5$ : oui. c) $2{,}5 + 2{,}5 = 5$ : cas
      limite, non. d) $9 + 8 = 17 > 12$ : oui.'
  - numero: 28
    etoiles: 2
    enonce: 'Troisième angle et nature : a) $30^{\circ}$ et $60^{\circ}$ ; b) $70^{\circ}$ et $70^{\circ}$
      ; c) $110^{\circ}$ et $35^{\circ}$ ; d) $60^{\circ}$ et $60^{\circ}$.'
    correction: 'a) $90^{\circ}$ : rectangle. b) $40^{\circ}$ : isocèle. c) $35^{\circ}$ : isocèle. d)
      $60^{\circ}$ : équilatéral.'
  - numero: 29
    etoiles: 2
    enonce: Vrai ou faux, avec justification ? a) Deux points d'un cercle sont à la même distance du centre.
      b) Si $OM = 4$ cm et $r = 5$ cm, M est dehors. c) Le centre appartient au disque.
    correction: 'a) Vrai, c''est le rayon. b) Faux : $4 < 5$, M est dedans. c) Vrai : $0 < r$.'
  - numero: 30
    etoiles: 2
    enonce: Deux cercles de centre O ont pour rayons $4$ cm et $7$ cm ; $OM = 5$ cm. a) M est-il dans
      le petit ? b) Dans le grand ? c) Où est-il ?
    correction: 'a) $5 > 4$ : dehors. b) $5 < 7$ : dedans. c) Dans la couronne.'
  - numero: 31
    etoiles: 2
    enonce: 'Boukary place T à $3$ cm du centre de $C\left(O, 3 \text{ cm}\right)$ et écrit : « T est
      dans le disque, donc pas sur le cercle. » Où est l''erreur ?'
    correction: 'Trois positions, pas deux : $OT = r$, T est **sur** le cercle, donc aussi dans le disque.'
  - numero: 32
    etoiles: 2
    enonce: 'Trace [AB] de $6$ cm. a) Les cercles de centre A et B, de rayon $4$ cm, se coupent-ils ?
      b) Et avec deux rayons de $2$ cm ? c) Explique en une phrase.


      ### ★★★ Défis de maîtrise'
    correction: 'a) $4 + 4 = 8 > 6$ : deux points. b) $2 + 2 = 4 < 6$ : aucun. c) Les rayons bout à bout
      doivent atteindre AB.'
  - numero: 33
    etoiles: 3
    enonce: À Satiri, une ferme de hangar doit avoir deux côtés égaux pour que le toit tombe pareil des
      deux côtés. L'apprenti a coupé $4$ m, $4$ m et $3$ m. A-t-il bien travaillé ?
    correction: 'Deux vérifications. Existence : $4 + 3 = 7 > 4$, la ferme se ferme. Forme : deux côtés
      de $4$ m, donc **isocèle**. Oui, il a bien travaillé.'
  - numero: 34
    etoiles: 3
    enonce: Soit $C\left(O, 6 \text{ cm}\right)$, [AB] un diamètre, C un autre point du cercle. a) AB
      ? b) OA, OB, OC ? c) Nature de OAC ? de OBC ? Justifie. d) Que dire des triangles OMC quand M décrit
      le cercle ?
    correction: 'Idée directrice : tous les points du cercle sont à la même distance de O, d''où des isocèles.
      a) $12$ cm. b) $OA = OB = OC = 6$ cm. c) OAC et OBC isocèles en O. d) $OM = OC$ : tout OMC est isocèle
      en O, sauf si M est diamétralement opposé à C.'
  - numero: 35
    etoiles: 3
    enonce: Un isocèle a un périmètre de $20$ cm et sa base mesure $4$ cm de moins qu'un côté égal. a)
      Retrouve les trois côtés. b) Vérifie qu'il existe. c) Trouve tous les isocèles de périmètre $20$
      cm à côtés entiers.
    correction: 'On note c un côté égal, base $c - 4$. a) $3c - 4 = 20$ : $c = 8$ cm, base $4$ cm. b)
      $8 + 4 = 12 > 8$ : existe. c) Base $= 20 - 2c > 0$ : $\left(6\,;6\,;8\right)$, $\left(7\,;7\,;6\right)$,
      $\left(8\,;8\,;4\right)$, $\left(9\,;9\,;2\right)$ ; $c = 5$ est le cas limite, rejeté. Quatre solutions.'
  - numero: 36
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par un calcul ou un contre-exemple. a) Deux angles de $45^{\circ}$
      donnent un rectangle isocèle. b) Toute corde d'un cercle de rayon $4$ cm mesure moins de $8$ cm.
      c) L'orthocentre est toujours intérieur. d) Un triangle de côtés $6$, $6$, $6$ cm a ses hauteurs
      confondues avec ses médianes.
    correction: 'a) Vrai : le troisième vaut $90^{\circ}$ et deux angles égaux le rendent isocèle. b)
      Faux : le diamètre est une corde de $8$ cm exactement, donc « au plus $8$ cm ». c) Faux : rectangle
      (H au sommet) ou angle de $120^{\circ}$ (H dehors). d) Vrai : isocèle depuis chaque sommet, $H =
      G$.'
  - numero: 37
    etoiles: 3
    enonce: 'On demandait à Talato la nature de ABC ($\widehat{A} = 70^{\circ}$, $\widehat{B} = 40^{\circ}$),
      puis la hauteur issue de C.

      > « Ligne 1 : $\widehat{C} = 70^{\circ} + 40^{\circ} = 110^{\circ}$.

      > Ligne 2 : donc le triangle a un angle obtus, il est quelconque.

      > Ligne 3 : je trace la hauteur issue de C : elle rejoint le milieu de [AB].

      > Ligne 4 : comme elle passe par le milieu, c''est aussi la médiane, donc le triangle est isocèle
      en C. »

      >

      > Repère la première ligne qui casse le raisonnement, explique l''erreur, refais la résolution.'
    correction: 'On cherche la **première** rupture, le reste étant bâti dessus. Ligne 1 : Talato additionne
      au lieu de retrancher ; $\widehat{C} = 180^{\circ} - 110^{\circ} = 70^{\circ}$, et la ligne 2 tombe.
      Ligne 3 : confusion hauteur/médiane ; ligne 4 : raisonnement inversé. Résolution : $\widehat{A}
      = \widehat{C} = 70^{\circ}$, donc ABC **isocèle en B** ; la hauteur issue de C se trace à l''équerre,
      son pied n''est pas le milieu.'
  - numero: 38
    etoiles: 3
    enonce: Explique, sans dessiner, pourquoi un triangle ne peut avoir deux angles droits. Montre ensuite
      qu'il a au moins deux angles aigus.
    correction: 'La seule propriété qui lie les trois angles : leur somme vaut $180^{\circ}$. Deux angles
      droits totalisent déjà $180^{\circ}$ : il resterait $0^{\circ}$ au troisième, donc des points alignés.
      Même raisonnement avec deux angles valant chacun au moins $90^{\circ}$. Donc au plus un angle droit
      ou obtus : **au moins deux angles aigus**.'
  fiche_revision:
  - '**Nature.** Trois côtés égaux : équilatéral ($60^{\circ}$ partout). Deux : isocèle. Un angle droit
    : rectangle. Sinon quelconque.'
  - '**Somme des angles.** $\widehat{A} + \widehat{B} + \widehat{C} = 180^{\circ}$ ; deux angles donnent
    le troisième.'
  - '**Inégalité triangulaire.** (petit) + (moyen) > (grand). Égalité : points alignés. On teste **avant**
    de construire.'
  - '**Construire.** Trois côtés : deux arcs de compas. Un côté et deux angles, ou deux côtés et l''angle
    compris : rapporteur.'
  - '**Médiane.** Sommet → **milieu** du côté opposé ; les trois se coupent en G.'
  - '**Hauteur.** Sommet → **perpendiculaire** au côté opposé ; les trois se coupent en H, au sommet de
    l''angle droit si rectangle, dehors si un angle est obtus.'
  - '**Cercle et disque.** $C\left(O, r\right)$ est la ligne, le disque la surface. $d = 2 \times r$ ;
    le diamètre est la plus longue corde. $OM < r$ dedans, $= r$ sur, $> r$ dehors.'
  trouve_erreur:
  - faux: Un triangle de côtés $2$, $3$ et $7$ cm existe.
    correction: '$2 + 3 = 5 < 7$ : il n''existe pas.'
  - faux: Dans un triangle, $\widehat{A} = 90^{\circ}$ et $\widehat{B} = 90^{\circ}$.
    correction: 'Déjà $180^{\circ}$ : au plus **un** angle droit.'
  - faux: La hauteur issue de A aboutit au milieu de [BC].
    correction: C'est la **médiane** ; la hauteur est perpendiculaire.
  - faux: O appartient au cercle $C\left(O, 5 \text{ cm}\right)$.
    correction: '$0 \neq 5$ : O est dans le **disque**, jamais sur le cercle.'
  - faux: Une corde de $9$ cm si $r = 4$ cm.
    correction: 'Diamètre $= 8$ cm, corde maximale : impossible.'
  cartographie_lacunes:
  - lacune: Propriétés du triangle et du cercle non mobilisables
    bloque_en: angles et triangles, cône et pyramide
  source_path: remediation\5eme\modules_c\M08.md
- niveau: 5eme
  module: 9
  module_titre: Parallélogrammes et quadrilatères particuliers
  pourquoi: Tu connais les noms rectangle, losange, carré, trapèze, mais tu confonds ce qui **définit**
    une figure et ce qui n'en est qu'une **conséquence**. Ce module remet en place les propriétés du parallélogramme
    et la façon de justifier la nature exacte d'un quadrilatère.
  diagnostic:
  - question: Un quadrilatère n'a qu'une seule paire de côtés parallèles. Est-ce un parallélogramme ?
      Comment s'appelle cette figure ?
    reponse: non, c'est un trapèze
  - question: Dans le parallélogramme ABCD, $AB = 7$ cm et $BC = 5$ cm. Donne CD et AD.
    reponse: $CD = 7$ cm ; $AD = 5$ cm
  - question: Dans le parallélogramme ABCD, l'angle en A mesure $50^{\circ}$. Donne l'angle en C, puis
      l'angle en B.
    reponse: angle $C = 50^{\circ}$ ; angle $B = 130^{\circ}$
  - question: Les diagonales d'un parallélogramme sont-elles toujours de même longueur ? Si non, pour
      quel quadrilatère le sont-elles ?
    reponse: non, elles se coupent seulement en leur milieu ; égales dans le rectangle, donc dans le carré
  - question: Un quadrilatère a quatre côtés égaux **et** quatre angles droits. Quel est son nom ?
    reponse: un carré
  lecons:
  - id: 5eme_M09_L1
    numero: '9.1'
    titre: Reconnaître un parallélogramme et le nommer
    retenir:
    - Un **quadrilatère** a quatre côtés, quatre sommets, deux diagonales.
    - Un **parallélogramme** est un quadrilatère dont les côtés opposés sont **parallèles deux à deux**.
      Il faut **deux** paires ; avec une seule, c'est un **trapèze**.
    - '**Côtés opposés** (ils se font face, aucun sommet commun) : [AB] et [CD] ; [BC] et [DA].'
    - '**Côtés consécutifs** (un sommet commun) : [AB] et [BC].'
    - '**Diagonales** (elles joignent deux sommets opposés) : [AC] et [BD].'
    methode:
      titre: Reconnaître un parallélogramme
      etapes:
      - Vérifie quatre côtés, figure fermée et non croisée.
      - Repère les deux paires de côtés opposés.
      - Contrôle le parallélisme de la **première** paire (équerre ou chevrons).
      - 'Contrôle la **seconde** : si oui, parallélogramme ; s''il en manque une, trapèze.'
    exemple_resolu: 'Un quadrilatère porte un seul chevron sur deux côtés opposés, rien sur les deux autres.
      Quelle est sa nature ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Une paire de côtés parallèles est codée. | première paire : parallèle |

      | L''autre paire n''a aucun codage, et à l''équerre les deux côtés se rapprochent. | seconde paire
      : non parallèle |

      | Une paire ne suffit pas. | c''est un **trapèze** |

      | **Vérification :** il faut **deux** paires pour un parallélogramme. ✓ | |'
    erreurs_frequentes:
    - erreur: noter ABDC.
      correction: on tourne autour de la figure sans couper à l'intérieur, donc **ABCD** ; sinon un côté
        devient une diagonale.
    - erreur: appeler « opposés » deux côtés qui se touchent.
      correction: deux côtés qui se touchent sont **consécutifs** ; les opposés se font face.
    declic: null
    figures:
    - figures/m09_f1.svg
  - id: 5eme_M09_L2
    numero: '9.2'
    titre: Les quatre propriétés, et la construction
    retenir:
    - '**P1.** Côtés opposés égaux : $AB = CD$ et $BC = DA$.'
    - '**P2.** Angles opposés égaux : angle $A =$ angle $C$, angle $B =$ angle $D$.'
    - '**P3.** Angles consécutifs supplémentaires : angle $A +$ angle $B = 180^{\circ}$.'
    - '**P4.** Les diagonales se coupent en leur **milieu commun** O : $OA = OC$ et $OB = OD$.'
    methode:
      titre: Trouver une mesure manquante
      etapes:
      - 'Repère l''élément cherché : côté, angle, demi-diagonale.'
      - Est-il **opposé** à un élément connu (P1, P2) ou **voisin** (P3) ?
      - Écris l'égalité de la propriété choisie, puis remplace.
      - 'Contrôle : les quatre angles doivent faire $360^{\circ}$.'
    exemple_resolu: 'Dans le parallélogramme ABCD, $AB = 7$ cm, $BC = 4$ cm, angle $A = 65^{\circ}$. Donne
      CD, DA, l''angle en C et l''angle en B.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | [CD] fait face à [AB], [DA] fait face à [BC] (P1). | $CD = 7$ cm ; $DA = 4$ cm |

      | C est **opposé** à A (P2). | angle $C = 65^{\circ}$ |

      | B est **voisin** de A (P3). | angle $B = 180^{\circ} - 65^{\circ} = 115^{\circ}$ |

      | **Vérification :** $65 + 115 + 65 + 115 = 360$. ✓ | |'
    erreurs_frequentes:
    - erreur: « angle $A = 70^{\circ}$, donc angle $B = 70^{\circ}$ ».
      correction: B est **voisin** de A ; l'opposé de A est C. Donc angle $B = 110^{\circ}$.
    - erreur: croire les diagonales égales ou perpendiculaires.
      correction: elles se coupent seulement en leur **milieu**. Égales = rectangle ; perpendiculaires
        = losange.
    declic: null
    figures: []
  - id: 5eme_M09_L3
    numero: '9.3'
    titre: 'Rectangle, losange, carré, trapèze : les signatures'
    retenir:
    - '**Rectangle :** quatre angles droits. **Losange :** quatre côtés égaux.'
    - '**Carré :** quatre angles droits **et** quatre côtés égaux ; c''est donc à la fois un rectangle
      et un losange particuliers.'
    - '**Trapèze :** exactement deux côtés parallèles, les **bases** ; la **hauteur** est leur écart.
      Ce n''est **pas** un parallélogramme. Isocèle si les côtés non parallèles sont égaux, rectangle
      s''il a deux angles droits.'
    - '|---|---|'
    methode:
      titre: Justifier la nature exacte
      etapes:
      - 'Écris ce que l''énoncé donne : parallélismes, longueurs, angles, diagonales.'
      - 'Contrôle dans l''ordre : côtés parallèles, puis angles droits, puis côtés égaux ; les diagonales
        confirment.'
      - Conclus « donc ABCD est un … », puis cherche une donnée **inutilisée**.
      - 'S''il en reste une, elle sert à préciser le nom : reprends l''étape 2.'
    exemple_resolu: 'ABCD a ses diagonales qui se coupent en leur milieu O, et $AC = BD$. Nature ? Et
      si l''on avait $(AC) \perp (BD)$ à la place ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Milieu commun : c''est P4. | ABCD est un **parallélogramme** |

      | Diagonales égales : signature du rectangle. | $AC = BD$, donc **rectangle** |

      | Second cas : la signature change. | $(AC) \perp (BD)$, donc **losange** |

      | **Vérification :** les deux données ensemble donneraient un carré. ✓ | |


      > #### DÉCLIC : quatre côtés égaux ne fait pas un carré

      >

      > Quatre côtés égaux, c''est un **losange**, et rien de plus : un losange aplati n''a aucun angle
      droit. Pour le carré, il faut **ajouter** un angle droit ou l''égalité des diagonales. Une signature
      ne se remplace jamais par une impression visuelle.'
    erreurs_frequentes:
    - erreur: « un carré n'est pas un rectangle ».
      correction: il a quatre angles droits, donc il **est** un rectangle, et aussi un losange. L'inverse
        est faux.
    - erreur: appeler « bases » les côtés obliques d'un trapèze.
      correction: les bases sont les côtés **parallèles**.
    declic: 'quatre côtés égaux ne fait pas un carré — Quatre côtés égaux, c''est un **losange**, et rien
      de plus : un losange aplati n''a aucun angle droit. Pour le carré, il faut **ajouter** un angle
      droit ou l''égalité des diagonales. Une signature ne se remplace jamais par une impression visuelle.
      #### ⚠ ATTENTION ! - **Erreur fréquente :** « un carré n''est pas un rectangle ». **Correction :**
      il a quatre angles droits, donc il **est** un rectangle, et aussi un losange. L''inverse est faux.
      - **Erreur fréquente :** appeler « bases » les côtés obliques d''un trapèze. **Correction :** les
      bases sont les côtés **parallèles**.'
    figures:
    - figures/m09_f5.svg
    - figures/m09_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Recopie et complète : un parallélogramme est un … dont les … sont parallèles deux à deux.'
    correction: Un **quadrilatère** dont les **côtés opposés** sont parallèles deux à deux.
  - numero: 2
    etoiles: 1
    enonce: Combien de côtés possède un quadrilatère ? Combien de sommets ? Combien de diagonales ?
    correction: Quatre côtés, quatre sommets, deux diagonales.
  - numero: 3
    etoiles: 1
    enonce: BOTE est un parallélogramme. a) Nomme deux côtés consécutifs. b) Nomme deux côtés opposés.
      c) Nomme les deux diagonales.
    correction: a) [BO] et [OT] (sommet commun O). b) [BO] et [TE]. c) [BT] et [OE].
  - numero: 4
    etoiles: 1
    enonce: Vrai ou faux ? a) Un parallélogramme a quatre côtés. b) Ses côtés opposés sont parallèles.
      c) Tous ses angles sont droits.
    correction: 'a) Vrai. b) Vrai, c''est la définition. c) Faux : seulement dans le cas du rectangle.'
  - numero: 5
    etoiles: 1
    enonce: Sur une figure, on lit (AB) // (CD) et (AD) // (BC). Que conclus-tu pour ABCD ? Justifie.
    correction: 'Les deux paires de côtés opposés sont parallèles : ABCD est un **parallélogramme** (définition).'
  - numero: 6
    etoiles: 1
    enonce: Trace un quadrilatère ABCD dont seuls [AB] et [CD] sont parallèles. Est-ce un parallélogramme
      ? Donne le nom de la figure.
    correction: 'Non : une seule paire de côtés parallèles. C''est un **trapèze** de bases [AB] et [CD].'
  - numero: 7
    etoiles: 1
    enonce: Dans le parallélogramme ABCD, $AB = 6$ cm et $BC = 4{,}5$ cm. Donne CD et DA.
    correction: $CD = AB = 6$ cm ; $DA = BC = 4{,}5$ cm (P1).
  - numero: 8
    etoiles: 1
    enonce: Dans le parallélogramme MNPQ, $MN = 6$ cm et $NP = 9$ cm. Donne PQ et QM.
    correction: $PQ = MN = 6$ cm ; $QM = NP = 9$ cm (P1).
  - numero: 9
    etoiles: 1
    enonce: Dans le parallélogramme ABCD, l'angle en A mesure $72^{\circ}$. Donne les angles en C, B et
      D.
    correction: Angle $C = 72^{\circ}$ (opposé) ; angle $B = 180 - 72 = 108^{\circ}$ ; angle $D = 108^{\circ}$.
  - numero: 10
    etoiles: 1
    enonce: Dans le parallélogramme ABCD, l'angle en B mesure $110^{\circ}$. Donne l'angle en D, puis
      l'angle en A.
    correction: Angle $D = 110^{\circ}$ (opposé) ; angle $A = 180 - 110 = 70^{\circ}$.
  - numero: 11
    etoiles: 1
    enonce: Les diagonales du parallélogramme ABCD se coupent en O. On donne $AC = 12$ cm et $BD = 8$
      cm. Calcule OA, OC, OB et OD.
    correction: $OA = OC = 6$ cm ; $OB = OD = 4$ cm (O milieu commun).
  - numero: 12
    etoiles: 1
    enonce: Les diagonales du parallélogramme RSTU se coupent en O, avec $OR = 5$ cm et $OS = 3{,}5$ cm.
      Calcule RT et SU.
    correction: $RT = 2 \times 5 = 10$ cm ; $SU = 2 \times 3{,}5 = 7$ cm.
  - numero: 13
    etoiles: 1
    enonce: Un parallélogramme a un angle de $55^{\circ}$. Donne les trois autres angles.
    correction: $55^{\circ}$ (opposé), $125^{\circ}$ et $125^{\circ}$ (voisins, supplémentaires).
  - numero: 14
    etoiles: 1
    enonce: Vrai ou faux ? a) Les diagonales d'un parallélogramme sont toujours de même longueur. b) Elles
      sont toujours perpendiculaires. c) Elles se coupent toujours en leur milieu.
    correction: a) Faux (rectangle seulement). b) Faux (losange seulement). c) Vrai (P4).
  - numero: 15
    etoiles: 1
    enonce: Vrai ou faux ? a) Dans un losange, les diagonales sont parallèles. b) Dans un losange, elles
      sont perpendiculaires. c) Les quatre côtés d'un losange sont égaux.
    correction: 'a) Faux : deux diagonales se coupent. b) Vrai. c) Vrai.'
  - numero: 16
    etoiles: 1
    enonce: Qui suis-je ? a) J'ai quatre côtés égaux. b) Mes diagonales sont perpendiculaires et se coupent
      en leur milieu, sans angle droit aux sommets. c) J'ai quatre angles droits et des diagonales égales,
      mais mes côtés ne sont pas tous égaux.
    correction: a) Un **losange**. b) Un **losange** non carré. c) Un **rectangle** non carré.
  - numero: 17
    etoiles: 1
    enonce: 'Recopie ce tableau et écris OUI ou NON dans chaque case.


      | Propriété | Rectangle | Carré | Losange |

      |---|---|---|---|

      | Les quatre angles sont droits | … | … | … |

      | Les quatre côtés sont égaux | … | … | … |

      | Les diagonales sont égales | … | … | … |

      | Les diagonales sont perpendiculaires | … | … | … |'
    correction: 'Angles droits : OUI / OUI / NON. Côtés égaux : NON / OUI / OUI. Diagonales égales : OUI
      / OUI / NON. Diagonales perpendiculaires : NON / OUI / OUI.'
  - numero: 18
    etoiles: 1
    enonce: 'a) Qu''est-ce qu''un trapèze ? b) Quand dit-on qu''un trapèze est isocèle ?


      ### Entraînement ★★'
    correction: a) Un quadrilatère avec exactement deux côtés parallèles, les bases. b) Quand ses deux
      côtés non parallèles sont égaux.
  - numero: 19
    etoiles: 2
    enonce: Vrai ou faux ? a) Le carré est un rectangle particulier. b) Le rectangle est un carré particulier.
      c) Le carré est un losange particulier.
    correction: a) Vrai (quatre angles droits). b) Faux (8 cm sur 3 cm). c) Vrai (quatre côtés égaux).
  - numero: 20
    etoiles: 2
    enonce: Vrai ou faux ? Justifie. a) Les rectangles sont les seuls quadrilatères à avoir quatre angles
      droits. b) Dans un rectangle, les diagonales n'ont pas la même longueur. c) Les côtés opposés d'un
      rectangle sont parallèles.
    correction: 'a) Faux : le carré aussi. b) Faux : elles sont égales. c) Vrai : un rectangle est un
      parallélogramme.'
  - numero: 21
    etoiles: 2
    enonce: Un quadrilatère RSTU a quatre angles droits marqués, et $RS = 7$ cm, $ST = 7$ cm. a) Est-ce
      un rectangle ? Pourquoi ? b) Est-ce aussi un carré ? Pourquoi ? c) Calcule son périmètre.
    correction: 'a) Oui, quatre angles droits, c''est la définition. b) Oui : $RS$ et $ST$ consécutifs
      égaux, donc les quatre côtés valent 7 cm ; c''est un **carré**. c) $P = 4 \times 7 = 28$ cm.'
  - numero: 22
    etoiles: 2
    enonce: Dans le parallélogramme ABCD, l'angle en A mesure $90^{\circ}$. Que vaut l'angle en B ? Quelle
      est la nature de ABCD ?
    correction: 'Angle $B = 180 - 90 = 90^{\circ}$ ; de même pour C et D : ABCD est un **rectangle**.'
  - numero: 23
    etoiles: 2
    enonce: Construis le parallélogramme ABCD tel que $AB = 5$ cm, $AD = 4$ cm et angle $A = 120^{\circ}$.
    correction: '[AB] de 5 cm, angle de $120^{\circ}$ **en A**, D à 4 cm sur la demi-droite ; C au compas
      avec $DC = 5$ cm et $BC = 4$ cm.'
  - numero: 24
    etoiles: 2
    enonce: Construis le triangle SVT tel que $SV = 5$ cm, $ST = 6$ cm et $VT = 4$ cm. Place D tel que
      SVTD soit un parallélogramme. Décris ta méthode.
    correction: 'Triangle SVT au compas (arcs de 6 cm en S et 4 cm en V). Dans SVTD, D est opposé à V
      : on reporte $TD = SV = 5$ cm depuis T et $DS = VT = 4$ cm depuis S ; D est l''intersection, du
      côté opposé à V.'
  - numero: 25
    etoiles: 2
    enonce: 'Construis un losange MNPQ dont les diagonales [MP] et [NQ] mesurent 8 cm et 6 cm. Mesure
      ensuite un côté.


      #### Entraînement intensif : justifier la nature d''un quadrilatère


      *Une réponse sans justification ne vaut rien : nomme la propriété utilisée.*'
    correction: '[MP] de 8 cm, milieu O ; perpendiculaire en O ; $ON = OQ = 3$ cm de part et d''autre.
      Côté mesuré : 5 cm.'
  - numero: 26
    etoiles: 2
    enonce: Le quadrilatère TUVW porte un simple chevron sur [TU] et [WV], un double chevron sur [UV]
      et [TW]. a) Que signifie ce codage ? b) Quelle est la nature de TUVW ? Justifie.
    correction: 'a) Même codage = côtés parallèles : (TU) // (WV) et (UV) // (TW). b) Deux paires de côtés
      opposés parallèles : **parallélogramme** (définition). Les longueurs sont inutiles.'
  - numero: 27
    etoiles: 2
    enonce: Vrai ou faux, en justifiant. a) Dans un parallélogramme, il n'y a jamais d'angle droit. b)
      Les côtés opposés d'un parallélogramme sont égaux. c) Deux angles consécutifs ont pour somme $90^{\circ}$.
    correction: 'a) Faux : le rectangle est un parallélogramme à quatre angles droits. b) Vrai (P1). c)
      Faux : $180^{\circ}$, supplémentaires et non complémentaires.'
  - numero: 28
    etoiles: 2
    enonce: Dans EFGH, (EF) est parallèle à (HG), mais (EH) et (FG) ne le sont pas. On mesure $EH = FG
      = 6$ cm. a) Nature exacte de EFGH ? b) Est-ce un parallélogramme ? Justifie. c) Sachant que $EF
      = 11$ cm et $HG = 5$ cm, calcule le périmètre.
    correction: 'a) Une seule paire parallèle et côtés non parallèles égaux : **trapèze isocèle**. b)
      Non, il faudrait deux paires parallèles. c) $P = 11 + 5 + 6 + 6 = 28$ cm.'
  - numero: 29
    etoiles: 2
    enonce: 'Un élève écrit, pour le parallélogramme EFGH : « l''angle en E mesure $60^{\circ}$, donc
      l''angle en F aussi, car les angles opposés sont égaux. » a) Où est l''erreur ? b) Donne la mesure
      correcte de l''angle en F.


      ### ★★★ Défis de maîtrise'
    correction: 'a) Dans EFGH, F **suit** E : sommets voisins, pas opposés ; l''opposé de E est G. b)
      Angle $F = 180 - 60 = 120^{\circ}$.'
  - numero: 30
    etoiles: 3
    enonce: Les diagonales du parallélogramme ABCD se coupent en O, avec $OA = 3$ cm, $OB = 5$ cm et $AB
      = 4$ cm. a) Calcule le périmètre du triangle AOB. b) Que dire du périmètre du triangle COD ? Justifie.
    correction: 'On cherche d''abord ce que le milieu commun donne : $OC = OA$ et $OD = OB$. a) $P = 3
      + 5 + 4 = 12$ cm. b) $OC = 3$ cm, $OD = 5$ cm et $CD = AB = 4$ cm (P1), donc le périmètre de COD
      vaut **aussi 12 cm** : le demi-tour autour de O envoie AOB sur COD.'
  - numero: 31
    etoiles: 3
    enonce: Pour construire ABCD avec $AB = 6$ cm, $AD = 4$ cm et angle $A = 70^{\circ}$, un élève trace
      [AB] puis reporte l'angle de $70^{\circ}$ **en B**. a) Pourquoi sa figure n'est-elle pas celle qu'on
      demande ? b) Décris les trois étapes correctes.
    correction: L'angle donné est celui **entre [AB] et [AD]**, donc en A. a) En B, l'élève construit
      l'angle voisin ; or les angles en A et B sont supplémentaires, sa figure aura $110^{\circ}$ en A.
      b) Tracer [AB] de 6 cm ; reporter $70^{\circ}$ en A et placer D à 4 cm ; placer C au compas ($DC
      = 6$ cm, $BC = 4$ cm).
  - numero: 32
    etoiles: 3
    enonce: Trace deux droites parallèles $(d_{1})$ et $(d_{2})$ écartées de 4 cm. Place A et B sur $(d_{1})$
      avec $AB = 6$ cm. a) Place C et D sur $(d_{2})$ pour que ABCD soit un parallélogramme. b) Cette
      position est-elle unique ? Explique.
    correction: '[DC] doit être opposé à [AB], donc parallèle et de même longueur ; le parallélisme est
      déjà assuré par $(d_{2})$. a) Placer D sur $(d_{2})$, puis C avec $DC = 6$ cm, C du côté de B (sinon
      figure croisée). b) **Non** : une infinité, on fait glisser (D, C) le long de $(d_{2})$ ; seules
      l''écartement et $DC$ sont fixés.'
  - numero: 33
    etoiles: 3
    enonce: Construis un rectangle IJKL tel que $IJ = 8$ cm et $JK = 4$ cm. a) Place les milieux A, B,
      C, D des quatre côtés. b) Au compas, compare AB, BC, CD et DA. c) Quelle est la nature de ABCD ?
      Justifie.
    correction: 'On construit, puis on mesure avant de conclure. a) Rectangle 8 cm sur 4 cm, milieux A,
      B, C, D. b) Les quatre longueurs se superposent au compas. c) Quatre côtés égaux : **losange**.
      Pas un carré, car $AC = 4$ cm et $BD = 8$ cm ne sont pas égales.'
  - numero: 34
    etoiles: 3
    enonce: 'Fatimata affirme : « les diagonales d''un quadrilatère se coupent en leur milieu et sont
      perpendiculaires, donc c''est un carré. » Explique pourquoi elle se trompe, dis quelle figure elle
      a décrite, et quel renseignement rendrait sa conclusion juste.'
    correction: 'On prend les renseignements un par un. Milieu commun : parallélogramme. Perpendiculaires
      en plus : **losange**. Rien n''est dit des angles ni de la longueur des diagonales, donc on s''arrête
      là. Dessin : diagonales de 8 cm et 4 cm perpendiculaires en leur milieu, figure aplatie sans angle
      droit. Il faudrait ajouter que les diagonales sont **égales** (ou qu''un angle est droit) pour obtenir
      le carré.'
  - numero: 35
    etoiles: 3
    enonce: 'Le tour d''un cadre en forme de parallélogramme mesure 26 cm, et son grand côté dépasse le
      petit de 3 cm. a) Retrouve les quatre côtés. b) Les deux diagonales ont la même longueur : quelle
      est la nature exacte du cadre ? Justifie. c) Pourrait-il être un carré ?'
    correction: 'On remonte du périmètre aux côtés. a) Demi-tour : $26 \div 2 = 13$ cm ; $(13 - 3) \div
      2 = 5$ cm pour le petit, $8$ cm pour le grand. Côtés : 8, 5, 8, 5 cm. b) Parallélogramme à diagonales
      égales : **rectangle** de 8 cm sur 5 cm. c) Non, $8 \ne 5$ ; un carré de même périmètre aurait des
      côtés de $6{,}5$ cm.'
  - numero: 36
    etoiles: 3
    enonce: 'Au ranch de Nazinga, un menuisier assemble un cadre avec deux baguettes de 120 cm et deux
      de 90 cm. Avant de clouer la tôle, il mesure d''un coin au coin opposé : 152 cm, puis 148 cm dans
      l''autre sens. Le ranch reçoit 60 visiteurs par semaine. Le chef de chantier veut un cadre à quatre
      angles droits. Peut-on clouer la tôle ?'
    correction: 'On trie d''abord : les 60 visiteurs sont une donnée de décor. Baguettes égales deux à
      deux : le cadre est un **parallélogramme**. La signature du rectangle porte sur les diagonales,
      qui doivent être **égales** ; or $152 \ne 148$. Ce n''est donc pas un rectangle. **Il ne faut pas
      clouer :** pousser le cadre du côté de la grande diagonale jusqu''à lire la même mesure des deux
      côtés, puis clouer.'
  fiche_revision:
  - '**Parallélogramme.** Côtés opposés parallèles **deux à deux** ; une seule paire, c''est un trapèze.'
  - '**Ses quatre propriétés.** Côtés opposés égaux ; angles opposés égaux ; angles consécutifs supplémentaires
    ; diagonales de milieu commun O, centre de symétrie.'
  - '**Rectangle.** Quatre angles droits ; diagonales **égales** ; 2 axes.'
  - '**Losange.** Quatre côtés égaux ; diagonales **perpendiculaires** ; 2 axes (ses diagonales).'
  - '**Carré.** Rectangle **et** losange ; diagonales égales et perpendiculaires ; 4 axes.'
  - '**Trapèze.** Une seule paire de côtés parallèles, les bases ; isocèle si les côtés non parallèles
    sont égaux.'
  - '**Justifier.** Parallélismes, puis angles droits, puis côtés égaux. Tant qu''une donnée n''a pas
    servi, la nature n''est pas exacte.'
  trouve_erreur:
  - faux: Je note le parallélogramme ABDC
    correction: 'On tourne autour de la figure : ABCD, BCDA, CDAB, DABC. ABDC donne une figure croisée.'
  - faux: Angle $A = 70^{\circ}$, donc angle $B = 70^{\circ}$
    correction: 'B est **voisin** de A : angle $B = 110^{\circ}$. L''opposé de A est C.'
  - faux: Les diagonales du rectangle sont perpendiculaires
    correction: Non, elles sont **égales**. Perpendiculaires, c'est le losange.
  - faux: Quatre côtés égaux, donc c'est un carré
    correction: 'Non : c''est un **losange**. Il faut en plus un angle droit ou des diagonales égales.'
  cartographie_lacunes:
  - lacune: Parallélogrammes confondus, caractérisations oubliées
    bloque_en: symétrie centrale (propriétés)
  source_path: remediation\5eme\modules_c\M09.md
- niveau: 5eme
  module: 10
  module_titre: Symétrie orthogonale et repérage
  pourquoi: Le symétrique d'un point se place trop souvent « à peu près en face » au lieu d'être construit
    perpendiculairement à l'axe. Et les coordonnées se lisent dans le désordre, l'ordonnée avant l'abscisse.
  diagnostic:
  - question: Combien d'axes de symétrie possède un rectangle qui n'est pas un carré ? Lesquels ?
    reponse: $2$ axes, ses médianes ; pas ses diagonales
  - question: A et $A'$ sont symétriques par rapport à (D). Que représente (D) pour $\left[AA'\right]$
      ?
    reponse: la médiatrice de $\left[AA'\right]$
  - question: $\left[AB\right]$ mesure $7$ cm. Combien mesure son symétrique $\left[A'B'\right]$ ?
    reponse: $7$ cm
  - question: Sur une droite graduée, quelle est l'abscisse du point situé $2{,}5$ unités à gauche du
      $0$ ?
    reponse: $-2{,}5$
  - question: Quel est le symétrique de $T\left(4\,;\,2\right)$ par rapport à l'axe des abscisses ?
    reponse: $T'\left(4\,;\,-2\right)$
  lecons:
  - id: 5eme_M10_L1
    numero: '10.1'
    titre: Axes de symétrie
    retenir:
    - (D) est un **axe de symétrie** si le pliage le long de (D) superpose **exactement** les deux moitiés,
      point par point.
    - Une figure peut avoir **aucun**, **un** ou **plusieurs** axes.
    - Un axe peut être vertical, horizontal ou **oblique**.
    - 'Se ressembler ne suffit pas : un dessin presque symétrique n''est pas symétrique.'
    methode:
      titre: Trouver tous les axes d'une figure
      etapes:
      - Essaie le pliage selon les **médianes** (droites joignant les milieux de deux côtés opposés).
      - Essaie le pliage selon les **diagonales**.
      - Pour un triangle, essaie sommet – milieu du côté opposé.
      - Ne garde que les pliages qui superposent exactement, trace-les en pointillés et compte.
    exemple_resolu: 'Un menuisier de Fada N''Gourma trace tous les axes de quatre plateaux : un carré,
      un rectangle, un losange, un octogone régulier. Combien de traits en tout ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Carré : médianes et diagonales. | $2 + 2 = 4$ axes. |

      | Rectangle : médianes seules ; losange : diagonales seules. | $2$ axes ; $2$ axes. |

      | Octogone régulier : $n$ côtés donnent $n$ axes. | $8$ axes. |

      | **Vérification :** $4 + 2 + 2 + 8 = 16$ traits. ✓ | |


      [SVG: figures/m10_f6.svg]

      *Figure 10.1 : Les axes du carré, du rectangle, du losange, du triangle équilatéral et du parallélogramme.*'
    erreurs_frequentes:
    - erreur: « le rectangle a $4$ axes comme le carré ».
      correction: il n'en a que $2$, ses médianes ; le pliage selon une diagonale pose un côté long sur
        un côté court.
    - erreur: partager en deux parts de même aire, c'est être un axe.
      correction: non, l'égalité des aires est bien moins exigeante que la superposition.
    declic: null
    figures:
    - figures/m10_f6.svg
  - id: 5eme_M10_L2
    numero: '10.2'
    titre: Construire un symétrique
    retenir:
    - 'A et $A''$ sont **symétriques par rapport à (D)** lorsque (D) est la **médiatrice** de $\left[AA''\right]$
      : perpendiculaire à $\left[AA''\right]$ **et** passant par son milieu H.'
    - '**Si A est sur (D)**, alors $A'' = A$.'
    - Si on connaît A et $A'$ sans l'axe, l'axe est la médiatrice de $\left[AA'\right]$.
    methode:
      titre: Construire le symétrique d'un point
      etapes:
      - Trace à l'équerre la perpendiculaire à (D) passant par A ; elle coupe (D) en H.
      - Mesure $HA$.
      - 'Reporte $HA$ à partir de H, de **l''autre côté** de (D), sur cette perpendiculaire : c''est $A''$.'
      - 'Contrôle : H est le milieu de $\left[AA''\right]$ ; le pliage pose A sur $A''$.'
    exemple_resolu: 'Sur le plan d''un jardin de Léo, un manguier M est à $2{,}5$ cm de l''allée (d).
      On plante $M''$, symétrique de M. Combien vaut $MM''$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | H est le pied de la perpendiculaire de M sur (d). | $HM = 2{,}5$ cm. |

      | $M''$ est de l''autre côté, à la même distance. | $HM'' = 2{,}5$ cm. |

      | H est le milieu de $\left[MM''\right]$. | $MM'' = 2{,}5 + 2{,}5 = 5$ cm. |

      | **Vérification :** $5 \div 2 = 2{,}5$ cm. ✓ | |


      [SVG: figures/m10_f3.svg]

      *Figure 10.2 : Perpendiculaire à (d), pied H, report de la distance de l''autre côté.*


      > #### MÉTHODE : Construire le symétrique d''une figure

      >

      > 1. Repère les points-clés : sommets, extrémités, centre d''un cercle.

      > 2. Construis le symétrique de chacun ; un point sur (D) ne bouge pas.

      > 3. Relie les images **dans le même ordre**.

      > 4. Vérifie : chaque longueur est conservée.


      > #### 📖 CE QU''IL FAUT RETENIR

      >

      > **Ce que la symétrie conserve**

      >

      > - Segment $\to$ segment de **même longueur** ; droite $\to$ droite ; cercle $\to$ cercle de **même
      rayon**.

      > - Figure usuelle $\to$ figure de **même nature** (rectangle $\to$ rectangle).

      > - Sont conservés : **longueurs, angles, alignement, parallélisme, aires, périmètres**.

      > - N''est pas conservé : le **sens de lecture**.

      > - Une longueur ou une aire sur la figure image **se recopie**, elle ne se recalcule pas.'
    erreurs_frequentes:
    - erreur: reporter A « tout droit en face », sans perpendiculaire.
      correction: $A'$ est toujours sur la perpendiculaire à (D) issue de A.
    - erreur: reporter $AA'$ à partir de l'axe.
      correction: la distance à reporter est $HA$ ; $AA'$ en est le double.
    declic: 'Tout repose sur la médiatrice — Si « (D) est la médiatrice de $\left[AA''\right]$ » ne te
      dit rien de précis, inutile d''aller plus loin. Deux mots, deux exigences : **perpendiculaire**
      et **milieu**. Reprends le module 7, puis reviens : la suite devient une simple application. ####
      MÉTHODE : Construire le symétrique d''un point 1. Trace à l''équerre la perpendiculaire à (D) passant
      par A ; elle coupe (D) en H. 2. Mesure $HA$. 3. Reporte $HA$ à partir de H, de **l''autre côté**
      de (D), sur cette perpendiculaire : c''est $A''$. 4. Contrôle : H est le milieu de $\left[AA''\right]$
      ; le pliage pose A sur $A''$.'
    figures:
    - figures/m10_f3.svg
  - id: 5eme_M10_L3
    numero: '10.3'
    titre: Repérer sur une droite graduée et dans le plan
    retenir:
    - Une droite graduée a une **origine** O, une **unité**, un **sens**.
    - 'L''**abscisse** est positive à droite du $0$, négative à gauche, nulle en O : $A\left(+3\right)$.'
    - 'L''unité peut valoir autre chose qu''un centimètre : $50$ km, $5\ ^{\circ}$C, $1\,000$ FCFA.'
    - '**Distance :** abscisses du même côté du $0$, on soustrait ; de part et d''autre, on additionne
      les deux distances au $0$.'
    methode:
      titre: Placer et lire $M\left(x\,;\,y\right)$
      etapes:
      - 'Placer : pars de O, déplace-toi **horizontalement** de $x$, puis **verticalement** de $y$.'
      - 'Lire : du point, va tout droit vers l''axe horizontal (abscisse), puis vers l''axe vertical (ordonnée).'
      - Écris toujours $\left(\text{abscisse}\,;\,\text{ordonnée}\right)$.
      - 'Contrôle par les signes : $\left(+\,;\,+\right)$ en haut à droite, $\left(-\,;\,+\right)$ en
        haut à gauche, $\left(+\,;\,-\right)$ en bas à droite, $\left(-\,;\,-\right)$ en bas à gauche.'
    exemple_resolu: 'Sur une droite graduée d''unité $1$ cm, $E\left(-3\right)$ et $F\left(+5\right)$.
      Distance $EF$ ? Abscisse du milieu M ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | E et F encadrent le $0$ : on additionne les deux distances au $0$. | $EF = 3 + 5 = 8$ unités.
      |

      | Le milieu partage en deux parts égales. | $8 \div 2 = 4$ unités. |

      | De $-3$, on avance de $4$ vers la droite. | $M\left(+1\right)$. |

      | **Vérification :** de $+5$, on recule de $4$ : on retombe sur $+1$. ✓ | |


      [SVG: figures/m10_f7.svg]

      *Figure 10.3 : Une droite graduée ; un repère avec un point et ses symétriques par rapport à chaque
      axe.*'
    erreurs_frequentes:
    - erreur: placer $-1{,}5$ entre $-1$ et $0$.
      correction: '$1{,}5 > 1$, donc le point est **plus loin** du $0$ : entre $-2$ et $-1$.'
    - erreur: pour $M\left(2\,;\,3\right)$, aller $3$ à droite puis $2$ en haut.
      correction: $2$ à droite, **puis** $3$ en haut.
    declic: null
    figures:
    - figures/m10_f7.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Définis ce qu'est un axe de symétrie d'une figure.
    correction: Une droite telle que le pliage de la figure le long d'elle superpose **exactement** les
      deux parties, point par point.
  - numero: 2
    etoiles: 1
    enonce: 'Parmi les chiffres $0$, $1$, $3$, $8$ : a) lesquels ont un axe horizontal ? b) lesquels ont
      un axe vertical ?'
    correction: 'a) Axe horizontal : $0$, $1$, $3$, $8$. b) Axe vertical : $0$, $1$, $8$ ; le $3$ n''en
      a pas.'
  - numero: 3
    etoiles: 1
    enonce: 'Parmi les lettres A, B, M, F, P, R : a) cite deux lettres ayant au moins un axe ; b) cite
      deux lettres n''en ayant aucun.'
    correction: a) A et M (axe vertical) ; B convient aussi (axe horizontal). b) F et R ; P également.
  - numero: 4
    etoiles: 1
    enonce: 'Parmi ces objets, lesquels ont au moins un axe de symétrie : une calebasse, une houe, une
      natte tressée carrée, une machette ?'
    correction: La calebasse et la natte tressée carrée ($4$ axes). La houe et la machette n'en ont aucun.
  - numero: 5
    etoiles: 1
    enonce: Sur un quadrillage, complète une figure pour que la droite (D) en soit un axe de symétrie,
      en hachurant le moins de cases possible.
    correction: Pour chaque case hachurée, compter les carreaux jusqu'à (D) et hachurer la case au même
      nombre de carreaux de l'autre côté, **sur la même ligne**. Le total de cases doit être pair.
  - numero: 6
    etoiles: 1
    enonce: Dessine un carré et trace tous ses axes de symétrie. Combien y en a-t-il ?
    correction: '$4$ axes : les $2$ médianes et les $2$ diagonales.'
  - numero: 7
    etoiles: 1
    enonce: Trace un rectangle et tous ses axes. Ses diagonales en font-elles partie ?
    correction: $2$ axes, ses médianes. Non, ses diagonales n'en font pas partie.
  - numero: 8
    etoiles: 1
    enonce: Combien d'axes de symétrie a un cercle ? Lesquels ?
    correction: 'Une **infinité** : toutes les droites passant par le centre, c''est-à-dire tous ses diamètres.'
  - numero: 9
    etoiles: 1
    enonce: Trace un triangle isocèle et son unique axe. Que représente cet axe pour la base ?
    correction: 'Un seul axe : la droite passant par le sommet principal et le milieu de la base. C''est
      la **médiatrice de la base**.'
  - numero: 10
    etoiles: 1
    enonce: 'Recopie et complète : A et $A''$ sont symétriques par rapport à (D) lorsque (D) est la …
      de $\left[AA''\right]$.'
    correction: … la **médiatrice** de $\left[AA'\right]$.
  - numero: 11
    etoiles: 1
    enonce: Trace une droite (d) verticale et un point P à $5$ cm à gauche de (d). Construis $P'$. À quelle
      distance de (d) se trouve $P'$ ? Combien vaut $PP'$ ?
    correction: Perpendiculaire à (d) par P, pied H, report de $5$ cm à droite. $P'$ est à **$5$ cm**
      de (d) et $PP' = 5 + 5 = 10$ cm.
  - numero: 12
    etoiles: 1
    enonce: Trace une droite (d) oblique et un point A. Construis $A'$ **au compas**.
    correction: Arc de centre A coupant (d) en M et N ; sans changer l'écartement, deux arcs de centres
      M et N se recoupent en $A'$. M et N sont à égale distance de A et $A'$, donc (d) est la médiatrice
      de $\left[AA'\right]$.
  - numero: 13
    etoiles: 1
    enonce: On a placé A et $A'$ sur une feuille. Explique comment retrouver l'axe (d).
    correction: 'L''axe est la médiatrice de $\left[AA''\right]$ : tracer $\left[AA''\right]$, placer
      son milieu H, tracer la perpendiculaire en H.'
  - numero: 14
    etoiles: 1
    enonce: $\left[RS\right]$ mesure $6$ cm. Quelle est la longueur de son symétrique $\left[R'S'\right]$
      ?
    correction: '$R''S'' = 6$ cm : la symétrie conserve les longueurs. On recopie.'
  - numero: 15
    etoiles: 1
    enonce: Le triangle ABC a des côtés de $3$ cm, $4$ cm et $5$ cm. Donne les côtés de $A'B'C'$, puis
      son périmètre.
    correction: Côtés $3$ cm, $4$ cm, $5$ cm ; périmètre $3 + 4 + 5 = 12$ cm.
  - numero: 16
    etoiles: 1
    enonce: 'Donne l''abscisse : d''un point $5$ unités à droite du $0$ ; d''un point $3$ unités à gauche
      ; d''un point $1{,}5$ unité à droite.'
    correction: $+5$ ; $-3$ ; $+1{,}5$.
  - numero: 17
    etoiles: 1
    enonce: Sur une droite graduée ($1$ cm $= 1$ unité), place les points d'abscisses $-3\,;\,+3{,}5\,;\,0\,;\,-2\,;\,+1$.
    correction: 'De gauche à droite : $-3$, $-2$, $0$, $+1$, $+3{,}5$ (ce dernier au milieu de $+3$ et
      $+4$).'
  - numero: 18
    etoiles: 1
    enonce: 'a) Dans $M\left(-1\,;\,2\right)$, donne l''abscisse et l''ordonnée. b) Place $A\left(3\,;\,-2\right)$
      : dans quelle zone se trouve-t-il ?


      ### Entraînement ★★'
    correction: a) Abscisse $-1$, ordonnée $2$. b) Zone **en bas à droite** ($+\,;\,-$).
  - numero: 19
    etoiles: 2
    enonce: Vrai ou faux ? Justifie. a) Si une figure a un axe de symétrie, le pliage le long de cet axe
      superpose exactement les deux moitiés. b) Un axe de symétrie partage la figure en deux parts de
      même aire. c) Une figure partagée en deux parts de même aire possède forcément un axe de symétrie.
    correction: 'a) **Vrai**, c''est la définition. b) **Vrai** : deux moitiés superposables occupent
      la même surface. c) **Faux** : une diagonale de parallélogramme quelconque donne deux triangles
      de même aire, sans aucun axe.'
  - numero: 20
    etoiles: 2
    enonce: 'Parmi le carré, le losange, le parallélogramme quelconque, le rectangle et le triangle isocèle,
      donne les figures qui ont : a) un seul axe ; b) deux axes ; c) quatre axes ; d) aucun axe.'
    correction: a) Triangle isocèle. b) Rectangle (médianes) et losange (diagonales). c) Carré. d) Parallélogramme
      quelconque.
  - numero: 21
    etoiles: 2
    enonce: A et B sont symétriques par rapport à (d), et $AB = 9$ cm. a) À quelle distance de (d) se
      trouve A ? b) Et B ?
    correction: (d) est la médiatrice de $\left[AB\right]$, donc coupe $\left[AB\right]$ en son milieu.
      a) $9 \div 2 = 4{,}5$ cm. b) $4{,}5$ cm aussi.
  - numero: 22
    etoiles: 2
    enonce: 'Trace un triangle IJK et une droite (D) qui ne le coupe pas. a) Construis $I''J''K''$. b)
      L''aire de IJK vaut $12$ cm$^{2}$ : quelle est celle de $I''J''K''$ ? Justifie.'
    correction: 'a) Construire $I''$, $J''$, $K''$ un par un sur la perpendiculaire à (D) issue de chaque
      sommet, à même distance ; relier dans le même ordre. b) $12$ cm$^{2}$ : la symétrie conserve les
      aires.'
  - numero: 23
    etoiles: 2
    enonce: ABCD a un périmètre de $24$ cm et une aire de $32$ cm$^{2}$. On construit $A'B'C'D'$ par rapport
      à (D) qui ne le coupe pas. a) Son périmètre ? b) Son aire ? c) L'aire de la figure formée par les
      deux quadrilatères réunis ?
    correction: 'a) $24$ cm. b) $32$ cm$^{2}$. c) Pas de chevauchement : $32 + 32 = 64$ cm$^{2}$.'
  - numero: 24
    etoiles: 2
    enonce: 'Deux points ont pour abscisses $-4$ et $+6$. a) Quelle distance les sépare ? b) Quelle est
      l''abscisse du milieu du segment qui les joint ?


      #### Entraînement intensif : placer et lire des coordonnées


      *Un seul repère par exercice.*'
    correction: 'a) De part et d''autre du $0$ : $4 + 6 = 10$ unités. b) $10 \div 2 = 5$ ; de $-4$ on
      avance de $5$ : abscisse $+1$.'
  - numero: 25
    etoiles: 2
    enonce: 'Papa Boureima repère ses parcelles : Mil $P\left(2\,;\,3\right)$, Sorgho $Q\left(-1\,;\,2\right)$,
      Arachide $R\left(3\,;\,-1\right)$, Niébé $S\left(-2\,;\,-1\right)$. a) Place ces quatre points.
      b) Quelle culture est la plus au Nord ? c) La plus à l''Ouest ?'
    correction: 'b) Plus grande ordonnée $3$ : le **mil**. c) Plus petite abscisse $-2$ : le **niébé**.'
  - numero: 26
    etoiles: 2
    enonce: 'Place $A\left(2\,;\,0\right)$, $B\left(0\,;\,2\right)$, $C\left(-2\,;\,0\right)$, $D\left(0\,;\,-2\right)$
      et $N\left(-2\,;\,-3\right)$. a) Pour chacun, dis s''il est sur un axe, et sur lequel. b) Relie
      A, B, C, D dans cet ordre : quelle figure obtiens-tu ?'
    correction: 'a) A et C sur l''axe des abscisses, B et D sur l''axe des ordonnées ; N sur aucun axe
      (zone en bas à gauche). b) Quatre points à $2$ carreaux de O : les côtés sont égaux et les diagonales
      perpendiculaires et de même longueur ($4$ carreaux) : un **carré** posé sur la pointe.'
  - numero: 27
    etoiles: 2
    enonce: Place $A\left(1\,;\,1\right)$, $B\left(5\,;\,1\right)$, $C\left(5\,;\,4\right)$. a) Place
      D pour que ABCD soit un rectangle et donne ses coordonnées. b) Donne sa longueur et sa largeur,
      en carreaux.
    correction: 'a) D est à l''ordonnée de C et à l''abscisse de A : $D\left(1\,;\,4\right)$. b) $AB =
      5 - 1 = 4$ carreaux ; $BC = 4 - 1 = 3$ carreaux.'
  - numero: 28
    etoiles: 2
    enonce: Place $A\left(0\,;\,0\right)$, $B\left(4\,;\,0\right)$, $C\left(4\,;\,3\right)$ et relie-les.
      a) Quelle est la nature du triangle ABC ? b) Donne les longueurs des deux côtés de l'angle droit.
    correction: 'a) $\left[AB\right]$ horizontal (ordonnée $0$) et $\left[BC\right]$ vertical (abscisse
      $4$) : triangle **rectangle en B**. b) $AB = 4$ carreaux, $BC = 3$ carreaux.'
  - numero: 29
    etoiles: 2
    enonce: Place $A\left(3\,;\,2\right)$. Donne les coordonnées de son symétrique par rapport à l'axe
      des abscisses, puis par rapport à l'axe des ordonnées.
    correction: 'Par rapport à l''axe des abscisses : $A''\left(3\,;\,-2\right)$. Par rapport à l''axe
      des ordonnées : A″$\left(-3\,;\,2\right)$.'
  - numero: 30
    etoiles: 2
    enonce: 'À Kongoussi, un jardin a pour coins $A\left(-3\,;\,1\right)$, $B\left(2\,;\,1\right)$, $C\left(2\,;\,4\right)$,
      $D\left(-3\,;\,4\right)$, avec $1$ carreau $= 10$ m. a) Place les points et reconnais la figure.
      b) Donne la longueur et la largeur réelles. c) Quel est son périmètre réel ?


      ### ★★★ Défis de maîtrise'
    correction: 'a) Côtés deux à deux horizontaux et verticaux : un **rectangle**. b) $AB = 2 - \left(-3\right)
      = 5$ carreaux $= 50$ m ; $BC = 4 - 1 = 3$ carreaux $= 30$ m. c) $\left(50 + 30\right) \times 2 =
      160$ m.'
  - numero: 31
    etoiles: 3
    enonce: 'Un élève affirme : « pour construire le symétrique d''un segment, il suffit de construire
      le symétrique de son milieu ». a) Explique pourquoi c''est faux. b) Quels points faut-il réellement
      construire, et pourquoi ceux-là ?'
    correction: 'On cherche d''abord ce qui définit un segment : ses **extrémités**, et rien d''autre.
      a) Faux : une infinité de segments passent par l''image du milieu, avec des longueurs et des directions
      différentes. b) Il faut construire le symétrique de **chaque extrémité**, puis relier $A''$ et $B''$
      : deux points déterminent un segment unique. Le symétrique du milieu est bien le milieu de $\left[A''B''\right]$,
      mais c''est une conséquence.'
  - numero: 32
    etoiles: 3
    enonce: Une plaque rectangulaire de $12$ cm sur $5$ cm est coupée en deux le long d'un de ses axes
      de symétrie. a) Dimensions de chaque morceau, selon l'axe choisi ? b) Aire d'un morceau dans les
      deux cas ? c) Que remarques-tu, et comment l'expliques-tu sans nouveau calcul ?
    correction: 'On identifie d''abord les axes disponibles : le rectangle en a **deux**, ses médianes,
      donc deux découpes possibles. a) $6$ cm sur $5$ cm, ou $12$ cm sur $2{,}5$ cm. b) $6 \times 5 =
      30$ cm$^{2}$ ; $12 \times 2{,}5 = 30$ cm$^{2}$. c) Aires égales, prévisible sans calcul : un axe
      partage toujours en deux moitiés superposables, donc en deux moitiés de l''aire totale $12 \times
      5 = 60$ cm$^{2}$.'
  - numero: 33
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une propriété ou un contre-exemple. a) Le symétrique d'un cercle
      de rayon $3$ cm est un cercle de rayon $3$ cm. b) Si deux points sont à la même distance d'une droite
      (d), alors ils sont symétriques par rapport à (d). c) Une figure et son symétrique ont toujours
      le même périmètre. d) Un quadrilatère ayant exactement deux axes de symétrie est forcément un carré.
    correction: 'On cherche pour chaque item soit la propriété, soit un contre-exemple. a) **Vrai** :
      la symétrie conserve les longueurs, donc le rayon. b) **Faux** : R à $4$ cm au-dessus de (d) et
      S à $4$ cm au-dessous mais décalé de $3$ cm ; $\left[RS\right]$ n''est pas perpendiculaire à (d).
      Il manque l''angle droit. c) **Vrai** : chaque longueur est conservée, donc leur somme. d) **Faux**
      : un rectangle $6 \times 3$ a exactement deux axes sans être un carré.'
  - numero: 34
    etoiles: 3
    enonce: À Bogandé, Salif tresse une natte rectangulaire de $120$ cm sur $80$ cm. Il veut coudre un
      ruban sur chaque axe de symétrie. Son apprenti affirme qu'il en faut quatre, comme pour un carré,
      et que les diagonales en font partie. Salif possède un ruban de $250$ cm. La natte sera vendue au
      marché du jeudi. Tranche la question de l'apprenti et dis à Salif si son ruban suffit.
    correction: 'On règle d''abord le nombre d''axes, sinon on compte du ruban pour rien. La natte est
      un rectangle ($120 \neq 80$) : **$2$ axes**, ses médianes ; les diagonales n''en sont pas, car un
      côté de $120$ cm se poserait sur un côté de $80$ cm. L''apprenti a tort deux fois. Rubans : $120$
      cm et $80$ cm, soit $200$ cm. Or $200 < 250$ : **le ruban suffit**, il en reste $50$ cm. Le jour
      du marché ne sert à rien.'
  - numero: 35
    etoiles: 3
    enonce: 'À Diébougou, trois karités : $A\left(-2\,;\,2\right)$, $B\left(1\,;\,2\right)$, $C\left(4\,;\,2\right)$.
      a) Que remarques-tu sur leurs ordonnées, et qu''en déduis-tu ? b) Quel arbre est au milieu des deux
      autres ? Justifie en comptant les carreaux. c) Un karité D doit être planté pour que B soit le milieu
      de $\left[AD\right]$ : donne ses coordonnées.'
    correction: 'On regarde d''abord ce que les trois couples ont en commun. a) Même ordonnée $2$ : les
      trois karités sont **alignés** horizontalement. b) $1 - \left(-2\right) = 3$ et $4 - 1 = 3$ : écarts
      égaux, donc **B est le milieu de $\left[AC\right]$**. c) A est à $3$ carreaux à gauche de B, donc
      D est à $3$ carreaux à droite : $D\left(4\,;\,2\right)$, la position de C.'
  - numero: 36
    etoiles: 3
    enonce: Au périmètre rizicole de Mogtédo, $1$ carreau $= 10$ m. La vanne est en $V\left(1\,;\,2\right)$,
      la parcelle de Fatimata en $F\left(8\,;\,2\right)$, le magasin en $\left(3\,;\,5\right)$. Une ONG
      livre un tuyau de $60$ m pour relier la vanne à la parcelle en ligne droite. Ce tuyau suffit-il
      ? Sinon, combien de mètres commander ?
    correction: 'On vérifie d''abord si la longueur est calculable : elle l''est car V et F ont la même
      ordonnée $2$, le segment est horizontal. $8 - 1 = 7$ carreaux $= 70$ m. Or $60 < 70$ : **le tuyau
      ne suffit pas**, il manque $70 - 60 = 10$ m. Le magasin est une donnée parasite.'
  - numero: 37
    etoiles: 3
    enonce: On part de $A\left(3\,;\,-2\right)$. On construit $A_{1}$, symétrique de A par rapport à l'axe
      des abscisses ; $A_{2}$, symétrique de $A_{1}$ par rapport à l'axe des ordonnées ; $A_{3}$, symétrique
      de $A_{2}$ par rapport à l'axe des abscisses ; $A_{4}$, symétrique de $A_{3}$ par rapport à l'axe
      des ordonnées. a) Donne les coordonnées de $A_{1}$ à $A_{4}$. b) Que remarques-tu ? c) Où seraient
      $A_{20}$ et $A_{21}$ ? Explique sans construire.
    correction: 'On applique la règle des signes une étape à la fois, sans dessiner. a) $A_{1}\left(3\,;\,2\right)$,
      $A_{2}\left(-3\,;\,2\right)$, $A_{3}\left(-3\,;\,-2\right)$, $A_{4}\left(3\,;\,-2\right)$. b) $A_{4}
      = A$ : le cycle se referme en $4$ étapes, et les quatre points forment un rectangle centré sur O.
      c) $20 = 4 \times 5$, donc $A_{20} = A\left(3\,;\,-2\right)$ ; $A_{21}$ est comme $A_{1}$ : $\left(3\,;\,2\right)$.
      Quatre positions possibles en tout.'
  fiche_revision:
  - '**Axe de symétrie.** Le pliage le long de (D) superpose **exactement** les deux moitiés ; zéro, un
    ou plusieurs axes ; pas forcément vertical.'
  - '**Points symétriques.** (D) est la **médiatrice** de $\left[AA''\right]$ : perpendiculaire et milieu.
    Si A est sur (D), $A'' = A$. Toujours $AA'' = 2 \times HA$.'
  - '**Construire.** Équerre : perpendiculaire par A, pied H, report de $HA$ de l''autre côté. Compas
    : un arc de centre A coupe (D) en M et N, deux arcs de même rayon depuis M et N se recoupent en $A''$.
    Figure : point-clé par point-clé, on relie dans le même ordre.'
  - '**Conservation.** Longueurs, angles, alignement, parallélisme, aires, périmètres. Seul le sens de
    lecture est inversé : une longueur image **se recopie**.'
  - '**Axes usuels.** Cercle : infinité ; carré $4$ ; rectangle $2$ (médianes) ; losange $2$ (diagonales)
    ; équilatéral $3$ ; isocèle $1$ ; quelconque $0$ ; parallélogramme quelconque $0$ ; polygone régulier
    à $n$ côtés : $n$.'
  - '**Droite graduée.** Origine, unité, sens. Abscisse positive à droite, négative à gauche.'
  - '**Repère.** $M\left(x\,;\,y\right)$, abscisse d''abord : « O, puis horizontal, puis vertical ». Par
    rapport à l''axe des abscisses, l''ordonnée change de signe ; par rapport à l''axe des ordonnées,
    l''abscisse change de signe.'
  trouve_erreur:
  - faux: « Le symétrique de A est de mon côté, à la même distance. »
    correction: $A'$ est de **l'autre** côté de (D).
  - faux: « Je reporte $AA' = 6$ cm à partir de (D). »
    correction: On reporte $HA = 3$ cm ; $AA'$ en est le double.
  - faux: « La diagonale du rectangle est un axe, elle le coupe en deux parts de même aire. »
    correction: Le pliage pose un côté long sur un côté court. Le rectangle n'a que $2$ axes.
  - faux: '« $M\left(2\,;\,3\right)$ : je monte de $2$, puis j''avance de $3$. »'
    correction: 'Abscisse d''abord : $2$ à droite, puis $3$ en haut.'
  - faux: « $-2{,}5$ se place entre $-2$ et $-1$. »
    correction: '$2{,}5 > 2$ : le point est plus loin du $0$, entre $-3$ et $-2$.'
  cartographie_lacunes:
  - lacune: Symétrie approximative, coordonnées mal lues
    bloque_en: symétrie centrale, repérage
  source_path: remediation\5eme\modules_c\M10.md
- niveau: 5eme
  module: 11
  module_titre: 'Aires, volumes et conversions : le pavé droit et le cube'
  pourquoi: Périmètre et aire se confondent dès qu'un énoncé parle de « surface » ou de « tour ». Et les
    conversions d'aires et de volumes se font d'un seul rang, comme des longueurs.
  diagnostic:
  - question: Périmètre et aire d'un rectangle de $8$ cm sur $5$ cm.
    reponse: $P = 26$ cm ; $A = 40$ cm$^{2}$
  - question: 'Complète : $3 m^{2} = \dots$ cm$^{2}$.'
    reponse: $30\,000$ cm$^{2}$
  - question: Combien de faces, d'arêtes et de sommets a un pavé droit ?
    reponse: $6$, $12$, $8$
  - question: Volume d'un cube de $3$ cm d'arête.
    reponse: $27$ cm$^{3}$
  - question: 'Complète : $2\,500$ cm$^{3} = \dots$ litres.'
    reponse: $2{,}5$ litres
  lecons:
  - id: 5eme_M11_L1
    numero: '11.1'
    titre: Périmètre, aire, et les unités qui vont avec
    retenir:
    - 'Le **périmètre** est la longueur du tour : cm, m, km.'
    - 'L''**aire** mesure la surface intérieure : cm$^{2}$, $m^{2}$, km$^{2}$.'
    - '|---|---|---|'
    - On prend toujours $\pi \approx 3{,}14$.
    - 'Entre deux unités d''aire voisines, le rapport est **$100$**, et non $10$ : **deux colonnes** par
      unité.'
    - $1$ ha $= 1$ hm$^{2} = 10\,000 m^{2}$.
    methode:
      titre: Choisir entre périmètre et aire, puis convertir
      etapes:
      - 'Souligne le verbe : entourer, clôturer $\to$ périmètre ; recouvrir, peindre, carreler $\to$ aire.'
      - Écris la formule, remplace les lettres par les nombres.
      - 'Donne le résultat **avec son unité** : simple pour un périmètre, carrée pour une aire.'
      - Si l'unité demandée diffère, compte **deux rangs par unité** franchie.
    exemple_resolu: 'Une place est un disque de rayon $25$ m. Bordure du tour, puis superficie en cm$^{2}$
      ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | « Entourer » $\to$ périmètre. | $P = 2 \times 3{,}14 \times 25 = 157$ m |

      | « Superficie » $\to$ aire : le rayon sert deux fois. | $A = 3{,}14 \times 25 \times 25 = 1\,962{,}5
      m^{2}$ |

      | Des $m^{2}$ aux cm$^{2}$ : deux unités, donc $\times 10\,000$. | $A = 19\,625\,000$ cm$^{2}$ |

      | **Vérification :** le disque tient dans un carré de $50$ m de côté, d''aire $2\,500 m^{2}$. ✓
      | |'
    erreurs_frequentes:
    - erreur: $A = 2 \times \pi \times r$.
      correction: c'est le périmètre ; l'aire est $\pi \times r \times r$ (pour $r = 4$ cm, $50{,}24$
        cm$^{2}$).
    - erreur: $3 m^{2} = 300$ cm$^{2}$.
      correction: deux unités franchies, donc $30\,000$ cm$^{2}$.
    declic: null
    figures: []
  - id: 5eme_M11_L2
    numero: '11.2'
    titre: Décrire et représenter le pavé droit et le cube
    retenir:
    - 'Un **pavé droit** a **$6$ faces** rectangulaires opposées deux à deux, **$12$ arêtes**, **$8$ sommets**
      ; de chaque sommet partent $3$ arêtes. Ses dimensions : $L$, $l$, $h$.'
    - Un **cube** est un pavé droit dont les $6$ faces sont des **carrés identiques**.
    - 'Sur un pavé $ABCDEFGH$ ($ABCD$ dessous, $EFGH$ dessus) : une **face** se nomme par ses quatre sommets
      ($ABFE$), une **arête** par ses extrémités ($\left[AB\right]$) ; deux faces sont **opposées** si
      elles n''ont **aucun sommet commun**.'
    - 'En **perspective cavalière** : face avant en vraie grandeur, profondeur oblique et raccourcie,
      **$3$ arêtes cachées** en **pointillés**.'
    - 'Le **patron** est le solide déplié : **$6$ rectangles** par paires identiques, **$6$ carrés** pour
      un cube. Six carrés ne font pas toujours un patron : rangés en $2$ sur $3$, ils ne se referment
      pas.'
    methode:
      titre: Tracer un pavé en perspective cavalière
      etapes:
      - 'Trace la face avant en vraie grandeur : rectangle $L$ par $h$.'
      - Trace un rectangle identique, décalé en oblique, profondeur réduite de moitié.
      - Relie deux à deux les sommets correspondants.
      - Repasse en **pointillés** les $3$ arêtes du sommet du fond.
    exemple_resolu: 'Un patron : deux rectangles $6 \times 4$, deux $6 \times 3$, deux $4 \times 3$ (en
      cm). Dimensions ? Face opposée à $BCGF$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Chaque paire de rectangles identiques donne deux faces opposées. | $6$, $4$ et $3$ reviennent
      deux fois |

      | Les trois nombres relevés sont les dimensions. | $L = 6$, $l = 4$, $h = 3$ cm |

      | Deux faces opposées n''ont aucun sommet commun. | opposée de $BCGF = ADHE$ |

      | **Vérification :** $6 \times 4$, $6 \times 3$, $4 \times 3$ utilisent chacun deux dimensions.
      ✓ | |'
    erreurs_frequentes:
    - erreur: « un pavé a $6$ arêtes ».
      correction: '$6$ **faces**, $12$ arêtes, $8$ sommets. Contrôle : $8 \times 3 = 24$, chaque arête
        comptée deux fois.'
    - erreur: « un cube n'est pas un pavé droit ».
      correction: il l'est, comme le carré est un rectangle.
    declic: null
    figures:
    - figures/m11_f3.svg
    - figures/m11_f4.svg
  - id: 5eme_M11_L3
    numero: '11.3'
    titre: Aire latérale et aire totale
    retenir:
    - L'aire latérale est celle des **quatre faces verticales** ; la totale ajoute dessus et dessous.
    - '**Cube d''arête $c$ :** $\mathcal{A}_{\text{latérale}} = 4 \times \left(c \times c\right)$, $\mathcal{A}_{\text{totale}}
      = 6 \times \left(c \times c\right)$. Résultat en unité **carrée**.'
    - '**On ne compte que les faces demandées :** quatre murs et un plafond, c''est **cinq** faces.'
    - '**Question inverse :** aire totale d''un cube $\div 6$ = aire d''une face ; l''arête est le nombre
      dont le produit par lui-même donne cette aire.'
    methode:
      titre: Calculer une aire totale ou partielle
      etapes:
      - Repère les trois dimensions, toutes dans la même unité.
      - 'Calcule les trois aires différentes : $L \times l$, $L \times h$, $l \times h$.'
      - Double celles dont les **deux** faces comptent ; compte une seule fois les autres.
      - Additionne, en unité carrée.
    exemple_resolu: 'Un grenier est un pavé de $4$ m $\times 3$ m $\times 2$ m, crépi sur ses quatre murs
      et son plafond. Quelle surface ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les murs vont par paires : deux de $4 \times 2$, deux de $3 \times 2$. | $2 \times 8 + 2 \times
      6 = 28 m^{2}$ |

      | Le plafond seul, pas le sol. | $4 \times 3 = 12 m^{2}$ |

      | On additionne. | $28 + 12 = 40 m^{2}$ |

      | **Vérification :** aire totale $52 m^{2}$, moins le sol $12 m^{2}$, reste $40 m^{2}$. ✓ | |'
    erreurs_frequentes:
    - erreur: $c \times c$ pour l'aire d'un cube.
      correction: c'est **une** face ; le total vaut $6 \times \left(c \times c\right)$.
    - erreur: appliquer l'aire totale alors qu'une face est exclue.
      correction: compte les faces une par une, sur le patron.
    declic: null
    figures: []
  - id: 5eme_M11_L4
    numero: '11.4'
    titre: Volume, capacité et conversions
    retenir:
    - 'Pavé droit : $V = L \times l \times h$ ; cube d''arête $c$ : $V = c \times c \times c$.'
    - 'Les trois dimensions doivent être dans la **même unité** avant le produit. Résultat en unité **cube**
      : cm$^{3}$, dm$^{3}$, $m^{3}$.'
    - '**Dimension manquante :** $h = V \div \left(L \times l\right)$.'
    - 'Entre deux unités de volume voisines, le rapport est **$1\,000$** : trois colonnes par unité.'
    - Un litre, c'est le volume d'un cube de $10$ cm d'arête.
    methode:
      titre: Calculer un volume, puis une capacité
      etapes:
      - Mets les trois dimensions dans la même unité (le dm si la réponse est en litres).
      - 'Multiplie : $L \times l \times h$, ou $c \times c \times c$.'
      - Écris le résultat avec son unité cube.
      - 'Pour la capacité : $1$ dm$^{3} = 1$ L ; $1 m^{3} = 1\,000$ L.'
    exemple_resolu: 'Un château d''eau est un pavé de $4$ m $\times 3$ m $\times 2{,}5$ m. Le village
      consomme $25\,000$ L par jour : un remplissage suffit-il ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Tout est en mètres : on multiplie directement. | $V = 4 \times 3 \times 2{,}5 = 30 m^{3}$ |

      | Un mètre cube contient $1\,000$ litres. | $30 \times 1\,000 = 30\,000$ L |

      | On compare au besoin quotidien. | $30\,000 > 25\,000$ |

      | **Conclusion :** un remplissage suffit, avec $5\,000$ L de marge. ✓ | |


      > #### DÉCLIC : Pourquoi $1\,000$ et non $10$ ?

      >

      > Un mètre cube est un cube de $1$ m d''arête : $10$ dm de long, $10$ de large, $10$ de haut, soit
      $1\,000$ petits cubes. Le facteur $10$ agit **trois** fois pour un volume, **deux** fois pour une
      aire (d''où $100$), **une** fois pour une longueur.'
    erreurs_frequentes:
    - erreur: multiplier $2$ m $\times 50$ cm $\times 40$ cm.
      correction: 'convertis : $20 \times 5 \times 4 = 400$ dm$^{3} = 400$ L.'
    - erreur: $5\,000$ cm$^{3} = 500$ L.
      correction: 'on divise par $1\,000$ : $5$ L.'
    declic: 'Pourquoi $1\,000$ et non $10$ ? — Un mètre cube est un cube de $1$ m d''arête : $10$ dm de
      long, $10$ de large, $10$ de haut, soit $1\,000$ petits cubes. Le facteur $10$ agit **trois** fois
      pour un volume, **deux** fois pour une aire (d''où $100$), **une** fois pour une longueur. ####
      ⚠ ATTENTION ! - **Erreur fréquente :** multiplier $2$ m $\times 50$ cm $\times 40$ cm. **Correction
      :** convertis : $20 \times 5 \times 4 = 400$ dm$^{3} = 400$ L. - **Erreur fréquente :** $5\,000$
      cm$^{3} = 500$ L. **Correction :** on divise par $1\,000$ : $5$ L.'
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Calcule le périmètre et l'aire d'un carré de $5$ cm de côté.
    correction: $P = 20$ cm ; $A = 25$ cm$^{2}$.
  - numero: 2
    etoiles: 1
    enonce: Calcule le périmètre d'un cercle de rayon $3$ cm.
    correction: $P = 2 \times 3{,}14 \times 3 = 18{,}84$ cm.
  - numero: 3
    etoiles: 1
    enonce: Calcule l'aire d'un disque de rayon $4$ cm, puis de rayon $5$ cm.
    correction: $50{,}24$ cm$^{2}$ ; $78{,}5$ cm$^{2}$.
  - numero: 4
    etoiles: 1
    enonce: Calcule l'aire d'un disque de diamètre $10$ cm. *(Pense d'abord au rayon.)*
    correction: $r = 5$ cm, donc $A = 3{,}14 \times 5 \times 5 = 78{,}5$ cm$^{2}$.
  - numero: 5
    etoiles: 1
    enonce: 'Convertis : a) $2 m^{2} = \dots$ cm$^{2}$ ; b) $30\,000$ cm$^{2} = \dots m^{2}$.'
    correction: a) $20\,000$ cm$^{2}$ ($\times 10\,000$). b) $3 m^{2}$ ($\div 10\,000$).
  - numero: 6
    etoiles: 1
    enonce: Donne le nombre de faces, d'arêtes et de sommets d'un cube.
    correction: $6$ faces, $12$ arêtes, $8$ sommets.
  - numero: 7
    etoiles: 1
    enonce: Vrai ou faux ? a) un cube est un pavé droit ; b) toutes les faces d'un pavé sont des carrés
      ; c) un pavé a $12$ arêtes.
    correction: 'a) Vrai. b) Faux : rectangles, carrés seulement pour le cube. c) Vrai.'
  - numero: 8
    etoiles: 1
    enonce: Sur un pavé $ABCDEFGH$ ($ABCD$ dessous, $EFGH$ dessus). a) Quelle face est opposée à $ABFE$
      ? b) Cite les trois arêtes issues de $B$.
    correction: a) $DCGH$ (aucun sommet commun). b) $\left[BA\right]$, $\left[BC\right]$, $\left[BF\right]$.
  - numero: 9
    etoiles: 1
    enonce: Un patron est formé de deux rectangles $7 \times 4$, deux $7 \times 3$ et deux $4 \times 3$
      (en cm). Quelles sont les trois dimensions du pavé ?
    correction: $7$ cm, $4$ cm, $3$ cm (chaque longueur revient deux fois).
  - numero: 10
    etoiles: 1
    enonce: Trace le patron d'un pavé de $5$ cm $\times 3$ cm $\times 2$ cm. Combien de rectangles comporte-t-il
      ?
    correction: '$6$ rectangles, en trois paires : $5 \times 3$, $5 \times 2$, $3 \times 2$.'
  - numero: 11
    etoiles: 1
    enonce: Calcule l'aire totale d'un cube de $10$ cm d'arête.
    correction: Une face $100$ cm$^{2}$ ; total $600$ cm$^{2}$.
  - numero: 12
    etoiles: 1
    enonce: Calcule l'aire totale d'un pavé de $8$ cm $\times 5$ cm $\times 3$ cm.
    correction: $2 \times 40 + 2 \times 24 + 2 \times 15 = 158$ cm$^{2}$.
  - numero: 13
    etoiles: 1
    enonce: Un grenier est un pavé de $4$ m $\times 3$ m $\times 2$ m. Calcule l'aire de ses quatre murs
      seulement.
    correction: $16 + 12 = 28 m^{2}$.
  - numero: 14
    etoiles: 1
    enonce: Calcule le volume d'un pavé de $6$ cm $\times 2{,}5$ cm $\times 4$ cm.
    correction: $V = 60$ cm$^{3}$.
  - numero: 15
    etoiles: 1
    enonce: Calcule le volume d'un cube de $10$ cm d'arête, en cm$^{3}$ puis en litres.
    correction: $V = 1\,000$ cm$^{3} = 1$ litre.
  - numero: 16
    etoiles: 1
    enonce: Une caisse a un volume de $24$ cm$^{3}$, une longueur de $4$ cm et une largeur de $2$ cm.
      Quelle est sa hauteur ?
    correction: $h = 24 \div 8 = 3$ cm.
  - numero: 17
    etoiles: 1
    enonce: 'Une salle mesure $8$ m $\times 6$ m $\times 3$ m. Calcule son volume en $m^{3}$, puis en
      litres.


      ### Entraînement ★★'
    correction: $V = 144 m^{3} = 144\,000$ litres.
  - numero: 18
    etoiles: 2
    enonce: Un disque a une aire de $200{,}96$ cm$^{2}$. a) Calcule $r \times r$. b) Déduis-en le rayon.
    correction: a) $r \times r = 200{,}96 \div 3{,}14 = 64$. b) $r = 8$ cm.
  - numero: 19
    etoiles: 2
    enonce: Djénéba recouvre une boîte cubique d'aire totale $150$ cm$^{2}$. a) Aire d'une face ? b) Longueur
      de l'arête ?
    correction: a) $150 \div 6 = 25$ cm$^{2}$. b) arête $= 5$ cm.
  - numero: 20
    etoiles: 2
    enonce: Un cube a $2$ cm d'arête, un autre $4$ cm. L'aire totale du second est-elle le double de celle
      du premier ? Justifie par le calcul.
    correction: '$24$ cm$^{2}$ et $96$ cm$^{2}$ : non, c''est le quadruple, l''arête intervenant deux
      fois.'
  - numero: 21
    etoiles: 2
    enonce: Un château d'eau est un pavé de $4$ m $\times 3$ m $\times 2{,}5$ m. a) Volume en $m^{3}$
      ? b) Contenance en litres ?
    correction: a) $30 m^{3}$. b) $30\,000$ litres.
  - numero: 22
    etoiles: 2
    enonce: 'Un tamis circulaire a un diamètre de $35$ cm. a) Son périmètre ? b) La bande de métal du
      bord coûte $200$ FCFA le décimètre : quel coût ? c) Son aire ?'
    correction: a) $P = 3{,}14 \times 35 = 109{,}9$ cm. b) $10{,}99 \times 200 = 2\,198$ FCFA. c) $r =
      17{,}5$ cm, $A = 961{,}625$ cm$^{2}$.
  - numero: 23
    etoiles: 2
    enonce: 'Une pluie de $100$ mm (soit $0{,}1$ m d''eau) tombe sur une pelouse de $8$ m $\times 10$
      m. a) Quel volume d''eau, en $m^{3}$ ? b) Combien d''arrosoirs de $10$ litres ?


      ### Entraînement intensif : convertir sans se tromper de facteur'
    correction: a) $8 \times 10 \times 0{,}1 = 8 m^{3}$. b) $8\,000 \div 10 = 800$ arrosoirs.
  - numero: 24
    etoiles: 1
    enonce: 'Convertis en litres : a) $3\,000$ cm$^{3}$ ; b) $5$ dm$^{3}$ ; c) $2 m^{3}$.'
    correction: a) $3$ L. b) $5$ L. c) $2\,000$ L.
  - numero: 25
    etoiles: 1
    enonce: 'Convertis : a) $3 m^{2} = \dots$ cm$^{2}$ ; b) $25\,000$ cm$^{2} = \dots m^{2}$ ; c) $4$
      dm$^{2} = \dots$ cm$^{2}$.'
    correction: a) $30\,000$ cm$^{2}$. b) $2{,}5 m^{2}$. c) $400$ cm$^{2}$.
  - numero: 26
    etoiles: 2
    enonce: 'Convertis en litres, puis range du plus petit au plus grand : a) $0{,}75 m^{3}$ ; b) $4\,500$
      cm$^{3}$ ; c) $12$ dm$^{3}$.'
    correction: 'a) $750$ L ; b) $4{,}5$ L ; c) $12$ L. Ordre : b) $<$ c) $<$ a).'
  - numero: 27
    etoiles: 2
    enonce: Volume d'un cube de $20$ cm d'arête, en cm$^{3}$ puis en dm$^{3}$.
    correction: $8\,000$ cm$^{3} = 8$ dm$^{3}$.
  - numero: 28
    etoiles: 2
    enonce: Un tapis circulaire a un rayon de $80$ cm. a) Aire en cm$^{2}$ ? b) En $m^{2}$ ? c) Longueur
      de bordure à coudre tout autour ?
    correction: a) $20\,096$ cm$^{2}$. b) $2{,}0096 m^{2}$. c) $P = 502{,}4$ cm.
  - numero: 29
    etoiles: 2
    enonce: 'Une cuve pavé a $1$ m de large, $50$ cm de haut et contient $150$ litres. Quelle est sa longueur
      ?


      ### ★★★ Défis de maîtrise'
    correction: 'En dm : $L = 150 \div \left(10 \times 5\right) = 3$ dm $= 30$ cm.'
  - numero: 30
    etoiles: 3
    enonce: Un grenier à mil est un pavé de $4$ m $\times 3$ m $\times 2$ m, à crépir sur ses quatre murs
      et son plafond seulement. a) Surface à crépir ? b) À $500$ FCFA le $m^{2}$, coût des travaux ?
    correction: Cinq faces comptent, le sol exclu. a) $28 + 12 = 40 m^{2}$. b) $20\,000$ FCFA.
  - numero: 31
    etoiles: 3
    enonce: Un maçon monte un mur avec des briques pleines de $20$ cm $\times 10$ cm $\times 10$ cm. Le
      mur mesure $4$ m de long, $2$ m de haut, $10$ cm d'épaisseur. a) Volume du mur en cm$^{3}$ ? b)
      Volume d'une brique ? c) Combien de briques ?
    correction: Tout en centimètres, mur et briques n'ayant pas la même unité. a) $400 \times 200 \times
      10 = 800\,000$ cm$^{3}$. b) $2\,000$ cm$^{3}$. c) $400$ briques.
  - numero: 32
    etoiles: 3
    enonce: 'La boîte A est un cube de $4$ cm d''arête ; la boîte B est un pavé de $8$ cm $\times 4$ cm
      $\times 2$ cm. Karim affirme : « deux boîtes de même volume ont forcément la même aire totale ».
      a) Volume de chacune ? b) Aire totale de chacune ? c) Karim a-t-il raison ? Explique en une phrase.'
    correction: 'On compare les deux grandeurs séparément. a) $64$ cm$^{3}$ chacune. b) A : $96$ cm$^{2}$
      ; B : $2 \times 32 + 2 \times 16 + 2 \times 8 = 112$ cm$^{2}$. c) Il a tort : à volume égal, la
      boîte allongée offre plus de surface.'
  - numero: 33
    etoiles: 3
    enonce: 'Un rond-point : disque central de rayon $6$ m, entouré d''un anneau de fleurs de $2$ m de
      large. a) Aire du disque central ? b) Aire du grand disque de rayon $8$ m ? c) Aire de l''anneau
      ?'
    correction: L'anneau est le grand disque moins le petit. a) $113{,}04 m^{2}$. b) $200{,}96 m^{2}$.
      c) $87{,}92 m^{2}$.
  - numero: 34
    etoiles: 3
    enonce: 'Un camarade affirme : « si je double le rayon d''un cercle, le périmètre double et l''aire
      double aussi. » a) A-t-il raison pour le périmètre ? b) Pour l''aire ? Vérifie avec $r = 2$ cm puis
      $r = 4$ cm, et explique en une phrase.'
    correction: 'On teste les deux affirmations avec les mêmes nombres. a) $12{,}56$ puis $25{,}12$ cm
      : le périmètre double, il a raison. b) $12{,}56$ puis $50{,}24$ cm$^{2}$ : l''aire est multipliée
      par $4$, il a tort ; le rayon intervient deux fois dans $A$.'
  - numero: 35
    etoiles: 3
    enonce: Talato fait souder une citerne cubique fermée qui doit contenir $1\,000$ litres. a) Quelle
      arête ? b) Quelle surface de tôle ? c) À $9\,000$ FCFA le mètre carré, quel prix ?
    correction: On part de la contenance. a) $1\,000$ L $= 1 m^{3}$, donc arête $= 1$ m. b) $6 m^{2}$.
      c) $54\,000$ FCFA.
  - numero: 36
    etoiles: 3
    enonce: 'Copie d''Ousmane. « Une cuve pavé mesure $80$ cm sur $50$ cm sur $40$ cm. On la remplit avec
      des bidons de $20$ litres. Combien de bidons ? »


      > Ligne 1 : $V = 80 \times 50 \times 40$

      > Ligne 2 : $V = 160\,000$ cm$^{2}$

      > Ligne 3 : $160\,000$ cm$^{2} = 16 m^{2}$

      > Ligne 4 : la cuve contient donc $16$ litres

      > Ligne 5 : $16 \div 20 = 0{,}8$, il faut $1$ bidon.


      a) Repère la première ligne fausse et explique l''erreur. b) Y a-t-il une autre erreur plus loin
      ? c) Refais proprement la résolution.'
    correction: 'On s''arrête à la première ligne injustifiable. a) Ligne 2 : trois longueurs multipliées
      donnent un volume, donc cm$^{3}$ et non cm$^{2}$. b) Ligne 3 : conversion faite comme une aire ($\div
      10\,000$) au lieu de $\div 1\,000$. c) $160\,000$ cm$^{3} = 160$ L, donc $160 \div 20 = 8$ bidons.'
  fiche_revision:
  - '**Périmètre et aire.** Rectangle : $2 \times \left(L + l\right)$ et $L \times l$. Carré : $4 \times
    c$ et $c \times c$. Disque : $2 \times \pi \times r$ et $\pi \times r \times r$, $\pi \approx 3{,}14$.'
  - '**Conversions d''aires.** Rapport $100$ entre unités voisines : $1 m^{2} = 100$ dm$^{2} = 10\,000$
    cm$^{2}$.'
  - '**Pavé et cube.** $6$ faces, $12$ arêtes, $8$ sommets, $3$ arêtes par sommet ; le cube est le pavé
    à faces carrées. Patron : $6$ rectangles par paires. Perspective : $3$ arêtes cachées en pointillés.'
  - '**Aires du pavé.** Latérale : $2 \times \left(L + l\right) \times h$. Totale : $2 \times \left(L
    \times l\right) + 2 \times \left(L \times h\right) + 2 \times \left(l \times h\right)$. Cube : $6
    \times \left(c \times c\right)$. On ne compte que les faces demandées.'
  - '**Volume et capacité.** $V = L \times l \times h$ ; cube : $c \times c \times c$, unités unifiées
    d''abord. Rapport $1\,000$ : $1 m^{3} = 1\,000$ dm$^{3}$ ; $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$
    ; $1 m^{3} = 1\,000$ L.'
  - '**Dimension manquante.** $h = V \div \left(L \times l\right)$ ; arête d''un cube d''aire $\mathcal{A}$
    : diviser par $6$, puis chercher le nombre dont le carré donne le résultat.'
  trouve_erreur:
  - faux: 'Aire d''un disque de rayon $4$ cm : $2 \times 3{,}14 \times 4 = 25{,}12$ cm$^{2}$'
    correction: C'est le périmètre. L'aire est $3{,}14 \times 4 \times 4 = 50{,}24$ cm$^{2}$.
  - faux: $3 m^{2} = 300$ cm$^{2}$
    correction: 'Facteur $100$ par unité : $3 m^{2} = 300$ dm$^{2} = 30\,000$ cm$^{2}$.'
  - faux: Un pavé droit a $6$ arêtes
    correction: Il a $6$ faces, mais $12$ arêtes et $8$ sommets.
  - faux: 'Aire totale d''un cube de $3$ cm : $3 \times 3 = 9$ cm$^{2}$'
    correction: '$9$ cm$^{2}$ est l''aire d''une face : $6 \times 9 = 54$ cm$^{2}$.'
  - faux: $2 m^{3} = 20$ dm$^{3}$
    correction: 'Facteur $1\,000$ par unité : $2 m^{3} = 2\,000$ dm$^{3} = 2\,000$ L.'
  cartographie_lacunes:
  - lacune: Périmètre et aire confondus, conversions de volumes fausses
    bloque_en: cylindre, prisme, cône, pyramide, sphère
