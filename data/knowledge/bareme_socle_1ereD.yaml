  reponse_attendue: f(2,5) = 3,75 > 3,5 ; l'eau passe au-dessus du mur
  solution: 'f(2,5) = -(0,5)² + 4 = 3,75. Conclusion : « A 2,5 m du jet, l''eau s''élève à 3,75 m, soit
    plus haut que le mur de 3,5 m : l''eau passe au-dessus du mur. » Barème (3 pts) : 1 pt pour f(2,5)
    = 3,75, 1 pt pour la comparaison à 3,5, 1 pt pour la conclusion. La conclusion seule, sans calcul
    de f(2,5), ne vaut rien. Erreur propagée : une valeur de f(2,5) fausse correctement comparée à 3,5,
    avec conclusion cohérente, garde les deux derniers points.'
