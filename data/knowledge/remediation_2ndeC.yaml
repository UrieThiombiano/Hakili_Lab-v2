- niveau: 2ndeC
  module: 9
  module_titre: Pythagore et trigonométrie du triangle rectangle
  pourquoi: 'Deux erreurs reviennent sans arrêt : appliquer Pythagore avant d''avoir l''angle droit, et
    placer l''hypoténuse ailleurs qu''au dénominateur d''un cosinus. Le produit scalaire et les fonctions
    circulaires, en 2nde C, reposent entièrement sur ces gestes.'
  diagnostic:
  - question: Dans un triangle rectangle, quel côté est le plus long ? Comment s'appelle-t-il ?
    reponse: l'hypoténuse, opposée à l'angle droit
  - question: $ABC$ est rectangle en $A$, $AB = 3$ et $AC = 4$. Combien vaut $BC$ ?
    reponse: $BC^{2} = 25$, $BC = 5$
  - question: Un triangle a pour côtés $6$, $8$ et $11$. Est-il rectangle ?
    reponse: non, $6^{2} + 8^{2} = 100 \neq 121$
  - question: $ABC$ est rectangle en $A$. Écris $\cos \widehat{B}$, $\sin \widehat{B}$ et $\tan \widehat{B}$
      avec $AB$, $AC$ et $BC$.
    reponse: $\cos \widehat{B} = \frac{AB}{BC}$, $\sin \widehat{B} = \frac{AC}{BC}$, $\tan \widehat{B}
      = \frac{AC}{AB}$
  - question: Que valent $\sin 30°$ et $\tan 45°$ ?
    reponse: $\frac{1}{2}$ et $1$
  lecons:
  - id: 2ndeC_M09_L1
    numero: '9.1'
    titre: 'Pythagore : calculer une longueur'
    retenir:
    - 'Si $ABC$ est rectangle en $A$, alors :'
    - '$\left[BC\right]$ est l''**hypoténuse** : opposée à l''angle droit, et toujours le plus long côté.'
    - 'Hypoténuse cherchée : on **ajoute**. Côté de l''angle droit cherché : on **retranche**.'
    - Le théorème direct suppose l'angle droit connu ; il ne le démontre pas.
    methode:
      titre: Calculer une longueur avec Pythagore
      etapes:
      - 'Repère l''angle droit, nomme l''hypoténuse : le côté qui lui fait face.'
      - Écris l'égalité, le carré de l'hypoténuse **seul** à gauche.
      - 'Remplace, puis isole le carré cherché : addition ou soustraction.'
      - Prends la racine carrée positive ; contrôle que l'hypoténuse est la plus grande.
    exemple_resolu: '*$ABC$ est rectangle en $B$, $AC = 26$ et $BC = 24$. Calculer $AB$.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Angle droit en $B$ : l''hypoténuse est $\left[AC\right]$, seule à gauche. | $AC^{2} = AB^{2} +
      BC^{2}$ |

      | On remplace, puis on retranche : $AB$ est un côté de l''angle droit. | $676 = AB^{2} + 576$, donc
      $AB^{2} = 100$ |

      | Racine carrée positive. | $AB = 10$ |

      | **Vérification :** $10 < 24 < 26$. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $AB^{2} = BC^{2} + AC^{2}$ dans un triangle rectangle en $A$.
      correction: c'est $BC^{2}$, carré de l'hypoténuse, qui est seul à gauche.
    - erreur: conclure $BC = 100$ après $BC^{2} = 100$.
      correction: la racine carrée reste à prendre, $BC = 10$.
    declic: null
    figures:
    - figures/m09_f1.svg
  - id: 2ndeC_M09_L2
    numero: '9.2'
    titre: 'La réciproque : démontrer qu''un triangle est rectangle'
    retenir:
    - '**Réciproque.** Si $BC^{2} = AB^{2} + AC^{2}$, alors $ABC$ est rectangle en $A$.'
    - L'angle droit est au sommet **opposé au plus grand côté**.
    - '**Contraposée.** Si l''égalité échoue, le triangle n''est pas rectangle. C''est elle qui permet
      de répondre « non ».'
    - Le direct calcule une longueur dans un triangle **déjà** rectangle ; la réciproque démontre l'angle
      droit.
    methode:
      titre: Montrer qu'un triangle est rectangle
      etapes:
      - 'Repère le plus grand côté : seul candidat au rôle d''hypoténuse.'
      - Calcule **séparément** son carré, puis la somme des carrés des deux autres.
      - Compare les deux nombres et écris l'égalité ou l'inégalité.
      - Conclus en nommant l'énoncé utilisé et le sommet de l'angle droit.
    exemple_resolu: '*À Koupéla, un maçon mesure $1{,}2$ m sur un mur, $1{,}6$ m sur l''autre, et $2{,}1$
      m entre les deux points. Le coin est-il droit ?*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le plus grand côté est $2{,}1$ : on calcule son carré à part. | $2{,}1^{2} = 4{,}41$ |

      | On calcule à part la somme des deux autres carrés. | $1{,}44 + 2{,}56 = 4$ |

      | Les deux nombres diffèrent : contraposée. | $4{,}41 \neq 4$, le coin **n''est pas** droit. |

      | **Vérification :** il devrait trouver $d = 2$ m ; $2 < 2{,}1$, le coin est trop ouvert. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $AB^{2} + AC^{2} = BC^{2}$ en une ligne, avant de l'avoir prouvée.
      correction: deux calculs séparés, l'égalité n'apparaît qu'en conclusion.
    - erreur: prendre n'importe quel côté comme hypoténuse.
      correction: c'est nécessairement le plus grand.
    declic: null
    figures: []
  - id: 2ndeC_M09_L3
    numero: '9.3'
    titre: 'Cosinus, sinus, tangente : choisir le bon rapport'
    retenir:
    - Ces nombres ne dépendent que de la mesure de l'angle, pas de la taille du triangle.
    - $0 < \cos \widehat{A} < 1$ et $0 < \sin \widehat{A} < 1$ ; la tangente peut dépasser $1$.
    - 'L''adjacent à $\widehat{B}$ est l''opposé à $\widehat{C}$ : les noms changent avec l''angle regardé.'
    methode:
      titre: Calculer une longueur avec un rapport
      etapes:
      - Marque l'angle de l'énoncé, puis nomme les trois côtés **par rapport à lui**.
      - 'Entoure la longueur cherchée et la longueur connue : elles désignent le rapport.'
      - Écris l'égalité et isole la longueur cherchée.
      - 'Contrôle : un côté de l''angle droit est plus court que l''hypoténuse.'
    exemple_resolu: '*$ABC$ est rectangle en $A$, $BC = 20$ cm et $\widehat{B} = 30°$. Calculer $AC$,
      puis $AB$.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Par rapport à $\widehat{B}$ : hypoténuse $\left[BC\right]$, opposé $\left[AC\right]$, adjacent
      $\left[AB\right]$. | $BC = 20$ |

      | Opposé et hypoténuse : c''est le sinus. | $AC = 20 \times \sin 30° = 10$ cm |

      | Adjacent et hypoténuse : c''est le cosinus. | $AB = 20 \times \cos 30° = 10\sqrt{3}$ cm |

      | **Vérification :** $100 + 300 = 400 = 20^{2}$. ✓ | |'
    erreurs_frequentes:
    - erreur: placer l'hypoténuse au numérateur.
      correction: un cosinus ou un sinus supérieur à $1$ signale l'erreur sans refaire le calcul.
    - erreur: nommer les côtés avant de choisir l'angle.
      correction: 'écris d''abord « par rapport à $\widehat{B}$ », puis « adjacent : $\left[AB\right]$
        ».'
    declic: null
    figures:
    - figures/m09_f4.svg
  - id: 2ndeC_M09_L4
    numero: '9.4'
    titre: Les deux relations et les valeurs remarquables
    retenir:
    - $\cos^{2} x$ désigne $\left(\cos x\right)^{2}$.
    - 'La première donne $\sin^{2} x = 1 - \cos^{2} x$ : un **carré**, dont il reste à prendre la racine
      positive.'
    - '**Angles complémentaires.** Si $\widehat{B} + \widehat{C} = 90°$, alors $\sin \widehat{B} = \cos
      \widehat{C}$ et $\cos \widehat{B} = \sin \widehat{C}$.'
    methode:
      titre: Passer d'un rapport à un autre
      etapes:
      - Repère le nombre donné, cosinus ou sinus.
      - 'Élève-le au carré et retranche de $1$ : tu obtiens le carré de l''autre.'
      - Prends la racine carrée positive, l'angle étant aigu.
      - Pour la tangente, divise le sinus par le cosinus, puis rends le dénominateur entier.
    exemple_resolu: '*$\widehat{A}$ est aigu et $\cos \widehat{A} = \frac{5}{13}$. Calculer $\sin \widehat{A}$,
      puis $\tan \widehat{A}$.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On isole le carré du sinus. | $\sin^{2} \widehat{A} = 1 - \frac{25}{169} = \frac{144}{169}$ |

      | Racine carrée positive : l''angle est aigu. | $\sin \widehat{A} = \frac{12}{13}$ |

      | On divise le sinus par le cosinus. | $\tan \widehat{A} = \frac{12}{13} \times \frac{13}{5} = \frac{12}{5}$
      |

      | **Vérification :** $\frac{25}{169} + \frac{144}{169} = 1$. ✓ | |


      [SVG: figures/m09_f7.svg]

      *Figure 9.7 : Hauteur inaccessible : l''angle de visée et la distance au pied suffisent.*'
    erreurs_frequentes:
    - erreur: écrire $\tan x = \sin x + \cos x$.
      correction: c'est un **quotient**, $\tan x = \frac{\sin x}{\cos x}$.
    - erreur: pour un arbre vu sous $\alpha$ à la distance $d$, écrire hauteur $= \frac{d}{\tan \alpha}$.
      correction: la hauteur est l'opposé, donc hauteur $= d \times \tan \alpha$.
    declic: 'Le sinus ne se lit pas dans une somme — Partant de $\cos x = 0{,}8$, écrire $\sin x = 1 -
      0{,}8 = 0{,}2$ est faux : la relation porte sur les **carrés**. Il faut $\sin^{2} x = 1 - 0{,}64
      = 0{,}36$, puis la racine : $\sin x = 0{,}6$. Si la racine carrée ou la simplification de $\frac{1}{\sqrt{3}}$
      en $\frac{\sqrt{3}}{3}$ te freine, reprends le module 2.'
    figures:
    - figures/m09_f7.svg
