  reponse_attendue: asymptotes x = 1 et y = 2x - 1 ; f(x) - (2x - 1) = 3/(x - 1) ≠ 0, la courbe ne coupe
    jamais l'oblique, Rakieta a tort
  solution: 'Barème : 1 pt pour les deux équations d''asymptotes, verticale x = 1 et oblique y = 2x -
    1 ; 1 pt pour f(x) - (2x - 1) = 3/(x - 1), constaté jamais nul, et « Rakieta a tort ».'
  si_echoue: Lecture des asymptotes sur une écriture « partie affine plus reste », et étude de la position
    d'une courbe par rapport à son asymptote. Livret de remédiation 1ère D / Tle D, module 12.
- code: F12
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: F.DER
  competence_secondaire: null
  domaine: Fonctions et applications
  objet: Trouver a et b pour x³ + ax² + bx avec f'(0) = 1 et f'(1) = 0, puis calculer f'(2)
  reponse_attendue: a = -2, b = 1 ; f'(2) = 5
  solution: 'f''(x) = 3x² + 2ax + b ; f''(0) = b = 1 ; f''(1) = 4 + 2a = 0, a = -2 ; f''(2) = 12 - 8 +
    1 = 5. Barème : 1 pt pour a = -2 et b = 1 (les deux exigées) ; 1 pt pour f''(2) = 5. Erreur propagée
    : f''(2) correctement calculé à partir des valeurs de a et b trouvées, même erronées.'
  si_echoue: Dérivation d'un polynôme à coefficients paramétrés, puis traduction de deux conditions en
    un système. Livret de remédiation 1ère D / Tle D, module 12.
- code: F13
