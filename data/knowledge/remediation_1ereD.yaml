    correction: a) $3\sqrt{2}$ ; b) $4\sqrt{3}$ ; c) $5\sqrt{3}$ ; d) $12$.
  - numero: 12
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : a) $x^{2} = 5$ ; b) $x^{2} = -3$.'
