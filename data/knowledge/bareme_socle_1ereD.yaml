  domaine: Fonctions et applications
  objet: Trouver l'ensemble de définition de h(x) = √(x + 3)/(x - 1), puis dire si -3 en fait partie
  reponse_attendue: Dh = [-3 ; 1[ ∪ ]1 ; +∞[ ; oui, -3 appartient à Dh (h(-3) = 0)
  solution: 'Conditions : x + 3 ≥ 0 et x - 1 ≠ 0. Un radicande nul est permis et -3 ≠ 1. Barème : 1 pt
    pour les deux conditions posées et Dh écrit avec -3 inclus et 1 exclu ; 1 pt pour la réponse affirmative
    sur -3, justifiée par le radicande pouvant être nul. Exclure -3 au motif que la racine s''annule est
    l''erreur visée et ne vaut pas le second point.'
  si_echoue: 'Conjonction de deux contraintes de définition : radicande positif ou nul, dénominateur non
    nul. Livret de remédiation 1ère D / Tle D, module 8.'
- code: F8
  partie: B
