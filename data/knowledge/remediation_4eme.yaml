- niveau: 4eme
  module: 6
  module_titre: Les puissances entières
  pourquoi: L'exposant compte les facteurs, il n'en est jamais un, et pourtant $2^{3}$ devient $6$ sous
    une main sur trois. Restent le signe d'une base négative, et la confusion entre les règles qui ajoutent
    les exposants et celles qui les multiplient.
  diagnostic:
  - question: Calcule $2^{5}$.
    reponse: $32$
  - question: Calcule $\left(-3\right)^{2}$, puis $-3^{2}$.
    reponse: $+9$ et $-9$
  - question: 'Écris sous forme d''une seule puissance : $5^{2} \times 5^{3}$.'
    reponse: $5^{5}$
  - question: 'Écris sous forme d''une seule puissance : $\left(2^{3}\right)^{4}$.'
    reponse: $2^{12}$
  - question: Écris $45\,000$ sous la forme d'un entier multiplié par une puissance de $10$.
    reponse: $45 \times 10^{3}$
  lecons:
  - id: 4eme_M06_L1
    numero: '6.1'
    titre: Base, exposant, signe
    retenir:
    - $a^{n}$ est le produit de **$n$ facteurs** tous égaux à $a$. $a$ est la **base**, $n$ l'**exposant**.
    - $a^{1} = a$ ; $a^{0} = 1$ pour tout $a$ non nul.
    - 'Base négative : puissance **positive si l''exposant est pair**, **négative s''il est impair**.
      Le signe se lit sans calcul.'
    - 'L''exposant ne recouvre que ce qui le précède : $\left(-2\right)^{4} = +16$ mais $-2^{4} = -16$.'
    - 'Les puissances se calculent **avant** les multiplications et les additions : $2 \times 3^{2} =
      18$.'
    methode:
      titre: Calculer une puissance
      etapes:
      - Repère la base, l'exposant, et les parenthèses enfermant un signe.
      - Détermine le signe par la parité de l'exposant, avant tout calcul.
      - Écris la base autant de fois que l'indique l'exposant, multiplie.
      - Pose le signe devant le résultat.
    exemple_resolu: 'Une caisse cubique d''arête $2$ m est remplacée par une caisse d''arête $4$ m. Par
      combien le volume est-il multiplié ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le volume d''un cube est le cube de l''arête. | $V_{1} = 2^{3} = 8$ m$^{3}$ |

      | Même geste pour la nouvelle caisse. | $V_{2} = 4^{3} = 64$ m$^{3}$ |

      | Un rapport se cherche par division. | $64 \div 8 = 8$, volume multiplié par $8$ |

      | **Vérification :** l''arête double dans les trois dimensions, $2 \times 2 \times 2 = 8$. ✓ | |'
    erreurs_frequentes:
    - erreur: $2^{3} = 2 \times 3 = 6$.
      correction: $2^{3} = 2 \times 2 \times 2 = 8$.
    - erreur: $\left(-3\right)^{2} = -9$.
      correction: deux facteurs négatifs donnent $+9$ ; c'est $-3^{2}$ qui vaut $-9$.
    declic: null
    figures:
    - figures/m06_f1.svg
  - id: 4eme_M06_L2
    numero: '6.2'
    titre: Les quatre règles sur les exposants
    retenir:
    - 'La base doit être la **même** : dans $2^{3} \times 5^{4}$, rien à regrouper.'
    - 'La base ne change **jamais** : $5^{2} \times 5^{3} = 5^{5}$, et non $25^{5}$.'
    - 'La règle se lit sur la **forme** : parenthèse sur un produit, on distribue ; parenthèse sur une
      puissance, on multiplie.'
    - 'Deux règles à la suite : **de l''intérieur vers l''extérieur**.'
    methode:
      titre: Choisir la règle, puis l'appliquer
      etapes:
      - 'Bases différentes et sans parenthèse commune : rien à simplifier.'
      - Les parenthèses décident entre distribuer et multiplier.
      - Applique la règle sans toucher à la base, de l'intérieur vers l'extérieur.
      - Recommence tant qu'il reste des puissances de même base.
    exemple_resolu: 'Écris $C = \left(5^{2}\right)^{3} \times 5^{4}$ en une seule puissance, puis simplifie
      $D = \frac{7^{9}}{7^{6}}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | L''intérieur d''abord : puissance d''une puissance, on multiplie. | $\left(5^{2}\right)^{3} =
      5^{6}$ |

      | Produit de même base : on ajoute. | $C = 5^{6} \times 5^{4} = 5^{10}$ |

      | Quotient de même base : on soustrait. | $D = 7^{9-6} = 7^{3} = 343$ |

      | **Vérification :** trois paquets de deux font six facteurs, plus quatre, dix. ✓ | |'
    erreurs_frequentes:
    - erreur: $\left(2^{2}\right)^{3} = 2^{5}$.
      correction: on multiplie, donc $2^{6}$. On n'ajoute que dans $2^{2} \times 2^{3}$.
    - erreur: $2^{3} \times 5^{4} = 10^{7}$.
      correction: bases différentes, rien ne se regroupe.
    declic: 'la règle bloque toujours en amont — $\left(-2\right)^{3}$ te semble valoir $+8$ ? Le blocage
      est dans la règle des signes du produit : reprends le module 4. $5^{2} \times 5^{3}$ te donne $25^{5}$
      ? Tu fais deux gestes au lieu d''un : la base ne bouge pas. #### MÉTHODE : Choisir la règle, puis
      l''appliquer 1. Bases différentes et sans parenthèse commune : rien à simplifier. 2. Les parenthèses
      décident entre distribuer et multiplier. 3. Applique la règle sans toucher à la base, de l''intérieur
      vers l''extérieur. 4. Recommence tant qu''il reste des puissances de même base.'
    figures: []
  - id: 4eme_M06_L3
    numero: '6.3'
    titre: Les puissances de $10$
    retenir:
    - '$10^{n}$ est le $1$ suivi de $n$ zéros, et compte $n + 1$ **chiffres** : $10^{3} = 1\,000$.'
    - 'Tout grand nombre rond s''écrit $a \times 10^{n}$ : $45\,000 = 45 \times 10^{3}$.'
    - 'Préfixes : **kilo** $= 10^{3}$, **méga** $= 10^{6}$, **giga** $= 10^{9}$.'
    - '$\frac{1}{10^{n}} = 10^{-n}$, l''exposant négatif comptant les rangs après la virgule : $0{,}001
      = 10^{-3}$.'
    - 'Calcul de tête : $40^{2} = 4^{2} \times 10^{2} = 1\,600$.'
    - 'Comparaison sans calcul, à **base commune** : $4^{5} = \left(2^{2}\right)^{5} = 2^{10} < 2^{12}$.'
    methode:
      titre: Écrire un nombre avec une puissance de $10$
      etapes:
      - 'Repère la partie qui n''est pas faite de zéros : c''est le facteur $a$.'
      - 'Grand nombre : compte les zéros qui suivent, c''est l''exposant $n$.'
      - 'Petit nombre : compte les rangs après la virgule, l''exposant est négatif.'
      - Contrôle en recomptant les chiffres de l'écriture décimale.
    exemple_resolu: 'Un agent de Kantchari a écrit « $40$ km $= 4 \times 10^{3}$ m ». La ligne est-elle
      exacte ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On convertit, car $1$ km vaut $1\,000$ m. | $40$ km $= 40\,000$ m |

      | Facteur $4$, puis on compte les zéros. | $40\,000 = 4 \times 10^{4}$ m |

      | Or $4 \times 10^{3}$ ne vaut que $4\,000$ m. | ligne fausse, écart d''un facteur $10$ |

      | **Vérification :** $4 \times 10^{4}$ compte $5$ chiffres, comme $40\,000$. ✓ | |'
    erreurs_frequentes:
    - erreur: $10\,000 = 10^{5}$.
      correction: 'on compte les zéros, pas les chiffres : $10^{4}$.'
    - erreur: $10^{3} \times 10^{2} = 10^{6}$.
      correction: on ajoute les exposants, donc $10^{5}$.
    declic: null
    figures: []
