- niveau: TleD
  module: 9
  module_titre: Vecteurs et repérage dans le plan
  pourquoi: 'En Tle D, chaque nombre complexe est l''**affixe** d''un point ou d''un vecteur. Sans réflexes
    de calcul vectoriel, le premier chapitre de l''année est illisible.


    *Dans tout ce module, le plan est muni d''un repère orthonormé $\left(O\,;\,\vec{i}\,,\,\vec{j}\right)$.*'
  diagnostic:
  - question: '$A\left(1\,;\,2\right)$ et $B\left(4\,;\,8\right)$ : coordonnées de $\overrightarrow{AB}$.'
    reponse: $\left(3\,;\,6\right)$
  - question: Coordonnées du milieu de $\left[AB\right]$.
    reponse: $\left(\frac{5}{2}\,;\,5\right)$
  - question: $\vec{u}\left(2\,;\,3\right)$ et $\vec{v}\left(4\,;\,6\right)$ sont-ils colinéaires ?
    reponse: oui, $\vec{v} = 2\vec{u}$ (déterminant nul)
  - question: Calcule la distance $AB$.
    reponse: $AB = \sqrt{45} = 3\sqrt{5}$
  - question: '$\vec{u}\left(2\,;\,-1\right)$, $\vec{v}\left(-3\,;\,4\right)$ : coordonnées de $\vec{u}
      + \vec{v}$ et de $2\vec{u} - \vec{v}$.'
    reponse: $\left(-1\,;\,3\right)$ ; $\left(7\,;\,-6\right)$
  lecons:
  - id: TleD_M09_L1
    numero: '9.1'
    titre: Coordonnées d'un vecteur, somme, produit par un réel
    retenir:
    - 'Pour $A\left(x_{A}\,;\,y_{A}\right)$ et $B\left(x_{B}\,;\,y_{B}\right)$ : $\overrightarrow{AB}\left(x_{B}
      - x_{A}\,;\,y_{B} - y_{A}\right)$ (**arrivée moins départ**).'
    - 'Deux vecteurs sont **égaux** si et seulement s''ils ont les **mêmes coordonnées**. $\overrightarrow{AB}
      = \overrightarrow{DC}$ équivaut à : $ABCD$ est un **parallélogramme**.'
    - 'Si $\vec{u}\left(x\,;\,y\right)$ et $\vec{v}\left(x''\,;\,y''\right)$ : $\vec{u} + \vec{v}\left(x
      + x''\,;\,y + y''\right)$ et, pour tout réel $k$, $k\vec{u}\left(kx\,;\,ky\right)$.'
    - '**Relation de Chasles :** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$ (le
      point intermédiaire s''efface).'
    methode:
      titre: Calculer avec les coordonnées
      etapes:
      - Écris chaque vecteur avec la règle **« arrivée moins départ »**.
      - Additionne coordonnée par coordonnée ; multiplie par $k$ chaque coordonnée, signes compris.
      - Pour un **point inconnu** (le $D$ d'un parallélogramme $ABCD$), pose $D\left(x\,;\,y\right)$ et
        traduis l'égalité de vecteurs par une égalité de coordonnées.
      - 'Une égalité de vecteurs donne **deux** équations, une par coordonnée : résous-les séparément.'
    exemple_resolu: '$A\left(1\,;\,1\right)$, $B\left(7\,;\,2\right)$, $C\left(8\,;\,6\right)$. Trouver
      $D$ tel que $ABCD$ soit un parallélogramme.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Traduire par une égalité de vecteurs. | $ABCD$ parallélogramme $\iff$ $\overrightarrow{AB} = \overrightarrow{DC}$
      |

      | Calculer le vecteur connu ; nommer l''inconnu. | $\overrightarrow{AB}\left(6\,;\,1\right)$ ; $D\left(x\,;\,y\right)$,
      $\overrightarrow{DC}\left(8 - x\,;\,6 - y\right)$ |

      | Une équation par coordonnée, résolues séparément. | $8 - x = 6$ et $6 - y = 1$ : **$D\left(2\,;\,5\right)$**
      |

      | **Vérification :** $\overrightarrow{AD}\left(1\,;\,4\right) = \overrightarrow{BC}\left(1\,;\,4\right)$
      ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $\overrightarrow{AB}\left(x_{A} - x_{B}\,;\,y_{A} - y_{B}\right)$.
      correction: c'est **arrivée moins départ** ; dans l'autre ordre on obtient l'opposé, car $\overrightarrow{BA}
        = -\overrightarrow{AB}$.
    - erreur: traduire « $ABCD$ parallélogramme » par $\overrightarrow{AB} = \overrightarrow{CD}$.
      correction: l'égalité est $\overrightarrow{AB} = \overrightarrow{DC}$ ; avec $\overrightarrow{CD}$,
        le quadrilatère se croise.
    declic: null
    figures:
    - figures/m09_f2.svg
  - id: TleD_M09_L2
    numero: '9.2'
    titre: 'Colinéarité : alignement et parallélisme'
    retenir:
    - $\vec{u}$ et $\vec{v}$ sont **colinéaires** s'il existe un réel $k$ tel que $\vec{v} = k\vec{u}$
      (même direction).
    - '**Critère :** $\vec{u}\left(x\,;\,y\right)$ et $\vec{v}\left(x''\,;\,y''\right)$ colinéaires $\iff$
      **$xy'' - x''y = 0$** (déterminant nul).'
    - $A$, $B$, $C$ **alignés** $\iff$ $\overrightarrow{AB}$ et $\overrightarrow{AC}$ colinéaires.
    - $\left(AB\right) \parallel \left(CD\right)$ $\iff$ $\overrightarrow{AB}$ et $\overrightarrow{CD}$
      colinéaires.
    methode:
      titre: Tester un alignement ou un parallélisme
      etapes:
      - Calcule les deux vecteurs ; pour un alignement, fais-les **partir du même point**.
      - Calcule le **déterminant** $xy' - x'y$.
      - 'S''il vaut **0** : colinéaires (points alignés, droites parallèles) ; sinon : non.'
      - Rédige la conclusion en français, pas seulement un $0$ entouré.
    exemple_resolu: '$A\left(1\,;\,2\right)$, $B\left(3\,;\,5\right)$, $C\left(7\,;\,11\right)$ sont-ils
      alignés ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les deux vecteurs partent de $A$. | $\overrightarrow{AB}\left(2\,;\,3\right)$ ; $\overrightarrow{AC}\left(6\,;\,9\right)$
      |

      | Déterminant. | $2 \times 9 - 3 \times 6 = 0$ |

      | Déterminant nul : colinéaires. | **$A$, $B$ et $C$ sont alignés** |

      | **Vérification :** $\overrightarrow{AC} = 3\overrightarrow{AB}$ ✓ | |'
    erreurs_frequentes:
    - erreur: confondre colinéaires et égaux.
      correction: '$\vec{u}\left(2\,;\,3\right)$ et $\vec{v}\left(-4\,;\,-6\right)$ sont colinéaires ($\vec{v}
        = -2\vec{u}$) mais de sens contraire et de longueurs différentes : la colinéarité ne parle que
        de la **direction**.'
    - erreur: tester l'alignement de $A$, $B$, $C$ avec $\overrightarrow{AB}$ et $\overrightarrow{CA}$.
      correction: 'les deux vecteurs doivent partir du même point : $\overrightarrow{AB}$ et $\overrightarrow{AC}$.'
    declic: null
    figures:
    - figures/m09_f6.svg
  - id: TleD_M09_L3
    numero: '9.3'
    titre: Milieu d'un segment et distance entre deux points
    retenir:
    - '**Milieu** $I$ de $\left[AB\right]$ : $I\left(\frac{x_{A} + x_{B}}{2}\,;\,\frac{y_{A} + y_{B}}{2}\right)$,
      la **moyenne** des coordonnées, axe par axe.'
    - '**Distance** (repère orthonormé) : $AB = \sqrt{\left(x_{B} - x_{A}\right)^{2} + \left(y_{B} - y_{A}\right)^{2}}$
      : l''hypoténuse d''un triangle rectangle dont les côtés sont les coordonnées de $\overrightarrow{AB}$.'
    - '**Garde les carrés** jusqu''à la dernière ligne : comparer $AB$ et $AC$ revient à comparer $AB^{2}$
      et $AC^{2}$, et la réciproque de Pythagore parle elle aussi de carrés.'
    methode:
      titre: Reconnaître la nature d'un triangle par les distances
      etapes:
      - Calcule les **trois** carrés $AB^{2}$, $AC^{2}$, $BC^{2}$.
      - 'Deux longueurs égales : **isocèle** ; trois : **équilatéral**.'
      - 'Repère le plus grand carré : le sommet de l''angle droit éventuel est la lettre qui **n''y figure
        pas**.'
      - 'Si ce plus grand carré est la somme des deux autres : **rectangle** en ce sommet.'
    exemple_resolu: '$A\left(1\,;\,1\right)$, $B\left(4\,;\,5\right)$, $C\left(5\,;\,-2\right)$. Nature
      du triangle $ABC$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les trois carrés de distances. | $AB^{2} = 25$ ; $AC^{2} = 25$ ; $BC^{2} = 50$ |

      | Deux carrés égaux. | $AB = AC = 5$ : **isocèle en $A$** |

      | Plus grand carré $BC^{2}$ : sommet candidat $A$. | $AB^{2} + AC^{2} = 50 = BC^{2}$ |

      | **Conclusion :** $ABC$ est rectangle et isocèle en $A$ (réciproque de Pythagore) ✓ | |'
    erreurs_frequentes:
    - erreur: conclure $AB = 25$ alors que $AB^{2} = 25$, ou simplifier $\sqrt{a^{2} + b^{2}}$ en $a +
        b$.
      correction: '$AB = 5$, et $\sqrt{9 + 16} = 5 \ne 7$ : la racine ne se distribue pas sur une somme.'
    - erreur: écrire $-3^{2}$ pour le carré de $-3$.
      correction: $-3^{2} = -9$ alors que $\left(-3\right)^{2} = 9$ ; les parenthèses sont obligatoires.
    declic: null
    figures:
    - figures/m09_f9.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: $A\left(-2\,;\,3\right)$, $B\left(1\,;\,-1\right)$, $C\left(4\,;\,2\right)$. Calcule $\overrightarrow{AB}$,
      $\overrightarrow{BC}$, $\overrightarrow{AC}$, puis vérifie la relation de Chasles.
    correction: '$\overrightarrow{AB}\left(3\,;\,-4\right)$ ; $\overrightarrow{BC}\left(3\,;\,3\right)$
      ; $\overrightarrow{AC}\left(6\,;\,-1\right)$. Chasles : $\left(3 + 3\,;\,-4 + 3\right) = \left(6\,;\,-1\right)$
      ✓'
  - numero: 2
    etoiles: 1
    enonce: Avec les mêmes points, détermine $D$ tel que $ABCD$ soit un parallélogramme.
    correction: '$\overrightarrow{AB} = \overrightarrow{DC}$ : $\left(3\,;\,-4\right) = \left(4 - x\,;\,2
      - y\right)$, d''où $D\left(1\,;\,6\right)$.'
  - numero: 3
    etoiles: 1
    enonce: $\vec{u}\left(3\,;\,-2\right)$ et $\vec{v}\left(-9\,;\,6\right)$ sont-ils colinéaires ? Et
      $\vec{u}$ et $\vec{w}\left(6\,;\,-5\right)$ ?
    correction: '$3 \times 6 - \left(-2\right)\left(-9\right) = 0$ : colinéaires ($\vec{v} = -3\vec{u}$).
      $3 \times \left(-5\right) - \left(-2\right) \times 6 = -3 \ne 0$ : non colinéaires.'
  - numero: 4
    etoiles: 1
    enonce: Les points $E\left(-1\,;\,1\right)$, $F\left(2\,;\,7\right)$ et $G\left(4\,;\,11\right)$ sont-ils
      alignés ?
    correction: '$\overrightarrow{EF}\left(3\,;\,6\right)$, $\overrightarrow{EG}\left(5\,;\,10\right)$
      : déterminant $0$, points **alignés**.'
  - numero: 5
    etoiles: 1
    enonce: $A\left(-1\,;\,2\right)$ et $B\left(5\,;\,-4\right)$. Calcule le milieu $I$ de $\left[AB\right]$
      et la distance $AB$.
    correction: $I\left(2\,;\,-1\right)$ ; $\overrightarrow{AB}\left(6\,;\,-6\right)$, $AB = \sqrt{72}
      = 6\sqrt{2}$.
  - numero: 6
    etoiles: 1
    enonce: Montre que le triangle $P\left(0\,;\,0\right)$, $Q\left(4\,;\,2\right)$, $R\left(2\,;\,6\right)$
      est isocèle. Est-il rectangle ?
    correction: '$PQ^{2} = QR^{2} = 20$, $PR^{2} = 40$ : isocèle en $Q$, et $20 + 20 = 40$ : **rectangle
      isocèle en $Q$**.'
  - numero: 7
    etoiles: 1
    enonce: '$A\left(2\,;\,-1\right)$, $B\left(5\,;\,3\right)$, $C\left(-1\,;\,4\right)$. Calcule : a)
      $\overrightarrow{AB}$ et $\overrightarrow{CA}$ ; b) $\overrightarrow{AB} + \overrightarrow{CA}$
      ; c) $3\overrightarrow{AB}$ ; d) $2\overrightarrow{AB} - 3\overrightarrow{AC}$.'
    correction: a) $\overrightarrow{AB}\left(3\,;\,4\right)$ ; $\overrightarrow{CA}\left(3\,;\,-5\right)$.
      b) $\left(6\,;\,-1\right)$. c) $\left(9\,;\,12\right)$. d) $\overrightarrow{AC}\left(-3\,;\,5\right)$,
      donc $\left(15\,;\,-7\right)$.
  - numero: 8
    etoiles: 1
    enonce: $\vec{u}\left(3\,;\,-1\right)$, $\vec{v}\left(-2\,;\,5\right)$, $\vec{w}\left(0\,;\,13\right)$.
      a) Calcule $2\vec{u} + 3\vec{v}$. b) Trouve $a$ et $b$ réels tels que $\vec{w} = a\vec{u} + b\vec{v}$.
    correction: a) $\left(0\,;\,13\right) = \vec{w}$. b) $a = 2$, $b = 3$ (unique solution du système
      $3a - 2b = 0$, $-a + 5b = 13$).
  - numero: 9
    etoiles: 1
    enonce: Colinéaires ou non ? a) $\vec{u}\left(4\,;\,6\right)$ et $\vec{v}\left(6\,;\,9\right)$ ; b)
      $\vec{u}\left(5\,;\,-2\right)$ et $\vec{v}\left(-2\,;\,5\right)$ ; c) $\vec{u}\left(\frac{1}{2}\,;\,\frac{3}{4}\right)$
      et $\vec{v}\left(2\,;\,3\right)$.
    correction: 'a) $0$ : colinéaires. b) $21 \ne 0$ : non. c) $\frac{3}{2} - \frac{3}{2} = 0$ : colinéaires.'
  - numero: 10
    etoiles: 1
    enonce: Points alignés ? a) $A\left(2\,;\,1\right)$, $B\left(5\,;\,7\right)$, $C\left(-2{,}5\,;\,-8\right)$
      ; b) $D\left(0\,;\,3\right)$, $E\left(2\,;\,4\right)$, $F\left(8\,;\,7\right)$.
    correction: 'a) $3 \times \left(-9\right) - 6 \times \left(-4{,}5\right) = 0$ : alignés. b) $2 \times
      4 - 1 \times 8 = 0$ : alignés.'
  - numero: 11
    etoiles: 1
    enonce: Détermine $m$ pour que $\vec{u}\left(3\,;\,m\right)$ et $\vec{v}\left(6\,;\,10\right)$ soient
      colinéaires.
    correction: $3 \times 10 - 6m = 0$, donc $m = 5$.
  - numero: 12
    etoiles: 1
    enonce: '$A\left(-2\,;\,5\right)$ et $B\left(6\,;\,-1\right)$. a) Milieu $I$ de $\left[AB\right]$.
      b) Calcule $AB$. c) Détermine $C$ tel que $B$ soit le milieu de $\left[AC\right]$.


      ### Entraînement ★★'
    correction: a) $I\left(2\,;\,2\right)$. b) $\overrightarrow{AB}\left(8\,;\,-6\right)$, $AB = 10$.
      c) $C\left(2x_{B} - x_{A}\,;\,2y_{B} - y_{A}\right) = \left(14\,;\,-7\right)$.
  - numero: 13
    etoiles: 2
    enonce: $A\left(1\,;\,3\right)$, $B\left(4\,;\,-1\right)$, $C\left(6\,;\,5\right)$. a) Détermine $D$
      tel que $ABCD$ soit un parallélogramme. b) Détermine son centre.
    correction: 'a) $\overrightarrow{AB}\left(3\,;\,-4\right) = \overrightarrow{DC}\left(6 - x\,;\,5 -
      y\right)$ : $D\left(3\,;\,9\right)$. b) Centre $=$ milieu de $\left[AC\right] = \left(\frac{7}{2}\,;\,4\right)$
      (idem pour $\left[BD\right]$ ✓).'
  - numero: 14
    etoiles: 2
    enonce: $A\left(-3\,;\,2\right)$, $B\left(1\,;\,4\right)$, $C\left(2\,;\,-1\right)$, $D\left(10\,;\,3\right)$.
      Les droites $\left(AB\right)$ et $\left(CD\right)$ sont-elles parallèles ?
    correction: '$\overrightarrow{AB}\left(4\,;\,2\right)$, $\overrightarrow{CD}\left(8\,;\,4\right)$
      : déterminant $0$, donc $\left(AB\right) \parallel \left(CD\right)$ (strictement : $C \notin \left(AB\right)$).'
  - numero: 15
    etoiles: 2
    enonce: Montre que le triangle $A\left(1\,;\,2\right)$, $B\left(4\,;\,6\right)$, $C\left(8\,;\,3\right)$
      est rectangle et isocèle en $B$.
    correction: '$AB^{2} = BC^{2} = 25$, $AC^{2} = 50$ : isocèle en $B$ et $25 + 25 = 50$, donc rectangle
      en $B$.'
  - numero: 16
    etoiles: 2
    enonce: $A\left(0\,;\,0\right)$, $B\left(6\,;\,0\right)$, $C\left(7\,;\,3\right)$, $D\left(1\,;\,3\right)$.
      a) Montre que $ABCD$ est un parallélogramme. b) Est-ce un losange ? un rectangle ? Justifie par
      des distances.
    correction: 'a) $\overrightarrow{AB}\left(6\,;\,0\right) = \overrightarrow{DC}\left(6\,;\,0\right)$
      : parallélogramme. b) $AB = 6$, $AD = \sqrt{10}$ : pas un losange ; $AC^{2} = 58 \ne BD^{2} = 34$
      : pas un rectangle.'
  - numero: 17
    etoiles: 2
    enonce: '*(Bagré.)* Sur un périmètre irrigué (unité : 100 m), trois vannes sont en $V_{1}\left(1\,;\,2\right)$,
      $V_{2}\left(4\,;\,6\right)$, $V_{3}\left(7\,;\,10\right)$. a) Montre qu''elles sont alignées. b)
      Donne le milieu de $\left[V_{1}V_{3}\right]$. Que remarques-tu ? c) Calcule la distance réelle $V_{1}V_{3}$
      en mètres.'
    correction: 'a) $\overrightarrow{V_{1}V_{3}}\left(6\,;\,8\right) = 2\overrightarrow{V_{1}V_{2}}\left(3\,;\,4\right)$
      : alignées. b) Milieu $\left(4\,;\,6\right)$, c''est $V_{2}$ : le régulateur se pose sur $V_{2}$.
      c) $\sqrt{100} = 10$ unités, soit $\mathbf{1\,000}$ m.'
  - numero: 18
    etoiles: 2
    enonce: '*(Trouve l''erreur.)* Pour $A\left(2\,;\,3\right)$ et $B\left(5\,;\,9\right)$, Ibrahim écrit
      : « $\overrightarrow{AB}\left(2 - 5\,;\,3 - 9\right) = \left(-3\,;\,-6\right)$, et $AB = \sqrt{-3^{2}
      + \left(-6\right)^{2}} = \sqrt{-9 + 36} = \sqrt{27}$ ». Trouve les **deux** erreurs et corrige le
      calcul.'
    correction: 'Erreur 1 : « départ moins arrivée » ; il faut $\overrightarrow{AB}\left(3\,;\,6\right)$.
      Erreur 2 : $-3^{2}$ sans parenthèses ; un carré est positif. Correction : $AB = \sqrt{9 + 36} =
      \sqrt{45} = 3\sqrt{5}$.'
  - numero: 19
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Explique pourquoi le critère « $xy'' - x''y = 0$ » traduit que
      deux vecteurs ont la même direction, en t''appuyant sur les coordonnées proportionnelles.


      ### ★★★ Défis de maîtrise'
    correction: 'Si $\vec{v} = k\vec{u}$ alors $x'' = kx$, $y'' = ky$ et $xy'' - x''y = kxy - kxy = 0$.
      Réciproquement $xy'' = x''y$ est l''égalité des produits en croix, donc la proportionnalité des
      coordonnées : même direction.'
  - numero: 20
    etoiles: 3
    enonce: $A\left(1\,;\,2\right)$, $B\left(5\,;\,4\right)$, $C\left(3\,;\,6\right)$. Combien existe-t-il
      de points $D$ tels que $A$, $B$, $C$, $D$ soient les quatre sommets d'un parallélogramme ? Détermine-les
      tous, en précisant l'ordre des sommets, et justifie qu'il n'y en a pas d'autres.
    correction: '*Recherche :* trois points étant fixés, $D$ est opposé à $A$, à $B$ ou à $C$, et chaque
      choix le détermine par une égalité vectorielle : il y a donc exactement trois cas, pas davantage.

      $\overrightarrow{AB}\left(4\,;\,2\right)$, $\overrightarrow{CB}\left(2\,;\,-2\right)$.

      $D$ opposé à $B$ ($ABCD$) : $\overrightarrow{AB} = \overrightarrow{DC}$ donne $D_{1}\left(-1\,;\,4\right)$.

      $D$ opposé à $C$ ($ABDC$) : $\overrightarrow{AB} = \overrightarrow{CD}$ donne $D_{2}\left(7\,;\,8\right)$.

      $D$ opposé à $A$ ($ADBC$) : $\overrightarrow{AD} = \overrightarrow{CB}$ donne $D_{3}\left(3\,;\,0\right)$.
      Contrôle du cas 1 : milieux de $\left[AC\right]$ et $\left[BD_{1}\right]$ égaux à $\left(2\,;\,4\right)$
      ✓'
  - numero: 21
    etoiles: 3
    enonce: 'Sur un lotissement de Ouagadougou (unité : $10$ m), trois bornes sont en $P\left(2\,;\,1\right)$,
      $Q\left(8\,;\,3\right)$, $R\left(6\,;\,9\right)$. Détermine la nature exacte du triangle $PQR$ en
      prouvant chaque propriété annoncée, puis calcule l''aire réelle du terrain en mètres carrés.'
    correction: '*Recherche :* on calcule les carrés des longueurs, qui servent à la fois pour l''égalité
      de côtés et pour la réciproque de Pythagore.

      $PQ^{2} = 40$, $QR^{2} = 40$, $PR^{2} = 80$. Donc $PQ = QR = 2\sqrt{10}$ : isocèle en $Q$ ; et $40
      + 40 = 80$ : **rectangle et isocèle en $Q$**.

      Aire $= \frac{PQ \times QR}{2} = \frac{40}{2} = 20$ unités d''aire ; une unité d''aire vaut $100$
      m², donc $\mathbf{2\,000}$ m².'
  - numero: 22
    etoiles: 3
    enonce: a) $M\left(3\,;\,-1\right)$ est le milieu de $\left[AB\right]$ et $A\left(-2\,;\,5\right)$.
      Retrouve $B$. b) $G\left(1\,;\,2\right)$ vérifie $\overrightarrow{GA} + \overrightarrow{GB} + \overrightarrow{GC}
      = \overrightarrow{0}$, avec $A\left(-2\,;\,5\right)$ et $B$ trouvé en a). Retrouve $C$, puis vérifie.
    correction: '*Recherche :* dans les deux cas on écrit la relation avec les coordonnées inconnues,
      puis on résout.

      a) $3 = \frac{-2 + x_{B}}{2}$ et $-1 = \frac{5 + y_{B}}{2}$ : $B\left(8\,;\,-7\right)$.

      b) La relation donne $x_{A} + x_{B} + x_{C} = 3x_{G}$ (idem en $y$), d''où $x_{C} = 3 + 2 - 8 =
      -3$ et $y_{C} = 6 - 5 + 7 = 8$ : $C\left(-3\,;\,8\right)$. Vérification : $\frac{-2 + 8 - 3}{3}
      = 1$ et $\frac{5 - 7 + 8}{3} = 2$ ✓ ($G$ est le centre de gravité).'
  - numero: 23
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Si $\vec{u}$ et $\vec{v}$ sont colinéaires et si $\vec{v}$ et $\vec{w}$ sont colinéaires, alors
      $\vec{u}$ et $\vec{w}$ sont colinéaires.

      b) Pour tous points $A$, $B$, $C$ : $\overrightarrow{AB} + \overrightarrow{BC} + \overrightarrow{CA}
      = \overrightarrow{0}$.

      c) $A$, $B$, $C$ sont alignés si et seulement si $\det\left(\overrightarrow{AB}\,;\,\overrightarrow{AC}\right)
      = 0$.

      d) Si $AB = CD$, alors $\overrightarrow{AB} = \overrightarrow{CD}$.'
    correction: '*Recherche :* le cas limite oublié est le vecteur nul, colinéaire à tout vecteur.

      a) **Faux :** $\vec{u}\left(1\,;\,0\right)$, $\vec{v} = \vec{0}$, $\vec{w}\left(0\,;\,1\right)$
      : hypothèses vérifiées, mais $\det\left(\vec{u}\,;\,\vec{w}\right) = 1 \ne 0$. Vrai si $\vec{v}
      \ne \vec{0}$.

      b) **Vrai :** Chasles donne $\overrightarrow{AC} + \overrightarrow{CA} = \overrightarrow{AA} = \overrightarrow{0}$.

      c) **Vrai :** alignement $\iff$ $\overrightarrow{AB}$ et $\overrightarrow{AC}$ colinéaires $\iff$
      déterminant nul (cas de points confondus compris).

      d) **Faux :** $A\left(0\,;\,0\right)$, $B\left(1\,;\,0\right)$, $C\left(0\,;\,0\right)$, $D\left(0\,;\,1\right)$
      : $AB = CD = 1$ mais les vecteurs diffèrent. Une longueur ne dit rien de la direction.'
  - numero: 24
    etoiles: 3
    enonce: $A$, $B$, $C$ trois points du plan, $I$ le milieu de $\left[BC\right]$. a) Démontre que pour
      tout point $M$, $\overrightarrow{MB} + \overrightarrow{MC} = 2\overrightarrow{MI}$. b) Déduis-en
      qu'il existe un unique point $G$ tel que $\overrightarrow{GA} + \overrightarrow{GB} + \overrightarrow{GC}
      = \overrightarrow{0}$, et démontre que $\overrightarrow{AG} = \frac{2}{3}\overrightarrow{AI}$. c)
      Explique en une phrase comment construire $G$ à la règle.
    correction: '*Recherche :* on insère $I$ par Chasles, puis on applique a) avec $M = G$ pour passer
      de trois vecteurs à deux.

      a) $\overrightarrow{MB} + \overrightarrow{MC} = 2\overrightarrow{MI} + \left(\overrightarrow{IB}
      + \overrightarrow{IC}\right) = 2\overrightarrow{MI}$, car $I$ milieu de $\left[BC\right]$ donne
      $\overrightarrow{IB} + \overrightarrow{IC} = \overrightarrow{0}$.

      b) Avec $M = G$ : $\overrightarrow{GA} + 2\overrightarrow{GI} = \overrightarrow{0}$ ; en insérant
      $A$ : $3\overrightarrow{GA} = -2\overrightarrow{AI}$, soit $\overrightarrow{AG} = \frac{2}{3}\overrightarrow{AI}$,
      qui détermine $G$ de façon unique.

      c) On trace la médiane $\left(AI\right)$ et on place $G$ aux deux tiers de $\left[AI\right]$ à partir
      de $A$ : c''est le centre de gravité.'
  - numero: 25
    etoiles: 3
    enonce: $A\left(-1\,;\,3\right)$, $B\left(2\,;\,-1\right)$, $C\left(5\,;\,7\right)$. a) Calcule $\det\left(\overrightarrow{AB}\,;\,\overrightarrow{AC}\right)$
      et conclus sur l'alignement. b) Calcule $AB$, puis l'aire du triangle $ABC$. c) Détermine $D$ tel
      que $ABDC$ soit un parallélogramme, et vérifie que $\left[AD\right]$ et $\left[BC\right]$ ont le
      même milieu.
    correction: '*Recherche :* le déterminant prouve d''abord que le triangle existe, puis donne l''aire
      sans calculer de hauteur.

      a) $\overrightarrow{AB}\left(3\,;\,-4\right)$, $\overrightarrow{AC}\left(6\,;\,4\right)$ : $\det
      = 12 + 24 = 36 \ne 0$ : **non alignés**.

      b) $AB = \sqrt{9 + 16} = 5$ ; $\mathcal{A} = \frac{36}{2} = 18$ unités d''aire.

      c) $\overrightarrow{AB} = \overrightarrow{CD}$ donne $D\left(8\,;\,3\right)$. Milieux de $\left[AD\right]$
      et de $\left[BC\right]$ : tous deux $\left(\frac{7}{2}\,;\,3\right)$ ✓


      ---'
  fiche_revision:
  - '**Vecteur.** $\overrightarrow{AB}\left(x_{B} - x_{A}\,;\,y_{B} - y_{A}\right)$ : arrivée moins départ.'
  - '**Opérations.** $\vec{u} + \vec{v}\left(x + x''\,;\,y + y''\right)$ ; $k\vec{u}\left(kx\,;\,ky\right)$.'
  - '**Chasles.** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$.'
  - '**Parallélogramme.** $ABCD$ parallélogramme $\iff$ $\overrightarrow{AB} = \overrightarrow{DC}$ $\iff$
    $\left[AC\right]$ et $\left[BD\right]$ ont même milieu.'
  - '**Colinéarité.** $xy'' - x''y = 0$ : alignement de points, parallélisme de droites.'
  - '**Milieu.** $I\left(\frac{x_{A} + x_{B}}{2}\,;\,\frac{y_{A} + y_{B}}{2}\right)$.'
  - '**Distance.** $AB = \sqrt{\left(x_{B} - x_{A}\right)^{2} + \left(y_{B} - y_{A}\right)^{2}}$ ; garder
    les carrés jusqu''au bout.'
  - '**Aire.** $\mathcal{A}\left(ABC\right) = \frac{1}{2}\left|\det\left(\overrightarrow{AB}\,;\,\overrightarrow{AC}\right)\right|$.'
  trouve_erreur:
  - faux: $\overrightarrow{AB}\left(x_{A} - x_{B}\,;\,y_{A} - y_{B}\right)$
    correction: 'Arrivée moins départ : $\left(x_{B} - x_{A}\,;\,y_{B} - y_{A}\right)$'
  - faux: $ABCD$ parallélogramme $\iff \overrightarrow{AB} = \overrightarrow{CD}$
    correction: $\overrightarrow{AB} = \overrightarrow{DC}$ ; sinon le quadrilatère se croise
  - faux: $AB^{2} = 25$ donc $AB = 25$
    correction: $AB = \sqrt{25} = 5$
  - faux: $\sqrt{9 + 16} = 3 + 4 = 7$
    correction: '$\sqrt{25} = 5$ : la racine ne se distribue pas sur une somme'
