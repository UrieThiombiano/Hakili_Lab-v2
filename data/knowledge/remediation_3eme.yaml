  - numero: 26
    etoiles: 3
    enonce: Vrai ou faux ? Tranche, puis prouve ou donne un contre-exemple appuyé sur un croquis. a) Dans
      un triangle, une droite qui passe par le milieu d'un côté et qui est parallèle à un deuxième côté
      passe par le milieu du troisième. b) Dans un triangle $ABC$, si $I$ est le milieu de $\left[AB\right]$,
      si $J$ appartient à $\left[AC\right]$ et si $IJ = \frac{BC}{2}$, alors $J$ est le milieu de $\left[AC\right]$.
      c) Une projection parallèle conserve les longueurs. d) La projection orthogonale d'un point $M$
      sur $\left(d\right)$ est le point de $\left(d\right)$ le plus proche de $M$.
    correction: 'a) **Vrai** : c''est la réciproque. b) **Faux** : une longueur ne fixe pas une position.
      Les points à la distance $\frac{BC}{2}$ de $I$ forment un cercle qui recoupe $\left(AC\right)$ en
      un second point ; sur un triangle très ouvert en $A$, on place sur $\left[AC\right]$ un point $J''$
      distinct du milieu avec $IJ'' = IJ$. Il faut la **parallèle**, pas la longueur. c) **Faux** : seuls
      l''alignement et le milieu sont conservés ; un segment oblique se raccourcit ou s''allonge. d) **Vrai**
      : c''est la définition de la distance d''un point à une droite.'
