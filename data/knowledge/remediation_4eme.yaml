- niveau: 4eme
  module: 8
  module_titre: 'Proportionnalité appliquée : échelle, vitesse, masse volumique, débit'
  pourquoi: 'Le produit en croix, tu sais l''écrire ; ce qui dérape, c''est la conversion avant le calcul
    et le contrôle du sens du résultat. Trois erreurs reviennent : ajouter au lieu de multiplier, s''arrêter
    à la remise au lieu du prix payé, diviser une masse par un volume à l''envers.'
  diagnostic:
  - question: $4$ cahiers coûtent $600$ FCFA. Combien coûtent $10$ cahiers ?
    reponse: $600 \div 4 = 150$, donc $1\,500$ FCFA
  - question: Un pagne coûte $8\,000$ FCFA, remise de $25$ %. Quel est le prix à payer ?
    reponse: remise $2\,000$, prix payé $6\,000$ FCFA
  - question: Sur une carte au $\frac{1}{1\,000\,000}$, une route mesure $4$ cm. Longueur réelle, en kilomètres
      ?
    reponse: $4 \times 1\,000\,000 = 4\,000\,000$ cm $= 40$ km
  - question: Une moto parcourt $150$ km en $2$ h $30$ min. Vitesse moyenne ?
    reponse: $2{,}5$ h, $150 \div 2{,}5 = 60$ km/h
  - question: Un bidon de $5$ L d'huile pèse $4{,}5$ kg. Masse volumique, en kg/L ?
    reponse: $4{,}5 \div 5 = 0{,}9$ kg/L
  lecons:
  - id: 4eme_M08_L1
    numero: '8.1'
    titre: Tableau de proportionnalité et quatrième proportionnelle
    retenir:
    - 'Grandeurs proportionnelles : on passe de l''une à l''autre en multipliant **toujours** par le même
      nombre, le **coefficient**.'
    - 'Test : on divise colonne par colonne, **dans le même sens** ; un quotient différent, et c''est
      non.'
    - 'Le coefficient garde son unité : $500$ FCFA par sac, $0{,}9$ kg par litre.'
    - 'Le nombre manquant est la **quatrième proportionnelle** : passage à l''unité, coefficient, ou produit
      en croix.'
    methode:
      titre: Compléter un tableau de proportionnalité
      etapes:
      - Vérifie par le test des rapports.
      - Calcule le coefficient, note son unité.
      - Multiplie pour descendre, divise pour remonter.
      - 'Contrôle le sens : plus de cahiers, donc plus cher.'
    exemple_resolu: 'À Bittou, $6$ mètres de tissu coûtent $4\,800$ FCFA. Prix de $9$ mètres ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Passage à l''unité. | $4\,800 \div 6 = 800$ FCFA par mètre. |

      | On multiplie par la longueur demandée. | $800 \times 9 = 7\,200$ FCFA. |

      | Contrôle en croix. | $\left(9 \times 4\,800\right) \div 6 = 7\,200$. ✓ |


      > #### DÉCLIC : on multiplie, on n''ajoute pas

      >

      > Écrire « $4$ cahiers de plus, donc $4$ francs de plus », c''est comparer des cahiers à des francs.

      > Quatre cahiers de plus, ce sont $4 \times 75 = 300$ FCFA de plus.'
    erreurs_frequentes:
    - erreur: tableau déclaré proportionnel parce que tout augmente.
      correction: $10$, $15$, $20$ et $15$, $20$, $25$ augmentent ensemble, pourtant $15 \div 10 \neq
        20 \div 15$.
    - erreur: produit en croix à l'envers, $\left(8 \times 600\right) \div 12$.
      correction: on multiplie **en diagonale**, $\left(12 \times 600\right) \div 8 = 900$.
    declic: 'on multiplie, on n''ajoute pas — Écrire « $4$ cahiers de plus, donc $4$ francs de plus »,
      c''est comparer des cahiers à des francs. Quatre cahiers de plus, ce sont $4 \times 75 = 300$ FCFA
      de plus. #### ⚠ ATTENTION ! - **Erreur fréquente :** tableau déclaré proportionnel parce que tout
      augmente. **Correction :** $10$, $15$, $20$ et $15$, $20$, $25$ augmentent ensemble, pourtant $15
      \div 10 \neq 20 \div 15$. - **Erreur fréquente :** produit en croix à l''envers, $\left(8 \times
      600\right) \div 12$. **Correction :** on multiplie **en diagonale**, $\left(12 \times 600\right)
      \div 8 = 900$.'
    figures: []
  - id: 4eme_M08_L2
    numero: '8.2'
    titre: 'Les pourcentages : appliquer, augmenter, diminuer'
    retenir:
    - '$p$ % d''une quantité : multiplier par $p$, diviser par $100$.'
    - 'Repères : $25$ % $= \frac{1}{4}$, $50$ % $= \frac{1}{2}$, $20$ % $= \frac{1}{5}$, $10$ % $= \frac{1}{10}$.'
    - '**Diminuer de $p$ %** : la part, puis **soustraire** ; **augmenter** : la part, puis **ajouter**.
      Le premier temps donne la **part**, le second le **nouveau prix**.'
    - 'Les pourcentages successifs ne s''additionnent pas : chacun porte sur ce qui le précède.'
    methode:
      titre: Calculer un prix après pourcentage
      etapes:
      - Repère la quantité de départ.
      - 'Calcule la part : multiplie par $p$, divise par $100$.'
      - Soustrais pour une diminution, ajoute pour une augmentation.
      - 'Contrôle : jamais de moitié pour moins de $50$ %.'
    exemple_resolu: 'À Koudougou, un sac de riz affiché $12\,000$ FCFA, remise de $30$ %. a) Montant de
      la remise ? b) Prix payé ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La part. | $12\,000 \div 100 \times 30 = 3\,600$ FCFA. |

      | La remise se retire. | $12\,000 - 3\,600 = 8\,400$ FCFA. |

      | **Vérification :** $8\,400 + 3\,600 = 12\,000$. ✓ | |'
    erreurs_frequentes:
    - erreur: la remise annoncée comme somme à payer.
      correction: $25$ % de $2\,000$, c'est $500$ FCFA de remise, donc $1\,500$ FCFA payés.
    - erreur: « $20$ % de $350$, c'est $350 - 20$ ».
      correction: $350 \div 100 \times 20 = 70$ ; un pourcentage ne se soustrait pas.
    declic: null
    figures: []
  - id: 4eme_M08_L3
    numero: '8.3'
    titre: L'échelle d'un plan ou d'une carte
    retenir:
    - Échelle $= \frac{\text{plan}}{\text{réel}}$, les deux dans la **même unité**.
    - Au $\frac{1}{n}$, $1$ cm de plan représente $n$ cm en réalité ; plus $n$ est grand, plus le dessin
      est petit.
    - '$1$ km $= 100\,000$ cm ; $1$ m $= 100$ cm. Une réponse en centimètres n''est pas finie : convertis.'
    methode:
      titre: Calculer avec une échelle
      etapes:
      - Écris l'échelle $\frac{1}{n}$, repère ce qui est cherché.
      - 'Réel : mesure du plan en cm $\times \, n$, puis convertis.'
      - 'Plan : réel converti en cm, puis $\div \, n$.'
      - 'Échelle : les deux en cm, rapport plan sur réel, simplifie.'
    exemple_resolu: 'À Diapaga, un plan est au $\frac{1}{200}$. La cour y est un rectangle de $12$ cm
      sur $7$ cm. a) Dimensions réelles ? b) Aire réelle, en m$^{2}$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Un centimètre de plan vaut $200$ cm. | $12 \times 200 = 2\,400$ cm ; $7 \times 200 = 1\,400$ cm.
      |

      | On convertit en mètres. | $24$ m et $14$ m. |

      | L''aire vient **après** conversion. | $24 \times 14 = 336$ m$^{2}$. ✓ |


      [SVG: figures/m08_f3.svg]

      *Figure 8.1 : au $\frac{1}{200}$, un centimètre de plan vaut deux mètres de terrain.*'
    erreurs_frequentes:
    - erreur: au $\frac{1}{200}$, terrain cru $200$ fois plus petit que le plan.
      correction: c'est le plan qui est réduit ; réel $=$ plan $\times 200$.
    - erreur: « $250\,000$ » donné comme distance réelle.
      correction: $250\,000$ cm $= 2{,}5$ km, avec l'unité.
    declic: null
    figures:
    - figures/m08_f3.svg
  - id: 4eme_M08_L4
    numero: '8.4'
    titre: Vitesse, masse volumique et débit
    retenir:
    - '**Masse volumique** : $\rho = \frac{m}{V}$, d''où $m = \rho \times V$ et $V = \frac{m}{\rho}$.
      Eau : $1$ kg/L.'
    - '**Vitesse moyenne** : $v = \frac{d}{t}$, d''où $d = v \times t$ et $t = \frac{d}{v}$.'
    - '**Débit** : $Q = \frac{V}{t}$, d''où $V = Q \times t$ et $t = \frac{V}{Q}$.'
    - 'On divise **la grandeur nommée en premier par celle qui suit le mot « par »**. Vitesse moyenne
      : distance **totale** sur durée **totale**, jamais la moyenne de deux vitesses.'
    - 'Durées : $45$ min $= 45 \div 60 = 0{,}75$ h ; $2{,}25$ h $= 2$ h $15$ min.'
    methode:
      titre: Calculer une grandeur quotient
      etapes:
      - Lis à voix haute le nom de l'unité cherchée.
      - 'Convertis avant de calculer : des grammes avec des cm$^{3}$, des km avec des heures.'
      - Écarte les temps d'arrêt pour une vitesse de roulage.
      - Applique la formule, écris l'unité, contrôle la plausibilité.
    exemple_resolu: 'À Gorom-Gorom, une pompe remplit un bassin de $900$ L en $15$ min. a) Débit en L/min
      ? b) Durée pour une citerne de $3$ m$^{3}$ ? c) Débit en m$^{3}$/h ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Volume écoulé en une minute. | $Q = 900 \div 15 = 60$ L/min. |

      | Des litres avec des litres. | $3$ m$^{3} = 3\,000$ L. |

      | Volume divisé par débit. | $t = 3\,000 \div 60 = 50$ min. |

      | Soixante fois plus en une heure. | $60 \times 60 = 3\,600$ L/h $= 3{,}6$ m$^{3}$/h. |


      [SVG: figures/m08_f4.svg]

      *Figure 8.2 : les trois grandeurs quotients partagent le même mécanisme.*'
    erreurs_frequentes:
    - erreur: écrire $2$ h $30$ min $= 2{,}30$ h.
      correction: $30 \div 60 = 0{,}5$, donc $2{,}5$ h.
    - erreur: des kilogrammes divisés par des cm$^{3}$.
      correction: convertis, $1{,}2$ kg $= 1\,200$ g, puis $1\,200 \div 150 = 8$ g/cm$^{3}$.
    declic: null
    figures:
    - figures/m08_f4.svg
