  domaine: Donnees, proportionnalite, statistique
  objet: Calculer le coût du grillage (1 200 FCFA/m) d'un champ de 45 m sur 30 m, juger un budget de 200
    000
  reponse_attendue: périmètre 150 m ; coût 180 000 FCFA < 200 000, le budget suffit (reste 20 000 FCFA)
  solution: '2 × (45 + 30) = 150 m ; 150 × 1 200 = 180 000 FCFA < 200 000 ; reste 20 000 FCFA. Barème
    (3 pts) : 1 pt pour le périmètre 150 m ; 1 pt pour le coût 180 000 FCFA ; 1 pt pour la conclusion
    que le budget suffit, appuyée sur 180 000 vs 200 000. Un périmètre calculé comme 45 + 30 perd le premier
    point mais garde les deux autres si le coût et la conclusion en découlent correctement.'
  si_echoue: Périmètre d'un rectangle confondu avec la somme de deux côtés.
  probleme_parent: P3
