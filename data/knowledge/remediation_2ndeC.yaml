      ### ★★★ Défis de maîtrise'
    correction: 'Dans $ABC$ rectangle en $A$ : $\tan \widehat{B} = \frac{AC}{AB}$ et $\tan \widehat{C}
      = \frac{AB}{AC}$. Le produit vaut $1$.'
  - numero: 29
    etoiles: 3
    enonce: Repère orthonormal, $A\left(-1 ; 2\right)$, $B\left(3 ; 0\right)$ et $C\left(5 ; 4\right)$.
      Précise la nature exacte du triangle $ABC$, puis calcule son aire.
    correction: 'Seul outil disponible : la distance, et ce sont les carrés qui se comparent. $AB^{2}
      = 20$, $BC^{2} = 20$, $AC^{2} = 40$. Donc $AB = BC$ et $AB^{2} + BC^{2} = AC^{2}$ : rectangle et
      isocèle en $B$. Aire $= \frac{\sqrt{20} \times \sqrt{20}}{2} = 10$.'
  - numero: 30
    etoiles: 3
    enonce: $ABC$ a pour côtés $AB = 15$, $AC = 20$ et $BC = 25$. **a)** Démontre qu'il est rectangle,
      en précisant l'énoncé utilisé. **b)** Calcule la distance de $A$ à $\left(BC\right)$. **c)** $H$
      étant le pied de la hauteur issue de $A$, calcule $BH$ et $CH$.
    correction: 'Une hauteur ne se calcule commodément qu''une fois l''angle droit connu, d''où l''ordre
      des questions ; ensuite l''aire calculée de deux façons est le chemin le plus court. a) $25^{2}
      = 625 = 225 + 400$ : rectangle en $A$ par la **réciproque**. b) $\frac{15 \times 20}{2} = 150 =
      \frac{25 \times AH}{2}$, donc $AH = 12$. c) $BH^{2} = 225 - 144 = 81$, $BH = 9$ ; $CH^{2} = 400
      - 144 = 256$, $CH = 16$ ; contrôle : $9 + 16 = 25$.'
  - numero: 31
    etoiles: 3
    enonce: Un triangle a pour côtés $3x$, $4x$ et $5x$, avec $x > 0$. Démontre qu'il est rectangle, quelle
      que soit la valeur de $x$.
    correction: 'Rien n''est mesurable : on travaille sur les expressions littérales. Comme $x > 0$, le
      plus grand côté est $5x$. Or $\left(5x\right)^{2} = 25x^{2}$ et $\left(3x\right)^{2} + \left(4x\right)^{2}
      = 9x^{2} + 16x^{2} = 25x^{2}$. Égalité pour tout $x > 0$ : rectangle, angle droit opposé à $5x$.'
  - numero: 32
    etoiles: 3
    enonce: 'Vrai ou faux ? Justifie par une démonstration ou par un contre-exemple.

      **a)** Si un triangle a pour côtés $5$, $12$ et $13$, l''angle droit est opposé au côté de longueur
      $13$.

      **b)** Le sinus d''un angle aigu peut valoir $1{,}25$.

      **c)** Si l''on double le côté d''un carré, sa diagonale double aussi.

      **d)** Si un angle aigu double, son sinus double aussi.'
    correction: 'Un contre-exemple suffit à démolir une affirmation ; aucun exemple ne suffit à en prouver
      une. a) **Vrai** : $13^{2} = 169 = 25 + 144$, réciproque. b) **Faux** : l''hypoténuse est le plus
      grand côté, donc $\sin < 1$. c) **Vrai** : $d = c\sqrt{2}$, donc $2c$ donne $2c\sqrt{2}$. d) **Faux**
      : $\sin 30° = 0{,}5$ mais $\sin 60° \approx 0{,}866$, et non $1$.'
  - numero: 33
    etoiles: 3
    enonce: $ABC$ est équilatéral de côté $2$, et $H$ est le milieu de $\left[BC\right]$. **a)** Justifie
      que $\left(AH\right)$ est perpendiculaire à $\left(BC\right)$, puis calcule $AH$. **b)** Déduis-en
      les valeurs exactes de $\cos 60°$, $\sin 60°$ et $\tan 60°$.
    correction: 'Il faut une figure où $60°$ apparaisse naturellement : le triangle équilatéral, coupé
      par sa hauteur. a) $ABC$ isocèle en $A$ et $H$ milieu de $\left[BC\right]$ : la médiane est aussi
      hauteur, donc $\left(AH\right) \perp \left(BC\right)$. Dans $ABH$ rectangle en $H$, $AH^{2} = 4
      - 1 = 3$, donc $AH = \sqrt{3}$. b) $\widehat{B} = 60°$ : $\cos 60° = \frac{1}{2}$, $\sin 60° = \frac{\sqrt{3}}{2}$,
      $\tan 60° = \sqrt{3}$.'
  - numero: 34
    etoiles: 3
    enonce: $\widehat{A}$ est aigu et $\tan \widehat{A} = 3$. **a)** Propose un triangle rectangle où
      cet angle apparaît, et calcule son hypoténuse. **b)** Déduis-en $\cos \widehat{A}$ et $\sin \widehat{A}$
      en valeurs exactes.
    correction: 'Les rapports ne dépendent pas de la taille : un seul triangle commode suffit. a) $\tan
      \widehat{A} = \frac{3}{1}$ : opposé $3$, adjacent $1$, hypoténuse $\sqrt{10}$. b) $\cos \widehat{A}
      = \frac{\sqrt{10}}{10}$ et $\sin \widehat{A} = \frac{3\sqrt{10}}{10}$ ; contrôle : $\frac{10 + 90}{100}
      = 1$.'
  - numero: 35
    etoiles: 3
    enonce: À Sindou, depuis un point $A$ du sol, un guide voit le sommet d'une falaise sous $45°$ ; il
      recule de $20$ m jusqu'en $B$, d'où il le voit sous $30°$. On note $h$ la hauteur et $d$ la distance
      de $A$ au pied. **a)** Justifie que $h = d$. **b)** Justifie que $h = \left(d + 20\right) \times
      \tan 30°$. **c)** Calcule $h$ au dixième, en prenant $\tan 30° \approx 0{,}577$.
    correction: 'Deux visées, deux triangles qui partagent la même hauteur : on l''exprime deux fois,
      puis on égale. a) $\tan 45° = \frac{h}{d} = 1$, donc $h = d$. b) Depuis $B$, la distance au pied
      vaut $d + 20$, d''où $h = \left(d + 20\right) \tan 30°$. c) $h = \left(h + 20\right) \times 0{,}577$,
      donc $0{,}423h = 11{,}54$ et $h \approx 27{,}3$ m.'
  - numero: 36
    etoiles: 3
    enonce: 'Voici la copie de Boukary. Énoncé : « $ABC$ est rectangle en $A$, $AB = 9$ et $AC = 12$ ;
      $H$ est le pied de la hauteur issue de $A$. Calculer $BC$, $\cos \widehat{B}$, $\sin \widehat{B}$,
      puis $AH$. »


      > Ligne 1 : $BC^{2} = 81 + 144 = 225$, donc $BC = 15$.

      > Ligne 2 : $\cos \widehat{B} = \frac{AC}{BC} = \frac{12}{15} = 0{,}8$.

      > Ligne 3 : $\sin \widehat{B} = 1 - 0{,}8 = 0{,}2$.

      > Ligne 4 : $AH = AB \times \sin \widehat{B} = 9 \times 0{,}2 = 1{,}8$.


      Deux lignes sont fausses. Repère-les, explique, refais le calcul et contrôle le résultat final par
      une seconde méthode.'
    correction: 'On lit la copie ligne à ligne et l''on s''arrête à la première qui ne se justifie pas.
      Ligne 1 correcte. **Ligne 2 fausse** : l''adjacent à $\widehat{B}$ est $\left[AB\right]$, donc $\cos
      \widehat{B} = \frac{9}{15} = 0{,}6$ ; $0{,}8$ est $\sin \widehat{B}$. **Ligne 3 fausse** : la relation
      porte sur les carrés, $\sin^{2} \widehat{B} = 1 - 0{,}36 = 0{,}64$, donc $\sin \widehat{B} = 0{,}8$.
      Reprise : $AH = 9 \times 0{,}8 = 7{,}2$. Contrôle par l''aire : $\frac{9 \times 12}{2} = 54 = \frac{15
      \times AH}{2}$, donc $AH = 7{,}2$.'
  fiche_revision:
  - '**Pythagore.** Rectangle en $A$ : $BC^{2} = AB^{2} + AC^{2}$. L''hypoténuse, seule à gauche, est
    le plus long côté.'
  - '**Réciproque.** Si $BC^{2} = AB^{2} + AC^{2}$, alors rectangle en $A$. Deux calculs séparés, puis
    comparaison.'
  - '**Distance.** $AB = \sqrt{\left(x_{B} - x_{A}\right)^{2} + \left(y_{B} - y_{A}\right)^{2}}$, en repère
    orthonormal.'
  - '**Les trois rapports.** Par rapport à un angle aigu : $\cos = \frac{\text{adj}}{\text{hyp}}$, $\sin
    = \frac{\text{opp}}{\text{hyp}}$, $\tan = \frac{\text{opp}}{\text{adj}}$.'
  - '**Les deux relations.** $\cos^{2} x + \sin^{2} x = 1$ et $\tan x = \frac{\sin x}{\cos x}$. La première
    donne un carré.'
  - '**Valeurs remarquables.** $\sin 30° = \cos 60° = \frac{1}{2}$ ; $\cos 30° = \sin 60° = \frac{\sqrt{3}}{2}$
    ; $\cos 45° = \sin 45° = \frac{\sqrt{2}}{2}$ ; $\tan 30° = \frac{\sqrt{3}}{3}$, $\tan 45° = 1$, $\tan
    60° = \sqrt{3}$.'
  - '**Applications.** Hauteur $=$ distance $\times \tan \left(\text{angle de visée}\right)$. Pente :
    sinus le long de la pente, tangente à l''horizontale.'
  trouve_erreur:
  - faux: 'Rectangle en $A$, $BC = 13$, $AB = 5$ : « $AC^{2} = 13^{2} + 5^{2}$ »'
    correction: '$\left[BC\right]$ est l''hypoténuse : $AC^{2} = 169 - 25 = 144$, donc $AC = 12$.'
  - faux: « Le triangle de côtés $6$, $8$, $10$ est rectangle, d'après le théorème de Pythagore. »
    correction: 'On part des longueurs pour arriver à l''angle droit : c''est la **réciproque**.'
  - faux: 'Rectangle en $A$, $AB = 5$, $AC = 12$, $BC = 13$ : « $\cos \widehat{B} = \frac{12}{13}$ »'
    correction: 'L''adjacent à $\widehat{B}$ est $\left[AB\right]$ : $\cos \widehat{B} = \frac{5}{13}$,
      et $\frac{12}{13} = \sin \widehat{B}$.'
  - faux: « $\sin^{2} x = 0{,}36$, donc $\sin x = 0{,}36$ »
    correction: 'La relation donne le **carré** : $\sin x = 0{,}6$.'
  cartographie_lacunes:
  - lacune: Pythagore et trigonométrie mal reliés au triangle rectangle
    bloque_en: produit scalaire, fonctions circulaires
  source_path: remediation\2ndeC\modules_c\M09.md
- niveau: 2ndeC
  module: 10
  module_titre: Cercle, angles inscrits et isométries
  pourquoi: On tranche la position d'une droite au dessin au lieu de comparer $d$ et $R$, et on applique
    la relation angle inscrit / angle au centre à l'envers. Tu connais ces règles, c'est leur application
    qui dérape.
  diagnostic:
  - question: 'Cercle de rayon $5$ cm, droite à $7$ cm du centre : combien de points communs ?'
    reponse: aucun, $7 > 5$
  - question: Une droite est tangente en $A$ à un cercle de centre $O$. Quel angle fait-elle avec $\left[OA\right]$
      ?
    reponse: $90^{\circ}$
  - question: $\widehat{AOB} = 140^{\circ}$. Combien mesure l'angle inscrit $\widehat{AMB}$ interceptant
      le même arc ?
    reponse: $70^{\circ}$
  - question: $\left[AB\right]$ est un diamètre et $M$ est sur le cercle, distinct de $A$ et $B$. Nature
      de $AMB$ ?
    reponse: rectangle en $M$
  - question: Un triangle a une aire de $12$ cm$^{2}$. Aire de son image par translation ?
    reponse: $12$ cm$^{2}$, une translation conserve les aires
  lecons:
  - id: 2ndeC_M10_L1
    numero: '10.1'
    titre: 'Droite et cercle : deux nombres à comparer'
    retenir:
    - '$d < R$ : **sécante**, deux points communs.'
    - '$d = R$ : **tangente** en $H$, un seul point commun.'
    - '$d > R$ : **extérieure**, aucun point commun. Jamais trois points.'
    - '**Corde.** Si $\left(d\right)$ coupe le cercle en $A$ et $B$, $H$ est le **milieu** de $\left[AB\right]$
      : $HA^{2} = R^{2} - d^{2}$, puis $AB = 2 \times HA$.'
    methode:
      titre: Position relative d'une droite et d'un cercle
      etapes:
      - Repère $O$ et $R$ ; si l'énoncé donne le diamètre, divise-le par $2$.
      - Détermine $d$, mesurée **perpendiculairement**.
      - 'Compare $d$ et $R$, et cite la comparaison : « $d < R$, donc sécante, deux points ».'
    exemple_resolu: 'Une piste rectiligne passe à $20$ m du centre d''un bosquet circulaire de rayon $25$
      m. Quelle longueur le traverse ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On compare $d$ et $R$. | $20 < 25$ : sécante en $A$ et $B$. |

      | Pythagore dans $OHA$, rectangle en $H$. | $HA^{2} = 25^{2} - 20^{2} = 225$, $HA = 15$ m. |

      | La corde vaut le double. | $AB = 2 \times 15 = 30$ m. |

      | **Vérification :** $15 < 25$. ✓ | |


      [SVG: figures/m10_f1.svg]

      *Figure 10.1 : Les trois positions relatives, décidées par la comparaison de $d$ et $R$.*'
    erreurs_frequentes:
    - erreur: comparer à $R$ la distance de $O$ à un point **quelconque** de la droite.
      correction: seule $OH$, perpendiculaire, se compare à $R$.
    - erreur: « $d = R$, donc deux points ».
      correction: cas limite, un seul point, tangente.
    declic: 'Si la corde te résiste, ce n''est pas le cercle qui bloque — Passer de $HA^{2} = 225$ à $HA
      = 15$ demande deux gestes : Pythagore dans le bon sens, reconnaître un carré parfait. Si l''un des
      deux te fait hésiter, reprends le module 9 puis le module 2.'
    figures:
    - figures/m10_f1.svg
  - id: 2ndeC_M10_L2
    numero: '10.2'
    titre: 'La tangente : un angle droit offert'
    retenir:
    - La **tangente** en $A$ n'a que $A$ en commun avec le cercle ; $A$ est le **point de contact**. Il
      n'en passe qu'**une** par point du cercle.
    - '**Propriété.** Elle est perpendiculaire au rayon $\left[OA\right]$ **au point de contact**.'
    - '**Réciproque.** Une droite passant par $A$ du cercle et perpendiculaire à $\left(OA\right)$ en
      $A$ est tangente en $A$ : c''est elle qui **démontre** une tangence.'
    - '**Depuis $I$ extérieur :** deux tangentes, de contacts $A$ et $B$ ; $OAI$ **rectangle en $A$**,
      donc $OI^{2} = OA^{2} + IA^{2}$ ; $IA = IB$ et $\left(OI\right)$ médiatrice de $\left[AB\right]$.'
    methode:
      titre: Démontrer qu'une droite est tangente à un cercle
      etapes:
      - 'Vérifie que la droite passe par un point $A$ **du cercle** : $OA = R$.'
      - Établis l'angle droit en $A$ (réciproque de Pythagore, ou perpendicularité connue).
      - 'Conclus par la réciproque : tangente en $A$.'
      - Si l'énoncé donne la distance du centre à la droite, vérifie qu'elle vaut $R$.
    exemple_resolu: 'Un tas de coton circulaire a $10$ m de rayon. Depuis un piquet $I$ à $26$ m du centre,
      on tend deux cordes qui l''effleurent. Quelle longueur de corde ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Tangente : angle droit au contact. | $OAI$ rectangle en $A$, hypoténuse $\left[OI\right]$. |

      | Pythagore dans le sens qui isole $IA$. | $IA^{2} = 26^{2} - 10^{2} = 576$, $IA = 24$ m. |

      | Les deux tangentes issues de $I$ sont égales. | $IB = 24$ m, total $48$ m. |

      | **Vérification :** $10^{2} + 24^{2} = 26^{2}$. ✓ | |'
    erreurs_frequentes:
    - erreur: la tangente perpendiculaire à tous les rayons.
      correction: au seul rayon du **point de contact**.
    - erreur: $IA^{2} = OI^{2} + OA^{2}$.
      correction: l'hypoténuse est $\left[OI\right]$, donc $IA^{2} = OI^{2} - OA^{2}$.
    declic: null
    figures: []
  - id: 2ndeC_M10_L3
    numero: '10.3'
    titre: Angle inscrit, demi-cercle et cocyclicité
    retenir:
    - 'Un **angle inscrit** a son sommet **sur** le cercle ; un **angle au centre**, **en $O$**. L''**arc
      intercepté** est la portion comprise entre les côtés : deux angles ne se comparent que sur le **même**
      arc.'
    - '**Propriété.** $\widehat{AOB} = 2 \times \widehat{AMB}$, soit $\widehat{AMB} = \frac{\widehat{AOB}}{2}$.'
    - '**Demi-cercle.** Un côté diamètre donne un triangle **rectangle** au sommet opposé. **Réciproque
      :** le centre du cercle circonscrit d''un triangle rectangle est le **milieu de l''hypoténuse**.'
    - 'Même arc, sommets **du même côté** de $\left[AB\right]$ : angles **égaux** ; **de part et d''autre**
      : angles **supplémentaires**.'
    - '**Cocyclicité.** Si $D$ est du même côté de $\left[AB\right]$ que $C$ et $\widehat{ADB} = \widehat{ACB}$,
      alors $A$, $B$, $C$, $D$ sont cocycliques.'
    methode:
      titre: Calculer ou comparer un angle dans un cercle
      etapes:
      - Repère les deux points d'appui et colorie l'arc intercepté.
      - 'Situe le sommet : en $O$, angle au centre ; sur le cercle, angle inscrit.'
      - Vérifie que les angles comparés interceptent le **même** arc, sommets du même côté de la corde.
      - 'Applique dans le bon sens : du centre vers l''inscrit on **divise** par $2$, en sens inverse
        on **multiplie** par $2$.'
    exemple_resolu: '$\widehat{AOB} = 140^{\circ}$ et $M$ est sur le grand arc. Calculer $\widehat{AMB}$,
      puis $\widehat{OAB}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $\widehat{AMB}$ est inscrit, même arc. | $\widehat{AMB} = \frac{140}{2} = 70^{\circ}$. |

      | $OA = OB = R$ : $OAB$ isocèle en $O$. | $\widehat{OAB} = \widehat{OBA}$. |

      | Somme des angles $= 180^{\circ}$. | $\widehat{OAB} = \frac{180 - 140}{2} = 20^{\circ}$. |

      | **Vérification :** $2 \times 70 = 140$. ✓ | |


      [SVG: figures/m10_f4.svg]

      *Figure 10.4 : L''angle au centre vaut le double de l''angle inscrit sur le même arc.*'
    erreurs_frequentes:
    - erreur: $\widehat{AOB} = \frac{\widehat{AMB}}{2}$.
      correction: c'est l'angle **au centre** qui est le double.
    - erreur: « même cercle, donc angles égaux ».
      correction: la justification cite l'arc intercepté, donc le côté de la corde.
    declic: null
    figures:
    - figures/m10_f4.svg
  - id: 2ndeC_M10_L4
    numero: '10.4'
    titre: 'Les isométries : images et propriétés conservées'
    retenir:
    - '**Symétrie centrale de centre $O$** : $O$ est le **milieu** de $\left[AA''\right]$. Seul $O$ invariant.'
    - '**Symétrie orthogonale d''axe $\left(d\right)$** : $\left(d\right)$ est la **médiatrice** de $\left[AA''\right]$.
      Points de $\left(d\right)$ invariants.'
    - '**Translation de vecteur $\vec{u}$** : $\overrightarrow{AA''} = \vec{u}$. Aucun point invariant
      si $\vec{u} \neq \vec{0}$.'
    - '**Rotation de centre $O$, d''angle $\alpha$** : $OA'' = OA$ et $\widehat{AOA''} = \alpha$. Seul
      $O$ invariant.'
    - Un agrandissement de rapport différent de $1$ n'est **pas** une isométrie.
    methode:
      titre: Justifier une égalité à l'aide d'une isométrie
      etapes:
      - Identifie la figure de départ, la figure image et l'isométrie qui les relie.
      - 'Repère la grandeur en jeu : longueur, angle, aire, alignement, parallélisme.'
      - 'Écris la phrase complète : « la translation de vecteur $\vec{u}$ est une isométrie, **or** une
        isométrie conserve les angles, **donc** … », puis conclus.'
    exemple_resolu: 'Repère orthonormal d''unité $10$ m, bornes $A\left(2\,;\,3\right)$ et $B\left(5\,;\,7\right)$.
      Un report déplace $A$ en $A''\left(6\,;\,6\right)$, toutes les bornes subissant le même glissement.
      Grillage entre les nouvelles bornes ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Même glissement : translation, on lit son vecteur. | $\vec{u}\left(4\,;\,3\right)$, donc $B''\left(9\,;\,10\right)$.
      |

      | Une translation conserve les distances. | $A''B'' = AB = \sqrt{3^{2} + 4^{2}} = 5$ unités. |

      | On revient à l''échelle. | $5 \times 10 = 50$ m. |

      | **Vérification :** $\sqrt{3^{2} + 4^{2}} = 5$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\overrightarrow{A'A}$ au lieu de $\overrightarrow{AA'}$.
      correction: la flèche va **du point vers son image**.
    - erreur: d'une égalité d'aires conclure que deux figures sont images l'une de l'autre.
      correction: $60 \times 40$ et $80 \times 30$ ont la même aire sans être superposables.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Cercle de rayon $4$ cm. Donne la position relative avec une droite située à : a) $2$ cm ;
      b) $4$ cm ; c) $6$ cm du centre.'
    correction: 'a) $2 < 4$ : sécante, $2$ points. b) $4 = 4$ : tangente, $1$ point. c) $6 > 4$ : extérieure,
      $0$ point.'
  - numero: 2
    etoiles: 1
    enonce: Cercle de diamètre $10$ cm, droite à $4$ cm du centre. Position relative ?
    correction: '$R = 5$ et $d = 4 < 5$ : **sécante**, deux points.'
  - numero: 3
    etoiles: 1
    enonce: Cercle de rayon $13$ cm, droite à $5$ cm du centre. a) Combien de points communs ? b) Calcule
      la longueur de la corde.
    correction: 'a) $5 < 13$ : sécante. b) $HA^{2} = 169 - 25 = 144$, $HA = 12$, donc $AB = 24$ cm.'
  - numero: 4
    etoiles: 1
    enonce: Une droite est tangente à un cercle de rayon $3$ cm. Distance du centre à cette droite ?
    correction: '$d = R = 3$ cm : la tangence est le cas d''égalité.'
  - numero: 5
    etoiles: 1
    enonce: Une droite est tangente en $A$ à un cercle de centre $O$, de rayon $8$ cm. Un point $I$ de
      cette tangente vérifie $IA = 15$ cm. Calcule $OI$.
    correction: '$OAI$ rectangle en $A$ : $OI^{2} = 64 + 225 = 289$, donc $OI = 17$ cm.'
  - numero: 6
    etoiles: 1
    enonce: Trace un cercle de centre $O$ et de rayon $4$ cm, place $A$ sur ce cercle, puis construis
      la tangente en $A$.
    correction: Tracer $\left[OA\right]$, puis la perpendiculaire à $\left(OA\right)$ en $A$.
  - numero: 7
    etoiles: 1
    enonce: Une droite passe par un point $A$ d'un cercle de centre $O$ et est perpendiculaire à $\left(OA\right)$.
      Justifie qu'elle est tangente.
    correction: '$A$ est le projeté orthogonal de $O$, donc $d = OA = R$ : **tangente** en $A$ (réciproque).'
  - numero: 8
    etoiles: 1
    enonce: 'Recopie et complète : si $\widehat{AOB} = 140^{\circ}$, alors $\widehat{AMB} = \ldots$ ;
      si $\widehat{AOB} = 96^{\circ}$, alors $\widehat{AMB} = \ldots$'
    correction: $70^{\circ}$ ; $48^{\circ}$.
  - numero: 9
    etoiles: 1
    enonce: Un angle inscrit mesure $13^{\circ}$, un autre $45^{\circ}$. Donne dans chaque cas la mesure
      de l'angle au centre associé.
    correction: 'On multiplie par $2$ : $26^{\circ}$ et $90^{\circ}$.'
  - numero: 10
    etoiles: 1
    enonce: $ABCD$ est un carré inscrit dans un cercle de centre $O$. Calcule $\widehat{AOB}$, puis $\widehat{ACB}$.
    correction: $\widehat{AOB} = \frac{360}{4} = 90^{\circ}$ ; $\widehat{ACB} = 45^{\circ}$.
  - numero: 11
    etoiles: 1
    enonce: $\left[AB\right]$ est un diamètre, $M$ est sur le cercle et $\widehat{ABM} = 28^{\circ}$.
      Donne les trois angles du triangle $ABM$.
    correction: '$\widehat{AMB} = 90^{\circ}$ (diamètre) : $90^{\circ}$, $28^{\circ}$, $62^{\circ}$.'
  - numero: 12
    etoiles: 1
    enonce: $RST$ est rectangle en $S$ et $RT = 12$ cm. Où est le centre de son cercle circonscrit ? Quel
      rayon ?
    correction: 'Centre : **milieu de $\left[RT\right]$** ; rayon $6$ cm.'
  - numero: 13
    etoiles: 1
    enonce: $\left[AB\right]$ est un diamètre de centre $O$ et $M$ est sur le cercle, avec $\widehat{AOM}
      = 100^{\circ}$. Calcule $\widehat{ABM}$, puis $\widehat{BAM}$.
    correction: $\widehat{ABM} = 50^{\circ}$ ; $\widehat{AMB} = 90^{\circ}$, donc $\widehat{BAM} = 40^{\circ}$.
  - numero: 14
    etoiles: 1
    enonce: $M$, $N$, $P$ sont sur un cercle, du même côté de $\left[AB\right]$. Si $\widehat{AMB} = 28^{\circ}$,
      que valent $\widehat{ANB}$ et $\widehat{APB}$ ?
    correction: 'Même côté, donc même arc : $\widehat{ANB} = \widehat{APB} = 28^{\circ}$.'
  - numero: 15
    etoiles: 1
    enonce: $M$ et $N$ sont sur un cercle, de part et d'autre de $\left[AB\right]$, et $\widehat{AMB}
      = 65^{\circ}$. Que vaut $\widehat{ANB}$ ?
    correction: 'De part et d''autre : supplémentaires, $\widehat{ANB} = 115^{\circ}$.'
  - numero: 16
    etoiles: 1
    enonce: La transformation $M\left(x\,;\,y\right) \mapsto M'\left(x + 3\,;\,y - 2\right)$ est-elle
      une isométrie ? Si oui, de quelle nature ?
    correction: 'Oui : **translation de vecteur $\vec{u}\left(3\,;\,-2\right)$**.'
  - numero: 17
    etoiles: 1
    enonce: Donne l'image de $A\left(3\,;\,2\right)$ par la symétrie de centre $O$, puis d'axe $\left(Ox\right)$,
      puis d'axe $\left(Oy\right)$.
    correction: 'Centre $O$ : $\left(-3\,;\,-2\right)$. Axe $\left(Ox\right)$ : $\left(3\,;\,-2\right)$.
      Axe $\left(Oy\right)$ : $\left(-3\,;\,2\right)$.'
  - numero: 18
    etoiles: 1
    enonce: '$A\left(1\,;\,2\right)$ a pour image $A''\left(5\,;\,0\right)$ par une translation. Quel
      vecteur ? Quelle image pour $B\left(0\,;\,3\right)$ ?


      ### Entraînement ★★


      *Entraînement intensif : dans chaque exercice, écris d''abord la configuration en jeu (tangente,
      angle inscrit, demi-cercle, isométrie), puis la propriété qui conclut.*'
    correction: $\vec{u}\left(4\,;\,-2\right)$, donc $B'\left(4\,;\,1\right)$.
  - numero: 19
    etoiles: 2
    enonce: $ABC$ est rectangle en $B$ et $\left(C\right)$ est le cercle de centre $A$ passant par $B$.
      Démontre que $\left(BC\right)$ est tangente à $\left(C\right)$.
    correction: '$\left[AB\right]$ est un rayon et $\left(BC\right) \perp \left(AB\right)$ en $B$ : par
      la réciproque, **tangente** en $B$.'
  - numero: 20
    etoiles: 2
    enonce: Sur un cercle de centre $O$, un point $M$ voit $\left[AB\right]$ sous un angle de $30^{\circ}$.
      Calcule $\widehat{AOB}$, puis démontre que le triangle $OAB$ est équilatéral.
    correction: '$\widehat{AOB} = 60^{\circ}$ ; $OAB$ isocèle en $O$ : $\frac{180 - 60}{2} = 60^{\circ}$
      à la base, donc **équilatéral**.'
  - numero: 21
    etoiles: 2
    enonce: $\left[AB\right]$ est un diamètre d'un cercle de rayon $5$ cm et $M$ est sur le cercle, avec
      $AM = 6$ cm. Calcule $MB$.
    correction: '$AB = 10$ cm, rectangle en $M$ : $MB^{2} = 100 - 36 = 64$, $MB = 8$ cm.'
  - numero: 22
    etoiles: 2
    enonce: Deux angles inscrits interceptant le même arc mesurent $\left(2x + 10\right)$ degrés et $\left(x
      + 35\right)$ degrés. Détermine $x$, puis leur mesure commune.
    correction: Même arc, donc $2x + 10 = x + 35$, $x = 25$ ; mesure commune $60^{\circ}$.
  - numero: 23
    etoiles: 2
    enonce: À Diapaga, une cible $\left[AB\right]$ est sur un cercle et $\widehat{AOB} = 150^{\circ}$.
      Sous quel angle un archer placé sur le bord, du côté opposé, la voit-il ?
    correction: 'Angle inscrit sur le grand arc : $\frac{150}{2} = 75^{\circ}$.'
  - numero: 24
    etoiles: 2
    enonce: À Dori, une brodeuse répète un motif carré de $6$ cm de côté par translations, le long d'une
      bande de $72$ cm. Combien de motifs place-t-elle ? Ont-ils tous la même aire ? Laquelle ?
    correction: '$\frac{72}{6} = 12$ motifs ; la translation conserve les aires : $36$ cm$^{2}$.'
  - numero: 25
    etoiles: 2
    enonce: 'Trouve l''erreur : « la distance du centre à la droite vaut $6$ cm et le rayon $6$ cm, donc
      la droite coupe le cercle en deux points. » Explique, puis corrige.'
    correction: 'Deux points exigent $d < R$ **strictement**. Ici $d = R = 6$ : **tangente**, un point.'
  - numero: 26
    etoiles: 2
    enonce: 'Trouve l''erreur : « le triangle $AMB$ est inscrit dans un cercle, donc il est rectangle.
      » Explique et donne la condition manquante.'
    correction: 'Insuffisant : il faut qu''un côté soit un **diamètre**. Contre-exemple : triangle équilatéral
      inscrit.'
  - numero: 27
    etoiles: 2
    enonce: '$f : M\left(x\,;\,y\right) \mapsto M''\left(x\,;\,-y\right)$. Calcule les images de $A\left(1\,;\,2\right)$
      et $B\left(4\,;\,6\right)$, compare $AB$ et $A''B''$, puis nomme l''isométrie.'
    correction: '$A''\left(1\,;\,-2\right)$, $B''\left(4\,;\,-6\right)$ ; $AB = A''B'' = 5$ : **symétrie
      d''axe $\left(Ox\right)$**.'
  - numero: 28
    etoiles: 2
    enonce: 'Cercle de centre $O$, rayon $5$ cm ; $\left(d\right)$ le coupe en $A$ et $B$, et le projeté
      orthogonal de $O$ sur $\left(d\right)$ est $H$, avec $OH = 3$ cm. a) Calcule $HA$. b) Déduis-en
      $AB$.


      ### ★★★ Défis de maîtrise'
    correction: 'a) $HA^{2} = 25 - 9 = 16$, $HA = 4$ cm. b) $H$ milieu : $AB = 8$ cm.'
  - numero: 29
    etoiles: 3
    enonce: Cercle de centre $O$ et de rayon $R$, avec $OI = D$ et $D > R$. Exprime en fonction de $R$
      et $D$ la longueur des tangentes issues de $I$, puis vérifie sur $R = 10$, $D = 26$.
    correction: 'La tangence donne l''angle droit en $A$, seule chose qui autorise Pythagore : $D^{2}
      = R^{2} + IA^{2}$, donc $IA = \sqrt{D^{2} - R^{2}}$. La condition $D > R$ rend le radicande positif
      : $I$ est extérieur. Vérification : $\sqrt{676 - 100} = 24$.'
  - numero: 30
    etoiles: 3
    enonce: Une droite sécante à un cercle de centre $O$ y détermine une corde de $24$ cm ; sa distance
      à $O$ vaut $5$ cm. a) Calcule le rayon. b) De combien l'éloigner du centre, sans changer sa direction,
      pour qu'elle devienne tangente ?
    correction: '$H$ est le milieu, donc $HA = 12$ cm. a) $R^{2} = 25 + 144 = 169$, $R = 13$ cm. b) Tangence
      quand $d = R = 13$ : éloigner de $8$ cm.'
  - numero: 31
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une propriété ou un contre-exemple. a) Une droite peut couper
      un cercle en trois points. b) Deux angles inscrits d'un même cercle sont toujours égaux. c) Un triangle
      inscrit dans un cercle est rectangle. d) Une isométrie peut transformer un carré de $4$ cm de côté
      en un carré de $5$ cm de côté.
    correction: 'a) **Faux**, au plus deux points. b) **Faux** : $65^{\circ}$ d''un côté, $115^{\circ}$
      de l''autre. c) **Faux** : triangle équilatéral inscrit. d) **Faux** : rapport $\frac{5}{4}$, les
      longueurs changent.'
  - numero: 32
    etoiles: 3
    enonce: $ABC$ est rectangle en $A$, $AB = 6$ cm, $AC = 8$ cm, et $H$ est le pied de la hauteur issue
      de $A$. a) Calcule $BC$, puis $AH$ en écrivant l'aire de deux façons. b) Le cercle de centre $A$
      et de rayon $AH$ est-il tangent à $\left(BC\right)$ ?
    correction: 'On écrit **deux fois** la même aire. a) $BC = 10$ cm ; $\frac{6 \times 8}{2} = 24 = \frac{10
      \times AH}{2}$, donc $AH = 4{,}8$ cm. b) La distance de $A$ à $\left(BC\right)$ vaut $AH$ = rayon
      : **tangent** en $H$.'
  - numero: 33
    etoiles: 3
    enonce: $\left[AB\right]$ est un diamètre de centre $O$ et $M$ est sur le cercle, avec $\widehat{MAB}
      = 25^{\circ}$. Calcule $\widehat{ABM}$, démontre que $OBM$ est isocèle et donne ses trois angles.
    correction: 'Diamètre, donc rectangle en $M$ et $\widehat{ABM} = 65^{\circ}$. La clé du second point
      est une longueur : $OB = OM = R$, donc $OBM$ **isocèle en $O$** : $\widehat{OBM} = \widehat{OMB}
      = 65^{\circ}$, $\widehat{BOM} = 50^{\circ}$. Contrôle : $2 \times 25 = 50$.'
  - numero: 34
    etoiles: 3
    enonce: On applique à un point la symétrie d'axe $\left(Ox\right)$, puis celle d'axe $\left(Oy\right)$.
      a) Quelle transformation ? Vérifie sur $A\left(3\,;\,5\right)$. b) Et si les deux axes sont parallèles
      et distants de $3$ cm ?
    correction: 'On raisonne sur un point général. a) $\left(x\,;\,y\right) \mapsto \left(x\,;\,-y\right)
      \mapsto \left(-x\,;\,-y\right)$ : **symétrie de centre $O$** ; sur $A\left(3\,;\,5\right)$ : $\left(-3\,;\,-5\right)$.
      b) Axes parallèles : **translation** perpendiculaire aux axes, de longueur double de leur distance
      : $6$ cm.'
  - numero: 35
    etoiles: 3
    enonce: À Loropéni, une plateforme circulaire porte trente repères régulièrement espacés sur son bord.
      Un maçon retient $A$ et $B$ séparés par quatorze intervalles, et veut poser une équerre dont la
      pointe $M$, sur le bord, voit $\left[AB\right]$ sous un angle droit. Son marquage convient-il ?
      Sinon, que changer ?
    correction: 'Convertir d''abord les repères en degrés : $\frac{360}{30} = 12^{\circ}$, donc $\widehat{AOB}
      = 14 \times 12 = 168^{\circ}$ et $\widehat{AMB} = 84^{\circ}$ : pas un angle droit. Il faudrait
      $\widehat{AOB} = 180^{\circ}$, soit $15$ intervalles, $\left[AB\right]$ diamètre. **Le marquage
      ne convient pas : quinze intervalles au lieu de quatorze.**'
  fiche_revision:
  - '**Position relative.** $d < R$ sécante, $2$ points ; $d = R$ tangente, $1$ point ; $d > R$ extérieure,
    $0$ point.'
  - '**Corde.** $H$ milieu : $HA^{2} = R^{2} - d^{2}$ et $AB = 2 \times HA$.'
  - '**Tangente.** Perpendiculaire au rayon au contact ; la réciproque démontre. Depuis $I$ : $OI^{2}
    = R^{2} + IA^{2}$ et $IA = IB$.'
  - '**Angle inscrit.** $\widehat{AOB} = 2 \times \widehat{AMB}$ pour le **même arc**. Le centre voit
    plus grand.'
  - '**Demi-cercle.** Côté diamètre : angle droit au sommet opposé ; cercle circonscrit d''un triangle
    rectangle : centre au milieu de l''hypoténuse.'
  - '**Même arc.** Même côté : angles égaux, points cocycliques ; de part et d''autre : supplémentaires.'
  - '**Isométries.** Symétrie centrale, symétrie orthogonale, translation, rotation : conservent longueurs,
    angles, aires, alignement, milieux.'
  - '**Composition.** Axes parallèles : translation ; axes sécants : rotation ; deux translations : vecteur
    somme.'
  trouve_erreur:
  - faux: « $d = 7$ cm et $R = 7$ cm, donc deux points communs. »
    correction: '$d = R$ : **tangente**, un point. Deux points exigent $d < R$.'
  - faux: « La tangente en $A$ est perpendiculaire à tous les rayons. »
    correction: Seulement au rayon $\left[OA\right]$, celui du **point de contact**.
  - faux: « $\widehat{AMB} = 40^{\circ}$, donc $\widehat{AOB} = 20^{\circ}$. »
    correction: 'Facteur à l''envers : $\widehat{AOB} = 2 \times 40 = 80^{\circ}$.'
  - faux: « $M$, $A$, $B$ sont sur le cercle, donc $AMB$ est rectangle en $M$. »
    correction: Il faut que $\left[AB\right]$ soit un **diamètre**.
  cartographie_lacunes:
  - lacune: Angles inscrits, tangentes et isométries flous
    bloque_en: géométrie plane, transformations
  source_path: remediation\2ndeC\modules_c\M10.md
- niveau: 2ndeC
  module: 11
  module_titre: Aires, volumes et sections de solides
  pourquoi: 'Les formules de mesure ne s''oublient pas, elles se mélangent : diamètre pour rayon, hauteur
    pour génératrice, division par trois oubliée. S''y ajoute l''erreur reine de l''espace : croire qu''une
    longueur réduite de moitié réduit l''aire de moitié.'
  diagnostic:
  - question: Aire d'un trapèze de bases $9$ cm et $5$ cm et de hauteur $4$ cm.
    reponse: $\frac{\left(9 + 5\right) \times 4}{2} = 28$ cm$^{2}$
  - question: Volume d'un cône de rayon $3$ cm et de hauteur $7$ cm.
    reponse: $\frac{3{,}14 \times 9 \times 7}{3} = 65{,}94$ cm$^{3}$
  - question: Combien de litres dans $1$ m$^{3}$ ? Combien de cm$^{3}$ dans $1$ litre ?
    reponse: $1$ m$^{3} = 1\,000$ L ; $1$ L $= 1\,000$ cm$^{3}$
  - question: Section d'un cylindre par un plan parallèle à sa base ? Par un plan contenant son axe ?
    reponse: un cercle de même rayon que la base ; un rectangle
  - question: Une pyramide de hauteur $12$ cm est coupée à $3$ cm du sommet, parallèlement à la base.
      Coefficient $k$ ? Par combien l'aire de la section est-elle divisée ?
    reponse: $k = \frac{1}{4}$, aire divisée par $k^{2}$, donc par $16$
  lecons:
  - id: 2ndeC_M11_L1
    numero: '11.1'
    titre: 'Aires : figures planes, aires latérales, aires totales'
    retenir:
    - Triangle $\frac{b h}{2}$ ; parallélogramme $b h$ ; losange $\frac{D d}{2}$ ; trapèze $\frac{\left(B
      + b\right) h}{2}$ ; disque $\pi r^{2}$, cercle $2\pi r$.
    - 'La hauteur est **perpendiculaire à la base**, jamais le côté oblique. Aires : de cent en cent,
      $1$ m$^{2} = 10\,000$ cm$^{2}$.'
    - 'Prisme droit et cylindre : $\mathcal{A}_{\text{lat}} = \mathcal{P}_{\text{base}} \times h$, soit
      $2\pi r h$ pour le cylindre.'
    - 'Pyramide régulière : $\frac{\mathcal{P}_{\text{base}} \times a}{2}$, où l''apothème $a$ est la
      hauteur d''une **face**. Cône : $\pi r g$. Sphère : $4\pi R^{2}$.'
    - 'Aire totale $=$ latérale $+$ bases : deux si le solide est droit, une s''il est pointu.'
    - $g^{2} = r^{2} + h^{2}$ et $a^{2} = h^{2} + \left(\frac{c}{2}\right)^{2}$.
    methode:
      titre: Calculer une aire latérale ou totale
      etapes:
      - 'Repère les données : rayon ou diamètre, hauteur, génératrice, apothème.'
      - Si l'oblique manque, extrais le triangle rectangle et applique Pythagore.
      - Applique la formule, tout dans la même unité.
      - 'Aire totale : ajoute une base si le solide est pointu, deux s''il est droit.'
    exemple_resolu: 'Cône de rayon $6$ cm, hauteur $8$ cm : aire latérale, puis aire totale.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Génératrice manquante : Pythagore. | $g^{2} = 6^{2} + 8^{2} = 100$, donc $g = 10$ cm |

      | Aire latérale, avec $g$, non $h$. | $\mathcal{A}_{\text{lat}} = 3{,}14 \times 6 \times 10 = 188{,}4$
      cm$^{2}$ |

      | Une seule base : ajouter le disque. | $113{,}04 + 188{,}4 = 301{,}44$ cm$^{2}$ |

      | **Vérification :** $g$ dépasse $r$ et $h$, comme toute hypoténuse. ✓ | |'
    erreurs_frequentes:
    - erreur: $\mathcal{A}_{\text{lat}} = \pi r h$ pour un cône.
      correction: 'l''aire latérale utilise la **génératrice** : $\pi r g$, avec $g^{2} = r^{2} + h^{2}$.'
    - erreur: prendre la hauteur de la pyramide pour apothème.
      correction: l'apothème est la hauteur d'une face, plus longue.
    declic: null
    figures: []
  - id: 2ndeC_M11_L2
    numero: '11.2'
    titre: Volumes et unités
    retenir:
    - 'Solides droits (pavé, cube, prisme, cylindre) : $V = \mathcal{A}_{\text{base}} \times h$, soit
      $L \times l \times h$, $c^{3}$, $\pi r^{2} h$.'
    - 'Solides pointus (pyramide, cône) : le tiers du droit de même base et même hauteur, $V = \frac{\mathcal{A}_{\text{base}}
      \times h}{3}$, soit $\frac{\pi r^{2} h}{3}$.'
    - 'Boule : $V = \frac{4 \pi R^{3}}{3}$. Deux $R$ pour l''aire de la sphère, trois pour le volume de
      la boule.'
    - $h$ est la hauteur, jamais la génératrice, l'apothème ou une arête latérale.
    - 'Volumes : de mille en mille. $1$ m$^{3} = 1\,000$ dm$^{3}$ ; $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$
      ; $1$ m$^{3} = 1\,000$ L.'
    - 'Un solide composé se découpe en solides usuels : on additionne ou on soustrait.'
    methode:
      titre: Volume d'un solide composé, puis conversion
      etapes:
      - Découpe en solides usuels, croquis coté de chacun.
      - Calcule chaque volume, dans la même unité partout.
      - Additionne, ou soustrais si une partie est creuse ou retirée.
      - Convertis par le pivot $1$ dm$^{3} = 1$ L, ou $1$ m$^{3} = 1\,000$ L.
    exemple_resolu: 'À Bama, un silo est un cylindre de $2$ m de rayon et $5$ m de hauteur, surmonté d''un
      toit conique de même base et de $3$ m de hauteur. Capacité en m$^{3}$, puis en litres ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Cylindre : base $\times$ hauteur. | $V_{1} = 3{,}14 \times 2^{2} \times 5 = 62{,}8$ m$^{3}$ |

      | Cône de même base : le tiers. | $V_{2} = \frac{3{,}14 \times 4 \times 3}{3} = 12{,}56$ m$^{3}$
      |

      | On additionne, puis on convertit. | $V = 75{,}36$ m$^{3} = 75\,360$ L |

      | **Vérification :** le cône, bas et réduit au tiers, pèse peu. ✓ | |'
    erreurs_frequentes:
    - erreur: oublier de diviser par $3$ pour une pyramide ou un cône.
      correction: un solide pointu contient le tiers du droit de même base et même hauteur.
    - erreur: convertir un volume de dix en dix.
      correction: de mille en mille ; $1$ L $= 1\,000$ cm$^{3}$, et non $100$.
    declic: 'quand les conversions de volume résistent — Si tu écris $1$ m$^{3} = 100$ dm$^{3}$, le blocage
      tient aux dimensions : un mètre vaut dix décimètres, donc un mètre cube vaut $10 \times 10 \times
      10$ décimètres cubes. Reprends le module sur les puissances entières.'
    figures: []
  - id: 2ndeC_M11_L3
    numero: '11.3'
    titre: 'Sections planes : nommer la figure avant de calculer'
    retenir:
    - '**Pavé et prisme droits.** Plan parallèle à la base : polygone **identique** à la base ; parallèle
      à une arête latérale : **rectangle**.'
    - '**Cylindre.** Parallèle à la base : **cercle de même rayon** ; parallèle à l''axe : **rectangle**,
      de largeur $2r$ si le plan contient l''axe.'
    - '**Pyramide et cône.** Parallèle à la base : **réduction** de la base, même forme, dimensions $\times\,
      k$ avec $0 < k < 1$.'
    - '**Sphère.** Toute section est un **cercle** : $r^{2} = R^{2} - d^{2}$, $d$ distance du plan au
      centre. Si $d = 0$, **grand cercle** de rayon $R$.'
    methode:
      titre: Nature et dimensions d'une section
      etapes:
      - Identifie le solide, puis la **direction** du plan de coupe.
      - Nomme la figure par la règle, avant tout calcul.
      - 'Dimensions : identiques si le solide est droit, réduites de $k$ s''il est pointu, par Pythagore
        pour une sphère.'
      - Dessine la section à plat et code-la.
    exemple_resolu: 'À Garango, une citerne sphérique de $13$ dm de rayon est coupée par le sol, à $5$
      dm du centre. Rayon du cercle visible ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Toute section d''une sphère est un cercle. | Section : un cercle. |

      | $OHM$ rectangle en $H$, car $\left(OH\right) \perp$ plan. | $169 = 25 + r^{2}$ |

      | On isole, puis racine carrée. | $r^{2} = 144$, donc $r = 12$ dm |

      | **Vérification :** $12 < 13$, jamais plus qu''un grand cercle. ✓ | |'
    erreurs_frequentes:
    - erreur: annoncer un cercle pour la coupe d'un cylindre parallèle à l'axe.
      correction: c'est un **rectangle** ; le cercle vient du plan parallèle à la **base**.
    - erreur: donner à la section d'une pyramide les dimensions de la base.
      correction: 'la forme est conservée, la taille non : calcule $k$.'
    declic: null
    figures:
    - figures/m11_f4.svg
  - id: 2ndeC_M11_L4
    numero: '11.4'
    titre: 'Le coefficient de réduction : longueurs, aires, volumes'
    retenir:
    - 'Le plan de coupe rencontre la hauteur $\left[SI\right]$ en $K$ : $k = \frac{SK}{SI}$.'
    - '**Ce rapport se lit depuis le sommet.** Si la distance $h$ est donnée **depuis la base** et la
      hauteur vaut $H$, alors $k = \frac{H - h}{H}$.'
    - '**Longueurs** $\times\, k$ : côté, rayon, périmètre, apothème, génératrice.'
    - '**Aires** $\times\, k^{2}$ : section, aire latérale, aire totale. **Volumes** $\times\, k^{3}$.'
    - 'Entre la base et la section, il reste un **tronc** : $V_{\text{tronc}} = V - k^{3} V$.'
    methode:
      titre: Appliquer un coefficient de réduction
      etapes:
      - Vérifie que le plan de coupe est bien **parallèle** à la base.
      - Dessine à plat le triangle sommet-base coupé par une parallèle.
      - Calcule $k$ avec les deux longueurs mesurées **depuis le sommet**, puis simplifie.
      - 'Multiplie par $k$, $k^{2}$ ou $k^{3}$ : longueur, aire ou volume.'
    exemple_resolu: 'Pyramide à base carrée de $9$ cm de côté, hauteur $SI = 16$ cm, coupée à $SK = 4$
      cm du sommet. Côté de la section, puis son aire ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On compare les distances au sommet. | $k = \frac{4}{16} = \frac{1}{4}$ |

      | Longueur : $\times\, k$. | côté $= 9 \times \frac{1}{4} = 2{,}25$ cm |

      | Aire : $\times\, k^{2}$, pas $k$. | $\mathcal{A} = 81 \times \frac{1}{16} = 5{,}0625$ cm$^{2}$
      |

      | **Vérification :** $2{,}25^{2} = 5{,}0625$ cm$^{2}$. ✓ | |'
    erreurs_frequentes:
    - erreur: calculer $k$ depuis la base.
      correction: 'pyramide de $20$ cm coupée à $5$ cm du sommet : $k = \frac{5}{20}$, non $\frac{15}{20}$.'
    - erreur: avec $k = \frac{1}{2}$, annoncer une aire moitié moindre.
      correction: aires $\times\, k^{2} = \frac{1}{4}$, volumes $\times\, k^{3} = \frac{1}{8}$.
    declic: null
    figures:
    - figures/m11_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Aire d'un triangle de base $8$ cm et de hauteur $5$ cm, puis d'un parallélogramme de base
      $12$ cm et hauteur $4{,}5$ cm.
    correction: $20$ cm$^{2}$ ; $54$ cm$^{2}$ (pas de division par deux).
  - numero: 2
    etoiles: 1
    enonce: Aire d'un trapèze de bases $9$ cm et $5$ cm, hauteur $4$ cm, puis d'un losange de diagonales
      $8$ cm et $14$ cm.
    correction: $\frac{14 \times 4}{2} = 28$ cm$^{2}$ ; $\frac{8 \times 14}{2} = 56$ cm$^{2}$.
  - numero: 3
    etoiles: 1
    enonce: Périmètre, puis aire d'un disque de rayon $10$ cm.
    correction: $\mathcal{P} = 62{,}8$ cm ; $\mathcal{A} = 314$ cm$^{2}$.
  - numero: 4
    etoiles: 1
    enonce: 'Cône de génératrice $13$ cm et de rayon $5$ cm : hauteur, puis aire latérale.'
    correction: $h^{2} = 144$, $h = 12$ cm ; $\mathcal{A}_{\text{lat}} = 3{,}14 \times 5 \times 13 = 204{,}1$
      cm$^{2}$.
  - numero: 5
    etoiles: 1
    enonce: 'Cône de génératrice $25$ cm et de hauteur $24$ cm : rayon de la base, puis aire totale.'
    correction: $r^{2} = 49$, $r = 7$ cm ; $\mathcal{A}_{\text{tot}} = 549{,}5 + 153{,}86 = 703{,}36$
      cm$^{2}$ (une seule base).
  - numero: 6
    etoiles: 1
    enonce: 'Cylindre de rayon $4$ cm et de hauteur $9$ cm : aire latérale, puis aire totale.'
    correction: '$\mathcal{A}_{\text{lat}} = 226{,}08$ cm$^{2}$ ; deux bases de $50{,}24$ cm$^{2}$ : $\mathcal{A}_{\text{tot}}
      = 326{,}56$ cm$^{2}$.'
  - numero: 7
    etoiles: 1
    enonce: Volume d'un cube d'arête $3$ cm, puis d'un pavé droit de $5$ cm $\times 3$ cm $\times 2$ cm.
    correction: $27$ cm$^{3}$ ; $30$ cm$^{3}$.
  - numero: 8
    etoiles: 1
    enonce: Volume d'un cylindre de rayon $5$ cm et de hauteur $10$ cm.
    correction: Base $78{,}5$ cm$^{2}$, donc $V = 785$ cm$^{3}$.
  - numero: 9
    etoiles: 1
    enonce: Volume d'un cône de rayon $3$ cm et de hauteur $7$ cm.
    correction: $V = \frac{28{,}26 \times 7}{3} = 65{,}94$ cm$^{3}$.
  - numero: 10
    etoiles: 1
    enonce: Volume d'une pyramide à base carrée de $3$ cm de côté, hauteur $4$ cm, puis d'une boule de
      rayon $6$ cm.
    correction: $\frac{9 \times 4}{3} = 12$ cm$^{3}$ ; boule $\frac{4 \times 3{,}14 \times 216}{3} = 904{,}32$
      cm$^{3}$.
  - numero: 11
    etoiles: 1
    enonce: 'Convertis : a) $2{,}5$ m$^{3}$ en litres ; b) $750$ cm$^{3}$ en litres ; c) $4$ dm$^{3}$
      en cm$^{3}$ ; d) $3$ m$^{2}$ en cm$^{2}$.'
    correction: a) $2\,500$ L ; b) $0{,}75$ L ; c) $4\,000$ cm$^{3}$ ; d) $30\,000$ cm$^{2}$.
  - numero: 12
    etoiles: 1
    enonce: Nature de la section d'un cube par un plan parallèle à une face ? Justifie.
    correction: 'Un **carré identique** à la face : parois perpendiculaires à la base.'
  - numero: 13
    etoiles: 1
    enonce: Un cylindre de rayon $5$ cm et de hauteur $14$ cm est coupé par un plan contenant son axe.
      Nature et dimensions ?
    correction: '**Rectangle** de $10$ cm sur $14$ cm : la largeur est le diamètre.'
  - numero: 14
    etoiles: 1
    enonce: Un pavé droit de $5$ cm, $8$ cm et $12$ cm est coupé parallèlement à la face de $5$ cm sur
      $8$ cm. Nature de la section, puis son aire.
    correction: Rectangle **identique**, $5$ cm sur $8$ cm, aire $40$ cm$^{2}$ ; les $12$ cm ne servent
      pas.
  - numero: 15
    etoiles: 1
    enonce: La section d'un cylindre par un plan parallèle à sa base est un disque d'aire $16\pi$ cm$^{2}$.
      Rayon du cylindre ?
    correction: $r^{2} = 16$, donc $r = 4$ cm.
  - numero: 16
    etoiles: 1
    enonce: Une sphère de rayon $10$ cm est coupée par un plan passant par son centre. Nature et rayon
      ?
    correction: 'Un **grand cercle** : $d = 0$, donc $r = R = 10$ cm.'
  - numero: 17
    etoiles: 1
    enonce: 'Range en deux groupes, selon que la section parallèle à la base garde ou non la taille de
      la base : pavé droit, cône, cylindre, pyramide, prisme droit. Justifie.'
    correction: 'Identique : pavé, cylindre, prisme droit. Réduite : pyramide, cône. Critère : parois
      verticales ou convergentes.'
  - numero: 18
    etoiles: 1
    enonce: 'Pyramide à base carrée de $10$ cm de côté, hauteur $12$ cm, coupée à $6$ cm du sommet. Côté
      de la section, aire de la base, puis aire de la section.


      ### Entraînement ★★'
    correction: '$k = \frac{1}{2}$ ; côté $5$ cm ; base $100$ cm$^{2}$, section $25$ cm$^{2}$ : divisée
      par quatre.'
  - numero: 19
    etoiles: 2
    enonce: $SABCD$ est une pyramide régulière à base carrée de $10$ cm de côté, hauteur $12$ cm ; $M$
      milieu d'un côté de la base. a) $SM$. b) Aire d'une face. c) Aire latérale.
    correction: a) $SM^{2} = 169$, $SM = 13$ cm. b) $65$ cm$^{2}$. c) $260$ cm$^{2}$.
  - numero: 20
    etoiles: 2
    enonce: Une citerne cylindrique, à Ouahigouya, a un rayon de $1{,}5$ m et une hauteur de $4$ m. Volume,
      puis contenance en litres.
    correction: Base $7{,}065$ m$^{2}$, donc $V = 28{,}26$ m$^{3} = 28\,260$ L.
  - numero: 21
    etoiles: 2
    enonce: Une sphère de rayon $13$ cm est coupée par deux plans, à $5$ cm et à $12$ cm du centre. Calcule
      les deux rayons, puis compare-les.
    correction: '$r_{1} = 12$ cm ; $r_{2} = 5$ cm : la section rétrécit quand le plan s''éloigne.'
  - numero: 22
    etoiles: 2
    enonce: Un cône de rayon $9$ cm et de hauteur $12$ cm est coupé à mi-hauteur parallèlement à la base.
      Rayon de la section, puis comparaison des aires des deux disques.
    correction: $k = \frac{1}{2}$, $r = 4{,}5$ cm ; aires $254{,}34$ et $63{,}585$ cm$^{2}$, rapport $k^{2}
      = \frac{1}{4}$.
  - numero: 23
    etoiles: 2
    enonce: 'Une pyramide de volume $240$ cm$^{3}$ est coupée à mi-hauteur parallèlement à la base. Volume
      de la petite pyramide ?


      #### Entraînement intensif : remonter de la section au solide


      *On donne la section, on demande le solide ou la position du plan.*'
    correction: '$k^{3} = \frac{1}{8}$ : $30$ cm$^{3}$ ; le tronc garde $210$ cm$^{3}$.'
  - numero: 24
    etoiles: 2
    enonce: Une sphère de rayon $25$ cm est coupée suivant un cercle de rayon $24$ cm. Distance du plan
      au centre ?
    correction: $d^{2} = 49$, donc $d = 7$ cm.
  - numero: 25
    etoiles: 2
    enonce: Sphère de rayon $17$ cm. a) Une section de rayon $18$ cm est-elle possible ? Justifie. b)
      Et de rayon $15$ cm ? Si oui, à quelle distance du centre ?
    correction: 'a) Non : $r \leqslant R = 17$ cm. b) Oui : $d^{2} = 64$, $d = 8$ cm.'
  - numero: 26
    etoiles: 2
    enonce: Dans un cône de sommet $S$, une section parallèle à la base vérifie $\frac{SK}{SI} = \frac{2}{5}$
      et a un rayon de $6$ cm. Rayon de la base ?
    correction: $\frac{6}{R} = \frac{2}{5}$, donc $R = 15$ cm.
  - numero: 27
    etoiles: 2
    enonce: Pyramide à base carrée de hauteur $24$ cm. Une section parallèle à la base a un côté égal
      au tiers de celui de la base. À quelle distance du sommet ?
    correction: '$k = \frac{1}{3}$ : $SK = 8$ cm (soit $16$ cm de la base).'
  - numero: 28
    etoiles: 2
    enonce: Cône de hauteur $20$ cm. Une section parallèle à la base a une aire égale au seizième de celle
      de la base. À quelle distance du sommet ?
    correction: L'aire donne $k^{2} = \frac{1}{16}$, donc $k = \frac{1}{4}$ et $SK = 5$ cm.
  - numero: 29
    etoiles: 2
    enonce: Un grenier conique a un rayon de base de $1{,}2$ m et une hauteur de $3$ m. À quelle hauteur
      au-dessus de la base couper pour un rayon de section de $0{,}4$ m ?
    correction: '$k = \frac{1}{3}$ : section à $1$ m du sommet, soit $2$ m au-dessus de la base.'
  - numero: 30
    etoiles: 2
    enonce: 'La section d''un pavé droit par un plan parallèle à la base a une aire de $24$ cm$^{2}$ et
      un côté de $6$ cm. Longueur de l''autre côté de la base ? Le pavé mesure $5$ cm de haut.


      ### ★★★ Défis de maîtrise'
    correction: 'Section identique à la base : $6c = 24$, $c = 4$ cm ; la hauteur est parasite.'
  - numero: 31
    etoiles: 3
    enonce: Un cône de hauteur $H$ et de rayon $R$ est coupé à la distance $h$ du sommet, parallèlement
      à la base. a) Exprime $r$ en fonction de $R$, $h$, $H$. b) Applique avec $H = 24$ cm, $R = 10$ cm,
      $h = 18$ cm. c) Exprime l'aire de la section en fonction de celle de la base.
    correction: 'Distance depuis le sommet, donc $k = \frac{h}{H}$. a) $r = \frac{R h}{H}$. b) $r = 7{,}5$
      cm. c) Deux longueurs dans une aire : $\mathcal{A}_{\text{section}} = \mathcal{A}_{\text{base}}
      \times \frac{h^{2}}{H^{2}}$, ici $\frac{9}{16}$.'
  - numero: 32
    etoiles: 3
    enonce: Sphère de rayon $R$ coupée par un plan à la distance $d$ du centre. a) Exprime $r$ selon $R$
      et $d$. b) Que se passe-t-il si $d = R$ ? c) Pour quel $d$ a-t-on $r = \frac{R}{2}$ ?
    correction: 'Triangle $OHM$ rectangle en $H$, d''hypoténuse $OM = R$. a) $r = \sqrt{R^{2} - d^{2}}$.
      b) $r = 0$ : plan tangent, section réduite à un point. c) $\frac{R^{2}}{4} = R^{2} - d^{2}$ donne
      $d = \frac{R\sqrt{3}}{2}$.'
  - numero: 33
    etoiles: 3
    enonce: Une pyramide à base carrée de $18$ cm de côté et $30$ cm de hauteur est coupée par deux plans
      parallèles à la base, à $10$ cm et à $20$ cm du sommet. a) Les côtés des trois carrés sont-ils proportionnels
      à leurs distances au sommet ? Justifie. b) Les trois côtés. c) Les rapports des aires, puis des
      volumes, avec la pyramide entière.
    correction: 'Distances données depuis le sommet, utilisables telles quelles. a) Oui : chaque côté
      vaut celui de la base $\times \frac{\text{distance}}{H}$. b) $k_{1} = \frac{1}{3}$ : $6$ cm ; $k_{2}
      = \frac{2}{3}$ : $12$ cm ; puis $18$ cm. c) Aires $\frac{1}{9}$ et $\frac{4}{9}$ ; volumes $\frac{1}{27}$
      et $\frac{8}{27}$.'
  - numero: 34
    etoiles: 3
    enonce: Vrai ou faux ? Tranche et prouve, par un calcul ou un contre-exemple. a) Si le côté d'une
      section vaut la moitié de celui de la base, son aire vaut la moitié de celle de la base. b) La section
      d'un cylindre par un plan parallèle à sa base a la même aire que la base. c) Une sphère de $6$ cm
      de rayon peut avoir une section de $6$ cm de rayon. d) Doubler l'arête d'un cube double son volume.
    correction: 'a) **Faux** : aires $\times k^{2}$ ; $8$ cm donne $64$ cm$^{2}$, $4$ cm donne $16$ cm$^{2}$.
      b) **Vrai** : génératrices parallèles à l''axe, rayon constant. c) **Vrai** : plan par le centre,
      $d = 0$, seul cas. d) **Faux** : volume $\times 2^{3} = 8$.'
  - numero: 35
    etoiles: 3
    enonce: 'Un cône de rayon $12$ cm et de hauteur $18$ cm est coupé parallèlement à la base, à $6$ cm
      de la base. Rakieta a rendu ceci.


      > Ligne 1 : le plan est à $6$ cm de la base, donc $k = \frac{6}{18} = \frac{1}{3}$.

      > Ligne 2 : rayon de la section $= 12 \times \frac{1}{3} = 4$ cm.

      > Ligne 3 : aire de la base $= 3{,}14 \times 12^{2} = 452{,}16$ cm$^{2}$.

      > Ligne 4 : aire de la section $= 452{,}16 \times \frac{1}{3} = 150{,}72$ cm$^{2}$.

      > Ligne 5 : volume du petit cône $=$ volume du grand cône $\times \frac{1}{3}$.


      Trouve la première ligne qui casse le raisonnement, explique toutes les fautes, puis refais le calcul.'
    correction: 'La distance est mesurée depuis la **base**, alors que $k$ se lit depuis le sommet : la
      ligne 1 casse tout. Distance au sommet $18 - 6 = 12$, donc $k = \frac{2}{3}$ ; ligne 2 fausse par
      report, $r = 8$ cm. Ligne 3 juste. Ligne 4, faute nouvelle : une aire se réduit par $k^{2}$, $452{,}16
      \times \frac{4}{9} = 200{,}96$ cm$^{2}$. Ligne 5 : volumes $\times k^{3} = \frac{8}{27}$, soit $2\,712{,}96$
      et $803{,}84$ cm$^{3}$.'
  - numero: 36
    etoiles: 3
    enonce: Le toit de l'école de Zam est une pyramide régulière de base carrée de $9$ m de côté, pointe
      à $6$ m au-dessus. Des charpentiers y aménagent une plateforme parallèle à la base, dont le plancher
      passera $2$ m sous la pointe. Le directeur veut y entreposer les manuels et lui faut au moins $8$
      m$^{2}$. L'école compte $240$ élèves et la toiture a été refaite en 2023. Réponds au directeur.
    correction: 'Le plancher est un carré **réduit**. Distance depuis la pointe : $k = \frac{2}{6} = \frac{1}{3}$,
      côté $3$ m, aire $9$ m$^{2}$ (contrôle : $81 k^{2} = 9$). **Le directeur peut aménager sa réserve
      : $9$ m$^{2}$, un de plus que le minimum.** Les $240$ élèves et l''année 2023 sont parasites.'
  - numero: 37
    etoiles: 3
    enonce: Un récipient est le tronc obtenu en coupant un cône de $30$ cm de hauteur et $12$ cm de rayon
      à mi-hauteur, parallèlement à la base, puis en retirant la pointe. a) Volume du cône entier. b)
      Volume du cône retiré, sans refaire le calcul complet. c) Volume du récipient, puis contenance en
      litres.
    correction: 'Un tronc est une différence de deux cônes. a) $V = \frac{3{,}14 \times 144 \times 30}{3}
      = 4\,521{,}6$ cm$^{3}$. b) $k^{3} = \frac{1}{8}$ : $565{,}2$ cm$^{3}$, sans recalculer rayon ni
      hauteur. c) $3\,956{,}4$ cm$^{3}$, environ $3{,}96$ litres : la pointe emporte la moitié de la hauteur,
      un huitième du volume.'
  fiche_revision:
  - '**Aires planes.** Triangle $\frac{b h}{2}$ ; parallélogramme $b h$ ; losange $\frac{D d}{2}$ ; trapèze
    $\frac{\left(B + b\right) h}{2}$ ; disque $\pi r^{2}$.'
  - '**Aires latérales.** Prisme et cylindre $2\pi r h$ ; pyramide $\frac{\mathcal{P}_{\text{base}} \times
    a}{2}$ ; cône $\pi r g$ ; sphère $4\pi R^{2}$. Obliques : $g^{2} = r^{2} + h^{2}$ ; $a^{2} = h^{2}
    + \left(\frac{c}{2}\right)^{2}$.'
  - '**Volumes.** Droits $\mathcal{A}_{\text{base}} \times h$ ; pointus $\frac{\mathcal{A}_{\text{base}}
    \times h}{3}$ ; boule $\frac{4\pi R^{3}}{3}$.'
  - '**Unités.** Dix en dix, cent en cent, mille en mille. $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$ ; $1$
    m$^{3} = 1\,000$ L.'
  - '**Sections.** Pavé, prisme, cylindre : identique à la base si le plan lui est parallèle ; rectangle
    sinon. Pyramide, cône : réduite. Sphère : cercle, $r^{2} = R^{2} - d^{2}$.'
  - '**Réduction.** $k = \frac{SK}{SI}$ depuis le sommet, ou $\frac{H - h}{H}$. Longueurs $\times k$,
    aires $\times k^{2}$, volumes $\times k^{3}$. Tronc : $V - k^{3}V$.'
  trouve_erreur:
  - faux: Aire latérale du cône $= \pi r h$
    correction: 'La hauteur ne sert qu''au volume : $\mathcal{A}_{\text{lat}} = \pi r g$.'
  - faux: Volume de la pyramide $= \mathcal{A}_{\text{base}} \times h$
    correction: C'est le prisme de même base ; la pyramide en vaut le tiers.
  - faux: $1$ L $= 100$ cm$^{3}$
    correction: 'De mille en mille : $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$.'
  - faux: 'Pyramide de $20$ cm coupée à $5$ cm du sommet : $k = \frac{15}{20}$'
    correction: '$k$ se lit depuis le sommet : $\frac{5}{20} = \frac{1}{4}$.'
  cartographie_lacunes:
  - lacune: Aires, volumes, sections mal maîtrisés
    bloque_en: géométrie dans l'espace
  source_path: remediation\2ndeC\modules_c\M11.md
- niveau: 2ndeC
  module: 12
  module_titre: 'Statistiques : lire, calculer, représenter'
  pourquoi: 'Trois confusions reviennent : l''effectif pris pour la fréquence, la moyenne calculée sans
    les effectifs, la médiane cherchée sans ranger la série.'
  diagnostic:
  - question: Sur $250$ familles, $50$ utilisent l'eau de la rivière. Fréquence en pourcentage ?
    reponse: $\frac{50}{250} = 20$ %
  - question: Moyenne des valeurs $8$ et $12$, d'effectifs $2$ et $3$.
    reponse: $\frac{2 \times 8 + 3 \times 12}{5} = 10{,}4$
  - question: Amplitude et centre de la classe $\left[20\,;\,30\right[$.
    reponse: amplitude $10$ ; centre $25$
  - question: Médiane et étendue de $4\,;\,8\,;\,9\,;\,11\,;\,15$.
    reponse: médiane $9$ ; étendue $11$
  - question: Angle du secteur pour un effectif de $30$, avec $N = 120$.
    reponse: $\frac{30}{120} \times 360^{\circ} = 90^{\circ}$
  lecons:
  - id: 2ndeC_M12_L1
    numero: '12.1'
    titre: Effectifs, fréquences, pourcentages
    retenir:
    - '**Population** : l''ensemble étudié ; ses éléments sont les **individus**. **Caractère** : ce qu''on
      observe ; **quantitatif** si ses valeurs sont des nombres, **qualitatif** sinon.'
    - Valeurs $x_i$, effectifs $n_i$, effectif total $N = n_1 + \dots + n_p$.
    - $$f_i = \frac{n_i}{N} \qquad n_i = f_i \times N \qquad N = \frac{n_i}{f_i}$$
    - 'Deux des trois nombres suffisent pour trouver le troisième : c''est la **lecture inverse**. Une
      fréquence n''a pas d''unité ; on la multiplie par $100$ pour un pourcentage.'
    - '**Contrôle :** somme des effectifs $= N$ ; somme des fréquences $= 1 = 100$ %.'
    methode:
      titre: Compléter un tableau statistique
      etapes:
      - 'Repère dans chaque colonne ce qui est connu : effectif, fréquence, $N$.'
      - Si $N$ manque, cherche la colonne où effectif **et** fréquence sont connus, puis divise.
      - Complète par $n_i = f_i \times N$ et $f_i = \frac{n_i}{N}$.
      - 'Contrôle : somme des effectifs $= N$, somme des fréquences $= 100$ %.'
    exemple_resolu: '« Moto » : fréquence $15$ %, effectif $45$. Trouve $N$, puis l''effectif de « vélo
      », de fréquence $28$ %.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On remonte à $N$ par proportionnalité. | $15$ % $\rightarrow 45$, donc $5$ % $\rightarrow 15$
      |

      | $100$ % contient vingt fois $5$ %. | $N = 20 \times 15 = 300$ |

      | Chemin inverse pour le vélo. | $n = \frac{28}{100} \times 300 = 84$ |

      | **Vérification :** $\frac{84}{300} = 28$ %. ✓ | |'
    erreurs_frequentes:
    - erreur: « $\frac{96}{240} = 0{,}4$, soit $4$ % ».
      correction: $0{,}4 = 40$ %.
    - erreur: comparer deux effectifs venus d'enquêtes de tailles différentes.
      correction: on compare les **fréquences**.
    declic: effectif et fréquence se mélangent encore — Une fréquence est un quotient sans unité, entre
      $0$ et $1$ ; un effectif se compte en individus. Écrire « la somme des fréquences vaut $250$ »,
      c'est confondre les deux.
    figures: []
  - id: 2ndeC_M12_L2
    numero: '12.2'
    titre: Classes et effectifs cumulés
    retenir:
    - 'Les **classes** sont des intervalles qui se suivent sans trou ni recouvrement. $\left[a\,;\,b\right[$
      contient les valeurs $\geq a$ et **strictement inférieures** à $b$ : la borne $b$ est dans la classe
      suivante.'
    - '**Amplitude** : $b - a$. **Centre** : $\frac{a + b}{2}$. **Classe modale** : celle de plus grand
      effectif.'
    - 'Le regroupement perd les valeurs exactes : la moyenne d''une série groupée est **approchée**.'
    - 'L''**effectif cumulé croissant** d''une valeur compte les individus de valeur **inférieure ou égale**
      : on additionne de proche en proche.'
    - 'Le dernier cumul vaut $N$ : c''est le contrôle. La **fréquence cumulée croissante** est ce cumul
      divisé par $N$.'
    methode:
      titre: Regrouper une série en classes
      etapes:
      - Cherche la plus petite et la plus grande valeur, puis l'étendue.
      - Choisis quatre à six classes ; divise l'étendue par ce nombre pour l'amplitude.
      - Pars d'un nombre rond, avance d'amplitude en amplitude, borne ouverte à droite.
      - Coche le relevé une seule fois, compte, contrôle que la somme donne $N$.
    exemple_resolu: 'Notes de $20$ élèves : $5$ ($2$), $7$ ($4$), $9$ ($6$), $11$ ($5$), $13$ ($3$). Cumuls
      croissants, puis nombre d''élèves ayant au plus $9$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On additionne de proche en proche. | $2$ ; $6$ ; $12$ ; $17$ ; $20$ |

      | Le dernier cumul redonne $N$. | $20 = N$ ✓ |

      | « Au plus $9$ » se lit dans la colonne de $9$. | $12$ élèves, soit $60$ % |

      | **Vérification :** $2 + 4 + 6 = 12$. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $\left[10\,;\,20\right]$, $\left[20\,;\,30\right]$.
      correction: $20$ serait dans les deux ; on écrit $\left[10\,;\,20\right[$, $\left[20\,;\,30\right[$.
    - erreur: confondre centre et effectif.
      correction: dans $\left[40\,;\,50\right[$ avec $14$ élèves, $45$ est une masse, $14$ un nombre d'élèves.
    declic: null
    figures: []
  - id: 2ndeC_M12_L3
    numero: '12.3'
    titre: Moyenne, mode, étendue, médiane
    retenir:
    - '**Moyenne :** $$\overline{x} = \frac{n_1 x_1 + \dots + n_p x_p}{N}$$ chaque valeur comptée autant
      de fois qu''elle apparaît. Série groupée : on prend les **centres**.'
    - '**Mode :** valeur de plus grand effectif ; seul résumé valable sur un caractère qualitatif. **Étendue
      :** max moins min.'
    - '**Médiane :** valeur qui partage la série **ordonnée** en deux groupes de même effectif. $N$ impair
      : rang $\frac{N + 1}{2}$ ; $N$ pair : demi-somme des rangs $\frac{N}{2}$ et $\frac{N}{2} + 1$.'
    - '**Contrôle :** la moyenne tombe entre les extrêmes, sans forcément appartenir à la série.'
    - 'On n''additionne **jamais** des moyennes : on additionne des sommes, puis on divise par $N$.'
    methode:
      titre: Moyenne et médiane
      etapes:
      - 'Moyenne : trois lignes, valeurs $x_i$ (ou centres), effectifs $n_i$, produits $n_i x_i$.'
      - Additionne les produits, additionne les effectifs, divise par $N$ ; contrôle les extrêmes.
      - 'Médiane : range la série croissante, ou dresse les cumuls croissants.'
      - Prends la valeur du rang voulu selon la parité de $N$.
    exemple_resolu: 'Six bénéfices du jour en FCFA : $3\,000$, $3\,500$, $4\,000$, $3\,000$, $3\,500$,
      $43\,000$. Bénéfice moyen, puis médian.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On additionne et on divise par six. | $\overline{x} = \frac{60\,000}{6} = 10\,000$ FCFA |

      | Geste obligatoire : ranger la série. | $3\,000\,;\,3\,000\,;\,3\,500\,;\,3\,500\,;\,4\,000\,;\,43\,000$
      |

      | $N = 6$ est pair : rangs $3$ et $4$. | Médiane $= 3\,500$ FCFA |

      | **Vérification :** cinq commerçantes sur six sont sous la moyenne ✓ | |


      [SVG: figures/m12_f3.svg]

      *Figure 12.1 : Une seule valeur extrême déplace la moyenne, pas la médiane.*'
    erreurs_frequentes:
    - erreur: pour $5$, $10$, $15$ d'effectifs $2$, $3$, $5$, écrire $\overline{x} = \frac{5 + 10 + 15}{3}
        = 10$.
      correction: $\overline{x} = \frac{10 + 30 + 75}{10} = 11{,}5$.
    - erreur: prendre la valeur écrite au milieu de la liste.
      correction: on range d'abord ; pour $8\,;\,3\,;\,12\,;\,5\,;\,9$, la médiane est $8$.
    declic: null
    figures:
    - figures/m12_f3.svg
  - id: 2ndeC_M12_L4
    numero: '12.4'
    titre: Diagrammes et lecture graphique
    retenir:
    - '**Bâtons** : hauteur proportionnelle à l''effectif, bâtons **séparés** ; caractère qualitatif ou
      valeurs isolées. **Barres** : le même, couché.'
    - '**Circulaire** : $$\text{angle} = f_i \times 360^{\circ} = \frac{n_i}{N} \times 360^{\circ}$$ Semi-circulaire
      : $180^{\circ}$ au lieu de $360^{\circ}$.'
    - '**Histogramme** : un rectangle par classe, rectangles **accolés**. Réservé aux données groupées.'
    - '**Lecture inverse :** $f_i = \frac{\alpha}{360^{\circ}}$ et $n_i = \frac{\alpha}{360^{\circ}} \times
      N$.'
    - '**Trois pièges :** axe tronqué, échelle non proportionnelle, comparaison de deux graphiques d''effectifs
      différents.'
    methode:
      titre: Construire un diagramme circulaire
      etapes:
      - Calcule $N$ en additionnant tous les effectifs.
      - Cherche $\frac{360}{N}$, degrés par individu, si le quotient tombe juste ; sinon chaque angle
        par $\frac{n_i}{N} \times 360^{\circ}$.
      - Vérifie que la somme fait $360^{\circ}$ avant de dessiner.
      - Reporte les angles depuis un même rayon, puis légende chaque secteur.
    exemple_resolu: '$100$ producteurs : mil $45$, sorgho $30$, maïs $15$, riz $10$. Angles, puis effectif
      d''un secteur de $90^{\circ}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On contrôle l''effectif total. | $45 + 30 + 15 + 10 = 100 = N$ |

      | Un producteur vaut $\frac{360}{100}$ degré. | $3{,}6^{\circ}$ par producteur |

      | On multiplie chaque effectif par $3{,}6$. | $162^{\circ}$ ; $108^{\circ}$ ; $54^{\circ}$ ; $36^{\circ}$
      |

      | Lecture inverse : $\frac{90}{360} \times 100 = 25$. **Vérification :** somme $360^{\circ}$. ✓
      | |'
    erreurs_frequentes:
    - erreur: calculer un angle par « effectif $\times 360$ ».
      correction: 'on divise d''abord par $N$ : $\frac{30}{120} \times 360^{\circ} = 90^{\circ}$.'
    - erreur: lire un semi-circulaire comme un circulaire.
      correction: le tout vaut $180^{\circ}$ ; un secteur de $75^{\circ}$ y représente $\frac{75}{180}$
        de l'effectif.
    declic: null
    figures:
    - figures/m12_f4.svg
