  - numero: 10
    etoiles: 1
    enonce: Démontre que $x^{2} - x\left(x + 3\right) = -3x$ pour tout réel $x$, puis déduis-en son signe.
    correction: '$x^{2} - x^{2} - 3x = -3x$ : positif si $x < 0$, nul en $0$, négatif si $x > 0$.'
  - numero: 11
    etoiles: 1
