  objet: Calculer l'écart à -15 degrés des relevés -16 ; -13 et -19 degrés
  reponse_attendue: écarts de 1 degré (-16), 2 degrés (-13) et 4 degrés (-19)
  solution: '|-16 - (-15)| = 1 ; |-13 - (-15)| = 2 ; |-19 - (-15)| = 4. Barème (2 pts) : 2 pts pour les
    trois écarts 1 ; 2 et 4 ; 1 pt seulement si deux des trois sont justes. Ne rien retirer pour un écart
    écrit en relatif (-1 au lieu de 1) si la comparaison de la question 3 est menée sur la valeur absolue.'
  si_echoue: Ecart de deux nombres relatifs pris en valeur absolue.
  probleme_parent: P1
