  competence_secondaire: M.CONV
  domaine: Activites numeriques
  objet: Juger si 25 sacs de 48,5 kg tiennent dans 1,5 t, nommer la donnée manquante
  reponse_attendue: 25 × 48,5 = 1 212,5 kg < 1 500 kg, un seul voyage suffit ; la donnée manquante est
    le nombre de sacs de la récolte de Yacouba
  solution: 'Masse : 25 × 48,5 = 1 212,5 kg ; 1,5 t = 1 500 kg ; 1 212,5 < 1 500. Les deux tarifs ne se
    comparent que pour un nombre de sacs donné, que l''énoncé ne fournit pas. Barème (3 pts) : 1 pt (N)
    la masse 1 212,5 kg ; 1 pt (M) la conversion 1,5 t = 1 500 kg et la décision de chargement ; 1 pt
    (D) la donnée manquante nommée et la phrase de conclusion. La mention vague « il manque une donnée
    » ne vaut rien. Remarquer en plus que les deux tarifs coïncident à 25 sacs n''est pas pénalisé.'
  si_echoue: Multiplication d'un décimal par un entier, conversion de la tonne en kilogrammes, et repérage
    d'une donnée manquante.
  probleme_parent: P3
