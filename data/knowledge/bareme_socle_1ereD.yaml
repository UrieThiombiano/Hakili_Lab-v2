  bareme: 0.5
  bareme_classeur: 2.0
  competence: F.PAR
  competence_secondaire: null
  domaine: Fonctions et applications
  objet: Valider « l'axe des ordonnées est axe de symétrie » pour v(x) = (x² + 1)/(x² + 3) (Boukary)
  reponse_attendue: v(-x) = v(x) pour tout réel x ; v est paire, l'axe des ordonnées est axe de symétrie,
    Boukary a raison
  solution: 'Pour tout x réel, -x est réel et v(-x) = ((-x)² + 1)/((-x)² + 3) = v(x). Barème : 1 pt pour
    le calcul de v(-x) et l''égalité établie pour tout x ; 1 pt pour la conclusion nommant la parité,
    la reliant à l''axe de symétrie et validant l''affirmation. « Vrai » sans calcul ne vaut rien.'
  si_echoue: Preuve de la parité par le calcul de v(-x) et lien entre parité et axe de symétrie. Livret
    de remédiation 1ère D / Tle D, module 8.
