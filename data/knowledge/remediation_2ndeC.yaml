    et l''étude de signe.'
  diagnostic:
  - question: Quel est le degré de $4x^{3} - x^{5} + 1$ ?
    reponse: $5$
  - question: 'Réduis et ordonne : $5x^{2} - 3x + 2 - \left(2x^{2} - x - 4\right)$.'
    reponse: $3x^{2} - 2x + 6$
  - question: 'Développe : $\left(3x + 2\right)^{2}$.'
    reponse: $9x^{2} + 12x + 4$
  - question: 'Factorise : $16x^{2} - 25$.'
    reponse: $\left(4x - 5\right)\left(4x + 5\right)$
  - question: Pour quelle valeur de $x$ l'expression $\frac{5}{x - 3}$ n'a-t-elle pas de sens ?
    reponse: $x = 3$
  lecons:
  - id: 2ndeC_M03_L1
    numero: '3.1'
    titre: 'Monômes, polynômes, degré : réduire et ordonner'
    retenir:
    - '**Monôme** : produit d''un nombre et d''une puissance de la lettre. Dans $-5x^{3}$, coefficient
      $-5$ (signe compris), partie littérale $x^{3}$, degré $3$ ; un nombre seul est de degré $0$.'
    - '**Polynôme** : somme de monômes, ses **termes** ; son **degré** est le plus grand degré de ses
      termes.'
    - '**Semblables** : même partie littérale. $3x^{2}$ et $-7x^{2}$ oui, $3x^{2}$ et $3x$ non.'
    - '**Réduire** : additionner les coefficients des semblables. **Ordonner** : puissances décroissantes.'
    - $-\left(a + b\right) = -a - b$ et $-\left(a - b\right) = -a + b$.
    methode:
      titre: Réduire et ordonner un polynôme
      etapes:
      - 'Supprime les parenthèses : un « $-$ » devant change **tous** les signes.'
      - Regroupe les termes semblables.
      - Additionne les coefficients de chaque groupe.
      - Range par puissances décroissantes, contrôle avec une valeur simple.
    exemple_resolu: '*Réduire et ordonner $A = \left(4x + 7\right) + \left(2x - 5\right) - \left(x + 3\right)$.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le « $-$ » change les deux signes de la troisième parenthèse. | $A = 4x + 7 + 2x - 5 - x - 3$
      |

      | On regroupe les semblables. | $A = \left(4x + 2x - x\right) + \left(7 - 5 - 3\right)$ |

      | On additionne les coefficients. | $A = 5x - 1$ |

      | **Vérification :** pour $x = 2$, $9 = 9$. ✓ | |'
    erreurs_frequentes:
    - erreur: $-\left(2x^{2} - 5x\right) = -2x^{2} - 5x$.
      correction: $-2x^{2} + 5x$.
    - erreur: $3x^{2} + 2x = 5x^{3}$.
      correction: termes non semblables, rien ne se réduit.
    declic: null
    figures: []
  - id: 2ndeC_M03_L2
    numero: '3.2'
    titre: 'Développer : distributivité et identités remarquables'
    retenir:
    - '$k\left(a + b\right) = ka + kb$ ; $\left(a + b\right)\left(c + d\right) = ac + ad + bc + bd$ :
      **quatre produits**, toujours.'
    - $\left(a + b\right)^{2} = a^{2} + 2ab + b^{2}$ ; $\left(a - b\right)^{2} = a^{2} - 2ab + b^{2}$
      ; $\left(a - b\right)\left(a + b\right) = a^{2} - b^{2}$.
    - Le **double produit** $2ab$ ne disparaît jamais.
    - '$a$ et $b$ peuvent être des monômes : si $a = 9x$, alors $a^{2} = 81x^{2}$, et non $9x^{2}$.'
    methode:
      titre: Développer avec une identité remarquable
      etapes:
      - 'Repère la forme : $\left(a + b\right)^{2}$, $\left(a - b\right)^{2}$ ou $\left(a - b\right)\left(a
        + b\right)$.'
      - Écris qui est $a$ et qui est $b$, coefficient collé à la lettre.
      - Applique la formule sans oublier le double produit.
      - Réduis, ordonne, contrôle avec une valeur simple.
    exemple_resolu: '*Développer $A = \left(6x + 5\right)^{2}$ et $B = \left(5x - 9\right)\left(5x + 9\right)$.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $A$ : forme $\left(a + b\right)^{2}$. | $a = 6x$ et $b = 5$ |

      | Le carré porte sur tout le monôme. | $A = 36x^{2} + 2 \times 6x \times 5 + 25 = 36x^{2} + 60x
      + 25$ |

      | Dans $B$, seul un signe change : $a = 5x$, $b = 9$. | $B = 25x^{2} - 81$ |

      | **Vérification :** pour $x = 0$, $A = 25$ et $B = -81$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\left(3x + 2\right)^{2} = 9x^{2} + 4$.
      correction: double produit $12x$, donc $9x^{2} + 12x + 4$.
    - erreur: $\left(6x\right)^{2} = 6x^{2}$ ou $\left(2a\right)^{3} = 2a^{3}$.
      correction: 'l''exposant porte sur tout le monôme : $36x^{2}$ et $8a^{3}$.'
    declic: null
    figures:
    - figures/m03_f2.svg
  - id: 2ndeC_M03_L3
    numero: '3.3'
    titre: 'Factoriser : facteur commun, identité, factorisation mixte'
    retenir:
    - '**Facteur commun :** $ka + kb = k\left(a + b\right)$. Nombre, lettre, ou **parenthèse entière**
      : dans $2a\left(a - 1\right) + 3\left(a - 1\right)$, il vaut $\left(a - 1\right)$.'
    - '**Identités**, dans l''autre sens : $a^{2} \pm 2ab + b^{2} = \left(a \pm b\right)^{2}$ ; $a^{2}
      - b^{2} = \left(a - b\right)\left(a + b\right)$.'
    - Une **somme** de deux carrés, comme $x^{2} + 9$, ne se factorise pas.
    - '**Produit nul :** un produit est nul si et seulement si l''un au moins de ses facteurs est nul.
      C''est pour cela qu''on factorise.'
    - '**Mixte :** si rien n''est commun, factorise chaque morceau, puis reprends.'
    methode:
      titre: Factoriser un polynôme
      etapes:
      - Cherche un **facteur commun** à tous les termes, parenthèse comprise.
      - 'Sinon, cherche une **identité** : différence de deux carrés, ou trois termes dont deux carrés
        et leur double produit.'
      - Sinon, factorise chaque morceau, puis reprends à l'étape 1.
      - Vérifie en développant, puis applique le produit nul si une équation est demandée.
    exemple_resolu: '*Factoriser $A = 9x^{2} + 24x + 16$ et $B = \left(x + 1\right)^{2} - 49$.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $A$ : pas de facteur commun, les extrêmes sont des carrés. | $9x^{2} = \left(3x\right)^{2}$ et
      $16 = 4^{2}$ |

      | Le double produit autorise à conclure. | $2 \times 3x \times 4 = 24x$ ✓ donc $A = \left(3x + 4\right)^{2}$
      |

      | $B$ : différence de deux carrés, $a = x + 1$, $b = 7$. | $B = \left(x - 6\right)\left(x + 8\right)$
      |

      | **Vérification :** $\left(x - 6\right)\left(x + 8\right) = x^{2} + 2x - 48$. ✓ | |'
    erreurs_frequentes:
    - erreur: $3x^{2} + 6x = 3\left(x^{2} + 6x\right)$.
      correction: 'le facteur commun se sort en entier : $3x\left(x + 2\right)$.'
    - erreur: confondre $x^{2} - 4$ et $x^{2} - 4x + 4$.
      correction: deux termes donnent $\left(x - 2\right)\left(x + 2\right)$, trois termes $\left(x -
        2\right)^{2}$.
    declic: 'la factorisation ne s''invente pas, elle s''essaie dans l''ordre — Bloqué, ce n''est pas
      la notion qui manque : tu cherches la bonne idée au lieu d''appliquer la liste. Reprends la figure
      3.2 et essaie les outils dans l''ordre, au brouillon.'
    figures:
    - figures/m03_f3.svg
  - id: 2ndeC_M03_L4
    numero: '3.4'
    titre: Expressions rationnelles et valeurs interdites
    retenir:
    - 'Une **expression rationnelle** est un quotient de deux polynômes : $\frac{3x + 1}{x - 2}$.'
    - 'Une **valeur interdite** annule le **dénominateur** : on factorise, on résout « dénominateur $=
      0$ », on l''écrit avant tout calcul.'
    - 'Elles se lisent sur le dénominateur **de départ** : une simplification n''en efface aucune.'
    - 'On ne simplifie que des **facteurs**, jamais des termes : $\frac{x^{2} - 9}{x + 3} = \frac{\left(x
      - 3\right)\left(x + 3\right)}{x + 3} = x - 3$ pour $x \ne -3$.'
    methode:
      titre: Étudier une expression rationnelle
      etapes:
      - Factorise le dénominateur, résous « dénominateur $= 0$ », écris les valeurs interdites.
      - Factorise le numérateur.
      - Supprime le facteur commun.
      - Écris le résultat en rappelant les valeurs interdites du départ.
    exemple_resolu: '*Valeurs interdites de $F = \frac{x^{2} + 4x + 4}{x^{2} - 4}$, puis simplifier.*


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On factorise le dénominateur. | $x^{2} - 4 = \left(x - 2\right)\left(x + 2\right)$, donc $x \ne
      2$ et $x \ne -2$ |

      | Le numérateur : deux carrés et le double produit $4x$. | $x^{2} + 4x + 4 = \left(x + 2\right)^{2}$
      |

      | On supprime le facteur $\left(x + 2\right)$. | $F = \frac{x + 2}{x - 2}$ pour $x \ne 2$ et $x
      \ne -2$ |

      | **Vérification :** pour $x = 0$, $\frac{4}{-4} = \frac{2}{-2} = -1$. ✓ | |'
    erreurs_frequentes:
    - erreur: chercher les valeurs interdites en annulant le numérateur.
      correction: seul le dénominateur les donne.
    - erreur: $\frac{x + 3}{x + 5} = \frac{3}{5}$.
      correction: rien n'est factorisé, donc rien ne se simplifie.
    declic: null
    figures: []
