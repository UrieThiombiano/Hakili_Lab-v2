      ### Entraînement ★★'
    correction: 'a) $\Delta = 49$ : $x = 5$ ou $-2$. b) $\Delta = 49$ : $x = \frac{3}{2}$ ou $-2$. c)
      $\Delta = -3 < 0$ : aucune solution. d) $\Delta = 0$ : $x = \frac{3}{2}$ (double).'
  - numero: 13
