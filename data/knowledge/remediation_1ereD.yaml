    correction: a) $6 \times 10^{-3}$ ; b) $3 \times 10^{3}$.
  - numero: 9
    etoiles: 1
    enonce: 'Donne la notation scientifique de : a) $167{,}15 \times 10^{-15}$ ; b) la distance Terre–Soleil,
      égale à 150 millions de km, exprimée en mètres.'
    correction: a) $1{,}6715 \times 10^{-13}$ ; b) $1{,}5 \times 10^{11}$ m.
  - numero: 10
    etoiles: 1
    enonce: 'Écris en notation scientifique : a) 0,0000000103 ; b) cinq millions de milliards ; c) douze
