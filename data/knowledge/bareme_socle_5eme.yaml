- code: P3.2
  partie: C
  format: redige
  bareme: 1.0
  bareme_classeur: 3.0
  competence: D.PROP
  competence_secondaire: null
  domaine: Donnees, proportionnalite, statistique
  objet: Dire lequel des deux tarifs de transport est proportionnel au nombre de sacs, en justifiant
  reponse_attendue: le tarif de Drissa est proportionnel (coefficient 1 500) ; celui de Noaga ne l'est
    pas (forfait de 15 000 FCFA)
  solution: 'Chez Drissa chaque prix = nombre de sacs × 1 500. Chez Noaga le forfait de 15 000 FCFA se
    paie quel que soit le nombre de sacs, et 24 000 : 10 = 2 400 alors que 33 000 : 20 = 1 650. Barème
    (3 pts) : 1 pt (D) le tarif de Drissa désigné comme proportionnel ; 1 pt (D) le coefficient 1 500
    nommé comme multiplicateur commun ; 1 pt (D) l''explication du refus pour Noaga, par le forfait ou
    par deux quotients inégaux. La seule réponse « Drissa » sans justification vaut le premier point seulement.'
  si_echoue: Reconnaissance de la proportionnalité en présence d'un terme fixe.
  probleme_parent: P3
