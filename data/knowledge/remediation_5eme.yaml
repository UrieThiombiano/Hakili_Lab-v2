- niveau: 5eme
  module: 1
  module_titre: 'Décimaux : lire, comparer, encadrer, arrondir'
  pourquoi: 'La faute la plus tenace de la 6ème survit : lire la partie décimale comme un second entier,
    donc croire que $12{,}75$ dépasse $12{,}8$. S''y ajoutent le zéro effacé au mauvais rang et l''arrondi
    confondu avec la coupure.'
  diagnostic:
  - question: Dans $45{,}07$, quel est le chiffre des centièmes ?
    reponse: $7$
  - question: Compare $2{,}8$ et $2{,}750$.
    reponse: $2{,}750 = 2{,}75 < 2{,}8$ (dixièmes $7 < 8$)
  - question: 'Range dans l''ordre croissant : $9{,}8$ ; $9{,}08$ ; $9{,}805$.'
    reponse: $9{,}08 < 9{,}8 < 9{,}805$
  - question: Encadre $11{,}2573$ par deux entiers consécutifs.
    reponse: $11 < 11{,}2573 < 12$
  - question: Donne la valeur approchée au dixième de $7{,}264$, par défaut puis par excès.
    reponse: défaut $7{,}2$, excès $7{,}3$
  lecons:
  - id: 5eme_M01_L1
    numero: '1.1'
    titre: La place commande la valeur
    retenir:
    - 'À gauche de la virgule : unités, dizaines, centaines, milliers. À droite : dixièmes, centièmes,
      millièmes.'
    - Un pas à gauche multiplie par dix, un pas à droite divise par dix.
    - 'Décomposer, c''est écrire la **somme** des valeurs des chiffres : $274{,}6 = (2 \times 100) + (7
      \times 10) + (4 \times 1) + (6 \times \text{un dixième})$.'
    - 'Les zéros **tout à la fin** s''ajoutent et s''enlèvent : $2{,}5 = 2{,}50$, $4 = 4{,}0$. Jamais
      celui placé entre la virgule et un chiffre : $2{,}05 \neq 2{,}5$.'
    - '**Chiffre** des centaines de $2\,845$ : $8$. **Nombre** de centaines : $28$.'
    methode:
      titre: Donner la valeur d'un chiffre, ou reconstruire un nombre
      etapes:
      - Repère la colonne du chiffre en partant de la virgule.
      - 'Associe sa valeur : $1$, $10$, $100$, $1\,000$ ; dixième, centième, millième après la virgule.'
      - Multiplie le chiffre par cette valeur, ou place chaque morceau de la somme à son rang.
      - Mets un $0$ dans toute colonne vide, puis relis.
    exemple_resolu: 'Écris $45{,}07$ en lettres, puis décompose-le.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Partie entière, « virgule », puis les décimales chiffre par chiffre. | quarante-cinq virgule zéro
      sept |

      | Chaque chiffre est multiplié par la valeur de son rang. | $45{,}07 = (4 \times 10) + (5 \times
      1) + (7 \times \text{un centième})$ |

      | **Vérification :** $40 + 5 + 0{,}07 = 45{,}07$. ✓ | |


      [SVG: figures/m01_f1.svg]

      *Figure 1.1 : un seul tableau de numération pour les entiers et les décimaux.*'
    erreurs_frequentes:
    - erreur: répondre $8$ au « nombre de centaines de $2\,845$ ».
      correction: $8$ est le *chiffre* ; le *nombre* est $28$.
    - erreur: écrire $(3 \times 10) + (8 \times \text{un centième}) = 3{,}8$.
      correction: 'unités et dixièmes sont vides, on y écrit des zéros : $30{,}08$.'
    declic: null
    figures:
    - figures/m01_f1.svg
  - id: 5eme_M01_L2
    numero: '1.2'
    titre: Comparer et ranger, rang par rang
    retenir:
    - '$<$ « est inférieur à », $>$ « est supérieur à », $=$ « est égal à » : la **pointe** vise le plus
      petit. $\le$ est vrai aussi en cas d''égalité.'
    - Dès qu'un rang décide, les rangs suivants ne comptent plus.
    - '**Croissant** : du plus petit au plus grand, relié par $<$. **Décroissant** : l''inverse, relié
      par $>$.'
    - 'Deux écritures d''un même nombre se relient par $=$ : $48{,}3 = 48{,}30$. Cinq nombres au départ,
      cinq à l''arrivée.'
    methode:
      titre: Comparer deux nombres décimaux
      etapes:
      - Compare les parties entières ; si elles diffèrent, conclus aussitôt.
      - 'Sinon, complète les parties décimales par des zéros finals : même longueur.'
      - Descends aux dixièmes, puis aux centièmes, puis aux millièmes, jusqu'au rang qui diffère.
      - Écris le signe, pointe vers le plus petit.
    exemple_resolu: 'Compare $5{,}127$ et $5{,}124$, puis $2{,}8$ et $2{,}750$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Parties entières, dixièmes et centièmes égaux : on descend. | $5 = 5$, $1 = 1$, $2 = 2$ |

      | Le rang des millièmes décide. | $7 > 4$, donc $5{,}127 > 5{,}124$ |

      | Même longueur, puis lecture des dixièmes. | $2{,}800$ et $2{,}750$, donc $2{,}8 > 2{,}750$ |

      | **Vérification :** en millièmes, $2\,800$ contre $2\,750$. ✓ | |'
    erreurs_frequentes:
    - erreur: conclure $0{,}5 = 0{,}05$ « puisque le zéro ne change rien ».
      correction: 'ce zéro n''est pas à la fin, il repousse le $5$ d''un rang : $0{,}5 = 0{,}50$, dix
        fois $0{,}05$.'
    - erreur: rendre une liste décroissante quand la consigne demandait l'ordre croissant.
      correction: relis de gauche à droite, chaque nombre dépasse le précédent.
    declic: null
    figures: []
  - id: 5eme_M01_L3
    numero: '1.3'
    titre: Encadrer, intercaler, placer sur une droite graduée
    retenir:
    - Encadrer, c'est écrire le nombre entre une valeur plus petite et une plus grande.
    - 'Par deux entiers : $287 < 287{,}05 < 288$. Au dixième : $287{,}0 < 287{,}05 < 287{,}1$.'
    - Plus les bornes sont proches, plus l'encadrement est **serré**.
    - 'Entre deux décimaux il y a toujours un décimal, et même une **infinité** : on descend d''un rang.
      $5{,}12 < 5{,}125 < 5{,}13$.'
    - Entre deux décimaux, il n'y a qu'un nombre **fini** d'entiers, parfois aucun.
    - Une origine $0$, une unité reportée régulièrement ; l'unité partagée en dix donne les dixièmes,
      le dixième en dix, les centièmes.
    - Le nombre associé à un point est son **abscisse** ; le plus petit est le plus à gauche.
    methode:
      titre: Encadrer un nombre à un rang donné
      etapes:
      - 'Repère le rang demandé : unité, dixième, centième.'
      - 'Coupe juste après ce rang : c''est la **borne du bas**.'
      - 'Ajoute $1$ au dernier chiffre gardé : c''est la **borne du haut**.'
      - 'Écris l''encadrement : borne du bas, nombre, borne du haut.'
    exemple_resolu: 'Encadre $3{,}649$ par deux entiers consécutifs, puis au dixième.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La partie entière donne la borne du bas, l''entier suivant celle du haut. | $3 < 3{,}649 < 4$
      |

      | On s''arrête au dixième, puis on prend le dixième suivant. | $3{,}6 < 3{,}649 < 3{,}7$ |

      | **Vérification :** le second intervalle mesure $0{,}1$, non $1$. ✓ | |'
    erreurs_frequentes:
    - erreur: affirmer qu'aucun nombre n'existe entre $0{,}2$ et $0{,}3$.
      correction: 'aucun **entier**, mais une infinité de **décimaux** : $0{,}21$ ; $0{,}25$ ; $0{,}297$…'
    - erreur: placer $2{,}05$ juste après $2{,}5$.
      correction: '$2{,}05$ n''a aucun dixième : il est entre $2$ et $2{,}1$, bien avant $2{,}5$.'
    declic: null
    figures: []
  - id: 5eme_M01_L4
    numero: '1.4'
    titre: Tronquer, arrondir, estimer
    retenir:
    - '**Par défaut** : la borne du bas ; on coupe après le rang demandé, c''est la **troncature**.'
    - '**Par excès** : la borne du haut ; on ajoute $1$ au dernier chiffre gardé.'
    - 'L''**arrondi** est celle des deux bornes la plus **proche** : on compare les écarts. $43\,728$
      est à $728$ de $43\,000$ et à $272$ de $44\,000$ : arrondi au millier $44\,000$.'
    - 'Un **ordre de grandeur** remplace chaque nombre par un nombre rond voisin ; il contrôle avant le
      calcul. $49 \times 5{,}1$ donne $50 \times 5 = 250$ : un résultat à $25$ ou $2\,500$ serait faux.'
    methode:
      titre: Approcher un nombre à un rang donné
      etapes:
      - 'Coupe juste après le rang demandé : valeur **par défaut**.'
      - 'Ajoute $1$ au dernier chiffre gardé : valeur **par excès**.'
      - Écris l'encadrement, puis calcule les deux écarts avec le nombre exact.
      - Le plus petit écart désigne l'**arrondi**.
    exemple_resolu: 'Donne la valeur approchée de $15{,}847$ au dixième, par défaut puis par excès, puis
      son arrondi.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On garde un seul chiffre après la virgule et on coupe. | défaut : $15{,}8$ |

      | On ajoute $1$ au chiffre gardé. | excès : $15{,}9$ |

      | On écrit l''encadrement, puis on compare les écarts. | $15{,}8 < 15{,}847 < 15{,}9$ ; écarts $0{,}047$
      et $0{,}053$ |

      | **Vérification :** $0{,}047 < 0{,}053$, l''arrondi au dixième est $15{,}8$. ✓ | |


      [SVG: figures/m01_f4.svg]

      *Figure 1.4 : le nombre exact est enfermé entre valeur par défaut et valeur par excès.*

      > #### DÉCLIC : Couper n''est pas arrondir

      >

      > Répondre $8{,}7$ à la fois « par défaut » et « par excès » au dixième de $8{,}74$, c''est n''avoir
      qu''un nombre sous les yeux. Écris d''abord $8{,}7 < 8{,}74 < 8{,}8$ : deux bornes, tu choisis ensuite.'
    erreurs_frequentes:
    - erreur: donner $8{,}7$ comme valeur **par excès** au dixième de $8{,}74$.
      correction: $8{,}7$ est la valeur par défaut ; par excès, c'est $8{,}8$.
    - erreur: rendre une troncature au centième avec trois décimales, comme $1{,}034$.
      correction: au centième, on garde exactement deux chiffres après la virgule.
    declic: 'Couper n''est pas arrondir — Répondre $8{,}7$ à la fois « par défaut » et « par excès » au
      dixième de $8{,}74$, c''est n''avoir qu''un nombre sous les yeux. Écris d''abord $8{,}7 < 8{,}74
      < 8{,}8$ : deux bornes, tu choisis ensuite. #### ⚠ ATTENTION ! - **Erreur fréquente :** donner $8{,}7$
      comme valeur **par excès** au dixième de $8{,}74$. **Correction :** $8{,}7$ est la valeur par défaut
      ; par excès, c''est $8{,}8$. - **Erreur fréquente :** rendre une troncature au centième avec trois
      décimales, comme $1{,}034$. **Correction :** au centième, on garde exactement deux chiffres après
      la virgule.'
    figures:
    - figures/m01_f4.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Complète : a) dans $3\,507$, le chiffre des dizaines est … ; b) dans $9\,140$, le chiffre
      des centaines est … ; c) dans $6\,003$, le chiffre des unités est … .'
    correction: a) $0$ ; b) $1$ ; c) $3$.
  - numero: 2
    etoiles: 1
    enonce: 'Pour $9{,}5$ ; $12{,}04$ ; $0{,}9$ ; $108{,}75$ : partie entière, partie décimale, rang du
      dernier chiffre.'
    correction: '$9{,}5$ : $9$ / $5$ / dixièmes ; $12{,}04$ : $12$ / $04$ / centièmes ; $0{,}9$ : $0$
      / $9$ / dixièmes ; $108{,}75$ : $108$ / $75$ / centièmes.'
  - numero: 3
    etoiles: 1
    enonce: 'Convertis : a) $30$ dixièmes $=$ … unités ; b) $250$ centièmes $=$ … unités ; c) $7$ dixièmes
      $=$ … centièmes.'
    correction: a) $3$ ; b) $2{,}5$ ; c) $70$.
  - numero: 4
    etoiles: 1
    enonce: 'Écris en chiffres : a) trois virgule huit ; b) vingt virgule zéro six ; c) cent cinq virgule
      deux.'
    correction: a) $3{,}8$ ; b) $20{,}06$ ; c) $105{,}2$.
  - numero: 5
    etoiles: 1
    enonce: 'Décompose par rangs, en marquant les rangs vides : a) $81{,}5$ ; b) $4{,}06$ ; c) $45{,}07$.'
    correction: a) $(8 \times 10) + (1 \times 1) + (5 \times \text{un dixième})$ ; b) $(4 \times 1) +
      (0 \times \text{un dixième}) + (6 \times \text{un centième})$ ; c) $(4 \times 10) + (5 \times 1)
      + (7 \times \text{un centième})$.
  - numero: 6
    etoiles: 1
    enonce: Un sac de mangues pèse $4{,}250$ kg. Écris ce poids sans zéro inutile, puis donne partie entière
      et partie décimale.
    correction: $4{,}250 = 4{,}25$ kg ; partie entière $4$, partie décimale $25$.
  - numero: 7
    etoiles: 1
    enonce: 'Recopie les comparaisons fausses, corrige le symbole : a) $6{,}7 < 6{,}07$ ; b) $9{,}1 >
      9{,}09$ ; c) $4{,}30 > 4{,}3$.'
    correction: 'a) faux : $6{,}7 > 6{,}07$ ; b) juste ; c) faux : $4{,}30 = 4{,}3$.'
  - numero: 8
    etoiles: 1
    enonce: 'Complète par « est supérieur à », « est inférieur à » ou « est égal à » : a) $6{,}7$ … $6{,}70$
      ; b) $3{,}8$ … $3{,}75$ ; c) $9{,}1$ … $9{,}09$ ; d) $0{,}5$ … $0{,}50$.'
    correction: a) est égal à ; b) est supérieur à ; c) est supérieur à ; d) est égal à.
  - numero: 9
    etoiles: 1
    enonce: 'Complète par $<$ ou $>$ : a) $791{,}075$ … $791{,}164$ ; b) $23{,}707$ … $24{,}001$.'
    correction: a) $<$ (dixièmes $0 < 1$) ; b) $<$ (parties entières $23 < 24$).
  - numero: 10
    etoiles: 1
    enonce: 'Range par ordre croissant : $0{,}132$ ; $1{,}203$ ; $3{,}201$ ; $2{,}31$ ; $0{,}231$ ; $3{,}012$.'
    correction: $0{,}132 < 0{,}231 < 1{,}203 < 2{,}31 < 3{,}012 < 3{,}201$.
  - numero: 11
    etoiles: 1
    enonce: 'Range par ordre croissant : a) $32{,}48$ ; $41{,}18$ ; $41{,}080$ ; $32$. b) $21{,}5601$
      ; $23{,}601$ ; $21{,}61$ ; $21{,}591$ ; $21{,}601$.'
    correction: a) $32 < 32{,}48 < 41{,}080 < 41{,}18$. b) $21{,}5601 < 21{,}591 < 21{,}601 < 21{,}61
      < 23{,}601$.
  - numero: 12
    etoiles: 1
    enonce: 'a) Range $0{,}9$ ; $0{,}89$ ; $0{,}95$ ; $0{,}8$ du plus grand au plus petit, puis intercale
      $0{,}85$. b) Range dans l''ordre décroissant : $14{,}3$ ; $14{,}03$ ; $14{,}33$ ; $14{,}3$.'
    correction: a) $0{,}95 > 0{,}9 > 0{,}89 > 0{,}85 > 0{,}8$. b) $14{,}33 > 14{,}3 = 14{,}3 > 14{,}03$.
  - numero: 13
    etoiles: 1
    enonce: 'Complète : a) … $< 7{,}9 <$ … ; b) $5{,}4 <$ … $< 5{,}5$ ; c) $6{,}52 < 6{,}521 <$ … ; d)
      $7{,}2 < 7{,}243 <$ … .'
    correction: a) $7 < 7{,}9 < 8$ ; b) par exemple $5{,}45$ ; c) $6{,}53$ ; d) $7{,}3$.
  - numero: 14
    etoiles: 1
    enonce: 'a) Encadre par les deux entiers voisins : $7{,}3$ ; $0{,}9$ ; $15{,}08$. b) Quel est le plus
      petit entier supérieur à $6{,}583$ ? c) Le plus grand entier inférieur à $6{,}583$ ?'
    correction: a) $7 < 7{,}3 < 8$ ; $0 < 0{,}9 < 1$ ; $15 < 15{,}08 < 16$. b) $7$. c) $6$.
  - numero: 15
    etoiles: 1
    enonce: a) Intercale un entier entre $25{,}4$ et $29{,}17$ ; combien conviennent ? b) Intercale entre
      $25{,}4$ et $25{,}9$ un décimal à un chiffre après la virgule ; combien y en a-t-il ?
    correction: 'a) $26$ ; **quatre** conviennent : $26$ à $29$. b) $25{,}6$ ; **quatre** : $25{,}5$ à
      $25{,}8$.'
  - numero: 16
    etoiles: 1
    enonce: Sur une demi-droite de $0$ à $1$ graduée de $0{,}1$ en $0{,}1$, place $0{,}3$ ; $0{,}55$ ;
      $0{,}8$ ; $0{,}25$.
    correction: '$0{,}3$ au troisième trait, $0{,}8$ au huitième ; $0{,}25$ et $0{,}55$ à mi-graduation.
      Lecture : $0{,}25 < 0{,}3 < 0{,}55 < 0{,}8$.'
  - numero: 17
    etoiles: 1
    enonce: 'Chaque unité d''une demi-droite est partagée en dix : combien de graduations séparent $0{,}7$
      de $1{,}4$ ?'
    correction: $1{,}4 - 0{,}7 = 0{,}7$, soit **$7$ graduations**.
  - numero: 18
    etoiles: 1
    enonce: 'Donne l''approximation par défaut : a) au dixième de $7$ ; b) au dixième de $153{,}25$ ;
      c) au centième de $32{,}4568$ ; d) au centième de $0{,}887$.'
    correction: a) $7{,}0$ ; b) $153{,}2$ ; c) $32{,}45$ ; d) $0{,}88$.
  - numero: 19
    etoiles: 1
    enonce: 'Donne l''approximation par excès : a) au dixième de $13{,}58$ ; b) au millième de $13{,}78871$
      ; c) au millième de $3{,}14576$ ; d) au centième de $3{,}4981$.'
    correction: a) $13{,}6$ ; b) $13{,}789$ ; c) $3{,}146$ ; d) $3{,}50$.
  - numero: 20
    etoiles: 1
    enonce: Range $6{,}38$ ; $6{,}31$ ; $6{,}349$ dans l'ordre croissant, puis donne l'approximation au
      dixième par défaut de chacun.
    correction: $6{,}31 < 6{,}349 < 6{,}38$ ; les trois donnent $6{,}3$ par défaut au dixième.
  - numero: 21
    etoiles: 1
    enonce: 'Donne un ordre de grandeur de : a) $49 \times 5{,}1$ ; b) $11 \times 9$ ; c) $548 \times
      310$.


      ### Entraînement ★★'
    correction: a) $50 \times 5 = 250$ ; b) $10 \times 9 = 90$ ; c) $500 \times 300 = 150\,000$.
  - numero: 22
    etoiles: 2
    enonce: 'Le pluviomètre de Ouahigouya indique : juin $127{,}8$ mm ; juillet $127{,}75$ mm ; août $128{,}0$
      mm. Quel mois a été le plus pluvieux ? Le moins pluvieux ?'
    correction: '$128{,}00 > 127{,}80 > 127{,}75$ : **août** le plus pluvieux, **juillet** le moins.'
  - numero: 23
    etoiles: 2
    enonce: 'À Djibo, trois zébus pèsent : rouge $285{,}750$ kg ; blanc $285{,}75$ kg ; tacheté $285{,}8$
      kg. Quels poids sont égaux ? Quel zébu est le plus lourd ?'
    correction: '$285{,}750 = 285{,}75$ : rouge $=$ blanc. Aux dixièmes $8 > 7$ : le **tacheté** est le
      plus lourd.'
  - numero: 24
    etoiles: 2
    enonce: 'Le prix d''un sac de riz est entre $17\,000$ et $18\,000$ FCFA. a) Écris cet encadrement
      avec le symbole $<$. b) Ce prix peut-il être $17\,950$ FCFA ? c) Peut-il être $18\,200$ FCFA ? Justifie.


      **Entraînement intensif : choisir la bonne borne.** *Écris l''encadrement avant de répondre.*'
    correction: a) $17\,000 < p < 18\,000$. b) oui, $17\,950 < 18\,000$. c) non, $18\,200 > 18\,000$.
  - numero: 25
    etoiles: 2
    enonce: On considère $12{,}758$. a) Donne un encadrement au dixième. b) Au centième. c) Lequel est
      le plus serré ?
    correction: a) $12{,}7 < 12{,}758 < 12{,}8$. b) $12{,}75 < 12{,}758 < 12{,}76$. c) le second, dix
      fois plus serré.
  - numero: 26
    etoiles: 2
    enonce: a) Quel est le plus petit décimal à deux décimales supérieur à $6{,}583$ ? b) Le plus grand
      décimal à deux décimales inférieur à $6{,}583$ ?
    correction: 'Centièmes voisins $6{,}58$ et $6{,}59$ : a) $6{,}59$ ; b) $6{,}58$.'
  - numero: 27
    etoiles: 2
    enonce: Sur une demi-droite graduée de $0{,}1$ en $0{,}1$, un point M est entre $6{,}3$ et $6{,}4$.
      a) Encadre son abscisse au dixième. b) Cite deux valeurs possibles. c) Peux-tu connaître la valeur
      exacte ?
    correction: 'a) $6{,}3 <$ abscisse de M $< 6{,}4$. b) $6{,}32$ et $6{,}37$. c) non : la graduation
      s''arrête au dixième.'
  - numero: 28
    etoiles: 2
    enonce: 'Complète : a) … est la valeur approchée par défaut au centième de $7{,}238$ ; b) … la valeur
      par excès au dixième de $7{,}238$.'
    correction: 'a) $7{,}23$ ; b) $7{,}3$. Contrôle : $7{,}23 < 7{,}238 < 7{,}3$.'
  - numero: 29
    etoiles: 2
    enonce: 'Sans poser l''opération, dis par un ordre de grandeur si chaque résultat est plausible :
      a) $19{,}8 \times 4{,}9 = 97{,}02$ ; b) $302 \times 48 = 1\,449{,}6$ ; c) $9{,}7 + 10{,}2 = 19{,}9$.


      ### ★★★ Défis de maîtrise'
    correction: 'a) $20 \times 5 = 100$ : plausible. b) $300 \times 50 = 15\,000$ : non (et un produit
      d''entiers n''a pas de décimales). c) $20$ : plausible.'
  - numero: 30
    etoiles: 3
    enonce: 'Pour ranger $5{,}7$ ; $5{,}63$ et $5{,}589$, Boureima écrit : « $5{,}7 < 5{,}63 < 5{,}589$,
      car $7 < 63 < 589$ ». a) Explique son erreur. b) Donne le bon rangement.'
    correction: 'a) Il a lu les parties décimales comme des entiers ($7$, $63$, $589$) : la longueur ne
      fait pas la grandeur, on compare rang par rang. b) $5{,}589 < 5{,}630 < 5{,}700$.'
  - numero: 31
    etoiles: 3
    enonce: 'Cinq élèves donnent la valeur approchée par défaut au centième de $30 \div 29$ : $1{,}03$
      ; $1{,}034$ ; $1{,}04$ ; $1{,}02$ ; $1{,}05$. Laquelle est correcte ? Justifie sans poser la division.'
    correction: 'Au centième, l''écriture a deux décimales : $1{,}034$ tombe. On encadre en multipliant
      par $29$ : $29 \times 1{,}03 = 29{,}87 < 30 < 30{,}16 = 29 \times 1{,}04$, donc $1{,}03 < 30 \div
      29 < 1{,}04$ : **$1{,}03$**.'
  - numero: 32
    etoiles: 3
    enonce: Trouve trois décimaux $a$, $b$, $c$ à un seul chiffre après la virgule tels que $23{,}5 <
      a < b < c < 23{,}9$. Y a-t-il plusieurs réponses ? Justifie.
    correction: 'Bornes exclues, les décimaux à un chiffre sont $23{,}6$ ; $23{,}7$ ; $23{,}8$ : $a =
      23{,}6$, $b = 23{,}7$, $c = 23{,}8$. Réponse unique, trois candidats pour trois places.'
  - numero: 33
    etoiles: 3
    enonce: Avec les chiffres $2$, $5$, $0$ et une virgule, écris tous les décimaux à un chiffre entier
      et deux décimales, puis range-les dans l'ordre croissant.
    correction: 'On classe par partie entière, chaque chiffre servant une fois. Six nombres : $0{,}25
      < 0{,}52 < 2{,}05 < 2{,}50 < 5{,}02 < 5{,}20$.'
  - numero: 34
    etoiles: 3
    enonce: Un décimal $x$ a exactement deux chiffres après la virgule, sa troncature au dixième est $6{,}8$,
      son arrondi à l'unité est $7$. a) Écris l'encadrement le plus serré. b) Combien de valeurs $x$ peut-il
      prendre ? c) La plus petite et la plus grande ?
    correction: 'Troncature $6{,}8$ : $6{,}8 \le x < 6{,}9$ ; l''arrondi $7$ n''ajoute rien. a) $6{,}8
      \le x < 6{,}9$. b) **dix valeurs** de $6{,}80$ à $6{,}89$. c) $6{,}80$ et $6{,}89$.'
  - numero: 35
    etoiles: 3
    enonce: À Bagré, la bascule affiche $76{,}45$ kg. Le magasinier n'inscrit sur la facture qu'un nombre
      entier de kilogrammes, le plus proche de la pesée. La coopérative compte $54$ membres. Quel nombre
      inscrit-il ?
    correction: '« Le plus proche » : c''est un arrondi, on compare les écarts. $76{,}45 - 76 = 0{,}45
      < 0{,}55 = 77 - 76{,}45$ : **$76$ kg**. Les $54$ membres ne servent à rien.'
  - numero: 36
    etoiles: 3
    enonce: Un camarade écrit « $0{,}7 < 0{,}68$ car $68 > 7$ ». Explique-lui son erreur en phrases complètes,
      puis donne la bonne comparaison.
    correction: 'Il compare $7$ et $68$ comme des entiers, sans tenir compte des rangs. À la même longueur,
      $0{,}70$ contre $0{,}68$ : $70$ centièmes contre $68$. Donc $0{,}7 > 0{,}68$.'
  fiche_revision:
  - '**Valeur de position.** Dans $4\,826$, le $8$ vaut $800$ ; chiffre des centaines $= 8$, nombre de
    centaines $= 48$.'
  - '**Rangs décimaux.** $1$ unité $= 10$ dixièmes $= 100$ centièmes $= 1\,000$ millièmes.'
  - '**Zéros.** On enlève ceux de la fin ($2{,}5 = 2{,}50$), jamais celui qui suit la virgule ($0{,}05
    \neq 0{,}5$).'
  - '**Décomposer.** $45{,}07 = (4 \times 10) + (5 \times 1) + (7 \times \text{un centième})$ ; la somme
    redonne le nombre.'
  - '**Comparer.** Parties entières, puis dixièmes, puis centièmes, à la même longueur : la longueur ne
    fait pas la grandeur.'
  - '**Encadrer.** $12{,}75 < 12{,}758 < 12{,}76$. Entre deux décimaux : une infinité de décimaux, un
    nombre fini d''entiers.'
  - '**Approcher.** Par défaut on coupe ; par excès on ajoute $1$ au dernier chiffre ; l''arrondi est
    la borne la plus proche.'
  trouve_erreur:
  - faux: $2{,}750 > 2{,}8$ car il y a plus de chiffres
    correction: $2{,}750 = 2{,}75$ ; aux dixièmes $7 < 8$, donc $2{,}750 < 2{,}8$.
  - faux: $0{,}5 = 0{,}05$
    correction: 'Ce zéro repousse le $5$ d''un rang : $0{,}5 = 0{,}50$, dix fois $0{,}05$.'
  - faux: La valeur par excès au dixième de $8{,}74$ est $8{,}7$
    correction: $8{,}7$ est la valeur par défaut ; par excès, $8{,}8$.
  - faux: Le nombre de centaines de $5\,070$ est $0$
    correction: $0$ est le *chiffre* ; le *nombre* de centaines est $50$.
  cartographie_lacunes:
  - lacune: Comparaison de décimaux fausse, arrondi confondu avec troncature
    bloque_en: comparaison, valeur absolue
  source_path: remediation\5eme\modules_c\M01.md
- niveau: 5eme
  module: 2
  module_titre: Les quatre opérations et les priorités
  pourquoi: '$7 + 3 \times 6$ n''a qu''un seul résultat, et une classe en donne deux. Tu

    connais ces règles depuis la 6ème : c''est leur application qui dérape.'
  diagnostic:
  - question: Calcule $7 + 3 \times 6$.
    reponse: $7 + 18 = 25$
  - question: Calcule $\left[24 - \left(5 + 3\right)\right] \times 2$.
    reponse: $\left[24 - 8\right] \times 2 = 32$
  - question: Calcule $2{,}75 \times 100$ et $430 \div 10$.
    reponse: $275$ et $43$
  - question: 'Divise 47 par 6 : quotient, reste, puis l''égalité.'
    reponse: ''
  - question: Calcule astucieusement $4 \times 17 \times 25$.
    reponse: ''
  lecons:
  - id: 5eme_M02_L1
    numero: '2.1'
    titre: Choisir l'opération, et la poser sur des décimaux
    retenir:
    - '**Addition** $+$ : la **somme** de deux **termes**.'
    - '**Soustraction** $-$ : la **différence** de deux **termes**.'
    - '**Multiplication** $\times$ : le **produit** de deux **facteurs**.'
    - '**Division** $\div$ : le **quotient** du **dividende** par le **diviseur**.'
    - Somme, différence, produit, quotient sont des **résultats** ; les autres mots nomment les
    methode:
      titre: Choisir la bonne opération
      etapes:
      - 'Souligne **la question** : que cherche-t-on ?'
      - 'Repère les mots indices : « en tout » $\to$ addition ; « il reste » $\to$ soustraction ;'
      - Écris l'opération et pose-la.
      - Termine par une phrase-réponse avec l'unité.
    exemple_resolu: 'Rakieta verse $25{,}6$ L dans un bidon, ajoute $7{,}45$ L, retire $12{,}75$ L.

      Que reste-t-il ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Addition. On écrit $25{,}60$ pour aligner. | $25{,}60 + 7{,}45 = 33{,}05$ L |

      | La quantité diminue : soustraction. | $33{,}05 - 12{,}75 = 20{,}30$ L |

      | Phrase-réponse. | Il reste $20{,}3$ L. |

      | **Vérification :** $20{,}30 + 12{,}75 = 33{,}05$ ✓ | |'
    erreurs_frequentes:
    - erreur: aligner $25{,}6$ et $7{,}45$ par la droite.
      correction: 'on aligne

        les virgules : $25{,}60$ sur $7{,}45$.'
    - erreur: « la somme de 6 et 7 est 42 ».
      correction: 'la **somme** est 13 ;

        42 est leur **produit**.'
    declic: null
    figures: []
  - id: 5eme_M02_L2
    numero: '2.2'
    titre: Par 10, 100, 1 000, et la division euclidienne
    retenir:
    - '**Multiplier** déplace la virgule de 1, 2 ou 3 rangs vers la **droite** :'
    - '**Diviser** la déplace d''autant vers la **gauche** : $2\,500 \div 100 = 25$.'
    - 'Si les chiffres manquent, on **complète par des zéros** : $7 \div 100 = 0{,}07$.'
    methode:
      titre: Contrôler une division euclidienne
      etapes:
      - Écris $\text{dividende} = \text{diviseur} \times \text{quotient} + \text{reste}$.
      - 'Effectue le membre de droite : tu retrouves le dividende.'
      - 'Compare le reste au diviseur : il doit être plus petit.'
      - Sinon, corrige le quotient.
    exemple_resolu: 'Une école de Sabou répartit 250 cahiers entre 8 classes.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Partager en 8 parts égales. | $250 \div 8$ |

      | $8 \times 31 = 248$, et $8 \times 32$ dépasse. | quotient $= 31$ |

      | On retire les cahiers distribués. | $250 - 248 = 2$, reste $= 2$ |

      | **Vérification :** $8 \times 31 + 2 = 250$ ✓ et $2 < 8$ ✓ | |'
    erreurs_frequentes:
    - erreur: $2{,}75 \times 100 = 2{,}7500$.
      correction: 'des zéros à droite ne

        changent rien ; la virgule avance de deux rangs : $275$.'
    - erreur: accepter $53 = 8 \times 5 + 13$.
      correction: 'le calcul redonne 53,

        mais $13 > 8$ : $53 = 8 \times 6 + 5$.'
    declic: null
    figures:
    - figures/m02_f2.svg
  - id: 5eme_M02_L3
    numero: '2.3'
    titre: 'Les priorités : parenthèses et crochets'
    retenir:
    - 'Une parenthèse **oblige** à commencer par ce qu''elle contient : $3 + 5 \times 2 = 13$, mais'
    methode:
      titre: Calculer une expression avec priorités
      etapes:
      - Calcule la parenthèse la plus intérieure, puis le crochet.
      - Effectue les multiplications et divisions, de gauche à droite.
      - Effectue les additions et soustractions, de gauche à droite.
      - Recopie **chaque étape sur une nouvelle ligne**.
    exemple_resolu: 'Moussa achète 3 cahiers à 200 FCFA et 2 stylos à 150 FCFA, et paie avec

      $1\,000$ FCFA. Que lui rend-on ? Une seule expression.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La dépense se retire **en bloc** : entre parenthèses. | $1\,000 - \left(3 \times 200 + 2 \times
      150\right)$ |

      | Dans la parenthèse, les multiplications d''abord. | $= 1\,000 - \left(600 + 300\right)$ |

      | Puis la soustraction. | $= 1\,000 - 900 = 100$ |

      | **Vérification :** la dépense frôle $1\,000$ FCFA, la monnaie doit être petite ✓ | |'
    erreurs_frequentes:
    - erreur: $7 + 3 \times 6 = 10 \times 6 = 60$.
      correction: '$\times$ et $\div$

        passent avant $+$ et $-$, donc $7 + 18 = 25$.'
    - erreur: écrire $1\,000 - 600 + 300$ pour « je retire la dépense ».
      correction: cette ligne vaut 700. Ce qu'on retire en bloc s'écrit entre parenthèses.
    declic: '$7 + 3 \times 6$ te semble faire 60 ? — Le blocage n''est pas dans les tables, il est dans
      la **lecture** : tu lis la ligne comme une phrase. Une expression est un empilement de **blocs**.
      Entoure chaque multiplication au crayon avant d''écrire. #### MÉTHODE : Calculer une expression
      avec priorités 1. Calcule la parenthèse la plus intérieure, puis le crochet. 2. Effectue les multiplications
      et divisions, de gauche à droite. 3. Effectue les additions et soustractions, de gauche à droite.
      4. Recopie **chaque étape sur une nouvelle ligne**.'
    figures:
    - figures/m02_f3.svg
  - id: 5eme_M02_L4
    numero: '2.4'
    titre: Calcul astucieux et problèmes à plusieurs étapes
    retenir:
    - '**Commutativité** : $a + b = b + a$ et $a \times b = b \times a$.'
    - '**Associativité** : $\left(a \times b\right) \times c = a \times \left(b \times c\right)$.'
    - '**Distributivité** :'
    - 'Soustraction et division ne sont **ni** commutatives **ni** associatives : $20 - 8 \neq 8 - 20$.'
    methode:
      titre: Résoudre un problème à plusieurs étapes
      etapes:
      - Repère la question finale, écarte les données inutiles.
      - Écris la liste des étapes avant tout calcul.
      - Effectue chaque étape en cherchant le couple rond.
      - Contrôle par un ordre de grandeur, puis la phrase-réponse.
    exemple_resolu: 'Une coopérative de Dédougou achète 25 bidons d''huile de 4 L, le litre à

      800 FCFA, et revend tout pour $95\,000$ FCFA. Son bénéfice ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le volume total : le couple 25 et 4 donne 100. | $25 \times 4 = 100$ L |

      | Le prix d''achat, 100 L à 800 FCFA. | $100 \times 800 = 80\,000$ FCFA |

      | Le bénéfice reste de la vente. | $95\,000 - 80\,000 = 15\,000$ FCFA |

      | **Vérification :** 100 L à environ $1\,000$ FCFA feraient $100\,000$ FCFA ✓ | |'
    erreurs_frequentes:
    - erreur: casser un couple rond, $4 \times 17 = 68$ puis $68 \times 25$.
      correction: on rapproche 4 et 25, puis $17 \times 100 = 1\,700$.
    - erreur: $5 \times \left(3 + 2\right) = 5 \times 3 + 2$.
      correction: 'le

        facteur se distribue sur **les deux** termes : $15 + 10 = 25$.'
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Complète : a) dans $14 + 9$, le résultat s''appelle la … ; b) dans $8 \times 5$,

      8 et 5 sont les … ; c) dans $30 \div 6$, 30 est le … et 6 est le … .'
    correction: a) la somme ; b) les facteurs ; c) 30 dividende, 6 diviseur.
  - numero: 2
    etoiles: 1
    enonce: 'Indique l''opération, sans calculer : a) partager 24 mangues entre 4 enfants ;

      b) ajouter 350 et 480 FCFA ; c) 5 cahiers à 250 FCFA pièce ; d) 5 sacs de 25 kg ; e) $1\,200$ FCFA

      dépensés sur $5\,000$ FCFA.'
    correction: 'a) division ; b) addition ; c) multiplication ; d) multiplication ;

      e) soustraction.'
  - numero: 3
    etoiles: 1
    enonce: 'Complète : dans $38 = 5 \times 7 + 3$, le dividende est … , le diviseur est … ,

      le quotient est … , le reste est … .'
    correction: Dividende 38, diviseur 5, quotient 7, reste 3.
  - numero: 4
    etoiles: 1
    enonce: 'Donne quotient et reste : a) $47 \div 6$ ; b) $100 \div 7$ ; c) $85 \div 9$.'
    correction: a) quotient 7, reste 5 ; b) 14 et 2 ; c) 9 et 4.
  - numero: 5
    etoiles: 1
    enonce: 'Pose et effectue : a) $4{,}5 + 3{,}2$ ; b) $12{,}7 - 5{,}4$ ; c) $3{,}5 + 12{,}48$.'
    correction: a) $7{,}7$ ; b) $7{,}3$ ; c) $3{,}50 + 12{,}48 = 15{,}98$.
  - numero: 6
    etoiles: 1
    enonce: 'Pose et effectue : a) $25{,}6 + 7{,}45$ ; b) $40 - 12{,}75$.'
    correction: a) $25{,}60 + 7{,}45 = 33{,}05$ ; b) $40{,}00 - 12{,}75 = 27{,}25$.
  - numero: 7
    etoiles: 1
    enonce: 'Pose et effectue : a) $12{,}4 \times 6$ ; b) $2{,}75 \times 8$.'
    correction: 'a) $744$, une décimale : $74{,}4$ ; b) $2\,200$, deux décimales : $22$.'
  - numero: 8
    etoiles: 1
    enonce: 'Calcule : a) $34 \times 10$ ; b) $2{,}75 \times 100$ ; c) $5{,}6 \times 1\,000$.'
    correction: a) $340$ ; b) $275$ ; c) $5\,600$.
  - numero: 9
    etoiles: 1
    enonce: 'Calcule : a) $430 \div 10$ ; b) $2\,500 \div 100$ ; c) $7\,000 \div 1\,000$.'
    correction: a) $43$ ; b) $25$ ; c) $7$.
  - numero: 10
    etoiles: 1
    enonce: 'Complète : a) $4{,}3 \times$ … $= 430$ ; b) … $\div 100 = 6{,}5$ ;

      c) $0{,}75 \times$ … $= 750$.'
    correction: a) $100$ ; b) $650$ ; c) $1\,000$.
  - numero: 11
    etoiles: 1
    enonce: 'Calcule : a) $6 \times 3 + 2 \times 9$ ; b) $7 + 3 \times 6$ ;

      c) $36 - 4 \times 5$.'
    correction: a) $18 + 18 = 36$ ; b) $7 + 18 = 25$ ; c) $36 - 20 = 16$.
  - numero: 12
    etoiles: 1
    enonce: 'Calcule : a) $54 \div 9 + 7$ ; b) $100 - 36 \div 4$ ; c) $9 + 18 \div 3$.'
    correction: a) $6 + 7 = 13$ ; b) $100 - 9 = 91$ ; c) $9 + 6 = 15$.
  - numero: 13
    etoiles: 1
    enonce: 'Calcule : a) $\left(14 + 6\right) \times 4$ ; b) $\left(25 - 9\right) \div 4$ ;

      c) $8 \times \left(5 + 7\right)$.'
    correction: a) $80$ ; b) $4$ ; c) $96$.
  - numero: 14
    etoiles: 1
    enonce: 'Calcule : a) $\left(15 + 5\right) \times 2 - 10$ ;

      b) $50 - \left(6 + 4\right) \times 3$.'
    correction: a) $40 - 10 = 30$ ; b) $50 - 30 = 20$.
  - numero: 15
    etoiles: 1
    enonce: 'Vrai ou faux ? a) $7 + 3 \times 6 = 60$. b) $\left(7 + 3\right) \times 6 = 60$.

      c) $20 - 5 \times 2 = 30$.'
    correction: 'a) Faux : 25. b) Vrai. c) Faux : $20 - 10 = 10$.'
  - numero: 16
    etoiles: 1
    enonce: 'Quelle propriété a été utilisée ?

      a) $7 \times 25 \times 4 = 7 \times \left(25 \times 4\right)$ ; b) $19 + 46 = 46 + 19$ ;

      c) $6 \times \left(20 + 3\right) = 6 \times 20 + 6 \times 3$.'
    correction: a) associativité ; b) commutativité ; c) distributivité.
  - numero: 17
    etoiles: 1
    enonce: 'Développe, puis calcule : a) $4 \times \left(10 + 3\right)$ ;

      b) $5 \times \left(20 - 2\right)$ ; c) $2 \times \left(300 + 500\right)$.'
    correction: a) $40 + 12 = 52$ ; b) $100 - 10 = 90$ ; c) $600 + 1\,000 = 1\,600$.
  - numero: 18
    etoiles: 1
    enonce: 'Calcule : a) $50 \times 17 \times 2$ ; b) $4 \times 39 \times 25$ ;

      c) $47 \times 0 \times 12$ ; d) $36 \times 1$ ; e) $58 + 0$.


      ### Entraînement ★★'
    correction: a) $1\,700$ ; b) $3\,900$ ; c) 0, le facteur 0 annule le produit ; d) 36 ; e) 58.
  - numero: 19
    etoiles: 2
    enonce: 'Chaque égalité peut-elle être la division euclidienne de 53 par 8 ? Justifie.

      a) $53 = 8 \times 6 + 5$ ; b) $53 = 8 \times 5 + 13$ ;

      c) $53 = 8 \times 6 + 9$.'
    correction: 'a) **Oui** : $8 \times 6 + 5 = 53$ et $5 < 8$. b) **Non** : $13 > 8$. c) **Non** :

      $8 \times 6 + 9 = 57 \neq 53$.'
  - numero: 20
    etoiles: 2
    enonce: 'Calcule : a) $\left[24 - \left(5 + 3\right)\right] \times 2$ ;

      b) $2 \times \left[50 - \left(3 \times 6 + 2\right)\right]$.'
    correction: a) $\left[24 - 8\right] \times 2 = 32$ ; b) $2 \times 30 = 60$.
  - numero: 21
    etoiles: 2
    enonce: 'Place les parenthèses pour que ce soit vrai : a) $3 + 5 \times 2 = 16$ ;

      b) $12 - 4 \times 2 = 16$ ; c) $20 \div 2 + 8 = 2$.'
    correction: 'a) $\left(3 + 5\right) \times 2$ ; b) $\left(12 - 4\right) \times 2$ ;

      c) $20 \div \left(2 + 8\right)$.'
  - numero: 22
    etoiles: 2
    enonce: 'Complète pour obtenir un nombre rond, puis calcule :

      a) $2 \times 43 \times$ … $= 43 \times 10$ ; b) $25 \times 37 \times$ … $= 37 \times 100$ ;

      c) $125 \times 9 \times$ … $= 9 \times 1\,000$.'
    correction: 'a) $\mathbf{5}$, soit $430$ ; b) $\mathbf{4}$, soit $3\,700$ ; c) $\mathbf{8}$,

      soit $9\,000$.'
  - numero: 23
    etoiles: 2
    enonce: 'Aminata achète 6 cahiers à 200 FCFA et 4 stylos à 150 FCFA. Écris l''expression

      du prix total et calcule.'
    correction: $6 \times 200 + 4 \times 150 = 1\,800$ FCFA.
  - numero: 24
    etoiles: 2
    enonce: 'Un maçon pose 12 rangées de 25 briques. a) Combien de briques ? b) Il en casse

      15 : combien en reste-t-il ?'
    correction: a) $12 \times 25 = 300$ briques ; b) $285$ briques.
  - numero: 25
    etoiles: 2
    enonce: 'Un commerçant achète 6 paquets de 50 savons à 100 FCFA le savon. a) Combien de

      savons ? b) Le prix total, astucieusement ?


      #### Entraînement intensif : mener un calcul à plusieurs étages


      *Écris l''expression complète avant de calculer.*'
    correction: a) $300$ savons ; b) $300 \times 100 = 30\,000$ FCFA.
  - numero: 26
    etoiles: 2
    enonce: 'Calcule : a) $\left[45 - \left(7 \times 4 + 5\right)\right] \div 4$ ;

      b) $3 \times \left[20 - \left(12 \div 4\right)\right]$.'
    correction: a) $\left[45 - 33\right] \div 4 = 3$ ; b) $3 \times \left[20 - 3\right] = 51$.
  - numero: 27
    etoiles: 2
    enonce: 'Calcule astucieusement : a) $0{,}5 \times 24 + 0{,}5 \times 16$ ;

      b) $12 \times 25 - 8 \times 25$.'
    correction: a) $0{,}5 \times 40 = 20$ ; b) $4 \times 25 = 100$ (facteur commun).
  - numero: 28
    etoiles: 2
    enonce: 'Un car transporte 52 passagers à l''aller et 48 au retour, sur 5 voyages

      identiques. Combien de passagers en tout, par un calcul astucieux ?'
    correction: $\left(52 + 48\right) \times 5 = 500$ passagers.
  - numero: 29
    etoiles: 2
    enonce: 'Un planteur d''Orodara vend 250 kg de noix d''anacarde à 600 FCFA le kg.

      a) Sa recette ? b) Il a dépensé $90\,000$ FCFA pour la récolte : son bénéfice ?'
    correction: a) $150\,000$ FCFA ; b) $150\,000 - 90\,000 = 60\,000$ FCFA.
  - numero: 30
    etoiles: 2
    enonce: 'Un éleveur de Kongoussi achète 3 sacs d''aliment à $12\,500$ FCFA et 2 pierres à

      lécher à $1\,500$ FCFA pièce, et paie avec $50\,000$ FCFA. Écris une seule expression de la somme

      qu''on lui rend, puis calcule-la.


      ### ★★★ Défis de maîtrise'
    correction: $50\,000 - \left(3 \times 12\,500 + 2 \times 1\,500\right) = 9\,500$ FCFA.
  - numero: 31
    etoiles: 3
    enonce: 'Sansan a planté 25 rangées de 4 anacardiers ; chaque arbre a donné 12 kg de

      noix. Un premier acheteur propose 500 FCFA le kg, mais Sansan paiera $40\,000$ FCFA de transport
      ;

      un second prend les noix au verger à 450 FCFA le kg. Aide Sansan à choisir.'
    correction: 'La masse totale d''abord, sans elle aucune offre n''est chiffrable :

      $25 \times 4 = 100$ arbres, soit $1\,200$ kg. Premier : $1\,200 \times 500 - 40\,000 = 560\,000$

      FCFA ; second : $540\,000$ FCFA. Le **premier**, $20\,000$ FCFA de plus.'
  - numero: 32
    etoiles: 3
    enonce: 'Retrouve le départ. a) $37 \times 98 = 37 \times 100 - 37 \times \square$ : que

      vaut le carré, et le produit ? b) Même question pour $46 \times 102 = 46 \times 100 + 46 \times

      \square$. c) $\left(a + 7\right) \times 5$ vaut 60 : que vaut $a$ ? d) Rakieta multiplie un nombre

      par 4, ajoute 12, et trouve 40 : lequel ?'
    correction: 'On remonte par l''opération inverse ou par la coupure du nombre. a) $98 = 100 - 2$ :

      $\square = 2$ et $3\,626$. b) $\square = 2$ et $4\,692$. c) $60 \div 5 = 12$, donc $a = \mathbf{5}$.

      d) $\left(40 - 12\right) \div 4 = \mathbf{7}$.'
  - numero: 33
    etoiles: 3
    enonce: 'Awa affirme : « pour multiplier par 99, on multiplie par 100 puis on retire le

      nombre. » a) Vérifie avec 6, 23 et $4{,}5$. b) Pourquoi cela marche-t-il pour **tout** nombre ?

      c) Énonce la règle pour 101 et justifie-la. d) Applique-la à $37 \times 101$.'
    correction: 'a) $594 = 600 - 6$ ; $2\,277 = 2\,300 - 23$ ; $445{,}5 = 450 - 4{,}5$.

      b) $a \times 99 = a \times \left(100 - 1\right) = a \times 100 - a$ par distributivité : aucun

      nombre particulier n''intervient. c) $a \times 101 = a \times 100 + a$. d) $3\,737$.'
  - numero: 34
    etoiles: 3
    enonce: '« Talato achète 5 cahiers à 350 FCFA et 3 stylos à 200 FCFA pièce, et paie

      avec $5\,000$ FCFA ; combien lui rend-on ? » Voici une copie d''élève.


      > Ligne 1 : $5 \times 350 = 1\,750$

      > Ligne 2 : $3 \times 200 = 600$

      > Ligne 3 : $5\,000 - 1\,750 + 600 = 5\,000 - 2\,350$

      > Ligne 4 : $= 2\,650$


      a) Le nombre final est-il bon ? b) Une ligne est pourtant fausse **telle qu''elle est écrite** :

      laquelle, et pourquoi ? c) Que vaudrait-elle avec les règles de priorité ? d) Réécris la résolution

      en une seule expression.'
    correction: 'a) **Oui**, $2\,650$ FCFA. b) La **ligne 3** : écrite ainsi, elle **ajoute** 600 au

      lieu de le retirer. c) Que des $+$ et des $-$, de gauche à droite : $3\,850$.

      d) $5\,000 - \left(5 \times 350 + 3 \times 200\right) = 2\,650$ FCFA. Un résultat juste ne prouve

      pas qu''une ligne le soit.'
  - numero: 35
    etoiles: 3
    enonce: 'Calcule $A$, $B$ et $C$, puis range-les dans l''ordre croissant.


      $$A = 3 \times \left[40 - \left(2 \times 7 + 6\right)\right] + 5 \times 4$$

      $$B = \left[100 - \left(45 + 15\right)\right] \div 4 + 2 \times 9$$

      $$C = 2{,}5 \times 4 \times \left(18 - 3 \times 6\right) + 7$$'
    correction: 'Parenthèse la plus intérieure d''abord. $A = 60 + 20 = 80$ ; $B = 10 + 18 = 28$ ;

      $C$ : la parenthèse vaut 0, donc $C = 7$. Ordre : $C < B < A$.'
  - numero: 36
    etoiles: 3
    enonce: 'Au marché de Manga, la caisse de Salamata contient $2\,500$ FCFA le matin.

      Elle vend 12 tas de tomates à 250 FCFA et 6 paquets de gombo à 500 FCFA, et ne dépense rien. Son

      étal est à 600 mètres de sa maison. Le soir elle compte $8\,000$ FCFA et dit que son compte est

      bon. Dis-lui si elle peut ranger sa caisse.'
    correction: 'La distance de 600 m est inutile. Recette : $3\,000 + 3\,000 = 6\,000$ FCFA, donc

      caisse attendue $8\,500$ FCFA. Elle compte $8\,000$ FCFA : il manque **500 FCFA**, elle ne peut
      pas

      ranger sa caisse.'
  fiche_revision:
  - '**Vocabulaire.** Somme et termes ; différence et termes ; produit et facteurs ; quotient, dividende

    et diviseur.'
  - '**Décimaux posés.** On aligne les **virgules** ; on complète par des zéros.'
  - '**Par 10, 100, 1 000.** La virgule avance vers la droite si on multiplie, recule si on divise.'
  - '**Division euclidienne.** dividende $=$ diviseur $\times$ quotient $+$ reste, avec **reste $<$

    diviseur**.'
  - '**Priorités.** Parenthèses, crochets ; puis $\times$ et $\div$ ; enfin $+$ et $-$, de gauche à

    droite.'
  - '**Calcul astucieux.** Couples ronds, coupure $\left(99 = 100 - 1\right)$, mise en facteur

    $\left(a \times b + a \times c = a \times \left(b + c\right)\right)$.'
  trouve_erreur:
  - faux: $7 + 3 \times 6 = 10 \times 6 = 60$
    correction: 'La multiplication est prioritaire : $7 + 18 = 25$.'
  - faux: $100 - 24 \div 4 = 76 \div 4 = 19$
    correction: 'La division d''abord : $100 - 6 = 94$.'
  - faux: $2{,}75 \times 100 = 2{,}7500$
    correction: 'La virgule avance de deux rangs : $275$.'
  - faux: $5 \times \left(3 + 2\right) = 5 \times 3 + 2$
    correction: 'Le facteur se distribue sur les **deux** termes : $15 + 10 = 25$.'
  cartographie_lacunes:
  - lacune: Priorités ignorées, division mal posée
    bloque_en: opérations dans D, équations
  source_path: remediation\5eme\modules_c\M02.md
- niveau: 5eme
  module: 3
  module_titre: 'Les fractions : sens, simplification, comparaison'
  pourquoi: 'Trois erreurs reviennent chaque année : additionner les dénominateurs, ne pas simplifier,
    croire $\frac{1}{5}$ plus grand que $\frac{1}{3}$. Tout le chapitre des fractions de 5ème s''appuie
    sur ces gestes.'
  diagnostic:
  - question: Calcule les $\frac{2}{3}$ de $24$.
    reponse: $24 \div 3 \times 2 = 16$
  - question: Simplifie $\frac{12}{18}$ jusqu'à la fraction irréductible.
    reponse: $\frac{2}{3}$
  - question: Compare $\frac{3}{7}$ et $\frac{3}{5}$.
    reponse: 'même numérateur, le plus petit dénominateur gagne : $\frac{3}{7} < \frac{3}{5}$'
  - question: Calcule $\frac{5}{12} + \frac{4}{12}$, puis $1 - \frac{3}{4}$.
    reponse: $\frac{9}{12} = \frac{3}{4}$ ; $\frac{4}{4} - \frac{3}{4} = \frac{1}{4}$
  - question: Écris $\frac{3}{10}$ et $\frac{7}{100}$ sous forme décimale.
    reponse: $0{,}3$ et $0{,}07$
  lecons:
  - id: 5eme_M03_L1
    numero: '3.1'
    titre: Sens de la fraction et fraction d'une quantité
    retenir:
    - 'Dénominateur (en bas) : en combien de parts **égales** on partage le tout, jamais $0$. Numérateur
      (en haut) : combien on en prend.'
    - 'Fraction d''une quantité : on **divise** par le dénominateur, on **multiplie** par le numérateur.
      $\frac{2}{3}$ de $24 = 24 \div 3 \times 2 = 16$.'
    - '$a < b$ : moins de $1$ ; $\frac{c}{c} = 1$ ; $a > b$ : plus de $1$, et $\frac{7}{4} = 1 + \frac{3}{4}$.'
    methode:
      titre: Calculer la fraction d'un nombre
      etapes:
      - Repère le tout.
      - 'Divise-le par le **dénominateur** : valeur d''une part.'
      - Multiplie par le **numérateur**.
      - Écris la réponse avec son unité.
    exemple_resolu: 'Un car plein de $48$ places : le tiers des passagers descend à Bobo-Dioulasso. Combien
      descendent, combien restent ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On divise par le dénominateur $3$. | $48 \div 3 = 16$ |

      | Numérateur $1$ : une seule part. | $\frac{1}{3}$ de $48 = 16$ passagers |

      | Le reste : les deux autres parts. | $48 - 16 = 32$ passagers |

      | **Vérification :** $16 + 32 = 48$ ✓ | |


      [SVG: figures/m03_f2.svg]

      *Figure 3.1 : L''unité partagée en cinquièmes : $\frac{3}{5}$ est à trois parts de $0$, $\frac{6}{5}$
      dépasse $1$ d''une part.*'
    erreurs_frequentes:
    - erreur: pour $\frac{2}{3}$ de $24$, calculer $24 \div 2 \times 3 = 36$.
      correction: 'on divise par le **dénominateur** : $24 \div 3 \times 2 = 16$.'
    - erreur: écrire $\frac{1}{3} = 0{,}3$.
      correction: $0{,}3 = \frac{3}{10}$ ; $\frac{1}{3}$ n'a pas d'écriture décimale exacte.
    declic: null
    figures:
    - figures/m03_f2.svg
  - id: 5eme_M03_L2
    numero: '3.2'
    titre: Fractions égales et simplification
    retenir:
    - 'Jamais d''addition ni de soustraction : on multiplie ou on divise, **en haut et en bas**. $\frac{1}{2}
      = \frac{2}{4} = \frac{4}{8}$.'
    - Simplifier, c'est diviser par un **diviseur commun**. Quand seul $1$ divise encore les deux, la
      fraction est **irréductible**.
    - 'Compléter $\frac{2}{5} = \frac{\dots}{15}$ : $5 \times 3 = 15$, donc $2 \times 3 = 6$.'
    - 'Divisibilité : par **2** si le dernier chiffre est pair, par **5** s''il vaut $0$ ou $5$, par **10**
      s''il vaut $0$, par **3** ou **9** si la somme des chiffres est dans la table de $3$ ou de $9$.'
    methode:
      titre: Rendre une fraction irréductible
      etapes:
      - 'Cherche un diviseur commun : essaie $2$, puis $3$, puis $5$.'
      - Divise les deux nombres par ce diviseur.
      - Recommence tant qu'un diviseur commun existe.
      - Arrête-toi quand seul $1$ divise encore les deux.
    exemple_resolu: 'Rends $\frac{12}{18}$ irréductible.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les deux sont pairs : on divise par $2$. | $\frac{12}{18} = \frac{6}{9}$ |

      | $6 = 3 \times 2$ et $9 = 3 \times 3$ : on divise par $3$. | $\frac{6}{9} = \frac{2}{3}$ |

      | Seul $1$ divise $2$ et $3$ : c''est terminé. | $\frac{2}{3}$ irréductible |

      | **Vérification :** $12 \div 6 = 2$, $18 \div 6 = 3$ ✓ | |'
    erreurs_frequentes:
    - erreur: 'ne diviser que le numérateur : $\frac{6}{8} = \frac{3}{8}$.'
      correction: $\frac{6}{8} = \frac{3}{4}$.
    - erreur: 'simplifier en soustrayant : $\frac{8}{12} = \frac{4}{8}$.'
      correction: 'on **divise** : $\frac{8 \div 4}{12 \div 4} = \frac{2}{3}$.'
    declic: null
    figures: []
  - id: 5eme_M03_L3
    numero: '3.3'
    titre: Comparer des fractions
    retenir:
    - 'Même dénominateur : le plus grand numérateur gagne. $\frac{3}{7} > \frac{2}{7}$.'
    - 'Même numérateur : la comparaison s''**inverse**, le plus **petit** dénominateur gagne. $\frac{1}{3}
      > \frac{1}{4}$.'
    - 'Comparaison à $1$ : $\frac{5}{4} > 1$, $\frac{3}{8} < 1$.'
    - 'Un dénominateur multiple de l''autre : on réécrit, puis on compare les numérateurs. $\frac{2}{3}
      = \frac{6}{9} > \frac{5}{9}$.'
    methode:
      titre: Comparer deux fractions
      etapes:
      - 'Dénominateurs égaux : compare les numérateurs.'
      - 'Numérateurs égaux : compare les dénominateurs **à l''envers**.'
      - Sinon, compare chaque fraction à $1$.
      - Sinon, réécris la fraction au petit dénominateur.
    exemple_resolu: 'Range dans l''ordre croissant $\frac{5}{8}$, $\frac{3}{4}$, $\frac{7}{8}$, $\frac{1}{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $2$ et $4$ divisent $8$ : on passe tout en huitièmes. | $\frac{1}{2} = \frac{4}{8}$ ; $\frac{3}{4}
      = \frac{6}{8}$ |

      | Mêmes parts : on range les numérateurs. | $4 < 5 < 6 < 7$ |

      | On revient aux écritures de départ. | $\frac{1}{2} < \frac{5}{8} < \frac{3}{4} < \frac{7}{8}$
      |

      | **Vérification :** $\frac{7}{8}$ est la plus proche de $1$ ✓ | |


      [SVG: figures/m03_f4.svg]

      *Figure 3.2 : Mêmes parts, on compte ; mêmes numérateurs, on regarde la taille des parts.*'
    erreurs_frequentes:
    - erreur: « $\frac{1}{5} > \frac{1}{3}$ car $5 > 3$ ».
      correction: 'à numérateur égal, plus les parts sont nombreuses, plus elles sont petites : $\frac{1}{5}
        < \frac{1}{3}$.'
    - erreur: comparer les numérateurs entre eux et les dénominateurs entre eux.
      correction: une fraction est **un** nombre ; on ramène les deux au même découpage.
    declic: null
    figures:
    - figures/m03_f4.svg
  - id: 5eme_M03_L4
    numero: '3.4'
    titre: Additionner, soustraire, écriture décimale
    retenir:
    - 'Le dénominateur ne bouge pas : le découpage du tout n''a pas changé. On **simplifie toujours**
      le résultat.'
    - 'Dénominateurs multiples : on réécrit la fraction au petit dénominateur. $\frac{2}{3} + \frac{1}{6}
      = \frac{4}{6} + \frac{1}{6} = \frac{5}{6}$.'
    - 'Le tout vaut $\frac{c}{c} = 1$. Pour soustraire d''un entier, on l''écrit en fractions : $1 = \frac{4}{4}$,
      $2 = \frac{8}{4}$.'
    - Le dénominateur $10$, $100$, $1\,000$ donne le rang de la dernière décimale ; dans l'autre sens,
      $0{,}25 = \frac{25}{100} = \frac{1}{4}$.
    - 'Réécrite avec $10$, $100$ ou $1\,000$, une fraction a une écriture décimale exacte : $\frac{2}{5}
      = \frac{4}{10} = 0{,}4$. Sinon, comme $\frac{1}{3}$, elle n''en a aucune.'
    methode:
      titre: Additionner ou soustraire deux fractions
      etapes:
      - Compare les dénominateurs ; s'ils sont identiques, passe à l'étape 3.
      - Si l'un est multiple de l'autre, réécris la fraction au petit dénominateur.
      - Opère sur les **numérateurs** seulement, garde le dénominateur.
      - Simplifie, puis compare le résultat à $1$.
    exemple_resolu: 'D''un bidon partagé en $12$ parts, on verse $\frac{5}{12}$ le matin et $\frac{3}{12}$
      à midi. Quelle fraction est versée, quelle fraction reste-t-il ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Mêmes parts : on additionne les numérateurs. | $\frac{5}{12} + \frac{3}{12} = \frac{8}{12}$ |

      | $8$ et $12$ sont dans la table de $4$. | $\frac{8}{12} = \frac{2}{3}$ |

      | Le bidon entier vaut $\frac{12}{12}$. | $\frac{12}{12} - \frac{8}{12} = \frac{4}{12} = \frac{1}{3}$
      |

      | **Vérification :** $\frac{2}{3} + \frac{1}{3} = 1$ ✓ | |'
    erreurs_frequentes:
    - erreur: $\frac{2}{5} + \frac{1}{5} = \frac{3}{10}$.
      correction: 'seuls les numérateurs s''ajoutent : $\frac{3}{5}$.'
    - erreur: soustraire d'un entier sans le convertir.
      correction: écris $1 = \frac{4}{4}$, puis $\frac{4}{4} - \frac{3}{4} = \frac{1}{4}$.
    declic: 'Si tu additionnes encore les dénominateurs — Écrire $\frac{2}{7} + \frac{3}{7} = \frac{5}{14}$,
      c''est prétendre que le champ a été recoupé. Le dénominateur dit **comment le tout est découpé**
      : le $7$ ne bouge pas. #### MÉTHODE : Additionner ou soustraire deux fractions 1. Compare les dénominateurs
      ; s''ils sont identiques, passe à l''étape 3. 2. Si l''un est multiple de l''autre, réécris la fraction
      au petit dénominateur. 3. Opère sur les **numérateurs** seulement, garde le dénominateur. 4. Simplifie,
      puis compare le résultat à $1$.'
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Nomme le numérateur et le dénominateur : a) $\frac{3}{4}\,;\,$ b) $\frac{5}{8}\,;\,$ c) $\frac{1}{6}$.'
    correction: a) $3$ et $4$. b) $5$ et $8$. c) $1$ et $6$.
  - numero: 2
    etoiles: 1
    enonce: 'Calcule : a) le tiers de $18\,;\,$ b) le quart de $24\,;\,$ c) le cinquième de $35$.'
    correction: a) $6$. b) $6$. c) $7$.
  - numero: 3
    etoiles: 1
    enonce: 'Calcule : a) les deux tiers de $12\,;\,$ b) les trois quarts de $20\,;\,$ c) les deux cinquièmes
      de $25$.'
    correction: a) $12 \div 3 \times 2 = 8$. b) $20 \div 4 \times 3 = 15$. c) $25 \div 5 \times 2 = 10$.
  - numero: 4
    etoiles: 1
    enonce: Sur $24$ cailloux, prends-en les $\frac{3}{8}$. Combien de cailloux prends-tu ?
    correction: $24 \div 8 \times 3 = 9$ cailloux.
  - numero: 5
    etoiles: 1
    enonce: Un champ est partagé en $7$ parcelles égales. Amadou plante $\frac{2}{7}$ du champ en mil.
      Sur combien de parcelles pousse le mil ?
    correction: $2$ parcelles.
  - numero: 6
    etoiles: 1
    enonce: 'Écris sous la forme d''un entier plus une fraction : a) $\frac{5}{4}\,;\,$ b) $\frac{7}{3}\,;\,$
      c) $\frac{9}{2}\,;\,$ d) $\frac{11}{5}\,;\,$ e) $\frac{9}{3}$.'
    correction: a) $1 + \frac{1}{4}$. b) $2 + \frac{1}{3}$. c) $4 + \frac{1}{2}$. d) $2 + \frac{1}{5}$.
      e) $3$ exactement.
  - numero: 7
    etoiles: 1
    enonce: 'Complète : a) $\frac{1}{2} = \frac{5}{\dots}\,;\,$ b) $\frac{2}{3} = \frac{8}{\dots}\,;\,$
      c) $\frac{3}{5} = \frac{\dots}{15}\,;\,$ d) $\frac{3}{4} = \frac{6}{\dots}$.'
    correction: a) $10$. b) $12$. c) $9$. d) $8$.
  - numero: 8
    etoiles: 1
    enonce: 'Simplifie : a) $\frac{2}{4}\,;\,$ b) $\frac{3}{9}\,;\,$ c) $\frac{4}{10}\,;\,$ d) $\frac{6}{9}$.'
    correction: a) $\frac{1}{2}$. b) $\frac{1}{3}$. c) $\frac{2}{5}$. d) $\frac{2}{3}$.
  - numero: 9
    etoiles: 1
    enonce: Parmi $\frac{2}{4}$, $\frac{3}{6}$, $\frac{4}{8}$ et $\frac{5}{9}$, lesquelles sont égales
      à $\frac{1}{2}$ ?
    correction: $\frac{2}{4}$, $\frac{3}{6}$ et $\frac{4}{8}$ ; pas $\frac{5}{9}$.
  - numero: 10
    etoiles: 1
    enonce: a) Simplifie $\frac{15}{25}$. b) Écris trois fractions égales à $\frac{2}{5}$.
    correction: a) $\frac{3}{5}$ (par $5$). b) Par exemple $\frac{4}{10}$, $\frac{6}{15}$, $\frac{8}{20}$.
  - numero: 11
    etoiles: 1
    enonce: 'Range par ordre croissant : $\frac{2}{9}\,;\,\frac{5}{9}\,;\,\frac{1}{9}\,;\,\frac{7}{9}$.'
    correction: $\frac{1}{9} < \frac{2}{9} < \frac{5}{9} < \frac{7}{9}$.
  - numero: 12
    etoiles: 1
    enonce: Sur une droite graduée de $0$ à $1$ partagée en huitièmes, place $\frac{3}{8}$, $\frac{5}{8}$
      et $\frac{7}{8}$. a) Range-les dans l'ordre croissant. b) Laquelle est la plus proche de $1$ ?
    correction: a) $\frac{3}{8} < \frac{5}{8} < \frac{7}{8}$. b) $\frac{7}{8}$.
  - numero: 13
    etoiles: 1
    enonce: 'Compare : a) $\frac{3}{8}$ et $\frac{5}{8}\,;\,$ b) $\frac{1}{2}$ et $\frac{1}{6}\,;\,$ c)
      $\frac{6}{11}$ et $\frac{4}{11}$.'
    correction: a) $\frac{3}{8} < \frac{5}{8}$. b) $\frac{1}{2} > \frac{1}{6}$ (même numérateur). c) $\frac{6}{11}
      > \frac{4}{11}$.
  - numero: 14
    etoiles: 1
    enonce: 'Calcule : a) $\frac{2}{7} + \frac{3}{7}\,;\,$ b) $\frac{1}{5} + \frac{3}{5}\,;\,$ c) $\frac{4}{9}
      + \frac{2}{9}\,;\,$ d) $\frac{2}{9} + \frac{4}{9}$.'
    correction: a) $\frac{5}{7}$. b) $\frac{4}{5}$. c) $\frac{6}{9} = \frac{2}{3}$. d) $\frac{6}{9} =
      \frac{2}{3}$.
  - numero: 15
    etoiles: 1
    enonce: 'Calcule, puis simplifie si possible : a) $\frac{5}{6} - \frac{2}{6}\,;\,$ b) $\frac{7}{8}
      - \frac{3}{8}\,;\,$ c) $\frac{9}{10} - \frac{4}{10}\,;\,$ d) $\frac{5}{6} - \frac{1}{6}$.'
    correction: a) $\frac{3}{6} = \frac{1}{2}$. b) $\frac{4}{8} = \frac{1}{2}$. c) $\frac{5}{10} = \frac{1}{2}$.
      d) $\frac{4}{6} = \frac{2}{3}$.
  - numero: 16
    etoiles: 1
    enonce: 'a) Écris sous forme décimale : $\frac{9}{10}\,;\,\frac{37}{100}\,;\,\frac{5}{1\,000}\,;\,\frac{23}{100}$.
      b) Écris sous forme de fraction décimale, puis simplifie : $0{,}6\,;\,0{,}75\,;\,2{,}5\,;\,1{,}25$.


      ### Entraînement ★★'
    correction: a) $0{,}9$ ; $0{,}37$ ; $0{,}005$ ; $0{,}23$. b) $\frac{6}{10} = \frac{3}{5}$ ; $\frac{75}{100}
      = \frac{3}{4}$ ; $\frac{25}{10} = \frac{5}{2}$ ; $\frac{125}{100} = \frac{5}{4}$.
  - numero: 17
    etoiles: 2
    enonce: 'Simplifie jusqu''à la fraction irréductible : a) $\frac{8}{12}\,;\,$ b) $\frac{9}{12}\,;\,$
      c) $\frac{15}{20}$.'
    correction: a) $\frac{2}{3}$ (par $4$). b) $\frac{3}{4}$. c) $\frac{3}{4}$.
  - numero: 18
    etoiles: 2
    enonce: 'Simplifie : a) $\frac{250}{65}\,;\,$ b) $\frac{25}{40}\,;\,$ c) $\frac{11}{44}$.'
    correction: a) $\frac{50}{13}$, irréductible. b) $\frac{5}{8}$. c) $\frac{1}{4}$.
  - numero: 19
    etoiles: 2
    enonce: 'Recopie et complète : $\frac{3}{7} = \frac{\dots}{21} = \frac{15}{\dots} = \frac{\dots}{56}$.'
    correction: $\frac{3}{7} = \frac{9}{21} = \frac{15}{35} = \frac{24}{56}$ (facteurs $3$, $5$ et $8$).
  - numero: 20
    etoiles: 2
    enonce: 'Compare en indiquant la règle utilisée : a) $\frac{4}{9}$ et $\frac{7}{9}\,;\,$ b) $\frac{3}{5}$
      et $\frac{3}{8}\,;\,$ c) $\frac{5}{4}$ et $1\,;\,$ d) $\frac{1}{3}$ et $\frac{5}{9}$.'
    correction: 'a) Même dénominateur : $\frac{4}{9} < \frac{7}{9}$. b) Même numérateur : $\frac{3}{5}
      > \frac{3}{8}$. c) $\frac{5}{4} > 1$. d) $\frac{1}{3} = \frac{3}{9} < \frac{5}{9}$.'
  - numero: 21
    etoiles: 2
    enonce: 'Calcule : a) $\frac{5}{6} - \frac{2}{3}\,;\,$ b) $\frac{3}{4} - \frac{1}{2}\,;\,$ c) $\frac{7}{10}
      - \frac{1}{5}\,;\,$ d) $1 - \frac{2}{5}$.'
    correction: a) $\frac{5}{6} - \frac{4}{6} = \frac{1}{6}$. b) $\frac{1}{4}$. c) $\frac{7}{10} - \frac{2}{10}
      = \frac{1}{2}$. d) $\frac{5}{5} - \frac{2}{5} = \frac{3}{5}$.
  - numero: 22
    etoiles: 2
    enonce: 'Complète : a) $\frac{2}{9} + \dots = \frac{7}{9}\,;\,$ b) $\dots - \frac{3}{11} = \frac{5}{11}\,;\,$
      c) $\frac{4}{6} + \dots = 1$.'
    correction: a) $\frac{5}{9}$. b) $\frac{8}{11}$. c) $\frac{2}{6} = \frac{1}{3}$.
  - numero: 23
    etoiles: 2
    enonce: 'Un champ de $8$ parts égales : $\frac{2}{8}$ en mil, $\frac{3}{8}$ en sorgho, le reste en
      niébé. a) Quelle fraction en mil et sorgho réunis ? b) Quelle fraction en niébé ? Simplifie.'
    correction: a) $\frac{5}{8}$. b) $\frac{8}{8} - \frac{5}{8} = \frac{3}{8}$, irréductible.
  - numero: 24
    etoiles: 2
    enonce: 'À Titao, un maçon a utilisé les $\frac{8}{12}$ d''un sac de ciment. a) Simplifie cette fraction.
      b) Le sac contenait $24$ kg : quelle masse a-t-il utilisée ?'
    correction: a) $\frac{2}{3}$. b) $24 \div 3 \times 2 = 16$ kg.
  - numero: 25
    etoiles: 2
    enonce: À Réo, une commerçante a $60$ œufs. Elle en vend les $\frac{3}{5}$ le matin, puis $12$ de
      plus le soir. a) Combien en vend-elle le matin ? b) Combien lui en reste-t-il le soir ?
    correction: a) $60 \div 5 \times 3 = 36$ œufs. b) $60 - 36 - 12 = 12$ œufs.
  - numero: 26
    etoiles: 2
    enonce: 'À Dano, un maçon a monté $\frac{1}{4}$ d''un mur lundi et $\frac{1}{2}$ mardi. a) Quelle
      fraction a-t-il montée en deux jours ? b) Quelle fraction reste-t-il ?


      ### Entraînement intensif'
    correction: a) $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}$. b) $\frac{1}{4}$.
  - numero: 27
    etoiles: 2
    enonce: 'Calcule et simplifie : a) $\frac{3}{10} + \frac{5}{10}\,;\,$ b) $\frac{1}{4} + \frac{1}{4}\,;\,$
      c) $\frac{7}{9} - \frac{4}{9}\,;\,$ d) $\frac{11}{12} - \frac{5}{12}\,;\,$ e) $\frac{9}{10} - \frac{3}{10}$.'
    correction: a) $\frac{8}{10} = \frac{4}{5}$. b) $\frac{2}{4} = \frac{1}{2}$. c) $\frac{3}{9} = \frac{1}{3}$.
      d) $\frac{6}{12} = \frac{1}{2}$. e) $\frac{6}{10} = \frac{3}{5}$.
  - numero: 28
    etoiles: 2
    enonce: 'Calcule : a) $\frac{2}{3} + \frac{1}{6}\,;\,$ b) $\frac{1}{2} + \frac{1}{4} + \frac{1}{8}\,;\,$
      c) $1 - \frac{2}{3}\,;\,$ d) $2 - \frac{5}{4}\,;\,$ e) $\frac{3}{2} - \frac{5}{6}$.'
    correction: a) $\frac{4}{6} + \frac{1}{6} = \frac{5}{6}$. b) $\frac{4+2+1}{8} = \frac{7}{8}$. c) $\frac{1}{3}$.
      d) $\frac{8}{4} - \frac{5}{4} = \frac{3}{4}$. e) $\frac{9}{6} - \frac{5}{6} = \frac{2}{3}$.
  - numero: 29
    etoiles: 2
    enonce: 'Quelle fraction faut-il : a) retirer à $\frac{5}{6}$ pour obtenir $\frac{1}{3}$ ? b) ajouter
      à $\frac{3}{8}$ pour obtenir $1$ ? c) ajouter à $\frac{2}{5}$ pour obtenir $\frac{9}{10}$ ?'
    correction: a) $\frac{5}{6} - \frac{2}{6} = \frac{1}{2}$. b) $\frac{5}{8}$. c) $\frac{9}{10} - \frac{4}{10}
      = \frac{1}{2}$.
  - numero: 30
    etoiles: 2
    enonce: 'Lesquels sont justes ? Corrige les autres. a) $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}\,;\,$
      b) $\frac{2}{5} + \frac{2}{5} = \frac{4}{10}\,;\,$ c) $\frac{6}{7} - \frac{1}{7} = \frac{5}{7}$.


      ### ★★★ Défis de maîtrise'
    correction: 'a) Juste. b) Faux : les dénominateurs ont été additionnés, $\frac{2}{5} + \frac{2}{5}
      = \frac{4}{5}$. c) Juste.'
  - numero: 31
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une règle ou un contre-exemple. a) En ajoutant $1$ au numérateur
      et $1$ au dénominateur, on obtient une fraction égale. b) Une fraction dont le numérateur dépasse
      le dénominateur est plus grande que $1$. c) Simplifier une fraction, c'est la rendre plus petite.
      d) Toute fraction de dénominateur $10$, $100$ ou $1\,000$ possède une écriture décimale exacte.
    correction: 'Un contre-exemple suffit. a) **Faux** : $\frac{1}{2}$ donnerait $\frac{2}{3}$, plus grand.
      b) **Vrai** : $\frac{7}{4} = 1 + \frac{3}{4}$. c) **Faux** : seule l''écriture change, $\frac{8}{12}
      = \frac{2}{3}$. d) **Vrai** : le dénominateur donne le rang de la dernière décimale.'
  - numero: 32
    etoiles: 3
    enonce: 'a) En simplifiant une fraction par $8$, on obtient $\frac{5}{7}$. Retrouve-la. b) Une autre,
      simplifiée par $6$, donne $\frac{3}{4}$ : retrouve-la. c) Une troisième a pour dénominateur $45$
      et vaut $\frac{2}{9}$ une fois simplifiée : quel est son numérateur ? d) Explique en une phrase
      le geste commun.'
    correction: 'a) $\frac{40}{56}$. b) $\frac{18}{24}$. c) $45 \div 9 = 5$, donc numérateur $2 \times
      5 = 10$ : $\frac{10}{45}$. d) On cherche le facteur, puis on multiplie le haut et le bas par ce
      facteur.'
  - numero: 33
    etoiles: 3
    enonce: 'Un camarade affirme : « $\frac{1}{5}$ est plus grand que $\frac{1}{3}$, parce que $5$ est
      plus grand que $3$. » Explique-lui son erreur en t''aidant d''un dessin de deux bandes, puis donne
      la bonne comparaison.'
    correction: 'Le dénominateur n''est pas un compteur de parts prises. Deux bandes de même longueur,
      l''une coupée en trois, l''autre en cinq : la part coloriée de la première est plus large. Donc
      $\frac{1}{5} < \frac{1}{3}$.'
  - numero: 34
    etoiles: 3
    enonce: À Solenzo, un producteur récolte $84$ sacs de maïs. Il garde $\frac{1}{7}$ de la récolte pour
      sa famille, puis vend la moitié de ce qui reste. a) Combien de sacs garde-t-il ? b) Combien en vend-il
      ? c) Combien lui en reste-t-il ?
    correction: 'Le second calcul porte sur le reste, pas sur la récolte. a) $84 \div 7 = 12$ sacs. b)
      $84 - 12 = 72$, puis $72 \div 2 = 36$ sacs vendus. c) $36$ sacs. Contrôle : $12 + 36 + 36 = 84$.'
  - numero: 35
    etoiles: 3
    enonce: 'À Ténado, un paysan a divisé son champ en $12$ bandes égales. Il sème $\frac{5}{12}$ du champ
      en mil et $\frac{4}{12}$ en sorgho, le niébé occupera le reste. Sa femme a posé une condition :
      le niébé doit occuper au moins le quart du champ. Le champ se trouve à deux kilomètres du village.
      Tranche la question.'
    correction: 'On cherche la part du niébé, puis on la compare au quart. Céréales : $\frac{9}{12}$.
      Niébé : $\frac{12}{12} - \frac{9}{12} = \frac{3}{12} = \frac{1}{4}$. **La condition est tenue, tout
      juste : exactement le quart.** Les deux kilomètres sont une donnée inutile.'
  - numero: 36
    etoiles: 3
    enonce: La classe de 5ème d'une école de Sindou compte $40$ élèves, dont $16$ filles. Une association
      distribue des cahiers aux classes où les filles représentent au moins $0{,}35$ de l'effectif. Le
      directeur doit écrire la part des filles avec une virgule. Écris ce qui doit figurer sur la fiche
      et dis-lui si sa classe recevra les cahiers.
    correction: 'Il faut une écriture en dixièmes pour poser une virgule : $\frac{16}{40} = \frac{4}{10}
      = 0{,}4$. Au rang des dixièmes, $4 > 3$, donc $0{,}4 > 0{,}35$. **Le directeur inscrit $0{,}4$ :
      la classe recevra les cahiers.**'
  - numero: 37
    etoiles: 3
    enonce: On écrit toutes les fractions $\frac{n}{12}$ où $n$ est un entier de $1$ à $11$. a) Lesquelles
      peuvent être simplifiées ? Donne leur forme irréductible. b) Lesquelles sont irréductibles ? Que
      remarques-tu sur leurs numérateurs ? c) Mêmes questions pour $\frac{n}{10}$, avec $n$ de $1$ à $9$.
    correction: 'On repère les numérateurs partageant un diviseur avec le dénominateur. a) $\frac{2}{12}
      = \frac{1}{6}$, $\frac{3}{12} = \frac{1}{4}$, $\frac{4}{12} = \frac{1}{3}$, $\frac{6}{12} = \frac{1}{2}$,
      $\frac{8}{12} = \frac{2}{3}$, $\frac{9}{12} = \frac{3}{4}$, $\frac{10}{12} = \frac{5}{6}$. b) $\frac{1}{12}$,
      $\frac{5}{12}$, $\frac{7}{12}$, $\frac{11}{12}$ : numérateurs non divisibles par $2$ ni par $3$.
      c) Simplifiables : $\frac{2}{10} = \frac{1}{5}$, $\frac{4}{10} = \frac{2}{5}$, $\frac{5}{10} = \frac{1}{2}$,
      $\frac{6}{10} = \frac{3}{5}$, $\frac{8}{10} = \frac{4}{5}$ ; irréductibles : $\frac{1}{10}$, $\frac{3}{10}$,
      $\frac{7}{10}$, $\frac{9}{10}$, numérateurs non divisibles par $2$ ni par $5$.'
  fiche_revision:
  - '**Sens.** Dans $\frac{a}{b}$, $b$ dit en combien de parts égales on partage ($b \neq 0$), $a$ combien
    on en prend.'
  - '**Fraction d''une quantité.** On divise par le dénominateur, on multiplie par le numérateur : $\frac{2}{3}$
    de $24 = 16$.'
  - '**Droite graduée.** Unité en $b$ parts, on compte $a$ parts. Si $a > b$ : $\frac{7}{4} = 1 + \frac{3}{4}$.'
  - '**Fractions égales.** Multiplie ou divise le haut **et** le bas par le même nombre non nul. Jamais
    d''addition.'
  - '**Simplifier.** Divise par un diviseur commun (critères de $2$, $3$, $5$, $9$, $10$). Irréductible
    quand seul $1$ divise les deux.'
  - '**Comparer.** Même dénominateur : plus grand numérateur. Même numérateur : plus **petit** dénominateur.
    Sinon, dénominateur commun, ou comparaison à $1$.'
  - '**Additionner et soustraire.** Même dénominateur d''abord, puis numérateurs seuls, puis simplification.
    Le tout vaut $\frac{c}{c} = 1$.'
  - '**Décimales.** $\frac{3}{10} = 0{,}3$ ; $\frac{47}{100} = 0{,}47$ ; $0{,}25 = \frac{25}{100} = \frac{1}{4}$.'
  trouve_erreur:
  - faux: $\frac{2}{4} + \frac{1}{4} = \frac{3}{8}$
    correction: 'Le tout n''a pas été recoupé : $\frac{3}{4}$.'
  - faux: $\frac{1}{3}$ de $24 = 24 - 3 = 21$
    correction: '« $\frac{1}{3}$ de » veut dire diviser : $24 \div 3 = 8$.'
  - faux: $\frac{8}{12} = \frac{8-4}{12-4} = \frac{4}{8}$
    correction: 'Simplifier, c''est diviser : $\frac{8 \div 4}{12 \div 4} = \frac{2}{3}$.'
  - faux: $\frac{1}{5} > \frac{1}{3}$ car $5 > 3$
    correction: 'À numérateur égal la comparaison s''inverse : $\frac{1}{5} < \frac{1}{3}$.'
  cartographie_lacunes:
  - lacune: Fraction non simplifiée, addition de dénominateurs
    bloque_en: opérations sur les fractions, PGCD
  source_path: remediation\5eme\modules_c\M03.md
- niveau: 5eme
  module: 4
  module_titre: Les égalités à trous et les premiers gestes du calcul
  pourquoi: 'Le signe $=$ n''annonce pas un résultat, il affirme un équilibre. Tu connais cette règle
    : c''est son application, dès qu''un nombre manque, qui dérape.'
  diagnostic:
  - question: 'Vrai ou faux : $7 + 6 = 14$.'
    reponse: faux, $7 + 6 = 13$
  - question: 'Trouve le nombre manquant : 13 + ☐ $= 21$.'
    reponse: $21 - 13 = 8$
  - question: 'Trouve le nombre manquant : ☐ $- 51 = 18$.'
    reponse: $18 + 51 = 69$
  - question: 'Trouve le nombre manquant : $18 \times$ ☐ $= 99$.'
    reponse: $99 \div 18 = 5{,}5$
  - question: 'Trouve le nombre manquant : ☐ $\div 3 = 21$.'
    reponse: $21 \times 3 = 63$
  lecons:
  - id: 5eme_M04_L1
    numero: '4.1'
    titre: Une égalité se lit dans les deux sens
    retenir:
    - À gauche du signe $=$, le **premier membre** ; à droite, le **second membre**.
    - 'Une égalité est **vraie** quand les deux membres ont la même valeur : $13 + 8 = 21$ est vraie,
      $13 + 8 = 20$ est fausse.'
    - 'Les deux membres s''**échangent** : $21 = 13 + 8$ est la même égalité que $13 + 8 = 21$.'
    - 'Une égalité vraie est une **balance en équilibre** : ajouter ou retirer la même chose des deux
      côtés la laisse vraie.'
    - 'Une **égalité à trou** (☐, ou une lettre $x$, $y$) n''a qu''une réponse : le nombre qui la rend
      vraie.'
    methode:
      titre: Tester une égalité
      etapes:
      - Calcule à part le premier membre.
      - Calcule à part le second membre.
      - Compare les deux nombres.
      - Conclus ; si elle est fausse, donne la valeur correcte.
    exemple_resolu: 'Vraies ou fausses : $30 - 8 = 23$ et $36 \div 6 = 6$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Chaque membre séparément. | $30 - 8 = 22$ ; second membre $= 23$ |

      | Les nombres diffèrent : fausse, et on corrige. | $30 - 8 = 22$, égalité **fausse** |

      | Même travail sur la seconde. | $36 \div 6 = 6$ ; second membre $= 6$ |

      | **Vérification :** les deux membres valent 6, égalité **vraie**. ✓ | |


      [SVG: figures/m04_f1.svg]

      *Figure 4.1 : Une égalité est une balance en équilibre : les deux plateaux portent la même valeur.*'
    erreurs_frequentes:
    - erreur: écrire 13 + ☐ $= 21 = 8$.
      correction: 21 et 8 ne sont pas égaux. On écrit ☐ $= 21 - 13 = 8$, puis on contrôle $13 + 8 = 21$.
    - erreur: déclarer fausse $9 = 4 + 5$ parce que le nombre isolé est à gauche.
      correction: elle est vraie ; les membres s'échangent librement.
    declic: null
    figures:
    - figures/m04_f1.svg
  - id: 5eme_M04_L2
    numero: '4.2'
    titre: 'Le terme manquant : addition et soustraction'
    retenir:
    - '$a +$ ☐ $= b$ et ☐ $+ a = b$ : ☐ $= b - a$.'
    - '$a -$ ☐ $= b$ : le trou est ce qu''on enlève, ☐ $= a - b$.'
    - '☐ $- a = b$ : le trou est le nombre de départ, ☐ $= b + a$.'
    - Le trou est-il le **tout** ou un **morceau** ?
    - 'Un **morceau** est plus petit que le tout : on **soustrait**. Le **tout** est plus grand : on **additionne**.'
    - '$+$ et $-$ sont **réciproques** : chacune défait l''autre.'
    methode:
      titre: Trouver le terme manquant
      etapes:
      - 'Repère la place du trou : terme d''une somme, ce qu''on enlève, ou nombre de départ.'
      - 'Décide : tout, ou morceau ?'
      - Morceau, on soustrait ; tout, on additionne.
      - Remplace le trou par ton résultat et contrôle les deux membres.
    exemple_resolu: 'Trouve le trou : $72 -$ ☐ $= 43$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le tout est 72, 43 est ce qui reste : le trou est l''autre morceau. | le trou est un morceau,
      on soustrait |

      | On défait. | ☐ $= 72 - 43 = 29$ |

      | **Vérification :** $72 - 29 = 43$, et $29 + 43 = 72$. ✓ | |


      > #### DÉCLIC : Le trou n''est pas toujours plus petit

      >

      > Si ☐ $- 51 = 18$ te fait écrire $51 - 18 = 33$, le blocage n''est pas la soustraction : c''est
      la lecture de la place du trou. Ici le trou est le nombre de départ, donc le **tout**, donc plus
      grand que 18 : ☐ $= 18 + 51 = 69$.'
    erreurs_frequentes:
    - erreur: recopier l'opération de l'énoncé au lieu de la défaire.
      correction: c'est la place du trou qui décide, pas le signe écrit.
    - erreur: trouver un nombre et passer à la suite.
      correction: remplace toujours le trou par ta valeur et calcule les deux membres.
    declic: 'Le trou n''est pas toujours plus petit — Si ☐ $- 51 = 18$ te fait écrire $51 - 18 = 33$,
      le blocage n''est pas la soustraction : c''est la lecture de la place du trou. Ici le trou est le
      nombre de départ, donc le **tout**, donc plus grand que 18 : ☐ $= 18 + 51 = 69$. #### ⚠ ATTENTION
      ! - **Erreur fréquente :** recopier l''opération de l''énoncé au lieu de la défaire. **Correction
      :** c''est la place du trou qui décide, pas le signe écrit. - **Erreur fréquente :** trouver un
      nombre et passer à la suite. **Correction :** remplace toujours le trou par ta valeur et calcule
      les deux membres.'
    figures: []
  - id: 5eme_M04_L3
    numero: '4.3'
    titre: Le facteur manquant, et traduire un énoncé
    retenir:
    - '$a \times$ ☐ $= b$ et ☐ $\times a = b$ : ☐ $= b \div a$.'
    - '$a \div$ ☐ $= b$ : le trou est le diviseur, ☐ $= a \div b$.'
    - '☐ $\div a = b$ : le trou est le dividende, ☐ $= b \times a$.'
    - 'Le trou est-il le **total** ou une **part** ? Une part : on **divise**. Le total : on **multiplie**.'
    - 'Un nombre manquant a le droit d''être **décimal** : $18 \times$ ☐ $= 99$ donne ☐ $= 5{,}5$.'
    methode:
      titre: Passer du français à l'égalité
      etapes:
      - Repère la question et nomme le nombre cherché.
      - 'Dessine une barre : le tout, coupé en morceaux ou en parts égales.'
      - Écris l'égalité en plaçant le trou là où est l'inconnue.
      - Résous, puis réponds par une phrase avec l'unité.
    exemple_resolu: 'À la gare de Boulsa, Ali paie 4 places de car au même prix et dépense $14\,000$ FCFA
      en tout. Prix d''une place ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On nomme l''inconnue : $x$, prix d''une place. Le total est coupé en 4 parts égales. | $4 \times
      x = 14\,000$ |

      | Le trou est une part : on divise le total par le nombre de parts. | $x = 14\,000 \div 4$ |

      | On effectue. | $x = 3\,500$ FCFA |

      | **Vérification :** $4 \times 3\,500 = 14\,000$. ✓ | |


      [SVG: figures/m04_f3.svg]

      *Figure 4.3 : La droite des étapes : on descend en calculant, on remonte en défaisant, dans l''ordre
      inverse.*'
    erreurs_frequentes:
    - erreur: pour ☐ $\div 3 = 21$, calculer $21 \div 3 = 7$.
      correction: 'le trou est le total : ☐ $= 21 \times 3 = 63$.'
    - erreur: refuser un quotient décimal et arrondir aussitôt.
      correction: garde la valeur exacte, puis interprète selon la situation.
    declic: null
    figures:
    - figures/m04_f3.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Vraies ou fausses ? a) $9 + 6 = 15\,;\,$ b) $30 - 8 = 23\,;\,$ c) $6 \times 4 = 24\,;\,$ d)
      $36 \div 6 = 5$.
    correction: a) Vraie. b) Fausse, $30 - 8 = 22$. c) Vraie. d) Fausse, $36 \div 6 = 6$.
  - numero: 2
    etoiles: 1
    enonce: 'Recopie et complète : les deux côtés du signe $=$ s''appellent les … ; si on ajoute un même
      nombre aux … membres, l''égalité reste … .'
    correction: Les **membres** ; les **deux** membres ; l'égalité reste **vraie**.
  - numero: 3
    etoiles: 1
    enonce: 'Recopie en corrigeant l''écriture fautive : 5 + ☐ $= 9 = 4$.'
    correction: 'Chaîne fausse : 9 et 4 ne sont pas égaux. On écrit ☐ $= 9 - 5 = 4$, et $5 + 4 = 9$ ✓.'
  - numero: 4
    etoiles: 1
    enonce: On sait que $m = 12$. Ces égalités sont-elles vraies ? a) $m + 4 = 16\,;\,$ b) $m - 5 = 8\,;\,$
      c) $m + 0 = 12$.
    correction: a) Vraie. b) Fausse, $12 - 5 = 7$. c) Vraie.
  - numero: 5
    etoiles: 1
    enonce: Quelle opération inverse donne le trou ? a) 5 + ☐ $= 12\,;\,$ b) $4 \times$ ☐ $= 20$.
    correction: 'a) La soustraction : ☐ $= 12 - 5 = 7$. b) La division : ☐ $= 20 \div 4 = 5$.'
  - numero: 6
    etoiles: 1
    enonce: Quelle opération appliquer aux deux membres pour isoler $x$, et que vaut $x$ ? a) $x + 13
      = 20\,;\,$ b) $x - 9 = 2$.
    correction: 'a) On retranche 13 : $x = 7$. b) On ajoute 9 : $x = 11$.'
  - numero: 7
    etoiles: 1
    enonce: 'Trouve le trou : a) 24 + ☐ $= 41\,;\,$ b) $85 -$ ☐ $= 47\,;\,$ c) ☐ $- 36 = 29$.'
    correction: 'a) $41 - 24 = 17$. b) $85 - 47 = 38$. c) Le trou est le tout : $29 + 36 = 65$.'
  - numero: 8
    etoiles: 1
    enonce: 'Trouve le trou : a) ☐ $- 48 = 66\,;\,$ b) ☐ $+ 35 = 90\,;\,$ c) $200 -$ ☐ $= 75$.'
    correction: 'a) Le trou est le tout : $66 + 48 = 114$. b) $90 - 35 = 55$. c) $200 - 75 = 125$.'
  - numero: 9
    etoiles: 1
    enonce: 'Trouve le trou : a) 190 + ☐ $= 375\,;\,$ b) ☐ $- 39 = 52\,;\,$ c) $100 -$ ☐ $= 64$.'
    correction: 'a) $375 - 190 = 185$. b) Le trou est le tout : $52 + 39 = 91$. c) $100 - 64 = 36$.'
  - numero: 10
    etoiles: 1
    enonce: 'Trouve le trou : a) 4 + ☐ $= 9{,}5\,;\,$ b) ☐ $+ 1{,}5 = 4\,;\,$ c) 6 + ☐ $= 6{,}5$.'
    correction: a) $9{,}5 - 4 = 5{,}5$. b) $4 - 1{,}5 = 2{,}5$. c) $6{,}5 - 6 = 0{,}5$.
  - numero: 11
    etoiles: 1
    enonce: 'Trouve $x$ : a) $x - 6 = 14\,;\,$ b) $x + 4{,}5 = 9\,;\,$ c) $x - 0{,}75 = 0{,}25$.'
    correction: a) $x = 14 + 6 = 20$. b) $x = 9 - 4{,}5 = 4{,}5$. c) $x = 0{,}25 + 0{,}75 = 1$.
  - numero: 12
    etoiles: 1
    enonce: 'Trouve le nombre manquant : a) $y - 4{,}5 = 2{,}5\,;\,$ b) $y + 0{,}8 = 1{,}5\,;\,$ c) ☐
      $- 125 = 75$.'
    correction: a) $y = 2{,}5 + 4{,}5 = 7$. b) $y = 1{,}5 - 0{,}8 = 0{,}7$. c) ☐ $= 75 + 125 = 200$.
  - numero: 13
    etoiles: 1
    enonce: 'Trouve le trou : a) $5 \times$ ☐ $= 35\,;\,$ b) ☐ $\times 7 = 42\,;\,$ c) $6 \times$ ☐ $=
      48$.'
    correction: a) $35 \div 5 = 7$. b) $42 \div 7 = 6$. c) $48 \div 6 = 8$.
  - numero: 14
    etoiles: 1
    enonce: 'Trouve le trou : a) ☐ $\times 10 = 80\,;\,$ b) ☐ $\times 100 = 2\,500\,;\,$ c) ☐ $\div 10
      = 4{,}5$.'
    correction: 'a) $80 \div 10 = 8$. b) $2\,500 \div 100 = 25$. c) Le trou est le total : $4{,}5 \times
      10 = 45$.'
  - numero: 15
    etoiles: 1
    enonce: 'Le résultat peut être décimal : a) $8 \times$ ☐ $= 20\,;\,$ b) $4 \times$ ☐ $= 22\,;\,$ c)
      $4 \times$ ☐ $= 60$.'
    correction: a) $20 \div 8 = 2{,}5$. b) $22 \div 4 = 5{,}5$. c) $60 \div 4 = 15$.
  - numero: 16
    etoiles: 1
    enonce: 'Trouve le trou : a) $15 \div$ ☐ $= 1{,}25\,;\,$ b) ☐ $\div 4 = 6\,;\,$ c) ☐ $\div 32 = 32$.'
    correction: 'a) Le trou est le diviseur : $15 \div 1{,}25 = 12$. b) $6 \times 4 = 24$. c) $32 \times
      32 = 1\,024$.'
  - numero: 17
    etoiles: 1
    enonce: 'Trouve $x$ : a) $6 \times x = 54\,;\,$ b) $x \div 7 = 3\,;\,$ c) $0{,}5 \times x = 12$.'
    correction: a) $x = 54 \div 6 = 9$. b) $x = 3 \times 7 = 21$. c) $x = 12 \div 0{,}5 = 24$.
  - numero: 18
    etoiles: 1
    enonce: 'Un commerçant a $45\,000$ FCFA et veut atteindre $60\,000$ FCFA. Écris l''égalité à trou
      et résous-la.


      ### Entraînement ★★'
    correction: $45\,000 +$ ☐ $= 60\,000$, donc ☐ $= 15\,000$ FCFA.
  - numero: 19
    etoiles: 2
    enonce: 'Une balance est en équilibre : à gauche, une caisse de masse inconnue et un poids de 7 kg
      ; à droite, 19 kg. a) Que se passe-t-il si l''on retire 7 kg des deux côtés ? b) Quelle est la masse
      de la caisse ? c) Vérifie.'
    correction: a) L'équilibre est conservé. b) $19 - 7 = 12$, la caisse pèse 12 kg. c) $12 + 7 = 19$
      ✓.
  - numero: 20
    etoiles: 2
    enonce: Vrai ou faux ? Justifie. a) On peut échanger les deux côtés d'une égalité sans la rendre fausse.
      b) $9 = 4 + 5$ est incorrecte parce que le résultat est à gauche. c) Si une égalité vraie reçoit
      $+3$ des deux côtés, elle reste vraie.
    correction: a) Vrai, le signe $=$ se lit dans les deux sens. b) Faux, elle est vraie et bien écrite.
      c) Vrai, on ajoute la même chose des deux côtés.
  - numero: 21
    etoiles: 2
    enonce: 'Trouve $x$, puis vérifie : a) $x + 3 = 9 + 3\,;\,$ b) $x + 5 - 5 = 12$. Explique en une phrase
      pourquoi le calcul est immédiat.'
    correction: 'a) On retranche 3 : $x = 9$. b) $+5$ puis $-5$ s''annulent : $x = 12$. Il n''y a rien
      à défaire.'
  - numero: 22
    etoiles: 2
    enonce: Pour résoudre ☐ $- 14 = 30$, Rasmané écrit ☐ $= 30 - 14 = 16$. a) Vérifie sa réponse en la
      remplaçant. b) Explique son erreur et donne la bonne valeur.
    correction: 'a) $16 - 14 = 2$, et non 30 : réponse fausse. b) Le trou est le nombre de départ, donc
      le tout : ☐ $= 30 + 14 = 44$.'
  - numero: 23
    etoiles: 2
    enonce: On sait que $7 \times$ ☐ $= 91$. a) Trouve le trou. b) Sans nouveau calcul, donne le trou
      dans $91 \div$ ☐ $= 7$. Explique.
    correction: 'a) ☐ $= 91 \div 7 = 13$. b) Encore 13 : $7 \times 13 = 91$ dit exactement que $91 \div
      13 = 7$.'
  - numero: 24
    etoiles: 2
    enonce: À Léo, un transporteur charge des sacs de 25 kg ; le camion transporte $1\,500$ kg en tout.
      a) Écris l'égalité à trou donnant le nombre de sacs. b) Résous-la. c) Avec 4 sacs de plus, quelle
      masse transporte-t-il ?
    correction: a) $25 \times$ ☐ $= 1\,500$. b) ☐ $= 60$ sacs. c) $64 \times 25 = 1\,600$ kg.
  - numero: 25
    etoiles: 2
    enonce: 'À Kongoussi, un maraîcher a récolté 96 kg de tomates ; il en vend une partie, il lui reste
      27 kg. a) Écris l''égalité à trou donnant la masse vendue. b) Résous-la. c) À $350$ FCFA le kilogramme,
      combien a-t-il gagné ?


      *Entraînement intensif : dis d''abord si le trou est le tout ou un morceau, le total ou une part.
      Ne calcule qu''ensuite.*'
    correction: a) $96 -$ ☐ $= 27$. b) ☐ $= 96 - 27 = 69$ kg. c) $69 \times 350 = 24\,150$ FCFA.
  - numero: 26
    etoiles: 2
    enonce: 'Trouve le trou : a) $2{,}5 \times$ ☐ $= 10\,;\,$ b) ☐ $\div 2 = 3{,}5\,;\,$ c) $12 \div$
      ☐ $= 4{,}8$.'
    correction: 'a) $10 \div 2{,}5 = 4$. b) Le trou est le total : $3{,}5 \times 2 = 7$. c) Le trou est
      le diviseur : $12 \div 4{,}8 = 2{,}5$.'
  - numero: 27
    etoiles: 2
    enonce: Vrai ou faux ? Pour ☐ $- 20 = 5$, on calcule $20 - 5$. Corrige si nécessaire.
    correction: 'Faux. Le trou est le tout : ☐ $= 5 + 20 = 25$, et $25 - 20 = 5$ ✓.'
  - numero: 28
    etoiles: 2
    enonce: Pour le trou dans $60 \div$ ☐ $= 12$, un élève calcule $60 \times 12$. a) Que devrait-il faire
      ? b) Donne la valeur du trou.
    correction: a) Diviser, car le trou est le diviseur. b) ☐ $= 60 \div 12 = 5$.
  - numero: 29
    etoiles: 2
    enonce: 'Vrai ou faux ? Justifie. a) Dans ☐ $\times 5 = 40$, le trou vaut 200. b) Dans $40 \div$ ☐
      $= 5$, le trou vaut 8. c) Le nombre manquant d''une division peut être décimal.


      ### ★★★ Défis de maîtrise'
    correction: 'a) Faux, le trou est une part : $40 \div 5 = 8$. b) Vrai, $40 \div 8 = 5$ ✓. c) Vrai,
      par exemple ☐ $= 5{,}5$.'
  - numero: 30
    etoiles: 3
    enonce: 'Trouve le nombre manquant en deux étapes, puis dis dans quel ordre tu as défait les opérations
      : a) $2 \times$ ☐ $+ 3 = 11\,;\,$ b) $3 \times$ ☐ $- 5 = 16\,;\,$ c) $\left(☐ + 4\right) \times
      2 = 18$.'
    correction: On défait d'abord le geste fait en dernier, donc les additions et soustractions avant
      les produits. a) $2 \times$ ☐ $= 8$, puis ☐ $= 4$. b) $3 \times$ ☐ $= 21$, puis ☐ $= 7$. c) ☐ $+
      4 = 9$, puis ☐ $= 5$.
  - numero: 31
    etoiles: 3
    enonce: On sait que ☐ $\times \triangle = 36$ et que ☐ dépasse $\triangle$ de 5. a) Écris tous les
      couples d'entiers de produit 36. b) Donne le couple qui convient.
    correction: 'Une seule condition ne suffit pas : on liste, puis on teste l''écart. a) $1{\times}36$,
      $2{\times}18$, $3{\times}12$, $4{\times}9$, $6{\times}6$. b) Seul $9 - 4 = 5$ convient : ☐ $= 9$,
      $\triangle = 4$.'
  - numero: 32
    etoiles: 3
    enonce: 'Un camarade affirme : « Pour trouver le trou, il faut toujours soustraire. » a) Donne un
      exemple où c''est vrai. b) Un exemple où c''est faux. c) Explique en une phrase ce qui décide de
      l''opération.'
    correction: 'a) Vrai pour $24 +$ ☐ $= 41$ : ☐ $= 17$. b) Faux pour ☐ $\div 3 = 21$ : ☐ $= 63$, on
      multiplie. c) C''est la place du trou qui décide : le tout, on rassemble ; un morceau, on retire.'
  - numero: 33
    etoiles: 3
    enonce: 'À Ouahigouya, Fatimata avait des savons ; elle en a vendu 48, il lui en reste 36. Sa copie
      : *l.1* ☐ $- 48 = 36$ ; *l.2* ☐ $= 48 - 36$ ; *l.3* ☐ $= 12$ ; *l.4* elle avait 12 savons ; *l.5*
      vérification $12 - 48 = 36$. a) Repère la première ligne fausse. b) Pourquoi la ligne 5 aurait-elle
      dû l''alerter avant tout calcul ? c) Refais la résolution.'
    correction: 'On relit ligne à ligne en contrôlant chaque passage. a) La **ligne 2** : le trou est
      le tout, il ne s''obtient pas par soustraction. b) On ne retire pas 48 d''un stock de 12, et un
      reste ne dépasse pas le départ. c) ☐ $= 36 + 48 = 84$ savons, et $84 - 48 = 36$ ✓.'
  - numero: 34
    etoiles: 3
    enonce: À Banfora, une coopérative doit livrer 300 kg de mangues séchées. Les caisses contiennent
      24 kg, 8 caisses sont remplies, et l'on n'expédie que des caisses pleines. Combien de caisses reste-t-il
      à remplir ? La livraison tombera-t-elle exactement sur 300 kg ?
    correction: 'On mesure d''abord ce qui est déjà fait. $8 \times 24 = 192$ kg, il manque $300 - 192
      = 108$ kg, soit $108 \div 24 = 4{,}5$ caisses. Une demi-caisse ne s''expédie pas : **5 caisses de
      plus**, soit $13 \times 24 = 312$ kg. La livraison dépasse de 12 kg.'
  - numero: 35
    etoiles: 3
    enonce: 'Un nombre a subi trois gestes : multiplié par 5, augmenté de 12, puis divisé par 4. Le résultat
      est 8. a) Retrouve le nombre de départ. b) Écris les trois gestes inverses dans l''ordre employé.
      c) Vérifie.'
    correction: 'Le dernier geste fait est le premier à défaire. a) $8 \times 4 = 32$, puis $32 - 12 =
      20$, puis $20 \div 5 = 4$ : le nombre est **4**. b) Multiplier par 4, retrancher 12, diviser par
      5. c) $4 \times 5 = 20$, $20 + 12 = 32$, $32 \div 4 = 8$ ✓.'
  fiche_revision:
  - '**L''égalité.** Les deux membres désignent le même nombre, et s''échangent : $21 = 13 + 8$.'
  - '**La balance.** Ajouter ou retirer la même chose des deux côtés ne rompt pas l''équilibre.'
  - '**Les réciproques.** $+$ et $-$ se défont l''une l''autre ; $\times$ et $\div$ aussi.'
  - '**Les six cas.** $a +$ ☐ $= b \to b - a$ ; $a -$ ☐ $= b \to a - b$ ; ☐ $- a = b \to b + a$ ; $a \times$
    ☐ $= b \to b \div a$ ; $a \div$ ☐ $= b \to a \div b$ ; ☐ $\div a = b \to b \times a$.'
  - '**Le réflexe.** Le trou est-il le tout ou un morceau ? Le tout : on rassemble. Un morceau : on retire.'
  - '**Le vocabulaire.** Somme et termes, différence, produit et facteurs, quotient, dividende, diviseur.'
  - '**Les décimaux.** Un nombre manquant a le droit d''être décimal : $99 \div 18 = 5{,}5$.'
  - '**Vérifier.** Remplace le trou par ta réponse et calcule les deux membres.'
  trouve_erreur:
  - faux: 13 + ☐ $= 21$ donc ☐ $= 21 + 13 = 34$
    correction: 'On défait au lieu de recopier : ☐ $= 21 - 13 = 8$.'
  - faux: ☐ $- 14 = 30$ donc ☐ $= 30 - 14 = 16$
    correction: 'Le trou est le tout, plus grand que 30 : ☐ $= 30 + 14 = 44$.'
  - faux: ☐ $\div 3 = 21$ donc ☐ $= 21 \div 3 = 7$
    correction: 'La réciproque de la division est la multiplication : ☐ $= 63$.'
  - faux: '$18 \times$ ☐ $= 99$ : impossible, 99 n''est pas dans la table de 18'
    correction: 'Un nombre manquant peut être décimal : ☐ $= 5{,}5$.'
  cartographie_lacunes:
  - lacune: Égalité vue comme « le résultat suit », transposition mécanique
    bloque_en: égalités et opérations, équations dans D
  source_path: remediation\5eme\modules_c\M04.md
- niveau: 5eme
  module: 5
  module_titre: 'Les nombres relatifs : repérer, comparer, additionner'
  pourquoi: 'Le signe $-$ placé devant un nombre n''est pas une soustraction : c''est un côté. Tu connais
    ces nombres depuis la 6ème, c''est leur comparaison et leur addition qui dérapent.'
  diagnostic:
  - question: 'Écris avec un nombre relatif : une dette de $500$ FCFA.'
    reponse: $-500$
  - question: Donne l'opposé de $-19{,}5$.
    reponse: $+19{,}5$
  - question: Compare $-13$ et $-2$.
    reponse: $-13 < -2$
  - question: Calcule $\left(-6\right) + \left(-9\right)$.
    reponse: $-15$
  - question: Calcule $\left(+10\right) + \left(-4\right)$.
    reponse: $+6$
  lecons:
  - id: 5eme_M05_L1
    numero: '5.1'
    titre: Écrire un relatif, le placer, donner son opposé
    retenir:
    - 'Un nombre **positif** porte le signe $+$ ($+5$, ou simplement $5$) : il est plus grand que zéro.'
    - 'Un nombre **négatif** porte le signe $-$ ($-3$) : il est plus petit que zéro. Ce signe ne s''efface
      jamais.'
    - 'Le **zéro** n''est ni positif ni négatif : c''est le repère.'
    - 'La **distance à zéro** est le nombre écrit sans son signe : celle de $-7$ vaut $7$, celle de $+7$
      vaut $7$ aussi.'
    - 'Entiers relatifs : $\mathbb{Z} = \ldots, -2, -1, 0, +1, +2, \ldots$ Décimaux relatifs : 𝔻, qui
      contient $\mathbb{Z}$ puisque $-3 = -3{,}0$.'
    methode:
      titre: Placer un point, lire une abscisse
      etapes:
      - 'Pars du $0$ : vers la droite si le nombre est positif, vers la gauche s''il est négatif.'
      - Avance du nombre d'unités indiqué, graduation par graduation.
      - Pour une abscisse décimale, place-la entre les deux graduations entières qui l'encadrent.
      - Marque une croix et écris le nom du point au-dessus.
    exemple_resolu: 'Un point $A$ est à $2{,}5$ cm à gauche du $0$ (unité $1$ cm). Donne son abscisse,
      encadre-la, place son opposé $A''$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | À gauche du $0$ : abscisse négative, distance $2{,}5$. | $A\left(-2{,}5\right)$ |

      | $2{,}5$ est entre $2$ et $3$, donc $A$ est entre $-3$ et $-2$. | $-3 < -2{,}5 < -2$ |

      | L''opposé garde la valeur et change de signe. | $A''\left(+2{,}5\right)$ |

      | **Vérification :** $A$ et $A''$ sont à $2{,}5$ cm du $0$. ✓ | |


      [SVG: figures/m05_f2.svg]

      *Figure 5.1 : Une droite graduée d''unité $1$ cm : les négatifs à gauche, les positifs à droite.*'
    erreurs_frequentes:
    - erreur: l'opposé de $+3{,}5$ est $3{,}5$.
      correction: 'l''opposé ne touche qu''au **signe** : $-3{,}5$.'
    - erreur: changer la longueur de l'unité en cours de tracé.
      correction: l'unité reste identique d'un bout à l'autre, sinon les abscisses ne veulent plus rien
        dire.
    declic: null
    figures:
    - figures/m05_f2.svg
  - id: 5eme_M05_L2
    numero: '5.2'
    titre: Comparer et ranger des nombres relatifs
    retenir:
    - Tout **positif** est plus grand que tout **négatif**.
    - Le **zéro** est plus grand que tout négatif, plus petit que tout positif.
    - 'Entre **deux négatifs**, le plus grand est le **plus proche de zéro** : $-3 > -5$.'
    methode:
      titre: Comparer deux relatifs
      etapes:
      - 'Regarde les signes : un positif et un négatif, c''est fini, le positif gagne.'
      - 'Deux positifs : compare comme d''habitude.'
      - 'Deux négatifs : la **plus petite** distance à zéro donne le **plus grand** nombre.'
      - Écris $<$ ou $>$ en le faisant pointer vers le plus petit.
    exemple_resolu: 'Range par ordre croissant : $+7$ ; $-19$ ; $-52$ ; $+15$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Deux paquets : tout négatif avant tout positif. | négatifs $-19$ ; $-52$ / positifs $+7$ ; $+15$
      |

      | Chez les négatifs, la plus grande distance à zéro est la plus à gauche. | $-52 < -19$ |

      | Les positifs se rangent normalement, puis on recolle. | $-52 < -19 < +7 < +15$ |

      | **Vérification :** chaque nombre est à droite du précédent. ✓ | |


      [SVG: figures/m05_f4.svg]

      *Figure 5.2 : $-5$ est à gauche de $-3$ : il est donc plus petit, même si $5 > 3$.*'
    erreurs_frequentes:
    - erreur: ranger $-2 < -7 < 0 < +4$.
      correction: 'chez les négatifs l''ordre s''inverse : $-7 < -2 < 0 < +4$.'
    - erreur: croire qu'il n'existe aucun nombre entre $-1$ et $0$.
      correction: il y en a une infinité, par exemple $-0{,}5$.
    declic: null
    figures:
    - figures/m05_f4.svg
  - id: 5eme_M05_L3
    numero: '5.3'
    titre: Additionner deux nombres relatifs
    retenir:
    - '**Mêmes signes :** on **additionne** les distances à zéro, on garde le **signe commun**.'
    - '**Signes différents :** on prend l''**écart** des distances à zéro et le signe du nombre le **plus
      éloigné de zéro**.'
    - Un nombre plus son opposé donne $0$. Ces règles valent dans $\mathbb{Z}$ comme dans 𝔻.
    methode:
      titre: Additionner deux relatifs
      etapes:
      - Compare les deux signes.
      - 'Signes identiques : additionne les distances à zéro, garde le signe commun.'
      - 'Signes différents : soustrais la plus petite distance à zéro de la plus grande.'
      - Dans ce second cas, écris le signe du nombre le plus éloigné de zéro.
    exemple_resolu: 'À Djibo, un marchand gagne $4\,200$ FCFA lundi et perd $1\,950$ FCFA mardi. Quel
      est son bilan ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Gain positif, perte négative : les signes diffèrent. | $\left(+4\,200\right) + \left(-1\,950\right)$
      |

      | On prend l''écart des distances à zéro. | $4\,200 - 1\,950 = 2\,250$ |

      | Le plus éloigné de zéro est $+4\,200$ : il donne le signe. | $= +2\,250$ |

      | **Vérification :** $\left(+2\,250\right) + \left(+1\,950\right) = +4\,200$. ✓ | |


      [SVG: figures/m05_f5.svg]

      *Figure 5.3 : Ajouter un positif, c''est avancer ; ajouter un négatif, c''est reculer.*


      > #### DÉCLIC : Le signe du résultat n''est jamais choisi au hasard

      >

      > Si tu écris $\left(+8\right) + \left(-3\right) = +11$, tu as lu $-3$ comme « $3$ avec une décoration
      devant ». Or $-3$ tire vers la gauche pendant que $+8$ tire vers la droite : ils ne s''additionnent
      pas, ils se compensent. Le résultat est toujours du côté du plus fort.'
    erreurs_frequentes:
    - erreur: $\left(-6\right) + \left(-9\right) = -3$.
      correction: 'signes identiques, deux pertes se cumulent : $6 + 9 = 15$, donc $-15$.'
    - erreur: $\left(+8\right) + \left(-3\right) = +11$.
      correction: signes différents, écart $8 - 3 = 5$, signe de $+8$, donc $+5$.
    declic: 'Le signe du résultat n''est jamais choisi au hasard — Si tu écris $\left(+8\right) + \left(-3\right)
      = +11$, tu as lu $-3$ comme « $3$ avec une décoration devant ». Or $-3$ tire vers la gauche pendant
      que $+8$ tire vers la droite : ils ne s''additionnent pas, ils se compensent. Le résultat est toujours
      du côté du plus fort. #### ⚠ ATTENTION ! - **Erreur fréquente :** $\left(-6\right) + \left(-9\right)
      = -3$. **Correction :** signes identiques, deux pertes se cumulent : $6 + 9 = 15$, donc $-15$. -
      **Erreur fréquente :** $\left(+8\right) + \left(-3\right) = +11$. **Correction :** signes différents,
      écart $8 - 3 = 5$, signe de $+8$, donc $+5$.'
    figures:
    - figures/m05_f5.svg
  - id: 5eme_M05_L4
    numero: '5.4'
    titre: Somme de plusieurs relatifs, premiers pas vers la soustraction
    retenir:
    - '**De proche en proche :** on additionne deux par deux, de gauche à droite.'
    - '**Par regroupement :** paires d''opposés supprimées (elles valent $0$), puis tous les positifs,
      puis tous les négatifs, puis une seule addition finale.'
    - '**Soustraire, c''est ajouter l''opposé :**'
    - 'La **distance entre deux points** est toujours **positive** : plus grande abscisse moins petite
      abscisse.'
    methode:
      titre: Calculer une somme de plusieurs relatifs
      etapes:
      - Supprime les paires de nombres opposés.
      - Additionne tous les positifs restants.
      - Additionne tous les négatifs restants.
      - Termine par l'addition de ces deux résultats, de signes différents.
    exemple_resolu: 'À Toma, il fait $+32\,^{\circ}$C à midi. La température baisse de $7\,^{\circ}$C,
      puis de $15\,^{\circ}$C, puis remonte de $4\,^{\circ}$C. Température finale ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Baisse négative, hausse positive. | $\left(+32\right) + \left(-7\right) + \left(-15\right) + \left(+4\right)$
      |

      | On regroupe positifs d''un côté, négatifs de l''autre. | $+36$ et $-22$ |

      | Une seule addition de signes différents. | $\left(+36\right) + \left(-22\right) = +14$ |

      | **Vérification :** $32 - 7 = 25$ ; $25 - 15 = 10$ ; $10 + 4 = 14$. ✓ | |'
    erreurs_frequentes:
    - erreur: annoncer $AB = -8$.
      correction: une distance est une longueur, donc positive.
    - erreur: dans $\left(-3{,}5\right) - \left(-0{,}5\right)$, changer le signe du premier nombre.
      correction: 'on n''ajoute que l''opposé du nombre **soustrait** : $-3$.'
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Écris avec un nombre relatif : a) un gain de $700$ FCFA ; b) une perte de $260$ FCFA ; c)
      une hausse de $41$ cm ; d) une baisse de $15$ cm.'
    correction: a) $+700$ ; b) $-260$ ; c) $+41$ ; d) $-15$.
