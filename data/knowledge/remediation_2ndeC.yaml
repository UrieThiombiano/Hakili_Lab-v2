      ### ★★★ Défis de maîtrise'
    correction: $5$ ; $7$ ; $8$ ; $4$ ; $N = 24$.
  - numero: 39
    etoiles: 3
    enonce: 'Tableau incomplet : la modalité A a un effectif de $84$ et une fréquence de $28$ %. a) Effectif
