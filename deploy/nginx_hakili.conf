# Reverse proxy nginx — Hakili Lab
#
# Installation :
#   sudo cp deploy/nginx_hakili.conf /etc/nginx/sites-available/hakili
#   # remplacer VOTRE_DOMAINE.example ci-dessous par le vrai domaine
#   sudo ln -s /etc/nginx/sites-available/hakili /etc/nginx/sites-enabled/hakili
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ce fichier est volontairement en HTTP seul. Certbot (voir
# docs/deploiement_vps_hetzner.md) réécrit ce fichier tout seul pour ajouter
# le bloc HTTPS et la redirection 80 → 443 :
#
#   sudo certbot --nginx -d VOTRE_DOMAINE.example
#
# Ne pas préconfigurer le bloc SSL à la main : `certbot --nginx` sait le
# faire proprement et se charge du renouvellement automatique.

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE.example;

    # Dépôt de lots de copies scannées : peut représenter plusieurs dizaines
    # de mégaoctets (voir docs/deploiement.md, "Pourquoi --timeout 180").
    client_max_body_size 100M;

    # Fichiers statiques servis directement par nginx — WhiteNoise reste en
    # secours (settings.py) mais nginx est plus rapide pour ça.
    location /static/ {
        alias /opt/hakili/Hakili_Lab/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/hakili/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Indispensable : SECURE_PROXY_SSL_HEADER (hakili/settings.py) s'appuie
        # dessus pour savoir que la requête est en HTTPS. Sans cet en-tête,
        # SECURE_SSL_REDIRECT provoque une boucle de redirection infinie.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Une correction (appel IA) peut prendre du temps — aligné sur le
        # --timeout 180 de gunicorn.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
