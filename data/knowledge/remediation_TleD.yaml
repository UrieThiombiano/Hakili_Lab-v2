      \cup \left]1\,;\,+\infty\right[$.

      $D_{g \circ f}$ : $x \ge -2$ et $\sqrt{x + 2} \ne 1$, soit $x \ne -1$ : $\left[-2\,;\,-1\right[
      \cup \left]-1\,;\,+\infty\right[$.

      $D_{f \circ g}$ : $x \ne 1$ et $\frac{1}{x - 1} \ge -2$, soit $\frac{2x - 1}{x - 1} \ge 0$ : $\left]-\infty\,;\,\frac{1}{2}\right]
      \cup \left]1\,;\,+\infty\right[$.'
  - numero: 32
    etoiles: 3
    enonce: 'Voici la copie d''Awa, qui devait déterminer l''ensemble de définition de $h\left(x\right)
      = \frac{\sqrt{x - 1}}{x - 4}$ puis calculer $h\left(1\right)$. Repère l''erreur, corrige l''ensemble
      de définition, et calcule $h\left(1\right)$.


      | Ligne | Ce que Awa a écrit |

      |---|---|

      | 1 | Il y a une racine carrée : il faut $x - 1 > 0$, donc $x > 1$. |

      | 2 | Il y a un dénominateur : il faut $x - 4 \neq 0$, donc $x \neq 4$. |

      | 3 | $D_{h} = \left]1\,;\,4\right[ \cup \left]4\,;\,+\infty\right[$ |

      | 4 | $h\left(1\right)$ n''existe pas, car $1$ n''appartient pas à $D_{h}$. |'
    correction: 'La question à poser sur chaque condition est : « pourquoi cette contrainte ? ». Awa a
      transposé la règle du dénominateur sur le contenu de la racine.

      **Ligne 1 fausse** : la condition est $x - 1 \ge 0$ (inégalité **large**), car $\sqrt{0}$ existe.
      Les lignes 3 et 4 héritent de l''erreur.

      $D_{h} = \left[1\,;\,4\right[ \cup \left]4\,;\,+\infty\right[$ et $h\left(1\right) = \frac{0}{-3}
      = 0$ : $1$ est un antécédent de $0$.


      ---'
  fiche_revision:
  - '**Image.** $f\left(a\right)$ : on remplace et on calcule ; elle est unique.'
  - '**Antécédent.** On résout $f\left(x\right) = k$ ; zéro, une ou plusieurs solutions.'
  - '**Domaine.** Dénominateur $\ne 0$, radicande $\ge 0$ ; racine au dénominateur : $> 0$.'
  - '**Point sur la courbe.** $M\left(a\,;\,b\right) \in \mathcal{C}_{f}$ équivaut à $f\left(a\right)
    = b$.'
  - '**Variations.** Croissante = conserve l''ordre ; décroissante = inverse l''ordre, sur **un** intervalle.'
  - '**Extremum.** Une ordonnée, atteinte en une abscisse : deux nombres, deux rôles.'
  - '**Parité.** Domaine symétrique, puis $f\left(-x\right)$ comparé à $f\left(x\right)$ et à $-f\left(x\right)$.'
  - '**Comptage.** Sur une flèche, $f\left(x\right) = k$ a une solution si $k$ est entre les deux valeurs
    extrêmes, aucune sinon.'
  trouve_erreur:
  - faux: $f\left(x\right) = \frac{1}{\sqrt{x - 2}}$, $D_{f} = \left[2\,;\,+\infty\right[$
    correction: 'Racine au dénominateur : $x - 2 > 0$, $D_{f} = \left]2\,;\,+\infty\right[$'
  - faux: $f\left(x\right) = x^{2} + 3$ donc $f\left(-x\right) = -x^{2} + 3$
    correction: '$\left(-x\right)^{2} = x^{2}$ : $f\left(-x\right) = x^{2} + 3$, $f$ est paire'
  - faux: « Le maximum est atteint en $4$ », pour $\max f = 4$ en $x = 0$
    correction: Le maximum vaut $4$ ; il est atteint en $x = 0$
  - faux: $f$ décroissante, $2 < 5$ donc $f\left(2\right) \le f\left(5\right)$
    correction: 'Décroissante inverse l''ordre : $f\left(2\right) \ge f\left(5\right)$'
