- niveau: 2ndeC
  module: 4
  module_titre: Équations, inéquations et systèmes du premier degré
  pourquoi: 'Quatre dérapages reviennent dans toutes les copies : un terme change de côté

    sans changer de signe, une parenthèse précédée d''un moins est effacée telle quelle, on divise une

    inéquation par un négatif sans retourner le sens, on répond par un nombre au lieu d''un intervalle.'
  diagnostic:
  - question: 'Résous dans $\mathbb{R}$ : $5x - 3 = 2x + 9$.'
    reponse: $S = \left\{4\right\}$
  - question: 'Résous dans $\mathbb{R}$ : $\left(x - 7\right)\left(2x + 1\right) = 0$.'
    reponse: $x = 7$ ou $x = -\frac{1}{2}$
  - question: Résous $-4x \le 12$, puis écris $S$ sous forme d'intervalle.
    reponse: le sens change,
  - question: Résous $\left|x\right| = 6$, puis $\left|x\right| = -6$.
    reponse: ''
  - question: Résous le système formé de $x + y = 10$ et $x - y = 4$.
    reponse: ''
  lecons:
  - id: 2ndeC_M04_L1
    numero: '4.1'
    titre: Résoudre une équation du premier degré
    retenir:
    - 'Après réduction, une équation du premier degré s''écrit $ax + b = 0$ avec $a \ne 0$ : elle a'
    - 'Deux opérations autorisées : ajouter ou retrancher un même nombre aux deux membres ; multiplier'
    - Un terme qui change de membre **change de signe**. Un facteur qui change de membre devient un
    methode:
      titre: Résoudre $ax + b = cx + d$
      etapes:
      - S'il y a des fractions, multiplie **chaque terme des deux membres** par un dénominateur commun.
      - Développe et réduis, en surveillant le signe devant chaque parenthèse.
      - Regroupe les $x$ d'un côté, les nombres de l'autre, en changeant le signe de chaque terme déplacé.
      - Divise par le coefficient de $x$, vérifie dans l'équation de départ, écris $S$.
    exemple_resolu: 'Résoudre dans $\mathbb{R}$ : $5\left(x - 2\right) - 3\left(2x + 1\right) = 4$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On développe ; le moins change les **deux** signes de la seconde parenthèse. | $5x - 10 - 6x -
      3 = 4$ |

      | On réduit, puis on transpose $-13$. | $-x - 13 = 4$, soit $-x = 17$ |

      | Le coefficient de $x$ vaut $-1$ : on divise par $-1$. | $x = -17$ |

      | **Vérification :** $5 \times \left(-19\right) - 3 \times \left(-33\right) = 4$. ✓ $S = \left\{-17\right\}$.
      | |'
    erreurs_frequentes:
    - erreur: « $5x = 20$, donc $x = 100$ ».
      correction: 'le facteur devient un

        diviseur, $x = \frac{20}{5} = 4$.'
    - erreur: multiplier un seul membre par le dénominateur commun.
      correction: tous les termes des deux membres sont multipliés.
    - erreur: « $-x = 17$, donc $x = 17$ ».
      correction: $x = -17$.
    declic: L'équation n'est pas en cause, c'est le développement — Si tu écris $-3 \times \left(+1\right)
      = +3$, le blocage est dans la règle des signes, pas dans l'équation. Reprends le module 3, sinon
      chaque équation à parenthèses restera une loterie.
    figures: []
  - id: 2ndeC_M04_L2
    numero: '4.2'
    titre: Produit nul, carrés et valeur absolue
    retenir:
    - $A \times B = 0$ équivaut à $A = 0$ **ou** $B = 0$.
    - 'Pour se ramener à un produit : tout transposer dans un membre pour obtenir « $\ldots = 0$ », puis'
    - $x^{2} = a$ a deux solutions $\sqrt{a}$ et $-\sqrt{a}$ si $a > 0$ ; une seule, $0$, si $a = 0$ ;
    - $\left|a\right|$ est la distance de $a$ à zéro. Pour $k > 0$, $\left|X\right| = k$ équivaut à
    methode:
      titre: Ramener à un produit nul, ou traiter les deux cas
      etapes:
      - Transpose tout dans le premier membre, écris « $\ldots = 0$ ».
      - Factorise, puis écris que chaque facteur peut être nul.
      - 'Valeur absolue : regarde le signe de $k$ ; si $k \ge 0$, écris les **deux** équations'
      - Résous chaque équation obtenue, vérifie, écris $S$.
    exemple_resolu: 'Résoudre : **(1)** $x^{2} = 5x$ ; **(2)** $\left|3x - 2\right| = 7$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | **(1)** On transpose, on ne divise pas par $x$, on met $x$ en facteur. | $x\left(x - 5\right)
      = 0$, donc $x = 0$ ou $x = 5$ |

      | **(2)** Ici $k = 7 > 0$ : deux cas à écrire, jamais un seul. | $3x - 2 = 7$ ou $3x - 2 = -7$ |

      | On résout chacun, en soignant le signe. | $x = 3$ ou $x = \frac{-5}{3}$ |

      | **Vérification :** $5^{2} = 5 \times 5$ ; $\left|-7\right| = 7$. ✓ $S = \left\{\frac{-5}{3}\,;3\right\}$
      pour (2). | |'
    erreurs_frequentes:
    - erreur: diviser $x^{2} = 5x$ par $x$ et conclure $x = 5$.
      correction: 'on perd

        la solution $0$ ; on factorise, $S = \left\{0\,;5\right\}$.'
    - erreur: ne retenir qu'une solution ($x^{2} = 16$ donne $x = 4$).
      correction: $x = 4$ ou $x = -4$.
    - erreur: écrire « $x = 3$ **et** $x = -2$ ».
      correction: le mot est **ou**.
    declic: null
    figures: []
  - id: 2ndeC_M04_L3
    numero: '4.3'
    titre: Inéquations, intervalles et droite graduée
    retenir:
    - 'Ajouter ou retrancher un même nombre aux deux membres : le sens ne change pas.'
    - 'Multiplier ou diviser par un nombre strictement **positif** : le sens ne change pas.'
    - 'Multiplier ou diviser par un nombre strictement **négatif** : le sens **se retourne**'
    - La réponse est un **intervalle**, jamais un nombre isolé.
    - '|---|---|---|'
    methode:
      titre: Résoudre une inéquation
      etapes:
      - Développe, réduis, regroupe les $x$ d'un côté, les nombres de l'autre.
      - Isole $x$. Si tu divises par un négatif, **retourne le signe** et signale-le par écrit.
      - Écris $S$ sous forme d'intervalle, et représente-le si c'est demandé.
      - Contrôle avec une valeur prise dans ton intervalle.
    exemple_resolu: 'Un menuisier de Boulsa paie $25\,000$ FCFA de charges par mois et gagne

      $1\,500$ FCFA par tabouret. Combien en vendre pour un bénéfice net d''au moins $20\,000$ FCFA ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On nomme l''inconnue ; la quantité comparée est le bénéfice **net**. | $x$ tabourets ; bénéfice
      $1\,500x - 25\,000$ |

      | « Au moins » impose le signe $\ge$. | $1\,500x - 25\,000 \ge 20\,000$ |

      | On transpose, on divise par $1\,500 > 0$ : le sens ne change pas. | $1\,500x \ge 45\,000$, donc
      $x \ge 30$ |

      | **Vérification :** avec $30$, le bénéfice vaut $20\,000$ ; avec $29$, $18\,500$. ✓ Au moins $30$
      tabourets. | |'
    erreurs_frequentes:
    - erreur: « $-2x < 6$, donc $x < -3$ ».
      correction: 'division par $-2$, le sens

        se retourne, $x > -3$.'
    - erreur: répondre par un seul nombre, ou fermer le crochet de l'infini.
      correction: la réponse est un intervalle, et l'infini n'est pas un nombre.
    - erreur: $x \ge 37{,}5$ donne $37$ articles.
      correction: 'un « au moins »

        s''arrondit vers le **haut**, donc $38$ ; un « au plus », vers le bas.'
    declic: null
    figures:
    - figures/m04_f3.svg
  - id: 2ndeC_M04_L4
    numero: '4.4'
    titre: Systèmes $2 \times 2$ et mise en équation
    retenir:
    - Une solution est un **couple** $\left(x\,;y\right)$ qui vérifie les **deux** équations ; l'ordre
    - '**Substitution :** isoler une inconnue, la remplacer dans **l''autre** équation. Commode quand
      un'
    - '**Combinaison :** multiplier pour rendre **opposés** les coefficients d''une inconnue, puis'
    - Un système peut n'avoir aucune solution (équations contradictoires) ou une infinité (équations
    methode:
      titre: Résoudre par combinaison
      etapes:
      - Range les deux équations sous la forme $ax + by = c$.
      - Choisis l'inconnue à éliminer, multiplie chaque équation pour rendre ses coefficients opposés.
      - Additionne membre à membre, résous l'équation à une inconnue obtenue.
      - Reporte la valeur dans une équation de départ, vérifie le couple dans les deux.
    exemple_resolu: 'Résoudre le système formé de $3x + 2y = 16$ et $4x - 3y = -7$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Aucun coefficient ne vaut $1$ : combinaison, on élimine $y$. | Multiple commun de $2$ et $3$ :
      $6$ |

      | On multiplie la première par $3$, la seconde par $2$. | $9x + 6y = 48$ et $8x - 6y = -14$ |

      | On additionne, puis on reporte. | $17x = 34$, $x = 2$, puis $2y = 10$ et $y = 5$ |

      | **Vérification :** $3 \times 2 + 2 \times 5 = 16$ et $4 \times 2 - 3 \times 5 = -7$. ✓ $\left(2\,;5\right)$.
      | |'
    erreurs_frequentes:
    - erreur: reporter l'expression dans l'équation dont on l'a tirée.
      correction: on obtient $0 = 0$, vrai mais vide ; on reporte dans **l'autre** équation.
    - erreur: 'traduire « Awa a $8$ ans de plus que Bintou » par « Bintou a $x + 8$ ans »

        quand Awa a $x$ ans.'
      correction: Bintou a $x - 8$ ans.
