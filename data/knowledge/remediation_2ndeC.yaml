  - numero: 1
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : **a)** $-5x = 8$ ; **b)** $1 + x = -7$ ;

      **c)** $3x = 5$ ; **d)** $4x - 5 = -8$.'
    correction: a) $x = \frac{-8}{5}$ ; b) $x = -8$ ; c) $x = \frac{5}{3}$ ; d) $x = \frac{-3}{4}$.
  - numero: 2
