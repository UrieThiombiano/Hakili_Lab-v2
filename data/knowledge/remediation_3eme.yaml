  fiche_revision:
  - '**Opposé et distance à zéro.** L''opposé change le signe ; la distance à zéro l''efface : opposé
    de $-7$ : $+7$ ; distance : $7$.'
  - '**Comparer.** Négatif $< 0 <$ positif ; entre deux négatifs, le plus petit est le plus éloigné de
    zéro.'
  - '**Additionner.** Même signe : on ajoute les distances, on garde le signe. Signes contraires : on
    soustrait, signe du plus éloigné.'
  - '**Soustraire.** $a - b = a + \text{opp}\left(b\right)$ ; d''où $-\left(-a\right) = +a$.'
  - '**Règle des signes ($\times$, $\div$).** Même signe $\to +$ ; contraires $\to -$. Nombre pair de
    négatifs $\to +$, impair $\to -$.'
  - '**Puissances.** $\left(-a\right)^{2} = a^{2}$ ; $\left(-a\right)^{3} = -a^{3}$ ; $-a^{2}$ signifie
    $-\left(a^{2}\right)$.'
  - '**Priorités.** Produits et quotients avant les sommes : $-5 + 3 \times \left(-4\right) = -17$.'
