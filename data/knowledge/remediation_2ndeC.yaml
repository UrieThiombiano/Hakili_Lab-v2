      ### Entraînement ★★'
    correction: $f\left(x\right) = 150x + 500$ ; $150x = 3\,000$, donc $20$ plats.
  - numero: 18
    etoiles: 2
    enonce: 'Vrai ou faux, en justifiant : « par $f\left(x\right) = x^{2}$, chaque nombre possède un seul
      antécédent ».'
    correction: '**Faux.** $9$ a deux antécédents, $3$ et $-3$ ; $-1$ n''en a aucun. C''est l''unicité
      de l''**image** qui est exigée, pas celle de l''antécédent.'
  - numero: 19
    etoiles: 2
    enonce: 'Indique celles qui sont linéaires et donne alors leur coefficient : a) $x \mapsto 7x$ ; b)
      $x \mapsto 7x + 1$ ; c) $x \mapsto \frac{x}{4}$ ; d) $x \mapsto 4x^{2}$ ; e) $x \mapsto -x$ ; f)
