  reponse_attendue: 3 - 2x ∈ ]-5 ; 5] ; la borne atteinte est 5 (pour x = -1)
  solution: 'De -1 ≤ x < 4, en multipliant par -2 : -8 < -2x ≤ 2 ; en ajoutant 3 : -5 < 3 - 2x ≤ 5. 5
    = 3 - 2 × (-1) est atteint car x peut valoir -1. Barème : 1 pt pour l''intervalle ]-5 ; 5], crochets
    conformes aux inégalités ; 1 pt pour la borne 5 désignée et justifiée par x = -1. Un intervalle erroné
    dont la borne atteinte est correctement justifiée garde le second point.'
  si_echoue: 'Multiplication d''un encadrement par un nombre négatif : le sens des inégalités s''inverse
    et les deux bornes échangent leur rôle, la borne fermée devenant la borne supérieure.'
