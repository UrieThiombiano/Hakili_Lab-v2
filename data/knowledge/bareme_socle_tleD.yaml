  competence_secondaire: null
  domaine: Activites geometriques
  objet: Calculer AE dans un pavé (AG = 13, AC = 5), juger « ACG rectangle en C » (Boukary)
  reponse_attendue: AE = CG = 12 cm ; ACG rectangle en C, Boukary a raison
  solution: '(CG) ⊥ (ABC) : ACG rectangle en C, CG² = 13² - 5² = 144, CG = 12 = AE. Barème : 1 pt pour
    AE = 12 cm par emploi inverse de Pythagore dans ACG ; 1 pt pour l''angle droit en C justifié par la
    perpendicularité de (CG) au plan (ABC) et « Boukary a raison ». Autre démarche acceptée : AE² = 169
    - 9 - 16 = 144.'
  si_echoue: Emploi du théorème de Pythagore dans l'espace, et propriété d'une droite perpendiculaire
    à un plan.
