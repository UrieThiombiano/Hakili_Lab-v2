- niveau: 1ereD
  module: 5
  module_titre: Encadrer, approcher, partie entière
  pourquoi: Encadrer et majorer sont les gestes de base de l'Analyse, en 1ère D comme en Tle D. Savoir
    arrondir juste évite de perdre des points bêtement.
  diagnostic:
  - question: On a $3{,}2 \le x \le 3{,}4$ et $1{,}5 \le y \le 1{,}7$ (positifs). Encadre $x + y$ et $x
      \times y$.
    reponse: $4{,}7 \le x + y \le 5{,}1$ ; $4{,}8 \le xy \le 5{,}78$
  - question: Donne l'arrondi et la troncature à $10^{-2}$ de 5,2718.
    reponse: arrondi 5,27 ; troncature 5,27
  - question: On sait que $|a| \le 4$ et $|b| \le 3$. Majore $|a + b|$.
    reponse: $|a + b| \le 7$
  - question: Donne un ordre de grandeur de $297 \times 4{,}1$.
    reponse: environ $300 \times 4 = 1\,200$
  - question: Détermine $E\left(5{,}8\right)$ et $E\left(-2{,}3\right)$.
    reponse: $E\left(5{,}8\right) = 5$ ; $E\left(-2{,}3\right) = -3$
  lecons:
  - id: 1ereD_M05_L1
    numero: '5.1'
    titre: 'Encadrer : somme, différence, produit, quotient'
    retenir:
    - Encadrer $x$, c'est écrire $a \le x \le b$ ; le nombre $b - a$ est l'**amplitude**.
    - '**Somme :** si $a \le x \le b$ et $c \le y \le d$, alors $a + c \le x + y \le b + d$ (tous réels).'
    - '**Différence :** $a - d \le x - y \le b - c$ (on croise ; tous réels).'
    - '**Produit :** $ac \le xy \le bd$, **seulement si $a > 0$ et $c > 0$**. **Quotient :** $\frac{a}{d}
      \le \frac{x}{y} \le \frac{b}{c}$, même condition.'
    - '**Facteur négatif :** rends-le positif en passant à l''opposé (l''encadrement s''inverse), multiplie,
      puis reviens en $\times\left(-1\right)$ en inversant le sens.'
    methode:
      titre: Encadrer une expression étape par étape
      etapes:
      - Décompose l'expression en opérations élémentaires et applique-les une par une.
      - 'Ajouter un nombre, ou multiplier par un nombre **positif** : ordre **conservé**.'
      - 'Multiplier par un négatif, ou passer à l''inverse $\frac{1}{x}$ ($x > 0$) : ordre **retourné**,
        les bornes échangent leur place.'
      - Contrôle à la fin avec une valeur autorisée de $x$.
    exemple_resolu: 'On sait que $-2 < x < -1$ et $2 < y < 3$. Encadre $xy$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $x$ est négatif : on passe à $-x$, l''encadrement s''inverse. | $1 < -x < 2$ |

      | $-x$ et $y$ sont positifs : on multiplie les bornes. | $2 < -xy < 6$ |

      | On multiplie par $-1$ : le sens s''inverse. | $-6 < xy < -2$ |

      | **Vérification :** $x = -1{,}5$, $y = 2{,}5$ donnent $xy = -3{,}75 \in \left]-6\,;\,-2\right[$.
      ✓ | |'
    erreurs_frequentes:
    - erreur: « $2 < x < 3$ donc $2 - 1 < x - x < 3 - 1$ ».
      correction: $x - x = 0$ ; la règle de la différence exige deux quantités **indépendantes**.
    - erreur: « $-2 < x < 3$ donne $4 < x^{2} < 9$ ».
      correction: l'encadrement contient zéro, donc $0 \le x^{2} < 9$.
    declic: null
    figures: []
  - id: 1ereD_M05_L2
    numero: '5.2'
    titre: Valeur absolue, valeur approchée, arrondi
    retenir:
    - $|ab| = |a|\,|b|$ ; $\left|\frac{a}{b}\right| = \frac{|a|}{|b|}$ ($b \ne 0$) ; **$|a + b| \le |a|
      + |b|$** (inégalité triangulaire).
    - 'Pour $r > 0$ : $|x| \le r$ équivaut à $-r \le x \le r$ ; $|x - c| \le r$ équivaut à $c - r \le
      x \le c + r$ (centre $c$, rayon $r$).'
    - $v$ est une **valeur approchée** de $x$ à $10^{-n}$ près si $|x - v| \le 10^{-n}$.
    - '**Troncature** d''ordre $n$ : on coupe après la $n$ᵉ décimale. **Arrondi** : on regarde la décimale
      suivante ($\ge 5$ au-dessus, sinon au-dessous).'
    - '**Ordre de grandeur :** valeur approchée grossière, pour contrôler un résultat.'
    methode:
      titre: Majorer une expression
      etapes:
      - Écris l'expression comme somme ou produit de termes dont tu connais une borne.
      - Applique $|a + b| \le |a| + |b|$ ou $|ab| = |a|\,|b|$.
      - 'Remplace chaque $|\cdot|$ par sa borne : le résultat est un majorateur sûr.'
    exemple_resolu: '$|a| \le 3$ et $|b| \le 2$. Majore $|a + b|$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Inégalité triangulaire. | $|a + b| \le |a| + |b|$ |

      | On remplace par les bornes. | $|a| + |b| \le 3 + 2 = 5$ |

      | Conclusion en encadrement. | $|a + b| \le 5$, soit $-5 \le a + b \le 5$ |

      | **Vérification :** $a = 3$, $b = -2$ donnent $|a+b| = 1 \le 5$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\sqrt{a + b} = \sqrt{a} + \sqrt{b}$.
      correction: $\sqrt{9 + 16} = 5$ alors que $3 + 4 = 7$.
    - erreur: arrondir $3{,}148$ à $10^{-2}$ en coupant, soit 3,14.
      correction: l'arrondi est 3,15 ; troncature $\ne$ arrondi.
    declic: 'Encadrer, c''est déjà faire de l''Analyse — Les questions difficiles ne demandent pas de
      **calculer** un nombre, mais de le **contrôler** : rester positif sur un intervalle, une erreur
      sous $10^{-3}$, une suite qui ne dépasse jamais 3. Tout se traite avec les gestes de ce module.'
    figures:
    - figures/m05_f8.svg
  - id: 1ereD_M05_L3
    numero: '5.3'
    titre: La partie entière
    retenir:
    - '$E\left(x\right)$ est le **plus grand entier inférieur ou égal à $x$** : $E\left(x\right) \le x
      < E\left(x\right) + 1$.'
    - '$E\left(x\right)$ est le **seul** entier $n$ vérifiant $n \le x < n + 1$ : c''est ainsi qu''on
      la démontre sans virgule ($2 \le \sqrt{7} < 3$ car $4 \le 7 < 9$, donc $E\left(\sqrt{7}\right) =
      2$).'
    - '$x - E\left(x\right)$ est la **partie fractionnaire** : $0 \le x - E\left(x\right) < 1$, jamais
      négative.'
    - 'Pour $k$ **entier** : $E\left(x + k\right) = E\left(x\right) + k$.'
    methode:
      titre: Déterminer $E\left(x\right)$
      etapes:
      - 'Place $x$ entre deux entiers consécutifs : $n \le x < n + 1$.'
      - 'La partie entière est l''entier **de gauche** : $E\left(x\right) = n$.'
      - Pour un négatif non entier, prends l'entier **juste en dessous**.
    exemple_resolu: 'Détermine $E\left(3{,}7\right)$, $E\left(-3{,}2\right)$, $E\left(\sqrt{2}\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $3{,}7$ est entre 3 et 4. | $E\left(3{,}7\right) = 3$ |

      | L''entier en dessous de $-3{,}2$ est $-4$. | $E\left(-3{,}2\right) = -4$ |

      | $1 < \sqrt{2} < 2$. | $E\left(\sqrt{2}\right) = 1$ |

      | **Vérification :** $-4 \le -3{,}2 < -3$. ✓ | |'
    erreurs_frequentes:
    - erreur: « $E\left(-3{,}2\right) = -3$ » (on coupe la virgule).
      correction: $-4$ ; pour les négatifs, la partie entière descend d'un cran.
    - erreur: $E\left(x + y\right) = E\left(x\right) + E\left(y\right)$.
      correction: 'faux ($x = y = 1{,}6$ : $1 + 1 = 2$ contre $E\left(3{,}2\right) = 3$) ; seule $E\left(x
        + k\right) = E\left(x\right) + k$, $k$ entier, est vraie.'
    declic: null
    figures:
    - figures/m05_f6.svg
