  solution: 'Prix payé = 85 % du prix initial : 51 000 × 100 / 85 = 60 000 FCFA. La remise porte sur le
    prix avant remise : 15 × 60 000 / 100 = 9 000 FCFA (vérification 60 000 - 51 000 = 9 000). Barème
    : 1 pt pour le prix avant remise 60 000 FCFA retrouvé à partir des 85 % ; 1 pt pour « il a tort »
    justifié par la remise de 9 000 FCFA et la base du pourcentage. Accepter la vérification par soustraction.
    Erreur propagée : un prix faux suivi d''une remise obtenue par soustraction garde le second point.'
  si_echoue: 'Retour au prix initial après une remise : l''élève applique le pourcentage au prix réduit
    au lieu du prix initial.'
