- niveau: 2ndeC
  module: 6
  module_titre: 'Repérage dans le plan : coordonnées, milieu, distance'
  pourquoi: Abscisse et ordonnée s'inversent, la demi-somme du milieu devient une demi-différence, la
    racine de la distance s'oublie. Tout ce qui suit en 2nde C, des vecteurs au produit scalaire, dépend
    d'un repère tenu proprement.
  diagnostic:
  - question: Sur une droite graduée, $A$ a pour abscisse $-2$ et $B$ pour abscisse $6$. Abscisse du milieu
      de $\left[AB\right]$ ?
    reponse: $2$
  - question: Sur quel axe se trouve $C\left(0\,;\,-3\right)$ ?
    reponse: axe des ordonnées, abscisse nulle
  - question: Milieu de $\left[GH\right]$, avec $G\left(-7\,;\,2\right)$ et $H\left(-1\,;\,-8\right)$
      ?
    reponse: $\left(-4\,;\,-3\right)$
  - question: Repère orthonormal. Calcule $AB$ pour $A\left(0\,;\,0\right)$ et $B\left(3\,;\,4\right)$.
    reponse: $\sqrt{9 + 16} = 5$
  - question: Le point $P\left(2\,;\,5\right)$ appartient-il à la droite d'équation $y = 2x + 1$ ?
    reponse: oui, $2 \times 2 + 1 = 5$
  lecons:
  - id: 2ndeC_M06_L1
    numero: '6.1'
    titre: 'Repère du plan : lire et placer un point'
    retenir:
    - 'Un **repère** du plan : une **origine** $O$ et **deux axes gradués** sécants en $O$, l''axe des
      **abscisses** et l''axe des **ordonnées**.'
    - 'Tout point s''écrit $M\left(x\,;\,y\right)$, l''abscisse **toujours en premier** : $\left(3\,;\,-2\right)$
      et $\left(-2\,;\,3\right)$ sont deux points différents.'
    - 'Repère **orthogonal** : axes perpendiculaires. Repère **orthonormal** : de plus, **même unité**
      sur les deux axes.'
    - 'Ordonnée nulle : le point est sur l''axe des **abscisses**. Abscisse nulle : sur l''axe des **ordonnées**.
      Origine : $O\left(0\,;\,0\right)$.'
    methode:
      titre: Placer le point $M\left(x\,;\,y\right)$
      etapes:
      - Trace les deux axes, marque $O$, gradue avec la **même** unité.
      - 'Pars de $O$, avance de $x$ horizontalement : à droite si $x > 0$, à gauche si $x < 0$.'
      - 'De là, avance de $y$ verticalement : vers le haut si $y > 0$, vers le bas si $y < 0$.'
      - Marque une croix nette et écris le nom du point à côté.
    exemple_resolu: 'Repère orthonormal d''unité $1$ cm : placer $A\left(3\,;\,2\right)$, $B\left(-2\,;\,4\right)$
      et $C\left(0\,;\,-3\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $A$ : deux coordonnées positives. | $3$ cm à droite, puis $2$ cm vers le haut. |

      | $B$ : abscisse négative. | $2$ cm à gauche, puis $4$ cm vers le haut. |

      | $C$ : abscisse nulle, aucun déplacement horizontal. | $0$ cm horizontalement, puis $3$ cm vers
      le bas. |

      | **Vérification :** $C$ tombe sur l''axe des ordonnées, sous $O$. ✓ | |


      [SVG: figures/m06_f1.svg]

      *Figure 6.1 : Les quatre régions du repère ; le signe des deux coordonnées dit dans laquelle se
      trouve le point.*'
    erreurs_frequentes:
    - erreur: placer $A\left(2\,;\,5\right)$ en avançant de $5$ à droite puis de $2$ vers le haut.
      correction: l'abscisse est le premier nombre et se lit sur l'axe horizontal.
    - erreur: pour le symétrique par rapport à l'axe des **abscisses**, changer le signe de l'**abscisse**.
      correction: c'est l'**ordonnée** qui change de signe.
    declic: null
    figures:
    - figures/m06_f1.svg
  - id: 2ndeC_M06_L2
    numero: '6.2'
    titre: Le milieu d'un segment
    retenir:
    - 'Milieu $I$ de $\left[AB\right]$ :'
    - '**Dans l''autre sens** : si $I$ est le milieu de $\left[AB\right]$ et $A$ connu, alors $x_{B} =
      2x_{I} - x_{A}$ et $y_{B} = 2y_{I} - y_{A}$ : le **double du milieu, moins le point connu**.'
    - 'Contrôle immédiat : $x_{I}$ est **entre** $x_{A}$ et $x_{B}$, et $y_{I}$ entre $y_{A}$ et $y_{B}$.'
    - 'Les diagonales d''un **parallélogramme** ont le même milieu : milieu de $\left[AC\right]$ = milieu
      de $\left[BD\right]$.'
    methode:
      titre: Calculer le milieu de $\left[AB\right]$
      etapes:
      - Écris $A\left(x_{A}\,;\,y_{A}\right)$ et $B\left(x_{B}\,;\,y_{B}\right)$ avec leurs signes.
      - Calcule $x_{I} = \frac{x_{A} + x_{B}}{2}$, puis $y_{I} = \frac{y_{A} + y_{B}}{2}$.
      - Écris $I\left(x_{I}\,;\,y_{I}\right)$.
      - Contrôle que chaque coordonnée est encadrée par celles de $A$ et de $B$.
    exemple_resolu: 'Jardin de Diapaga, portail à l''origine, un carreau vaut $10$ m. Deux bassins en
      $A\left(-6\,;\,4\right)$ et $B\left(2\,;\,-2\right)$. Où creuser le forage, à mi-chemin des deux
      ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Mi-chemin de deux points = leur milieu ; d''abord les abscisses. | $x_{F} = \frac{-6 + 2}{2} =
      -2$ |

      | Même calcul sur les ordonnées. | $y_{F} = \frac{4 + \left(-2\right)}{2} = 1$ |

      | On assemble, puis on traduit pour le jardinier. | $F\left(-2\,;\,1\right)$, soit $20$ m à gauche
      du portail et $10$ m au-dessus. |

      | **Vérification :** $-2$ est entre $-6$ et $2$ ; $1$ est entre $-2$ et $4$. ✓ | |'
    erreurs_frequentes:
    - erreur: demi-**différence** au lieu de demi-somme, et annoncer $\left(5\,;\,-5\right)$ pour $A\left(-4\,;\,2\right)$
        et $B\left(6\,;\,-8\right)$.
      correction: $\left(\frac{-4 + 6}{2}\,;\,\frac{2 - 8}{2}\right) = \left(1\,;\,-3\right)$.
    - erreur: faire la moyenne du milieu $M$ et de l'extrémité $B$ pour retrouver $A$.
      correction: c'est $x_{A} = 2x_{M} - x_{B}$.
    declic: null
    figures: []
  - id: 2ndeC_M06_L3
    numero: '6.3'
    titre: Distance de deux points
    retenir:
    - 'Repère **orthonormal**, $A\left(x_{A}\,;\,y_{A}\right)$ et $B\left(x_{B}\,;\,y_{B}\right)$ :'
    - 'Hors repère orthonormal, la formule est fausse : il faut l''angle droit et l''unité commune.'
    - Le sens des soustractions est sans importance, les écarts sont au carré ; $AB = BA > 0$.
    - 'Résultat en **valeur exacte simplifiée** : $\sqrt{50} = 5\sqrt{2}$.'
    - '**Nature d''un triangle** : deux carrés égaux, isocèle ; plus grand carré égal à la somme des deux
      autres, rectangle (réciproque de Pythagore).'
    - '**Cercle** de centre $\Omega$ et de rayon $r$ : $M$ est dessus si $\Omega M = r$, dedans si $\Omega
      M < r$, dehors si $\Omega M > r$.'
    methode:
      titre: Calculer une distance
      etapes:
      - Vérifie que le repère est **orthonormal**.
      - Calcule la différence des abscisses, puis celle des ordonnées.
      - Élève chacune au carré, additionne, prends la racine carrée.
      - Simplifie la racine et n'oublie pas l'unité.
    exemple_resolu: 'Calculer $AB$ pour $A\left(-4\,;\,2\right)$ et $B\left(3\,;\,3\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les deux différences, dans le même ordre. | $3 - \left(-4\right) = 7$ et $3 - 2 = 1$. |

      | On reporte, chaque écart au carré. | $AB = \sqrt{7^{2} + 1^{2}} = \sqrt{49 + 1}$ |

      | On extrait le plus grand carré parfait. | $AB = \sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}$ |

      | **Vérification :** $5\sqrt{2} \approx 7$, cohérent avec sept carreaux de large. ✓ | |


      [SVG: figures/m06_f4.svg]

      *Figure 6.4 : Le triangle rectangle caché derrière la formule : les côtés de l''angle droit sont
      les écarts de coordonnées.*'
    erreurs_frequentes:
    - erreur: écrire $AB = \left(x_{B} - x_{A}\right)^{2} + \left(y_{B} - y_{A}\right)^{2}$.
      correction: ce calcul donne $AB^{2}$ ; si $AB^{2} = 25$, alors $AB = 5$.
    - erreur: additionner les deux écarts, $3 + 4 = 7$.
      correction: c'est le chemin en équerre ; le segment coupe en diagonale et vaut $5$.
    declic: 'La racine reste-t-elle sous cette forme ? — Si tu t''arrêtes à $AB = \sqrt{50}$ sans savoir
      écrire $5\sqrt{2}$, le blocage n''est pas ici : il est dans la simplification d''un radical. Reprends
      le module 2, puis reviens terminer les distances. La formule, elle, est déjà juste.'
    figures:
    - figures/m06_f4.svg
  - id: 2ndeC_M06_L4
    numero: '6.4'
    titre: Un point est-il sur une droite d'équation donnée ?
    retenir:
    - '$M\left(x_{M}\,;\,y_{M}\right)$ appartient à $\left(d\right) : y = ax + b$ **si et seulement si**
      $y_{M} = a x_{M} + b$.'
    - 'On **remplace $x$ par l''abscisse**, on calcule, on **compare à l''ordonnée**. Égalité : le point
      y est. Sinon, il n''y est pas.'
    - 'Le même test dans l''autre sens : abscisse connue, l''équation donne l''ordonnée ; ordonnée connue,
      elle donne l''abscisse par une équation du premier degré.'
    - 'Droite **verticale** : $x = c$. Droite **horizontale** : $y = c$. Axe des abscisses : $y = 0$ ;
      axe des ordonnées : $x = 0$.'
    methode:
      titre: Tester l'appartenance
      etapes:
      - Écris l'équation et les coordonnées du point.
      - Remplace $x$ par l'**abscisse** dans le membre de droite, et calcule.
      - Compare le nombre obtenu à l'**ordonnée** du point.
      - Conclus par une phrase.
    exemple_resolu: 'À Ziniaré, la conduite d''eau suit $\left(d\right) : y = 3x - 4$, l''unité valant
      $10$ m. Le regard $R\left(5\,;\,11\right)$ est-il sur la conduite ? Quelle est l''ordonnée du piquet
      d''abscisse $2$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On remplace $x$ par $5$ dans le membre de droite. | $3 \times 5 - 4 = 11$. |

      | On compare à l''ordonnée de $R$. | $11 = y_{R}$, donc $R$ appartient à $\left(d\right)$. |

      | Pour le piquet, l''abscisse est connue. | $y = 3 \times 2 - 4 = 2$, donc $\left(2\,;\,2\right)$.
      |

      | **Vérification :** de $\left(2\,;\,2\right)$ à $\left(5\,;\,11\right)$, $+3$ en abscisse et $+9$
      en ordonnée, soit trois fois plus. ✓ | |


      [SVG: figures/m06_f6.svg]

      *Figure 6.6 : La droite d''équation $y = 2x - 1$ : un point la vérifie, l''autre non.*'
    erreurs_frequentes:
    - erreur: remplacer $x$ par l'ordonnée.
      correction: dans $\left(x\,;\,y\right)$ comme dans $y = ax + b$, $x$ est l'abscisse.
    - erreur: conclure que le point est sur la droite parce que le calcul donne un nombre.
      correction: ce qui décide, c'est l'**égalité** avec l'ordonnée.
    declic: null
    figures:
    - figures/m06_f6.svg
