      **Exercice 18 (Koudougou).** ★★ Un tisserand vend $x$ pagnes de Faso Dan Fani par jour ($0 \le x
      \le 40$). Son bénéfice quotidien, en milliers de FCFA, est $B\left(x\right) = -x^{2} + 36x - 155$.
