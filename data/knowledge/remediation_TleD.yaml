      (étudie $\frac{6 - 2x}{x}$).


      **Exercice 20 (J''écris et j''explique).** ★★ Explique, avec un exemple et en t''appuyant sur la
      forme factorisée $a\left(x - x_{1}\right)\left(x - x_{2}\right)$, pourquoi un trinôme de discriminant
      strictement positif est « du signe de $a$ à l''extérieur des racines ».


      ### ★★★ Défis de maîtrise'
    correction: 'a) Racines $1$ et $3$, $a > 0$ : $\left]-\infty\,;\,1\right[ \cup \left]3\,;\,+\infty\right[$.
      b) $\Delta = 9$, racines $\frac{1}{2}$ et $2$, $a < 0$ : $\left[\frac{1}{2}\,;\,2\right]$. c) $\Delta
      < 0$ et $a > 0$ : aucune solution.'
  - numero: 21
    etoiles: 3
    enonce: a) Un trinôme $f\left(x\right) = ax^{2} + bx + c$ admet pour racines $-2$ et $5$, et vérifie
      $f\left(0\right) = -20$. Retrouve $a$, $b$, $c$, puis les coordonnées du sommet de sa parabole.
      b) Un trinôme $g$ est strictement négatif sur $\left]-\infty\,;\,1\right[$, strictement positif
      sur $\left]1\,;\,4\right[$ et strictement négatif sur $\left]4\,;\,+\infty\right[$. Que peux-tu
      affirmer sur le signe de son coefficient dominant et sur son discriminant ? Justifie.
    correction: '*Piste :* avec les racines connues, partir de la forme factorisée, une seule inconnue
      reste.

      a) $f\left(x\right) = a\left(x + 2\right)\left(x - 5\right)$ ; $f\left(0\right) = -10a = -20$ donc
      $a = 2$, puis $f\left(x\right) = 2x^{2} - 6x - 20$ : $a = 2$, $b = -6$, $c = -20$. Sommet : $x =
      -\frac{b}{2a} = \frac{3}{2}$ (demi-somme des racines) et $f\left(\frac{3}{2}\right) = -\frac{49}{2}$,
      soit $S\left(\frac{3}{2}\,;\,-\frac{49}{2}\right)$, minimum car $a > 0$.

      b) Deux changements de signe, donc deux racines : $\Delta > 0$. $g$ est négatif à l''extérieur des
      racines, or à l''extérieur le trinôme est du signe de $a$ : donc $a < 0$, et $g\left(x\right) =
      a\left(x - 1\right)\left(x - 4\right)$ avec $a < 0$.'
  - numero: 22
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Si le discriminant d''un trinôme est strictement positif, ce trinôme change deux fois de signe
      sur $\mathbb{R}$.

      b) Un trinôme de discriminant strictement négatif n''a pas de signe constant sur $\mathbb{R}$.

      c) L''ensemble des solutions de $\frac{x - 1}{x - 3} \geq 0$ est $\left]-\infty\,;\,1\right] \cup
      \left[3\,;\,+\infty\right[$.

      d) Pour tout réel $x$, $x^{2} + x + 1 > 0$.'
    correction: '*Piste :* pour un quotient, écrire l''ensemble de définition avant tout.

      a) **Vrai** : $a\left(x - x_{1}\right)\left(x - x_{2}\right)$ est du signe de $a$, puis de $-a$,
      puis de $a$.

      b) **Faux** : si $\Delta < 0$, le trinôme garde constamment le signe de $a$. Contre-exemple : $x^{2}
      + x + 1 > 0$ partout.

      c) **Faux** : $3$ est valeur interdite, le crochet doit être ouvert. $S = \left]-\infty\,;\,1\right]
      \cup \left]3\,;\,+\infty\right[$.

      d) **Vrai** : $\Delta = -3 < 0$ et $a = 1 > 0$ ; ou $\left(x + \frac{1}{2}\right)^{2} + \frac{3}{4}
      > 0$.'
  - numero: 23
    etoiles: 3
    enonce: On considère l'équation $x^{2} - 2mx + m - 1 = 0$, d'inconnue $x$, où $m$ est un réel quelconque.
      a) Démontre que, quelle que soit la valeur de $m$, cette équation admet deux solutions distinctes.
      b) Pour quelle valeur de $m$ les deux solutions sont-elles opposées ? Donne alors ces solutions.
      c) Existe-t-il une valeur de $m$ pour laquelle les deux solutions sont inverses l'une de l'autre
      ?
    correction: '*Piste :* calculer $\Delta$ en fonction de $m$, c''est un trinôme en $m$ dont on calcule
      à son tour le discriminant ; en b) et c), les relations somme-produit suffisent.

      a) $\Delta = 4m^{2} - 4\left(m - 1\right) = 4\left(m^{2} - m + 1\right)$. Le trinôme $m^{2} - m
      + 1$ a pour discriminant $-3 < 0$ et un coefficient dominant positif : il est strictement positif
      pour tout $m$. Donc $\Delta > 0$ toujours : deux solutions distinctes.

      b) Opposées $\iff x_{1} + x_{2} = 2m = 0 \iff m = 0$. L''équation devient $x^{2} - 1 = 0$ : solutions
      $-1$ et $1$.

      c) Inverses $\iff x_{1}x_{2} = m - 1 = 1 \iff m = 2$. L''équation $x^{2} - 4x + 1 = 0$ donne $2
      \pm \sqrt{3}$, de produit $1$ ✓. Oui, pour $m = 2$.'
  - numero: 24
    etoiles: 3
    enonce: Résous dans $\mathbb{R}$ l'inéquation $\frac{x^{2} - 4}{x^{2} - 5x + 6} \leq 0$. Ton corrigé
      devra comporter l'ensemble de définition, un tableau de signes complet et un ensemble de solutions
      écrit en réunion d'intervalles.
    correction: '*Piste :* on peut simplifier, mais seulement après avoir écrit l''ensemble de définition,
      sinon la valeur interdite $2$ est perdue.

      $x^{2} - 5x + 6 = \left(x - 2\right)\left(x - 3\right)$ : il faut $x \ne 2$ et $x \ne 3$. Alors
      $\frac{x^{2} - 4}{x^{2} - 5x + 6} = \frac{x + 2}{x - 3}$.


      | $x$ | $-\infty$ | | $-2$ | | $3$ | | $+\infty$ |

      |---|---|---|---|---|---|---|---|

      | $x + 2$ | | $-$ | $0$ | $+$ | | $+$ | |

      | $x - 3$ | | $-$ | | $-$ | $0$ | $+$ | |

      | quotient | | $+$ | $0$ | $-$ | ‖ | $+$ | |


      Le quotient est négatif ou nul sur $\left[-2\,;\,3\right[$ ; on en retire $2$ : $S = \left[-2\,;\,2\right[
      \cup \left]2\,;\,3\right[$. Contrôle : $x = 0$ donne $-\frac{4}{6} < 0$ ✓, $x = 4$ donne $6 > 0$
      ✓.'
  - numero: 25
    etoiles: 3
    enonce: 'Voici la copie de Moussa, qui devait résoudre $\frac{2}{x - 1} \leq 3$. Trouve la ligne fausse,
      explique le geste interdit, puis rédige la résolution correcte avec un tableau de signes. Vérifie
      enfin que $x = 0$ est solution, alors que la copie l''exclut.


      | Ligne | Ce que Moussa a écrit |

      |---|---|

      | 1 | $\frac{2}{x - 1} \leq 3$ |

      | 2 | donc $2 \leq 3\left(x - 1\right)$ |

      | 3 | $2 \leq 3x - 3$, donc $x \geq \frac{5}{3}$ |

      | 4 | $S = \left[\frac{5}{3}\,;\,+\infty\right[$ |'
    correction: '*Piste :* la ligne 2 est fausse ; Moussa multiplie par $x - 1$ sans en connaître le signe,
      ce qui fait disparaître toute la branche $x < 1$.

      Pour $x \ne 1$ : $\frac{2}{x - 1} \le 3 \iff \frac{2 - 3\left(x - 1\right)}{x - 1} \le 0 \iff \frac{5
      - 3x}{x - 1} \le 0$.


      | $x$ | $-\infty$ | | $1$ | | $\frac{5}{3}$ | | $+\infty$ |

      |---|---|---|---|---|---|---|---|

      | $5 - 3x$ | | $+$ | | $+$ | $0$ | $-$ | |

      | $x - 1$ | | $-$ | $0$ | $+$ | | $+$ | |

      | quotient | | $-$ | ‖ | $+$ | $0$ | $-$ | |


      $S = \left]-\infty\,;\,1\right[ \cup \left[\frac{5}{3}\,;\,+\infty\right[$. Pour $x = 0$ : $\frac{2}{-1}
      = -2 \le 3$ ✓, donc $0$ est bien solution.'
  - numero: 26
    etoiles: 3
    enonce: Un maraîcher de Loumbila dispose de $60$ m de grillage pour clôturer un enclos rectangulaire
      adossé au mur de son hangar, le mur remplaçant l'un des quatre côtés. Détermine les dimensions qui
      rendent l'aire maximale, et cette aire maximale. Peut-il espérer atteindre $500$ m² ? Justifie sans
      essais numériques.
    correction: '*Piste :* le mur remplace un côté, le grillage n''en couvre que trois ; une contrainte
      élimine une inconnue.

      Avec $x$ la largeur (deux côtés) et $y$ le côté le long du mur : $2x + y = 60$, donc $y = 60 - 2x$
      et $0 < x < 30$. L''aire vaut $\mathcal{A}\left(x\right) = -2x^{2} + 60x$, trinôme de coefficient
      dominant $-2 < 0$, maximal en $x = 15$. Alors $y = 30$ et $\mathcal{A}\left(15\right) = 450$ : enclos
      de $15$ m sur $30$ m, aire maximale $450$ m². Les $500$ m² sont hors d''atteinte : $-2x^{2} + 60x
      = 500$ donne $x^{2} - 30x + 250 = 0$, de discriminant $-100 < 0$, sans solution réelle.


      ---'
  fiche_revision:
  - '**Affine.** $ax + b$ s''annule en $-\frac{b}{a}$, signe de $a$ après.'
  - '**Produit et quotient.** Une ligne par facteur, racines rangées en croissant, règle des signes en
    dernière ligne.'
  - '**Valeur interdite.** Double barre ‖ dans le tableau, crochet toujours ouvert dans $S$.'
  - '**Discriminant.** $\Delta = b^{2} - 4ac$ ; $\Delta > 0$ deux racines, $\Delta = 0$ racine double,
    $\Delta < 0$ aucune.'
  - '**Signe du trinôme.** Signe de $a$ à l''extérieur des racines, signe de $-a$ entre.'
  - '**Somme et produit.** $x_{1} + x_{2} = -\frac{b}{a}$, $x_{1}x_{2} = \frac{c}{a}$ ; racine évidente
    si $a + b + c = 0$.'
  - '**Inéquation.** Tout ramener d''un côté, réduire au même dénominateur, tableau de signes.'
  trouve_erreur:
  - faux: $\frac{2}{x - 1} \le 3 \Rightarrow 2 \le 3\left(x - 1\right)$
    correction: 'Signe de $x - 1$ inconnu : passer par $\frac{5 - 3x}{x - 1} \le 0$'
  - faux: $x^{2} \le 9 \Rightarrow x \le 3$
    correction: $-3 \le x \le 3$
  - faux: $\frac{x + 1}{x - 2} \ge 0$ sur $\left]-\infty\,;\,-1\right] \cup \left[2\,;\,+\infty\right[$
    correction: Crochet ouvert en $2$ (valeur interdite)
  - faux: $\Delta < 0$ donc l'inéquation n'a pas de solution
    correction: '$\Delta < 0$ et $a > 0$ : le trinôme est positif partout'
