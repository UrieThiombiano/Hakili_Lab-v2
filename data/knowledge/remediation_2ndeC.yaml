    correction: 'Des essais numériques ne prouvent rien, il faut traiter la lettre. Différence de deux
      carrés, $a = n + 3$, $b = n - 3$ : $6 \times 2n = 12n$, multiple de $12$ car $n$ est entier.'
  - numero: 44
    etoiles: 3
    enonce: L'aire d'un terrain carré s'écrit, développée, $x^{2} + 18x + 81$, en mètres carrés. Retrouve
      la longueur de son côté, puis son périmètre réduit. Pour quelle valeur de $x$ l'aire vaut-elle $400$
      m² ?
    correction: 'Le terrain est **carré** : l''expression est un carré parfait. Double produit $18x$ ✓,
      donc aire $\left(x + 9\right)^{2}$, côté $x + 9$, périmètre $4x + 36$. Puis $\left(x - 11\right)\left(x
      + 29\right) = 0$ : $x = 11$, côté $20$ m.'
  - numero: 45
    etoiles: 3
    enonce: 'Vrai ou faux ? Tranche et prouve, par un calcul ou un contre-exemple.

      a) Pour tout nombre $x$, $\left(x + 3\right)^{2} = x^{2} + 9$.

      b) $x^{2} + 25$ se factorise en $\left(x + 5\right)^{2}$.

      c) Pour tous nombres $a$ et $b$, $\left(a - b\right)^{2} = \left(b - a\right)^{2}$.

      d) $\frac{x^{2} - 1}{x - 1}$ est égale à $x + 1$ pour tout nombre $x$.'
    correction: 'a) **Faux** : $\left(x + 3\right)^{2} = x^{2} + 6x + 9$ ; pour $x = 1$, $16 \ne 10$.
      b) **Faux** : une somme de deux carrés ne se factorise pas. c) **Vrai** : $b - a = -\left(a - b\right)$,
      deux opposés ont le même carré. d) **Faux** : vrai seulement pour $x \ne 1$.'
  - numero: 46
    etoiles: 3
    enonce: 'Voici la copie d''un élève qui devait factoriser $K = \left(2x - 1\right)^{2} - \left(2x
      - 1\right)\left(x + 3\right)$.

      *Ligne 1 :* $K = 4x^{2} - 4x + 1 - \left(2x^{2} + 6x - x - 3\right)$

      *Ligne 2 :* $K = 4x^{2} - 4x + 1 - 2x^{2} + 6x - x - 3$

      *Ligne 3 :* $K = 2x^{2} + x - 2$

      Trouve la ligne qui casse, explique l''erreur, puis reprends par la méthode la plus courte.'
    correction: 'La **ligne 2** casse : le « $-$ » ne change que le premier signe ; il fallait $2x^{2}
      - 9x + 4$. Mais l''énoncé demande de **factoriser** : $\left(2x - 1\right)$ est commun, donc $K
      = \left(2x - 1\right)\left(x - 4\right)$.'
  - numero: 47
    etoiles: 3
    enonce: 'À Kokologho, le comité du marché hésite entre deux plans pour l''aire de vente ; la largeur
      du terrain ne sera connue qu''au bornage. Plan 1 : un carré de côté la largeur augmentée de $4$
      m, dont on retire un carré de $4$ m de côté (socle du château d''eau). Plan 2 : un rectangle de
      largeur celle du terrain et de longueur cette largeur augmentée de $8$ m. Un membre soutient que
      le plan 1 offrira toujours plus de place. Tranche.'
    correction: 'La largeur est inconnue : on la nomme $x$ et on compare pour **toute** valeur. Plan 1
      : $\left(x + 4\right)^{2} - 4^{2} = x^{2} + 8x$. Plan 2 : $x\left(x + 8\right) = x^{2} + 8x$. Surfaces
      égales quelle que soit la largeur : **le membre a tort**.'
  - numero: 48
    etoiles: 3
    enonce: On pose $F\left(x\right) = \frac{x^{2} - 6x + 9}{x^{2} - 9}$. Donne les valeurs interdites,
      simplifie $F\left(x\right)$, puis calcule $F\left(5\right)$ de deux façons.
    correction: 'On factorise avant de simplifier, valeurs interdites lues sur le dénominateur de départ.
      $x^{2} - 9 = \left(x - 3\right)\left(x + 3\right)$ : $x \ne 3$ et $x \ne -3$. $x^{2} - 6x + 9 =
      \left(x - 3\right)^{2}$, donc $F\left(x\right) = \frac{x - 3}{x + 3}$ et $F\left(5\right) = \frac{4}{16}
      = \frac{2}{8} = \frac{1}{4}$. ✓'
  fiche_revision:
  - '**Monôme.** Dans $-5x^{3}$ : coefficient $-5$ (signe compris), partie littérale $x^{3}$, degré $3$.'
  - '**Réduire.** Seuls les termes de même partie littérale s''additionnent ; un « $-$ » devant une parenthèse
    change tous ses signes.'
  - '**Développer.** $k\left(a + b\right) = ka + kb$ ; $\left(a + b\right)\left(c + d\right)$ : quatre
    produits, toujours.'
  - '**Les trois identités.** $\left(a \pm b\right)^{2} = a^{2} \pm 2ab + b^{2}$ ; $\left(a - b\right)\left(a
    + b\right) = a^{2} - b^{2}$. Le double produit ne s''oublie jamais.'
  - '**Factoriser.** Facteur commun, parenthèse comprise ; puis identité ; sinon chaque morceau, et on
    recommence. Une somme de deux carrés ne se factorise pas.'
  - '**Produit nul.** Un produit est nul si et seulement si l''un au moins de ses facteurs est nul.'
  - '**Valeurs interdites.** Elles annulent le **dénominateur de départ**, avant toute simplification.'
  trouve_erreur:
  - faux: $-\left(2x^{2} - 5x\right) = -2x^{2} - 5x$
    correction: 'Le signe porte sur **tous** les termes : $-2x^{2} + 5x$.'
  - faux: $\left(3x + 2\right)^{2} = 9x^{2} + 4$
    correction: 'Double produit $12x$ oublié : $9x^{2} + 12x + 4$.'
  - faux: $3x^{2} + 6x = 3\left(x^{2} + 6x\right)$
    correction: 'Le $x$ commun n''est pas sorti : $3x\left(x + 2\right)$.'
  - faux: $x^{2} + 9 = \left(x + 3\right)^{2}$
    correction: Une somme de deux carrés ne se factorise pas.
  cartographie_lacunes:
  - lacune: Identités remarquables inconnues, factorisation impossible
    bloque_en: équations et inéquations, fonctions
