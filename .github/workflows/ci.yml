name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Lint with ruff
        run: ruff check src/ tests/ backend/app/ backend/tests/

      - name: Type check with mypy
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

      - name: Run pipeline tests
        env:
          ANTHROPIC_API_KEY: test-fake-key-not-real
          DATABASE_URL: postgresql://test-fake-user:test-fake-pass@localhost:5432/test_fake_db
        run: pytest tests/ -v --tb=short

      - name: Run API tests (backend/, FastAPI — seule interface depuis D-CEO-42/43)
        env:
          ANTHROPIC_API_KEY: test-fake-key-not-real
          DATABASE_URL: sqlite:///:memory:
          # Hors DEBUG, app/auth/tokens.py refuse de démarrer sans SECRET_KEY
          # (voir .env.example) — valeur de test, jamais la vraie.
          SECRET_KEY: test-fake-secret-key-not-real
        run: pytest backend/tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check + build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test
