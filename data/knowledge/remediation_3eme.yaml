- niveau: 3eme
  module: 1
  module_titre: 'Bien calculer : décimaux, opérations, priorités'
  pourquoi: Une résolution juste se perd sur une priorité oubliée ou un arrondi faux. Tu connais ces règles,
    c'est leur application qui dérape.
  diagnostic:
  - question: Dans $4\,725{,}68$, quel est le chiffre des centaines ? des centièmes ?
    reponse: $7$ ; $8$
  - question: 'Calcule : $7 + 3 \times 5$ ; puis $20 - 8 + 2$.'
    reponse: $22$ ; $14$
  - question: 'Calcule : $45{,}7 + 8{,}64$ ; puis $12 - 7{,}35$.'
    reponse: $54{,}34$ ; $4{,}65$
  - question: Effectue $348 \div 6$. Donne le quotient et le reste de la division euclidienne de $350$
      par $6$.
    reponse: $58$ ; $350 = 6 \times 58 + 2$
  - question: Donne l'arrondi au centième de $15{,}487$, puis sa troncature au dixième.
    reponse: $15{,}49$ ; $15{,}4$
  lecons:
  - id: 3eme_M01_L1
    numero: '1.1'
    titre: Numération décimale et sens des opérations
    retenir:
    - 'Chaque chiffre vaut par sa **position** : dans $4\,725{,}68$, le $7$ vaut $700$, le $8$ vaut $\frac{8}{100}$.'
    - Un zéro **à droite** ne change rien ($0{,}6 = 0{,}60$) ; un zéro **intercalé** décale d'un rang
      ($0{,}06$).
    - Total $\to$ addition ; écart $\to$ soustraction ; répétition $\to$ multiplication ; partage $\to$
      division.
    - '**Division euclidienne** : $a = b \times q + r$ avec $0 \le r < b$. Le reste est toujours **plus
      petit que le diviseur**.'
    - 'Calcul mental : regrouper les ronds ($25 + 47 + 75 + 53 = 200$) ; trou $\to$ opération contraire
      ($\dots + 26 = 71$ donne $45$).'
    methode:
      titre: Choisir la bonne opération
      etapes:
      - 'Repère ce qu''on cherche : total, écart, part ?'
      - Associe l'opération correspondante.
      - Écris le calcul **en une seule expression**, puis effectue.
      - Vérifie l'ordre de grandeur et l'unité.
    exemple_resolu: 'Talato range $149$ oeufs par plaquettes de $12$. Combien de plaquettes pleines, et
      combien d''oeufs restent ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Ranger par paquets fixes : division euclidienne. | On divise $149$ par $12$ |

      | Plus grand multiple de $12$ sous $149$ : $144$. | $149 = 12 \times 12 + 5$ |

      | « Pleines » $\to$ le quotient ; tout emporter $\to$ une de plus. | $12$ pleines ; $13$ à emporter
      |

      | **Vérification :** $144 + 5 = 149$ et $0 \le 5 < 12$. ✓ | |'
    erreurs_frequentes:
    - erreur: $4{,}5 \times 10 = 4{,}50$ (« j'ajoute un zéro »).
      correction: 'chaque chiffre se décale d''un rang : $4{,}5 \times 10 = 45$.'
    - erreur: $437 = 15 \times 28 + 17$.
      correction: 'le reste atteint le diviseur, le partage n''est pas fini : $437 = 15 \times 29 + 2$.'
    declic: null
    figures:
    - figures/m01_f1.svg
  - id: 3eme_M01_L2
    numero: '1.2'
    titre: Les priorités opératoires
    retenir:
    - 'Sans parenthèses : **$\times$ et $\div$ d''abord**, puis $+$ et $-$. À priorité égale, **de gauche
      à droite**.'
    - 'Parenthèses, crochets et accolades ont le même rôle : de l''**intérieur vers l''extérieur**, un
      niveau à la fois.'
    - 'La **barre de fraction** est une parenthèse cachée : elle groupe tout le numérateur et tout le
      dénominateur.'
    - 'Traduire : « le produit de $7$ par la différence entre $20$ et $12$ » $\to 7 \times \left(20 -
      12\right) = 56$ ; « la différence entre le produit de $7$ par $20$ et $12$ » $\to 7 \times 20 -
      12 = 128$.'
    methode:
      titre: Calculer une expression en sécurité
      etapes:
      - Repère les multiplications et divisions.
      - Effectue-les **une par une**, en récrivant toute l'expression.
      - Termine par $+$ et $-$, de gauche à droite.
      - Une ligne = une transformation.
    exemple_resolu: 'Calcule $B = 60 - \left[4 + 2 \times \left(9 - 5\right)\right] \times 3$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La parenthèse la plus intérieure. | $B = 60 - \left[4 + 2 \times 4\right] \times 3$ |

      | Dans le crochet, le produit d''abord. | $B = 60 - \left[4 + 8\right] \times 3 = 60 - 12 \times
      3$ |

      | Le produit passe avant la soustraction. | $B = 60 - 36 = 24$ |

      | **Vérification :** le crochet valait $12$. ✓ | |'
    erreurs_frequentes:
    - erreur: $7 + 3 \times 5 = 10 \times 5 = 50$.
      correction: 'la multiplication est prioritaire : $22$.'
    - erreur: supprimer une parenthèse derrière un $-$ sans y regarder.
      correction: $50 - \left(20 + 7\right) = 50 - 20 - 7 = 23$, mais $50 - \left(20 - 7\right) = 37$.
    declic: 'Les priorités préparent le calcul littéral — En 3ème tu évalueras $3x^{2} - 5x + 2$ : puissance,
      puis produits, puis sommes. Même règle du jeu, avec des lettres en plus. Ce que tu consolides ici
      sert aux modules 5 et 6.'
    figures: []
  - id: 3eme_M01_L3
    numero: '1.3'
    titre: Comparer, encadrer, arrondir
    retenir:
    - '**Comparer** : parties entières d''abord ; si elles sont égales, rang par rang. $2{,}9 = 2{,}90
      > 2{,}15$.'
    - '**Encadrer** : $7 < 7{,}463 < 8$. **Intercaler** : entre $3{,}4$ et $3{,}5$, on prend $3{,}45$.'
    - '**Troncature** : on coupe ($15{,}487 \to 15{,}4$). **Arrondi** : valeur la plus proche ($15{,}487
      \to 15{,}5$). Si le chiffre suivant vaut $5$ ou plus, on augmente de $1$.'
    - '**Ordre de grandeur** : $49 \times 21 \approx 50 \times 20 = 1\,000$ (exact : $1\,029$).'
    - Multiplier par un nombre **inférieur à $1$** diminue ($240 \times 0{,}9 = 216$) ; par un nombre
      **supérieur à $1$**, augmente.
    methode:
      titre: Comparer deux décimaux
      etapes:
      - Compare les parties entières ; si elles diffèrent, c'est fini.
      - Sinon, complète par des zéros à droite pour avoir le même nombre de chiffres.
      - 'Compare rang par rang : le premier rang différent décide.'
      - Pour ranger une liste, le plus petit est le plus à gauche sur la droite graduée.
    exemple_resolu: 'Arrondi au dixième de $23{,}748$, puis encadrement au centième.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Arrondir au dixième : le chiffre des centièmes décide. | Centièmes : $4$ |

      | $4 < 5$ : on garde le chiffre des dixièmes. | Arrondi : $23{,}7$ |

      | Encadrer au centième : on coupe, puis on ajoute $0{,}01$. | $23{,}74 < 23{,}748 < 23{,}75$ |

      | **Vérification :** $23{,}748$ est plus près de $23{,}7$ que de $23{,}8$. ✓ | |'
    erreurs_frequentes:
    - erreur: confondre troncature et arrondi.
      correction: au dixième, $15{,}487$ donne $15{,}4$ (troncature) et $15{,}5$ (arrondi).
    - erreur: arrondir en deux fois, $7{,}649 \to 7{,}65 \to 7{,}7$.
      correction: 'en une fois depuis le départ : $7{,}6$.'
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Dans $60\,318{,}457$ : a) chiffre des dizaines et des dixièmes ; b) écris-le en lettres ;
      c) décompose-le : $60\,318{,}457 = 6 \times 10\,000 + \dots$'
    correction: a) $1$ ; $4$. b) Soixante mille trois cent dix-huit unités et quatre cent cinquante-sept
      millièmes. c) $6 \times 10\,000 + 3 \times 100 + 1 \times 10 + 8 + 4 \times \frac{1}{10} + 5 \times
      \frac{1}{100} + 7 \times \frac{1}{1\,000}$.
  - numero: 2
    etoiles: 1
    enonce: 'Pose et effectue : a) $457{,}8 + 39{,}65$ ; b) $803{,}2 - 76{,}48$ ; c) $47{,}3 \times 2{,}6$
      ; d) $823 \div 7$ (quotient et reste).'
    correction: a) $497{,}45$ ; b) $726{,}72$ ; c) $122{,}98$ ; d) $823 = 7 \times 117 + 4$.
  - numero: 3
    etoiles: 1
    enonce: Un car quitte Ouagadougou avec $52$ passagers. À Koudougou, $17$ descendent et $9$ montent.
      Écris une seule expression, puis donne le nombre de passagers à l'arrivée.
    correction: $52 - 17 + 9 = 44$ passagers (de gauche à droite).
  - numero: 4
    etoiles: 1
    enonce: 'Écris en chiffres : a) douze mille quarante-sept unités et trois centièmes ; b) cinq cent
      mille deux cents ; c) huit unités et quinze millièmes.'
    correction: a) $12\,047{,}03$ ; b) $500\,200$ ; c) $8{,}015$.
  - numero: 5
    etoiles: 1
    enonce: 'Pose et effectue : a) $2\,047{,}5 + 968{,}75$ ; b) $5\,000 - 1\,368{,}4$ ; c) $63{,}8 \times
      4{,}5$ ; d) $1\,932 \div 12$.'
    correction: a) $3\,016{,}25$ ; b) $3\,631{,}6$ ; c) $287{,}1$ ; d) $161$.
  - numero: 6
    etoiles: 1
    enonce: Écris la division euclidienne de $437$ par $15$ sous la forme $437 = 15 \times q + r$ avec
      $0 \le r < 15$. Combien de cartons de $15$ oeufs remplit-on avec $437$ oeufs, et combien restent
      ?
    correction: '$437 = 15 \times 29 + 2$ : $29$ cartons pleins, $2$ oeufs restent.'
  - numero: 7
    etoiles: 1
    enonce: 'Sans poser d''opération, calcule en regroupant : a) $17 + 48 + 3 + 52$ ; b) $4 \times 27
      \times 25$ ; c) $2 \times 8{,}9 \times 50$.'
    correction: a) $20 + 100 = 120$ ; b) $100 \times 27 = 2\,700$ ; c) $100 \times 8{,}9 = 890$.
  - numero: 8
    etoiles: 1
    enonce: Un maraîcher récolte $124$ kg de tomates le lundi, $98$ kg le mardi et $137$ kg le mercredi.
      Il en vend $310$ kg. Écris le stock restant en une expression, puis effectue.
    correction: $124 + 98 + 137 - 310 = 359 - 310 = 49$ kg.
  - numero: 9
    etoiles: 1
    enonce: 'Calcule en détaillant ligne par ligne : a) $9 + 6 \times 7$ ; b) $36 \div 4 - 5$ ; c) $8
      \times 5 - 3 \times 9$ ; d) $100 - 2 \times \left(13 + 7\right)$.'
    correction: a) $9 + 42 = 51$ ; b) $9 - 5 = 4$ ; c) $40 - 27 = 13$ ; d) $100 - 40 = 60$.
  - numero: 10
    etoiles: 1
    enonce: 'Place des parenthèses pour rendre l''égalité vraie : a) $5 + 3 \times 4 = 32$ ; b) $24 -
      6 \div 2 = 9$.'
    correction: a) $\left(5 + 3\right) \times 4$ ; b) $\left(24 - 6\right) \div 2$.
  - numero: 11
    etoiles: 1
    enonce: Awa achète $3$ cahiers à $350$ FCFA et $2$ stylos à $150$ FCFA. Elle paie avec $2\,000$ FCFA.
      Écris la monnaie rendue en une seule expression, puis effectue.
    correction: $2\,000 - \left(3 \times 350 + 2 \times 150\right) = 2\,000 - 1\,350 = 650$ FCFA.
  - numero: 12
    etoiles: 1
    enonce: 'Calcule en détaillant : a) $14 + 6 \times 3$ ; b) $50 - 36 \div 9$ ; c) $7 \times 8 - 6 \times
      9$ ; d) $45 - 3 \times \left(2 + 8\right)$ ; e) $\left(26 - 11\right) \div 5 + 4$.'
    correction: a) $32$ ; b) $46$ ; c) $2$ ; d) $15$ ; e) $7$.
  - numero: 13
    etoiles: 1
    enonce: a) $A = 120 - \left(45 - 17\right)$ ; b) $B = 120 - 45 - 17$ ; c) compare $A$ et $B$ et explique
      la différence.
    correction: a) $A = 92$ ; b) $B = 58$ ; c) dans $A$ on retire $28$, dans $B$ on retire $45 + 17 =
      62$.
  - numero: 14
    etoiles: 1
    enonce: 'Traduis puis calcule : a) « la somme de $28$ et du produit de $6$ par $7$ » ; b) « le produit
      de $5$ par la somme de $12$ et de $8$ » ; c) « la différence entre $60$ et le quotient de $48$ par
      $6$ ».'
    correction: a) $28 + 42 = 70$ ; b) $5 \times 20 = 100$ ; c) $60 - 8 = 52$.
  - numero: 15
    etoiles: 1
    enonce: 'Issouf écrit : $60 - 5 \times 4 + 8 = 55 \times 4 + 8 = 228$. Explique son erreur, puis calcule
      correctement.'
    correction: 'Il a fait $60 - 5$ avant le produit. Correct : $60 - 20 + 8 = 48$.'
  - numero: 16
    etoiles: 1
    enonce: 'Moussa achète $4$ cahiers à $425$ FCFA, $2$ paquets de stylos à $600$ FCFA et une règle à
      $250$ FCFA. a) Écris la dépense en une seule expression. b) Calcule-la. c) Il paie avec $4\,000$
      FCFA : combien lui rend-on ?'
    correction: a) $D = 4 \times 425 + 2 \times 600 + 250$ ; b) $3\,150$ FCFA ; c) $850$ FCFA.
  - numero: 17
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $5{,}2$ ; $5{,}09$ ; $5{,}31$ ; $5{,}126$ ; $5{,}3$.'
    correction: $5{,}09 < 5{,}126 < 5{,}2 < 5{,}3 < 5{,}31$.
  - numero: 18
    etoiles: 1
    enonce: a) Encadre $47{,}362$ par deux entiers consécutifs, puis au dixième. b) Intercale un nombre
      entre $8{,}6$ et $8{,}7$.
    correction: a) $47 < 47{,}362 < 48$ ; $47{,}3 < 47{,}362 < 47{,}4$. b) Par exemple $8{,}65$.
  - numero: 19
    etoiles: 1
    enonce: Donne l'arrondi à l'unité, au dixième et au centième de $9{,}365$ ; puis de $12{,}049$.
    correction: '$9{,}365$ : $9$ ; $9{,}4$ ; $9{,}37$. $12{,}049$ : $12$ ; $12{,}0$ ; $12{,}05$.'
  - numero: 20
    etoiles: 1
    enonce: 'Remplace $\dots$ par $<$, $>$ ou $=$ : a) $7{,}08 \dots 7{,}8$ ; b) $3{,}250 \dots 3{,}25$
      ; c) $14{,}9 \dots 14{,}09$ ; d) $0{,}6 \dots 0{,}58$.'
    correction: a) $<$ ; b) $=$ ; c) $>$ ; d) $>$.
  - numero: 21
    etoiles: 1
    enonce: 'Range dans l''ordre décroissant : $18{,}3$ ; $18{,}09$ ; $18{,}305$ ; $18{,}29$ ; $17{,}99$.'
    correction: $18{,}305 > 18{,}3 > 18{,}29 > 18{,}09 > 17{,}99$.
  - numero: 22
    etoiles: 1
    enonce: a) Encadre $126{,}47$ par deux entiers consécutifs. b) Encadre-le au dixième. c) Intercale
      un nombre entre $126{,}47$ et $126{,}48$.
    correction: a) $126 < 126{,}47 < 127$ ; b) $126{,}4 < 126{,}47 < 126{,}5$ ; c) par exemple $126{,}475$.
  - numero: 23
    etoiles: 1
    enonce: 'Donne : a) l''arrondi à l''unité de $89{,}52$ ; b) l''arrondi au dixième de $6{,}249$ ; c)
      la troncature au centième de $0{,}5678$ ; d) l''arrondi au centième de $0{,}5678$.'
    correction: a) $90$ ; b) $6{,}2$ ; c) $0{,}56$ ; d) $0{,}57$.
  - numero: 24
    etoiles: 1
    enonce: Bobo-Dioulasso est à $356$ km. Un camion consomme $8{,}7$ L aux $100$ km. a) Donne un ordre
      de grandeur du carburant nécessaire. b) Calcule la valeur exacte, puis son arrondi au litre.
    correction: a) Environ $350 \times 9 \div 100 \approx 31$ L. b) $356 \times 8{,}7 \div 100 = 30{,}972$
      L, soit $31$ L.
  - numero: 25
    etoiles: 1
    enonce: 'Sans calculer les produits, compare : a) $37 \times 52$ et $37 \times 49$ ; b) $128 \times
      0{,}9$ et $128$ ; c) $56 \times 1{,}2$ et $56$.'
    correction: a) $37 \times 52 > 37 \times 49$ ; b) $128 \times 0{,}9 < 128$ ; c) $56 \times 1{,}2 >
      56$.
  - numero: 26
    etoiles: 1
    enonce: Un réservoir contient $1\,000$ L. Une famille en puise $65$ L par jour. a) Combien reste-t-il
      après $7$ jours ? b) Au bout de combien de jours complets ne peut-on plus puiser $65$ L ?
    correction: 'a) $1\,000 - 455 = 545$ L. b) $1\,000 = 65 \times 15 + 25$ : au $16^{\text{e}}$ jour
      il ne reste que $25$ L.'
  - numero: 27
    etoiles: 1
    enonce: 'Le trajet Ouagadougou-Fada dure $3$ h $25$ min. Le car part à $7$ h $50$. a) À quelle heure
      arrive-t-il ? b) Un second car part $45$ min plus tard : heure d''arrivée ?'
    correction: a) $7$ h $50 + 3$ h $25 = 11$ h $15$. b) Départ $8$ h $35$, arrivée $12$ h.
  - numero: 28
    etoiles: 1
    enonce: 'Complète : a) $37 + \dots = 90$ ; b) $\dots - 26 = 58$ ; c) $8 \times \dots = 200$ ; d) $\dots
      \div 7 = 21$.


      ### Entraînement intensif ★★ : parenthèses et crochets imbriqués


      *Une ligne par transformation, toujours de l''intérieur vers l''extérieur.*'
    correction: a) $53$ ; b) $84$ ; c) $25$ ; d) $147$.
  - numero: 29
    etoiles: 2
    enonce: 'Calcule ligne par ligne : a) $18 - \left[7 + \left(12 - 5\right)\right]$ ; b) $50 - \left[2
      \times \left(3 + 7\right) + 8\right]$ ; c) $\left[30 - \left(6 + 4 \times 2\right)\right] \times
      3$ ; d) $100 - 3 \times \left[20 - \left(2 + 8\right) \div 5\right]$ ; e) $5 \times \left[4 + 3
      \times \left(10 - 6\right)\right] - 7$.'
    correction: a) $18 - 14 = 4$ ; b) $50 - 28 = 22$ ; c) $16 \times 3 = 48$ ; d) $100 - 3 \times 18 =
      46$ ; e) $80 - 7 = 73$.
  - numero: 30
    etoiles: 2
    enonce: 'Calcule : a) $2 \times \left[3 + 2 \times \left(5 + 1\right)\right]$ ; b) $\left[\left(18
      - 6\right) \div 4 + 7\right] \times 5$ ; c) $60 \div \left[15 - \left(2 \times 5\right)\right]$
      ; d) $\left[8 + \left(14 - 9\right) \times 4\right] \div 7$ ; e) $3 \times \left[2 \times \left(7
      - 3\right) + 5 \times \left(9 - 7\right)\right]$.'
    correction: a) $30$ ; b) $10 \times 5 = 50$ ; c) $60 \div 5 = 12$ ; d) $28 \div 7 = 4$ ; e) $3 \times
      18 = 54$.
  - numero: 31
    etoiles: 2
    enonce: 'La barre de fraction est une parenthèse cachée : a) $\frac{25 - 7}{2 \times 3}$ ; b) $\frac{8
      + 4 \times 7}{15 - 3 \times 2}$ ; c) $\frac{54}{2 \times \left(13 - 4\right)}$ ; d) $\frac{100 -
      2 \times 15}{7 \times 2}$.'
    correction: a) $\frac{18}{6} = 3$ ; b) $\frac{36}{9} = 4$ ; c) $\frac{54}{18} = 3$ ; d) $\frac{70}{14}
      = 5$.
  - numero: 32
    etoiles: 2
    enonce: 'Trois niveaux d''imbrication : a) $2 \times \left\{20 - \left[3 + 2 \times \left(9 - 5\right)\right]\right\}$
      ; b) $100 - \left\{4 \times \left[18 - \left(5 + 3 \times 2\right)\right] + 12\right\}$ ; c) $\left\{\left[\left(48
      \div 6\right) + 4\right] \times 3 - 6\right\} \div 2$.'
    correction: a) $2 \times 9 = 18$ ; b) $100 - 40 = 60$ ; c) $30 \div 2 = 15$.
  - numero: 33
    etoiles: 2
    enonce: 'Avec des décimaux : a) $7{,}5 + 2 \times \left(8{,}4 - 3{,}9\right)$ ; b) $\left[10 - \left(2{,}6
      + 1{,}4\right)\right] \times 2{,}5$ ; c) $3 \times \left(4{,}2 + 5{,}8\right) - 0{,}5 \times \left(14
      - 6\right)$ ; d) $\frac{12{,}6 - 3 \times 2{,}2}{0{,}3 \times 10}$.'
    correction: a) $7{,}5 + 9 = 16{,}5$ ; b) $6 \times 2{,}5 = 15$ ; c) $30 - 4 = 26$ ; d) $\frac{6}{3}
      = 2$.
  - numero: 34
    etoiles: 2
    enonce: 'Remplace $\square$ par $+$, $-$, $\times$ ou $\div$ : a) $6 \;\square\; 3 + 2 \times 5 =
      12$ ; b) $\left(7 \;\square\; 5\right) \times 4 = 48$ ; c) $20 - 12 \;\square\; 4 = 17$ ; d) $9
      \;\square\; 2 - 3 \times 4 = 6$.'
    correction: a) $\div$ ; b) $+$ ; c) $\div$ ; d) $\times$.
  - numero: 35
    etoiles: 2
    enonce: 'Traduis en une seule expression, puis calcule : a) le produit de $4$ par la somme de $12$
      et du quotient de $18$ par $6$ ; b) la différence entre le produit de $8$ par $7$ et le quotient
      de $45$ par $9$ ; c) le quotient de la somme de $26$ et de $10$ par la différence entre $15$ et
      $6$.'
    correction: a) $4 \times \left(12 + 3\right) = 60$ ; b) $56 - 5 = 51$ ; c) $36 \div 9 = 4$.
  - numero: 36
    etoiles: 2
    enonce: 'Vrai ou faux ? Calcule les deux membres, puis explique : a) $40 - \left[10 - 5\right] = 40
      - 10 - 5$ ; b) $40 - \left[10 + 5\right] = 40 - 10 - 5$ ; c) $2 \times \left[7 + 3\right] = 2 \times
      7 + 3$ ; d) $36 \div \left(6 \div 2\right) = 36 \div 6 \div 2$.'
    correction: a) Faux ($35 \ne 25$) ; b) vrai ($25$) ; c) faux ($20 \ne 17$) ; d) faux ($12 \ne 3$).
  - numero: 37
    etoiles: 2
    enonce: 'Une transformation par ligne : $A = \left\{\left[\left(7 + 5\right) \times 4 - 8\right] \div
      10 + 6\right\} \times 5 - 2$ ; puis $B = 1\,000 \div \left[10 \times \left(13 - 8\right)\right]
      - \left[3 \times \left(2 + 4\right) - 15\right]$.'
    correction: '$A$ : $12 \times 4 - 8 = 40$ ; $40 \div 10 + 6 = 10$ ; $A = 48$. $B$ : $1\,000 \div 50
      = 20$ ; $3 \times 6 - 15 = 3$ ; $B = 17$.'
  - numero: 38
    etoiles: 2
    enonce: En utilisant une seule fois $2$, $5$, $7$ et $10$, et les opérations de ton choix (parenthèses
      autorisées), écris une expression égale à $100$.
    correction: Par exemple $10 \times \left(5 + 7 - 2\right) = 100$ (d'autres solutions existent).
  - numero: 39
    etoiles: 2
    enonce: 'Trouve le plus grand entier de trois chiffres qui, divisé par $23$, donne un reste égal à
      $5$.


      ### ★★★ Défis de maîtrise'
    correction: $n = 23q + 5 \le 999$ donne $q \le 43$, d'où $n = 23 \times 43 + 5 = 994$.
  - numero: 40
    etoiles: 3
    enonce: Awa veut $500$ morceaux de savon. Le grossiste de Ouagadougou vend le carton de $24$ à $5\,400$
      FCFA. Celui de Koudougou vend le carton de $36$ à $7\,920$ FCFA, plus $6\,000$ FCFA de transport
      pour toute la commande. Awa n'achète que des cartons entiers. Chez quel grossiste doit-elle se fournir
      ? Justifie par le calcul complet.
    correction: 'On cherche d''abord le **nombre de cartons entiers**, car c''est la contrainte qui commande
      tout. Ouagadougou : $500 = 24 \times 20 + 20$, donc $21$ cartons, $21 \times 5\,400 = 113\,400$
      FCFA. Koudougou : $500 = 36 \times 13 + 32$, donc $14$ cartons, $14 \times 7\,920 + 6\,000 = 116\,880$
      FCFA. Awa achète à **Ouagadougou** et économise $3\,480$ FCFA. Koudougou est pourtant moins cher
      au morceau ($220$ contre $225$ FCFA) : c''est le transport, indépendant de la quantité, qui renverse
      la décision.'
  - numero: 41
    etoiles: 3
    enonce: En divisant un entier par $17$, Boukary obtient un quotient égal à $23$ et **le plus grand
      reste possible**. a) Quel est ce nombre ? b) Même question avec le plus petit reste non nul. c)
      De combien les deux nombres diffèrent-ils, et pourquoi cet écart ne dépend-il pas du quotient ?
    correction: 'Tout part de $0 \le r < 17$. a) Reste maximal $16$ : $17 \times 23 + 16 = 407$. b) Reste
      minimal non nul $1$ : $392$. c) Écart $15$ : les deux nombres partagent la part $17 \times 23$,
      leur différence est celle des restes, $16 - 1 = 15$, quel que soit le quotient.'
  - numero: 42
    etoiles: 3
    enonce: Vrai ou faux ? Justification si vrai, contre-exemple si faux. a) Entre deux décimaux différents,
      on peut toujours intercaler un décimal. b) De deux décimaux, le plus grand est celui qui compte
      le plus de chiffres. c) L'arrondi au dixième est toujours supérieur ou égal à la troncature au dixième.
      d) Multiplier un nombre par un décimal le rend toujours plus petit.
    correction: 'a) Vrai : on ajoute un rang ($3{,}45$ entre $3{,}4$ et $3{,}5$), le procédé ne s''arrête
      jamais. b) Faux : $0{,}9999 < 1{,}2$. c) Vrai : l''arrondi vaut la troncature ou la troncature $+\,0{,}1$.
      d) Faux : $40 \times 2{,}5 = 100 > 40$ ; cela ne diminue que si le multiplicateur est entre $0$
      et $1$.'
  - numero: 43
    etoiles: 3
    enonce: Choisis un entier non nul. Multiplie par $4$, ajoute $10$, divise par $2$, retire $5$, divise
      par le nombre choisi. a) Essaie avec $3$, $7$, puis $12$. b) Que remarques-tu ? c) Montre que le
      résultat est le même pour tout nombre non nul, et explique pourquoi il doit être non nul.
    correction: 'a) Avec $3$ : $12$, $22$, $11$, $6$, $2$. Avec $7$ et $12$ : $2$ aussi. b) On trouve
      toujours $2$. c) Après $\times 4$ on tient « quatre fois le nombre » ; $+10$ puis $\div 2$ donne
      « deux fois le nombre, plus $5$ » ; $-5$ laisse « deux fois le nombre » ; la division finale donne
      $2$. Le nombre doit être non nul car on divise par lui.'
  - numero: 44
    etoiles: 3
    enonce: 'Calcule $A$ et $B$, une transformation par ligne, puis vérifie que $A = 31 \times B$.

      $$A = 200 - \left\{3 \times \left[\left(15 - 7\right) \times 2 + 4\right] - \frac{72 - 2 \times
      6}{4}\right\}$$

      $$B = \frac{5 \times \left(8{,}4 - 2{,}9\right) + 2{,}5}{\left[12 - \left(3 + 5\right)\right] \times
      1{,}5}$$'
    correction: 'De l''intérieur vers l''extérieur, la fraction étant une parenthèse cachée. $A$ : $\left(15-7\right)
      \times 2 + 4 = 20$ ; $3 \times 20 = 60$ ; fraction $= \frac{60}{4} = 15$ ; accolade $= 45$ ; $A
      = 155$. $B$ : numérateur $5 \times 5{,}5 + 2{,}5 = 30$ ; dénominateur $4 \times 1{,}5 = 6$ ; $B
      = 5$. Et $31 \times 5 = 155 = A$ ✓.'
  - numero: 45
    etoiles: 3
    enonce: 'Salif commande $12$ sacs de ciment à $5\,750$ FCFA, $3$ brouettes à $18\,500$ FCFA, avec
      une remise de $4\,000$ FCFA sur l''ensemble ; il paie avec $150\,000$ FCFA. Voici sa copie.


      > Ligne 1 : $D = 12 \times 5\,750 + 3 \times 18\,500 - 4\,000$

      > Ligne 2 : $D = 12 \times 5\,750 + 3 \times 14\,500$

      > Ligne 3 : $D = 69\,000 + 43\,500$

      > Ligne 4 : $D = 112\,500$

      > Ligne 5 : Monnaie $= 150\,000 - 112\,500 = 38\,500$ FCFA


      Deux lignes sont fausses. Repère-les, dis la règle trahie par chacune, puis refais le calcul jusqu''à
      la monnaie.'
    correction: 'On repère d''abord ce que la remise concerne : l''ensemble, pas une brouette. Fausses
      : **ligne 2** (la remise est soustraite au prix unitaire, et le produit $3 \times 18\,500$ est prioritaire)
      et **ligne 5** (soustraction inexacte). Correct : $D = 69\,000 + 55\,500 - 4\,000 = 120\,500$ FCFA
      ; monnaie $= 150\,000 - 120\,500 = 29\,500$ FCFA.'
  fiche_revision:
  - '**Numération.** Dans $4\,725{,}68$ : le $7$ vaut $700$, le $6$ vaut $\frac{6}{10}$, le $8$ vaut $\frac{8}{100}$.'
  - '**Division euclidienne.** $a = b \times q + r$ avec $0 \le r < b$ : $350 = 6 \times 58 + 2$.'
  - '**Priorités.** Parenthèses ; puis $\times$ et $\div$ ; puis $+$ et $-$ de gauche à droite. Une ligne,
    une transformation.'
  - '**Comparer.** Rang par rang après avoir égalisé les décimales : $2{,}90 > 2{,}15$.'
  - '**Encadrer, intercaler.** $7 < 7{,}463 < 8$ ; entre $3{,}4$ et $3{,}5$ : $3{,}45$.'
  - '**Troncature / arrondi.** On coupe / valeur la plus proche ($5$ ou plus $\to$ on monte).'
  - '**Ordre de grandeur.** $49 \times 21 \approx 1\,000$ : le détecteur d''erreurs avant tout calcul.'
  trouve_erreur:
  - faux: $7 + 3 \times 5 = 50$
    correction: 'La multiplication d''abord : $7 + 15 = 22$.'
  - faux: $2{,}9 < 2{,}15$
    correction: 'Rang par rang : $2{,}90 > 2{,}15$.'
  - faux: 'Arrondi au dixième de $15{,}44$ : $15{,}5$'
    correction: 'Le chiffre suivant est $4$ : on garde, $15{,}4$.'
  - faux: $437 = 15 \times 28 + 17$
    correction: '$17 \ge 15$ : $437 = 15 \times 29 + 2$.'
  - faux: $20 - 8 + 2 = 10$
    correction: 'De gauche à droite : $12 + 2 = 14$.'
  cartographie_lacunes:
  - lacune: Priorités opératoires ignorées, division mal posée, valeurs approchées confondues (troncature/arrondi)
    bloque_en: tout calcul numérique ; ch. 1 (encadrements)
