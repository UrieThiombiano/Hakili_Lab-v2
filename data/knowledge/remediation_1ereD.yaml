  - numero: 24
    etoiles: 2
    enonce: 'Démontre que pour tous réels $a$ et $b$ : $a^{3} + b^{3} = \left(a + b\right)^{3} - 3ab\left(a
      + b\right)$.


      ### ★★★ Défis de maîtrise'
    correction: $\left(a + b\right)^{3} - 3ab\left(a + b\right) = a^{3} + 3a^{2}b + 3ab^{2} + b^{3} -
      3a^{2}b - 3ab^{2} = a^{3} + b^{3}$.
  - numero: 25
    etoiles: 3
    enonce: On développe $\left(2x - 3\right)^{5}$. a) Combien de termes comporte le développement ? b)
