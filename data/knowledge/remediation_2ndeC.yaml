      *Ligne 2 :* $\sqrt{20} = \sqrt{4 \times 5} = 2\sqrt{5}$


      *Ligne 3 :* $B = 9\sqrt{5} + 2\sqrt{5} - \sqrt{5} = 10\sqrt{5}$


      *Ligne 4 :* $B^{2} = 10 \times 5 = 50$


      *Ligne 5 :* $50 > 49$, donc $B > 7$


      Trouve les lignes qui cassent, explique, puis refais le calcul proprement. La conclusion est-elle
