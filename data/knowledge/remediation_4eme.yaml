  fiche_revision:
  - '**Aires planes.** Triangle $\frac{b \times h}{2}$ ; parallélogramme $b \times h$ ; losange $\frac{D
    \times d}{2}$ ; trapèze $\frac{\left(B + b\right) \times h}{2}$ ; disque $\pi \times r \times r$.
    Hauteur perpendiculaire à la base.'
  - '**Cercle.** $\mathcal{P} = 2 \times \pi \times r$.'
  - '**Solides droits.** $V = \mathcal{A}_{\text{base}} \times h$ ; latérale $=$ périmètre $\times$ hauteur
    ; totale $=$ latérale $+\ 2 \times$ base.'
  - '**Solides pointus.** $V = \frac{\mathcal{A}_{\text{base}} \times h}{3}$ ; latérale $\frac{\text{périmètre}
    \times a}{2}$ (pyramide), $\pi \times r \times g$ (cône).'
  - '**Sphère et boule.** $\mathcal{A} = 4 \times \pi \times r \times r$ ; $V = \frac{4 \times \pi \times
    r \times r \times r}{3}$. Deux $r$ pour une aire, trois pour un volume.'
  - '**Patrons.** Prisme : deux bases $+$ bande de longueur le périmètre. Cylindre : deux disques $+$
    rectangle.'
  - '**Unités.** Longueur par dix, aire par cent, volume par mille. $1$ L $= 1$ dm$^{3} = 1\,000$ cm$^{3}$
    ; $1$ m$^{3} = 1\,000$ L.'
  trouve_erreur:
  - faux: Aire du triangle $= b \times h$
    correction: '$\frac{b \times h}{2}$ : le triangle est la moitié du parallélogramme.'
  - faux: Volume du cylindre $= 2 \times \pi \times r \times h$
    correction: C'est l'aire latérale. $V = \pi \times r \times r \times h$.
  - faux: Diamètre $8$ cm, donc $\pi \times 8 \times 8$
    correction: '$r = 4$ cm : on divise avant tout calcul.'
  - faux: $1$ L $= 100$ cm$^{3}$ et $1$ m$^{2} = 100$ cm$^{2}$
    correction: $1$ L $= 1\,000$ cm$^{3}$ et $1$ m$^{2} = 10\,000$ cm$^{2}$.
