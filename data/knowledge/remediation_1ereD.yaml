  - numero: 11
    etoiles: 1
    enonce: 'Étudie la parité de : a) $f\left(x\right) = x^{4} - 3x^{2}$ ; b) $g\left(x\right) = \frac{2}{x}$
      ; c) $h\left(x\right) = x^{2} + 2x + 1$ ; d) $k\left(x\right) = x|x|$.'
    correction: 'a) paire. b) impaire. c) $h\left(1\right) = 4$, $h\left(-1\right) = 0$ : ni l''une ni
