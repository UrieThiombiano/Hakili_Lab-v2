  objet: Calculer en mètres les dimensions réelles d'un champ de 9 cm sur 6 cm sur un plan au 1/500
  reponse_attendue: longueur 45 m, largeur 30 m
  solution: 'Au 1/500, 1 cm sur le plan = 500 cm = 5 m : 9 × 5 = 45 m et 6 × 5 = 30 m. Barème (2 pts)
    : 1 pt pour l''emploi de l''échelle (1 cm pour 5 m, ou × 500 puis conversion) ; 1 pt pour les deux
    dimensions 45 m et 30 m (non acquis si une seule est juste).'
  si_echoue: Emploi d'une échelle sur des longueurs.
  probleme_parent: P3
- code: P3.2
  partie: C
  format: redige
  bareme: 1.0
  bareme_classeur: 3.0
  competence: N.PGCD
  competence_secondaire: N.DIVIS
  domaine: Activites numeriques
  objet: 'Partager un champ de 45 m sur 30 m en carrés les plus grands possibles : côté puis nombre de
    carrés'
  reponse_attendue: côté = PGCD(45 ; 30) = 15 m ; 6 parcelles
  solution: '45 = 3² × 5 et 30 = 2 × 3 × 5, PGCD = 15. Nombre de parcelles : (45/15) × (30/15) = 3 × 2
    = 6. Barème (3 pts) : 1 pt pour avoir reconnu le PGCD de 45 et 30 ; 1 pt pour 15 m ; 1 pt pour les
    6 parcelles. Accepter la liste des diviseurs communs. Erreur propagée : un côté faux mais divisant
    les deux dimensions, suivi d''un nombre de parcelles correct, garde le troisième point.'
  si_echoue: PGCD comme outil d'un partage optimal.
  probleme_parent: P3
- code: P3.3
  partie: C
