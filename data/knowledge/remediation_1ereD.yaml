- niveau: 1ereD
  module: 2
  module_titre: Identités de degré 3 et triangle de Pascal
  pourquoi: 'Factoriser un polynôme de degré 3 revient dans presque chaque devoir de 1ère D. Tu connais
    ces identités : c''est le signe du terme du milieu qui dérape.'
  diagnostic:
  - question: Développe $\left(x + 1\right)^{3}$.
    reponse: $x^{3} + 3x^{2} + 3x + 1$
  - question: Factorise $x^{3} - 1$.
    reponse: $\left(x - 1\right)\left(x^{2} + x + 1\right)$
  - question: 'Vrai ou faux : $\left(a + b\right)^{3} = a^{3} + b^{3}$ ?'
    reponse: faux, il manque $3a^{2}b$ et $3ab^{2}$
  - question: Écris la ligne 4 du triangle de Pascal.
    reponse: $1$ ; $4$ ; $6$ ; $4$ ; $1$
  - question: Factorise $8x^{3} + 27$.
    reponse: $\left(2x + 3\right)\left(4x^{2} - 6x + 9\right)$
  lecons:
  - id: 1ereD_M02_L1
    numero: '2.1'
    titre: Les quatre identités de degré 3
    retenir:
    - Avec un moins, les signes du développement alternent en commençant par un plus.
    - Dans une factorisation, le petit facteur porte le **même signe** que l'expression de départ.
    - Dans le grand facteur, les deux carrés sont **toujours précédés de $+$** ; le terme du milieu porte
      le **signe contraire** de celui du petit facteur.
    - 'Le facteur $a^{2} + ab + b^{2}$ ne se factorise jamais dans $\mathbb{R}$ ($\Delta = -3b^{2} < 0$)
      : la factorisation est terminée.'
    methode:
      titre: Développer un cube, factoriser $a^{3} \pm b^{3}$
      etapes:
      - '**Développer :** coefficients $1$, $3$, $3$, $1$ ; puissances de $a$ décroissantes de $3$ à $0$,
        celles de $b$ croissantes de $0$ à $3$ ; signes alternés si c''est une différence.'
      - '**Factoriser :** repère les deux cubes, écris le petit facteur ($a - b$ ou $a + b$), puis carré
        du premier terme, produit des deux termes (signe opposé), carré du second.'
      - 'Garde les parenthèses autour des blocs : $\left(2x\right)^{3} = 8x^{3}$, et non $2x^{3}$.'
      - '**Vérifie** en développant le produit obtenu.'
    exemple_resolu: '1) Développe $\left(x + 2\right)^{3}$. 2) Factorise $x^{3} - 8$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | 1) Coefficients 1, 3, 3, 1 avec $a = x$, $b = 2$. | $\left(x + 2\right)^{3} = x^{3} + 3x^{2} \times
      2 + 3x \times 2^{2} + 2^{3}$ |

      | On calcule chaque terme. | $\left(x + 2\right)^{3} = x^{3} + 6x^{2} + 12x + 8$ |

      | 2) Différence de deux cubes : $8 = 2^{3}$. | $x^{3} - 8 = \left(x - 2\right)\left(x^{2} + 2x +
      4\right)$ |

      | **Vérification :** $x^{3} + 2x^{2} + 4x - 2x^{2} - 4x - 8 = x^{3} - 8$. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $\left(x + 2\right)^{3} = x^{3} + 8$.
      correction: $\left(a + b\right)^{3} \ne a^{3} + b^{3}$ ; les termes $3a^{2}b$ et $3ab^{2}$ manquent.
    - erreur: $a^{3} - b^{3} = \left(a - b\right)\left(a^{2} - ab + b^{2}\right)$.
      correction: 'le milieu prend le signe contraire du petit facteur : $\left(a - b\right)\left(a^{2}
        + ab + b^{2}\right)$.'
    - erreur: confondre $\left(x - 2\right)^{3}$ et $x^{3} - 2^{3}$.
      correction: ce sont deux expressions différentes.
    declic: null
    figures: []
  - id: 1ereD_M02_L2
    numero: '2.2'
    titre: Le triangle de Pascal ligne après ligne
    retenir:
    - '|---|---|'
    - 'La ligne $n$ donne les coefficients de $\left(a + b\right)^{n}$ : $n + 1$ termes.'
    - Puissance de $a$ décroissante de $n$ à $0$, puissance de $b$ croissante de $0$ à $n$.
    - 'Pour $\left(a - b\right)^{n}$ : mêmes coefficients, signes alternés $+, -, +, -$…'
    - '**Trois contrôles :** $n + 1$ termes ; somme des deux exposants égale à $n$ dans chaque terme ;
      somme des coefficients de la ligne égale à $2^{n}$.'
    methode:
      titre: Développer $\left(a + b\right)^{n}$ pour $n = 4$ ou $n = 5$
      etapes:
      - '**Construis la ligne $n$** par additions depuis la ligne 3. Ne la devine pas, écris-la.'
      - '**Vérifie la ligne** : symétrique, de somme $2^{n}$.'
      - '**Écris les parties littérales**, puissance de $a$ décroissante, de $b$ croissante.'
      - '**Place les coefficients**, alterne les signes s''il s''agit d''une différence, puis calcule.'
    exemple_resolu: 'Développe $\left(x - 3\right)^{4}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Ligne 4 obtenue depuis la ligne 3, contrôlée par sa somme $2^{4} = 16$. | $1$ ; $4$ ; $6$ ; $4$
      ; $1$, et $1 + 4 + 6 + 4 + 1 = 16$ ✓ |

      | Différence : mêmes coefficients, signes alternés, $a = x$, $b = 3$. | $x^{4} - 4x^{3} \times 3
      + 6x^{2} \times 3^{2} - 4x \times 3^{3} + 3^{4}$ |

      | On calcule les puissances de $3$. | $\left(x - 3\right)^{4} = x^{4} - 12x^{3} + 54x^{2} - 108x
      + 81$ |

      | **Vérification :** pour $x = 1$, $\left(-2\right)^{4} = 16$ et $1 - 12 + 54 - 108 + 81 = 16$.
      ✓ | |'
    erreurs_frequentes:
    - erreur: 'oublier d''élever aussi le coefficient : dans $\left(2x - 3\right)^{5}$, le premier terme
        est $32x^{5}$.'
      correction: écris $\left(2x\right)^{5}$ avant de calculer.
    - erreur: appliquer la ligne $n$ à un exposant $n - 1$.
      correction: compte les termes, il en faut $n + 1$.
    declic: null
    figures:
    - figures/m02_f3.svg
  - id: 1ereD_M02_L3
    numero: '2.3'
    titre: Reconnaître un cube, factoriser, simplifier
    retenir:
    - '|---|---|---|---|---|---|---|---|---|---|---|'
    - 'Un exposant multiple de $3$ annonce un cube : $x^{6} = \left(x^{2}\right)^{3}$.'
    - 'Une fraction ne se simplifie qu''entre **produits** : factorise le haut et le bas avant de barrer.'
    - '$x^{6} - 64$ est à la fois un carré et un cube : les deux voies mènent à la même factorisation.'
    methode:
      titre: Factoriser une somme ou une différence de deux cubes
      etapes:
      - '**Deux termes seulement**, séparés par $+$ ou $-$ : une identité de degré 3 est possible.'
      - '**Teste chaque terme :** coefficient dans la liste des cubes ? exposants multiples de $3$ ? Si
        oui, écris-le sous la forme $\left(\ \right)^{3}$.'
      - '**Écris $a$ et $b$ explicitement** au brouillon, par exemple $a = 4y$ et $b = 5$.'
      - '**Applique l''identité** du signe observé, puis vérifie avec une valeur simple.'
    exemple_resolu: 'Factorise : 1) $64y^{3} - 125$ ; 2) $x^{6} - 8$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | 1) $64 = 4^{3}$ et $125 = 5^{3}$, donc $a = 4y$ et $b = 5$. | $64y^{3} - 125 = \left(4y - 5\right)\left(16y^{2}
      + 20y + 25\right)$ |

      | 2) Ici c''est l''exposant qui parle : $6$ est multiple de $3$. | $x^{6} = \left(x^{2}\right)^{3}$
      et $8 = 2^{3}$ |

      | Même identité, avec $a = x^{2}$ et $b = 2$. | $x^{6} - 8 = \left(x^{2} - 2\right)\left(x^{4} +
      2x^{2} + 4\right)$ |

      | **Vérification :** pour $y = 1$, $64 - 125 = -61$ et $\left(-1\right)\left(61\right) = -61$. ✓
      | |'
    erreurs_frequentes:
    - erreur: barrer $x - 3$ dans $\dfrac{x^{3} - 27}{x^{2} - 9}$ sans avoir factorisé.
      correction: $\dfrac{\left(x - 3\right)\left(x^{2} + 3x + 9\right)}{\left(x - 3\right)\left(x + 3\right)}
        = \dfrac{x^{2} + 3x + 9}{x + 3}$.
    - erreur: chercher à factoriser encore $x^{2} + 3x + 9$.
      correction: son discriminant est négatif, c'est fini.
    declic: à quoi ces identités servent dès la rentrée — Dès que tu reconnais deux cubes, la factorisation
      d'un polynôme de degré 3 tient en une ligne, là où les autres posent une division euclidienne. En
      Tle D, les mêmes identités reviennent dans les limites et avec $z^{3} = 1$ en nombres complexes.
    figures: []
