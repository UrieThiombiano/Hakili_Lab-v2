      en faisant apparaître $x^{3} + \frac{1}{x^{3}}$. b) Déduis-en $x^{3} + \frac{1}{x^{3}}$.
    correction: a) $\left(x + \frac{1}{x}\right)^{3} = x^{3} + \frac{1}{x^{3}} + 3\left(x + \frac{1}{x}\right)$.
      b) $27 = x^{3} + \frac{1}{x^{3}} + 9$, donc $x^{3} + \frac{1}{x^{3}} = 18$.
  - numero: 17
    etoiles: 2
