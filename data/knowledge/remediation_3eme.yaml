      ($B$ deux fois) ; en réalité $\overrightarrow{AB} = \overrightarrow{BC}$ signifie que **$B$ est
      le milieu de $\left[AC\right]$**, donc $A$, $B$, $C$ sont alignés. La ligne 4 aboutit au bon résultat
      parce que le calcul, lui, traduit correctement l''égalité des vecteurs ; cela ne sauve rien, un
      raisonnement faux n''est pas reproductible. Solution : $I\left(-1\,;\,1\right)$ et $C\left(-10\,;\,7\right)$,
      avec $B$ milieu de $\left[AC\right]$ ✓.'
