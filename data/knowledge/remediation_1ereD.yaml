  fiche_revision:
  - '**Signes.** Même signe $\to$ $+$ ; signes contraires $\to$ $-$. Un $-$ devant une parenthèse change
    tous les signes.'
  - '**Priorités.** Parenthèses, puissances, $\times \div$, puis $+ -$ ; à rang égal, de gauche à droite.'
  - '**Fractions.** Somme : même dénominateur. Division : multiplier par l''inverse. Simplifier des facteurs,
    jamais des termes.'
  - '**Puissances.** $a^{m}a^{n} = a^{m+n}$ ; $\frac{a^{m}}{a^{n}} = a^{m-n}$ ; $\left(a^{m}\right)^{n}
    = a^{mn}$ ; $a^{-n} = \frac{1}{a^{n}}$.'
  - '**Écriture scientifique.** $a \times 10^{n}$ avec $1 \le a < 10$.'
  - '**Racines.** $\sqrt{ab} = \sqrt{a}\sqrt{b}$ ; $\sqrt{u^{2}} = |u|$ ; jamais de distribution sur une
    somme ; conjugué pour rationaliser.'
  - '**Identités.** $\left(a \pm b\right)^{2} = a^{2} \pm 2ab + b^{2}$ ; $\left(a+b\right)\left(a-b\right)
    = a^{2} - b^{2}$.'
