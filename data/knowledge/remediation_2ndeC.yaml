      Dix rouleaux ($100$ m) sont insuffisants, onze ($110$ m) suffisent à coup sûr : **onze rouleaux**.'
  fiche_revision:
  - '**Racine carrée.** Pour $a \ge 0$, $\sqrt{a}$ est le seul nombre **positif** dont le carré vaut $a$
    ; pas de racine d''un négatif.'
  - '**Racine d''un carré.** $\sqrt{a^{2}} = \left|a\right|$ : on ôte les barres après avoir étudié le
    signe.'
  - '**Produit et quotient.** $\sqrt{ab} = \sqrt{a}\sqrt{b}$ et $\sqrt{\frac{a}{b}} = \frac{\sqrt{a}}{\sqrt{b}}$
    ; rien de tel pour une somme.'
  - '**Simplifier.** Extraire le plus grand carré parfait : $\sqrt{72} = 6\sqrt{2}$.'
  - '**Réduire.** $a\sqrt{c} + b\sqrt{c} = \left(a + b\right)\sqrt{c}$ : simplifier d''abord, additionner
    ensuite.'
  - '**Conjugué.** $\left(a + \sqrt{b}\right)\left(a - \sqrt{b}\right) = a^{2} - b$ : c''est lui qui chasse
    le radical du dénominateur.'
  - '**Comparer.** Deux réels positifs se comparent par leurs carrés ; encadrer $\sqrt{n}$, c''est encadrer
    $n$ entre deux carrés parfaits.'
  - '**Familles.** $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$
    ; $\sqrt{a}$ rationnel si $a$ est un carré parfait.'
  trouve_erreur:
  - faux: $\sqrt{9 + 16} = \sqrt{9} + \sqrt{16} = 7$
    correction: 'La racine ne se distribue pas : $\sqrt{25} = 5$.'
  - faux: $\sqrt{\left(-6\right)^{2}} = -6$
    correction: 'Une racine n''est jamais négative : $\left'
  - faux: $\sqrt{45} = \sqrt{9 \times 5} = 9\sqrt{5}$
    correction: 'C''est la racine du carré parfait qui sort : $3\sqrt{5}$.'
  - faux: $3\sqrt{2} + 5\sqrt{2} = 8\sqrt{4}$
    correction: 'Seuls les coefficients s''additionnent : $8\sqrt{2}$.'
  - faux: $\frac{7}{3 + \sqrt{2}} = \frac{7\left(3 - \sqrt{2}\right)}{3 + \sqrt{2}}$
    correction: 'Le conjugué doit multiplier le haut **et** le bas : $3 - \sqrt{2}$.'
  - faux: $\sqrt{2}$ est rationnel, car $\sqrt{2} = 1{,}414$
    correction: '$1{,}414$ n''est qu''une valeur approchée : $\sqrt{2}$ est irrationnel.'
