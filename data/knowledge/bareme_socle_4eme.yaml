  objet: Désigner le relevé dont l'écart à -15 dépasse 3 degrés et conclure sur la température imposée
  reponse_attendue: le relevé de -19 degrés (écart 4 > 3) ; la température imposée n'a pas été respectée
  solution: 'Conclusion attendue : « La température imposée n''a pas été respectée pendant tout le trajet,
    car le relevé de -19 degrés s''écarte de 4 degrés de -15 degrés, ce qui dépasse la limite de 3 degrés.
    » Barème (3 pts) : 1 pt pour la comparaison explicite de l''écart le plus grand à la limite (4 > 3)
    ; 1 pt pour l''identification du relevé de -19 degrés comme seul non conforme ; 1 pt pour la phrase
    de conclusion. Erreur propagée : des écarts faux à la question 2, comparés correctement à 3 degrés,
    gardent les deux premiers points.'
