    correction: 'a) $-2x^{3}$ : $-\infty$. b) $x^{4}$, exposant pair : $+\infty$. c) $\frac{5x}{x^{2}}
      = \frac{5}{x} \to 0$.'
  - numero: 2
    etoiles: 1
    enonce: Détermine $\lim\limits_{x \to 3^{+}} \frac{2x}{x - 3}$ et $\lim\limits_{x \to 3^{-}} \frac{2x}{x
