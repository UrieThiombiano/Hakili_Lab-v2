  reponse_attendue: n = 7 ; 7 > 4 (quart de 16), la note 13 a été obtenue par plus du quart des élèves
  solution: 'Notes connues : 5 × 3 + 9 × 4 + 17 × 2 = 85 ; 85 + 13n = 176, 13n = 91, n = 7. Effectif total
    16, quart 4, 7 > 4. Barème : 1 pt pour 85 + 13n = 176 et n = 7 (par essais vérifiés : point gardé)
    ; 1 pt pour le quart de l''effectif total, 4, comparé à 7, et la conclusion. Erreur propagée : un
    effectif faux correctement comparé au quart de son propre total garde le second point.'
  si_echoue: Recherche d'un effectif à partir de la somme des notes, raisonnement conduit à l'envers,
    puis comparaison d'un effectif au quart de l'effectif total.
