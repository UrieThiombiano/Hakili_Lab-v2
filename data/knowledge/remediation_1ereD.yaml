    départ.'
  - '**Somme, produit.** On calcule coordonnée par coordonnée ; $k\vec{u}\left(kx\,;\,ky\right)$.'
  - '**Chasles.** $\overrightarrow{AB} + \overrightarrow{BC} = \overrightarrow{AC}$.'
  - '**Parallélogramme $ABCD$.** $\overrightarrow{AB} = \overrightarrow{DC}$ (jamais $\overrightarrow{CD}$).'
  - '**Colinéarité.** $xy'' - x''y = 0$ ; sert à l''alignement et au parallélisme.'
  - '**Milieu.** Moyenne des coordonnées. **Distance.** $\sqrt{\Delta x^{2} + \Delta y^{2}}$, repère orthonormé.'
  - '**Nature d''un triangle.** Trois carrés de longueurs, puis réciproque de Pythagore.'
  trouve_erreur:
  - faux: $\overrightarrow{AB}\left(x_{A} - x_{B}\,;\,y_{A} - y_{B}\right)$
    correction: 'Arrivée moins départ : $\left(x_{B} - x_{A}\,;\,y_{B} - y_{A}\right)$'
  - faux: $ABCD$ parallélogramme $\iff \overrightarrow{AB} = \overrightarrow{CD}$
    correction: $\overrightarrow{AB} = \overrightarrow{DC}$
  - faux: $\sqrt{9 + 16} = 3 + 4 = 7$
    correction: '$\sqrt{25} = 5$ : la racine ne se distribue pas'
  - faux: $AB^{2} = 25$ donc $AB = 25$
    correction: $AB = 5$
  cartographie_lacunes: []
