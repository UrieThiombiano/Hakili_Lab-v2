- niveau: TleD
  module: 6
  module_titre: Majorant, minorant, et raisonner comme au lycée
  pourquoi: 'En Tle D, une suite « croissante et majorée » converge : la phrase est illisible sans majorant,
    minorant, maximum et minimum. Le raisonnement par l''absurde, vu ici avec $\sqrt{2}$, est exigé jusqu''au
    bac.'
  diagnostic:
  - question: 'Soit $A = \{1\,;\,4\,;\,7\,;\,9\}$ : donne un majorant, le maximum et le minimum.'
    reponse: majorant $9$ (ou tout nombre $\ge 9$) ; $\max = 9$ ; $\min = 1$
  - question: 'Vrai ou faux : « 10 est le maximum de $\left[2\,;\,10\right[$ ». Justifie.'
    reponse: faux, $10 \notin \left[2\,;\,10\right[$, donc pas de maximum
  - question: Le nombre $0{,}25$ est-il rationnel ? Et $\sqrt{2}$ ?
    reponse: $0{,}25 = \frac{1}{4}$ est rationnel ; $\sqrt{2}$ est irrationnel
  - question: Cite un minorant de $\left]3\,;\,+\infty\right[$. Cet intervalle a-t-il un minimum ?
    reponse: $3$ (ou tout nombre $\le 3$) ; pas de minimum, car $3 \notin \left]3\,;\,+\infty\right[$
  - question: Montre que $x^{2} + 1 \ge 2x$ pour tout réel $x$.
    reponse: $x^{2} + 1 - 2x = \left(x - 1\right)^{2} \ge 0$
  lecons:
  - id: TleD_M06_L1
    numero: '6.1'
    titre: Majorant, minorant, maximum, minimum
    retenir:
    - $M$ est un **majorant** de $A$ si $x \le M$ pour tout $x \in A$ ; $A$ est dite **majorée**.
    - $m$ est un **minorant** de $A$ si $x \ge m$ pour tout $x \in A$ ; $A$ est dite **minorée**.
    - '$A$ majorée **et** minorée est dite **bornée** : $m \le x \le M$ pour tout $x \in A$.'
    - Le **maximum** de $A$ est un majorant qui **appartient à $A$** ; noté $\max A$. Le **minimum** est
      un minorant qui appartient à $A$ ; noté $\min A$.
    - Une partie majorée a une **infinité** de majorants, mais **au plus un** maximum, qui **peut ne pas
      exister**.
    methode:
      titre: Reconnaître un majorant, puis un maximum
      etapes:
      - 'Pour $M$ **majorant** de $A$ : vérifie que **chaque** élément de $A$ est $\le M$.'
      - 'Pour $M$ **maximum** de $A$ : vérifie que $M$ est un majorant, **puis** que $M \in A$.'
      - 'Pour le minorant et le minimum : même démarche avec $\ge$.'
    exemple_resolu: 'À la rizerie de Bagré, un sac est conforme si sa masse $m$, en kg, vérifie $|m -
      25| \le 2$. Décris l''ensemble $C$ des masses conformes, puis donne son maximum et son minimum.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Une valeur absolue mesure une distance : je traduis en encadrement. | $\|m - 25\| \le 2 \iff -2
      \le m - 25 \le 2$ |

      | J''ajoute 25 aux trois membres. | $23 \le m \le 27$, donc $C = \left[23\,;\,27\right]$ |

      | Les deux crochets sont fermés : les bornes appartiennent à $C$. | $\max C = 27$ et $\min C = 23$
      |

      | **Vérification :** un sac de $27{,}5$ kg n''est pas conforme, car $|27{,}5 - 25| = 2{,}5 > 2$.
      ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures:
    - figures/m06_f5.svg
    - figures/m06_f6.svg
  - id: TleD_M06_L2
    numero: '6.2'
    titre: Les irrationnels et le raisonnement par l'absurde
    retenir:
    - Un **rationnel** s'écrit $\frac{p}{q}$ avec $p$ et $q$ entiers, $q \ne 0$ ; leur ensemble est $\mathbb{Q}$.
    - 'Un réel qui n''est pas rationnel est **irrationnel** : $\sqrt{2}$, $\sqrt{3}$, $\pi$.'
    - '$\sqrt{2}$ est irrationnel : aucune fraction n''a pour carré 2.'
    - '**Raisonner par l''absurde :** pour montrer qu''une affirmation est vraie, on suppose qu''elle
      est fausse, on calcule sans tricher, et on aboutit à une impossibilité. Exigence absolue : aucune
      erreur entre la supposition et la contradiction, sinon la contradiction vient de ton calcul et ne
      prouve rien.'
    methode:
      titre: Démontrer qu'un nombre est irrationnel (par l'absurde)
      etapes:
      - '**Suppose le contraire** : le nombre s''écrit $\frac{p}{q}$, fraction **irréductible** (ce mot
        fabrique la contradiction finale ; sans lui, la démonstration ne vaut rien).'
      - '**Élève au carré** et déduis une divisibilité (souvent : $p^{2}$ pair $\Rightarrow$ $p$ pair).'
      - 'Montre que $p$ et $q$ ont un **facteur commun** : contradiction.'
      - 'Conclus : l''hypothèse est fausse, le nombre est **irrationnel**.'
    exemple_resolu: 'Démontre que $\sqrt{2}$ est irrationnel.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On suppose $\sqrt{2} = \frac{p}{q}$, fraction irréductible, et on élève au carré. | $p^{2} = 2q^{2}$
      |

      | $2q^{2}$ est pair, donc $p^{2}$ est pair, donc $p$ est pair. | $p = 2k$ |

      | On remplace : $4k^{2} = 2q^{2}$, donc $q^{2} = 2k^{2}$ : $q$ est pair. | $p$ et $q$ tous deux
      pairs |

      | **Contradiction** avec l''irréductibilité. | **$\sqrt{2}$ est irrationnel.** |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: TleD_M06_L3
    numero: '6.3'
    titre: 'Prouver qu''un nombre majore : la méthode de la différence'
    retenir:
    - $A \ge B$ équivaut à $A - B \ge 0$ ; $A \le B$ équivaut à $A - B \le 0$.
    - 'Deux outils : un carré est toujours positif ou nul ($t^{2} \ge 0$) ; un quotient est du signe du
      produit numérateur $\times$ dénominateur.'
    - Si $A$ est l'ensemble des $f\left(n\right)$, $n \in \mathbb{N}$, montrer que $M$ majore $A$ revient
      à étudier le signe de $f\left(n\right) - M$.
    - 'Si cette différence est **toujours strictement négative**, $M$ majore $A$ **sans être atteint**
      : $M$ n''est pas le maximum, et l''ensemble peut n''en avoir aucun.'
    - 'Des essais numériques servent à deviner, **jamais** à démontrer : le mot « tout » interdit la vérification
      cas par cas.'
    methode:
      titre: Montrer que $M$ est un majorant, puis conclure sur le maximum
      etapes:
      - '**Écris la différence** entre l''élément général de l''ensemble et le candidat $M$.'
      - '**Réduis au même dénominateur**, puis factorise.'
      - '**Conclus sur le signe** : différence toujours $\le 0$ $\Rightarrow$ $M$ est un majorant.'
      - '**Cherche si $M$ est atteint** : une valeur qui annule la différence donne le maximum ; sinon,
        il n''y a pas de maximum.'
    exemple_resolu: 'Soit $A$ l''ensemble des réels $\frac{2m + 1}{m + 1}$, $m \in \mathbb{N}$. Montre
      que 2 majore $A$, puis conclus sur le maximum.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Je teste le candidat $M = 2$ par le signe de la différence. | $\frac{2m + 1}{m + 1} - 2 = \frac{2m
      + 1 - 2\left(m + 1\right)}{m + 1}$ |

      | Je réduis ; le dénominateur $m + 1$ est strictement positif. | $= \frac{-1}{m + 1} < 0$ : **2
      majore $A$** |

      | La différence ne s''annule jamais : 2 n''est pas atteint. | $A$ **n''a pas de maximum** |

      | **Vérification :** $\frac{2m+1}{m+1} = 2 - \frac{1}{m + 1}$ donne les deux résultats d''un coup.
      ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Soit $A = \{x \in \mathbb{N} / 2 \le x \le 8\}$. Donne deux majorants, deux minorants, puis
      le maximum et le minimum de $A$.
    correction: 'Majorants : $8$, $9$ ; minorants : $2$, $1$ ; $\max A = 8$ ; $\min A = 2$.'
  - numero: 2
    etoiles: 1
    enonce: Soit $I = \left]-3\,;\,7\right]$. Donne un majorant et un minorant de $I$. $I$ admet-il un
      maximum ? un minimum ? Justifie.
    correction: Majorant $7$, minorant $-3$. $\max I = 7$ car $7 \in I$ ; pas de minimum, car $-3 \notin
      I$ et tout élément de $I$ est dépassé par un plus petit.
  - numero: 3
    etoiles: 1
    enonce: 'Recopie et complète avec $\in$ ou $\notin$, en justifiant : a) $0{,}25$ … $\mathbb{Q}$ ;
      b) $\sqrt{9}$ … $\mathbb{Q}$ ; c) $1 + \sqrt{2}$ … $\mathbb{Q}$ ; d) $2\sqrt{3} - \sqrt{12}$ … $\mathbb{Q}$.'
    correction: a) $\in$ ($= \frac{1}{4}$) ; b) $\in$ ($\sqrt{9} = 3$) ; c) $\notin$ (sinon $\sqrt{2}
      = \left(1 + \sqrt{2}\right) - 1$ serait rationnel) ; d) $\in$ ($\sqrt{12} = 2\sqrt{3}$, donc le
      nombre vaut $0$).
  - numero: 4
    etoiles: 1
    enonce: Soit $A = \{x \in \mathbb{N} / 2 \le x \le 8\}$. a) Donne trois majorants et trois minorants
      de $A$. b) Donne le maximum et le minimum de $A$.
    correction: a) Majorants $8$, $9$, $10$ ; minorants $2$, $1$, $0$. b) $\max A = 8$ ; $\min A = 2$.
  - numero: 5
    etoiles: 1
    enonce: Soit $E = \left\{1\,;\,\frac{1}{2}\,;\,\frac{1}{3}\,;\,\frac{1}{5}\,;\,\frac{1}{6}\right\}$.
      a) Trouve un majorant de $E$ qui soit un élément de $E$. b) Trouve un minorant de $E$ qui ne soit
      pas un élément de $E$.
    correction: 'a) $1$ (élément de $E$ et majorant). b) $0$ : $0 \le \frac{1}{6}$ et $0 \notin E$.'
  - numero: 6
    etoiles: 1
    enonce: Soit $B = \{x \in \mathbb{Z} / |2x - 4| \le 10\}$. a) Écris $B$ en extension. b) Donne le
      maximum et le minimum de $B$.
    correction: a) $|2x - 4| \le 10 \iff -3 \le x \le 7$, donc $B = \{-3\,;\,-2\,;\,\ldots\,;\,7\}$. b)
      $\max B = 7$ ; $\min B = -3$.
  - numero: 7
    etoiles: 1
    enonce: Soit $L = \left\{-7{,}4\,;\,-\sqrt{5}\,;\,0\,;\,\pi\,;\,\frac{19}{7}\right\}$. a) Donne deux
      majorants et deux minorants de $L$. b) Donne le maximum et le minimum de $L$. $L$ est-il borné ?
    correction: 'Ordre : $-7{,}4 < -\sqrt{5} < 0 < \frac{19}{7} < \pi$. a) Majorants $\pi$ et $4$ ; minorants
      $-7{,}4$ et $-8$. b) $\max L = \pi$ ; $\min L = -7{,}4$ ; $L$ est borné.'
  - numero: 8
    etoiles: 1
    enonce: 'Vrai ou faux, en justifiant : a) « Tout intervalle fermé borné $\left[a\,;\,b\right]$ admet
      un maximum et un minimum. » b) « L''intervalle $\left]0\,;\,1\right[$ admet un minimum. » c) « 100
      est le maximum de $\left[0\,;\,100\right[$. »'
    correction: 'a) **Vrai** : les deux bornes appartiennent à $\left[a\,;\,b\right]$. b) **Faux** : $0
      \notin \left]0\,;\,1\right[$, et $\frac{x}{2}$ y est encore et plus petit. c) **Faux** : $100 \notin
      \left[0\,;\,100\right[$.'
  - numero: 9
    etoiles: 1
    enonce: Soit $A = \{x \in \mathbb{N} / 2 \le x \le 8\}$ et $B = \{x \in \mathbb{Z} / |2x - 4| \le
      10\}$. Trouve quatre majorants et quatre minorants de $A$, puis de $B$.
    correction: '$A$ : majorants $8$, $9$, $10$, $11$ ; minorants $2$, $1$, $0$, $-1$. $B = \{-3\,;\,\ldots\,;\,7\}$
      : majorants $7$, $8$, $9$, $10$ ; minorants $-3$, $-4$, $-5$, $-6$.'
  - numero: 10
    etoiles: 1
    enonce: 'On considère $I = \left[-1\,;\,\sqrt{3}\right]$ ; $J = \left]-\infty\,;\,\frac{3}{2}\right[$
      ; $K = \left[0\,;\,+\infty\right[$. Pour chacun, donne (s''ils existent) deux majorants, deux minorants,
      le maximum et le minimum. Lesquels sont bornés ?


      ### Entraînement ★★'
    correction: '$I$ : majorants $\sqrt{3}$, $2$ ; minorants $-1$, $-2$ ; $\max = \sqrt{3}$, $\min = -1$
      ; borné. $J$ : majorants $\frac{3}{2}$, $2$ ; aucun minorant ; ni maximum ni minimum ; non borné.
      $K$ : minorants $0$, $-1$ ; aucun majorant ; $\min = 0$, pas de maximum ; non borné. Seul $I$ est
      borné.'
  - numero: 11
    etoiles: 2
    enonce: Soit $A$ l'ensemble des réels de la forme $\frac{m}{m + 2}$, $m \in \mathbb{N}$. a) Calcule
      les premiers termes ($m = 0, 1, 2, 3$). b) Montre que 0 est le minimum de $A$. c) Montre que $A$
      est majoré par 1, mais n'admet pas de maximum.
    correction: 'a) $0$ ; $\frac{1}{3}$ ; $\frac{1}{2}$ ; $\frac{3}{5}$. b) Tous les termes sont $\ge
      0$ et $0$ est atteint pour $m = 0$ : $\min A = 0$. c) $\frac{m}{m + 2} = 1 - \frac{2}{m + 2} < 1$
      : $A$ est majoré par $1$. Aucun terme ne vaut $1$, et le terme de rang suivant dépasse toujours
      le précédent : pas de maximum.'
  - numero: 12
    etoiles: 2
    enonce: '*(J''écris et j''explique.)* Rédige, en quelques lignes, la différence entre un majorant
      et un maximum d''une partie de $\mathbb{R}$, en donnant un exemple d''ensemble majoré sans maximum.'
    correction: 'Un majorant majore sans forcément appartenir à l''ensemble ; un maximum est un majorant
      qui y appartient. Exemple : $\left[0\,;\,1\right[$ est majoré par $1$ mais n''a pas de maximum.'
  - numero: 13
    etoiles: 2
    enonce: En t'inspirant de la démonstration du cours, montre que $\sqrt{3}$ est irrationnel.
    correction: 'Suppose $\sqrt{3} = \frac{p}{q}$ irréductible. Alors $p^{2} = 3q^{2}$ : $3$ divise $p^{2}$,
      donc $3$ divise $p$ ($3$ premier). Pose $p = 3k$ : $q^{2} = 3k^{2}$, donc $3$ divise $q$. Facteur
      commun $3$ : contradiction. **$\sqrt{3}$ est irrationnel.**'
  - numero: 14
    etoiles: 2
    enonce: Démontre que $\sqrt{5}$ est irrationnel.
    correction: 'Même schéma avec $5$ : $p^{2} = 5q^{2}$ donne $5 \mid p$, puis $p = 5k$ donne $q^{2}
      = 5k^{2}$ et $5 \mid q$ : contradiction avec l''irréductibilité. **$\sqrt{5}$ est irrationnel.**'
  - numero: 15
    etoiles: 2
    enonce: Le nombre $\sqrt{2} + \sqrt{3}$ est-il rationnel ? (On pourra élever au carré et utiliser
      l'irrationalité de $\sqrt{6}$.)
    correction: '$\left(\sqrt{2} + \sqrt{3}\right)^{2} = 5 + 2\sqrt{6}$. Si $\sqrt{2} + \sqrt{3}$ était
      rationnel, son carré le serait, donc $\sqrt{6} = \frac{\left(5 + 2\sqrt{6}\right) - 5}{2}$ aussi
      : contradiction. **$\sqrt{2} + \sqrt{3}$ est irrationnel.**'
  - numero: 16
    etoiles: 2
    enonce: 'Soient $a$ et $b$ deux réels strictement positifs. On pose $M = \frac{a + b}{2}$ (moyenne
      arithmétique) et $g = \sqrt{ab}$ (moyenne géométrique). a) Calcule $M$ et $g$ pour $a = 2$ et $b
      = 8$. b) Démontre que $M - g = \frac{\left(\sqrt{a} - \sqrt{b}\right)^{2}}{2}$, puis que $M \ge
      g$.


      ### ★★★ Défis de maîtrise'
    correction: a) $M = 5$ ; $g = \sqrt{16} = 4$. b) $M - g = \frac{a + b - 2\sqrt{ab}}{2} = \frac{\left(\sqrt{a}
      - \sqrt{b}\right)^{2}}{2} \ge 0$, donc $M \ge g$ (égalité si $a = b$).
  - numero: 17
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple.

      a) Toute partie non vide et majorée de $\mathbb{R}$ admet un maximum.

      b) Si $M$ est un majorant de $A$ et si $M$ appartient à $A$, alors $M$ est le maximum de $A$.

      c) L''ensemble $A = \left\{\frac{1}{n},\ n \in \mathbb{N}^{*}\right\}$ admet un minimum.

      d) Toute partie finie et non vide de $\mathbb{R}$ admet un maximum.'
    correction: 'a) **Faux.** $A = \left]0\,;\,1\right[$ est non vide et majoré par $1$ sans maximum :
      si $m$ était le maximum, $m \in A$ donc $m < 1$, et $\frac{m + 1}{2} \in A$ dépasserait $m$ ; contradiction.
      (Une telle partie admet une **borne supérieure**, ce qui n''est pas un maximum.)

      b) **Vrai.** C''est la définition même du maximum, et l''hypothèse fournit les deux conditions.

      c) **Faux.** Pour tout $n \ge 1$, $\frac{1}{n + 1} \in A$ et $\frac{1}{n+1} < \frac{1}{n}$ : aucun
      élément n''est le plus petit. $A$ est minoré par $0$ sans minimum ; en revanche $\max A = 1$ (pour
      $n = 1$).

      d) **Vrai.** On range $\left\{x_{1}\,;\,\dots\,;\,x_{p}\right\}$ dans l''ordre croissant : le dernier
      appartient à l''ensemble et majore les autres. C''est la finitude qui le garantit.'
  - numero: 18
    etoiles: 3
    enonce: a) Démontre que si un entier $p$ est tel que $3$ divise $p^{2}$, alors $3$ divise $p$ (disjonction
      de cas sur le reste de $p$ dans la division par $3$). b) Démontre, par l'absurde, que $\sqrt{3}$
      est irrationnel. c) Démontre de même que $\sqrt{6}$ est irrationnel, puis déduis-en que $\sqrt{2}
      + \sqrt{3}$ est irrationnel.
    correction: 'a) Division euclidienne de $p$ par $3$ : si $p = 3k$, $p^{2} = 3\left(3k^{2}\right)$,
      reste $0$ ; si $p = 3k + 1$, $p^{2} = 3\left(3k^{2} + 2k\right) + 1$, reste $1$ ; si $p = 3k + 2$,
      $p^{2} = 3\left(3k^{2} + 4k + 1\right) + 1$, reste $1$. Le reste n''est nul que dans le premier
      cas : $3 \mid p^{2} \Rightarrow 3 \mid p$.

      b) Par l''absurde, $\sqrt{3} = \frac{p}{q}$ irréductible. Alors $p^{2} = 3q^{2}$, donc $3 \mid p^{2}$,
      donc $3 \mid p$ d''après a) : $p = 3k$. Alors $9k^{2} = 3q^{2}$, soit $q^{2} = 3k^{2}$, donc $3
      \mid q^{2}$, donc $3 \mid q$. $3$ divise $p$ et $q$ : contradiction avec l''irréductibilité. $\sqrt{3}$
      est irrationnel.

      c) Par l''absurde, $\sqrt{6} = \frac{p}{q}$ irréductible : $p^{2} = 6q^{2}$ est pair, donc $p =
      2k$ ; alors $4k^{2} = 6q^{2}$, soit $2k^{2} = 3q^{2}$ ; le membre de gauche est pair, donc $3q^{2}$
      est pair, donc $q^{2}$ puis $q$ sont pairs : contradiction. $\sqrt{6}$ est irrationnel. Enfin, si
      $s = \sqrt{2} + \sqrt{3}$ était rationnel, $s^{2} = 5 + 2\sqrt{6}$ le serait, donc $\sqrt{6} = \frac{s^{2}
      - 5}{2}$ aussi : contradiction. $\sqrt{2} + \sqrt{3}$ est irrationnel.'
  - numero: 19
    etoiles: 3
    enonce: On pose $A = \left\{\frac{2n + 1}{n + 1},\ n \in \mathbb{N}\right\}$. a) Montre que pour tout
      entier naturel $n$, $\frac{2n + 1}{n + 1} = 2 - \frac{1}{n + 1}$. b) Montre que $A$ est minoré et
      majoré, et donne un minorant et un majorant. c) $A$ admet-il un minimum ? un maximum ? Justifie
      chaque réponse, la seconde par l'absurde.
    correction: 'a) $2 - \frac{1}{n + 1} = \frac{2\left(n + 1\right) - 1}{n + 1} = \frac{2n + 1}{n + 1}$
      (avec $n + 1 \ne 0$).

      b) $n + 1 \ge 1 > 0$ donne $0 < \frac{1}{n + 1} \le 1$, donc $1 \le 2 - \frac{1}{n + 1} < 2$ : $A$
      est minoré par $1$ et majoré par $2$.

      c) **Minimum : oui**, $1$ est atteint pour $n = 0$ et minore $A$. **Maximum : non.** Par l''absurde,
      si $M = \max A$, il existe $n_{0}$ avec $M = 2 - \frac{1}{n_{0} + 1}$. Or $2 - \frac{1}{n_{0} +
      2} > M$ car $\frac{1}{n_{0} + 2} < \frac{1}{n_{0} + 1}$, et ce nombre appartient à $A$ : $M$ ne
      majore pas $A$, contradiction. Les éléments approchent $2$ sans l''atteindre.'
  - numero: 20
    etoiles: 3
    enonce: 'Voici la copie de Fatimata, qui devait étudier $B = \left]-\infty\,;\,4\right[$. Repère la
      ligne qui casse et dis exactement ce qui manque. Démontre ensuite, par l''absurde, que $B$ n''a
      pas de maximum.


      | Ligne | Ce que Fatimata a écrit |

      |---|---|

      | 1 | Pour tout $x$ de $B$, $x < 4$, donc $x \leq 4$ : $4$ est un majorant de $B$. |

      | 2 | Aucun réel plus petit que $4$ ne majore $B$. |

      | 3 | Donc $4$ est le maximum de $B$. |'
    correction: '**La ligne 3 est fausse.** Les lignes 1 et 2 établissent correctement que $4$ est le
      plus petit des majorants (la borne supérieure) ; mais un maximum doit **appartenir** à $B$, et $B
      = \left]-\infty\,;\,4\right[$ est ouvert en $4$. Cette condition d''appartenance manque.

      Par l''absurde : supposons $m = \max B$. Alors $m \in B$, donc $m < 4$. Posons $c = \frac{m + 4}{2}$
      : on a $m < c < 4$, donc $c \in B$ et $c > m$, ce qui contredit le fait que $m$ majore $B$. Donc
      $B$ n''a pas de maximum.'
  - numero: 21
    etoiles: 3
    enonce: On pose $E = \left\{n \in \mathbb{N}^{*} \ \middle|\ \frac{5n + 2}{n} \geq \frac{11}{2}\right\}$.
      Détermine $E$ en extension, dis s'il est majoré, s'il est minoré, donne son minimum et son maximum
      lorsqu'ils existent, et indique son nombre d'éléments.
    correction: 'Pour $n \ge 1$, $\frac{5n + 2}{n} = 5 + \frac{2}{n}$, donc l''inéquation devient $\frac{2}{n}
      \ge \frac{1}{2}$, soit (en multipliant par $2n > 0$) $4 \ge n$. Donc $E = \{1\,;\,2\,;\,3\,;\,4\}$
      : minoré (par $1$), majoré (par $4$), $\min E = 1$, $\max E = 4$, **quatre éléments**. Vérification
      : $n = 4$ donne $\frac{22}{4} = \frac{11}{2}$ ✓ ; $n = 5$ donne $5{,}4 < 5{,}5$.'
  - numero: 22
    etoiles: 3
    enonce: 'Une coopérative de karité de Banfora produit, le $n$-ième mois de son activité ($n \geq 1$),
      une quantité de beurre en kilogrammes donnée par $p\left(n\right) = \frac{800n}{n + 4}$. Le président
      annonce : « un jour, nous dépasserons les $800$ kg par mois ». A-t-il raison ? Justifie rigoureusement.
      Détermine ensuite à partir de quel mois la production dépasse $700$ kg.'
    correction: '$p\left(n\right) = \frac{800\left(n + 4\right) - 3\,200}{n + 4} = 800 - \frac{3\,200}{n
      + 4}$. Comme $n + 4 > 0$, on a $\frac{3\,200}{n+4} > 0$, donc $p\left(n\right) < 800$ pour tout
      $n \ge 1$ : **le président a tort**, $800$ est un majorant jamais atteint (la production s''en approche
      seulement autant qu''on veut).

      Seuil $700$ : $800 - \frac{3\,200}{n + 4} > 700 \iff \frac{3\,200}{n + 4} < 100 \iff 3\,200 < 100\left(n
      + 4\right)$ (licite car $n + 4 > 0$), soit $n > 28$ : **à partir du 29e mois**. Vérification : $p\left(28\right)
      = \frac{22\,400}{32} = 700$ et $p\left(29\right) = \frac{23\,200}{33} > 700$ ✓.


      ---'
  fiche_revision:
  - '**Majorant.** $M$ majore $A$ si $x \le M$ pour tout $x \in A$ ; il y en a une infinité.'
  - '**Maximum.** Majorant qui **appartient** à $A$ ; au plus un, et il peut ne pas exister.'
  - '**Borné.** Majoré et minoré à la fois.'
  - '**Crochet.** Fermé $\Rightarrow$ maximum ou minimum ; ouvert $\Rightarrow$ aucun des deux.'
  - '**Rationnel.** S''écrit $\frac{p}{q}$ ; sinon irrationnel ($\sqrt{2}$, $\sqrt{3}$, $\pi$).'
  - '**Par l''absurde.** Supposer le contraire, calculer sans erreur, aboutir à l''impossible.'
  - '**Majorer une formule.** Étudier le signe de $f\left(n\right) - M$, jamais des essais.'
  - '**Suites (Tle D).** Croissante et majorée $\Rightarrow$ convergente ; la limite n''est pas un maximum.'
  trouve_erreur:
  - faux: « $\max \left[0\,;\,100\right[ = 100$ »
    correction: '$100 \notin \left[0\,;\,100\right[$ : majorant, pas maximum'
  - faux: « $0{,}25$ est irrationnel, il a une virgule »
    correction: $0{,}25 = \frac{1}{4} \in \mathbb{Q}$
  - faux: « $\sqrt{2} = \frac{p}{q}$ (fraction quelconque), donc… »
    correction: il faut la supposer **irréductible**, sinon aucune contradiction
  - faux: « $x = 1, 2, 3$ conviennent, donc c'est vrai pour tout $x$ »
    correction: 'la preuve porte sur la lettre : signe de la différence'
  cartographie_lacunes: []
  source_path: remediation\TleD\modules_c\M06.md
- niveau: TleD
  module: 7
  module_titre: Second degré et tableaux de signes
  pourquoi: 'Le tableau de signes sert partout en Tle D : signe de $f''\left(x\right)$ pour les variations,
    inéquations avec $\ln$ et $\exp$, positions relatives de courbes. Tu connais ces règles, c''est leur
    mise en tableau qui dérape.'
  diagnostic:
  - question: Pour quelles valeurs de $x$ l'expression $5 - 3x$ est-elle positive ? négative ?
    reponse: positive si $x < \frac{5}{3}$, négative si $x > \frac{5}{3}$
  - question: 'Résous dans $\mathbb{R}$ : $\left(x - 2\right)\left(x + 3\right) = 0$.'
    reponse: $x = 2$ ou $x = -3$
  - question: Étudie le signe de $\left(x - 2\right)\left(x + 3\right)$.
    reponse: positif sur $\left]-\infty\,;\,-3\right[ \cup \left]2\,;\,+\infty\right[$, négatif sur $\left]-3\,;\,2\right[$
  - question: 'Résous dans $\mathbb{R}$ : $x^{2} - 5x + 6 = 0$.'
    reponse: $\Delta = 1$ ; $x = 2$ ou $x = 3$
  - question: 'Résous dans $\mathbb{R}$ : $x^{2} \le 9$.'
    reponse: $\left[-3\,;\,3\right]$ (pas seulement $x \le 3$)
  lecons:
  - id: TleD_M07_L1
    numero: '7.1'
    titre: Signe d'une expression affine $ax + b$
    retenir:
    - L'expression s'annule en $x_{0} = -\frac{b}{a}$.
    - Elle est du **signe de $a$ après** $x_{0}$, du **signe contraire de $a$ avant**.
    - '« Signe de $-a$ » ne veut pas dire « négatif » : si $a = -3$, l''expression est positive avant
      $x_{0}$.'
    - '|---|---|---|---|'
    methode:
      titre: Étudier le signe de $ax + b$
      etapes:
      - 'Résous $ax + b = 0$ : racine $x_{0} = -\frac{b}{a}$.'
      - 'Lis le signe de $a$ : c''est le signe à droite de $x_{0}$.'
      - 'Dresse le tableau : ligne $x$, ligne de l''expression, un $0$ sous la racine.'
      - '**Contrôle :** teste $x = 0$ et compare au tableau.'
    exemple_resolu: 'Étudie le signe de $5 - 3x$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Racine du facteur affine. | $5 - 3x = 0 \iff x = \frac{5}{3}$ |

      | $a = -3 < 0$ : le « $-$ » est à droite. | $5 - 3x > 0$ si $x < \frac{5}{3}$ ; $5 - 3x < 0$ si
      $x > \frac{5}{3}$ |

      | **Vérification :** $x = 0$ donne $5 > 0$ ✓ ; $x = 2$ donne $-1 < 0$. ✓ | |'
    erreurs_frequentes: []
    declic: null
    figures: []
  - id: TleD_M07_L2
    numero: '7.2'
    titre: Signe d'un produit ou d'un quotient
    retenir:
    - '$\frac{A}{B}$ et $A \times B$ ont **toujours le même signe** : un quotient se traite comme un produit.'
    - 'Seule différence : le dénominateur donne des **valeurs interdites**, jamais solutions.'
    - Aux racines du numérateur on écrit $0$, aux valeurs interdites une **double barre ‖**.
    methode:
      titre: Signe d'un produit ou d'un quotient
      etapes:
      - Trouve la **racine de chaque facteur** et les **valeurs interdites**.
      - Range toutes ces valeurs **dans l'ordre croissant** sur la première ligne.
      - Écris **une ligne par facteur**.
      - 'Dernière ligne : **règle des signes** colonne par colonne.'
    exemple_resolu: 'Étudie le signe de $P\left(x\right) = \left(5 - 3x\right)\left(2x + 1\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Racine de chaque facteur, séparément. | $5 - 3x = 0 \iff x = \frac{5}{3}$ ; $2x + 1 = 0 \iff x
      = -\frac{1}{2}$ |

      | Rangement croissant, sinon les colonnes ne veulent rien dire. | $-\frac{1}{2} < \frac{5}{3}$ |

      | Une ligne par facteur, puis règle des signes (figure 7.1). | $P > 0$ sur $]-\frac{1}{2}\,;\,\frac{5}{3}[$
      ; $P < 0$ sur $]-\infty\,;\,-\frac{1}{2}[ \cup ]\frac{5}{3}\,;\,+\infty[$ |

      | **Vérification :** $P\left(0\right) = 5 > 0$. ✓ | |


      [SVG: figures/m07_f2.svg]

      *Figure 7.1 : tableau de signes de $P$ ; chaque ligne donne le signe d''un facteur, la dernière
      les multiplie.*


      **Cas du quotient.** Pour $\frac{x + 4}{3 - x} \ge 0$ : racine $-4$, valeur interdite $3$.


      | $x$ | $-\infty$ | | $-4$ | | $3$ | | $+\infty$ |

      |---|---|---|---|---|---|---|---|

      | $x + 4$ | | $-$ | $0$ | $+$ | | $+$ | |

      | $3 - x$ | | $+$ | | $+$ | $0$ | $-$ | |

      | $\frac{x + 4}{3 - x}$ | | $-$ | $0$ | $+$ | ‖ | $-$ | |


      D''où $S = \left[-4\,;\,3\right[$ : crochet fermé sur la racine, ouvert sur la valeur interdite.'
    erreurs_frequentes:
    - erreur: multiplier l'inéquation par $x$ ou par $x - 2$.
      correction: on ne connaît pas le signe du multiplicateur, donc on fait un **tableau de signes**,
        on ne chasse pas le dénominateur.
    - erreur: fermer le crochet sur la valeur interdite parce que l'inégalité est large.
      correction: $\frac{x + 1}{x - 2} \ge 0$ a pour solutions $\left]-\infty\,;\,-1\right] \cup \left]2\,;\,+\infty\right[$.
    declic: null
    figures:
    - figures/m07_f2.svg
  - id: TleD_M07_L3
    numero: '7.3'
    titre: Équations et inéquations du second degré
    retenir:
    - '$\Delta > 0$ : deux racines $x_{1} = \frac{-b - \sqrt{\Delta}}{2a}$, $x_{2} = \frac{-b + \sqrt{\Delta}}{2a}$,
      et $ax^{2} + bx + c = a\left(x - x_{1}\right)\left(x - x_{2}\right)$.'
    - '$\Delta = 0$ : racine double $x_{0} = -\frac{b}{2a}$, et $a\left(x - x_{0}\right)^{2}$.'
    - '$\Delta < 0$ : pas de racine réelle, pas de factorisation dans $\mathbb{R}$.'
    methode:
      titre: Résoudre une équation puis une inéquation du second degré
      etapes:
      - 'Cherche une **factorisation rapide** : facteur commun, identité remarquable, racine évidente.'
      - Sinon, calcule $\Delta = b^{2} - 4ac$ et applique les formules.
      - 'Pour une **inéquation**, ne t''arrête pas aux racines : dresse le **tableau de signes**, signe
        de $a$ à l''extérieur.'
      - '**Contrôle :** somme $-\frac{b}{a}$ et produit $\frac{c}{a}$.'
    exemple_resolu: 'Résous dans $\mathbb{R}$ : a) $x^{2} - 5x + 6 = 0$ ; b) $x^{2} - 5x + 6 \le 0$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) $a = 1$, $b = -5$, $c = 6$ : discriminant. | $\Delta = 25 - 24 = 1 > 0$ |

      | Deux racines, $\sqrt{\Delta} = 1$. | $x_{1} = \frac{5 - 1}{2} = 2$ ; $x_{2} = \frac{5 + 1}{2}
      = 3$ |

      | b) $a = 1 > 0$ : « $-$ » entre les racines. | $x^{2} - 5x + 6 \le 0 \iff x \in \left[2\,;\,3\right]$
      |

      | **Vérification :** $x = 2{,}5$ donne $-0{,}25 \le 0$ ✓ ; somme $5$, produit $6$. ✓ | |'
    erreurs_frequentes:
    - erreur: « $x^{2} = 9$ donc $x = 3$ ».
      correction: $x = 3$ **ou** $x = -3$.
    - erreur: « $x^{2} \le 9$ donc $x \le 3$ ».
      correction: $-3 \le x \le 3$.
    - erreur: « $\Delta < 0$ donc pas de solution », même pour une inéquation.
      correction: 'si $\Delta < 0$ et $a > 0$, le trinôme est positif partout : $x^{2} + 2x + 5 < 0$ n''a
        pas de solution, mais $x^{2} + 2x + 5 > 0$ a pour solution $\mathbb{R}$.'
    declic: null
    figures:
    - figures/m07_f4.svg
    - figures/m07_f5.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Étudie le signe de : a) $2x + 8$ ; b) $7 - 2x$.'
    correction: 'a) Racine $-4$, $a = 2 > 0$ : négatif avant, positif après. b) Racine $\frac{7}{2}$,
      $a = -2 < 0$ : positif avant, négatif après.'
  - numero: 2
    etoiles: 1
    enonce: Dresse le tableau de signes de $-4x - 6$.
    correction: 'Racine $-\frac{3}{2}$, $a = -4 < 0$ : positif avant $-\frac{3}{2}$, négatif après.'
  - numero: 3
    etoiles: 1
    enonce: Étudie le signe de $\left(1 - 2x\right)\left(1 - 3x\right)$.
    correction: 'Racines $\frac{1}{3}$ et $\frac{1}{2}$ : positif sur $\left]-\infty\,;\,\frac{1}{3}\right[
      \cup \left]\frac{1}{2}\,;\,+\infty\right[$, négatif sur $\left]\frac{1}{3}\,;\,\frac{1}{2}\right[$.'
  - numero: 4
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : $\frac{x - 3}{x + 1} \le 0$.'
    correction: 'Racine $3$, valeur interdite $-1$ : $S = \left]-1\,;\,3\right]$ (crochet ouvert en $-1$).'
  - numero: 5
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : a) $x^{2} + x - 6 = 0$ ; b) $2x^{2} - 3x + 1 = 0$ (racine évidente).'
    correction: 'a) $\Delta = 25$ : $x = 2$ ou $x = -3$. b) $2 - 3 + 1 = 0$ donc $x = 1$ ; produit $\frac{1}{2}$
      : autre racine $\frac{1}{2}$.'
  - numero: 6
    etoiles: 1
    enonce: 'Résous dans $\mathbb{R}$ : $-x^{2} + 4x - 3 > 0$.'
    correction: '$\Delta = 4$, racines $1$ et $3$, $a = -1 < 0$ : positif entre les racines, $S = \left]1\,;\,3\right[$.'
  - numero: 7
    etoiles: 1
    enonce: 'Étudie le signe de : a) $\left(5 - 3x\right)\left(2x + 1\right)$ ; b) $\left(1 - 2x\right)\left(1
      - 3x\right)$.'
    correction: a) Positif sur $\left]-\frac{1}{2}\,;\,\frac{5}{3}\right[$, négatif à l'extérieur. b)
      Positif sur $\left]-\infty\,;\,\frac{1}{3}\right[ \cup \left]\frac{1}{2}\,;\,+\infty\right[$, négatif
      entre.
  - numero: 8
    etoiles: 1
    enonce: 'Étudie le signe de : a) $\frac{x + 1}{x - 2}$ ; b) $\frac{x^{2} - 4}{x + 2}$.'
    correction: 'a) Positif si $x < -1$ ou $x > 2$, négatif si $-1 < x < 2$ ($x = 2$ interdit). b) Se
      simplifie en $x - 2$ pour $x \ne -2$ : négatif si $x < 2$, positif si $x > 2$.'
  - numero: 9
    etoiles: 1
    enonce: 'Étudie le signe de : a) $2x\left(x - 2\right)$ ; b) $\left(2x - 1\right)\frac{3x - 1}{x}$.'
    correction: 'a) Positif sur $\left]-\infty\,;\,0\right[ \cup \left]2\,;\,+\infty\right[$, négatif
      sur $\left]0\,;\,2\right[$. b) Racines $\frac{1}{3}$ et $\frac{1}{2}$, interdit $0$ : négatif sur
      $\left]-\infty\,;\,0\right[ \cup \left]\frac{1}{3}\,;\,\frac{1}{2}\right[$, positif sinon.'
  - numero: 10
    etoiles: 1
    enonce: Démontre que $x^{2} - x\left(x + 3\right) = -3x$ pour tout réel $x$, puis donne le signe de
      $x^{2} - x\left(x + 3\right)$.
    correction: '$x^{2} - x^{2} - 3x = -3x$ : positif si $x < 0$, nul en $0$, négatif si $x > 0$.'
  - numero: 11
    etoiles: 1
