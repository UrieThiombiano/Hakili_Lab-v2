- niveau: 2ndeC
  module: 1
  module_titre: 'Calculer juste dans $\mathbb{Q}$ : fractions, puissances, priorités'
  pourquoi: 'En seconde C, le calcul numérique n''est plus un chapitre, c''est l''outil de tous les autres.
    Tu connais ces règles : c''est leur application qui dérape.'
  diagnostic:
  - question: Calcule $\frac{3}{4} - \frac{5}{6}$.
    reponse: $\frac{9}{12} - \frac{10}{12} = -\frac{1}{12}$
  - question: Calcule $\frac{2}{3} \div \frac{4}{9}$.
    reponse: $\frac{2}{3} \times \frac{9}{4} = \frac{3}{2}$
  - question: Calcule $\frac{7}{2} - \frac{1}{2} \times 3$.
    reponse: le produit d'abord, $\frac{7}{2} - \frac{3}{2} = 2$
  - question: Écris $\left(\frac{2}{5}\right)^{-2}$ sous forme de fraction irréductible.
    reponse: $\left(\frac{5}{2}\right)^{2} = \frac{25}{4}$
  - question: Donne l'écriture scientifique de $0{,}00047$.
    reponse: $4{,}7 \times 10^{-4}$
  lecons:
  - id: 2ndeC_M01_L1
    numero: '1.1'
    titre: Les quatre opérations dans $\mathbb{Q}$
    retenir:
    - 'Un rationnel est un quotient $\frac{a}{b}$ d''entiers relatifs, $b \ne 0$. Le signe se place où
      l''on veut : $\frac{-3}{4} = \frac{3}{-4} = -\frac{3}{4}$. **Écris le dénominateur positif et le
      signe devant la barre.**'
    - '$\left|x\right|$ est la distance de $x$ à $0$ : $\left|x\right| = x$ si $x \ge 0$, $\left|x\right|
      = -x$ si $x < 0$. Elle n''est **jamais négative**, et $\left|x\right| = \left|-x\right|$.'
    - 'Le dénominateur commun ne sert **qu''à** l''addition et à la soustraction : le plus petit est le
      PPCM.'
    - '**Inverse** de $\frac{a}{b}$ ($a \ne 0$) : $\frac{b}{a}$, leur **produit** vaut $1$ ; $0$ n''a
      pas d''inverse. **Opposé** de $\frac{a}{b}$ : $-\frac{a}{b}$, leur **somme** vaut $0$.'
    - 'Signe d''un produit ou d''un quotient : nombre **pair** de facteurs négatifs, résultat positif
      ; nombre **impair**, résultat négatif.'
    methode:
      titre: Additionner ou soustraire deux rationnels
      etapes:
      - Rends chaque dénominateur positif, signe devant la barre.
      - Prends le plus petit dénominateur commun (le PPCM).
      - Récris les deux fractions, additionne les numérateurs.
      - Simplifie et contrôle le signe.
    exemple_resolu: 'Calcule $A = \frac{7}{10} - \frac{-2}{15}$, puis $B = \frac{-4}{9} \times \frac{3}{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Soustraire un négatif, c''est ajouter son opposé. | $A = \frac{7}{10} + \frac{2}{15}$ |

      | PPCM de $10$ et $15$ : $30$. On additionne, on simplifie par $5$. | $A = \frac{21}{30} + \frac{4}{30}
      = \frac{25}{30} = \frac{5}{6}$ |

      | Pour le produit, aucun dénominateur commun ; un seul facteur négatif ; on simplifie avant de multiplier.
      | $B = -\frac{4 \times 3}{9 \times 2} = -\frac{2}{3}$ |

      | **Vérification :** $0{,}7 + 0{,}13 \approx 0{,}83$ et $\frac{5}{6} \approx 0{,}83$. ✓ | |


      [SVG: figures/m01_f1.svg]

      *Figure 1.1 : la valeur absolue se lit comme une distance ; l''opposé et l''inverse sont deux gestes
      différents.*'
    erreurs_frequentes:
    - erreur: réduire au même dénominateur avant un produit, $\frac{2}{3} \times \frac{1}{4} = \frac{8}{12}
        \times \frac{3}{12}$.
      correction: inutile et faux ; on multiplie en ligne, $\frac{2}{3} \times \frac{1}{4} = \frac{1}{6}$.
    - erreur: inverser les deux fractions dans une division.
      correction: seul le diviseur se retourne, $\frac{3}{4} \div \frac{2}{5} = \frac{3}{4} \times \frac{5}{2}
        = \frac{15}{8}$.
    declic: 'la barre de fraction — Si $\frac{1}{3} + \frac{1}{4}$ te semble faire $\frac{2}{7}$, le blocage
      n''est pas technique. $\frac{1}{3}$ n''est pas un couple de nombres : c''est **un seul nombre**,
      le résultat de $1 \div 3$. On n''additionne donc pas les hauts entre eux et les bas entre eux.'
    figures:
    - figures/m01_f1.svg
  - id: 2ndeC_M01_L2
    numero: '1.2'
    titre: Priorités, parenthèses et fractions en étages
    retenir:
    - 'Dans $\frac{2+3}{4}$, tout le numérateur se calcule avant la division : $\frac{5}{4}$, et non $2
      + \frac{3}{4}$.'
    - 'On simplifie des **facteurs**, jamais des **termes** : dans $\frac{3+5}{3}$ on ne barre rien, le
      résultat est $\frac{8}{3}$.'
    - La grande barre est une **division**. Quand les étages sont emboîtés, on part toujours de **l'étage
      le plus bas**.
    methode:
      titre: Calculer une fraction en étages
      etapes:
      - Calcule le numérateur en entier, comme s'il était entre parenthèses.
      - Calcule le dénominateur en entier, de même.
      - Remplace la grande barre par la multiplication par l'inverse du bas.
      - Simplifie avant de multiplier, puis rends irréductible.
    exemple_resolu: 'Calcule $E = \frac{2}{3} - \frac{1}{6} \div \frac{1}{2}$, puis $A = \frac{\ \frac{3}{4}
      - \frac{4}{7}\ }{\ \frac{4}{5} + \frac{2}{3}\ }$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | La division est prioritaire sur la soustraction. | $\frac{1}{6} \div \frac{1}{2} = \frac{1}{6}
      \times 2 = \frac{1}{3}$ |

      | La soustraction ensuite, au dénominateur $3$. | $E = \frac{2}{3} - \frac{1}{3} = \frac{1}{3}$
      |

      | Dans $A$, chaque étage se calcule seul, aux dénominateurs $28$ et $15$. | $\frac{5}{28}$ et $\frac{22}{15}$
      |

      | Grande barre égale division. **Vérification :** $0{,}18 \div 1{,}47 \approx 0{,}12$. ✓ | $A =
      \frac{5}{28} \times \frac{15}{22} = \frac{75}{616}$ |'
    erreurs_frequentes:
    - erreur: calculer $\frac{1}{2} + \frac{1}{2} \times 4$ de gauche à droite et annoncer $4$.
      correction: 'le produit forme un bloc et passe d''abord : $\frac{1}{2} + 2 = \frac{5}{2}$.'
    - erreur: dans des étages emboîtés, commencer par le haut.
      correction: on part du plus bas ; dans $\frac{1}{1 - \frac{1}{2}}$, on calcule $1 - \frac{1}{2}
        = \frac{1}{2}$, d'où $2$.
    declic: null
    figures: []
  - id: 2ndeC_M01_L3
    numero: '1.3'
    titre: Puissances entières et exposant négatif
    retenir:
    - Pour $n$ entier strictement positif, $x^{n} = x \times \cdots \times x$ ($n$ facteurs) ; $x^{1}
      = x$ ; $x^{0} = 1$ pour $x \ne 0$.
    - 'Un exposant négatif **retourne la base**, il ne rend jamais le nombre négatif : $3^{-2} = \frac{1}{9}
      > 0$.'
    - 'Base négative : exposant **pair**, résultat positif ; exposant **impair**, résultat négatif.'
    - '$\left(-\frac{2}{5}\right)^{2} = \frac{4}{25}$, mais $-\left(\frac{2}{5}\right)^{2} = -\frac{4}{25}$
      : la parenthèse décide de ce qui est élevé à la puissance.'
    methode:
      titre: Calculer une puissance de rationnel
      etapes:
      - 'Exposant négatif : retourne la base, rends l''exposant positif.'
      - Détermine le signe par la parité de l'exposant.
      - 'Cherche ce qui se simplifie **avant** de calculer : bases inverses, exposants à regrouper.'
      - Élève numérateur et dénominateur, rends irréductible.
    exemple_resolu: 'Calcule $A = \left(-\frac{2}{3}\right)^{-2}$, puis $B = \left(-\frac{4}{5}\right)^{3}
      \times \left(\frac{5}{4}\right)^{3}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | L''exposant est négatif : on retourne la base. L''exposant $2$ est pair, résultat positif. | $A
      = \left(-\frac{3}{2}\right)^{2} = \frac{9}{4}$ |

      | Dans $B$, même exposant des deux côtés : on applique $x^{n} y^{n} = \left(xy\right)^{n}$ avant
      tout calcul. | $B = \left(-\frac{4}{5} \times \frac{5}{4}\right)^{3}$ |

      | Les bases sont inverses au signe près, leur produit vaut $-1$. | $B = \left(-1\right)^{3} = -1$
      |

      | **Vérification :** base négative, exposant impair, résultat négatif. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $3^{-2} = -9$.
      correction: $3^{-2} = \frac{1}{3^{2}} = \frac{1}{9}$.
    - erreur: écrire $x^{2} \times x^{3} = x^{6}$.
      correction: dans un produit les exposants s'**ajoutent**, $x^{5}$ ; ils ne se multiplient que dans
        $\left(x^{2}\right)^{3} = x^{6}$.
    declic: null
    figures: []
  - id: 2ndeC_M01_L4
    numero: '1.4'
    titre: Puissances de $10$ et écriture scientifique
    retenir:
    - '$10^{p}$ est $1$ suivi de $p$ zéros ; $10^{-p} = \frac{1}{10^{p}}$ est plus petit que $1$, jamais
      négatif : $10^{-3} = 0{,}001$, alors que $-10^{3} = -1\,000$.'
    - $10^{a} \times 10^{b} = 10^{a+b}$ et $\frac{10^{a}}{10^{b}} = 10^{a-b}$. Multiplier par $10^{p}$
      déplace la virgule de $p$ rangs.
    - C'est $a \times 10^{p}$ avec $1 \le a < 10$ et $p$ entier relatif. Elle est **unique**.
    - '$45 \times 10^{3}$ n''en est pas une : on écrit $4{,}5 \times 10^{4}$. $0{,}9 \times 10^{2}$ non
      plus : on écrit $9 \times 10^{1}$.'
    - Dans une **somme**, on ramène d'abord à la **même** puissance de $10$, puis on additionne les premiers
      facteurs. **On n'additionne jamais les exposants dans une somme.**
    - '**Ordre de grandeur :** la puissance de $10$ la plus proche ; celui de $8{,}7 \times 10^{-4}$ est
      $10^{-3}$.'
    methode:
      titre: Mettre un résultat en écriture scientifique
      etapes:
      - Traite séparément les premiers facteurs et les puissances de $10$.
      - Place la virgule juste après le premier chiffre non nul.
      - 'Compte les rangs franchis : vers la gauche l''exposant augmente, vers la droite il diminue.'
      - Contrôle que $1 \le a < 10$.
    exemple_resolu: 'Calcule $P = \left(2{,}5 \times 10^{3}\right) \times \left(4 \times 10^{-2}\right)$
      et $S = \left(3 \times 10^{2}\right) + \left(5 \times 10^{1}\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Produit : on regroupe les premiers facteurs, on additionne les exposants. | $P = 10 \times 10^{1}$
      |

      | Le premier facteur doit vérifier $1 \le a < 10$. | $P = 1 \times 10^{2}$ |

      | Somme : on ramène tout à $10^{2}$, puis on additionne les seuls premiers facteurs. | $S = \left(3
      + 0{,}5\right) \times 10^{2} = 3{,}5 \times 10^{2}$ |

      | **Vérification :** $2\,500 \times 0{,}04 = 100$ et $300 + 50 = 350$. ✓ | |


      [SVG: figures/m01_f3.svg]

      *Figure 1.3 : sur un axe des ordres de grandeur, chaque graduation vaut dix fois la précédente.*'
    erreurs_frequentes:
    - erreur: $\left(2 \times 10^{3}\right) + \left(3 \times 10^{2}\right) = 5 \times 10^{5}$.
      correction: on ramène à la même puissance, $2 \times 10^{3} + 0{,}3 \times 10^{3} = 2{,}3 \times
        10^{3}$.
    - erreur: annoncer $20 \times 10^{4}$ comme écriture scientifique.
      correction: $2 \times 10^{5}$.
    declic: null
    figures:
    - figures/m01_f3.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Rends irréductible : a) $\frac{12}{18}$ ; b) $\frac{10}{15}$ ; c) $\frac{18}{24}$ ; d) $\frac{25}{100}$.'
    correction: a) $\frac{2}{3}$ ; b) $\frac{2}{3}$ ; c) $\frac{3}{4}$ ; d) $\frac{1}{4}$ (on divise par
      le PGCD).
  - numero: 2
    etoiles: 1
    enonce: Lesquelles de ces écritures désignent $-\frac{5}{8}$ ? $\frac{5}{-8}$ ; $\frac{-5}{-8}$ ;
      $\frac{10}{-16}$ ; $\frac{-10}{16}$.
    correction: Oui pour $\frac{5}{-8}$, $\frac{10}{-16}$ et $\frac{-10}{16}$. Non pour $\frac{-5}{-8}
      = \frac{5}{8}$, positif.
  - numero: 3
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $-\frac{2}{3}$ ; $-\frac{3}{4}$ ; $-\frac{5}{8}$.'
    correction: 'Au dénominateur $24$ : $-\frac{18}{24} < -\frac{16}{24} < -\frac{15}{24}$, soit $-\frac{3}{4}
      < -\frac{2}{3} < -\frac{5}{8}$.'
  - numero: 4
    etoiles: 1
    enonce: 'Donne la valeur absolue de : a) $-\frac{7}{3}$ ; b) $\frac{5}{6}$ ; c) $-4{,}2$ ; d) $0$.
      Range ensuite ces quatre nombres dans l''ordre croissant.'
    correction: 'a) $\frac{7}{3}$ ; b) $\frac{5}{6}$ ; c) $4{,}2$ ; d) $0$. Ordre : $-4{,}2 < -\frac{7}{3}
      < 0 < \frac{5}{6}$.'
  - numero: 5
    etoiles: 1
    enonce: Donne l'opposé, l'inverse et la valeur absolue de $\frac{-5}{7}$, puis de $\frac{2}{3}$.
    correction: '$\frac{-5}{7}$ : opposé $\frac{5}{7}$, inverse $-\frac{7}{5}$, valeur absolue $\frac{5}{7}$.
      $\frac{2}{3}$ : opposé $-\frac{2}{3}$, inverse $\frac{3}{2}$, valeur absolue $\frac{2}{3}$.'
  - numero: 6
    etoiles: 1
    enonce: 'Calcule : a) $\frac{2}{3} + \frac{1}{4}$ ; b) $\frac{5}{6} - \frac{1}{3}$ ; c) $\frac{1}{3}
      - \frac{5}{6}$.'
    correction: a) $\frac{8}{12} + \frac{3}{12} = \frac{11}{12}$ ; b) $\frac{5}{6} - \frac{2}{6} = \frac{1}{2}$
      ; c) $-\frac{1}{2}$ (opposé du b).
  - numero: 7
    etoiles: 1
    enonce: 'Calcule : a) $\frac{-1}{2} + \frac{5}{6}$ ; b) $\frac{-3}{5} + \frac{1}{2}$ ; c) $\frac{3}{4}
      + \left(\frac{-1}{3}\right)$.'
    correction: a) $\frac{-3+5}{6} = \frac{1}{3}$ ; b) $\frac{-6+5}{10} = -\frac{1}{10}$ ; c) $\frac{9-4}{12}
      = \frac{5}{12}$.
  - numero: 8
    etoiles: 1
    enonce: 'Calcule puis simplifie : a) $\frac{-5}{6} + \frac{1}{4} + \frac{1}{3}$ ; b) $\frac{5}{12}
      - \frac{1}{4} - \frac{1}{6}$.'
    correction: 'a) Au dénominateur $12$ : $\frac{-10+3+4}{12} = -\frac{1}{4}$. b) $\frac{5-3-2}{12} =
      0$.'
  - numero: 9
    etoiles: 1
    enonce: 'Effectue : a) $\frac{4}{5} \times \left(\frac{-5}{4}\right)$ ; b) $\frac{1}{3} \times \left(\frac{-6}{7}\right)$
      ; c) $\frac{-2}{5} \times \left(\frac{-4}{5}\right)$ ; d) $\frac{3}{5} \times \left(\frac{-13}{9}\right)$.'
    correction: a) $-1$ (bases inverses) ; b) $-\frac{2}{7}$ ; c) $\frac{8}{25}$ (deux facteurs négatifs)
      ; d) $-\frac{13}{15}$.
  - numero: 10
    etoiles: 1
    enonce: 'Donne l''inverse de : $\frac{-1}{2}$ ; $-8$ ; $\frac{1}{5}$ ; $\frac{7}{-4}$.'
    correction: $-2$ ; $-\frac{1}{8}$ ; $5$ ; $-\frac{4}{7}$.
  - numero: 11
    etoiles: 1
    enonce: 'Effectue : a) $\frac{5}{7} \div \frac{3}{8}$ ; b) $21 \div \frac{7}{8}$ ; c) $\frac{2}{3}
      \div \frac{2}{3}$ ; d) $\frac{7}{8} \div \frac{21}{8}$.'
    correction: a) $\frac{5}{7} \times \frac{8}{3} = \frac{40}{21}$ ; b) $21 \times \frac{8}{7} = 24$
      ; c) $1$ ; d) $\frac{7}{8} \times \frac{8}{21} = \frac{1}{3}$.
  - numero: 12
    etoiles: 1
    enonce: Calcule $A = \frac{3}{2} + \frac{1}{4} - \frac{7}{8}$.
    correction: 'Au dénominateur $8$ : $A = \frac{12+2-7}{8} = \frac{7}{8}$.'
  - numero: 13
    etoiles: 1
    enonce: 'Calcule en respectant les priorités : a) $\frac{11}{7} - \frac{4}{7} \times \frac{5}{4}$
      ; b) $\frac{13}{5} - \frac{3}{5} \times \frac{10}{9}$ ; c) $D = \frac{9}{4} \div \frac{3}{8} + \frac{1}{2}$.'
    correction: a) $\frac{4}{7} \times \frac{5}{4} = \frac{5}{7}$, d'où $\frac{6}{7}$. b) $\frac{3}{5}
      \times \frac{10}{9} = \frac{2}{3}$, d'où $\frac{39-10}{15} = \frac{29}{15}$. c) $\frac{9}{4} \times
      \frac{8}{3} = 6$, d'où $D = \frac{13}{2}$.
  - numero: 14
    etoiles: 1
    enonce: 'Sans calculer, donne le signe de : $\left(\frac{3}{5}\right)^{8}$ ; $\left(\frac{-1}{4}\right)^{15}$
      ; $\left(\frac{-3}{2}\right)^{24}$ ; $\left(\frac{-1}{6}\right)^{59}$.'
    correction: Positif ; négatif ; positif ; négatif (parité de l'exposant, base négative).
  - numero: 15
    etoiles: 1
    enonce: 'Calcule : a) $\left(\frac{2}{3}\right)^{2}$ ; b) $\left(\frac{-3}{4}\right)^{2}$ ; c) $\left(\frac{-2}{5}\right)^{3}$
      ; d) $\left(\frac{-1}{2}\right)^{4}$.'
    correction: a) $\frac{4}{9}$ ; b) $\frac{9}{16}$ ; c) $-\frac{8}{125}$ ; d) $\frac{1}{16}$.
  - numero: 16
    etoiles: 1
    enonce: 'Écris avec un exposant positif, puis calcule : a) $\left(\frac{3}{4}\right)^{-1}$ ; b) $5^{-2}$
      ; c) $\left(\frac{5}{3}\right)^{-2}$ ; d) $\left(-\frac{2}{3}\right)^{-2}$ ; e) $2^{-3}$ ; f) $\left(\frac{1}{3}\right)^{-3}$.'
    correction: a) $\frac{4}{3}$ ; b) $\frac{1}{25}$ ; c) $\left(\frac{3}{5}\right)^{2} = \frac{9}{25}$
      ; d) $\left(-\frac{3}{2}\right)^{2} = \frac{9}{4}$ ; e) $\frac{1}{8}$ ; f) $3^{3} = 27$.
  - numero: 17
    etoiles: 1
    enonce: 'Simplifie, puis calcule : $\left(\frac{3}{5}\right)^{2} \times \left(\frac{3}{5}\right)^{3}
      \times \left(\frac{5}{3}\right)^{4}$.'
    correction: $\left(\frac{3}{5}\right)^{5} \times \left(\frac{3}{5}\right)^{-4} = \left(\frac{3}{5}\right)^{1}
      = \frac{3}{5}$, car $\frac{5}{3}$ est l'inverse de $\frac{3}{5}$.
  - numero: 18
    etoiles: 1
    enonce: 'Écris sous forme d''une seule puissance de $10$ : a) $10^{3} \times 10^{5}$ ; b) $10^{5}
      \times 10^{-4}$ ; c) $10^{7} \div 10^{-1}$ ; d) $10^{4} \div 10^{-4}$ ; e) $10^{-3} \times 10^{6}
      \times 10^{-4}$.'
    correction: a) $10^{8}$ ; b) $10^{1}$ ; c) $10^{8}$ ; d) $10^{8}$ ; e) $10^{-1}$.
  - numero: 19
    etoiles: 1
    enonce: 'Donne la notation scientifique de : $38\,172$ ; $265\,000\,000$ ; $0{,}00524$ ; $0{,}000066$
      ; $25 \times 10^{-3}$ ; $182 \times 10^{7}$.


      ### Entraînement ★★'
    correction: $3{,}8172 \times 10^{4}$ ; $2{,}65 \times 10^{8}$ ; $5{,}24 \times 10^{-3}$ ; $6{,}6 \times
      10^{-5}$ ; $2{,}5 \times 10^{-2}$ ; $1{,}82 \times 10^{9}$.
  - numero: 20
    etoiles: 2
    enonce: 'Donne l''ordre de grandeur de : a) $3{,}2 \times 10^{5}$ ; b) $8{,}7 \times 10^{-4}$ ; c)
      $21\,000\,000$.'
    correction: a) $10^{5}$ ; b) $10^{-3}$ ($8{,}7$ est plus proche de $10$) ; c) $10^{7}$.
  - numero: 21
    etoiles: 2
    enonce: Calcule $\left(\frac{11}{12} \div \frac{33}{16}\right) \times \frac{3}{5}$.
    correction: $\frac{11}{12} \times \frac{16}{33} = \frac{4}{9}$, puis $\frac{4}{9} \times \frac{3}{5}
      = \frac{4}{15}$.
  - numero: 22
    etoiles: 2
    enonce: 'Calcule : a) $\frac{\ \frac{2}{3} + \frac{1}{6}\ }{\ \frac{3}{4}\ }$ ; b) $\frac{\ \frac{5}{6}\
      }{\ \frac{2}{3} - \frac{1}{4}\ }$ ; c) $\frac{\ \frac{3}{4} - \frac{4}{7}\ }{\ \frac{2}{3}\ }$.'
    correction: a) $\frac{5}{6} \times \frac{4}{3} = \frac{10}{9}$ ; b) bas $= \frac{5}{12}$, d'où $\frac{5}{6}
      \times \frac{12}{5} = 2$ ; c) haut $= \frac{5}{28}$, d'où $\frac{5}{28} \times \frac{3}{2} = \frac{15}{56}$.
  - numero: 23
    etoiles: 2
    enonce: 'Donne le résultat en écriture scientifique : $a = 3{,}4 \times 10^{-2} + 5{,}2 \times 10^{-3}$
      ; $e = \left(1{,}45 \times 10^{3}\right) \times \left(2{,}4 \times 10^{-2}\right)$.'
    correction: '$a$ : somme, on ramène à $10^{-2}$, $\left(3{,}4 + 0{,}52\right) \times 10^{-2} = 3{,}92
      \times 10^{-2}$. $e$ : produit, $1{,}45 \times 2{,}4 = 3{,}48$ et $3 - 2 = 1$, d''où $3{,}48 \times
      10^{1}$.'
  - numero: 24
    etoiles: 2
    enonce: Une cuve est remplie aux $\frac{3}{4}$. On utilise les $\frac{2}{3}$ de ce qu'elle contient.
      Quelle fraction de la cuve entière a-t-on utilisée ?
    correction: 'Prendre les $\frac{2}{3}$, c''est multiplier : $\frac{2}{3} \times \frac{3}{4} = \frac{1}{2}$.
      On a utilisé la moitié de la cuve.'
  - numero: 25
    etoiles: 2
    enonce: 'À Diébougou, un champ est partagé entre quatre héritiers : $\frac{1}{4}$, $\frac{1}{5}$,
      $\frac{3}{10}$, et le reste pour le dernier. Quelle fraction revient au dernier héritier ?'
    correction: 'Au dénominateur $20$ : $\frac{5+4+6}{20} = \frac{3}{4}$. Il reste $1 - \frac{3}{4} =
      \frac{1}{4}$ du champ.'
  - numero: 26
    etoiles: 2
    enonce: 'Le budget annuel d''une commune est de $9 \times 10^{7}$ FCFA pour $3 \times 10^{4}$ habitants.
      Quelle est la dépense moyenne par habitant, en écriture scientifique puis décimale ?


      #### Entraînement intensif : une ligne, une opération


      *Recopie chaque calcul et descends d''une ligne à chaque opération effectuée.*'
    correction: $\frac{9 \times 10^{7}}{3 \times 10^{4}} = 3 \times 10^{3}$ FCFA, soit $3\,000$ FCFA par
      habitant.
  - numero: 27
    etoiles: 2
    enonce: 'Calcule : $A = \frac{5}{3} + \frac{1}{2} - \frac{3}{4}$ ; $B = \left(-\frac{3}{4}\right)^{2}
      + \left(\frac{1}{2}\right)^{3}$ ; $C = \left(\frac{2}{3} - \frac{1}{2}\right) \times \left(\frac{5}{2}
      + \frac{1}{6}\right)$.'
    correction: $A = \frac{20+6-9}{12} = \frac{17}{12}$. $B = \frac{9}{16} + \frac{2}{16} = \frac{11}{16}$
      (puissances d'abord). $C = \frac{1}{6} \times \frac{8}{3} = \frac{4}{9}$.
  - numero: 28
    etoiles: 2
    enonce: Calcule $E = \frac{\ \frac{1}{2} + 7\ }{\ 7 - \frac{3}{4}\ }$ et $F = \frac{1}{\ 1 + \frac{1}{\,1
      - \frac{1}{2}\,}\ }$.
    correction: '$E = \frac{15}{2} \times \frac{4}{25} = \frac{6}{5}$. $F$ : du bas, $1 - \frac{1}{2}
      = \frac{1}{2}$ puis $\frac{1}{1/2} = 2$, donc $F = \frac{1}{1+2} = \frac{1}{3}$.'
  - numero: 29
    etoiles: 2
    enonce: Calcule $M = \frac{\ 1 - \frac{4}{5}\ }{\ \frac{1}{3} + \frac{1}{15}\ }$ ; $N = \frac{\ \frac{1}{5}
      - 5\ }{\ \frac{1}{5} + 1\ }$ ; $P = \frac{\ 1 - \frac{1}{2} + \frac{1}{3}\ }{\ 1 + \frac{1}{2} -
      \frac{1}{3}\ }$.
    correction: $M = \frac{1}{5} \times \frac{5}{2} = \frac{1}{2}$. $N = -\frac{24}{5} \times \frac{5}{6}
      = -4$. $P = \frac{5}{6} \times \frac{6}{7} = \frac{5}{7}$.
  - numero: 30
    etoiles: 2
    enonce: Calcule $D = \frac{3}{5} - \frac{2}{5} \div \frac{4}{25}$ ; $E = \frac{5}{4} + \frac{3}{4}
      \times \left(\frac{1}{2} + \frac{2}{3} - 1\right)$ ; $F = \left(\frac{2}{3}\right)^{4} \times \left(\frac{9}{4}\right)^{4}$.
    correction: $D = \frac{3}{5} - \frac{5}{2} = -\frac{19}{10}$ (division d'abord). $E = \frac{5}{4}
      + \frac{3}{4} \times \frac{1}{6} = \frac{11}{8}$. $F = \left(\frac{2}{3} \times \frac{9}{4}\right)^{4}
      = \left(\frac{3}{2}\right)^{4} = \frac{81}{16}$.
  - numero: 31
    etoiles: 2
    enonce: Calcule $H = \left(\frac{7}{2} - 2\right) \div \left(\frac{3}{2}\right)^{-2}$ et $K = \left(\frac{5}{3}\right)^{-2}
      \div \frac{9}{20}$.
    correction: $H = \frac{3}{2} \div \frac{4}{9} = \frac{27}{8}$. $K = \frac{9}{25} \times \frac{20}{9}
      = \frac{4}{5}$.
  - numero: 32
    etoiles: 2
    enonce: 'Trouve : a) l''entier $n$ tel que $\left(\frac{1}{2}\right)^{n} = \frac{1}{32}$ ; b) l''entier
      $m$ tel que $\frac{343}{125} = \left(\frac{7}{5}\right)^{m}$ ; c) $x$ tel que $10^{4} \times x =
      10^{3}$ ; d) $x$ tel que $x \times 10^{4} = 1$.'
    correction: a) $32 = 2^{5}$, donc $n = 5$. b) $343 = 7^{3}$ et $125 = 5^{3}$, donc $m = 3$. c) $x
      = 10^{-1}$. d) $x = 10^{-4}$.
  - numero: 33
    etoiles: 2
    enonce: 'On donne $M = 1{,}2 \times 10^{4}$ et $N = 4 \times 10^{3}$. a) Calcule $M \times N$, $M
      + N$ et $M \div N$ en notation scientifique. b) Calcule $a = 43 \times 10^{-1} - 52 \times 10^{-2}$.


      ### ★★★ Défis de maîtrise'
    correction: a) $M \times N = 4{,}8 \times 10^{7}$ ; $M + N = 1{,}6 \times 10^{4}$ (après $N = 0{,}4
      \times 10^{4}$) ; $M \div N = 3 \times 10^{0}$. b) $4{,}3 - 0{,}52 = 3{,}78$, soit $3{,}78 \times
      10^{0}$.
  - numero: 34
    etoiles: 3
    enonce: 'Voici la copie de Boukary, recopiée sans rien changer.

      $$E = \frac{3}{4} - \frac{1}{4} \times \left(\frac{2}{3}\right)^{-1} + \left(-\frac{1}{2}\right)^{2}$$

      Ligne 1 : $E = \frac{3}{4} - \frac{1}{4} \times \frac{2}{3} + \left(-\frac{1}{2}\right)^{2}$

      Ligne 2 : $E = \frac{3}{4} - \frac{2}{12} - \frac{1}{4}$

      Ligne 3 : $E = \frac{9}{12} - \frac{2}{12} - \frac{3}{12}$

      Ligne 4 : $E = \frac{4}{12} = \frac{1}{3}$

      Deux lignes contiennent chacune une erreur. Trouve-les, dis ce qui a été confondu, puis refais le
      calcul.'
    correction: 'On relit chaque ligne en se demandant quelle transformation a été appliquée. Ligne 1
      fausse : $\left(\frac{2}{3}\right)^{-1} = \frac{3}{2}$, l''exposant $-1$ retourne la base. Ligne
      2 fausse : $\left(-\frac{1}{2}\right)^{2} = +\frac{1}{4}$, la parenthèse enferme le signe et l''exposant
      est pair. Reprise : $E = \frac{3}{4} - \frac{1}{4} \times \frac{3}{2} + \frac{1}{4} = \frac{6}{8}
      - \frac{3}{8} + \frac{2}{8} = \frac{5}{8}$.'
  - numero: 35
    etoiles: 3
    enonce: a) Fatou dépense $\frac{3}{8}$ de son argent au marché et $\frac{1}{4}$ pour le transport
      ; il lui reste $1\,500$ FCFA. Quelle somme avait-elle au départ ? b) On pose $M = \frac{b \times
      10^{-4}}{0{,}08 \times 10^{-2}}$ et $N = \left(-\frac{1}{3} + \frac{1}{2}\right) \times \frac{3}{2}
      + 1$. Calcule $b$ pour que $M$ et $N$ soient inverses l'un de l'autre.
    correction: 'On ne connaît pas la donnée de départ mais le résultat : il faut remonter la chaîne.
      a) Fatou dépense $\frac{5}{8}$, il reste $\frac{3}{8}$ de la somme $S$ : $\frac{3}{8}S = 1\,500$,
      d''où $S = 4\,000$ FCFA. b) $N = \frac{1}{6} \times \frac{3}{2} + 1 = \frac{5}{4}$, donc il faut
      $M = \frac{4}{5}$. Or $0{,}08 \times 10^{-2} = 8 \times 10^{-4}$, donc $M = \frac{b}{8}$ et $b =
      \frac{32}{5} = 6{,}4$.'
  - numero: 36
    etoiles: 3
    enonce: Vrai ou faux ? Justifie par une preuve ou un contre-exemple. a) Pour tout rationnel non nul
      $x$, $x^{-2}$ est positif. b) $\left(-3\right)^{-2} = -\frac{1}{9}$. c) $\left(2 \times 10^{3}\right)
      + \left(3 \times 10^{2}\right) = 5 \times 10^{5}$. d) Pour tous rationnels $a$ et $b$, $\left|a
      + b\right| = \left|a\right| + \left|b\right|$.
    correction: 'Une affirmation générale se prouve, une affirmation fausse se démolit par un contre-exemple.
      a) Vrai : $x^{-2} = \frac{1}{x^{2}}$ et $x^{2} > 0$. b) Faux : $\left(-3\right)^{-2} = \frac{1}{9}$
      ; c''est $-3^{-2}$ qui vaut $-\frac{1}{9}$. c) Faux : $2\,300 = 2{,}3 \times 10^{3}$. d) Faux :
      $a = 2$, $b = -3$ donnent $1$ à gauche et $5$ à droite ; en général $\left|a+b\right| \le \left|a\right|
      + \left|b\right|$.'
  - numero: 37
    etoiles: 3
    enonce: Calcule $1 - \frac{1}{2}$ ; $\frac{1}{2} - \frac{1}{3}$ ; $\frac{1}{3} - \frac{1}{4}$ ; $\frac{1}{4}
      - \frac{1}{5}$ ; $\frac{1}{5} - \frac{1}{6}$. Vérifie ensuite que $\frac{1}{n} - \frac{1}{n+1} =
      \frac{1}{n\left(n+1\right)}$ pour tout entier naturel non nul $n$. Sers-t'en pour calculer $S =
      \frac{1}{2} + \frac{1}{6} + \frac{1}{12} + \frac{1}{20} + \frac{1}{30} + \frac{1}{42} + \frac{1}{56}
      + \frac{1}{72} + \frac{1}{90}$.
    correction: 'On calcule les différences pour voir la régularité, puis on reconnaît dans $S$ une chaîne
      qui se détruit. Différences : $\frac{1}{2}$ ; $\frac{1}{6}$ ; $\frac{1}{12}$ ; $\frac{1}{20}$ ;
      $\frac{1}{30}$. Preuve : $\frac{1}{n} - \frac{1}{n+1} = \frac{\left(n+1\right)-n}{n\left(n+1\right)}
      = \frac{1}{n\left(n+1\right)}$. Les dénominateurs de $S$ sont $1 \times 2$, $2 \times 3$, ..., $9
      \times 10$, donc $S = 1 - \frac{1}{10} = \frac{9}{10}$.'
  - numero: 38
    etoiles: 3
    enonce: 'Calcule, en soignant chaque étage : $F = \frac{5}{\ 3 - \frac{2}{\,1 - \frac{4}{3}\,}\ }$
      et $B = \frac{1}{\ 1 - \frac{1}{\,1 - \frac{1}{2}\,}\ }$.'
    correction: 'Aucune simplification n''est possible tant que l''étage le plus profond n''est pas réduit.
      $F$ : $1 - \frac{4}{3} = -\frac{1}{3}$, puis $\frac{2}{-1/3} = -6$, puis $3 - \left(-6\right) =
      9$, d''où $F = \frac{5}{9}$. Le piège est ce signe moins. $B$ : $1 - \frac{1}{2} = \frac{1}{2}$,
      puis $\frac{1}{1/2} = 2$, puis $1 - 2 = -1$, d''où $B = -1$.'
  - numero: 39
    etoiles: 3
    enonce: La sonde Voyager-2 a envoyé un signal radio depuis $3{,}2$ milliards de kilomètres de la Terre.
      La vitesse des ondes radio est de $3 \times 10^{8}$ mètres par seconde. Combien de temps ce signal
      a-t-il mis pour atteindre la Terre ? Donne la durée en secondes, en écriture scientifique, puis
      en heures et minutes.
    correction: 'Les unités diffèrent : on convertit avant de diviser. $3{,}2 \times 10^{9}$ km $= 3{,}2
      \times 10^{12}$ m. Alors $t = \frac{3{,}2 \times 10^{12}}{3 \times 10^{8}} \approx 1{,}07 \times
      10^{4}$ s, soit environ $10\,700$ s, c''est-à-dire $2$ h $58$ min.'
  - numero: 40
    etoiles: 3
    enonce: 'Calcule sans développer aucun produit : a) $P = \frac{1}{2} \times \frac{2}{3} \times \frac{3}{4}
      \times \cdots \times \frac{99}{100}$ ; b) $C = \left(\frac{1}{8}\right)^{2448} \times 8^{2450}$
      ; c) $D = \left(\frac{4}{5}\right)^{65} \times \left(\frac{5}{4}\right)^{66}$. Dis chaque fois quelle
      propriété t''a évité le calcul.'
    correction: 'On cherche d''abord ce qui s''annule, car le calcul direct est impossible. a) Chaque
      numérateur simplifie le dénominateur précédent : il reste $P = \frac{1}{100}$ (simplification d''un
      facteur commun). b) $\frac{1}{8} = 8^{-1}$, donc $C = 8^{-2448} \times 8^{2450} = 8^{2} = 64$ (les
      exposants s''ajoutent). c) $D = \left(\frac{4}{5} \times \frac{5}{4}\right)^{65} \times \frac{5}{4}
      = \frac{5}{4}$ (bases inverses, $\left(xy\right)^{n} = x^{n}y^{n}$).'
  fiche_revision:
  - '**Signe et valeur absolue.** Dénominateur positif, signe devant la barre. $\left|x\right|$ est une
    distance : jamais négative, et $\left|x\right| = \left|-x\right|$.'
  - '**Somme et produit.** Le dénominateur commun ne sert qu''à l''addition et à la soustraction ; un
    produit se fait en ligne, en simplifiant avant.'
  - '**Opposé et inverse.** L''opposé s''ajoute pour donner $0$ ; l''inverse se multiplie pour donner
    $1$. $0$ n''a pas d''inverse. On ne retourne que le diviseur.'
  - '**Priorités.** Parenthèses, puissances, $\times$ et $\div$, puis $+$ et $-$, de gauche à droite.
    La barre de fraction vaut deux parenthèses ; on simplifie des facteurs, jamais des termes.'
  - '**Étages.** Grande barre égale division ; étages emboîtés, on part du plus bas.'
  - '**Puissances.** $x^{m}x^{n} = x^{m+n}$, $\frac{x^{m}}{x^{n}} = x^{m-n}$, $\left(x^{m}\right)^{n}
    = x^{mn}$, $\left(xy\right)^{n} = x^{n}y^{n}$, $\left(\frac{x}{y}\right)^{n} = \frac{x^{n}}{y^{n}}$,
    $x^{0} = 1$, $x^{-n} = \frac{1}{x^{n}}$. Exposant pair, résultat positif.'
  - '**Écriture scientifique.** $a \times 10^{p}$ avec $1 \le a < 10$, unique. Produit : exposants ajoutés.
    Somme : même puissance d''abord.'
  trouve_erreur:
  - faux: $\frac{1}{3} + \frac{1}{4} = \frac{2}{7}$
    correction: 'Une fraction est un seul nombre : au dénominateur $12$, $\frac{4}{12} + \frac{3}{12}
      = \frac{7}{12}$.'
  - faux: $\frac{3+5}{3} = 5$ en barrant les deux $3$
    correction: 'Le $3$ du haut est un terme, pas un facteur : $\frac{8}{3}$.'
  - faux: $\left(-\frac{2}{5}\right)^{2} = -\frac{4}{25}$
    correction: 'Exposant pair, résultat positif : $\frac{4}{25}$. C''est $-\left(\frac{2}{5}\right)^{2}$
      qui vaut $-\frac{4}{25}$.'
  - faux: $\left(2 \times 10^{3}\right) + \left(3 \times 10^{2}\right) = 5 \times 10^{5}$
    correction: 'Dans une somme, même puissance d''abord : $2{,}3 \times 10^{3}$.'
  cartographie_lacunes:
  - lacune: Calcul fractionnaire et puissances encore fautifs
    bloque_en: calculs dans $\mathbb{R}$
  source_path: remediation\2ndeC\modules_c\M01.md
- niveau: 2ndeC
  module: 2
  module_titre: Racines carrées et nombres réels
  pourquoi: 'La racine carrée est le symbole le plus maltraité de la fin du collège : distribuée sur une
    somme, additionnée sans regarder ce qui est écrit dessous, laissée négative. Ce module remet en place
    cinq gestes : reconnaître un carré parfait, simplifier un radical, réduire une somme de radicaux,
    chasser un radical d''un dénominateur, situer un nombre dans $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{D}$,
    $\mathbb{Q}$, $\mathbb{R}$.'
  diagnostic:
  - question: Calcule $\sqrt{81}$, $\sqrt{0{,}25}$ et $\sqrt{3\,600}$.
    reponse: $9$ ; $0{,}5$ ; $60$
  - question: Écris $\sqrt{75}$ sous la forme $a\sqrt{b}$, avec $b$ le plus petit possible.
    reponse: $5\sqrt{3}$
  - question: Réduis $\sqrt{8} + \sqrt{18}$.
    reponse: $2\sqrt{2} + 3\sqrt{2} = 5\sqrt{2}$
  - question: Écris sans radical $\sqrt{\left(2 - \sqrt{5}\right)^{2}}$.
    reponse: $\sqrt{5} > 2$, donc le résultat vaut $\sqrt{5} - 2$
  - question: Rends rationnel le dénominateur de $\frac{7}{3 + \sqrt{2}}$.
    reponse: on multiplie par $3 - \sqrt{2}$ en haut et en bas ; la fraction vaut $3 - \sqrt{2}$
  lecons:
  - id: 2ndeC_M02_L1
    numero: '2.1'
    titre: Racine carrée, carrés parfaits et $\sqrt{a^{2}} = \left|a\right|$
    retenir:
    - 'Pour $a \ge 0$, $\sqrt{a}$ est le nombre **positif** dont le carré vaut $a$ : $\left(\sqrt{a}\right)^{2}
      = a$.'
    - '$\sqrt{a}$ n''existe **que si** $a \ge 0$ : $\sqrt{-9}$ n''a aucun sens. Et $\sqrt{a}$ est toujours
      positif ou nul.'
    - 'Carrés parfaits à savoir dans les deux sens : $1$, $4$, $9$, $16$, $25$, $36$, $49$, $64$, $81$,
      $100$, $121$, $144$, $169$, $196$, $225$.'
    - 'Décimaux : on compte les chiffres après la virgule par paires. $\sqrt{0{,}49} = 0{,}7$ ; $\sqrt{1{,}44}
      = 1{,}2$.'
    - '**Encadrer $\sqrt{n}$** : de $k^{2} < n < \left(k + 1\right)^{2}$ on tire $k < \sqrt{n} < k + 1$.'
    - 'Pour tout réel $a$, positif ou négatif :'
    methode:
      titre: Écrire $\sqrt{A^{2}}$ sans radical
      etapes:
      - Écris aussitôt $\sqrt{A^{2}} = \left|A\right|$.
      - Étudie le signe de $A$, en encadrant les radicaux qu'il contient.
      - Si $A$ est positif, supprime les barres et garde $A$.
      - Si $A$ est négatif, supprime les barres en **échangeant les deux termes** de la soustraction.
    exemple_resolu: 'Calculer $\sqrt{0{,}49}$, encadrer $\sqrt{50}$, puis écrire $\sqrt{\left(2 - \sqrt{7}\right)^{2}}$
      sans radical.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Décimal : on compte les chiffres après la virgule par paires. | $\sqrt{0{,}49} = 0{,}7$. |

      | On encadre $50$ par les deux carrés parfaits voisins, puis on passe aux racines. | $49 < 50 <
      64$, donc $7 < \sqrt{50} < 8$. |

      | $\sqrt{\left(2-\sqrt 7\right)^2} = \left|2-\sqrt 7\right|$ ; or $4 < 7 < 9$ donc $2 < \sqrt{7}
      < 3$ : le contenu est négatif, on échange les termes. | $\sqrt{\left(2 - \sqrt{7}\right)^{2}} =
      \sqrt{7} - 2$. |

      | **Vérification :** $7{,}1^{2} = 50{,}41$, déjà trop grand ; et $\sqrt{7} - 2 > 0$. ✓ | |


      [SVG: figures/m02_f1.svg]

      *Figure 2.1 : Encadrer $30$ entre deux carrés parfaits, c''est encadrer $\sqrt{30}$ entre deux entiers.*'
    erreurs_frequentes:
    - erreur: écrire $\sqrt{\left(-6\right)^{2}} = -6$.
      correction: une racine n'est jamais négative ; $\sqrt{\left(-6\right)^{2}} = 6$. L'égalité $\sqrt{a^{2}}
        = a$ n'est vraie que si $a \ge 0$.
    - erreur: confondre $\sqrt{49}$, qui vaut $7$ et rien d'autre, avec les solutions de $x^{2} = 49$,
        qui sont $7$ **et** $-7$.
      correction: $\sqrt{a}$ désigne **un** nombre, toujours positif.
    declic: null
    figures:
    - figures/m02_f1.svg
  - id: 2ndeC_M02_L2
    numero: '2.2'
    titre: Produit, quotient, simplification et sommes de radicaux
    retenir:
    - 'Pour $a \ge 0$ et $b \ge 0$ : $\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$. Pour $b > 0$ : $\sqrt{\frac{a}{b}}
      = \frac{\sqrt{a}}{\sqrt{b}}$.'
    - '**Simplifier un radical**, c''est extraire le **plus grand** facteur carré parfait : $\sqrt{18}
      = \sqrt{9 \times 2} = 3\sqrt{2}$.'
    - 'On n''additionne que des radicaux portant **le même nombre** dessous :'
    - 'En général $\sqrt{a + b} \ne \sqrt{a} + \sqrt{b}$ : $\sqrt{9 + 16} = 5$, alors que $\sqrt{9} +
      \sqrt{16} = 7$.'
    methode:
      titre: Réduire une somme de radicaux
      etapes:
      - Simplifie **chaque** radical séparément, sans regarder les autres.
      - Repère les radicaux qui portent le même nombre.
      - Additionne leurs coefficients, comme tu réduirais $5x + 4x$.
      - 'Laisse côte à côte les radicaux restés différents : la somme s''arrête là.'
    exemple_resolu: 'Trois tasseaux mesurent $\sqrt{50}$, $\sqrt{32}$ et $\sqrt{8}$ décimètres. Longueur
      totale sous la forme $a\sqrt{b}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On simplifie chaque radical, en espérant faire apparaître le même nombre dessous. | $\sqrt{50}
      = 5\sqrt{2}$ ; $\sqrt{32} = 4\sqrt{2}$ ; $\sqrt{8} = 2\sqrt{2}$. |

      | Les trois radicaux sont semblables : on réduit comme $5x + 4x + 2x$. | Total $= 11\sqrt{2}$ dm.
      |

      | **Vérification :** $\left(11\sqrt{2}\right)^{2} = 121 \times 2 = 242$, et $\sqrt{242} \approx
      15{,}6$ dm, plausible. ✓ | |'
    erreurs_frequentes:
    - erreur: écrire $\sqrt{45} = \sqrt{9 \times 5} = 9\sqrt{5}$.
      correction: 'c''est la **racine** du carré parfait qui sort : $\sqrt{45} = 3\sqrt{5}$.'
    - erreur: écrire $3\sqrt{2} + 5\sqrt{2} = 8\sqrt{4}$.
      correction: 'seuls les coefficients s''additionnent : $8\sqrt{2}$.'
    declic: null
    figures: []
  - id: 2ndeC_M02_L3
    numero: '2.3'
    titre: Expression conjuguée et dénominateur rationnel
    retenir:
    - '**Cas d''une seule racine.** On multiplie le haut et le bas par cette racine :'
    - '**Conjugué** de $a + \sqrt{b}$ : c''est $a - \sqrt{b}$, la même expression avec le signe du milieu
      changé.'
    - 'Leur produit ne contient plus de radical : $\left(a + \sqrt{b}\right)\left(a - \sqrt{b}\right)
      = a^{2} - b$.'
    - Le conjugué de $\sqrt{a} + \sqrt{b}$ est $\sqrt{a} - \sqrt{b}$, et leur produit vaut $a - b$.
    methode:
      titre: Rendre rationnel un dénominateur
      etapes:
      - 'Repère la forme du dénominateur : une seule racine, ou une somme de deux termes.'
      - Multiplie le numérateur **et** le dénominateur par $\sqrt{b}$, ou par le conjugué.
      - Développe le dénominateur avec $\left(a + \sqrt{b}\right)\left(a - \sqrt{b}\right) = a^{2} - b$,
        sans oublier son signe.
      - Simplifie la fraction obtenue.
    exemple_resolu: 'Rendre rationnel le dénominateur de $\frac{1}{\sqrt{2}}$, puis de $\frac{7}{3 + \sqrt{2}}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Une seule racine : on multiplie le haut et le bas par $\sqrt{2}$. | $\frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2}$.
      |

      | Dénominateur en deux morceaux : on multiplie par le conjugué $3 - \sqrt{2}$. | $\frac{7}{3 + \sqrt{2}}
      = \frac{7\left(3 - \sqrt{2}\right)}{3^{2} - 2}$. |

      | Le dénominateur vaut $7$ : la fraction se simplifie. | $= 3 - \sqrt{2}$. |

      | **Vérification :** $3 - \sqrt{2} \approx 1{,}6$ et $\frac{7}{4{,}4} \approx 1{,}6$. ✓ | |'
    erreurs_frequentes:
    - erreur: multiplier seulement le dénominateur par le conjugué.
      correction: la fraction change alors de valeur ; il faut multiplier le numérateur **aussi**.
    - erreur: oublier que le dénominateur obtenu peut être négatif.
      correction: pour $\frac{2}{1 + \sqrt{3}}$, le produit vaut $1 - 3 = -2$, et ce signe se reporte.
    declic: L'identité qui commande toute cette leçon — Si $\left(a + b\right)\left(a - b\right) = a^{2}
      - b^{2}$ ne te vient pas tout seul, aucune expression conjuguée ne marchera. Le blocage n'est pas
      dans les radicaux, il est dans l'identité. $\left(3 + \sqrt{2}\right)\left(3 - \sqrt{2}\right)$
      n'est rien d'autre que $3^{2} - \left(\sqrt{2}\right)^{2} = 9 - 2$.
    figures: []
  - id: 2ndeC_M02_L4
    numero: '2.4'
    titre: Comparer, encadrer, et reconnaître la famille d'un réel
    retenir:
    - 'Pour deux réels **positifs** $a$ et $b$ : $a < b$ si et seulement si $a^{2} < b^{2}$. Le carré
      d''un radical est le nombre écrit dessous.'
    - 'C''est **faux** pour des négatifs : $-5 < -2$, alors que $25 > 4$.'
    - '$\mathbb{N}$ entiers naturels ; $\mathbb{Z}$ entiers relatifs ; $\mathbb{D}$ décimaux ; $\mathbb{Q}$
      rationnels, de la forme $\frac{a}{b}$ ; $\mathbb{R}$ tous les réels. Familles emboîtées : $\mathbb{N}
      \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$.'
    - Un rationnel a une écriture décimale **finie** ou **périodique** ; un irrationnel, une écriture
      **illimitée non périodique**.
    - $\sqrt{a}$ est rationnel si $a$ est un carré parfait, **irrationnel** sinon. Ce n'est pas le symbole
      qui décide, c'est le nombre dessous. $\pi$ est irrationnel ; $3{,}14$ et $\frac{22}{7}$ sont rationnels.
    methode:
      titre: Comparer deux réels positifs contenant des radicaux
      etapes:
      - Vérifie que les deux nombres sont bien positifs.
      - 'Élève chacun au carré : le facteur est élevé au carré, le radical disparaît.'
      - Compare les deux entiers obtenus.
      - 'Conclus : le nombre dont le carré est le plus grand est le plus grand.'
    exemple_resolu: 'Comparer $7\sqrt{2}$ et $3\sqrt{11}$, puis donner la plus petite famille de $\frac{2}{3}$,
      $\sqrt{16}$, $\sqrt{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Les deux nombres sont positifs : on élève chacun au carré. | $\left(7\sqrt{2}\right)^{2} = 98$
      ; $\left(3\sqrt{11}\right)^{2} = 99$. |

      | On compare deux entiers, puis on remonte. | $98 < 99$, donc $7\sqrt{2} < 3\sqrt{11}$. |

      | Pour les familles, on regarde l''écriture décimale, et le nombre sous le radical. | $\frac{2}{3}
      = 0{,}666\ldots \in \mathbb{Q}$ ; $\sqrt{16} = 4 \in \mathbb{N}$ ; $\sqrt{2} \in \mathbb{R}$ seulement.
      |

      | **Vérification :** $7\sqrt{2} \approx 9{,}90$ et $3\sqrt{11} \approx 9{,}95$. ✓ | |


      [SVG: figures/m02_f3.svg]

      *Figure 2.2 : Les cinq familles de nombres sont emboîtées, et $\mathbb{R}$ les contient toutes.*'
    erreurs_frequentes:
    - erreur: comparer par les carrés sans regarder les signes.
      correction: la méthode ne vaut que pour des nombres **positifs**.
    - erreur: déclarer irrationnel tout nombre portant un radical.
      correction: $\sqrt{49} = 7$ est un entier ; regarde le nombre sous le radical avant de trancher.
    declic: null
    figures:
    - figures/m02_f3.svg
