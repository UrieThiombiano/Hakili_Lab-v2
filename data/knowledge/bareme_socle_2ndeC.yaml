  solution: 'A, B, C alignés lorsque AB et AC sont colinéaires : 3(m - 1) - 18 = 0, 3m = 21, m = 7. Barème
    : 1 pt pour les coordonnées AC(9 ; m - 1) et la condition de colinéarité en produit en croix ; 1 pt
    pour la résolution et m = 7. L''écriture AC = k·AB menant au même résultat est acceptée.'
  si_echoue: Condition de colinéarité de deux vecteurs par le produit en croix xy' - yx' = 0, ou alignement
    de trois points traduit par la colinéarité de deux vecteurs.
- code: G8
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: G.RON
  competence_secondaire: null
  domaine: Activites geometriques
  objet: Trouver F connaissant I(1 ; 1) milieu de [EF] et E(-3 ; 4), puis juger F sur l'axe des abscisses
  reponse_attendue: F(5 ; -2) ; ordonnée non nulle, F n'est pas sur l'axe des abscisses, Fatimata a tort
  solution: 'xF = 2xI - xE = 2 × 1 - (-3) = 5 ; yF = 2yI - yE = 2 × 1 - 4 = -2. Barème : 1 pt pour F(5
    ; -2) par usage inverse de la formule du milieu ; 1 pt pour le critère d''ordonnée nulle énoncé et
    la conclusion. Un F erroné auquel le critère est correctement appliqué garde le second point.'
  si_echoue: 'Usage inverse de la formule du milieu : les coordonnées du milieu sont connues, celles d''une
    extrémité sont cherchées. Ou caractérisation de l''axe des abscisses par une ordonnée nulle.'
- code: G9
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: G.PYT
  competence_secondaire: null
  domaine: Activites geometriques
  objet: Dire si l'angle en A est droit (AB = 9 m, AC = 12 m, BC = 14 m, Ouahigouya) et la bonne BC
  reponse_attendue: AB² + AC² = 225 ≠ 196 = BC², l'angle en A n'est pas droit ; il faudrait BC = 15 m
  solution: 'AB² + AC² = 81 + 144 = 225 et BC² = 196 : l''égalité de Pythagore n''est pas vérifiée. Barème
    : 1 pt pour les deux quantités calculées et comparées, suivies de la conclusion ; 1 pt pour BC = 15
    m. « L''angle n''est pas droit » sans les deux calculs ne prend pas le premier point.'
  si_echoue: 'Réciproque du théorème de Pythagore : comparer le carré du plus grand côté à la somme des
    carrés des deux autres, le plus grand côté étant ici [BC].'
- code: G10
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: G.THA
  competence_secondaire: null
  domaine: Activites geometriques
  objet: Calculer MN (AM = 6 cm, MB = 4 cm, BC = 15 cm, (MN)//(BC)) et juger « 2/3 de BC » (Talato)
  reponse_attendue: AB = 10 cm, MN = (3/5) × 15 = 9 cm ; les 2/3 de 15 valent 10, Talato a tort
  solution: 'AB = AM + MB = 10 cm ; Thalès : MN/BC = AM/AB = 6/10 = 3/5 ; MN = 9 cm, soit les trois cinquièmes
    de BC. Barème : 1 pt pour AB = 10 cm et le rapport AM/AB = 3/5 ; 1 pt pour MN = 9 cm et la conclusion
    appuyée sur le calcul des deux tiers de 15. « Elle a tort » sans calcul de (2/3) × 15 ni comparaison
    de rapports ne prend pas le second point.'
  si_echoue: 'Reconstitution du côté entier AB à partir de ses deux morceaux : le rapport de Thalès est
    AM/AB et non AM/MB.'
- code: G11
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: T.TRIR
  competence_secondaire: null
  domaine: Trigonometrie
  objet: Calculer l'angle d'une piste de 90 m montant de 45 m et juger la piste de 120 m (Hamidou)
  reponse_attendue: sin α = 45/90 = 0,5, α = 30° ; la piste de 120 m monte de 60 m et non 45 m, Hamidou
    a tort
  solution: 'Le dénivelé est le côté opposé, la piste l''hypoténuse : sin α = 0,5, α = 30°. 120 × sin
    30° = 60 m. Barème : 1 pt pour le sinus 0,5 et α = 30° ; 1 pt pour le dénivelé de 60 m et la conclusion.
    Accepter tout raisonnement de proportionnalité aboutissant à 60 m.'
  si_echoue: Choix de la ligne trigonométrique, ou confusion entre l'angle, qui est conservé, et le dénivelé,
    qui varie avec la longueur de la piste.
- code: F2
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: F.LIN
  competence_secondaire: null
  domaine: Fonctions et applications
  objet: Trouver l'équation de (D) passant par A(-1 ; 5) et B(3 ; -3), puis juger C(2 ; -1) sur (D)
  reponse_attendue: (D) y = -2x + 3 ; pour x = 2, y = -1, C est sur (D), Awa a raison
  solution: 'a = (-3 - 5)/(3 - (-1)) = -2 ; 5 = -2 × (-1) + b, b = 3. Barème : 1 pt pour y = -2x + 3 ;
    1 pt pour la substitution des coordonnées de C avec son calcul et la conclusion. « C appartient à
    (D) » sans calcul ne prend pas le second point. Une équation erronée sur laquelle C est correctement
    testé garde le second point.'
  si_echoue: Détermination d'une équation de droite à partir de deux points, ou vérification de l'appartenance
    d'un point à une droite par substitution.
- code: D2
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: D.STAT1
  competence_secondaire: null
  domaine: Donnees, proportionnalite, statistique
  objet: Calculer l'effectif manquant (25 membres, Manga) et juger « plus de la moitié ont au moins 4
    sacs »
  reponse_attendue: x = 7 ; « au moins 4 sacs » = 8 + 4 = 12 < 12,5, le président a tort
  solution: '6 + x + 8 + 4 = 25, x = 7. Barème : 1 pt pour x = 7 obtenu par la somme des effectifs ; 1
    pt pour le cumul 8 + 4 = 12 comparé à 12,5 et la conclusion (12/25 = 48 % vaut aussi ce point). L''élève
    qui ajoute à tort l''effectif de 3 sacs ne prend pas le second point.'
  si_echoue: Lecture d'un tableau d'effectifs, calcul d'un effectif manquant par le total, ou sens de
    « au moins », qui réunit la valeur citée et toutes les valeurs supérieures.
- code: P1.1
  partie: C
