    etoiles: 3
    enonce: 'Calcule $G$, $H$ et $K$ sous forme irréductible.

      $$G = \frac{\frac{3}{4} - \frac{1}{6}}{\frac{5}{12} + \frac{1}{3}} \qquad H = \left(\frac{2}{3}
      - \frac{5}{4}\right) \times \left(\frac{-8}{7}\right) \div \frac{4}{21} \qquad K = \frac{1 + \frac{1}{2}}{1
      - \frac{1}{2}} \times \frac{1 - \frac{1}{3}}{1 + \frac{1}{3}}$$'
    correction: '$G$ : numérateur $\frac{7}{12}$, dénominateur $\frac{9}{12}$, donc $G = \frac{7}{12}
      \times \frac{12}{9} = \frac{7}{9}$. $H$ : $\frac{2}{3} - \frac{5}{4} = -\frac{7}{12}$ ; $-\frac{7}{12}
      \times \left(-\frac{8}{7}\right) = \frac{2}{3}$ ; $\frac{2}{3} \times \frac{21}{4} = \frac{7}{2}$.
      $K$ : $\frac{3}{2} \times 2 = 3$ et $\frac{2}{3} \times \frac{3}{4} = \frac{1}{2}$, donc $K = \frac{3}{2}$.'
  - numero: 45
    etoiles: 3
    enonce: 'Issouf devait calculer $L = \frac{2}{3} + \frac{3}{4} \times \frac{8}{9}$. Voici sa copie.


      > Ligne 1 : $L = \frac{2}{3} + \frac{3 \times 8}{4 \times 9}$

      > Ligne 2 : $L = \frac{2}{3} + \frac{24}{36}$

      > Ligne 3 : $L = \frac{2 + 24}{3 + 36}$

      > Ligne 4 : $L = \frac{26}{39} = \frac{2}{3}$


      Une seule ligne casse le calcul : trouve-la. La simplification de la ligne $4$ est exacte : dis
      pourquoi cela ne sauve rien. Refais le calcul.'
    correction: 'La ligne fautive est la **ligne 3** : additionner numérateurs et dénominateurs entre
      eux n''est jamais une addition de fractions. La ligne 4 est exacte ($26$ et $39$ divisibles par
      $13$) : c''est le danger, simplifier correctement un nombre faux ne le rend pas juste. Calcul correct
      : $\frac{3}{4} \times \frac{8}{9} = \frac{2}{3}$, puis $L = \frac{2}{3} + \frac{2}{3} = \frac{4}{3}$.'
  - numero: 46
    etoiles: 3
    enonce: Avec $2$, $3$, $5$ et $7$, utilisés une seule fois chacun, on forme $\frac{a}{b}$ et $\frac{c}{d}$,
      puis on calcule leur produit. a) Le plus grand produit possible ? b) Le plus petit ? c) Combien
      de produits différents en tout ? Justifie sans tous les écrire.
    correction: 'On cherche d''abord de quoi le produit dépend : $\frac{a}{b} \times \frac{c}{d} = \frac{ac}{bd}$,
      donc seul compte le choix des deux nombres placés en haut. Six choix de deux nombres parmi quatre
      : $\frac{6}{35}$, $\frac{10}{21}$, $\frac{14}{15}$, $\frac{15}{14}$, $\frac{21}{10}$, $\frac{35}{6}$.
      a) $\frac{35}{6}$ ; b) $\frac{6}{35}$ ; c) **six** produits, formant trois couples de nombres inverses.'
  - numero: 47
    etoiles: 3
    enonce: Un producteur de sésame de Léo vend les $\frac{2}{5}$ de sa récolte au marché, puis les $\frac{3}{8}$
      de ce qui reste à un collecteur. Il met $60$ kg de côté pour les semences, et il lui reste encore
      $90$ kg. Quelle était la récolte ? Vérifie en refaisant l'histoire dans le sens direct.
    correction: 'Aucune quantité connue ne porte sur la récolte entière : on part de la fin. Après les
      deux ventes il reste $60 + 90 = 150$ kg, soit les $\frac{5}{8}$ du premier reste : premier reste
      $= 150 \times \frac{8}{5} = 240$ kg, soit les $\frac{3}{5}$ de la récolte. Récolte $= 240 \times
      \frac{5}{3} = 400$ kg. Vérification : $160$ vendus, reste $240$ ; $90$ vendus, reste $150$ ; $-60$,
      il reste $90$ ✓.'
  fiche_revision:
  - '**Règle fondamentale.** $\frac{a}{b} = \frac{a \times k}{b \times k} = \frac{a \div k}{b \div k}$
    ($k \ne 0$).'
  - '**Simplifier.** Diviser haut et bas par les diviseurs communs ($2$, $3$, $5$, $9$, $10$) jusqu''à
    l''irréductible.'
  - '**Additionner, soustraire, comparer.** Même dénominateur d''abord, puis les numérateurs.'
  - '**Multiplier.** Haut avec haut, bas avec bas ; simplifier **avant** de calculer.'
  - '**Diviser.** Multiplier par l''inverse : $\frac{a}{b} \div \frac{c}{d} = \frac{a}{b} \times \frac{d}{c}$.'
  - '**Signes.** $\frac{-a}{b} = \frac{a}{-b} = -\frac{a}{b}$ ; signe déterminé avant tout calcul.'
  - '**Familles.** $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$
    ; $\frac{1}{3} \in \mathbb{Q}$ mais $\notin \mathbb{D}$.'
  trouve_erreur:
  - faux: $\frac{2}{3} + \frac{1}{4} = \frac{3}{7}$
    correction: 'Dénominateur commun $12$ : $\frac{8}{12} + \frac{3}{12} = \frac{11}{12}$.'
  - faux: $\frac{45}{60} = \frac{40}{55}$
    correction: 'On simplifie en **divisant**, pas en soustrayant : $\frac{3}{4}$.'
  - faux: $\frac{3}{4} \div \frac{9}{8} = \frac{27}{32}$
    correction: 'On multiplie par l''inverse : $\frac{3}{4} \times \frac{8}{9} = \frac{2}{3}$.'
  - faux: $\frac{4}{9} > \frac{4}{7}$ « car $9 > 7$ »
    correction: 'Même numérateur : plus le dénominateur est grand, plus la fraction est petite : $\frac{4}{9}
      < \frac{4}{7}$.'
  - faux: $\frac{9 + 4}{9} = 4$
    correction: 'On barre des **facteurs**, pas des termes d''une somme : $\frac{13}{9}$.'
  cartographie_lacunes:
  - lacune: Addition de fractions sans dénominateur commun, simplification oubliée, division par une fraction
    bloque_en: ch. 1, 4, 5, 8, 11, 14, 17
  source_path: remediation\3eme\modules_c\M03.md
- niveau: 3eme
  module: 4
  module_titre: Puissances et écriture scientifique
  pourquoi: Les puissances servent en 3ème pour les racines carrées, le calcul littéral et la physique-chimie.
    Trois règles suffisent, à condition de ne jamais les confondre.
  diagnostic:
  - question: 'Calcule : $2^{5}$ ; $\left(-3\right)^{2}$ ; $\left(-2\right)^{3}$.'
    reponse: $32$ ; $9$ ; $-8$
  - question: 'Calcule : $7^{0}$ ; $4^{-1}$ ; $2^{-3}$.'
    reponse: $1$ ; $\frac{1}{4}$ ; $\frac{1}{8}$
  - question: 'Écris sous la forme d''une seule puissance : $5^{3} \times 5^{4}$ ; $\frac{7^{9}}{7^{6}}$.'
    reponse: $5^{7}$ ; $7^{3}$
  - question: 'Écris sous la forme d''une seule puissance : $\left(2^{3}\right)^{4}$.'
    reponse: $2^{12}$
  - question: Donne l'écriture scientifique de $45\,000$ et de $0{,}0032$.
    reponse: $4{,}5 \times 10^{4}$ ; $3{,}2 \times 10^{-3}$
  lecons:
  - id: 3eme_M04_L1
    numero: '4.1'
    titre: 'Puissances : définition et signe'
    retenir:
    - 'Pour $n \ge 1$ : $a^{n} = \underbrace{a \times a \times \dots \times a}_{n \text{ facteurs}}$.
      La base $a$ est le facteur répété, l''exposant $n$ compte les facteurs ; il n''est jamais un facteur.'
    - 'Conventions ($a \ne 0$) : $a^{1} = a$ ; $a^{0} = 1$.'
    - 'Exposant négatif = **inverse**, jamais opposé : $$a^{-n} = \frac{1}{a^{n}} \qquad 2^{-3} = \frac{1}{8}$$'
    - 'Signe de $\left(-a\right)^{n}$ : **positif si $n$ est pair**, **négatif si $n$ est impair**. $\left(-2\right)^{4}
      = 16$ ; $\left(-2\right)^{3} = -8$.'
    - 'À savoir dans les deux sens : $2$ ; $4$ ; $8$ ; $16$ ; $32$ ; $64$ ; $128$ ; $256$ ; $512$ ; $1\,024$
      — $3$ ; $9$ ; $27$ ; $81$ ; $243$ — $5$ ; $25$ ; $125$ ; $625$.'
    methode: null
    exemple_resolu: 'Calcule $4^{3}$ ; $\left(-3\right)^{4}$ ; $5^{-2}$ ; $\left(\frac{3}{4}\right)^{-1}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Exposant $3$ : trois facteurs. | $4^{3} = 4 \times 4 \times 4 = 64$ |

      | Base négative, exposant pair : positif. | $\left(-3\right)^{4} = 3^{4} = 81$ |

      | Exposant négatif : on calcule, puis on renverse. | $5^{-2} = \frac{1}{5^{2}} = \frac{1}{25}$ ;
      $\left(\frac{3}{4}\right)^{-1} = \frac{4}{3}$ |

      | **Vérification :** $\frac{1}{25} = 0{,}04$, positif malgré l''exposant négatif. ✓ | |'
    erreurs_frequentes:
    - erreur: lire $a^{n}$ comme $a \times n$, donc $2^{5} = 10$.
      correction: 'la puissance répète un facteur : $2^{5} = 32$.'
    - erreur: confondre $-3^{2}$ et $\left(-3\right)^{2}$.
      correction: 'sans parenthèses, l''exposant ne porte que sur le $3$ : $-3^{2} = -9$, contre $\left(-3\right)^{2}
        = +9$.'
    declic: null
    figures:
    - figures/m04_f2.svg
  - id: 3eme_M04_L2
    numero: '4.2'
    titre: Les trois règles de calcul
    retenir:
    - '**Produit, même base** : $a^{m} \times a^{n} = a^{m+n}$ — on **ajoute** ($3^{5} \times 3^{4} =
      3^{9}$).'
    - '**Quotient, même base** : $\frac{a^{m}}{a^{n}} = a^{m-n}$ — on **soustrait** ($\frac{7^{9}}{7^{6}}
      = 7^{3}$).'
    - '**Puissance de puissance** : $\left(a^{m}\right)^{n} = a^{m \times n}$ — on **multiplie** ($\left(5^{2}\right)^{3}
      = 5^{6}$).'
    - 'Distribution sur un produit ou un quotient : $\left(ab\right)^{n} = a^{n}b^{n}$ ; $\left(\frac{a}{b}\right)^{n}
      = \frac{a^{n}}{b^{n}}$. **Jamais sur une somme.**'
    - 'Bases différentes : on décompose. $4 = 2^{2}$ ; $8 = 2^{3}$ ; $16 = 2^{4}$ ; $9 = 3^{2}$ ; $27
      = 3^{3}$ ; $6 = 2 \times 3$ ; $12 = 2^{2} \times 3$ ; $10 = 2 \times 5$ ; $15 = 3 \times 5$.'
    - 'Comparer sans calculer : ramener à un **exposant commun**. $2^{12} = 8^{4}$, $3^{8} = 9^{4}$, donc
      $2^{12} < 3^{8}$.'
    methode:
      titre: Réduire une expression avec puissances
      etapes:
      - Décompose les bases qui diffèrent, puis regroupe par base ($x$ seul vaut $x^{1}$).
      - 'Applique : produit $\to$ on ajoute ; quotient $\to$ on soustrait ; puissance de puissance $\to$
        on multiplie.'
      - 'Écris la ligne des exposants ($3^{5+4-6}$) avant le résultat : c''est là qu''on se relit.'
      - Termine par le signe si la base est négative.
    exemple_resolu: 'Simplifie $E = \frac{6^{4}}{2^{3} \times 3^{2}}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Bases différentes : on décompose $6$ et on distribue l''exposant. | $6^{4} = \left(2 \times 3\right)^{4}
      = 2^{4} \times 3^{4}$ |

      | Une base à la fois : les $2$ ensemble, les $3$ ensemble. | $E = 2^{4-3} \times 3^{4-2}$ |

      | On termine les deux soustractions. | $E = 2 \times 9 = 18$ |

      | **Vérification :** $\frac{1\,296}{8 \times 9} = \frac{1\,296}{72} = 18$. ✓ | |'
    erreurs_frequentes:
    - erreur: appliquer les règles à une somme, $2^{3} + 2^{4} = 2^{7}$.
      correction: les règles ne valent que pour produits et quotients ; ici $8 + 16 = 24$.
    - erreur: perdre le coefficient, $\left(4b^{2}\right)^{3} = 4b^{6}$.
      correction: 'l''exposant porte sur tout : $4^{3} \times b^{6} = 64b^{6}$.'
    declic: null
    figures:
    - figures/m04_f3.svg
  - id: 3eme_M04_L3
    numero: '4.3'
    titre: Puissances de 10 et écriture scientifique
    retenir:
    - $10^{n} = 1$ suivi de $n$ zéros ; $10^{-n} = 0{,}0\dots01$ ($n-1$ zéros). $10^{4} = 10\,000$ ; $10^{-3}
      = 0{,}001$.
    - '**Écriture scientifique** : $$a \times 10^{n} \qquad 1 \le a < 10, \; n \text{ entier relatif}$$
      $45\,000 = 4{,}5 \times 10^{4}$ ; $0{,}0032 = 3{,}2 \times 10^{-3}$.'
    - 'Comparer : c''est l''**exposant qui commande** ($8{,}4 \times 10^{2} < 6{,}05 \times 10^{3}$) ;
      on départage par $a$ seulement à exposants égaux.'
    - 'Changer d''unité, c''est multiplier par une puissance de $10$ : $1$ km $= 10^{3}$ m ; $1$ m $=
      10^{2}$ cm $= 10^{3}$ mm ; $1$ kg $= 10^{3}$ g ; $1$ L $= 10^{3}$ mL.'
    methode:
      titre: Écrire un nombre en écriture scientifique
      etapes:
      - 'Place la virgule juste après le premier chiffre non nul : c''est $a$.'
      - 'Compte les rangs franchis : c''est $n$. Nombre $\ge 10$ $\to$ exposant positif ; nombre $< 1$
        $\to$ exposant négatif.'
      - 'Après un calcul : nombres ensemble, puissances de $10$ ensemble, puis on recale. Si $a \ge 10$,
        virgule à gauche et exposant **augmenté** ($28 \times 10^{3} = 2{,}8 \times 10^{4}$) ; si $a <
        1$, virgule à droite et exposant **diminué** ($0{,}5 \times 10^{-5} = 5 \times 10^{-6}$).'
      - 'Contrôle : exactement un chiffre non nul avant la virgule.'
    exemple_resolu: 'Donne l''écriture scientifique de $0{,}00047$, de $602\,000$, puis de $\frac{4{,}2
      \times 10^{7}}{2{,}5 \times 10^{2}}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Premier chiffre non nul : $4$ ; virgule franchit $4$ rangs ; nombre petit. | $0{,}00047 = 4{,}7
      \times 10^{-4}$ |

      | Virgule après le $6$, déplacée de $5$ rangs ; nombre grand. | $602\,000 = 6{,}02 \times 10^{5}$
      |

      | Les nombres entre eux, les puissances de $10$ entre elles. | $\frac{4{,}2}{2{,}5} \times 10^{7-2}
      = 1{,}68 \times 10^{5}$ |

      | **Vérification :** $4{,}7 \times 10^{-4} = 4{,}7 \div 10\,000 = 0{,}00047$. ✓ | |'
    erreurs_frequentes:
    - erreur: appeler $45 \times 10^{3}$ une écriture scientifique.
      correction: il faut $1 \le a < 10$, donc $4{,}5 \times 10^{4}$.
    - erreur: lire un exposant négatif comme un nombre négatif.
      correction: $3{,}2 \times 10^{-3} = 0{,}0032 > 0$. Quand la virgule bouge, l'exposant bouge **en
        sens inverse**.
    declic: 'ce que l''écriture scientifique t''ouvre — Lumière : $3 \times 10^{8}$ m/s. Terre-Soleil
      : $1{,}5 \times 10^{11}$ m. Durée du trajet : $\frac{1{,}5 \times 10^{11}}{3 \times 10^{8}} = 0{,}5
      \times 10^{3} = 500$ s, soit $8$ minutes. Un quotient, trois lignes, aucune division interminable
      : sépare la taille d''un nombre de ses chiffres.'
    figures:
    - figures/m04_f4.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Calcule : a) $3^{4}$ ; b) $10^{5}$ ; c) $\left(-5\right)^{2}$ ; d) $\left(-1\right)^{7}$
      ; e) $0{,}5^{2}$.'
    correction: a) $81$ ; b) $100\,000$ ; c) $+25$ ; d) $-1$ ; e) $0{,}25$.
  - numero: 2
    etoiles: 1
    enonce: 'Calcule : a) $6^{0}$ ; b) $9^{1}$ ; c) $5^{-2}$ ; d) $10^{-3}$ ; e) $\left(\frac{2}{3}\right)^{-1}$.'
    correction: a) $1$ ; b) $9$ ; c) $\frac{1}{25}$ ; d) $0{,}001$ ; e) $\frac{3}{2}$.
  - numero: 3
    etoiles: 1
    enonce: 'Sans calculer, donne le signe de : a) $\left(-7\right)^{8}$ ; b) $\left(-7\right)^{9}$ ;
      c) $-7^{8}$.'
    correction: 'a) positif (exposant pair) ; b) négatif (impair) ; c) négatif : $-7^{8} = -\left(7^{8}\right)$.'
  - numero: 4
    etoiles: 1
    enonce: 'Écris sous la forme d''une seule puissance : a) $7^{2} \times 7^{5}$ ; b) $\frac{9^{8}}{9^{3}}$
      ; c) $\left(4^{3}\right)^{5}$ ; d) $x^{6} \times x$ ; e) $\frac{a^{4}}{a^{7}}$.'
    correction: a) $7^{7}$ ; b) $9^{5}$ ; c) $4^{15}$ ; d) $x^{7}$ ; e) $a^{-3}$.
  - numero: 5
    etoiles: 1
    enonce: 'Écris plus simplement : a) $\left(2x\right)^{3}$ ; b) $\left(\frac{3}{5}\right)^{2}$ ; c)
      $\left(3a^{2}\right)^{3}$.'
    correction: a) $8x^{3}$ ; b) $\frac{9}{25}$ ; c) $27a^{6}$.
  - numero: 6
    etoiles: 1
    enonce: 'Vrai ou faux ? Corrige si nécessaire : a) $2^{3} \times 2^{4} = 2^{12}$ ; b) $\left(2^{3}\right)^{4}
      = 2^{12}$ ; c) $2^{3} + 2^{4} = 2^{7}$ ; d) $\frac{5^{6}}{5^{2}} = 5^{3}$.'
    correction: a) Faux, $2^{7}$ ; b) vrai ; c) faux, $8 + 16 = 24$ (pas de règle pour la somme) ; d)
      faux, $5^{4}$.
  - numero: 7
    etoiles: 1
    enonce: 'Donne l''écriture scientifique de : a) $5\,600$ ; b) $12\,300\,000$ ; c) $0{,}081$ ; d) $0{,}0000009$.'
    correction: a) $5{,}6 \times 10^{3}$ ; b) $1{,}23 \times 10^{7}$ ; c) $8{,}1 \times 10^{-2}$ ; d)
      $9 \times 10^{-7}$.
  - numero: 8
    etoiles: 1
    enonce: 'Calcule, résultat en écriture scientifique : a) $\left(2 \times 10^{3}\right) \times \left(3
      \times 10^{5}\right)$ ; b) $\frac{8 \times 10^{7}}{4 \times 10^{2}}$ ; c) $\left(5 \times 10^{4}\right)
      \times \left(6 \times 10^{-9}\right)$.'
    correction: a) $6 \times 10^{8}$ ; b) $2 \times 10^{5}$ ; c) $30 \times 10^{-5} = 3 \times 10^{-4}$.
  - numero: 9
    etoiles: 1
    enonce: 'Calcule : a) $2^{6}$ ; b) $5^{3}$ ; c) $1^{20}$ ; d) $0{,}1^{3}$ ; e) $\left(\frac{3}{4}\right)^{2}$.'
    correction: a) $64$ ; b) $125$ ; c) $1$ ; d) $0{,}001$ ; e) $\frac{9}{16}$.
  - numero: 10
    etoiles: 1
    enonce: 'Calcule : a) $8^{0}$ ; b) $3^{-2}$ ; c) $10^{-4}$ ; d) $\left(-2\right)^{-3}$.'
    correction: a) $1$ ; b) $\frac{1}{9}$ ; c) $0{,}0001$ ; d) $-\frac{1}{8}$.
  - numero: 11
    etoiles: 1
    enonce: 'Calcule : a) $\left(-6\right)^{2}$ ; b) $-6^{2}$ ; c) $\left(-1\right)^{15}$ ; d) $\left(-10\right)^{4}$.'
    correction: a) $+36$ ; b) $-36$ ; c) $-1$ ; d) $+10\,000$.
  - numero: 12
    etoiles: 1
    enonce: 'Écris sous forme d''une puissance de $2$ : $8$ ; $64$ ; $\frac{1}{16}$ ; $1$.'
    correction: $2^{3}$ ; $2^{6}$ ; $2^{-4}$ ; $2^{0}$.
  - numero: 13
    etoiles: 1
    enonce: 'Écris sous la forme d''une seule puissance : a) $3^{7} \times 3^{2}$ ; b) $10^{4} \times
      10^{-6}$ ; c) $\frac{5^{9}}{5^{4}}$ ; d) $\frac{2^{3}}{2^{8}}$ ; e) $\left(7^{5}\right)^{2}$.'
    correction: a) $3^{9}$ ; b) $10^{-2}$ ; c) $5^{5}$ ; d) $2^{-5}$ ; e) $7^{10}$.
  - numero: 14
    etoiles: 1
    enonce: 'Écris sous la forme $a^{n}$ : a) $x^{3} \times x^{4} \times x$ ; b) $\frac{y^{10}}{y^{2}
      \times y^{3}}$ ; c) $\left(\left(t^{2}\right)^{3}\right)^{2}$.'
    correction: a) $x^{8}$ ; b) $y^{5}$ ; c) $t^{12}$.
  - numero: 15
    etoiles: 1
    enonce: 'Écris plus simplement : a) $\left(5a\right)^{2}$ ; b) $\left(2x^{3}\right)^{4}$ ; c) $\left(\frac{a}{3}\right)^{3}$
      ; d) $\left(-3b\right)^{2}$.'
    correction: a) $25a^{2}$ ; b) $16x^{12}$ ; c) $\frac{a^{3}}{27}$ ; d) $9b^{2}$.
  - numero: 16
    etoiles: 1
    enonce: 'Écris sous la forme $2^{a} \times 3^{b}$ : a) $12$ ; b) $72$ ; c) $\frac{48}{27}$.'
    correction: a) $2^{2} \times 3$ ; b) $2^{3} \times 3^{2}$ ; c) $2^{4} \times 3^{-2}$.
  - numero: 17
    etoiles: 1
    enonce: 'Écris sous forme décimale : a) $10^{6}$ ; b) $10^{-2}$ ; c) $3{,}5 \times 10^{3}$ ; d) $7{,}02
      \times 10^{-4}$.'
    correction: a) $1\,000\,000$ ; b) $0{,}01$ ; c) $3\,500$ ; d) $0{,}000702$.
  - numero: 18
    etoiles: 1
    enonce: 'Donne l''écriture scientifique de : a) $784$ ; b) $96\,500\,000$ ; c) $0{,}00058$ ; d) $0{,}3$
      ; e) $10$.


      ### Entraînement ★★'
    correction: a) $7{,}84 \times 10^{2}$ ; b) $9{,}65 \times 10^{7}$ ; c) $5{,}8 \times 10^{-4}$ ; d)
      $3 \times 10^{-1}$ ; e) $1 \times 10^{1}$.
  - numero: 19
    etoiles: 2
    enonce: 'Vrai ou faux ? Justifie par un calcul : a) $10^{3} + 10^{3} = 10^{6}$ ; b) $10^{3} \times
      10^{3} = 10^{6}$ ; c) $\left(-5\right)^{2} \times \left(-5\right)^{3} = \left(-5\right)^{5}$ et
      ce nombre est négatif.'
    correction: 'a) Faux : $2\,000 \ne 10^{6}$ ; b) vrai : $10^{6}$ ; c) vrai : $\left(-5\right)^{5}$,
      exposant impair, donc négatif.'
  - numero: 20
    etoiles: 2
    enonce: La distance Terre-Soleil vaut environ $150\,000\,000$ km ; la taille d'une bactérie environ
      $0{,}000002$ m. Écris ces deux mesures en écriture scientifique.
    correction: $1{,}5 \times 10^{8}$ km ; $2 \times 10^{-6}$ m.
  - numero: 21
    etoiles: 2
    enonce: 'Calcule, résultat en écriture scientifique : a) $\left(4 \times 10^{6}\right) \times \left(2
      \times 10^{3}\right)$ ; b) $\frac{9 \times 10^{5}}{3 \times 10^{-2}}$ ; c) $\left(3 \times 10^{-4}\right)^{2}$.'
    correction: a) $8 \times 10^{9}$ ; b) $3 \times 10^{7}$ ; c) $9 \times 10^{-8}$.
  - numero: 22
    etoiles: 2
    enonce: 'Range dans l''ordre croissant : $2{,}1 \times 10^{4}$ ; $9{,}8 \times 10^{3}$ ; $1{,}05 \times
      10^{5}$ ; $2{,}09 \times 10^{4}$.'
    correction: $9{,}8 \times 10^{3} < 2{,}09 \times 10^{4} < 2{,}1 \times 10^{4} < 1{,}05 \times 10^{5}$
      (exposants d'abord).
  - numero: 23
    etoiles: 2
    enonce: Un grain de mil pèse environ $6 \times 10^{-3}$ g. a) Combien pèsent, en grammes, un million
      de grains ? (Écriture scientifique.) b) Convertis en kilogrammes.
    correction: a) $10^{6} \times 6 \times 10^{-3} = 6 \times 10^{3}$ g ; b) $6$ kg.
  - numero: 24
    etoiles: 2
    enonce: Une feuille de papier a une épaisseur de $10^{-4}$ m. On la plie en deux $10$ fois de suite
      (l'épaisseur double à chaque pliage). a) Exprime l'épaisseur finale sous la forme $2^{10} \times
      10^{-4}$ m. b) Calcule-la en centimètres.
    correction: a) $2^{10} \times 10^{-4}$ m ; b) $1\,024 \times 10^{-4}$ m $= 0{,}1024$ m $\approx 10{,}2$
      cm.
  - numero: 25
    etoiles: 2
    enonce: 'Compare $2^{30}$ et $3^{20}$ (indication : écris chacun comme une puissance d''exposant $10$).


      #### Entraînement intensif : puissances en chaîne'
    correction: $2^{30} = 8^{10}$ et $3^{20} = 9^{10}$ ; comme $8 < 9$, $2^{30} < 3^{20}$.
  - numero: 26
    etoiles: 2
    enonce: 'Écris sous la forme d''une seule puissance : a) $\frac{5^{7} \times 5^{-3}}{5^{2}}$ ; b)
      $\frac{\left(2^{3}\right)^{4}}{2^{5} \times 2^{3}}$ ; c) $\frac{7^{4} \times 7^{6}}{\left(7^{2}\right)^{5}}$
      ; d) $\frac{3^{-2} \times 3^{8}}{3^{4}}$.'
    correction: a) $5^{2}$ ; b) $\frac{2^{12}}{2^{8}} = 2^{4}$ ; c) $7^{10-10} = 7^{0} = 1$ ; d) $3^{2}$.
  - numero: 27
    etoiles: 2
    enonce: 'Calcule la valeur numérique : a) $\frac{2^{5} \times 2^{-2}}{2^{2}}$ ; b) $\left(-2\right)^{3}
      \times \left(-2\right)^{2}$ ; c) $\frac{10^{3} \times 10^{-5}}{10^{-4}}$ ; d) $\frac{\left(-3\right)^{4}}{-3^{2}}$
      (attention aux deux écritures !).'
    correction: a) $2^{1} = 2$ ; b) $\left(-2\right)^{5} = -32$ ; c) $10^{2} = 100$ ; d) $81 \div \left(-9\right)
      = -9$.
  - numero: 28
    etoiles: 2
    enonce: 'Simplifie en décomposant les bases en facteurs premiers : a) $\frac{4^{3} \times 9^{2}}{6^{4}}$
      ; b) $\frac{15^{3}}{5^{3} \times 3^{2}}$ ; c) $\frac{8^{2} \times 5^{4}}{10^{4}}$.'
    correction: a) $\frac{2^{6} \times 3^{4}}{2^{4} \times 3^{4}} = 4$ ; b) $\frac{3^{3} \times 5^{3}}{5^{3}
      \times 3^{2}} = 3$ ; c) $\frac{2^{6} \times 5^{4}}{2^{4} \times 5^{4}} = 4$.
  - numero: 29
    etoiles: 2
    enonce: 'Calcule, résultat en écriture scientifique : a) $\frac{\left(3 \times 10^{4}\right) \times
      \left(8 \times 10^{-7}\right)}{6 \times 10^{-5}}$ ; b) $\frac{\left(2 \times 10^{-3}\right)^{2}
      \times 5 \times 10^{8}}{4 \times 10^{-2}}$.'
    correction: 'a) $\frac{3 \times 8}{6} = 4$ et $10^{4-7+5} = 10^{2}$ : $4 \times 10^{2}$ ; b) numérateur
      $4 \times 10^{-6} \times 5 \times 10^{8} = 2 \times 10^{3}$, puis $\frac{2 \times 10^{3}}{4 \times
      10^{-2}} = 0{,}5 \times 10^{5} = 5 \times 10^{4}$.'
  - numero: 30
    etoiles: 2
    enonce: 'a) Compare $2^{100}$ et $4^{49}$ (écris $4^{49}$ comme une puissance de $2$). b) Simplifie
      $\frac{6^{10}}{2^{10} \times 3^{9}}$.


      ### ★★★ Défis de maîtrise'
    correction: a) $4^{49} = 2^{98} < 2^{100}$ ; b) $6^{10} = 2^{10} \times 3^{10}$, donc le quotient
      vaut $3$.
  - numero: 31
    etoiles: 3
    enonce: a) Calcule $2^{n+3} - 2^{n+1}$ pour $n = 0$, $n = 3$ et $n = 5$. b) Compare chaque fois ton
      résultat à $6 \times 2^{n}$. c) Montre que $2^{n+3} - 2^{n+1} = 6 \times 2^{n}$ pour tout entier
      naturel $n$, en mettant $2^{n}$ en facteur.
    correction: 'a) $6$ ; $48$ ; $192$. b) $6 \times 2^{0} = 6$ ; $6 \times 2^{3} = 48$ ; $6 \times 2^{5}
      = 192$ : identiques. c) On met en facteur ce que les deux termes ont en commun. Par la règle du
      produit, $2^{n+3} = 8 \times 2^{n}$ et $2^{n+1} = 2 \times 2^{n}$, donc la différence vaut $\left(8-2\right)
      \times 2^{n} = 6 \times 2^{n}$, pour tout $n$.'
  - numero: 32
    etoiles: 3
    enonce: 'Calcule $M$, $N$ et $P$ en n''utilisant que les règles sur les puissances. Donne $N$ en écriture
      scientifique.

      $$M = \frac{\left(-2\right)^{5} \times \left(3^{2}\right)^{2}}{\left(-2\right)^{3} \times 3^{3}}
      \qquad N = \frac{10^{-3} \times \left(2 \times 10^{5}\right)^{2}}{5 \times 10^{4}} \qquad P = \frac{\left(\frac{3}{5}\right)^{3}
      \times 5^{4}}{3^{2}}$$'
    correction: 'On regroupe par base avant tout calcul. $M$ : $\frac{\left(-2\right)^{5}}{\left(-2\right)^{3}}
      = 4$ et $\frac{3^{4}}{3^{3}} = 3$, donc $M = 12$. $N$ : $\left(2 \times 10^{5}\right)^{2} = 4 \times
      10^{10}$, puis $4 \times 10^{7}$, puis $\frac{4}{5} \times 10^{3} = 0{,}8 \times 10^{3} = 8 \times
      10^{2}$. $P$ : $\frac{3^{3} \times 5^{4}}{5^{3} \times 3^{2}} = 3 \times 5 = 15$.'
  - numero: 33
    etoiles: 3
    enonce: 'Rakieta devait écrire $Q = \frac{\left(3 \times 10^{4}\right)^{2} \times 5 \times 10^{-6}}{2
      \times 10^{-3}}$ en écriture scientifique. Voici sa copie.


      > Ligne 1 : $Q = \frac{3 \times 10^{8} \times 5 \times 10^{-6}}{2 \times 10^{-3}}$

      > Ligne 2 : $Q = \frac{15 \times 10^{2}}{2 \times 10^{-3}}$

      > Ligne 3 : $Q = 7{,}5 \times 10^{-1}$

      > Ligne 4 : $Q = 0{,}75$, et c''est l''écriture scientifique.


      Trois erreurs se cachent dans cette copie. Trouve-les, nomme la règle trahie à chaque fois, puis
      donne la vraie écriture scientifique de $Q$.'
    correction: 'Ligne 1 : l''exposant se distribue sur les **deux** facteurs, $\left(3 \times 10^{4}\right)^{2}
      = 9 \times 10^{8}$. Ligne 3 : quotient de puissances de $10$, on soustrait : $2 - \left(-3\right)
      = 5$, donc $10^{5}$. Ligne 4 : $0{,}75$ n''est pas de la forme $a \times 10^{n}$ avec $1 \le a <
      10$. Calcul correct : numérateur $9 \times 10^{8} \times 5 \times 10^{-6} = 4{,}5 \times 10^{3}$,
      puis $\frac{4{,}5}{2} = 2{,}25$ et $10^{6}$ : $Q = 2{,}25 \times 10^{6}$.'
  - numero: 34
    etoiles: 3
    enonce: 'a) Combien de chiffres compte $2^{10} \times 5^{12}$ écrit entièrement ? b) Par combien de
      zéros se termine $2^{15} \times 5^{9}$ ? c) Parmi $2^{40}$, $4^{20}$ et $8^{13}$, deux nombres sont
      égaux : lesquels ? Lequel est le plus petit ? Réponds sans écrire aucun de ces nombres en entier.'
    correction: 'On fait apparaître des puissances de $10$, seules à compter chiffres et zéros. a) $2^{10}
      \times 5^{12} = 10^{10} \times 25 = 25 \times 10^{10}$ : $12$ chiffres. b) $2^{15} \times 5^{9}
      = 64 \times 10^{9}$ : **neuf** zéros. c) $4^{20} = 2^{40}$ (égaux) et $8^{13} = 2^{39}$, le plus
      petit.'
  - numero: 35
    etoiles: 3
    enonce: Une feuille de papier a une épaisseur de $0{,}1$ mm. On la plie en deux, puis on plie encore
      en deux l'ensemble obtenu, et ainsi de suite ; on admet que le pliage reste possible. a) Quelle
      épaisseur la pile atteint-elle après $20$ pliages ? Donne le résultat en mètres, en écriture scientifique.
      b) Compare cette épaisseur à la hauteur du mont Ténakourou, point culminant du Burkina Faso ($749$
      m). c) À partir de combien de pliages la pile dépasse-t-elle cette hauteur ?
    correction: 'a) L''épaisseur double à chaque pliage : $0{,}1 \times 2^{20} = 104\,857{,}6$ mm $\approx
      1{,}05 \times 10^{2}$ m. b) $105$ m $\ll 749$ m : moins du septième du Ténakourou. c) Il faut $0{,}1
      \times 2^{n} > 749\,000$, soit $2^{n} > 7\,490\,000$ ; $2^{22} \approx 419$ m et $2^{23} \approx
      839$ m : **à partir de $23$ pliages**.'
  - numero: 36
    etoiles: 3
    enonce: a) $A = 9 \times 10^{3}$ divisé par un nombre $B$ en écriture scientifique donne $3{,}6 \times
      10^{-2}$. Retrouve $B$. b) Le produit de deux nombres écrits en écriture scientifique vaut $2{,}5
      \times 10^{6}$. Leurs deux parties décimales valent $5$ et leurs exposants sont deux entiers consécutifs.
      Retrouve ces deux nombres.
    correction: 'a) On remonte la division : $B = \frac{9 \times 10^{3}}{3{,}6 \times 10^{-2}} = 2{,}5
      \times 10^{5}$. b) Les nombres s''écrivent $5 \times 10^{p}$ et $5 \times 10^{q}$ ; leur produit
      vaut $25 \times 10^{p+q} = 2{,}5 \times 10^{p+q+1}$, d''où $p + q = 5$ avec $p$, $q$ consécutifs
      : $2$ et $3$. Les nombres sont $500$ et $5\,000$.'
  fiche_revision:
  - '**Définition.** $a^{n} = a \times a \times \dots \times a$ ($n$ facteurs) ; $a^{0} = 1$ ; $a^{-n}
    = \frac{1}{a^{n}}$ ($a \ne 0$).'
  - '**Signe.** Base négative : exposant pair $\to$ positif ; impair $\to$ négatif. $-3^{2} = -9 \ne \left(-3\right)^{2}
    = 9$.'
  - '**Trois règles.** $a^{m} \times a^{n} = a^{m+n}$ ; $\frac{a^{m}}{a^{n}} = a^{m-n}$ ; $\left(a^{m}\right)^{n}
    = a^{mn}$.'
  - '**Distribution.** $\left(ab\right)^{n} = a^{n}b^{n}$ ; $\left(\frac{a}{b}\right)^{n} = \frac{a^{n}}{b^{n}}$
    ; jamais sur une somme.'
  - '**Bases différentes.** On décompose en facteurs premiers, puis une base à la fois.'
  - '**Puissances de 10.** $10^{n}$ : $n$ zéros ; $10^{-n}$ : nombre petit positif.'
  - '**Écriture scientifique.** $a \times 10^{n}$ avec $1 \le a < 10$ ; l''exposant commande la comparaison.'
  trouve_erreur:
  - faux: $2^{5} = 10$
    correction: $2^{5} = 2 \times 2 \times 2 \times 2 \times 2 = 32$.
  - faux: $2^{3} \times 2^{4} = 2^{12}$
    correction: 'Produit de même base : on **ajoute**, $2^{7}$. On multiplie pour $\left(2^{3}\right)^{4}
      = 2^{12}$.'
  - faux: $5^{-2} = -25$
    correction: 'Exposant négatif = inverse : $5^{-2} = \frac{1}{25}$, positif.'
  - faux: $45 \times 10^{3}$ est une écriture scientifique
    correction: 'Il faut $1 \le a < 10$ : c''est $4{,}5 \times 10^{4}$.'
  cartographie_lacunes:
  - lacune: Confusion aⁿ et a×n, règles des exposants, écriture scientifique
    bloque_en: ch. 2 (PC), 4, 9
  source_path: remediation\3eme\modules_c\M04.md
- niveau: 3eme
  module: 5
  module_titre: 'Calcul littéral : réduire, développer, factoriser'
  pourquoi: Presque chaque chapitre d'algèbre de 3ème commence par « développe » ou « factorise ». Une
    seule confusion ($3x + 5x^{2} = 8x^{3}$…) suffit à tout bloquer.
  diagnostic:
  - question: Calcule $E = 3x^{2} - 5x + 2$ pour $x = 2$, puis pour $x = -1$.
    reponse: $4$ ; $10$
  - question: 'Réduis si possible : $7x + 4x$ ; $5x^{2} - 2x^{2}$ ; $3x + 5x^{2}$.'
    reponse: $11x$ ; $3x^{2}$ ; impossible
  - question: 'Développe et réduis : $5\left(2x - 3\right)$ ; puis $-2\left(4x - 7\right)$.'
    reponse: $10x - 15$ ; $-8x + 14$
  - question: 'Développe et réduis : $\left(x + 3\right)\left(2x - 5\right)$.'
    reponse: $2x^{2} + x - 15$
  - question: 'Factorise : $9x + 12$ ; puis $x^{2} - 7x$.'
    reponse: $3\left(3x + 4\right)$ ; $x\left(x - 7\right)$
  lecons:
  - id: 3eme_M05_L1
    numero: '5.1'
    titre: Termes semblables et réduction
    retenir:
    - 'Le signe $\times$ disparaît devant une lettre ou une parenthèse : $3 \times x = 3x$ ; $x \times
      x = x^{2}$.'
    - 'Une somme se découpe en **termes**, chacun avec son signe : dans $3x^{2} - 5x + 2$, ce sont $3x^{2}$,
      $-5x$, $+2$.'
    - Deux termes sont **semblables** s'ils ont la même partie littérale.
    - '**Réduire**, c''est additionner les coefficients des termes semblables ; la lettre ne bouge pas.'
    methode:
      titre: Tester une expression littérale
      etapes:
      - Remplace la lettre par le nombre, **entre parenthèses** s'il est négatif.
      - 'Applique les priorités : parenthèses, carrés, produits, puis sommes.'
    exemple_resolu: 'Réduis $R = 8x^{2} - 3x + 5 - 5x^{2} + 7x - 9$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On regroupe les termes semblables. | $R = \left(8x^{2} - 5x^{2}\right) + \left(-3x + 7x\right)
      + \left(5 - 9\right)$ |

      | On additionne les coefficients. | $R = 3x^{2} + 4x - 4$ |

      | **Vérification :** pour $x = 1$, départ $3$, arrivée $3$. ✓ | |'
    erreurs_frequentes:
    - erreur: $3x + 5x^{2} = 8x^{3}$.
      correction: termes non semblables, on n'y touche plus.
    - erreur: $3x - \left(2x - 5\right) = 3x - 2x - 5$.
      correction: 'le signe $-$ change **tous** les signes intérieurs : $x + 5$.'
    declic: null
    figures: []
  - id: 3eme_M05_L2
    numero: '5.2'
    titre: 'Développer : distributivité simple et double'
    retenir:
    - Le facteur devant la parenthèse multiplie **chaque** terme.
    - 'Double distributivité : **4 produits**, ni plus ni moins.'
    - 'Pour multiplier deux termes : les nombres entre eux, les lettres entre elles : $-4x \times 5x^{2}
      = -20x^{3}$.'
    methode:
      titre: Développer $\left(a + b\right)\left(c + d\right)$ sans rien oublier
      etapes:
      - 'Relie chaque terme de la première parenthèse à chaque terme de la seconde : **4 produits**.'
      - Écris les 4 produits **avec leurs signes**.
      - 'Calcule : coefficients entre eux, lettres entre elles.'
      - '**Réduis** : rien n''est fini avant.'
    exemple_resolu: 'Développe et réduis $D = \left(3x - 2\right)\left(4x + 5\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On écrit les quatre produits. | $D = 3x \times 4x + 3x \times 5 - 2 \times 4x - 2 \times 5$ |

      | On calcule. | $D = 12x^{2} + 15x - 8x - 10$ |

      | On réduit. | $D = 12x^{2} + 7x - 10$ |

      | **Vérification :** pour $x = 1$ : $1 \times 9 = 9$ et $12 + 7 - 10 = 9$. ✓ | |


      Les expressions à étages se traitent de l''intérieur vers l''extérieur : $2\left[5x - 3\left(x -
      4\right)\right] = 2\left[5x - 3x + 12\right] = 4x + 24$.'
    erreurs_frequentes:
    - erreur: $-2\left(4x - 7\right) = -8x - 14$.
      correction: 'le $-2$ multiplie **aussi** le $-7$ : $-8x + 14$.'
    - erreur: $2x \times 3x = 6x$.
      correction: 'les lettres se multiplient aussi : $6x^{2}$.'
    declic: null
    figures:
    - figures/m05_f3.svg
  - id: 3eme_M05_L3
    numero: '5.3'
    titre: 'Factoriser : le facteur commun'
    retenir:
    - Factoriser, c'est transformer une somme en **produit**.
    - Le facteur commun est un nombre ($9x + 12 = 3\left(3x + 4\right)$), une lettre ($x^{2} - 7x = x\left(x
      - 7\right)$) ou une parenthèse entière.
    methode:
      titre: Factoriser par un facteur commun
      etapes:
      - '**Cherche** ce qui se répète : nombre (le plus grand possible), lettre, parenthèse.'
      - Écris le facteur commun **devant une grande parenthèse**.
      - Dans la parenthèse, écris ce qui reste de chaque terme.
      - '**Vérifie en développant.**'
    exemple_resolu: 'Factorise $G = \left(2x + 1\right)\left(x - 4\right) - \left(2x + 1\right)\left(3x
      - 7\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Le facteur commun est le bloc $\left(2x + 1\right)$. | $G = \left(2x + 1\right)\left[\left(x -
      4\right) - \left(3x - 7\right)\right]$ |

      | On inverse les signes de la parenthèse retirée. | $x - 4 - 3x + 7 = -2x + 3$ |

      | On écrit le produit. | $G = \left(2x + 1\right)\left(-2x + 3\right)$ |

      | **Vérification :** pour $x = 0$, $G$ vaut $3$ des deux côtés. ✓ | |'
    erreurs_frequentes:
    - erreur: $12x^{2} - 18x = 2\left(6x^{2} - 9x\right)$.
      correction: 'on sort le facteur le plus grand, lettre comprise : $6x\left(2x - 3\right)$.'
    declic: Développer et factoriser sont un aller-retour — Si la factorisation te semble mystérieuse,
      c'est la distributivité qui n'est pas encore un réflexe. Relis chaque égalité dans les deux sens.
    figures: []
  - id: 3eme_M05_L4
    numero: '5.4'
    titre: Les produits remarquables
    retenir:
    - De gauche à droite elles **développent**, de droite à gauche elles **factorisent**.
    - $\left(x + 5\right)^{2} = x^{2} + 10x + 25$ ; $x^{2} - 9 = \left(x - 3\right)\left(x + 3\right)$.
    - 'Elles servent aussi au calcul mental : $52^{2} = \left(50 + 2\right)^{2} = 2\,704$ ; $45 \times
      35 = 40^{2} - 5^{2} = 1\,575$.'
    methode:
      titre: Reconnaître laquelle des trois identités utiliser
      etapes:
      - 'Compte les termes : **deux** $\to$ $a^{2} - b^{2}$ ; **trois** $\to$ $\left(a \pm b\right)^{2}$.'
      - 'Deux carrés séparés par un $-$ : $\left(a - b\right)\left(a + b\right)$.'
      - 'Trois termes : premier et dernier des carrés ? Compare le milieu à $2ab$ ; son signe donne celui
        de la parenthèse.'
    exemple_resolu: 'Factorise $A = 49x^{2} - 16$, $B = x^{2} - 10x + 25$ et $C = 9x^{2} + 30x + 25$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | $A$ : deux carrés séparés par un $-$. | $\left(7x\right)^{2} - 4^{2} = \left(7x - 4\right)\left(7x
      + 4\right)$ |

      | $B$ : trois termes, double produit $2 \times x \times 5 = 10x$, négatif. | $B = \left(x - 5\right)^{2}$
      |

      | $C$ : double produit $2 \times 3x \times 5 = 30x$, positif. | $C = \left(3x + 5\right)^{2}$ |

      | **Vérification :** pour $x = 1$ : $33 = 3 \times 11$ ; $16 = \left(-4\right)^{2}$ ; $64 = 8^{2}$.
      ✓ | |


      > #### MÉTHODE : Démontrer une propriété avec une lettre

      >

      > 1. **Traduis** : $n$ entier, $2n$ pair, $2n + 1$ impair, $n$, $n + 1$, $n + 2$ consécutifs.

      > 2. Écris l''expression demandée, développe, réduis.

      > 3. **Factorise** pour faire apparaître la conclusion. Ainsi $\left(2n + 1\right) + \left(2n +
      3\right) = 4\left(n + 1\right)$.'
    erreurs_frequentes:
    - erreur: $\left(x + 3\right)^{2} = x^{2} + 9$.
      correction: 'le double produit manque : $x^{2} + 6x + 9$.'
    - erreur: factoriser $x^{2} + 9$ en $\left(x + 3\right)\left(x - 3\right)$.
      correction: seule une **différence** de carrés se factorise.
    declic: null
    figures:
    - figures/m05_f5.svg
    - figures/m05_f6.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Calcule pour $x = 3$, puis pour $x = -2$ : a) $A = 4x - 7$ ; b) $B = x^{2} + 2x - 1$ ; c)
      $C = \frac{12}{x} + 5$.'
    correction: '$x = 3$ : $A = 5$ ; $B = 14$ ; $C = 9$. $x = -2$ : $A = -15$ ; $B = -1$ ; $C = -1$.'
  - numero: 2
    etoiles: 1
    enonce: 'Réduis quand c''est possible : a) $9x - 4x$ ; b) $6x^{2} + x^{2}$ ; c) $4x + 7$ ; d) $8x
      - 3 + 2x + 10$ ; e) $5x^{2} + 3x - 2x^{2} + x$.'
    correction: a) $5x$ ; b) $7x^{2}$ ; c) impossible ; d) $10x + 7$ ; e) $3x^{2} + 4x$.
  - numero: 3
    etoiles: 1
    enonce: 'Supprime les parenthèses puis réduis : a) $7x + \left(3x - 4\right)$ ; b) $9x - \left(5x
      + 2\right)$ ; c) $4x^{2} - \left(x^{2} - 6x\right) + 2x$.'
    correction: a) $10x - 4$ ; b) $4x - 2$ ; c) $3x^{2} + 8x$.
