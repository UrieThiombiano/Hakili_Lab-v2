  fiche_revision:
  - '**Crochets.** Vers l''intérieur si la borne est incluse ; toujours ouvert côté infini.'
  - '**Valeur absolue.** $|x| = x$ si $x \ge 0$, $-x$ sinon ; toujours positive ou nulle.'
  - '**Distance.** $d\left(a\,;\,b\right) = |b - a|$ ; $|x - a|$ = distance de $x$ à $a$.'
  - '**Équation.** $|x - a| = r$ ($r \ge 0$) : $x = a + r$ ou $x = a - r$.'
  - '**Famille « proche ».** $|x - a| \le r$ : un morceau, $\left[a - r\,;\,a + r\right]$.'
  - '**Famille « loin ».** $|x - a| \ge r$ : deux morceaux, $\left]-\infty\,;\,a - r\right] \cup \left[a
    + r\,;\,+\infty\right[$.'
  - '**Centre et rayon.** $c = \frac{a + b}{2}$, $r = \frac{b - a}{2}$ (moitié de l''amplitude).'
  - '**Sans barres.** On annule chaque intérieur, on découpe, on écrit un cas par morceau.'
