      à $4$ cm à gauche. Donne les abscisses.'
    correction: $A\left(+3\right)$ ; $B\left(-1{,}5\right)$ ; $C\left(0\right)$ ; $D\left(-4\right)$.
  - numero: 7
    etoiles: 1
    enonce: Sur une droite graduée d'unité $1$ cm, place les points d'abscisses $-3$ ; $+3{,}5$ ; $0$
      ; $-2$ ; $+1$.
    correction: 'À gauche du $0$ : $-3$ à $3$ cm, $-2$ à $2$ cm. À droite : $+1$ à $1$ cm, $+3{,}5$ au
