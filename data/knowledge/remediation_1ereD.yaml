- niveau: 1ereD
  module: 1
  module_titre: 'Calculer juste : relatifs, fractions, puissances, racines carrées, identités remarquables'
  pourquoi: Une étude de fonction juste peut être ruinée par une fraction mal réduite ou un signe perdu.
    On remet en place ici les quatre gestes de calcul indispensables.
  diagnostic:
  - question: Calcule $\left(-3\right) \times \left(+5\right)$, puis $7 - 2 \times \left(-4\right)$.
    reponse: $-15$ ; $15$
  - question: 'Donne sous forme irréductible : $\frac{2}{3} + \frac{1}{4}$ ; $\frac{5}{6} \times \frac{3}{10}$.'
    reponse: $\frac{11}{12}$ ; $\frac{1}{4}$
  - question: Calcule $\left(-3\right)^{2}$, $\left(-3\right)^{3}$, $2^{-3}$, $\left(2x^{3}\right)^{4}$.
    reponse: $9$ ; $-27$ ; $\frac{1}{8}$ ; $16x^{12}$
  - question: Calcule $\sqrt{49}$, $\sqrt{16 \times 25}$, puis simplifie $\sqrt{18}$.
    reponse: $7$ ; $20$ ; $3\sqrt{2}$
  - question: Écris $10^{5} \times 10^{3}$ en puissance de 10, puis 32 000 en écriture scientifique.
    reponse: $10^{8}$ ; $3{,}2 \times 10^{4}$
  lecons:
  - id: 1ereD_M01_L1
    numero: '1.1'
    titre: Relatifs et fractions
    retenir:
    - Même signe $\to$ produit positif ; signes contraires $\to$ produit négatif.
    - Un signe $-$ devant une parenthèse change le signe de **chaque** terme.
    - 'Priorités : parenthèses, puissances, $\times$ et $\div$, puis $+$ et $-$ ; à rang égal, de gauche
      à droite.'
    methode:
      titre: Calculer une expression à étages
      etapes:
      - 'Repère la **grande barre** : elle sépare un numérateur et un dénominateur.'
      - Réduis **séparément** le haut et le bas à une seule fraction.
      - Remplace la division par la multiplication par l'**inverse**.
      - 'Simplifie **avant** de multiplier : barre des facteurs, jamais des termes d''une somme.'
    exemple_resolu: 'Calcule $A = \left(1 + \frac{2}{3}\right) \div \left(\frac{3}{2} - \frac{4}{3}\right)$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On réduit la première parenthèse, avec $1 = \frac{3}{3}$. | $1 + \frac{2}{3} = \frac{5}{3}$ |

      | Puis la seconde, en sixièmes. | $\frac{9}{6} - \frac{8}{6} = \frac{1}{6}$ |

      | Diviser par $\frac{1}{6}$, c''est multiplier par $6$. | $A = \frac{5}{3} \times 6 = 10$ |

      | **Vérification :** $1{,}67 \div 0{,}17 \approx 10$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\frac{2}{3} + \frac{1}{4} = \frac{3}{7}$.
      correction: 'même dénominateur d''abord : $\frac{8}{12} + \frac{3}{12} = \frac{11}{12}$.'
    - erreur: $7 - 2 \times \left(-4\right) = -20$.
      correction: 'la multiplication passe avant : $7 + 8 = 15$.'
    - erreur: $\left(2x - 1\right) - \left(x + 3\right) = x + 2$.
      correction: $= 2x - 1 - x - 3 = x - 4$.
    declic: null
    figures: []
  - id: 1ereD_M01_L2
    numero: '1.2'
    titre: Puissances et écriture scientifique
    retenir:
    - $a^{0} = 1$ et $a^{-n} = \frac{1}{a^{n}}$ pour $a \ne 0$.
    - $a^{m} \times a^{n} = a^{m+n}$ ; $a^{m} \div a^{n} = a^{m-n}$ ; $\left(a^{m}\right)^{n} = a^{mn}$
      ; $\left(ab\right)^{n} = a^{n}b^{n}$ ; $\left(\frac{a}{b}\right)^{n} = \frac{a^{n}}{b^{n}}$. Aucune
      règle ne porte sur une **somme**.
    - 'Signe : $n$ pair $\to \left(-a\right)^{n} = a^{n}$ ; $n$ impair $\to \left(-a\right)^{n} = -a^{n}$.'
    - 'Écriture scientifique : $a \times 10^{n}$ avec $1 \le a < 10$ et $n$ entier relatif.'
    methode:
      titre: Réduire une expression avec puissances
      etapes:
      - Décompose les nombres en **facteurs premiers** ($30 = 2 \times 3 \times 5$).
      - Regroupe les puissances de **même base**.
      - Produit $\to$ ajoute les exposants ; quotient $\to$ soustrais ; puissance de puissance $\to$ multiplie.
      - Vérifie le signe avec la parité de l'exposant.
    exemple_resolu: 'Écris $A = \left(2^{10} \times 3^{7} \times 5^{4}\right) \div 30^{8}$ sous la forme
      $2^{a} \times 3^{b} \times 5^{c}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On décompose $30$ ; l''exposant se distribue sur le produit. | $30^{8} = 2^{8} \times 3^{8} \times
      5^{8}$ |

      | Quotient de mêmes bases : on soustrait, base par base. | $A = 2^{2} \times 3^{-1} \times 5^{-4}$
      |

      | **Vérification :** $10 - 8 = 2$, $7 - 8 = -1$, $4 - 8 = -4$. ✓ | |'
    erreurs_frequentes:
    - erreur: $2^{3} \times 2^{5} = 2^{15}$.
      correction: 'même base, on **ajoute** : $2^{8}$. On multiplie les exposants seulement pour $\left(2^{3}\right)^{5}
        = 2^{15}$.'
    - erreur: confondre $\left(-2\right)^{4}$ et $-2^{4}$.
      correction: $\left(-2\right)^{4} = 16$ ; $-2^{4} = -16$, car seul $2$ est élevé.
    declic: null
    figures: []
  - id: 1ereD_M01_L3
    numero: '1.3'
    titre: Racines carrées
    retenir:
    - Pour $a \ge 0$, $\sqrt{a}$ est le nombre **positif** dont le carré vaut $a$.
    - 'Pour $a \ge 0$, $b \ge 0$ : $\sqrt{ab} = \sqrt{a}\sqrt{b}$ et $\sqrt{\frac{a}{b}} = \frac{\sqrt{a}}{\sqrt{b}}$
      si $b > 0$.'
    - 'Pour $u$ **quelconque** : $\sqrt{u^{2}} = |u|$.'
    - '$\left(a + \sqrt{b}\right)\left(a - \sqrt{b}\right) = a^{2} - b$ : c''est la quantité **conjuguée**.'
    - '⚠ $\sqrt{a + b} \ne \sqrt{a} + \sqrt{b}$ : la racine ne se distribue pas sur une somme.'
    methode:
      titre: Simplifier, puis rendre le dénominateur rationnel
      etapes:
      - 'Sous le radical, sors le plus grand **carré parfait** : $\sqrt{k^{2}m} = k\sqrt{m}$.'
      - 'Réduis les multiples d''une même racine comme des $x$ : $5\sqrt{2} + 2\sqrt{2} = 7\sqrt{2}$.'
      - 'Dénominateur $\sqrt{b}$ : multiplie haut et bas par $\sqrt{b}$.'
      - 'Dénominateur $a \pm \sqrt{b}$ : multiplie haut et bas par le **conjugué** $a \mp \sqrt{b}$.'
    exemple_resolu: 'Rends rationnel le dénominateur : a) $\frac{3}{\sqrt{5}}$ ; b) $\frac{2}{1 + \sqrt{3}}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | a) On multiplie haut et bas par $\sqrt{5}$. | $\frac{3}{\sqrt{5}} = \frac{3\sqrt{5}}{5}$ |

      | b) Conjugué de $1 + \sqrt{3}$ : $1 - \sqrt{3}$. | $\frac{2\left(1 - \sqrt{3}\right)}{1 - 3}$ |

      | Le dénominateur vaut $-2$ ; le signe remonte. | $= \sqrt{3} - 1$ |

      | **Vérification :** $\sqrt{3} - 1 \approx 0{,}73 \approx \frac{2}{2{,}73}$. ✓ | |'
    erreurs_frequentes:
    - erreur: $\sqrt{9 + 16} = 3 + 4 = 7$.
      correction: $\sqrt{25} = 5$.
    - erreur: $\sqrt{\left(1 - \sqrt{2}\right)^{2}} = 1 - \sqrt{2}$.
      correction: $\sqrt{u^{2}} = |u|$ et $1 - \sqrt{2} < 0$, donc le résultat est $\sqrt{2} - 1$.
    declic: null
    figures: []
  - id: 1ereD_M01_L4
    numero: '1.4'
    titre: Identités remarquables (degré 2)
    retenir: []
    methode:
      titre: Développer et factoriser
      etapes:
      - 'Écris qui est $a$ et qui est $b$ : dans $\left(3x - 2\right)^{2}$, $a = 3x$ et $b = 2$.'
      - 'Pour développer : calcule $a^{2}$, le double produit $2ab$, puis $b^{2}$.'
      - 'Pour factoriser : cherche d''abord un **facteur commun**, puis reconnais $A^{2} - B^{2}$ ou $A^{2}
        \pm 2AB + B^{2}$.'
      - 'Contrôle avec $x = 0$ ou $x = 1$ : les deux formes donnent le même nombre.'
    exemple_resolu: 'Factorise $f\left(x\right) = \left(2x - 1\right)^{2} - \left(x + 3\right)^{2}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Différence de carrés, $A = 2x - 1$ et $B = x + 3$. | $f\left(x\right) = \left[\left(2x-1\right)-\left(x+3\right)\right]\left[\left(2x-1\right)+\left(x+3\right)\right]$
      |

      | On réduit chaque crochet, en surveillant le signe $-$. | $f\left(x\right) = \left(x - 4\right)\left(3x
      + 2\right)$ |

      | **Vérification :** $f\left(0\right) = 1 - 9 = -8$ et $\left(-4\right)\left(2\right) = -8$. ✓ |
      |'
    erreurs_frequentes:
    - erreur: $\left(a + b\right)^{2} = a^{2} + b^{2}$.
      correction: le double produit ne disparaît jamais ; $\left(3 + 4\right)^{2} = 49$, pas $25$.
    - erreur: $\left(3x\right)^{2} = 3x^{2}$.
      correction: 'l''exposant porte sur tout le produit : $9x^{2}$.'
    declic: 'factoriser, c''est préparer tout le programme — Une équation se résout par un produit nul
      : $\left(x - 4\right)\left(3x + 2\right) = 0$ donne $x = 4$ ou $x = -\frac{2}{3}$. Un tableau de
      signes exige aussi un produit. La forme canonique est un carré complété : $x^{2} + 6x + 5 = \left(x
      + 3\right)^{2} - 4$.'
    figures:
    - figures/m01_f5.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Calcule : a) $\left(-8\right) \times \left(-3\right)$ ; b) $\frac{1}{2} + \frac{1}{3}$ ;
      c) $\frac{4}{5} \div \frac{2}{3}$.'
    correction: a) $+24$ ; b) $\frac{5}{6}$ ; c) $\frac{4}{5} \times \frac{3}{2} = \frac{6}{5}$.
  - numero: 2
    etoiles: 1
    enonce: 'Donne sous forme de fraction irréductible : a) $A = \frac{1}{3} + \frac{1}{4} - \frac{1}{8}$
      ; b) $B = \frac{2}{3} - 4 + \frac{1}{5}$ ; c) $C = \frac{1}{7} + \frac{2}{7} - \frac{1}{3}$ ; d)
      $D = \frac{1}{5} + \left(\frac{1}{3} + \frac{4}{5}\right) - \frac{5}{15} + \frac{33}{165}$ ; e)
      $E = \frac{1}{3} + \frac{1}{2}\left(\frac{1}{4} + \frac{2}{3}\right) - \frac{1}{8}$.'
    correction: a) $\frac{8+6-3}{24} = \frac{11}{24}$ ; b) $\frac{10-60+3}{15} = -\frac{47}{15}$ ; c)
      $\frac{3}{7} - \frac{1}{3} = \frac{2}{21}$ ; d) $\frac{5}{15} = \frac{1}{3}$ et $\frac{33}{165}
      = \frac{1}{5}$, donc $D = \frac{6}{5}$ ; e) $\frac{1}{3} + \frac{11}{24} - \frac{1}{8} = \frac{2}{3}$.
  - numero: 3
    etoiles: 1
    enonce: 'Calcule : a) $A = \frac{1 + \frac{1}{3}}{1 + \frac{1}{4}} + \frac{1 - \frac{1}{4}}{1 - \frac{1}{3}}$
      ; b) $B = \frac{1 + \frac{1}{2} + \frac{1}{3}}{\frac{3}{4} + \frac{1}{7} - \frac{1}{3}}$ ; c) $C
      = \frac{\frac{50}{7}}{\frac{11}{20}} \times \frac{\frac{9}{40}}{\frac{15}{7}}$ ; d) $D = \frac{\frac{4}{7}
      \times \frac{15}{8}}{\frac{11}{7} \times \frac{8}{45}}$.'
    correction: a) $\frac{16}{15} + \frac{9}{8} = \frac{263}{120}$ ; b) $\frac{11}{6} \times \frac{84}{47}
      = \frac{154}{47}$ ; c) $\frac{5}{3} \times \frac{9}{11} = \frac{15}{11}$ ; d) $\frac{15}{14} \times
      \frac{315}{88} = \frac{675}{176}$.
  - numero: 4
    etoiles: 1
    enonce: 'Calcule : a) $A = \cfrac{1}{1 + \cfrac{1}{1 + \cfrac{1}{1 + \frac{1}{2}}}}$ ; b) $B = \cfrac{1}{1
      + \cfrac{1}{1 + \cfrac{1}{1 + \frac{1}{3}}}}$.'
    correction: On remonte de l'intérieur. a) $\frac{3}{2} \to \frac{5}{3} \to \frac{8}{5}$, donc $A =
      \frac{5}{8}$ ; b) $\frac{4}{3} \to \frac{7}{4} \to \frac{11}{7}$, donc $B = \frac{7}{11}$.
  - numero: 5
    etoiles: 1
    enonce: 'Écris sous la forme d''une seule puissance : a) $2^{3} \times 2^{5}$ ; b) $\left(10^{4} \times
      10^{2}\right) \div 10^{3}$ ; c) $\left(3^{2}\right)^{3}$ ; d) $5^{-2} \times 5^{4}$.'
    correction: a) $2^{8}$ ; b) $10^{3}$ ; c) $3^{6}$ ; d) $5^{2}$.
  - numero: 6
    etoiles: 1
    enonce: 'Calcule : a) $5^{1}$ ; b) $2^{-5}$ ; c) $\left(-1\right)^{12}$ ; d) $\left(-1\right)^{15}$.'
    correction: a) $5$ ; b) $\frac{1}{32}$ ; c) $1$ ; d) $-1$.
  - numero: 7
    etoiles: 1
    enonce: 'Écris sous la forme $2^{m} \times 3^{n}$ ($m$, $n$ entiers relatifs) : a) $27^{2}$ ; b) $\left(3^{3}\right)^{2}
      \times 2^{4}$ ; c) $\left(\frac{1}{4}\right)^{2} \times \left(\frac{2}{3}\right)^{3}$ ; d) $\frac{81
      \times 2^{2}}{2^{3} \times 3^{-4}}$.'
    correction: a) $3^{6}$ ; b) $2^{4} \times 3^{6}$ ; c) $2^{-1} \times 3^{-3}$ ; d) $2^{-1} \times 3^{8}$.
  - numero: 8
    etoiles: 1
    enonce: 'Donne l''écriture scientifique de : a) $\left(3 \times 10^{4}\right) \times \left(2 \times
