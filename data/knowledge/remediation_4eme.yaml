  fiche_revision:
  - '**Définition.** $a^{n}$ est le produit de $n$ facteurs égaux à $a$ ; $a^{1} = a$ et $a^{0} = 1$ pour
    $a \ne 0$.'
  - '**Signe.** Base négative : positif si l''exposant est pair, négatif s''il est impair.'
  - '**Parenthèses.** $-2^{4} = -16$ mais $\left(-2\right)^{4} = +16$.'
  - '**Priorités.** Les puissances avant les multiplications : $2 \times 3^{2} = 18$.'
  - '**Les quatre règles.** $a^{n} \times a^{m} = a^{n+m}$ ; $\frac{a^{n}}{a^{m}} = a^{n-m}$ ; $\left(a
    \times b\right)^{n} = a^{n} \times b^{n}$ ; $\left(a^{n}\right)^{m} = a^{n \times m}$. Même base pour
    les deux premières ; la base ne change jamais.'
  - '**Puissances de $10$.** $10^{n}$ compte $n + 1$ chiffres. Grand nombre : $a \times 10^{n}$. Petit
    : $\frac{1}{10^{n}} = 10^{-n}$.'
  - '**Comparer sans calculer.** On ramène à une base commune : $4^{5} = 2^{10} < 2^{12}$.'
  trouve_erreur:
  - faux: $2^{5} = 2 \times 5 = 10$
    correction: 'L''exposant compte les facteurs : $2^{5} = 32$.'
  - faux: $5^{2} \times 5^{3} = 25^{5}$
    correction: 'La base ne change jamais : $5^{5}$.'
  - faux: $\left(2^{3}\right)^{2} = 2^{5}$
    correction: 'Puissance d''une puissance : on multiplie, $2^{6}$.'
  - faux: $\frac{7^{6}}{7^{2}} = 7^{3}$
    correction: 'On soustrait les exposants : $7^{4}$.'
  cartographie_lacunes:
  - lacune: $a^{n}$ confondu avec $a \times n$, règles des exposants inconnues
    bloque_en: décimaux et puissances de dix
