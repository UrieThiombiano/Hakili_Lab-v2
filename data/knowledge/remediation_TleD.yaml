- niveau: TleD
  module: 3
  module_titre: Comparer et ordonner des réels
  pourquoi: Comparer deux réels par le signe de la différence est le geste de base de l'analyse. Il commande
    le sens de variation, la position relative de deux courbes et la monotonie d'une suite.
  diagnostic:
  - question: À quels ensembles parmi $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$ appartient
      $-7$ ? Et $\sqrt{3}$ ?
    reponse: $-7 \in \mathbb{Z}, \mathbb{Q}, \mathbb{R}$ ; $\sqrt{3} \in \mathbb{R}$ seulement
  - question: 'Range dans l''ordre croissant : $-2$ ; $\frac{3}{2}$ ; $-\frac{5}{3}$ ; $0$ ; $1$.'
    reponse: $-2 < -\frac{5}{3} < 0 < 1 < \frac{3}{2}$
  - question: Compare $\frac{9}{7}$ et $\frac{13}{10}$ par la différence.
    reponse: $\frac{9}{7} - \frac{13}{10} = -\frac{1}{70} < 0$, donc $\frac{9}{7} < \frac{13}{10}$
  - question: Pour $0 < x < 1$, range $x$, $x^{2}$, $\sqrt{x}$ et $\frac{1}{x}$ dans l'ordre croissant.
    reponse: $x^{2} < x < \sqrt{x} < \frac{1}{x}$
  - question: Si $a \le b$ et $c < 0$, que devient l'inégalité $ac \ ? \ bc$ ?
    reponse: le sens change, $ac \ge bc$
  lecons:
  - id: TleD_M03_L1
    numero: '3.1'
    titre: Le signe de la différence
    retenir:
    - $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$ ; $\mathbb{Q}$ = quotients
      d'entiers ; $\sqrt{2}$ et $\pi$ sont dans $\mathbb{R}$ mais pas dans $\mathbb{Q}$.
    - $a < b$ signifie $b - a > 0$ ; $a > b$ signifie $b - a < 0$ ; $a = b$ signifie $b - a = 0$.
    - Comparer, c'est étudier le **signe de la différence $a - b$**.
    - Si $a > 0$ et $b > 0$, on peut aussi comparer le **quotient $\frac{a}{b}$ à $1$**.
    methode:
      titre: Comparer par la différence
      etapes:
      - Forme la différence $a - b$, dans l'ordre de l'énoncé.
      - 'Transforme-la : même dénominateur, développement, factorisation.'
      - Lis son signe.
      - 'Conclus : différence positive, le **premier** est le plus grand.'
    exemple_resolu: 'Compare $A = \frac{7}{4}$ et $B = \frac{12}{7}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On forme la différence. | $A - B = \frac{7}{4} - \frac{12}{7}$ |

      | On réduit au dénominateur $28$. | $= \frac{49}{28} - \frac{48}{28} = \frac{1}{28} > 0$ |

      | Différence positive : le premier dépasse. | **$\frac{7}{4} > \frac{12}{7}$** |

      | **Vérification :** $1{,}75 > 1{,}714$ ✓ | |


      [SVG: figures/m03_f2.svg]

      *Figure 3.1 : le signe de la différence tranche les trois cas.*'
    erreurs_frequentes:
    - erreur: former $b - a$ et conclure sur $a$.
      correction: écris la différence dans l'ordre de l'énoncé, puis relis « différence positive, donc
        le premier est le plus grand ».
    - erreur: trancher sur une valeur approchée grossière.
      correction: pour $\frac{11}{7}$ et $\frac{14}{9}$, seule la différence exacte décide.
    declic: 'un réflexe, quatre chapitres — Position relative de $(C_f)$ et $(C_g)$ : signe de $f(x) -
      g(x)$. Fonction croissante : signe de $f(b) - f(a)$ pour $a < b$. Suite croissante : signe de $u_{n+1}
      - u_{n}$. Inéquation $f(x) \le g(x)$ : signe de $f(x) - g(x)$.'
    figures:
    - figures/m03_f2.svg
  - id: TleD_M03_L2
    numero: '3.2'
    titre: L'ordre et les opérations
    retenir:
    - '**Ajouter** : si $a \le b$, alors $a + c \le b + c$ (sens conservé, toujours).'
    - '**Multiplier par $c > 0$** : $ac \le bc$ (sens conservé).'
    - '**Multiplier par $c < 0$** : $ac \ge bc$ (**sens inversé**). Diviser par $c$, c''est multiplier
      par $\frac{1}{c}$, de même signe : même règle.'
    - 'Si $0 \le a \le b$ : $a^{2} \le b^{2}$ et $\sqrt{a} \le \sqrt{b}$ (conservé).'
    - 'Si $a$ et $b$ sont non nuls et **de même signe** : $a \le b$ donne $\frac{1}{a} \ge \frac{1}{b}$
      (inversé).'
    - 'Si $a \le b \le 0$ : $a^{2} \ge b^{2}$ (inversé). De deux négatifs, le plus grand est le plus proche
      de $0$.'
    methode: null
    exemple_resolu: 'Compare $A = -\frac{3}{8}$ et $B = -\frac{2}{5}$ par les inverses.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On passe aux inverses, plus simples. | $\frac{1}{A} = -\frac{8}{3}$, $\frac{1}{B} = -\frac{5}{2}$
      |

      | On les compare par la différence. | $-\frac{8}{3} + \frac{5}{2} = -\frac{1}{6} < 0$, donc $\frac{1}{A}
      < \frac{1}{B}$ |

      | $A$ et $B$ de même signe : le retour inverse le sens. | **$-\frac{3}{8} > -\frac{2}{5}$** |

      | **Vérification :** $-0{,}375 > -0{,}4$ ✓ | |'
    erreurs_frequentes:
    - erreur: « $-5 < 2$ donc $(-5)^{2} < 2^{2}$ », soit $25 < 4$.
      correction: le passage au carré ne conserve l'ordre que si les deux nombres sont positifs.
    - erreur: produit en croix avec un dénominateur négatif.
      correction: rends d'abord les dénominateurs positifs, ou reviens à la différence.
    declic: null
    figures: []
  - id: TleD_M03_L3
    numero: '3.3'
    titre: 'Les quatre visages de $x$ : $x$, $x^{2}$, $\sqrt{x}$, $\frac{1}{x}$'
    retenir:
    - 'Si $0 < x < 1$ : $\quad x^{2} < x < \sqrt{x} < 1 < \frac{1}{x}$.'
    - 'Si $x = 1$ : $\quad x^{2} = x = \sqrt{x} = \frac{1}{x} = 1$.'
    - 'Si $x > 1$ : $\quad \frac{1}{x} < 1 < \sqrt{x} < x < x^{2}$.'
    methode: null
    exemple_resolu: 'Range $x$, $x^{2}$, $\sqrt{x}$, $\frac{1}{x}$ pour $x = \frac{1}{9}$, en valeurs
      exactes.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On situe $x$ par rapport à la charnière $1$. | $0 < \frac{1}{9} < 1$ |

      | On calcule les trois compagnons. | $x^{2} = \frac{1}{81}$, $\sqrt{x} = \frac{1}{3}$, $\frac{1}{x}
      = 9$ |

      | Numérateur $1$ : le plus grand dénominateur donne le plus petit nombre. | $\frac{1}{81} < \frac{1}{9}
      < \frac{1}{3} < 1 < 9$ |

      | **Conclusion :** cas $0 < x < 1$ confirmé. | **$x^{2} < x < \sqrt{x} < \frac{1}{x}$** |'
    erreurs_frequentes:
    - erreur: croire que le carré est toujours le plus grand.
      correction: seulement si $x > 1$ (ou $x < -1$) ; pour $x = 0{,}5$, $x^{2} = 0{,}25 < x$.
    - erreur: écrire $\sqrt{x} < x$ pour tout $x$.
      correction: faux sur $]0\,;\,1[$, où $\sqrt{0{,}25} = 0{,}5 > 0{,}25$.
    declic: null
    figures:
    - figures/m03_f5.svg
  - id: TleD_M03_L4
    numero: '3.4'
    titre: Trois techniques qui dépannent
    retenir: []
    methode:
      titre: Choisir la technique
      etapes:
      - '**Fractions ou expressions littérales ?** La différence, réduite puis factorisée : technique
        par défaut.'
      - '**Produits, puissances, nombres tous strictement positifs ?** Le quotient $\frac{a}{b}$ comparé
        à $1$ : $\frac{a}{b} > 1$ équivaut à $a > b$.'
      - '**Racines carrées de nombres positifs ?** Les carrés : pour $a \ge 0$ et $b \ge 0$, comparer
        $a$ et $b$ revient à comparer $a^{2}$ et $b^{2}$. Si les nombres sont négatifs, on compare leurs
        opposés et on retourne la conclusion.'
      - '**Une liste à ranger ?** Un repère intermédiaire ($0$, $1$, un entier) coupe la liste en deux
        paquets.'
    exemple_resolu: 'Range dans l''ordre croissant : $\sqrt{5}$ ; $\frac{9}{4}$ ; $2{,}3$ ; $\sqrt{6}$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Quatre nombres positifs : on range leurs carrés, les racines disparaissent. | on compare $5$ ;
      $\left(\frac{9}{4}\right)^{2}$ ; $2{,}3^{2}$ ; $6$ |

      | On calcule les deux carrés non immédiats. | $\frac{81}{16} = 5{,}0625$ et $5{,}29$ |

      | On range les carrés. | $5 < 5{,}0625 < 5{,}29 < 6$ |

      | Nombres positifs : même ordre. | **$\sqrt{5} < \frac{9}{4} < 2{,}3 < \sqrt{6}$** |'
    erreurs_frequentes:
    - erreur: utiliser le quotient avec un nombre négatif.
      correction: la technique du quotient est réservée aux nombres strictement positifs.
    - erreur: comparer $-\sqrt{7}$ et $-2{,}6$ par leurs carrés sans retourner.
      correction: $7 > 6{,}76$ donne $\sqrt{7} > 2{,}6$, donc $-\sqrt{7} < -2{,}6$.
    declic: null
    figures: []
  exercices:
  - numero: 1
    etoiles: 1
    enonce: 'Complète avec $\in$ ou $\notin$ : a) $5$ … $\mathbb{N}$ ; b) $-7$ … $\mathbb{N}$ ; c) $\frac{3}{4}$
      … $\mathbb{Z}$ ; d) $\sqrt{5}$ … $\mathbb{Q}$ ; e) $\sqrt{5}$ … $\mathbb{R}$ ; f) $-\frac{2}{4}$
      … $\mathbb{Z}$.'
    correction: a) $\in$ ; b) $\notin$ ; c) $\notin$ ; d) $\notin$ ; e) $\in$ ; f) $\notin$ (car $-\frac{2}{4}
      = -\frac{1}{2}$).
  - numero: 2
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $-3$ ; $0$ ; $-\frac{1}{2}$ ; $2$ ; $-\frac{5}{4}$ ; $\frac{3}{2}$.'
    correction: $-3 < -\frac{5}{4} < -\frac{1}{2} < 0 < \frac{3}{2} < 2$.
  - numero: 3
    etoiles: 1
    enonce: 'Compare par la différence : a) $\frac{5}{3}$ et $\frac{8}{5}$ ; b) $\frac{2}{7}$ et $\frac{3}{11}$
      ; c) $\frac{9}{4}$ et $\frac{11}{5}$ ; d) $-\frac{5}{7}$ et $-\frac{7}{9}$ ; e) $-\frac{7}{4}$ et
      $-\frac{9}{5}$.'
    correction: a) $\frac{1}{15} > 0$ → $\frac{5}{3} > \frac{8}{5}$ ; b) $\frac{1}{77} > 0$ → $\frac{2}{7}
      > \frac{3}{11}$ ; c) $\frac{1}{20} > 0$ → $\frac{9}{4} > \frac{11}{5}$ ; d) $\frac{4}{63} > 0$ →
      $-\frac{5}{7} > -\frac{7}{9}$ ; e) $\frac{1}{20} > 0$ → $-\frac{7}{4} > -\frac{9}{5}$.
  - numero: 4
    etoiles: 1
    enonce: 'Compare par la différence : a) $\frac{7}{4}$ et $\frac{12}{7}$ ; b) $\frac{9}{7}$ et $\frac{13}{10}$
      ; c) $\frac{8}{5}$ et $\frac{13}{8}$.'
    correction: a) $\frac{1}{28} > 0$ → $\frac{7}{4} > \frac{12}{7}$ ; b) $-\frac{1}{70} < 0$ → $\frac{9}{7}
      < \frac{13}{10}$ ; c) $-\frac{1}{40} < 0$ → $\frac{8}{5} < \frac{13}{8}$.
  - numero: 5
    etoiles: 1
    enonce: 'Compare par la différence : a) $-\frac{15}{7}$ et $-\frac{13}{6}$ ; b) $-\frac{5}{4}$ et
      $-\frac{7}{5}$ ; c) $-\frac{2}{3}$ et $-\frac{3}{4}$.'
    correction: a) $\frac{1}{42} > 0$ → $-\frac{15}{7} > -\frac{13}{6}$ ; b) $\frac{3}{20} > 0$ → $-\frac{5}{4}
      > -\frac{7}{5}$ ; c) $\frac{1}{12} > 0$ → $-\frac{2}{3} > -\frac{3}{4}$.
  - numero: 6
    etoiles: 1
    enonce: 'Indique si $x^{2} < x$ ou $x^{2} > x$ : a) $x = 0{,}3$ ; b) $x = 1$ ; c) $x = 4$ ; d) $x
      = \frac{5}{2}$.'
    correction: 'a) $x^{2} < x$ ; b) $x^{2} = x$ ; c) et d) $x^{2} > x$. Règle : $x^{2} < x$ sur $]0\,;\,1[$,
      $x^{2} > x$ pour $x > 1$.'
  - numero: 7
    etoiles: 1
    enonce: On donne $x = 0{,}2$. Range dans l'ordre croissant $x$, $x^{2}$, $\sqrt{x}$ et $\frac{1}{x}$.
    correction: '$x^{2} = 0{,}04$ ; $\sqrt{x} \approx 0{,}447$ ; $\frac{1}{x} = 5$. Ordre : $x^{2} < x
      < \sqrt{x} < \frac{1}{x}$.'
  - numero: 8
    etoiles: 1
    enonce: 'Range dans l''ordre croissant, en justifiant : $\sqrt{2}$ ; $1{,}5$ ; $\frac{7}{5}$ ; $\sqrt{3}$.'
    correction: 'Par les carrés : $1{,}96 < 2 < 2{,}25 < 3$, donc $\frac{7}{5} < \sqrt{2} < 1{,}5 < \sqrt{3}$.'
  - numero: 9
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $-\sqrt{3}$ ; $-1{,}7$ ; $-\frac{5}{3}$ ; $-1{,}8$.'
    correction: $-1{,}8 < -\sqrt{3} < -1{,}7 < -\frac{5}{3}$ (car $\frac{5}{3} < 1{,}7 < \sqrt{3} < 1{,}8$).
  - numero: 10
    etoiles: 1
    enonce: 'Deux enfants se disputent un gâteau : l''un veut les $\frac{3}{5}$, l''autre les $\frac{5}{7}$.
      Est-ce possible ? Justifie.'
    correction: '$\frac{3}{5} + \frac{5}{7} = \frac{46}{35} > 1$ : impossible, cela dépasse le gâteau
      entier.'
  - numero: 11
    etoiles: 1
    enonce: 'Compare par le quotient : a) $\frac{15}{4}$ et $\frac{7}{2}$ ; b) $2^{5}$ et $5^{2}$.'
    correction: a) $\frac{15}{4} \times \frac{2}{7} = \frac{15}{14} > 1$ → $\frac{15}{4} > \frac{7}{2}$
      ; b) $\frac{32}{25} > 1$ → $2^{5} > 5^{2}$.
  - numero: 12
    etoiles: 1
    enonce: 'On sait que $a \le b$. Complète par $\le$ ou $\ge$ : a) $a + 7$ … $b + 7$ ; b) $3a$ … $3b$
      ; c) $-4a$ … $-4b$ ; d) $\frac{a}{-2}$ … $\frac{b}{-2}$.'
    correction: a) $\le$ ; b) $\le$ ; c) $\ge$ ; d) $\ge$ (les deux derniers facteurs sont négatifs).
  - numero: 13
    etoiles: 1
    enonce: 'Range dans l''ordre croissant : $\frac{1}{3}$ ; $0{,}3$ ; $\frac{2}{7}$ ; $0{,}29$.'
    correction: '$\frac{2}{7} \approx 0{,}2857$ et $\frac{1}{3} \approx 0{,}333$ : $\frac{2}{7} < 0{,}29
      < 0{,}3 < \frac{1}{3}$.'
  - numero: 14
    etoiles: 1
    enonce: 'Compare en passant aux carrés : a) $\sqrt{11}$ et $3{,}3$ ; b) $\sqrt{50}$ et $7{,}1$ ; c)
      $\sqrt{2} + 1$ et $2{,}4$.'
    correction: a) $3{,}3^{2} = 10{,}89 < 11$ → $\sqrt{11} > 3{,}3$ ; b) $7{,}1^{2} = 50{,}41 > 50$ →
      $\sqrt{50} < 7{,}1$ ; c) $(\sqrt{2}+1)^{2} = 3 + 2\sqrt{2}$ et $2{,}4^{2} = 5{,}76$ ; $2\sqrt{2}
      > 2{,}76$ car $8 > 1{,}9044$, donc $\sqrt{2} + 1 > 2{,}4$.
  - numero: 15
    etoiles: 1
    enonce: 'Range $x$, $x^{2}$, $\sqrt{x}$ et $\frac{1}{x}$ dans l''ordre croissant : a) pour $x = 4$
      ; b) pour $x = \frac{1}{4}$.'
    correction: 'a) $x > 1$ : $\frac{1}{4} < 2 < 4 < 16$, soit $\frac{1}{x} < \sqrt{x} < x < x^{2}$ ;
      b) $0 < x < 1$ : $\frac{1}{16} < \frac{1}{4} < \frac{1}{2} < 4$, soit $x^{2} < x < \sqrt{x} < \frac{1}{x}$.'
  - numero: 16
    etoiles: 1
    enonce: 'Deux champs de la coopérative de Saponé ont été récoltés : celui de Boukary, $4$ hectares,
      a donné $17$ sacs de sorgho ; celui de Kadidiatou, $5$ hectares, en a donné $21$. Lequel a le meilleur
      rendement ?


      ### Entraînement ★★'
    correction: 'Rendements à l''hectare : $\frac{17}{4}$ et $\frac{21}{5}$ ; $\frac{85 - 84}{20} = \frac{1}{20}
      > 0$ : Boukary, de $\frac{1}{20}$ de sac par hectare. Les deux champs se valent presque.'
  - numero: 17
    etoiles: 2
    enonce: 'Compare en passant aux carrés, attention aux signes : a) $-3$ et $-\pi$ ; b) $-\sqrt{5}$
      et $-2$ ; c) $\sqrt{7}$ et $\frac{8}{3}$.'
    correction: a) $\pi^{2} > 9$ donc $\pi > 3$, d'où $-\pi < -3$ ; b) $5 > 4$ donc $\sqrt{5} > 2$, d'où
      $-\sqrt{5} < -2$ ; c) $\left(\frac{8}{3}\right)^{2} = \frac{64}{9} > 7$, donc $\sqrt{7} < \frac{8}{3}$.
  - numero: 18
    etoiles: 2
    enonce: 'Compare en passant aux inverses : a) $\frac{1}{-3}$ et $\frac{1}{-5}$ ; b) $-\frac{2}{7}$
      et $-\frac{3}{10}$.'
    correction: 'a) $-3 > -5$, même signe, l''inverse renverse : $\frac{1}{-3} < \frac{1}{-5}$. b) Inverses
      : $-\frac{7}{2} < -\frac{10}{3}$, donc $-\frac{2}{7} > -\frac{3}{10}$.'
  - numero: 19
    etoiles: 2
    enonce: Soient $a$ et $b$ tels que $0 < a < b$. Compare $\frac{1}{a}$ et $\frac{1}{b}$. Que devient
      le résultat si $a$ et $b$ sont tous deux strictement négatifs ?
    correction: '$\frac{1}{a} - \frac{1}{b} = \frac{b - a}{ab} > 0$ car $b - a > 0$ et $ab > 0$, donc
      $\frac{1}{a} > \frac{1}{b}$. Si $a < b < 0$, on a encore $ab > 0$ : même conclusion ($a = -3$, $b
      = -2$ donne $-\frac{1}{3} > -\frac{1}{2}$).'
  - numero: 20
    etoiles: 2
    enonce: Le prix du sac de mil à Ouahigouya baisse de $10\,\%$, puis encore de $10\,\%$ le mois suivant.
      Le vendeur affirme que la baisse totale est de $20\,\%$. A-t-il raison ?
    correction: 'Coefficient total $0{,}9 \times 0{,}9 = 0{,}81 > 0{,}80$ : la baisse réelle est de $19\,\%$,
      pas $20\,\%$. Un sac à $10\,000$ FCFA tombe à $8\,100$ FCFA.'
  - numero: 21
    etoiles: 2
    enonce: '(J''écris et j''explique.) Ton camarade écrit : « comme $-5 < 2$, alors $(-5)^{2} < 2^{2}$,
      donc $25 < 4$ ». Repère l''erreur, explique-la en deux phrases, énonce correctement la règle du
      passage au carré.'
    correction: 'Le passage au carré ne conserve l''ordre que pour des nombres positifs ; ici $-5 < 0$.
      Règle correcte : si $0 \le a \le b$, alors $a^{2} \le b^{2}$.'
  - numero: 22
    etoiles: 2
    enonce: (J'écris et j'explique.) Explique pourquoi, pour deux nombres **négatifs**, le plus grand
      en valeur absolue est le plus petit. Illustre sur la droite graduée.
    correction: 'Deux négatifs sont à gauche de $0$ ; le plus grand en valeur absolue est le plus loin
      de $0$, donc le plus à gauche, donc le plus petit. Exemple : $-5 < -2$ alors que $|-5| > |-2|$.'
  - numero: 23
    etoiles: 2
    enonce: 'On sait que $2 < x < 3$. Encadre : a) $x^{2}$ ; b) $\frac{1}{x}$ ; c) $-3x + 1$.'
    correction: a) $4 < x^{2} < 9$ ; b) $\frac{1}{3} < \frac{1}{x} < \frac{1}{2}$ (l'inverse renverse)
      ; c) $-8 < -3x + 1 < -5$ (le facteur $-3$ renverse).
  - numero: 24
    etoiles: 2
    enonce: 'Soit $a > 0$. Compare $\frac{a + 1}{a + 2}$ et $\frac{a}{a + 1}$.


      ### ★★★ Défis de maîtrise'
    correction: $\frac{a+1}{a+2} - \frac{a}{a+1} = \frac{(a+1)^{2} - a(a+2)}{(a+1)(a+2)} = \frac{1}{(a+1)(a+2)}
      > 0$, donc $\frac{a+1}{a+2} > \frac{a}{a+1}$.
  - numero: 25
    etoiles: 3
    enonce: 'Voici la copie de Mariam, qui devait comparer $A = \frac{2x + 1}{x + 3}$ et $2$ pour tout
      réel $x > -3$. Trouve la ligne qui casse, dis quelle règle a été oubliée, refais la comparaison
      et conclus par une phrase avec le bon quantificateur.


      | Ligne | Ce que Mariam a écrit |

      |---|---|

      | 1 | $A - 2 = \frac{2x + 1}{x + 3} - 2 = \frac{2x + 1 - 2}{x + 3} = \frac{2x - 1}{x + 3}$ |

      | 2 | Comme $x > -3$, le dénominateur est positif. |

      | 3 | Le signe de $A - 2$ est celui de $2x - 1$ : il change en $x = \frac{1}{2}$. |

      | 4 | Conclusion : $A$ est tantôt plus petit, tantôt plus grand que $2$. |'
    correction: 'La **ligne 1** est fausse : on ne retranche pas $2$ au seul numérateur. Il faut écrire
      $2 = \frac{2(x+3)}{x+3}$, d''où $A - 2 = \frac{2x + 1 - 2x - 6}{x + 3} = \frac{-5}{x + 3}$. Comme
      $x > -3$, $x + 3 > 0$ et $A - 2 < 0$. Conclusion : **pour tout réel $x > -3$, $\frac{2x+1}{x+3}
      < 2$** ; il n''y a aucun changement de signe, la ligne 4 est donc fausse.'
  - numero: 26
    etoiles: 3
    enonce: On pose $A = \sqrt{2} + \sqrt{7}$, $B = \sqrt{3} + \sqrt{6}$ et $C = 2 + \sqrt{5}$. Range
      ces trois nombres dans l'ordre croissant, en valeurs exactes et sans approximation. Explique ensuite,
      en une phrase, ce qui fait varier ces sommes alors que les nombres sous les racines ont toujours
      la même somme.
    correction: 'On cherche à faire disparaître les racines : les trois nombres étant positifs, on les
      range comme leurs carrés. Avec $2 = \sqrt{4}$ et $(\sqrt{u} + \sqrt{v})^{2} = u + v + 2\sqrt{uv}$
      : $A^{2} = 9 + 2\sqrt{14}$, $B^{2} = 9 + 2\sqrt{18}$, $C^{2} = 9 + 2\sqrt{20}$. Comme $14 < 18 <
      20$, on a $A^{2} < B^{2} < C^{2}$, donc **$A < B < C$**. La somme sous les racines vaut toujours
      $9$ ; c''est le produit $uv$, présent dans $2\sqrt{uv}$, qui change : plus les deux nombres sont
      proches, plus la somme des racines est grande.'
  - numero: 27
    etoiles: 3
    enonce: Un cultivateur de niébé de Léo a récolté $a$ sacs l'an dernier et $b$ sacs cette année, avec
      $0 < a < b$. La coopérative hésite entre la moyenne arithmétique $m = \frac{a + b}{2}$ et la moyenne
      géométrique $g = \sqrt{ab}$. Décide lequel des deux est le plus grand, prouve-le, et précise le
      cas d'égalité.
    correction: 'On étudie le signe de $m - g$ en reconnaissant un carré grâce à $\sqrt{ab} = \sqrt{a}\sqrt{b}$
      :

      $$m - g = \frac{a + b - 2\sqrt{a}\sqrt{b}}{2} = \frac{\left(\sqrt{a} - \sqrt{b}\right)^{2}}{2} \ge
      0.$$

      Donc $m \ge g$ : la moyenne arithmétique est toujours la plus grande. Égalité si et seulement si
      $\sqrt{a} = \sqrt{b}$, c''est-à-dire $a = b$ ; ici $a < b$, donc **$m > g$ strictement**.'
  - numero: 28
    etoiles: 3
    enonce: Un réel $x$ vérifie $x + \frac{1}{x} = \frac{10}{3}$ et $0 < x < 1$. Retrouve $x$. Que devient
      la réponse si la condition $0 < x < 1$ est remplacée par $x > 1$ ?
    correction: 'L''équation donne toutes les valeurs possibles, la condition les trie. Comme $x \neq
      0$, on multiplie par $3x$ : $3x^{2} - 10x + 3 = 0$, $\Delta = 64$, $x = \frac{1}{3}$ ou $x = 3$.
      Avec $0 < x < 1$ : **$x = \frac{1}{3}$**. Avec $x > 1$ : **$x = 3$**. Les deux solutions sont inverses
      l''une de l''autre, car l''équation est inchangée quand on échange $x$ et $\frac{1}{x}$.'
  - numero: 29
    etoiles: 3
    enonce: 'Vrai ou faux ? Démontre ou donne un contre-exemple, et corrige l''énoncé quand il est faux.

      a) Pour tous réels $a$ et $b$, si $a < b$ alors $a^{2} < b^{2}$.

      b) Pour tous réels $a$ et $b$, si $0 < a < b$ alors $\frac{1}{a} > \frac{1}{b}$.

      c) Pour tous réels $a$ et $b$, si $a < b$ alors $a^{3} < b^{3}$.

      d) Pour tous réels $a$, $b$, $c$, $d$, si $a < b$ et $c < d$ alors $ac < bd$.'
    correction: 'Ces règles sont vraies « pour des positifs » : on cherche donc les contre-exemples du
      côté des négatifs. a) **Faux** ($a = -3$, $b = 1$ : $9 > 1$) ; corrigé : si $0 \le a < b$, alors
      $a^{2} < b^{2}$. b) **Vrai** : $\frac{1}{a} - \frac{1}{b} = \frac{b-a}{ab} > 0$. c) **Vrai**, sans
      condition de signe : $b^{3} - a^{3} = (b-a)\left(b^{2} + ab + a^{2}\right)$ et $b^{2} + ab + a^{2}
      = \left(b + \frac{a}{2}\right)^{2} + \frac{3a^{2}}{4} > 0$ dès que $a < b$. d) **Faux** ($a = -2$,
      $b = 1$, $c = -3$, $d = 1$ : $ac = 6 > bd = 1$) ; corrigé : vrai si de plus $a \ge 0$ et $c \ge
      0$.'
  - numero: 30
    etoiles: 3
    enonce: a) Démontre que pour tous réels $a$ et $b$ strictement positifs, $\frac{a}{b} + \frac{b}{a}
      \geq 2$, et précise le cas d'égalité. b) Déduis-en que pour tout réel $x > 0$, $x + \frac{1}{x}
      \geq 2$. c) L'inégalité de b) reste-t-elle vraie pour $x < 0$ ? Justifie.
    correction: 'On ramène au même dénominateur et on lit le signe : le numérateur est un carré parfait.
      a) Pour $a > 0$ et $b > 0$ : $\frac{a}{b} + \frac{b}{a} - 2 = \frac{(a-b)^{2}}{ab} \ge 0$, donc
      $\frac{a}{b} + \frac{b}{a} \ge 2$, avec égalité si et seulement si $a = b$. b) Avec $b = 1$ et $a
      = x > 0$ : $x + \frac{1}{x} \ge 2$, égalité pour $x = 1$. c) **Non** : pour $x = -1$, $x + \frac{1}{x}
      = -2$. Pour $x < 0$, b) appliquée à $-x$ donne $x + \frac{1}{x} \le -2$. Énoncé correct : pour tout
      $x$ non nul, $\left|x + \frac{1}{x}\right| \ge 2$.


      ---'
  fiche_revision:
  - '**Comparer.** $a < b$ équivaut à $b - a > 0$ : tout part du signe de la différence.'
  - '**Quotient.** Pour $a > 0$ et $b > 0$ : $\frac{a}{b} > 1$ équivaut à $a > b$.'
  - '**Carrés.** Pour $a \ge 0$ et $b \ge 0$ : $a < b$ équivaut à $a^{2} < b^{2}$. Faux si un nombre est
    négatif.'
  - '**Inverses.** Deux nombres de même signe : le passage à l''inverse **renverse** l''ordre.'
  - '**Facteur négatif.** Multiplier une inégalité par $c < 0$ **renverse** le sens.'
  - '**Charnière $1$.** Si $0 < x < 1$ : $x^{2} < x < \sqrt{x} < 1 < \frac{1}{x}$. Si $x > 1$ : tout s''inverse.'
  - '**Négatifs.** Le plus grand est le plus proche de $0$.'
  trouve_erreur:
  - faux: $-5 < 2$ donc $(-5)^{2} < 2^{2}$
    correction: 'Carré réservé aux positifs : ici $25 > 4$'
  - faux: $\frac{2x+1}{x+3} - 2 = \frac{2x-1}{x+3}$
    correction: $2 = \frac{2(x+3)}{x+3}$, d'où $\frac{-5}{x+3}$
  - faux: $0 < a < b$ donc $\frac{1}{a} < \frac{1}{b}$
    correction: 'L''inverse renverse : $\frac{1}{a} > \frac{1}{b}$'
  - faux: $\sqrt{x} < x$ pour tout $x > 0$
    correction: 'Faux sur $]0\,;\,1[$ : $\sqrt{0{,}25} = 0{,}5 > 0{,}25$'
  cartographie_lacunes: []
