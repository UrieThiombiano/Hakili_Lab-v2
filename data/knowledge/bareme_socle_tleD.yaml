  objet: Etablir l'hérédité de uₙ = 2 × 3ⁿ - 1 pour uₙ₊₁ = 3uₙ + 2, juger Aminata
  reponse_attendue: uₙ₊₁ = 3(2 × 3ⁿ - 1) + 2 = 2 × 3ⁿ⁺¹ - 1 ; Aminata a tort, il manque l'initialisation
    (et la conclusion)
  solution: 'Barème : 1 pt pour avoir substitué l''hypothèse dans uₙ₊₁ = 3uₙ + 2 et mené le calcul jusqu''à
    2 × 3ⁿ⁺¹ - 1 ; 1 pt pour « Aminata a tort » accompagné du nom de ce qui manque, l''initialisation
    (u₀ = 2 × 3⁰ - 1 = 1). Accepter l''initialisation nommée même non vérifiée ; refuser un simple « elle
    a tort ».'
  si_echoue: 'Structure du raisonnement par récurrence : les trois temps que sont l''initialisation, l''hérédité
    et la conclusion, et le rôle de chacun.'
- code: T3
  partie: B
  format: redige
  bareme: 0.5
  bareme_classeur: 2.0
  competence: T.TRIG
  competence_secondaire: null
  domaine: Trigonometrie
  objet: Calculer sin x avec cos x = 3/5 et x dans ]0 ; π/2[, puis sin(x + π/3)
  reponse_attendue: sin x = 4/5 ; sin(x + π/3) = (4 + 3√3)/10
  solution: 'sin²x = 1 - 9/25 = 16/25 ; x ∈ ]0 ; π/2[ donc sin x > 0. sin(x + π/3) = (4/5)(1/2) + (3/5)(√3/2).
    Barème : 1 pt pour sin x = 4/5 avec le signe justifié par le quadrant (non acquis sans justification
    du signe) ; 1 pt pour la formule d''addition et la valeur exacte (4 + 3√3)/10.'
  si_echoue: Relation fondamentale de la trigonométrie, choix du signe selon le quadrant, formule d'addition
    du sinus. Livret de remédiation 1ère D / Tle D, module 11.
