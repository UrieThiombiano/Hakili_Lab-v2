  objet: Trouver le prix d'achat d'un sac de niébé vendu 21 000 FCFA avec 20 % de bénéfice, juger Salif
  reponse_attendue: prix d'achat 17 500 FCFA ; bénéfice 3 500 FCFA ≠ 4 200 FCFA, l'affirmation de Salif
    est fausse
  solution: 'Prix de vente = 120 % du prix d''achat : 21 000 : 1,2 = 17 500 FCFA ; bénéfice 3 500 FCFA.
    20 % de 21 000 = 4 200 ≠ 3 500. Barème : 1 pt pour le prix d''achat 17 500 FCFA (pourcentage sur le
    prix d''achat) ; 1 pt pour la comparaison 3 500 vs 4 200 et le rejet. 17 500 par essais vérifiés garde
    le premier point.'
  si_echoue: 'Un pourcentage se rapporte toujours à une base : ici le bénéfice se calcule sur le prix
    d''achat, et non sur le prix de vente. Livret de remédiation 3ème, module 7.'
