  fiche_revision:
  - '**Crochet.** Fermé si la borne est prise ($\le$), ouvert sinon ($<$) ; toujours ouvert du côté de
    l''infini.'
  - '**Valeur absolue.** $|x| = x$ si $x \ge 0$, $-x$ sinon ; toujours positive ou nulle.'
  - '**Distance.** $d\left(a\,;\,b\right) = |b - a|$ ; $|x - a|$ = distance de $x$ à $a$.'
  - '**Centre et rayon.** $c = \frac{a + b}{2}$, $r = \frac{b - a}{2}$ ; l''intervalle vaut $|x - c| <
    r$.'
  - '**Un morceau.** $|x - a| \le r \iff x \in [a - r\,;\,a + r]$.'
  - '**Deux morceaux.** $|x - a| \ge r \iff x \in \ ]-\infty\,;\,a - r] \cup [a + r\,;\,+\infty[$.'
  - '**Sans barres.** Une formule par morceau, chacune avec sa condition.'
