  competence_secondaire: null
  domaine: Suites et raisonnement
  objet: Calculer la raison avec u₃ = 7 et u₈ = 22, puis dire si 100 est un terme
  reponse_attendue: r = 3 ; uₙ = 3n - 2 = 100 ⇔ n = 34 entier, 100 = u₃₄ est un terme
  solution: 'u₈ = u₃ + 5r : 22 = 7 + 5r, r = 3. Barème : 1 pt pour r = 3 ; 1 pt pour uₙ = 100 résolu en
    n = 34 et la conclusion appuyée sur le fait que 34 est entier. Erreur propagée : uₙ = 100 correctement
    résolue avec la raison trouvée et nature entière de l''indice discutée.'
