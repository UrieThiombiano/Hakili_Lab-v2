  bareme: 0.75
  bareme_classeur: 3.0
  competence: L.INEQ1
  competence_secondaire: N.INT
  domaine: Calcul litteral et algebre
  objet: Résoudre 300x + 12 000 < 500x et écrire l'ensemble des solutions sous forme d'intervalle
  reponse_attendue: 300x + 12 000 < 500x ⇔ x > 60 ; S = ]60 ; +∞[
  solution: 'Barème (3 pts) : 1 pt pour l''inéquation 300x + 12 000 < 500x posée ; 1 pt pour la résolution
    conduisant à x > 60 ; 1 pt pour l''écriture ]60 ; +∞[, le crochet ouvert en 60 étant exigé. L''inéquation
    résolue dans le mauvais sens (x < 60) ne prend que le premier point.'
  si_echoue: Comparaison de deux tarifs par une inéquation plutôt que par essais successifs.
  probleme_parent: P3
- code: P3.3
  partie: C
  format: redige
  bareme: 0.75
  bareme_classeur: 3.0
  competence: F.LIN
  competence_secondaire: L.INEQ1
  domaine: Fonctions et applications
  objet: Calculer le prix chez X et chez Y pour 75 sacs et conclure sur le transporteur à choisir
  reponse_attendue: f(75) = 34 500 FCFA, g(75) = 37 500 FCFA ; choisir le transporteur X
  solution: 'f(75) = 300 × 75 + 12 000 = 34 500 ; g(75) = 500 × 75 = 37 500. Conclusion : « Pour 75 sacs,
    le transporteur X demande 34 500 FCFA contre 37 500 FCFA chez Y : Nafissatou doit choisir le transporteur
    X. » Barème (3 pts) : 1 pt pour f(75) = 34 500 FCFA ; 1 pt pour g(75) = 37 500 FCFA ; 1 pt pour la
    conclusion désignant X. La conclusion tirée du seul encadrement 75 > 60 sans les deux prix prend le
    point de conclusion, pas les deux points de calcul.'
  si_echoue: Modélisation d'un tarif par une application affine ; comparaison de deux tarifs.
  probleme_parent: P3
