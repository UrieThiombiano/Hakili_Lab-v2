- niveau: 3eme
  module: 9
  module_titre: Quadrilatères, polygones et cercle
  pourquoi: Les caractérisations du parallélogramme servent en 3ème pour les vecteurs ($\overrightarrow{AB}
    = \overrightarrow{DC}$). Le cercle prépare les angles inscrits et la tangente.
  diagnostic:
  - question: Définition du parallélogramme, puis propriété de ses diagonales.
    reponse: côtés opposés parallèles deux à deux ; diagonales de même milieu
  - question: 'Les diagonales d''un quadrilatère se coupent en leur milieu et sont perpendiculaires :
      nature du quadrilatère ?'
    reponse: un losange
  - question: Qu'est-ce qui distingue un rectangle d'un parallélogramme quelconque (par les angles, par
      les diagonales) ?
    reponse: un angle droit (donc quatre) ; diagonales de même longueur
  - question: Dans un cercle de centre $O$ et de rayon $4$ cm, que dire de tout point $M$ du cercle ?
      Et d'une corde ?
    reponse: $OM = 4$ cm ; corde $=$ segment joignant deux points du cercle
  - question: Quel est le centre de symétrie d'un parallélogramme ? Quels sont les axes de symétrie d'un
      losange ?
    reponse: le point d'intersection des diagonales ; les droites portant les diagonales
  lecons:
  - id: 3eme_M09_L1
    numero: '9.1'
    titre: Le parallélogramme
    retenir:
    - diagonales de même **milieu** (ce point est son **centre de symétrie**) ;
    - côtés opposés de **même longueur** ;
    - angles opposés **égaux**, angles consécutifs supplémentaires.
    - diagonales de même milieu ; **ou**
    - côtés opposés parallèles deux à deux ; **ou**
    - deux côtés opposés **parallèles et de même longueur**.
    methode:
      titre: Démontrer qu'un quadrilatère est un parallélogramme
      etapes:
      - 'Inventaire des données : milieux, parallélismes, longueurs.'
      - 'Choisis la **caractérisation** qui colle (souvent : diagonales de même milieu).'
      - 'Rédige : données $\to$ caractérisation citée $\to$ conclusion.'
    exemple_resolu: '$\left[AC\right]$ et $\left[BD\right]$ ont le même milieu $O$. Montre que $ABCD$
      est un parallélogramme, puis que $AB = CD$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Données. | $O$ milieu de $\left[AC\right]$ et de $\left[BD\right]$ |

      | Caractérisation citée. | Un quadrilatère dont les diagonales se coupent en leur milieu est un
      parallélogramme |

      | Conclusion, puis propriété. | $ABCD$ est un parallélogramme, donc $AB = CD$ |

      | **Vérification :** caractérisation d''abord, propriété ensuite. ✓ | |'
    erreurs_frequentes:
    - erreur: conclure « parallélogramme » avec deux côtés parallèles et deux **autres** côtés égaux.
      correction: ce doit être **la même paire** ; sinon, trapèze isocèle.
    - erreur: se tromper de côtés opposés.
      correction: dans $ABCD$, $\left[AB\right]$ est opposé à $\left[DC\right]$.
    declic: null
    figures: []
  - id: 3eme_M09_L2
    numero: '9.2'
    titre: Rectangle, losange, carré, trapèze
    retenir:
    - '**Rectangle** : parallélogramme ayant un angle droit (donc quatre). Diagonales de **même longueur**.
      Axes : les deux médiatrices des côtés.'
    - '**Losange** : parallélogramme ayant deux côtés consécutifs égaux (donc quatre égaux). Diagonales
      **perpendiculaires**. Axes : les droites portant ses diagonales.'
    - '**Carré** : rectangle et losange ; quatre axes de symétrie.'
    methode:
      titre: Reconnaître la nature exacte d'un quadrilatère
      etapes:
      - '**Étage 1.** Établis « parallélogramme » : le plus souvent, diagonales de même milieu.'
      - '**Étage 2.** Ajoute l''ingrédient : diagonales égales (rectangle), perpendiculaires (losange),
        les deux (carré).'
      - Conclus par le nom **le plus précis** (pour un carré, « rectangle » est incomplet).
      - 'Si l''étage 1 est impossible (une seule paire de côtés parallèles) : trapèze.'
    exemple_resolu: 'Les diagonales $\left[MP\right]$ et $\left[NQ\right]$ de $MNPQ$ se coupent en leur
      milieu $I$, et $MP = NQ$. Nature exacte de $MNPQ$ ?


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Étage 1. | $I$ milieu de $\left[MP\right]$ et $\left[NQ\right]$, donc $MNPQ$ est un parallélogramme
      |

      | Étage 2 : la donnée restante. | $MP = NQ$ : diagonales de même longueur |

      | Caractérisation, puis nom précis. | Un parallélogramme à diagonales égales est un rectangle :
      $MNPQ$ est un rectangle |

      | **Vérification :** rien ne dit qu''elles sont perpendiculaires, pas de carré. ✓ | |'
    erreurs_frequentes:
    - erreur: « diagonales égales, donc rectangle ».
      correction: il manque l'étage 1 ; sans milieu commun, ce n'est pas un rectangle.
    - erreur: s'arrêter à « losange » quand les diagonales sont aussi égales.
      correction: c'est alors un carré, nom le plus précis.
    declic: null
    figures:
    - figures/m09_f3.svg
  - id: 3eme_M09_L3
    numero: '9.3'
    titre: Cercle, vocabulaire et polygones réguliers
    retenir:
    - '**Rayon** : segment de $O$ à un point du cercle. **Corde** : segment joignant deux points du cercle.
      **Diamètre** : corde passant par $O$, de longueur $2r$.'
    - '**Arc** : portion de cercle. **Tangente** en $T$ : droite perpendiculaire en $T$ au rayon $\left[OT\right]$.'
    - '**Position de $M$** : $OM = r$ sur le cercle ; $OM < r$ intérieur ; $OM > r$ extérieur.'
    - La médiatrice d'une corde passe par le centre.
    methode:
      titre: Construire un hexagone régulier inscrit
      etapes:
      - Trace le cercle de centre $O$ et de rayon $r$, place $S$ dessus.
      - 'Sans changer l''écartement du compas (il vaut $r$), pique en $S$ : tu obtiens $T$.'
      - 'Recommence de proche en proche jusqu''à revenir en $S$ : six points.'
      - Relie-les. **Contrôle :** si le sixième report ne retombe pas sur $S$, l'écartement a bougé.
    exemple_resolu: 'Hexagone régulier $STUVWZ$ inscrit dans un cercle de centre $O$ et de rayon $4$ cm.
      Donne $\widehat{SOT}$, le côté, le périmètre.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | L''angle au centre partage le tour en six. | $\widehat{SOT} = \frac{360°}{6} = 60°$ |

      | Isocèle en $O$ avec un angle de $60°$. | $SOT$ est équilatéral, donc $ST = OS = 4$ cm |

      | Périmètre : six côtés. | $P = 6 \times 4 = 24$ cm |

      | **Vérification :** $6 \times 60° = 360°$. ✓ | |'
    erreurs_frequentes:
    - erreur: confondre cercle et disque.
      correction: le cercle est le trait, le disque le trait et son intérieur ; si $OM > r$, $M$ n'est
        ni sur l'un ni dans l'autre.
    - erreur: écrire « le diamètre est $r$ ».
      correction: rayon $r$, diamètre $2r$.
    declic: 'Le rayon fabrique des triangles isocèles — Deux rayons $\left[OA\right]$ et $\left[OB\right]$
      donnent $OA = OB$ : le triangle $OAB$ est **isocèle en $O$**. Réflexe : cercle $\to$ triangle isocèle
      $\to$ angles à la base égaux (module 8). #### MÉTHODE : Construire un hexagone régulier inscrit
      1. Trace le cercle de centre $O$ et de rayon $r$, place $S$ dessus. 2. Sans changer l''écartement
      du compas (il vaut $r$), pique en $S$ : tu obtiens $T$. 3. Recommence de proche en proche jusqu''à
      revenir en $S$ : six points. 4. Relie-les. **Contrôle :** si le sixième report ne retombe pas sur
      $S$, l''écartement a bougé.'
    figures:
    - figures/m09_f8.svg
    - figures/m09_f12.svg
  exercices:
  - numero: 1
    etoiles: 1
    enonce: Construis un parallélogramme $ABCD$ tel que $AB = 6$ cm, $AD = 4$ cm et $\widehat{DAB} = 70°$.
      Explique ta construction.
    correction: '$\left[AB\right]$ de $6$ cm, angle de $70°$ en $A$, $AD = 4$ cm, puis $C$ au compas :
      arcs de $6$ cm depuis $D$ et de $4$ cm depuis $B$.'
  - numero: 2
    etoiles: 1
    enonce: $RSTU$ est un parallélogramme de centre $O$, $RS = 7$ cm, $RU = 4{,}5$ cm, $\widehat{SRU}
      = 105°$. Sans construire, donne $TU$ ; $ST$ ; $\widehat{STU}$ ; $\widehat{RST}$ ; ce que représente
      $O$ pour $\left[RT\right]$.
    correction: $TU = 7$ cm ; $ST = 4{,}5$ cm ; $\widehat{STU} = 105°$ (angles opposés) ; $\widehat{RST}
      = 75°$ (consécutifs supplémentaires) ; $O$ est le milieu de $\left[RT\right]$.
  - numero: 3
    etoiles: 1
    enonce: Les segments $\left[EG\right]$ et $\left[FH\right]$ ont le même milieu $K$. Démontre que $EFGH$
      est un parallélogramme.
    correction: 'Les diagonales $\left[EG\right]$ et $\left[FH\right]$ se coupent en leur milieu $K$ :
      $EFGH$ est un parallélogramme.'
  - numero: 4
    etoiles: 1
    enonce: Les diagonales de $MNPQ$ se coupent en leur milieu $I$ et $MP = NQ$. a) Démontre que $MNPQ$
      est un rectangle. b) Si de plus $\left(MP\right) \perp \left(NQ\right)$, quelle est sa nature ?
    correction: 'a) Diagonales de même milieu : parallélogramme ; de plus égales : rectangle. b) Carré.'
  - numero: 5
    etoiles: 1
    enonce: Construis un losange $ABCD$ de diagonales $AC = 8$ cm et $BD = 6$ cm (commence par les diagonales).
      Justifie que c'est bien un losange.
    correction: 'Deux segments perpendiculaires de $8$ et $6$ cm se coupant en leur milieu ; on relie
      les extrémités. Diagonales de même milieu (parallélogramme) et perpendiculaires : losange.'
  - numero: 6
    etoiles: 1
    enonce: 'Vrai ou faux ? Justifie : a) tout carré est un losange ; b) tout losange est un carré ; c)
      un rectangle à diagonales perpendiculaires est un carré ; d) tout trapèze est un parallélogramme.'
    correction: 'a) Vrai (quatre côtés égaux). b) Faux (angles non droits possibles). c) Vrai. d) Faux
      : une seule paire de côtés parallèles suffit au trapèze.'
  - numero: 7
    etoiles: 1
    enonce: Trace un cercle de centre $O$ et de rayon $3{,}5$ cm. Place $A$ sur le cercle, $B$ tel que
      $OB = 2$ cm, $C$ tel que $OC = 5$ cm. Précise la position de chaque point et justifie.
    correction: $A$ sur le cercle ; $B$ intérieur ($2 < 3{,}5$) ; $C$ extérieur ($5 > 3{,}5$).
  - numero: 8
    etoiles: 1
    enonce: $\left[EF\right]$ est un diamètre d'un cercle de centre $O$ et $M$ un point du cercle distinct
      de $E$ et $F$. a) Que valent $OE$, $OF$, $OM$ ? b) Nature des triangles $OEM$ et $OFM$ ? Justifie.
    correction: a) $OE = OF = OM = $ rayon. b) Isocèles en $O$ (deux côtés égaux au rayon).
  - numero: 9
    etoiles: 1
    enonce: Construis le cercle passant par les trois sommets du triangle $ABC$ tel que $AB = 5$ cm, $BC
      = 7$ cm, $AC = 6$ cm.
    correction: Médiatrices de $\left[AB\right]$ et $\left[BC\right]$ ; leur point d'intersection $O$
      est équidistant des trois sommets ; cercle de centre $O$ passant par $A$.
  - numero: 10
    etoiles: 1
    enonce: Construis un parallélogramme $ABCD$ avec $AB = 7$ cm, $BC = 5$ cm, $\widehat{ABC} = 60°$.
      Donne sans mesurer $CD$, $AD$ et les trois autres angles.
    correction: $CD = 7$ cm ; $AD = 5$ cm ; $\widehat{ADC} = 60°$ ; $\widehat{BAD} = \widehat{BCD} = 120°$.
  - numero: 11
    etoiles: 1
    enonce: Construis un parallélogramme $EFGH$ de diagonales $EG = 9$ cm et $FH = 7$ cm se coupant en
      formant un angle de $50°$.
    correction: Deux segments de $9$ et $7$ cm se coupant en leur milieu sous $50°$ ; on relie les quatre
      extrémités (caractérisation des diagonales).
  - numero: 12
    etoiles: 1
    enonce: 'Recopie et complète par oui ou non : diagonales de même milieu / de même longueur / perpendiculaires,
      pour le parallélogramme quelconque, le rectangle, le losange, le carré.'
    correction: 'Même milieu : oui, oui, oui, oui. Même longueur : non, oui, non, oui. Perpendiculaires
      : non, non, oui, oui.'
  - numero: 13
    etoiles: 1
    enonce: 'Vrai ou faux ? Justifie par une propriété ou un contre-exemple : a) un quadrilatère à diagonales
      égales est un rectangle ; b) un parallélogramme ayant un angle droit est un rectangle ; c) un quadrilatère
      à quatre côtés égaux est un carré.'
    correction: 'a) Faux : il manque l''étage parallélogramme (contre-exemple : trapèze isocèle). b) Vrai.
      c) Faux : losange, pas forcément carré.'
  - numero: 14
    etoiles: 1
    enonce: a) Comment nomme-t-on un polygone à 5 côtés ? à 6 ? à 8 ? b) Cite deux polygones réguliers
      que tu connais sous un autre nom (3 côtés, 4 côtés).
    correction: a) Pentagone, hexagone, octogone. b) Triangle équilatéral, carré.
  - numero: 15
    etoiles: 1
    enonce: Construis un hexagone régulier inscrit dans un cercle de rayon $4$ cm. Explique pourquoi son
      côté est égal au rayon.
    correction: 'On reporte six fois le rayon. Chaque triangle centre-deux sommets consécutifs a trois
      côtés égaux au rayon : équilatéral, donc côté $=$ rayon.'
  - numero: 16
    etoiles: 1
    enonce: 'Trace un cercle de centre $O$ de rayon $4$ cm et une corde $\left[AB\right]$ de $6$ cm. a)
      Construis la médiatrice de $\left[AB\right]$ : que remarques-tu ? b) Mesure la distance de $O$ au
      milieu $I$ de $\left[AB\right]$.'
    correction: a) La médiatrice passe par $O$, car $OA = OB$. b) $OI \approx 2{,}6$ cm (valeur exacte
      $\sqrt{7}$ cm par Pythagore).
  - numero: 17
    etoiles: 1
    enonce: Cercle de centre $O$, diamètre $\left[RS\right]$ avec $RS = 8$ cm, $T$ point du cercle tel
      que $RT = 5$ cm. a) Rayon du cercle ? b) Nature du triangle $ORT$ ? Justifie. c) Compare $\widehat{ORT}$
      et $\widehat{OTR}$.
    correction: 'a) $4$ cm. b) $OR = OT = 4$ cm : isocèle en $O$. c) $\widehat{ORT} = \widehat{OTR}$ (angles
      à la base).'
  - numero: 18
    etoiles: 1
    enonce: 'Sur un cercle de centre $O$, $A$ et $B$ sont tels que $\widehat{AOB} = 60°$. Démontre que
      $OAB$ est équilatéral.


      ### Entraînement ★★'
    correction: '$OA = OB$ : isocèle en $O$, donc les angles à la base valent $\frac{180 - 60}{2} = 60°$.
      Trois angles de $60°$ : équilatéral.'
  - numero: 19
    etoiles: 2
    enonce: $ABCD$ est un parallélogramme de centre $O$. Une droite passant par $O$ coupe $\left[AB\right]$
      en $M$ et $\left[CD\right]$ en $N$. Démontre que $O$ est le milieu de $\left[MN\right]$.
    correction: 'La symétrie de centre $O$ laisse $\left(MN\right)$ globalement invariante et envoie $\left[AB\right]$
      sur $\left[CD\right]$ : l''image de $M$ est donc $N$, et $O$ est le milieu de $\left[MN\right]$.'
  - numero: 20
    etoiles: 2
    enonce: $P$, $Q$, $R$ sont non alignés. Explique comment construire $S$ pour que $PQRS$ soit un parallélogramme,
      puis construis ($PQ = 6$ cm, $QR = 4$ cm, $\widehat{PQR} = 80°$). Combien de positions possibles
      si l'ordre des lettres est libre ?
    correction: 'Parallèle à $\left(QR\right)$ par $P$ et parallèle à $\left(PQ\right)$ par $R$ ; ou au
      compas $PS = QR$ et $RS = QP$. En autorisant tous les ordres : **trois** positions.'
  - numero: 21
    etoiles: 2
    enonce: Dans $KLMN$, $\left(KL\right) \parallel \left(NM\right)$ et $KL = NM$. Démontre que $KLMN$
      est un parallélogramme, puis que $KN = LM$.
    correction: 'Deux côtés opposés parallèles et de même longueur : $KLMN$ est un parallélogramme, donc
      $KN = LM$.'
  - numero: 22
    etoiles: 2
    enonce: Construis un rectangle $ABCD$ tel que $AC = 10$ cm et $\widehat{BAC} = 35°$ (commence par
      les diagonales).
    correction: '$\left[AC\right]$ de $10$ cm, milieu $O$ ; demi-droite à $35°$ de $\left(AC\right)$ ;
      $B$ dessus tel que $OB = 5$ cm ; $D$ symétrique de $B$ par rapport à $O$. Diagonales égales et de
      même milieu : rectangle.'
  - numero: 23
    etoiles: 2
    enonce: $MNPQ$ est un losange de centre $O$, $MP = 12$ cm, $NQ = 9$ cm. a) Donne $OM$ et $ON$. b)
      Que vaut $\widehat{MON}$ ? c) Démontre que les quatre triangles découpés par les diagonales sont
      superposables.
    correction: 'a) $OM = 6$ cm, $ON = 4{,}5$ cm. b) $\widehat{MON} = 90°$. c) Les quatre triangles sont
      rectangles en $O$ avec les mêmes côtés de l''angle droit ($6$ et $4{,}5$ cm) : superposables.'
  - numero: 24
    etoiles: 2
    enonce: Un quadrilatère a ses diagonales de même longueur, perpendiculaires et de même milieu. Démontre
      que c'est un carré.
    correction: 'Même milieu : parallélogramme. Égales : rectangle. Perpendiculaires : losange. Rectangle
      et losange : carré.'
  - numero: 25
    etoiles: 2
    enonce: Un jardinier plante un arbre à égale distance de deux puits $A$ et $B$ distants de $10$ m,
      et à exactement $8$ m d'un robinet $R$. Décris l'ensemble des points possibles pour chaque contrainte,
      explique comment trouver l'arbre, et fais la figure à l'échelle $\frac{1}{200}$.
    correction: 'Médiatrice de $\left[AB\right]$ ; cercle de centre $R$ et de rayon $8$ m. L''arbre est
      à leur intersection : deux, une ou aucune position. Échelle : $10$ m $\to 5$ cm, $8$ m $\to 4$ cm.'
  - numero: 26
    etoiles: 2
    enonce: '$ABC$ est un triangle, $O$ le milieu de $\left[BC\right]$, $D$ le symétrique de $A$ par rapport
      à $O$. a) Fais la figure. b) Démontre que $ABDC$ est un parallélogramme. c) Que faut-il supposer
      sur $ABC$ pour que $ABDC$ soit un rectangle ?


      ### ★★★ Défis de maîtrise'
    correction: 'b) Les diagonales $\left[AD\right]$ et $\left[BC\right]$ de $ABDC$ se coupent en leur
      milieu $O$ : parallélogramme. c) Diagonales égales, soit $AD = BC$ : le triangle $ABC$ doit être
      **rectangle en $A$**.'
  - numero: 27
    etoiles: 3
    enonce: $ABCD$ est un quadrilatère quelconque ; $I$, $J$, $K$, $L$ sont les milieux respectifs de
      $\left[AB\right]$, $\left[BC\right]$, $\left[CD\right]$, $\left[DA\right]$. Trace plusieurs quadrilatères
      $ABCD$ différents et observe la nature de $IJKL$. Énonce une conjecture.
    correction: 'On cherche d''abord ce qui ne change pas d''une figure à l''autre. Conjecture : $IJKL$
      est **toujours** un parallélogramme, quel que soit $ABCD$ (même croisé). Démonstration au module
      10, avec la droite des milieux appliquée aux triangles $ABC$ et $ACD$.'
  - numero: 28
    etoiles: 3
    enonce: Démontre que dans un losange $MNPQ$ de centre $O$, la diagonale $\left(MP\right)$ est la bissectrice
      de $\widehat{NMQ}$.
    correction: 'On part de l''isocèle. $MN = MQ$ (côtés du losange) : $MNQ$ est isocèle en $M$. La diagonale
      $\left(MP\right)$ porte un axe de symétrie du losange, qui échange $N$ et $Q$ : elle partage donc
      $\widehat{NMQ}$ en deux angles égaux, c''est la bissectrice.'
  - numero: 29
    etoiles: 3
    enonce: 'a) Un parallélogramme $ABCD$ a pour périmètre $46$ cm et $AB$ dépasse $BC$ de $5$ cm : retrouve
      ses quatre côtés. b) Dans un parallélogramme, un angle mesure $50°$ de moins que son angle consécutif
      : retrouve les quatre angles. c) Un polygone régulier a un angle au centre de $24°$ : combien de
      côtés ? d) Une corde d''un cercle de rayon $6$ cm a pour milieu le centre $O$ : que dire d''elle,
      et combien mesure-t-elle ?'
    correction: 'a) Périmètre $= 2\left(AB + BC\right)$ donc $AB + BC = 23$ ; avec $AB = BC + 5$ : $BC
      = AD = 9$ cm et $AB = CD = 14$ cm. b) Angles consécutifs supplémentaires : $x + \left(x - 50\right)
      = 180$, $x = 115$ ; angles $115°$, $65°$, $115°$, $65°$. c) $360 \div 24 = 15$ côtés. d) Une corde
      de milieu $O$ passe par $O$ : c''est un diamètre, il mesure $12$ cm.'
  - numero: 30
    etoiles: 3
    enonce: Vrai ou faux ? Prouve ou donne un contre-exemple appuyé sur un croquis. a) Un quadrilatère
      à diagonales perpendiculaires est un losange. b) Un parallélogramme ayant deux côtés consécutifs
      de même longueur est un losange. c) Si les diagonales d'un quadrilatère non croisé ont le même milieu
      et la même longueur, c'est un rectangle. d) Dans un cercle, deux cordes de même longueur sont parallèles.
    correction: 'a) **Faux** : deux segments perpendiculaires ne se coupant pas en leur milieu donnent
      un quadrilatère à côtés inégaux ; il manque « parallélogramme ». b) **Vrai** : côtés opposés égaux
      $+$ deux consécutifs égaux $\Rightarrow$ quatre côtés égaux. c) **Vrai** : même milieu (parallélogramme)
      $+$ même longueur (rectangle). d) **Faux** : deux cordes égales issues d''un même point se coupent
      ; la longueur fixe la distance au centre, pas la direction.'
  - numero: 31
    etoiles: 3
    enonce: a) Montre que dans tout parallélogramme, deux angles consécutifs sont supplémentaires. b)
      Déduis-en qu'un parallélogramme ayant un angle droit est un rectangle. c) Montre que dans tout polygone
      régulier à $n$ côtés l'angle au centre vaut $\frac{360°}{n}$, et que les $n$ triangles formés par
      le centre et deux sommets consécutifs sont isocèles et superposables.
    correction: 'a) $\left(AB\right) \parallel \left(DC\right)$ et $\left(AD\right)$ sécante : $\widehat{DAB}$
      et $\widehat{ADC}$ sont intérieurs du même côté, donc supplémentaires. b) Un angle droit force son
      consécutif à $90°$, et les angles opposés sont égaux : quatre angles droits, rectangle. c) Les $n$
      angles au centre sont égaux et partagent le tour : chacun vaut $\frac{360°}{n}$ ; chaque triangle
      a deux côtés égaux au rayon (isocèle) et le même angle au sommet : ils sont superposables.'
  - numero: 32
    etoiles: 3
    enonce: Cercle de centre $O$ et de rayon $5$ cm, $\left[AB\right]$ un diamètre, $C$ un point du cercle
      tel que $\widehat{AOC} = 70°$. a) Nature du triangle $OAC$ ? Calcule ses trois angles. b) Calcule
      $\widehat{BOC}$, puis les trois angles de $OBC$. c) Déduis-en $\widehat{ACB}$ et la nature de $ABC$.
      d) La conclusion du c) changerait-elle si $\widehat{AOC} = 110°$ ?
    correction: 'On exploite le fait que tout triangle formé de deux rayons est isocèle. a) $OA = OC =
      5$ cm : isocèle en $O$ ; $\widehat{OAC} = \widehat{OCA} = \frac{180 - 70}{2} = 55°$. b) $A$, $O$,
      $B$ alignés : $\widehat{BOC} = 110°$ et $\widehat{OBC} = \widehat{OCB} = 35°$. c) $\widehat{ACB}
      = 55° + 35° = 90°$ : $ABC$ est rectangle en $C$. d) Non : avec $110°$, on obtient $35° + 55° = 90°$
      encore. Tout point du cercle voit le diamètre sous un angle droit.'
  - numero: 33
    etoiles: 3
    enonce: 'Talato devait démontrer : « $ABCD$ est un quadrilatère non croisé tel que $AB = CD$ et $\left(AB\right)
      \parallel \left(CD\right)$ ; démontrer que $ABCD$ est un parallélogramme. »


      > Ligne 1 : $AB = CD$, donc les côtés opposés de $ABCD$ ont la même longueur.

      > Ligne 2 : $\left(AB\right) \parallel \left(CD\right)$, donc les côtés opposés sont parallèles
      deux à deux.

      > Ligne 3 : Un quadrilatère dont les côtés opposés sont parallèles deux à deux est un parallélogramme.


      La conclusion est vraie, la démonstration non. Trouve la ligne fautive, explique en une phrase,
      puis rédige une démonstration correcte.'
    correction: 'On regarde ce que chaque ligne a le droit d''affirmer. La **ligne 2** est fautive : la
      donnée ne porte que sur **une** paire de côtés opposés, rien n''est dit de $\left(BC\right)$ et
      $\left(AD\right)$ ; Talato affirme déjà ce qu''il doit démontrer. Rédaction correcte : $\left[AB\right]$
      et $\left[DC\right]$ sont deux côtés opposés parallèles et de même longueur ; or un quadrilatère
      non croisé ayant deux côtés opposés parallèles et de même longueur est un parallélogramme, donc
      $ABCD$ en est un.'
  - numero: 34
    etoiles: 3
    enonce: On place sur un cercle les six sommets d'un hexagone régulier. a) Combien de cordes différentes
      en reliant ces points deux à deux ? b) Combien sont des diagonales de l'hexagone ? c) Combien de
      triangles en choisissant trois points ? d) Combien sont équilatéraux ? Justifie sans dessiner les
      figures.
    correction: 'On compte les choix, puis on corrige les doubles comptages. a) $6 \times 5 = 30$ liaisons,
      chaque corde comptée deux fois : $15$ cordes. b) $15 - 6$ côtés $= 9$ diagonales. c) $6 \times 5
      \times 4 = 120$ choix ordonnés, chaque triangle compté $6$ fois : $20$ triangles. d) Équilatéral
      $=$ un sommet sur deux : $\left\{1\,;\,3\,;\,5\right\}$ et $\left\{2\,;\,4\,;\,6\right\}$, soit
      **$2$** triangles.'
  fiche_revision:
  - '**Parallélogramme.** Côtés opposés parallèles ; diagonales de même milieu (centre de symétrie), côtés
    opposés égaux, angles opposés égaux. Caractérisation reine : diagonales de même milieu.'
  - '**Deux étages.** Parallélogramme $+$ diagonales égales $=$ rectangle ; $+$ perpendiculaires $=$ losange
    ; les deux $=$ carré.'
  - '**Trapèze.** Deux côtés parallèles : pas forcément un parallélogramme.'
  - '**Cercle.** $M$ sur le cercle $\iff OM = r$. Diamètre $= 2r$, plus longue corde. Médiatrice d''une
    corde : passe par le centre.'
  - '**Deux rayons $=$ triangle isocèle en $O$.**'
  - '**Polygone régulier à $n$ côtés.** Côtés et angles égaux, sommets sur un cercle, angle au centre
    $\frac{360°}{n}$.'
  - '**Sens du raisonnement.** Propriété $\ne$ caractérisation. Cite toujours dans le bon sens.'
  trouve_erreur:
  - faux: « Les diagonales sont égales, donc $ABCD$ est un rectangle. »
    correction: 'Il manque l''étage parallélogramme : il faut **aussi** des diagonales de même milieu.'
  - faux: « $ABCD$ est un parallélogramme, donc $AB = BC$. »
    correction: 'Ce sont les côtés **opposés** : $AB = DC$ et $BC = AD$.'
  - faux: « Tout losange est un carré. »
    correction: 'Faux : un losange peut avoir des angles non droits. L''inverse est vrai.'
  - faux: '« $OM = 5 > 4$ : $M$ est sur le disque. »'
    correction: '$OM > r$ : $M$ est à l''**extérieur** du disque de rayon $4$.'
  cartographie_lacunes:
  - lacune: Propriétés du parallélogramme et vocabulaire du cercle oubliés
    bloque_en: ch. 2, 12, 16, 18
  source_path: remediation\3eme\modules_c\M09.md
- niveau: 3eme
  module: 10
  module_titre: Théorème des milieux et projections
  pourquoi: 'Le théorème des milieux et la projection deviennent en 3ème le rapport de projection puis
    le théorème de Thalès. Tu connais ces règles : c''est le tri entre le direct et la réciproque qui
    dérape.'
  diagnostic:
  - question: Dans un triangle $ABC$, $I$ est le milieu de $\left[AB\right]$ et $J$ le milieu de $\left[AC\right]$.
      Énonce les deux conclusions du théorème des milieux.
    reponse: $\left(IJ\right) \parallel \left(BC\right)$ et $IJ = \frac{BC}{2}$
  - question: 'Même figure avec $BC = 9$ cm : que vaut $IJ$ ?'
    reponse: $4{,}5$ cm
  - question: Dans un triangle $RST$, la parallèle à $\left(ST\right)$ menée par le milieu $M$ de $\left[RS\right]$
      coupe $\left[RT\right]$ en $N$. Que représente $N$ pour $\left[RT\right]$ ?
    reponse: le milieu de $\left[RT\right]$ (réciproque)
  - question: Qu'est-ce que le projeté d'un point $M$ sur une droite $\left(d\right)$ parallèlement à
      une droite $\left(\delta\right)$ ?
    reponse: le point d'intersection de $\left(d\right)$ avec la parallèle à $\left(\delta\right)$ passant
      par $M$
  - question: Qu'est-ce que le projeté orthogonal d'un point sur une droite ?
    reponse: le pied de la perpendiculaire à la droite menée depuis le point
  lecons:
  - id: 3eme_M10_L1
    numero: '10.1'
    titre: La droite des milieux dans le triangle
    retenir:
    - elle est **parallèle** au troisième côté ;
    - 'le segment des milieux vaut la **moitié** du troisième côté :'
    - 'L''égalité se lit dans les deux sens : $BC = 2 \times IJ$.'
    methode:
      titre: Faire parler des milieux dans une figure
      etapes:
      - '**Code** sur la figure les milieux donnés.'
      - Cherche le **triangle** dont deux côtés portent ces milieux.
      - Deux milieux $\to$ **direct** (parallèle $+$ moitié). Un milieu $+$ une parallèle $\to$ **réciproque**
        (nouveau milieu).
      - 'Rédige : données, théorème cité, conclusion. **Contrôle :** le segment des milieux est le plus
        court.'
    exemple_resolu: '$ABC$ est un triangle, $BC = 9$ cm ; $I$, $J$, $K$ sont les milieux de $\left[AB\right]$,
      $\left[AC\right]$, $\left[BC\right]$. Calcule $IJ$ et démontre que $BIJK$ est un parallélogramme.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Dans $ABC$, $I$ et $J$ sont deux milieux. | $\left(IJ\right) \parallel \left(BC\right)$ et $IJ
      = \frac{9}{2} = 4{,}5$ cm |

      | Dans $ABC$, $J$ et $K$ sont deux milieux. | $\left(JK\right) \parallel \left(AB\right)$, donc
      $\left(JK\right) \parallel \left(BI\right)$ |

      | $K$ est sur $\left(BC\right)$, donc $\left(IJ\right) \parallel \left(BK\right)$. | Côtés opposés
      parallèles : $BIJK$ est un parallélogramme |

      | **Vérification :** $IJ = 4{,}5 = BK$. ✓ | |'
    erreurs_frequentes:
    - erreur: citer le direct alors qu'un seul point est un milieu.
      correction: le direct exige **deux milieux** ; un milieu $+$ un parallélisme, c'est la réciproque.
    - erreur: écrire $BC = \frac{IJ}{2}$.
      correction: $IJ = \frac{BC}{2}$, donc $BC = 2 \times IJ$.
    declic: 'Du théorème des milieux à Thalès — Avec $I$ et $J$ milieux : $\frac{AI}{AB} = \frac{AJ}{AC}
      = \frac{IJ}{BC} = \frac{1}{2}$. Thalès dira la même chose avec un rapport quelconque. Le théorème
      des milieux, c''est **Thalès au rapport $\frac{1}{2}$**.'
    figures:
    - figures/m10_f2.svg
  - id: 3eme_M10_L2
    numero: '10.2'
    titre: La droite des milieux dans le trapèze
    retenir:
    - 'Trapèze de bases $\left[AB\right]$ et $\left[DC\right]$ : le segment joignant les milieux des **côtés
      non parallèles** est parallèle aux deux bases et vaut la **demi-somme des bases** :'
    - '**Réciproque.** La droite passant par le milieu d''un côté non parallèle et parallèle aux bases
      coupe l''autre côté non parallèle en son milieu.'
    - '**Contrôle :** le résultat tombe entre la petite et la grande base.'
    methode:
      titre: Travailler dans un trapèze
      etapes:
      - 'Repère les **deux bases** : les milieux sont sur les deux autres côtés.'
      - 'Deux bases connues : $MN = \frac{b + B}{2}$.'
      - '$MN$ et une base connues : la base manquante vaut $2 \times MN$ moins la base connue.'
      - Pour une démonstration, trace une **diagonale** (deux triangles). **Contrôle :** réponse entre
        les deux bases.
    exemple_resolu: '$ABCD$ est un trapèze de bases $AB = 5$ cm et $DC = 9$ cm ; $M$, $N$ milieux de $\left[AD\right]$,
      $\left[BC\right]$. Calcule $MN$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | On trace la diagonale $\left[AC\right]$, qui coupe $\left[MN\right]$ en $P$. Dans $ACD$ : réciproque
      puis direct. | $P$ milieu de $\left[AC\right]$ et $MP = \frac{DC}{2} = 4{,}5$ cm |

      | Dans $ABC$ : $P$ et $N$ sont deux milieux. | $PN = \frac{AB}{2} = 2{,}5$ cm |

      | On additionne. | $MN = 4{,}5 + 2{,}5 = 7$ cm |

      | **Vérification :** $\frac{5 + 9}{2} = 7$. ✓ | |'
    erreurs_frequentes:
    - erreur: prendre la moitié de la grande base.
      correction: c'est la **demi-somme des deux bases**.
    - erreur: placer les milieux sur les bases.
      correction: ils se prennent sur les **côtés non parallèles**.
    declic: null
    figures:
    - figures/m10_f7.svg
  - id: 3eme_M10_L3
    numero: '10.3'
    titre: 'Projections : parallèle et orthogonale'
    retenir:
    - '$\left(d\right)$ et $\left(\delta\right)$ **sécantes** : le **projeté** de $M$ sur $\left(d\right)$
      **parallèlement à $\left(\delta\right)$** est le point $m$ où la parallèle à $\left(\delta\right)$
      menée par $M$ coupe $\left(d\right)$.'
    - Un point de $\left(d\right)$ est son propre projeté.
    - '**Conservé :** l''**alignement** et le **milieu**. Si $I$ est le milieu de $\left[AB\right]$, $i$
      est le milieu de $\left[ab\right]$.'
    - '**Non conservé :** les **longueurs**. En général $ab \ne AB$.'
    methode:
      titre: Construire un projeté
      etapes:
      - Identifie la droite **sur laquelle** on projette et la **direction** de projection.
      - Par le point, trace la parallèle à $\left(\delta\right)$, ou la perpendiculaire à $\left(d\right)$
        pour l'orthogonale.
      - 'Marque l''intersection avec $\left(d\right)$ : c''est le projeté.'
      - '**Contrôle :** un point de $\left(d\right)$ se projette sur lui-même.'
    exemple_resolu: 'Le forage $M$ d''un village est à $60$ m d''une piste rectiligne $\left(d\right)$
      ; $H$ est son projeté orthogonal et $P$ un point de la piste à $80$ m de $H$. Calcule $MP$.


      | Ce qu''on fait | Ce qu''on écrit |

      |---|---|

      | Être à $60$ m de la piste, c''est être à $60$ m du projeté orthogonal. | $MH = 60$ m ; $MHP$ rectangle
      en $H$ |

      | Pythagore, hypoténuse $\left[MP\right]$. | $MP^{2} = 60^{2} + 80^{2} = 10\,000$ |

      | Racine carrée. | $MP = 100$ m |

      | **Vérification :** $100 > 60$ : le plus proche est bien $H$. ✓ | |'
    erreurs_frequentes:
    - erreur: prendre $MP$ pour la distance de $M$ à $\left(d\right)$, avec $P$ au hasard.
      correction: la distance est $MH$, avec $H$ le projeté **orthogonal**.
    - erreur: conserver les longueurs dans une projection.
      correction: seuls l'alignement, le milieu et les rapports sont conservés.
    declic: null
    figures:
    - figures/m10_f10.svg
