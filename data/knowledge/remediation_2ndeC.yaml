      : $DI^{2} = 9 + 81 = 90$.'
  - numero: 20
    etoiles: 2
    enonce: Repère orthonormal, $A\left(1 ; 1\right)$, $B\left(4 ; 5\right)$ et $C\left(8 ; 2\right)$.
      Calcule $AB^{2}$, $BC^{2}$ et $AC^{2}$, puis donne la nature exacte du triangle $ABC$.
    correction: '$AB^{2} = 25$, $BC^{2} = 25$, $AC^{2} = 50$. Donc $AB = BC$ et $AB^{2} + BC^{2} = AC^{2}$
      : le triangle est rectangle et isocèle en $B$.'
  - numero: 21
