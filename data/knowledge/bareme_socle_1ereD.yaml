  reponse_attendue: BM→ = -2 BC→ ; BM→ et BC→ colinéaires de même origine B, donc B, C, M alignés
  solution: 'BM = BA + AM = -AB + 3AB - 2AC = 2AB - 2AC = 2CB = -2BC (vecteurs). Barème : 1 pt pour la
    relation de Chasles conduisant à BM = -2BC ; 1 pt pour la conclusion d''alignement fondée sur la colinéarité
    de deux vecteurs de même origine B. Un coefficient erroné mais une colinéarité correctement invoquée
    garde le second point.'
